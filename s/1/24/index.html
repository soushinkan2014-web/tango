</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第24回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.114〜123　No.691〜720</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../24.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="691"><div class="top"><span class="no">691</span><span class="en">tasty</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">おいしい</div><div class="ex">This curry is very <b>tasty</b>.</div><div class="xj">このカレーはとてもおいしいです。</div></button></li><li><button class="w" data-no="692"><div class="top"><span class="no">692</span><span class="en">at one time</span><span class="ps">熟</span></div><div class="ja">一度に；かつては</div><div class="ex">He ate three hamburgers <b>at one time</b>.</div><div class="xj">彼は一度にハンバーガーを3個食べました。</div></button></li><li><button class="w" data-no="693"><div class="top"><span class="no">693</span><span class="en">a.m.</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">午前</div><div class="ex">The shop opens at nine <b>a.m.</b></div><div class="xj">その店は午前9時に開きます。</div></button></li><li><button class="w" data-no="694"><div class="top"><span class="no">694</span><span class="en">all day</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">一日中</div><div class="ex">We played soccer <b>all day</b>.</div><div class="xj">私たちは一日中サッカーをしました。</div></button></li><li><button class="w" data-no="695"><div class="top"><span class="no">695</span><span class="en">experience</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">経験；体験</div><div class="ex">This trip is a great <b>experience</b> for me.</div><div class="xj">この旅行は私にとってすばらしい経験です。</div></button></li><li><button class="w" data-no="696"><div class="top"><span class="no">696</span><span class="en">go down</span><span class="ps">熟</span></div><div class="ja">下りる；（太陽が）沈む</div><div class="ex">Let’s <b>go down</b> the stairs.</div><div class="xj">階段を下りよう。</div></button></li><li><button class="w" data-no="697"><div class="top"><span class="no">697</span><span class="en">June</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">6月</div><div class="ex">We have a lot of rain in <b>June</b>.</div><div class="xj">6月は雨が多いです。</div></button></li><li><button class="w" data-no="698"><div class="top"><span class="no">698</span><span class="en">other</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">ほかの；別の</div><div class="ex">Do you have any <b>other</b> questions?</div><div class="xj">何かほかの質問はありますか。</div></button></li><li><button class="w" data-no="699"><div class="top"><span class="no">699</span><span class="en">outside</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">外で；外は</div><div class="ex">It’s cold <b>outside</b>.</div><div class="xj">外は寒いです。</div></button></li><li><button class="w" data-no="700"><div class="top"><span class="no">700</span><span class="en">p.m.</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">午後</div><div class="ex">I came home at five <b>p.m.</b></div><div class="xj">私は午後5時に帰宅しました。</div></button></li><li><button class="w" data-no="701"><div class="top"><span class="no">701</span><span class="en">reindeer</span><span class="ps">名</span></div><div class="ja">トナカイ</div><div class="ex">We saw <b>reindeer</b> in Finland.</div><div class="xj">私たちはフィンランドでトナカイを見ました。</div></button></li><li><button class="w" data-no="702"><div class="top"><span class="no">702</span><span class="en">rise</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（太陽などが）昇る；上がる</div><div class="ex">The sun <b>rises</b> in the east.</div><div class="xj">太陽は東から昇ります。</div></button></li><li><button class="w" data-no="703"><div class="top"><span class="no">703</span><span class="en">road</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">道路；道</div><div class="ex">This <b>road</b> goes to the station.</div><div class="xj">この道路は駅に通じています。</div></button></li><li><button class="w" data-no="704"><div class="top"><span class="no">704</span><span class="en">set</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（太陽などが）沈む；置く；セットする</div><div class="ex">In winter, the sun <b>sets</b> early.</div><div class="xj">冬は日が早く沈みます。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">sun</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">太陽；日光</div><div class="ex">We can’t see the <b>sun</b> today.</div><div class="xj">今日は太陽が見えません。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">until</span><span class="ps">前</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～まで（ずっと）</div><div class="ex">I studied <b>until</b> ten last night.</div><div class="xj">私は昨夜10時まで勉強しました。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">grandparent</span><span class="ps">名</span></div><div class="ja">祖父母（の1人）</div><div class="ex">My <b>grandparents</b> live in Kagoshima.</div><div class="xj">私の祖父母は鹿児島に住んでいます。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">ran</span><span class="ps">動</span></div><div class="ja">走った（run の過去形）</div><div class="ex">Ken <b>ran</b> to the station.</div><div class="xj">ケンは駅まで走りました。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">slept</span><span class="ps">動</span></div><div class="ja">眠った（sleep の過去形）</div><div class="ex">I <b>slept</b> for ten hours last night.</div><div class="xj">私は昨夜10時間眠りました。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">stop</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">止まる；止める；やめる</div><div class="ex">The bus <b>stopped</b> near my house.</div><div class="xj">バスは私の家の近くで止まりました。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">won</span><span class="ps">動</span></div><div class="ja">勝った（win の過去形）</div><div class="ex">Our team <b>won</b> the game.</div><div class="xj">私たちのチームはその試合に勝ちました。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">vacation</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">休暇；休み</div><div class="ex">Summer <b>vacation</b> starts next week.</div><div class="xj">夏休みは来週始まります。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">give</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">与える；あげる</div><div class="ex">Emi <b>gave</b> flowers to her mother.</div><div class="xj">エミはお母さんに花をあげました。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">many kinds of ～</span><span class="ps">熟</span></div><div class="ja">たくさんの種類の～</div><div class="ex">This shop has <b>many kinds of</b> bread.</div><div class="xj">この店にはたくさんの種類のパンがあります。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">photographer</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">写真家；カメラマン</div><div class="ex">The <b>photographer</b> took pictures of animals.</div><div class="xj">その写真家は動物の写真をとりました。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">shrimp</span><span class="ps">名</span></div><div class="ja">エビ</div><div class="ex">I ate <b>shrimp</b> tempura.</div><div class="xj">私はエビの天ぷらを食べました。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">wallet</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">財布</div><div class="ex">Lisa has a red <b>wallet</b>.</div><div class="xj">リサは赤い財布を持っています。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">world</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">世界</div><div class="ex">There are many countries in the <b>world</b>.</div><div class="xj">世界にはたくさんの国があります。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">around the world</span><span class="ps">熟</span></div><div class="ja">世界中で；世界中の</div><div class="ex">People <b>around the world</b> love soccer.</div><div class="xj">世界中の人々がサッカーを愛しています。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">grandma</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">おばあちゃん</div><div class="ex">My <b>grandma</b> makes delicious cookies.</div><div class="xj">私のおばあちゃんはおいしいクッキーを作ります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a
