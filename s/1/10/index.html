する</div><div class="ex">We <b>perform</b> a play at the school festival.</div><div class="xj">私たちは文化祭で劇を演じます。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">show</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ショー；見せ物</div><div class="ex">Let’s see the magic <b>show</b>.</div><div class="xj">マジックショーを見よう。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">so</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">とても；そのように</div><div class="ex">I’m <b>so</b> happy.</div><div class="xj">私はとてもうれしいです。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">talent</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">才能</div><div class="ex">You have a <b>talent</b> for music.</div><div class="xj">あなたには音楽の才能がありますね。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">wonderful</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">すばらしい</div><div class="ex">We have a <b>wonderful</b> teacher.</div><div class="xj">私たちにはすばらしい先生がいます。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">internet</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">インターネット</div><div class="ex">I use the <b>internet</b> at home.</div><div class="xj">私は家でインターネットを使います。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">often</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">よく；しばしば</div><div class="ex">We <b>often</b> play soccer after school.</div><div class="xj">私たちは放課後によくサッカーをします。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">our</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私たちの</div><div class="ex">This is <b>our</b> classroom.</div><div class="xj">これは私たちの教室です。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">carry</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">運ぶ；持ち歩く</div><div class="ex">Can you <b>carry</b> my bag?</div><div class="xj">私のかばんを運んでくれますか。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">find</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">見つける</div><div class="ex">I can’t <b>find</b> my key.</div><div class="xj">私はかぎを見つけられません。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">fly</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">飛ぶ；飛ばす</div><div class="ex">Penguins can’t <b>fly</b>.</div><div class="xj">ペンギンは飛べません。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">heavy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">重い</div><div class="ex">I can’t carry this <b>heavy</b> box.</div><div class="xj">私はこの重い箱を運べません。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">help</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">手伝う；助ける</div><div class="ex">Can you <b>help</b> me?</div><div class="xj">私を手伝ってくれますか。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">people</span><span class="ps">名</span><span clas
