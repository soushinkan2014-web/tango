<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中1 英単語 第3回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第3回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.14〜16　No.61〜90</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">shoot</span><span class="ps">動</span></div><div class="ja">シュートする；撃つ</div><div class="ex"><b>Shoot</b> the ball, Ken!</div><div class="xj">ケン、ボールをシュートして！</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">sport</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">スポーツ；運動</div><div class="ex">I like winter <b>sports</b>.</div><div class="xj">私は冬のスポーツが好きです。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">team</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">チーム</div><div class="ex">We are a good <b>team</b>.</div><div class="xj">私たちはよいチームです。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">the</span><span class="ps">冠</span><span class=star>★</span></div><div class="ja">その；あの</div><div class="ex">I want <b>the</b> blue cap.</div><div class="xj">私はその青いぼうしがほしいです。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">together</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">いっしょに</div><div class="ex">Let’s study <b>together</b>.</div><div class="xj">いっしょに勉強しよう。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">trumpet</span><span class="ps">名</span></div><div class="ja">トランペット</div><div class="ex">I can play the <b>trumpet</b>.</div><div class="xj">私はトランペットを吹くことができます。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">try</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">やってみる；試す</div><div class="ex">Let’s <b>try</b> again.</div><div class="xj">もう一度やってみよう。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">very</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">とても</div><div class="ex">I’m <b>very</b> happy.</div><div class="xj">私はとてもうれしいです。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">we</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私たちは；私たちが</div><div class="ex"><b>We</b> are classmates.</div><div class="xj">私たちはクラスメイトです。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">Wednesday</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">水曜日</div><div class="ex">I have a piano lesson on <b>Wednesdays</b>.</div><div class="xj">私は毎週水曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">art</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">美術；芸術</div><div class="ex">I’m in the <b>art</b> club.</div><div class="xj">私は美術部に入っています。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">badminton</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">バドミントン</div><div class="ex">I play <b>badminton</b> with my sister.</div><div class="xj">私は妹とバドミントンをします。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">baseball</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">野球</div><div class="ex">We are on the <b>baseball</b> team.</div><div class="xj">私たちは野球部に入っています。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">computer</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">コンピューター</div><div class="ex">I have a <b>computer</b> in my room.</div><div class="xj">私の部屋にはコンピューターがあります。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">high</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">高い；高く</div><div class="ex">I want to climb that <b>high</b> mountain.</div><div class="xj">私はあの高い山に登りたいです。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">join</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">参加する；加わる；（部に）入る</div><div class="ex">Can I <b>join</b> the game?</div><div class="xj">その試合に参加してもいいですか。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">jump</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">跳ぶ；ジャンプする</div><div class="ex">Can you <b>jump</b> high?</div><div class="xj">あなたは高く跳べますか。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">my</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私の</div><div class="ex">Please come to <b>my</b> house.</div><div class="xj">私の家に来てください。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">name</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">名前</div><div class="ex">What’s your <b>name</b>?</div><div class="xj">あなたの名前は何ですか。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">table tennis</span><span class="ps">熟</span></div><div class="ja">卓球</div><div class="ex">Can you play <b>table tennis</b>?</div><div class="xj">あなたは卓球ができますか。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">angel</span><span class="ps">名</span></div><div class="ja">天使</div><div class="ex">I like this <b>angel</b> card.</div><div class="xj">私はこの天使のカードが好きです。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">apple</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">りんご</div><div class="ex">I eat an <b>apple</b> for breakfast.</div><div class="xj">私は朝食にりんごを食べます。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">bear</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">クマ</div><div class="ex">I can see a <b>bear</b> in the picture.</div><div class="xj">絵の中にクマが見えます。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">box</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">箱</div><div class="ex">What’s in the <b>box</b>?</div><div class="xj">箱の中には何が入っていますか。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">cat</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ネコ</div><div class="ex">I have a black <b>cat</b>.</div><div class="xj">私は黒いネコを飼っています。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">cider</span><span class="ps">名</span></div><div class="ja">サイダー</div><div class="ex">Do you like <b>cider</b>?</div><div class="xj">あなたはサイダーが好きですか。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">doctor</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">医者</div><div class="ex">Are you a <b>doctor</b>?</div><div class="xj">あなたは医者ですか。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">egg</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">卵</div><div class="ex">I need three <b>eggs</b> for this cake.</div><div class="xj">このケーキには卵が3個必要です。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">evening</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">夕方；晩</div><div class="ex">I practice the guitar in the <b>evening</b>.</div><div class="xj">私は夕方にギターを練習します。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">giant</span><span class="ps">名</span></div><div class="ja">巨人</div><div class="ex">I like stories about <b>giants</b>.</div><div class="xj">私は巨人の物語が好きです。</div></button></li></ol><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"61": 4.24, "62": 17.38, "63": 30.27, "64": 42.48, "65": 54.76, "66": 66.93, "67": 79.16, "68": 91.88, "69": 104.04, "70": 117.41, "71": 130.89, "72": 143.7, "73": 157.09, "74": 169.93, "75": 182.67, "76": 195.94, "77": 208.65, "78": 221.13, "79": 233.51, "80": 245.19, "81": 258.44, "82": 270.91, "83": 283.84, "84": 296.54, "85": 308.65, "86": 320.94, "87": 332.98, "88": 344.86, "89": 357.91, "90": 371.3};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
