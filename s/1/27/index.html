</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第27回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.131〜141　No.781〜810</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../27.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="781"><div class="top"><span class="no">781</span><span class="en">raccoon dog</span><span class="ps">名</span></div><div class="ja">タヌキ</div><div class="ex">A <b>raccoon dog</b> came to our garden last night.</div><div class="xj">昨夜、タヌキがうちの庭に来ました。</div></button></li><li><button class="w" data-no="782"><div class="top"><span class="no">782</span><span class="en">weren’t</span><span class="ps">動</span></div><div class="ja">（～で）なかった；（～に）いなかった（were not の短縮形）</div><div class="ex">We <b>weren’t</b> at home yesterday.</div><div class="xj">私たちは昨日、家にいませんでした。</div></button></li><li><button class="w" data-no="783"><div class="top"><span class="no">783</span><span class="en">creative</span><span class="ps">形</span></div><div class="ja">創造力のある；独創的な</div><div class="ex">Your idea is very <b>creative</b>.</div><div class="xj">あなたの考えはとても独創的です。</div></button></li><li><button class="w" data-no="784"><div class="top"><span class="no">784</span><span class="en">first</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">最初の；初めての</div><div class="ex">This is my <b>first</b> trip to Kyoto.</div><div class="xj">これは私の初めての京都旅行です。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">hobby</span><span class="ps">名</span></div><div class="ja">趣味</div><div class="ex">Ken has many <b>hobbies</b>.</div><div class="xj">ケンには趣味がたくさんあります。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">nervous</span><span class="ps">形</span></div><div class="ja">緊張して；不安で</div><div class="ex">I was very <b>nervous</b> before the game.</div><div class="xj">私は試合の前、とても緊張していました。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">performance</span><span class="ps">名</span></div><div class="ja">演奏；演技；公演</div><div class="ex">Your piano <b>performance</b> was great.</div><div class="xj">あなたのピアノの演奏はすばらしかったです。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">shot</span><span class="ps">名</span></div><div class="ja">写真（の1枚）；（スポーツの）シュート</div><div class="ex">This is a nice <b>shot</b> of Mt. Fuji.</div><div class="xj">これは富士山のいい写真です。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">card</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">カード；はがき</div><div class="ex">I wrote a birthday <b>card</b> for Mom.</div><div class="xj">私はお母さんに誕生日カードを書きました。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">dear</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">親愛なる（手紙の書き出し）；大切な</div><div class="ex"><b>Dear</b> Tom, how are you?</div><div class="xj">親愛なるトムへ、元気ですか。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">February</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">2月</div><div class="ex">It is very cold in <b>February</b>.</div><div class="xj">2月はとても寒いです。</div></button></li><li><button class="w" data-no="792"><div class="top"><span class="no">792</span><span class="en">miss</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（いなくて）さびしく思う；乗り遅れる</div><div class="ex">I <b>miss</b> you very much.</div><div class="xj">あなたがいなくてとてもさびしいです。</div></button></li><li><button class="w" data-no="793"><div class="top"><span class="no">793</span><span class="en">street</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">通り；道路</div><div class="ex">There are many shops on this <b>street</b>.</div><div class="xj">この通りにはたくさんの店があります。</div></button></li><li><button class="w" data-no="794"><div class="top"><span class="no">794</span><span class="en">view</span><span class="ps">名</span></div><div class="ja">眺め；景色</div><div class="ex">The <b>view</b> from my room is beautiful.</div><div class="xj">私の部屋からの眺めはきれいです。</div></button></li><li><button class="w" data-no="795"><div class="top"><span class="no">795</span><span class="en">wish</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">願い；願いごと</div><div class="ex">Make a <b>wish</b>, Emi!</div><div class="xj">エミ、願いごとをして！</div></button></li><li><button class="w" data-no="796"><div class="top"><span class="no">796</span><span class="en">Best wishes,</span><span class="ps">熟</span></div><div class="ja">それではお元気で（手紙の結び）</div><div class="ex">Please write back. <b>Best wishes,</b> Lisa</div><div class="xj">お返事を書いてね。それではお元気で。リサより</div></button></li><li><button class="w" data-no="797"><div class="top"><span class="no">797</span><span class="en">April</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">4月</div><div class="ex">It is warm in <b>April</b>.</div><div class="xj">4月は暖かいです。</div></button></li><li><button class="w" data-no="798"><div class="top"><span class="no">798</span><span class="en">August</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">8月</div><div class="ex">We went to the sea in <b>August</b>.</div><div class="xj">私たちは8月に海へ行きました。</div></button></li><li><button class="w" data-no="799"><div class="top"><span class="no">799</span><span class="en">autumn</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">秋</div><div class="ex">Apples are delicious in <b>autumn</b>.</div><div class="xj">秋はりんごがおいしいです。</div></button></li><li><button class="w" data-no="800"><div class="top"><span class="no">800</span><span class="en">chilly</span><span class="ps">形</span></div><div class="ja">肌寒い；ひんやりした</div><div class="ex">It is <b>chilly</b> this morning.</div><div class="xj">今朝は肌寒いです。</div></button></li><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">cloudy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">くもりの</div><div class="ex">Was it <b>cloudy</b> in Osaka yesterday?</div><div class="xj">昨日、大阪はくもりでしたか。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">date</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">日付</div><div class="ex">Write the <b>date</b> on your paper.</div><div class="xj">紙に日付を書いてください。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">December</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">12月</div><div class="ex">Christmas is in <b>December</b>.</div><div class="xj">クリスマスは12月にあります。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">eight</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">8；8つ（の）</div><div class="ex">I get up at <b>eight</b> on Sundays.</div><div class="xj">私は日曜日は8時に起きます。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">eighteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">18（の）</div><div class="ex">There are <b>eighteen</b> girls in our class.</div><div class="xj">私たちのクラスには女子が18人います。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">eighteenth</span><span class="ps">数</span></div><div class="ja">18番目（の）；（日付の）18日</div><div class="ex">My birthday is May <b>eighteenth</b>.</div><div class="xj">私の誕生日は5月18日です。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">eighth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">8番目（の）；（日付の）8日</div><div class="ex">Ken finished <b>eighth</b> in the race.</div><div class="xj">ケンはレースで8位でした。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">eighty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">80（の）</div><div class="ex">My grandfather is <b>eighty</b> years old.</div><div class="xj">私の祖父は80歳です。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">eleven</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">11（の）</div><div class="ex">A soccer team has <b>eleven</b> players.</div><div class="xj">サッカーのチームには11人の選手がいます。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">eleventh</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">11番目（の）；（日付の）11日</div><div class="ex">Our school festival was on October <b>eleventh</b>.</div><div class="xj">私たちの文化祭は10月11日でした。</div></button></li></ol><nav class="pn"><a href="../26/">← 第26回</a><a href="../28/">第28回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"781": 4.69, "782": 19.23, "783": 35.28, "784": 49.87, "785": 63.62, "786": 76.19, "787": 90.49, "788": 104.62, "789": 119.24, "790": 132.43, "791": 147.12, "792": 160.29, "793": 174.42, "794": 187.57, "795": 200.98, "796": 214.06, "797": 231.04, "798": 243.38, "799": 256.38, "800": 269.14, "801": 282.51, "802": 295.58, "803": 308.08, "804": 320.63, "805": 333.85, "806": 347.29, "807": 362.45, "808": 376.58, "809": 389.78, "810": 403.05};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
