lass="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">hobby</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">趣味</div><div class="ex">Ken has many <b>hobbies</b>.</div><div class="xj">ケンには趣味がたくさんあります。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">nervous</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">緊張して；不安で</div><div class="ex">I was very <b>nervous</b> before the game.</div><div class="xj">私は試合の前、とても緊張していました。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">performance</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">演奏；演技；公演</div><div class="ex">Your piano <b>performance</b> was great.</div><div class="xj">あなたのピアノの演奏はすばらしかったです。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">shot</span><span class="ps">名</span></div><div class="ja">写真（の1枚）；（スポーツの）シュート</div><div class="ex">This is a nice <b>shot</b> of Mt. Fuji.</div><div class="xj">これは富士山のいい写真です。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">card</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">カード；はがき</div><div class="ex">I wrote a birthday <b>card</b> for Mom.</div><div class="xj">私はお母さんに誕生日カードを書きました。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">dear</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">親愛なる（手紙の書き出し）；大切な</div><div class="ex"><b>Dear</b> Tom, how are you?</div><div class="xj">親愛なるトムへ、元気ですか。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">February</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">2月</div><div class="ex">It is very cold in <b>February</b>.</div><div class="xj">2月はとても寒いです。</div></button></li><li><button class="w" data-no="792"><div class="top"><span class="no">792</span><span class="en">miss</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（いなくて）さびしく思う；乗り遅れる</div><div class="ex">I <b>miss</b> you very much.</div><div class="xj">あなたがいなくてとてもさびしいです。</div></button></li><li><button class="w" data-no="793"><div class="top"><span class="no">793</span><span class="en">street</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">通り；道路</div><div class="ex">There are many shops on this <b>street</b>.</div><div class="xj">この通りにはたくさんの店があります。</div></button></li><li><button class="w" data-no="794"><div class="top"><span class="no">794</span><span class="en">view</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">眺め；景色</div><div class="ex">The <b>view</b> from my room is beautiful.</div><div class="xj">私の部屋からの眺めはきれいです。</div></button></li><li><button class="w" data-no="795"><div class="top"><span class="no">795</span><span class="en">wish</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">願い；願いごと</div><div class="ex">Make a <b>wish</b>, Emi!</div><div class="xj">エミ、願いごとをして！</div></button></li><li><button class="w" data-no="796"><div class="top"><span class="no">796</span><span class="en">Best wishes,</span><span class="ps">熟</span></div><div class="ja">それではお元気で（手紙の結び）</div><div class="ex">Please write back. <b>Best wishes,</b> Lisa</div><div class="xj">お返事を書いてね。それではお元気で。リサより</div></button></li><li><button class="w" data-no="797"><div class="top"><span class="no">797</span><span class="en">April</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">4月</div><div class="ex">It is warm in <b>April</b>.</div><div class="xj">4月は暖かいです。</div></button></li><li><button class="w" data-no="798"><div class="top"><span class="no">798</span><span class="en">August</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">8月</div><div class="ex">We went to the sea in <b>August</b>.</div><div class="xj">私たちは8月に海へ行きました。</div></button></li><li><button class="w" data-no="799"><div class="top"><span class="no">799</span><span class="en">autumn</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">秋</div><div class="ex">Apples are delicious in <b>autumn</b>.</div><div class="xj">秋はりんごがおいしいです。</div></button></li><li><button class="w" data-no="800"><div class="top"><span class="no">800</span><span class="en">chilly</span><span class="ps">形</span></div><div class="ja">肌寒い；ひんやりした</div><div class="ex">It is <b>chilly</b> this morning.</div><div class="xj">今朝は肌寒いです。</div></button></li><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">cloudy</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">くもりの</div><div class="ex">Was it <b>cloudy</b> in Osaka yesterday?</div><div class="xj">昨日、大阪はくもりでしたか。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">date</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">日付</div><div class="ex">Write the <b>date</b> on your paper.</div><div class="xj">紙に日付を書いてください。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">December</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">12月</div><div class="ex">Christmas is in <b>December</b>.</div><div class="xj">クリスマスは12月にあります。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">eight</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">8；8つ（の）</div><div class="ex">I get up at <b>eight</b> on Sundays.</div><div class="xj">私は日曜日は8時に起きます。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">eighteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">18（の）</div><div class="ex">There are <b>eighteen</b> girls in our class.</div><div class="xj">私たちのクラスには女子が18人います。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">eighteenth</span><span class="ps">数</span></div><div class="ja">18番目（の）；（日付の）18日</div><div class="ex">My birthday is May <b>eighteenth</b>.</div><div class="xj">私の誕生日は5月18日です。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">eighth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">8番目（の）；（日付の）8日</div><div class="ex">Ken finished <b>eighth</b> in the race.</div><div class="xj">ケンはレースで8位でした。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">eighty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">80（の）</div><div class="ex">My grandfather is <b>eighty</b> years old.</div><div class="xj">私の祖父は80歳です。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">eleven</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">11（の）</div><div class="ex">A soccer team has <b>eleven</b> players.</div><div class="xj">サッカーのチームには11人の選手がいます。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">eleventh</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">11番目（の）；（日付の）11日</div><div class="ex">Our school festival was on October <b>eleventh</b>.</div><div class="xj">私たちの文化祭は10月11日でした。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../26/">← 第26回</a><a href="../28/">第28回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"781": 4.69, "782": 19.23, "783": 35.28, "784": 49.87, "785": 63.62, "786": 76.19, "787": 90.49, "788": 104.62, "789": 119.24, "790": 132.43, "791": 147.12, "792": 160.29, "793": 174.42, "794": 187.57, "795": 200.98, "796": 214.06, "797": 231.04, "798": 243.38, "799": 256.38, "800": 269.14, "801": 282.51, "802": 295.58, "803": 308.08, "804": 320.63, "805": 333.85, "806": 347.29, "807": 362.45, "808": 376.58, "809": 389.78, "810": 403.05}, "TE": {"781": 6.97, "782": 21.1, "783": 37.2, "784": 51.79, "785": 65.49, "786": 78.23, "787": 92.68, "788": 106.5, "789": 121.11, "790": 134.3, "791": 149.13, "792": 162.16, "793": 176.32, "794": 189.44, "795": 202.85, "796": 216.29, "797": 232.92, "798": 245.37, "799": 258.25, "800": 271.02, "801": 284.38, "802": 297.46, "803": 310.0, "804": 322.5, "805": 335.77, "806": 349.26, "807": 364.32, "808": 378.46, "809": 391.65, "810": 404.97}, "Q": [[781, "タヌキ（2語で）", "raccoon dog"], [782, "（～で）なかった", "weren’t"], [783, "創造力のある", "creative"], [784, "最初の", "first"], [785, "趣味", "hobby"], [786, "緊張して", "nervous"], [787, "演奏", "performance"], [788, "写真（の1枚）", "shot"], [789, "カード", "card"], [790, "親愛なる（手紙の書き出し）", "dear"], [791, "2月", "February"], [792, "（いなくて）さびしく思う", "miss"], [793, "通り", "street"], [794, "眺め", "view"], [795, "願い", "wish"], [796, "それではお元気で（手紙の結び）（2語で）", "Best wishes"], [797, "4月", "April"], [798, "8月", "August"], [799, "秋", "autumn"], [800, "肌寒い", "chilly"], [801, "くもりの", "cloudy"], [802, "日付", "date"], [803, "12月", "December"], [804, "8", "eight"], [805, "18（の）", "eighteen"], [806, "18番目（の）", "eighteenth"], [807, "8番目（の）", "eig
