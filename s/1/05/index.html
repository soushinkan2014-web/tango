</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第5回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.22〜25　No.121〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">no</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">いいえ</div><div class="ex">A: Are you hungry?<br>B: <b>No</b>, I’m not.</div><div class="xj">A：おなかはすいていますか。B：いいえ、すいていません。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">not</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">～でない；～しない</div><div class="ex">I’m <b>not</b> a teacher.</div><div class="xj">私は先生ではありません。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">oh</span><span class="ps">間</span><span class=star>★</span></div><div class="ja">おお；ああ；あら</div><div class="ex"><b>Oh</b>, you are tall!</div><div class="xj">おお、あなたは背が高いですね！</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">sorry</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">すまなく思って；残念で</div><div class="ex">I’m very <b>sorry</b>.</div><div class="xj">私はとても申し訳なく思っています。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">aren’t</span><span class="ps">動</span></div><div class="ja">～でない（are not の短縮形）</div><div class="ex">We <b>aren’t</b> in the same class.</div><div class="xj">私たちは同じクラスではありません。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">at</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～で；～に（時刻）</div><div class="ex">Let’s meet <b>at</b> the station.</div><div class="xj">駅で会いましょう。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">fifteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">15（の）</div><div class="ex">We need <b>fifteen</b> chairs.</div><div class="xj">私たちは15脚のいすが必要です。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">forty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">40（の）</div><div class="ex">I can swim <b>forty</b> meters.</div><div class="xj">私は40メートル泳げます。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">hello</span><span class="ps">間</span><span class=star>★</span></div><div class="ja">こんにちは；もしもし</div><div class="ex"><b>Hello</b>, are you Tom?</div><div class="xj">こんにちは、あなたがトムですか。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">Japan</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">日本</div><div class="ex">Do you like <b>Japan</b>?</div><div class="xj">あなたは日本が好きですか。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">junior</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">下級の；年下の</div><div class="ex">We are <b>junior</b> members of the team.</div><div class="xj">私たちはチームの下級生のメンバーです。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">junior high school</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">中学校</div><div class="ex">Is this your <b>junior high school</b>?</div><div class="xj">これがあなたの中学校ですか。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">kind</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">親切な；やさしい</div><div class="ex">Be <b>kind</b> to animals.</div><div class="xj">動物にやさしくしなさい。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">little</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">（a little で）少し；小さい</div><div class="ex">I’m a <b>little</b> hungry.</div><div class="xj">私は少しおなかがすいています。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">nice</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">すてきな；よい</div><div class="ex">You have a <b>nice</b> bag.</div><div class="xj">あなたはすてきなかばんを持っていますね。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">pardon</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">（Pardon? で）もう一度言ってください；許し</div><div class="ex">A: I’m from Brazil.<br>B: <b>Pardon</b>?</div><div class="xj">A：私はブラジル出身です。B：もう一度言ってください。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">Pardon me?</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">もう一度言ってくださいますか</div><div class="ex">A: Let’s meet at five.<br>B: <b>Pardon me?</b></div><div class="xj">A：5時に会いましょう。B：もう一度言ってくださいますか。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">shy</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">恥ずかしがりの；内気な</div><div class="ex">Are you <b>shy</b>?</div><div class="xj">あなたは恥ずかしがりやですか。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">I’m sorry.</span><span class="ps">熟</span></div><div class="ja">ごめんなさい；すみません</div><div class="ex">A: Oh, <b>I’m sorry.</b><br>B: That’s OK.</div><div class="xj">A：あっ、ごめんなさい。B：だいじょうぶですよ。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">student</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">生徒；学生</div><div class="ex">We are <b>students</b> of this school.</div><div class="xj">私たちはこの学校の生徒です。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">teacher</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">先生；教師</div><div class="ex">Are you an English <b>teacher</b>?</div><div class="xj">あなたは英語の先生ですか。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">thirty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">30（の）</div><div class="ex">We have <b>thirty</b> students in our class.</div><div class="xj">私たちのクラスには30人の生徒がいます。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">yes</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">はい</div><div class="ex">A: Do you like sushi?<br>B: <b>Yes</b>, I do.</div><div class="xj">A：おすしは好きですか。B：はい、好きです。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">city</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">市；都市</div><div class="ex">Do you live in this <b>city</b>?</div><div class="xj">あなたはこの市に住んでいますか。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">just</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ただ～だけ；ちょうど</div><div class="ex">I <b>just</b> want some water.</div><div class="xj">私は水が少しほしいだけです。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">Nice to meet you.</span><span class="ps">熟</span></div><div class="ja">はじめまして；お会いできてうれしいです</div><div class="ex">A: I’m Lisa.<br>B: <b>Nice to meet you</b>, Lisa.</div><div class="xj">A：私はリサです。B：はじめまして、リサ。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">this</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">これ；この</div><div class="ex">Is <b>this</b> your notebook?</div><div class="xj">これはあなたのノートですか。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">you’re</span><span class="ps">代</span></div><div class="ja">あなたは～です（you are の短縮形）</div><div class="ex"><b>You’re</b> early today.</div><div class="xj">あなたは今日は早いですね。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">class</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">授業；クラス</div><div class="ex">We have five <b>classes</b> today.</div><div class="xj">今日は授業が5つあります。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">go</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">行く</div><div class="ex">We <b>go</b> to the sea in summer.</div><div class="xj">私たちは夏に海へ行きます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../04/">← 第4回</a><a href="../06/">第6回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"121": 4.14, "122": 18.77, "123": 32.3, "124": 44.61, "125": 58.19, "126": 72.49, "127": 86.17, "128": 99.22, "129": 111.91, "130": 125.28, "131": 137.3, "132": 150.95, "133": 164.65, "134": 177.84, "135": 191.33, "136": 203.76, "137": 221.22, "138": 237.05, "139": 249.55, "140": 265.72, "141": 279.04, "142": 291.92, "143": 305.0, "144": 319.96, "145": 332.25, "146": 345.64, "147": 363.22, "148": 375.43, "149": 389.47, "150": 403.0}, "TE": {"121": 5.92, "122": 20.64, "123": 34.18, "124": 46.53, "125": 60.06, "126": 74.36, "127": 88.21, "128": 101.09, "129": 113.78, "130": 127.17, "131": 139.17, "132": 153.37, "133": 166.52, "134": 179.72, "135": 193.22, "136": 205.63, "137": 223.09, "138": 238.92, "139": 251.62, "140": 267.66, "141": 280.91, "142": 293.79, "143": 306.87, "144": 321.84, "145": 334.12, "146": 347.87, "147": 365.09, "148": 377.3, "149": 391.44, "150": 404.87}, "Q": [[121, "いいえ", "no"], [122, "～でない", "not"], [123, "おお", "oh"], [124, "すまなく思って", "sorry"], [125, "～でない（are not の短縮形）", "aren’t"], [126, "～で", "at"], [127, "15（の）", "fifteen"], [128, "40（の）", "forty"], [129, "こんにちは", "hello"], [130, "日本", "Japan"], [131, "下級の", "junior"], [132, "中学校（3語で）", "junior high school"], [133, "親切な", "kind"], [134, "少し（2語で）", "a little"], [135, "すてきな", "nice"], [136, "もう一度言ってください", "Pardon?"], [137, "もう一度言ってくださいますか（2語で）", "Pardon me?"], [138, "恥ずかしがりの", "shy"], [139, "ごめんなさい（2語で）", "I’m sorry."], [140, "生徒", "student"], [141, "先生", "teacher"], [142, "30（の）", "thirty"], [143, "はい", "yes"], [144, "市", "city"], [145, "ただ～だけ", "just"], [146, "はじめまして（4語で）", "Nice to meet you."], [147, "これ", "this"], [148, "あなたは～です（you are の短縮形）", "you’re"], [149, "授業", "class"], [150, "行く", "go"]],
