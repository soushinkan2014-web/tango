</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第20回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.91〜101　No.571〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">third</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">3番目の；第3の</div><div class="ex">This is my <b>third</b> trip to Kyoto.</div><div class="xj">これは私の3回目の京都旅行です。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">turn</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">曲がる；回す</div><div class="ex"><b>Turn</b> right at the bank.</div><div class="xj">銀行のところで右に曲がってください。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">welcome</span><span class="ps">間</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ようこそ；歓迎される</div><div class="ex"><b>Welcome</b> to our school!</div><div class="xj">私たちの学校へようこそ！</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">You’re welcome.</span><span class="ps">熟</span></div><div class="ja">どういたしまして</div><div class="ex">A: Thank you.<br>B: <b>You’re welcome.</b></div><div class="xj">A：ありがとう。B：どういたしまして。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">communicate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">意思を伝え合う；連絡をとる</div><div class="ex">We <b>communicate</b> in English.</div><div class="xj">私たちは英語で意思を伝え合います。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">communication</span><span class="ps">名</span></div><div class="ja">コミュニケーション；意思の疎通</div><div class="ex">We use English for <b>communication</b>.</div><div class="xj">私たちはコミュニケーションのために英語を使います。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">foreign</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">外国の</div><div class="ex">Can you speak a <b>foreign</b> language?</div><div class="xj">あなたは外国の言葉を話せますか。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">incredible</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">信じられない（ほどすごい）；すばらしい</div><div class="ex">Your dance is <b>incredible</b>!</div><div class="xj">あなたのダンスは信じられないほどすごい！</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">language</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">言語；言葉</div><div class="ex">How many <b>languages</b> can you speak?</div><div class="xj">あなたはいくつの言語を話せますか。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">model</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">模型；手本；モデル</div><div class="ex">Tom has a <b>model</b> of a castle.</div><div class="xj">トムはお城の模型を持っています。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">skill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">技術；技能</div><div class="ex">He has good soccer <b>skills</b>.</div><div class="xj">彼はすぐれたサッカーの技術を持っています。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">smoothly</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">なめらかに；すらすらと</div><div class="ex">Emi speaks English <b>smoothly</b>.</div><div class="xj">エミは英語をすらすらと話します。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">teammate</span><span class="ps">名</span></div><div class="ja">チームメイト；チームの仲間</div><div class="ex">Ken is my <b>teammate</b>.</div><div class="xj">ケンは私のチームメイトです。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">top</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">頂上；いちばん上</div><div class="ex">We can see the sea from the <b>top</b>.</div><div class="xj">頂上から海が見えます。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">on top of ～</span><span class="ps">熟</span></div><div class="ja">～の上に；～のてっぺんに</div><div class="ex">There is snow <b>on top of</b> the mountain.</div><div class="xj">山の上に雪があります。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">video</span><span class="ps">名</span></div><div class="ja">動画；ビデオ</div><div class="ex">Let’s watch this <b>video</b>.</div><div class="xj">この動画を見よう。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">happy</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">幸せな；うれしい</div><div class="ex">I am very <b>happy</b> today.</div><div class="xj">私は今日とても幸せです。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">Happy New Year!</span><span class="ps">熟</span></div><div class="ja">あけましておめでとう</div><div class="ex">A: <b>Happy New Year!</b><br>B: Happy New Year, Lisa!</div><div class="xj">A：あけましておめでとう！B：あけましておめでとう、リサ！</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">countdown</span><span class="ps">名</span></div><div class="ja">カウントダウン；秒読み</div><div class="ex">Let’s watch the <b>countdown</b> on TV.</div><div class="xj">テレビでカウントダウンを見よう。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">prepare</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">準備する；用意する</div><div class="ex">My mother <b>prepares</b> dinner for us.</div><div class="xj">母は私たちのために夕食を準備します。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">still</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">まだ；今でも</div><div class="ex">I’m <b>still</b> hungry.</div><div class="xj">私はまだおなかがすいています。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">air</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">空気</div><div class="ex">The <b>air</b> is clean here.</div><div class="xj">ここは空気がきれいです。</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">bathroom</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">浴室；ふろ場；トイレ</div><div class="ex">Our <b>bathroom</b> is very small.</div><div class="xj">うちのふろ場はとても小さいです。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">busy</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">忙しい</div><div class="ex">My father is <b>busy</b> every day.</div><div class="xj">父は毎日忙しいです。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">feel</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">感じる；（～の）気分である</div><div class="ex">Can you <b>feel</b> the wind?</div><div class="xj">風を感じますか。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">grape</span><span class="ps">名</span></div><div class="ja">ブドウ</div><div class="ex">I like <b>grapes</b> very much.</div><div class="xj">私はブドウが大好きです。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">listen</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">聞く；耳をかたむける</div><div class="ex">Please <b>listen</b> carefully.</div><div class="xj">よく聞いてください。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">listen to ～</span><span class="ps">熟</span></div><div class="ja">～を聞く</div><div class="ex">Emi <b>listens to</b> English songs every day.</div><div class="xj">エミは毎日英語の歌を聞きます。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">need</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">必要とする</div><div class="ex">Do you <b>need</b> an umbrella today?</div><div class="xj">今日はかさが必要ですか。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">peach</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">モモ</div><div class="ex">This <b>peach</b> is very sweet.</div><div class="xj">こ
