</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第14回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.58〜65　No.391〜420</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">cherry</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">さくらんぼ；桜</div><div class="ex">This <b>cherry</b> is red and sweet.</div><div class="xj">このさくらんぼは赤くて甘いです。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">fruit</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">果物</div><div class="ex">Apples are my favorite <b>fruit</b>.</div><div class="xj">リンゴは私のいちばん好きな果物です。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">I got it!</span><span class="ps">熟</span></div><div class="ja">わかった！</div><div class="ex">A: It’s red and round.<br>B: <b>I got it!</b> It’s a tomato!</div><div class="xj">A：それは赤くて丸いよ。B：わかった！トマトだね！</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">got</span><span class="ps">動</span></div><div class="ja">（I got it. で）わかった；get の過去形</div><div class="ex">A: Look at this hint.<br>B: Oh, I <b>got</b> it!</div><div class="xj">A：このヒントを見て。B：あ、わかった！</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">hint</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ヒント</div><div class="ex">Do you want a <b>hint</b>?</div><div class="xj">ヒントがほしいですか。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">long</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">長い</div><div class="ex">Her hair is <b>long</b>.</div><div class="xj">彼女の髪は長いです。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">right</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">正しい；右の</div><div class="ex">You are <b>right</b>.</div><div class="xj">あなたは正しいです。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">That’s right.</span><span class="ps">熟</span></div><div class="ja">そのとおり；正解</div><div class="ex">A: Is this a cherry?<br>B: <b>That’s right.</b></div><div class="xj">A：これはさくらんぼですか。B：そのとおりです。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">round</span><span class="ps">形</span></div><div class="ja">丸い</div><div class="ex">The earth is <b>round</b>.</div><div class="xj">地球は丸いです。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">tomato</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">トマト</div><div class="ex">This <b>tomato</b> is very sweet.</div><div class="xj">このトマトはとても甘いです。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">yellow</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">黄色の；黄色</div><div class="ex">Lemons are <b>yellow</b>.</div><div class="xj">レモンは黄色です。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">drone</span><span class="ps">名</span></div><div class="ja">ドローン</div><div class="ex">Can you fly a <b>drone</b>?</div><div class="xj">あなたはドローンを飛ばせますか。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">he’s</span><span class="ps">代</span></div><div class="ja">彼は～です（he is の短縮形）</div><div class="ex"><b>He’s</b> my classmate.</div><div class="xj">彼は私のクラスメートです。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">high school</span><span class="ps">熟</span></div><div class="ja">高校</div><div class="ex">My brother is a <b>high school</b> student.</div><div class="xj">私の兄は高校生です。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">programmer</span><span class="ps">名</span></div><div class="ja">プログラマー</div><div class="ex">My uncle is a <b>programmer</b>.</div><div class="xj">私のおじはプログラマーです。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">pajama</span><span class="ps">名</span></div><div class="ja">パジャマ（ふつう pajamas の形で使う）</div><div class="ex">Where are my <b>pajamas</b>?</div><div class="xj">私のパジャマはどこですか。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">clothes</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">服；衣服</div><div class="ex">I want new <b>clothes</b>.</div><div class="xj">私は新しい服がほしいです。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">design</span><span class="ps">動</span></div><div class="ja">デザインする；設計する</div><div class="ex">I want to <b>design</b> T-shirts.</div><div class="xj">私はTシャツをデザインしたいです。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">does</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">（疑問文で）～しますか；する（do の3単現）</div><div class="ex"><b>Does</b> Emi play the piano?</div><div class="xj">エミはピアノを弾きますか。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">doesn’t</span><span class="ps">助</span></div><div class="ja">～しない（does not の短縮形）</div><div class="ex">Ken <b>doesn’t</b> like cats.</div><div class="xj">ケンはネコが好きではありません。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">home economics</span><span class="ps">熟</span></div><div class="ja">家庭科</div><div class="ex">We have <b>home economics</b> on Friday.</div><div class="xj">金曜日に家庭科があります。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">sew</span><span class="ps">動</span></div><div class="ja">ぬう</div><div class="ex">I can <b>sew</b> a bag.</div><div class="xj">私はかばんをぬうことができます。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">curry and rice</span><span class="ps">熟</span></div><div class="ja">カレーライス</div><div class="ex">Let’s make <b>curry and rice</b>.</div><div class="xj">カレーライスを作ろう。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">drawing</span><span class="ps">名</span></div><div class="ja">絵（線でかいた絵）</div><div class="ex">This is my <b>drawing</b>.</div><div class="xj">これは私の絵です。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">his</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼の；彼のもの</div><div class="ex">This is <b>his</b> bike.</div><div class="xj">これは彼の自転車です。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">ice hockey</span><span class="ps">熟</span></div><div class="ja">アイスホッケー</div><div class="ex"><b>Ice hockey</b> is popular in Canada.</div><div class="xj">カナダではアイスホッケーが人気です。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">player</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">選手</div><div class="ex">Tom is a good soccer <b>player</b>.</div><div class="xj">トムは上手なサッカー選手です。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">common</span><span class="ps">形</span></div><div class="ja">よくある；ふつうの；共通の</div><div class="ex">Sato is a <b>common</b> name in Japan.</div><div class="xj">佐藤は日本でよくある名前です。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">kid</span><span class="ps">名</span></div><div class="ja">子ども</div><div class="ex">This game is for <b>kids</b>.</div><div class="xj">このゲームは子ども向けです。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">Just kidding.</span><span class="ps">熟</span></div><div class="ja">冗談だよ</div><div class="ex">A: I can fly.<br>B: Really? A: <b>Just kidding.</b></div><div class="xj">A：ぼくは空を飛べるよ。B：本当に？ A：冗談だよ。</div></button></li></ol><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"391": 4.5, "392": 17.96, "393": 30.63, "394": 47.66, "395": 65.96, "396": 77.84, "397": 89.93, "398": 102.31, "399": 117.78, "400": 130.02, "401": 143.02, "402": 155.67, "403": 167.83, "404": 182.06, "405": 195.3, "406": 208.14, "407": 222.3, "408": 235.11, "409": 249.26, "410": 264.55, "411": 278.7, "412": 292.96, "413": 305.14, "414": 319.08, "415": 331.44, "416": 344.06, "417": 357.78, "418": 370.6, "419": 384.54, "420": 397.08};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
