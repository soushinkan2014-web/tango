on></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">street singer</span><span class="ps">熟</span></div><div class="ja">ストリートシンガー；路上で歌う歌手</div><div class="ex">We can see <b>street singers</b> in this park.</div><div class="xj">この公園ではストリートシンガーが見られます。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">towel</span><span class="ps">名</span></div><div class="ja">タオル</div><div class="ex">Please use this <b>towel</b>.</div><div class="xj">このタオルを使ってください。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">track and field</span><span class="ps">熟</span></div><div class="ja">陸上競技</div><div class="ex">I am on the <b>track and field</b> team.</div><div class="xj">私は陸上部に入っています。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">year</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">年；～歳</div><div class="ex">I go to Okinawa every <b>year</b>.</div><div class="xj">私は毎年沖縄に行きます。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">～ year(s) old</span><span class="ps">熟</span></div><div class="ja">～歳</div><div class="ex">I am thirteen <b>years old</b>.</div><div class="xj">私は13歳です。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">zebra</span><span class="ps">名</span></div><div class="ja">シマウマ</div><div class="ex"><b>Zebras</b> live in Africa.</div><div class="xj">シマウマはアフリカにすんでいます。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">deep-fried</span><span class="ps">形</span></div><div class="ja">油で揚げた</div><div class="ex">Do you like <b>deep-fried</b> food?</div><div class="xj">あなたは揚げ物が好きですか。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">favorite</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">いちばん好きな；お気に入りの</div><div class="ex">What is your <b>favorite</b> sport?</div><div class="xj">あなたのいちばん好きなスポーツは何ですか。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">ha-ha</span><span class="ps">間</span></div><div class="ja">ハハハ（笑い声）</div><div class="ex"><b>Ha-ha</b>! That’s funny.</div><div class="xj">ハハハ！それはおもしろいね。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">legend</span><span class="ps">名</span></div><div class="ja">伝説；伝説的な人</div><div class="ex">You are a <b>legend</b>!</div><div class="xj">あなたは伝説の人だね！</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">meat</span><span class="ps">名</span></div><div class="ja">肉</div><div class="ex">I don’t eat <b>meat</b>.</div><div class="xj">私は肉を食べません。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">ready</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">用意ができた；準備ができた</div><div class="ex">Are you <b>ready</b>?</div><div class="xj">準備はできていますか。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">worry</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">心配する</div><div class="ex">Don’t <b>worry</b>.</div><div class="xj">心配しないで。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">cool</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">かっこいい；すずしい</div><div class="ex">Your shoes are <b>cool</b>!</div><div class="xj">あなたのくつはかっこいいね！</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">custard pudding</span><span class="ps">熟</span></div><div class="ja">カスタードプリン；プリン</div><div class="ex">I want to eat <b>custard pudding</b>.</div><div class="xj">私はカスタードプリンが食べたいです。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">lady</span><span class="ps">名</span></div><div class="ja">女性；婦人（ていねいな言い方）</div><div class="ex">Let’s help that old <b>lady</b>.</div><div class="xj">あの年配の女性を手伝いましょう。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">she’s</span><span class="ps">代</span></div><div class="ja">彼女は～です（she is の短縮形）</div><div class="ex"><b>She’s</b> from Canada.</div><div class="xj">彼女はカナダ出身です。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">sister</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">姉；妹；姉妹</div><div class="ex">My <b>sister</b> can make cookies.</div><div class="xj">私の姉はクッキーを作れます。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">sweet</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">甘い</div><div class="ex">I don’t like <b>sweet</b> food.</div><div class="xj">私は甘い食べ物が好きではありません。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">traditional</span><span class="ps">形</span></div><div class="ja">伝統的な</div><div class="ex">We can see <b>traditional</b> houses in Kyoto.</div><div class="xj">京都では伝統的な家を見ることができます。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">who’s</span><span class="ps">代</span></div><div class="ja">だれ（who is の短縮形）</div><div class="ex"><b>Who’s</b> that girl?</div><div class="xj">あの女の子はだれですか。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">would</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">（would like ～で）～がほしい；（would like to ～で）～したい</div><div class="ex">I <b>would</b> like a hamburger.</div><div class="xj">ハンバーガーがほしいのですが。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">Would you like ～?</span><span class="ps">熟</span></div><div class="ja">～はいかがですか</div><div class="ex">A: <b>Would you like</b> some tea?<br>B: Yes, please.</div><div class="xj">A：紅茶はいかがですか。B：はい、お願いします。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">answer</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">答える；答え</div><div class="ex">Please <b>answer</b> my question.</div><div class="xj">私の質問に答えてください。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">banana</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">バナナ</div><div class="ex">Monkeys like <b>bananas</b>.</div><div class="xj">サルはバナナが好きです。</div></button></li></ol><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"361": 4.5, "362": 17.17, "363": 29.52, "364": 42.31, "365": 55.2, "366": 68.44, "367": 84.28, "368": 96.58, "369": 110.84, "370": 124.54, "371": 137.88, "372": 150.57, "373": 163.6, "374": 177.08, "375": 189.92, "376": 203.4, "377": 215.35, "378": 228.26, "379": 240.01, "380": 253.09, "381": 266.98, "382": 280.92, "383": 295.27, "384": 308.42, "385": 320.92, "386": 334.83, "387": 348.34, "388": 365.14, "389": 381.09, "390": 394.0};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
