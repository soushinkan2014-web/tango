</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第13回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.53〜58　No.361〜390</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">he</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼は；彼が</div><div class="ex"><b>He</b> can run fast.</div><div class="xj">彼は速く走れます。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">horse</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">馬</div><div class="ex">I want to ride a <b>horse</b>.</div><div class="xj">私は馬に乗りたいです。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">man</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">男性；男の人</div><div class="ex">Do you know that <b>man</b>?</div><div class="xj">あなたはあの男性を知っていますか。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">old</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">古い；年をとった；～歳の</div><div class="ex">I have an <b>old</b> bike.</div><div class="xj">私は古い自転車を持っています。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">runner</span><span class="ps">名</span></div><div class="ja">走る人；ランナー</div><div class="ex">I want to be a fast <b>runner</b>.</div><div class="xj">私は速いランナーになりたいです。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">street singer</span><span class="ps">熟</span></div><div class="ja">ストリートシンガー；路上で歌う歌手</div><div class="ex">We can see <b>street singers</b> in this park.</div><div class="xj">この公園ではストリートシンガーが見られます。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">towel</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">タオル</div><div class="ex">Please use this <b>towel</b>.</div><div class="xj">このタオルを使ってください。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">track and field</span><span class="ps">熟</span></div><div class="ja">陸上競技</div><div class="ex">I am on the <b>track and field</b> team.</div><div class="xj">私は陸上部に入っています。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">year</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">年；～歳</div><div class="ex">I go to Okinawa every <b>year</b>.</div><div class="xj">私は毎年沖縄に行きます。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">～ year(s) old</span><span class="ps">熟</span></div><div class="ja">～歳</div><div class="ex">I am thirteen <b>years old</b>.</div><div class="xj">私は13歳です。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">zebra</span><span class="ps">名</span></div><div class="ja">シマウマ</div><div class="ex"><b>Zebras</b> live in Africa.</div><div class="xj">シマウマはアフリカにすんでいます。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">deep-fried</span><span class="ps">形</span></div><div class="ja">油で揚げた</div><div class="ex">Do you like <b>deep-fried</b> food?</div><div class="xj">あなたは揚げ物が好きですか。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">favorite</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">いちばん好きな；お気に入りの</div><div class="ex">What is your <b>favorite</b> sport?</div><div class="xj">あなたのいちばん好きなスポーツは何ですか。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">ha-ha</span><span class="ps">間</span></div><div class="ja">ハハハ（笑い声）</div><div class="ex"><b>Ha-ha</b>! That’s funny.</div><div class="xj">ハハハ！それはおもしろいね。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">legend</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">伝説；伝説的な人</div><div class="ex">You are a <b>legend</b>!</div><div class="xj">あなたは伝説の人だね！</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">meat</span><span class="ps">名</span></div><div class="ja">肉</div><div class="ex">I don’t eat <b>meat</b>.</div><div class="xj">私は肉を食べません。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">ready</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">用意ができた；準備ができた</div><div class="ex">Are you <b>ready</b>?</div><div class="xj">準備はできていますか。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">worry</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">心配する</div><div class="ex">Don’t <b>worry</b>.</div><div class="xj">心配しないで。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">cool</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">かっこいい；すずしい</div><div class="ex">Your shoes are <b>cool</b>!</div><div class="xj">あなたのくつはかっこいいね！</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">custard pudding</span><span class="ps">熟</span></div><div class="ja">カスタードプリン；プリン</div><div class="ex">I want to eat <b>custard pudding</b>.</div><div class="xj">私はカスタードプリンが食べたいです。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">lady</span><span class="ps">名</span></div><div class="ja">女性；婦人（ていねいな言い方）</div><div class="ex">Let’s help that old <b>lady</b>.</div><div class="xj">あの年配の女性を手伝いましょう。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">she’s</span><span class="ps">代</span></div><div class="ja">彼女は～です（she is の短縮形）</div><div class="ex"><b>She’s</b> from Canada.</div><div class="xj">彼女はカナダ出身です。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">sister</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">姉；妹；姉妹</div><div class="ex">My <b>sister</b> can make cookies.</div><div class="xj">私の姉はクッキーを作れます。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">sweet</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">甘い</div><div class="ex">I don’t like <b>sweet</b> food.</div><div class="xj">私は甘い食べ物が好きではありません。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">traditional</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">伝統的な</div><div class="ex">We can see <b>traditional</b> houses in Kyoto.</div><div class="xj">京都では伝統的な家を見ることができます。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">who’s</span><span class="ps">代</span></div><div class="ja">だれ（who is の短縮形）</div><div class="ex"><b>Who’s</b> that girl?</div><div class="xj">あの女の子はだれですか。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">would</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">（would like ～で）～がほしい；（would like to ～で）～したい</div><div class="ex">I <b>would</b> like a hamburger.</div><div class="xj">ハンバーガーがほしいのですが。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">Would you like ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～はいかがですか</div><div class="ex">A: <b>Would you like</b> some tea?<br>B: Yes, please.</div><div class="xj">A：紅茶はいかがですか。B：はい、お願いします。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">answer</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">答える；答え</div><div class="ex">Please <b>answer</b> my question.</div><div class="xj">私の質問に答えてください。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">banana</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">バナナ</div><div class="ex">Monkeys like <b>bananas</b>.</div><div class="xj">サルはバナナが好きです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"361": 4.5, "362": 17.17, "363": 29
