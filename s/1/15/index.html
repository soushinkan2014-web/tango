<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中1 英単語 第15回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第15回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.65〜72　No.421〜450</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">live</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">住む</div><div class="ex">My uncle <b>lives</b> in Tokyo.</div><div class="xj">私のおじは東京に住んでいます。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">～, right?</span><span class="ps">熟</span></div><div class="ja">～ですよね</div><div class="ex">You like soccer, <b>right?</b></div><div class="xj">あなたはサッカーが好きですよね。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">spend</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（時間を）過ごす；（お金を）使う</div><div class="ex">Ken <b>spends</b> Sundays with his grandmother.</div><div class="xj">ケンは日曜日をおばあさんと過ごします。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">about</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～について</div><div class="ex">Tell me <b>about</b> your town.</div><div class="xj">あなたの町について教えて。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">all</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">すべての；全部の</div><div class="ex">She knows <b>all</b> the songs.</div><div class="xj">彼女は全部の歌を知っています。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">charity</span><span class="ps">名</span></div><div class="ja">慈善団体；慈善（活動）</div><div class="ex">This shop gives money to a <b>charity</b>.</div><div class="xj">この店は慈善団体にお金を寄付しています。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">children</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">子どもたち（child の複数形）</div><div class="ex">The <b>children</b> are in the park.</div><div class="xj">子どもたちは公園にいます。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">company</span><span class="ps">名</span></div><div class="ja">会社</div><div class="ex">My father works for a car <b>company</b>.</div><div class="xj">私の父は自動車会社で働いています。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">hospital</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">病院</div><div class="ex">Her mother is a nurse at this <b>hospital</b>.</div><div class="xj">彼女のお母さんはこの病院の看護師です。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">mean</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">意味する</div><div class="ex">What does this word <b>mean</b>?</div><div class="xj">この単語はどういう意味ですか。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">only</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">ただ～だけ；唯一の</div><div class="ex">He has <b>only</b> one brother.</div><div class="xj">彼には兄弟が1人だけいます。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">proud</span><span class="ps">形</span></div><div class="ja">誇りに思う；誇らしい</div><div class="ex">We are <b>proud</b> of our school.</div><div class="xj">私たちは自分たちの学校を誇りに思っています。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">be proud of ～</span><span class="ps">熟</span></div><div class="ja">～を誇りに思う</div><div class="ex">My grandmother <b>is proud of</b> her garden.</div><div class="xj">祖母は自分の庭を誇りに思っています。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">sick</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">病気の；具合が悪い</div><div class="ex">My sister is <b>sick</b> today.</div><div class="xj">妹は今日、具合が悪いです。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">support</span><span class="ps">動</span></div><div class="ja">支える；支援する；応援する</div><div class="ex">Many people <b>support</b> the team.</div><div class="xj">多くの人がそのチームを応援しています。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">talk</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">話す</div><div class="ex">She often <b>talks</b> with her friends.</div><div class="xj">彼女はよく友だちと話します。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">work</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">働く；（機械が）動く</div><div class="ex">My mother <b>works</b> at a bank.</div><div class="xj">母は銀行で働いています。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">event</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">行事；出来事；イベント</div><div class="ex">The school festival is a big <b>event</b>.</div><div class="xj">文化祭は大きな行事です。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">would like to ～</span><span class="ps">熟</span></div><div class="ja">～したい（ていねいな言い方）</div><div class="ex">I <b>would like to</b> visit Canada.</div><div class="xj">私はカナダを訪れたいと思います。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">big</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">大きい</div><div class="ex">Your dog is very <b>big</b>!</div><div class="xj">あなたの犬はとても大きいね！</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">bike</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">自転車</div><div class="ex">Whose <b>bike</b> is this?</div><div class="xj">これはだれの自転車ですか。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">blue</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">青い</div><div class="ex">I like the <b>blue</b> T-shirt.</div><div class="xj">私はその青いTシャツが好きです。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">hers</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼女のもの</div><div class="ex">This bag is <b>hers</b>.</div><div class="xj">このかばんは彼女のものです。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">mine</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私のもの</div><div class="ex">That umbrella is <b>mine</b>.</div><div class="xj">あのかさは私のものです。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">ours</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私たちのもの</div><div class="ex">This classroom is <b>ours</b>.</div><div class="xj">この教室は私たちのものです。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">which</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">どちら；どの</div><div class="ex"><b>Which</b> cap do you like?</div><div class="xj">どちらのぼうしが好きですか。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">whose</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">だれの；だれのもの</div><div class="ex"><b>Whose</b> notebook is this?</div><div class="xj">これはだれのノートですか。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">yours</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">あなたのもの</div><div class="ex">Is this pen <b>yours</b>?</div><div class="xj">このペンはあなたのものですか。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">way</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">道；方法</div><div class="ex">Is this the <b>way</b> to the station?</div><div class="xj">これは駅へ行く道ですか。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">always</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">いつも</div><div class="ex">Ken <b>always</b> gets up at six.</div><div class="xj">ケンはいつも6時に起きます。</div></button></li></ol><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"421": 4.45, "422": 17.19, "423": 30.12, "424": 44.66, "425": 57.31, "426": 70.55, "427": 85.0, "428": 98.65, "429": 111.72, "430": 125.02, "431": 137.2, "432": 150.62, "433": 164.2, "434": 178.83, "435": 192.2, "436": 205.8, "437": 218.8, "438": 232.36, "439": 245.94, "440": 259.93, "441": 272.52, "442": 284.74, "443": 297.24, "444": 309.62, "445": 322.14, "446": 335.07, "447": 347.28, "448": 360.36, "449": 372.62, "450": 385.53};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
