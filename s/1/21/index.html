<button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">today</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">今日（は）</div><div class="ex">I don’t have club practice <b>today</b>.</div><div class="xj">今日は部活の練習がありません。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">Why don’t we ～?</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～しませんか；～しようよ</div><div class="ex"><b>Why don’t we</b> go to the beach?</div><div class="xj">海へ行きませんか。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">almost</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ほとんど；もう少しで</div><div class="ex"><b>Almost</b> all my friends like soccer.</div><div class="xj">私の友だちのほとんどみんながサッカーが好きです。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">front</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">前；正面</div><div class="ex">Let’s meet at the <b>front</b> of the station.</div><div class="xj">駅の正面で会おう。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">in front of ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～の前に</div><div class="ex">There is a big tree <b>in front of</b> my house.</div><div class="xj">私の家の前に大きな木があります。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">midnight</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">真夜中；午前0時</div><div class="ex">Don’t call me at <b>midnight</b>.</div><div class="xj">真夜中に電話しないで。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">mom</span><span class="ps">名</span></div><div class="ja">お母さん；ママ</div><div class="ex"><b>Mom</b>, where is my bag?</div><div class="xj">お母さん、私のかばんはどこ？</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">stand</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">立つ；立っている</div><div class="ex">Please <b>stand</b> here.</div><div class="xj">ここに立ってください。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">we’re</span><span class="ps">代</span></div><div class="ja">私たちは～です（we are の短縮形）</div><div class="ex"><b>We’re</b> good friends.</div><div class="xj">私たちは仲よしです。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">expensive</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">高価な；（値段が）高い</div><div class="ex">This watch is very <b>expensive</b>.</div><div class="xj">この腕時計はとても高価です。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">figure</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">人形；像；姿</div><div class="ex">He makes small <b>figures</b> from sugar.</div><div class="xj">彼は砂糖で小さな人形を作ります。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">France</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">フランス</div><div class="ex">Paris is in <b>France</b>.</div><div class="xj">パリはフランスにあります。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">important</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">大切な；重要な</div><div class="ex">Breakfast is very <b>important</b>.</div><div class="xj">朝食はとても大切です。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">January</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">1月</div><div class="ex">My birthday is in <b>January</b>.</div><div class="xj">私の誕生日は1月です。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">Mr.</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">～さん；～先生（男性に）</div><div class="ex"><b>Mr.</b> Sato is my father’s friend.</div><div class="xj">佐藤さんは父の友だちです。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">pastry chef</span><span class="ps">熟</span></div><div class="ja">パティシエ；菓子職人</div><div class="ex">My aunt is a <b>pastry chef</b>.</div><div class="xj">私のおばはパティシエです。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">put</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">置く</div><div class="ex"><b>Put</b> your bag here.</div><div class="xj">かばんをここに置いてください。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">skillful</span><span class="ps">形</span></div><div class="ja">じょうずな；熟練した</div><div class="ex">He is a <b>skillful</b> cook.</div><div class="xj">彼はじょうずな料理人です。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">tiny</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">とても小さい</div><div class="ex">Look at this <b>tiny</b> cake!</div><div class="xj">このとても小さいケーキを見て！</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">cut</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">切る</div><div class="ex">Can you <b>cut</b> this bread?</div><div class="xj">このパンを切ってくれますか。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">family</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">家族</div><div class="ex">There are five people in my <b>family</b>.</div><div class="xj">私の家族は5人です。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">fun</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">楽しみ；楽しいこと</div><div class="ex">This game is a lot of <b>fun</b>.</div><div class="xj">このゲームはとても楽しいです。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">market</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">市場</div><div class="ex">We buy fish at the <b>market</b>.</div><div class="xj">私たちは市場で魚を買います。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">oyster</span><span class="ps">名</span></div><div class="ja">カキ（貝）</div><div class="ex">Hiroshima is famous for <b>oysters</b>.</div><div class="xj">広島はカキで有名です。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">streaming</span><span class="ps">名</span></div><div class="ja">（動画などの）配信；ストリーミング</div><div class="ex">Video <b>streaming</b> is popular now.</div><div class="xj">動画配信は今人気があります。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">tuna</span><span class="ps">名</span></div><div class="ja">マグロ</div><div class="ex">I like <b>tuna</b> sushi.</div><div class="xj">私はマグロのすしが好きです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</
