<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中1 英単語 第21回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第21回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.101〜106　No.601〜630</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">persimmon</span><span class="ps">名</span></div><div class="ja">カキ（果物）</div><div class="ex">My grandmother has a <b>persimmon</b> tree.</div><div class="xj">祖母はカキの木を持っています。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">shower</span><span class="ps">名</span></div><div class="ja">シャワー；にわか雨</div><div class="ex">I take a <b>shower</b> every morning.</div><div class="xj">私は毎朝シャワーを浴びます。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">sunny</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">晴れた；日の照る</div><div class="ex">It is <b>sunny</b> in Osaka.</div><div class="xj">大阪は晴れです。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">supermarket</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">スーパーマーケット</div><div class="ex">My mother often goes to the <b>supermarket</b>.</div><div class="xj">母はよくスーパーに行きます。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">today</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">今日（は）</div><div class="ex">I don’t have club practice <b>today</b>.</div><div class="xj">今日は部活の練習がありません。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">Why don’t we ～?</span><span class="ps">熟</span></div><div class="ja">～しませんか；～しようよ</div><div class="ex"><b>Why don’t we</b> go to the beach?</div><div class="xj">海へ行きませんか。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">almost</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">ほとんど；もう少しで</div><div class="ex"><b>Almost</b> all my friends like soccer.</div><div class="xj">私の友だちのほとんどみんながサッカーが好きです。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">front</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">前；正面</div><div class="ex">Let’s meet at the <b>front</b> of the station.</div><div class="xj">駅の正面で会おう。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">in front of ～</span><span class="ps">熟</span></div><div class="ja">～の前に</div><div class="ex">There is a big tree <b>in front of</b> my house.</div><div class="xj">私の家の前に大きな木があります。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">midnight</span><span class="ps">名</span></div><div class="ja">真夜中；午前0時</div><div class="ex">Don’t call me at <b>midnight</b>.</div><div class="xj">真夜中に電話しないで。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">mom</span><span class="ps">名</span></div><div class="ja">お母さん；ママ</div><div class="ex"><b>Mom</b>, where is my bag?</div><div class="xj">お母さん、私のかばんはどこ？</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">stand</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">立つ；立っている</div><div class="ex">Please <b>stand</b> here.</div><div class="xj">ここに立ってください。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">we’re</span><span class="ps">代</span></div><div class="ja">私たちは～です（we are の短縮形）</div><div class="ex"><b>We’re</b> good friends.</div><div class="xj">私たちは仲よしです。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">expensive</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">高価な；（値段が）高い</div><div class="ex">This watch is very <b>expensive</b>.</div><div class="xj">この腕時計はとても高価です。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">figure</span><span class="ps">名</span></div><div class="ja">人形；像；姿</div><div class="ex">He makes small <b>figures</b> from sugar.</div><div class="xj">彼は砂糖で小さな人形を作ります。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">France</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">フランス</div><div class="ex">Paris is in <b>France</b>.</div><div class="xj">パリはフランスにあります。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">important</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">大切な；重要な</div><div class="ex">Breakfast is very <b>important</b>.</div><div class="xj">朝食はとても大切です。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">January</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">1月</div><div class="ex">My birthday is in <b>January</b>.</div><div class="xj">私の誕生日は1月です。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">Mr.</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">～さん；～先生（男性に）</div><div class="ex"><b>Mr.</b> Sato is my father’s friend.</div><div class="xj">佐藤さんは父の友だちです。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">pastry chef</span><span class="ps">熟</span></div><div class="ja">パティシエ；菓子職人</div><div class="ex">My aunt is a <b>pastry chef</b>.</div><div class="xj">私のおばはパティシエです。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">put</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">置く</div><div class="ex"><b>Put</b> your bag here.</div><div class="xj">かばんをここに置いてください。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">skillful</span><span class="ps">形</span></div><div class="ja">じょうずな；熟練した</div><div class="ex">He is a <b>skillful</b> cook.</div><div class="xj">彼はじょうずな料理人です。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">tiny</span><span class="ps">形</span></div><div class="ja">とても小さい</div><div class="ex">Look at this <b>tiny</b> cake!</div><div class="xj">このとても小さいケーキを見て！</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">cut</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">切る</div><div class="ex">Can you <b>cut</b> this bread?</div><div class="xj">このパンを切ってくれますか。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">family</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">家族</div><div class="ex">There are five people in my <b>family</b>.</div><div class="xj">私の家族は5人です。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">fun</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">楽しみ；楽しいこと</div><div class="ex">This game is a lot of <b>fun</b>.</div><div class="xj">このゲームはとても楽しいです。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">market</span><span class="ps">名</span></div><div class="ja">市場</div><div class="ex">We buy fish at the <b>market</b>.</div><div class="xj">私たちは市場で魚を買います。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">oyster</span><span class="ps">名</span></div><div class="ja">カキ（貝）</div><div class="ex">Hiroshima is famous for <b>oysters</b>.</div><div class="xj">広島はカキで有名です。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">streaming</span><span class="ps">名</span></div><div class="ja">（動画などの）配信；ストリーミング</div><div class="ex">Video <b>streaming</b> is popular now.</div><div class="xj">動画配信は今人気があります。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">tuna</span><span class="ps">名</span></div><div class="ja">マグロ</div><div class="ex">I like <b>tuna</b> sushi.</div><div class="xj">私はマグロのすしが好きです。</div></button></li></ol><nav class="pn"><a href="../20/">← 第20回</a><a href="../22/">第22回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"601": 4.64, "602": 17.89, "603": 31.37, "604": 44.23, "605": 58.75, "606": 71.58, "607": 85.76, "608": 99.68, "609": 112.78, "610": 126.91, "611": 140.18, "612": 153.21, "613": 165.92, "614": 180.3, "615": 194.52, "616": 208.01, "617": 220.65, "618": 234.23, "619": 247.36, "620": 262.42, "621": 277.28, "622": 289.37, "623": 302.83, "624": 315.52, "625": 327.61, "626": 340.64, "627": 354.27, "628": 366.79, "629": 380.25, "630": 395.2};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
