</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第1回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.10〜13　No.1〜30</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">great</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">すばらしい；すごい</div><div class="ex">That’s <b>great</b>!</div><div class="xj">それはすごいね！</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">I</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私は；私が</div><div class="ex"><b>I</b> like music.</div><div class="xj">私は音楽が好きです。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">me</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私を；私に</div><div class="ex">Look at <b>me</b>.</div><div class="xj">私を見て。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">really</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">本当に</div><div class="ex">I <b>really</b> like soccer.</div><div class="xj">私はサッカーが本当に好きです。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">see</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">見える；見る；会う</div><div class="ex">I can <b>see</b> Mt. Fuji from here.</div><div class="xj">ここから富士山が見えます。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">I see.</span><span class="ps">熟</span></div><div class="ja">なるほど；わかりました</div><div class="ex">A: My birthday is in May.<br>B: <b>I see.</b></div><div class="xj">A：私の誕生日は5月です。B：なるほど。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">too</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">～も（また）</div><div class="ex">I like cats, <b>too</b>.</div><div class="xj">私はネコも好きです。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">are</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（you・we・they が主語で）～である；いる</div><div class="ex">You <b>are</b> my friend.</div><div class="xj">あなたは私の友だちです。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">be</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（～に）なる；（～で）ある；いる</div><div class="ex">I want to <b>be</b> a doctor.</div><div class="xj">私は医者になりたいです。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">birthday</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">誕生日</div><div class="ex">When is your <b>birthday</b>?</div><div class="xj">あなたの誕生日はいつですか。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">can</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～できる</div><div class="ex">I <b>can</b> swim fast.</div><div class="xj">私は速く泳ぐことができます。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">do</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">する</div><div class="ex">I <b>do</b> my homework after dinner.</div><div class="xj">私は夕食のあとに宿題をします。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">from</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～から；～出身の</div><div class="ex">I’m <b>from</b> Osaka.</div><div class="xj">私は大阪出身です。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">is</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（he・she・it などが主語で）～である；いる</div><div class="ex">This <b>is</b> my bag.</div><div class="xj">これは私のかばんです。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">like</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">～が好きである</div><div class="ex">I <b>like</b> apples.</div><div class="xj">私はりんごが好きです。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">Ms.</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">～さん；～先生（女性に）</div><div class="ex">This is <b>Ms.</b> Brown.</div><div class="xj">こちらはブラウン先生です。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">subject</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">教科</div><div class="ex">What <b>subject</b> do you like?</div><div class="xj">あなたはどの教科が好きですか。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">to</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～へ；～に</div><div class="ex">I want to go <b>to</b> Okinawa.</div><div class="xj">私は沖縄へ行きたいです。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">want</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">～がほしい；（want to ～で）～したい</div><div class="ex">I <b>want</b> a new bag.</div><div class="xj">私は新しいかばんがほしいです。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">what</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">何；何の</div><div class="ex"><b>What</b> food do you like?</div><div class="xj">あなたは何の食べ物が好きですか。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">when</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">いつ</div><div class="ex"><b>When</b> is the summer festival?</div><div class="xj">夏祭りはいつですか。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">where</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">どこに；どこで</div><div class="ex"><b>Where</b> do you want to go?</div><div class="xj">あなたはどこに行きたいですか。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">you</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">あなたは；あなたを；あなたたち</div><div class="ex"><b>You</b> are very kind.</div><div class="xj">あなたはとても親切ですね。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">your</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">あなたの；あなたたちの</div><div class="ex">Is this <b>your</b> pen?</div><div class="xj">これはあなたのペンですか。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">food</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">食べ物；料理</div><div class="ex">I like Italian <b>food</b>.</div><div class="xj">私はイタリア料理が好きです。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">get</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">手に入れる；得る</div><div class="ex">I want to <b>get</b> a new racket.</div><div class="xj">私は新しいラケットを手に入れたいです。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">get up</span><span class="ps">熟</span></div><div class="ja">起きる</div><div class="ex">I <b>get up</b> at six.</div><div class="xj">私は6時に起きます。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">have</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">持っている；飼っている；食べる</div><div class="ex">I <b>have</b> a dog.</div><div class="xj">私は犬を飼っています。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">play</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（スポーツを）する；演奏する；遊ぶ</div><div class="ex">I <b>play</b> tennis on Sundays.</div><div class="xj">私は日曜日にテニスをします。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">time</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">時間；時刻；～回</div><div class="ex">I don’t have <b>time</b> today.</div><div class="xj">今日は時間がありません。</div></button></li></ol><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"1": 4.33, "2": 16.78, "3": 28.78, "4": 41.14, "5": 53.56, "6": 66.59, "7": 82.21, "8": 95.19, "9": 110.14, "10": 123.88, "11": 135.93, "12": 148.48, "13": 161.22, "14": 174.89, "15": 190.39, "16": 203.01, "17": 217.1, "18": 229.88, "19": 243.37, "20": 258.53, "21": 271.01, "22": 283.48, "23": 295.7, "24": 308.68, "25": 321.3, "26": 334.3, "27": 347.11, "28": 359.4, "29": 372.21, "30": 386.27};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
