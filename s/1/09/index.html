</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第9回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.36〜39　No.241〜270</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">TV</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">テレビ</div><div class="ex">I watch <b>TV</b> after dinner.</div><div class="xj">私は夕食のあとでテレビを見ます。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">wash</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">洗う</div><div class="ex">I <b>wash</b> the dishes every night.</div><div class="xj">私は毎晩お皿を洗います。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">write</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">書く</div><div class="ex"><b>Write</b> your name here.</div><div class="xj">ここにあなたの名前を書いて。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">can’t</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～できない（cannot の短縮形）</div><div class="ex">I <b>can’t</b> sing well.</div><div class="xj">私は上手に歌うことができません。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">roll</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">転がす；転がる；巻く</div><div class="ex"><b>Roll</b> the ball to me.</div><div class="xj">私のほうへボールを転がして。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">that</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">あれ；あの</div><div class="ex">What’s <b>that</b>?</div><div class="xj">あれは何ですか。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">that’s</span><span class="ps">代</span></div><div class="ja">あれは～です；それは～です（that is の短縮形）</div><div class="ex"><b>That’s</b> my school.</div><div class="xj">あれは私の学校です。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">then</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">それでは；それなら；そのとき</div><div class="ex"><b>Then</b>, let’s start.</div><div class="xj">それでは、始めましょう。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">aunt</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">おば</div><div class="ex">I have an <b>aunt</b> in Tokyo.</div><div class="xj">私には東京におばがいます。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">brother</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">兄；弟；兄弟</div><div class="ex">Are you Ken’s <b>brother</b>?</div><div class="xj">あなたはケンのお兄さんですか。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">cousin</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">いとこ</div><div class="ex">We are <b>cousins</b>.</div><div class="xj">私たちはいとこ同士です。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">curry</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">カレー</div><div class="ex">Let’s make <b>curry</b> for dinner.</div><div class="xj">夕食にカレーを作ろう。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">dance</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">おどる；ダンスをする</div><div class="ex">Let’s <b>dance</b> to the music.</div><div class="xj">音楽に合わせておどろう。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">delicious</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">とてもおいしい</div><div class="ex">These cookies are <b>delicious</b>.</div><div class="xj">このクッキーはとてもおいしいです。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">fast</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">速く；速い</div><div class="ex">You can run very <b>fast</b>.</div><div class="xj">あなたはとても速く走れますね。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">father</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">父；お父さん</div><div class="ex">I play catch with my <b>father</b>.</div><div class="xj">私は父とキャッチボールをします。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">French</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">フランス語；フランスの</div><div class="ex">I want to learn <b>French</b>.</div><div class="xj">私はフランス語を習いたいです。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">grandfather</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">祖父；おじいさん</div><div class="ex">I visit my <b>grandfather</b> in summer.</div><div class="xj">私は夏に祖父をたずねます。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">grandmother</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">祖母；おばあさん</div><div class="ex">I write letters to my <b>grandmother</b>.</div><div class="xj">私は祖母に手紙を書きます。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">guitar</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ギター</div><div class="ex">I play the <b>guitar</b> in my room.</div><div class="xj">私は自分の部屋でギターをひきます。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">kilometer</span><span class="ps">名</span></div><div class="ja">キロメートル</div><div class="ex">I walk two <b>kilometers</b> to school.</div><div class="xj">私は学校まで2キロメートル歩きます。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">know</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">知っている</div><div class="ex">I <b>know</b> your sister.</div><div class="xj">私はあなたのお姉さんを知っています。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">magic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">手品；魔法</div><div class="ex">Can you do <b>magic</b>?</div><div class="xj">あなたは手品ができますか。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">map</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">地図</div><div class="ex">Let’s look at the <b>map</b>.</div><div class="xj">地図を見よう。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">mother</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">母；お母さん</div><div class="ex">I help my <b>mother</b> in the kitchen.</div><div class="xj">私は台所で母を手伝います。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">skate</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">スケートをする</div><div class="ex">Can you <b>skate</b>?</div><div class="xj">あなたはスケートをすることができますか。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">ski</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">スキーをする</div><div class="ex">We <b>ski</b> in Nagano every winter.</div><div class="xj">私たちは毎年冬に長野でスキーをします。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">soup</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">スープ</div><div class="ex">We have corn <b>soup</b> for breakfast.</div><div class="xj">私たちは朝食にコーンスープを飲みます。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">summer</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">夏</div><div class="ex">I love <b>summer</b>.</div><div class="xj">私は夏が大好きです。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">swim</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">泳ぐ</div><div class="ex">Let’s <b>swim</b> in the sea.</div><div class="xj">海で泳ごう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"241": 4.31, "242": 17.14, "243": 30.2, "244": 42.29, "245": 56.3, "246": 69.16, "247": 80.8, "248": 96.2, "249": 109.18, "250": 121.8, "251": 134.16, "252": 146.18, "253": 158.63, "254": 171.94, "255": 185.33, "256": 198.53, "257": 211.75, "258": 224.99, "259": 238.96, "260": 252.22, "261": 265.01, "262": 278.42, "263": 290.54, "264": 302.97, "265": 315.04, "266": 328.02, "267": 339.94, "268": 353.09, "269": 366.04, "270": 378.11}, "TE": {"241": 6.18, "242": 19.06, "243": 32.07, "244": 44.16, "245": 58.17, "246": 71.03, "247": 82.67, "248": 98.07, "249": 111.05, "250": 123.67, "251": 136.03, "252": 148.05, "253": 160.57, "254": 174.06, "255": 187.23, "256": 200.4, "257": 213.64, "258": 227.08, "259": 240.92, "260": 254.12, "261": 267.03, "262": 280.3, "263": 292.46, "264": 304.84, "265": 316.91, "266": 329.91, "267": 341.81, "268": 354.96, "269": 367.94, "270": 380.01}, "Q": [[241, "テレビ", "TV"], [242, "洗う", "wash"], [243, "書く", "write"], [244, "～できない（cannot の短縮形）", "can’t"], [245, "転がす", "roll"], [246, "あれ", "that"], [247, "あれは～です", "that’s"], [248, "それでは", "then"], [249, "おば", "aunt"], [250, "兄", "brother"], [251, "いとこ", "cousin"], [252, "カレー", "curry"], [253, "おどる", "dance"], [254, "とてもおいしい", "delicious"], [255, "速く", "fast"], [256, "父", "father"], [257, "フランス語", "French"], [258, "祖父", "grandfather"], [259, "祖母", "grandmother"], [260, "ギター", "guitar"], [261, "キロメートル", "kilometer"], [262, "知っている", "know"], [263, "手品", "magic"], [264, "地図", "map"], [265, "母", "mother"], [266, "スケートをする", "skate"], [267, "スキーをする", "ski"], [268, "スープ", "soup"], [269, "夏", "summer"], [270, "泳ぐ", "swim"]], "KEY": "
