5"><div class="top"><span class="no">845</span><span class="en">sixty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">60（の）</div><div class="ex">There are <b>sixty</b> minutes in an hour.</div><div class="xj">1時間は60分です。</div></button></li><li><button class="w" data-no="846"><div class="top"><span class="no">846</span><span class="en">snow</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">雪；雪が降る</div><div class="ex">We had a lot of <b>snow</b> last winter.</div><div class="xj">去年の冬は雪がたくさん降りました。</div></button></li><li><button class="w" data-no="847"><div class="top"><span class="no">847</span><span class="en">spring</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">春</div><div class="ex"><b>Spring</b> is my favorite season.</div><div class="xj">春は私の大好きな季節です。</div></button></li><li><button class="w" data-no="848"><div class="top"><span class="no">848</span><span class="en">tenth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">10番目（の）；（日付の）10日</div><div class="ex">Today is the <b>tenth</b> day of our trip.</div><div class="xj">今日は旅行の10日目です。</div></button></li><li><button class="w" data-no="849"><div class="top"><span class="no">849</span><span class="en">thirteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">13（の）</div><div class="ex">My brother is <b>thirteen</b> years old.</div><div class="xj">私の兄は13歳です。</div></button></li><li><button class="w" data-no="850"><div class="top"><span class="no">850</span><span class="en">thousand</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">1000（の）；千</div><div class="ex">This T-shirt is two <b>thousand</b> yen.</div><div class="xj">このTシャツは2千円です。</div></button></li><li><button class="w" data-no="851"><div class="top"><span class="no">851</span><span class="en">Thursday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">木曜日</div><div class="ex">We have P.E. on <b>Thursdays</b>.</div><div class="xj">毎週木曜日に体育があります。</div></button></li><li><button class="w" data-no="852"><div class="top"><span class="no">852</span><span class="en">Tuesday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">火曜日</div><div class="ex">Ken goes to the library on <b>Tuesdays</b>.</div><div class="xj">ケンは毎週火曜日に図書館に行きます。</div></button></li><li><button class="w" data-no="853"><div class="top"><span class="no">853</span><span class="en">twelfth</span><span class="ps">数</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">12番目（の）；（日付の）12日</div><div class="ex">Today is my <b>twelfth</b> birthday.</div><div class="xj">今日は私の12歳の誕生日です。</div></button></li><li><button class="w" data-no="854"><div class="top"><span class="no">854</span><span class="en">twelve</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">12（の）</div><div class="ex">There are <b>twelve</b> months in a year.</div><div class="xj">1年は12か月あります。</div></button></li><li><button class="w" data-no="855"><div class="top"><span class="no">855</span><span class="en">weather</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">天気；天候</div><div class="ex">How is the <b>weather</b> in Osaka?</div><div class="xj">大阪の天気はどうですか。</div></button></li><li><button class="w" data-no="856"><div class="top"><span class="no">856</span><span class="en">wind</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">風</div><div class="ex">The <b>wind</b> was strong yesterday.</div><div class="xj">昨日は風が強かったです。</div></button></li><li><button class="w" data-no="857"><div class="top"><span class="no">857</span><span class="en">alligator</span><span class="ps">名</span></div><div class="ja">ワニ（アリゲーター）</div><div class="ex">We saw an <b>alligator</b> at the zoo.</div><div class="xj">私たちは動物園でワニを見ました。</div></button></li><li><button class="w" data-no="858"><div class="top"><span class="no">858</span><span class="en">apricot</span><span class="ps">名</span></div><div class="ja">アンズ</div><div class="ex">This <b>apricot</b> jam is sweet.</div><div class="xj">このアンズのジャムは甘いです。</div></button></li><li><button class="w" data-no="859"><div class="top"><span class="no">859</span><span class="en">avocado</span><span class="ps">名</span></div><div class="ja">アボカド</div><div class="ex">Lisa eats an <b>avocado</b> every morning.</div><div class="xj">リサは毎朝アボカドを食べます。</div></button></li><li><button class="w" data-no="860"><div class="top"><span class="no">860</span><span class="en">baby</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">赤ちゃん</div><div class="ex">My aunt’s <b>baby</b> is very small.</div><div class="xj">おばの赤ちゃんはとても小さいです。</div></button></li><li><button class="w" data-no="861"><div class="top"><span class="no">861</span><span class="en">beetle</span><span class="ps">名</span></div><div class="ja">カブトムシ；甲虫</div><div class="ex">My brother caught a big <b>beetle</b> in the forest.</div><div class="xj">弟は森で大きなカブトムシをつかまえました。</div></button></li><li><button class="w" data-no="862"><div class="top"><span class="no">862</span><span class="en">carp</span><span class="ps">名</span></div><div class="ja">コイ</div><div class="ex">There are many <b>carp</b> in the pond.</div><div class="xj">池にはたくさんのコイがいます。</div></button></li><li><button class="w" data-no="863"><div class="top"><span class="no">863</span><span class="en">cow</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">牛；雌牛</div><div class="ex">That <b>cow</b> gives a lot of milk.</div><div class="xj">あの牛はたくさん牛乳を出します。</div></button></li><li><button class="w" data-no="864"><div class="top"><span class="no">864</span><span class="en">crab</span><span class="ps">名</span></div><div class="ja">カニ</div><div class="ex">We found a small <b>crab</b> on the beach.</div><div class="xj">私たちは浜辺で小さなカニを見つけました。</div></button></li><li><button class="w" data-no="865"><div class="top"><span class="no">865</span><span class="en">crocodile</span><span class="ps">名</span></div><div class="ja">ワニ（クロコダイル）</div><div class="ex">A <b>crocodile</b> has strong teeth.</div><div class="xj">ワニは強い歯を持っています。</div></button></li><li><button class="w" data-no="866"><div class="top"><span class="no">866</span><span class="en">donkey</span><span class="ps">名</span></div><div class="ja">ロバ</div><div class="ex">A <b>donkey</b> is eating grass.</div><div class="xj">ロバが草を食べています。</div></button></li><li><button class="w" data-no="867"><div class="top"><span class="no">867</span><span class="en">dragon fruit</span><span class="ps">名</span></div><div class="ja">ドラゴンフルーツ</div><div class="ex">I ate <b>dragon fruit</b> in Okinawa.</div><div class="xj">私は沖縄でドラゴンフルーツを食べました。</div></button></li><li><button class="w" data-no="868"><div class="top"><span class="no">868</span><span class="en">flamingo</span><span class="ps">名</span></div><div class="ja">フラミンゴ</div><div class="ex"><b>Flamingos</b> often stand on one leg.</div><div class="xj">フラミンゴはよく片足で立ちます。</div></button></li><li><button class="w" data-no="869"><div class="top"><span class="no">869</span><span class="en">grapefruit</span><span class="ps">名</span></div><div class="ja">グレープフルーツ</div><div class="ex">I eat a <b>grapefruit</b> for breakfast.</div><div class="xj">私は朝食にグレープフルーツを食べます。</div></button></li><li><button class="w" data-no="870"><div class="top"><span class="no">870</span><span class="en">hawk</span><span class="ps">名</span></div><div class="ja">タカ</div><div class="ex">A <b>hawk</b> is flying over the hill.</div><div class="xj">タカが丘の上を飛んでいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../28/">← 第28回</a><a href="../30/">第
