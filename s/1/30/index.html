</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第30回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.142〜143　No.871〜900</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../30.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="871"><div class="top"><span class="no">871</span><span class="en">hippo</span><span class="ps">名</span></div><div class="ja">カバ</div><div class="ex"><b>Hippos</b> live in Africa.</div><div class="xj">カバはアフリカにすんでいます。</div></button></li><li><button class="w" data-no="872"><div class="top"><span class="no">872</span><span class="en">industrial arts</span><span class="ps">名</span></div><div class="ja">技術（教科）</div><div class="ex">We made a chair in <b>industrial arts</b>.</div><div class="xj">私たちは技術の授業でいすを作りました。</div></button></li><li><button class="w" data-no="873"><div class="top"><span class="no">873</span><span class="en">Japanese apricot</span><span class="ps">名</span></div><div class="ja">ウメ（梅）</div><div class="ex">We have a <b>Japanese apricot</b> tree in our garden.</div><div class="xj">うちの庭には梅の木があります。</div></button></li><li><button class="w" data-no="874"><div class="top"><span class="no">874</span><span class="en">kiwi fruit</span><span class="ps">名</span></div><div class="ja">キウイフルーツ</div><div class="ex"><b>Kiwi fruit</b> is green inside.</div><div class="xj">キウイフルーツは中が緑色です。</div></button></li><li><button class="w" data-no="875"><div class="top"><span class="no">875</span><span class="en">mandarin orange</span><span class="ps">名</span></div><div class="ja">みかん</div><div class="ex">We eat <b>mandarin oranges</b> in winter.</div><div class="xj">私たちは冬にみかんを食べます。</div></button></li><li><button class="w" data-no="876"><div class="top"><span class="no">876</span><span class="en">mango</span><span class="ps">名</span></div><div class="ja">マンゴー</div><div class="ex">This <b>mango</b> is very sweet.</div><div class="xj">このマンゴーはとても甘いです。</div></button></li><li><button class="w" data-no="877"><div class="top"><span class="no">877</span><span class="en">moral education</span><span class="ps">名</span></div><div class="ja">道徳（教科）</div><div class="ex">We have <b>moral education</b> on Wednesdays.</div><div class="xj">毎週水曜日に道徳があります。</div></button></li><li><button class="w" data-no="878"><div class="top"><span class="no">878</span><span class="en">papaya</span><span class="ps">名</span></div><div class="ja">パパイヤ</div><div class="ex">Tom bought a <b>papaya</b> at the market.</div><div class="xj">トムは市場でパパイヤを買いました。</div></button></li><li><button class="w" data-no="879"><div class="top"><span class="no">879</span><span class="en">pear</span><span class="ps">名</span></div><div class="ja">西洋ナシ；ナシ</div><div class="ex">Emi is eating a <b>pear</b>.</div><div class="xj">エミは西洋ナシを食べています。</div></button></li><li><button class="w" data-no="880"><div class="top"><span class="no">880</span><span class="en">period for integrated studies</span><span class="ps">名</span></div><div class="ja">総合的な学習の時間</div><div class="ex">We have the <b>period for integrated studies</b> today.</div><div class="xj">今日は総合的な学習の時間があります。</div></button></li><li><button class="w" data-no="881"><div class="top"><span class="no">881</span><span class="en">rhino</span><span class="ps">名</span></div><div class="ja">サイ</div><div class="ex"><b>Rhinos</b> are big and strong.</div><div class="xj">サイは大きくて力が強いです。</div></button></li><li><button class="w" data-no="882"><div class="top"><span class="no">882</span><span class="en">seagull</span><span class="ps">名</span></div><div class="ja">カモメ</div><div class="ex">Many <b>seagulls</b> are flying over the sea.</div><div class="xj">たくさんのカモメが海の上を飛んでいます。</div></button></li><li><button class="w" data-no="883"><div class="top"><span class="no">883</span><span class="en">seal</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">アザラシ</div><div class="ex"><b>Seals</b> are good swimmers.</div><div class="xj">アザラシは泳ぎが上手です。</div></button></li><li><button class="w" data-no="884"><div class="top"><span class="no">884</span><span class="en">special activities</span><span class="ps">名</span></div><div class="ja">特別活動</div><div class="ex">We had a class meeting in <b>special activities</b>.</div><div class="xj">特別活動の時間に学級会をしました。</div></button></li><li><button class="w" data-no="885"><div class="top"><span class="no">885</span><span class="en">spider</span><span class="ps">名</span></div><div class="ja">クモ</div><div class="ex">There is a <b>spider</b> on the wall!</div><div class="xj">かべにクモがいる！</div></button></li><li><button class="w" data-no="886"><div class="top"><span class="no">886</span><span class="en">squirrel</span><span class="ps">名</span></div><div class="ja">リス</div><div class="ex">I saw a <b>squirrel</b> in the park.</div><div class="xj">私は公園でリスを見ました。</div></button></li><li><button class="w" data-no="887"><div class="top"><span class="no">887</span><span class="en">watermelon</span><span class="ps">名</span></div><div class="ja">スイカ</div><div class="ex">I like cold <b>watermelon</b> in summer.</div><div class="xj">私は夏に冷たいスイカを食べるのが好きです。</div></button></li><li><button class="w" data-no="888"><div class="top"><span class="no">888</span><span class="en">whale</span><span class="ps">名</span></div><div class="ja">クジラ</div><div class="ex">We saw a big <b>whale</b> from the ship.</div><div class="xj">私たちは船から大きなクジラを見ました。</div></button></li><li><button class="w" data-no="889"><div class="top"><span class="no">889</span><span class="en">accordion</span><span class="ps">名</span></div><div class="ja">アコーディオン</div><div class="ex">My uncle plays the <b>accordion</b> well.</div><div class="xj">私のおじはアコーディオンを上手にひきます。</div></button></li><li><button class="w" data-no="890"><div class="top"><span class="no">890</span><span class="en">beach</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">浜辺；ビーチ</div><div class="ex">There are many people on the <b>beach</b>.</div><div class="xj">浜辺にはたくさんの人がいます。</div></button></li><li><button class="w" data-no="891"><div class="top"><span class="no">891</span><span class="en">castanet</span><span class="ps">名</span></div><div class="ja">カスタネット</div><div class="ex">The children are playing the <b>castanets</b>.</div><div class="xj">子どもたちがカスタネットをたたいています。</div></button></li><li><button class="w" data-no="892"><div class="top"><span class="no">892</span><span class="en">club activities</span><span class="ps">名</span></div><div class="ja">部活動</div><div class="ex">We have <b>club activities</b> after school.</div><div class="xj">放課後に部活動があります。</div></button></li><li><button class="w" data-no="893"><div class="top"><span class="no">893</span><span class="en">go fishing</span><span class="ps">熟</span></div><div class="ja">釣りに行く</div><div class="ex">My father and I <b>went fishing</b> in the river.</div><div class="xj">父と私は川へ釣りに行きました。</div></button></li><li><button class="w" data-no="894"><div class="top"><span class="no">894</span><span class="en">fried noodles</span><span class="ps">名</span></div><div class="ja">焼きそば</div><div class="ex">Dad cooked <b>fried noodles</b> for lunch.</div><div class="xj">父が昼食に焼きそばを作りました。</div></button></li><li><button class="w" data-no="895"><div class="top"><span class="no">895</span><span class="en">fried rice</span><span class="ps">名</span></div><div class="ja">チャーハン；焼きめし</div><div class="ex">My mother makes good <b>fried rice</b>.</div><div class="xj">母はおいしいチャーハンを作ります。</div></button></li><li><button class="w" data-no="896"><div class="top"><span class="no">896</span><span class="en">gymnastics</span><span class="ps">名</span></div><div class="ja">体操</div><div class="ex">Lisa is good at <b>gymnastics</b>.</div><div class="xj">リサは体操が得意です。</div></button></li><li><button class="w" data-no="897"><div class="top"><span class="no">897</span><span class="en">harmonica</span><span class="ps">名</span></div><div class="ja">ハーモニカ</div><div class="ex">Tom can play the <b>harmonica</b>.</div><div class="xj">トムはハーモニカをふくことができます。</div></button></li><li><button class="w" data-no="898"><div class="top"><span class="no">898</span><span class="en">hockey</span><span class="ps">名</span></div><div class="ja">ホッケー</div><div class="ex">My brother plays <b>hockey</b> on Sundays.</div><div class="xj">兄は毎週日曜日にホッケーをします。</div></button></li><li><button class="w" data-no="899"><div class="top"><span class="no">899</span><span class="en">letter</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">手紙；文字</div><div class="ex">I wrote a <b>letter</b> to my grandmother.</div><div class="xj">私は祖母に手紙を書きました。</div></button></li><li><button class="w" data-no="900"><div class="top"><span class="no">900</span><span class="en">organ</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">オルガン</div><div class="ex">Ms. Sato plays the <b>organ</b> in music class.</div><div class="xj">佐藤先生は音楽の授業でオルガンをひきます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../29/">← 第29回</a><a href="../31/">第31回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"871": 4.5, "872": 17.02, "873": 31.66, "874": 47.04, "875": 60.74, "876": 75.06, "877": 88.0, "878": 103.02, "879": 116.04, "880": 129.17, "881": 146.61, "882": 159.4, "883": 172.98, "884": 185.6, "885": 201.05, "886": 213.77, "887": 226.77, "888
