</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第32回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.144〜144　No.931〜945</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../32.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="931"><div class="top"><span class="no">931</span><span class="en">reliable</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">頼りになる；信頼できる</div><div class="ex">Our captain is very <b>reliable</b>.</div><div class="xj">私たちのキャプテンはとても頼りになります。</div></button></li><li><button class="w" data-no="932"><div class="top"><span class="no">932</span><span class="en">responsible</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">責任感のある；責任がある</div><div class="ex">Yuki is a <b>responsible</b> student.</div><div class="xj">ユキは責任感のある生徒です。</div></button></li><li><button class="w" data-no="933"><div class="top"><span class="no">933</span><span class="en">rude</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">失礼な；無礼な</div><div class="ex">Sorry, I was <b>rude</b> to you.</div><div class="xj">ごめんね、あなたに失礼だったね。</div></button></li><li><button class="w" data-no="934"><div class="top"><span class="no">934</span><span class="en">selfish</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">わがままな；自分勝手な</div><div class="ex">Don’t be <b>selfish</b>, Ken.</div><div class="xj">ケン、わがままを言わないで。</div></button></li><li><button class="w" data-no="935"><div class="top"><span class="no">935</span><span class="en">sensitive</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">敏感な；繊細な</div><div class="ex">Dogs have <b>sensitive</b> noses.</div><div class="xj">犬は敏感な鼻を持っています。</div></button></li><li><button class="w" data-no="936"><div class="top"><span class="no">936</span><span class="en">sociable</span><span class="ps">形</span></div><div class="ja">社交的な；人づきあいのよい</div><div class="ex">Lisa is <b>sociable</b> and has many friends.</div><div class="xj">リサは社交的で、友だちがたくさんいます。</div></button></li><li><button class="w" data-no="937"><div class="top"><span class="no">937</span><span class="en">station</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">駅</div><div class="ex">Where is the <b>station</b>?</div><div class="xj">駅はどこですか。</div></button></li><li><button class="w" data-no="938"><div class="top"><span class="no">938</span><span class="en">strict</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">厳しい</div><div class="ex">Our coach is very <b>strict</b>.</div><div class="xj">私たちのコーチはとても厳しいです。</div></button></li><li><button class="w" data-no="939"><div class="top"><span class="no">939</span><span class="en">swimming pool</span><span class="ps">名</span></div><div class="ja">（水泳用の）プール</div><div class="ex">There is a big <b>swimming pool</b> in our town.</div><div class="xj">私たちの町には大きなプールがあります。</div></button></li><li><button class="w" data-no="940"><div class="top"><span class="no">940</span><span class="en">talented</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">才能のある</div><div class="ex">Emi is a <b>talented</b> pianist.</div><div class="xj">エミは才能のあるピアニストです。</div></button></li><li><button class="w" data-no="941"><div class="top"><span class="no">941</span><span class="en">talkative</span><span class="ps">形</span></div><div class="ja">おしゃべりな</div><div class="ex">My sister is <b>talkative</b> at dinner.</div><div class="xj">私の姉は夕食のときおしゃべりです。</div></button></li><li><button class="w" data-no="942"><div class="top"><span class="no">942</span><span class="en">temple</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">寺</div><div class="ex">We visited an old <b>temple</b> in Nara.</div><div class="xj">私たちは奈良の古い寺を訪れました。</div></button></li><li><button class="w" data-no="943"><div class="top"><span class="no">943</span><span class="en">unkind</span><span class="ps">形</span></div><div class="ja">不親切な；思いやりのない</div><div class="ex">Don’t be <b>unkind</b> to your friends.</div><div class="xj">友だちに不親切にしてはいけません。</div></button></li><li><button class="w" data-no="944"><div class="top"><span class="no">944</span><span class="en">warm-hearted</span><span class="ps">形</span></div><div class="ja">心の温かい；思いやりのある</div><div class="ex">Mr. Sato is a <b>warm-hearted</b> teacher.</div><div class="xj">佐藤先生は心の温かい先生です。</div></button></li><li><button class="w" data-no="945"><div class="top"><span class="no">945</span><span class="en">wise</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">賢い；賢明な</div><div class="ex">My grandfather is a <b>wise</b> man.</div><div class="xj">私の祖父は賢い人です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../31/">← 第31回</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"931": 4.67, "932": 19.06, "933": 34.2, "934": 47.69, "935": 62.08, "936": 76.19, "937": 91.81, "938": 104.1, "939": 116.88, "940": 131.54, "941": 144.6, "942": 157.62, "943": 170.68, "944": 185.12, "945": 200.55}, "TE": {"931": 6.71, "932": 21.22, "933": 36.08, "934": 49.8, "935": 64.15, "936": 78.3, "937": 93.78, "938": 106.02, "939": 119.14, "940": 133.46, "941": 146.54, "942": 159.5, "943": 172.76, "944": 187.18, "945":
