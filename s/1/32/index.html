<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中1 英単語 第32回｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
header { background: var(--red); color: #fff; padding: 14px 16px 12px; }
header .brand { font-size: 13px; opacity: .9; letter-spacing: .1em; }
header h1 { margin: 2px 0 0; font-size: 24px; }
header .sub { font-size: 13px; opacity: .95; margin-top: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
.player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
audio { width: 100%; }
.row2 { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; min-height: 46px; border: 2px solid var(--red); background: #fff; color: var(--red); border-radius: 10px; font-size: 16px; font-weight: 700; }
.btn.on { background: var(--red); color: #fff; }
.hint { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
ol.words { list-style: none; margin: 8px 0 0; padding: 0; }
.w { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; font: inherit; color: inherit; }
.w.now { border-color: var(--red); box-shadow: 0 0 0 2px var(--red) inset; }
.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.no { font-size: 13px; color: var(--sub); min-width: 2.2em; }
.en { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
.ps { font-size: 12px; border: 1px solid #999; border-radius: 4px; padding: 0 4px; color: #444; }
.star { color: var(--red); font-size: 14px; }
.ja { font-size: 16px; font-weight: 700; margin-top: 4px; }
.ex { font-family: Georgia, serif; font-size: 15px; margin-top: 6px; color: #333; }
.ex b { text-decoration: underline; }
.xj { font-size: 13px; color: var(--sub); margin-top: 2px; }
body.hide .ja, body.hide .xj { visibility: hidden; }
nav.pn { display: flex; gap: 8px; margin-top: 18px; }
nav.pn a { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; }
ul.list { list-style: none; padding: 0; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
ul.list a { display: block; padding: 14px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); }
ul.list b { display: block; font-size: 18px; } ul.list span { font-size: 12px; color: var(--sub); }
footer { text-align: center; font-size: 12px; color: var(--sub); padding: 24px 16px 32px; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #eee; --sub: #aaa; --line: #333; --bg: #121212; --card: #1d1d1d; }
  .btn, nav.pn a, ul.list a { background: #1d1d1d; } .ex { color: #ddd; } .ps { color: #ccc; }
}
</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第32回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.144〜144　No.931〜945</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../32.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="931"><div class="top"><span class="no">931</span><span class="en">reliable</span><span class="ps">形</span></div><div class="ja">頼りになる；信頼できる</div><div class="ex">Our captain is very <b>reliable</b>.</div><div class="xj">私たちのキャプテンはとても頼りになります。</div></button></li><li><button class="w" data-no="932"><div class="top"><span class="no">932</span><span class="en">responsible</span><span class="ps">形</span></div><div class="ja">責任感のある；責任がある</div><div class="ex">Yuki is a <b>responsible</b> student.</div><div class="xj">ユキは責任感のある生徒です。</div></button></li><li><button class="w" data-no="933"><div class="top"><span class="no">933</span><span class="en">rude</span><span class="ps">形</span></div><div class="ja">失礼な；無礼な</div><div class="ex">Sorry, I was <b>rude</b> to you.</div><div class="xj">ごめんね、あなたに失礼だったね。</div></button></li><li><button class="w" data-no="934"><div class="top"><span class="no">934</span><span class="en">selfish</span><span class="ps">形</span></div><div class="ja">わがままな；自分勝手な</div><div class="ex">Don’t be <b>selfish</b>, Ken.</div><div class="xj">ケン、わがままを言わないで。</div></button></li><li><button class="w" data-no="935"><div class="top"><span class="no">935</span><span class="en">sensitive</span><span class="ps">形</span></div><div class="ja">敏感な；繊細な</div><div class="ex">Dogs have <b>sensitive</b> noses.</div><div class="xj">犬は敏感な鼻を持っています。</div></button></li><li><button class="w" data-no="936"><div class="top"><span class="no">936</span><span class="en">sociable</span><span class="ps">形</span></div><div class="ja">社交的な；人づきあいのよい</div><div class="ex">Lisa is <b>sociable</b> and has many friends.</div><div class="xj">リサは社交的で、友だちがたくさんいます。</div></button></li><li><button class="w" data-no="937"><div class="top"><span class="no">937</span><span class="en">station</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">駅</div><div class="ex">Where is the <b>station</b>?</div><div class="xj">駅はどこですか。</div></button></li><li><button class="w" data-no="938"><div class="top"><span class="no">938</span><span class="en">strict</span><span class="ps">形</span></div><div class="ja">厳しい</div><div class="ex">Our coach is very <b>strict</b>.</div><div class="xj">私たちのコーチはとても厳しいです。</div></button></li><li><button class="w" data-no="939"><div class="top"><span class="no">939</span><span class="en">swimming pool</span><span class="ps">名</span></div><div class="ja">（水泳用の）プール</div><div class="ex">There is a big <b>swimming pool</b> in our town.</div><div class="xj">私たちの町には大きなプールがあります。</div></button></li><li><button class="w" data-no="940"><div class="top"><span class="no">940</span><span class="en">talented</span><span class="ps">形</span></div><div class="ja">才能のある</div><div class="ex">Emi is a <b>talented</b> pianist.</div><div class="xj">エミは才能のあるピアニストです。</div></button></li><li><button class="w" data-no="941"><div class="top"><span class="no">941</span><span class="en">talkative</span><span class="ps">形</span></div><div class="ja">おしゃべりな</div><div class="ex">My sister is <b>talkative</b> at dinner.</div><div class="xj">私の姉は夕食のときおしゃべりです。</div></button></li><li><button class="w" data-no="942"><div class="top"><span class="no">942</span><span class="en">temple</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">寺</div><div class="ex">We visited an old <b>temple</b> in Nara.</div><div class="xj">私たちは奈良の古い寺を訪れました。</div></button></li><li><button class="w" data-no="943"><div class="top"><span class="no">943</span><span class="en">unkind</span><span class="ps">形</span></div><div class="ja">不親切な；思いやりのない</div><div class="ex">Don’t be <b>unkind</b> to your friends.</div><div class="xj">友だちに不親切にしてはいけません。</div></button></li><li><button class="w" data-no="944"><div class="top"><span class="no">944</span><span class="en">warm-hearted</span><span class="ps">形</span></div><div class="ja">心の温かい；思いやりのある</div><div class="ex">Mr. Sato is a <b>warm-hearted</b> teacher.</div><div class="xj">佐藤先生は心の温かい先生です。</div></button></li><li><button class="w" data-no="945"><div class="top"><span class="no">945</span><span class="en">wise</span><span class="ps">形</span></div><div class="ja">賢い；賢明な</div><div class="ex">My grandfather is a <b>wise</b> man.</div><div class="xj">私の祖父は賢い人です。</div></button></li></ol><nav class="pn"><a href="../31/">← 第31回</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"931": 4.67, "932": 19.06, "933": 34.2, "934": 47.69, "935": 62.08, "936": 76.19, "937": 91.81, "938": 104.1, "939": 116.88, "940": 131.54, "941": 144.6, "942": 157.62, "943": 170.68, "944": 185.12, "945": 200.55};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
