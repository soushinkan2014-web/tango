</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第23回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.111〜114　No.661〜690</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">a lot</span><span class="ps">熟</span></div><div class="ja">たくさん；とても</div><div class="ex">I ate <b>a lot</b> at the party.</div><div class="xj">私はパーティーでたくさん食べました。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">medical</span><span class="ps">形</span></div><div class="ja">医療の；医学の</div><div class="ex">He works at a <b>medical</b> center.</div><div class="xj">彼は医療センターで働いています。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">take a picture</span><span class="ps">熟</span></div><div class="ja">写真をとる</div><div class="ex">We <b>took a picture</b> at the zoo.</div><div class="xj">私たちは動物園で写真をとりました。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">have a good time</span><span class="ps">熟</span></div><div class="ja">楽しい時を過ごす</div><div class="ex">We <b>had a good time</b> at the beach.</div><div class="xj">私たちは海で楽しい時を過ごしました。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">took</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">連れて行った；取った（take の過去形）</div><div class="ex">Ken <b>took</b> his dog to the park.</div><div class="xj">ケンは犬を公園に連れて行きました。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">vet</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">獣医</div><div class="ex">My aunt is a <b>vet</b>.</div><div class="xj">私のおばは獣医です。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">take a walk</span><span class="ps">熟</span></div><div class="ja">散歩する</div><div class="ex">We <b>took a walk</b> in the park.</div><div class="xj">私たちは公園を散歩しました。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">went</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">行った（go の過去形）</div><div class="ex">I <b>went</b> to the library yesterday.</div><div class="xj">私は昨日図書館へ行きました。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">win</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">勝つ；（賞などを）得る</div><div class="ex">I want to <b>win</b> the game.</div><div class="xj">私はその試合に勝ちたいです。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">brrr</span><span class="ps">間</span></div><div class="ja">ブルブル（寒いときの声）</div><div class="ex"><b>Brrr</b>, I need my coat.</div><div class="xj">ブルブル、コートがほしい。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">cold</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">寒い；冷たい</div><div class="ex">It is very <b>cold</b> in Hokkaido in winter.</div><div class="xj">冬の北海道はとても寒いです。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">country</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">国</div><div class="ex">Canada is a big <b>country</b>.</div><div class="xj">カナダは大きな国です。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">Pretty good.</span><span class="ps">熟</span></div><div class="ja">なかなかいいよ；まあまあだよ</div><div class="ex">A: How’s your new school?<br>B: <b>Pretty good.</b></div><div class="xj">A：新しい学校はどう？B：なかなかいいよ。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">How’s it going?</span><span class="ps">熟</span></div><div class="ja">調子はどう？</div><div class="ex">A: Hi, Ken. <b>How’s it going?</b><br>B: Great!</div><div class="xj">A：やあ、ケン。調子はどう？B：最高だよ！</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">how’s</span><span class="ps">副</span></div><div class="ja">～はどうですか（how is の短縮形）</div><div class="ex"><b>How’s</b> the weather in Sydney?</div><div class="xj">シドニーの天気はどうですか。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">into</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の中へ</div><div class="ex">The cat went <b>into</b> the box.</div><div class="xj">ネコは箱の中へ入りました。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">invent</span><span class="ps">動</span></div><div class="ja">発明する</div><div class="ex">Who <b>invented</b> the telephone?</div><div class="xj">だれが電話を発明しましたか。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">jealous</span><span class="ps">形</span></div><div class="ja">うらやましい；しっとして</div><div class="ex">I am so <b>jealous</b> of you.</div><div class="xj">私はあなたがうらやましいです。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">lake</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">湖</div><div class="ex">We swam in the <b>lake</b>.</div><div class="xj">私たちは湖で泳ぎました。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">pretty</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">かなり；けっこう</div><div class="ex">This test is <b>pretty</b> easy.</div><div class="xj">このテストはかなり簡単です。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">sauna</span><span class="ps">名</span></div><div class="ja">サウナ</div><div class="ex">Many houses in Finland have a <b>sauna</b>.</div><div class="xj">フィンランドの多くの家にはサウナがあります。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">visit</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">訪れる；訪ねる</div><div class="ex">I <b>visited</b> my grandmother last Sunday.</div><div class="xj">私はこの前の日曜日に祖母を訪ねました。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">week</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">週；1週間</div><div class="ex">We have five English classes a <b>week</b>.</div><div class="xj">私たちは1週間に5回英語の授業があります。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">bought</span><span class="ps">動</span></div><div class="ja">買った（buy の過去形）</div><div class="ex">I <b>bought</b> a new bike.</div><div class="xj">私は新しい自転車を買いました。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">course</span><span class="ps">名</span></div><div class="ja">コース；進路；講座</div><div class="ex">We run on this <b>course</b>.</div><div class="xj">私たちはこのコースを走ります。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">of course</span><span class="ps">熟</span></div><div class="ja">もちろん</div><div class="ex">A: Can you help me?<br>B: <b>Of course</b>.</div><div class="xj">A：手伝ってくれる？B：もちろん。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">find out</span><span class="ps">熟</span></div><div class="ja">わかる；（調べて）見つけ出す</div><div class="ex">I <b>found out</b> his name.</div><div class="xj">私は彼の名前がわかりました。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">found</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">見つけた（find の過去形）</div><div class="ex">I <b>found</b> my key under the bed.</div><div class="xj">私はベッドの下でかぎを見つけました。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">once</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">1回；一度；かつて</div><div class="ex">I practice the piano <b>once</b> a week.</div><div class="xj">私は週に1回ピアノを練習します。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">out</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">外へ；外に</div><div class="ex">Let’s go <b>out</b> for lunch.</div><div class="xj">お昼を食べに外へ出かけよう。</div></button></li></ol><nav class="pn"><a href="../22/">← 第22回</a><a href="../24/">第24回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"661": 4.69, "662": 17.48, "663": 30.46, "664": 43.68, "665": 57.81, "666": 72.35, "667": 84.64, "668": 97.57, "669": 111.22, "670": 124.25, "671": 137.8, "672": 151.77, "673": 164.44, "674": 180.48, "675": 197.28, "676": 211.67, "677": 224.63, "678": 237.2, "679": 251.14, "680": 263.4, "681": 276.72, "682": 290.13, "683": 304.04, "684": 317.84, "685": 330.6, "686": 343.51, "687": 358.02, "688": 371.99, "689": 385.88, "690": 399.46};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
