><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">clean</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">掃除する；きれいにする</div><div class="ex">We <b>clean</b> our classroom after lunch.</div><div class="xj">私たちは昼食のあとで教室を掃除します。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">dinner</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">夕食</div><div class="ex">We eat <b>dinner</b> at seven.</div><div class="xj">私たちは7時に夕食を食べます。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">flower</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">花</div><div class="ex">These <b>flowers</b> are beautiful.</div><div class="xj">これらの花はきれいです。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">grow</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">育てる；成長する</div><div class="ex">We <b>grow</b> tomatoes in our garden.</div><div class="xj">私たちは庭でトマトを育てています。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">many</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">たくさんの；多くの</div><div class="ex">I have <b>many</b> friends.</div><div class="xj">私にはたくさんの友だちがいます。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">much</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">（量が）たくさんの；（very much で）とても</div><div class="ex">Do you have <b>much</b> homework today?</div><div class="xj">今日は宿題がたくさんありますか。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">very much</span><span class="ps">熟</span></div><div class="ja">とても；たいへん</div><div class="ex">I like music <b>very much</b>.</div><div class="xj">私は音楽がとても好きです。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">piano</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ピアノ</div><div class="ex">Can you play the <b>piano</b>?</div><div class="xj">あなたはピアノをひけますか。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">read</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">読む</div><div class="ex">I <b>read</b> books in the library.</div><div class="xj">私は図書館で本を読みます。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">ride</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">乗る</div><div class="ex">I <b>ride</b> my bike to the park.</div><div class="xj">私は自転車に乗って公園へ行きます。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">after school</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">放課後</div><div class="ex">We play soccer <b>after school</b>.</div><div class="xj">私たちは放課後サッカーをします。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">sometimes</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ときどき</div><div class="ex">I <b>sometimes</b> cook dinner.</div><div class="xj">私はときどき夕食を作ります。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">study</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">勉強する</div><div class="ex">We <b>study</b> English at school.</div><div class="xj">私たちは学校で英語を勉強します。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">town</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">町</div><div class="ex">I love my <b>town</b>.</div><div class="xj">私は自分の町が大好きです。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">use</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">使う</div><div class="ex">You can <b>use</b> my umbrella.</div><div class="xj">私のかさを使っていいですよ。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">watch</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">（じっと）見る；見守る</div><div class="ex">We <b>watch</b> soccer games on TV.</div><div class="xj">私たちはテレビでサッカーの試合を見ます。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">artist</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">芸術家；画家</div><div class="ex">You are a great <b>artist</b>!</div><div class="xj">あなたはすばらしい芸術家ですね！</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">draw</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（線で絵を）描く；引く</div><div class="ex">I <b>draw</b> pictures of animals.</div><div class="xj">私は動物の絵を描きます。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">flip</span><span class="ps">動</span></div><div class="ja">ひっくり返す；（ページを）めくる</div><div class="ex"><b>Flip</b> the pancake now.</div><div class="xj">今、パンケーキをひっくり返して。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">look</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">見る；目を向ける</div><div class="ex"><b>Look</b>! It’s Mt. Fuji.</div><div class="xj">見て！富士山だよ。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">look at ～</span><span class="ps">熟</span></div><div class="ja">～を見る</div><div class="ex"><b>Look at</b> this picture.</div><div class="xj">この絵を見て。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">notebook</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ノート</div><div class="ex">I need a new <b>notebook</b>.</div><div class="xj">私は新しいノートが必要です。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">picture</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">絵；写真</div><div class="ex">I like your <b>picture</b>.</div><div class="xj">私はあなたの絵が好きです。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">wow</span><span class="ps">間</span></div><div class="ja">わあ；うわあ</div><div class="ex"><b>Wow</b>, you can cook well!</div><div class="xj">わあ、あなたは料理が上手ですね！</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">break</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">休憩；休み時間</div><div class="ex">Let’s take a <b>break</b>.</div><div class="xj">休憩しよう。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">during</span><span class="ps">前</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～の間に；～の間ずっと</div><div class="ex">We play soccer <b>during<
