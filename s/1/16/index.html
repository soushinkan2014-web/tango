</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第16回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.72〜76　No.451〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">because</span><span class="ps">接</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">なぜなら～だから；～なので</div><div class="ex">A: Why do you like summer?<br>B: <b>Because</b> I can swim.</div><div class="xj">A：あなたはなぜ夏が好きなのですか。B：泳げるからです。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">him</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼を；彼に</div><div class="ex">Do you know <b>him</b>?</div><div class="xj">あなたは彼を知っていますか。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">why</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">なぜ</div><div class="ex"><b>Why</b> do you like dogs?</div><div class="xj">あなたはなぜ犬が好きなのですか。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">How about ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～はどうですか</div><div class="ex">A: What do you want to eat?<br>B: <b>How about</b> pizza?</div><div class="xj">A：何が食べたい？<br>B：ピザはどう？</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">detective</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">探偵；刑事</div><div class="ex">I like <b>detective</b> stories.</div><div class="xj">私は探偵小説が好きです。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">early</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">早く；早い</div><div class="ex">Emi gets up <b>early</b> every day.</div><div class="xj">エミは毎日早く起きます。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">hard</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">一生懸命に；熱心に</div><div class="ex">Ken studies <b>hard</b>.</div><div class="xj">ケンは一生懸命勉強します。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">monster</span><span class="ps">名</span></div><div class="ja">怪物；怪獣</div><div class="ex">My brother likes <b>monster</b> movies.</div><div class="xj">私の弟は怪獣映画が好きです。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">park</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">公園</div><div class="ex">Emi often plays tennis in the <b>park</b>.</div><div class="xj">エミはよく公園でテニスをします。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">pirate</span><span class="ps">名</span></div><div class="ja">海賊</div><div class="ex">Tom wants to be a <b>pirate</b>.</div><div class="xj">トムは海賊になりたいと思っています。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">romantic</span><span class="ps">形</span></div><div class="ja">ロマンチックな；恋愛の</div><div class="ex">This is a <b>romantic</b> movie.</div><div class="xj">これはロマンチックな映画です。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">singer</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">歌手</div><div class="ex">Which <b>singer</b> do you like?</div><div class="xj">あなたはどの歌手が好きですか。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">there</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">そこに；そこで；そこへ</div><div class="ex">My grandmother lives <b>there</b>.</div><div class="xj">私の祖母はそこに住んでいます。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">yeah</span><span class="ps">間</span></div><div class="ja">うん；ええ</div><div class="ex">A: Do you like soccer?<br>B: <b>Yeah</b>, I love it.</div><div class="xj">A：サッカーは好き？<br>B：うん、大好き。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">across</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～を横切って；～を渡って</div><div class="ex">Let’s walk <b>across</b> the bridge.</div><div class="xj">歩いて橋を渡ろう。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">hour</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">1時間；時間</div><div class="ex">Ken studies for two <b>hours</b> every day.</div><div class="xj">ケンは毎日2時間勉強します。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">morning</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">朝；午前</div><div class="ex">My father drinks coffee every <b>morning</b>.</div><div class="xj">父は毎朝コーヒーを飲みます。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">respect</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">尊敬する</div><div class="ex">Emi <b>respects</b> her teacher.</div><div class="xj">エミは先生を尊敬しています。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">savanna</span><span class="ps">名</span></div><div class="ja">サバンナ（熱帯の草原）</div><div class="ex">Ken wants to visit the <b>savanna</b>.</div><div class="xj">ケンはサバンナを訪れたいと思っています。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">tell</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">話す；伝える；教える</div><div class="ex">Can you <b>tell</b> me about your school?</div><div class="xj">あなたの学校のことを私に話してくれますか。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">tough</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">きつい；たくましい</div><div class="ex">Practice is <b>tough</b>, but I like it.</div><div class="xj">練習はきついけれど、私は好きです。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">airplane</span><span class="ps">名</span></div><div class="ja">飛行機</div><div class="ex">This <b>airplane</b> goes to Hawaii.</div><div class="xj">この飛行機はハワイに行きます。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">amazing</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">すごい；驚くべき</div><div class="ex">Ken’s dance is <b>amazing</b>!</div><div class="xj">ケンのダンスはすごい！</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">attack</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">襲う；攻撃する</div><div class="ex">Lions <b>attack</b> animals at night.</div><div class="xj">ライオンは夜に動物を襲います。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">dangerous</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">危険な</div><div class="ex">This river is <b>dangerous</b>.</div><div class="xj">この川は危険です。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">dream</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">夢</div><div class="ex">What is your <b>dream</b>?</div><div class="xj">あなたの夢は何ですか。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">has</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">持っている；飼っている（have の3単現）</div><div class="ex">Emi <b>has</b> two cats.</div><div class="xj">エミはネコを2匹飼っています。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">～, you know.</span><span class="ps">熟</span></div><div class="ja">～だよ；～でしょ</div><div class="ex">Emi is a good singer, <b>you know</b>.</div><div class="xj">エミは歌が上手なんだよ。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">parent</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">親；（parents で）両親</div><div class="ex">My <b>parents</b> are teachers.</div><div class="xj">私の両親は教師です。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">place</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">場所</div><div class="ex">Kyoto is a nice <b>place</b>.</div><div class="xj">京都はすてきな場所です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、
