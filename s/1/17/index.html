</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第17回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.76〜82　No.481〜510</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">pray</span><span class="ps">動</span></div><div class="ja">祈る</div><div class="ex">We <b>pray</b> at the shrine.</div><div class="xj">私たちは神社で祈ります。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">safe</span><span class="ps">形</span></div><div class="ja">安全な</div><div class="ex">This park is <b>safe</b> for children.</div><div class="xj">この公園は子どもたちにとって安全です。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">safety</span><span class="ps">名</span></div><div class="ja">安全</div><div class="ex">We learn about <b>safety</b> at school.</div><div class="xj">私たちは学校で安全について学びます。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">schoolchild</span><span class="ps">名</span></div><div class="ja">児童；学童</div><div class="ex">Every <b>schoolchild</b> knows this song.</div><div class="xj">どの児童もこの歌を知っています。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">schoolchildren</span><span class="ps">名</span></div><div class="ja">児童たち（schoolchild の複数形）</div><div class="ex">Many <b>schoolchildren</b> walk to school.</div><div class="xj">多くの児童たちが歩いて学校へ通います。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">think</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">思う；考える</div><div class="ex">I <b>think</b> so, too.</div><div class="xj">私もそう思います。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">No way!</span><span class="ps">熟</span></div><div class="ja">まさか；ありえない</div><div class="ex">A: I can eat ten hamburgers.<br>B: <b>No way!</b></div><div class="xj">A：ぼくはハンバーガーを10個食べられるよ。B：まさか！</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">what’s</span><span class="ps">代</span></div><div class="ja">何（what is の短縮形）</div><div class="ex"><b>What’s</b> in your bag?</div><div class="xj">あなたのかばんには何が入っていますか。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">anything</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">（疑問文で）何か；（否定文で）何も</div><div class="ex">Do you need <b>anything</b>?</div><div class="xj">何か必要ですか。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">else</span><span class="ps">副</span></div><div class="ja">ほかに</div><div class="ex">What <b>else</b> do you want?</div><div class="xj">ほかに何がほしいですか。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">strong</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">強い</div><div class="ex">Elephants are <b>strong</b> animals.</div><div class="xj">ゾウは力の強い動物です。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">them</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼らを；彼らに；それらを</div><div class="ex">I know <b>them</b> well.</div><div class="xj">私は彼らをよく知っています。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">bag</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">かばん；ふくろ</div><div class="ex">Ken’s <b>bag</b> is very heavy.</div><div class="xj">ケンのかばんはとても重いです。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">its</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">それの；その</div><div class="ex">I like that shop and <b>its</b> cakes.</div><div class="xj">私はあの店とそのケーキが好きです。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">theirs</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼らのもの；彼女らのもの</div><div class="ex">That house is <b>theirs</b>.</div><div class="xj">あの家は彼らのものです。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">these</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">これら；これらの</div><div class="ex"><b>These</b> are my books.</div><div class="xj">これらは私の本です。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">us</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">私たちを；私たちに</div><div class="ex">Come with <b>us</b>.</div><div class="xj">私たちといっしょに来て。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">crispy</span><span class="ps">形</span></div><div class="ja">カリカリした；サクサクした</div><div class="ex">This tempura is <b>crispy</b>.</div><div class="xj">この天ぷらはサクサクしています。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">example</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">例</div><div class="ex">This is a good <b>example</b>.</div><div class="xj">これはよい例です。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">for example</span><span class="ps">熟</span></div><div class="ja">たとえば</div><div class="ex">I like sports, <b>for example</b>, tennis and soccer.</div><div class="xj">私はスポーツ、たとえばテニスやサッカーが好きです。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">juicy</span><span class="ps">形</span></div><div class="ja">汁の多い；ジューシーな</div><div class="ex">This peach is very <b>juicy</b>.</div><div class="xj">この桃はとてもジューシーです。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">research</span><span class="ps">名</span></div><div class="ja">研究；調査</div><div class="ex">Emi does <b>research</b> on robots.</div><div class="xj">エミはロボットについて研究しています。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">bus</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">バス</div><div class="ex">Let’s take the <b>bus</b>.</div><div class="xj">バスに乗ろう。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">by</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～で（手段）；～のそばに</div><div class="ex">Ken goes to school <b>by</b> bike.</div><div class="xj">ケンは自転車で学校へ行きます。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">cake</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ケーキ</div><div class="ex">Emi makes <b>cakes</b> on Sundays.</div><div class="xj">エミは日曜日にケーキを作ります。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">dad</span><span class="ps">名</span></div><div class="ja">お父さん；パパ</div><div class="ex">My <b>dad</b> cooks dinner on Saturdays.</div><div class="xj">お父さんは土曜日に夕食を作ります。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">full</span><span class="ps">形</span></div><div class="ja">いっぱいの；満腹の</div><div class="ex">I’m <b>full</b>, thank you.</div><div class="xj">おなかがいっぱいです、ありがとう。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">hungry</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">おなかがすいた；空腹の</div><div class="ex">Are you <b>hungry</b>?</div><div class="xj">あなたはおなかがすいていますか。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">over</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の上を；～を越えて</div><div class="ex">An airplane flies <b>over</b> my house every day.</div><div class="xj">毎日飛行機が私の家の上を飛んでいきます。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">restaurant</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">レストラン</div><div class="ex">Let’s eat at that <b>restaurant</b>.</div><div class="xj">あのレストランで食べよう。</div></button></li></ol><nav class="pn"><a href="../16/">← 第16回</a><a href="../18/">第18回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"481": 4.5, "482": 16.83, "483": 29.69, "484": 42.77, "485": 57.43, "486": 72.86, "487": 85.84, "488": 101.93, "489": 114.89, "490": 128.52, "491": 140.54, "492": 153.56, "493": 166.14, "494": 179.04, "495": 192.26, "496": 205.82, "497": 218.46, "498": 231.54, "499": 245.22, "500": 257.84, "501": 273.05, "502": 286.82, "503": 300.66, "504": 312.83, "505": 327.22, "506": 340.28, "507": 354.07, "508": 367.44, "509": 380.34, "510": 395.89};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
