</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第11回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.42〜50　No.301〜330</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">with</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～と（いっしょに）；～を使って</div><div class="ex">I play tennis <b>with</b> my friends.</div><div class="xj">私は友だちとテニスをします。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">bird</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">鳥</div><div class="ex">Look at the <b>bird</b> in the tree.</div><div class="xj">木の上の鳥を見て。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">cannot</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～できない</div><div class="ex">We <b>cannot</b> play soccer here.</div><div class="xj">ここではサッカーができません。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">game</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">試合；ゲーム</div><div class="ex">We have a soccer <b>game</b> on Sunday.</div><div class="xj">日曜日にサッカーの試合があります。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">love</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">大好きである；愛する</div><div class="ex">I <b>love</b> my dog.</div><div class="xj">私は自分の犬が大好きです。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">midfielder</span><span class="ps">名</span></div><div class="ja">ミッドフィールダー（サッカーの中盤の選手）</div><div class="ex">I want to be a <b>midfielder</b>.</div><div class="xj">私はミッドフィールダーになりたいです。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">their</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼らの；彼女らの；それらの</div><div class="ex">I know <b>their</b> names.</div><div class="xj">私は彼らの名前を知っています。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">best</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">いちばんよい；最もよい</div><div class="ex">You are my <b>best</b> friend.</div><div class="xj">あなたは私のいちばんの友だちです。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">concert</span><span class="ps">名</span></div><div class="ja">コンサート；演奏会</div><div class="ex">Let’s go to the <b>concert</b> together.</div><div class="xj">いっしょにコンサートに行こう。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">cute</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">かわいい</div><div class="ex">You have a <b>cute</b> cat.</div><div class="xj">あなたはかわいいネコを飼っていますね。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">friend</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">友だち</div><div class="ex">I have many <b>friends</b> in Canada.</div><div class="xj">私にはカナダにたくさんの友だちがいます。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">her</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼女の；彼女を</div><div class="ex">I like <b>her</b> songs.</div><div class="xj">私は彼女の歌が好きです。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">idol</span><span class="ps">名</span></div><div class="ja">アイドル；あこがれの人</div><div class="ex">My <b>idol</b> can dance very well.</div><div class="xj">私のアイドルはとても上手に踊れます。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">they</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼らは；彼女らは；それらは</div><div class="ex"><b>They</b> are from Australia.</div><div class="xj">彼らはオーストラリア出身です。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">three</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">3（の）</div><div class="ex">I have <b>three</b> brothers.</div><div class="xj">私には兄弟が3人います。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">an</span><span class="ps">冠</span><span class=star>★</span></div><div class="ja">1つの；ある</div><div class="ex">I want <b>an</b> egg.</div><div class="xj">私は卵が1つほしいです。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">Can I ～?</span><span class="ps">熟</span></div><div class="ja">～してもいいですか</div><div class="ex">A: <b>Can I</b> use your pen?<br>B: Sure.</div><div class="xj">A：あなたのペンを使ってもいいですか。B：いいよ。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">cent</span><span class="ps">名</span></div><div class="ja">セント（お金の単位）</div><div class="ex">I need fifty <b>cents</b>.</div><div class="xj">私は50セント必要です。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">cheeseburger</span><span class="ps">名</span></div><div class="ja">チーズバーガー</div><div class="ex">My brother can eat three <b>cheeseburgers</b>.</div><div class="xj">私の兄はチーズバーガーを3つ食べられます。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">coffee</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">コーヒー</div><div class="ex">Do you drink <b>coffee</b>?</div><div class="xj">あなたはコーヒーを飲みますか。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">cola</span><span class="ps">名</span></div><div class="ja">コーラ</div><div class="ex">Do you want a <b>cola</b>?</div><div class="xj">あなたはコーラがほしいですか。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">dollar</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ドル（お金の単位）</div><div class="ex">You can buy it for two <b>dollars</b>.</div><div class="xj">それは2ドルで買えます。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">For here or to go?</span><span class="ps">熟</span></div><div class="ja">こちらでお召し上がりですか、それともお持ち帰りですか</div><div class="ex">A: <b>For here or to go?</b><br>B: To go, please.</div><div class="xj">A：こちらでお召し上がりですか、それともお持ち帰りですか。B：持ち帰りでお願いします。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">French fries</span><span class="ps">熟</span></div><div class="ja">フライドポテト</div><div class="ex">I like <b>French fries</b> very much.</div><div class="xj">私はフライドポテトが大好きです。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">ginger ale</span><span class="ps">熟</span></div><div class="ja">ジンジャーエール</div><div class="ex">Do you like <b>ginger ale</b>?</div><div class="xj">あなたはジンジャーエールが好きですか。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">green</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">緑の；緑色</div><div class="ex">I have a <b>green</b> bag.</div><div class="xj">私は緑のかばんを持っています。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">hamburger</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ハンバーガー</div><div class="ex">Let’s eat <b>hamburgers</b> for lunch.</div><div class="xj">昼ごはんにハンバーガーを食べよう。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">here</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">ここに；ここで</div><div class="ex">Come <b>here</b>, please.</div><div class="xj">ここに来てください。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">Here you are.</span><span class="ps">熟</span></div><div class="ja">はい、どうぞ（物を渡すとき）</div><div class="ex">A: Can I have some water?<br>B: Sure. <b>Here you are.</b></div><div class="xj">A：お水をもらえますか。B：もちろん。はい、どうぞ。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">juice</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ジュース</div><div class="ex">I drink apple <b>juice</b> every morning.</div><div class="xj">私は毎朝リンゴジュースを飲みます。</div></button></li></ol><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"301": 4.52, "302": 19.38, "303": 31.78, "304": 44.74, "305": 58.05, "306": 71.22, "307": 86.03, "308": 98.98, "309": 112.54, "310": 125.88, "311": 138.14, "312": 150.95, "313": 163.86, "314": 177.68, "315": 190.76, "316": 203.16, "317": 215.25, "318": 230.44, "319": 243.54, "320": 257.5, "321": 269.5, "322": 281.47, "323": 294.69, "324": 313.71, "325": 327.84, "326": 340.85, "327": 353.73, "328": 366.78, "329": 379.38, "330": 397.37};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
