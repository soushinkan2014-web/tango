</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第31回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.143〜144　No.901〜930</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../31.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="901"><div class="top"><span class="no">901</span><span class="en">pool</span><span class="ps">名</span></div><div class="ja">プール</div><div class="ex">We swim in the school <b>pool</b> in summer.</div><div class="xj">私たちは夏に学校のプールで泳ぎます。</div></button></li><li><button class="w" data-no="902"><div class="top"><span class="no">902</span><span class="en">practice game</span><span class="ps">名</span></div><div class="ja">練習試合</div><div class="ex">We had a <b>practice game</b> last Saturday.</div><div class="xj">この前の土曜日に練習試合がありました。</div></button></li><li><button class="w" data-no="903"><div class="top"><span class="no">903</span><span class="en">rugby</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ラグビー</div><div class="ex"><b>Rugby</b> is popular in New Zealand.</div><div class="xj">ニュージーランドではラグビーが人気です。</div></button></li><li><button class="w" data-no="904"><div class="top"><span class="no">904</span><span class="en">go shopping</span><span class="ps">熟</span></div><div class="ja">買い物に行く</div><div class="ex">Let’s <b>go shopping</b> this weekend.</div><div class="xj">今週末、買い物に行こう。</div></button></li><li><button class="w" data-no="905"><div class="top"><span class="no">905</span><span class="en">soft tennis</span><span class="ps">名</span></div><div class="ja">ソフトテニス</div><div class="ex">I’m in the <b>soft tennis</b> club.</div><div class="xj">私はソフトテニス部に入っています。</div></button></li><li><button class="w" data-no="906"><div class="top"><span class="no">906</span><span class="en">softball</span><span class="ps">名</span></div><div class="ja">ソフトボール</div><div class="ex">Emi plays <b>softball</b> after school.</div><div class="xj">エミは放課後にソフトボールをします。</div></button></li><li><button class="w" data-no="907"><div class="top"><span class="no">907</span><span class="en">spaghetti</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">スパゲッティ</div><div class="ex">Do you like <b>spaghetti</b>?</div><div class="xj">あなたはスパゲッティが好きですか。</div></button></li><li><button class="w" data-no="908"><div class="top"><span class="no">908</span><span class="en">tambourine</span><span class="ps">名</span></div><div class="ja">タンバリン</div><div class="ex">Yuki played the <b>tambourine</b> at the concert.</div><div class="xj">ユキはコンサートでタンバリンをたたきました。</div></button></li><li><button class="w" data-no="909"><div class="top"><span class="no">909</span><span class="en">go on a trip</span><span class="ps">熟</span></div><div class="ja">旅行に行く</div><div class="ex">We <b>went on a trip</b> to Hokkaido.</div><div class="xj">私たちは北海道へ旅行に行きました。</div></button></li><li><button class="w" data-no="910"><div class="top"><span class="no">910</span><span class="en">volleyball</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">バレーボール</div><div class="ex">Our class played <b>volleyball</b> in P.E.</div><div class="xj">私たちのクラスは体育でバレーボールをしました。</div></button></li><li><button class="w" data-no="911"><div class="top"><span class="no">911</span><span class="en">go for a walk</span><span class="ps">熟</span></div><div class="ja">散歩に行く</div><div class="ex">My grandfather <b>goes for a walk</b> every morning.</div><div class="xj">祖父は毎朝散歩に行きます。</div></button></li><li><button class="w" data-no="912"><div class="top"><span class="no">912</span><span class="en">xylophone</span><span class="ps">名</span></div><div class="ja">木琴</div><div class="ex">Ken is playing the <b>xylophone</b>.</div><div class="xj">ケンは木琴を演奏しています。</div></button></li><li><button class="w" data-no="913"><div class="top"><span class="no">913</span><span class="en">ambitious</span><span class="ps">形</span></div><div class="ja">大きな望みを持った；意欲的な</div><div class="ex">Emi is an <b>ambitious</b> girl.</div><div class="xj">エミは大きな望みを持った女の子です。</div></button></li><li><button class="w" data-no="914"><div class="top"><span class="no">914</span><span class="en">bookstore</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">書店；本屋</div><div class="ex">I bought this comic book at the <b>bookstore</b>.</div><div class="xj">私はこのマンガを書店で買いました。</div></button></li><li><button class="w" data-no="915"><div class="top"><span class="no">915</span><span class="en">careless</span><span class="ps">形</span></div><div class="ja">不注意な</div><div class="ex">I made a <b>careless</b> mistake on the test.</div><div class="xj">私はテストで不注意なまちがいをしました。</div></button></li><li><button class="w" data-no="916"><div class="top"><span class="no">916</span><span class="en">city hall</span><span class="ps">名</span></div><div class="ja">市役所</div><div class="ex">The <b>city hall</b> is near the station.</div><div class="xj">市役所は駅の近くにあります。</div></button></li><li><button class="w" data-no="917"><div class="top"><span class="no">917</span><span class="en">clever</span><span class="ps">形</span></div><div class="ja">賢い；利口な</div><div class="ex">Your dog is very <b>clever</b>.</div><div class="xj">あなたの犬はとても賢いですね。</div></button></li><li><button class="w" data-no="918"><div class="top"><span class="no">918</span><span class="en">courageous</span><span class="ps">形</span></div><div class="ja">勇気のある</div><div class="ex">The <b>courageous</b> boy helped the old man.</div><div class="xj">勇気のある少年がお年寄りを助けました。</div></button></li><li><button class="w" data-no="919"><div class="top"><span class="no">919</span><span class="en">easygoing</span><span class="ps">形</span></div><div class="ja">のんびりした；おおらかな</div><div class="ex">My father is an <b>easygoing</b> person.</div><div class="xj">私の父はのんびりした人です。</div></button></li><li><button class="w" data-no="920"><div class="top"><span class="no">920</span><span class="en">faithful</span><span class="ps">形</span></div><div class="ja">忠実な；誠実な</div><div class="ex">Dogs are <b>faithful</b> animals.</div><div class="xj">犬は忠実な動物です。</div></button></li><li><button class="w" data-no="921"><div class="top"><span class="no">921</span><span class="en">fire station</span><span class="ps">名</span></div><div class="ja">消防署</div><div class="ex">There is a <b>fire station</b> near my house.</div><div class="xj">私の家の近くに消防署があります。</div></button></li><li><button class="w" data-no="922"><div class="top"><span class="no">922</span><span class="en">frank</span><span class="ps">形</span></div><div class="ja">率直な；正直な</div><div class="ex">Tom is a <b>frank</b> boy.</div><div class="xj">トムは率直な男の子です。</div></button></li><li><button class="w" data-no="923"><div class="top"><span class="no">923</span><span class="en">gentle</span><span class="ps">形</span></div><div class="ja">やさしい；おだやかな</div><div class="ex">My grandmother is very <b>gentle</b>.</div><div class="xj">私の祖母はとてもやさしいです。</div></button></li><li><button class="w" data-no="924"><div class="top"><span class="no">924</span><span class="en">lazy</span><span class="ps">形</span></div><div class="ja">怠けた；怠け者の</div><div class="ex">My dog is <b>lazy</b> and sleeps all day.</div><div class="xj">私の犬は怠け者で、一日中寝ています。</div></button></li><li><button class="w" data-no="925"><div class="top"><span class="no">925</span><span class="en">mild</span><span class="ps">形</span></div><div class="ja">温和な；（気候が）おだやかな</div><div class="ex">Ms. Green is a <b>mild</b> person.</div><div class="xj">グリーン先生は温和な人です。</div></button></li><li><button class="w" data-no="926"><div class="top"><span class="no">926</span><span class="en">naughty</span><span class="ps">形</span></div><div class="ja">いたずらな；行儀の悪い</div><div class="ex">My <b>naughty</b> cat ate my cake.</div><div class="xj">私のいたずらなネコが私のケーキを食べました。</div></button></li><li><button class="w" data-no="927"><div class="top"><span class="no">927</span><span class="en">police box</span><span class="ps">名</span></div><div class="ja">交番</div><div class="ex">Let’s ask at the <b>police box</b>.</div><div class="xj">交番で聞いてみよう。</div></button></li><li><button class="w" data-no="928"><div class="top"><span class="no">928</span><span class="en">police station</span><span class="ps">名</span></div><div class="ja">警察署</div><div class="ex">The <b>police station</b> is next to the park.</div><div class="xj">警察署は公園のとなりにあります。</div></button></li><li><button class="w" data-no="929"><div class="top"><span class="no">929</span><span class="en">port</span><span class="ps">名</span></div><div class="ja">港</div><div class="ex">Many ships come to this <b>port</b>.</div><div class="xj">この港にはたくさんの船が来ます。</div></button></li><li><button class="w" data-no="930"><div class="top"><span class="no">930</span><span class="en">positive</span><span class="ps">形</span></div><div class="ja">前向きな；積極的な</div><div class="ex">Ken is always <b>positive</b>.</div><div class="xj">ケンはいつも前向きです。</div></button></li></ol><nav class="pn"><a href="../30/">← 第30回</a><a href="../32/">第32回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"901": 4.76, "902": 17.84, "903": 31.92, "904": 45.0, "905": 58.39, "906": 72.42, "907": 86.1, "908": 98.41, "909": 112.01, "910": 125.4, "911": 139.03, "912": 153.69, "913": 166.88, "914": 181.71, "915": 195.51, "916": 209.11, "917": 222.6, "918": 235.86, "919": 249.56, "920": 263.74, "921": 277.61, "922": 291.86, "923": 305.13, "924": 318.88, "925": 333.44, "926": 347.62, "927": 361.47, "928": 375.22, "929": 389.08, "930": 401.87};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
