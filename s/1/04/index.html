><div class="xj">トラはとても強いです。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">umbrella</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">かさ</div><div class="ex">Do you have an <b>umbrella</b>?</div><div class="xj">あなたはかさを持っていますか。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">uniform</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">制服；ユニフォーム</div><div class="ex">I like our school <b>uniform</b>.</div><div class="xj">私は私たちの学校の制服が好きです。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">wolf</span><span class="ps">名</span></div><div class="ja">オオカミ</div><div class="ex"><b>Wolves</b> can run fast.</div><div class="xj">オオカミは速く走ることができます。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">zoo</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">動物園</div><div class="ex">Let’s go to the <b>zoo</b>.</div><div class="xj">動物園へ行こう。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">point</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">点；得点；要点</div><div class="ex">We have three <b>points</b> now.</div><div class="xj">私たちは今、3点です。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">had</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">持っていた；食べた（have の過去形）</div><div class="ex">I <b>had</b> a red bike last year.</div><div class="xj">私は去年、赤い自転車を持っていました。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">lunch</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">昼食</div><div class="ex">What time is <b>lunch</b>?</div><div class="xj">昼食は何時ですか。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">pen</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ペン</div><div class="ex">I want a red <b>pen</b>.</div><div class="xj">私は赤いペンがほしいです。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">saw</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">見た（see の過去形）</div><div class="ex">I <b>saw</b> fireworks last summer.</div><div class="xj">私は去年の夏、花火を見ました。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">ate</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">食べた（eat の過去形）</div><div class="ex">I <b>ate</b> watermelon at the beach.</div><div class="xj">私は海辺ですいかを食べました。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">dog</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">犬</div><div class="ex">Do you have a <b>dog</b>?</div><div class="xj">あなたは犬を飼っていますか。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">pizza</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ピザ</div><div class="ex">What <b>pizza</b> do you want?</div><div class="xj">あなたはどんなピザがほしいですか。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">tennis</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">テニス</div><div class="ex">Do you play <b>tennis</b>?</div><div class="xj">あなたはテニスをしますか。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">am</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（～で）ある；いる</div><div class="ex">I <b>am</b> twelve years old.</div><div class="xj">私は12歳です。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">Australia</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">オーストラリア</div><div class="ex">I want to go to <b>Australia</b>.</div><div class="xj">私はオーストラリアへ行きたいです。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">Brazil</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ブラジル</div><div class="ex">Many people play soccer in <b>Brazil</b>.</div><div class="xj">ブラジルではたくさんの人がサッカーをします。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">be from ～</span><span class="ps">熟</span></div><div class="ja">～出身である</div><div class="ex">We <b>are from</b> Canada.</div><div class="xj">私たちはカナダ出身です。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">hi</span><span class="ps">間</span><span class=star>★</span></div><div class="ja">やあ；こんにちは</div><div class="ex"><b>Hi</b>, I’m Emi.</div><div class="xj">やあ、私はエミです。</div></button></li></ol><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"91": 4.31, "92": 16.74, "93": 28.97, "94": 42.0, "95": 55.22, "96": 67.5, "97": 80.1, "98": 92.41, "99": 104.98, "100": 117.82, "101": 130.7, "102": 143.63, "103": 156.13, "104": 168.37, "105": 181.73, "106": 194.3, "107": 206.42, "108": 219.09, "109": 233.41, "110": 245.58, "111": 257.79, "112": 271.25, "113": 284.83, "114": 296.7, "115": 308.94, "116": 321.06, "117": 334.13, "118": 347.14, "119": 360.31, "120": 373.31};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
