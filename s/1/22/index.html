</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第22回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.107〜111　No.631〜660</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../22.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="631"><div class="top"><span class="no">631</span><span class="en">sit</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">座る</div><div class="ex">Ken is <b>sitting</b> by the window.</div><div class="xj">ケンは窓のそばに座っています。</div></button></li><li><button class="w" data-no="632"><div class="top"><span class="no">632</span><span class="en">black</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">黒い</div><div class="ex">I want a <b>black</b> cap.</div><div class="xj">私は黒いぼうしがほしいです。</div></button></li><li><button class="w" data-no="633"><div class="top"><span class="no">633</span><span class="en">Can I help you?</span><span class="ps">熟</span></div><div class="ja">いらっしゃいませ；何かお手伝いしましょうか</div><div class="ex">A: <b>Can I help you?</b><br>B: Yes. I’m looking for a bag.</div><div class="xj">A：いらっしゃいませ。B：はい。かばんをさがしています。</div></button></li><li><button class="w" data-no="634"><div class="top"><span class="no">634</span><span class="en">clerk</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">店員</div><div class="ex">That <b>clerk</b> is very kind.</div><div class="xj">あの店員はとても親切です。</div></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">handkerchief</span><span class="ps">名</span></div><div class="ja">ハンカチ</div><div class="ex">Is this your <b>handkerchief</b>?</div><div class="xj">これはあなたのハンカチですか。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">Here it is.</span><span class="ps">熟</span></div><div class="ja">はい、どうぞ；ここにあります</div><div class="ex">A: Can I see your ticket?<br>B: Sure. <b>Here it is.</b></div><div class="xj">A：チケットを見せてもらえますか。B：はい。どうぞ。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">same</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">同じ</div><div class="ex">We are in the <b>same</b> class.</div><div class="xj">私たちは同じクラスです。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">trip</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">旅行</div><div class="ex">Have a nice <b>trip</b>!</div><div class="xj">よい旅行を！</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">also</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～もまた；さらに</div><div class="ex">My sister is <b>also</b> a student here.</div><div class="xj">私の姉もここの生徒です。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">aurora</span><span class="ps">名</span></div><div class="ja">オーロラ</div><div class="ex">We can see the <b>aurora</b> in Finland.</div><div class="xj">フィンランドではオーロラが見られます。</div></button></li><li><button class="w" data-no="641"><div class="top"><span class="no">641</span><span class="en">back</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">もとへ；戻って</div><div class="ex">Please go <b>back</b> to your seat.</div><div class="xj">自分の席に戻ってください。</div></button></li><li><button class="w" data-no="642"><div class="top"><span class="no">642</span><span class="en">came</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">来た（come の過去形）</div><div class="ex">Lisa <b>came</b> to Japan last year.</div><div class="xj">リサは去年日本に来ました。</div></button></li><li><button class="w" data-no="643"><div class="top"><span class="no">643</span><span class="en">come back</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">帰ってくる；戻る</div><div class="ex">Please <b>come back</b> soon.</div><div class="xj">すぐに戻ってきてね。</div></button></li><li><button class="w" data-no="644"><div class="top"><span class="no">644</span><span class="en">did</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">した（do の過去形）</div><div class="ex">I <b>did</b> my homework in the library.</div><div class="xj">私は図書館で宿題をしました。</div></button></li><li><button class="w" data-no="645"><div class="top"><span class="no">645</span><span class="en">didn’t</span><span class="ps">助</span></div><div class="ja">～しなかった（did not の短縮形）</div><div class="ex">I <b>didn’t</b> watch TV yesterday.</div><div class="xj">私は昨日テレビを見ませんでした。</div></button></li><li><button class="w" data-no="646"><div class="top"><span class="no">646</span><span class="en">holiday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">休日；祝日</div><div class="ex">Today is a <b>holiday</b>.</div><div class="xj">今日は休日です。</div></button></li><li><button class="w" data-no="647"><div class="top"><span class="no">647</span><span class="en">jet lag</span><span class="ps">熟</span></div><div class="ja">時差ぼけ</div><div class="ex">My uncle has <b>jet lag</b> now.</div><div class="xj">おじは今時差ぼけです。</div></button></li><li><button class="w" data-no="648"><div class="top"><span class="no">648</span><span class="en">last</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">この前の；昨～；最後の</div><div class="ex">I visited Kyoto <b>last</b> month.</div><div class="xj">私は先月京都を訪れました。</div></button></li><li><button class="w" data-no="649"><div class="top"><span class="no">649</span><span class="en">lucky</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">運のよい；幸運な</div><div class="ex">You are <b>lucky</b>!</div><div class="xj">あなたは運がいいね！</div></button></li><li><button class="w" data-no="650"><div class="top"><span class="no">650</span><span class="en">night</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">夜；晩</div><div class="ex">I study English every <b>night</b>.</div><div class="xj">私は毎晩英語を勉強します。</div></button></li><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">last night</span><span class="ps">熟</span></div><div class="ja">昨夜；昨晩</div><div class="ex">I watched a soccer game <b>last night</b>.</div><div class="xj">私は昨夜サッカーの試合を見ました。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">relax</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">くつろぐ；リラックスする</div><div class="ex">I <b>relax</b> in the bath.</div><div class="xj">私はおふろでくつろぎます。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">sleep</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">眠る</div><div class="ex">The baby is <b>sleeping</b> now.</div><div class="xj">赤ちゃんは今眠っています。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">stay</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">滞在する；泊まる</div><div class="ex">We are <b>staying</b> at a hotel in Kyoto.</div><div class="xj">私たちは京都のホテルに滞在しています。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">yesterday</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">昨日（は）</div><div class="ex">I played tennis with Emi <b>yesterday</b>.</div><div class="xj">私は昨日エミとテニスをしました。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">afternoon</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">午後</div><div class="ex">I have a piano lesson this <b>afternoon</b>.</div><div class="xj">今日の午後ピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">ago</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">（今から）～前に</div><div class="ex">Tom came to Osaka two years <b>ago</b>.</div><div class="xj">トムは2年前に大阪に来ました。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">anywhere</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">どこにでも；（否定文で）どこへも</div><div class="ex">You can sit <b>anywhere</b>.</div><div class="xj">どこにでも座っていいですよ。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">beat</span><span class="ps">動</span></div><div class="ja">（心臓が）打つ；（相手を）負かす</div><div class="ex">My heart is <b>beating</b> fast.</div><div class="xj">私の心臓が速く打っています。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">checkup</span><span class="ps">名</span></div><div class="ja">健康診断；検査</div><div class="ex">My dog has a <b>checkup</b> today.</div><div class="xj">私の犬は今日健康診断を受けます。</div></button></li></ol></div><div id="quiz"
