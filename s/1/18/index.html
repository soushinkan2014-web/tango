<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中1 英単語 第18回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第18回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.82〜86　No.511〜540</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">shop</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">店</div><div class="ex">My aunt has a small <b>shop</b>.</div><div class="xj">私のおばは小さな店を持っています。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">something</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">何か</div><div class="ex">I want to eat <b>something</b>.</div><div class="xj">私は何か食べたいです。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">over there</span><span class="ps">熟</span></div><div class="ja">向こうに；あそこに</div><div class="ex">Look at the tall tree <b>over there</b>.</div><div class="xj">向こうの高い木を見て。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">college</span><span class="ps">名</span></div><div class="ja">大学</div><div class="ex">My brother is a <b>college</b> student.</div><div class="xj">私の兄は大学生です。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">come</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">来る</div><div class="ex">Please <b>come</b> to my birthday party.</div><div class="xj">私の誕生日パーティーに来てください。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">far</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">遠くに；遠い</div><div class="ex">Is the station <b>far</b> from here?</div><div class="xj">駅はここから遠いですか。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">house</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">家</div><div class="ex">Ken’s <b>house</b> has a big garden.</div><div class="xj">ケンの家には大きな庭があります。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">interesting</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">おもしろい；興味深い</div><div class="ex">This book is very <b>interesting</b>.</div><div class="xj">この本はとてもおもしろいです。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">library</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">図書館</div><div class="ex">We often study in the <b>library</b>.</div><div class="xj">私たちはよく図書館で勉強します。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">a little</span><span class="ps">熟</span></div><div class="ja">少し</div><div class="ex">I can speak English <b>a little</b>.</div><div class="xj">私は英語が少し話せます。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">museum</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">博物館；美術館</div><div class="ex">Let’s go to the <b>museum</b> on Sunday.</div><div class="xj">日曜日に博物館へ行こう。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">near</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の近くに</div><div class="ex">I live <b>near</b> the station.</div><div class="xj">私は駅の近くに住んでいます。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">plane</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">飛行機</div><div class="ex">I want to go to Hokkaido by <b>plane</b>.</div><div class="xj">私は飛行機で北海道に行きたいです。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">those</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">あれらの；あれら</div><div class="ex"><b>Those</b> shoes are Emi’s.</div><div class="xj">あれらのくつはエミのものです。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">usually</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">ふつうは；たいてい</div><div class="ex">I <b>usually</b> walk to school.</div><div class="xj">私はふつうは歩いて学校へ行きます。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">animal</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">動物</div><div class="ex">What <b>animal</b> do you like?</div><div class="xj">あなたはどんな動物が好きですか。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">Can you ～?</span><span class="ps">熟</span></div><div class="ja">～してくれませんか</div><div class="ex"><b>Can you</b> open the window?</div><div class="xj">窓を開けてくれませんか。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">exactly</span><span class="ps">副</span></div><div class="ja">そのとおり；正確に</div><div class="ex">A: You like dogs, right?<br>B: <b>Exactly</b>!</div><div class="xj">A：あなたは犬が好きですよね。B：そのとおり！</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">lot</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">たくさん（a lot / lots で）</div><div class="ex">We have <b>lots</b> of snow here.</div><div class="xj">ここでは雪がたくさん降ります。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">a lot of ～</span><span class="ps">熟</span></div><div class="ja">たくさんの～</div><div class="ex">Lisa has <b>a lot of</b> comic books.</div><div class="xj">リサはたくさんのマンガ本を持っています。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">quokka</span><span class="ps">名</span></div><div class="ja">クオッカ（オーストラリアの小さな動物）</div><div class="ex"><b>Quokkas</b> live in Australia.</div><div class="xj">クオッカはオーストラリアにすんでいます。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">unique</span><span class="ps">形</span></div><div class="ja">独特な；ほかにない</div><div class="ex">Emi’s drawings are <b>unique</b>.</div><div class="xj">エミの絵は独特です。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">around</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～のまわりを；～のあちこちを</div><div class="ex">Let’s walk <b>around</b> the park.</div><div class="xj">公園のまわりを歩こう。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">coral reef</span><span class="ps">熟</span></div><div class="ja">サンゴ礁</div><div class="ex">Many fish live in the <b>coral reef</b>.</div><div class="xj">たくさんの魚がサンゴ礁にすんでいます。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">be famous for ～</span><span class="ps">熟</span></div><div class="ja">～で有名である</div><div class="ex">Okinawa <b>is famous for</b> its beautiful sea.</div><div class="xj">沖縄は美しい海で有名です。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">gorgeous</span><span class="ps">形</span></div><div class="ja">とても美しい；豪華な</div><div class="ex">This beach is <b>gorgeous</b>!</div><div class="xj">このビーチはとても美しい！</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">helicopter</span><span class="ps">名</span></div><div class="ja">ヘリコプター</div><div class="ex">I want to ride in a <b>helicopter</b>.</div><div class="xj">私はヘリコプターに乗りたいです。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">land</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">着陸する；（陸に）降りる</div><div class="ex">The plane <b>lands</b> in Sydney.</div><div class="xj">その飛行機はシドニーに着陸します。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">look like ～</span><span class="ps">熟</span></div><div class="ja">～のように見える；～に似ている</div><div class="ex">That cloud <b>looks like</b> a cat.</div><div class="xj">あの雲はネコのように見えます。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">rich</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">豊かな；金持ちの</div><div class="ex">This sea is <b>rich</b> in fish.</div><div class="xj">この海は魚が豊かです。</div></button></li></ol><nav class="pn"><a href="../17/">← 第17回</a><a href="../19/">第19回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"511": 4.5, "512": 17.26, "513": 29.45, "514": 42.89, "515": 55.82, "516": 68.51, "517": 81.73, "518": 94.52, "519": 108.58, "520": 121.75, "521": 134.23, "522": 148.22, "523": 161.12, "524": 174.22, "525": 186.96, "526": 200.16, "527": 212.47, "528": 225.47, "529": 242.0, "530": 255.6, "531": 269.42, "532": 283.99, "533": 297.4, "534": 312.04, "535": 325.66, "536": 341.26, "537": 355.27, "538": 368.76, "539": 382.6, "540": 397.69};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
