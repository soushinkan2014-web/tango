</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第25回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.123〜128　No.721〜750</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../25.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">idea</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">考え；アイデア</div><div class="ex">That’s a good <b>idea</b>!</div><div class="xj">それはいい考えだね！</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">warming</span><span class="ps">名</span></div><div class="ja">温暖化（global warming で地球温暖化）</div><div class="ex">Global <b>warming</b> is a big problem.</div><div class="xj">地球温暖化は大きな問題です。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">ah</span><span class="ps">間</span></div><div class="ja">ああ</div><div class="ex"><b>Ah</b>, I see.</div><div class="xj">ああ、なるほど。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">oops</span><span class="ps">間</span></div><div class="ja">おっと；しまった</div><div class="ex"><b>Oops</b>! I dropped my pen.</div><div class="xj">おっと！ペンを落としちゃった。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">story</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">物語；話</div><div class="ex">I like this <b>story</b> very much.</div><div class="xj">私はこの物語が大好きです。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">was</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（I・he・she・it などが主語で）～であった；いた</div><div class="ex">It <b>was</b> sunny yesterday.</div><div class="xj">昨日は晴れでした。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">wasn’t</span><span class="ps">動</span></div><div class="ja">（～で）なかった（was not の短縮形）</div><div class="ex">The test <b>wasn’t</b> difficult.</div><div class="xj">テストは難しくありませんでした。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">were</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（you・we・they が主語で）～であった；いた</div><div class="ex">We <b>were</b> in the gym then.</div><div class="xj">私たちはそのとき体育館にいました。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">awesome</span><span class="ps">形</span></div><div class="ja">すごい；最高の</div><div class="ex">Your new bike is <b>awesome</b>!</div><div class="xj">あなたの新しい自転車はすごいね！</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">call</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">電話する；呼ぶ</div><div class="ex">I <b>called</b> Ken last night.</div><div class="xj">私は昨夜ケンに電話しました。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">fine</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">元気な；よい；晴れた</div><div class="ex">A: How are you?<br>B: I’m <b>fine</b>, thank you.</div><div class="xj">A：元気ですか。B：元気です、ありがとう。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">finish</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">終える；終わる</div><div class="ex">Did you <b>finish</b> your homework?</div><div class="xj">宿題を終えましたか。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">homework</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">宿題</div><div class="ex">I have a lot of <b>homework</b> today.</div><div class="xj">今日は宿題がたくさんあります。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">seven</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">7；7つ（の）</div><div class="ex">There are <b>seven</b> days in a week.</div><div class="xj">1週間は7日です。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">sleepy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">眠い</div><div class="ex">I’m very <b>sleepy</b> now.</div><div class="xj">私は今とても眠いです。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">surf</span><span class="ps">動</span></div><div class="ja">サーフィンをする</div><div class="ex">Tom often <b>surfs</b> in the sea.</div><div class="xj">トムはよく海でサーフィンをします。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">surprised</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">驚いた</div><div class="ex">Why are you <b>surprised</b>?</div><div class="xj">あなたはなぜ驚いているのですか。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">tired</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">疲れた</div><div class="ex">My mother is <b>tired</b> today.</div><div class="xj">母は今日疲れています。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">freezing</span><span class="ps">形</span></div><div class="ja">凍えるほど寒い；こおるような</div><div class="ex">It’s <b>freezing</b> outside!</div><div class="xj">外は凍えるほど寒い！</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">matter</span><span class="ps">名</span></div><div class="ja">問題；事がら</div><div class="ex">This is an important <b>matter</b>.</div><div class="xj">これは大切な問題です。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">What’s the matter?</span><span class="ps">熟</span></div><div class="ja">どうしたの？</div><div class="ex">A: <b>What’s the matter?</b><br>B: I’m hungry.</div><div class="xj">A：どうしたの？B：おなかがすいたよ。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">snowy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">雪の多い；雪の降る</div><div class="ex">Sapporo is <b>snowy</b> in winter.</div><div class="xj">札幌は冬に雪が多いです。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">young</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">若い</div><div class="ex">My aunt is very <b>young</b>.</div><div class="xj">私のおばはとても若いです。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">bed</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ベッド；寝床</div><div class="ex">My cat sleeps on my <b>bed</b>.</div><div class="xj">私のネコは私のベッドの上で寝ます。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">bedroom</span><span class="ps">名</span></div><div class="ja">寝室</div><div class="ex">I have a TV in my <b>bedroom</b>.</div><div class="xj">私の寝室にはテレビがあります。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">follow</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">ついて行く；従う</div><div class="ex">Please <b>follow</b> me.</div><div class="xj">私について来てください。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">trampoline</span><span class="ps">名</span></div><div class="ja">トランポリン</div><div class="ex">The children jumped on the <b>trampoline</b>.</div><div class="xj">子どもたちはトランポリンで跳びました。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">bad</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">悪い</div><div class="ex">The weather is <b>bad</b> today.</div><div class="xj">今日は天気が悪いです。</div></button></li><li><button class="w" data-no="749"><div class="top"><span class="no">749</span><span class="en">bang</span><span class="ps">名</span></div><div class="ja">ドン（という大きな音）；バン</div><div class="ex">I heard a big <b>bang</b>.</div><div class="xj">私は大きなドンという音を聞きました。</div></button></li><li><button class="w" data-no="750"><div class="top"><span class="no">750</span><span class="en">broke</span><span class="ps">動</span></div><div class="ja">こわした；割った（break の過去形）</div><div class="ex">I <b>broke</b> my cup.</div><div class="xj">私はカップを割りました。</div></button></li></ol><nav class="pn"><a href="../24/">← 第24回</a><a href="../26/">第26回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"721": 4.62, "722": 17.34, "723": 32.57, "724": 44.88, "725": 59.23, "726": 72.76, "727": 89.15, "728": 103.5, "729": 118.49, "730": 131.83, "731": 144.91, "732": 160.07, "733": 172.98, "734": 185.72, "735": 198.67, "736": 211.32, "737": 224.42, "738": 237.2, "739": 249.87, "740": 263.98, "741": 276.91, "742": 291.71, "743": 305.96, "744": 318.49, "745": 331.59, "746": 344.33, "747": 357.0, "748": 369.98, "749": 382.45, "750": 396.06};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
