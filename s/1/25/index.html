an><span class=star>★</span><span class="ek">英4</span></div><div class="ja">物語；話</div><div class="ex">I like this <b>story</b> very much.</div><div class="xj">私はこの物語が大好きです。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">was</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（I・he・she・it などが主語で）～であった；いた</div><div class="ex">It <b>was</b> sunny yesterday.</div><div class="xj">昨日は晴れでした。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">wasn’t</span><span class="ps">動</span></div><div class="ja">（～で）なかった（was not の短縮形）</div><div class="ex">The test <b>wasn’t</b> difficult.</div><div class="xj">テストは難しくありませんでした。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">were</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（you・we・they が主語で）～であった；いた</div><div class="ex">We <b>were</b> in the gym then.</div><div class="xj">私たちはそのとき体育館にいました。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">awesome</span><span class="ps">形</span></div><div class="ja">すごい；最高の</div><div class="ex">Your new bike is <b>awesome</b>!</div><div class="xj">あなたの新しい自転車はすごいね！</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">call</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">電話する；呼ぶ</div><div class="ex">I <b>called</b> Ken last night.</div><div class="xj">私は昨夜ケンに電話しました。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">fine</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">元気な；よい；晴れた</div><div class="ex">A: How are you?<br>B: I’m <b>fine</b>, thank you.</div><div class="xj">A：元気ですか。B：元気です、ありがとう。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">finish</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">終える；終わる</div><div class="ex">Did you <b>finish</b> your homework?</div><div class="xj">宿題を終えましたか。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">homework</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">宿題</div><div class="ex">I have a lot of <b>homework</b> today.</div><div class="xj">今日は宿題がたくさんあります。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">seven</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">7；7つ（の）</div><div class="ex">There are <b>seven</b> days in a week.</div><div class="xj">1週間は7日です。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">sleepy</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">眠い</div><div class="ex">I’m very <b>sleepy</b> now.</div><div class="xj">私は今とても眠いです。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">surf</span><span class="ps">動</span></div><div class="ja">サーフィンをする</div><div class="ex">Tom often <b>surfs</b> in the sea.</div><div class="xj">トムはよく海でサーフィンをします。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">surprised</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">驚いた</div><div class="ex">Why are you <b>surprised</b>?</div><div class="xj">あなたはなぜ驚いているのですか。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">tired</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">疲れた</div><div class="ex">My mother is <b>tired</b> today.</div><div class="xj">母は今日疲れています。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">freezing</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">凍えるほど寒い；こおるような</div><div class="ex">It’s <b>freezing</b> outside!</div><div class="xj">外は凍えるほど寒い！</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">matter</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">問題；事がら</div><div class="ex">This is an important <b>matter</b>.</div><div class="xj">これは大切な問題です。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">What’s the matter?</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">どうしたの？</div><div class="ex">A: <b>What’s the matter?</b><br>B: I’m hungry.</div><div class="xj">A：どうしたの？B：おなかがすいたよ。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">snowy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">雪の多い；雪の降る</div><div class="ex">Sapporo is <b>snowy</b> in winter.</div><div class="xj">札幌は冬に雪が多いです。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">young</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">若い</div><div class="ex">My aunt is very <b>young</b>.</div><div class="xj">私のおばはとても若いです。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">bed</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ベッド；寝床</div><div class="ex">My cat sleeps on my <b>bed</b>.</div><div class="xj">私のネコは私のベッドの上で寝ます。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">bedroom</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">寝室</div><div class="ex">I have a TV in my <b>bedroom</b>.</div><div class="xj">私の寝室にはテレビがあります。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">follow</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">ついて行く；従う</div><div class="ex">Please <b>follow</b> me.</div><div class="xj">私について来てください。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">trampoline</span><span class="ps">名</span></div><div class="ja">トランポリン</div><div class="ex">The children jumped on the <b>trampoline</b>.</div><div class="xj">子どもたちはトランポリンで跳びました。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">bad</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">悪い</div><div class="ex">The weather is <b>bad</b> today.</div><div class="xj">今日は天気が悪いです。</div></button></li><li><button class="w" data-no="749"><div class="top"><span class="no">749</span><span class="en">bang</span><span class="ps">名</span></div><div class="ja">ドン（という大きな音）；バン</div><div class="ex">I heard a big <b>bang</b>.</div><div class="xj">私は大きなドンという音を聞きました。</div></button></li><li><button class="w" data-no="750"><div class="top"><span class="no">750</span><span class="en">broke</span><span class="ps">動</span></div><div class="ja">こわした；割った（break の過去形）</div><div class="ex">I <b>broke</b> my cup.</div><div class="xj">私はカップを割りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../24/">← 第24回</a><a href="../26/">第26回 →</a></nav></
