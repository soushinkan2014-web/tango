</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第2回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.13〜14　No.31〜60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">up</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">上へ；起きて</div><div class="ex">Stand <b>up</b>, please.</div><div class="xj">立ち上がってください。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">a</span><span class="ps">冠</span><span class=star>★</span></div><div class="ja">1つの；1人の；ある</div><div class="ex">I have <b>a</b> sister.</div><div class="xj">私には姉が1人います。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">and</span><span class="ps">接</span><span class=star>★</span></div><div class="ja">～と…；そして</div><div class="ex">I like dogs <b>and</b> cats.</div><div class="xj">私は犬とネコが好きです。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">ball</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ボール；球</div><div class="ex">I have a new soccer <b>ball</b>.</div><div class="xj">私は新しいサッカーボールを持っています。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">basketball</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">バスケットボール</div><div class="ex">We play <b>basketball</b> in the park.</div><div class="xj">私たちは公園でバスケットボールをします。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">club</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">クラブ；部</div><div class="ex">I’m in the tennis <b>club</b>.</div><div class="xj">私はテニス部に入っています。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">cook</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">料理する</div><div class="ex">I <b>cook</b> with my mother on Sundays.</div><div class="xj">私は日曜日に母と料理をします。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">day</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">日；1日</div><div class="ex">Have a nice <b>day</b>!</div><div class="xj">よい1日を！</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">every day</span><span class="ps">熟</span></div><div class="ja">毎日</div><div class="ex">I practice the piano <b>every day</b>.</div><div class="xj">私は毎日ピアノを練習します。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">dish</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">料理；皿</div><div class="ex">I want to try this <b>dish</b>.</div><div class="xj">私はこの料理を食べてみたいです。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">dribble</span><span class="ps">動</span></div><div class="ja">ドリブルする</div><div class="ex">I can <b>dribble</b> the ball well.</div><div class="xj">私は上手にボールをドリブルすることができます。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">enjoy</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">楽しむ</div><div class="ex">We <b>enjoy</b> the summer festival.</div><div class="xj">私たちは夏祭りを楽しみます。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">every</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">毎～；どの～も</div><div class="ex">I get up at six <b>every</b> morning.</div><div class="xj">私は毎朝6時に起きます。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">exciting</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">わくわくさせる；おもしろい</div><div class="ex">Basketball games are <b>exciting</b>.</div><div class="xj">バスケットボールの試合はわくわくします。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">fish</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">魚</div><div class="ex">We can see many <b>fish</b> here.</div><div class="xj">ここではたくさんの魚が見られます。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">flute</span><span class="ps">名</span></div><div class="ja">フルート</div><div class="ex">I want to play the <b>flute</b>.</div><div class="xj">私はフルートを吹きたいです。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">good</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">よい；上手な</div><div class="ex">I have a <b>good</b> idea.</div><div class="xj">私によい考えがあります。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">gym</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">体育館</div><div class="ex">We play volleyball in the <b>gym</b>.</div><div class="xj">私たちは体育館でバレーボールをします。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">in</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の中に；～で</div><div class="ex">I have a pen <b>in</b> my bag.</div><div class="xj">私のかばんの中にペンが入っています。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">it</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">それは；それを</div><div class="ex">A: Do you like curry?<br>B: Yes, I love <b>it</b>.</div><div class="xj">A：カレーは好きですか。B：はい、それが大好きです。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">it’s</span><span class="ps">代</span></div><div class="ja">それは～です（it is の短縮形）</div><div class="ex">A: What’s this?<br>B: <b>It’s</b> a lemon.</div><div class="xj">A：これは何ですか。B：それはレモンです。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">let’s</span><span class="ps">熟</span><span class=star>★</span></div><div class="ja">～しよう（let us の短縮形）</div><div class="ex"><b>Let’s</b> go to the gym.</div><div class="xj">体育館へ行きましょう。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">make</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">作る</div><div class="ex">I <b>make</b> cookies with my sister.</div><div class="xj">私は姉といっしょにクッキーを作ります。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">meet</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">会う</div><div class="ex">I want to <b>meet</b> your family.</div><div class="xj">私はあなたの家族に会いたいです。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">music</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">音楽</div><div class="ex">I listen to <b>music</b> every night.</div><div class="xj">私は毎晩音楽を聞きます。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">practice</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">練習する；練習</div><div class="ex">We <b>practice</b> tennis on Fridays.</div><div class="xj">私たちは毎週金曜日にテニスを練習します。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">room</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">部屋</div><div class="ex">I like my <b>room</b>.</div><div class="xj">私は自分の部屋が好きです。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">run</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">走る</div><div class="ex">Let’s <b>run</b> to the park.</div><div class="xj">公園まで走ろう。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">Saturday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">土曜日</div><div class="ex">We play soccer on <b>Saturdays</b>.</div><div class="xj">私たちは毎週土曜日にサッカーをします。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">school</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">学校</div><div class="ex">I walk to <b>school</b>.</div><div class="xj">私は歩いて学校へ行きます。</div></button></li></ol></div><div id="quiz"
