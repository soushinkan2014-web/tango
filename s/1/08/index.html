s="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">any</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">（疑問文で）いくつかの；何か；（否定文で）1つも</div><div class="ex">Do you have <b>any</b> questions?</div><div class="xj">何か質問はありますか。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">how</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">どう；どのように；どれくらい</div><div class="ex">A: I’m hungry. <b>How</b> about you?<br>B: Me, too.</div><div class="xj">A：おなかがすいたよ。あなたはどう？B：私も。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">How many ～?</span><span class="ps">熟</span></div><div class="ja">いくつの～か</div><div class="ex"><b>How many</b> pencils do you have?</div><div class="xj">あなたはえんぴつを何本持っていますか。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">pencil</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">えんぴつ</div><div class="ex">Do you have a <b>pencil</b>?</div><div class="xj">あなたはえんぴつを持っていますか。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">two</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">2（の）</div><div class="ex">I have <b>two</b> brothers.</div><div class="xj">私には兄弟が2人います。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">cup</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">カップ；茶わん</div><div class="ex">We need five <b>cups</b>.</div><div class="xj">私たちはカップが5つ必要です。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">girl</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div>
