</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第6回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.25〜31　No.151〜180</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">new</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">新しい</div><div class="ex">Are you a <b>new</b> student?</div><div class="xj">あなたは新しい生徒ですか。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">problem</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">問題；困ったこと</div><div class="ex">I have a big <b>problem</b>.</div><div class="xj">私には大きな問題があります。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">No problem.</span><span class="ps">熟</span></div><div class="ja">いいですよ；問題ないよ</div><div class="ex">A: Can you help me?<br>B: <b>No problem.</b></div><div class="xj">A：手伝ってくれますか。B：いいですよ。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">thank</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">感謝する；礼を言う</div><div class="ex">We <b>thank</b> our teachers.</div><div class="xj">私たちは先生たちに感謝しています。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">want to ～</span><span class="ps">熟</span></div><div class="ja">～したい</div><div class="ex">I <b>want to</b> go to Hokkaido.</div><div class="xj">私は北海道へ行きたいです。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">careful</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">注意深い；気をつける</div><div class="ex">Please be <b>careful</b> on the road.</div><div class="xj">道路では気をつけてください。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">cheerful</span><span class="ps">形</span></div><div class="ja">明るい；元気のよい</div><div class="ex">You are very <b>cheerful</b>.</div><div class="xj">あなたはとても明るいですね。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">fan</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ファン</div><div class="ex">I’m a <b>fan</b> of this team.</div><div class="xj">私はこのチームのファンです。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">be good at ～</span><span class="ps">熟</span></div><div class="ja">～が得意である；～が上手である</div><div class="ex">We <b>are good at</b> soccer.</div><div class="xj">私たちはサッカーが得意です。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">honest</span><span class="ps">形</span></div><div class="ja">正直な</div><div class="ex">You are an <b>honest</b> boy.</div><div class="xj">あなたは正直な男の子ですね。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">Japanese</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">日本語；日本人</div><div class="ex">Can you speak <b>Japanese</b>?</div><div class="xj">あなたは日本語を話せますか。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">math</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">数学</div><div class="ex">We have <b>math</b> on Mondays.</div><div class="xj">私たちは毎週月曜日に数学があります。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">movie</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">映画</div><div class="ex">Let’s see a <b>movie</b> on Saturday.</div><div class="xj">土曜日に映画を見よう。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">of</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の</div><div class="ex">This is a picture <b>of</b> my family.</div><div class="xj">これは私の家族の写真です。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">P.E.</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">体育</div><div class="ex">We have <b>P.E.</b> today.</div><div class="xj">今日は体育があります。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">polite</span><span class="ps">形</span></div><div class="ja">礼儀正しい；ていねいな</div><div class="ex">Please be <b>polite</b> to everyone.</div><div class="xj">だれにでも礼儀正しくしてください。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">quiet</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">静かな</div><div class="ex">Be <b>quiet</b> in the library.</div><div class="xj">図書館では静かにしなさい。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">science</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">理科；科学</div><div class="ex">I want to be a <b>science</b> teacher.</div><div class="xj">私は理科の先生になりたいです。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">social studies</span><span class="ps">熟</span></div><div class="ja">社会（科）</div><div class="ex">We have <b>social studies</b> on Friday.</div><div class="xj">私たちは金曜日に社会があります。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">everyone</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">みんな；だれでも</div><div class="ex">Let’s sing, <b>everyone</b>!</div><div class="xj">みんな、歌いましょう！</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">Thank you.</span><span class="ps">熟</span></div><div class="ja">ありがとう</div><div class="ex">A: Here you are.<br>B: <b>Thank you.</b></div><div class="xj">A：はい、どうぞ。B：ありがとう。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">don’t</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～しない（do not の短縮形）</div><div class="ex">I <b>don’t</b> like tomatoes.</div><div class="xj">私はトマトが好きではありません。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">five</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">5（の）</div><div class="ex">I get up at <b>five</b>.</div><div class="xj">私は5時に起きます。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">home</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">家；家庭；家に</div><div class="ex">This is my <b>home</b>.</div><div class="xj">ここが私の家です。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">at home</span><span class="ps">熟</span></div><div class="ja">家で</div><div class="ex">I study <b>at home</b>.</div><div class="xj">私は家で勉強します。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">on</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の上に；（曜日・日付）に</div><div class="ex">Put your bag <b>on</b> the desk.</div><div class="xj">かばんを机の上に置いて。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">walk</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">歩く；散歩させる</div><div class="ex">Let’s <b>walk</b> to the station.</div><div class="xj">駅まで歩こう。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">weekend</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">週末</div><div class="ex">What do you do on <b>weekends</b>?</div><div class="xj">あなたは週末に何をしますか。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">after</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～のあとに</div><div class="ex">Let’s play <b>after</b> lunch.</div><div class="xj">昼食のあとで遊ぼう。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">beautiful</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">美しい；きれいな</div><div class="ex">Look at the <b>beautiful</b> sky!</div><div class="xj">美しい空を見て！</div></button></li></ol><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"151": 4.24, "152": 16.35, "153": 29.48, "154": 45.38, "155": 58.55, "156": 71.15, "157": 84.73, "158": 97.97, "159": 110.4, "160": 125.52, "161": 137.94, "162": 151.88, "163": 164.55, "164": 177.2, "165": 189.98, "166": 202.32, "167": 215.9, "168": 228.44, "169": 242.12, "170": 256.37, "171": 269.54, "172": 283.67, "173": 297.71, "174": 310.02, "175": 322.35, "176": 334.63, "177": 349.03, "178": 362.3, "179": 374.8, "180": 387.58};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
