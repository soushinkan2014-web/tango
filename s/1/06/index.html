<li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">want to ～</span><span class="ps">熟</span></div><div class="ja">～したい</div><div class="ex">I <b>want to</b> go to Hokkaido.</div><div class="xj">私は北海道へ行きたいです。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">careful</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">注意深い；気をつける</div><div class="ex">Please be <b>careful</b> on the road.</div><div class="xj">道路では気をつけてください。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">cheerful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">明るい；元気のよい</div><div class="ex">You are very <b>cheerful</b>.</div><div class="xj">あなたはとても明るいですね。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">fan</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">ファン</div><div class="ex">I’m a <b>fan</b> of this team.</div><div class="xj">私はこのチームのファンです。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">be good at ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～が得意である；～が上手である</div><div class="ex">We <b>are good at</b> soccer.</div><div class="xj">私たちはサッカーが得意です。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">honest</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">正直な</div><div class="ex">You are an <b>honest</b> boy.</div><div class="xj">あなたは正直な男の子ですね。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">Japanese</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">日本語；日本人</div><div class="ex">Can you speak <b>Japanese</b>?</div><div class="xj">あなたは日本語を話せますか。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">math</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">数学</div><div class="ex">We have <b>math</b> on Mondays.</div><div class="xj">私たちは毎週月曜日に数学があります。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">movie</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">映画</div><div class="ex">Let’s see a <b>movie</b> on Saturday.</div><div class="xj">土曜日に映画を見よう。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">of</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の</div><div class="ex">This is a picture <b>of</b> my family.</div><div class="xj">これは私の家族の写真です。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">P.E.</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">体育</div><div class="ex">We have <b>P.E.</b> today.</div><div class="xj">今日は体育があります。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">polite</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">礼儀正しい；ていねいな</div><div class="ex">Please be <b>polite</b> to everyone.</div><div class="xj">だれにでも礼儀正しくしてください。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">quiet</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">静かな</div><div class="ex">Be <b>quiet</b> in the library.</div><div class="xj">図書館では静かにしなさい。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">science</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">理科；科学</div><div class="ex">I want to be a <b>science</b> teacher.</div><div class="xj">私は理科の先生になりたいです。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">social studies</span><span class="ps">熟</span></div><div class="ja">社会（科）</div><div class="ex">We have <b>social studies</b> on Friday.</div><div class="xj">私たちは金曜日に社会があります。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">everyone</span><span class="ps">代</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">みんな；だれでも</div><div class="ex">Let’s sing, <b>everyone</b>!</div><div class="xj">みんな、歌いましょう！</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">Thank you.</span><span class="ps">熟</span></div><div class="ja">ありがとう</div><div class="ex">A: Here you are.<br>B: <b>Thank you.</b></div><div class="xj">A：はい、どうぞ。B：ありがとう。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">don’t</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～しない（do not の短縮形）</div><div class="ex">I <b>don’t</b> like tomatoes.</div><div class="xj">私はトマトが好きではありません。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">five</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">5（の）</div><div class="ex">I get up at <b>five</b>.</div><div class="xj">私は5時に起きます。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">home</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">
