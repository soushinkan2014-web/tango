</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第12回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.50〜53　No.331〜360</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">large</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">大きい；（サイズが）Lの</div><div class="ex">I want a <b>large</b> pizza.</div><div class="xj">私は大きなピザがほしいです。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">meal</span><span class="ps">名</span></div><div class="ja">食事</div><div class="ex">We have three <b>meals</b> a day.</div><div class="xj">私たちは1日に3回食事をします。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">medium</span><span class="ps">形</span></div><div class="ja">（サイズが）Mの；中くらいの</div><div class="ex">Can I have a <b>medium</b> orange juice?</div><div class="xj">Mサイズのオレンジジュースをもらえますか。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">member</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">一員；メンバー</div><div class="ex">I am a <b>member</b> of the tennis team.</div><div class="xj">私はテニス部の一員です。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">menu</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">メニュー</div><div class="ex">Can I see the <b>menu</b>?</div><div class="xj">メニューを見せてもらえますか。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">How much ～?</span><span class="ps">熟</span></div><div class="ja">（値段が）いくら</div><div class="ex"><b>How much</b> is this T-shirt?</div><div class="xj">このTシャツはいくらですか。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">one</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">1（の）；1つ</div><div class="ex">I want <b>one</b> more cookie.</div><div class="xj">クッキーがもう1枚ほしいです。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">or</span><span class="ps">接</span><span class=star>★</span></div><div class="ja">それとも；または</div><div class="ex">Do you like dogs <b>or</b> cats?</div><div class="xj">あなたは犬が好きですか、それともネコが好きですか。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">orange</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">オレンジ；オレンジ色</div><div class="ex">Let’s eat <b>oranges</b> after lunch.</div><div class="xj">昼ごはんのあとにオレンジを食べよう。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">please</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">どうぞ；お願いします</div><div class="ex"><b>Please</b> sit down.</div><div class="xj">どうぞ座ってください。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">salad</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">サラダ</div><div class="ex">We eat <b>salad</b> for breakfast.</div><div class="xj">私たちは朝食にサラダを食べます。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">six</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">6（の）</div><div class="ex">We have <b>six</b> classes on Monday.</div><div class="xj">月曜日は授業が6時間あります。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">size</span><span class="ps">名</span></div><div class="ja">大きさ；サイズ</div><div class="ex">What <b>size</b> do you want?</div><div class="xj">あなたはどのサイズがほしいですか。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">small</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">小さい</div><div class="ex">I have a <b>small</b> dog.</div><div class="xj">私は小さい犬を飼っています。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">staff</span><span class="ps">名</span></div><div class="ja">スタッフ；職員</div><div class="ex">Please ask the <b>staff</b>.</div><div class="xj">スタッフにたずねてください。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">in total</span><span class="ps">熟</span></div><div class="ja">全部で；合計で</div><div class="ex">We have ten students <b>in total</b>.</div><div class="xj">生徒は全部で10人います。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">twenty</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">20（の）</div><div class="ex">I have <b>twenty</b> comic books.</div><div class="xj">私はマンガを20冊持っています。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">brand</span><span class="ps">名</span></div><div class="ja">ブランド；銘柄</div><div class="ex">I like this <b>brand</b>.</div><div class="xj">私はこのブランドが好きです。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">buy</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">買う</div><div class="ex">I want to <b>buy</b> a new bike.</div><div class="xj">私は新しい自転車を買いたいです。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">cookie</span><span class="ps">名</span></div><div class="ja">クッキー</div><div class="ex">Let’s make <b>cookies</b> together.</div><div class="xj">いっしょにクッキーを作ろう。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">famous</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">有名な</div><div class="ex">I want to be a <b>famous</b> singer.</div><div class="xj">私は有名な歌手になりたいです。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">isn’t</span><span class="ps">動</span></div><div class="ja">～ではない（is not の短縮形）</div><div class="ex">This <b>isn’t</b> my pen.</div><div class="xj">これは私のペンではありません。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">jelly</span><span class="ps">名</span></div><div class="ja">ゼリー</div><div class="ex">I like orange <b>jelly</b>.</div><div class="xj">私はオレンジゼリーが好きです。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">she</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">彼女は；彼女が</div><div class="ex"><b>She</b> can play the guitar.</div><div class="xj">彼女はギターを弾けます。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">who</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">だれ；だれが</div><div class="ex"><b>Who</b> can play the piano?</div><div class="xj">だれがピアノを弾けますか。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">woman</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">女性</div><div class="ex">I want to talk with that <b>woman</b>.</div><div class="xj">私はあの女性と話したいです。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">boy</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">男の子；少年</div><div class="ex">The <b>boys</b> are in the gym.</div><div class="xj">男の子たちは体育館にいます。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">butterfly</span><span class="ps">名</span></div><div class="ja">チョウ</div><div class="ex">We can see many <b>butterflies</b> in spring.</div><div class="xj">春にはたくさんのチョウが見られます。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">classmate</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">クラスメート；同級生</div><div class="ex">Ken and I are <b>classmates</b>.</div><div class="xj">ケンと私はクラスメートです。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">court</span><span class="ps">名</span></div><div class="ja">コート（球技をする場所）</div><div class="ex">Let’s play tennis on this <b>court</b>.</div><div class="xj">このコートでテニスをしよう。</div></button></li></ol><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"331": 4.43, "332": 17.91, "333": 30.46, "334": 44.52, "335": 57.91, "336": 69.93, "337": 82.67, "338": 95.48, "339": 108.77, "340": 122.52, "341": 135.24, "342": 148.36, "343": 161.63, "344": 174.7, "345": 187.25, "346": 200.52, "347": 214.32, "348": 227.06, "349": 239.82, "350": 252.3, "351": 264.8, "352": 277.78, "353": 291.69, "354": 304.02, "355": 317.12, "356": 329.55, "357": 342.05, "358": 355.15, "359": 368.59, "360": 382.7};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
