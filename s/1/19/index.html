"top"><span class="no">546</span><span class="en">cost</span><span class="ps">動</span></div><div class="ja">（費用が）かかる；（値段が）～する</div><div class="ex">The ticket <b>costs</b> ten dollars.</div><div class="xj">そのチケットは10ドルします。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">feed</span><span class="ps">動</span></div><div class="ja">えさをやる；食べ物を与える</div><div class="ex">I <b>feed</b> my cat every morning.</div><div class="xj">私は毎朝ネコにえさをやります。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">gate</span><span class="ps">名</span></div><div class="ja">門</div><div class="ex">Let’s meet at the school <b>gate</b>.</div><div class="xj">学校の門で会おう。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">grove</span><span class="ps">名</span></div><div class="ja">林；木立</div><div class="ex">This bamboo <b>grove</b> is beautiful.</div><div class="xj">この竹林は美しいです。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">lion</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ライオン</div><div class="ex">Can you see the <b>lion</b>?</div><div class="xj">ライオンが見えますか。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">low</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">低い</div><div class="ex">That wall is very <b>low</b>.</div><div class="xj">あのかべはとても低いです。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">next</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">次の；となりの</div><div class="ex">The <b>next</b> bus comes at nine.</div><div class="xj">次のバスは9時に来ます。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">next to ～</span><span class="ps">熟</span></div><div class="ja">～のとなりに</div><div class="ex">My school is <b>next to</b> the library.</div><div class="xj">私の学校は図書館のとなりにあります。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">popular</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">人気のある</div><div class="ex">This song is <b>popular</b> in Japan.</div><div class="xj">この歌は日本で人気があります。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">turtle</span><span class="ps">名</span></div><div class="ja">カメ</div><div class="ex">My brother has two <b>turtles</b>.</div><div class="xj">私の兄はカメを2匹飼っています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">convenience store</span><span class="ps">熟</span></div><div class="ja">コンビニエンスストア；コンビニ</div><div class="ex">The <b>convenience store</b> is near my house.</div><div class="xj">そのコンビニは私の家の近くにあります。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">nine</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">9；9つ（の）</div><div class="ex">My sister is <b>nine</b> years old.</div><div class="xj">私の妹は9歳です。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">o’clock</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">～時</div><div class="ex">School starts at eight <b>o’clock</b>.</div><div class="xj">学校は8時に始まります。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">ten</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">10；10（の）</div><div class="ex">I have <b>ten</b> pencils.</div><div class="xj">私は鉛筆を10本持っています。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">down</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">下へ；下に</div><div class="ex">Don’t look <b>down</b>!</div><div class="xj">下を見ないで！</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">excuse</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（Excuse me. で）すみません；許す</div><div class="ex"><b>Excuse</b> me. Is this your pen?</div><div class="xj">すみません。これはあなたのペンですか。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">Excuse me, but ～.</span><span class="ps">熟</span></div><div class="ja">すみませんが～</div><div class="ex"><b>Excuse me, but</b> where is the library?</div><div class="xj">すみませんが、図書館はどこですか。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">floor</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">階；床</div><div class="ex">The shoe shop is on the fourth <b>floor</b>.</div><div class="xj">くつ屋は4階にあります。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">guest</span><span class="ps">名</span></div><div class="ja">客；お客さん</div><div class="ex">We have a <b>guest</b> today.</div><div class="xj">今日はお客さんが来ます。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">left</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">左；左側</div><div class="ex">The bank is on your <b>left</b>.</div><div class="xj">銀行は左側にあります。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">now</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">今</div><div class="ex">What time is it <b>now</b>?</div><div class="xj">今何時ですか。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">office</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">事務所；会社；職員室（teachers&#x27; office）</div><div class="ex">The school <b>office</b> is on the first floor.</div><div class="xj">学校の事務所は1階にあります。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">second</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">2番目の；第2の</div><div class="ex">February is the <b>second</b> month of the year.</div><div class="xj">2月は1年の2番目の月です。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">stair</span><span class="ps">名</span></div><div class="ja">階段（ふつう stairs）</div><div class="ex">Go up the <b>stairs</b>, please.</div><div class="xj">階段を上がってください。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">straight</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">まっすぐに</div><div class="ex">Go <b>straight</b> along this street.</div><div class="xj">この通りをまっすぐ行ってください。</div></button></li></ol><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"541": 4.55, "542": 18.08, "543": 32.45, "544": 46.56, "545": 59.78, "546": 72.09, "547": 86.96, "548": 101.02, "549": 113.48, "550": 127.03, "551": 139.12, "552": 151.41, "553": 164.39, "554": 177.92, "555": 191.04, "556": 203.78, "557": 219.6, "558": 233.01, "559": 246.08, "560": 258.68, "561": 270.82, "562": 288.02, "563": 303.67, "564": 316.72, "565": 329.34, "566": 342.32, "567": 354.46, "568": 368.23, "569": 382.44, "570": 396.23};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
