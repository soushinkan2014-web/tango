</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第19回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.86〜91　No.541〜570</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">scenery</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">景色；風景</div><div class="ex">I like the <b>scenery</b> of this town.</div><div class="xj">私はこの町の景色が好きです。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">seaplane</span><span class="ps">名</span></div><div class="ja">水上飛行機</div><div class="ex">Look! That’s a <b>seaplane</b>.</div><div class="xj">見て！あれは水上飛行機だよ。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">show ～ around</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">～を案内する</div><div class="ex">Please <b>show me around</b> Kyoto.</div><div class="xj">私に京都を案内してください。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">someday</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">いつか</div><div class="ex">I want to visit Australia <b>someday</b>.</div><div class="xj">私はいつかオーストラリアを訪れたいです。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">bamboo</span><span class="ps">名</span></div><div class="ja">竹</div><div class="ex">Pandas eat <b>bamboo</b>.</div><div class="xj">パンダは竹を食べます。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">cost</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（費用が）かかる；（値段が）～する</div><div class="ex">The ticket <b>costs</b> ten dollars.</div><div class="xj">そのチケットは10ドルします。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">feed</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">えさをやる；食べ物を与える</div><div class="ex">I <b>feed</b> my cat every morning.</div><div class="xj">私は毎朝ネコにえさをやります。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">gate</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">門</div><div class="ex">Let’s meet at the school <b>gate</b>.</div><div class="xj">学校の門で会おう。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">grove</span><span class="ps">名</span></div><div class="ja">林；木立</div><div class="ex">This bamboo <b>grove</b> is beautiful.</div><div class="xj">この竹林は美しいです。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">lion</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ライオン</div><div class="ex">Can you see the <b>lion</b>?</div><div class="xj">ライオンが見えますか。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">low</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">低い</div><div class="ex">That wall is very <b>low</b>.</div><div class="xj">あのかべはとても低いです。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">next</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">次の；となりの</div><div class="ex">The <b>next</b> bus comes at nine.</div><div class="xj">次のバスは9時に来ます。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">next to ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～のとなりに</div><div class="ex">My school is <b>next to</b> the library.</div><div class="xj">私の学校は図書館のとなりにあります。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">popular</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">人気のある</div><div class="ex">This song is <b>popular</b> in Japan.</div><div class="xj">この歌は日本で人気があります。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">turtle</span><span class="ps">名</span></div><div class="ja">カメ</div><div class="ex">My brother has two <b>turtles</b>.</div><div class="xj">私の兄はカメを2匹飼っています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">convenience store</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">コンビニエンスストア；コンビニ</div><div class="ex">The <b>convenience store</b> is near my house.</div><div class="xj">そのコンビニは私の家の近くにあります。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">nine</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">9；9つ（の）</div><div class="ex">My sister is <b>nine</b> years old.</div><div class="xj">私の妹は9歳です。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">o’clock</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">～時</div><div class="ex">School starts at eight <b>o’clock</b>.</div><div class="xj">学校は8時に始まります。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">ten</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">10；10（の）</div><div class="ex">I have <b>ten</b> pencils.</div><div class="xj">私は鉛筆を10本持っています。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">down</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">下へ；下に</div><div class="ex">Don’t look <b>down</b>!</div><div class="xj">下を見ないで！</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">excuse</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（Excuse me. で）すみません；許す</div><div class="ex"><b>Excuse</b> me. Is this your pen?</div><div class="xj">すみません。これはあなたのペンですか。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">Excuse me, but ～.</span><span class="ps">熟</span></div><div class="ja">すみませんが～</div><div class="ex"><b>Excuse me, but</b> where is the library?</div><div class="xj">すみませんが、図書館はどこですか。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">floor</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">階；床</div><div class="ex">The shoe shop is on the fourth <b>floor</b>.</div><div class="xj">くつ屋は4階にあります。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">guest</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">客；お客さん</div><div class="ex">We have a <b>guest</b> today.</div><div class="xj">今日はお客さんが来ます。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">left</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">左；左側</div><div class="ex">The bank is on your <b>left</b>.</div><div class="xj">銀行は左側にあります。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">now</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">今</div><div class="ex">What time is it <b>now</b>?</div><div class="xj">今何時ですか。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">office</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">事務所；会社；職員室（teachers&#x27; office）</div><div class="ex">The school <b>office</b> is on the first floor.</div><div class="xj">学校の事務所は1階にあります。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">second</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">2番目の；第2の</div><div class="ex">February is the <b>second</b> month of the year.</div><div class="xj">2月は1年の2番目の月です。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">stair</span><span class="ps">名</span></div><div class="ja">階段（ふつう stairs）</div><div class="ex">Go up the <b>stairs</b>, please.</div><div class="xj">階段を上がってください。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">straight</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">まっすぐに</div><div class="ex">Go <b>straight</b> along this street.</div><div class="xj">この通りをまっすぐ行ってください。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭
