n class="w" data-no="815"><div class="top"><span class="no">815</span><span class="en">foggy</span><span class="ps">形</span></div><div class="ja">霧のかかった</div><div class="ex">It was <b>foggy</b> on the mountain.</div><div class="xj">山の上は霧がかかっていました。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">four</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">4；4つ（の）</div><div class="ex">There are <b>four</b> people in my family.</div><div class="xj">私の家族は4人です。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">fourteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">14（の）</div><div class="ex">Two weeks is <b>fourteen</b> days.</div><div class="xj">2週間は14日です。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">fourteenth</span><span class="ps">数</span></div><div class="ja">14番目（の）；（日付の）14日</div><div class="ex">Valentine’s Day is February <b>fourteenth</b>.</div><div class="xj">バレンタインデーは2月14日です。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">fourth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">4番目（の）；（日付の）4日</div><div class="ex">Our classroom is on the <b>fourth</b> floor.</div><div class="xj">私たちの教室は4階にあります。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">Friday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">金曜日</div><div class="ex">I have piano lessons on <b>Fridays</b>.</div><div class="xj">私は毎週金曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">humid</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">湿気の多い；蒸し暑い</div><div class="ex">It is very <b>humid</b> in Japan in summer.</div><div class="xj">日本の夏はとても湿気が多いです。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">hundred</span><span class="ps">数</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">100（の）</div><div class="ex">There are three <b>hundred</b> students in our school.</div><div class="xj">私たちの学校には生徒が3百人います。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">July</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">7月</div><div class="ex">Our summer vacation starts in <b>July</b>.</div><div class="xj">私たちの夏休みは7月に始まります。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">March</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">3月</div><div class="ex">The school year ends in <b>March</b> in Japan.</div><div class="xj">日本では学年は3月に終わります。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">May</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">5月</div><div class="ex">Mother’s Day is in <b>May</b>.</div><div class="xj">母の日は5月にあります。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">Monday</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">月曜日</div><div class="ex">I have a math test on <b>Monday</b>.</div><div class="xj">月曜日に数学のテストがあります。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">month</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class=
