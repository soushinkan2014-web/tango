<div class="xj">山の上は霧がかかっていました。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">four</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">4；4つ（の）</div><div class="ex">There are <b>four</b> people in my family.</div><div class="xj">私の家族は4人です。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">fourteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">14（の）</div><div class="ex">Two weeks is <b>fourteen</b> days.</div><div class="xj">2週間は14日です。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">fourteenth</span><span class="ps">数</span></div><div class="ja">14番目（の）；（日付の）14日</div><div class="ex">Valentine’s Day is February <b>fourteenth</b>.</div><div class="xj">バレンタインデーは2月14日です。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">fourth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">4番目（の）；（日付の）4日</div><div class="ex">Our classroom is on the <b>fourth</b> floor.</div><div class="xj">私たちの教室は4階にあります。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">Friday</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">金曜日</div><div class="ex">I have piano lessons on <b>Fridays</b>.</div><div class="xj">私は毎週金曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">humid</span><span class="ps">形</span></div><div class="ja">湿気の多い；蒸し暑い</div><div class="ex">It is very <b>humid</b> in Japan in summer.</div><div class="xj">日本の夏はとても湿気が多いです。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">hundred</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">100（の）</div><div class="ex">There are three <b>hundred</b> students in our school.</div><div class="xj">私たちの学校には生徒が3百人います。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">July</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">7月</div><div class="ex">Our summer vacation starts in <b>July</b>.</div><div class="xj">私たちの夏休みは7月に始まります。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">March</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">3月</div><div class="ex">The school year ends in <b>March</b> in Japan.</div><div class="xj">日本では学年は3月に終わります。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">May</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">5月</div><div class="ex">Mother’s Day is in <b>May</b>.</div><div class="xj">母の日は5月にあります。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">Monday</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">月曜日</div><div class="ex">I have a math test on <b>Monday</b>.</div><div class="xj">月曜日に数学のテストがあります。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">month</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">（暦の）月</div><div class="ex">What <b>month</b> is it now?</div><div class="xj">今は何月ですか。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">muggy</span><span class="ps">形</span></div><div class="ja">蒸し暑い</div><div class="ex">It was <b>muggy</b> last night.</div><div class="xj">昨夜は蒸し暑かったです。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">nineteen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">19（の）</div><div class="ex"><b>Nineteen</b> students came to the party.</div><div class="xj">19人の生徒がパーティーに来ました。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">nineteenth</span><span class="ps">数</span></div><div class="ja">19番目（の）；（日付の）19日</div><div class="ex">The concert was on the <b>nineteenth</b>.</div><div class="xj">コンサートは19日でした。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">ninety</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">90（の）</div><div class="ex">I got <b>ninety</b> points on the test.</div><div class="xj">私はテストで90点を取りました。</div></button></li><li><button class="w" data-no="832"><div class="top"><span class="no">832</span><span class="en">ninth</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">9番目（の）；（日付の）9日</div><div class="ex">September is the <b>ninth</b> month of the year.</div><div class="xj">9月は1年の9番目の月です。</div></button></li><li><button class="w" data-no="833"><div class="top"><span class="no">833</span><span class="en">November</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">11月</div><div class="ex">We have a school festival in <b>November</b>.</div><div class="xj">11月に文化祭があります。</div></button></li><li><button class="w" data-no="834"><div class="top"><span class="no">834</span><span class="en">October</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">10月</div><div class="ex">Halloween is in <b>October</b>.</div><div class="xj">ハロウィーンは10月にあります。</div></button></li><li><button class="w" data-no="835"><div class="top"><span class="no">835</span><span class="en">rainy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">雨の；雨の多い</div><div class="ex">June is a <b>rainy</b> month in Japan.</div><div class="xj">日本では6月は雨の多い月です。</div></button></li><li><button class="w" data-no="836"><div class="top"><span class="no">836</span><span class="en">season</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">季節</div><div class="ex">Which <b>season</b> do you like?</div><div class="xj">あなたはどの季節が好きですか。</div></button></li><li><button class="w" data-no="837"><div class="top"><span class="no">837</span><span class="en">September</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">9月</div><div class="ex">My birthday is in <b>September</b>.</div><div class="xj">私の誕生日は9月です。</div></button></li><li><button class="w" data-no="838"><div class="top"><span class="no">838</span><span class="en">seventeen</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">17（の）</div><div class="ex">This book has <b>seventeen</b> stories.</div><div class="xj">この本には17の物語が入っています。</div></button></li><li><button class="w" data-no="839"><div class="top"><span class="no">839</span><span class="en">seventeenth</span><span class="ps">数</span></div><div class="ja">17番目（の）；（日付の）17日</div><div class="ex">Today is the <b>seventeenth</b>.</div><div class="xj">今日は17日です。</div></button></li><li><button class="w" data-no="840"><div class="top"><span class="no">840</span><span class="en">seventh</span><span class="ps">数</span><span class=star>★</span></div><div class="ja">7番目（の）；（日付の）7日</div><div class="ex">Tanabata is on July <b>seventh</b>.</div><div class="xj">七夕は7月7日です。</div></button></li></ol><nav class="pn"><a href="../27/">← 第27回</a><a href="../29/">第29回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"811": 4.69, "812": 17.72, "813": 32.6, "814": 46.46, "815": 59.18, "816": 71.99, "817": 85.24, "818": 98.62, "819": 114.56, "820": 128.88, "821": 142.2, "822": 156.66, "823": 169.86, "824": 183.18, "825": 196.59, "826": 209.02, "827": 221.95, "828": 234.16, "829": 246.56, "830": 259.76, "831": 274.68, "832": 287.69, "833": 302.25, "834": 315.52, "835": 328.21, "836": 341.86, "837": 354.34, "838": 367.37, "839": 381.19, "840": 396.52};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
