</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中1　第26回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.128〜131　No.751〜780</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../26.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="751"><div class="top"><span class="no">751</span><span class="en">cut ～ off</span><span class="ps">熟</span></div><div class="ja">～を切り取る；～を切り落とす</div><div class="ex">Ken <b>cut off</b> the top of the box.</div><div class="xj">ケンは箱の上の部分を切り取りました。</div></button></li><li><button class="w" data-no="752"><div class="top"><span class="no">752</span><span class="en">enough</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">十分な</div><div class="ex">We had <b>enough</b> food for everyone.</div><div class="xj">みんなの分の十分な食べ物がありました。</div></button></li><li><button class="w" data-no="753"><div class="top"><span class="no">753</span><span class="en">leg</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">脚；足</div><div class="ex">A spider has eight <b>legs</b>.</div><div class="xj">クモには脚が8本あります。</div></button></li><li><button class="w" data-no="754"><div class="top"><span class="no">754</span><span class="en">mmm</span><span class="ps">間</span></div><div class="ja">うーん；んー</div><div class="ex">A: How is the cake?<br>B: <b>Mmm</b>, it’s delicious.</div><div class="xj">A：ケーキはどう？<br>B：んー、おいしい。</div></button></li><li><button class="w" data-no="755"><div class="top"><span class="no">755</span><span class="en">off</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">（明かりなどが）消えて；離れて；脱いで</div><div class="ex">Turn <b>off</b> the TV, please.</div><div class="xj">テレビを消してください。</div></button></li><li><button class="w" data-no="756"><div class="top"><span class="no">756</span><span class="en">sleigh</span><span class="ps">名</span></div><div class="ja">そり</div><div class="ex">We rode a <b>sleigh</b> in the snow.</div><div class="xj">私たちは雪の中でそりに乗りました。</div></button></li><li><button class="w" data-no="757"><div class="top"><span class="no">757</span><span class="en">sound</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">音</div><div class="ex">I like the <b>sound</b> of the piano.</div><div class="xj">私はピアノの音が好きです。</div></button></li><li><button class="w" data-no="758"><div class="top"><span class="no">758</span><span class="en">terrible</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">ひどい；恐ろしい</div><div class="ex">The weather was <b>terrible</b> on our trip.</div><div class="xj">旅行中の天気はひどかったです。</div></button></li><li><button class="w" data-no="759"><div class="top"><span class="no">759</span><span class="en">hill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">丘</div><div class="ex">There is a small <b>hill</b> near my school.</div><div class="xj">私の学校の近くに小さな丘があります。</div></button></li><li><button class="w" data-no="760"><div class="top"><span class="no">760</span><span class="en">hold</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">持つ；抱く；（手に）にぎる</div><div class="ex">Ken is <b>holding</b> a big box.</div><div class="xj">ケンは大きな箱を持っています。</div></button></li><li><button class="w" data-no="761"><div class="top"><span class="no">761</span><span class="en">hold on to ～</span><span class="ps">熟</span></div><div class="ja">～にしっかりつかまる</div><div class="ex"><b>Hold on to</b> my hand.</div><div class="xj">私の手にしっかりつかまって。</div></button></li><li><button class="w" data-no="762"><div class="top"><span class="no">762</span><span class="en">increase</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">増やす；増える</div><div class="ex">The train <b>increased</b> its speed.</div><div class="xj">電車はスピードを増しました。</div></button></li><li><button class="w" data-no="763"><div class="top"><span class="no">763</span><span class="en">slope</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">坂；斜面</div><div class="ex">We ran down the <b>slope</b>.</div><div class="xj">私たちは坂をかけ下りました。</div></button></li><li><button class="w" data-no="764"><div class="top"><span class="no">764</span><span class="en">speed</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">速さ；スピード</div><div class="ex">Ken ran at full <b>speed</b>.</div><div class="xj">ケンは全速力で走りました。</div></button></li><li><button class="w" data-no="765"><div class="top"><span class="no">765</span><span class="en">start</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">始まる；始める</div><div class="ex">The game <b>started</b> at ten.</div><div class="xj">試合は10時に始まりました。</div></button></li><li><button class="w" data-no="766"><div class="top"><span class="no">766</span><span class="en">whee</span><span class="ps">間</span></div><div class="ja">わーい；ひゃー</div><div class="ex"><b>Whee</b>! This is fun!</div><div class="xj">わーい！これは楽しい！</div></button></li><li><button class="w" data-no="767"><div class="top"><span class="no">767</span><span class="en">end</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">終わり；端</div><div class="ex">Our school trip is at the <b>end</b> of May.</div><div class="xj">修学旅行は5月の終わりにあります。</div></button></li><li><button class="w" data-no="768"><div class="top"><span class="no">768</span><span class="en">finally</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">ついに；最後に</div><div class="ex">The rain <b>finally</b> stopped.</div><div class="xj">ついに雨がやみました。</div></button></li><li><button class="w" data-no="769"><div class="top"><span class="no">769</span><span class="en">gosh</span><span class="ps">間</span></div><div class="ja">おや；まあ</div><div class="ex"><b>Gosh</b>, it’s so cold today!</div><div class="xj">まあ、今日はとても寒いね！</div></button></li><li><button class="w" data-no="770"><div class="top"><span class="no">770</span><span class="en">hot</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">暑い；熱い</div><div class="ex">It’s very <b>hot</b> today.</div><div class="xj">今日はとても暑いです。</div></button></li><li><button class="w" data-no="771"><div class="top"><span class="no">771</span><span class="en">pull</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">引く；引っぱる</div><div class="ex"><b>Pull</b> the rope hard!</div><div class="xj">ロープを強く引いて！</div></button></li><li><button class="w" data-no="772"><div class="top"><span class="no">772</span><span class="en">reach</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">着く；届く</div><div class="ex">We <b>reached</b> the top of the mountain.</div><div class="xj">私たちは山の頂上に着きました。</div></button></li><li><button class="w" data-no="773"><div class="top"><span class="no">773</span><span class="en">steam</span><span class="ps">名</span></div><div class="ja">湯気；蒸気</div><div class="ex"><b>Steam</b> is coming from the soup.</div><div class="xj">スープから湯気が出ています。</div></button></li><li><button class="w" data-no="774"><div class="top"><span class="no">774</span><span class="en">warm</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">暖かい；温かい</div><div class="ex">Drink this <b>warm</b> milk.</div><div class="xj">この温かい牛乳を飲んで。</div></button></li><li><button class="w" data-no="775"><div class="top"><span class="no">775</span><span class="en">yourself</span><span class="ps">代</span></div><div class="ja">あなた自身；自分で</div><div class="ex">Tell us about <b>yourself</b>.</div><div class="xj">あなた自身について話してください。</div></button></li><li><button class="w" data-no="776"><div class="top"><span class="no">776</span><span class="en">yourselves</span><span class="ps">代</span></div><div class="ja">あなたたち自身；自分たちで</div><div class="ex">Did you make this snowman <b>yourselves</b>?</div><div class="xj">あなたたちはこの雪だるまを自分たちで作ったの？</div></button></li><li><button class="w" data-no="777"><div class="top"><span class="no">777</span><span class="en">closet</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">クローゼット；押し入れ</div><div class="ex">My winter coat is in the <b>closet</b>.</div><div class="xj">私の冬のコートはクローゼットの中にあります。</div></button></li><li><button class="w" data-no="778"><div class="top"><span class="no">778</span><span class="en">fluffy</span><span class="ps">形</span></div><div class="ja">ふわふわした</div><div class="ex">My cat is soft and <b>fluffy</b>.</div><div class="xj">私のネコはやわらかくてふわふわです。</div></button></li><li><button class="w" data-no="779"><div class="top"><span class="no">779</span><span class="en">hey</span><span class="ps">間</span></div><div class="ja">ねえ；おい</div><div class="ex"><b>Hey</b>, look at that bird!</div><div class="xj">ねえ、あの鳥を見て！</div></button></li><li><button class="w" data-no="780"><div class="top"><span class="no">780</span><span class="en">quilt</span><span class="ps">名</span></div><div class="ja">キルト；かけぶとん</div><div class="ex">My grandmother made this <b>quilt</b>.</div><div class="xj">祖母がこのキルトを作りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../25/">← 第25回</a><a href="../27/">第27回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</foo
