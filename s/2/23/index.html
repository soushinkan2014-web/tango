</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第23回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.115〜120　No.661〜690</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">badge</span><span class="ps">名</span></div><div class="ja">バッジ</div><div class="ex">I put a cute <b>badge</b> on my bag.</div><div class="xj">私はかばんにかわいいバッジをつけました。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">mascot</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">マスコット</div><div class="ex">Our town <b>mascot</b> is a bear.</div><div class="xj">私たちの町のマスコットはクマです。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">so ～ that ...</span><span class="ps">熟</span></div><div class="ja">とても～なので…</div><div class="ex">I was <b>so tired that</b> I went to bed early.</div><div class="xj">私はとても疲れていたので早く寝ました。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">tin</span><span class="ps">名</span></div><div class="ja">缶；ブリキ</div><div class="ex">This cookie <b>tin</b> is very pretty.</div><div class="xj">このクッキーの缶はとてもかわいいです。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">wear</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">着ている；身につけている</div><div class="ex">Students <b>wear</b> uniforms at our school.</div><div class="xj">私たちの学校では生徒は制服を着ています。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">drawn</span><span class="ps">動</span></div><div class="ja">描かれた（draw の過去分詞）</div><div class="ex">This picture was <b>drawn</b> by my sister.</div><div class="xj">この絵は姉によって描かれました。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">drew</span><span class="ps">動</span></div><div class="ja">描いた；（線を）引いた（draw の過去形）</div><div class="ex">Yuki <b>drew</b> a picture of her dog.</div><div class="xj">ユキは自分の犬の絵を描きました。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">straw</span><span class="ps">名</span></div><div class="ja">わら；ストロー</div><div class="ex">This hat is made of <b>straw</b>.</div><div class="xj">このぼうしはわらでできています。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">wine</span><span class="ps">名</span></div><div class="ja">ワイン</div><div class="ex">This <b>wine</b> is made from grapes.</div><div class="xj">このワインはブドウから作られています。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">apologize</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">謝る；わびる</div><div class="ex">Ken <b>apologized</b> to Emi for being late.</div><div class="xj">ケンは遅れたことをエミに謝りました。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">attention</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">注意；注目</div><div class="ex">Please pay <b>attention</b> to the teacher.</div><div class="xj">先生の話に注意を払ってください。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">boarding</span><span class="ps">名</span></div><div class="ja">搭乗</div><div class="ex">Please show me your <b>boarding</b> pass.</div><div class="xj">搭乗券を見せてください。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">change</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">変える；変わる；乗りかえる</div><div class="ex">I <b>changed</b> my plan for Sunday.</div><div class="xj">私は日曜日の予定を変えました。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">flight</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（飛行機の）便；飛行</div><div class="ex">Our <b>flight</b> leaves at ten.</div><div class="xj">私たちの便は10時に出発します。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">flight attendant</span><span class="ps">名</span></div><div class="ja">客室乗務員</div><div class="ex">My sister wants to be a <b>flight attendant</b>.</div><div class="xj">姉は客室乗務員になりたいと思っています。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">gate</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">搭乗口；ゲート</div><div class="ex">Please go to <b>Gate</b> 5 now.</div><div class="xj">今すぐ5番搭乗口へ行ってください。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">inconvenience</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">不便；迷惑</div><div class="ex">We are sorry for the <b>inconvenience</b>.</div><div class="xj">ご不便をおかけして申し訳ありません。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">mineral water</span><span class="ps">名</span></div><div class="ja">ミネラルウォーター</div><div class="ex">Can I have a bottle of <b>mineral water</b>?</div><div class="xj">ミネラルウォーターを1本いただけますか。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">minute</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">（時間の）分；ちょっとの間</div><div class="ex">The train will come in five <b>minutes</b>.</div><div class="xj">電車は5分後に来ます。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">passenger</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">乗客</div><div class="ex">There were about two hundred <b>passengers</b> on the plane.</div><div class="xj">その飛行機には約200人の乗客が乗っていました。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">sparkling water</span><span class="ps">名</span></div><div class="ja">炭酸水</div><div class="ex">I’d like <b>sparkling water</b>, please.</div><div class="xj">炭酸水をお願いします。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">casual</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">ふだん着の；くだけた；気軽な</div><div class="ex">You can wear <b>casual</b> clothes on Friday.</div><div class="xj">金曜日はふだん着の服装をしてもいいですよ。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">chat</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">おしゃべりする</div><div class="ex">We <b>chatted</b> in the cafe for an hour.</div><div class="xj">私たちはカフェで1時間おしゃべりしました。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">admire</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">尊敬する；感心する；称賛する</div><div class="ex">I <b>admire</b> my coach very much.</div><div class="xj">私はコーチをとても尊敬しています。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">agricultural chemical</span><span class="ps">名</span></div><div class="ja">農薬</div><div class="ex">This farmer doesn’t use <b>agricultural chemicals</b>.</div><div class="xj">この農家の人は農薬を使っていません。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">because of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～のために；～が原因で</div><div class="ex">The game was stopped <b>because of</b> the rain.</div><div class="xj">試合は雨のために中止されました。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">born</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">生まれた（be born で）</div><div class="ex">My sister was <b>born</b> in May.</div><div class="xj">妹は5月に生まれました。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">danger</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">危険</div><div class="ex">This sign means <b>danger</b>.</div><div class="xj">この標識は危険を意味しています。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">in those days</span><span class="ps">熟</span></div><div class="ja">その当時は；そのころは</div><div class="ex"><b>In those days</b>, there were no smartphones.</div><div class="xj">その当時はスマートフォンがありませんでした。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">environmental</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">環境の</div><div class="ex">We talked about <b>environmental</b> problems in class.</div><div class="xj">私たちは授業で環境問題について話し合いました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、
