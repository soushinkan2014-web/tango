</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第7回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.37〜46　No.181〜210</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">show</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">見せる；示す</div><div class="ex">Please <b>show</b> your ticket at the door.</div><div class="xj">入口でチケットを見せてください。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">Some ～.  Others ....</span><span class="ps">熟</span></div><div class="ja">～もいれば…もいる</div><div class="ex"><b>Some</b> people like summer. Others like winter.</div><div class="xj">夏が好きな人もいれば、冬が好きな人もいます。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">toothpick</span><span class="ps">名</span></div><div class="ja">つまようじ</div><div class="ex">I ate the fruit with a <b>toothpick</b>.</div><div class="xj">私はつまようじで果物を食べました。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">donate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">寄付する</div><div class="ex">We <b>donated</b> old books to the library.</div><div class="xj">私たちは古い本を図書館に寄付しました。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">easily</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">簡単に</div><div class="ex">You can make this cake <b>easily</b>.</div><div class="xj">このケーキは簡単に作れます。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">handmade</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">手作りの</div><div class="ex">Emi sells <b>handmade</b> cards at the market.</div><div class="xj">エミは市場で手作りのカードを売っています。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">smell</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">におい；においがする</div><div class="ex">I love the <b>smell</b> of fresh bread.</div><div class="xj">私は焼きたてのパンのにおいが大好きです。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">add</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">加える</div><div class="ex"><b>Add</b> some salt to the soup.</div><div class="xj">スープに塩を少し加えなさい。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">amount</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">量</div><div class="ex">Please check the <b>amount</b> of sugar.</div><div class="xj">砂糖の量を確認してください。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">customize</span><span class="ps">動</span><span class="ek">準2+</span></div><div class="ja">自分好みに変える；カスタマイズする</div><div class="ex">You can <b>customize</b> your pizza here.</div><div class="xj">ここではピザを自分好みに変えることができます。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">eater</span><span class="ps">名</span></div><div class="ja">食べる人</div><div class="ex">My brother is a big <b>eater</b>.</div><div class="xj">兄はたくさん食べる人です。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">farmer</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">農家の人；農場主</div><div class="ex">My uncle is a rice <b>farmer</b>.</div><div class="xj">おじは米農家です。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">flour</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">小麦粉</div><div class="ex">We need <b>flour</b> to make bread.</div><div class="xj">パンを作るには小麦粉が必要です。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">gram</span><span class="ps">名</span></div><div class="ja">グラム</div><div class="ex">Use one hundred <b>grams</b> of butter.</div><div class="xj">バターを100グラム使ってください。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">ingredient</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">材料</div><div class="ex">What <b>ingredients</b> do you need for curry?</div><div class="xj">カレーにはどんな材料が必要ですか。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">organic</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">有機の；有機栽培の</div><div class="ex">We buy <b>organic</b> vegetables at this shop.</div><div class="xj">私たちはこの店で有機野菜を買います。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">spinach</span><span class="ps">名</span></div><div class="ja">ほうれん草</div><div class="ex">We grow <b>spinach</b> in our garden.</div><div class="xj">私たちは庭でほうれん草を育てています。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">such</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">そのような；そんな</div><div class="ex">Don’t say <b>such</b> a thing.</div><div class="xj">そんなことを言わないで。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">such as ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～のような；たとえば～</div><div class="ex">I like vegetables <b>such as</b> carrots and onions.</div><div class="xj">私はにんじんや玉ねぎのような野菜が好きです。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">topping</span><span class="ps">名</span></div><div class="ja">トッピング</div><div class="ex">Which <b>topping</b> do you want on your pizza?</div><div class="xj">ピザにはどのトッピングがいいですか。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">bean sprout</span><span class="ps">熟</span></div><div class="ja">もやし</div><div class="ex">My mother put <b>bean sprouts</b> in the soup.</div><div class="xj">母はスープにもやしを入れました。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">bone</span><span class="ps">名</span></div><div class="ja">骨</div><div class="ex">The dog is playing with a <b>bone</b>.</div><div class="xj">その犬は骨で遊んでいます。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">creamy</span><span class="ps">形</span></div><div class="ja">クリーミーな</div><div class="ex">This soup is <b>creamy</b> and delicious.</div><div class="xj">このスープはクリーミーでおいしいです。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">miso-flavored</span><span class="ps">熟</span></div><div class="ja">みそ味の</div><div class="ex">I’ll have <b>miso-flavored</b> ramen.</div><div class="xj">私はみそ味のラーメンにします。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">roast</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（肉などを）焼く；あぶる</div><div class="ex">My father <b>roasted</b> some pork for dinner.</div><div class="xj">父は夕食に豚肉を焼きました。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">slice</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">1切れ；1枚；薄切り</div><div class="ex">I ate two <b>slices</b> of bread.</div><div class="xj">私はパンを2枚食べました。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">soy sauce-flavored</span><span class="ps">熟</span></div><div class="ja">しょうゆ味の</div><div class="ex">My father likes <b>soy sauce-flavored</b> ramen.</div><div class="xj">父はしょうゆ味のラーメンが好きです。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">spicy</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">辛い；ぴりっとした</div><div class="ex">This curry is too <b>spicy</b> for me.</div><div class="xj">このカレーは私には辛すぎます。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">thick</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">太い；厚い</div><div class="ex">This ramen has <b>thick</b> noodles.</div><div class="xj">このラーメンは麺が太いです。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">arrive</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">到着する；着く</div><div class="ex">Lisa <b>arrived</b> in Japan last week.</div><div class="xj">リサは先週日本に到着しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p
