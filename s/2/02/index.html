"xj">トムは今日、学校に来ないでしょう。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">worried</span><span class="ps">形</span></div><div class="ja">心配して</div><div class="ex">I’m <b>worried</b> about the test.</div><div class="xj">私はテストのことが心配です。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">you’ll</span><span class="ps">代</span></div><div class="ja">あなたは～するだろう（you will の短縮形）</div><div class="ex"><b>You’ll</b> like this book.</div><div class="xj">あなたはこの本を気に入るでしょう。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">best</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">最善；全力</div><div class="ex">Try your <b>best</b> in the game.</div><div class="xj">試合では全力を尽くしてね。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">do one’s best</span><span class="ps">熟</span></div><div class="ja">全力を尽くす；最善を尽くす</div><div class="ex">I’ll <b>do my best</b> in the tennis game.</div><div class="xj">私はテニスの試合で全力を尽くします。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">cry</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">泣く</div><div class="ex">The baby <b>cried</b> all night.</div><div class="xj">その赤ちゃんは一晩中泣きました。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">for</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の間</div><div class="ex">I lived in Kyoto <b>for</b> three years.</div><div class="xj">私は3年間京都に住んでいました。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">much</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">たくさんのこと；（否定文で）あまり多く</div><div class="ex">I don’t know <b>much</b> about Canada.</div><div class="xj">私はカナダについてあまり知りません。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">overseas</span><span class="ps">副</span></div><div class="ja">海外へ；海外で</div><div class="ex">My sister wants to travel <b>overseas</b>.</div><div class="xj">姉は海外へ旅行したがっています。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">Thanks for ～.</span><span class="ps">熟</span></div><div class="ja">～をありがとう</div><div class="ex"><b>Thanks for</b> helping me, Ken.</div><div class="xj">手伝ってくれてありがとう、ケン。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">maybe</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">たぶん；もしかすると</div><div class="ex"><b>Maybe</b> Ken is in the library.</div><div class="xj">たぶんケンは図書館にいます。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">picnic</span><span class="ps">名</span></div><div class="ja">ピクニック</div><div class="ex">We are going to go on a <b>picnic</b> this Sunday.</div><div class="xj">私たちは今度の日曜日にピクニックに行く予定です。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">sound</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">～に聞こえる；～のようだ</div><div class="ex">A: Let’s have a party.<br>B: That <b>sounds</b> like a good idea.</div><div class="xj">A：パーティーをしよう。B：それはいい考えのようだね。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">Sounds nice.</span><span class="ps">熟</span></div><div class="ja">いいね；楽しそうだね</div><div class="ex">A: Let’s have lunch in the park.<br>B: <b>Sounds nice.</b></div><div class="xj">A：公園でお昼を食べよう。B：いいね。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">Why don’t you ～?</span><span class="ps">熟</span></div><div class="ja">～したらどうですか</div><div class="ex"><b>Why don’t you</b> join our club?</div><div class="xj">私たちの部に入ったらどうですか。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">see</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（医者に）診てもらう；会う</div><div class="ex">I’ll <b>see</b> a doctor tomorrow.</div><div class="xj">私は明日、医者に診てもらいます。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">child</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">子ども</div><div class="ex">My aunt has two <b>children</b>.</div><div class="xj">おばには子どもが2人います。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">gray</span><span class="ps">形</span></div><div class="ja">灰色の</div><div class="ex">The sky was <b>gray</b> this morning.</div><div class="xj">今朝、空は灰色でした。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">kid</span><span class="ps">動</span></div><div class="ja">冗談を言う；からかう</div><div class="ex">I’m just <b>kidding</b>, Emi.</div><div class="xj">ほんの冗談だよ、エミ。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">leg</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">（机・いすなどの）脚</div><div class="ex">This table has four <b>legs</b>.</div><div class="xj">このテーブルには脚が4本あります。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">money</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">お金</div><div class="ex">I spent my <b>money</b> on comic books.</div><div class="xj">私はマンガ本にお金を使いました。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">short</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">短い；背が低い</div><div class="ex">My sister has <b>short</b> hair.</div><div class="xj">姉は髪が短いです。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">water</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">水をやる</div><div class="ex">I <b>water</b> the flowers every morning.</div><div class="xj">私は毎朝、花に水をやります。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">under water</span><span class="ps">熟</span></div><div class="ja">水中で；水中に</div><div class="ex">Ken can swim <b>under water</b> for a long time.</div><div class="xj">ケンは長い時間水中で泳ぐことができます。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">project</span><span class="ps">名</span></div><div class="ja">計画；研究課題；プロジェクト</div><div class="ex">We are working on a class <b>project</b>.</div><div class="xj">私たちはクラスのプロジェクトに取り組んでいます。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">cheering</span><span class="ps">名</span></div><div class="ja">応援；声援</div><div class="ex">The <b>cheering</b> at the game was very loud.</div><div class="xj">試合での声援はとても大きかった。</div></button></li></ol><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"31": 3.92, "32": 17.12, "33": 30.51, "34": 44.3, "35": 58.08, "36": 72.71, "37": 85.16, "38": 99.39, "39": 112.28, "40": 127.58, "41": 139.65, "42": 152.92, "43": 167.48, "44": 182.02, "45": 195.17, "46": 208.42, "47": 221.47, "48": 238.6, "49": 255.05, "50": 267.94, "51": 281.11, "52": 293.56, "53": 306.18, "54": 319.59, "55": 333.12, "56": 346.1, "57": 359.3, "58": 372.11, "59": 386.44, "60": 400.35};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
