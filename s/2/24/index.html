<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第24回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第24回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.120〜126　No.691〜720</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../24.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="691"><div class="top"><span class="no">691</span><span class="en">marine biologist</span><span class="ps">熟</span></div><div class="ja">海洋生物学者</div><div class="ex">My aunt is a <b>marine biologist</b> in Okinawa.</div><div class="xj">私のおばは沖縄で海洋生物学者をしています。</div></button></li><li><button class="w" data-no="692"><div class="top"><span class="no">692</span><span class="en">pioneer</span><span class="ps">名</span></div><div class="ja">先駆者；開拓者</div><div class="ex">Mr. Kato was a <b>pioneer</b> in computer games.</div><div class="xj">加藤さんはコンピューターゲームの先駆者でした。</div></button></li><li><button class="w" data-no="693"><div class="top"><span class="no">693</span><span class="en">planet</span><span class="ps">名</span></div><div class="ja">惑星</div><div class="ex">Mars is the fourth <b>planet</b> from the sun.</div><div class="xj">火星は太陽から4番目の惑星です。</div></button></li><li><button class="w" data-no="694"><div class="top"><span class="no">694</span><span class="en">protection</span><span class="ps">名</span></div><div class="ja">保護</div><div class="ex">The <b>protection</b> of nature is important.</div><div class="xj">自然の保護は大切です。</div></button></li><li><button class="w" data-no="695"><div class="top"><span class="no">695</span><span class="en">writer</span><span class="ps">名</span></div><div class="ja">作家；書く人</div><div class="ex">Emi wants to be a <b>writer</b> in the future.</div><div class="xj">エミは将来作家になりたいと思っています。</div></button></li><li><button class="w" data-no="696"><div class="top"><span class="no">696</span><span class="en">wrote</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">書いた（write の過去形）</div><div class="ex">I <b>wrote</b> a letter to my grandfather.</div><div class="xj">私は祖父に手紙を書きました。</div></button></li><li><button class="w" data-no="697"><div class="top"><span class="no">697</span><span class="en">Apollo 13</span><span class="ps">熟</span></div><div class="ja">アポロ13号</div><div class="ex"><b>Apollo 13</b> went to space in 1970.</div><div class="xj">アポロ13号は1970年に宇宙へ行きました。</div></button></li><li><button class="w" data-no="698"><div class="top"><span class="no">698</span><span class="en">call</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">電話（の呼び出し）；呼びかけ</div><div class="ex">I got a <b>call</b> from Yuki last night.</div><div class="xj">昨夜ユキから電話がありました。</div></button></li><li><button class="w" data-no="699"><div class="top"><span class="no">699</span><span class="en">captain</span><span class="ps">名</span></div><div class="ja">船長；機長；キャプテン</div><div class="ex">The <b>captain</b> talked to the people on the ship.</div><div class="xj">船長は船の人たちに話しかけました。</div></button></li><li><button class="w" data-no="700"><div class="top"><span class="no">700</span><span class="en">emergency</span><span class="ps">名</span></div><div class="ja">緊急（事態）</div><div class="ex">Call 119 in an <b>emergency</b>.</div><div class="xj">緊急のときは119番に電話しなさい。</div></button></li><li><button class="w" data-no="701"><div class="top"><span class="no">701</span><span class="en">explode</span><span class="ps">動</span></div><div class="ja">爆発する；破裂する</div><div class="ex">The fireworks <b>exploded</b> over the river.</div><div class="xj">花火が川の上ではじけました。</div></button></li><li><button class="w" data-no="702"><div class="top"><span class="no">702</span><span class="en">just</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">ちょうど；まさに</div><div class="ex">It’s <b>just</b> six o’clock now.</div><div class="xj">今ちょうど6時です。</div></button></li><li><button class="w" data-no="703"><div class="top"><span class="no">703</span><span class="en">launch</span><span class="ps">動</span></div><div class="ja">打ち上げる；（新しく）始める</div><div class="ex">They <b>launched</b> a rocket from Tanegashima.</div><div class="xj">彼らは種子島からロケットを打ち上げました。</div></button></li><li><button class="w" data-no="704"><div class="top"><span class="no">704</span><span class="en">lose</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">失う；なくす；負ける</div><div class="ex">Don’t <b>lose</b> the key to your house.</div><div class="xj">家のかぎをなくさないでね。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">lost</span><span class="ps">動</span></div><div class="ja">負けた；失った（lose の過去形）</div><div class="ex">Our team <b>lost</b> the game yesterday.</div><div class="xj">私たちのチームは昨日試合に負けました。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">oxygen</span><span class="ps">名</span></div><div class="ja">酸素</div><div class="ex">Fish get <b>oxygen</b> from water.</div><div class="xj">魚は水から酸素を取り入れます。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">quickly</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">すばやく；急いで</div><div class="ex">Lisa finished her lunch <b>quickly</b>.</div><div class="xj">リサは昼食をすばやく食べ終えました。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">quietly</span><span class="ps">副</span></div><div class="ja">静かに</div><div class="ex">Please close the door <b>quietly</b>.</div><div class="xj">ドアを静かに閉めてください。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">reason</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">理由</div><div class="ex">Please tell me the <b>reason</b> for your answer.</div><div class="xj">あなたの答えの理由を教えてください。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">spaceship</span><span class="ps">名</span></div><div class="ja">宇宙船</div><div class="ex">The <b>spaceship</b> went around the moon.</div><div class="xj">その宇宙船は月の周りを回りました。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">tank</span><span class="ps">名</span></div><div class="ja">ボンベ；（気体・液体を入れる）タンク</div><div class="ex">The man is carrying an oxygen <b>tank</b> on his back.</div><div class="xj">その男性は背中に酸素ボンベを背負っています。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">approach</span><span class="ps">動</span></div><div class="ja">近づく；接近する</div><div class="ex">A typhoon is <b>approaching</b> Okinawa.</div><div class="xj">台風が沖縄に近づいています。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">crew</span><span class="ps">名</span></div><div class="ja">乗組員（全員）</div><div class="ex">The <b>crew</b> of the ship worked hard.</div><div class="xj">その船の乗組員は一生懸命働きました。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">damage</span><span class="ps">名</span></div><div class="ja">被害；損害</div><div class="ex">There was a lot of <b>damage</b> after the typhoon.</div><div class="xj">台風のあと、たくさんの被害がありました。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">extremely</span><span class="ps">副</span></div><div class="ja">非常に；極めて</div><div class="ex">It was <b>extremely</b> hot yesterday.</div><div class="xj">昨日は非常に暑かったです。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">fire</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">火；火事</div><div class="ex">Be careful with <b>fire</b> in the kitchen.</div><div class="xj">台所では火に気をつけて。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">freezing</span><span class="ps">副</span></div><div class="ja">凍えるほど（寒い・冷たい）</div><div class="ex">The water in the lake was <b>freezing</b> cold.</div><div class="xj">湖の水は凍えるほど冷たかったです。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">at last</span><span class="ps">熟</span></div><div class="ja">ついに；とうとう</div><div class="ex"><b>At last</b>, we got to the top of the mountain.</div><div class="xj">ついに私たちは山の頂上に着きました。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">men</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">男の人たち（man の複数形）</div><div class="ex">Two <b>men</b> are standing by the gate.</div><div class="xj">2人の男の人が門のそばに立っています。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">might</span><span class="ps">助</span></div><div class="ja">～かもしれない</div><div class="ex">Take an umbrella because it <b>might</b> rain.</div><div class="xj">雨が降るかもしれないから、かさを持っていって。</div></button></li></ol><nav class="pn"><a href="../23/">← 第23回</a><a href="../25/">第25回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"691": 4.52, "692": 20.36, "693": 34.9, "694": 48.05, "695": 60.98, "696": 74.46, "697": 87.83, "698": 103.4, "699": 117.44, "700": 130.78, "701": 144.52, "702": 158.7, "703": 171.54, "704": 185.94, "705": 199.06, "706": 213.53, "707": 226.22, "708": 239.51, "709": 252.16, "710": 264.97, "711": 277.76, "712": 293.5, "713": 307.53, "714": 320.82, "715": 334.38, "716": 347.98, "717": 360.8, "718": 375.17, "719": 389.47, "720": 403.5};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
