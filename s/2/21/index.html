<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第21回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第21回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.105〜109　No.601〜630</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">lovely</span><span class="ps">形</span></div><div class="ja">すてきな；かわいらしい</div><div class="ex">You have a <b>lovely</b> garden.</div><div class="xj">すてきなお庭ですね。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">mice</span><span class="ps">名</span></div><div class="ja">ネズミ（mouse の複数形）</div><div class="ex">There are three <b>mice</b> in this picture book.</div><div class="xj">この絵本には3匹のネズミが出てきます。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">nighttime</span><span class="ps">名</span></div><div class="ja">夜間；夜</div><div class="ex">My hamster is very active in the <b>nighttime</b>.</div><div class="xj">私のハムスターは夜間とても活発です。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">pocket</span><span class="ps">名</span></div><div class="ja">ポケット</div><div class="ex">He put his hands in his <b>pockets</b>.</div><div class="xj">彼はポケットに手を入れました。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">seed</span><span class="ps">名</span></div><div class="ja">種</div><div class="ex">Let’s plant these <b>seeds</b> in the garden.</div><div class="xj">この種を庭にまきましょう。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">sunflower</span><span class="ps">名</span></div><div class="ja">ヒマワリ</div><div class="ex">I like <b>sunflowers</b> the best of all flowers.</div><div class="xj">私はすべての花の中でヒマワリがいちばん好きです。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">told</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">話した；言った（tell の過去形・過去分詞）</div><div class="ex">Ken <b>told</b> me about his trip.</div><div class="xj">ケンは私に旅行のことを話してくれました。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">lasting</span><span class="ps">形</span></div><div class="ja">長続きする；永続的な</div><div class="ex">We all want <b>lasting</b> peace.</div><div class="xj">私たちはみんな長続きする平和を望んでいます。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">built</span><span class="ps">動</span></div><div class="ja">建てた（build の過去形・過去分詞）</div><div class="ex">My grandfather <b>built</b> this house.</div><div class="xj">祖父がこの家を建てました。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">fill</span><span class="ps">動</span></div><div class="ja">満たす；いっぱいにする</div><div class="ex">Please <b>fill</b> this glass with water.</div><div class="xj">このコップを水で満たしてください。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">known</span><span class="ps">形</span></div><div class="ja">知られた（know の過去分詞）</div><div class="ex">Kyoto is a well-<b>known</b> city in Japan.</div><div class="xj">京都は日本のよく知られた都市です。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">mmm</span><span class="ps">間</span></div><div class="ja">うーん（考えるとき・迷うとき）</div><div class="ex">A: Which cake do you want?<br>B: <b>Mmm</b>, I don’t know.</div><div class="xj">A：どのケーキがいい？B：うーん、わからないな。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">stand</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（建物などが）建っている；立っている</div><div class="ex">An old temple <b>stands</b> on the hill.</div><div class="xj">丘の上に古いお寺が建っています。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">taken</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">take の過去分詞；（席が）ふさがっている</div><div class="ex">A: Is this seat <b>taken</b>?<br>B: No, it isn’t.</div><div class="xj">A：この席はふさがっていますか。B：いいえ、空いていますよ。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">tourist</span><span class="ps">名</span></div><div class="ja">観光客；旅行者</div><div class="ex">Many <b>tourists</b> visit Nara every year.</div><div class="xj">毎年たくさんの観光客が奈良を訪れます。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">brown</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">茶色の</div><div class="ex">Lisa has long <b>brown</b> hair.</div><div class="xj">リサは長い茶色の髪をしています。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">butter</span><span class="ps">名</span></div><div class="ja">バター</div><div class="ex">Put some <b>butter</b> on the bread.</div><div class="xj">パンにバターをぬってください。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">draw</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（線を）引く</div><div class="ex"><b>Draw</b> a line under this word.</div><div class="xj">この単語の下に線を引きなさい。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">email</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">Eメール；電子メール</div><div class="ex">I got an <b>email</b> from Lisa.</div><div class="xj">私はリサからEメールをもらいました。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">kitchen</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">台所</div><div class="ex">My mother is cooking in the <b>kitchen</b>.</div><div class="xj">母は台所で料理をしています。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">line</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">線；列</div><div class="ex">Write your name on this <b>line</b>.</div><div class="xj">この線の上に名前を書いてください。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">milk</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">牛乳；ミルク</div><div class="ex">I drink <b>milk</b> every morning.</div><div class="xj">私は毎朝牛乳を飲みます。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">paint</span><span class="ps">動</span></div><div class="ja">（絵の具で）描く；ペンキを塗る</div><div class="ex">Yuki <b>paints</b> pictures of the sea.</div><div class="xj">ユキは海の絵を描きます。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">rice</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ごはん；米</div><div class="ex">We eat <b>rice</b> almost every day.</div><div class="xj">私たちはほとんど毎日ごはんを食べます。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">seen</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（see の過去分詞）見られる</div><div class="ex">Mt. Fuji can be <b>seen</b> from here.</div><div class="xj">ここから富士山が見られます。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">sold</span><span class="ps">動</span></div><div class="ja">売った（sell の過去形・過去分詞）</div><div class="ex">The shop <b>sold</b> all the bread by noon.</div><div class="xj">その店は正午までにパンを全部売りました。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">stationery</span><span class="ps">名</span></div><div class="ja">文房具</div><div class="ex">This shop sells cute <b>stationery</b>.</div><div class="xj">この店ではかわいい文房具を売っています。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">store</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">店</div><div class="ex">Let’s buy some juice at that <b>store</b>.</div><div class="xj">あの店でジュースを買いましょう。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">sung</span><span class="ps">動</span></div><div class="ja">（sing の過去分詞）歌われる</div><div class="ex">This song is <b>sung</b> in many countries.</div><div class="xj">この歌は多くの国で歌われています。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">wood</span><span class="ps">名</span></div><div class="ja">木材；木</div><div class="ex">We need some <b>wood</b> for the campfire.</div><div class="xj">私たちはキャンプファイヤー用の木材が必要です。</div></button></li></ol><nav class="pn"><a href="../20/">← 第20回</a><a href="../22/">第22回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"601": 4.5, "602": 17.6, "603": 31.54, "604": 44.9, "605": 57.62, "606": 70.41, "607": 84.28, "608": 99.08, "609": 112.95, "610": 127.44, "611": 141.04, "612": 154.94, "613": 171.37, "614": 185.72, "615": 202.68, "616": 216.93, "617": 229.72, "618": 242.02, "619": 254.6, "620": 268.06, "621": 280.65, "622": 293.13, "623": 306.04, "624": 320.05, "625": 333.03, "626": 346.68, "627": 361.53, "628": 374.99, "629": 387.78, "630": 401.98};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
