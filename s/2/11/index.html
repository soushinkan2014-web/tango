<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第11回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第11回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.57〜64　No.301〜330</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">build</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">建てる；作る</div><div class="ex">My uncle <b>built</b> this house.</div><div class="xj">おじがこの家を建てました。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">cut down ～</span><span class="ps">熟</span></div><div class="ja">～を切り倒す</div><div class="ex">People <b>cut down</b> many trees here last year.</div><div class="xj">昨年、人々はここでたくさんの木を切り倒しました。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">dam</span><span class="ps">名</span></div><div class="ja">ダム</div><div class="ex">Beavers build <b>dams</b> in rivers.</div><div class="xj">ビーバーは川にダムを作ります。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">day</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">昼間；日中</div><div class="ex">My father works at night and sleeps during the <b>day</b>.</div><div class="xj">父は夜に働いて、昼間に眠ります。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">during</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～の間ずっと；～の間中</div><div class="ex">I stayed in Hokkaido <b>during</b> the summer vacation.</div><div class="xj">私は夏休みの間ずっと北海道にいました。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">engineer</span><span class="ps">名</span></div><div class="ja">技術者；エンジニア</div><div class="ex">My mother works as an <b>engineer</b>.</div><div class="xj">母は技術者として働いています。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">lodge</span><span class="ps">名</span></div><div class="ja">山小屋；ロッジ；（ビーバーの）巣</div><div class="ex">We stayed at a <b>lodge</b> in the mountains.</div><div class="xj">私たちは山にあるロッジに泊まりました。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">they’re</span><span class="ps">代</span></div><div class="ja">彼らは～である（they are の短縮形）</div><div class="ex"><b>They’re</b> my new classmates.</div><div class="xj">彼らは私の新しいクラスメートです。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">go to bed</span><span class="ps">熟</span></div><div class="ja">寝る</div><div class="ex">I usually <b>go to bed</b> at ten.</div><div class="xj">私はふつう10時に寝ます。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">list</span><span class="ps">名</span></div><div class="ja">一覧表；リスト</div><div class="ex">I made a shopping <b>list</b> for the party.</div><div class="xj">私はパーティーのための買い物リストを作りました。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">loud</span><span class="ps">形</span></div><div class="ja">（声・音が）大きい；うるさい</div><div class="ex">The music is too <b>loud</b>.</div><div class="xj">音楽の音が大きすぎます。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">make</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（音を）立てる；（～を）する</div><div class="ex">Don’t <b>make</b> noise in the library.</div><div class="xj">図書館で物音を立てないで。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">noise</span><span class="ps">名</span></div><div class="ja">物音；騒音</div><div class="ex">There was a big <b>noise</b> outside.</div><div class="xj">外で大きな物音がしました。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">own</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">自分自身の</div><div class="ex">I want my <b>own</b> room.</div><div class="xj">私は自分だけの部屋がほしいです。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">school trip</span><span class="ps">熟</span></div><div class="ja">修学旅行</div><div class="ex">We will go to Tokyo on our <b>school trip</b>.</div><div class="xj">私たちは修学旅行で東京に行きます。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">shampoo</span><span class="ps">名</span></div><div class="ja">シャンプー</div><div class="ex">Please buy some <b>shampoo</b> at the store.</div><div class="xj">店でシャンプーを買ってきてください。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">on time</span><span class="ps">熟</span></div><div class="ja">時間どおりに</div><div class="ex">The bus came <b>on time</b> today.</div><div class="xj">今日はバスが時間どおりに来ました。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">sad</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">悲しい</div><div class="ex">The story was very <b>sad</b>.</div><div class="xj">その物語はとても悲しかったです。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">Caesar salad</span><span class="ps">熟</span></div><div class="ja">シーザーサラダ</div><div class="ex">Emi often eats a <b>Caesar salad</b> for lunch.</div><div class="xj">エミはよく昼食にシーザーサラダを食べます。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">medium</span><span class="ps">形</span></div><div class="ja">（ステーキの焼き方が）ミディアムの；中くらいの</div><div class="ex">A: How would you like your steak?<br>B: <b>Medium</b>, please.</div><div class="xj">A：ステーキの焼き方はどうなさいますか。B：ミディアムでお願いします。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">order</span><span class="ps">動</span></div><div class="ja">注文する；命令する</div><div class="ex">I <b>ordered</b> a pizza for lunch.</div><div class="xj">私は昼食にピザを注文しました。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">potato</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ジャガイモ</div><div class="ex">My grandfather grows <b>potatoes</b> in his garden.</div><div class="xj">祖父は畑でジャガイモを育てています。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">rare</span><span class="ps">形</span></div><div class="ja">（ステーキの焼き方が）レアの；めずらしい</div><div class="ex">Some people like <b>rare</b> steak.</div><div class="xj">レアのステーキが好きな人もいます。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">be ready to ～</span><span class="ps">熟</span></div><div class="ja">～する準備ができている</div><div class="ex">We <b>are ready to</b> start the game.</div><div class="xj">私たちは試合を始める準備ができています。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">share</span><span class="ps">動</span></div><div class="ja">分け合う；共有する</div><div class="ex">Let’s <b>share</b> this pizza.</div><div class="xj">このピザを分け合いましょう。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">table</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">テーブル；食卓</div><div class="ex">Let’s sit at that <b>table</b> by the window.</div><div class="xj">窓のそばのあのテーブルにすわりましょう。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">way</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">方向；方</div><div class="ex">Please come this <b>way</b>.</div><div class="xj">こちらの方へどうぞ。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">well-done</span><span class="ps">形</span></div><div class="ja">（肉が）よく焼けた</div><div class="ex">I’ll have a <b>well-done</b> steak, please.</div><div class="xj">よく焼いたステーキをお願いします。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">earth</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">地球</div><div class="ex">The <b>earth</b> goes around the sun.</div><div class="xj">地球は太陽のまわりを回っています。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">exercise</span><span class="ps">名</span></div><div class="ja">運動；練習（問題）</div><div class="ex"><b>Exercise</b> is good for your health.</div><div class="xj">運動は健康によいです。</div></button></li></ol><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"301": 4.31, "302": 17.14, "303": 31.13, "304": 44.04, "305": 58.08, "306": 73.91, "307": 87.35, "308": 100.86, "309": 115.2, "310": 127.87, "311": 141.4, "312": 155.15, "313": 169.0, "314": 182.31, "315": 194.62, "316": 208.37, "317": 221.47, "318": 234.23, "319": 246.76, "320": 261.34, "321": 278.78, "322": 292.36, "323": 305.85, "324": 320.12, "325": 333.94, "326": 347.07, "327": 360.5, "328": 372.91, "329": 386.44, "330": 398.99};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
