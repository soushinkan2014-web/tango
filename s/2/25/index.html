</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第25回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.126〜129　No.721〜750</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../25.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">re-entry</span><span class="ps">名</span></div><div class="ja">（大気圏への）再突入；再び入ること</div><div class="ex">The <b>re-entry</b> of the spaceship was safe.</div><div class="xj">宇宙船の再突入は無事でした。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">safely</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">安全に；無事に</div><div class="ex">Please ride your bike <b>safely</b>.</div><div class="xj">自転車には安全に乗ってね。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">solution</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">解決法；解答</div><div class="ex">We need a good <b>solution</b> to this problem.</div><div class="xj">私たちにはこの問題のよい解決法が必要です。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">appear</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">現れる；出てくる</div><div class="ex">A rainbow <b>appeared</b> after the rain.</div><div class="xj">雨のあとに、にじが現れました。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">calm</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">落ち着いた；穏やかな</div><div class="ex">Stay <b>calm</b> and listen to me.</div><div class="xj">落ち着いて、私の話を聞いて。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">contact</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">連絡する</div><div class="ex">Please <b>contact</b> me by email.</div><div class="xj">メールで私に連絡してください。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">failure</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">失敗</div><div class="ex">Don’t be afraid of <b>failure</b>.</div><div class="xj">失敗をおそれないで。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">option</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">選択肢</div><div class="ex">We have two <b>options</b> for lunch today.</div><div class="xj">今日の昼食には2つの選択肢があります。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">orange</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">オレンジ色の</div><div class="ex">Lisa has an <b>orange</b> umbrella.</div><div class="xj">リサはオレンジ色のかさを持っています。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">parachute</span><span class="ps">名</span></div><div class="ja">パラシュート</div><div class="ex">The man came down with a <b>parachute</b>.</div><div class="xj">その男の人はパラシュートで降りてきました。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">sign</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">標識；看板；合図</div><div class="ex">Look at that <b>sign</b> by the road.</div><div class="xj">道のそばのあの標識を見て。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">situation</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">状況；立場</div><div class="ex">The <b>situation</b> was very difficult.</div><div class="xj">状況はとても難しかったです。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">successfully</span><span class="ps">副</span></div><div class="ja">うまく；首尾よく</div><div class="ex">We finished the job <b>successfully</b>.</div><div class="xj">私たちはその仕事をうまく終えました。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">teamwork</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">チームワーク</div><div class="ex"><b>Teamwork</b> is important in soccer.</div><div class="xj">サッカーではチームワークが大切です。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">voice</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">声</div><div class="ex">Emi has a beautiful <b>voice</b>.</div><div class="xj">エミは美しい声をしています。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">wisdom</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">知恵</div><div class="ex">My grandfather has a lot of <b>wisdom</b>.</div><div class="xj">私の祖父はたくさんの知恵を持っています。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">explosion</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">爆発</div><div class="ex">We saw a small <b>explosion</b> in science class.</div><div class="xj">私たちは理科の授業で小さな爆発を見ました。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">give up ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～をあきらめる；やめる</div><div class="ex">Don’t <b>give up</b> your dream.</div><div class="xj">夢をあきらめないで。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">go bowling</span><span class="ps">熟</span></div><div class="ja">ボウリングに行く</div><div class="ex">We <b>went bowling</b> last Sunday.</div><div class="xj">私たちはこの前の日曜日にボウリングに行きました。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">chewy</span><span class="ps">形</span></div><div class="ja">もちもちした；かみごたえのある</div><div class="ex">This bread is soft and <b>chewy</b>.</div><div class="xj">このパンはやわらかくてもちもちしています。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">documentary</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">ドキュメンタリー（番組・映画）</div><div class="ex">I watched a <b>documentary</b> about penguins.</div><div class="xj">私はペンギンについてのドキュメンタリーを見ました。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">gardening</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">庭いじり；ガーデニング</div><div class="ex">My mother enjoys <b>gardening</b> on weekends.</div><div class="xj">母は週末に庭いじりを楽しみます。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">greasy</span><span class="ps">形</span></div><div class="ja">脂っこい</div><div class="ex">I don’t like <b>greasy</b> food.</div><div class="xj">私は脂っこい食べ物が好きではありません。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">jog</span><span class="ps">動</span></div><div class="ja">ジョギングする</div><div class="ex">My father <b>jogs</b> in the park every morning.</div><div class="xj">父は毎朝公園でジョギングします。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">go jogging</span><span class="ps">熟</span></div><div class="ja">ジョギングに行く</div><div class="ex">Let’s <b>go jogging</b> together tomorrow.</div><div class="xj">明日いっしょにジョギングに行こう。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">take a nap</span><span class="ps">熟</span><span class="ek">英2</span></div><div class="ja">昼寝をする</div><div class="ex">My little brother <b>takes a nap</b> after lunch.</div><div class="xj">弟は昼食のあとに昼寝をします。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">plain</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">味のついていない；飾りのない</div><div class="ex">I like <b>plain</b> yogurt.</div><div class="xj">私は味のついていないヨーグルトが好きです。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">radio</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ラジオ</div><div class="ex">My grandfather listens to the <b>radio</b> every morning.</div><div class="xj">祖父は毎朝ラジオを聞きます。</div></button></li><li><button class="w" data-no="749"><div class="top"><span class="no">749</span><span class="en">rent</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（お金を払って）借りる；貸す</div><div class="ex">We <b>rented</b> bikes at the station.</div><div class="xj">私たちは駅で自転車を借りました。</div></button></li><li><button class="w" data-no="750"><div class="top"><span class="no">750</span><span class="en">rich</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（味が）濃厚な；こってりした</div><div class="ex">This chocolate cake is very <b>rich</b>.</div><div class="xj">このチョコレートケーキはとても濃厚です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../24/">← 第24回</a><a href="../26/">第26回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"721": 4.48, "722": 19.95, "723": 32.98, "724": 46.99, "725": 60.52, "726": 73.82, "727": 86.63, "728": 98.91, "729": 111.96, "730": 124.7, "731": 137.66, "732": 150.83, "733": 164.75, "734": 178.69, "735": 191.57, "736": 204.17, "737": 217.08, "738": 231.16, "739": 244.45, "740": 257.41, "741": 271.66, "742": 286.51, "743": 300.79, "744": 313.1, "745": 326.41, "746": 339.7, "747": 353.02, "748": 366.53, "749": 380.16, "750": 393.95}, "TE": {"721": 6.35, "722": 21.82, "723": 34.95, "724": 48.86, "725": 62.28, "726": 75.74, "727": 88.5, "728": 100.78, "729": 113.79, "730": 126.6, "731": 139.53, "732": 152.92, "733": 166.86, "734": 180.56, "735": 193.42, "736": 206.04, "737": 219.09, "738": 233.03, "739": 246.37, "740": 259.28, "741": 273.7, "742": 288.38, "743": 302.66, "744": 314.97, "745": 328.38, "746": 341.62, "747": 354.89, "748": 368.4, "749": 382.03, "750": 395.82}, "Q": [[721, "（大気圏への）再突入", "re-entry"], [722, "安全に", "safely"], [723, "解決法", "solution"], [724, "現れる", "appear"], [725, "落ち着いた", "calm"], [726, "連絡する", "contact"], [727, "失敗", "failure"], [728, "選択肢", "option"], [729, "オレンジ色の", "orange"], [730, "パラシュート", "parachute"], [731, "標識", "sign"], [732, "状況", "situation"], [733, "うまく", "successfully"], [734, "チームワーク", "teamwork"], [735, "声", "voice"], [736, "知恵", "wisdom"], [737, "爆発", "explosion"], [738, "～をあきらめる（2語で）", "give up"], [739, "ボウリングに行く（2語で）", "go bowling"], [740, "もちもちした", "chewy"], [741, "ドキュメンタリー（番組・映画）", "documentary"], [742, "庭いじり", "gardening"], [743, "脂っこい", "greasy"], [744, "ジョギングする", "jog"], [745, "ジョギングに行く（2語で）", "go jogging"], [746, "昼寝をする（3語で）", "take a nap"], [747, "味のついていない", "plain"], [748, "ラジオ", "radio"], [749, "（お金を払って）借りる", "rent"], [750, "（味が）濃厚な", "rich"
