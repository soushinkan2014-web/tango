</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第13回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.69〜71　No.361〜390</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">shelf</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">棚</div><div class="ex">Please put the books on the <b>shelf</b>.</div><div class="xj">本を棚に置いてください。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">shelves</span><span class="ps">名</span></div><div class="ja">棚（shelf の複数形）</div><div class="ex">There are many books on the <b>shelves</b>.</div><div class="xj">棚にたくさんの本があります。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">treat</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">扱う；接する</div><div class="ex">Please <b>treat</b> animals kindly.</div><div class="xj">動物をやさしく扱ってください。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">action</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">行動；動作</div><div class="ex">Small <b>actions</b> can change the world.</div><div class="xj">小さな行動が世界を変えることができます。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">take action</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">行動を起こす</div><div class="ex">We need to <b>take action</b> to protect the sea.</div><div class="xj">私たちは海を守るために行動を起こす必要があります。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">decide</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">決める；決心する</div><div class="ex">I <b>decided</b> to join the art club.</div><div class="xj">私は美術部に入ることに決めました。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">everything</span><span class="ps">代</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">すべてのもの；何でも</div><div class="ex">Ken knows <b>everything</b> about trains.</div><div class="xj">ケンは電車のことなら何でも知っています。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">listener</span><span class="ps">名</span></div><div class="ja">聞き手</div><div class="ex">Emi is a good <b>listener</b>.</div><div class="xj">エミはよい聞き手です。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">lonely</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">さびしい；孤独な</div><div class="ex">My grandmother lives alone, but she isn’t <b>lonely</b>.</div><div class="xj">祖母は一人暮らしですが、さびしくはありません。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">new</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">初めての；不慣れな</div><div class="ex">In Canada, everything was <b>new</b> to me.</div><div class="xj">カナダでは、すべてが私にとって初めてでした。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">old</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">年をとった；高齢の</div><div class="ex">My grandfather is <b>old</b> but very healthy.</div><div class="xj">祖父は年をとっていますが、とても元気です。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">particular</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">特別の；特定の</div><div class="ex">I don’t have any <b>particular</b> plans for Sunday.</div><div class="xj">日曜日は特別な予定はありません。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">in particular</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">特に</div><div class="ex">I like fruit, apples <b>in particular</b>.</div><div class="xj">私は果物、特にりんごが好きです。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">spoke</span><span class="ps">動</span></div><div class="ja">話した（speak の過去形）</div><div class="ex">Lisa <b>spoke</b> to me in Japanese.</div><div class="xj">リサは日本語で私に話しかけました。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">to</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～まで</div><div class="ex">The shop is open from ten <b>to</b> seven.</div><div class="xj">その店は10時から7時まで開いています。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">try</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（try to ～で）～しようとする；試す</div><div class="ex">Ken <b>tried</b> to answer the question.</div><div class="xj">ケンはその質問に答えようとしました。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">waiting room</span><span class="ps">熟</span></div><div class="ja">待合室</div><div class="ex">Please sit in the <b>waiting room</b>.</div><div class="xj">待合室でおかけください。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">asleep</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">眠って</div><div class="ex">The baby is <b>asleep</b> now.</div><div class="xj">赤ちゃんは今眠っています。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">fall asleep</span><span class="ps">熟</span></div><div class="ja">眠りこむ；寝入る</div><div class="ex">I <b>fell asleep</b> on the train.</div><div class="xj">私は電車で眠ってしまいました。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">beside</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～のそばに；～のとなりに</div><div class="ex">Ken sat <b>beside</b> me in class.</div><div class="xj">授業中、ケンは私のとなりにすわりました。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">fall</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">落ちる；倒れる</div><div class="ex">Be careful. Don’t <b>fall</b> off the chair.</div><div class="xj">気をつけて。いすから落ちないでね。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">fell</span><span class="ps">動</span></div><div class="ja">落ちた；倒れた（fall の過去形）</div><div class="ex">An apple <b>fell</b> from the tree.</div><div class="xj">木からりんごが落ちました。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">future</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">将来；未来</div><div class="ex">What do you want to be in the <b>future</b>?</div><div class="xj">あなたは将来何になりたいですか。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">gave</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">与えた；くれた（give の過去形）</div><div class="ex">My aunt <b>gave</b> me a nice watch.</div><div class="xj">おばが私にすてきな腕時計をくれました。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">importance</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">大切さ；重要性</div><div class="ex">Our teacher talked about the <b>importance</b> of reading.</div><div class="xj">先生は読書の大切さについて話しました。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">nap</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">昼寝；うたた寝</div><div class="ex">My grandfather takes a <b>nap</b> after lunch.</div><div class="xj">祖父は昼食のあとに昼寝をします。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">nursery school</span><span class="ps">熟</span></div><div class="ja">保育園</div><div class="ex">My little brother goes to <b>nursery school</b>.</div><div class="xj">弟は保育園に通っています。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">taught</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">教えた（teach の過去形）</div><div class="ex">Mr. Sato <b>taught</b> us English last year.</div><div class="xj">佐藤先生は昨年、私たちに英語を教えてくれました。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">thank-you</span><span class="ps">形</span></div><div class="ja">お礼の；感謝の</div><div class="ex">I wrote a <b>thank-you</b> letter to my host family.</div><div class="xj">私はホストファミリーにお礼の手紙を書きました。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">use</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">使い道；使用</div><div class="ex">Paper has many <b>uses</b>.</div><div class="xj">紙にはたくさんの使い道があります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"361": 4.33, "362": 16.9, "363": 30.51, "364": 43.68, "365": 57.21, "366": 70.84, "367": 84.37, "368": 98.14, "369": 110.36, "370": 124.82, "371": 138.79, "372": 153.04, "373": 167.1, "374": 180.61, "375": 194.55, "376": 207.62, "377": 222.74, "378": 235.24, "379": 247.67, "380": 261.25, "381": 276.15, "382": 290.71, "383": 304.68, "384": 317.27, "385": 331.52, "386": 346.09, "387": 359.64, "388": 373.34, "389": 387.36, "390": 401.15}, "TE": {"361": 6.2, "362": 18.85, "363": 32.38, "364": 45.55, "365": 59.2, "366": 72.71, "367": 86.24, "368": 100.02, "369": 112.23, "370": 126.7, "371": 140.66, "372": 154.94, "373": 169.12, "374": 182.41, "375": 196.42, "376": 209.5, "377": 224.68, "378": 237.11, "379": 249.76, "380": 263.12, "381": 278.02, "382": 292.58, "383": 306.55, "384": 319.14, "385": 333.56, "386": 347.96, "387": 361.85, "388": 375.22, "389": 389.23, "390": 403.02}, "Q": [[361, "棚", "shelf"], [362, "棚（shelf の複数形）", "shelves"], [363, "扱う", "treat"], [364, "行動", "action"], [365, "行動を起こす（2語で）", "take action"], [366, "決める", "decide"], [367, "すべてのもの", "everything"], [368, "聞き手", "listener"], [369, "さびしい", "lonely"], [370, "初めての", "new"], [371, "年をとった", "old"], [372, "特別の", "particular"], [373, "特に（2語で）", "in particular"], [374, "話した（speak の過去形）", "spoke"], [375, "～まで", "to"], [376, "～しようとする（2語で）", "try to"], [377, "待合室（2語で）", "waiting room"], [378, "眠って", "asleep"], [379, "眠りこむ（2語で）", "fall asleep"], [380, "～のそばに", "beside"], [381, "落ちる", "fall"], [382, "落ちた", "fell"], [383, "将来", "future"], [384, "与えた", "gave"], [385, "大切さ", "importance"], [
