class="en">noisy</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">うるさい；騒がしい</div><div class="ex">This street is very <b>noisy</b> at night.</div><div class="xj">この通りは夜とてもうるさいです。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">pilaf</span><span class="ps">名</span></div><div class="ja">ピラフ</div><div class="ex">I made chicken <b>pilaf</b> for dinner.</div><div class="xj">私は夕食にチキンピラフを作りました。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">rice ball</span><span class="ps">熟</span></div><div class="ja">おにぎり</div><div class="ex">I made two <b>rice balls</b> for the picnic.</div><div class="xj">私はピクニックのためにおにぎりを2つ作りました。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">shallow</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">浅い</div><div class="ex">Children can swim in the <b>shallow</b> pool.</div><div class="xj">子どもたちは浅いプールで泳げます。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">skateboarding</span><span class="ps">名</span></div><div class="ja">スケートボード（をすること）</div><div class="ex"><b>Skateboarding</b> is an Olympic sport now.</div><div class="xj">スケートボードは今ではオリンピックの競技です。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">slow</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">遅い；ゆっくりした</div><div class="ex">This old computer is very <b>slow</b>.</div><div class="xj">この古いコンピューターはとても遅いです。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">snowboarding</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スノーボード（をすること）</div><div class="ex">We enjoyed <b>snowboarding</b> in Nagano.</div><div class="xj">私たちは長野でスノーボードを楽しみました。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">trombone</span><span class="ps">名</span></div><div class="ja">トロンボーン</div><div class="ex">Yuki plays the <b>trombone</b> in the brass band.</div><div class="xj">ユキは吹奏楽部でトロンボーンを吹いています。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">shoe store</span><span class="ps">熟</span></div><div class="ja">靴屋</div><div class="ex">I bought new boots at the <b>shoe store</b>.</div><div class="xj">私は靴屋で新しいブーツを買いました。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">art museum</span><span class="ps">熟</span></div><div class="ja">美術館</div><div class="ex">We visited the <b>art museum</b> last Saturday.</div><div class="xj">私たちはこの前の土曜日に美術館を訪れました。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">bakery</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">パン屋</div><div class="ex">There is a new <b>bakery</b> near the station.</div><div class="xj">駅の近くに新しいパン屋があります。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">barbershop</span><span class="ps">名</span></div><div class="ja">理髪店；床屋</div><div class="ex">My father goes to the <b>barbershop</b> every month.</div><div class="xj">父は毎月理髪店に行きます。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">boring</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">退屈な；つまらない</div><div class="ex">The movie was long and <b>boring</b>.</div><div class="xj">その映画は長くて退屈でした。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">butcher shop</span><span class="ps">熟</span></div><div class="ja">肉屋</div><div class="ex">My mother buys meat at the <b>butcher shop</b>.</div><div class="xj">母は肉屋で肉を買います。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">candy store</span><span class="ps">熟</span></div><div class="ja">お菓子屋</div><div class="ex">Emi bought some chocolate at the <b>candy store</b>.</div><div class="xj">エミはお菓子屋でチョコレートを買いました。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">clothing store</span><span class="ps">熟</span></div><div class="ja">衣料品店；洋服店</div><div class="ex">I’m going to buy a shirt at the <b>clothing store</b>.</div><div class="xj">私は洋服店でシャツを買うつもりです。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">coffee shop</span><span class="ps">熟</span></div><div class="ja">喫茶店；コーヒー店</div><div class="ex">Let’s meet at the <b>coffee shop</b> at three.</div><div class="xj">3時に喫茶店で会おう。</div></button></li><li><button class="w" data-no="832"><div class="top"><span class="no">832</span><span class="en">confusing</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">わかりにくい；まぎらわしい</div><div class="ex">This map is very <b>confusing</b>.</div><div class="xj">この地図はとてもわかりにくいです。</div></button></li><li><button class="w" data-no="833"><div class="top"><span class="no">833</span><span class="en">convenient</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">便利な；都合のよい</div><div class="ex">This town is <b>convenient</b> for shopping.</div><div class="xj">この町は買い物に便利です。</div></button></li><li><button class="w" data-no="834"><div class="top"><span class="no">834</span><span class="en">department store</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">デパート；百貨店</div><div class="ex">There are many shops in the <b>department store</b>.</div><div class="xj">そのデパートにはたくさんの店があります。</div></button></li><li><button class="w" data-no="835"><div class="top"><span class="no">835</span><span class="en">dish</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">皿；（the dishes で）食器</div><div class="ex">Please put the <b>dishes</b> on the table.</div><div class="xj">テーブルにお皿を並べてください。</div></button></li><li><button class="w" data-no="836"><div class="top"><span class="no">836</span><span class="en">do the dishes</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">皿洗いをする</div><div class="ex">I <b>do the dishes</b> after dinner every day.</div><div class="xj">私は毎日夕食のあとに皿洗いをします。</div></button></li><li><button class="w" data-no="837"><div class="top"><span class="no">837</span><span class="en">drugstore</span><span class="ps">名</span></div><div class="ja">ドラッグストア；薬局</div><div class="ex">My mother bought some medicine at the <b>drugstore</b>.</div><div class="xj">母はドラッグストアで薬を買いました。</div></button></li><li><button class="w" data-no="838"><div class="top"><span class="no">838</span><span class="en">fish shop</span><span class="ps">熟</span></div><div class="ja">魚屋</div><div class="ex">The <b>fish shop</b> sells fresh fish every morning.</div><div class="xj">その魚屋は毎朝新鮮な魚を売っています。</div></button></li><li><button class="w" data-no="839"><div class="top"><span class="no">839</span><span class="en">flower shop</span><span class="ps">熟</span></div><div class="ja">花屋</div><div class="ex">I bought roses at the <b>flower shop</b> for Mother’s Day.</div><div class="xj">私は母の日のために花屋でバラを買いました。</div></button></li><li><button class="w" data-no="840"><div class="top"><span class="no">840</span><span class="en">gas station</span><span class="ps">熟</span></div><div class="ja">ガソリンスタンド</div><div class="ex">My father stopped at the <b>gas station</b>.</div><div class="xj">父はガソリンスタンドに寄りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自
