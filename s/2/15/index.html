</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第15回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.77〜80　No.421〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">tall</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">背が高い；高い</div><div class="ex">My father is very <b>tall</b>.</div><div class="xj">父はとても背が高いです。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">useful</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">役に立つ</div><div class="ex">This dictionary is very <b>useful</b>.</div><div class="xj">この辞書はとても役に立ちます。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">another</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">別の；もう1つの</div><div class="ex">Let’s meet <b>another</b> day.</div><div class="xj">別の日に会いましょう。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">leaf</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">葉</div><div class="ex">I found a big <b>leaf</b> in the park.</div><div class="xj">私は公園で大きな葉を見つけました。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">leaves</span><span class="ps">名</span></div><div class="ja">葉（leaf の複数形）</div><div class="ex">The <b>leaves</b> turn red in the fall.</div><div class="xj">秋には葉が赤くなります。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">lid</span><span class="ps">名</span></div><div class="ja">ふた</div><div class="ex">Please open the <b>lid</b> of the box.</div><div class="xj">箱のふたを開けてください。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">lotus</span><span class="ps">名</span></div><div class="ja">ハス</div><div class="ex"><b>Lotus</b> flowers are beautiful in summer.</div><div class="xj">夏にはハスの花が美しいです。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">off</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～から（離れて）</div><div class="ex">The cat jumped <b>off</b> the table.</div><div class="xj">ネコがテーブルから飛び降りました。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">raindrop</span><span class="ps">名</span></div><div class="ja">雨粒；雨のしずく</div><div class="ex"><b>Raindrops</b> are falling from the roof.</div><div class="xj">屋根から雨のしずくが落ちています。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">run</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">流れる；走る</div><div class="ex">The river <b>runs</b> through our town.</div><div class="xj">その川は私たちの町を流れています。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">stick</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">貼る；くっつく</div><div class="ex"><b>Stick</b> this note on the door.</div><div class="xj">このメモをドアに貼ってください。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">stick to ～</span><span class="ps">熟</span></div><div class="ja">～にくっつく</div><div class="ex">Rice <b>sticks to</b> my fingers.</div><div class="xj">ごはんが指にくっつきます。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">wet</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">ぬれた</div><div class="ex">My shoes got <b>wet</b> in the rain.</div><div class="xj">雨で靴がぬれました。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">boat shoe</span><span class="ps">熟</span></div><div class="ja">ボートシューズ；デッキシューズ</div><div class="ex">My father wears <b>boat shoes</b> in summer.</div><div class="xj">父は夏にボートシューズをはきます。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">cut</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">切り傷；切れ目</div><div class="ex">I have a small <b>cut</b> on my finger.</div><div class="xj">私は指に小さな切り傷があります。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">one day</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">ある日</div><div class="ex"><b>One day</b>, Ken found a small cat in the park.</div><div class="xj">ある日、ケンは公園で小さなネコを見つけました。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">deck</span><span class="ps">名</span></div><div class="ja">甲板；デッキ</div><div class="ex">We stood on the <b>deck</b> of the ship.</div><div class="xj">私たちは船の甲板に立ちました。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">develop</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">開発する；発達させる</div><div class="ex">They <b>developed</b> a new kind of shoe.</div><div class="xj">彼らは新しい種類の靴を開発しました。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">～, don’t you?</span><span class="ps">熟</span></div><div class="ja">～ですよね（念をおす言い方）</div><div class="ex">You like music, <b>don’t you?</b></div><div class="xj">あなたは音楽が好きですよね。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">fall into ～</span><span class="ps">熟</span></div><div class="ja">～に落ちる</div><div class="ex">My ball <b>fell into</b> the pond.</div><div class="xj">私のボールが池に落ちました。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">groove</span><span class="ps">名</span></div><div class="ja">溝</div><div class="ex">This shoe has <b>grooves</b> on the bottom.</div><div class="xj">この靴は底に溝があります。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">icy</span><span class="ps">形</span></div><div class="ja">凍った；氷のように冷たい</div><div class="ex">Be careful. The road is <b>icy</b>.</div><div class="xj">気をつけて。道が凍っているよ。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">inspiration</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">ひらめき；インスピレーション</div><div class="ex">Nature gives us <b>inspiration</b>.</div><div class="xj">自然は私たちにひらめきを与えてくれます。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">invention</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">発明；発明品</div><div class="ex">The telephone was a great <b>invention</b>.</div><div class="xj">電話はすばらしい発明品でした。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">non-slip</span><span class="ps">形</span></div><div class="ja">すべり止めの</div><div class="ex">I bought <b>non-slip</b> shoes for the rainy season.</div><div class="xj">私は梅雨に備えてすべり止めの靴を買いました。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">one</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">（同じ種類の）もの；1つ</div><div class="ex">I lost my pen, so I bought a new <b>one</b>.</div><div class="xj">ペンをなくしたので、新しいものを買いました。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">paw</span><span class="ps">名</span></div><div class="ja">（犬・ネコなどの）足</div><div class="ex">My dog has white <b>paws</b>.</div><div class="xj">私の犬は足が白いです。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">pet</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ペット</div><div class="ex">Do you have any <b>pets</b> at home?</div><div class="xj">あなたは家でペットを飼っていますか。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">sail</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">航海する；帆走する</div><div class="ex">The ship <b>sailed</b> across the sea.</div><div class="xj">その船は海を航海しました。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">sea</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">海</div><div class="ex">We swam in the <b>sea</b> last summer.</div><div class="xj">私たちは去年の夏、海で泳ぎました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳
