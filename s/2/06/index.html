</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第6回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.32〜37　No.151〜180</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">job</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">仕事</div><div class="ex">My father likes his <b>job</b>.</div><div class="xj">父は自分の仕事が好きです。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">Good job.</span><span class="ps">熟</span></div><div class="ja">よくやったね</div><div class="ex">A: I finished my homework.<br>B: <b>Good job.</b></div><div class="xj">A：宿題が終わったよ。B：よくやったね。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">scoop</span><span class="ps">動</span></div><div class="ja">すくう</div><div class="ex">She <b>scooped</b> some water with her hands.</div><div class="xj">彼女は手で水をすくいました。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">scoop up ～</span><span class="ps">熟</span></div><div class="ja">～をすくい上げる</div><div class="ex">Ken <b>scooped up</b> five goldfish at the festival.</div><div class="xj">ケンはお祭りで金魚を5匹すくい上げました。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">thin</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">薄い；やせた</div><div class="ex">This paper is very <b>thin</b>.</div><div class="xj">この紙はとても薄いです。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">wait</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">待つ</div><div class="ex">Please <b>wait</b> here for a minute.</div><div class="xj">ここで少し待っていてください。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">catch</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">捕まえる；捕る</div><div class="ex">I tried to <b>catch</b> the ball.</div><div class="xj">私はそのボールを捕ろうとしました。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">for the first time</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">初めて</div><div class="ex">I ate natto <b>for the first time</b> yesterday.</div><div class="xj">私は昨日初めて納豆を食べました。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">get</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">着く；到着する</div><div class="ex">What time did you <b>get</b> home yesterday?</div><div class="xj">昨日は何時に家に着きましたか。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">light</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">軽い；明るい</div><div class="ex">My new bag is very <b>light</b>.</div><div class="xj">私の新しいかばんはとても軽いです。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">present</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">プレゼント；贈り物</div><div class="ex">This is a <b>present</b> for you.</div><div class="xj">これはあなたへのプレゼントです。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">racket</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ラケット</div><div class="ex">I saved money to buy a new <b>racket</b>.</div><div class="xj">私は新しいラケットを買うためにお金をためました。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">soft</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">やわらかい</div><div class="ex">This bread is very <b>soft</b>.</div><div class="xj">このパンはとてもやわらかいです。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">white</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">白い</div><div class="ex">Yuki has a <b>white</b> cat.</div><div class="xj">ユキは白いネコを飼っています。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">corn dog</span><span class="ps">熟</span></div><div class="ja">アメリカンドッグ</div><div class="ex">I bought a <b>corn dog</b> at the shop.</div><div class="xj">私はその店でアメリカンドッグを買いました。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">cotton candy</span><span class="ps">熟</span></div><div class="ja">綿あめ</div><div class="ex">My sister loves <b>cotton candy</b>.</div><div class="xj">妹は綿あめが大好きです。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">basketball</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">バスケットボール用のボール</div><div class="ex">Tom wanted a new <b>basketball</b>.</div><div class="xj">トムは新しいバスケットボール用のボールをほしがっていました。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">by oneself</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">ひとりで；自分で</div><div class="ex">Emi made dinner <b>by herself</b>.</div><div class="xj">エミはひとりで夕食を作りました。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">earn</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">稼ぐ；（お金を）得る</div><div class="ex">I <b>earned</b> money by washing cars.</div><div class="xj">私は車を洗ってお金を稼ぎました。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">forward</span><span class="ps">副</span></div><div class="ja">前へ</div><div class="ex">Please take one step <b>forward</b>.</div><div class="xj">1歩前へ出てください。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">look forward to ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を楽しみに待つ</div><div class="ex">I’m <b>looking forward to</b> seeing you.</div><div class="xj">あなたに会えるのを楽しみにしています。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">lemonade</span><span class="ps">名</span></div><div class="ja">レモネード</div><div class="ex">My mother makes <b>lemonade</b> in summer.</div><div class="xj">母は夏にレモネードを作ります。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">sell</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">売る</div><div class="ex">Ken <b>sold</b> his old bike to Tom.</div><div class="xj">ケンは古い自転車をトムに売りました。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">sometime</span><span class="ps">副</span></div><div class="ja">いつか</div><div class="ex">Let’s have lunch together <b>sometime</b>.</div><div class="xj">いつか一緒にお昼を食べよう。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">sometime soon</span><span class="ps">熟</span></div><div class="ja">近いうちに</div><div class="ex">Please come to my house <b>sometime soon</b>.</div><div class="xj">近いうちにうちに来てください。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">themselves</span><span class="ps">代</span></div><div class="ja">彼ら自身；それら自身</div><div class="ex">The children made the cake by <b>themselves</b>.</div><div class="xj">子どもたちは自分たちだけでケーキを作りました。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">then</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">そのとき；そのころ</div><div class="ex">A: Let’s meet at ten.<br>B: OK. See you <b>then</b>.</div><div class="xj">A：10時に会おう。B：わかった。じゃあそのときにね。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">with</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～のある；～を持った</div><div class="ex">I want a house <b>with</b> a big garden.</div><div class="xj">私は大きな庭のある家がほしいです。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">each</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">それぞれの；各～</div><div class="ex"><b>Each</b> student has a computer.</div><div class="xj">それぞれの生徒がコンピューターを持っています。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">other</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">ほかの人；ほかのもの</div><div class="ex">Be kind to <b>others</b>.</div><div class="xj">ほかの人に親切にしなさい。</div></button>
