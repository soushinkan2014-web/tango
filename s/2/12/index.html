</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第12回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.64〜69　No.331〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">for free</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">無料で；ただで</div><div class="ex">You can get this bag <b>for free</b>.</div><div class="xj">このかばんは無料でもらえます。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">gym</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ジム；体育館</div><div class="ex">My father goes to the <b>gym</b> after work.</div><div class="xj">父は仕事のあとでジムに行きます。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">life</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">生活；人生；命</div><div class="ex">My <b>life</b> in Canada was a lot of fun.</div><div class="xj">カナダでの私の生活はとても楽しかったです。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">machine</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">機械</div><div class="ex">This <b>machine</b> makes coffee.</div><div class="xj">この機械はコーヒーを作ります。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">save</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">救う；節約する；ためる</div><div class="ex">The doctor <b>saved</b> the boy’s life.</div><div class="xj">その医師は男の子の命を救いました。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">twenty-four seven</span><span class="ps">熟</span></div><div class="ja">24時間年中無休で；いつも</div><div class="ex">This store is open <b>twenty-four seven</b>.</div><div class="xj">この店は24時間年中無休で開いています。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">work</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">仕事；作品</div><div class="ex">My mother has a lot of <b>work</b> today.</div><div class="xj">母は今日、仕事がたくさんあります。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">apron</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">エプロン</div><div class="ex">Put on your <b>apron</b> before cooking.</div><div class="xj">料理をする前にエプロンをつけなさい。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">athlete</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">運動選手；アスリート</div><div class="ex">Ken wants to be a great <b>athlete</b>.</div><div class="xj">ケンはすばらしい運動選手になりたいと思っています。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">become</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～になる</div><div class="ex">I want to <b>become</b> a nurse.</div><div class="xj">私は看護師になりたいです。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">lend</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">貸す</div><div class="ex">Can you <b>lend</b> your eraser to me?</div><div class="xj">私に消しゴムを貸してくれますか。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">meter</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">メートル</div><div class="ex">This pool is fifty <b>meters</b> long.</div><div class="xj">このプールは長さ50メートルです。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">place</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">順位；～位</div><div class="ex">Our team was in first <b>place</b> last year.</div><div class="xj">私たちのチームは昨年1位でした。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">get ～ place</span><span class="ps">熟</span></div><div class="ja">～位になる</div><div class="ex">Tom <b>got second place</b> in the speech contest.</div><div class="xj">トムはスピーチコンテストで2位になりました。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">tablet</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">タブレット</div><div class="ex">We use <b>tablets</b> in English class.</div><div class="xj">私たちは英語の授業でタブレットを使います。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">boat</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">ボート；船</div><div class="ex">We rode a <b>boat</b> on the lake.</div><div class="xj">私たちは湖でボートに乗りました。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">both</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">両方の；両方</div><div class="ex"><b>Both</b> my sisters play tennis.</div><div class="xj">私の姉は2人ともテニスをします。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">chess</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">チェス</div><div class="ex">I often play <b>chess</b> with my grandfather.</div><div class="xj">私はよく祖父とチェスをします。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">cold</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">かぜ</div><div class="ex">My brother has a bad <b>cold</b>.</div><div class="xj">弟はひどいかぜをひいています。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">give</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（スピーチなどを）する；（会などを）開く</div><div class="ex">Ms. Brown will <b>give</b> a speech at the festival.</div><div class="xj">ブラウン先生は文化祭でスピーチをします。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">happen</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">起こる</div><div class="ex">What <b>happened</b> to your bike?</div><div class="xj">あなたの自転車に何が起こったのですか。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">paper</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">紙；新聞</div><div class="ex">I need some <b>paper</b> for art class.</div><div class="xj">美術の授業で紙が必要です。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">blame</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">責める；～のせいにする</div><div class="ex">Please don’t <b>blame</b> your little brother.</div><div class="xj">弟を責めないでね。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">drop</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">落とす；落ちる</div><div class="ex">I <b>dropped</b> my phone on the floor.</div><div class="xj">私は床に電話を落としました。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">Good for you.</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">よかったね；よくやったね</div><div class="ex">A: I won the game!<br>B: <b>Good for you.</b></div><div class="xj">A：試合に勝ったよ！B：よかったね。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">goods</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">商品；品物</div><div class="ex">This store sells sports <b>goods</b>.</div><div class="xj">この店はスポーツ用品を売っています。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">kindly</span><span class="ps">副</span></div><div class="ja">親切に；やさしく</div><div class="ex">Mr. Sato <b>kindly</b> helped me with my homework.</div><div class="xj">佐藤先生が親切に宿題を手伝ってくれました。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">mistake</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">間違い；誤り</div><div class="ex">I made a <b>mistake</b> on the test.</div><div class="xj">私はテストで間違いをしました。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">by mistake</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">間違って；うっかり</div><div class="ex">I took Ken’s umbrella <b>by mistake</b>.</div><div class="xj">私は間違ってケンのかさを持って帰りました。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">pack</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">荷物を詰める；詰める</div><div class="ex">Let’s <b>pack</b> our bags for the trip.</div><div class="xj">旅行のためにかばんに荷物を詰めましょう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"331": 4.26, "332": 17.55, "333": 31.23, "334": 45.02, "335": 57.52, "336": 71.08, "337": 86.58, "338": 99.87, "339": 112.44, "340": 126.24, "341": 138.79, "342": 151.14, "343": 164.12, "344": 177.99, "345": 191.98, "346": 204.89, "347": 217.51, "348": 230.8, "349": 244.0, "350": 256.59, "351": 271.71, "352": 283.82, "353": 297.02, "354": 310.84, "355": 323.82, "356": 339.17, "357": 352.49, "358": 366.69, "359": 379.89, "360": 393.83}, "TE": {"331": 6.25, "332": 19.42, "333": 33.1, "334": 46.9, "335": 59.4, "336": 73.31, "337": 88.45, "338": 101.74, "339": 114.32, "340": 128.11, "341": 140.66, "342": 153.02, "343": 166.0, "344": 179.94, "345": 193.85, "346": 206.76, "347": 219.38, "348": 232.67, "349": 245.87, "350": 258.46, "351": 273.58, "352": 285.7, "353": 298.89, "354": 312.71, "355": 325.67, "356": 341.04, "357": 354.36, "358": 368.56, "359": 381.93, "360": 395.7}, "Q": [[331, "無料で（2語で）", "for free"], [332, "ジム", "gym"], [333, "生活", "life"], [334, "機械", "machine"], [335, "救う", "save"], [336, "24時間年中無休で（2語で）", "twenty-four seven"], [337, "仕事", "work"], [338, "エプロン", "apron"], [339, "運動選手", "athlete"], [340, "～になる", "become"], [341, "貸す", "lend"], [342, "メートル", "meter"], [343, "順位", "place"], [344, "～位になる（2語で）", "get place"], [345, "タブレット", "tablet"], [346, "ボート", "boat"], [347, "両方の", "both"], [348, "チェス", "chess"], [349, "かぜ", "cold"], [350, "（スピーチなどを）する", "give"], [351, "起こる", "happen"], [352, "紙", "paper"], [353, "責める", "blame"], [354, "落とす"
