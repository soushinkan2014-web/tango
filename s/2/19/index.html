<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第19回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第19回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.93〜101　No.541〜570</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">respectfully</span><span class="ps">副</span></div><div class="ja">敬意をもって；うやうやしく</div><div class="ex">The students bowed <b>respectfully</b> to the guests.</div><div class="xj">生徒たちはお客さんに敬意をもっておじぎをしました。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">sank</span><span class="ps">動</span></div><div class="ja">沈んだ（sink の過去形）</div><div class="ex">My toy boat <b>sank</b> in the bath.</div><div class="xj">私のおもちゃの船がお風呂で沈みました。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">sink</span><span class="ps">動</span></div><div class="ja">沈む</div><div class="ex">Stones <b>sink</b> in water.</div><div class="xj">石は水の中で沈みます。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">survivor</span><span class="ps">名</span></div><div class="ja">生存者；生き残った人</div><div class="ex">The boat carried ten <b>survivors</b> to the island.</div><div class="xj">そのボートは10人の生存者を島まで運びました。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">typhoon</span><span class="ps">名</span></div><div class="ja">台風</div><div class="ex">A big <b>typhoon</b> is coming to Osaka.</div><div class="xj">大きな台風が大阪に近づいています。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">understand</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">理解する；わかる</div><div class="ex">I can’t <b>understand</b> this question.</div><div class="xj">私はこの問題が理解できません。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">village</span><span class="ps">名</span></div><div class="ja">村</div><div class="ex">My grandparents live in a small <b>village</b>.</div><div class="xj">祖父母は小さな村に住んでいます。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">on the way (back) to ～</span><span class="ps">熟</span></div><div class="ja">～へ行く（帰る）途中で</div><div class="ex">I saw Tom <b>on the way to</b> school.</div><div class="xj">私は学校へ行く途中でトムを見かけました。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">ambassador</span><span class="ps">名</span></div><div class="ja">大使</div><div class="ex">The <b>ambassador</b> from Turkey visited our school.</div><div class="xj">トルコの大使が私たちの学校を訪れました。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">between</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">（2つ）の間に；～の間で</div><div class="ex">The bank is <b>between</b> the post office and the park.</div><div class="xj">銀行は郵便局と公園の間にあります。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">earthquake</span><span class="ps">名</span></div><div class="ja">地震</div><div class="ex">Japan has many <b>earthquakes</b>.</div><div class="xj">日本は地震が多いです。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">eastern</span><span class="ps">形</span></div><div class="ja">東の；東部の</div><div class="ex">Our school is in the <b>eastern</b> part of the city.</div><div class="xj">私たちの学校は市の東部にあります。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">flew</span><span class="ps">動</span></div><div class="ja">飛んだ（fly の過去形）</div><div class="ex">A bird <b>flew</b> into our classroom.</div><div class="xj">1羽の鳥が教室に飛んで入ってきました。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">former</span><span class="ps">形</span></div><div class="ja">元の；前の</div><div class="ex">Mr. Sato is a <b>former</b> baseball player.</div><div class="xj">佐藤先生は元野球選手です。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">each other</span><span class="ps">熟</span></div><div class="ja">お互い</div><div class="ex">Ken and Tom often help <b>each other</b>.</div><div class="xj">ケンとトムはよくお互いに助け合っています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">accident</span><span class="ps">名</span></div><div class="ja">事故</div><div class="ex">There was a car <b>accident</b> near the station.</div><div class="xj">駅の近くで自動車事故がありました。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">return</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">戻る；帰る；返す</div><div class="ex">Lisa will <b>return</b> to Canada next month.</div><div class="xj">リサは来月カナダに戻ります。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">worker</span><span class="ps">名</span></div><div class="ja">働く人；労働者</div><div class="ex">The <b>workers</b> at this factory are very kind.</div><div class="xj">この工場で働く人たちはとても親切です。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">penguin</span><span class="ps">名</span></div><div class="ja">ペンギン</div><div class="ex"><b>Penguins</b> can’t fly, but they swim well.</div><div class="xj">ペンギンは飛べませんが、じょうずに泳ぎます。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">somewhere</span><span class="ps">副</span></div><div class="ja">どこかに；どこかで</div><div class="ex">I left my umbrella <b>somewhere</b>.</div><div class="xj">私はどこかにかさを置き忘れました。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">ticket</span><span class="ps">名</span></div><div class="ja">切符；チケット</div><div class="ex">I have two <b>tickets</b> for the concert.</div><div class="xj">私はコンサートのチケットを2枚持っています。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">blossom</span><span class="ps">名</span></div><div class="ja">（果樹の）花</div><div class="ex">The apple <b>blossoms</b> are white.</div><div class="xj">りんごの花は白いです。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">cherry</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">桜（の木）</div><div class="ex">There are many <b>cherry</b> trees along the river.</div><div class="xj">川沿いにたくさんの桜の木があります。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">a</span><span class="ps">冠</span><span class=star>★</span></div><div class="ja">～につき；～ごとに</div><div class="ex">Mr. Sato runs ten kilometers <b>a</b> week.</div><div class="xj">佐藤先生は1週間に10キロメートル走ります。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">～ times a day</span><span class="ps">熟</span></div><div class="ja">1日に～回</div><div class="ex">Brush your teeth <b>three times a day</b>.</div><div class="xj">1日に3回歯をみがきなさい。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">adorable</span><span class="ps">形</span></div><div class="ja">とてもかわいい；愛らしい</div><div class="ex">Your baby sister is <b>adorable</b>.</div><div class="xj">あなたの赤ちゃんの妹はとてもかわいいね。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">all over ～</span><span class="ps">熟</span></div><div class="ja">～じゅうで；～のいたるところで</div><div class="ex">This song is popular <b>all over</b> the world.</div><div class="xj">この歌は世界じゅうで人気があります。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">cheek</span><span class="ps">名</span></div><div class="ja">ほお</div><div class="ex">The baby has round red <b>cheeks</b>.</div><div class="xj">その赤ちゃんは丸くて赤いほおをしています。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">eye</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">目</div><div class="ex">My cat has blue <b>eyes</b>.</div><div class="xj">私のネコは青い目をしています。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">fur</span><span class="ps">名</span></div><div class="ja">（動物の）毛；毛皮</div><div class="ex">Our rabbit has soft white <b>fur</b>.</div><div class="xj">うちのウサギはやわらかい白い毛をしています。</div></button></li></ol><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"541": 4.4, "542": 19.28, "543": 33.03, "544": 45.46, "545": 60.31, "546": 73.46, "547": 86.96, "548": 100.14, "549": 116.02, "550": 129.55, "551": 144.72, "552": 157.55, "553": 171.37, "554": 184.78, "555": 198.58, "556": 211.44, "557": 224.47, "558": 238.0, "559": 252.3, "560": 265.81, "561": 279.08, "562": 292.27, "563": 304.82, "564": 318.11, "565": 333.23, "566": 347.07, "567": 361.13, "568": 376.46, "569": 389.35, "570": 401.87};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
