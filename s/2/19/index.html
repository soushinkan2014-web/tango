</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第19回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.93〜101　No.541〜570</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">respectfully</span><span class="ps">副</span></div><div class="ja">敬意をもって；うやうやしく</div><div class="ex">The students bowed <b>respectfully</b> to the guests.</div><div class="xj">生徒たちはお客さんに敬意をもっておじぎをしました。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">sank</span><span class="ps">動</span></div><div class="ja">沈んだ（sink の過去形）</div><div class="ex">My toy boat <b>sank</b> in the bath.</div><div class="xj">私のおもちゃの船がお風呂で沈みました。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">sink</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">沈む</div><div class="ex">Stones <b>sink</b> in water.</div><div class="xj">石は水の中で沈みます。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">survivor</span><span class="ps">名</span></div><div class="ja">生存者；生き残った人</div><div class="ex">The boat carried ten <b>survivors</b> to the island.</div><div class="xj">そのボートは10人の生存者を島まで運びました。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">typhoon</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">台風</div><div class="ex">A big <b>typhoon</b> is coming to Osaka.</div><div class="xj">大きな台風が大阪に近づいています。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">understand</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">理解する；わかる</div><div class="ex">I can’t <b>understand</b> this question.</div><div class="xj">私はこの問題が理解できません。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">village</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">村</div><div class="ex">My grandparents live in a small <b>village</b>.</div><div class="xj">祖父母は小さな村に住んでいます。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">on the way (back) to ～</span><span class="ps">熟</span></div><div class="ja">～へ行く（帰る）途中で</div><div class="ex">I saw Tom <b>on the way to</b> school.</div><div class="xj">私は学校へ行く途中でトムを見かけました。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">ambassador</span><span class="ps">名</span></div><div class="ja">大使</div><div class="ex">The <b>ambassador</b> from Turkey visited our school.</div><div class="xj">トルコの大使が私たちの学校を訪れました。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">between</span><span class="ps">前</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（2つ）の間に；～の間で</div><div class="ex">The bank is <b>between</b> the post office and the park.</div><div class="xj">銀行は郵便局と公園の間にあります。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">earthquake</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">地震</div><div class="ex">Japan has many <b>earthquakes</b>.</div><div class="xj">日本は地震が多いです。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">eastern</span><span class="ps">形</span></div><div class="ja">東の；東部の</div><div class="ex">Our school is in the <b>eastern</b> part of the city.</div><div class="xj">私たちの学校は市の東部にあります。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">flew</span><span class="ps">動</span></div><div class="ja">飛んだ（fly の過去形）</div><div class="ex">A bird <b>flew</b> into our classroom.</div><div class="xj">1羽の鳥が教室に飛んで入ってきました。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">former</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">元の；前の</div><div class="ex">Mr. Sato is a <b>former</b> baseball player.</div><div class="xj">佐藤先生は元野球選手です。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">each other</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">お互い</div><div class="ex">Ken and Tom often help <b>each other</b>.</div><div class="xj">ケンとトムはよくお互いに助け合っています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">accident</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">事故</div><div class="ex">There was a car <b>accident</b> near the station.</div><div class="xj">駅の近くで自動車事故がありました。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">return</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">戻る；帰る；返す</div><div class="ex">Lisa will <b>return</b> to Canada next month.</div><div class="xj">リサは来月カナダに戻ります。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">worker</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">働く人；労働者</div><div class="ex">The <b>workers</b> at this factory are very kind.</div><div class="xj">この工場で働く人たちはとても親切です。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">penguin</span><span class="ps">名</span></div><div class="ja">ペンギン</div><div class="ex"><b>Penguins</b> can’t fly, but they swim well.</div><div class="xj">ペンギンは飛べませんが、じょうずに泳ぎます。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">somewhere</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">どこかに；どこかで</div><div class="ex">I left my umbrella <b>somewhere</b>.</div><div class="xj">私はどこかにかさを置き忘れました。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">ticket</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">切符；チケット</div><div class="ex">I have two <b>tickets</b> for the concert.</div><div class="xj">私はコンサートのチケットを2枚持っています。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">blossom</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（果樹の）花</div><div class="ex">The apple <b>blossoms</b> are white.</div><div class="xj">りんごの花は白いです。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">cherry</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">桜（の木）</div><div class="ex">There are many <b>cherry</b> trees along the river.</div><div class="xj">川沿いにたくさんの桜の木があります。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">a</span><span class="ps">冠</span><span class=star>★</span></div><div class="ja">～につき；～ごとに</div><div class="ex">Mr. Sato runs ten kilometers <b>a</b> week.</div><div class="xj">佐藤先生は1週間に10キロメートル走ります。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">～ times a day</span><span class="ps">熟</span></div><div class="ja">1日に～回</div><div class="ex">Brush your teeth <b>three times a day</b>.</div><div class="xj">1日に3回歯をみがきなさい。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">adorable</span><span class="ps">形</span></div><div class="ja">とてもかわいい；愛らしい</div><div class="ex">Your baby sister is <b>adorable</b>.</div><div class="xj">あなたの赤ちゃんの妹はとてもかわいいね。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">all over ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～じゅうで；～のいたるところで</div><div class="ex">This song is popular <b>all over</b> the world.</div><div class="xj">この歌は世界じゅうで人気があります。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">cheek</span><span class="ps">名</span></div><div class="ja">ほお</div><div class="ex">The baby has round red <b>cheeks</b>.</div><div class="xj">その赤ちゃんは丸くて赤いほおをしています。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">eye</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">目</div><div class="ex">My cat has blue <b>eyes</b>.</div><div class="xj">私のネコは青い目をしています。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">fur</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（動物の）毛；毛皮</div><div class="ex">Our rabbit has soft white <b>fur</b>.</div><div class="xj">うちのウサギはやわらかい白い毛をしています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"541": 4.4, "542": 19.28, "543": 33.03, "544": 45.46, "545": 60.31, "546": 73.46, "547": 86.96, "548": 100.14, "549": 116.02, "550": 129.55, "551": 144.72, "552": 157.55, "553": 171.37, "554": 184.78, "555": 198.58, "556": 211.44, "557": 224.47, "558": 238.0, "559": 252.3, "560": 265.81, "561": 279.08, "562": 292.27, "563": 304.82, "564": 318.11, "565": 333.23, "566": 347.07, "567": 361.13, "568": 376.46, "569": 389.35, "570": 401.87}, "TE": {"541": 6.42, "542": 21.15, "543": 34.9, "544": 47.4, "545": 62.18, "546": 75.42, "547": 88.84, "548": 103.09, "549": 117.99, "550": 131.42, "551": 146.61, "552": 159.42, "553": 173.24, "554": 186.66, "555": 200.45, "556": 213.31, "557": 226.34, "558": 239.87, "559": 254.17, "560": 267.68, "561": 280.95, "562": 294.14, "563": 306.69, "564": 319.98, "565": 335.27, "566": 349.04, "567": 363.03, "568": 378.34, "569": 391.22, "570": 403.74}, "Q": [[541, "敬意をもって", "respectfully"], [542, "沈んだ（sink の過去形）", "sank"], [543, "沈む", "sink"], [544, "生存者", "survivor"], [545, "台風", "typhoon"], [546, "理解する", "understand"], [547, "村", "village"], [548, "～へ行く（帰る）途中で（5語で）", "on the way (back) to"], [549, "大使", "ambassador"], [550, "（2つ）の間に", "between"], [551, "地震", "earthquake"], [552, "東の", "eastern"], [553, "飛んだ（fly の過去形）", "flew"], [554, "元の", "former"], [555, "お互い（2語で）", "each other"], [556, "事故", "accident"], [557, "戻る", "return"], [558, "働く人", "worker"], [559, "ペンギン", "penguin"], [560, "どこかに", "somewhere"], [561, "切符", "ticket"], [562, "（果樹の）花", "blossom"], [563, "桜（の木）", "cherry"], [564, "～につき", "a"], [565, "1日に～回（3語で）", "times a day"], [566, "とてもかわいい", "adorable"], [567, "～じゅうで（2語で）", "all over"], [568, "ほお", "cheek"], [569, "目", "eye"],
