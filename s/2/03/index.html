</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第3回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.20〜24　No.61〜90</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">flag</span><span class="ps">名</span></div><div class="ja">旗</div><div class="ex">The Japanese <b>flag</b> is red and white.</div><div class="xj">日本の旗は赤と白です。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">free</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ひまな；自由な；無料の</div><div class="ex">Are you <b>free</b> this afternoon?</div><div class="xj">今日の午後はひまですか。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">hear</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">聞こえる；聞く</div><div class="ex">I <b>heard</b> a nice song on the radio.</div><div class="xj">ラジオですてきな歌を聞きました。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">hit</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">打つ；ぶつける</div><div class="ex">Ken can <b>hit</b> the ball very far.</div><div class="xj">ケンはボールをとても遠くまで打つことができます。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">home run</span><span class="ps">熟</span></div><div class="ja">ホームラン</div><div class="ex">Tom hit a <b>home run</b> in the game.</div><div class="xj">トムは試合でホームランを打ちました。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">if</span><span class="ps">接</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">もし～ならば</div><div class="ex"><b>If</b> you are free, let’s play tennis.</div><div class="xj">もしひまなら、テニスをしよう。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">root</span><span class="ps">動</span><span class="ek">準2+</span></div><div class="ja">（root for ～で）応援する</div><div class="ex">Which team do you <b>root</b> for?</div><div class="xj">あなたはどのチームを応援していますか。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">root for ～</span><span class="ps">熟</span></div><div class="ja">～を応援する</div><div class="ex">We always <b>root for</b> our school team.</div><div class="xj">私たちはいつも学校のチームを応援しています。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">that</span><span class="ps">接</span><span class=star>★</span></div><div class="ja">～ということ</div><div class="ex">I know <b>that</b> Emi likes music.</div><div class="xj">私はエミが音楽好きだということを知っています。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">when</span><span class="ps">接</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～するとき</div><div class="ex"><b>When</b> I got home, my mother was cooking.</div><div class="xj">私が家に帰ったとき、母は料理をしていました。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">around</span><span class="ps">前</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">～のあちこちを；～じゅうを</div><div class="ex">I want to travel <b>around</b> Japan.</div><div class="xj">私は日本のあちこちを旅行したいです。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">cycle</span><span class="ps">動</span></div><div class="ja">自転車に乗る；自転車で行く</div><div class="ex">I <b>cycle</b> to school every day.</div><div class="xj">私は毎日学校へ自転車で行きます。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">go cycling</span><span class="ps">熟</span></div><div class="ja">サイクリングに行く</div><div class="ex">Let’s <b>go cycling</b> this weekend.</div><div class="xj">今週末、サイクリングに行こう。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">difficult</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">難しい</div><div class="ex">This question is <b>difficult</b> for me.</div><div class="xj">この問題は私には難しいです。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">easy</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">簡単な；やさしい</div><div class="ex">The math test was <b>easy</b>.</div><div class="xj">数学のテストは簡単でした。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">eraser</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">消しゴム</div><div class="ex">Can I use your <b>eraser</b>?</div><div class="xj">あなたの消しゴムを使ってもいいですか。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">hard</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">（やるのが）大変な；難しい</div><div class="ex">Speaking English is <b>hard</b> for me.</div><div class="xj">英語を話すのは私には大変です。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">history</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">歴史</div><div class="ex">We have a <b>history</b> test tomorrow.</div><div class="xj">明日、歴史のテストがあります。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">interested</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">興味を持った</div><div class="ex">Emi was <b>interested</b> in the story.</div><div class="xj">エミはその話に興味を持ちました。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">be interested in ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～に興味がある</div><div class="ex">Ken <b>is interested in</b> old cars.</div><div class="xj">ケンは古い車に興味があります。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">program</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">番組；計画</div><div class="ex">I watched a TV <b>program</b> about animals.</div><div class="xj">私は動物についてのテレビ番組を見ました。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">rain</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">雨が降る；雨</div><div class="ex">It <b>rained</b> a lot last night.</div><div class="xj">昨夜はたくさん雨が降りました。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">scarf</span><span class="ps">名</span></div><div class="ja">マフラー；スカーフ</div><div class="ex">My grandmother made this <b>scarf</b> for me.</div><div class="xj">祖母が私にこのマフラーを作ってくれました。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">championship</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">選手権（大会）</div><div class="ex">Our team won the <b>championship</b>.</div><div class="xj">私たちのチームは選手権大会で優勝しました。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">passionate</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">情熱的な；熱心な</div><div class="ex">Mr. Sato is a <b>passionate</b> teacher.</div><div class="xj">佐藤先生は情熱的な先生です。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">person</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">人</div><div class="ex">Yuki is a very kind <b>person</b>.</div><div class="xj">ユキはとても親切な人です。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">take place</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">行われる；開催される</div><div class="ex">The festival <b>takes place</b> in August.</div><div class="xj">そのお祭りは8月に行われます。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">promote</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">広める；促進する</div><div class="ex">This event <b>promotes</b> local food.</div><div class="xj">このイベントは地元の食べ物を広めています。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">successful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">成功した</div><div class="ex">The school festival was very <b>successful</b>.</div><div class="xj">文化祭は大いに成功しました。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">believe</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">信じる</div><div class="ex">I can’t <b>believe</b> it!</div><div class="xj">信じられない！</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"61": 4.02, "62": 17.12, "63": 29.72, "64": 42.89, "65": 56.01, "66": 68.58, "67": 82.12, "68": 95.74, "69": 109.3, "70": 122.42, "71": 135.91, "72": 150.5, "73": 164.68, "74": 178.09, "75": 190.8, "76": 204.0, "77": 216.14, "78": 230.22, "79": 242.89, "80": 255.85, "81": 270.03, "82": 284.14, "83": 297.14, "84": 310.6, "85": 323.99, "86": 338.1, "87": 350.96, "88": 365.45, "89": 379.1, "90": 392.66}, "TE": {"61": 5.89, "62": 18.99, "63": 31.59, "64": 44.76, "65": 57.88, "66": 70.46, "67": 83.99, "68": 97.69, "69": 111.17, "70": 124.3, "71": 137.78, "72": 152.37, "73": 166.72, "74": 179.96, "75": 192.68, "76": 205.87, "77": 218.01, "78": 232.1, "79": 244.86, "80": 258.03, "81": 271.9, "82": 286.01, "83": 299.01, "84": 312.64, "85": 325.86, "86": 339.97, "87": 352.97, "88": 367.32, "89": 381.14, "90": 394.53}, "Q": [[61, "旗", "flag"], [62, "ひまな", "free"], [63, "聞こえる", "hear"], [64, "打つ", "hit"], [65, "ホームラン（2語で）", "home run"], [66, "もし～ならば", "if"], [67, "応援する（2語で）", "root for"], [68, "～を応援する（2語で）", "root for"], [69, "～ということ", "that"], [70, "～するとき", "when"], [71, "～のあちこちを", "around"], [72, "自転車に乗る", "cycle"], [73, "サイクリングに行く（2語で）", "go cycling"], [74, "難しい", "difficult"], [75, "簡単な", "easy"], [76, "消しゴム", "eraser"], [77, "（やるのが）大変な", "hard"], [78, "歴史", "history"], [79, "興味を持った", "interested"], [80, "～に興味がある（3語で）", "be interested in"], [81, "番組", "program"], [82, "雨が降る", "rain"], [83, "マフラー", "scarf"], [84, "選手権（大会）", "championship"], [85, "情熱的な", "passionate"], [86, "人", "person"], [87, "行われる（2語で）", "take place"], [88, "広める", "promote"], [89, "成功した", "successful"], [90, "信じる", "believe"]], "KEY": "s2-3"};</script><scri
