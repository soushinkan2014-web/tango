</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第5回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.27〜32　No.121〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">swimming</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">水泳</div><div class="ex"><b>Swimming</b> is good for your health.</div><div class="xj">水泳は健康によいです。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">coat</span><span class="ps">名</span></div><div class="ja">コート</div><div class="ex">It’s cold, so wear your <b>coat</b>.</div><div class="xj">寒いからコートを着てね。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">degree</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（温度の）度</div><div class="ex">It’s thirty <b>degrees</b> today.</div><div class="xj">今日は30度です。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">forecast</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">予報</div><div class="ex">The weather <b>forecast</b> says it will rain.</div><div class="xj">天気予報によると、雨が降るそうです。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">high</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">最高気温</div><div class="ex">Tomorrow’s <b>high</b> will be twenty-five degrees.</div><div class="xj">明日の最高気温は25度でしょう。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">later</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">あとで</div><div class="ex">I’ll call you <b>later</b>.</div><div class="xj">あとで電話するね。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">low</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">最低気温</div><div class="ex">Tonight’s <b>low</b> will be five degrees.</div><div class="xj">今夜の最低気温は5度でしょう。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">minus</span><span class="ps">形</span></div><div class="ja">マイナスの；氷点下の</div><div class="ex">It was <b>minus</b> two degrees this morning.</div><div class="xj">今朝はマイナス2度でした。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">raincoat</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">レインコート</div><div class="ex">Yuki has a yellow <b>raincoat</b>.</div><div class="xj">ユキは黄色いレインコートを持っています。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">shower</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">にわか雨</div><div class="ex">There will be <b>showers</b> in the afternoon.</div><div class="xj">午後にはにわか雨があるでしょう。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">temperature</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">気温；温度</div><div class="ex">The <b>temperature</b> is high today.</div><div class="xj">今日は気温が高いです。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">we’ll</span><span class="ps">代</span></div><div class="ja">私たちは～するだろう（we will の短縮形）</div><div class="ex"><b>We’ll</b> go to the zoo next Sunday.</div><div class="xj">私たちは今度の日曜日に動物園に行きます。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">windy</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">風の強い</div><div class="ex">It was very <b>windy</b> yesterday.</div><div class="xj">昨日はとても風が強かったです。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">burger</span><span class="ps">名</span></div><div class="ja">ハンバーガー</div><div class="ex">Let’s eat <b>burgers</b> for lunch.</div><div class="xj">お昼にハンバーガーを食べよう。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">check</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">確認する；調べる</div><div class="ex">Please <b>check</b> your answers again.</div><div class="xj">もう一度答えを確認してください。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">first</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">まず；最初に</div><div class="ex"><b>First</b>, wash your hands.</div><div class="xj">まず、手を洗いなさい。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">miss</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">見逃す；乗り遅れる</div><div class="ex">Don’t <b>miss</b> the fireworks tonight.</div><div class="xj">今夜の花火を見逃さないでね。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">point</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">要点；ポイント</div><div class="ex">This is an important <b>point</b>.</div><div class="xj">これは大切なポイントです。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">recommend</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">すすめる</div><div class="ex">I <b>recommend</b> this book to you.</div><div class="xj">私はあなたにこの本をすすめます。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">revolution</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">革命；大変革</div><div class="ex">The computer brought a <b>revolution</b> to our lives.</div><div class="xj">コンピューターは私たちの生活に革命をもたらしました。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">second</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">第二に；次に</div><div class="ex"><b>Second</b>, the shop is near the station.</div><div class="xj">第二に、その店は駅の近くにあります。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">should</span><span class="ps">助</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～したほうがよい；～すべきだ</div><div class="ex">You <b>should</b> see this movie.</div><div class="xj">この映画は見たほうがいいよ。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">third</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">第三に</div><div class="ex"><b>Third</b>, the food there is very good.</div><div class="xj">第三に、そこの食べ物はとてもおいしいです。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">culture</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">文化</div><div class="ex">I want to learn about Japanese <b>culture</b>.</div><div class="xj">私は日本の文化について学びたいです。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">taste</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">味；味見する</div><div class="ex">I like the <b>taste</b> of this soup.</div><div class="xj">私はこのスープの味が好きです。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">bowl</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">ボウル；おわん；どんぶり</div><div class="ex">Put the salad in a big <b>bowl</b>.</div><div class="xj">サラダを大きなボウルに入れて。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">caught</span><span class="ps">動</span></div><div class="ja">捕まえた（catch の過去形）</div><div class="ex">I <b>caught</b> a big fish in the river.</div><div class="xj">私は川で大きな魚を捕まえました。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">festival</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">祭り</div><div class="ex">We went to the summer <b>festival</b> last night.</div><div class="xj">私たちは昨夜、夏祭りに行きました。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">Here is ～.</span><span class="ps">熟</span></div><div class="ja">はい、～をどうぞ；ここに～があります</div><div class="ex"><b>Here is</b> my homework, Mr. Sato.</div><div class="xj">佐藤先生、宿題をどうぞ。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">here’s</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">ここに～がある（here is の短縮形）</div><div class="ex"><b>Here’s</b> a picture of my family.</div><div class="xj">ここに私の家族の写真があります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../04/">← 第4回</a><a href="../06/">第6回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"121": 3.97, "122": 16.47, "123": 29.19, "124": 41.62, "125": 54.64, "126": 68.25, "127": 80.17, "128": 93.39, "129": 107.33, "130": 120.0, "131": 132.76, "132": 145.5, "133": 160.62, "134": 173.19, "135": 185.69, "136": 198.94, "137": 212.08, "138": 225.45, "139": 238.38, "140": 250.81, "141": 265.4, "142": 279.22, "143": 293.44, "144": 306.5, "145": 319.57, "146": 331.88, "147": 344.67, "148": 358.34, "149": 371.35, "150": 387.11}, "TE": {"121": 5.84, "122": 18.34, "123": 31.06, "124": 43.58, "125": 56.52, "126": 70.12, "127": 82.04, "128": 95.26, "129": 109.2, "130": 121.87, "131": 134.64, "132": 147.38, "133": 162.49, "134": 175.06, "135": 187.56, "136": 200.81, "137": 213.96, "138": 227.32, "139": 240.28, "140": 252.78, "141": 267.27, "142": 281.09, "143": 295.32, "144": 308.37, "145": 321.28, "146": 333.75, "147": 346.54, "148": 360.22, "149": 373.24, "150": 388.98}, "Q": [[121, "水泳", "swimming"], [122, "コート", "coat"], [123, "（温度の）度", "degree"], [124, "予報", "forecast"], [125, "最高気温", "high"], [126, "あとで", "later"], [127, "最低気温", "low"], [128, "マイナスの", "minus"], [129, "レインコート", "raincoat"], [130, "にわか雨", "shower"], [131, "気温", "temperature"], [132, "私たちは～するだろう（we will の短縮形）", "we’ll"], [133, "風の強い", "windy"], [134, "ハンバーガー", "burger"], [135, "確認する", "check"], [136, "まず", "first"], [137, "見逃す", "miss"], [138, "要点", "point"], [139, "すすめる", "recommend"], [140, "革命", "revolution"], [141, "第二に", "second"], [142, "～したほうがよい", "should"], [143, "第三に", "third"], [144, "文化", "culture"], [145, "味", "taste"], [146, "ボウル", "bowl"], [147, "捕まえた（catch の過去形）", "caught"], [148, "祭り", "festival"], [149
