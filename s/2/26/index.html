</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第26回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.129〜130　No.751〜780</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../26.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="751"><div class="top"><span class="no">751</span><span class="en">sit</span><span class="ps">動</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">（sit up で）背筋を伸ばして座る；（寝ずに）起きている</div><div class="ex">Please <b>sit</b> up straight in class.</div><div class="xj">授業中は背筋を伸ばして座ってください。</div></button></li><li><button class="w" data-no="752"><div class="top"><span class="no">752</span><span class="en">sit up late at night</span><span class="ps">熟</span></div><div class="ja">夜ふかしをする</div><div class="ex">I <b>sat up late at night</b> to watch a movie.</div><div class="xj">私は映画を見るために夜ふかしをしました。</div></button></li><li><button class="w" data-no="753"><div class="top"><span class="no">753</span><span class="en">tender</span><span class="ps">形</span></div><div class="ja">（肉などが）やわらかい；やさしい</div><div class="ex">This beef is very <b>tender</b>.</div><div class="xj">この牛肉はとてもやわらかいです。</div></button></li><li><button class="w" data-no="754"><div class="top"><span class="no">754</span><span class="en">tough</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">（肉などが）かたい</div><div class="ex">This meat is very <b>tough</b>.</div><div class="xj">この肉はとてもかたいです。</div></button></li><li><button class="w" data-no="755"><div class="top"><span class="no">755</span><span class="en">achievement test</span><span class="ps">熟</span></div><div class="ja">実力テスト</div><div class="ex">We have an <b>achievement test</b> next Monday.</div><div class="xj">今度の月曜日に実力テストがあります。</div></button></li><li><button class="w" data-no="756"><div class="top"><span class="no">756</span><span class="en">annoyed</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">むっとした；いらいらした</div><div class="ex">I was <b>annoyed</b> by the loud noise.</div><div class="xj">私は大きな音にむっとしました。</div></button></li><li><button class="w" data-no="757"><div class="top"><span class="no">757</span><span class="en">anxious</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">心配して；不安な</div><div class="ex">Ken is <b>anxious</b> about the test.</div><div class="xj">ケンはテストのことを心配しています。</div></button></li><li><button class="w" data-no="758"><div class="top"><span class="no">758</span><span class="en">ashamed</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">恥じて；恥ずかしく思って</div><div class="ex">I was <b>ashamed</b> of my mistake.</div><div class="xj">私は自分のまちがいを恥ずかしく思いました。</div></button></li><li><button class="w" data-no="759"><div class="top"><span class="no">759</span><span class="en">astonished</span><span class="ps">形</span></div><div class="ja">（とても）驚いた</div><div class="ex">We were <b>astonished</b> at the news.</div><div class="xj">私たちはその知らせにとても驚きました。</div></button></li><li><button class="w" data-no="760"><div class="top"><span class="no">760</span><span class="en">ballpoint pen</span><span class="ps">熟</span></div><div class="ja">ボールペン</div><div class="ex">Can I use your <b>ballpoint pen</b>?</div><div class="xj">あなたのボールペンを使ってもいいですか。</div></button></li><li><button class="w" data-no="761"><div class="top"><span class="no">761</span><span class="en">beige</span><span class="ps">形</span></div><div class="ja">ベージュ色の</div><div class="ex">My mother bought a <b>beige</b> coat.</div><div class="xj">母はベージュ色のコートを買いました。</div></button></li><li><button class="w" data-no="762"><div class="top"><span class="no">762</span><span class="en">bored</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">退屈した；うんざりした</div><div class="ex">I was <b>bored</b> during the long movie.</div><div class="xj">長い映画の間、私は退屈しました。</div></button></li><li><button class="w" data-no="763"><div class="top"><span class="no">763</span><span class="en">closing ceremony</span><span class="ps">熟</span></div><div class="ja">閉会式；終業式</div><div class="ex">The <b>closing ceremony</b> starts at ten.</div><div class="xj">閉会式は10時に始まります。</div></button></li><li><button class="w" data-no="764"><div class="top"><span class="no">764</span><span class="en">confused</span><span class="ps">形</span></div><div class="ja">混乱した；とまどった</div><div class="ex">I was <b>confused</b> by the difficult question.</div><div class="xj">私はその難しい問題に混乱しました。</div></button></li><li><button class="w" data-no="765"><div class="top"><span class="no">765</span><span class="en">depressed</span><span class="ps">形</span></div><div class="ja">落ちこんだ；ゆううつな</div><div class="ex">Tom was <b>depressed</b> after the game.</div><div class="xj">トムは試合のあと落ちこんでいました。</div></button></li><li><button class="w" data-no="766"><div class="top"><span class="no">766</span><span class="en">disappointed</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">がっかりした</div><div class="ex">Emi was <b>disappointed</b> with the result.</div><div class="xj">エミはその結果にがっかりしました。</div></button></li><li><button class="w" data-no="767"><div class="top"><span class="no">767</span><span class="en">discouraged</span><span class="ps">形</span></div><div class="ja">やる気をなくした；落胆した</div><div class="ex">Don’t be <b>discouraged</b> by one mistake.</div><div class="xj">1回のまちがいでやる気をなくさないで。</div></button></li><li><button class="w" data-no="768"><div class="top"><span class="no">768</span><span class="en">embarrassed</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">恥ずかしい；きまりが悪い</div><div class="ex">I was <b>embarrassed</b> when I fell down.</div><div class="xj">転んだとき、私は恥ずかしかったです。</div></button></li><li><button class="w" data-no="769"><div class="top"><span class="no">769</span><span class="en">entrance ceremony</span><span class="ps">熟</span></div><div class="ja">入学式</div><div class="ex">Our <b>entrance ceremony</b> was in April.</div><div class="xj">私たちの入学式は4月でした。</div></button></li><li><button class="w" data-no="770"><div class="top"><span class="no">770</span><span class="en">examination</span><span class="ps">名</span></div><div class="ja">試験；検査</div><div class="ex">We have an English <b>examination</b> tomorrow.</div><div class="xj">明日は英語の試験があります。</div></button></li><li><button class="w" data-no="771"><div class="top"><span class="no">771</span><span class="en">frightened</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">おびえた；こわがった</div><div class="ex">The little girl was <b>frightened</b> by the big dog.</div><div class="xj">その小さな女の子は大きな犬におびえていました。</div></button></li><li><button class="w" data-no="772"><div class="top"><span class="no">772</span><span class="en">glass</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">コップ；グラス；ガラス</div><div class="ex">Can I have a <b>glass</b> of water?</div><div class="xj">水をコップ1杯もらえますか。</div></button></li><li><button class="w" data-no="773"><div class="top"><span class="no">773</span><span class="en">glove</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">手袋；グローブ</div><div class="ex">I lost one of my <b>gloves</b> on the bus.</div><div class="xj">私はバスで手袋を片方なくしました。</div></button></li><li><button class="w" data-no="774"><div class="top"><span class="no">774</span><span class="en">gold</span><span class="ps">名</span></div><div class="ja">金；金色</div><div class="ex">This ring is made of <b>gold</b>.</div><div class="xj">この指輪は金でできています。</div></button></li><li><button class="w" data-no="775"><div class="top"><span class="no">775</span><span class="en">graduation ceremony</span><span class="ps">熟</span></div><div class="ja">卒業式</div><div class="ex">My sister’s <b>graduation ceremony</b> is in March.</div><div class="xj">姉の卒業式は3月です。</div></button></li><li><button class="w" data-no="776"><div class="top"><span class="no">776</span><span class="en">highlighter</span><span class="ps">名</span></div><div class="ja">蛍光ペン</div><div class="ex">I use a yellow <b>highlighter</b> for new words.</div><div class="xj">私は新しい単語には黄色の蛍光ペンを使います。</div></button></li><li><button class="w" data-no="777"><div class="top"><span class="no">777</span><span class="en">irritated</span><span class="ps">形</span></div><div class="ja">いらいらした</div><div class="ex">My brother was <b>irritated</b> by the hot weather.</div><div class="xj">兄は暑い天気にいらいらしていました。</div></button></li><li><button class="w" data-no="778"><div class="top"><span class="no">778</span><span class="en">mechanical pencil</span><span class="ps">熟</span></div><div class="ja">シャープペンシル</div><div class="ex">I bought a new <b>mechanical pencil</b> yesterday.</div><div class="xj">私は昨日新しいシャープペンシルを買いました。</div></button></li><li><button class="w" data-no="779"><div class="top"><span class="no">779</span><span class="en">midterm exam</span><span class="ps">熟</span></div><div class="ja">中間テスト</div><div class="ex">Our <b>midterm exam</b> starts next week.</div><div class="xj">私たちの中間テストは来週始まります。</div></button></li><li><button class="w" data-no="780"><div class="top"><span class="no">780</span><span class="en">navy blue</span><span class="ps">熟</span></div><div class="ja">紺色（の）</div><div class="ex">Our school uniform is <b>navy blue</b>.</div><div class="xj">私たちの学校の制服は紺色です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav cla
