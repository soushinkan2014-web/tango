<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第10回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第10回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.52〜57　No.271〜300</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">head</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">頭</div><div class="ex">I hit my <b>head</b> on the door.</div><div class="xj">私はドアに頭をぶつけました。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">hood</span><span class="ps">名</span></div><div class="ja">フード；ずきん</div><div class="ex">Put on your <b>hood</b>. It’s raining.</div><div class="xj">フードをかぶって。雨が降っているよ。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">must</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～しなければならない；～にちがいない</div><div class="ex">We <b>must</b> be quiet in the library.</div><div class="xj">図書館では静かにしなければなりません。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">mustn’t</span><span class="ps">助</span></div><div class="ja">～してはいけない（must not の短縮形）</div><div class="ex">You <b>mustn’t</b> eat in this room.</div><div class="xj">この部屋で食べてはいけません。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">turn down ～</span><span class="ps">熟</span></div><div class="ja">（音量など）を下げる；～を断る</div><div class="ex">Please <b>turn down</b> the TV.</div><div class="xj">テレビの音を小さくしてください。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">uh-oh</span><span class="ps">間</span></div><div class="ja">あらら；しまった</div><div class="ex"><b>Uh-oh</b>! I left my umbrella on the train.</div><div class="xj">しまった！電車にかさを置いてきちゃった。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">volume</span><span class="ps">名</span></div><div class="ja">音量；量</div><div class="ex">The <b>volume</b> of the radio is too high.</div><div class="xj">ラジオの音量が大きすぎます。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">before</span><span class="ps">接</span><span class=star>★</span></div><div class="ja">～する前に</div><div class="ex">Wash your hands <b>before</b> you eat lunch.</div><div class="xj">昼ごはんを食べる前に手を洗いなさい。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">by</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～までに</div><div class="ex">Please come back <b>by</b> five.</div><div class="xj">5時までに戻ってきてください。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">deer</span><span class="ps">名</span></div><div class="ja">シカ</div><div class="ex">We saw many <b>deer</b> in Nara.</div><div class="xj">私たちは奈良でたくさんのシカを見ました。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">guitarist</span><span class="ps">名</span></div><div class="ja">ギタリスト；ギター奏者</div><div class="ex">My brother wants to be a <b>guitarist</b>.</div><div class="xj">兄はギタリストになりたいと思っています。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">hallway</span><span class="ps">名</span></div><div class="ja">廊下</div><div class="ex">Don’t run in the <b>hallway</b>.</div><div class="xj">廊下を走ってはいけません。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">hear from ～</span><span class="ps">熟</span></div><div class="ja">～から連絡［便り］がある</div><div class="ex">I <b>heard from</b> my friend in Canada yesterday.</div><div class="xj">昨日、カナダの友だちから連絡がありました。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">potato chip</span><span class="ps">熟</span></div><div class="ja">ポテトチップス</div><div class="ex">Ken is eating <b>potato chips</b> now.</div><div class="xj">ケンは今、ポテトチップスを食べています。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">clear</span><span class="ps">形</span></div><div class="ja">晴れた；澄んだ；はっきりした</div><div class="ex">The sky was <b>clear</b> this morning.</div><div class="xj">今朝は空が晴れていました。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">glad</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">うれしい</div><div class="ex">A: I passed the test!<br>B: I’m so <b>glad</b>.</div><div class="xj">A：テストに合格したよ！B：とてもうれしいわ。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">guide</span><span class="ps">名</span></div><div class="ja">案内人；ガイド</div><div class="ex">The <b>guide</b> took us to a beautiful lake.</div><div class="xj">ガイドが私たちを美しい湖に連れて行ってくれました。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">hike</span><span class="ps">動</span></div><div class="ja">ハイキングをする</div><div class="ex">We <b>hiked</b> in the mountains last Sunday.</div><div class="xj">私たちはこの前の日曜日に山でハイキングをしました。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">go hiking</span><span class="ps">熟</span></div><div class="ja">ハイキングに行く</div><div class="ex">Let’s <b>go hiking</b> this weekend.</div><div class="xj">今週末、ハイキングに行きましょう。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">true</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">本当の；本当で</div><div class="ex">Is that story <b>true</b>?</div><div class="xj">その話は本当ですか。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">any</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">どんな～でも</div><div class="ex">You can choose <b>any</b> color.</div><div class="xj">どんな色を選んでもいいですよ。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">breathtaking</span><span class="ps">形</span></div><div class="ja">息をのむような</div><div class="ex">The view from the mountain was <b>breathtaking</b>.</div><div class="xj">山からのながめは息をのむほどすばらしかったです。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">first of all</span><span class="ps">熟</span></div><div class="ja">まず第一に；最初に</div><div class="ex"><b>First of all</b>, let’s wash our hands.</div><div class="xj">まず最初に、手を洗いましょう。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">forest</span><span class="ps">名</span></div><div class="ja">森</div><div class="ex">Many animals live in this <b>forest</b>.</div><div class="xj">この森には多くの動物がすんでいます。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">hiking</span><span class="ps">名</span></div><div class="ja">ハイキング</div><div class="ex">My father loves <b>hiking</b>.</div><div class="xj">父はハイキングが大好きです。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">protect</span><span class="ps">動</span></div><div class="ja">守る；保護する</div><div class="ex">This hat <b>protects</b> your head from the sun.</div><div class="xj">このぼうしは日差しから頭を守ります。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">rule</span><span class="ps">名</span></div><div class="ja">規則；ルール</div><div class="ex">Do you know the <b>rules</b> of this game?</div><div class="xj">あなたはこのゲームのルールを知っていますか。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">trouble</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">困ったこと；トラブル</div><div class="ex">We had some <b>trouble</b> on the trip.</div><div class="xj">旅行中、少し困ったことがありました。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">what</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">なんという～（だろう）</div><div class="ex">A: This is my new bike.<br>B: <b>What</b> a cool bike!</div><div class="xj">A：これがぼくの新しい自転車だよ。B：なんてかっこいい自転車なんだろう！</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">beaver</span><span class="ps">名</span></div><div class="ja">ビーバー</div><div class="ex">A <b>beaver</b> has big, strong teeth.</div><div class="xj">ビーバーは大きくてじょうぶな歯を持っています。</div></button></li></ol><nav class="pn"><a href="../09/">← 第9回</a><a href="../11/">第11回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"271": 4.0, "272": 16.3, "273": 30.12, "274": 45.46, "275": 60.09, "276": 74.61, "277": 89.29, "278": 102.56, "279": 116.07, "280": 128.81, "281": 141.26, "282": 155.34, "283": 167.36, "284": 181.88, "285": 195.53, "286": 208.37, "287": 223.24, "288": 236.82, "289": 249.99, "290": 262.88, "291": 275.74, "292": 288.43, "293": 301.86, "294": 316.64, "295": 329.48, "296": 341.76, "297": 355.25, "298": 367.96, "299": 381.28, "300": 396.9};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
