</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第18回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.92〜93　No.511〜540</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">one after another</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">次々に</div><div class="ex">The students came into the room <b>one after another</b>.</div><div class="xj">生徒たちが次々に部屋に入ってきました。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">beyond</span><span class="ps">前</span><span class="ek">準2</span></div><div class="ja">～の向こうに；～を越えて</div><div class="ex">There is a small town <b>beyond</b> the river.</div><div class="xj">川の向こうに小さな町があります。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">border</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">国境；境界</div><div class="ex">We crossed the <b>border</b> by bus.</div><div class="xj">私たちはバスで国境を越えました。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">friendship</span><span class="ps">名</span></div><div class="ja">友情</div><div class="ex">Our <b>friendship</b> is very important to me.</div><div class="xj">私たちの友情は私にとってとても大切です。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">no-fly zone</span><span class="ps">名</span></div><div class="ja">飛行禁止区域</div><div class="ex">Drones must not fly in a <b>no-fly zone</b>.</div><div class="xj">ドローンは飛行禁止区域を飛んではいけません。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">president</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">大統領；社長</div><div class="ex">The <b>president</b> of the country visited Japan.</div><div class="xj">その国の大統領が日本を訪れました。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">rescue</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">救助；救出</div><div class="ex">My uncle’s dog is a <b>rescue</b> dog.</div><div class="xj">おじの犬は救助犬です。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">sent</span><span class="ps">動</span></div><div class="ja">送った（send の過去形・過去分詞）</div><div class="ex">I <b>sent</b> a birthday card to Lisa.</div><div class="xj">私はリサに誕生日カードを送りました。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">shoot</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（写真・映画を）撮る</div><div class="ex">We <b>shot</b> a short film for the school festival.</div><div class="xj">私たちは文化祭のために短い映画を撮りました。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">shoot down ～</span><span class="ps">熟</span></div><div class="ja">～を撃ち落とす</div><div class="ex">Ken <b>shot down</b> all the balloons in the game.</div><div class="xj">ケンはゲームで風船を全部撃ち落としました。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">run short</span><span class="ps">熟</span></div><div class="ja">足りなくなる；不足する</div><div class="ex">Our water <b>ran short</b> during the hike.</div><div class="xj">ハイキングの途中で水が足りなくなりました。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">suddenly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">突然；急に</div><div class="ex"><b>Suddenly</b>, it started to rain.</div><div class="xj">突然、雨が降り始めました。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">war</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">戦争</div><div class="ex">We must not forget the history of <b>war</b>.</div><div class="xj">私たちは戦争の歴史を忘れてはいけません。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">at war</span><span class="ps">熟</span></div><div class="ja">戦争中で</div><div class="ex">The two countries were <b>at war</b> for many years.</div><div class="xj">その2つの国は何年も戦争中でした。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">bury</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">埋める；埋葬する</div><div class="ex">The dog <b>buried</b> a bone in the garden.</div><div class="xj">その犬は庭に骨を埋めました。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">chicken</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">とり肉；ニワトリ</div><div class="ex">We had <b>chicken</b> curry for dinner.</div><div class="xj">私たちは夕食にとり肉のカレーを食べました。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">coast</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">海岸；沿岸</div><div class="ex">We drove along the <b>coast</b>.</div><div class="xj">私たちは海岸沿いをドライブしました。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">dead</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">死んだ；枯れた</div><div class="ex">We found a <b>dead</b> bee near the window.</div><div class="xj">私たちは窓の近くで死んだハチを見つけました。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">the dead</span><span class="ps">熟</span></div><div class="ja">死者；亡くなった人々</div><div class="ex">In August, many people pray for <b>the dead</b>.</div><div class="xj">8月には多くの人が亡くなった人々のために祈ります。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">die</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">死ぬ；枯れる</div><div class="ex">My goldfish <b>died</b> last summer.</div><div class="xj">私の金魚は去年の夏に死にました。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">enough</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（～するのに）十分に</div><div class="ex">The water was warm <b>enough</b> to swim in.</div><div class="xj">水は泳ぐのに十分温かかったです。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">fishing</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">釣り；漁業</div><div class="ex">We went <b>fishing</b> at the lake.</div><div class="xj">私たちは湖へ釣りに行きました。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">goodwill</span><span class="ps">名</span></div><div class="ja">善意；好意</div><div class="ex">Thank you very much for your <b>goodwill</b>.</div><div class="xj">あなたの善意に心から感謝します。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">however</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">しかしながら；けれども</div><div class="ex">It was cold; <b>however</b>, we enjoyed the game.</div><div class="xj">寒かったです。しかしながら、私たちは試合を楽しみました。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">meet</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">出迎える；（初めて）知り合う</div><div class="ex">I will <b>meet</b> my aunt at the airport.</div><div class="xj">私は空港でおばを出迎えます。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">met</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">会った（meet の過去形・過去分詞）</div><div class="ex">I <b>met</b> Mr. Sato at the station yesterday.</div><div class="xj">私は昨日、駅で佐藤先生に会いました。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">mission</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">任務；使命</div><div class="ex">The team’s <b>mission</b> was to find the lost dog.</div><div class="xj">そのチームの任務は迷子の犬を見つけることでした。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">more than ～</span><span class="ps">熟</span></div><div class="ja">～以上；～より多い</div><div class="ex"><b>More than</b> thirty people came to the party.</div><div class="xj">30人以上の人がパーティーに来ました。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">nearby</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">近くの</div><div class="ex">We had lunch at a <b>nearby</b> restaurant.</div><div class="xj">私たちは近くのレストランで昼食を食べました。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">on</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">（乗り物）に乗って；～の上に</div><div class="ex">There were many people <b>on</b> the bus.</div><div class="xj">バスにはたくさんの人が乗っていました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../17/">← 第17回</a><a href="../19/">第19回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"511": 4.36, "512": 18.49, "513": 33.53, "514": 46.75, "515": 59.73, "516": 74.49, "517": 88.43, "518": 102.1, "519": 116.74, "520": 130.78, "521": 145.0, "522": 159.3, "523": 172.79, "524": 185.77, "525": 199.37, "526": 212.95, "527": 226.08, "528": 238.94, "529": 251.99, "530": 266.55, "531": 279.51, "532": 293.42, "533": 306.12, "534": 319.12, "535": 333.85, "536": 347.86, "537": 362.88, "538": 376.54, "539": 391.1, "540": 403.98}, "TE": {"511": 6.64, "512": 20.36, "513": 35.4, "514": 48.62, "515": 61.96, "516": 76.36, "517": 90.3, "518": 103.98, "519": 118.61, "520": 132.79, "521": 147.02, "522": 161.25, "523": 174.66, "524": 187.64, "525": 201.24, "526": 214.82, "527": 227.95, "528": 240.81, "529": 253.86, "530": 268.42, "531": 281.38, "532": 295.3, "533": 307.99, "534": 320.99, "535": 335.72, "536": 349.74, "537": 364.76, "538": 378.41, "539": 392.97, "540": 405.86}, "Q": [[511, "次々に（3語で）", "one after another"], [512, "～の向こうに", "beyond"], [513, "国境", "border"], [514, "友情", "friendship"], [515, "飛行禁止区域（2語で）", "no-fly zone"], [516, "大統領", "president"], [517, "救助", "rescue"], [518, "送った（send の過去形・過去分詞）", "sent"], [519, "（写真・映画を）撮る", "shoot"], [520, "～を撃ち落とす（2語で）", "shoot down"], [521, "足りなくなる（2語で）", "run short"], [522, "突然", "suddenly"], [523, "戦争", "war"], [524, "戦争中で（2語で）", "at war"], [525, "埋める", "bury"], [526, "とり肉", "chicken"], [527, "海岸", "coast"], [528, "死んだ", "dead"], [529, "死者（2語で）", "the dead"], [530, "死ぬ", "die"], [531, "（～するのに）十分に", "enough"], [532, "釣り", "fishing"], [533, "善意", "goodwill"], [534, "しかしながら", "however"], [535, "出迎える", "meet"], [536, "会っ
