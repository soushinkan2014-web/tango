</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第22回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.109〜113　No.631〜660</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../22.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="631"><div class="top"><span class="no">631</span><span class="en">written</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（write の過去分詞）書かれる</div><div class="ex">This book is <b>written</b> in easy English.</div><div class="xj">この本はやさしい英語で書かれています。</div></button></li><li><button class="w" data-no="632"><div class="top"><span class="no">632</span><span class="en">absolutely</span><span class="ps">副</span></div><div class="ja">もちろん；まったく；絶対に</div><div class="ex">A: Can you help me?<br>B: <b>Absolutely</b>!</div><div class="xj">A：手伝ってくれる？<br>B：もちろん！</div></button></li><li><button class="w" data-no="633"><div class="top"><span class="no">633</span><span class="en">break</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">壊す；割る</div><div class="ex">Ken <b>broke</b> his bike yesterday.</div><div class="xj">ケンは昨日、自転車を壊しました。</div></button></li><li><button class="w" data-no="634"><div class="top"><span class="no">634</span><span class="en">broken</span><span class="ps">形</span></div><div class="ja">壊れた（break の過去分詞）</div><div class="ex">Don’t use this <b>broken</b> chair.</div><div class="xj">この壊れたいすを使わないで。</div></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">clay</span><span class="ps">名</span></div><div class="ja">粘土</div><div class="ex">The children made animals with <b>clay</b>.</div><div class="xj">子どもたちは粘土で動物を作りました。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">look</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">見ること；ひと目</div><div class="ex">Can I have a <b>look</b> at your notebook?</div><div class="xj">あなたのノートを見てもいいですか。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">take a look</span><span class="ps">熟</span></div><div class="ja">見る；ひと目見る</div><div class="ex"><b>Take a look</b> at this picture.</div><div class="xj">この写真を見てごらん。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">neither</span><span class="ps">副</span></div><div class="ja">（否定の文に続けて）～もまた…ない</div><div class="ex">A: I don’t like math.<br>B: Me <b>neither</b>.</div><div class="xj">A：私は数学が好きではありません。B：私も好きではありません。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">paper crane</span><span class="ps">名</span></div><div class="ja">折り鶴</div><div class="ex">Yuki made a <b>paper crane</b> for her friend.</div><div class="xj">ユキは友だちのために折り鶴を折りました。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">recycled</span><span class="ps">形</span></div><div class="ja">再生された；リサイクルされた</div><div class="ex">We use <b>recycled</b> paper at our school.</div><div class="xj">私たちの学校では再生紙を使っています。</div></button></li><li><button class="w" data-no="641"><div class="top"><span class="no">641</span><span class="en">Same here.</span><span class="ps">熟</span></div><div class="ja">私も同じです</div><div class="ex">A: I’m hungry.<br>B: <b>Same here.</b></div><div class="xj">A：おなかがすいたよ。B：ぼくも同じだよ。</div></button></li><li><button class="w" data-no="642"><div class="top"><span class="no">642</span><span class="en">soap</span><span class="ps">名</span></div><div class="ja">石けん</div><div class="ex">Wash your hands with <b>soap</b>.</div><div class="xj">石けんで手を洗いなさい。</div></button></li><li><button class="w" data-no="643"><div class="top"><span class="no">643</span><span class="en">atomic</span><span class="ps">形</span></div><div class="ja">原子の；原子力の</div><div class="ex">Some countries use <b>atomic</b> energy.</div><div class="xj">いくつかの国は原子力を使っています。</div></button></li><li><button class="w" data-no="644"><div class="top"><span class="no">644</span><span class="en">away</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">離れて；去って</div><div class="ex">My grandmother lives far <b>away</b>.</div><div class="xj">祖母は遠く離れたところに住んでいます。</div></button></li><li><button class="w" data-no="645"><div class="top"><span class="no">645</span><span class="en">bomb</span><span class="ps">名</span></div><div class="ja">爆弾</div><div class="ex">We learned about the atomic <b>bomb</b> in Hiroshima.</div><div class="xj">私たちは広島に落とされた原子爆弾について学びました。</div></button></li><li><button class="w" data-no="646"><div class="top"><span class="no">646</span><span class="en">monument</span><span class="ps">名</span></div><div class="ja">記念碑</div><div class="ex">There is a peace <b>monument</b> in the park.</div><div class="xj">公園に平和の記念碑があります。</div></button></li><li><button class="w" data-no="647"><div class="top"><span class="no">647</span><span class="en">pass</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（時が）過ぎる；手渡す；合格する</div><div class="ex">Time <b>passes</b> quickly when I’m with friends.</div><div class="xj">友だちといると時間が早く過ぎます。</div></button></li><li><button class="w" data-no="648"><div class="top"><span class="no">648</span><span class="en">pass away</span><span class="ps">熟</span></div><div class="ja">亡くなる</div><div class="ex">My grandfather <b>passed away</b> two years ago.</div><div class="xj">祖父は2年前に亡くなりました。</div></button></li><li><button class="w" data-no="649"><div class="top"><span class="no">649</span><span class="en">victim</span><span class="ps">名</span></div><div class="ja">犠牲者；被害者</div><div class="ex">We prayed for the <b>victims</b> of the earthquake.</div><div class="xj">私たちは地震の犠牲者のために祈りました。</div></button></li><li><button class="w" data-no="650"><div class="top"><span class="no">650</span><span class="en">well</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">元気な；健康な</div><div class="ex">I was sick yesterday, but I’m <b>well</b> now.</div><div class="xj">昨日は具合が悪かったけれど、今は元気です。</div></button></li><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">get well</span><span class="ps">熟</span></div><div class="ja">（病気が）よくなる；元気になる</div><div class="ex">I hope you <b>get well</b> soon.</div><div class="xj">早くよくなるといいですね。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">cost</span><span class="ps">名</span></div><div class="ja">費用；値段</div><div class="ex">The <b>cost</b> of the trip was about 30,000 yen.</div><div class="xj">その旅行の費用は約3万円でした。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">fold</span><span class="ps">動</span></div><div class="ja">折る；たたむ</div><div class="ex"><b>Fold</b> the paper in half.</div><div class="xj">その紙を半分に折りなさい。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">million</span><span class="ps">数</span></div><div class="ja">100万（の）</div><div class="ex">One <b>million</b> yen is a lot of money.</div><div class="xj">100万円は大金です。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">make the most of ～</span><span class="ps">熟</span></div><div class="ja">～を最大限に活用する</div><div class="ex">Let’s <b>make the most of</b> our summer vacation.</div><div class="xj">夏休みを最大限に活用しましょう。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">receive</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">受け取る</div><div class="ex">I <b>received</b> a letter from my aunt.</div><div class="xj">私はおばから手紙を受け取りました。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">recycle</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">リサイクルする；再利用する</div><div class="ex">We <b>recycle</b> cans and bottles at school.</div><div class="xj">私たちは学校で缶やびんをリサイクルしています。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">relay</span><span class="ps">名</span></div><div class="ja">リレー；中継</div><div class="ex">Our class won the <b>relay</b> on sports day.</div><div class="xj">私たちのクラスは運動会のリレーで勝ちました。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">renew</span><span class="ps">動</span></div><div class="ja">更新する；新しくする</div><div class="ex">I will <b>renew</b> my passport next month.</div><div class="xj">私は来月パスポートを更新します。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">wish</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">願う；望む</div><div class="ex">We <b>wish</b> for peace in the world.</div><div class="xj">私たちは世界の平和を願っています。</div></button></li></ol><nav class="pn"><a href="../21/">← 第21回</a><a href="../23/">第23回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"631": 4.48, "632": 18.46, "633": 33.67, "634": 46.15, "635": 59.32, "636": 72.2, "637": 85.16, "638": 98.02, "639": 114.5, "640": 128.18, "641": 142.64, "642": 157.44, "643": 169.85, "644": 183.72, "645": 197.06, "646": 210.49, "647": 223.28, "648": 237.46, "649": 251.02, "650": 264.84, "651": 278.92, "652": 292.62, "653": 306.66, "654": 319.2, "655": 332.16, "656": 347.28, "657": 359.99, "658": 374.8, "659": 388.71, "660": 402.8};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
