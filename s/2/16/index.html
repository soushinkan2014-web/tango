</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第16回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.80〜83　No.451〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">slip</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">すべる</div><div class="ex">I <b>slipped</b> on the wet floor.</div><div class="xj">私はぬれた床ですべりました。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">sole</span><span class="ps">名</span></div><div class="ja">靴底；足の裏</div><div class="ex">The <b>sole</b> of this shoe is soft.</div><div class="xj">この靴の底はやわらかいです。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">survive</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">生き残る；生きのびる</div><div class="ex">Plants cannot <b>survive</b> without water.</div><div class="xj">植物は水がなければ生きのびることができません。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">without</span><span class="ps">前</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">～なしで</div><div class="ex">Don’t go out <b>without</b> a coat.</div><div class="xj">コートなしで出かけてはいけません。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">able</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（be able to ～で）～できる</div><div class="ex">I was <b>able</b> to finish my homework.</div><div class="xj">私は宿題を終えることができました。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">be able to ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～することができる</div><div class="ex">My little sister <b>is able to</b> ride a bike.</div><div class="xj">妹は自転車に乗ることができます。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">agriculture</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">農業</div><div class="ex"><b>Agriculture</b> is important in this town.</div><div class="xj">この町では農業が大切です。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">bee</span><span class="ps">名</span></div><div class="ja">ミツバチ；ハチ</div><div class="ex">Many <b>bees</b> are flying around the flowers.</div><div class="xj">たくさんのミツバチが花のまわりを飛んでいます。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">coin</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">硬貨；コイン</div><div class="ex">I found a <b>coin</b> under the desk.</div><div class="xj">私は机の下で硬貨を見つけました。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">creature</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">生き物</div><div class="ex">Many <b>creatures</b> live in the sea.</div><div class="xj">海には多くの生き物がすんでいます。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">great</span><span class="ps">形</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">偉大な；大きな</div><div class="ex">My grandfather was a <b>great</b> doctor.</div><div class="xj">祖父は偉大な医者でした。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">living</span><span class="ps">形</span></div><div class="ja">生きている</div><div class="ex">Plants are <b>living</b> things.</div><div class="xj">植物は生きているものです。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">narrow</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">狭い；細い</div><div class="ex">This street is very <b>narrow</b>.</div><div class="xj">この通りはとても狭いです。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">paper clip</span><span class="ps">熟</span></div><div class="ja">クリップ</div><div class="ex">Can I borrow a <b>paper clip</b>?</div><div class="xj">クリップを借りてもいいですか。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">plant</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">植物；（動）植える</div><div class="ex">There are many <b>plants</b> in this room.</div><div class="xj">この部屋にはたくさんの植物があります。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">pollen</span><span class="ps">名</span></div><div class="ja">花粉</div><div class="ex">Bees carry <b>pollen</b> to other flowers.</div><div class="xj">ハチはほかの花へ花粉を運びます。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">potential</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">可能性；潜在能力</div><div class="ex">Every student has great <b>potential</b>.</div><div class="xj">どの生徒にも大きな可能性があります。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">quarter</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">4分の1；15分</div><div class="ex">I ate a <b>quarter</b> of the cake.</div><div class="xj">私はケーキの4分の1を食べました。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">search</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">探す；調べる</div><div class="ex">I <b>searched</b> for my key everywhere.</div><div class="xj">私はあちこちでかぎを探しました。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">space</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">宇宙；空間；場所</div><div class="ex">I want to go to <b>space</b> someday.</div><div class="xj">私はいつか宇宙へ行きたいです。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">air circulator</span><span class="ps">熟</span></div><div class="ja">サーキュレーター（空気を循環させる機械）</div><div class="ex">We use an <b>air circulator</b> in summer.</div><div class="xj">私たちは夏にサーキュレーターを使います。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">air conditioner</span><span class="ps">熟</span></div><div class="ja">エアコン</div><div class="ex">Please turn off the <b>air conditioner</b>.</div><div class="xj">エアコンを消してください。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">continue</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">続ける；続く</div><div class="ex">Let’s <b>continue</b> our practice after lunch.</div><div class="xj">昼食のあとで練習を続けましょう。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">curtain</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">カーテン</div><div class="ex">Please close the <b>curtains</b>.</div><div class="xj">カーテンを閉めてください。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">eco-friendly</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">環境にやさしい</div><div class="ex">Let’s use <b>eco-friendly</b> bags.</div><div class="xj">環境にやさしい袋を使いましょう。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">effort</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">努力</div><div class="ex">Emi made a big <b>effort</b> to win the contest.</div><div class="xj">エミはコンテストで優勝するために大いに努力しました。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">electricity</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">電気</div><div class="ex">We use a lot of <b>electricity</b> in summer.</div><div class="xj">私たちは夏にたくさんの電気を使います。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">energy</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">エネルギー</div><div class="ex">Let’s save <b>energy</b> at school.</div><div class="xj">学校でエネルギーを節約しましょう。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">fridge</span><span class="ps">名</span></div><div class="ja">冷蔵庫</div><div class="ex">There is some milk in the <b>fridge</b>.</div><div class="xj">冷蔵庫に牛乳が入っています。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">less</span><span class="ps">形</span></div><div class="ja">より少ない；より少なく</div><div class="ex">Let’s use <b>less</b> water at home.</div><div class="xj">家では水を少なめに使いましょう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○
