</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第8回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.46〜47　No.211〜240</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">back</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">後ろ；裏；背中</div><div class="ex">There is a garden at the <b>back</b> of the house.</div><div class="xj">その家の裏には庭があります。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">bottom</span><span class="ps">名</span></div><div class="ja">底；いちばん下</div><div class="ex">There is a coin at the <b>bottom</b> of the box.</div><div class="xj">箱の底にコインがあります。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">carefully</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">注意深く；慎重に</div><div class="ex">Read the question <b>carefully</b>.</div><div class="xj">問題を注意深く読みなさい。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">completely</span><span class="ps">副</span></div><div class="ja">完全に；すっかり</div><div class="ex">I <b>completely</b> forgot about the test.</div><div class="xj">私はテストのことをすっかり忘れていました。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">different</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">違う；異なる</div><div class="ex">Ken and I have <b>different</b> ideas.</div><div class="xj">ケンと私は違う考えを持っています。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">gift</span><span class="ps">名</span></div><div class="ja">贈り物</div><div class="ex">This book was a <b>gift</b> from my aunt.</div><div class="xj">この本はおばからの贈り物でした。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">India</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">インド</div><div class="ex"><b>India</b> is a big country in Asia.</div><div class="xj">インドはアジアの大きな国です。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">inside</span><span class="ps">前</span></div><div class="ja">～の中に；内側に</div><div class="ex">What is <b>inside</b> the box?</div><div class="xj">その箱の中には何がありますか。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">king</span><span class="ps">名</span></div><div class="ja">王；王様</div><div class="ex">The <b>king</b> lived in a big castle.</div><div class="xj">王様は大きな城に住んでいました。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">a long time ago</span><span class="ps">熟</span></div><div class="ja">昔；ずっと前に</div><div class="ex"><b>A long time ago</b>, there was a small village.</div><div class="xj">昔、小さな村がありました。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">message</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">伝言；メッセージ</div><div class="ex">Can I leave a <b>message</b>?</div><div class="xj">伝言をお願いできますか。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">puzzle</span><span class="ps">名</span></div><div class="ja">パズル；なぞ</div><div class="ex">My brother likes doing <b>puzzles</b>.</div><div class="xj">兄はパズルをするのが好きです。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">said</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">言った（say の過去形）</div><div class="ex">Emi <b>said</b> that she was tired.</div><div class="xj">エミは疲れていると言いました。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">top</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">いちばん上の；最高の</div><div class="ex">Put the book on the <b>top</b> shelf.</div><div class="xj">その本をいちばん上のたなに置いて。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">ask</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">たずねる；質問する</div><div class="ex">I <b>asked</b> Mr. Sato about the homework.</div><div class="xj">私は佐藤先生に宿題についてたずねました。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">could</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～できた（can の過去形）</div><div class="ex">I <b>could</b> see many stars last night.</div><div class="xj">昨夜は星がたくさん見えました。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">couldn’t</span><span class="ps">助</span></div><div class="ja">～できなかった（could not の短縮形）</div><div class="ex">I <b>couldn’t</b> answer the last question.</div><div class="xj">私は最後の問題に答えられませんでした。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">deeply</span><span class="ps">副</span></div><div class="ja">深く</div><div class="ex">Lisa thought <b>deeply</b> about her future.</div><div class="xj">リサは自分の将来について深く考えました。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">ear</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">耳</div><div class="ex">Rabbits have long <b>ears</b>.</div><div class="xj">ウサギは耳が長いです。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">himself</span><span class="ps">代</span></div><div class="ja">彼自身</div><div class="ex">Tom looked at <b>himself</b> in the mirror.</div><div class="xj">トムは鏡で自分自身を見ました。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">knew</span><span class="ps">動</span></div><div class="ja">知っていた（know の過去形）</div><div class="ex">I <b>knew</b> the answer.</div><div class="xj">私はその答えを知っていました。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">left</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">出発した；去った（leave の過去形）</div><div class="ex">The bus <b>left</b> at eight.</div><div class="xj">バスは8時に出発しました。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">mouth</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">口</div><div class="ex">Open your <b>mouth</b>, please.</div><div class="xj">口を開けてください。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">out</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">（外に）出て；現れて</div><div class="ex">The sun came <b>out</b> after the rain.</div><div class="xj">雨のあと、太陽が出てきました。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">out of ～</span><span class="ps">熟</span></div><div class="ja">～の中から外へ</div><div class="ex">A cat jumped <b>out of</b> the box.</div><div class="xj">ネコが箱から飛び出しました。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">outside</span><span class="ps">前</span></div><div class="ja">～の外に；～の外で</div><div class="ex">There is a bike <b>outside</b> the house.</div><div class="xj">家の外に自転車があります。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">push</span><span class="ps">動</span></div><div class="ja">押す</div><div class="ex"><b>Push</b> this button, please.</div><div class="xj">このボタンを押してください。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">right</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">すぐに；ちょうど</div><div class="ex">I’ll be back <b>right</b> away.</div><div class="xj">すぐに戻ります。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">therefore</span><span class="ps">副</span></div><div class="ja">それゆえに；そのため</div><div class="ex">Ken was tired and <b>therefore</b> went to bed early.</div><div class="xj">ケンは疲れていて、そのため早く寝ました。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">thought</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">思った；考えた（think の過去形）</div><div class="ex">I <b>thought</b> the movie was interesting.</div><div class="xj">私はその映画はおもしろいと思いました。</div></button></li></ol><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"211": 4.09, "212": 17.22, "213": 30.92, "214": 44.35, "215": 58.1, "216": 71.2, "217": 83.99, "218": 97.14, "219": 110.88, "220": 123.86, "221": 139.44, "222": 152.03, "223": 164.96, "224": 177.99, "225": 191.62, "226": 205.51, "227": 219.55, "228": 234.28, "229": 247.31, "230": 259.76, "231": 272.57, "232": 285.34, "233": 299.42, "234": 311.99, "235": 325.74, "236": 339.22, "237": 353.91, "238": 366.46, "239": 378.74, "240": 393.02};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
