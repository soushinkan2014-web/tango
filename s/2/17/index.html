</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第17回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.83〜92　No.481〜510</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">turn off ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を消す；（スイッチを）切る</div><div class="ex">Please <b>turn off</b> the lights.</div><div class="xj">電気を消してください。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">better</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">よりよい；よりじょうずに（good / well の比較級）</div><div class="ex">This plan is <b>better</b> than that one.</div><div class="xj">この案はあの案よりよいです。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">guinea pig</span><span class="ps">名</span></div><div class="ja">モルモット</div><div class="ex">My cousin has two <b>guinea pigs</b>.</div><div class="xj">私のいとこはモルモットを2匹飼っています。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">made</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">作った（make の過去形・過去分詞）</div><div class="ex">Emi <b>made</b> lunch for her family.</div><div class="xj">エミは家族のために昼食を作りました。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">relaxing</span><span class="ps">形</span></div><div class="ja">くつろがせる；リラックスできる</div><div class="ex">Taking a bath is very <b>relaxing</b>.</div><div class="xj">お風呂に入ることはとてもくつろげます。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">cloth</span><span class="ps">名</span></div><div class="ja">布</div><div class="ex">Mom made a bag from this <b>cloth</b>.</div><div class="xj">母はこの布でかばんを作りました。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">mayonnaise</span><span class="ps">名</span></div><div class="ja">マヨネーズ</div><div class="ex">Do you put <b>mayonnaise</b> on your salad?</div><div class="xj">あなたはサラダにマヨネーズをかけますか。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">a piece of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">1枚の～；1切れの～</div><div class="ex">Can I have <b>a piece of</b> paper?</div><div class="xj">紙を1枚もらえますか。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">plastic bag</span><span class="ps">名</span></div><div class="ja">ビニール袋；レジ袋</div><div class="ex">I don’t need a <b>plastic bag</b>.</div><div class="xj">レジ袋はいりません。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">sauce</span><span class="ps">名</span></div><div class="ja">ソース</div><div class="ex">This <b>sauce</b> is a little sweet.</div><div class="xj">このソースは少し甘いです。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">soy sauce</span><span class="ps">名</span></div><div class="ja">しょうゆ</div><div class="ex">Please pass me the <b>soy sauce</b>.</div><div class="xj">しょうゆを取ってください。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">square</span><span class="ps">形</span></div><div class="ja">四角い；正方形の</div><div class="ex">My lunch box is <b>square</b>.</div><div class="xj">私の弁当箱は四角いです。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">sugar</span><span class="ps">名</span></div><div class="ja">砂糖</div><div class="ex">I don’t put <b>sugar</b> in my coffee.</div><div class="xj">私はコーヒーに砂糖を入れません。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">wrap</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">包む</div><div class="ex">Let’s <b>wrap</b> the present in this paper.</div><div class="xj">プレゼントをこの紙で包みましょう。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">building</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">建物；ビル</div><div class="ex">That tall <b>building</b> is a hotel.</div><div class="xj">あの高い建物はホテルです。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">car</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">車；自動車</div><div class="ex">My father washes his <b>car</b> on Sundays.</div><div class="xj">父は日曜日に車を洗います。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">cave</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">洞くつ；ほら穴</div><div class="ex">We found a small <b>cave</b> near the sea.</div><div class="xj">私たちは海の近くで小さな洞くつを見つけました。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">comfortable</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">心地よい；快適な</div><div class="ex">This sofa is more <b>comfortable</b> than that one.</div><div class="xj">このソファはあのソファより心地よいです。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">display</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">展示；陳列</div><div class="ex">The museum has a <b>display</b> of old toys.</div><div class="xj">その博物館には古いおもちゃの展示があります。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">escape</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">逃げる；脱出する</div><div class="ex">Our dog <b>escaped</b> from the garden yesterday.</div><div class="xj">昨日、うちの犬が庭から逃げました。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">even</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">～でさえ；（比較級を強めて）さらに</div><div class="ex"><b>Even</b> my little brother can swim.</div><div class="xj">私の弟でさえ泳げます。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">film</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">映画；フィルム</div><div class="ex">We watched an old <b>film</b> in class.</div><div class="xj">私たちは授業で古い映画を見ました。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">handicraft</span><span class="ps">名</span></div><div class="ja">手工芸品</div><div class="ex">My aunt makes beautiful <b>handicrafts</b>.</div><div class="xj">おばは美しい手工芸品を作ります。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">magical</span><span class="ps">形</span></div><div class="ja">魔法のような；不思議な</div><div class="ex">The night view from the hill was <b>magical</b>.</div><div class="xj">丘からの夜景は魔法のようでした。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">material</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">材料；素材</div><div class="ex">Wood is a good <b>material</b> for desks.</div><div class="xj">木は机のよい材料です。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">prefecture</span><span class="ps">名</span></div><div class="ja">県</div><div class="ex">Nara <b>Prefecture</b> has many old temples.</div><div class="xj">奈良県には古いお寺がたくさんあります。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">souvenir</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（旅の）おみやげ；記念品</div><div class="ex">I bought a <b>souvenir</b> for my sister in Kyoto.</div><div class="xj">私は京都で妹におみやげを買いました。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">stone</span><span class="ps">名</span></div><div class="ja">石</div><div class="ex">There is a big <b>stone</b> in the river.</div><div class="xj">川の中に大きな石があります。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">above</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～の上に；～の上方に</div><div class="ex">The moon is <b>above</b> the mountain.</div><div class="xj">月が山の上に出ています。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">airport</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">空港</div><div class="ex">We arrived at the <b>airport</b> at nine.</div><div class="xj">私たちは9時に空港に着きました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../16/"
