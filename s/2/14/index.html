</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第14回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.71〜77　No.391〜420</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">make use of ～</span><span class="ps">熟</span><span class="ek">英2</span></div><div class="ja">～を利用する；～を活用する</div><div class="ex">Let’s <b>make use of</b> old clothes.</div><div class="xj">古い服を活用しましょう。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">take ～ for a walk</span><span class="ps">熟</span></div><div class="ja">～を散歩に連れて行く</div><div class="ex">I <b>take my dog for a walk</b> every morning.</div><div class="xj">私は毎朝、犬を散歩に連れて行きます。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">after a while</span><span class="ps">熟</span></div><div class="ja">しばらくして</div><div class="ex"><b>After a while</b>, the rain stopped.</div><div class="xj">しばらくして、雨がやみました。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">balance</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">バランス；つり合い</div><div class="ex">Ken lost his <b>balance</b> and fell.</div><div class="xj">ケンはバランスをくずして転びました。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">camera</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">カメラ</div><div class="ex">My father bought a new <b>camera</b>.</div><div class="xj">父は新しいカメラを買いました。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">clean</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">きれいな；清潔な</div><div class="ex">The water in this river is very <b>clean</b>.</div><div class="xj">この川の水はとてもきれいです。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">color</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">色</div><div class="ex">What <b>color</b> is your new bike?</div><div class="xj">あなたの新しい自転車は何色ですか。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">fashionable</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">流行の；おしゃれな</div><div class="ex">Your jacket looks very <b>fashionable</b>.</div><div class="xj">あなたのジャケットはとてもおしゃれに見えます。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">flash</span><span class="ps">名</span></div><div class="ja">（カメラの）フラッシュ；光</div><div class="ex">Don’t use a <b>flash</b> in the museum.</div><div class="xj">美術館ではフラッシュを使わないで。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">heat</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">暑さ；熱</div><div class="ex">I don’t like the summer <b>heat</b>.</div><div class="xj">私は夏の暑さが好きではありません。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">honey</span><span class="ps">名</span></div><div class="ja">はちみつ</div><div class="ex">I put <b>honey</b> on my toast every morning.</div><div class="xj">私は毎朝トーストにはちみつをつけます。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">into</span><span class="ps">前</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（変化・分割して）～に</div><div class="ex">Please cut the pizza <b>into</b> eight pieces.</div><div class="xj">ピザを8つに切ってください。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">last</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">続く；長持ちする</div><div class="ex">The rain <b>lasted</b> for three days.</div><div class="xj">雨は3日間続きました。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">piece</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">1つ；1切れ；1枚</div><div class="ex">Can I have a <b>piece</b> of cake?</div><div class="xj">ケーキを1切れもらえますか。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">slowly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">ゆっくりと</div><div class="ex">Can you speak <b>slowly</b>, please?</div><div class="xj">ゆっくり話してもらえますか。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">tidy</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">きちんとした；片づいた</div><div class="ex">My sister’s room is always <b>tidy</b>.</div><div class="xj">姉の部屋はいつも片づいています。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">Give it a try.</span><span class="ps">熟</span></div><div class="ja">やってみて；試してみて</div><div class="ex">A: This game looks difficult.<br>B: <b>Give it a try.</b></div><div class="xj">A：このゲームは難しそうだね。B：やってみなよ。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">became</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">～になった（become の過去形）</div><div class="ex">Soon the sky <b>became</b> dark.</div><div class="xj">まもなく空が暗くなりました。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">postcard</span><span class="ps">名</span></div><div class="ja">はがき；絵はがき</div><div class="ex">I sent a <b>postcard</b> to my grandmother.</div><div class="xj">私は祖母に絵はがきを送りました。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">send</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">送る</div><div class="ex">Please <b>send</b> me an e-mail.</div><div class="xj">私にメールを送ってください。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">high-tech</span><span class="ps">形</span></div><div class="ja">ハイテクの；最先端技術の</div><div class="ex">This <b>high-tech</b> robot can clean the house.</div><div class="xj">このハイテクのロボットは家をそうじできます。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">cafe</span><span class="ps">名</span></div><div class="ja">カフェ；喫茶店</div><div class="ex">Let’s have lunch at that <b>cafe</b>.</div><div class="xj">あのカフェで昼ごはんを食べましょう。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">more</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">もっと多くの；（比較）もっと～</div><div class="ex">Can I have some <b>more</b> juice?</div><div class="xj">ジュースをもう少しもらえますか。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">most</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">ほとんどの；（比較）最も～</div><div class="ex"><b>Most</b> students in my class walk to school.</div><div class="xj">私のクラスのほとんどの生徒は歩いて通学します。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">parfait</span><span class="ps">名</span></div><div class="ja">パフェ</div><div class="ex">I ate a strawberry <b>parfait</b> at the cafe.</div><div class="xj">私はカフェでいちごパフェを食べました。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">stylish</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">おしゃれな；かっこいい</div><div class="ex">Lisa has a <b>stylish</b> bag.</div><div class="xj">リサはおしゃれなかばんを持っています。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">than</span><span class="ps">接</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">～よりも</div><div class="ex">There are more <b>than</b> thirty students in my class.</div><div class="xj">私のクラスには30人より多くの生徒がいます。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">centimeter</span><span class="ps">名</span></div><div class="ja">センチメートル</div><div class="ex">My brother is one hundred fifty <b>centimeters</b> tall.</div><div class="xj">弟の身長は150センチメートルです。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">London</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">ロンドン</div><div class="ex">My aunt lives in <b>London</b>.</div><div class="xj">おばはロンドンに住んでいます。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">of</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～のうちの；～の中で</div><div class="ex">Two <b>of</b> my friends live in Kyoto.</div><div class="xj">私の友だちのうち2人は京都に住んでいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"391": 4.33, "392": 19.86, "393": 34.88, "394": 48.65, "395": 62.04, "396": 74.61, "397": 88.26, "398": 100.64, "399": 114.27, "400": 128.04, "401": 140.59, "402": 153.64, "403": 168.25, "404": 182.0, "405": 194.88, "406": 207.58, "407": 221.52, "408": 237.85, "409": 252.01, "410": 265.52, "411": 277.75, "412": 292.56, "413": 305.56, "414": 319.69, "415": 334.69, "416": 348.12, "417": 362.02, "418": 375.55, "419": 389.54, "420": 401.56}, "TE": {"391": 6.44, "392": 22.06, "393": 37.01, "394": 50.52, "395": 63.91, "396": 76.48, "397": 90.13, "398": 102.58, "399": 116.19, "400": 129.91, "401": 142.46, "402": 155.51, "403": 170.12, "404": 183.87, "405": 196.78, "406": 209.45, "407": 223.51, "408": 239.72, "409": 253.88, "410": 267.39, "411": 279.6, "412": 294.43, "413": 307.43, "414": 321.56, "415": 336.56, "416": 350.21, "417": 363.89, "418": 377.56, "419": 391.24, "420": 403.43}, "Q": [[391, "～を利用する（3語で）", "make use of"], [392, "～を散歩に連れて行く（4語で）", "take for a walk"], [393, "しばらくして（3語で）", "after a while"], [394, "バランス", "balance"], [395, "カメラ", "camera"], [396, "きれいな", "clean"], [397, "色", "color"], [398, "流行の", "fashionable"], [399, "（カメラの）フラッシュ", "flash"], [400, "暑さ", "heat"], [401, "はちみつ", "honey"], [402, "（変化・分割して）～に", "into"], [403, "続く", "last"], [404, "1つ", "piece"], [405, "ゆっくりと", "slowly"], [406, "きちんとした", "tidy"], [407, "やってみて（4語で）", "Give it a try."], [408, "～になった（become の過去形）", "became"], [409, "はがき", "postcard"], [410, "送る", "send"], [411, "ハイテクの", "high-tech"], [412, "カフェ", "cafe"], [413, "もっと多くの", "more"], [414, "ほとんどの", "most"], [415, "パフェ", "parfait"], [416, "おしゃれな", "stylish"], [417, "～よりも", "than"], [418, "センチメ
