</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第9回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.47〜52　No.241〜270</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">while</span><span class="ps">接</span></div><div class="ja">～する間に</div><div class="ex">I listened to music <b>while</b> I was running.</div><div class="xj">私は走っている間に音楽を聞きました。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">for a while</span><span class="ps">熟</span></div><div class="ja">しばらく（の間）</div><div class="ex">Let’s rest here <b>for a while</b>.</div><div class="xj">ここでしばらく休みましょう。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">wire</span><span class="ps">名</span></div><div class="ja">電線；針金</div><div class="ex">A bird is sitting on the <b>wire</b>.</div><div class="xj">1羽の鳥が電線にとまっています。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">answer</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">答え；返事</div><div class="ex">Do you know the <b>answer</b> to this question?</div><div class="xj">あなたはこの問題の答えを知っていますか。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">gossip</span><span class="ps">名</span></div><div class="ja">うわさ話</div><div class="ex">I don’t like <b>gossip</b> about my friends.</div><div class="xj">私は友だちについてのうわさ話が好きではありません。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">lesson</span><span class="ps">名</span></div><div class="ja">レッスン；授業；教訓</div><div class="ex">I have a piano <b>lesson</b> every Friday.</div><div class="xj">私は毎週金曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">mind</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">心；考え</div><div class="ex">Music is good for your body and <b>mind</b>.</div><div class="xj">音楽は体と心によいです。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">news</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">知らせ；ニュース</div><div class="ex">I have good <b>news</b> for you.</div><div class="xj">あなたによい知らせがあります。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">poor</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">かわいそうな；貧しい</div><div class="ex">The <b>poor</b> cat was very hungry.</div><div class="xj">そのかわいそうなネコはとてもおなかがすいていました。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">secret</span><span class="ps">名</span></div><div class="ja">秘密</div><div class="ex">Can you keep a <b>secret</b>?</div><div class="xj">あなたは秘密を守れますか。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">turn</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">順番；番</div><div class="ex">Now it’s your <b>turn</b>, Yuki.</div><div class="xj">さあ、ユキ、あなたの番ですよ。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">which</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">どれ；どちら</div><div class="ex"><b>Which</b> of these books did you read?</div><div class="xj">これらの本のどれを読みましたか。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">bring</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">持ってくる；連れてくる</div><div class="ex">Please <b>bring</b> your lunch tomorrow.</div><div class="xj">明日はお弁当を持ってきてください。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">bye</span><span class="ps">間</span></div><div class="ja">さようなら；じゃあね</div><div class="ex"><b>Bye</b>, Dad. I’ll be back at five.</div><div class="xj">じゃあね、お父さん。5時に帰るよ。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">help ～ with ...</span><span class="ps">熟</span></div><div class="ja">～の…を手伝う</div><div class="ex">Can you <b>help me with</b> my homework?</div><div class="xj">私の宿題を手伝ってくれますか。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">Hold on.</span><span class="ps">熟</span></div><div class="ja">（電話を切らずに）待ってください；ちょっと待って</div><div class="ex">A: Can I speak to Ken?<br>B: Sure. <b>Hold on.</b></div><div class="xj">A：ケンと話せますか。B：いいですよ。ちょっと待ってね。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">may</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～してもよい；～かもしれない</div><div class="ex">You <b>may</b> use my dictionary.</div><div class="xj">私の辞書を使ってもいいですよ。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">May I ～?</span><span class="ps">熟</span></div><div class="ja">～してもよいですか</div><div class="ex">A: <b>May I</b> open the window?<br>B: Sure.</div><div class="xj">A：窓を開けてもよいですか。B：いいですよ。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">moment</span><span class="ps">名</span></div><div class="ja">ちょっとの間；瞬間</div><div class="ex">Please wait a <b>moment</b>.</div><div class="xj">少しの間お待ちください。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">Just a moment.</span><span class="ps">熟</span></div><div class="ja">ちょっと待って；少々お待ちください</div><div class="ex">A: Are you ready?<br>B: <b>Just a moment.</b></div><div class="xj">A：準備はできた？B：ちょっと待って。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">number</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">番号；数</div><div class="ex">What’s your phone <b>number</b>?</div><div class="xj">あなたの電話番号は何番ですか。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">water bottle</span><span class="ps">熟</span></div><div class="ja">水筒；（水の入った）ボトル</div><div class="ex">Don’t forget your <b>water bottle</b>.</div><div class="xj">水筒を忘れないでね。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">wrong</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">間違った；具合が悪い</div><div class="ex">I think this answer is <b>wrong</b>.</div><div class="xj">この答えは間違っていると思います。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">footprint</span><span class="ps">名</span></div><div class="ja">足跡</div><div class="ex">We found some <b>footprints</b> in the snow.</div><div class="xj">私たちは雪の中にいくつかの足跡を見つけました。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">actually</span><span class="ps">副</span></div><div class="ja">実は；実際に</div><div class="ex"><b>Actually</b>, I don’t like tomatoes.</div><div class="xj">実は、私はトマトが好きではありません。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">big</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">大の；重大な</div><div class="ex">Ken is a <b>big</b> fan of baseball.</div><div class="xj">ケンは野球の大ファンです。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">cover</span><span class="ps">動</span></div><div class="ja">おおう；かぶせる</div><div class="ex">Snow <b>covered</b> the town last night.</div><div class="xj">昨夜、雪が町をおおいました。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">emotional</span><span class="ps">形</span></div><div class="ja">感情豊かな；感情的な</div><div class="ex">Emi is very <b>emotional</b> and often cries at movies.</div><div class="xj">エミはとても感情豊かで、よく映画で泣きます。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">don’t have to ～</span><span class="ps">熟</span></div><div class="ja">～しなくてもよい；～する必要はない</div><div class="ex">You <b>don’t have to</b> come tomorrow.</div><div class="xj">あなたは明日、来なくてもいいですよ。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">have to ～</span><span class="ps">熟</span></div><div class="ja">～しなければならない</div><div class="ex">I <b>have to</b> clean my room today.</div><div class="xj">私は今日、部屋をそうじしなければなりません。</div></button></li></ol><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"241": 4.09, "242": 17.46, "243": 30.56, "244": 43.7, "245": 56.73, "246": 69.78, "247": 83.41, "248": 96.94, "249": 109.68, "250": 123.34, "251": 135.28, "252": 148.19, "253": 160.4, "254": 173.74, "255": 188.69, "256": 201.74, "257": 219.86, "258": 234.42, "259": 249.72, "260": 262.63, "261": 279.06, "262": 291.18, "263": 305.19, "264": 318.96, "265": 331.87, "266": 345.45, "267": 358.72, "268": 372.11, "269": 387.9, "270": 402.92};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
