<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第4回｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第4回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.24〜27　No.91〜120</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">coach</span><span class="ps">名</span></div><div class="ja">コーチ；監督</div><div class="ex">Mr. Sato is our soccer <b>coach</b>.</div><div class="xj">佐藤先生は私たちのサッカーのコーチです。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">create</span><span class="ps">動</span></div><div class="ja">作り出す；創造する</div><div class="ex">Let’s <b>create</b> a new song for our club.</div><div class="xj">部のために新しい歌を作ろう。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">national</span><span class="ps">形</span></div><div class="ja">国の；国立の；全国の</div><div class="ex">We visited a <b>national</b> park in Hokkaido.</div><div class="xj">私たちは北海道の国立公園を訪れました。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">peace</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">平和</div><div class="ex">We hope for world <b>peace</b>.</div><div class="xj">私たちは世界の平和を願っています。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">professionally</span><span class="ps">副</span></div><div class="ja">プロとして；職業として</div><div class="ex">My uncle plays baseball <b>professionally</b>.</div><div class="xj">おじはプロとして野球をしています。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">same</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">同じもの；同じこと</div><div class="ex">A: I’ll have pizza.<br>B: I’ll have the <b>same</b>.</div><div class="xj">A：ピザにします。B：私も同じものにします。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">teach</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">教える</div><div class="ex">Ms. Brown <b>teaches</b> English at our school.</div><div class="xj">ブラウン先生は私たちの学校で英語を教えています。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">university</span><span class="ps">名</span></div><div class="ja">大学</div><div class="ex">My brother studies at a <b>university</b> in Kyoto.</div><div class="xj">兄は京都の大学で勉強しています。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">as</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～として</div><div class="ex">My aunt works <b>as</b> a nurse.</div><div class="xj">おばは看護師として働いています。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">believe in ～</span><span class="ps">熟</span></div><div class="ja">～を信じる</div><div class="ex">I <b>believe in</b> my teammates.</div><div class="xj">私はチームの仲間を信じています。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">education</span><span class="ps">名</span></div><div class="ja">教育</div><div class="ex"><b>Education</b> is important for children.</div><div class="xj">教育は子どもたちにとって大切です。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">effect</span><span class="ps">名</span></div><div class="ja">影響；効果</div><div class="ex">Music has a big <b>effect</b> on our feelings.</div><div class="xj">音楽は私たちの気持ちに大きな影響を与えます。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">experience</span><span class="ps">動</span></div><div class="ja">経験する；体験する</div><div class="ex">We <b>experienced</b> farm work last summer.</div><div class="xj">私たちは去年の夏、農作業を体験しました。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">fact</span><span class="ps">名</span></div><div class="ja">事実</div><div class="ex">This is an interesting <b>fact</b> about the moon.</div><div class="xj">これは月についてのおもしろい事実です。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">in fact</span><span class="ps">熟</span></div><div class="ja">実は；実際に</div><div class="ex"><b>In fact</b>, I can’t swim.</div><div class="xj">実は、私は泳げません。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">foster</span><span class="ps">動</span></div><div class="ja">はぐくむ；育てる</div><div class="ex">Club activities <b>foster</b> friendship.</div><div class="xj">部活動は友情をはぐくみます。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">goal</span><span class="ps">名</span></div><div class="ja">目標；ゴール</div><div class="ex">What is your <b>goal</b> this year?</div><div class="xj">今年のあなたの目標は何ですか。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">grow</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">成長する；育つ</div><div class="ex">Children <b>grow</b> very fast.</div><div class="xj">子どもはとても早く成長します。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">learn</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">学ぶ；習う</div><div class="ex">We <b>learned</b> a lot from the game.</div><div class="xj">私たちはその試合から多くのことを学びました。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">manner</span><span class="ps">名</span></div><div class="ja">マナー；作法；方法</div><div class="ex">Good <b>manners</b> are important in sports.</div><div class="xj">スポーツではよいマナーが大切です。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">many</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">多く；多くの人</div><div class="ex"><b>Many</b> of my friends play tennis.</div><div class="xj">私の友だちの多くはテニスをします。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">one of ～</span><span class="ps">熟</span></div><div class="ja">～の1つ；～の1人</div><div class="ex"><b>One of</b> my friends lives in Canada.</div><div class="xj">私の友だちの1人はカナダに住んでいます。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">positive</span><span class="ps">形</span></div><div class="ja">よい；好ましい；前向きな</div><div class="ex">Reading has a <b>positive</b> effect on children.</div><div class="xj">読書は子どもによい影響を与えます。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">power</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">力</div><div class="ex">Words have great <b>power</b>.</div><div class="xj">言葉には大きな力があります。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">sportsmanship</span><span class="ps">名</span></div><div class="ja">スポーツマンシップ</div><div class="ex"><b>Sportsmanship</b> is important in every sport.</div><div class="xj">どのスポーツでもスポーツマンシップは大切です。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">through</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～を通して；～を通り抜けて</div><div class="ex">We make friends <b>through</b> sports.</div><div class="xj">私たちはスポーツを通して友だちを作ります。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">tool</span><span class="ps">名</span></div><div class="ja">道具</div><div class="ex">A computer is a useful <b>tool</b>.</div><div class="xj">コンピューターは便利な道具です。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">contest</span><span class="ps">名</span></div><div class="ja">コンテスト；競技会</div><div class="ex">I’m going to join the speech <b>contest</b>.</div><div class="xj">私はスピーチコンテストに参加するつもりです。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">field day</span><span class="ps">熟</span></div><div class="ja">運動会</div><div class="ex">Our <b>field day</b> is in October.</div><div class="xj">私たちの運動会は10月です。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">remember</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">覚えている；思い出す</div><div class="ex">Do you <b>remember</b> my name?</div><div class="xj">私の名前を覚えていますか。</div></button></li></ol><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"91": 4.04, "92": 17.67, "93": 31.64, "94": 45.41, "95": 57.84, "96": 72.62, "97": 88.16, "98": 101.26, "99": 115.03, "100": 127.82, "101": 140.73, "102": 153.88, "103": 167.67, "104": 182.33, "105": 195.41, "106": 208.89, "107": 222.35, "108": 234.95, "109": 248.29, "110": 261.0, "111": 274.27, "112": 287.54, "113": 302.03, "114": 315.68, "115": 327.92, "116": 342.27, "117": 357.1, "118": 369.81, "119": 383.66, "120": 396.66};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
