</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第20回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.101〜105　No.571〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">hand</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">手</div><div class="ex">Raise your <b>hand</b> if you know the answer.</div><div class="xj">答えがわかったら手を挙げなさい。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">information</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">情報</div><div class="ex">This website has a lot of <b>information</b> about Kyoto.</div><div class="xj">このウェブサイトには京都についての情報がたくさんあります。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">in order to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～するために</div><div class="ex">Tom studies Japanese <b>in order to</b> work in Japan.</div><div class="xj">トムは日本で働くために日本語を勉強しています。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">over</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～を超えて；～以上</div><div class="ex">My grandfather is <b>over</b> eighty.</div><div class="xj">祖父は80歳を超えています。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">palm</span><span class="ps">名</span></div><div class="ja">手のひら</div><div class="ex">Put the coin on your <b>palm</b>.</div><div class="xj">コインを手のひらにのせてください。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">sea otter</span><span class="ps">名</span></div><div class="ja">ラッコ</div><div class="ex"><b>Sea otters</b> sleep on their backs in the water.</div><div class="xj">ラッコは水の上であおむけになって眠ります。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">shellfish</span><span class="ps">名</span></div><div class="ja">貝；（エビ・カニなどの）甲殻類</div><div class="ex">I can’t eat <b>shellfish</b>.</div><div class="xj">私は貝が食べられません。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">warm up ～</span><span class="ps">熟</span></div><div class="ja">～を温める</div><div class="ex">Let’s <b>warm up</b> the soup.</div><div class="xj">スープを温めましょう。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">agree</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">賛成する；同意する</div><div class="ex">Ken <b>agreed</b> with my idea.</div><div class="xj">ケンは私の考えに賛成しました。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">awake</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">目が覚めて；起きて</div><div class="ex">I was <b>awake</b> at five this morning.</div><div class="xj">私は今朝5時に目が覚めていました。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">brain</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">脳</div><div class="ex">Sleep is important for your <b>brain</b>.</div><div class="xj">睡眠はあなたの脳にとって大切です。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">breathe</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">呼吸する；息をする</div><div class="ex"><b>Breathe</b> slowly and relax.</div><div class="xj">ゆっくり呼吸して、リラックスしてください。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">half</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">半分</div><div class="ex">I ate <b>half</b> of the pizza.</div><div class="xj">私はピザの半分を食べました。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">have no idea</span><span class="ps">熟</span></div><div class="ja">まったくわからない</div><div class="ex">A: Where is Ken?<br>B: I <b>have no idea</b>.</div><div class="xj">A：ケンはどこにいますか。B：まったくわかりません。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">mammal</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">ほ乳類</div><div class="ex">A whale is a <b>mammal</b>.</div><div class="xj">クジラはほ乳類です。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">quite</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">かなり；とても</div><div class="ex">This question is <b>quite</b> difficult.</div><div class="xj">この問題はかなり難しいです。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">smart</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">賢い；頭のよい</div><div class="ex">Dolphins are very <b>smart</b> animals.</div><div class="xj">イルカはとても賢い動物です。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">surprising</span><span class="ps">形</span></div><div class="ja">驚くべき；意外な</div><div class="ex">The news was <b>surprising</b> to everyone.</div><div class="xj">そのニュースはみんなにとって驚くべきものでした。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">not always ～</span><span class="ps">熟</span></div><div class="ja">いつも～とは限らない</div><div class="ex">Ken is <b>not always</b> busy on Sundays.</div><div class="xj">ケンは日曜日にいつも忙しいとは限りません。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">enemy</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">敵</div><div class="ex">Snakes are <b>enemies</b> of frogs.</div><div class="xj">ヘビはカエルの敵です。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">flying fish</span><span class="ps">名</span></div><div class="ja">トビウオ</div><div class="ex"><b>Flying fish</b> can jump out of the water.</div><div class="xj">トビウオは水から飛び出すことができます。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">fried</span><span class="ps">形</span></div><div class="ja">揚げた；いためた</div><div class="ex">We had <b>fried</b> fish for lunch.</div><div class="xj">私たちは昼食に揚げた魚を食べました。</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">fry</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（油で）揚げる；いためる</div><div class="ex">Let’s <b>fry</b> some potatoes.</div><div class="xj">ジャガイモを揚げましょう。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">once</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">かつて；以前</div><div class="ex">My grandfather <b>once</b> lived in Hokkaido.</div><div class="xj">祖父はかつて北海道に住んでいました。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">seabird</span><span class="ps">名</span></div><div class="ja">海鳥</div><div class="ex">Many <b>seabirds</b> were flying over the sea.</div><div class="xj">たくさんの海鳥が海の上を飛んでいました。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">stock</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">だし；スープのもと；在庫</div><div class="ex">My mother makes soup <b>stock</b> from fish.</div><div class="xj">母は魚からだしをとります。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">though</span><span class="ps">接</span><span class="ek">準2</span></div><div class="ja">～だけれども</div><div class="ex"><b>Though</b> it was raining, we played soccer.</div><div class="xj">雨が降っていたけれども、私たちはサッカーをしました。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">daytime</span><span class="ps">名</span></div><div class="ja">昼間</div><div class="ex">Owls sleep in the <b>daytime</b>.</div><div class="xj">フクロウは昼間に眠ります。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">grass</span><span class="ps">名</span></div><div class="ja">草；芝生</div><div class="ex">Cows are eating <b>grass</b> on the hill.</div><div class="xj">牛が丘の上で草を食べています。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">hamster</span><span class="ps">名</span></div><div class="ja">ハムスター</div><div class="ex">Lisa keeps a <b>hamster</b> in her room.</div><div class="xj">リサは部屋でハムスターを飼っています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../19/">
