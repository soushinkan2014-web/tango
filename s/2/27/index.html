</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第27回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.130〜131　No.781〜810</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../27.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="781"><div class="top"><span class="no">781</span><span class="en">opening ceremony</span><span class="ps">熟</span></div><div class="ja">開会式；始業式</div><div class="ex">The <b>opening ceremony</b> of sports day was exciting.</div><div class="xj">運動会の開会式はわくわくしました。</div></button></li><li><button class="w" data-no="782"><div class="top"><span class="no">782</span><span class="en">outing</span><span class="ps">名</span></div><div class="ja">遠足；外出</div><div class="ex">We went to the zoo on our class <b>outing</b>.</div><div class="xj">私たちはクラスの遠足で動物園へ行きました。</div></button></li><li><button class="w" data-no="783"><div class="top"><span class="no">783</span><span class="en">pink</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">ピンク色の</div><div class="ex">Yuki likes <b>pink</b> flowers.</div><div class="xj">ユキはピンク色の花が好きです。</div></button></li><li><button class="w" data-no="784"><div class="top"><span class="no">784</span><span class="en">pleased</span><span class="ps">形</span></div><div class="ja">喜んだ；満足した</div><div class="ex">My mother was <b>pleased</b> with my present.</div><div class="xj">母は私のプレゼントを喜んでいました。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">purple</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">紫色の</div><div class="ex">Grapes are <b>purple</b> or green.</div><div class="xj">ぶどうは紫色か緑色です。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">red</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">赤い</div><div class="ex">The leaves turn <b>red</b> in fall.</div><div class="xj">秋には葉が赤くなります。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">relieved</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">ほっとした；安心した</div><div class="ex">I was <b>relieved</b> to hear the news.</div><div class="xj">その知らせを聞いて私はほっとしました。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">satisfied</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">満足した</div><div class="ex">Are you <b>satisfied</b> with your score?</div><div class="xj">あなたは自分の点数に満足していますか。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">scared</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">こわがって；おびえた</div><div class="ex">My little sister is <b>scared</b> of thunder.</div><div class="xj">妹は雷をこわがっています。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">silver</span><span class="ps">形</span></div><div class="ja">銀の；銀色の</div><div class="ex">Tom got a <b>silver</b> medal in the race.</div><div class="xj">トムはそのレースで銀メダルを取りました。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">sneaker</span><span class="ps">名</span></div><div class="ja">スニーカー</div><div class="ex">I bought new <b>sneakers</b> for P.E. class.</div><div class="xj">私は体育の授業のために新しいスニーカーを買いました。</div></button></li><li><button class="w" data-no="792"><div class="top"><span class="no">792</span><span class="en">sports day</span><span class="ps">熟</span></div><div class="ja">運動会；体育祭</div><div class="ex"><b>Sports day</b> is in October this year.</div><div class="xj">今年の運動会は10月です。</div></button></li><li><button class="w" data-no="793"><div class="top"><span class="no">793</span><span class="en">term-end exam</span><span class="ps">熟</span></div><div class="ja">期末テスト</div><div class="ex">I studied hard for the <b>term-end exam</b>.</div><div class="xj">私は期末テストのために一生懸命勉強しました。</div></button></li><li><button class="w" data-no="794"><div class="top"><span class="no">794</span><span class="en">uneasy</span><span class="ps">形</span></div><div class="ja">不安な；落ち着かない</div><div class="ex">I felt <b>uneasy</b> before my speech.</div><div class="xj">スピーチの前、私は不安な気持ちでした。</div></button></li><li><button class="w" data-no="795"><div class="top"><span class="no">795</span><span class="en">unhappy</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">悲しい；不満な；不幸な</div><div class="ex">The boy looked <b>unhappy</b> after the game.</div><div class="xj">その男の子は試合のあと悲しそうでした。</div></button></li><li><button class="w" data-no="796"><div class="top"><span class="no">796</span><span class="en">upset</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">動揺した；腹を立てた</div><div class="ex">Lisa was <b>upset</b> about the broken cup.</div><div class="xj">リサは割れたカップのことで動揺していました。</div></button></li><li><button class="w" data-no="797"><div class="top"><span class="no">797</span><span class="en">acoustic guitar</span><span class="ps">熟</span></div><div class="ja">アコースティックギター</div><div class="ex">My brother plays the <b>acoustic guitar</b>.</div><div class="xj">兄はアコースティックギターをひきます。</div></button></li><li><button class="w" data-no="798"><div class="top"><span class="no">798</span><span class="en">American football</span><span class="ps">熟</span></div><div class="ja">アメリカンフットボール</div><div class="ex"><b>American football</b> is popular in the U.S.</div><div class="xj">アメリカではアメリカンフットボールが人気です。</div></button></li><li><button class="w" data-no="799"><div class="top"><span class="no">799</span><span class="en">boiled</span><span class="ps">形</span></div><div class="ja">ゆでた</div><div class="ex">I had a <b>boiled</b> egg for breakfast.</div><div class="xj">私は朝食にゆで卵を食べました。</div></button></li><li><button class="w" data-no="800"><div class="top"><span class="no">800</span><span class="en">bread</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">パン</div><div class="ex">I eat <b>bread</b> and milk every morning.</div><div class="xj">私は毎朝パンと牛乳をとります。</div></button></li><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">cello</span><span class="ps">名</span></div><div class="ja">チェロ</div><div class="ex">Emi plays the <b>cello</b> in the orchestra.</div><div class="xj">エミはオーケストラでチェロをひきます。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">cheap</span><span class="ps">形</span></div><div class="ja">安い</div><div class="ex">This T-shirt was very <b>cheap</b>.</div><div class="xj">このTシャツはとても安かったです。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">clarinet</span><span class="ps">名</span></div><div class="ja">クラリネット</div><div class="ex">I want to learn the <b>clarinet</b> this year.</div><div class="xj">私は今年クラリネットを習いたいです。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">deep</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">深い</div><div class="ex">This part of the river is very <b>deep</b>.</div><div class="xj">川のこのあたりはとても深いです。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">dirty</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">汚い；汚れた</div><div class="ex">Wash your <b>dirty</b> hands before lunch.</div><div class="xj">昼食の前に汚れた手を洗いなさい。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">donut</span><span class="ps">名</span></div><div class="ja">ドーナツ</div><div class="ex">Ken ate two <b>donuts</b> after school.</div><div class="xj">ケンは放課後にドーナツを2つ食べました。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">early</span><span class="ps">形</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">早い；初期の</div><div class="ex">I took the <b>early</b> train this morning.</div><div class="xj">今朝、私は早い電車に乗りました。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">electric guitar</span><span class="ps">熟</span></div><div class="ja">エレキギター</div><div class="ex">Tom wants a new <b>electric guitar</b>.</div><div class="xj">トムは新しいエレキギターをほしがっています。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">empty</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">空の；からっぽの</div><div class="ex">The classroom was <b>empty</b> after school.</div><div class="xj">放課後、教室はからっぽでした。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">full</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">いっぱいの；満員の</div><div class="ex">This bottle is <b>full</b> of water.</div><div class="xj">このびんは水でいっぱいです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"
