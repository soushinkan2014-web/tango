<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中2 英単語 第1回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中2　第1回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.7〜12　No.1〜30</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">start</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">始まり；スタート</div><div class="ex">April is the <b>start</b> of the school year.</div><div class="xj">4月は学校の1年の始まりです。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">he’ll</span><span class="ps">代</span></div><div class="ja">彼は～するだろう（he will の短縮形）</div><div class="ex"><b>He’ll</b> come back soon.</div><div class="xj">彼はすぐに戻ってくるでしょう。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">late</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">遅れた；遅い</div><div class="ex">Don’t be <b>late</b> for school.</div><div class="xj">学校に遅れないでね。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">quiz</span><span class="ps">名</span></div><div class="ja">小テスト；クイズ</div><div class="ex">We had a math <b>quiz</b> today.</div><div class="xj">今日、数学の小テストがありました。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">soon</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">すぐに；まもなく</div><div class="ex">Summer vacation is coming <b>soon</b>.</div><div class="xj">もうすぐ夏休みがやってきます。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">this</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">今の；今度の</div><div class="ex">We have a lot of homework <b>this</b> week.</div><div class="xj">今週は宿題がたくさんあります。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">will</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～だろう；～するつもりだ</div><div class="ex">Tom <b>will</b> be busy tomorrow.</div><div class="xj">トムは明日忙しいでしょう。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">it’ll</span><span class="ps">代</span></div><div class="ja">それは～だろう（it will の短縮形）</div><div class="ex"><b>It’ll</b> be hot tomorrow.</div><div class="xj">明日は暑くなるでしょう。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">plan</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">計画；予定</div><div class="ex">What are your <b>plans</b> for summer vacation?</div><div class="xj">あなたの夏休みの計画は何ですか。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">again</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">また；再び</div><div class="ex">Let’s play tennis <b>again</b> tomorrow.</div><div class="xj">明日またテニスをしよう。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">farewell</span><span class="ps">名</span></div><div class="ja">別れ；送別</div><div class="ex">We had a <b>farewell</b> party for Mr. Brown.</div><div class="xj">私たちはブラウン先生の送別会を開きました。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">You’re kidding.</span><span class="ps">熟</span></div><div class="ja">冗談でしょう</div><div class="ex">A: I got 100 on the math test.<br>B: <b>You’re kidding.</b></div><div class="xj">A：数学のテストで100点を取ったよ。B：冗談でしょう。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">leave</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">出発する；去る；離れる</div><div class="ex">I <b>leave</b> home at seven every morning.</div><div class="xj">私は毎朝7時に家を出ます。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">move</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">引っ越す；動かす</div><div class="ex">My family <b>moved</b> to Osaka last year.</div><div class="xj">私の家族は去年大阪に引っ越しました。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">nothing</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">何も～ない</div><div class="ex">There is <b>nothing</b> in the box.</div><div class="xj">箱の中には何もありません。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">party</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">パーティー</div><div class="ex">Let’s have a <b>party</b> on Saturday.</div><div class="xj">土曜日にパーティーを開こう。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">special</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">特別な</div><div class="ex">Today is a <b>special</b> day for me.</div><div class="xj">今日は私にとって特別な日です。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">up</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">起きて（いる）；目が覚めて</div><div class="ex">I was <b>up</b> late last night.</div><div class="xj">昨夜は遅くまで起きていました。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">by the way</span><span class="ps">熟</span></div><div class="ja">ところで</div><div class="ex"><b>By the way</b>, where is Ken?</div><div class="xj">ところで、ケンはどこにいますか。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">What’s up?</span><span class="ps">熟</span></div><div class="ja">どうしたの；元気？</div><div class="ex">A: <b>What’s up?</b><br>B: I can’t find my pen.</div><div class="xj">A：どうしたの？<br>B：ペンが見つからないんだ。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">bit</span><span class="ps">名</span></div><div class="ja">少し；小片</div><div class="ex">I ate a <b>bit</b> of bread for breakfast.</div><div class="xj">朝食にパンを少し食べました。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">a bit</span><span class="ps">熟</span></div><div class="ja">少し；ちょっと</div><div class="ex">I’m <b>a bit</b> tired today.</div><div class="xj">今日は少し疲れています。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">care</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">世話；注意</div><div class="ex">Plants need water and <b>care</b>.</div><div class="xj">植物には水と世話が必要です。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">take care</span><span class="ps">熟</span></div><div class="ja">気をつけて；元気でね</div><div class="ex">A: Goodbye, Lisa.<br>B: <b>Take care</b>, Ken.</div><div class="xj">A：さようなら、リサ。B：元気でね、ケン。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">either</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">（否定文で）～もまた（…ない）</div><div class="ex">I don’t like natto, <b>either</b>.</div><div class="xj">私も納豆が好きではありません。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">forget</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">忘れる</div><div class="ex">Don’t <b>forget</b> your umbrella.</div><div class="xj">かさを忘れないでね。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">hope</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">望む；願う</div><div class="ex">A: Can we win the game?<br>B: I <b>hope</b> so.</div><div class="xj">A：私たちは試合に勝てるかな。B：そう願うよ。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">in</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">（今から）～後に</div><div class="ex">The next bus leaves <b>in</b> ten minutes.</div><div class="xj">次のバスは10分後に出ます。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">keep</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">持っておく；保つ</div><div class="ex">Can I <b>keep</b> this photo?</div><div class="xj">この写真を持っていてもいいですか。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">local</span><span class="ps">形</span></div><div class="ja">地元の；その土地の</div><div class="ex">We often go to the <b>local</b> library.</div><div class="xj">私たちはよく地元の図書館に行きます。</div></button></li></ol><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"1": 4.02, "2": 17.48, "3": 32.04, "4": 44.57, "5": 57.84, "6": 71.15, "7": 84.16, "8": 98.38, "9": 112.44, "10": 125.64, "11": 138.81, "12": 152.66, "13": 168.01, "14": 181.52, "15": 195.46, "16": 208.29, "17": 220.84, "18": 233.58, "19": 246.9, "20": 259.47, "21": 274.77, "22": 287.92, "23": 300.61, "24": 313.42, "25": 329.5, "26": 343.32, "27": 355.46, "28": 370.26, "29": 383.86, "30": 395.88};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
