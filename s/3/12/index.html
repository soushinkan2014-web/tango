</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第12回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.78〜84　No.331〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">opinion</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">意見</div><div class="ex">In my <b>opinion</b>, this book is better than that one.</div><div class="xj">私の意見では、この本のほうがあの本よりよいです。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">bottle</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">びん；ボトル</div><div class="ex">Put the empty <b>bottles</b> in this box.</div><div class="xj">空のびんはこの箱に入れてください。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">waste</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">むだにする；浪費する</div><div class="ex">Don’t <b>waste</b> water when you brush your teeth.</div><div class="xj">歯をみがくときに水をむだにしてはいけません。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">balloon</span><span class="ps">名</span></div><div class="ja">風船</div><div class="ex">The child was holding a red <b>balloon</b>.</div><div class="xj">その子どもは赤い風船を持っていました。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">ice</span><span class="ps">名</span></div><div class="ja">氷</div><div class="ex">Do you want some <b>ice</b> in your juice?</div><div class="xj">ジュースに氷を入れますか。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">river</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">川</div><div class="ex">The Shinano River is the longest <b>river</b> in Japan.</div><div class="xj">信濃川は日本でいちばん長い川です。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">skating</span><span class="ps">名</span></div><div class="ja">スケート</div><div class="ex">We enjoyed <b>skating</b> on the lake last winter.</div><div class="xj">私たちは去年の冬、湖でスケートを楽しみました。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">stew</span><span class="ps">名</span></div><div class="ja">シチュー</div><div class="ex">My mother made beef <b>stew</b> for dinner.</div><div class="xj">母は夕食にビーフシチューを作りました。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">stick</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">棒；枝；スティック</div><div class="ex">The boy is drawing a picture in the sand with a <b>stick</b>.</div><div class="xj">その男の子は棒で砂に絵をかいています。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">get caught in ～</span><span class="ps">熟</span></div><div class="ja">（雨などに）あう；～に引っかかる</div><div class="ex">We <b>got caught in</b> the rain on the way home.</div><div class="xj">私たちは帰る途中で雨にあいました。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">contain</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">含む</div><div class="ex">This drink <b>contains</b> a lot of sugar.</div><div class="xj">この飲み物はたくさんの砂糖を含んでいます。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">gather</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">集まる；集める</div><div class="ex">Many people <b>gathered</b> at the station to see the famous singer.</div><div class="xj">多くの人がその有名な歌手を見るために駅に集まりました。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">it is said that ～</span><span class="ps">熟</span></div><div class="ja">～と言われている</div><div class="ex"><b>It is said that</b> this tree is five hundred years old.</div><div class="xj">この木は樹齢500年だと言われています。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">jumbo jet</span><span class="ps">熟</span></div><div class="ja">ジャンボジェット機</div><div class="ex">A <b>jumbo jet</b> is a very large airplane.</div><div class="xj">ジャンボジェット機はとても大きな飛行機です。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">kill</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（植物を）枯らす；殺す</div><div class="ex">Too much water can <b>kill</b> your flowers.</div><div class="xj">水のやりすぎは花を枯らすことがあります。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">leave ～ behind</span><span class="ps">熟</span></div><div class="ja">～を置き忘れる；～を置いていく</div><div class="ex">I <b>left my umbrella behind</b> on the bus.</div><div class="xj">私はバスにかさを置き忘れました。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">mostly</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">大部分は；たいていは；主に</div><div class="ex">The students in this club are <b>mostly</b> first-year students.</div><div class="xj">この部の生徒は大部分が1年生です。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">net</span><span class="ps">名</span></div><div class="ja">網；ネット</div><div class="ex">People use big <b>nets</b> to catch fish.</div><div class="xj">人々は魚をとるために大きな網を使います。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">patch</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">（周りとちがう小さな）区域；部分；つぎ当て</div><div class="ex">There is a huge <b>patch</b> of trash in the sea.</div><div class="xj">海にはごみが集まった巨大な区域があります。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">researcher</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">研究者</div><div class="ex">My aunt is a <b>researcher</b> who studies birds.</div><div class="xj">私のおばは鳥を研究している研究者です。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">ton</span><span class="ps">名</span></div><div class="ja">トン（重さの単位）</div><div class="ex">This truck can carry ten <b>tons</b>.</div><div class="xj">このトラックは10トン運べます。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">trash</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ごみ</div><div class="ex">Let’s pick up the <b>trash</b> on the beach.</div><div class="xj">浜辺のごみを拾いましょう。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">age</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">年齢</div><div class="ex">Lisa and I are the same <b>age</b>.</div><div class="xj">リサと私は同じ年齢です。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">at the age of ～</span><span class="ps">熟</span></div><div class="ja">～歳のときに</div><div class="ex">Mr. Sato started playing the piano <b>at the age of</b> five.</div><div class="xj">佐藤さんは5歳のときにピアノをひき始めました。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">cleanup</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">清掃（活動）；そうじ</div><div class="ex">We joined the beach <b>cleanup</b> last Sunday.</div><div class="xj">私たちは先週の日曜日、浜辺の清掃活動に参加しました。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">collect</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">集める</div><div class="ex">Ken has <b>collected</b> stamps for three years.</div><div class="xj">ケンは3年間切手を集めています。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">dive</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">飛びこむ；もぐる</div><div class="ex">The boy <b>dived</b> into the pool.</div><div class="xj">その男の子はプールに飛びこみました。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">hurt</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">傷つける；痛める；痛む</div><div class="ex">I <b>hurt</b> my leg when I was playing soccer.</div><div class="xj">サッカーをしていたとき、私は足を痛めました。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">kilogram</span><span class="ps">名</span></div><div class="ja">キログラム</div><div class="ex">I bought five <b>kilograms</b> of rice.</div><div class="xj">私は米を5キログラム買いました。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">shocked</span><span class="ps">形</span></div><div class="ja">ショックを受けた；ぎょっとした</div><div class="ex">I was <b>shocked</b> to hear the news.</div><div class="xj">私はその知らせを聞いてショックを受けました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"331": 4.31, "332": 17.79, "333": 30.6, "334": 44.18, "335": 56.59, "336": 68.92, "337": 82.52, "338": 95.53, "339": 108.22, "340": 121.78, "341": 136.34, "342": 148.98, "343": 163.16, "344": 177.46, "345": 190.95, "346": 205.08, "347": 220.6, "348": 235.26, "349": 248.44, "350": 263.41, "351": 276.75, "352": 290.09, "353": 302.73, "354": 315.47, "355": 330.52, "356": 344.67, "357": 357.84, "358": 370.78, "359": 384.36, "360": 397.31}, "TE": {"331": 6.18, "332": 19.66, "333": 32.48, "334": 46.06, "335": 58.46, "336": 70.79, "337": 84.4, "338": 97.4, "339": 110.09, "340": 123.67, "341": 138.21, "342": 150.86, "343": 165.18, "344": 179.38, "345": 192.82, "346": 207.07, "347": 222.48, "348": 237.14, "349": 250.31, "350": 265.28, "351": 278.62, "352": 291.96, "353": 304.6, "354": 317.51, "355": 332.39, "356": 346.54, "357": 359.72, "358": 372.65, "359": 386.23, "360": 399.18}, "Q": [[331, "意見", "opinion"], [332, "びん", "bottle"], [333, "むだにする", "waste"], [334, "風船", "balloon"], [335, "氷", "ice"], [336, "川", "river"], [337, "スケート", "skating"], [338, "シチュー", "stew"], [339, "棒", "stick"], [340, "（雨などに）あう（3語で）", "get caught in"], [341, "含む", "contain"], [342, "集まる", "gather"], [343, "～と言われている（4語で）", "it is said that"], [344, "ジャンボジェット機（2語で）", "jumbo jet"], [345, "（植物を）枯らす", "kill"], [346, "～を置き忘れる（2語で）", "leave behind"], [347, "大部分は", "mostly"], [348, "網", "net"], [349, "（周りとちがう小さな）区域", "patch"], [350, "研究者", "researcher"], [351, "トン（重さの単位）", "ton"], [352, "ごみ", "trash"], [353, "年齢", "age"], [354, "～歳のときに（4語で）", "at the age of"], [355, "清掃（
