</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第19回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.119〜123　No.541〜570</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">winner</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">勝者；受賞者</div><div class="ex">The <b>winner</b> of the contest got a big prize.</div><div class="xj">コンテストの勝者は大きな賞をもらいました。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">bill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">紙幣；請求書</div><div class="ex">She paid for the book with a thousand-yen <b>bill</b>.</div><div class="xj">彼女は千円札でその本の代金をはらいました。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">curiosity</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">好奇心</div><div class="ex">Little children are full of <b>curiosity</b>.</div><div class="xj">小さな子どもたちは好奇心でいっぱいです。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">on the other hand</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">一方で；他方では</div><div class="ex">My brother likes summer; <b>on the other hand</b>, I like winter.</div><div class="xj">兄は夏が好きです。一方で、私は冬が好きです。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">humorous</span><span class="ps">形</span><span class="ek">英2</span></div><div class="ja">ユーモアのある；おもしろい</div><div class="ex">Our English teacher is very <b>humorous</b>.</div><div class="xj">私たちの英語の先生はとてもユーモアがあります。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">kronor</span><span class="ps">名</span></div><div class="ja">クローナ（スウェーデンのお金の単位。krona の複数形）</div><div class="ex">People in Sweden use <b>kronor</b> for shopping.</div><div class="xj">スウェーデンの人々は買い物にクローナを使います。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">second</span><span class="ps">名</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">秒；ちょっとの間</div><div class="ex">This train stops here for only thirty <b>seconds</b>.</div><div class="xj">この電車はここでたった30秒しか止まりません。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">trillion</span><span class="ps">数</span></div><div class="ja">1兆</div><div class="ex">One <b>trillion</b> yen is a lot of money.</div><div class="xj">1兆円は大金です。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">value</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">価値</div><div class="ex">This old coin has great <b>value</b>.</div><div class="xj">この古い硬貨には大きな価値があります。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">attack</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">攻撃；（スポーツの）攻め</div><div class="ex">The other team’s <b>attack</b> was very fast.</div><div class="xj">相手チームの攻撃はとても速かったです。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">disappear</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">消える；見えなくなる</div><div class="ex">The sun <b>disappeared</b> behind the clouds.</div><div class="xj">太陽が雲の後ろに消えました。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">miracle</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">奇跡</div><div class="ex">Everyone said that our team’s win was a <b>miracle</b>.</div><div class="xj">私たちのチームの勝利は奇跡だとみんなが言いました。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">shock</span><span class="ps">名</span></div><div class="ja">衝撃；ショック</div><div class="ex">The news was a big <b>shock</b> to us.</div><div class="xj">その知らせは私たちにとって大きな衝撃でした。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">canal</span><span class="ps">名</span></div><div class="ja">用水路；運河</div><div class="ex">The farmers use water from the <b>canal</b> for their fields.</div><div class="xj">農家の人たちは用水路の水を畑に使います。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">draw</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（水などを）引く；引き寄せる</div><div class="ex">The villagers <b>draw</b> water from the river to their rice fields.</div><div class="xj">村人たちは川から田んぼへ水を引いています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">drought</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">干ばつ；日照り</div><div class="ex">Many plants died because of the long <b>drought</b>.</div><div class="xj">長い干ばつのせいで、たくさんの植物が枯れました。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">especially</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">特に</div><div class="ex">I like fruit very much, <b>especially</b> bananas.</div><div class="xj">私は果物が大好きで、特にバナナが好きです。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">fight</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">戦う；けんかする</div><div class="ex">Many doctors <b>fight</b> against dangerous diseases.</div><div class="xj">多くの医者が危険な病気と戦っています。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">fought</span><span class="ps">動</span></div><div class="ja">戦った；けんかした（fight の過去形・過去分詞）</div><div class="ex">Our team <b>fought</b> hard in the final game.</div><div class="xj">私たちのチームは決勝戦で懸命に戦いました。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">historic</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">歴史的な；歴史上重要な</div><div class="ex">Kyoto has many <b>historic</b> buildings.</div><div class="xj">京都には歴史的な建物がたくさんあります。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">hunger</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">飢え；空腹</div><div class="ex">We need to solve the problem of <b>hunger</b> in the world.</div><div class="xj">私たちは世界の飢えの問題を解決する必要があります。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">rapid</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">急速な；速い</div><div class="ex">The town saw <b>rapid</b> changes after the new station opened.</div><div class="xj">新しい駅ができたあと、町には急速な変化がありました。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">say to oneself</span><span class="ps">熟</span></div><div class="ja">心の中で思う；ひとりごとを言う</div><div class="ex">Ken <b>said to himself</b> that he must try again.</div><div class="xj">ケンはもう一度やってみなければと心の中で思いました。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">stream</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">小川；流れ</div><div class="ex">There is a small <b>stream</b> behind my grandmother’s house.</div><div class="xj">祖母の家の裏に小さな小川があります。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">suffer</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">苦しむ；（suffer from で）～に苦しむ</div><div class="ex">Many animals <b>suffer</b> from the heat in summer.</div><div class="xj">多くの動物が夏の暑さに苦しんでいます。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">technical</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">専門的な；技術的な</div><div class="ex">This book uses too many <b>technical</b> words for me.</div><div class="xj">この本は私には専門的な言葉が多すぎます。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">understood</span><span class="ps">動</span></div><div class="ja">理解した；わかった（understand の過去形・過去分詞）</div><div class="ex">I finally <b>understood</b> the meaning of the question.</div><div class="xj">私はやっとその問題の意味がわかりました。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">construction</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">建設；工事</div><div class="ex">The <b>construction</b> of the new bridge started last year.</div><div class="xj">新しい橋の建設は去年始まりました。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">gently</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">やさしく；そっと</div><div class="ex">Please hold the baby bird <b>gently</b>.</div><div class="xj">ひな鳥をやさしく持ってください。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">hundreds of ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">何百もの～</div><div class="ex"><b>Hundreds of</b> people came to the summer festival.</div><div class="xj">何百人もの人が夏祭りに来ました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"541": 4.4, "542": 18.1, "543": 31.97, "544": 44.95, "545": 60.14, "546": 74.15, "547": 91.07, "548": 105.34, "549": 118.18, "550": 130.78, "551": 144.74, "552": 158.37, "553": 171.64, "554": 185.05, "555": 199.16, "556": 214.15, "557": 227.97, "558": 241.7, "559": 255.85, "560": 271.62, "561": 286.18, "562": 299.78, "563": 314.4, "564": 330.04, "565": 343.91, "566": 359.24, "567": 373.92, "568": 390.48, "569": 404.4, "570": 417.5}, "TE": {"541": 6.28, "542": 19.98, "543": 33.92, "544": 46.99, "545": 62.04, "546": 76.02, "547": 92.94, "548": 107.22, "549": 120.05, "550": 132.65, "551": 146.61, "552": 160.24, "553": 173.51, "554": 186.92, "555": 201.03, "556": 216.02, "557": 229.84, "558": 243.57, "559": 257.72, "560": 273.49, "561": 288.05, "562": 301.66, "563": 316.72, "564": 331.91, "565": 345.78, "566": 361.11, "567": 375.8, "568": 392.38, "569": 406.27, "570": 419.39}, "Q": [[541, "勝者", "winner"], [542, "紙幣", "bill"], [543, "好奇心", "curiosity"], [544, "一方で（4語で）", "on the other hand"], [545, "ユーモアのある", "humorous"], [546, "クローナ（スウェーデンのお金の単位。krona の複数形）", "kronor"], [547, "秒", "second"], [548, "1兆", "trillion"], [549, "価値", "value"], [550, "攻撃", "attack"], [551, "消える", "disappear"], [552, "奇跡", "miracle"], [553
