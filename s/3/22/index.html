n></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">game creator</span><span class="ps">熟</span></div><div class="ja">ゲームクリエイター</div><div class="ex">Ken wants to be a <b>game creator</b> in the future.</div><div class="xj">ケンは将来ゲームクリエイターになりたいと思っています。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">gardener</span><span class="ps">名</span></div><div class="ja">庭師</div><div class="ex">The <b>gardener</b> takes care of the trees in this park.</div><div class="xj">その庭師さんはこの公園の木の世話をしています。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">government worker</span><span class="ps">熟</span></div><div class="ja">公務員</div><div class="ex">My mother is a <b>government worker</b> at the city office.</div><div class="xj">母は市役所で働く公務員です。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">guide dog trainer</span><span class="ps">熟</span></div><div class="ja">盲導犬訓練士</div><div class="ex">A <b>guide dog trainer</b> teaches dogs how to help people.</div><div class="xj">盲導犬訓練士は犬に人を助ける方法を教えます。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">hair stylist</span><span class="ps">熟</span></div><div class="ja">ヘアスタイリスト；美容師</div><div class="ex">I asked the <b>hair stylist</b> to cut my hair short.</div><div class="xj">私はヘアスタイリストに髪を短く切ってくれるように頼みました。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">home attendant</span><span class="ps">熟</span></div><div class="ja">ホームヘルパー；訪問介護員</div><div class="ex">A <b>home attendant</b> visits my grandfather every week.</div><div class="xj">ホームヘルパーさんが毎週祖父をたずねてきます。</div></button></li><li><button class="w" data-no="641"><div class="top"><span class="no">641</span><span class="en">illustrator</span><span class="ps">名</span></div><div class="ja">イラストレーター</div><div class="ex">This book has pictures drawn by a famous <b>illustrator</b>.</div><div class="xj">この本には有名なイラストレーターがかいた絵がのっています。</div></button></li><li><button class="w" data-no="642"><div class="top"><span class="no">642</span><span class="en">interpreter</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">通訳者；通訳</div><div class="ex">The <b>interpreter</b> helped the visitors from Brazil.</div><div class="xj">通訳者がブラジルから来た訪問者を手助けしました。</div></button></li><li><button class="w" data-no="643"><div class="top"><span class="no">643</span><span class="en">journalist</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ジャーナリスト；記者</div><div class="ex">The <b>journalist</b> wrote an article about our school.</div><div class="xj">そのジャーナリストは私たちの学校についての記事を書きました。</div></button></li><li><button class="w" data-no="644"><div class="top"><span class="no">644</span><span class="en">kindergarten teacher</span><span class="ps">熟</span></div><div class="ja">幼稚園の先生</div><div class="ex">Emi’s sister works as a <b>kindergarten teacher</b>.</div><div class="xj">エミのお姉さんは幼稚園の先生として働いています。</div></button></li><li><button class="w" data-no="645"><div class="top"><span class="no">645</span><span class="en">lawyer</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">弁護士</div><div class="ex">Her father is a <b>lawyer</b> in Osaka.</div><div class="xj">彼女のお父さんは大阪で弁護士をしています。</div></button></li><li><button class="w" data-no="646"><div class="top"><span class="no">646</span><span class="en">movie director</span><span class="ps">熟</span></div><div class="ja">映画監督</div><div class="ex">The <b>movie director</b> is making a new movie in Kyoto.</div><div class="xj">その映画監督は京都で新しい映画を作っています。</div></button></li><li><button class="w" data-no="647"><div class="top"><span class="no">647</span><span class="en">nail artist</span><span class="ps">熟</span></div><div class="ja">ネイリスト</div><div class="ex">The <b>nail artist</b> painted small flowers on my nails.</div><div class="xj">ネイリストさんが私のつめに小さな花をかいてくれました。</div></button></li><li><button class="w" data-no="648"><div class="top"><span class="no">648</span><span class="en">newscaster</span><span class="ps">名</span></div><div class="ja">ニュースキャスター</div><div class="ex">The <b>newscaster</b> reads the news at seven every evening.</div><div class="xj">そのニュースキャスターは毎晩7時にニュースを読みます。</div></button></li><li><button class="w" data-no="649"><div class="top"><span class="no">649</span><span class="en">newspaper reporter</span><span class="ps">熟</span></div><div class="ja">新聞記者</div><div class="ex">A <b>newspaper reporter</b> asked our coach some questions.</div><div class="xj">新聞記者が私たちのコーチにいくつか質問をしました。</div></button></li><li><button class="w" data-no="650"><div class="top"><span class="no">650</span><span class="en">novelist</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">小説家</div><div class="ex">The <b>novelist</b> has written more than thirty books.</div><div class="xj">その小説家は30冊以上の本を書いてきました。</div></button></li><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">nursery school teacher</span><span class="ps">熟</span></div><div class="ja">保育士；保育園の先生</div><div class="ex"><b>Nursery school teachers</b> take care of small children.</div><div class="xj">保育士は小さな子どもたちの世話をします。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">pet groomer</span><span class="ps">熟</span></div><div class="ja">ペットのトリマー</div><div class="ex">The <b>pet groomer</b> washed my dog and cut its hair.</div><div class="xj">ペットのトリマーさんが私の犬を洗って毛を切ってくれました。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">pharmacist</span><span class="ps">名</span></div><div class="ja">薬剤師</div><div class="ex">Please ask the <b>pharmacist</b> about this medicine.</div><div class="xj">この薬については薬剤師にたずねてください。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">pianist</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ピアニスト</div><div class="ex">The <b>pianist</b> played a beautiful song at the concert.</div><div class="xj">そのピアニストはコンサートで美しい曲を演奏しました。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">police officer</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">警察官</div><div class="ex">A <b>police officer</b> showed us the way to the station.</div><div class="xj">警察官が私たちに駅への道を教えてくれました。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">politician</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">政治家</div><div class="ex">A good <b>politician</b> listens to the voices of people.</div><div class="xj">よい政治家は人々の声に耳をかたむけます。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">potter</span><span class="ps">名</span></div><div class="ja">陶芸家</div><div class="ex">The <b>potter</b> makes cups and plates by hand.</div><div class="xj">その陶芸家は手でカップや皿を作ります。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">scriptwriter</span><span class="ps">名</span></div><div class="ja">脚本家</div><div class="ex">The <b>scriptwriter</b> wrote the story of this TV drama.</div><div class="xj">その脚本家がこのテレビドラマの話を書きました。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">secretary</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">秘書</div><div class="ex">The <b>secretary</b> answered the phone politely.</div><div class="xj">秘書がていねいに電話に出ました。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">songwriter</span><span class="ps">名</span></div><div class="ja">ソングライター；作詞作曲家</div><div class="ex">She is a <b>songwriter</b> who writes songs for children.</div><div class="xj">彼女は子どものための歌を作るソングライターです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../21/">← 第21回</a><a href="../23/">第23回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"631": 4.48, "632": 18.87, "633": 32.79, "634": 46.32, "635": 60.5, "636": 74.2, "637": 87.47, "638": 101.26, "639": 116.48, "640": 131.52, "641": 146.83, "642": 160.84, "643": 174.8, "644": 188.65, "645": 203.12, "646": 215.88, "647": 229.99, "648": 244.02, "649": 258.28, "650": 272.96, "651": 286.16, "652": 302.21, "653": 315.76, "654": 329.08, "655": 342.44, "656": 356.17, "657": 369.77, "658": 382.85, "659": 396.48, "660": 409.62}, "TE": {"631": 6.35, "632": 20.86, "633": 34.66, "634": 48.19, "635": 62.47, "636": 76.07, "637": 89.53, "638": 103.52, "639": 118.56, "640": 133.49, "641": 148.7, "642": 162.71, "643": 176.68, "644": 190.9, "645": 204.99, "646": 217.99, "647": 232.0, "648": 246.02, "649": 260.56, "650": 274.86, "651": 288.58, "652": 304.08, "653": 317.71, "654": 330.95, "655": 344.56, "656": 358.06, "657": 371.64, "658": 384.82, "659": 398.44, "660": 411.62}, "Q": [[631, "芸能人", "entertainer"], [632, "ファッションモデル（2語で）", "fashion model"], [633, "漁師", "fisherman"], [634, "花屋", "florist"], [635, "ゲームクリエイター（2語で）", "game creator"], [636, "庭師", "gardener"], [637, "公務員（2語で）", "government worker"], [638, "盲導犬訓練士（3語で）", "guide dog trainer"], [639, "ヘアスタイリスト（2語で）", "hair stylist"], [640, "ホームヘルパー（2語で）", "home attendant"], [641, "イラストレーター", "illustrator"], [642, "通訳者", "interpreter"], [643, "ジャーナリスト", "journalist"], [644, "幼稚園の先生（2語で）", "kindergarten teacher"], [645, "弁護士",
