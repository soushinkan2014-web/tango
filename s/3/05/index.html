</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第5回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.35〜46　No.121〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">double dribble</span><span class="ps">熟</span></div><div class="ja">ダブルドリブル</div><div class="ex">That was a <b>double dribble</b>!</div><div class="xj">今のはダブルドリブルだよ！</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">equity</span><span class="ps">名</span></div><div class="ja">公平（さ）；公正</div><div class="ex">We talked about <b>equity</b> in class today.</div><div class="xj">今日は授業で公平さについて話し合いました。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">given</span><span class="ps">動</span></div><div class="ja">give の過去分詞</div><div class="ex">This prize was <b>given</b> to Emi.</div><div class="xj">この賞はエミに与えられました。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">have ～ in one’s lap</span><span class="ps">熟</span></div><div class="ja">～をひざの上にのせている</div><div class="ex">My grandmother <b>has a cat in her lap</b>.</div><div class="xj">祖母はねこをひざの上にのせています。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">illustration</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">さし絵；イラスト</div><div class="ex">This book has many <b>illustrations</b>.</div><div class="xj">この本にはさし絵がたくさんあります。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">lap</span><span class="ps">名</span></div><div class="ja">ひざ（すわったときのももの上）</div><div class="ex">The baby is sleeping on her mother’s <b>lap</b>.</div><div class="xj">赤ちゃんがお母さんのひざの上で眠っています。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">wheel</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">車輪</div><div class="ex">A bicycle has two <b>wheels</b>.</div><div class="xj">自転車には車輪が2つあります。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">get</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（ある状態に）なる</div><div class="ex">It <b>gets</b> dark early in winter.</div><div class="xj">冬は早く暗くなります。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">hoop</span><span class="ps">名</span></div><div class="ja">（バスケットボールの）リング；輪</div><div class="ex">Tom threw the ball into the <b>hoop</b>.</div><div class="xj">トムはボールをリングに投げ入れました。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">instead</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">代わりに</div><div class="ex">There was no milk, so I drank tea <b>instead</b>.</div><div class="xj">牛乳がなかったので、代わりに紅茶を飲みました。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">instead of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～の代わりに</div><div class="ex">Let’s walk <b>instead of</b> taking the bus.</div><div class="xj">バスに乗る代わりに歩きましょう。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">serve</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（食事などを）出す；仕える</div><div class="ex">This restaurant <b>serves</b> good curry.</div><div class="xj">このレストランはおいしいカレーを出します。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">throw</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">投げる</div><div class="ex">Please <b>throw</b> the ball to me.</div><div class="xj">私にボールを投げてください。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">borrow</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">借りる</div><div class="ex">Can I <b>borrow</b> your pen?</div><div class="xj">あなたのペンを借りてもいいですか。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">call</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（call A B で）AをBと呼ぶ</div><div class="ex">We <b>call</b> our dog Momo.</div><div class="xj">私たちは犬をモモと呼んでいます。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">door</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">ドア；戸</div><div class="ex">Someone is knocking on the <b>door</b>.</div><div class="xj">だれかがドアをノックしています。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">help</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">助け；手伝い</div><div class="ex">Ken asked for my <b>help</b> with his homework.</div><div class="xj">ケンは宿題のことで私に助けを求めました。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">let</span><span class="ps">動</span></div><div class="ja">～させる；（let me ～で）私に～させて</div><div class="ex">A: This box is heavy.<br>B: <b>Let</b> me help you.</div><div class="xj">A：この箱は重いです。B：私に手伝わせてください。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">phone</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">電話（機）；スマートフォン</div><div class="ex">Can I use your <b>phone</b>?</div><div class="xj">あなたの電話を使ってもいいですか。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">change trains</span><span class="ps">熟</span></div><div class="ja">電車を乗りかえる</div><div class="ex">You need to <b>change trains</b> at the next station.</div><div class="xj">次の駅で電車を乗りかえる必要があります。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">take</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（乗り物に）乗る</div><div class="ex">Let’s <b>take</b> a bus to the zoo.</div><div class="xj">動物園までバスに乗りましょう。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">ranking</span><span class="ps">名</span></div><div class="ja">ランキング；順位</div><div class="ex">Our team is first in the <b>ranking</b>.</div><div class="xj">私たちのチームはランキングで1位です。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">relax</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をくつろがせる；リラックスさせる</div><div class="ex">Soft music always <b>relaxes</b> me.</div><div class="xj">やさしい音楽はいつも私をリラックスさせてくれます。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">collide</span><span class="ps">動</span></div><div class="ja">ぶつかる；衝突する</div><div class="ex">Two players <b>collided</b> during the game.</div><div class="xj">試合中に2人の選手がぶつかりました。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">explain</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">説明する</div><div class="ex">Can you <b>explain</b> this rule to me?</div><div class="xj">このルールを私に説明してくれませんか。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">fall over</span><span class="ps">熟</span></div><div class="ja">転ぶ；ひっくり返る</div><div class="ex">Be careful not to <b>fall over</b> on the ice.</div><div class="xj">氷の上で転ばないように気をつけて。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">it is true that ～</span><span class="ps">熟</span></div><div class="ja">～ということは本当だ；確かに～だ</div><div class="ex"><b>It is true that</b> this job is hard, but it is fun.</div><div class="xj">この仕事が大変なのは本当ですが、楽しいです。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">over</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">終わって；済んで</div><div class="ex">Summer vacation is <b>over</b>, and school starts tomorrow.</div><div class="xj">夏休みが終わって、明日から学校が始まります。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">clearly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">はっきりと；明らかに</div><div class="ex">Please speak more <b>clearly</b> in front of the class.</div><div class="xj">クラスの前ではもっとはっきりと話してください。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">comment</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">コメント；意見</div><div class="ex">Mr. Sato wrote a <b>comment</b> on my report.</div><div class="xj">佐藤先生は私のレポートにコメントを書いてくれました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../04/">← 第4回</a><a href="../06/">第6回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"121": 4.04, "122": 16.28, "123": 29.84, "124": 42.62, "125": 57.28, "126": 70.74, "127": 84.78, "128": 97.42, "129": 110.21, "130": 123.84, "131": 137.35, "132": 150.66, "133": 164.46, "134": 176.58, "135": 188.43, "136": 201.86, "137": 214.29, "138": 227.46, "139": 245.41, "140": 258.15, "141": 272.28, "142": 284.66, "143": 297.81, "144": 312.83, "145": 326.36, "146": 338.81, "147": 352.85, "148": 369.76, "149": 384.18, "150": 398.05}, "TE": {"121": 5.94, "122": 18.15, "123": 31.71, "124": 44.74, "125": 59.2, "126": 72.62, "127": 86.65, "128": 99.3, "129": 112.08, "130": 125.71, "131": 139.24, "132": 152.54, "133": 166.33, "134": 178.45, "135": 190.3, "136": 203.74, "137": 216.16, "138": 229.34, "139": 247.28, "140": 260.36, "141": 274.15, "142": 286.53, "143": 299.68, "144": 314.7, "145": 328.23, "146": 340.71, "147": 354.91, "148": 371.64, "149": 386.06, "150": 399.92}, "Q": [[121, "ダブルドリブル（2語で）", "double dribble"], [122, "公平（さ）", "equity"], [123, "give の過去分詞", "given"], [124, "～をひざの上にのせている（4語で）", "have in one’s lap"], [125, "さし絵", "illustration"], [126, "ひざ（すわったときのももの上）", "lap"], [127, "車輪", "wheel"], [128, "（ある状態に）なる", "get"], [129, "（バスケットボールの）リング", "hoop"], [130, "代わりに", "instead"], [131, "～の代わりに（2語で）", "instead of"], [132, "（食事などを）出す", "serve"], [133, "投げる", "throw"], [134, "借りる", "borrow"], [135, "AをBと呼ぶ（3語で）", "call A B"], [136, "ドア", "door"], [137, "助け", "help"], [138, "～させる", "let"], [139, "電話（機）", "phone"], [140, "電車を乗りかえる（2語で）", "change trains"], [141, "（乗り物に）乗る", "take"], [142, "ランキング", "ranking"], [143, "～をくつろがせる", "relax"], [144, "ぶつかる", "collide"], [145, "説明する", "explain"], [146, "転ぶ（2語で）"
