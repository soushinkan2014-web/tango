<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中3 英単語 第23回｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }

audio { width: 100%; }

.btn.on { background: var(--red); color: #fff; }

.w.now { border-color: var(--red); box-shadow: 0 0 0 2px var(--red) inset; }
.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.no { font-size: 13px; color: var(--sub); min-width: 2.2em; }
.en { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
.ps { font-size: 12px; border: 1px solid #999; border-radius: 4px; padding: 0 4px; color: #444; }
.star { color: var(--red); font-size: 14px; }
.ja { font-size: 16px; font-weight: 700; margin-top: 4px; }

ul.list b { display: block; font-size: 18px; } ul.list span { font-size: 12px; color: var(--sub); }

  .btn, nav.pn a, ul.list a { background: #1d1d1d; } .ex { color: #ddd; } .ps { color: #ccc; }

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第23回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.131〜132　No.661〜686</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">taxi driver</span><span class="ps">熟</span></div><div class="ja">タクシー運転手</div><div class="ex">The <b>taxi driver</b> took us to the hotel.</div><div class="xj">タクシー運転手さんが私たちをホテルまで連れていってくれました。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">tour conductor</span><span class="ps">熟</span></div><div class="ja">添乗員；ツアーコンダクター</div><div class="ex">Our <b>tour conductor</b> showed us around Kyoto.</div><div class="xj">私たちの添乗員さんが京都を案内してくれました。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">translator</span><span class="ps">名</span></div><div class="ja">翻訳家</div><div class="ex">My aunt is a <b>translator</b> of children’s books.</div><div class="xj">おばは児童書の翻訳家です。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">TV personality</span><span class="ps">熟</span></div><div class="ja">タレント；テレビによく出る人</div><div class="ex">The <b>TV personality</b> often appears on cooking shows.</div><div class="xj">そのタレントはよく料理番組に出ています。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">violinist</span><span class="ps">名</span></div><div class="ja">バイオリニスト</div><div class="ex">The young <b>violinist</b> won first prize in the contest.</div><div class="xj">その若いバイオリニストはコンテストで1位になりました。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">voice actor</span><span class="ps">熟</span></div><div class="ja">声優</div><div class="ex">I know the <b>voice actor</b> who plays this character.</div><div class="xj">私はこのキャラクターを演じている声優を知っています。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">weather forecaster</span><span class="ps">熟</span></div><div class="ja">気象予報士</div><div class="ex">The <b>weather forecaster</b> says that it will be sunny tomorrow.</div><div class="xj">気象予報士は明日は晴れると言っています。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">among</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">（3つ以上）の間で；～の中で</div><div class="ex">This song is popular <b>among</b> young people.</div><div class="xj">この歌は若い人たちの間で人気があります。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">below</span><span class="ps">前</span></div><div class="ja">～の下に；～より下に</div><div class="ex">Write your name <b>below</b> the line.</div><div class="xj">線の下に名前を書いてください。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">bench</span><span class="ps">名</span></div><div class="ja">ベンチ；長いす</div><div class="ex">Let’s sit on the <b>bench</b> in the park.</div><div class="xj">公園のベンチに座りましょう。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">ceiling</span><span class="ps">名</span></div><div class="ja">天井</div><div class="ex">There is a big light on the <b>ceiling</b>.</div><div class="xj">天井に大きな明かりがあります。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">daughter</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">娘</div><div class="ex">Mr. Sato has two <b>daughters</b> and one son.</div><div class="xj">佐藤さんには娘が2人と息子が1人います。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">east</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">東</div><div class="ex">The sun rises in the <b>east</b>.</div><div class="xj">太陽は東からのぼります。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">grandchild</span><span class="ps">名</span></div><div class="ja">孫</div><div class="ex">My grandmother was happy to meet her first <b>grandchild</b>.</div><div class="xj">祖母は初めての孫に会えてうれしかったです。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">granddaughter</span><span class="ps">名</span></div><div class="ja">孫娘；（女の）孫</div><div class="ex">Mrs. Brown’s <b>granddaughter</b> is three years old.</div><div class="xj">ブラウンさんの孫娘は3歳です。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">grandson</span><span class="ps">名</span></div><div class="ja">（男の）孫；孫息子</div><div class="ex">Mr. Sato plays catch with his <b>grandson</b> every Sunday.</div><div class="xj">佐藤さんは毎週日曜日に孫とキャッチボールをします。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">ground</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">地面；グラウンド</div><div class="ex">Snow covered the <b>ground</b> this morning.</div><div class="xj">今朝、雪が地面をおおっていました。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">husband</span><span class="ps">名</span></div><div class="ja">夫</div><div class="ex">Her <b>husband</b> is a cook at a hotel.</div><div class="xj">彼女の夫はホテルのコックです。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">nephew</span><span class="ps">名</span></div><div class="ja">おい</div><div class="ex">My <b>nephew</b> is five years old.</div><div class="xj">私のおいは5歳です。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">niece</span><span class="ps">名</span></div><div class="ja">めい</div><div class="ex">I bought a birthday present for my <b>niece</b>.</div><div class="xj">私はめいに誕生日プレゼントを買いました。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">north</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">北</div><div class="ex">The wind from the <b>north</b> is very cold in winter.</div><div class="xj">冬は北からの風がとても冷たいです。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">roof</span><span class="ps">名</span></div><div class="ja">屋根</div><div class="ex">The <b>roof</b> of my house is red.</div><div class="xj">私の家の屋根は赤いです。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">son</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">息子</div><div class="ex">Their <b>son</b> is a member of the soccer team.</div><div class="xj">彼らの息子はサッカー部の部員です。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">south</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">南</div><div class="ex">Kagoshima is in the <b>south</b> of Kyushu.</div><div class="xj">鹿児島は九州の南にあります。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">west</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">西</div><div class="ex">The sun sets in the <b>west</b>.</div><div class="xj">太陽は西にしずみます。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">wife</span><span class="ps">名</span></div><div class="ja">妻；奥さん</div><div class="ex">Mr. Sato and his <b>wife</b> enjoy walking in the park.</div><div class="xj">佐藤さんと奥さんは公園での散歩を楽しんでいます。</div></button></li></ol><nav class="pn"><a href="../22/">← 第22回</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"661": 4.57, "662": 18.34, "663": 33.48, "664": 46.78, "665": 63.28, "666": 77.18, "667": 90.76, "668": 105.3, "669": 120.34, "670": 134.69, "671": 147.76, "672": 160.29, "673": 173.58, "674": 186.06, "675": 199.64, "676": 213.94, "677": 228.96, "678": 242.22, "679": 254.84, "680": 267.51, "681": 280.35, "682": 293.57, "683": 305.95, "684": 318.88, "685": 331.79, "686": 344.12};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
