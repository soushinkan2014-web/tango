</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第7回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.50〜53　No.181〜210</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">lead</span><span class="ps">名</span></div><div class="ja">鉛</div><div class="ex"><b>Lead</b> is a heavy metal.</div><div class="xj">鉛は重い金属です。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">poisoning</span><span class="ps">名</span></div><div class="ja">中毒</div><div class="ex">Be careful about food <b>poisoning</b> in summer.</div><div class="xj">夏は食中毒に気をつけなさい。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">spread</span><span class="ps">動</span></div><div class="ja">広がる；広げる</div><div class="ex">The news <b>spread</b> quickly through the school.</div><div class="xj">その知らせはすぐに学校中に広がりました。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">stomach</span><span class="ps">名</span></div><div class="ja">胃；おなか</div><div class="ex">I ate too much, and now my <b>stomach</b> hurts.</div><div class="xj">食べすぎて、今おなかが痛いです。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">weaken</span><span class="ps">動</span></div><div class="ja">弱める；弱くなる</div><div class="ex">Lack of sleep can <b>weaken</b> your body.</div><div class="xj">睡眠不足は体を弱めることがあります。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">wound</span><span class="ps">名</span></div><div class="ja">傷；けが</div><div class="ex">The doctor cleaned the <b>wound</b> on my knee.</div><div class="xj">医者がひざの傷をきれいにしてくれました。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">angry</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">怒った；腹を立てた</div><div class="ex">Mom was <b>angry</b> because I came home late.</div><div class="xj">私が遅く帰ったので、母は怒っていました。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">get angry with ～</span><span class="ps">熟</span></div><div class="ja">～に腹を立てる</div><div class="ex">Please don’t <b>get angry with</b> me.</div><div class="xj">私に腹を立てないでください。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">announce</span><span class="ps">動</span></div><div class="ja">発表する；知らせる</div><div class="ex">The school <b>announced</b> the date of the festival.</div><div class="xj">学校は文化祭の日程を発表しました。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">ban</span><span class="ps">動</span></div><div class="ja">（法律などで）禁止する</div><div class="ex">The town <b>banned</b> plastic bags last year.</div><div class="xj">その町は昨年、レジ袋を禁止しました。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">government</span><span class="ps">名</span></div><div class="ja">政府</div><div class="ex">The <b>government</b> made a new rule about food waste.</div><div class="xj">政府は食品ロスについて新しいルールを作りました。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">little by little</span><span class="ps">熟</span></div><div class="ja">少しずつ</div><div class="ex">My English is getting better <b>little by little</b>.</div><div class="xj">私の英語は少しずつ上達しています。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">passion</span><span class="ps">名</span></div><div class="ja">情熱</div><div class="ex">Ken has a <b>passion</b> for music.</div><div class="xj">ケンは音楽への情熱を持っています。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">solve</span><span class="ps">動</span></div><div class="ja">解く；解決する</div><div class="ex">Can you <b>solve</b> this math problem?</div><div class="xj">この数学の問題を解けますか。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">thanks to ～</span><span class="ps">熟</span></div><div class="ja">～のおかげで</div><div class="ex"><b>Thanks to</b> your help, I finished my homework.</div><div class="xj">あなたの助けのおかげで、宿題が終わりました。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">throughout</span><span class="ps">前</span></div><div class="ja">～じゅう（ずっと）；～の至る所で</div><div class="ex">This park is popular <b>throughout</b> the year.</div><div class="xj">この公園は1年じゅう人気があります。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">assign</span><span class="ps">動</span></div><div class="ja">割り当てる</div><div class="ex">Mr. Sato <b>assigned</b> each student a job.</div><div class="xj">佐藤先生は生徒一人一人に仕事を割り当てました。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">assign ～ to ...</span><span class="ps">熟</span></div><div class="ja">～を…に割り当てる</div><div class="ex">Our coach <b>assigned positions to</b> the new players.</div><div class="xj">コーチは新しい選手たちにポジションを割り当てました。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">close</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">親しい；近い</div><div class="ex">Emi and I are <b>close</b> friends.</div><div class="xj">エミと私は親しい友だちです。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">disability</span><span class="ps">名</span></div><div class="ja">障がい</div><div class="ex">People with <b>disabilities</b> can enjoy this sport.</div><div class="xj">障がいのある人もこのスポーツを楽しめます。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">feather</span><span class="ps">名</span></div><div class="ja">羽；羽毛</div><div class="ex">The bird has beautiful blue <b>feathers</b>.</div><div class="xj">その鳥は美しい青い羽をしています。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">harmony</span><span class="ps">名</span></div><div class="ja">調和</div><div class="ex">People and animals can live in <b>harmony</b>.</div><div class="xj">人と動物は調和して暮らすことができます。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">hit</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（台風などが）襲う</div><div class="ex">A big typhoon <b>hit</b> Okinawa last week.</div><div class="xj">先週、大きな台風が沖縄を襲いました。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">life</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">命；生命</div><div class="ex">I think that every <b>life</b> is important.</div><div class="xj">私はすべての命が大切だと思います。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">lives</span><span class="ps">名</span></div><div class="ja">life の複数形</div><div class="ex">Doctors save many <b>lives</b> every day.</div><div class="xj">医師は毎日たくさんの命を救っています。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">meaningful</span><span class="ps">形</span></div><div class="ja">有意義な；意味のある</div><div class="ex">We had a <b>meaningful</b> time at the volunteer event.</div><div class="xj">ボランティア活動で有意義な時間を過ごしました。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">possible</span><span class="ps">形</span></div><div class="ja">可能な；できる</div><div class="ex">Is it <b>possible</b> to visit the museum on Monday?</div><div class="xj">月曜日に博物館を訪れることは可能ですか。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">softness</span><span class="ps">名</span></div><div class="ja">やわらかさ</div><div class="ex">I like the <b>softness</b> of this towel.</div><div class="xj">私はこのタオルのやわらかさが好きです。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">valuable</span><span class="ps">形</span></div><div class="ja">貴重な；高価な</div><div class="ex">This old map is very <b>valuable</b>.</div><div class="xj">この古い地図はとても貴重です。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">happily</span><span class="ps">副</span></div><div class="ja">楽しそうに；幸せに</div><div class="ex">The children are playing <b>happily</b> in the park.</div><div class="xj">子どもたちが公園で楽しそうに遊んでいます。</div></button></li></ol><nav class="pn"><a href="../06/">← 第6回</a><a href="../08/">第8回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"181": 4.16, "182": 16.21, "183": 29.4, "184": 42.89, "185": 56.61, "186": 69.95, "187": 82.81, "188": 96.78, "189": 110.02, "190": 123.62, "191": 137.71, "192": 151.14, "193": 164.29, "194": 176.82, "195": 189.8, "196": 203.28, "197": 218.44, "198": 231.57, "199": 245.82, "200": 258.9, "201": 272.09, "202": 284.95, "203": 297.74, "204": 311.49, "205": 324.4, "206": 337.88, "207": 351.92, "208": 365.5, "209": 378.36, "210": 391.67};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
