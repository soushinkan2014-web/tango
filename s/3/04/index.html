</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第4回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.22〜35　No.91〜120</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">kept</span><span class="ps">動</span></div><div class="ja">keep の過去・過去分詞</div><div class="ex">Ken <b>kept</b> his promise to me.</div><div class="xj">ケンは私との約束を守りました。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">right</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">権利</div><div class="ex">Every child has the <b>right</b> to go to school.</div><div class="xj">すべての子どもには学校へ行く権利があります。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">as a result</span><span class="ps">熟</span></div><div class="ja">その結果</div><div class="ex">Emi practiced hard, and <b>as a result</b> she won the contest.</div><div class="xj">エミは一生懸命練習し、その結果コンテストで優勝しました。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">bright</span><span class="ps">形</span></div><div class="ja">明るい；輝いている</div><div class="ex">This room is <b>bright</b> and warm.</div><div class="xj">この部屋は明るくて暖かいです。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">employee</span><span class="ps">名</span></div><div class="ja">従業員；社員</div><div class="ex">This store has twenty <b>employees</b>.</div><div class="xj">この店には20人の従業員がいます。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">introduce</span><span class="ps">動</span></div><div class="ja">紹介する；導入する</div><div class="ex">I will <b>introduce</b> my family to you.</div><div class="xj">あなたに私の家族を紹介します。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">result</span><span class="ps">名</span></div><div class="ja">結果</div><div class="ex">I was happy with the test <b>results</b>.</div><div class="xj">私はテストの結果に満足しました。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">screen</span><span class="ps">名</span></div><div class="ja">画面；スクリーン</div><div class="ex">Don’t look at the <b>screen</b> for too long.</div><div class="xj">画面を長く見すぎてはいけません。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">thus</span><span class="ps">副</span></div><div class="ja">したがって；このように</div><div class="ex">The bus was late, and <b>thus</b> we missed the movie.</div><div class="xj">バスが遅れ、したがって私たちは映画に間に合いませんでした。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">position</span><span class="ps">名</span></div><div class="ja">ポジション；位置；立場</div><div class="ex">What <b>position</b> do you play on the team?</div><div class="xj">あなたはチームでどのポジションですか。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">tour</span><span class="ps">名</span></div><div class="ja">ツアー；（見学）旅行</div><div class="ex">We went on a bus <b>tour</b> of Kyoto.</div><div class="xj">私たちは京都のバスツアーに参加しました。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">tournament</span><span class="ps">名</span></div><div class="ja">大会；トーナメント</div><div class="ex">Our team won the tennis <b>tournament</b>.</div><div class="xj">私たちのチームはテニスの大会で優勝しました。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">get rest</span><span class="ps">熟</span></div><div class="ja">休息をとる</div><div class="ex">You need to <b>get rest</b> after the long trip.</div><div class="xj">長旅のあとは休息をとる必要があります。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">make</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（スピーチ・まちがいなどを）する</div><div class="ex">Ken <b>made</b> a speech in English.</div><div class="xj">ケンは英語でスピーチをしました。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">rest</span><span class="ps">名</span></div><div class="ja">休息；休けい</div><div class="ex">Let’s take a short <b>rest</b>.</div><div class="xj">少し休けいしましょう。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">wake</span><span class="ps">動</span></div><div class="ja">起こす；目を覚ます</div><div class="ex">Please don’t <b>wake</b> the baby.</div><div class="xj">赤ちゃんを起こさないでください。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">wake up</span><span class="ps">熟</span></div><div class="ja">目を覚ます；起きる</div><div class="ex">I <b>wake up</b> at six every morning.</div><div class="xj">私は毎朝6時に目を覚まします。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">bake</span><span class="ps">動</span></div><div class="ja">（パンなどを）焼く</div><div class="ex">My sister <b>baked</b> cookies for us.</div><div class="xj">姉が私たちにクッキーを焼いてくれました。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">laugh</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（声を出して）笑う</div><div class="ex">Everyone <b>laughed</b> at Tom’s joke.</div><div class="xj">みんながトムの冗談に笑いました。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">lent</span><span class="ps">動</span></div><div class="ja">lend の過去・過去分詞</div><div class="ex">Yuki <b>lent</b> me her pen.</div><div class="xj">ユキは私にペンを貸してくれました。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">smile</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">ほほえむ；にっこり笑う</div><div class="ex">The baby <b>smiled</b> at me.</div><div class="xj">赤ちゃんが私にほほえみました。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">half-time</span><span class="ps">名</span></div><div class="ja">ハーフタイム</div><div class="ex">The players drank water at <b>half-time</b>.</div><div class="xj">選手たちはハーフタイムに水を飲みました。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">must</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">～にちがいない</div><div class="ex">Emi <b>must</b> be hungry after practice.</div><div class="xj">エミは練習のあとでおなかがすいているにちがいありません。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">not only ～ but also ...</span><span class="ps">熟</span></div><div class="ja">～だけでなく…も</div><div class="ex">Ken can play <b>not only soccer but also baseball</b>.</div><div class="xj">ケンはサッカーだけでなく野球もできます。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">there’s</span><span class="ps">熟</span></div><div class="ja">there is の短縮形</div><div class="ex"><b>There’s</b> a big park near my house.</div><div class="xj">私の家の近くに大きな公園があります。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">indoor</span><span class="ps">形</span></div><div class="ja">屋内の；室内の</div><div class="ex">We play <b>indoor</b> games on rainy days.</div><div class="xj">雨の日には室内のゲームをします。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">name</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">名前を言う；名前を挙げる；名づける</div><div class="ex">Can you <b>name</b> five colors in English?</div><div class="xj">英語で色の名前を5つ言えますか。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">report</span><span class="ps">名</span></div><div class="ja">レポート；報告（書）</div><div class="ex">I wrote a <b>report</b> about food waste.</div><div class="xj">私は食品ロスについてのレポートを書きました。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">chance</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">機会；チャンス</div><div class="ex">I had a <b>chance</b> to talk with a famous singer.</div><div class="xj">私は有名な歌手と話す機会がありました。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">classification</span><span class="ps">名</span></div><div class="ja">分類</div><div class="ex">We learned about the <b>classification</b> of plants in science class.</div><div class="xj">理科の授業で植物の分類について学びました。</div></button></li></ol><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"91": 4.21, "92": 17.72, "93": 30.68, "94": 45.0, "95": 58.39, "96": 71.9, "97": 85.67, "98": 98.31, "99": 111.41, "100": 125.76, "101": 138.6, "102": 152.06, "103": 165.37, "104": 178.47, "105": 192.17, "106": 204.82, "107": 217.7, "108": 230.99, "109": 243.83, "110": 256.88, "111": 270.27, "112": 283.42, "113": 296.2, "114": 309.66, "115": 325.24, "116": 338.58, "117": 352.49, "118": 366.46, "119": 380.08, "120": 393.62};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
