<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中3 英単語 第10回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第10回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.67〜71　No.271〜300</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">jean</span><span class="ps">名</span></div><div class="ja">（jeans で）ジーンズ</div><div class="ex">Ken is wearing blue <b>jeans</b> today.</div><div class="xj">ケンは今日、青いジーンズをはいています。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">land</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">土地；陸地</div><div class="ex">The <b>land</b> here is good for growing rice.</div><div class="xj">ここの土地は米を育てるのに向いています。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">magazine</span><span class="ps">名</span></div><div class="ja">雑誌</div><div class="ex">I bought a soccer <b>magazine</b> at the bookstore.</div><div class="xj">私は本屋でサッカーの雑誌を買いました。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">male</span><span class="ps">形</span></div><div class="ja">おすの；男性の</div><div class="ex"><b>Male</b> lions have long hair around their necks.</div><div class="xj">おすのライオンは首の周りに長い毛があります。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">mountain</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">山</div><div class="ex">We have climbed this <b>mountain</b> three times.</div><div class="xj">私たちはこの山に3回登ったことがあります。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">musician</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">音楽家；ミュージシャン</div><div class="ex">My uncle wants to be a <b>musician</b>.</div><div class="xj">私のおじは音楽家になりたがっています。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">neck</span><span class="ps">名</span></div><div class="ja">首</div><div class="ex">Emi put a warm scarf around her <b>neck</b>.</div><div class="xj">エミは首に暖かいマフラーを巻きました。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">stripe</span><span class="ps">名</span></div><div class="ja">しま；ストライプ</div><div class="ex">Zebras have black and white <b>stripes</b>.</div><div class="xj">シマウマには黒と白のしまがあります。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">trunk</span><span class="ps">名</span></div><div class="ja">（ゾウの）鼻；（木の）幹</div><div class="ex">Elephants use their <b>trunks</b> to drink water.</div><div class="xj">ゾウは水を飲むのに鼻を使います。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">cacao</span><span class="ps">名</span></div><div class="ja">カカオ</div><div class="ex">Chocolate is made from <b>cacao</b> beans.</div><div class="xj">チョコレートはカカオ豆から作られます。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">crush</span><span class="ps">動</span></div><div class="ja">押しつぶす；砕く</div><div class="ex">First, <b>crush</b> the cookies into small pieces.</div><div class="xj">まず、クッキーを細かく砕いてください。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">limited</span><span class="ps">形</span></div><div class="ja">限られた</div><div class="ex">This cake is sold for a <b>limited</b> time only.</div><div class="xj">このケーキは限られた期間だけ売られます。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">medicine</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">薬</div><div class="ex">Take this <b>medicine</b> after dinner.</div><div class="xj">夕食後にこの薬を飲んでください。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">original</span><span class="ps">形</span></div><div class="ja">独自の；もとの；最初の</div><div class="ex">Our class made an <b>original</b> T-shirt for the festival.</div><div class="xj">私たちのクラスは文化祭のために独自のTシャツを作りました。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">regard</span><span class="ps">動</span></div><div class="ja">みなす；考える</div><div class="ex">I <b>regard</b> Emi as my best friend.</div><div class="xj">私はエミを親友だとみなしています。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">regard ～ as ...</span><span class="ps">熟</span></div><div class="ja">～を…とみなす；～を…と考える</div><div class="ex">Many people <b>regard this temple as</b> a treasure of Japan.</div><div class="xj">多くの人がこの寺を日本の宝とみなしています。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">speech</span><span class="ps">名</span></div><div class="ja">スピーチ；演説</div><div class="ex">Lisa made a <b>speech</b> in English at the contest.</div><div class="xj">リサはコンテストで英語のスピーチをしました。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">spice</span><span class="ps">名</span></div><div class="ja">香辛料；スパイス</div><div class="ex">This curry has many kinds of <b>spices</b> in it.</div><div class="xj">このカレーには多くの種類の香辛料が入っています。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">time</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">時代；（～の）ころ</div><div class="ex">In those <b>times</b>, people didn’t have cars.</div><div class="xj">その時代には、人々は車を持っていませんでした。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">topic</span><span class="ps">名</span></div><div class="ja">話題；テーマ</div><div class="ex">What is the <b>topic</b> of your speech?</div><div class="xj">あなたのスピーチの話題は何ですか。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">website</span><span class="ps">名</span></div><div class="ja">ウェブサイト</div><div class="ex">You can find the information on our <b>website</b>.</div><div class="xj">その情報は私たちのウェブサイトで見つけられます。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">began</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">始まった；始めた（begin の過去形）</div><div class="ex">The concert <b>began</b> at six o’clock.</div><div class="xj">コンサートは6時に始まりました。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">begin</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">始まる；始める</div><div class="ex">The summer vacation will <b>begin</b> next week.</div><div class="xj">夏休みは来週始まります。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">century</span><span class="ps">名</span></div><div class="ja">世紀；100年</div><div class="ex">This temple was built in the eighth <b>century</b>.</div><div class="xj">この寺は8世紀に建てられました。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">consume</span><span class="ps">動</span></div><div class="ja">消費する</div><div class="ex">Big cars <b>consume</b> a lot of gas.</div><div class="xj">大きな車はたくさんのガソリンを消費します。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">graph</span><span class="ps">名</span></div><div class="ja">グラフ</div><div class="ex">This <b>graph</b> shows our favorite sports.</div><div class="xj">このグラフは私たちの好きなスポーツを表しています。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">improve</span><span class="ps">動</span></div><div class="ja">改善する；向上させる</div><div class="ex">I want to <b>improve</b> my English.</div><div class="xj">私は英語の力を向上させたいです。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">solid</span><span class="ps">形</span></div><div class="ja">固体の；固い</div><div class="ex">Water becomes <b>solid</b> when it gets very cold.</div><div class="xj">水はとても冷たくなると固体になります。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">dark</span><span class="ps">形</span></div><div class="ja">暗い；（色が）濃い</div><div class="ex">It was already <b>dark</b> when I got home.</div><div class="xj">私が家に着いたときには、もう暗かったです。</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">fair trade</span><span class="ps">熟</span></div><div class="ja">フェアトレード（公正な取引）</div><div class="ex">We buy <b>fair trade</b> chocolate to help farmers.</div><div class="xj">私たちは農家の人を助けるためにフェアトレードのチョコレートを買います。</div></button></li></ol><nav class="pn"><a href="../09/">← 第9回</a><a href="../11/">第11回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"271": 4.16, "272": 17.29, "273": 30.6, "274": 43.63, "275": 57.33, "276": 70.26, "277": 83.6, "278": 96.66, "279": 110.04, "280": 123.67, "281": 136.6, "282": 151.1, "283": 164.34, "284": 176.72, "285": 190.71, "286": 204.1, "287": 221.01, "288": 234.95, "289": 249.06, "290": 263.38, "291": 276.15, "292": 289.13, "293": 303.76, "294": 317.2, "295": 330.66, "296": 343.57, "297": 356.48, "298": 369.98, "299": 383.61, "300": 396.81};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
