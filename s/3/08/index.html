<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中3 英単語 第8回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第8回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.54〜60　No.211〜240</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">agree with ～</span><span class="ps">熟</span></div><div class="ja">～に賛成する；～と同じ意見である</div><div class="ex">I <b>agree with</b> Ken’s idea.</div><div class="xj">私はケンの考えに賛成です。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">all the time</span><span class="ps">熟</span></div><div class="ja">いつも；その間ずっと</div><div class="ex">My little brother plays games <b>all the time</b>.</div><div class="xj">弟はいつもゲームをしています。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">ax</span><span class="ps">名</span></div><div class="ja">おの</div><div class="ex">My grandfather cut the tree with an <b>ax</b>.</div><div class="xj">祖父はおのでその木を切りました。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">blanket</span><span class="ps">名</span></div><div class="ja">毛布</div><div class="ex">It’s cold. Do you need a <b>blanket</b>?</div><div class="xj">寒いですね。毛布はいりますか。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">clock</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">時計（置き時計・かけ時計）</div><div class="ex">The <b>clock</b> in our classroom is five minutes fast.</div><div class="xj">教室の時計は5分進んでいます。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">cooperation</span><span class="ps">名</span></div><div class="ja">協力</div><div class="ex">This project needs everyone’s <b>cooperation</b>.</div><div class="xj">この計画にはみんなの協力が必要です。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">desert</span><span class="ps">名</span></div><div class="ja">砂漠</div><div class="ex">It is very hot in the <b>desert</b> during the day.</div><div class="xj">砂漠は昼間とても暑いです。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">discussion</span><span class="ps">名</span></div><div class="ja">話し合い；議論</div><div class="ex">We had a <b>discussion</b> about the school trip.</div><div class="xj">私たちは修学旅行について話し合いをしました。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">knife</span><span class="ps">名</span></div><div class="ja">ナイフ；包丁</div><div class="ex">Be careful when you use a <b>knife</b>.</div><div class="xj">ナイフを使うときは気をつけなさい。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">necessary</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">必要な</div><div class="ex">Sleep is <b>necessary</b> for good health.</div><div class="xj">健康のためには睡眠が必要です。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">shovel</span><span class="ps">名</span></div><div class="ja">シャベル</div><div class="ex">We used a <b>shovel</b> to plant the tree.</div><div class="xj">私たちは木を植えるためにシャベルを使いました。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">tent</span><span class="ps">名</span></div><div class="ja">テント</div><div class="ex">We slept in a <b>tent</b> at the camp.</div><div class="xj">私たちはキャンプでテントの中で寝ました。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">gesture</span><span class="ps">名</span></div><div class="ja">身ぶり；ジェスチャー</div><div class="ex">He used <b>gestures</b> to explain the way.</div><div class="xj">彼は身ぶりを使って道を説明しました。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">sign language</span><span class="ps">熟</span></div><div class="ja">手話</div><div class="ex">Emi is learning <b>sign language</b> at a club.</div><div class="xj">エミはクラブで手話を習っています。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">afraid</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">こわがって；（I&#x27;m afraid ～で）残念ながら～</div><div class="ex">My little sister is <b>afraid</b> of dogs.</div><div class="xj">妹は犬をこわがっています。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">hmm</span><span class="ps">間</span></div><div class="ja">うーん；ふーん</div><div class="ex">A: Which do you like better?<br>B: <b>Hmm</b>, I like this one.</div><div class="xj">A：どちらのほうが好きですか。B：うーん、こっちが好きです。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">waiter</span><span class="ps">名</span></div><div class="ja">ウエーター；給仕係</div><div class="ex">The <b>waiter</b> brought us some water.</div><div class="xj">ウエーターが私たちに水を持ってきてくれました。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">behind</span><span class="ps">前</span></div><div class="ja">～のうしろに</div><div class="ex">My house is <b>behind</b> the post office.</div><div class="xj">私の家は郵便局のうしろにあります。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">cap</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">（つばのある）ぼうし</div><div class="ex">Tom always wears a red <b>cap</b>.</div><div class="xj">トムはいつも赤いぼうしをかぶっています。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">design</span><span class="ps">名</span></div><div class="ja">デザイン；設計</div><div class="ex">I love the <b>design</b> of the cap made by Lisa.</div><div class="xj">私はリサが作ったぼうしのデザインが大好きです。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">forgot</span><span class="ps">動</span></div><div class="ja">forget の過去形</div><div class="ex">I <b>forgot</b> Ken’s phone number.</div><div class="xj">私はケンの電話番号を忘れました。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">held</span><span class="ps">動</span></div><div class="ja">hold の過去・過去分詞</div><div class="ex">Our sports day was <b>held</b> last Saturday.</div><div class="xj">体育祭は先週の土曜日に行われました。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">hold</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（会などを）開く；開催する</div><div class="ex">Our school <b>holds</b> a music festival every fall.</div><div class="xj">私たちの学校は毎年秋に音楽祭を開きます。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">Italy</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">イタリア</div><div class="ex">Pizza and pasta are famous foods from <b>Italy</b>.</div><div class="xj">ピザとパスタはイタリアの有名な食べ物です。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">according</span><span class="ps">副</span></div><div class="ja">（according to ～で）～によれば</div><div class="ex"><b>According</b> to the weather report, it will rain tomorrow.</div><div class="xj">天気予報によると、明日は雨が降るそうです。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">according to ～</span><span class="ps">熟</span></div><div class="ja">～によれば；～によると</div><div class="ex"><b>According to</b> Ken, the test will be easy.</div><div class="xj">ケンによると、テストは簡単だそうです。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">official</span><span class="ps">形</span></div><div class="ja">公式の；正式な</div><div class="ex">This is the <b>official</b> website of our city.</div><div class="xj">これは私たちの市の公式ウェブサイトです。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">part</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">部分；役</div><div class="ex">This is my favorite <b>part</b> of the movie.</div><div class="xj">ここがその映画で私がいちばん好きな部分です。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">user</span><span class="ps">名</span></div><div class="ja">利用者；使用者</div><div class="ex">This library has many young <b>users</b>.</div><div class="xj">この図書館には若い利用者がたくさんいます。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">widely</span><span class="ps">副</span></div><div class="ja">広く</div><div class="ex">This song is <b>widely</b> known in Japan.</div><div class="xj">この歌は日本で広く知られています。</div></button></li></ol><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"211": 4.24, "212": 19.5, "213": 33.8, "214": 46.82, "215": 60.26, "216": 75.02, "217": 88.5, "218": 101.46, "219": 114.75, "220": 127.73, "221": 140.64, "222": 153.35, "223": 165.8, "224": 179.19, "225": 192.72, "226": 208.99, "227": 224.06, "228": 237.4, "229": 250.76, "230": 263.79, "231": 277.7, "232": 290.54, "233": 304.84, "234": 319.55, "235": 333.1, "236": 348.7, "237": 363.67, "238": 377.28, "239": 389.99, "240": 403.6};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
