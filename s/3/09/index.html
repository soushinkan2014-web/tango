</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第9回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.61〜67　No.241〜270</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">at first</span><span class="ps">熟</span></div><div class="ja">最初は；はじめは</div><div class="ex"><b>At first</b>, I didn’t like natto.</div><div class="xj">最初は、私は納豆が好きではありませんでした。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">customer</span><span class="ps">名</span></div><div class="ja">客；顧客</div><div class="ex">The shop was full of <b>customers</b> on Sunday.</div><div class="xj">日曜日、その店は客でいっぱいでした。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">drop by ～</span><span class="ps">熟</span></div><div class="ja">～に立ち寄る</div><div class="ex">I <b>dropped by</b> the library on my way home.</div><div class="xj">私は帰り道に図書館に立ち寄りました。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">point</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">指さす；指し示す</div><div class="ex">The little boy <b>pointed</b> at the airplane in the sky.</div><div class="xj">その小さな男の子は空の飛行機を指さしました。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">realize</span><span class="ps">動</span></div><div class="ja">気づく；実感する</div><div class="ex">I <b>realized</b> that Ken was right.</div><div class="xj">私はケンが正しいと気づきました。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">sign</span><span class="ps">名</span></div><div class="ja">しるし；兆し</div><div class="ex">Cherry blossoms are a <b>sign</b> of spring.</div><div class="xj">桜の花は春が来たしるしです。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">type</span><span class="ps">名</span></div><div class="ja">種類；型；タイプ</div><div class="ex">What <b>type</b> of music do you like?</div><div class="xj">あなたはどんな種類の音楽が好きですか。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">writing</span><span class="ps">名</span></div><div class="ja">文字；書くこと；書いたもの</div><div class="ex">You can understand this sign without any <b>writing</b>.</div><div class="xj">この標識は文字がなくても理解できます。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">addition</span><span class="ps">名</span></div><div class="ja">追加；加わったもの</div><div class="ex">The cat is the newest <b>addition</b> to our family.</div><div class="xj">そのネコは私たちの家族に最も新しく加わったものです。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">in addition</span><span class="ps">熟</span></div><div class="ja">さらに；その上</div><div class="ex"><b>In addition</b>, the hotel has a large pool.</div><div class="xj">さらに、そのホテルには大きなプールがあります。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">along</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～に沿って</div><div class="ex">We walked <b>along</b> the river in the morning.</div><div class="xj">私たちは朝、川に沿って歩きました。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">automatically</span><span class="ps">副</span></div><div class="ja">自動的に</div><div class="ex">The door opens <b>automatically</b> when you stand in front of it.</div><div class="xj">そのドアは前に立つと自動的に開きます。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">barrier-free</span><span class="ps">形</span></div><div class="ja">バリアフリーの</div><div class="ex">Our new library is <b>barrier-free</b>.</div><div class="xj">私たちの新しい図書館はバリアフリーです。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">blind</span><span class="ps">形</span></div><div class="ja">目の不自由な</div><div class="ex">This dog helps a <b>blind</b> man every day.</div><div class="xj">この犬は毎日、目の不自由な男性を手助けしています。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">elderly</span><span class="ps">形</span></div><div class="ja">年配の；お年寄りの</div><div class="ex">Ken often helps <b>elderly</b> people in his town.</div><div class="xj">ケンはよく町の年配の人たちを手伝います。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">enter</span><span class="ps">動</span></div><div class="ja">入る；入学する</div><div class="ex">Please take off your shoes before you <b>enter</b> the room.</div><div class="xj">部屋に入る前にくつをぬいでください。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">facility</span><span class="ps">名</span></div><div class="ja">施設；設備</div><div class="ex">This sports <b>facility</b> was built last year.</div><div class="xj">このスポーツ施設は去年建てられました。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">hand rail</span><span class="ps">熟</span></div><div class="ja">手すり</div><div class="ex">There is a <b>hand rail</b> along the wall.</div><div class="xj">かべに沿って手すりがあります。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">injury</span><span class="ps">名</span></div><div class="ja">けが</div><div class="ex">Tom couldn’t play in the game because of his <b>injury</b>.</div><div class="xj">トムはけがのために試合に出られませんでした。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">represent</span><span class="ps">動</span></div><div class="ja">表す；代表する</div><div class="ex">The red circle on the flag <b>represents</b> the sun.</div><div class="xj">旗の赤い丸は太陽を表しています。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">wall</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">かべ</div><div class="ex">Emi put her picture on the <b>wall</b> of the classroom.</div><div class="xj">エミは教室のかべに自分の絵をはりました。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">wide</span><span class="ps">形</span></div><div class="ja">広い；幅の広い</div><div class="ex">The river near my house is very <b>wide</b>.</div><div class="xj">私の家の近くの川はとても広いです。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">stage</span><span class="ps">名</span></div><div class="ja">舞台；ステージ</div><div class="ex">Yuki sang a song on the <b>stage</b> at the festival.</div><div class="xj">ユキはお祭りの舞台で歌を歌いました。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">dramatic</span><span class="ps">形</span></div><div class="ja">劇的な；印象的な</div><div class="ex">The end of the movie was very <b>dramatic</b>.</div><div class="xj">その映画の結末はとても劇的でした。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">scene</span><span class="ps">名</span></div><div class="ja">場面；光景</div><div class="ex">I like the last <b>scene</b> of this story.</div><div class="xj">私はこの物語の最後の場面が好きです。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">which</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">（関係代名詞）～する（もの）；～である（もの）</div><div class="ex">This is the train <b>which</b> goes to Kyoto.</div><div class="xj">これは京都へ行く電車です。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">who</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">（関係代名詞）～する（人）；～である（人）</div><div class="ex">I have a friend <b>who</b> lives in Canada.</div><div class="xj">私にはカナダに住んでいる友だちがいます。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">around</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">約；およそ</div><div class="ex"><b>Around</b> three hundred students came to the concert.</div><div class="xj">約300人の生徒がそのコンサートに来ました。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">China</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">中国</div><div class="ex">Pandas live in the mountains of <b>China</b>.</div><div class="xj">パンダは中国の山の中にすんでいます。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">female</span><span class="ps">形</span></div><div class="ja">めすの；女性の</div><div class="ex">The <b>female</b> lion is taking care of her babies.</div><div class="xj">そのめすのライオンは赤ちゃんの世話をしています。</div></button></li></ol><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"241": 4.16, "242": 17.72, "243": 31.11, "244": 44.57, "245": 58.82, "246": 72.23, "247": 85.79, "248": 98.5, "249": 112.25, "250": 126.36, "251": 140.42, "252": 153.42, "253": 167.29, "254": 180.3, "255": 193.73, "256": 207.65, "257": 221.47, "258": 234.9, "259": 247.76, "260": 261.06, "261": 275.26, "262": 288.36, "263": 301.92, "264": 315.78, "265": 329.65, "266": 342.7, "267": 358.37, "268": 373.94, "269": 387.38, "270": 399.98};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
