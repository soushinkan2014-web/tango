</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第11回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.71〜75　No.301〜330</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">farm</span><span class="ps">名</span></div><div class="ja">農場</div><div class="ex">My grandfather has a large <b>farm</b> in Hokkaido.</div><div class="xj">祖父は北海道に大きな農場を持っています。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">force</span><span class="ps">動</span></div><div class="ja">無理に～させる；強いる</div><div class="ex">My parents never <b>force</b> me to study.</div><div class="xj">両親は私に勉強を無理強いしません。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">image</span><span class="ps">名</span></div><div class="ja">イメージ；印象；画像</div><div class="ex">My <b>image</b> of London changed after the trip.</div><div class="xj">旅行のあと、私のロンドンのイメージは変わりました。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">look for ～</span><span class="ps">熟</span></div><div class="ja">～をさがす</div><div class="ex">I’m <b>looking for</b> a girl who has a red bag.</div><div class="xj">私は赤いかばんを持っている女の子をさがしています。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">mark</span><span class="ps">名</span></div><div class="ja">印；マーク</div><div class="ex">Put a <b>mark</b> next to the right answers.</div><div class="xj">正しい答えの横に印をつけてください。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">movement</span><span class="ps">名</span></div><div class="ja">運動；動き</div><div class="ex">The <b>movement</b> to save the forest is growing.</div><div class="xj">森を守る運動は広がっています。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">package</span><span class="ps">名</span></div><div class="ja">包装；パッケージ；小包</div><div class="ex">I like the cute <b>package</b> of this candy.</div><div class="xj">私はこのキャンディーのかわいいパッケージが好きです。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">price</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">値段；価格</div><div class="ex">The <b>price</b> of vegetables went up this month.</div><div class="xj">今月、野菜の値段が上がりました。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">side</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">側；面</div><div class="ex">Cars drive on the left <b>side</b> of the road in Japan.</div><div class="xj">日本では車は道路の左側を走ります。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">unfairly</span><span class="ps">副</span></div><div class="ja">不公平に；不当に</div><div class="ex">The player felt that he was treated <b>unfairly</b>.</div><div class="xj">その選手は自分が不公平に扱われたと感じました。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">combination</span><span class="ps">名</span></div><div class="ja">組み合わせ</div><div class="ex">Strawberries and milk are a perfect <b>combination</b>.</div><div class="xj">いちごと牛乳は完ぺきな組み合わせです。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">dumpling</span><span class="ps">名</span></div><div class="ja">だんご；ギョーザ</div><div class="ex">We ate rice <b>dumplings</b> at the festival.</div><div class="xj">私たちはお祭りでだんごを食べました。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">flavor</span><span class="ps">名</span></div><div class="ja">味；風味</div><div class="ex">Which ice cream <b>flavor</b> do you like the best?</div><div class="xj">あなたはどのアイスクリームの味がいちばん好きですか。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">perfect</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">完ぺきな；最適な</div><div class="ex">Your English speech was <b>perfect</b>!</div><div class="xj">あなたの英語のスピーチは完ぺきでした！</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">powder</span><span class="ps">名</span></div><div class="ja">粉</div><div class="ex">Mix the <b>powder</b> with hot water.</div><div class="xj">その粉をお湯と混ぜてください。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">red bean paste</span><span class="ps">熟</span></div><div class="ja">あんこ；あん</div><div class="ex">This bread has sweet <b>red bean paste</b> inside.</div><div class="xj">このパンの中には甘いあんこが入っています。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">soybean flour</span><span class="ps">熟</span></div><div class="ja">きな粉</div><div class="ex">My grandmother puts <b>soybean flour</b> on rice cakes.</div><div class="xj">祖母はもちにきな粉をかけます。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">wafer</span><span class="ps">名</span></div><div class="ja">ウエハース</div><div class="ex">This ice cream comes with a <b>wafer</b> on top.</div><div class="xj">このアイスクリームには上にウエハースがついています。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">yard</span><span class="ps">名</span></div><div class="ja">庭；ヤード（長さの単位）</div><div class="ex">The children are playing in the <b>yard</b>.</div><div class="xj">子どもたちは庭で遊んでいます。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">additional</span><span class="ps">形</span></div><div class="ja">追加の</div><div class="ex">You need to pay an <b>additional</b> 500 yen for a large size.</div><div class="xj">大きいサイズには追加の500円を払う必要があります。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">address</span><span class="ps">名</span></div><div class="ja">住所；アドレス</div><div class="ex">Please write your name and <b>address</b> here.</div><div class="xj">ここにあなたの名前と住所を書いてください。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">adult</span><span class="ps">名</span></div><div class="ja">大人</div><div class="ex">Tickets for <b>adults</b> are more expensive than tickets for children.</div><div class="xj">大人用のチケットは子ども用より高いです。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">aged</span><span class="ps">形</span></div><div class="ja">～歳の</div><div class="ex">Children <b>aged</b> six to twelve can join this camp.</div><div class="xj">6歳から12歳の子どもはこのキャンプに参加できます。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">business</span><span class="ps">名</span></div><div class="ja">仕事；商売；事業</div><div class="ex">My father went to Tokyo on <b>business</b> last week.</div><div class="xj">父は先週、仕事で東京へ行きました。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">entry</span><span class="ps">名</span></div><div class="ja">入場；参加；応募</div><div class="ex"><b>Entry</b> to the museum is free for students.</div><div class="xj">学生はその博物館への入場が無料です。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">group</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">グループ；集団</div><div class="ex">I joined a <b>group</b> that cleans the beach.</div><div class="xj">私は浜辺をそうじするグループに参加しました。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">infant</span><span class="ps">名</span></div><div class="ja">幼児；乳児</div><div class="ex"><b>Infants</b> under two can enter for free.</div><div class="xj">2歳未満の幼児は無料で入れます。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">pelican</span><span class="ps">名</span></div><div class="ja">ペリカン</div><div class="ex">A <b>pelican</b> is a bird which has a very big mouth.</div><div class="xj">ペリカンはとても大きな口を持つ鳥です。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">senior</span><span class="ps">名</span></div><div class="ja">高齢者；年上の人；先輩</div><div class="ex">Tickets are cheaper for <b>seniors</b> over sixty-five.</div><div class="xj">65歳を超える高齢者は、チケットが安くなります。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">shark</span><span class="ps">名</span></div><div class="ja">サメ</div><div class="ex">We saw a big <b>shark</b> at the aquarium.</div><div class="xj">私たちは水族館で大きなサメを見ました。</div></button></li></ol><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"301": 4.38, "302": 17.72, "303": 31.88, "304": 45.72, "305": 59.25, "306": 72.06, "307": 85.52, "308": 99.13, "309": 112.49, "310": 125.98, "311": 139.84, "312": 153.28, "313": 166.57, "314": 179.58, "315": 192.89, "316": 205.42, "317": 219.38, "318": 233.9, "319": 247.12, "320": 260.86, "321": 275.09, "322": 288.19, "323": 302.06, "324": 315.83, "325": 329.92, "326": 343.62, "327": 357.12, "328": 370.42, "329": 383.97, "330": 398.63};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
