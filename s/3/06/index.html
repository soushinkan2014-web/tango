<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中3 英単語 第6回｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
header { background: var(--red); color: #fff; padding: 14px 16px 12px; }
header .brand { font-size: 13px; opacity: .9; letter-spacing: .1em; }

.player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
audio { width: 100%; }
.row2 { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; min-height: 46px; border: 2px solid var(--red); background: #fff; color: var(--red); border-radius: 10px; font-size: 16px; font-weight: 700; }

.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.no { font-size: 13px; color: var(--sub); min-width: 2.2em; }
.en { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
.ps { font-size: 12px; border: 1px solid #999; border-radius: 4px; padding: 0 4px; color: #444; }
.star { color: var(--red); font-size: 14px; }
.ja { font-size: 16px; font-weight: 700; margin-top: 4px; }
.ex { font-family: Georgia, serif; font-size: 15px; margin-top: 6px; color: #333; }
.ex b { text-decoration: underline; }

nav.pn { display: flex; gap: 8px; margin-top: 18px; }
nav.pn a { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; }

ul.list b { display: block; font-size: 18px; } ul.list span { font-size: 12px; color: var(--sub); }

  .btn, nav.pn a, ul.list a { background: #1d1d1d; } .ex { color: #ddd; } .ps { color: #ccc; }

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第6回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.46〜50　No.151〜180</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">explanation</span><span class="ps">名</span></div><div class="ja">説明</div><div class="ex">Your <b>explanation</b> was very easy to understand.</div><div class="xj">あなたの説明はとてもわかりやすかったです。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">expression</span><span class="ps">名</span></div><div class="ja">表現；表情</div><div class="ex">I learned a new English <b>expression</b> today.</div><div class="xj">今日、英語の新しい表現を学びました。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">eye contact</span><span class="ps">熟</span></div><div class="ja">アイコンタクト；視線を合わせること</div><div class="ex">Make <b>eye contact</b> when you speak to people.</div><div class="xj">人と話すときはアイコンタクトをとりなさい。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">facial</span><span class="ps">形</span></div><div class="ja">顔の</div><div class="ex"><b>Facial</b> expressions can tell us a lot.</div><div class="xj">顔の表情は私たちに多くのことを伝えてくれます。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">fair</span><span class="ps">形</span></div><div class="ja">公平な；公正な</div><div class="ex">Our teacher is always <b>fair</b> to everyone.</div><div class="xj">私たちの先生はいつもみんなに公平です。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">meaning</span><span class="ps">名</span></div><div class="ja">意味</div><div class="ex">What is the <b>meaning</b> of this word?</div><div class="xj">この単語の意味は何ですか。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">cage</span><span class="ps">名</span></div><div class="ja">（鳥などの）かご；おり</div><div class="ex">The bird is singing in the <b>cage</b>.</div><div class="xj">鳥がかごの中で鳴いています。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">care</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（care about ～で）気にかける；大切に思う</div><div class="ex">Ken really <b>cares</b> about animals.</div><div class="xj">ケンは動物のことを本当に大切に思っています。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">take care of ～</span><span class="ps">熟</span></div><div class="ja">～の世話をする</div><div class="ex">I <b>take care of</b> my little brother after school.</div><div class="xj">私は放課後、弟の世話をします。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">compete</span><span class="ps">動</span></div><div class="ja">競争する；競う</div><div class="ex">Ten teams will <b>compete</b> in the contest.</div><div class="xj">そのコンテストでは10チームが競い合います。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">eagle</span><span class="ps">名</span></div><div class="ja">ワシ</div><div class="ex">An <b>eagle</b> is flying high in the sky.</div><div class="xj">ワシが空高く飛んでいます。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">enable</span><span class="ps">動</span></div><div class="ja">～を可能にする；（人）が～できるようにする</div><div class="ex">The internet <b>enables</b> us to talk with people around the world.</div><div class="xj">インターネットは、私たちが世界中の人と話すことを可能にします。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">environment</span><span class="ps">名</span></div><div class="ja">環境</div><div class="ex">We must protect the natural <b>environment</b>.</div><div class="xj">私たちは自然環境を守らなければなりません。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">huge</span><span class="ps">形</span></div><div class="ja">巨大な；ばく大な</div><div class="ex">There is a <b>huge</b> tree in the park.</div><div class="xj">公園に巨大な木があります。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">injured</span><span class="ps">形</span></div><div class="ja">けがをした</div><div class="ex">The <b>injured</b> bird can’t fly.</div><div class="xj">そのけがをした鳥は飛べません。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">limit</span><span class="ps">名</span></div><div class="ja">制限；限度</div><div class="ex">There is a time <b>limit</b> for this test.</div><div class="xj">このテストには時間制限があります。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">noble</span><span class="ps">形</span></div><div class="ja">気高い；高貴な</div><div class="ex">The eagle looks strong and <b>noble</b>.</div><div class="xj">そのワシは力強く気高く見えます。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">owl</span><span class="ps">名</span></div><div class="ja">フクロウ</div><div class="ex"><b>Owls</b> can see well at night.</div><div class="xj">フクロウは夜でもよく目が見えます。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">raptor</span><span class="ps">名</span></div><div class="ja">猛きん（ワシ・タカなど）</div><div class="ex">An eagle is a kind of <b>raptor</b>.</div><div class="xj">ワシは猛きんの一種です。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">severe</span><span class="ps">形</span></div><div class="ja">厳しい；（程度が）ひどい</div><div class="ex">Last winter was very <b>severe</b>.</div><div class="xj">去年の冬はとても厳しかったです。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">sharp</span><span class="ps">形</span></div><div class="ja">するどい</div><div class="ex">Eagles have very <b>sharp</b> eyes.</div><div class="xj">ワシはとてもするどい目をしています。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">treatment</span><span class="ps">名</span></div><div class="ja">治療；扱い</div><div class="ex">My grandfather is getting <b>treatment</b> at the hospital.</div><div class="xj">祖父は病院で治療を受けています。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">wild</span><span class="ps">形</span></div><div class="ja">野生の</div><div class="ex">Many <b>wild</b> animals live in this forest.</div><div class="xj">この森にはたくさんの野生の動物がすんでいます。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">brought</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">bring の過去・過去分詞</div><div class="ex">Emi <b>brought</b> her lunch to the park.</div><div class="xj">エミは公園にお弁当を持ってきました。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">bullet</span><span class="ps">名</span></div><div class="ja">弾丸</div><div class="ex">The Shinkansen is called the <b>bullet</b> train in English.</div><div class="xj">新幹線は英語で弾丸列車と呼ばれます。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">death</span><span class="ps">名</span></div><div class="ja">死</div><div class="ex">This book is about the life and <b>death</b> of a painter.</div><div class="xj">この本はある画家の生涯と死についての話です。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">decrease</span><span class="ps">動</span></div><div class="ja">減る；減少する</div><div class="ex">The number of children in this town is <b>decreasing</b>.</div><div class="xj">この町の子どもの数は減ってきています。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">die of ～</span><span class="ps">熟</span></div><div class="ja">～で死ぬ；（植物が）～で枯れる</div><div class="ex">The flowers in the garden <b>died of</b> the cold.</div><div class="xj">庭の花は寒さで枯れてしまいました。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">human</span><span class="ps">名</span></div><div class="ja">人間；（形）人間の</div><div class="ex"><b>Humans</b> and animals live together on the earth.</div><div class="xj">人間と動物は地球でいっしょに暮らしています。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">hunter</span><span class="ps">名</span></div><div class="ja">ハンター；狩りをする人</div><div class="ex">The <b>hunter</b> walked into the forest.</div><div class="xj">そのハンターは森の中へ歩いていきました。</div></button></li></ol><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"151": 4.14, "152": 17.86, "153": 31.2, "154": 46.15, "155": 58.94, "156": 72.69, "157": 84.9, "158": 97.9, "159": 113.21, "160": 126.94, "161": 140.47, "162": 153.35, "163": 169.93, "164": 182.74, "165": 196.11, "166": 208.58, "167": 221.78, "168": 235.1, "169": 247.48, "170": 260.89, "171": 274.4, "172": 286.92, "173": 300.62, "174": 313.7, "175": 327.52, "176": 340.95, "177": 354.17, "178": 367.99, "179": 383.23, "180": 397.5};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
