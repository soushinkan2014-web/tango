<b>reality</b>.</div><div class="xj">何年もたって、彼女の夢は現実になりました。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">soldier</span><span class="ps">名</span></div><div class="ja">兵士</div><div class="ex">My grandfather’s father was a <b>soldier</b> long ago.</div><div class="xj">祖父の父は、昔兵士でした。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">speak out</span><span class="ps">熟</span></div><div class="ja">はっきり意見を言う；声を上げる</div><div class="ex">It is important to <b>speak out</b> when something is wrong.</div><div class="xj">何かがまちがっているときに声を上げることは大切です。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">tank</span><span class="ps">名</span></div><div class="ja">水槽</div><div class="ex">We keep some fish in a <b>tank</b> in our classroom.</div><div class="xj">私たちは教室の水槽で魚を飼っています。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">hometown</span><span class="ps">名</span></div><div class="ja">故郷；ふるさと</div><div class="ex">My <b>hometown</b> is famous for its beautiful sea.</div><div class="xj">私の故郷は美しい海で有名です。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">treat</span><span class="ps">動</span></div><div class="ja">治療する；手当てする</div><div class="ex">The doctor <b>treated</b> my sister’s leg.</div><div class="xj">医者が姉の脚を治療しました。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">kindness</span><span class="ps">名</span></div><div class="ja">親切；やさしさ</div><div class="ex">Thank you very much for your <b>kindness</b>.</div><div class="xj">ご親切に本当にありがとうございます。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">memory</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">思い出；記憶</div><div class="ex">I have a lot of good <b>memories</b> of my school life.</div><div class="xj">私には学校生活のよい思い出がたくさんあります。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">spent</span><span class="ps">動</span></div><div class="ja">過ごした；（お金を）使った（spend の過去形・過去分詞）</div><div class="ex">We <b>spent</b> three days in Hokkaido last summer.</div><div class="xj">私たちは去年の夏、北海道で3日間過ごしました。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">victory</span><span class="ps">名</span></div><div class="ja">勝利</div><div class="ex">The fans were very happy about the team’s <b>victory</b>.</div><div class="xj">ファンはチームの勝利をとても喜びました。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">congratulation</span><span class="ps">名</span></div><div class="ja">（～s で）おめでとう；祝いの言葉</div><div class="ex">A: I passed the test!<br>B: <b>Congratulations</b>!</div><div class="xj">A：テストに合格したよ！<br>B：おめでとう！</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">Congratulations on ～.</span><span class="ps">熟</span></div><div class="ja">～おめでとう。</div><div class="ex"><b>Congratulations on</b> winning the speech contest!</div><div class="xj">スピーチコンテストの優勝おめでとう！</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">graduation</span><span class="ps">名</span></div><div class="ja">卒業</div><div class="ex">Our <b>graduation</b> ceremony is on March fifteenth.</div><div class="xj">私たちの卒業式は3月15日です。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">brooch</span><span class="ps">名</span></div><div class="ja">ブローチ</div><div class="ex">My mother wears a pretty <b>brooch</b> on special days.</div><div class="xj">母は特別な日にはかわいいブローチをつけます。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">cheerfully</span><span class="ps">副</span></div><div class="ja">元気よく；陽気に</div><div class="ex">The children said hello to us <b>cheerfully</b>.</div><div class="xj">子どもたちは私たちに元気よくあいさつしました。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">come up to ～</span><span class="ps">熟</span></div><div class="ja">～に近づいてくる；～のところへやって来る</div><div class="ex">A little girl <b>came up to</b> me and asked the way.</div><div class="xj">小さな女の子が私に近づいてきて、道をたずねました。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">counter</span><span class="ps">名</span></div><div class="ja">カウンター；売り場</div><div class="ex">Please pay for your books at the <b>counter</b>.</div><div class="xj">本の代金はカウンターでお支払いください。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">daily</span><span class="ps">形</span></div><div class="ja">毎日の；日常の</div><div class="ex">Reading is a part of my <b>daily</b> life.</div><div class="xj">読書は私の毎日の生活の一部です。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">girlfriend</span><span class="ps">名</span></div><div class="ja">ガールフレンド；恋人</div><div class="ex">Tom’s <b>girlfriend</b> lives in Canada.</div><div class="xj">トムのガールフレンドはカナダに住んでいます。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">marry</span><span class="ps">動</span></div><div class="ja">～と結婚する</div><div class="ex">My aunt will <b>marry</b> a man from Canada next year.</div><div class="xj">おばは来年、カナダ出身の男性と結婚します。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">pearl</span><span class="ps">名</span></div><div class="ja">真珠</div><div class="ex">My grandmother has a beautiful <b>pearl</b> necklace.</div><div class="xj">祖母は美しい真珠のネックレスを持っています。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">routine</span><span class="ps">名</span></div><div class="ja">日課；いつもの決まった仕事</div><div class="ex">Walking my dog is part of my morning <b>routine</b>.</div><div class="xj">犬の散歩は私の朝の日課の一つです。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">unfortunately</span><span class="ps">副</span></div><div class="ja">残念ながら；不運にも</div><div class="ex"><b>Unfortunately</b>, it rained on the day of the picnic.</div><div class="xj">残念ながら、ピクニックの日は雨が降りました。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">all right</span><span class="ps">熟</span></div><div class="ja">大丈夫で；よろしい</div><div class="ex">A: I’m sorry I’m late.<br>B: That’s <b>all right</b>.</div><div class="xj">A：遅れてごめんなさい。B：大丈夫ですよ。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">bank</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">銀行；土手</div><div class="ex">There is a <b>bank</b> next to the post office.</div><div class="xj">郵便局のとなりに銀行があります。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">deep</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">深く</div><div class="ex">The roots of this tree go <b>deep</b> into the ground.</div><div class="xj">この木の根は地面の深くまで伸びています。</div></button></li></ol><nav class="pn"><a href="../16/">← 第16回</a><a href="../18/">第18回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"481": 4.38, "482": 18.03, "483": 31.73, "484": 45.02, "485": 58.03, "486": 71.7, "487": 85.16, "488": 100.14, "489": 113.33, "490": 127.3, "491": 140.56, "492": 153.86, "493": 167.51, "494": 183.99, "495": 197.33, "496": 214.72, "497": 229.7, "498": 243.4, "499": 256.83, "500": 270.56, "501": 286.56, "502": 299.52, "503": 313.19, "504": 326.72, "505": 340.9, "506": 354.2, "507": 368.86, "508": 383.83, "509": 399.11, "510": 412.52};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
