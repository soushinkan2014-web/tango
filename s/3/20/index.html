</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第20回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.123〜129　No.571〜600</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">lots of ～</span><span class="ps">熟</span></div><div class="ja">たくさんの～</div><div class="ex">There are <b>lots of</b> interesting books in our library.</div><div class="xj">私たちの図書館にはたくさんのおもしろい本があります。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">notice</span><span class="ps">動</span></div><div class="ja">気づく</div><div class="ex">Did you <b>notice</b> the new picture on the wall?</div><div class="xj">かべの新しい絵に気づきましたか。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">period</span><span class="ps">名</span></div><div class="ja">時代；期間；（授業の）時間</div><div class="ex">We learned about the Edo <b>period</b> in class.</div><div class="xj">私たちは授業で江戸時代について学びました。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">repair</span><span class="ps">動</span></div><div class="ja">修理する</div><div class="ex">My father <b>repaired</b> my bike yesterday.</div><div class="xj">父は昨日、私の自転車を修理してくれました。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">set</span><span class="ps">動</span></div><div class="ja">置く；設置する</div><div class="ex">The workers <b>set</b> large stones along the river.</div><div class="xj">作業員たちは川に沿って大きな石を置きました。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">technique</span><span class="ps">名</span></div><div class="ja">技術；技法</div><div class="ex">The old man taught us a special <b>technique</b> for making paper.</div><div class="xj">そのおじいさんは私たちに紙を作る特別な技術を教えてくれました。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">joy</span><span class="ps">名</span></div><div class="ja">喜び</div><div class="ex">She cried with <b>joy</b> when she heard the news.</div><div class="xj">彼女はその知らせを聞いて喜びのあまり泣きました。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">shed</span><span class="ps">動</span></div><div class="ja">（涙などを）流す</div><div class="ex">Many people <b>shed</b> tears at the end of the movie.</div><div class="xj">映画の最後で多くの人が涙を流しました。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">shout</span><span class="ps">動</span></div><div class="ja">叫ぶ；大声を出す</div><div class="ex">Please don’t <b>shout</b> in the library.</div><div class="xj">図書館で大声を出さないでください。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">tear</span><span class="ps">名</span></div><div class="ja">涙</div><div class="ex">Her eyes were full of <b>tears</b> after the game.</div><div class="xj">試合のあと、彼女の目は涙でいっぱいでした。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">wheat</span><span class="ps">名</span></div><div class="ja">小麦</div><div class="ex">Bread is usually made from <b>wheat</b>.</div><div class="xj">パンはふつう小麦から作られます。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">achieve</span><span class="ps">動</span></div><div class="ja">達成する；成し遂げる</div><div class="ex">She worked hard to <b>achieve</b> her goal.</div><div class="xj">彼女は目標を達成するために一生けんめい努力しました。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">aim</span><span class="ps">名</span></div><div class="ja">目標；目的</div><div class="ex">Our <b>aim</b> is to make our town cleaner.</div><div class="xj">私たちの目標は町をもっときれいにすることです。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">as a result of ～</span><span class="ps">熟</span></div><div class="ja">～の結果として</div><div class="ex"><b>As a result of</b> the heavy rain, the game was stopped.</div><div class="xj">大雨の結果、試合は中断されました。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">feel like ～</span><span class="ps">熟</span></div><div class="ja">～したい気がする</div><div class="ex">I <b>feel like</b> eating ice cream today.</div><div class="xj">今日はアイスクリームが食べたい気分です。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">forever</span><span class="ps">副</span></div><div class="ja">永遠に；いつまでも</div><div class="ex">I will remember this day <b>forever</b>.</div><div class="xj">私はこの日をいつまでも覚えているでしょう。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">guess</span><span class="ps">動</span></div><div class="ja">推測する；当てる；（～だと）思う</div><div class="ex">Can you <b>guess</b> the answer to this quiz?</div><div class="xj">このクイズの答えを推測できますか。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">insect</span><span class="ps">名</span></div><div class="ja">昆虫；虫</div><div class="ex">My brother likes catching <b>insects</b> in summer.</div><div class="xj">弟は夏に昆虫をつかまえるのが好きです。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">like</span><span class="ps">前</span><span class=star>★</span></div><div class="ja">～のような；～のように</div><div class="ex">I want to be a doctor <b>like</b> my father.</div><div class="xj">私は父のような医者になりたいです。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">live on</span><span class="ps">熟</span></div><div class="ja">生き続ける；（～を）食べて生きる</div><div class="ex">The memory of our trip will <b>live on</b> in our hearts.</div><div class="xj">旅行の思い出は私たちの心の中で生き続けるでしょう。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">publish</span><span class="ps">動</span></div><div class="ja">出版する；発表する</div><div class="ex">Her first book was <b>published</b> last year.</div><div class="xj">彼女の最初の本は去年出版されました。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">source</span><span class="ps">名</span></div><div class="ja">源；もと</div><div class="ex">This river is the main <b>source</b> of water for our town.</div><div class="xj">この川は私たちの町のおもな水の源です。</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">weapon</span><span class="ps">名</span></div><div class="ja">武器</div><div class="ex">Your smile is your best <b>weapon</b>.</div><div class="xj">あなたの笑顔はあなたの一番の武器です。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">women</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">女性たち（woman の複数形）</div><div class="ex">Three <b>women</b> are talking in the cafe.</div><div class="xj">3人の女性がカフェで話しています。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">effective</span><span class="ps">形</span></div><div class="ja">効果的な；効果のある</div><div class="ex">Walking every day is an <b>effective</b> way to stay healthy.</div><div class="xj">毎日歩くことは健康でいるための効果的な方法です。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">clinic</span><span class="ps">名</span></div><div class="ja">診療所；医院</div><div class="ex">I went to the <b>clinic</b> because I had a cold.</div><div class="xj">かぜをひいていたので、私は診療所に行きました。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">community center</span><span class="ps">熟</span></div><div class="ja">公民館；地域センター</div><div class="ex">We have a dance class at the <b>community center</b>.</div><div class="xj">私たちは公民館でダンス教室があります。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">croquette</span><span class="ps">名</span></div><div class="ja">コロッケ</div><div class="ex">My mother often makes potato <b>croquettes</b> for dinner.</div><div class="xj">母は夕食によくポテトコロッケを作ります。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">dry cleaner</span><span class="ps">熟</span></div><div class="ja">クリーニング店</div><div class="ex">My father took his suit to the <b>dry cleaner</b>.</div><div class="xj">父はスーツをクリーニング店に持っていきました。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">grilled</span><span class="ps">形</span></div><div class="ja">焼いた；網焼きの</div><div class="ex">I had <b>grilled</b> fish and rice for dinner.</div><div class="xj">私は夕食に焼き魚とごはんを食べました。</div></button></li></ol><nav class="pn"><a href="../19/">← 第19回</a><a href="../21/">第21回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"571": 4.28, "572": 17.94, "573": 30.53, "574": 43.97, "575": 56.76, "576": 70.53, "577": 84.71, "578": 98.0, "579": 111.65, "580": 124.87, "581": 138.09, "582": 150.64, "583": 164.15, "584": 177.51, "585": 192.51, "586": 205.97, "587": 219.31, "588": 232.58, "589": 246.18, "590": 260.53, "591": 275.76, "592": 289.7, "593": 303.31, "594": 315.86, "595": 329.87, "596": 344.62, "597": 358.28, "598": 373.15, "599": 386.49, "600": 399.78};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
