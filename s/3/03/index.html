</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第3回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.18〜22　No.61〜90</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">right now</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">今すぐ；ちょうど今</div><div class="ex">Please come here <b>right now</b>.</div><div class="xj">今すぐここに来てください。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">yet</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（否定文で）まだ；（疑問文で）もう</div><div class="ex">The bath isn’t ready <b>yet</b>.</div><div class="xj">おふろはまだ準備ができていません。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">already</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">すでに；もう</div><div class="ex">It is <b>already</b> dark at five in winter.</div><div class="xj">冬は5時でもう暗いです。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">diary</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">日記</div><div class="ex">My sister writes in her <b>diary</b> every night.</div><div class="xj">姉は毎晩日記を書いています。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">keep a diary</span><span class="ps">熟</span></div><div class="ja">日記をつける</div><div class="ex">I <b>kept a diary</b> during the summer vacation.</div><div class="xj">私は夏休みの間、日記をつけました。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">done</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">do の過去分詞</div><div class="ex">This job was <b>done</b> by Ken and Tom.</div><div class="xj">この仕事はケンとトムによってなされました。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">dry</span><span class="ps">形</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">かわいた；乾燥した</div><div class="ex">The air is very <b>dry</b> in winter.</div><div class="xj">冬は空気がとても乾燥しています。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">hair</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">かみの毛；毛</div><div class="ex">Dry your <b>hair</b> before you go to bed.</div><div class="xj">寝る前にかみの毛をかわかしなさい。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">hurry</span><span class="ps">動</span></div><div class="ja">急ぐ</div><div class="ex">We have to <b>hurry</b> to catch the train.</div><div class="xj">電車に間に合うように急がなければなりません。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">in a hurry</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">急いで</div><div class="ex">Ken left home <b>in a hurry</b> this morning.</div><div class="xj">ケンは今朝、急いで家を出ました。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">rope</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">なわ；ロープ</div><div class="ex">The children are jumping <b>rope</b> in the park.</div><div class="xj">子どもたちが公園でなわとびをしています。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">since</span><span class="ps">前</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">～以来；～から</div><div class="ex">Yesterday was the coldest day <b>since</b> last February.</div><div class="xj">昨日は去年の2月以来いちばん寒い日でした。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">title</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">題名；タイトル</div><div class="ex">What is the <b>title</b> of this song?</div><div class="xj">この歌の題名は何ですか。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">you’ve</span><span class="ps">代</span></div><div class="ja">you have の短縮形</div><div class="ex"><b>You’ve</b> seen this movie before, right?</div><div class="xj">あなたは前にこの映画を見たことがありますよね。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">long</span><span class="ps">副</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">長く；長い間</div><div class="ex">I can’t stay <b>long</b> today.</div><div class="xj">今日は長くはいられません。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">affect</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～に影響する</div><div class="ex">Using a smartphone at night can <b>affect</b> your sleep.</div><div class="xj">夜にスマートフォンを使うことは、睡眠に影響することがあります。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">at least</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">少なくとも</div><div class="ex">I read <b>at least</b> one book a month.</div><div class="xj">私は月に少なくとも1冊は本を読みます。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">health</span><span class="ps">名</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">健康</div><div class="ex">Walking is good for your <b>health</b>.</div><div class="xj">歩くことは健康によいです。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">lack</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">不足；欠乏</div><div class="ex">A <b>lack</b> of water is a big problem in this area.</div><div class="xj">この地域では水不足が大きな問題です。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">later on</span><span class="ps">熟</span></div><div class="ja">あとで；のちに</div><div class="ex">I’ll tell you about it <b>later on</b>.</div><div class="xj">そのことはあとで話しますね。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">least</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">いちばん少ない（little の最上級）</div><div class="ex">Ken has the <b>least</b> free time in his family.</div><div class="xj">ケンは家族の中で自由な時間がいちばん少ないです。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">make up for ～</span><span class="ps">熟</span><span class="ek">英2</span></div><div class="ja">～の埋め合わせをする；～を取り戻す</div><div class="ex">Ken bought me lunch to <b>make up for</b> his mistake.</div><div class="xj">ケンは自分のミスの埋め合わせをするために、昼食をおごってくれました。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">regular</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">規則正しい；定期的な；ふつうの</div><div class="ex">It is important to live a <b>regular</b> life.</div><div class="xj">規則正しい生活を送ることは大切です。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">sleep</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">睡眠；眠り</div><div class="ex">I didn’t get enough <b>sleep</b> last night.</div><div class="xj">昨夜は十分な睡眠がとれませんでした。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">tonight</span><span class="ps">副</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">今夜（は）</div><div class="ex">It will be very cold <b>tonight</b>.</div><div class="xj">今夜はとても寒くなるでしょう。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">be full of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～でいっぱいである</div><div class="ex">The park <b>was full of</b> families on Sunday.</div><div class="xj">日曜日、公園は家族連れでいっぱいでした。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">concentrate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">集中する</div><div class="ex">I can’t <b>concentrate</b> when the TV is on.</div><div class="xj">テレビがついていると集中できません。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">concentrate on ～</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">～に集中する</div><div class="ex">Let’s <b>concentrate on</b> the next game.</div><div class="xj">次の試合に集中しましょう。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">felt</span><span class="ps">動</span></div><div class="ja">feel の過去・過去分詞</div><div class="ex">I <b>felt</b> happy after the game.</div><div class="xj">試合のあと、私はうれしく感じました。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">habit</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">習慣；くせ</div><div class="ex">Reading before bed is a good <b>habit</b>.</div><div class="xj">寝る前に読書をするのはよい習慣です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"61": 4.19, "62": 17.12, "63": 30.92, "64": 43.9, "65": 57.07, "66": 70.58, "67": 83.92, "68": 97.4, "69": 110.38, "70": 122.9, "71": 135.6, "72": 148.6, "73": 163.43, "74": 176.29, "75": 189.7, "76": 202.87, "77": 217.05, "78": 229.62, "79": 241.98, "80": 255.85, "81": 268.59, "82": 283.2, "83": 299.2, "84": 313.26, "85": 326.39, "86": 338.72, "87": 352.56, "88": 365.78, "89": 379.6, "90": 393.26}, "TE": {"61": 6.06, "62": 18.99, "63": 32.79, "64": 45.77, "65": 59.06, "66": 72.45, "67": 85.79, "68": 99.27, "69": 112.25, "70": 124.78, "71": 137.47, "72": 150.47, "73": 165.3, "74": 178.16, "75": 191.57, "76": 204.74, "77": 218.92, "78": 231.5, "79": 243.85, "80": 257.72, "81": 270.46, "82": 285.17, "83": 301.08, "84": 315.14, "85": 328.26, "86": 340.64, "87": 354.44, "88": 367.94, "89": 381.48, "90": 395.13}, "Q": [[61, "今すぐ（2語で）", "right now"], [62, "（否定文で）まだ", "yet"], [63, "すでに", "already"], [64, "日記", "diary"], [65, "日記をつける（3語で）", "keep a diary"], [66, "do の過去分詞", "done"], [67, "かわいた", "dry"], [68, "かみの毛", "hair"], [69, "急ぐ", "hurry"], [70, "急いで（3語で）", "in a hurry"], [71, "なわ", "rope"], [72, "～以来", "since"], [73, "題名", "title"], [74, "you have の短縮形", "you’ve"], [75, "長く", "long"], [76, "～に影響する", "affect"], [77, "少なくとも（2語で）", "at least"], [78, "健康", "health"], [79, "不足", "lack"], [80, "あとで（2語で）", "later on"], [81, "いちばん少ない（little の最上級）", "least"], [82, "～の埋め合わせをする（3語で）", "make up for"], [83, "規則正しい", "regular"], [84, "睡眠", "sleep"], [85, "今
