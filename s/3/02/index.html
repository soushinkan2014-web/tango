</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第2回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.13〜18　No.31〜60</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">cause</span><span class="ps">動</span></div><div class="ja">～を引き起こす；～の原因となる</div><div class="ex">The heavy rain <b>caused</b> many problems.</div><div class="xj">大雨が多くの問題を引き起こしました。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">chain</span><span class="ps">名</span></div><div class="ja">チェーン（店）；鎖</div><div class="ex">This restaurant <b>chain</b> has shops all over Japan.</div><div class="xj">このレストランチェーンは日本中に店があります。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">chilled</span><span class="ps">形</span></div><div class="ja">冷やした；冷蔵の</div><div class="ex">I bought some <b>chilled</b> juice at the store.</div><div class="xj">私は店で冷えたジュースを買いました。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">few</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">ほとんど～ない；少数の</div><div class="ex">Very <b>few</b> people know this song.</div><div class="xj">この歌を知っている人はほとんどいません。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">food waste</span><span class="ps">熟</span></div><div class="ja">食品ロス；食べ物のむだ</div><div class="ex">Let’s think about <b>food waste</b> in our town.</div><div class="xj">私たちの町の食品ロスについて考えましょう。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">hear of ～</span><span class="ps">熟</span></div><div class="ja">～のことを聞く；～について聞く</div><div class="ex">Have you ever <b>heard of</b> this singer?</div><div class="xj">あなたは今までにこの歌手のことを聞いたことがありますか。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">heard</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">hear の過去・過去分詞</div><div class="ex">I <b>heard</b> the news from Ken.</div><div class="xj">私はその知らせをケンから聞きました。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">in stock</span><span class="ps">熟</span></div><div class="ja">在庫があって</div><div class="ex">Is this bag <b>in stock</b> now?</div><div class="xj">このかばんは今、在庫がありますか。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">more</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">もっと多くのこと；それ以上</div><div class="ex">Please tell me <b>more</b> about your trip.</div><div class="xj">あなたの旅行のことをもっと話してください。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">normal</span><span class="ps">形</span></div><div class="ja">ふつうの；標準の</div><div class="ex">Today was a <b>normal</b> day for me.</div><div class="xj">今日は私にとってふつうの一日でした。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">reduce</span><span class="ps">動</span></div><div class="ja">減らす</div><div class="ex">We can <b>reduce</b> waste by using our own bags.</div><div class="xj">自分のバッグを使うことで、ごみを減らすことができます。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">stock</span><span class="ps">名</span></div><div class="ja">在庫；たくわえ</div><div class="ex">The store has a large <b>stock</b> of rice.</div><div class="xj">その店には米の在庫がたくさんあります。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">variety</span><span class="ps">名</span></div><div class="ja">いろいろ（なもの）；多様性</div><div class="ex">This shop sells a <b>variety</b> of bread.</div><div class="xj">この店はいろいろなパンを売っています。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">fried vegetables</span><span class="ps">熟</span></div><div class="ja">野菜いため</div><div class="ex">My father cooked <b>fried vegetables</b> for dinner.</div><div class="xj">父は夕食に野菜いためを作りました。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">hamburger steak</span><span class="ps">熟</span></div><div class="ja">ハンバーグ</div><div class="ex"><b>Hamburger steak</b> is my favorite dish.</div><div class="xj">ハンバーグは私のいちばん好きな料理です。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">Japanese omelet</span><span class="ps">熟</span></div><div class="ja">卵焼き</div><div class="ex">Mom puts a <b>Japanese omelet</b> in my lunch box.</div><div class="xj">母は私のお弁当に卵焼きを入れてくれます。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">meatball</span><span class="ps">名</span></div><div class="ja">ミートボール；肉だんご</div><div class="ex">These <b>meatballs</b> taste really great.</div><div class="xj">このミートボールは本当においしいです。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">pickle</span><span class="ps">名</span></div><div class="ja">漬物；ピクルス</div><div class="ex">My grandmother makes <b>pickles</b> every winter.</div><div class="xj">祖母は毎年冬に漬物を作ります。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">pork cutlet</span><span class="ps">熟</span></div><div class="ja">とんかつ</div><div class="ex">I ate a <b>pork cutlet</b> before the big game.</div><div class="xj">大事な試合の前にとんかつを食べました。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">portion</span><span class="ps">名</span></div><div class="ja">（食べ物の）1人前；部分</div><div class="ex">The <b>portions</b> at this restaurant are very large.</div><div class="xj">このレストランの1人前の量はとても多いです。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">salmon</span><span class="ps">名</span></div><div class="ja">サケ；サーモン</div><div class="ex">I ate <b>salmon</b> for breakfast this morning.</div><div class="xj">今朝、朝ごはんにサケを食べました。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">salted plum</span><span class="ps">熟</span></div><div class="ja">梅干し</div><div class="ex">My rice ball has a <b>salted plum</b> in it.</div><div class="xj">私のおにぎりには梅干しが入っています。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">suggest</span><span class="ps">動</span></div><div class="ja">提案する</div><div class="ex">Ken <b>suggested</b> a new idea at the meeting.</div><div class="xj">ケンは会議で新しいアイデアを提案しました。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">sure</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">確信して；きっと～だと思って</div><div class="ex">I’m <b>sure</b> that our team will win.</div><div class="xj">私は私たちのチームが勝つと確信しています。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">chocolate</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">チョコレート</div><div class="ex">Emi gave me some <b>chocolate</b> on Valentine’s Day.</div><div class="xj">エミはバレンタインデーにチョコレートをくれました。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">has</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">（has＋過去分詞で）～したことがある</div><div class="ex">Yuki <b>has</b> visited Kyoto three times.</div><div class="xj">ユキは京都を3回訪れたことがあります。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">tight</span><span class="ps">形</span></div><div class="ja">きつい；（予定が）つまった</div><div class="ex">These shoes are too <b>tight</b> for me.</div><div class="xj">このくつは私にはきつすぎます。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">base</span><span class="ps">名</span></div><div class="ja">土台；基礎；基地</div><div class="ex">The <b>base</b> of this tower is very wide.</div><div class="xj">このタワーの土台はとても広いです。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">be based on ～</span><span class="ps">熟</span></div><div class="ja">～に基づいている</div><div class="ex">This movie <b>is based on</b> a true story.</div><div class="xj">この映画は実話に基づいています。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">gotten</span><span class="ps">動</span></div><div class="ja">get の過去分詞</div><div class="ex">Have you ever <b>gotten</b> a letter from abroad?</div><div class="xj">あなたは今までに海外から手紙をもらったことがありますか。</div></button></li></ol><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"31": 4.04, "32": 19.47, "33": 33.39, "34": 46.73, "35": 60.84, "36": 75.5, "37": 89.94, "38": 103.47, "39": 116.0, "40": 129.91, "41": 143.08, "42": 156.47, "43": 170.08, "44": 183.97, "45": 198.2, "46": 211.7, "47": 225.84, "48": 239.63, "49": 253.14, "50": 266.26, "51": 280.83, "52": 294.19, "53": 307.56, "54": 320.61, "55": 335.03, "56": 348.42, "57": 363.94, "58": 377.52, "59": 390.72, "60": 404.7};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
