</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第15回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.99〜104　No.421〜450</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">patient</span><span class="ps">名</span></div><div class="ja">患者；（形）がまん強い</div><div class="ex">The doctor is talking with a <b>patient</b>.</div><div class="xj">医者は患者と話しています。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">weak</span><span class="ps">形</span></div><div class="ja">弱い</div><div class="ex">Our team was <b>weak</b> last year, but now it is strong.</div><div class="xj">私たちのチームは去年は弱かったけれど、今は強いです。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">take a class</span><span class="ps">熟</span></div><div class="ja">授業を受ける</div><div class="ex">I <b>took a class</b> on robots last Saturday.</div><div class="xj">私はこの前の土曜日、ロボットについての授業を受けました。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">come true</span><span class="ps">熟</span></div><div class="ja">実現する；かなう</div><div class="ex">I hope your dream will <b>come true</b>.</div><div class="xj">あなたの夢がかなうといいですね。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">far away</span><span class="ps">熟</span></div><div class="ja">遠くに；遠く離れて</div><div class="ex">My best friend lives <b>far away</b> from here now.</div><div class="xj">私の親友は今、ここから遠く離れたところに住んでいます。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">emotion</span><span class="ps">名</span></div><div class="ja">感情</div><div class="ex">Music can express many kinds of <b>emotions</b>.</div><div class="xj">音楽は多くの種類の感情を表すことができます。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">grandchildren</span><span class="ps">名</span></div><div class="ja">孫たち（grandchild の複数形）</div><div class="ex">My grandmother has five <b>grandchildren</b>.</div><div class="xj">祖母には孫が5人います。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">imagination</span><span class="ps">名</span></div><div class="ja">想像力；想像</div><div class="ex">Use your <b>imagination</b> and draw a picture.</div><div class="xj">想像力を使って絵をかいてください。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">imagine</span><span class="ps">動</span></div><div class="ja">想像する</div><div class="ex">Can you <b>imagine</b> life without phones?</div><div class="xj">電話のない生活を想像できますか。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">mask</span><span class="ps">名</span></div><div class="ja">仮面；マスク</div><div class="ex">The dancers wore colorful <b>masks</b> at the festival.</div><div class="xj">踊り手たちはお祭りでカラフルな仮面をつけていました。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">probably</span><span class="ps">副</span></div><div class="ja">たぶん；おそらく</div><div class="ex">It will <b>probably</b> rain tomorrow.</div><div class="xj">明日はたぶん雨が降るでしょう。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">simple</span><span class="ps">形</span></div><div class="ja">簡単な；単純な；質素な</div><div class="ex">The rules of this game are very <b>simple</b>.</div><div class="xj">このゲームのルールはとても簡単です。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">various</span><span class="ps">形</span></div><div class="ja">さまざまな</div><div class="ex">People from <b>various</b> countries live in this city.</div><div class="xj">この市にはさまざまな国から来た人々が住んでいます。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">alone</span><span class="ps">副</span></div><div class="ja">ひとりで</div><div class="ex">Ken traveled <b>alone</b> to Hokkaido last summer.</div><div class="xj">ケンは去年の夏、ひとりで北海道を旅行しました。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">get along with ～</span><span class="ps">熟</span></div><div class="ja">～と仲よくする</div><div class="ex">Lisa <b>gets along with</b> everyone in her class.</div><div class="xj">リサはクラスのみんなと仲よくしています。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">certainly</span><span class="ps">副</span></div><div class="ja">確かに；（返事で）もちろん</div><div class="ex">This is <b>certainly</b> the best cake in town.</div><div class="xj">これは確かに町でいちばんおいしいケーキです。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">connect</span><span class="ps">動</span></div><div class="ja">つなぐ；結びつける</div><div class="ex">This bridge <b>connects</b> the two towns.</div><div class="xj">この橋は2つの町をつないでいます。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">inventor</span><span class="ps">名</span></div><div class="ja">発明者；発明家</div><div class="ex">Who was the <b>inventor</b> of the telephone?</div><div class="xj">電話の発明者はだれでしたか。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">itself</span><span class="ps">代</span></div><div class="ja">それ自身；それ自体</div><div class="ex">The house <b>itself</b> is old, but the kitchen is new.</div><div class="xj">家自体は古いですが、台所は新しいです。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">loneliness</span><span class="ps">名</span></div><div class="ja">孤独；さびしさ</div><div class="ex">I felt <b>loneliness</b> after my friend moved away.</div><div class="xj">友だちが引っ越したあと、私はさびしさを感じました。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">no longer ～</span><span class="ps">熟</span></div><div class="ja">もはや～ない；もう～ない</div><div class="ex">This old computer is <b>no longer</b> used.</div><div class="xj">この古いコンピューターはもう使われていません。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">not ～ but ...</span><span class="ps">熟</span></div><div class="ja">～ではなく…</div><div class="ex">Mr. Sato is <b>not a teacher but</b> a doctor.</div><div class="xj">佐藤さんは先生ではなく医者です。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">take part in ～</span><span class="ps">熟</span></div><div class="ja">～に参加する</div><div class="ex">Many students <b>took part in</b> the volunteer activity.</div><div class="xj">多くの生徒がボランティア活動に参加しました。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">rather</span><span class="ps">副</span></div><div class="ja">かなり；むしろ</div><div class="ex">It was <b>rather</b> cold this morning.</div><div class="xj">今朝はかなり寒かったです。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">society</span><span class="ps">名</span></div><div class="ja">社会</div><div class="ex">Robots will help our <b>society</b> in many ways.</div><div class="xj">ロボットはいろいろな方法で私たちの社会を助けるでしょう。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">much</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">（比較級を強めて）ずっと</div><div class="ex">This room is <b>much</b> bigger than mine.</div><div class="xj">この部屋は私の部屋よりずっと広いです。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">shrink</span><span class="ps">動</span></div><div class="ja">縮む</div><div class="ex">Some sweaters <b>shrink</b> in hot water.</div><div class="xj">お湯の中で縮むセーターもあります。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">trash can</span><span class="ps">熟</span></div><div class="ja">ごみ箱</div><div class="ex">Please throw this paper in the <b>trash can</b>.</div><div class="xj">この紙をごみ箱に捨ててください。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">document</span><span class="ps">名</span></div><div class="ja">文書；書類</div><div class="ex">Please read this <b>document</b> before the meeting.</div><div class="xj">会議の前にこの書類を読んでください。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">drive</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">運転する；車で送る</div><div class="ex">If I were an adult, I would <b>drive</b> to the sea.</div><div class="xj">もし私が大人なら、海まで車を運転して行くのに。</div></button></li></ol><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"421": 4.28, "422": 18.2, "423": 32.02, "424": 45.72, "425": 58.82, "426": 73.05, "427": 86.39, "428": 100.95, "429": 115.2, "430": 127.97, "431": 141.6, "432": 154.43, "433": 168.2, "434": 181.3, "435": 194.6, "436": 208.46, "437": 222.48, "438": 236.03, "439": 249.49, "440": 263.94, "441": 277.88, "442": 292.68, "443": 306.31, "444": 320.49, "445": 333.13, "446": 346.62, "447": 360.44, "448": 373.22, "449": 386.11, "450": 399.35};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
