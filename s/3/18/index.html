</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第18回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.116〜119　No.511〜540</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">perhaps</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">たぶん；もしかすると</div><div class="ex"><b>Perhaps</b> Ken is still at the library now.</div><div class="xj">たぶんケンは今もまだ図書館にいるでしょう。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">piggy</span><span class="ps">名</span></div><div class="ja">（piggy bank で）ブタの貯金箱；子ブタ</div><div class="ex">I put some coins in my <b>piggy</b> bank every week.</div><div class="xj">私は毎週ブタの貯金箱に硬貨を入れます。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">tag</span><span class="ps">名</span></div><div class="ja">札；値札</div><div class="ex">Look at the price <b>tag</b> on this shirt.</div><div class="xj">このシャツの値札を見て。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">worth</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">～の価値がある</div><div class="ex">This movie is <b>worth</b> watching again.</div><div class="xj">この映画はもう一度見る価値があります。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">affection</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">愛情；好意</div><div class="ex">The dog showed great <b>affection</b> for the children.</div><div class="xj">その犬は子どもたちに大きな愛情を示しました。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">invite</span><span class="ps">動</span><span class=star>★</span><span class="ek">英4</span></div><div class="ja">招待する；招く</div><div class="ex">Emi <b>invited</b> me to her birthday party.</div><div class="xj">エミは私を誕生日パーティーに招待してくれました。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">touch</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">感動させる；（心を）動かす</div><div class="ex">I was deeply <b>touched</b> by his kind words.</div><div class="xj">私は彼のやさしい言葉に深く感動しました。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">celebrate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">祝う</div><div class="ex">We <b>celebrated</b> my father’s birthday at home.</div><div class="xj">私たちは家で父の誕生日を祝いました。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">improbable</span><span class="ps">形</span></div><div class="ja">ありそうもない；起こりそうもない</div><div class="ex">His story sounds <b>improbable</b> to me.</div><div class="xj">彼の話は私にはありそうもないことに聞こえます。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">in a row</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">連続で；一列に</div><div class="ex">Our team won three games <b>in a row</b>.</div><div class="xj">私たちのチームは3試合連続で勝ちました。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">in the recent past</span><span class="ps">熟</span></div><div class="ja">最近；近ごろ</div><div class="ex">Many new shops have opened in this town <b>in the recent past</b>.</div><div class="xj">最近、この町には新しい店がたくさんできました。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">parody</span><span class="ps">名</span></div><div class="ja">パロディー；もじり</div><div class="ex">This funny song is a <b>parody</b> of an old song.</div><div class="xj">このおもしろい歌は古い歌のパロディーです。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">past</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">過去</div><div class="ex">We can learn a lot from the <b>past</b>.</div><div class="xj">私たちは過去から多くのことを学ぶことができます。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">recent</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">最近の</div><div class="ex">This is a <b>recent</b> photo of my family.</div><div class="xj">これは私の家族の最近の写真です。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">row</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">列</div><div class="ex">Ken always sits in the front <b>row</b>.</div><div class="xj">ケンはいつも前の列に座ります。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">serious</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">まじめな；深刻な</div><div class="ex">Mr. Sato is a <b>serious</b> teacher, but he sometimes tells jokes.</div><div class="xj">佐藤先生はまじめな先生ですが、ときどき冗談を言います。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">silly</span><span class="ps">形</span></div><div class="ja">ばかげた；おかしな</div><div class="ex">It was a <b>silly</b> mistake, so I laughed.</div><div class="xj">それはばかげたまちがいだったので、私は笑いました。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">surprisingly</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">驚いたことに；意外にも</div><div class="ex"><b>Surprisingly</b>, my little brother won the game.</div><div class="xj">驚いたことに、弟がその試合に勝ちました。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">unusual</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">珍しい；ふつうでない</div><div class="ex">It is <b>unusual</b> to see snow in this town.</div><div class="xj">この町で雪を見るのは珍しいことです。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">afterwards</span><span class="ps">副</span></div><div class="ja">その後；あとで</div><div class="ex">We played soccer and had lunch <b>afterwards</b>.</div><div class="xj">私たちはサッカーをして、その後昼食を食べました。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">audience</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">観客；聴衆</div><div class="ex">The <b>audience</b> enjoyed the concert very much.</div><div class="xj">観客はコンサートをとても楽しみました。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">bend</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">曲げる；曲がる</div><div class="ex">Please <b>bend</b> your knees a little.</div><div class="xj">ひざを少し曲げてください。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">bend over</span><span class="ps">熟</span></div><div class="ja">かがむ；前かがみになる</div><div class="ex">Ken <b>bent over</b> to pick up the pencil.</div><div class="xj">ケンは鉛筆を拾うためにかがみました。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">ceremony</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">式；儀式</div><div class="ex">The entrance <b>ceremony</b> was held in April.</div><div class="xj">入学式は4月に行われました。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">demonstration</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">実演；デモンストレーション</div><div class="ex">The chef gave us a cooking <b>demonstration</b>.</div><div class="xj">シェフが私たちに料理の実演をしてくれました。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">discovery</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">発見</div><div class="ex">Her <b>discovery</b> was very important for science.</div><div class="xj">彼女の発見は科学にとってとても重要でした。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">following</span><span class="ps">形</span></div><div class="ja">次の；以下の</div><div class="ex">We had a math test on the <b>following</b> day.</div><div class="xj">次の日に、私たちは数学のテストがありました。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">presentation</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">発表；プレゼンテーション</div><div class="ex">I will give a <b>presentation</b> in English tomorrow.</div><div class="xj">私は明日、英語で発表をします。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">scientific</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">科学的な；科学の</div><div class="ex">This book explains <b>scientific</b> ideas in an easy way.</div><div class="xj">この本は科学的な考えをやさしく説明しています。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">view</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">見方；意見</div><div class="ex">Your <b>view</b> is different from mine.</div><div class="xj">あなたの見方は私のとはちがいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../17/">← 第17回</a><a href="../19/">第19回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"511": 4.45, "512": 18.2, "513": 33.63, "514": 46.58, "515": 59.8, "516": 73.36, "517": 86.92, "518": 101.62, "519": 114.87, "520": 128.98, "521": 142.48, "522": 157.77, "523": 171.56, "524": 184.09, "525": 196.9, "526": 209.52, "527": 225.19, "528": 238.89, "529": 253.67, "530": 267.97, "531": 281.43, "532": 295.15, "533": 307.7, "534": 321.35, "535": 334.69, "536": 349.11, "537": 362.36, "538": 375.48, "539": 389.85, "540": 404.99}, "TE": {"511": 6.32, "512": 20.07, "513": 35.5, "514": 48.46, "515": 61.68, "516": 75.23, "517": 88.79, "518": 103.52, "519": 116.74, "520": 130.85, "521": 144.76, "522": 159.64, "523": 173.44, "524": 185.96, "525": 198.77, "526": 211.49, "527": 227.06, "528": 240.93, "529": 255.54, "530": 269.91, "531": 283.3, "532": 297.02, "533": 309.57, "534": 323.22, "535": 336.68, "536": 350.98, "537": 364.23, "538": 377.42, "539": 391.87, "540": 406.86}, "Q": [[511, "たぶん", "perhaps"], [512, "ブタの貯金箱（2語で）", "piggy bank"], [513, "札", "tag"], [514, "～の価値がある", "worth"], [515, "愛情", "affection"], [516, "招待する", "invite"], [517, "感動させる", "touch"], [518, "祝う", "celebrate"], [519, "ありそうもない", "improbable"], [520, "連続で（3語で）", "in a row"], [521, "最近（4語で）", "in the recent past"], [522, "パロディー", "parody"], [523, "過去", "past"], [524, "最近の", "recent"], [525, "列", "row"], [526, "まじめな", "serious"], [527, "ばかげた", "silly"], [528, "驚いたことに", "surprisingly"], [529, "珍しい", "unusual"], [530, "その後", "afterwards"], [53
