<b>tough</b>.</div><div class="xj">このかばんは軽いけれどとても丈夫です。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">quality</span><span class="ps">名</span></div><div class="ja">質；品質</div><div class="ex">This shop sells vegetables of high <b>quality</b>.</div><div class="xj">この店は品質の高い野菜を売っています。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">lift</span><span class="ps">動</span></div><div class="ja">持ち上げる</div><div class="ex">I can’t <b>lift</b> this heavy box.</div><div class="xj">私はこの重い箱を持ち上げられません。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">powerful</span><span class="ps">形</span></div><div class="ja">力強い；強力な</div><div class="ex">The singer has a <b>powerful</b> voice.</div><div class="xj">その歌手は力強い声をしています。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">vacuum cleaner</span><span class="ps">熟</span></div><div class="ja">掃除機</div><div class="ex">My father bought a new <b>vacuum cleaner</b> yesterday.</div><div class="xj">父は昨日、新しい掃除機を買いました。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">wish</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（I wish ～で）～ならいいのにと思う</div><div class="ex">I <b>wish</b> I could fly like a bird.</div><div class="xj">鳥のように飛べたらいいのに。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">wouldn’t</span><span class="ps">助</span></div><div class="ja">～しないだろう（would not の短縮形）</div><div class="ex">If I were you, I <b>wouldn’t</b> buy that expensive bag.</div><div class="xj">もし私があなたなら、あの高いかばんは買わないでしょう。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">abroad</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">外国に（で）；海外に（で）</div><div class="ex">My sister wants to study <b>abroad</b> in the future.</div><div class="xj">姉は将来、外国で勉強したがっています。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">band</span><span class="ps">名</span></div><div class="ja">バンド；楽団</div><div class="ex">Tom plays the drums in a rock <b>band</b>.</div><div class="xj">トムはロックバンドでドラムを演奏しています。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">belong</span><span class="ps">動</span></div><div class="ja">（～の）ものである；属する</div><div class="ex">This umbrella <b>belongs</b> to my father.</div><div class="xj">このかさは父のものです。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">belong to ～</span><span class="ps">熟</span></div><div class="ja">～に所属している；～のものである</div><div class="ex">I <b>belong to</b> the tennis team.</div><div class="xj">私はテニス部に所属しています。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">classroom</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">教室</div><div class="ex">Our <b>classroom</b> is on the third floor.</div><div class="xj">私たちの教室は3階にあります。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">dictionary</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">辞書</div><div class="ex">Can I use your <b>dictionary</b>?</div><div class="xj">あなたの辞書を使ってもいいですか。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">fever</span><span class="ps">名</span></div><div class="ja">熱</div><div class="ex">I stayed home because I had a <b>fever</b>.</div><div class="xj">私は熱があったので家にいました。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">shake hands with ～</span><span class="ps">熟</span></div><div class="ja">～と握手する</div><div class="ex">I <b>shook hands with</b> the famous player.</div><div class="xj">私はその有名な選手と握手しました。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">heater</span><span class="ps">名</span></div><div class="ja">暖房器具；ヒーター</div><div class="ex">It’s cold, so please turn on the <b>heater</b>.</div><div class="xj">寒いので、ヒーターをつけてください。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">musical</span><span class="ps">名</span></div><div class="ja">ミュージカル</div><div class="ex">We watched a <b>musical</b> in Tokyo last month.</div><div class="xj">私たちは先月、東京でミュージカルを見ました。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">rock</span><span class="ps">名</span></div><div class="ja">ロック（音楽）；岩</div><div class="ex">My brother likes <b>rock</b> music very much.</div><div class="xj">兄はロック音楽が大好きです。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">shake</span><span class="ps">動</span></div><div class="ja">振る；揺れる；揺らす</div><div class="ex"><b>Shake</b> the bottle well before you drink.</div><div class="xj">飲む前にびんをよく振ってください。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">vocalist</span><span class="ps">名</span></div><div class="ja">ボーカル；歌手</div><div class="ex">Emi is the <b>vocalist</b> of our school band.</div><div class="xj">エミは私たちの学校のバンドのボーカルです。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">control</span><span class="ps">動</span></div><div class="ja">コントロールする；操作する；管理する</div><div class="ex">You can <b>control</b> this robot with your phone.</div><div class="xj">このロボットは電話でコントロールできます。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">these days</span><span class="ps">熟</span></div><div class="ja">最近；このごろ</div><div class="ex"><b>These days</b>, many people read books on their phones.</div><div class="xj">最近、多くの人がスマートフォンで本を読みます。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">disease</span><span class="ps">名</span></div><div class="ja">病気</div><div class="ex">Doctors are working hard to stop this <b>disease</b>.</div><div class="xj">医師たちはこの病気を止めるために一生けんめい働いています。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">including</span><span class="ps">前</span></div><div class="ja">～を含めて</div><div class="ex">Ten people, <b>including</b> my sister, came to the party.</div><div class="xj">姉を含めて10人がパーティーに来ました。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">muscle</span><span class="ps">名</span></div><div class="ja">筋肉</div><div class="ex">Swimming is good for your <b>muscles</b>.</div><div class="xj">水泳は筋肉によいです。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">order</span><span class="ps">名</span></div><div class="ja">順番；順序；注文</div><div class="ex">Please put these cards in <b>order</b>.</div><div class="xj">これらのカードを順番に並べてください。</div></button></li></ol><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"391": 4.38, "392": 19.35, "393": 33.51, "394": 47.62, "395": 61.1, "396": 74.7, "397": 88.38, "398": 101.0, "399": 114.8, "400": 128.47, "401": 143.28, "402": 158.99, "403": 173.41, "404": 186.9, "405": 201.03, "406": 215.86, "407": 228.57, "408": 240.64, "409": 253.45, "410": 267.44, "411": 281.55, "412": 294.77, "413": 308.64, "414": 321.64, "415": 335.22, "416": 349.28, "417": 363.82, "418": 377.09, "419": 391.48, "420": 404.06};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}

document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });

  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
