</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第14回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.94〜99　No.391〜420</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">what’s more</span><span class="ps">熟</span></div><div class="ja">その上；さらに</div><div class="ex">The hotel was clean, and <b>what’s more</b>, the food was great.</div><div class="xj">そのホテルは清潔で、その上、料理もすばらしかったです。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">on sale</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">特売中で；販売されて</div><div class="ex">These shoes are <b>on sale</b> this week.</div><div class="xj">このくつは今週特売中です。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">opening</span><span class="ps">名</span></div><div class="ja">開店；開始；開会</div><div class="ex">Many people came to the <b>opening</b> of the new cake shop.</div><div class="xj">多くの人が新しいケーキ店の開店に来ました。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">sale</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">販売；特売；セール</div><div class="ex">The <b>sale</b> of tickets starts next Monday.</div><div class="xj">チケットの販売は次の月曜日に始まります。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">tough</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">丈夫な；頑丈な</div><div class="ex">This bag is light but very <b>tough</b>.</div><div class="xj">このかばんは軽いけれどとても丈夫です。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">quality</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">質；品質</div><div class="ex">This shop sells vegetables of high <b>quality</b>.</div><div class="xj">この店は品質の高い野菜を売っています。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">lift</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">持ち上げる</div><div class="ex">I can’t <b>lift</b> this heavy box.</div><div class="xj">私はこの重い箱を持ち上げられません。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">powerful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">力強い；強力な</div><div class="ex">The singer has a <b>powerful</b> voice.</div><div class="xj">その歌手は力強い声をしています。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">vacuum cleaner</span><span class="ps">熟</span></div><div class="ja">掃除機</div><div class="ex">My father bought a new <b>vacuum cleaner</b> yesterday.</div><div class="xj">父は昨日、新しい掃除機を買いました。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">wish</span><span class="ps">動</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">（I wish ～で）～ならいいのにと思う</div><div class="ex">I <b>wish</b> I could fly like a bird.</div><div class="xj">鳥のように飛べたらいいのに。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">wouldn’t</span><span class="ps">助</span></div><div class="ja">～しないだろう（would not の短縮形）</div><div class="ex">If I were you, I <b>wouldn’t</b> buy that expensive bag.</div><div class="xj">もし私があなたなら、あの高いかばんは買わないでしょう。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">abroad</span><span class="ps">副</span><span class=star>★</span><span class="ek">英3</span></div><div class="ja">外国に（で）；海外に（で）</div><div class="ex">My sister wants to study <b>abroad</b> in the future.</div><div class="xj">姉は将来、外国で勉強したがっています。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">band</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">バンド；楽団</div><div class="ex">Tom plays the drums in a rock <b>band</b>.</div><div class="xj">トムはロックバンドでドラムを演奏しています。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">belong</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（～の）ものである；属する</div><div class="ex">This umbrella <b>belongs</b> to my father.</div><div class="xj">このかさは父のものです。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">belong to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～に所属している；～のものである</div><div class="ex">I <b>belong to</b> the tennis team.</div><div class="xj">私はテニス部に所属しています。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">classroom</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">教室</div><div class="ex">Our <b>classroom</b> is on the third floor.</div><div class="xj">私たちの教室は3階にあります。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">dictionary</span><span class="ps">名</span><span class=star>★</span><span class="ek">英5</span></div><div class="ja">辞書</div><div class="ex">Can I use your <b>dictionary</b>?</div><div class="xj">あなたの辞書を使ってもいいですか。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">fever</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">熱</div><div class="ex">I stayed home because I had a <b>fever</b>.</div><div class="xj">私は熱があったので家にいました。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">shake hands with ～</span><span class="ps">熟</span></div><div class="ja">～と握手する</div><div class="ex">I <b>shook hands with</b> the famous player.</div><div class="xj">私はその有名な選手と握手しました。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">heater</span><span class="ps">名</span></div><div class="ja">暖房器具；ヒーター</div><div class="ex">It’s cold, so please turn on the <b>heater</b>.</div><div class="xj">寒いので、ヒーターをつけてください。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">musical</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ミュージカル</div><div class="ex">We watched a <b>musical</b> in Tokyo last month.</div><div class="xj">私たちは先月、東京でミュージカルを見ました。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">rock</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ロック（音楽）；岩</div><div class="ex">My brother likes <b>rock</b> music very much.</div><div class="xj">兄はロック音楽が大好きです。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">shake</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">振る；揺れる；揺らす</div><div class="ex"><b>Shake</b> the bottle well before you drink.</div><div class="xj">飲む前にびんをよく振ってください。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">vocalist</span><span class="ps">名</span></div><div class="ja">ボーカル；歌手</div><div class="ex">Emi is the <b>vocalist</b> of our school band.</div><div class="xj">エミは私たちの学校のバンドのボーカルです。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">control</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">コントロールする；操作する；管理する</div><div class="ex">You can <b>control</b> this robot with your phone.</div><div class="xj">このロボットは電話でコントロールできます。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">these days</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">最近；このごろ</div><div class="ex"><b>These days</b>, many people read books on their phones.</div><div class="xj">最近、多くの人がスマートフォンで本を読みます。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">disease</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">病気</div><div class="ex">Doctors are working hard to stop this <b>disease</b>.</div><div class="xj">医師たちはこの病気を止めるために一生けんめい働いています。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">including</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～を含めて</div><div class="ex">Ten people, <b>including</b> my sister, came to the party.</div><div class="xj">姉を含めて10人がパーティーに来ました。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">muscle</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">筋肉</div><div class="ex">Swimming is good for your <b>muscles</b>.</div><div class="xj">水泳は筋肉によいです。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">order</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">順番；順序；注文</div><div class="ex">Please put these cards in <b>order</b>.</div><div class="xj">これらのカードを順番に並べてください。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"391": 4.38, "392": 19.51, "393": 33.75, "394": 48.0, "395": 61.62, "396": 75.36, "397": 89.19, "398": 101.96, "399": 115.9, "400": 129.5, "401": 144.44, "402": 160.31, "403": 174.86, "404": 188.48, "405": 202.76, "406": 217.75, "407": 230.62, "408": 242.83, "409": 255.79, "410": 269.69, "411": 283.95, "412": 297.33, "413": 311.34, "414": 324.5, "415": 338.25, "416": 352.45, "417": 367.0, "418": 380.42, "419": 394.99, "420": 407.7}, "TE": {"391": 6.34, "392": 21.47, "393": 35.7, "394": 49.95, "395": 63.58, "396": 77.31, "397": 91.15, "398": 103.91, "399": 117.92, "400": 131.45, "401": 146.4, "402": 162.26, "403": 176.81, "404": 190.44, "405": 204.72, "406": 219.71, "407": 232.57, "408": 244.78, "409": 257.94, "410": 271.65, "411": 285.91, "412": 299.28, "413": 313.3, "414": 326.46, "415": 340.21, "416": 354.4, "417": 368.96, "418": 382.38, "419": 396.94, "420": 409.65}, "Q": [[391, "その上（2語で）", "what’s more"], [392, "特売中で（2語で）", "on sale"], [393, "開店", "opening"], [394, "販売", "sale"], [395, "丈夫な", "tough"], [396, "質", "quality"], [397, "持ち上げる", "lift"], [398, "力強い", "powerful"], [399, "掃除機（2語で）", "vacuum cleaner"], [400, "～ならいいのにと思う（2語で）", "I wish"], [401, "～しないだろう（would not の短縮形）", "wouldn’t"], [402, "外国に（で）", "abroad"], [403, "バンド", "band"], [404, "（～の）ものである", "belong"], [405, "～に所属している（2語で）", "belong to"], [406, "教室", "classroom"], [407, "辞書", "dictionary"], [408, "熱", "fever"], [409, "～と握
