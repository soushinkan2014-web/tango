</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第21回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.129〜131　No.601〜630</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">nursing home</span><span class="ps">熟</span></div><div class="ja">老人ホーム</div><div class="ex">We visited a <b>nursing home</b> and sang songs together.</div><div class="xj">私たちは老人ホームを訪れて、いっしょに歌を歌いました。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">pharmacy</span><span class="ps">名</span></div><div class="ja">薬局</div><div class="ex">You can buy this medicine at the <b>pharmacy</b>.</div><div class="xj">この薬は薬局で買えます。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">prawn</span><span class="ps">名</span></div><div class="ja">（大きな）エビ</div><div class="ex">These <b>prawns</b> are big and delicious.</div><div class="xj">これらのエビは大きくておいしいです。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">spring roll</span><span class="ps">熟</span></div><div class="ja">春巻き</div><div class="ex">Emi made some <b>spring rolls</b> for the party.</div><div class="xj">エミはパーティーのために春巻きを作りました。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">steamed meat dumpling</span><span class="ps">熟</span></div><div class="ja">肉まん；蒸した肉入りのまんじゅう</div><div class="ex">We ate hot <b>steamed meat dumplings</b> in Chinatown.</div><div class="xj">私たちは中華街で熱々の肉まんを食べました。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">subway</span><span class="ps">名</span></div><div class="ja">地下鉄</div><div class="ex">Let’s take the <b>subway</b> to the museum.</div><div class="xj">博物館まで地下鉄に乗りましょう。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">tower</span><span class="ps">名</span></div><div class="ja">塔；タワー</div><div class="ex">We can see the whole city from the <b>tower</b>.</div><div class="xj">そのタワーから町全体が見えます。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">flu</span><span class="ps">名</span></div><div class="ja">インフルエンザ</div><div class="ex">Ken is absent today because he has the <b>flu</b>.</div><div class="xj">ケンはインフルエンザにかかっているので、今日は欠席です。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">newspaper</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">新聞</div><div class="ex">My grandfather reads the <b>newspaper</b> every morning.</div><div class="xj">祖父は毎朝新聞を読みます。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">Spain</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">スペイン</div><div class="ex">Flamenco is a famous dance from <b>Spain</b>.</div><div class="xj">フラメンコはスペインの有名なおどりです。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">star</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">星；スター</div><div class="ex">We saw many <b>stars</b> from the top of the mountain.</div><div class="xj">私たちは山の頂上からたくさんの星を見ました。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">toad</span><span class="ps">名</span></div><div class="ja">ヒキガエル</div><div class="ex">A big <b>toad</b> was sitting in the garden after the rain.</div><div class="xj">雨のあと、大きなヒキガエルが庭にすわっていました。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">actor</span><span class="ps">名</span></div><div class="ja">俳優</div><div class="ex">My cousin wants to be an <b>actor</b> in the future.</div><div class="xj">私のいとこは将来俳優になりたがっています。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">actress</span><span class="ps">名</span></div><div class="ja">女優</div><div class="ex">The <b>actress</b> in this movie is very popular.</div><div class="xj">この映画の女優はとても人気があります。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">animator</span><span class="ps">名</span></div><div class="ja">アニメーター</div><div class="ex">An <b>animator</b> draws a lot of pictures for one anime.</div><div class="xj">アニメーターは1本のアニメのためにたくさんの絵をかきます。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">announcer</span><span class="ps">名</span></div><div class="ja">アナウンサー</div><div class="ex">The <b>announcer</b> spoke clearly on the radio.</div><div class="xj">そのアナウンサーはラジオではっきり話しました。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">architect</span><span class="ps">名</span></div><div class="ja">建築家</div><div class="ex">A famous <b>architect</b> designed this beautiful library.</div><div class="xj">有名な建築家がこの美しい図書館を設計しました。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">baker</span><span class="ps">名</span></div><div class="ja">パン職人；パン屋さん</div><div class="ex">The <b>baker</b> gets up at four every morning.</div><div class="xj">そのパン職人は毎朝4時に起きます。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">barber</span><span class="ps">名</span></div><div class="ja">理容師；床屋さん</div><div class="ex">The <b>barber</b> cut my hair very short.</div><div class="xj">理容師さんが私の髪をとても短く切りました。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">beautician</span><span class="ps">名</span></div><div class="ja">美容師</div><div class="ex">My sister is studying to be a <b>beautician</b>.</div><div class="xj">姉は美容師になるために勉強しています。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">calligraphy</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">書道；書写</div><div class="ex">We have a <b>calligraphy</b> class on Fridays.</div><div class="xj">私たちは金曜日に書道の授業があります。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">care worker</span><span class="ps">熟</span></div><div class="ja">介護士；介護福祉士</div><div class="ex"><b>Care workers</b> help old people every day.</div><div class="xj">介護士は毎日お年寄りを手助けしています。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">carpenter</span><span class="ps">名</span></div><div class="ja">大工</div><div class="ex">The <b>carpenter</b> built a wooden house by the lake.</div><div class="xj">その大工さんは湖のそばに木の家を建てました。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">cartoonist</span><span class="ps">名</span></div><div class="ja">漫画家</div><div class="ex">My dream is to become a <b>cartoonist</b>.</div><div class="xj">私の夢は漫画家になることです。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">composer</span><span class="ps">名</span></div><div class="ja">作曲家</div><div class="ex">The <b>composer</b> wrote this song for our school.</div><div class="xj">その作曲家が私たちの学校のためにこの歌を作りました。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">conductor</span><span class="ps">名</span></div><div class="ja">指揮者；車掌</div><div class="ex">The <b>conductor</b> stood in front of the orchestra.</div><div class="xj">指揮者がオーケストラの前に立ちました。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">dentist</span><span class="ps">名</span></div><div class="ja">歯科医；歯医者</div><div class="ex">I went to the <b>dentist</b> last week.</div><div class="xj">私は先週歯医者に行きました。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">designer</span><span class="ps">名</span></div><div class="ja">デザイナー</div><div class="ex">She is a <b>designer</b> who makes clothes for children.</div><div class="xj">彼女は子ども服を作るデザイナーです。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">diplomat</span><span class="ps">名</span></div><div class="ja">外交官</div><div class="ex">My uncle is a <b>diplomat</b> working in France.</div><div class="xj">おじはフランスで働いている外交官です。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">editor</span><span class="ps">名</span></div><div class="ja">編集者</div><div class="ex">The <b>editor</b> read the story carefully before it was published.</div><div class="xj">編集者は出版される前にその物語を注意深く読みました。</div></button></li></ol><nav class="pn"><a href="../20/">← 第20回</a><a href="../22/">第22回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"601": 4.57, "602": 18.49, "603": 31.32, "604": 44.11, "605": 57.48, "606": 73.94, "607": 86.56, "608": 99.58, "609": 112.61, "610": 126.0, "611": 139.15, "612": 152.51, "613": 165.95, "614": 178.95, "615": 192.0, "616": 205.68, "617": 218.66, "618": 232.29, "619": 246.13, "620": 259.64, "621": 272.5, "622": 285.74, "623": 300.07, "624": 313.14, "625": 325.96, "626": 339.06, "627": 352.37, "628": 365.23, "629": 378.5, "630": 391.7};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
