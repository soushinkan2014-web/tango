<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>中3 英単語 第16回｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }

</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第16回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.104〜109　No.451〜480</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">password</span><span class="ps">名</span></div><div class="ja">パスワード</div><div class="ex">Don’t tell your <b>password</b> to anyone.</div><div class="xj">自分のパスワードをだれにも教えてはいけません。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">access</span><span class="ps">名</span></div><div class="ja">アクセス；利用（の機会）；接近</div><div class="ex">You can get <b>access</b> to the Internet here.</div><div class="xj">ここではインターネットにアクセスできます。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">against</span><span class="ps">前</span></div><div class="ja">～に対して；～を相手に；～に反対して</div><div class="ex">Our team will play <b>against</b> Class 3-A in the final.</div><div class="xj">私たちのチームは決勝で3年A組を相手に試合をします。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">ball game tournament</span><span class="ps">熟</span></div><div class="ja">球技大会</div><div class="ex">Our class won the <b>ball game tournament</b>.</div><div class="xj">私たちのクラスが球技大会で優勝しました。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">exhibition</span><span class="ps">名</span></div><div class="ja">展示会；展覧会</div><div class="ex">We visited an art <b>exhibition</b> in Kyoto.</div><div class="xj">私たちは京都で美術展覧会を訪れました。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">inter-class</span><span class="ps">形</span></div><div class="ja">クラス対抗の</div><div class="ex">We are going to have an <b>inter-class</b> relay race.</div><div class="xj">私たちはクラス対抗リレーをする予定です。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">introduction</span><span class="ps">名</span></div><div class="ja">紹介；導入</div><div class="ex">The teacher made a short <b>introduction</b> of the new student.</div><div class="xj">先生は新しい生徒の短い紹介をしました。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">last</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">最後に；いちばん後に</div><div class="ex">Ken will run <b>last</b> in the class relay.</div><div class="xj">ケンはクラスリレーで最後に走ります。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">main</span><span class="ps">形</span></div><div class="ja">主な；主要な</div><div class="ex">The <b>main</b> event of the day was the relay race.</div><div class="xj">その日の主な行事はリレーでした。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">race</span><span class="ps">名</span></div><div class="ja">競走；レース</div><div class="ex">Ken came first in the 100-meter <b>race</b>.</div><div class="xj">ケンは100メートル競走で1位になりました。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">relay</span><span class="ps">動</span></div><div class="ja">（伝言などを）伝える；中継する</div><div class="ex">Please <b>relay</b> this message to Ms. Brown.</div><div class="xj">このメッセージをブラウン先生に伝えてください。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">several</span><span class="ps">形</span></div><div class="ja">いくつかの；数人の；何度か</div><div class="ex">I have visited Kyoto <b>several</b> times.</div><div class="xj">私は京都を何度か訪れたことがあります。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">gunman</span><span class="ps">名</span></div><div class="ja">銃を持った男；ガンマン</div><div class="ex">The <b>gunman</b> in this cowboy movie wears a big hat.</div><div class="xj">この西部劇に出てくる銃を持った男は大きなぼうしをかぶっています。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">schoolgirl</span><span class="ps">名</span></div><div class="ja">女子生徒；女子学生</div><div class="ex">The <b>schoolgirl</b> who is wearing a blue cap is my sister.</div><div class="xj">青いぼうしをかぶっている女子生徒は私の妹です。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">shot</span><span class="ps">動</span></div><div class="ja">（シュートを）打った；撃った（shoot の過去形・過去分詞）</div><div class="ex">Ken <b>shot</b> the ball, and it went into the goal.</div><div class="xj">ケンがボールをシュートし、それはゴールに入りました。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">word</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">言葉；単語</div><div class="ex">Her kind <b>words</b> made me happy.</div><div class="xj">彼女の優しい言葉で私はうれしくなりました。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">blog</span><span class="ps">名</span></div><div class="ja">ブログ</div><div class="ex">My cousin writes a <b>blog</b> about cooking.</div><div class="xj">私のいとこは料理についてのブログを書いています。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">freedom</span><span class="ps">名</span></div><div class="ja">自由</div><div class="ex">Everyone should have the <b>freedom</b> to learn.</div><div class="xj">だれもが学ぶ自由を持つべきです。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">freely</span><span class="ps">副</span></div><div class="ja">自由に</div><div class="ex">In this class, you can talk <b>freely</b> about your ideas.</div><div class="xj">この授業では、自分の考えについて自由に話せます。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">hide</span><span class="ps">動</span></div><div class="ja">隠れる；隠す</div><div class="ex">The cat <b>hid</b> under the bed.</div><div class="xj">ネコはベッドの下に隠れました。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">miserable</span><span class="ps">形</span></div><div class="ja">みじめな；ひどく不幸な</div><div class="ex">I felt <b>miserable</b> when I lost the game.</div><div class="xj">試合に負けたとき、私はみじめな気持ちになりました。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">northern</span><span class="ps">形</span></div><div class="ja">北の；北部の</div><div class="ex">It snows a lot in <b>northern</b> Japan.</div><div class="xj">日本の北部では雪がたくさん降ります。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">shawl</span><span class="ps">名</span></div><div class="ja">ショール；肩かけ</div><div class="ex">My grandmother gave me a pink <b>shawl</b>.</div><div class="xj">祖母は私にピンクのショールをくれました。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">award</span><span class="ps">名</span></div><div class="ja">賞</div><div class="ex">Emi won an <b>award</b> for her painting.</div><div class="xj">エミは自分の絵で賞をとりました。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">immediately</span><span class="ps">副</span></div><div class="ja">すぐに；ただちに</div><div class="ex">When the bell rang, the students <b>immediately</b> stood up.</div><div class="xj">ベルが鳴ると、生徒たちはすぐに立ち上がりました。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">miraculously</span><span class="ps">副</span></div><div class="ja">奇跡的に</div><div class="ex">The old tree <b>miraculously</b> survived the big typhoon.</div><div class="xj">その古い木は奇跡的に大きな台風を生きのびました。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">prize</span><span class="ps">名</span></div><div class="ja">（競技・くじなどの）賞；賞品</div><div class="ex">If I won first <b>prize</b>, I would buy a new guitar.</div><div class="xj">もし1等賞をとったら、新しいギターを買うのに。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">raise</span><span class="ps">動</span></div><div class="ja">上げる；育てる</div><div class="ex"><b>Raise</b> your hand if you have a question.</div><div class="xj">質問があれば手を上げてください。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">recover</span><span class="ps">動</span></div><div class="ja">回復する；元気になる</div><div class="ex">My grandfather has <b>recovered</b> from his cold.</div><div class="xj">祖父はかぜから回復しました。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">silent</span><span class="ps">形</span></div><div class="ja">静かな；無言の</div><div class="ex">The classroom was <b>silent</b> during the test.</div><div class="xj">テストの間、教室は静かでした。</div></button></li></ol><nav class="pn"><a href="../15/">← 第15回</a><a href="../17/">第17回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"451": 4.36, "452": 16.88, "453": 30.65, "454": 46.32, "455": 59.95, "456": 73.86, "457": 87.73, "458": 101.84, "459": 115.76, "460": 129.29, "461": 142.96, "462": 157.48, "463": 171.37, "464": 186.2, "465": 200.93, "466": 217.13, "467": 230.16, "468": 242.99, "469": 255.64, "470": 269.5, "471": 282.05, "472": 295.82, "473": 309.09, "474": 322.5, "475": 335.12, "476": 349.4, "477": 363.72, "478": 379.2, "479": 392.3, "480": 406.43};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
