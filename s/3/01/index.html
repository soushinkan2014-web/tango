</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第1回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.8〜13　No.1〜30</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">cream puff</span><span class="ps">熟</span></div><div class="ja">シュークリーム</div><div class="ex">My mother made <b>cream puffs</b> for us.</div><div class="xj">母が私たちにシュークリームを作ってくれました。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">eaten</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">eat の過去分詞</div><div class="ex">Rice is <b>eaten</b> in many countries.</div><div class="xj">米は多くの国で食べられています。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">eel</span><span class="ps">名</span></div><div class="ja">うなぎ</div><div class="ex">We had <b>eel</b> for dinner last night.</div><div class="xj">昨夜、夕食にうなぎを食べました。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">ever</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">今までに；これまでに；かつて</div><div class="ex">Have you <b>ever</b> climbed Mt. Fuji?</div><div class="xj">あなたは今までに富士山に登ったことがありますか。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">have</span><span class="ps">助</span><span class=star>★</span></div><div class="ja">（have＋過去分詞で）～したことがある</div><div class="ex">I <b>have</b> played tennis with Tom many times.</div><div class="xj">私はトムと何度もテニスをしたことがあります。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">haven’t</span><span class="ps">助</span></div><div class="ja">have not の短縮形</div><div class="ex">I <b>haven’t</b> visited Hokkaido before.</div><div class="xj">私は以前に北海道を訪れたことがありません。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">sell out ～</span><span class="ps">熟</span></div><div class="ja">売り切れる；～を売り切る</div><div class="ex">The concert tickets were <b>sold out</b> in ten minutes.</div><div class="xj">コンサートのチケットは10分で売り切れました。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">someone</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">だれか</div><div class="ex"><b>Someone</b> left an umbrella in the classroom.</div><div class="xj">だれかが教室にかさを忘れていきました。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">so-so</span><span class="ps">形</span></div><div class="ja">まあまあの</div><div class="ex">A: How was the movie?<br>B: It was <b>so-so</b>.</div><div class="xj">A：映画はどうでしたか。B：まあまあでした。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">been</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">be の過去分詞</div><div class="ex">Have you ever <b>been</b> to Okinawa?</div><div class="xj">あなたは今までに沖縄へ行ったことがありますか。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">chair</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">いす</div><div class="ex">Please carry these <b>chairs</b> to the gym.</div><div class="xj">これらのいすを体育館へ運んでください。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">marathon</span><span class="ps">名</span></div><div class="ja">マラソン</div><div class="ex">Lisa practices every morning for the <b>marathon</b>.</div><div class="xj">リサはマラソンに向けて毎朝練習しています。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">run a marathon</span><span class="ps">熟</span></div><div class="ja">マラソンを走る</div><div class="ex">My father <b>ran a marathon</b> last year.</div><div class="xj">父は去年、マラソンを走りました。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">move</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">～を動かす；移動させる</div><div class="ex">Please <b>move</b> your desk to the back of the room.</div><div class="xj">机を部屋の後ろへ動かしてください。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">musical instrument</span><span class="ps">熟</span></div><div class="ja">楽器</div><div class="ex">Can you play any <b>musical instruments</b>?</div><div class="xj">あなたは何か楽器を演奏できますか。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">never</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">決して～ない；一度も～ない</div><div class="ex">My sister <b>never</b> eats green peppers.</div><div class="xj">姉はピーマンを決して食べません。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">schoolyard</span><span class="ps">名</span></div><div class="ja">校庭</div><div class="ex">The students are playing soccer in the <b>schoolyard</b>.</div><div class="xj">生徒たちが校庭でサッカーをしています。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">suitcase</span><span class="ps">名</span></div><div class="ja">スーツケース</div><div class="ex">My <b>suitcase</b> is very heavy.</div><div class="xj">私のスーツケースはとても重いです。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">twice</span><span class="ps">副</span></div><div class="ja">2回；2度；2倍</div><div class="ex">I clean my room <b>twice</b> a week.</div><div class="xj">私は週に2回部屋をそうじします。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">window</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">窓</div><div class="ex">Can I open the <b>window</b>?</div><div class="xj">窓を開けてもいいですか。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">cherry blossom</span><span class="ps">熟</span></div><div class="ja">桜の花</div><div class="ex">The <b>cherry blossoms</b> are beautiful in April.</div><div class="xj">4月は桜の花が美しいです。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">colorful</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">色とりどりの；カラフルな</div><div class="ex">Lisa is wearing a <b>colorful</b> T-shirt.</div><div class="xj">リサは色とりどりのTシャツを着ています。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">noon</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">正午</div><div class="ex">Let’s meet at the station at <b>noon</b>.</div><div class="xj">正午に駅で会いましょう。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">or</span><span class="ps">接</span><span class=star>★</span></div><div class="ja">（命令文のあとで）さもないと</div><div class="ex">Hurry up, <b>or</b> you will be late for school.</div><div class="xj">急ぎなさい、さもないと学校に遅れますよ。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">starving</span><span class="ps">形</span></div><div class="ja">とてもおなかがすいた</div><div class="ex">I didn’t eat lunch, so I’m <b>starving</b>.</div><div class="xj">昼ごはんを食べなかったので、おなかがぺこぺこです。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">homemade</span><span class="ps">形</span></div><div class="ja">手作りの；自家製の</div><div class="ex">My grandmother sent me <b>homemade</b> jam.</div><div class="xj">祖母が手作りのジャムを送ってくれました。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">that</span><span class="ps">副</span><span class=star>★</span></div><div class="ja">そんなに；それほど</div><div class="ex">The test wasn’t <b>that</b> difficult.</div><div class="xj">テストはそんなに難しくありませんでした。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">train</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">電車；列車</div><div class="ex">I go to school by <b>train</b> every day.</div><div class="xj">私は毎日電車で学校に行きます。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">travel</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">旅行する</div><div class="ex">I want to <b>travel</b> around Japan someday.</div><div class="xj">いつか日本中を旅行したいです。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">a few ～</span><span class="ps">熟</span></div><div class="ja">少しの～；2、3の～</div><div class="ex">I stayed in Kyoto for <b>a few</b> days.</div><div class="xj">私は京都に2、3日滞在しました。</div></button></li></ol><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"1": 4.19, "2": 17.22, "3": 30.34, "4": 42.96, "5": 56.13, "6": 71.39, "7": 84.95, "8": 99.66, "9": 112.54, "10": 127.17, "11": 139.79, "12": 152.48, "13": 165.8, "14": 179.33, "15": 193.58, "16": 206.71, "17": 221.58, "18": 234.68, "19": 247.64, "20": 260.62, "21": 272.5, "22": 285.98, "23": 299.99, "24": 312.52, "25": 326.58, "26": 340.04, "27": 353.74, "28": 366.81, "29": 379.96, "30": 392.89};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
