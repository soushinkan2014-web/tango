</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>中3　第13回</h1><div class="sub">教科書 SUNSHINE（開隆堂） p.84〜94　No.361〜390</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div><div class="row2"><button class="btn" id="hide">意味をかくす</button></div></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">system</span><span class="ps">名</span></div><div class="ja">制度；仕組み；システム</div><div class="ex">This city has a good recycling <b>system</b>.</div><div class="xj">この市にはよいリサイクルの仕組みがあります。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">chose</span><span class="ps">動</span></div><div class="ja">選んだ（choose の過去形）</div><div class="ex">The bag I <b>chose</b> was too big.</div><div class="xj">私が選んだかばんは大きすぎました。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">future</span><span class="ps">形</span><span class=star>★</span></div><div class="ja">未来の；将来の</div><div class="ex">Ken talked about his <b>future</b> plans with his teacher.</div><div class="xj">ケンは先生と将来の計画について話しました。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">mainly</span><span class="ps">副</span></div><div class="ja">主に</div><div class="ex">The people in this town <b>mainly</b> work on farms.</div><div class="xj">この町の人々は主に農場で働いています。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">thing</span><span class="ps">名</span><span class=star>★</span></div><div class="ja">（things で）持ち物；身の回りのもの</div><div class="ex">Please take home the <b>things</b> you left in your locker.</div><div class="xj">ロッカーに置いている持ち物を家に持って帰ってください。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">impossible</span><span class="ps">形</span></div><div class="ja">不可能な</div><div class="ex">It is <b>impossible</b> for me to finish this work today.</div><div class="xj">今日この仕事を終えることは私には不可能です。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">recycle</span><span class="ps">動</span><span class=star>★</span></div><div class="ja">（～に）作り変える；再生する</div><div class="ex">This shop <b>recycles</b> old jeans into bags.</div><div class="xj">この店は古いジーンズをかばんに作り変えています。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">remove</span><span class="ps">動</span></div><div class="ja">取り除く；取り外す</div><div class="ex">We <b>removed</b> the stones from the field.</div><div class="xj">私たちは畑から石を取り除きました。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">swallow</span><span class="ps">動</span></div><div class="ja">飲み込む</div><div class="ex">Sea turtles sometimes <b>swallow</b> plastic bags.</div><div class="xj">ウミガメはときどきビニール袋を飲み込みます。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">throw ～ away</span><span class="ps">熟</span></div><div class="ja">～を捨てる</div><div class="ex">Don’t <b>throw away</b> the things you can still use.</div><div class="xj">まだ使えるものを捨てないで。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">mug</span><span class="ps">名</span></div><div class="ja">マグカップ</div><div class="ex">This is the <b>mug</b> my sister gave me.</div><div class="xj">これは姉が私にくれたマグカップです。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">activity</span><span class="ps">名</span></div><div class="ja">活動</div><div class="ex">Volunteer <b>activities</b> are popular at our school.</div><div class="xj">私たちの学校ではボランティア活動が人気です。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">food poisoning</span><span class="ps">熟</span></div><div class="ja">食中毒</div><div class="ex">My brother got <b>food poisoning</b> from old fish.</div><div class="xj">兄は古い魚で食中毒になりました。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">leftover</span><span class="ps">名</span></div><div class="ja">残り物；食べ残し</div><div class="ex">We ate the <b>leftovers</b> from last night’s dinner.</div><div class="xj">私たちは昨夜の夕食の残り物を食べました。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">purpose</span><span class="ps">名</span></div><div class="ja">目的</div><div class="ex">The <b>purpose</b> of this event is to clean the town.</div><div class="xj">この行事の目的は町をきれいにすることです。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">to-go box</span><span class="ps">熟</span></div><div class="ja">持ち帰り用の容器</div><div class="ex">Can I have a <b>to-go box</b> for this pizza?</div><div class="xj">このピザを入れる持ち帰り用の容器をもらえますか。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">measure</span><span class="ps">動</span></div><div class="ja">測る</div><div class="ex">The teacher <b>measured</b> the size of the room.</div><div class="xj">先生は部屋の大きさを測りました。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">challenge</span><span class="ps">名</span></div><div class="ja">挑戦；難題</div><div class="ex">Climbing Mt. Fuji was a big <b>challenge</b> for me.</div><div class="xj">富士山に登ることは私にとって大きな挑戦でした。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">extra</span><span class="ps">形</span></div><div class="ja">余分の；追加の</div><div class="ex">Do you have an <b>extra</b> pen?</div><div class="xj">余分のペンを持っていますか。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">anyone</span><span class="ps">代</span><span class=star>★</span></div><div class="ja">だれか；だれでも</div><div class="ex">Is there <b>anyone</b> who can speak Chinese?</div><div class="xj">中国語を話せる人はだれかいますか。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">suggestion</span><span class="ps">名</span></div><div class="ja">提案</div><div class="ex">The <b>suggestion</b> Emi made was very good.</div><div class="xj">エミが出した提案はとてもよかったです。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">announcement</span><span class="ps">名</span></div><div class="ja">発表；お知らせ；アナウンス</div><div class="ex">Please listen to the <b>announcement</b> carefully.</div><div class="xj">お知らせをよく聞いてください。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">choice</span><span class="ps">名</span></div><div class="ja">選択；選んだもの</div><div class="ex">You made a good <b>choice</b>.</div><div class="xj">あなたはよい選択をしましたね。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">compact</span><span class="ps">形</span></div><div class="ja">小型の；コンパクトな</div><div class="ex">This camera is <b>compact</b> and easy to carry.</div><div class="xj">このカメラは小型で持ち運びやすいです。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">even if ～</span><span class="ps">熟</span></div><div class="ja">たとえ～でも</div><div class="ex">I will go jogging <b>even if</b> it rains.</div><div class="xj">たとえ雨が降っても、私はジョギングに行きます。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">go with ～</span><span class="ps">熟</span></div><div class="ja">～と合う；～と一緒に行く</div><div class="ex">This bread <b>goes with</b> the soup very well.</div><div class="xj">このパンはスープにとてもよく合います。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">grand</span><span class="ps">形</span></div><div class="ja">壮大な；盛大な；大きな</div><div class="ex">We saw a <b>grand</b> old castle in Germany.</div><div class="xj">私たちはドイツで壮大な古い城を見ました。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">instant</span><span class="ps">形</span></div><div class="ja">インスタントの；即席の；すぐの</div><div class="ex">I had <b>instant</b> noodles for lunch.</div><div class="xj">私は昼食にインスタントラーメンを食べました。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">item</span><span class="ps">名</span></div><div class="ja">品物；項目</div><div class="ex">This shop has many popular <b>items</b>.</div><div class="xj">この店には人気の品物がたくさんあります。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">miss out on ～</span><span class="ps">熟</span></div><div class="ja">～を逃す</div><div class="ex">Don’t <b>miss out on</b> this chance to see the stars.</div><div class="xj">星を見るこのチャンスを逃さないで。</div></button></li></ol><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>
const a = document.getElementById('a'), T = {"361": 4.38, "362": 17.7, "363": 31.11, "364": 44.95, "365": 58.39, "366": 73.19, "367": 86.63, "368": 102.01, "369": 115.68, "370": 129.38, "371": 142.77, "372": 155.44, "373": 168.76, "374": 182.77, "375": 196.9, "376": 210.05, "377": 223.75, "378": 236.54, "379": 250.33, "380": 262.71, "381": 275.86, "382": 288.91, "383": 302.16, "384": 314.94, "385": 329.03, "386": 342.34, "387": 357.27, "388": 371.11, "389": 384.79, "390": 398.46};
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r; document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('rate', b.dataset.r); } catch (e) {} });
try { const r = localStorage.getItem('rate'); if (r) document.querySelector('.sp[data-r="' + r + '"]').click(); } catch (e) {}
a.addEventListener('play', () => { const on = document.querySelector('.sp.on'); if (on) a.playbackRate = +on.dataset.r; });
document.getElementById('hide').onclick = e => { document.body.classList.toggle('hide'); e.target.classList.toggle('on'); e.target.textContent = document.body.classList.contains('hide') ? '意味を見せる' : '意味をかくす'; };
const btns = [...document.querySelectorAll('.w')];
btns.forEach(b => b.onclick = () => { const t = T[b.dataset.no]; if (t !== undefined) { a.currentTime = t; a.play(); } });
a.addEventListener('timeupdate', () => { let cur = null; for (const b of btns) { const t = T[b.dataset.no]; if (t !== undefined && a.currentTime >= t - 0.05) cur = b; }
  btns.forEach(b => b.classList.toggle('now', b === cur)); });
</script></body></html>
