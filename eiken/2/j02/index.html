い</div><div class="ex">The movie was so funny that I couldn&#x27;t help laughing.</div><div class="xj">その映画はとてもおもしろくて、笑わずにはいられなかった。</div></button></li><li><button class="w" data-no="熟16"><div class="top"><span class="no">熟16</span><span class="en">have no choice but to ～</span></div><div class="ja">～するしかない</div><div class="ex">The last train had left, so we had no choice but to take a taxi.</div><div class="xj">終電が出てしまったので、私たちはタクシーに乗るしかなかった。</div></button></li><li><button class="w" data-no="熟17"><div class="top"><span class="no">熟17</span><span class="en">be worth ～ing</span></div><div class="ja">～する価値がある</div><div class="ex">This book is worth reading again and again.</div><div class="xj">この本は何度も読む価値がある。</div></button></li><li><button class="w" data-no="熟18"><div class="top"><span class="no">熟18</span><span class="en">have yet to ～</span></div><div class="ja">まだ～していない</div><div class="ex">I have yet to finish my report.</div><div class="xj">私はまだレポートを終えていない。</div></button></li><li><button class="w" data-no="熟19"><div class="top"><span class="no">熟19</span><span class="en">It is no use ～ing</span></div><div class="ja">～してもむだだ</div><div class="ex">It is no use crying over the result now.</div><div class="xj">今さら結果を嘆いてもむだだ。</div></button></li><li><button class="w" data-no="熟20"><div class="top"><span class="no">熟20</span><span class="en">be bound to ～</span></div><div class="ja">きっと～する</div><div class="ex">If you keep practicing, you are bound to improve.</div><div class="xj">練習を続ければ、きっと上達する。</div></button></li><li><button class="w" data-no="会6"><div class="top"><span class="no">会6</span><span class="en">I was wondering if ～.</span></div><div class="ja">～していただけないかと思いまして。（ていねいな依頼）</div><div class="ex">A: Hello, Mr. Smith. I was wondering if you could check my essay.<br>B: Of course. Bring it to the teachers&#x27; room after lunch.</div></button></li><li><button class="w" data-no="会7"><div class="top"><span class="no">会7</span><span class="en">Would you mind if I ～?</span></div><div class="ja">～してもかまいませんか？（答えの Not at all. は「どうぞ」）</div><div class="ex">A: Would you mind if I closed the window?<br>B: Not at all. It&#x27;s a little cold in here.</div></button></li><li><button class="w" data-no="会8"><div class="top"><span class="no">会8</span><span class="en">Could you possibly ～?</span></div><div class="ja">～していただけないでしょうか？</div><div class="ex">A: Could you possibly lend me your notes from yesterday?<br>B: Sure. I&#x27;ll bring them tomorrow.</div></button></li><li><button class="w" data-no="会9"><div class="top"><span class="no">会9</span><span class="en">Do you think you could ～?</span></div><div class="ja">～してもらえないかな？</div><div class="ex">A: Do you think you could help me move on Sunday?<br>B: Sorry, I have a club game that day.</div></button></li><li><button class="w" data-no="会10"><div class="top"><span class="no">会10</span><span class="en">Could you help me out with ～?</span></div><div class="ja">～を手伝ってもらえない？</div><div class="ex">A: Could you help me out with my science project?<br>B: Sure. What do you need?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j01/">← 熟語 Set 1</a><a href="../j03/">熟語 Set 3 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟11": 4.93, "熟12": 20.07, "熟13": 33.68, "熟14": 48.24, "熟15": 63.31, "熟16": 78.28, "熟17": 94.36, "熟18": 108.85, "熟19": 121.97, "熟20": 136.85, "会6": 150.72, "会7": 175.14, "会8": 198.08, "会9": 216.38, "会10": 233.39}, "TE": {"熟11": 6.8, "熟12": 22.02, "熟13": 35.55, "熟14": 50.76, "熟15": 65.61, "熟16": 80.66, "熟17": 96.66, "熟18": 110.72, "熟19": 124.54, "熟20": 138.72, "会6": 152.9, "会7": 177.06, "会8": 199.95, "会9": 218.25, "会10": 235.45}, "Q": [["熟11", "rather than ～", "～よりむしろ、～ではなく"], ["熟12", "more or less", "ほぼ、だいたい"], ["熟13", "no more than ～", "わずか～、～しか"], ["熟14", "not so much A as B", "AというよりむしろB"], ["熟15", "can't help ～ing", "～せずにはいられない"], ["熟16", "hav
