div><div class="ex">Two nurses are on duty at night.</div><div class="xj">夜は2人の看護師が勤務している。</div></button></li><li><button class="w" data-no="熟116"><div class="top"><span class="no">熟116</span><span class="en">in honor of ～</span></div><div class="ja">～をたたえて、～に敬意を表して</div><div class="ex">A party was held in honor of the retiring principal.</div><div class="xj">退職する校長先生をたたえてパーティーが開かれた。</div></button></li><li><button class="w" data-no="熟117"><div class="top"><span class="no">熟117</span><span class="en">on the go</span></div><div class="ja">休みなく動き回って</div><div class="ex">My mother is always on the go, so she rarely sits down.</div><div class="xj">母はいつも動き回っていて、めったに座らない。</div></button></li><li><button class="w" data-no="熟118"><div class="top"><span class="no">熟118</span><span class="en">at the mercy of ～</span></div><div class="ja">～のなすがままで</div><div class="ex">Small boats are at the mercy of the waves in a storm.</div><div class="xj">嵐の中では、小さな船は波のなすがままだ。</div></button></li><li><button class="w" data-no="熟119"><div class="top"><span class="no">熟119</span><span class="en">in effect</span></div><div class="ja">（規則などが）実施されて、有効で</div><div class="ex">The new school rules will be in effect from April.</div><div class="xj">新しい校則は4月から実施される。</div></button></li><li><button class="w" data-no="熟120"><div class="top"><span class="no">熟120</span><span class="en">side by side</span></div><div class="ja">並んで</div><div class="ex">The two friends walked side by side along the river.</div><div class="xj">2人の友だちは川沿いを並んで歩いた。</div></button></li><li><button class="w" data-no="会56"><div class="top"><span class="no">会56</span><span class="en">Not that I know of.</span></div><div class="ja">私の知る限りではそうではない。</div><div class="ex">A: Is there a test in English class tomorrow?<br>B: Not that I know of.</div></button></li><li><button class="w" data-no="会57"><div class="top"><span class="no">会57</span><span class="en">I have no idea.</span></div><div class="ja">まったくわからない。</div><div class="ex">A: Where did Tom go?<br>B: I have no idea. He was here a minute ago.</div></button></li><li><button class="w" data-no="会58"><div class="top"><span class="no">会58</span><span class="en">I&#x27;m not sure if ～.</span></div><div class="ja">～かどうかわからない。</div><div class="ex">A: Is Emily coming to the party?<br>B: I&#x27;m not sure if she can come. She&#x27;s been sick.</div></button></li><li><button class="w" data-no="会59"><div class="top"><span class="no">会59</span><span class="en">Let me see.</span></div><div class="ja">ええと。（考えるとき）</div><div class="ex">A: What time does the movie start?<br>B: Let me see. It starts at 6:30.</div></button></li><li><button class="w" data-no="会60"><div class="top"><span class="no">会60</span><span class="en">I&#x27;ll find out.</span></div><div class="ja">調べてみるね。</div><div class="ex">A: Do you know when the library closes?<br>B: No, but I&#x27;ll find out for you.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j11/">← 熟語 Set 11</a><a href="../j13/">熟語 Set 13 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟111": 5.15, "熟112": 19.45, "熟113": 32.31, "熟114": 46.54, "熟115": 63.48, "熟116": 75.98, "熟117": 92.05, "熟118": 106.76, "熟119": 121.13, "熟120": 135.96, "会56": 150.02, "会57": 167.32, "会58": 185.07, "会59": 203.25, "会60": 221.77}, "TE": {"熟111": 7.02, "熟112": 21.42, "熟113": 34.18, "熟114": 49.1, "熟115": 65.35, "熟116": 77.85, "熟117": 93.92, "熟118": 108.78, "熟119": 123.0, "熟120": 138.12, "会56": 152.13, "会57": 169.52, "会58": 187.04, "会59": 205.12, "会60": 223.64}, "Q": [["熟111", "in person", "本人が直接、じかに"], ["熟112", "on and off", "断続的に"], ["熟113", "well off", "裕福な"], ["熟114", "on good terms (with ～)", "仲がよい、良好な関係で"], ["熟115", "on duty", "勤務中で"], ["熟116", "in honor of ～", "～をたたえて、～に敬意を表して"], ["熟117", "on the go", "休みなく動き回って"], ["熟118", "at the mercy of ～", "～のなすがままで"], ["熟119", "in effect", "実施されて、有効で"], ["熟120", "side
