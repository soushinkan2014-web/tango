</div><div class="ja">～にうんざりしている</div><div class="ex">I&#x27;m fed up with this rainy weather.</div><div class="xj">この雨続きの天気にはうんざりだ。</div></button></li><li><button class="w" data-no="熟176"><div class="top"><span class="no">熟176</span><span class="en">break up with ～</span></div><div class="ja">～と別れる</div><div class="ex">She broke up with her boyfriend last month.</div><div class="xj">彼女は先月恋人と別れた。</div></button></li><li><button class="w" data-no="熟177"><div class="top"><span class="no">熟177</span><span class="en">look back on ～</span></div><div class="ja">～を振り返る</div><div class="ex">When I look back on my junior high school days, I remember the sports festival most.</div><div class="xj">中学時代を振り返ると、体育祭がいちばん思い出される。</div></button></li><li><button class="w" data-no="熟178"><div class="top"><span class="no">熟178</span><span class="en">take pride in ～</span></div><div class="ja">～に誇りを持つ</div><div class="ex">The farmers take pride in their rice.</div><div class="xj">その農家の人たちは自分たちの米に誇りを持っている。</div></button></li><li><button class="w" data-no="熟179"><div class="top"><span class="no">熟179</span><span class="en">speak ill of ～</span></div><div class="ja">～の悪口を言う</div><div class="ex">It is not nice to speak ill of others behind their backs.</div><div class="xj">陰で他人の悪口を言うのはよくない。</div></button></li><li><button class="w" data-no="熟180"><div class="top"><span class="no">熟180</span><span class="en">give in (to ～)</span></div><div class="ja">（～に）屈する、（根負けして）折れる</div><div class="ex">My father finally gave in and let me keep the cat.</div><div class="xj">父はついに折れて、私にその猫を飼わせてくれた。</div></button></li><li><button class="w" data-no="会86"><div class="top"><span class="no">会86</span><span class="en">I couldn&#x27;t agree more.</span></div><div class="ja">大賛成です。</div><div class="ex">A: We should recycle more at school.<br>B: I couldn&#x27;t agree more.</div></button></li><li><button class="w" data-no="会87"><div class="top"><span class="no">会87</span><span class="en">I&#x27;m with you on that.</span></div><div class="ja">その点はあなたと同じ意見です。</div><div class="ex">A: Students need more time to sleep.<br>B: I&#x27;m with you on that.</div></button></li><li><button class="w" data-no="会88"><div class="top"><span class="no">会88</span><span class="en">I see your point, but ～.</span></div><div class="ja">言いたいことはわかるけど、～。</div><div class="ex">A: Phones should not be allowed at school.<br>B: I see your point, but they can be useful in emergencies.</div></button></li><li><button class="w" data-no="会89"><div class="top"><span class="no">会89</span><span class="en">That&#x27;s not true.</span></div><div class="ja">そんなことはないよ。</div><div class="ex">A: I&#x27;m terrible at drawing.<br>B: That&#x27;s not true. Your pictures are great.</div></button></li><li><button class="w" data-no="会90"><div class="top"><span class="no">会90</span><span class="en">You have a point.</span></div><div class="ja">一理あるね。</div><div class="ex">A: Buying a used bike would save us money.<br>B: You have a point. Let&#x27;s look at some.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j17/">← 熟語 Set 17</a><a href="../j19/">熟語 Set 19 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟171": 5.32, "熟172": 19.33, "熟173": 33.15, "熟174": 46.25, "熟175": 60.48, "熟176": 73.91, "熟177": 87.2, "熟178": 102.92, "熟179": 116.45, "熟180": 130.87, "会86": 146.08, "会87": 162.08, "会88": 179.36, "会89": 199.27, "会90": 216.56}, "TE": {"熟171": 7.26, "熟172": 21.25, "熟173": 35.02, "熟174": 48.38, "熟175": 62.44, "熟176": 75.78, "熟177": 89.1, "熟178": 104.82, "熟179": 118.37, "熟180": 132.74, "会86": 148.27, "会87": 164.12, "会88": 181.8, "会89": 201.21, "会90": 218.46}, "Q": [["熟171", "to one's regret", "残念なことに"], ["熟172", "look down on ～", "～を見下す"], ["熟173", "let ～ down", "～をがっかりさせる"], ["熟174", "lose one's temper", "かっとなる"], ["熟175", "be fed up with ～", "～にうんざりしている"], ["熟176", "break up with ～", "～と別れる"],
