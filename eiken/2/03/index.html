</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第3回</h1><div class="sub">No.121〜180</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">launch</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を開始する；発売する；打ち上げる</div><div class="ex">The city <b>launched</b> a new recycling program this year.</div><div class="xj">市は今年、新しいリサイクル計画を開始した。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">derive</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（derive from で）～に由来する</div><div class="ex">Many English words <b>derive</b> from old French words.</div><div class="xj">多くの英単語は、古いフランス語の単語に由来する。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">accomplish</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を成し遂げる</div><div class="ex">We <b>accomplished</b> our goal of cleaning the whole beach.</div><div class="xj">私たちは浜辺全体を掃除するという目標を成し遂げた。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">alter</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を変える；作り直す</div><div class="ex">We had to <b>alter</b> our plans because of the rain.</div><div class="xj">雨のため、私たちは計画を変えなければならなかった。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">resolve</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を解決する；決心する</div><div class="ex">The two friends talked and <b>resolved</b> the problem.</div><div class="xj">2人の友だちは話し合って、問題を解決した。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">occupy</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を占める；使用する</div><div class="ex">Large bookshelves <b>occupy</b> most of the room.</div><div class="xj">大きな本棚が部屋の大部分を占めている。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">boost</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を高める；押し上げる</div><div class="ex">Winning the game <b>boosted</b> the team&#x27;s confidence.</div><div class="xj">試合に勝ったことが、チームの自信を高めた。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">engage</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">従事する；（be engaged で）婚約している</div><div class="ex">Many people in this town <b>engage</b> in fishing.</div><div class="xj">この町の多くの人は漁業に従事している。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">conceal</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を隠す</div><div class="ex">Emi tried to <b>conceal</b> the present behind her back.</div><div class="xj">エミはプレゼントを背中の後ろに隠そうとした。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">isolate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を孤立させる；隔離する</div><div class="ex">The heavy snow <b>isolated</b> the small village for three days.</div><div class="xj">大雪がその小さな村を3日間孤立させた。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">overlap</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">重なり合う</div><div class="ex">The two club meetings <b>overlap</b> on Fridays.</div><div class="xj">2つの部のミーティングは、金曜日に重なり合う。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">reproduce</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を再現する；繁殖する</div><div class="ex">The museum <b>reproduced</b> a street from 100 years ago.</div><div class="xj">その博物館は、100年前の通りを再現した。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">reschedule</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～の予定を変更する</div><div class="ex">We had to <b>reschedule</b> the meeting for next Monday.</div><div class="xj">私たちは会議の予定を変更して、来週の月曜日にしなければならなかった。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">classify</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を分類する</div><div class="ex">The students <b>classified</b> the leaves by their shapes.</div><div class="xj">生徒たちは、木の葉を形によって分類した。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">misunderstand</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を誤解する</div><div class="ex">Please don&#x27;t <b>misunderstand</b> me; I really like your idea.</div><div class="xj">誤解しないでください。あなたの案は本当にいいと思います。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">execute</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を実行する</div><div class="ex">The students <b>executed</b> their plan for the festival perfectly.</div><div class="xj">生徒たちは文化祭の計画を完璧に実行した。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">flee</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">逃げる</div><div class="ex">The birds <b>fled</b> when the cat came near.</div><div class="xj">ネコが近づくと、鳥たちは逃げた。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">irritate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をいらいらさせる</div><div class="ex">The loud music next door <b>irritated</b> my father.</div><div class="xj">隣の家の大きな音楽が父をいらいらさせた。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">rearrange</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を並べかえる；～の予定を変える</div><div class="ex">We <b>rearranged</b> the desks for the group work.</div><div class="xj">私たちはグループ活動のために机を並べかえた。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">resign</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">辞職する</div><div class="ex">Our coach <b>resigned</b> after ten years with the team.</div><div class="xj">コーチはチームで10年間務めたあと、辞職した。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">representative</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">代表者；担当者</div><div class="ex">Emi was chosen as the class <b>representative</b> for the meeting.</div><div class="xj">エミはその会議のクラス代表者に選ばれた。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">restriction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">制限</div><div class="ex">There is a <b>restriction</b> on the number of books you can borrow.</div><div class="xj">借りられる本の数には制限がある。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">disappointment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">失望</div><div class="ex">Ken could not hide his <b>disappointment</b> after the game.</div><div class="xj">ケンは試合のあと、失望を隠せなかった。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">reflection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">反射；反映；熟考</div><div class="ex">The <b>reflection</b> of the sun on the snow was very bright.</div><div class="xj">雪に当たる日光の反射がとてもまぶしかった。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">proportion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">割合；比率</div><div class="ex">A large <b>proportion</b> of the town&#x27;s people are over sixty.</div><div class="xj">その町の住民のかなりの割合が60歳を超えている。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">denial</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">否定；拒否</div><div class="ex">Ken&#x27;s quick <b>denial</b> of the story surprised everyone.</div><div class="xj">ケンがその話をすぐに否定したので、みんな驚いた。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">urgency</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">緊急（性）</div><div class="ex">The doctor quickly understood the <b>urgency</b> of the situation.</div><div class="xj">医者はすぐに、その状況の緊急性を理解した。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">narrative</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">物語；話</div><div class="ex">The book is a moving <b>narrative</b> about a family.</div><div class="xj">その本は、ある家族についての感動的な物語だ。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">surgery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">手術</div><div class="ex">My grandfather had <b>surgery</b> on his knee last month.</div><div class="xj">祖父は先月、ひざの手術を受けた。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">scale</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">規模；目盛り</div><div class="ex">This year&#x27;s festival will be held on a large <b>scale</b>.</div><div class="xj">今年の祭りは大きな規模で開かれる。</div></button></li><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">manuscript</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">原稿；写本</div><div class="ex">The writer finished the <b>manuscript</b> of her new book.</div><div class="xj">その作家は新しい本の原稿を書き上げた。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">composition</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">構成；作文；作曲</div><div class="ex">The <b>composition</b> of our team changed a lot this year.</div><div class="xj">今年、私たちのチームの構成は大きく変わった。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">tragedy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">悲劇</div><div class="ex">The play we saw last night was a <b>tragedy</b>.</div><div class="xj">昨夜私たちが見た劇は悲劇だった。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">genius</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">天才</div><div class="ex">Everyone in my class says Tom is a <b>genius</b> at math.</div><div class="xj">クラスのみんなが、トムは数学の天才だと言う。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">psychologist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">心理学者</div><div class="ex">The <b>psychologist</b> studies how children learn new words.</div><div class="xj">その心理学者は、子どもが新しい言葉をどのように覚えるかを研究している。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">divorce</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">離婚</div><div class="ex">The number of <b>divorces</b> in Japan has changed over the years.</div><div class="xj">日本の離婚の数は、年とともに変化してきた。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">injection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">注射</div><div class="ex">The nurse gave me an <b>injection</b> in my arm.</div><div class="xj">看護師が私の腕に注射をした。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">immigrant</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（外国からの）移民</div><div class="ex">Many <b>immigrants</b> came to this city to find work.</div><div class="xj">多くの移民が、仕事を求めてこの都市にやって来た。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">replacement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">交換（品）；後任</div><div class="ex">The store gave me a <b>replacement</b> for the broken cup.</div><div class="xj">店は割れたカップの交換品をくれた。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">triumph</span><spa
