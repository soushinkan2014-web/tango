st.</div><div class="xj">トムは私の助言を無視して、道に迷った。</div></button></li><li><button class="w" data-no="復365"><div class="top"><span class="no">復365</span><span class="en">recover</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">回復する；～を取り戻す</div><div class="ex">Lisa quickly <b>recovered</b> from her cold.</div><div class="xj">リサはかぜからすぐに回復した。</div></button></li><li><button class="w" data-no="復366"><div class="top"><span class="no">復366</span><span class="en">heal</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（傷など）を治す；治る</div><div class="ex">This medicine will help <b>heal</b> the cut on your finger.</div><div class="xj">この薬は指の切り傷を治すのに役立つ。</div></button></li><li><button class="w" data-no="復367"><div class="top"><span class="no">復367</span><span class="en">pour</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を注ぐ；（雨が）激しく降る</div><div class="ex">Mom <b>poured</b> hot tea into my cup.</div><div class="xj">母は私のカップに熱いお茶を注いだ。</div></button></li><li><button class="w" data-no="復368"><div class="top"><span class="no">復368</span><span class="en">broadcast</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を放送する</div><div class="ex">The game will be <b>broadcast</b> live on TV tonight.</div><div class="xj">その試合は今夜、テレビで生放送される。</div></button></li><li><button class="w" data-no="復369"><div class="top"><span class="no">復369</span><span class="en">extend</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を延長する；伸ばす</div><div class="ex">The library <b>extended</b> its opening hours.</div><div class="xj">図書館は開館時間を延長した。</div></button></li><li><button class="w" data-no="復370"><div class="top"><span class="no">復370</span><span class="en">promote</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を促進する；～を昇進させる</div><div class="ex">The city made posters to <b>promote</b> recycling.</div><div class="xj">市はリサイクルを促進するためにポスターを作った。</div></button></li><li><button class="w" data-no="復371"><div class="top"><span class="no">復371</span><span class="en">aim</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（aim to do）～することを目指す</div><div class="ex">Our team <b>aims</b> to win the city tournament.</div><div class="xj">私たちのチームは市の大会で優勝することを目指している。</div></button></li><li><button class="w" data-no="復372"><div class="top"><span class="no">復372</span><span class="en">cure</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（病気・病人）を治す</div><div class="ex">This medicine can <b>cure</b> your cold in a few days.</div><div class="xj">この薬は数日でかぜを治すことができる。</div></button></li><li><button class="w" data-no="復373"><div class="top"><span class="no">復373</span><span class="en">pretend</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～のふりをする</div><div class="ex">My little brother <b>pretended</b> to be a lion.</div><div class="xj">弟はライオンのふりをした。</div></button></li><li><button class="w" data-no="復374"><div class="top"><span class="no">復374</span><span class="en">attach</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を取り付ける；（メールに）～を添付する</div><div class="ex">Ken <b>attached</b> a light to his bike.</div><div class="xj">ケンは自転車にライトを取り付けた。</div></button></li><li><button class="w" data-no="復375"><div class="top"><span class="no">復375</span><span class="en">scene</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">場面；現場</div><div class="ex">This is my favorite <b>scene</b> in the movie.</div><div class="xj">これはその映画で私のいちばん好きな場面だ。</div></button></li><li><button class="w" data-no="復376"><div class="top"><span class="no">復376</span><span class="en">assignment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">宿題；割り当てられた仕事</div><div class="ex">I have to finish my math <b>assignment</b> by Friday.</div><div class="xj">金曜日までに数学の宿題を終えなければならない。</div></button></li><li><button class="w" data-no="復377"><div class="top"><span class="no">復377</span><span class="en">beauty</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">美しさ</div><div class="ex">We were moved by the <b>beauty</b> of the mountains.</div><div class="xj">私たちは山々の美しさに感動した。</div></button></li><li><button class="w" data-no="復378"><div class="top"><span class="no">復378</span><span class="en">improvement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">改善；向上</div><div class="ex">Our school lunch menu needs some <b>improvement</b>.</div><div class="xj">学校給食の献立には改善が必要だ。</div></button></li><li><button class="w" data-no="復379"><div class="top"><span class="no">復379</span><span class="en">disease</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">病気</div><div class="ex">Heart <b>disease</b> is common among older people.</div><div class="xj">心臓の病気は高齢者に多い。</div></button></li><li><button class="w" data-no="復380"><div class="top"><span class="no">復380</span><span class="en">period</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">期間；時代</div><div class="ex">You can borrow books for a <b>period</b> of two weeks.</div><div class="xj">本は2週間の期間借りることができる。</div></button></li><li><button class="w" data-no="復381"><div class="top"><span class="no">復381</span><span class="en">payment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">支払い</div><div class="ex"><b>Payment</b> by card is not accepted at this shop.</div><div class="xj">この店ではカードでの支払いはできない。</div></button></li><li><button class="w" data-no="復382"><div class="top"><span class="no">復382</span><span class="en">average</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">平均</div><div class="ex">The <b>average</b> of our test scores was 70.</div><div class="xj">私たちのテストの点数の平均は70点だった。</div></button></li><li><button class="w" data-no="復38
