>（病気）にかかる</div><div class="ex">I think I&#x27;m coming down with a cold.</div><div class="xj">かぜをひきかけているみたいだ。</div></button></li><li><button class="w" data-no="熟186"><div class="top"><span class="no">熟186</span><span class="en">turn down ～</span></div><div class="ja">～を断る</div><div class="ex">She turned down the job offer because it was too far from home.</div><div class="xj">家から遠すぎたので、彼女はその仕事の申し出を断った。</div></button></li><li><button class="w" data-no="熟187"><div class="top"><span class="no">熟187</span><span class="en">run into ～</span></div><div class="ja">～に偶然会う</div><div class="ex">I ran into Mr. Tanaka at the supermarket yesterday.</div><div class="xj">昨日スーパーで田中先生にばったり会った。</div></button></li><li><button class="w" data-no="熟188"><div class="top"><span class="no">熟188</span><span class="en">give ～ a hand</span></div><div class="ja">～に手を貸す</div><div class="ex">Could you give me a hand with these boxes?</div><div class="xj">この箱を運ぶのを手伝ってくれる？</div></button></li><li><button class="w" data-no="熟189"><div class="top"><span class="no">熟189</span><span class="en">hang out (with ～)</span></div><div class="ja">（～と）遊ぶ、いっしょに過ごす</div><div class="ex">I often hang out with my friends at the mall on weekends.</div><div class="xj">週末はよく友だちとショッピングモールで過ごす。</div></button></li><li><button class="w" data-no="熟190"><div class="top"><span class="no">熟190</span><span class="en">get the hang of ～</span></div><div class="ja">～のこつをつかむ</div><div class="ex">Skiing was hard at first, but I soon got the hang of it.</div><div class="xj">スキーは最初は難しかったが、すぐにこつをつかんだ。</div></button></li><li><button class="w" data-no="会91"><div class="top"><span class="no">会91</span><span class="en">Actually, ～.</span></div><div class="ja">実は、～。</div><div class="ex">A: Did you enjoy the trip?<br>B: Actually, it rained every day, so we stayed at the hotel.</div></button></li><li><button class="w" data-no="会92"><div class="top"><span class="no">会92</span><span class="en">I&#x27;ll be sure to ～.</span></div><div class="ja">必
