/div><div class="ex">Students account for about half of the library&#x27;s users.</div><div class="xj">学生がその図書館の利用者の約半分を占めている。</div></button></li><li><button class="w" data-no="熟56"><div class="top"><span class="no">熟56</span><span class="en">owing to ～</span></div><div class="ja">～のために、～が原因で</div><div class="ex">The game was canceled owing to the rain.</div><div class="xj">試合は雨のために中止された。</div></button></li><li><button class="w" data-no="熟57"><div class="top"><span class="no">熟57</span><span class="en">thanks to ～</span></div><div class="ja">～のおかげで</div><div class="ex">Thanks to your help, I finished the work early.</div><div class="xj">あなたが手伝ってくれたおかげで、早く仕事が終わった。</div></button></li><li><button class="w" data-no="熟58"><div class="top"><span class="no">熟58</span><span class="en">contribute to ～</span></div><div class="ja">～に貢献する、～の一因となる</div><div class="ex">Many volunteers contributed to the success of the festival.</div><div class="xj">多くのボランティアがお祭りの成功に貢献した。</div></button></li><li><button class="w" data-no="熟59"><div class="top"><span class="no">熟59</span><span class="en">have an effect on ～</span></div><div class="ja">～に影響を与える</div><div class="ex">Music can have a good effect on our mood.</div><div class="xj">音楽は気分によい影響を与えることがある。</div></button></li><li><button class="w" data-no="熟60"><div class="top"><span class="no">熟60</span><span class="en">interfere with ～</span></div><div class="ja">～をじゃまする、～を妨げる</div><div class="ex">Using a phone late at night can interfere with your sleep.</div><div class="xj">夜遅くに電話を使うと、睡眠が妨げられることがある。</div></button></li><li><button class="w" data-no="会26"><div class="top"><span class="no">会26</span><span class="en">How may I help you?</span></div><div class="ja">ご用件をうかがいます。（店・電話の受付）</div><div class="ex">A: Good morning. Sunny Travel. How may I help you?<br>B: Hi. I&#x27;d like to book a tour to Kyoto.</div></button></li><li><button class="w" data-no="会27"><div class="top"><span class="no">会27</span><span class="en">I&#x27;d like to make an appointment.</span></div><div class="ja">予約を取りたいのですが。（病院・美容院など）</div><div class="ex">A: I&#x27;d like to make an appointment for a haircut.<br>B: Sure. When would you like to come in?</div></button></li><li><button class="w" data-no="会28"><div class="top"><span class="no">会28</span><span class="en">Could you put me through to ～?</span></div><div class="ja">～につないでいただけますか？（電話）</div><div class="ex">A: Could you put me through to the sales department?<br>B: Certainly. Please wait a moment.</div></button></li><li><button class="w" data-no="会29"><div class="top"><span class="no">会29</span><span class="en">Hold on, please.</span></div><div class="ja">（電話で）少々お待ちください。</div><div class="ex">A: Is Ms. Hill there?<br>B: Hold on, please. I&#x27;ll get her.</div></button></li><li><button class="w" data-no="会30"><div class="top"><span class="no">会30</span><span class="en">Thank you for calling.</span></div><div class="ja">お電話ありがとうございます。</div><div class="ex">A: Thank you for calling Blue Sky Hotel.<br>B: Hello. I have a question about my reservation.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j05/">← 熟語 Set 5</a><a href="../j07/">熟語 Set 7 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟51": 5.27, "熟52": 20.65, "熟53": 34.9, "熟54": 48.58, "熟55": 62.56, "熟56": 78.69, "熟57": 93.23, "熟58": 106.59, "熟59": 122.74, "熟60": 136.75, "会26": 152.52, "会27": 175.5, "会28": 197.0, "会29": 216.98, "会30": 234.78}, "TE": {"熟51": 7.14, "熟52": 22.52, "熟53": 36.77, "熟54": 50.45, "熟55": 64.46, "熟56": 80.56, "熟57": 95.1, "熟58": 108.46, "熟59": 124.73, "熟60": 138.67, "会26": 154.39, "会27": 177.85, "会28": 199.04, "会29": 219.16, "会30": 236.75}, "Q": [["熟51", "lead to ～", "～につながる、～を引き起こす"], ["熟52", "result in ～", "～になる"], ["熟53", "result from ～", "～から生じる"], ["熟54", "bring about ～", "～をもたらす"], ["熟55", "account for ～", "～を占める、～を説明する"], ["熟56", "owing to ～", "～のために、～が原
