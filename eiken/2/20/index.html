</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第20回</h1><div class="sub">No.1141〜1200</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1141"><div class="top"><span class="no">1141</span><span class="en">pinch</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をつねる</div><div class="ex">My brother <b>pinched</b> my arm as a joke.</div><div class="xj">弟がふざけて私の腕をつねった。</div></button></li><li><button class="w" data-no="1142"><div class="top"><span class="no">1142</span><span class="en">tempt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を誘惑する</div><div class="ex">The smell of fresh bread <b>tempted</b> me to go into the bakery.</div><div class="xj">焼きたてのパンのにおいに誘惑されて、私はパン屋に入った。</div></button></li><li><button class="w" data-no="1143"><div class="top"><span class="no">1143</span><span class="en">bump</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ぶつかる</div><div class="ex">The shopping cart <b>bumped</b> against the wall.</div><div class="xj">ショッピングカートが壁にぶつかった。</div></button></li><li><button class="w" data-no="1144"><div class="top"><span class="no">1144</span><span class="en">swear</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">誓う</div><div class="ex">Ken <b>swore</b> that he would never be late again.</div><div class="xj">ケンは、二度と遅刻しないと誓った。</div></button></li><li><button class="w" data-no="1145"><div class="top"><span class="no">1145</span><span class="en">evaporate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">蒸発する</div><div class="ex">Water <b>evaporates</b> quickly when the sun is strong.</div><div class="xj">日差しが強いと、水は速く蒸発する。</div></button></li><li><button class="w" data-no="1146"><div class="top"><span class="no">1146</span><span class="en">pardon</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を許す</div><div class="ex">Please <b>pardon</b> me for calling you so late at night.</div><div class="xj">こんな夜遅くに電話したことを許してください。</div></button></li><li><button class="w" data-no="1147"><div class="top"><span class="no">1147</span><span class="en">furnish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に家具を備えつける</div><div class="ex">They <b>furnished</b> the room with a desk and a bed.</div><div class="xj">彼らはその部屋に、机とベッドを備えつけた。</div></button></li><li><button class="w" data-no="1148"><div class="top"><span class="no">1148</span><span class="en">recur</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">再発する；繰り返される</div><div class="ex">If the pain <b>recurs</b>, please come back to the hospital.</div><div class="xj">痛みが再発したら、また病院に来てください。</div></button></li><li><button class="w" data-no="1149"><div class="top"><span class="no">1149</span><span class="en">dine</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">食事をする</div><div class="ex">We <b>dined</b> at a nice restaurant on my birthday.</div><div class="xj">私の誕生日に、私たちはすてきなレストランで食事をした。</div></button></li><li><button class="w" data-no="1150"><div class="top"><span class="no">1150</span><span class="en">inject</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を注射する</div><div class="ex">The nurse <b>injected</b> the medicine into my arm.</div><div class="xj">看護師が私の腕に薬を注射した。</div></button></li><li><button class="w" data-no="1151"><div class="top"><span class="no">1151</span><span class="en">purify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を浄化する</div><div class="ex">This machine <b>purifies</b> the water in the pool.</div><div class="xj">この機械は、プールの水を浄化する。</div></button></li><li><button class="w" data-no="1152"><div class="top"><span class="no">1152</span><span class="en">soak</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を浸す</div><div class="ex"><b>Soak</b> the beans in water for one night before cooking.</div><div class="xj">料理する前に、豆を一晩水に浸しておきなさい。</div></button></li><li><button class="w" data-no="1153"><div class="top"><span class="no">1153</span><span class="en">bid</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（値）をつける；入札する</div><div class="ex">Tom <b>bid</b> 5,000 yen for the old guitar online.</div><div class="xj">トムはネットで、その古いギターに5,000円の値をつけた。</div></button></li><li><button class="w" data-no="1154"><div class="top"><span class="no">1154</span><span class="en">clarify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を明らかにする</div><div class="ex">The teacher <b>clarified</b> the rules of the game before we started.</div><div class="xj">始める前に、先生はゲームのルールを明らかにした。</div></button></li><li><button class="w" data-no="1155"><div class="top"><span class="no">1155</span><span class="en">boast</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">自慢する</div><div class="ex">Tom often <b>boasts</b> about his new smartphone.</div><div class="xj">トムはよく、新しいスマートフォンのことを自慢する。</div></button></li><li><button class="w" data-no="1156"><div class="top"><span class="no">1156</span><span class="en">depict</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を描く；描写する</div><div class="ex">This painting <b>depicts</b> life in a small village long ago.</div><div class="xj">この絵は、昔の小さな村の暮らしを描いている。</div></button></li><li><button class="w" data-no="1157"><div class="top"><span class="no">1157</span><span class="en">supervise</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を監督する</div><div class="ex">Two teachers <b>supervise</b> the students during lunch.</div><div class="xj">昼食の間は、2人の先生が生徒たちを監督する。</div></button></li><li><button class="w" data-no="1158"><div class="top"><span class="no">1158</span><span class="en">remodel</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を改築する</div><div class="ex">We are going to <b>remodel</b> our kitchen this summer.</div><div class="xj">この夏、うちは台所を改築する予定だ。</div></button></li><li><button class="w" data-no="1159"><div class="top"><span class="no">1159</span><span class="en">refresh</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の気分をさわやかにする</div><div class="ex">A cool shower will <b>refresh</b> you after a long run.</div><div class="xj">長く走ったあとは、冷たいシャワーで気分がさわやかになるよ。</div></button></li><li><button class="w" data-no="1160"><div class="top"><span class="no">1160</span><span class="en">leak</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">漏れる；～を漏らす</div><div class="ex">Water was <b>leaking</b> from the roof after the storm.</div><div class="xj">嵐のあと、屋根から水が漏れていた。</div></button></li><li><button class="w" data-no="1161"><div class="top"><span class="no">1161</span><span class="en">brilliance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">輝き；才気</div><div class="ex">The <b>brilliance</b> of the stars surprised the city children.</div><div class="xj">星の輝きに、都会の子どもたちは驚いた。</div></button></li><li><button class="w" data-no="1162"><div class="top"><span class="no">1162</span><span class="en">gossip</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">うわさ話</div><div class="ex">Emi doesn&#x27;t like to listen to <b>gossip</b> about her friends.</div><div class="xj">エミは、友だちについてのうわさ話を聞くのが好きではない。</div></button></li><li><button class="w" data-no="1163"><div class="top"><span class="no">1163</span><span class="en">nursery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">保育園；育児室</div><div class="ex">My mother takes my little sister to the <b>nursery</b> every morning.</div><div class="xj">母は毎朝、妹を保育園に連れて行く。</div></button></li><li><button class="w" data-no="1164"><div class="top"><span class="no">1164</span><span class="en">gang</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ギャング；一団</div><div class="ex">In the movie, a <b>gang</b> tries to steal a famous painting.</div><div class="xj">その映画では、ギャングが有名な絵を盗もうとする。</div></button></li><li><button class="w" data-no="1165"><div class="top"><span class="no">1165</span><span class="en">protester</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">抗議者</div><div class="ex"><b>Protesters</b> asked the city to save the old trees in the park.</div><div class="xj">抗議者たちは、公園の古い木を守るよう市に求めた。</div></button></li><li><button class="w" data-no="1166"><div class="top"><span class="no">1166</span><span class="en">adoption</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">採用；養子縁組</div><div class="ex">The <b>adoption</b> of the new rule made the meetings shorter.</div><div class="xj">新しいルールの採用で、会議が短くなった。</div></button></li><li><button class="w" data-no="1167"><div class="top"><span class="no">1167</span><span class="en">intake</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">摂取（量）</div><div class="ex">Doctors say we should reduce our salt <b>intake</b>.</div><div class="xj">医者は、塩分の摂取量を減らすべきだと言っている。</div></button></li><li><button class="w" data-no="1168"><div class="top"><span class="no">1168</span><span class="en">declaration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宣言</div><div class="ex">The class made a <b>declaration</b> that they would stop using plastic bags.</div><div class="xj">そのクラスは、レジ袋を使うのをやめるという宣言をした。</div></button></li><li><button class="w" data-no="1169"><div class="top"><span class="no">1169</span><span class="en">greed</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欲張り；強欲</div><div class="ex">The story teaches us that <b>greed</b> can lead to trouble.</div><div class="xj">その物語は、欲張りが問題を引き起こすことを教えてくれる。</div></button></li><li><button class="w" data-no="1170"><div class="top"><span class="no">1170</span><span class="en">expectancy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（life expectancy で）平均寿命</div><div class="ex">Life <b>expectancy</b> in Japan is one of the highest in the world.</div><div class="xj">日本の平均寿命は、世界で最も長いものの1つだ。</div></button></li><li><button class="w" data-no="1171"><div class="top"><span class="no">1171</span><span class="en">addict</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">中毒者</div><div class="ex">My brother is a game <b>addict</b> and plays every night.</div><div class="xj">兄はゲームの中毒者で、毎晩遊んでいる。</div></button></li><li><button class="w" data-no="1172"><div class="top"><span class="no">1172</span><span class="en">replica</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">複製；レプリカ</div><div class="ex">The museum shows a <b>replica</b> of an old ship.</div><div class="xj">その博物館には、古い船の複製が展示されている。</div></button></li><li><button class="w" data-no="1173"><div class="top"><span class="no">1173</span><span class="en">quarrel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">口論；けんか</div><div class="ex">Ken and his brother had a <b>quarrel</b> about the TV.</div><div class="xj">ケンと弟は、テレビのことで口論をした。</div></button></li><li><button class="w" data-no="1174"><div class="top"><span class="no">1174</span><span class="en">illusion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">錯覚；幻想</div><div class="ex">This picture creates the <b>illusion</b> that the lines are moving.</div><div class="xj">この絵は、線が動いているような錯覚を起こさせる。</div></button></li><li><button class="w" data-no="1175"><div class="top"><span class="no">1175</span><span class="en">exterior</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外側；外観</div><div class="ex">The <b>exterior</b> of the house was painted white.</div><div class="xj">その家の外側は白くぬられた。</div></button></li><li><button class="w" data-no="1176"><div class="top"><span class="no">1176</span><span class="en">migrant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">移住者；渡り鳥</div><div class="ex">Many <b>migrants</b> came to this city to find work.</div><div class="xj">多くの移住者が、仕事を求めてこの都市にやって来た。</div></button></li><li><button class="w" data-no="1177"><div class="top"><span class="no">1177</span><span class="en">quest</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">探求</div><div class="ex">The story is about a boy&#x27;s <b>quest</b> for a lost treasure.</div><div class="xj">その物語は、失われた宝物を求める少年の探求の話だ。</div></button></li><li><button class="w" data-no="1178"><div class="top"><span class="no">1178</span><span class="en">developer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">開発者；開発業者</div><div class="ex">Ken wants to become a game <b>developer</b> in the future.</div><div class="xj">ケンは将来、ゲームの開発者になりたいと思っている。</div></button></li><li><button class="w" data-no="1179"><div class="top"><span class="no">1179</span><span class="en">superstition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">迷信</div><div class="ex">Some people believe the <b>superstition</b> that the number four is unlucky.</div><div class="xj">4という数字は縁起が悪いという迷信を信じている人もいる。</div></button></li><li><button class="w" data-no="1180"><div class="top"><span class="no">1180</span><span class="en">logic</span><span class="ps"
