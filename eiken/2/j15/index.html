</div><div class="ex">I helped my friend with math in exchange for help with English.</div><div class="xj">英語を手伝ってもらうのと引きかえに、友だちの数学を手伝った。</div></button></li><li><button class="w" data-no="熟146"><div class="top"><span class="no">熟146</span><span class="en">at random</span></div><div class="ja">無作為に、でたらめに</div><div class="ex">The teacher chose three students at random.</div><div class="xj">先生は無作為に3人の生徒を選んだ。</div></button></li><li><button class="w" data-no="熟147"><div class="top"><span class="no">熟147</span><span class="en">by chance</span></div><div class="ja">偶然</div><div class="ex">I met my old teacher by chance at the station.</div><div class="xj">駅で偶然昔の先生に会った。</div></button></li><li><button class="w" data-no="熟148"><div class="top"><span class="no">熟148</span><span class="en">in detail</span></div><div class="ja">詳しく</div><div class="ex">Please explain your plan in detail.</div><div class="xj">あなたの計画を詳しく説明してください。</div></button></li><li><button class="w" data-no="熟149"><div class="top"><span class="no">熟149</span><span class="en">at ease</span></div><div class="ja">くつろいで、安心して</div><div class="ex">The kind nurse made the patient feel at ease.</div><div class="xj">親切な看護師のおかげで、患者は安心した。</div></button></li><li><button class="w" data-no="熟150"><div class="top"><span class="no">熟150</span><span class="en">out of hand</span></div><div class="ja">手に負えない</div><div class="ex">The party got out of hand, and the neighbors complained.</div><div class="xj">パーティーが手に負えなくなり、近所の人が苦情を言った。</div></button></li><li><button class="w" data-no="会71"><div class="top"><span class="no">会71</span><span class="en">Don&#x27;t worry about it.</span></div><div class="ja">気にしないで。</div><div class="ex">A: I&#x27;m sorry I broke your pen.<br>B: Don&#x27;t worry about it. I have another one.</div></button></li><li><button class="w" data-no="会72"><div class="top"><span class="no">会72</span><span class="en">Hang in there.</span></div><div class="ja">がんばって。・あきらめないで。</div><div class="ex">A: I have three tests this week.<br>B: Hang in there. It&#x27;ll be over soon.</div></button></li><li><button class="w" data-no="会73"><div class="top"><span class="no">会73</span><span class="en">I&#x27;m sure you&#x27;ll ～.</span></div><div class="ja">きっと～できるよ。</div><div class="ex">A: I&#x27;m worried about my piano recital.<br>B: You&#x27;ve practiced a lot. I&#x27;m sure you&#x27;ll do well.</div></button></li><li><button class="w" data-no="会74"><div class="top"><span class="no">会74</span><span class="en">Better luck next time.</span></div><div class="ja">次はきっとうまくいくよ。</div><div class="ex">A: Our team lost the game by one point.<br>B: That&#x27;s a shame. Better luck next time.</div></button></li><li><button class="w" data-no="会75"><div class="top"><span class="no">会75</span><span class="en">You deserve a break.</span></div><div class="ja">休んで当然だよ。</div><div class="ex">A: I&#x27;ve been working on this project all week.<br>B: You deserve a break. Why don&#x27;t you rest this weekend?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j14/">← 熟語 Set 14</a><a href="../j16/">熟語 Set 16 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟141": 5.1, "熟142": 18.49, "熟143": 32.69, "熟144": 46.75, "熟145": 61.17, "熟146": 75.9, "熟147": 89.75, "熟148": 102.8, "熟149": 115.3, "熟150": 129.31, "会71": 142.75, "会72": 159.64, "会73": 178.3, "会74": 196.7, "会75": 215.58}, "TE": {"熟141": 7.14, "熟142": 20.36, "熟143": 34.68, "熟144": 48.7, "熟145": 63.26, "熟146": 77.78, "熟147": 91.62, "熟148": 104.67, "熟149": 117.17, "熟150": 131.18, "会71": 144.67, "会72": 161.51, "会73": 180.22, "会74": 198.88, "会75": 217.76}, "Q": [["熟141", "by no means", "決して～ない"], ["熟142", "in terms of ～", "～の点で"], ["熟143", "regardless of ～", "～に関係なく"], ["熟144", "in accordance with ～", "～に従って"], ["熟145", "in exchange for ～", "～と引きかえに"], ["熟146", "at random", "無作為に、でたらめに"], ["熟147", "by chance", "偶然"], ["熟148",
