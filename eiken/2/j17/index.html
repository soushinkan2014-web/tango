 class="top"><span class="no">熟165</span><span class="en">have access to ～</span></div><div class="ja">～を利用できる、～が手に入る</div><div class="ex">Not all children have access to the Internet at home.</div><div class="xj">すべての子どもが家でインターネットを使えるわけではない。</div></button></li><li><button class="w" data-no="熟166"><div class="top"><span class="no">熟166</span><span class="en">come up with ～</span></div><div class="ja">～を思いつく</div><div class="ex">She came up with a good idea for the festival.</div><div class="xj">彼女は文化祭のよいアイデアを思いついた。</div></button></li><li><button class="w" data-no="熟167"><div class="top"><span class="no">熟167</span><span class="en">figure out ～</span></div><div class="ja">～を理解する、～を解決する</div><div class="ex">I couldn&#x27;t figure out how to use the new printer.</div><div class="xj">新しいプリンターの使い方がわからなかった。</div></button></li><li><button class="w" data-no="熟168"><div class="top"><span class="no">熟168</span><span class="en">point out ～</span></div><div class="ja">～を指摘する</div><div class="ex">The teacher pointed out some mistakes in my essay.</div><div class="xj">先生は私の作文のいくつかの誤りを指摘した。</div></button></li><li><button class="w" data-no="熟169"><div class="top"><span class="no">熟169</span><span class="en">keep ～ in mind</span></div><div class="ja">～を心に留めておく</div><div class="ex">Keep in mind that the store closes at eight.</div><div class="xj">その店は8時に閉まることを覚えておいてね。</div></button></li><li><button class="w" data-no="熟170"><div class="top"><span class="no">熟170</span><span class="en">take responsibility for ～</span></div><div class="ja">～の責任をとる</div><div class="ex">Leaders must take responsibility for their decisions.</div><div class="xj">リーダーは自分の決定に責任を持たなければならない。</div></button></li><li><button class="w" data-no="会81"><div class="top"><span class="no">会81</span><span class="en">Why do you say that?</span></div><div class="ja">どうしてそう言うの？</div><div class="ex">A: I don&#x27;t think the new library is very useful.<br>B: Why do you say that?</div></button></li><li><button class="w" data-no="会82"><div class="top"><span class="no">会82</span><span class="en">What makes you think so?</span></div><div class="ja">どうしてそう思うの？</div><div class="ex">A: I think it will snow tonight.<br>B: What makes you think so?</div></button></li><li><button class="w" data-no="会83"><div class="top"><span class="no">会83</span><span class="en">It&#x27;s just that ～.</span></div><div class="ja">ただ～というだけなんだ。（理由を言う）</div><div class="ex">A: Don&#x27;t you like the movie?<br>B: It&#x27;s not that. It&#x27;s just that I&#x27;m a little tired.</div></button></li><li><button class="w" data-no="会84"><div class="top"><span class="no">会84</span><span class="en">That&#x27;s because ～.</span></div><div class="ja">それは～だからだ。</div><div class="ex">A: Why is the shop so crowded today?<br>B: That&#x27;s because everything is half price.</div></button></li><li><button class="w" data-no="会85"><div class="top"><span class="no">会85</span><span class="en">The thing is, ～.</span></div><div class="ja">実は～なんだ。・問題は～なんだ。</div><div class="ex">A: Why don&#x27;t you buy that car?<br>B: I like it. The thing is, it&#x27;s too expensive.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j16/">← 熟語 Set 16</a><a href="../j18/">熟語 Set 18 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟161": 5.29, "熟162": 20.82, "熟163": 35.38, "熟164": 50.11, "熟165": 67.77, "熟166": 83.32, "熟167": 96.73, "熟168": 111.94, "熟169": 125.62, "熟170": 139.85, "会81": 155.42, "会82": 171.71, "会83": 187.44, "会84": 206.97, "会85": 223.98}, "TE": {"熟161": 7.16, "熟162": 22.74, "熟163": 37.3, "熟164": 52.66, "熟165": 69.69, "熟166": 85.19, "熟167": 98.6, "熟168": 113.82, "熟169": 127.52, "熟170": 142.39, "会81": 157.41, "会82": 173.77, "会83": 189.32, "会84": 208.92, "会85": 225.88}, "Q": [["熟161", "for this reason", "このような理由で"], ["熟162", "play a role in ～", "～で役割を果たす"], ["熟163", "enable A to ～", "Aが～できるようにする"], ["熟164",
