か。</div></button></li><li><button class="w" data-no="復71"><div class="top"><span class="no">復71</span><span class="en">expand</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を拡大する；広がる</div><div class="ex">The shop plans to <b>expand</b> its business next year.</div><div class="xj">その店は来年、事業を拡大する予定だ。</div></button></li><li><button class="w" data-no="復72"><div class="top"><span class="no">復72</span><span class="en">divide</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を分ける</div><div class="ex">Mom <b>divided</b> the cake into eight pieces.</div><div class="xj">母はケーキを8つに分けた。</div></button></li><li><button class="w" data-no="復73"><div class="top"><span class="no">復73</span><span class="en">reflect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を反射する；反映する</div><div class="ex">White clothes <b>reflect</b> the light from the sun.</div><div class="xj">白い服は太陽の光を反射する。</div></button></li><li><button class="w" data-no="復74"><div class="top"><span class="no">復74</span><span class="en">mark</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に印をつける</div><div class="ex">Please <b>mark</b> the important words with a red pen.</div><div class="xj">大事な語に赤ペンで印をつけてください。</div></button></li><li><button class="w" data-no="復75"><div class="top"><span class="no">復75</span><span class="en">involve</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を含む；巻き込む</div><div class="ex">This job <b>involves</b> a lot of traveling abroad.</div><div class="xj">この仕事には海外への出張が多く含まれる。</div></button></li><li><button class="w" data-no="復76"><div class="top"><span class="no">復76</span><span class="en">remain</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～のままである；残る</div><div class="ex">The shop <b>remained</b> open until late at night.</div><div class="xj">その店は夜遅くまで開いたままだった。</div></button></li><li><button clas
