e example.</div><div class="xj">たった1つの例から一般化することはできない。</div></button></li><li><button class="w" data-no="1025"><div class="top"><span class="no">1025</span><span class="en">redesign</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を設計し直す</div><div class="ex">The city plans to <b>redesign</b> the park near the station.</div><div class="xj">市は、駅の近くの公園を設計し直す予定だ。</div></button></li><li><button class="w" data-no="1026"><div class="top"><span class="no">1026</span><span class="en">bless</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を祝福する</div><div class="ex">Both families <b>blessed</b> the young couple on their wedding day.</div><div class="xj">両家は結婚式の日に、若い2人を祝福した。</div></button></li><li><button class="w" data-no="1027"><div class="top"><span class="no">1027</span><span class="en">cherish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を大切にする</div><div class="ex">I will always <b>cherish</b> the memories of this trip.</div><div class="xj">この旅の思い出を、いつまでも大切にするつもりだ。</div></button></li><li><button class="w" data-no="1028"><div class="top"><span class="no">1028</span><span class="en">mourn</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（死など）を嘆く</div><div class="ex">The whole town <b>mourned</b> the death of the kind old doctor.</div><div class="xj">町じゅうの人が、親切な老医師の死を嘆いた。</div></button></li><li><button class="w" data-no="1029"><div class="top"><span class="no">1029</span><span class="en">halt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を止める；止まる</div><div class="ex">The heavy snow <b>halted</b> all trains in the area.</div><div class="xj">大雪のため、その地域の電車はすべて止まった。</div></button></li><li><button class="w" data-no="1030"><div class="top"><span class="no">1030</span><span class="en">exaggerate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を誇張する</div><div class="ex">Ken always <b>exaggerates</b> when he talks about his fishing trips.</div><div class="xj">ケンは釣りに行った話をするとき、いつも話を誇張する。</div></button></li><li><button class="w" data-no="1031"><div class="top"><span class="no">1031</span><span class="en">intervene</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">介入する；仲裁する</div><div class="ex">The government <b>intervened</b> to stop prices from rising.</div><div class="xj">政府は、物価の上昇を止めるために介入した。</div></button></li><li><button class="w" data-no="1032"><div class="top"><span class="no">1032</span><span class="en">assure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に保証する</div><div class="ex">The guide <b>assured</b> us that the bridge was safe.</div><div class="xj">ガイドは、その橋は安全だと私たちに保証した。</div></button></li><li><button class="w" data-no="1033"><div class="top"><span class="no">1033</span><span class="en">terrify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をこわがらせる</div><div class="ex">The loud thunder <b>terrified</b> the little dog.</div><div class="xj">大きな雷の音が、小さな犬をこわがらせた。</div></button></li><li><button class="w" data-no="1034"><div class="top"><span class="no">1034</span><span class="en">scatter</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をまき散らす</div><div class="ex">The wind <b>scattered</b> the leaves all over the garden.</div><div class="xj">風が庭じゅうに葉をまき散らした。</div></button></li><li><button class="w" data-no="1035"><div class="top"><span class="no">1035</span><span class="en">quote</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を引用する</div><div class="ex">In her speech, Emi <b>quoted</b> a famous saying.</div><div class="xj">エミはスピーチの中で、有名なことわざを引用した。</div></button></li><li><button class="w" data-no="1036"><div class="top"><span class="no">1036</span><span class="en">rotate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">回転する；交代する</div><div class="ex">The old windmill <b>rotates</b> slowly in the wind.</div><div class="xj">古い風車が、風を受けてゆっくり回転する。</div></button></li><li><button class="w" data-no="1037"><div class="top"><span class="no">1037</span><span class="en">inspect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を検査する</div><div class="ex">Workers <b>inspect</b> the trains carefully every night.</div><div class="xj">作業員が毎晩、電車を注意深く検査する。</div></button></li><li><button class="w" data-no="1038"><div class="top"><span class="no">1038</span><span class="en">proofread</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を校正する</div><div class="ex">Please <b>proofread</b> your essay before you hand it in.</div><div class="xj">提出する前に、作文を校正してください。</div></button></li><li><button class="w" data-no="1039"><div class="top"><span class="no">1039</span><span class="en">edition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">版</div><div class="ex">The new <b>edition</b> of this dictionary has more pictures.</div><div class="xj">この辞書の新しい版には、もっと多くの絵がのっている。</div></button></li><li><button class="w" data-no="1040"><div class="top"><span class="no">1040</span><span class="en">debut</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">デビュー；初登場</div><div class="ex">The singer made her <b>debut</b> at the age of sixteen.</div><div class="xj">その歌手は16歳でデビューした。</div></button></li><li><button class="w" data-no="1041"><div class="top"><span class="no">1041</span><span class="en">acid</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">酸</div><div class="ex">Lemon juice contains a kind of <b>acid</b>.</div><div class="xj">レモン汁には、ある種の酸が含まれている。</div></button></li><li><button class="w" data-no="1042"><div class="top"><span class="no">1042</span><span class="en">recession</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不景気</div><div class="ex">Many small shops closed during the <b>recession</b> last year.</div><div class="xj">昨年の不景気の間に、多くの小さな店が閉店した。</div></button></li><li><button class="w" data-no="1043"><div class="top"><span class="no">1043</span><span class="en">mass</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">かたまり；大量</div><div class="ex">A large <b>mass</b> of cold air is coming from the north.</div><div class="xj">大きな寒気のかたまりが、北から近づいている。</div></button></li><li><button class="w" data-no="1044"><div class="top"><span class="no">1044</span><span class="en">eruption</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">噴火</div><div class="ex">The <b>eruption</b> of the volcano was seen from far away.</div><div class="xj">その火山の噴火は、遠くからも見えた。</div></button></li><li><button class="w" data-no="1045"><div class="top"><span class="no">1045</span><span class="en">temper</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">気性；かんしゃく</div><div class="ex">Ken has a calm <b>temper</b> and rarely gets angry.</div><div class="xj">ケンは穏やかな気性で、めったに怒らない。</div></button></li><li><button class="w" data-no="1046"><div class="top"><span class="no">1046</span><span class="en">charm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">魅力</div><div class="ex">The <b>charm</b> of this town is its quiet old streets.</div><div class="xj">この町の魅力は、静かな古い町並みだ。</div></button></li><li><button class="w" data-no="1047"><div class="top"><span class="no">1047</span><span class="en">assembly</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">集会；組み立て</div><div class="ex">The whole school gathered in the gym for a morning <b>assembly</b>.</div><div class="xj">全校生徒が、朝の集会のために体育館に集まった。</div></button></li><li><button class="w" data-no="1048"><div class="top"><span class="no">1048</span><span class="en">backup</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">予備；バックアップ</div><div class="ex">Bring a <b>backup</b>
