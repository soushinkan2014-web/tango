</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第5回</h1><div class="sub">No.241〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">restrict</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を制限する</div><div class="ex">The library <b>restricts</b> the number of books you can borrow.</div><div class="xj">その図書館は、借りられる本の数を制限している。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">criticize</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を批判する</div><div class="ex">Some people <b>criticized</b> the city&#x27;s plan to cut down the old trees.</div><div class="xj">古い木を切り倒すという市の計画を批判する人もいた。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">interfere</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">邪魔する；干渉する</div><div class="ex">Don&#x27;t let video games <b>interfere</b> with your homework.</div><div class="xj">テレビゲームが宿題の邪魔をしないようにしなさい。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">monitor</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を監視する</div><div class="ex">Cameras <b>monitor</b> the entrance of the building all day.</div><div class="xj">カメラが一日中、建物の入り口を監視している。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">switch</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を切りかえる</div><div class="ex">Ken <b>switched</b> the TV to a music channel.</div><div class="xj">ケンはテレビを音楽チャンネルに切りかえた。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">inquire</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">尋ねる；問い合わせる</div><div class="ex">I called the hotel to <b>inquire</b> about the room price.</div><div class="xj">私は部屋の料金を尋ねるために、ホテルに電話した。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">overuse</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を使いすぎる</div><div class="ex">If you <b>overuse</b> your phone, your eyes will get tired.</div><div class="xj">スマートフォンを使いすぎると、目が疲れる。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">fascinate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を魅了する</div><div class="ex">The stars in the night sky always <b>fascinate</b> me.</div><div class="xj">夜空の星は、いつも私を魅了する。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">pose</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（問題など）を引き起こす；ポーズをとる</div><div class="ex">Plastic trash <b>poses</b> a big problem for sea animals.</div><div class="xj">プラスチックごみは、海の動物に大きな問題を引き起こしている。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">burst</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">破裂する；（burst into で）急に～し出す</div><div class="ex">The balloon <b>burst</b> with a loud noise.</div><div class="xj">風船が大きな音を立てて破裂した。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">arise</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">生じる</div><div class="ex">If any problems <b>arise</b>, please call me at once.</div><div class="xj">もし何か問題が生じたら、すぐに私に電話してください。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">distract</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～の気をそらす</div><div class="ex">The noise outside <b>distracted</b> me from my homework.</div><div class="xj">外の騒音が、宿題をしている私の気をそらした。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">management</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">経営；管理</div><div class="ex">My sister wants to learn about hotel <b>management</b> in college.</div><div class="xj">姉は大学でホテル経営について学びたいと思っている。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">limitation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">制限；限界</div><div class="ex">We have to work within the <b>limitations</b> of time and money.</div><div class="xj">私たちは、時間とお金の制限の中で取り組まなければならない。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">summary</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">要約</div><div class="ex">Please write a short <b>summary</b> of the story.</div><div class="xj">その物語の短い要約を書いてください。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">psychology</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">心理学</div><div class="ex">Lisa became interested in <b>psychology</b> after reading a book.</div><div class="xj">リサはある本を読んで、心理学に興味をもった。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">concentration</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">集中（力）</div><div class="ex">Playing chess needs a lot of <b>concentration</b>.</div><div class="xj">チェスをするには、高い集中力が必要だ。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">guideline</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指針</div><div class="ex">The school made new <b>guidelines</b> for using smartphones.</div><div class="xj">学校は、スマートフォンを使うための新しい指針を作った。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">administration</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">管理；行政</div><div class="ex">My mother works in hospital <b>administration</b>.</div><div class="xj">母は病院の管理部門で働いている。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">workplace</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">職場</div><div class="ex">A clean <b>workplace</b> helps people work better.</div><div class="xj">きれいな職場だと、人はよりよく働ける。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">appearance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">外見；出現</div><div class="ex">You should not judge people only by their <b>appearance</b>.</div><div class="xj">人を外見だけで判断するべきではない。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">category</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">部類；カテゴリー</div><div class="ex">Spiders are not in the same <b>category</b> as insects.</div><div class="xj">クモは、昆虫と同じ部類には入らない。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">guidance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指導；案内</div><div class="ex">Students can get <b>guidance</b> from teachers about their future.</div><div class="xj">生徒は、進路について先生から指導を受けることができる。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">introduction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">導入；紹介</div><div class="ex">The <b>introduction</b> of electric buses made the air cleaner.</div><div class="xj">電気バスの導入で、空気がきれいになった。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">creation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">創造；創作物</div><div class="ex">This old story is about the <b>creation</b> of the world.</div><div class="xj">この古い物語は、世界の創造についての話だ。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">habitat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生息地</div><div class="ex">Forests are an important <b>habitat</b> for many birds.</div><div class="xj">森は、多くの鳥にとって大切な生息地だ。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">invasion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">侵略；侵害</div><div class="ex">Reading someone&#x27;s diary is an <b>invasion</b> of privacy.</div><div class="xj">他人の日記を読むのは、プライバシーの侵害だ。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">excitement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">興奮</div><div class="ex">The children could not hide their <b>excitement</b> before the trip.</div><div class="xj">子どもたちは旅行の前、興奮を隠せなかった。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">involvement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">関与；参加</div><div class="ex">The <b>involvement</b> of local people is important for this project.</div><div class="xj">この計画には、地元の人々の参加が大切だ。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">accommodation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">宿泊施設</div><div class="ex">We booked <b>accommodation</b> near the beach for our trip.</div><div class="xj">私たちは旅行のために、海辺の近くの宿泊施設を予約した。</div></button></li><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">venue</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">会場；開催地</div><div class="ex">The <b>venue</b> for the concert was changed to a larger hall.</div><div class="xj">コンサートの会場が、もっと大きなホールに変更された。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">educator</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">教育者</div><div class="ex">Many <b>educators</b> say that reading is important for children.</div><div class="xj">多くの教育者が、読書は子どもにとって大切だと言っている。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">advisor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">助言者；顧問</div><div class="ex">My grandfather is a good <b>advisor</b> for me when I have problems.</div><div class="xj">困ったとき、祖父は私にとってよい助言者だ。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">viewer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">視聴者</div><div class="ex">The TV show was popular among young <b>viewers</b>.</div><div class="xj">そのテレビ番組は、若い視聴者に人気があった。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">critic</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">批評家</div><div class="ex">Most <b>critics</b> said the new movie was wonderful.</div><div class="xj">ほとんどの批評家が、その新しい映画はすばらしいと言った。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">gene</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">遺伝子</div><div class="ex">Children get <b>genes</b> from both of their parents.</div><div class="xj">子どもは、父親と母親の両方から遺伝子を受け取る。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">personality</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">個性；性格</div><div class="ex">My sister has a cheerful <b>personality</b>.</div><div class="xj">姉は明るい性格だ。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">orientation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">説明会；オリエンテーション</div><div class="ex">New students will attend an <b>orientation</b> on the first day.</div><div class="xj">新入生は初日に説明会に参加する。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">innovative</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">革新的な</div><div class="ex">The company created an <b>innovative</b> way to recycle plastic bottles.</div><div class="xj">その会社は、ペットボトルをリサイクルする革新的な方法を生み出した。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class
