</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　新しい意味</h1><div class="sub">新1〜新59</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../n.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="新1"><div class="top"><span class="no">新1</span><span class="en">following</span><span class="ps">形</span></div><div class="xj">知っている意味：（followで）～について行く</div><div class="ja">次の；以下の</div><div class="ex">It rained on Saturday, so we played tennis the <b>following</b> day.</div><div class="xj">土曜日は雨だったので、私たちは次の日にテニスをした。</div></button></li><li><button class="w" data-no="新2"><div class="top"><span class="no">新2</span><span class="en">subject</span><span class="ps">名</span></div><div class="xj">知っている意味：教科</div><div class="ja">（メールの）件名；主題</div><div class="ex">Lisa forgot to write a <b>subject</b> for her e-mail to the teacher.</div><div class="xj">リサは先生へのメールに件名を書くのを忘れた。</div></button></li><li><button class="w" data-no="新3"><div class="top"><span class="no">新3</span><span class="en">face</span><span class="ps">動</span></div><div class="xj">知っている意味：顔</div><div class="ja">～に直面する</div><div class="ex">Many small towns <b>face</b> the problem of having fewer young people.</div><div class="xj">多くの小さな町が、若い人が減るという問題に直面している。</div></button></li><li><button class="w" data-no="新4"><div class="top"><span class="no">新4</span><span class="en">work</span><span class="ps">動</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">（機械などが）動く；うまくいく</div><div class="ex">My old camera still <b>works</b> well after ten years.</div><div class="xj">私の古いカメラは、10年たってもまだよく動く。</div></button></li><li><button class="w" data-no="新5"><div class="top"><span class="no">新5</span><span class="en">place</span><span class="ps">動</span></div><div class="xj">知っている意味：場所</div><div class="ja">～を置く</div><div class="ex">Please <b>place</b> your bags under the seat in front of you.</div><div class="xj">かばんは前の座席の下に置いてください。</div></button></li><li><button class="w" data-no="新6"><div class="top"><span class="no">新6</span><span class="en">train</span><span class="ps">動</span></div><div class="xj">知っている意味：電車</div><div class="ja">～を訓練する；鍛える</div><div class="ex">The coach <b>trains</b> the young players three times a week.</div><div class="xj">そのコーチは週に3回、若い選手たちを訓練している。</div></button></li><li><button class="w" data-no="新7"><div class="top"><span class="no">新7</span><span class="en">close</span><span class="ps">形</span></div><div class="xj">知っている意味：～を閉める</div><div class="ja">近い；親しい</div><div class="ex">Lisa and Emi have been <b>close</b> friends since elementary school.</div><div class="xj">リサとエミは小学校のときから親しい友だちだ。</div></button></li><li><button class="w" data-no="新8"><div class="top"><span class="no">新8</span><span class="en">stay</span><span class="ps">動</span></div><div class="xj">知っている意味：泊まる；とどまる</div><div class="ja">（～の）ままでいる</div><div class="ex">Ken <b>stayed</b> awake until midnight to finish his report.</div><div class="xj">ケンはレポートを仕上げるために、夜中の12時まで起きていた。</div></button></li><li><button class="w" data-no="新9"><div class="top"><span class="no">新9</span><span class="en">express</span><span class="ps">形</span></div><div class="xj">知っている意味：～を表現する</div><div class="ja">急行の；速達の</div><div class="ex">I sent the letter by <b>express</b> mail so that it would arrive tomorrow.</div><div class="xj">手紙が明日着くように、速達で送った。</div></button></li><li><button class="w" data-no="新10"><div class="top"><span class="no">新10</span><span class="en">match</span><span class="ps">動</span></div><div class="xj">知っている意味：試合</div><div class="ja">～に合う；～と釣り合う</div><div class="ex">These curtains <b>match</b> the color of the walls very well.</div><div class="xj">このカーテンはかべの色にとてもよく合う。</div></button></li><li><button class="w" data-no="新11"><div class="top"><span class="no">新11</span><span class="en">play</span><span class="ps">名</span></div><div class="xj">知っている意味：（スポーツを）する；（楽器を）ひく</div><div class="ja">劇；芝居</div><div class="ex">Our class will perform a <b>play</b> at the school festival.</div><div class="xj">私たちのクラスは文化祭で劇を上演する。</div></button></li><li><button class="w" data-no="新12"><div class="top"><span class="no">新12</span><span class="en">post</span><span class="ps">動</span></div><div class="xj">知っている意味：郵便；ポスト</div><div class="ja">～を掲示する；投稿する</div><div class="ex">Emi <b>posted</b> some photos of her trip on her blog.</div><div class="xj">エミは旅行の写真を何枚かブログに投稿した。</div></button></li><li><button class="w" data-no="新13"><div class="top"><span class="no">新13</span><span class="en">park</span><span class="ps">動</span></div><div class="xj">知っている意味：公園</div><div class="ja">（車）を駐車する</div><div class="ex">You cannot <b>park</b> your car in front of the hospital.</div><div class="xj">病院の前に車を駐車することはできません。</div></button></li><li><button class="w" data-no="新14"><div class="top"><span class="no">新14</span><span class="en">station</span><span class="ps">名</span></div><div class="xj">知っている意味：駅</div><div class="ja">（放送）局；（～）署</div><div class="ex">This radio <b>station</b> plays music from all over the world.</div><div class="xj">このラジオ局は世界中の音楽を流している。</div></button></li><li><button class="w" data-no="新15"><div class="top"><span class="no">新15</span><span class="en">book</span><span class="ps">動</span></div><div class="xj">知っている意味：本</div><div class="ja">～を予約する</div><div class="ex">Dad <b>booked</b> a hotel room near the beach for our vacation.</div><div class="xj">父は休みのために、海の近くのホテルの部屋を予約した。</div></button></li><li><button class="w" data-no="新16"><div class="top"><span class="no">新16</span><span class="en">run</span><span class="ps">動</span></div><div class="xj">知っている意味：走る</div><div class="ja">～を経営する</div><div class="ex">My grandmother <b>runs</b> a small hotel by the sea.</div><div class="xj">私の祖母は、海のそばで小さなホテルを経営している。</div></button></li><li><button class="w" data-no="新17"><div class="top"><span class="no">新17</span><span class="en">last</span><span class="ps">動</span></div><div class="xj">知っている意味：最後の；この前の</div><div class="ja">続く；長持ちする</div><div class="ex">The battery of this watch <b>lasts</b> for about three years.</div><div class="xj">このうで時計の電池は、約3年もつ。</div></button></li><li><button class="w" data-no="新18"><div class="top"><span class="no">新18</span><span class="en">pass</span><span class="ps">動</span></div><div class="xj">知っている意味：～を手わたす</div><div class="ja">（時が）たつ；過ぎる</div><div class="ex">Ten years have <b>passed</b> since we moved to this town.</div><div class="xj">私たちがこの町に引っこしてから10年がたった。</div></button></li><li><button class="w" data-no="新19"><div class="top"><span class="no">新19</span><span class="en">save</span><span class="ps">動</span></div><div class="xj">知っている意味：～を救う；（お金）をためる</div><div class="ja">～を節約する；省く</div><div class="ex">Using the new road <b>saves</b> us about thirty minutes.</div><div class="xj">新しい道を使うと、約30分節約できる。</div></button></li><li><button class="w" data-no="新20"><div class="top"><span class="no">新20</span><span class="en">form</span><span class="ps">動</span></div><div class="xj">知っている意味：用紙；形</div><div class="ja">～を作る；結成する</div><div class="ex">The students <b>formed</b> a new club to clean the beach.</div><div class="xj">生徒たちは海岸をそうじする新しい部を結成した。</div></button></li><li><button class="w" data-no="新21"><div class="top"><span class="no">新21</span><span class="en">hold</span><span class="ps">動</span></div><div class="xj">知っている意味：～を手に持つ；（会など）を開く</div><div class="ja">～を収容できる；入れておく</div><div class="ex">This concert hall can <b>hold</b> about two thousand people.</div><div class="xj">このコンサートホールは約2000人を収容できる。</div></button></li><li><button class="w" data-no="新22"><div class="top"><span class="no">新22</span><span class="en">own</span><span class="ps">動</span></div><div class="xj">知っている意味：自分自身の</div><div class="ja">～を所有する</div><div class="ex">Tom&#x27;s uncle <b>owns</b> three restaurants in this town.</div><div class="xj">トムのおじはこの町でレストランを3軒所有している。</div></button></li><li><button class="w" data-no="新23"><div class="top"><span class="no">新23</span><span class="en">block</span><span class="ps">動</span></div><div class="xj">知っている意味：（市街の）1区画；かたまり</div><div class="ja">～をふさぐ；さえぎる</div><div class="ex">A large truck was <b>blocking</b> the entrance to the parking lot.</div><div class="xj">大きなトラックが駐車場の入り口をふさいでいた。</div></button></li><li><button class="w" data-no="新24"><div class="top"><span class="no">新24</span><span class="en">deal</span><span class="ps">名</span></div><div class="xj">知っている意味：（deal withで）～に対処する</div><div class="ja">取引；お買い得品</div><div class="ex">I got a good <b>deal</b> on these shoes at the summer sale.</div><div class="xj">夏のセールで、このくつをお買い得に買えた。</div></button></li><li><button class="w" data-no="新25"><div class="top"><span class="no">新25</span><span class="en">late</span><span class="ps">形</span></div><div class="xj">知っている意味：おそく；遅れた</div><div class="ja">（時代・季節の）後半の</div><div class="ex">This old castle was built in the <b>late</b> 1600s.</div><div class="xj">この古い城は1600年代後半に建てられた。</div></button></li><li><button class="w" data-no="新26"><div class="top"><span class="no">新26</span><span class="en">patient</span><span class="ps">形</span></div><div class="xj">知っている意味：患者</div><div class="ja">がまん強い；しんぼう強い</div><div class="ex">Our teacher is very <b>patient</b> with students who learn slowly.</div><div class="xj">私たちの先生は、ゆっくり学ぶ生徒にもとてもしんぼう強い。</div></button></li><li><button class="w" data-no="新27"><div class="top"><span class="no">新27</span><span class="en">pretty</span><span class="ps">副</span></div><div class="xj">知っている意味：きれいな；かわいい</div><div class="ja">かなり；けっこう</div><div class="ex">The math test was <b>pretty</b> easy, so I finished early.</div><div class="xj">数学のテストはかなり簡単だったので、早く終わった。</div></button></li><li><button class="w" data-no="新28"><div class="top"><span class="no">新28</span><span class="en">break</span><span class="ps">名</span></div><div class="xj">知っている意味：～をこわす</div><div class="ja">休憩；休み</div><div class="ex">We had a ten-minute <b>break</b> between the two classes.</div><div class="xj">2つの授業の間に10分間の休憩があった。</div></button></li><li><button class="w" data-no="新29"><div class="top"><span class="no">新29</span><span class="en">means</span><span class="ps">名</span></div><div class="xj">知っている意味：（meanで）～を意味する</div><div class="ja">手段；方法</div><div class="ex">The bicycle is a popular <b>means</b> of transportation in this city.</div><div class="xj">自転車はこの市で人気のある交通手段だ。</div></button></li><li><button class="w" data-no="新30"><div class="top"><span class="no">新30</span><span class="en">cover</span><span class="ps">動</span></div><div class="xj">知っている意味：～をおおう</div><div class="ja">（範囲・内容）を扱う</div><div class="ex">The TV program <b>covered</b> the history of trains in Japan.</div><div class="xj">そのテレビ番組は、日本の鉄道の歴史を扱った。</div></button></li><li><button class="w" data-no="新31"><div class="top"><span class="no">新31</span><span class="en">cover</span><span class="ps">名</span></div><div class="xj">知っている意味：～をおおう</div><div class="ja">表紙</div><div class="ex">The <b>cover</b> of this book has a picture of a cat.</div><div class="xj">この本の表紙にはネコの絵がかいてある。</div></button></li><li><button class="w" data-no="新32"><div class="top"><span class="no">新32</span><span class="en">view</span><span class="ps">名</span></div><div class="xj">知っている意味：ながめ；景色</div><div class="ja">意見；見方</div><div class="ex">What is your <b>view</b> on using smartphones in class?</div><div class="xj">授業でスマートフォンを使うことについて、あなたの意見はどうですか。</div></button></li><li><button class="w" data-no="新33"><div class="top"><span class="no">新33</span><span class="en">area</span><span class="ps">名</span></div><div class="xj">知っている意味：地域；区域</div><div class="ja">分野；領域</div><div class="ex">Computers are used in almost every <b>area</b> of science.</div><div class="xj">コンピューターは科学のほとんどすべての分野で使われている。</div></button></li><li><button class="w" data-no="新34"><div class="top"><span class="no">新34</span><span class="en">meet</span><span class="ps">動</span></div><div class="xj">知っている意味：～に会う</div><div class="ja">（要求・必要）を満たす</div><div class="ex">The new bus service <b>meets</b> the needs of older people in town.</div><div class="xj">新しいバスのサービスは、町のお年寄りのニーズを満たしている。</div></button></li><li><button class="w" data-no="新35"><div class="top"><span class="no">新35</span><span class="en">step</span><span class="ps">名</span></div><div class="xj">知っている意味：段；一歩</div><div class="ja">段階；手順</div><div class="ex">Follow each <b>step</b> in the recipe to make the cake.</div><div class="xj">ケーキを作るには、レシピの各手順に従ってください。</div></button></li><li><button class="w" data-no="新36"><div class="top"><span class="no">新36</span><span class="en">stage</span><span class="ps">名</span></div><div class="xj">知っている意味：舞台；ステージ</div><div class="ja">段階；時期</div><div class="ex">Our plan for the school trip is now in its final <b>stage</b>.</div><div class="xj">修学旅行の計画は、今最後の段階にある。</div></button></li><li><button class="w" data-no="新37"><div class="top"><span class="no">新37</span><span class="en">character</span><span class="ps">名</span></div><div class="xj">知っている意味：登場人物；キャラクター</div><div class="ja">性格；特徴</div><div class="ex">Ken and his brother look alike, but their <b>characters</b> are very different.</div><div class="xj">ケンと兄は見た目は似ているが、性格はまったくちがう。</div></button></li><li><button class="w" data-no="新38"><div class="top"><span class="no">新38</span><span class="en">serve</span><span class="ps">動</span></div><div class="xj">知っている意味：（食事など）を出す</div><div class="ja">（～として）務める</div><div class="ex">Our principal <b>served</b> as a teacher in Canada for five years.</div><div class="xj">私たちの校長先生は、カナダで5年間教師として務めた。</div></button></li><li><button class="w" data-no="新39"><div class="top" しい部品を注文した。</div></button></li><li><button class="w" data-no="新45"><div class="top"><span class="no">新45</span><span class="en">pay</span><span class="ps">名</span></div><div class="xj">知っている意味：（お金）を払う</div><div class="ja">給料</div><div class="ex">Lisa likes her new job because the <b>pay</b> is very good.</div><div class="xj">リサは給料がとてもいいので、新しい仕事を気に入っている。</div></button></li><li><button class="w" data-no="新46"><div class="top"><span class="no">新46</span><span class="en">paper</span><span class="ps">名</span></div><div class="xj">知っている意味：紙</div><div class="ja">新聞；論文</div><div class="ex">My father reads the morning <b>paper</b> before breakfast.</div><div class="xj">父は朝食の前に朝の新聞を読む。</div></button></li><li><button class="w" data-no="新47"><div class="top"><span class="no">新47</span><span class="en">age</span><span class="ps">名</span></div><div class="xj">知っている意味：年齢</div><div class="ja">時代</div><div class="ex">We live in an <b>age</b> of smartphones and the Internet.</div><div class="xj">私たちはスマートフォンとインターネットの時代に生きている。</div></button></li><li><button class="w" data-no="新48"><div class="top"><span class="no">新48</span><span class="en">work</span><span class="ps">名</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">作品</div><div class="ex">This museum has many <b>works</b> by young artists.</div><div class="xj">この美術館には若い画家たちの作品がたくさんある。</div></button></li><li><button class="w" data-no="新49"><div class="top"><span class="no">新49</span><span class="en">fair</span><span class="ps">名</span></div><div class="xj">知っている意味：公平な；正当な</div><div class="ja">展示会；フェア</div><div class="ex">Lisa tried dishes from many countries at the food <b>fair</b>.</div><div class="xj">リサは食のフェアで多くの国の料理を食べてみた。</div></button></li><li><button class="w" data-no="新50"><div class="top"><span class="no">新50</span><span class="en">stick</span><span class="ps">動</span></div><div class="xj">知っている意味：～をはりつける；くっつく</div><div class="ja">（be stuckで）動けなくなる</div><div class="ex">Our bus got <b>stuck</b> in the snow for an
