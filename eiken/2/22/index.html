</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第22回</h1><div class="sub">No.1261〜1320</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../22.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1261"><div class="top"><span class="no">1261</span><span class="en">gamble</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">賭けをする</div><div class="ex">My uncle never <b>gambles</b> because he thinks it is a waste of money.</div><div class="xj">おじは、お金のむだだと思っているので、決して賭けをしない。</div></button></li><li><button class="w" data-no="1262"><div class="top"><span class="no">1262</span><span class="en">compensate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（compensate for で）～を埋め合わせる</div><div class="ex">Ken studied hard to <b>compensate</b> for the days he missed school.</div><div class="xj">ケンは学校を休んだ日の分を埋め合わせるために、一生けんめい勉強した。</div></button></li><li><button class="w" data-no="1263"><div class="top"><span class="no">1263</span><span class="en">dip</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をちょっと浸す</div><div class="ex">Emi <b>dipped</b> her bread in the warm soup.</div><div class="xj">エミはパンを温かいスープにちょっと浸した。</div></button></li><li><button class="w" data-no="1264"><div class="top"><span class="no">1264</span><span class="en">overtake</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を追い越す</div><div class="ex">The young runner <b>overtook</b> the leader just before the finish line.</div><div class="xj">その若い選手は、ゴール直前で先頭の選手を追い越した。</div></button></li><li><button class="w" data-no="1265"><div class="top"><span class="no">1265</span><span class="en">enlarge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を大きくする</div><div class="ex">Can you <b>enlarge</b> this photo for the poster?</div><div class="xj">ポスター用に、この写真を大きくしてもらえますか。</div></button></li><li><button class="w" data-no="1266"><div class="top"><span class="no">1266</span><span class="en">upgrade</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を改良する；格上げする</div><div class="ex">The town <b>upgraded</b> the old park with new benches and lights.</div><div class="xj">町は新しいベンチと照明で、古い公園を改良した。</div></button></li><li><button class="w" data-no="1267"><div class="top"><span class="no">1267</span><span class="en">deposit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を預ける</div><div class="ex">I <b>deposited</b> my New Year&#x27;s money in the bank.</div><div class="xj">私はお年玉を銀行に預けた。</div></button></li><li><button class="w" data-no="1268"><div class="top"><span class="no">1268</span><span class="en">repay</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を返済する；～に報いる</div><div class="ex">Ken <b>repaid</b> the money he borrowed from his brother.</div><div class="xj">ケンは兄から借りたお金を返済した。</div></button></li><li><button class="w" data-no="1269"><div class="top"><span class="no">1269</span><span class="en">loosen</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をゆるめる</div><div class="ex">Tom <b>loosened</b> his belt after the big dinner.</div><div class="xj">トムはたくさん夕食を食べたあと、ベルトをゆるめた。</div></button></li><li><button class="w" data-no="1270"><div class="top"><span class="no">1270</span><span class="en">disguise</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を変装させる；偽る</div><div class="ex">The actor <b>disguised</b> himself as an old man.</div><div class="xj">その俳優は老人に変装した。</div></button></li><li><button class="w" data-no="1271"><div class="top"><span class="no">1271</span><span class="en">stir</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をかき混ぜる</div><div class="ex">Please <b>stir</b> the soup slowly so it doesn&#x27;t burn.</div><div class="xj">こげないように、スープをゆっくりかき混ぜてください。</div></button></li><li><button class="w" data-no="1272"><div class="top"><span class="no">1272</span><span class="en">transmit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を伝える；送信する</div><div class="ex">This radio station <b>transmits</b> news and weather to the whole island.</div><div class="xj">このラジオ局は、島全体にニュースと天気予報を伝えている。</div></button></li><li><button class="w" data-no="1273"><div class="top"><span class="no">1273</span><span class="en">elevate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を持ち上げる；高める</div><div class="ex">The doctor told me to <b>elevate</b> my leg on a pillow.</div><div class="xj">医者に、まくらを使って足を持ち上げておくように言われた。</div></button></li><li><button class="w" data-no="1274"><div class="top"><span class="no">1274</span><span class="en">nominate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を指名する；推薦する</div><div class="ex">Our class <b>nominated</b> Emi as class leader.</div><div class="xj">クラスのみんなは、エミを学級委員長に指名した。</div></button></li><li><button class="w" data-no="1275"><div class="top"><span class="no">1275</span><span class="en">rot</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">腐る</div><div class="ex">The apples <b>rotted</b> because we left them in the sun.</div><div class="xj">日なたに置きっぱなしにしたので、リンゴが腐った。</div></button></li><li><button class="w" data-no="1276"><div class="top"><span class="no">1276</span><span class="en">plead</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">嘆願する</div><div class="ex">The boy <b>pleaded</b> with his parents to let him keep the puppy.</div><div class="xj">男の子は、子犬を飼わせてほしいと両親に嘆願した。</div></button></li><li><button class="w" data-no="1277"><div class="top"><span class="no">1277</span><span class="en">correspond</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">一致する；文通する</div><div class="ex">Ken&#x27;s story did not <b>correspond</b> with what Emi said.</div><div class="xj">ケンの話は、エミの言ったことと一致しなかった。</div></button></li><li><button class="w" data-no="1278"><div class="top"><span class="no">1278</span><span class="en">dye</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を染める</div><div class="ex">Lisa <b>dyed</b> her old white T-shirt light blue.</div><div class="xj">リサは古い白いTシャツを水色に染めた。</div></button></li><li><button class="w" data-no="1279"><div class="top"><span class="no">1279</span><span class="en">excel</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">秀でる；優れている</div><div class="ex">Emi <b>excels</b> in math, so her friends often ask her questions.</div><div class="xj">エミは数学に秀でているので、友だちがよく質問しに来る。</div></button></li><li><button class="w" data-no="1280"><div class="top"><span class="no">1280</span><span class="en">overwork</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">働きすぎ</div><div class="ex">My father got sick from <b>overwork</b> last year.</div><div class="xj">父は去年、働きすぎで体をこわした。</div></button></li><li><button class="w" data-no="1281"><div class="top"><span class="no">1281</span><span class="en">pile</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">積み重ね；山</div><div class="ex">There is a <b>pile</b> of books on my desk.</div><div class="xj">私の机の上には本の山がある。</div></button></li><li><button class="w" data-no="1282"><div class="top"><span class="no">1282</span><span class="en">accent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">なまり；アクセント</div><div class="ex">Our new teacher speaks English with a Scottish <b>accent</b>.</div><div class="xj">新しい先生は、スコットランドのなまりのある英語を話す。</div></button></li><li><button class="w" data-no="1283"><div class="top"><span class="no">1283</span><span class="en">installation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">設置；取り付け</div><div class="ex">The <b>installation</b> of the new air conditioner took two hours.</div><div class="xj">新しいエアコンの設置には2時間かかった。</div></button></li><li><button class="w" data-no="1284"><div class="top"><span class="no">1284</span><span class="en">sorrow</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">悲しみ</div><div class="ex">Lisa felt deep <b>sorrow</b> when her best friend moved away.</div><div class="xj">親友が引っ越したとき、リサは深い悲しみを感じた。</div></button></li><li><button class="w" data-no="1285"><div class="top"><span class="no">1285</span><span class="en">highway</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">幹線道路</div><div class="ex">There was a lot of traffic on the <b>highway</b> this morning.</div><div class="xj">今朝は幹線道路がとても混んでいた。</div></button></li><li><button class="w" data-no="1286"><div class="top"><span class="no">1286</span><span class="en">irrigation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">灌漑</div><div class="ex">The farmers built an <b>irrigation</b> system to bring water to their fields.</div><div class="xj">農家の人々は、畑に水を引くための灌漑設備を作った。</div></button></li><li><button class="w" data-no="1287"><div class="top"><span class="no">1287</span><span class="en">consultant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">コンサルタント；相談役</div><div class="ex">The company hired a <b>consultant</b> to give advice on sales.</div><div class="xj">その会社は販売について助言をもらうため、コンサルタントを雇った。</div></button></li><li><button class="w" data-no="1288"><div class="top"><span class="no">1288</span><span class="en">lease</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">賃貸借契約</div><div class="ex">We signed a two-year <b>lease</b> for the apartment.</div><div class="xj">私たちは、そのアパートの2年間の賃貸借契約を結んだ。</div></button></li><li><button class="w" data-no="1289"><div class="top"><span class="no">1289</span><span class="en">craftsman</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">職人</div><div class="ex">The <b>craftsman</b> made this wooden table by hand.</div><div class="xj">その職人が、この木のテーブルを手作りした。</div></button></li><li><button class="w" data-no="1290"><div class="top"><span class="no">1290</span><span class="en">organizer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">主催者；まとめ役</div><div class="ex">The <b>organizers</b> of the marathon thanked all the volunteers.</div><div class="xj">マラソンの主催者は、すべてのボランティアに感謝した。</div></button></li><li><button class="w" data-no="1291"><div class="top"><span class="no">1291</span><span class="en">errand</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">使い走り；用事</div><div class="ex">My mother sent me on an <b>errand</b> to the supermarket.</div><div class="xj">母は私をスーパーへお使いに行かせた。</div></button></li><li><button class="w" data-no="1292"><div class="top"><span class="no">1292</span><span class="en">reign</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">治世；統治</div><div class="ex">The castle was built during the <b>reign</b> of a famous king.</div><div class="xj">その城は、ある有名な王の治世に建てられた。</div></button></li><li><button class="w" data-no="1293"><div class="top"><span class="no">1293</span><span class="en">chamber</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部屋；議会</div><div class="ex">The king&#x27;s <b>chamber</b> was on the top floor of the castle.</div><div class="xj">王の部屋は城の最上階にあった。</div></button></li><li><button class="w" data-no="1294"><div class="top"><span class="no">1294</span><span class="en">episode</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（ドラマなどの）1話；出来事</div><div class="ex">I watched the last <b>episode</b> of the drama last night.</div><div class="xj">昨夜、そのドラマの最終話を見た。</div></button></li><li><button class="w" data-no="1295"><div class="top"><span class="no">1295</span><span class="en">pupil</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生徒；瞳孔</div><div class="ex">There are thirty <b>pupils</b> in my sister&#x27;s class.</div><div class="xj">妹のクラスには生徒が30人いる。</div></button></li><li><button class="w" data-no="1296"><div class="top"><span class="no">1296</span><span class="en">tissue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（体の）組織；ティッシュ</div><div class="ex">Muscle <b>tissue</b> gets stronger with regular exercise.</div><div class="xj">筋肉の組織は、定期的な運動で強くなる。</div></button></li><li><button class="w" data-no="1297"><div class="top"><span class="no">1297</span><span class="en">patch</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">継ぎ当て；小区画</div><div class="ex">My grandmother sewed a <b>patch</b> on my torn jeans.</div><div class="xj">祖母は、私の破れたジーンズに継ぎ当てを縫いつけた。</div></button></li><li><button class="w" data-no="1298"><div class="top"><span class="no">1298</span><span class="en">parliament</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">議会；国会</div><div class="ex">The <b>parliament</b> passed a new law about plastic bags.</div><div class="xj">議会は、レジ袋に関する新しい法律を可決した。</div></button></li><li><button class="w" data-no="1299"><div class="top"><span class="no">1299</span><span class="en">pastime</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">娯楽；気晴らし</div><div class="ex">Fishing is my grandfather&#x27;s favorite <b>pastime</b> on weekends.</div><div class="xj">釣りは、祖父のお気に入りの週末の娯楽だ。</div></button></li><li><button class="w" data-no="1300"><div class="top"><span class="no">1300</span><span class="en">cluster</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">かたまり；群れ</div><div class="ex">The bees formed a <b>cluster</b> on a tree branch.</div><div class="xj">ハチが木の枝でかたまりを作っていた。</div></button></li><li><button class="w" data-no="1301"><div class="top"><span class="no">1301</span><span class="en">curve</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">曲線；カーブ</div><div class="ex">Draw a smooth <b>curve</b> through all the points on the graph.</div><div class="xj">グラフのすべての点を通るように、なめらかな曲線を描きなさい。</div></button></li><li><button class="w" data-no="1302"><div class="top"><span class="no">1302</span><span class="en">inflation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">インフレ；物価上昇</div><div class="ex">Because of <b>inflation</b>, everything at the supermarket costs more.</div><div class="xj">インフレのせいで、スーパーの品物が全部高くなった。</div></button></li><li><button class="w" data-no="1303"><div class="top"><span class="no">1303</span><span class="en">newcomer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">新しく来た人；新人</div><div class="ex">Our town held a welcome party for <b>newcomers</b> last Sunday.</div><div class="xj">この前の日曜日、町は新しく来た人たちのために歓迎会を開いた。</div></button></li><li><button class="w" data-no="1304"><div class="top"><span class="no">1304</span><span class="en">sticky</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ねばねばする</div><div class="ex">My hands got <b>sticky</b> after eating cotton candy.</div><div class="xj">綿あめを食べたら、手がねばねばになった。</div></button></li><li><button class="w" data-no="1305"><div class="top"><span class="no">1305</span><span class="en">continental</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">大陸の</div><div class="ex">This country has a <b>continental</b> climate with hot summers and cold winters.</div><div class="xj">この国は、夏は暑く冬は寒い大陸性気候だ。</div></button></li><li><button class="w" data-no="1306"><div class="top"><span class="no">1306</span><span class="en">hospitable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">もてなしのよい</div><div class="ex">The people in the small village were very <b>hospitable</b>.</div><div class="xj">その小さな村の人々は、とてももてなしがよかった。</div></button></li><li><button class="w" data-no="1307"><div class="top"><span class="no">1307</span><span class="en">stiff</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">硬い；こった</div><div class="ex">The new leather shoes felt <b>stiff</b> at first.</div><div class="xj">新しい革ぐつは、最初は硬く感じられた。</div></button></li><li><button class="w" data-no="1308"><div class="top"><span class="no">1308</span><span class="en">inland</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">内陸の</div><div class="ex">Summers in <b>inland</b> cities are hotter than those by the sea.</div><div class="xj">内陸の都市の夏は、海辺の都市より暑い。</div></button></li><li><button class="w" data-no="1309"><div class="top"><span class="no">1309</span><span class="en">hopeless</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">絶望的な</div><div class="ex">We were two goals behind, but the game was not <b>hopeless</b>.</div><div class="xj">2点差で負けていたが、試合は絶望的ではなかった。</div></button></li><li><button class="w" data-no="1310"><div class="top"><span class="no">1310</span><span class="en">decisive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">決定的な；決断力のある</div><div class="ex">Ken&#x27;s goal was the <b>decisive</b> moment of the game.</div><div class="xj">ケンのゴールが、試合の決定的な瞬間だった。</div></button></li><li><button class="w" data-no="1311"><div class="top"><span class="no">1311</span><span class="en">parental</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">親の</div><div class="ex">Students need <b>parental</b> permission to join the trip.</div><div class="xj">生徒が旅行に参加するには、親の許可が必要だ。</div></button></li><li><button class="w" data-no="1312"><div class="top"><span class="no">1312</span><span class="en">bankrupt</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">破産した</div><div class="ex">The old bookstore near the station went <b>bankrupt</b> last year.</div><div class="xj">駅の近くの古い本屋は、去年破産した。</div></button></li><li><button class="w" data-no="1313"><div class="top"><span class="no">1313</span><span class="en">civic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">市の；市民の</div><div class="ex">Our <b>civic</b> hall is often used for concerts and meetings.</div><div class="xj">市のホールは、コンサートや会議によく使われている。</div></button></li><li><button class="w" data-no="1314"><div class="top"><span class="no">1314</span><span class="en">deserted</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">人けのない</div><div class="ex">The beach was <b>deserted</b> early in the morning.</div><div class="xj">早朝の海辺は人けがなかった。</div></button></li><li><button class="w" data-no="1315"><div class="top"><span class="no">1315</span><span class="en">federal</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">連邦の</div><div class="ex">Each American state has its own laws besides <b>federal</b> laws.</div><div class="xj">アメリカの各州には、連邦の法律のほかに独自の法律がある。</div></button></li><li><button class="w" data-no="1316"><div class="top"><span class="no">1316</span><span class="en">sophisticated</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">洗練された；精巧な</div><div class="ex">Lisa always wears <b>sophisticated</b> clothes to the office.</div><div class="xj">リサはいつも洗練された服装で出社する。</div></button></li><li><button class="w" data-no="1317"><div class="top"><span class="no">1317</span><span class="en">imperfect</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不完全な</div><div class="ex">My English is still <b>imperfect</b>, but I try to speak it every day.</div><div class="xj">私の英語はまだ不完全だが、毎日話すようにしている。</div></button></li><li><button class="w" data-no="1318"><div class="top"><span class="no">1318</span><span class="en">moody</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">気分屋の；不機嫌な</div><div class="ex">My sister is <b>moody</b>, so I never know how she feels.</div><div class="xj">姉は気分屋なので、どんな気持ちなのかよくわからない。</div></button></li><li><button class="w" data-no="1319"><div class="top"><span class="no">1319</span><span class="en">geographic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">地理的な</div><div class="ex">Because of its <b>geographic</b> location, this town gets a lot of snow.</div><div class="xj">地理的な位置のため、この町は雪が多い。</div></button></li><li><button class="w" data-no="1320"><div class="top"><span class="no">1320</span><span class="en">historic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">歴史上重要な</div><div class="ex">This <b>historic</b> building is over 400 years old.</div><div class="xj">この歴史上重要な建物は、建てられて400年以上たつ。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../21/">← 第21回</a><a href="../23/">第23回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"1261": 4.96, "1262": 18.82, "1263": 34.37, "1264": 47.76, "1265": 62.06, "1266": 75.42, "1267": 90.88, "1268": 104.41, "1269": 119.72, "1270": 132.94, "1271": 147.62, "1272": 161.32, "1273": 177.04, "1274": 191.6, "1275": 206.28, "1276": 219.31, "1277": 232.65, "1278": 247.07, "1279": 260.82, "1280": 275.96, "1281": 289.16, "1282": 302.26, "1283": 316.24, "1284": 330.47, "1285": 344.17, "1286": 357.3, "1287": 371.55, "1288": 386.54, "1289": 399.81, "1290": 412.79, "1291": 427.43, "1292": 441.13, "1293": 454.92, "1294": 468.43, "1295": 483.12, "1296": 496.82, "1297": 511.4, "1298": 525.61, "1299"
