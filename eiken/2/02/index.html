</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第2回</h1><div class="sub">No.61〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">govern</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を治める；統治する</div><div class="ex">The king <b>governed</b> the country for forty years.</div><div class="xj">その王は40年間、国を治めた。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">confront</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に立ち向かう；直面する</div><div class="ex">The club members <b>confronted</b> the problem together and solved it.</div><div class="xj">部員たちは一緒にその問題に立ち向かい、解決した。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">split</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を分ける；割る</div><div class="ex">Let&#x27;s <b>split</b> the pizza into eight pieces.</div><div class="xj">ピザを8切れに分けよう。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">foster</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を育成する；促す</div><div class="ex">Our school tries to <b>foster</b> creative thinking in students.</div><div class="xj">私たちの学校は、生徒の創造的な考え方を育成しようとしている。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">proceed</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">進む；続ける</div><div class="ex">All passengers should <b>proceed</b> to Gate 5 now.</div><div class="xj">乗客の皆様は、ただちに5番ゲートへお進みください。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">offend</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～の気分を害する</div><div class="ex">I&#x27;m sorry if my words <b>offended</b> you.</div><div class="xj">私の言葉であなたの気分を害したのなら、ごめんなさい。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">spray</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を吹きかける</div><div class="ex">Ken <b>sprayed</b> water on the plants in the garden.</div><div class="xj">ケンは庭の植物に水を吹きかけた。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">frown</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">顔をしかめる</div><div class="ex">Dad <b>frowned</b> when he saw my messy room.</div><div class="xj">父は散らかった私の部屋を見て顔をしかめた。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">weep</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">泣く</div><div class="ex">Emi <b>wept</b> when she read the last page of the novel.</div><div class="xj">エミはその小説の最後のページを読んで泣いた。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">ensure</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を確実にする</div><div class="ex">Please check your answers to <b>ensure</b> there are no mistakes.</div><div class="xj">間違いがないことを確実にするために、答えを見直してください。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">perceive</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に気づく；～を知覚する</div><div class="ex">Dogs can <b>perceive</b> sounds that people cannot hear.</div><div class="xj">犬は、人には聞こえない音に気づくことができる。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">sacrifice</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を犠牲にする</div><div class="ex">Lisa <b>sacrificed</b> her free time to help her friends.</div><div class="xj">リサは友だちを助けるために、自分の自由な時間を犠牲にした。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">imply</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をほのめかす；暗に意味する</div><div class="ex">Her smile <b>implied</b> that she liked the present.</div><div class="xj">彼女のほほえみは、そのプレゼントを気に入ったことをほのめかしていた。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">specify</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を明確に述べる；指定する</div><div class="ex">Ben did not <b>specify</b> what time he would come.</div><div class="xj">ベンは何時に来るかを明確に述べなかった。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">defend</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を守る；弁護する</div><div class="ex">Our players worked hard to <b>defend</b> the goal.</div><div class="xj">私たちの選手たちは、ゴールを守るために懸命にがんばった。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">characteristic</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">特徴</div><div class="ex">Long ears are a <b>characteristic</b> of this kind of rabbit.</div><div class="xj">長い耳は、この種類のウサギの特徴だ。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">ignorance</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">無知</div><div class="ex">Tom&#x27;s mistake came from his <b>ignorance</b> of the rules.</div><div class="xj">トムの失敗は、ルールについての無知が原因だった。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">suspicion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">疑い</div><div class="ex">Mom looked at the empty cookie jar with <b>suspicion</b>.</div><div class="xj">母は空になったクッキーのびんを疑いの目で見た。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">minister</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">大臣；牧師</div><div class="ex">The <b>minister</b> of education visited our school last week.</div><div class="xj">先週、教育担当の大臣が私たちの学校を訪れた。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">contrary</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">反対</div><div class="ex">Many people think the test is easy, but the <b>contrary</b> is true.</div><div class="xj">多くの人はそのテストを簡単だと思っているが、実際はその反対だ。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">liberty</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">自由</div><div class="ex">Students here have the <b>liberty</b> to choose their own clubs.</div><div class="xj">この学校の生徒には、自分で部活を選ぶ自由がある。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">insurance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">保険</div><div class="ex">My father bought travel <b>insurance</b> before our trip to Canada.</div><div class="xj">カナダ旅行の前に、父は旅行保険に入った。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">subscription</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">定期購読；会費制の利用</div><div class="ex">Emi has a <b>subscription</b> to a science magazine.</div><div class="xj">エミは科学雑誌を定期購読している。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">civilization</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">文明</div><div class="ex">Many ancient <b>civilizations</b> developed near big rivers.</div><div class="xj">古代の文明の多くは、大きな川の近くで発達した。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">drawback</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">欠点</div><div class="ex">The only <b>drawback</b> of this apartment is the small kitchen.</div><div class="xj">このアパートの唯一の欠点は、台所が狭いことだ。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">democracy</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">民主主義</div><div class="ex">In a <b>democracy</b>, people choose their leaders by voting.</div><div class="xj">民主主義のもとでは、人々は投票で指導者を選ぶ。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">murder</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">殺人</div><div class="ex">The detective in the story solved the <b>murder</b> in one day.</div><div class="xj">物語の中の探偵は、その殺人事件を1日で解決した。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">session</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（活動の）時間；会合</div><div class="ex">The next practice <b>session</b> starts at four o&#x27;clock.</div><div class="xj">次の練習時間は4時に始まる。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">emperor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">皇帝</div><div class="ex">The <b>emperor</b> in this picture ruled the country long ago.</div><div class="xj">この絵の皇帝は、昔その国を治めていた。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">carriage</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">馬車；車両</div><div class="ex">In the old story, the princess rode in a golden <b>carriage</b>.</div><div class="xj">その昔話では、王女は金色の馬車に乗っていた。</div></button></li><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">slope</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">坂；斜面</div><div class="ex">The children ran down the grassy <b>slope</b> together.</div><div class="xj">子どもたちは草の生えた坂を一緒にかけ下りた。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">belongings</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">持ち物</div><div class="ex">Please take all your <b>belongings</b> when you leave the train.</div><div class="xj">電車を降りるときは、持ち物をすべてお持ちください。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">conductor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指揮者；車掌</div><div class="ex">The <b>conductor</b> raised his hands, and the music began.</div><div class="xj">指揮者が両手を上げると、音楽が始まった。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">bride</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">花嫁</div><div class="ex">The <b>bride</b> wore a long white dress at the wedding.</div><div class="xj">結婚式で、花嫁は長い白いドレスを着ていた。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">doorway</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">出入り口</div><div class="ex">A big dog was sleeping in the <b>doorway</b> of the shop.</div><div class="xj">大きな犬が店の出入り口で寝ていた。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">efficiency</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">効率</div><div class="ex">The new computers improved the <b>efficiency</b> of our work.</div><div class="xj">新しいコンピューターで、私たちの仕事の効率が上がった。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">conflict</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">争い；対立</div><div class="ex">There was a <b>conflict</b> between the two clubs over the gym.</div><div class="xj">体育館の使い方をめぐって、2つの部の間で争いが起きた。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">principle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">原理；原則</div><div class="ex">This machine works on a very simple <b>principle</b>.</div><div class="xj">この機械はとても単純な原理で動いている。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">priority</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">優先（事項）</div><div class="ex">Safety is our top <b>priority</b> on the school trip.</div><div class="xj">修学旅行では、安全が私たちの一番の優先事項だ。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">element</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">要素
