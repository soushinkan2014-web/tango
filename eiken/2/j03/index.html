</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　熟語 Set 3</h1><div class="sub">つなぎ語・時の熟語</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../j03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="熟21"><div class="top"><span class="no">熟21</span><span class="en">for instance</span></div><div class="ja">たとえば</div><div class="ex">There are many ways to save energy. For instance, you can turn off the lights when you leave a room.</div><div class="xj">エネルギーを節約する方法はたくさんある。たとえば、部屋を出るときに電気を消すことができる。</div></button></li><li><button class="w" data-no="熟22"><div class="top"><span class="no">熟22</span><span class="en">as a general rule</span></div><div class="ja">原則として、一般に</div><div class="ex">As a general rule, students may not use phones in class.</div><div class="xj">原則として、生徒は授業中に電話を使ってはいけない。</div></button></li><li><button class="w" data-no="熟23"><div class="top"><span class="no">熟23</span><span class="en">in other words</span></div><div class="ja">言いかえれば、つまり</div><div class="ex">The shop is open 24 hours. In other words, you can go there anytime.</div><div class="xj">その店は24時間営業だ。つまり、いつでも行けるということだ。</div></button></li><li><button class="w" data-no="熟24"><div class="top"><span class="no">熟24</span><span class="en">on the whole</span></div><div class="ja">全体として、概して</div><div class="ex">There were a few problems, but on the whole, the event was a success.</div><div class="xj">いくつか問題はあったが、全体としてそのイベントは成功だった。</div></button></li><li><button class="w" data-no="熟25"><div class="top"><span class="no">熟25</span><span class="en">up until now</span></div><div class="ja">今までは</div><div class="ex">Up until now, I have never been abroad.</div><div class="xj">今までのところ、私は一度も海外に行ったことがない。</div></button></li><li><button class="w" data-no="熟26"><div class="top"><span class="no">熟26</span><span class="en">for the time being</span></div><div class="ja">当面は、しばらくは</div><div class="ex">I&#x27;ll use my old bike for the time being.</div><div class="xj">当面は古い自転車を使うつもりだ。</div></button></li><li><button class="w" data-no="熟27"><div class="top"><span class="no">熟27</span><span class="en">at times</span></div><div class="ja">時々</div><div class="ex">At times, I feel nervous when I speak English.</div><div class="xj">英語を話すとき、時々緊張する。</div></button></li><li><button class="w" data-no="熟28"><div class="top"><span class="no">熟28</span><span class="en">on the contrary</span></div><div class="ja">それどころか、反対に</div><div class="ex">The test wasn&#x27;t easy. On the contrary, it was very difficult.</div><div class="xj">テストは簡単ではなかった。それどころか、とても難しかった。</div></button></li><li><button class="w" data-no="熟29"><div class="top"><span class="no">熟29</span><span class="en">in contrast (to ～)</span></div><div class="ja">（～と）対照的に</div><div class="ex">In contrast to his brother, Ken is very quiet.</div><div class="xj">兄とは対照的に、健はとても物静かだ。</div></button></li><li><button class="w" data-no="熟30"><div class="top"><span class="no">熟30</span><span class="en">as a consequence</span></div><div class="ja">その結果</div><div class="ex">He stayed up late playing games. As a consequence, he was late for school.</div><div class="xj">彼はゲームをして夜更かしした。その結果、学校に遅刻した。</div></button></li><li><button class="w" data-no="会11"><div class="top"><span class="no">会11</span><span class="en">You mean ～?</span></div><div class="ja">～ということ？（聞き返し）</div><div class="ex">A: Let&#x27;s meet at the usual place.<br>B: You mean the café near the station?</div></button></li><li><button class="w" data-no="会12"><div class="top"><span class="no">会12</span><span class="en">Are you sure?</span></div><div class="ja">本当に？・確かなの？</div><div class="ex">A: I can finish this report by myself.<br>B: Are you sure? It looks like a lot of work.</div></button></li><li><button class="w" data-no="会13"><div class="top"><span class="no">会13</span><span class="en">Did you say ～?</span></div><div class="ja">～と言った？</div><div class="ex">A: The meeting has moved to Room 305.<br>B: Sorry, did you say Room 305 or 315?</div></button></li><li><button class="w" data-no="会14"><div class="top"><span class="no">会14</span><span class="en">～, right?</span></div><div class="ja">～だよね？（確認）</div><div class="ex">A: You used to live in Canada, right?<br>B: Yes, for three years.</div></button></li><li><button class="w" data-no="会15"><div class="top"><span class="no">会15</span><span class="en">Just to be sure, ～.</span></div><div class="ja">念のため、～。</div><div class="ex">A: Just to be sure, the meeting starts at three, doesn&#x27;t it?<br>B: Yes. Don&#x27;t be late.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j02/">← 熟語 Set 2</a><a href="../j04/">熟語 Set 4 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟21": 5.05, "熟22": 21.51, "熟23": 37.25, "熟24": 53.93, "熟25": 69.48, "熟26": 82.55, "熟27": 96.32, "熟28": 109.88, "熟29": 126.2, "熟30": 141.58, "会11": 157.92, "会12": 176.0, "会13": 195.1, "会14": 213.26, "会15": 230.63}, "TE": {"熟21": 7.0, "熟22": 23.67, "熟23": 39.17, "熟24": 55.8, "熟25": 71.37, "熟26": 84.59, "熟27": 98.2, "熟28": 111.82, "熟29": 128.52, "熟30": 143.69, "会11": 159.79, "会12": 177.88, "会13": 196.97, "会14": 215.13, "会15": 232.57}, "Q": [["熟21", "for instance", "たとえば"], ["熟22", "as a general rule", "原則として、一般に"], ["熟23", "in other words", "言いかえれば、つまり"], ["熟24", "on the whole", "全体として、概して"], ["熟25", "up until now", "今までは"], ["熟26", "for the time being", "当面は、しばらくは"]
