ass="xj">お母さんはその知らせにどう反応したの？</div></button></li><li><button class="w" data-no="復245"><div class="top"><span class="no">復245</span><span class="en">inspire</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を奮い立たせる；～にひらめきを与える</div><div class="ex">The coach&#x27;s words <b>inspired</b> the team.</div><div class="xj">コーチの言葉がチームを奮い立たせた。</div></button></li><li><button class="w" data-no="復246"><div class="top"><span class="no">復246</span><span class="en">announce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を発表する；知らせる</div><div class="ex">The school <b>announced</b> the date of the sports day.</div><div class="xj">学校は運動会の日程を発表した。</div></button></li><li><button class="w" data-no="復247"><div class="top"><span class="no">復247</span><span class="en">dislike</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を嫌う</div><div class="ex">My little sister <b>dislikes</b> green peppers.</div><div class="xj">妹はピーマンを嫌っている。</div></button></li><li><button class="w" data-no="復248"><div class="top"><span class="no">復248</span><span class="en">impress</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に感銘を与える</div><div class="ex">Ken&#x27;s speech <b>impressed</b> everyone in the hall.</div><div class="xj">ケンのスピーチは会場のみんなに感銘を与えた。</div></button></li><li><button class="w" data-no="復249"><div class="top"><span class="no">復249</span><span class="en">inform</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に知らせる</div><div class="ex">Please <b>inform</b> us if you can&#x27;t come.</div><div class="xj">来られない場合は、私たちに知らせてください。</div></button></li><li><button class="w" data-no="復250"><div class="top"><span class="no">復250</span><span class="en">shut</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を閉める</div><div class="ex">Please <b>shut</b> the door when you leave the room.</div><div class="xj">部屋を出るときは、ドアを閉めてください。</div></button></li><li><button class="w" data-no="復251"><div class="top"><span class="no">復251</span><span class="en">lift</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を持ち上げる</div><div class="ex">Can you help me <b>lift</b> this heavy box?</div><div class="xj">この重い箱を持ち上げるのを手伝ってくれる？</div></button></li><li><button class="w" data-no="復252"><div class="top"><span class="no">復252</span><span class="en">suit</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に似合う；～に都合がよい</div><div class="ex">That blue dress really <b>suits</b> you.</div><div class="xj">あの青いドレスは本当にあなたに似合っている。</div></button></li><li><button class="w" data-no="復253"><div class="top"><span class="no">復253</span><span class="en">relate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（be related to ～）～と関係がある</div><div class="ex">This question is <b>related</b> to today&#x27;s lesson.</div><div class="xj">この質問は今日の授業と関係がある。</div></button></li><li><button class="w" data-no="復254"><div class="top"><span class="no">復254</span><span class="en">roll</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">転がる；～を転がす</div><div class="ex">The ball <b>rolled</b> down the hill.</div><div class="xj">ボールが坂を転がり落ちた。</div></button></li><li><button class="w" data-no="復255"><div class="top"><span class="no">復255</span><span class="en">disadvantage</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">不利な点</div><div class="ex">One <b>disadvantage</b> of this phone is its small screen.</div><div class="xj">このスマートフォンの不利な点の一つは、画面が小さいことだ。</div></button></li><li><button class="w" data-no="復256"><div class="top"><span class="no">復256</span><span class="en">income</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">収入</div><div class="ex">My aunt has a good <b>income</b> from her new job.</div><div class="xj">おばは新しい仕事でよい収入を得ている。</div></button></li><li><button class="w" data-no="復257"><div class="top"><span class="no">復257</span><span class="en">preparation</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">準備</div><div class="ex">We spent a week on <b>preparations</b> for the festival.</div><div class="xj">私たちは文化祭の準備に1週間かけた。</div></button></li><li><button class="w" data-no="復258"><div class="top"><span class="no">復258</span><span class="en">chemical</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">化学物質；化学薬品</div><div class="ex">Some <b>chemicals</b> can be dangerous to fish.</div><div class="xj">化学物質の中には、魚にとって危険なものもある。</div></button></li><li><button class="w" data-no="復259"><div class="top"><span class="no">復259</span><span class="en">blood</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">血；血液</div><div class="ex">The heart sends <b>blood</b> to every part of the body.</div><div class="xj">心臓は血を体のすみずみに送り出している。</div></button></li><li><button class="w" data-no="復260"><div class="top"><span class="no">復260</span><span class="en">importance</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">重要性</div><div class="ex">Our teacher told us about the <b>importance</b> of sleep.</div><div class="xj">先生は睡眠の重要性について話してくれた。</div></button></li><li><button class="w" data-no="復261"><div class="top"><span class="no">復261</span><span class="en">law</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">法律</div><div class="ex">Drivers must follow the <b>law</b> and drive safely.</div><div class="xj">運転手は法律を守って安全に運転しなければならない。</div></button></li><li><button class="w" data-no="復262"><div class="top"><span class="no">復262</span><span class="en">profit</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">利益</div><div class="ex">The shop made a big <b>profit</b> last year.</div><div class="xj">その店は昨年、大きな利益を上げた。</div></button></li><li><button class="
