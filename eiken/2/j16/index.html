My mother always sides with my little brother.</div><div class="xj">母はいつも弟の味方をする。</div></button></li><li><button class="w" data-no="熟156"><div class="top"><span class="no">熟156</span><span class="en">from one&#x27;s point of view</span></div><div class="ja">～の観点からは、～の考えでは</div><div class="ex">From my point of view, the plan has too many problems.</div><div class="xj">私の考えでは、その計画には問題が多すぎる。</div></button></li><li><button class="w" data-no="熟157"><div class="top"><span class="no">熟157</span><span class="en">when it comes to ～</span></div><div class="ja">～のことになると</div><div class="ex">When it comes to cooking, my father is the best in our family.</div><div class="xj">料理のことになると、父が家族でいちばんだ。</div></button></li><li><button class="w" data-no="熟158"><div class="top"><span class="no">熟158</span><span class="en">as far as ～ is concerned</span></div><div class="ja">～に関する限り</div><div class="ex">As far as I&#x27;m concerned, the price is not a problem.</div><div class="xj">私に関する限り、値段は問題ではない。</div></button></li><li><button class="w" data-no="熟159"><div class="top"><span class="no">熟159</span><span class="en">It goes without saying that ～</span></div><div class="ja">～は言うまでもない</div><div class="ex">It goes without saying that health is important.</div><div class="xj">健康が大切なのは言うまでもない。</div></button></li><li><button class="w" data-no="熟160"><div class="top"><span class="no">熟160</span><span class="en">take ～ into account</span></div><div class="ja">～を考慮に入れる</div><div class="ex">We should take the cost into account.</div><div class="xj">費用を考慮に入れるべきだ。</div></button></li><li><button class="w" data-no="会76"><div class="top"><span class="no">会76</span><span class="en">If you ask me, ～.</span></div><div class="ja">私に言わせれば、～。</div><div class="ex">A: Should schools start later in the morning?<br>B: If you ask me, that&#x27;s a great idea.</div></button></li><li><button class="w" data-no="会77"><div class="top"><span class="no">会77</span><span class="en">Personally, ～.</span></div><div class="ja">個人的には、～。</div><div class="ex">A: Which do you like better, summer or winter?<br>B: Personally, I prefer winter.</div></button></li><li><button class="w" data-no="会78"><div class="top"><span class="no">会78</span><span class="en">I&#x27;d say ～.</span></div><div class="ja">（たぶん）～だと思う。</div><div class="ex">A: How long will it take to finish?<br>B: I&#x27;d say about an hour.</div></button></li><li><button class="w" data-no="会79"><div class="top"><span class="no">会79</span><span class="en">I don&#x27;t think you should ～.</span></div><div class="ja">～しないほうがいいと思う。</div><div class="ex">A: I&#x27;m thinking of quitting the swim team.<br>B: I don&#x27;t think you should. You enjoy it so much.</div></button></li><li><button class="w" data-no="会80"><div class="top"><span class="no">会80</span><span class="en">It&#x27;s your call.</span></div><div class="ja">あなたが決めることだよ。</div><div class="ex">A: Should we eat Italian or Chinese tonight?<br>B: I&#x27;m happy with both. It&#x27;s your call.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j15/">← 熟語 Set 15</a><a href="../j17/">熟語 Set 17 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟151": 5.27, "熟152": 20.38, "熟153": 35.04, "熟154": 48.72, "熟155": 62.52, "熟156": 76.14, "熟157": 93.35, "熟158": 107.84, "熟159": 123.46, "熟160": 138.43, "会76": 152.01, "会77": 169.36, "会78": 186.75, "会79": 202.6, "会80": 221.72}, "TE": {"熟151": 7.14, "熟152": 22.59, "熟153": 36.92, "熟154": 50.59, "熟155": 64.39, "熟156": 78.5, "熟157": 95.22, "熟158": 110.26, "熟159": 125.91, "熟160": 140.45, "会76": 153.93, "会77": 171.23, "会78": 188.62, "会79": 204.64, "会80": 223.6}, "Q": [["熟151", "go along with ～", "～に賛成する、～に従う"], ["熟152", "be in favor of ～", "～に賛成している"], ["熟153", "be opposed to ～", "～に反対している"], ["熟154", "object to ～", "～に反対する"], ["熟155", "side with ～", "～の味方をする"], ["熟156", "from one's point of view", "～の観点からは、～の考えでは"],
