and oxygen.</div><div class="xj">水は水素と酸素で構成されている。</div></button></li><li><button class="w" data-no="熟66"><div class="top"><span class="no">熟66</span><span class="en">range from A to B</span></div><div class="ja">（範囲が）AからBに及ぶ</div><div class="ex">Prices range from 500 yen to 3,000 yen.</div><div class="xj">値段は500円から3,000円まである。</div></button></li><li><button class="w" data-no="熟67"><div class="top"><span class="no">熟67</span><span class="en">on average</span></div><div class="ja">平均して</div><div class="ex">On average, students here study two hours a day.</div><div class="xj">ここの生徒は平均して1日2時間勉強する。</div></button></li><li><button class="w" data-no="熟68"><div class="top"><span class="no">熟68</span><span class="en">die out</span></div><div class="ja">絶滅する、すたれる</div><div class="ex">Many kinds of animals may die out if the forests disappear.</div><div class="xj">森がなくなれば、多くの種類の動物が絶滅するかもしれない。</div></button></li><li><button class="w" data-no="熟69"><div class="top"><span class="no">熟69</span><span class="en">be exposed to ～</span></div><div class="ja">～にさらされる</div><div class="ex">Children should not be exposed to loud noise for a long time.</div><div class="xj">子どもは長時間大きな音にさらされるべきではない。</div></button></li><li><button class="w" data-no="熟70"><div class="top"><span class="no">熟70</span><span class="en">break down</span></div><div class="ja">故障する、（物質が）分解される</div><div class="ex">Plastic takes a very long time to break down in nature.</div><div class="xj">プラスチックは自然の中で分解されるのにとても長い時間がかかる。</div></button></li><li><button class="w" data-no="会31"><div class="top"><span class="no">会31</span><span class="en">Is this the way to ～?</span></div><div class="ja">～へはこの道で合っていますか？</div><div class="ex">A: Excuse me. Is this the way to Green Park?<br>B: Yes. Go straight, and you&#x27;ll see it on your left.</div></button></li><li><button class="w" data-no="会32"><div class="top"><span class="no">会32</span><span class="en">You look lost.</span></div><div class="ja">道に迷っているみたいですね。</div><div class="ex">A: You look lost. Can I help you?<br>B: Yes, please. I&#x27;m looking for the post office.</div></button></li><li><button class="w" data-no="会33"><div class="top"><span class="no">会33</span><span class="en">You can&#x27;t miss it.</span></div><div class="ja">すぐにわかりますよ。</div><div class="ex">A: Where is the bank?<br>B: Turn left at the corner. It&#x27;s a big red building. You can&#x27;t miss it.</div></button></li><li><button class="w" data-no="会34"><div class="top"><span class="no">会34</span><span class="en">It&#x27;s within walking distance.</span></div><div class="ja">歩いて行ける距離です。</div><div class="ex">A: Do I need to take a taxi to the stadium?<br>B: No. It&#x27;s within walking distance.</div></button></li><li><button class="w" data-no="会35"><div class="top"><span class="no">会35</span><span class="en">I&#x27;m new here.</span></div><div class="ja">ここは初めてで（よく知らないんです）。</div><div class="ex">A: Excuse me. Where is the nearest station?<br>B: Sorry, I&#x27;m new here myself.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j06/">← 熟語 Set 6</a><a href="../j08/">熟語 Set 8 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟61": 5.05, "熟62": 18.73, "熟63": 32.67, "熟64": 47.59, "熟65": 60.64, "熟66": 74.7, "熟67": 90.52, "熟68": 104.46, "熟69": 119.09, "熟70": 133.87, "会31": 149.04, "会32": 169.91, "会33": 189.7, "会34": 208.84, "会35": 228.06}, "TE": {"熟61": 7.0, "熟62": 20.65, "熟63": 34.54, "熟64": 49.46, "熟65": 62.56, "熟66": 77.01, "熟67": 92.44, "熟68": 106.33, "熟69": 121.11, "熟70": 135.74, "会31": 151.03, "会32": 171.92, "会33": 191.62, "会34": 211.39, "会35": 229.93}, "Q": [["熟61", "flow into ～", "～に流れ込む"], ["熟62", "a series of ～", "一連の～"], ["熟63", "a number of ～", "いくつもの～、多くの～"], ["熟64", "consist of ～", "～から成る"], ["熟65", "be made up of ～", "～で構成されている"], ["熟66", "range from A to B", "AからBに及ぶ"], ["熟67", "on average", "平均して"], ["熟68", "die out", "絶滅する、すたれる
