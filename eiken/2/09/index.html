</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第9回</h1><div class="sub">No.481〜540</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">dominate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を支配する</div><div class="ex">One team <b>dominated</b> the game from start to finish.</div><div class="xj">一方のチームが、最初から最後まで試合を支配した。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">elect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を選挙で選ぶ</div><div class="ex">Our class <b>elected</b> Emi as the new class leader.</div><div class="xj">私たちのクラスは、新しい学級委員長にエミを選挙で選んだ。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">endure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に耐える</div><div class="ex">The runners had to <b>endure</b> the heat during the long race.</div><div class="xj">ランナーたちは長いレースの間、暑さに耐えなければならなかった。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">enhance</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を高める</div><div class="ex">Reading many books will <b>enhance</b> your writing skills.</div><div class="xj">たくさんの本を読むことは、書く力を高めるだろう。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">exclude</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を除外する</div><div class="ex">This list <b>excludes</b> students who have already paid.</div><div class="xj">このリストは、すでにお金を払った生徒を除外している。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">exhaust</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を疲れさせる；使い果たす</div><div class="ex">The long hike in the mountains <b>exhausted</b> all of us.</div><div class="xj">山での長いハイキングで、私たちはみんな疲れ果てた。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">highlight</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を強調する</div><div class="ex">The report <b>highlights</b> the need for more parks in the city.</div><div class="xj">その報告書は、市にもっと公園が必要だと強調している。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">migrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">移住する；（鳥などが）渡る</div><div class="ex">Many people <b>migrated</b> from the countryside to big cities.</div><div class="xj">多くの人々が、地方から大都市へ移住した。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">modify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を修正する</div><div class="ex">Ken <b>modified</b> his plan after talking with his teacher.</div><div class="xj">ケンは先生と話したあと、計画を修正した。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">neglect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を怠る；無視する</div><div class="ex">Don&#x27;t <b>neglect</b> your homework because of club activities.</div><div class="xj">部活動のせいで、宿題を怠ってはいけない。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">negotiate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">交渉する</div><div class="ex">Tom <b>negotiated</b> with the store owner for a lower price.</div><div class="xj">トムは値下げしてもらおうと、店主と交渉した。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">protest</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">抗議する</div><div class="ex">Local people <b>protested</b> against the plan to cut down the forest.</div><div class="xj">地元の人々は、森を切り開く計画に抗議した。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">recruit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を募集する；採用する</div><div class="ex">Our club is <b>recruiting</b> new members this month.</div><div class="xj">私たちの部は今月、新入部員を募集している。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">retain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を保持する</div><div class="ex">Our town wants to <b>retain</b> its old streets and houses.</div><div class="xj">私たちの町は、古い通りや家並みを保持したいと考えている。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">nerve</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">神経</div><div class="ex">The <b>nerves</b> in our skin send messages to the brain.</div><div class="xj">皮膚の神経は脳に信号を送っている。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">obligation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">義務</div><div class="ex">Parents have an <b>obligation</b> to send their children to school.</div><div class="xj">親には子どもを学校に通わせる義務がある。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">opponent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">相手；敵</div><div class="ex">Ken shook hands with his <b>opponent</b> after the tennis match.</div><div class="xj">ケンはテニスの試合のあと、相手と握手をした。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">organ</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">臓器；オルガン</div><div class="ex">The heart is one of the most important <b>organs</b> in the body.</div><div class="xj">心臓は体の中で最も大切な臓器の一つだ。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">organism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生物</div><div class="ex">Very small <b>organisms</b> live in every drop of pond water.</div><div class="xj">池の水の一滴一滴に、とても小さな生物がすんでいる。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">outline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">概要；輪郭</div><div class="ex">The teacher gave us an <b>outline</b> of the new project.</div><div class="xj">先生は私たちに、新しい課題の概要を説明した。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">oxygen</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">酸素</div><div class="ex">Plants give off <b>oxygen</b> when they get sunlight.</div><div class="xj">植物は日光を浴びると酸素を出す。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">perception</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">認識；知覚</div><div class="ex">Living abroad changed Lisa&#x27;s <b>perception</b> of her own country.</div><div class="xj">外国で暮らしたことで、リサの自分の国に対する認識が変わった。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">pioneer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">先駆者</div><div class="ex">This scientist was a <b>pioneer</b> in the study of robots.</div><div class="xj">この科学者は、ロボット研究の先駆者だった。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">plot</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（物語の）筋；陰謀</div><div class="ex">The <b>plot</b> of this movie was hard to follow.</div><div class="xj">この映画の筋は、わかりにくかった。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">portrait</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">肖像画</div><div class="ex">This <b>portrait</b> of the king was painted 300 years ago.</div><div class="xj">この王の肖像画は、300年前に描かれた。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">prediction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">予測</div><div class="ex">Tom&#x27;s <b>prediction</b> about the game was correct.</div><div class="xj">試合についてのトムの予測は当たった。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">preference</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">好み</div><div class="ex">Do you have a <b>preference</b> for tea or coffee?</div><div class="xj">紅茶とコーヒーで、お好みはありますか。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">prejudice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">偏見</div><div class="ex">We should not have <b>prejudice</b> against people from other countries.</div><div class="xj">外国の人々に対して偏見を持つべきではない。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">privacy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">プライバシー；私生活</div><div class="ex">Please respect the <b>privacy</b> of other guests at the hotel.</div><div class="xj">ホテルのほかのお客様のプライバシーを尊重してください。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">procedure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手順；手続き</div><div class="ex">Please follow this <b>procedure</b> when you use the machine.</div><div class="xj">その機械を使うときは、この手順に従ってください。</div></button></li><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">protein</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">タンパク質</div><div class="ex">Eggs and beans are good sources of <b>protein</b>.</div><div class="xj">卵や豆は、タンパク質をとるのによい食べ物だ。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">recognition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">認識；承認</div><div class="ex">There is growing <b>recognition</b> that sleep is important for health.</div><div class="xj">睡眠は健康にとって大切だという認識が広がっている。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">refugee</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">難民</div><div class="ex">Many countries help <b>refugees</b> by giving them food and homes.</div><div class="xj">多くの国が、食べ物や住む所を提供して難民を助けている。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">residence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">住居；居住</div><div class="ex">This old house was once the <b>residence</b> of a famous writer.</div><div class="xj">この古い家は、かつてある有名な作家の住居だった。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">revolution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">革命</div><div class="ex">Smartphones brought about a <b>revolution</b> in the way we communicate.</div><div class="xj">スマートフォンは、私たちの連絡のとり方に革命をもたらした。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">sector</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部門；分野</div><div class="ex">More people are working in the service <b>sector</b> these days.</div><div class="xj">最近は、サービス部門で働く人が増えている。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">settlement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">解決；入植地</div><div class="ex">The two companies finally reached a <b>settlement</b> after long talks.</div><div class="xj">2つの会社は長い話し合いの末、ついに解決に至った。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">signature</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">署名</div><div class="ex">Please write your <b>signature</b> at the bottom of this paper.</div><div class="xj">この用紙のいちばん下に署名をしてください。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">spirit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">精神；霊</div><div class="ex">The team showed a great fighting <b>spirit</b> in the final.</div><div class="xj">チームは決勝で、すばらしい闘争精神を見せた。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">
