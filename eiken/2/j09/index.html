 to ～</span></div><div class="ja">苦労して～する、骨を折る</div><div class="ex">The teacher took pains to explain the problem clearly.</div><div class="xj">先生はその問題をわかりやすく説明しようと骨を折った。</div></button></li><li><button class="w" data-no="熟86"><div class="top"><span class="no">熟86</span><span class="en">have a good command of ～</span></div><div class="ja">～（言語）を自由に使いこなす</div><div class="ex">Ms. Sato has a good command of Chinese.</div><div class="xj">佐藤先生は中国語を自由に使いこなす。</div></button></li><li><button class="w" data-no="熟87"><div class="top"><span class="no">熟87</span><span class="en">make sense</span></div><div class="ja">意味が通じる、筋が通る</div><div class="ex">Your explanation doesn&#x27;t make sense to me.</div><div class="xj">あなたの説明は私には意味がわからない。</div></button></li><li><button class="w" data-no="熟88"><div class="top"><span class="no">熟88</span><span class="en">make a living</span></div><div class="ja">生計を立てる</div><div class="ex">He makes a living by selling vegetables at the market.</div><div class="xj">彼は市場で野菜を売って生計を立てている。</div></button></li><li><button class="w" data-no="熟89"><div class="top"><span class="no">熟89</span><span class="en">make a difference</span></div><div class="ja">違いを生む、影響を与える</div><div class="ex">Even a small donation can make a difference.</div><div class="xj">少しの寄付でも大きな違いを生むことがある。</div></button></li><li><button class="w" data-no="熟90"><div class="top"><span class="no">熟90</span><span class="en">make an effort</span></div><div class="ja">努力する</div><div class="ex">Lisa made an effort to talk to her new classmates.</div><div class="xj">リサは新しいクラスメートに話しかけようと努力した。</div></button></li><li><button class="w" data-no="会41"><div class="top"><span class="no">会41</span><span class="en">Would you like me to ～?</span></div><div class="ja">（私が）～しましょうか？</div><div class="ex">A: This bag is so heavy.<br>B: Would you like me to carry it for you?</div></button></li><li><button class="w" data-no="会42"><div class="top"><span class="no">会42</span><span class="en">Shall I ～?</span></div><div class="ja">～しましょうか？</div><div class="ex">A: It&#x27;s getting dark in here.<br>B: Shall I turn on the lights?</div></button></li><li><button class="w" data-no="会43"><div class="top"><span class="no">会43</span><span class="en">If you don&#x27;t mind, ～.</span></div><div class="ja">もしよければ、～。</div><div class="ex">A: Where would you like to sit?<br>B: If you don&#x27;t mind, I&#x27;d like a seat by the window.</div></button></li><li><button class="w" data-no="会44"><div class="top"><span class="no">会44</span><span class="en">How about ～ing?</span></div><div class="ja">～するのはどう？</div><div class="ex">A: I don&#x27;t know what to give Mom for her birthday.<br>B: How about making her a card?</div></button></li><li><button class="w" data-no="会45"><div class="top"><span class="no">会45</span><span class="en">Feel free to ～.</span></div><div class="ja">遠慮なく～してね。</div><div class="ex">A: Thank you for showing me around the school.<br>B: You&#x27;re welcome. Feel free to ask me anything.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j08/">← 熟語 Set 8</a><a href="../j10/">熟語 Set 10 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟81": 4.98, "熟82": 17.58, "熟83": 31.06, "熟84": 44.74, "熟85": 61.68, "熟86": 77.01, "熟87": 92.44, "熟88": 106.54, "熟89": 120.03, "熟90": 134.52, "会41": 147.79, "会42": 164.27, "会43": 179.55, "会44": 196.39, "会45": 213.64}, "TE": {"熟81": 6.85, "熟82": 19.45, "熟83": 32.93, "熟84": 47.4, "熟85": 63.62, "熟86": 79.24, "熟87": 94.31, "熟88": 108.42, "熟89": 121.97, "熟90": 136.39, "会41": 149.68, "会42": 166.14, "会43": 181.52, "会44": 198.62, "会45": 215.53}, "Q": [["熟81", "take a nap", "昼寝をする"], ["熟82", "make a mess", "散らかす"], ["熟83", "kill time", "時間をつぶす"], ["熟84", "have second thoughts (about ～)", "考え直す"], ["熟85", "take pains to ～", "苦労して～する、骨を折る"], ["熟86", "have a good command of ～", "～を自由に使いこなす"], ["熟87", "make sense", "意味が通じる、筋が通る"]
