</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第15回</h1><div class="sub">No.841〜900</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="841"><div class="top"><span class="no">841</span><span class="en">evacuate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を避難させる；避難する</div><div class="ex">During the fire drill, teachers <b>evacuated</b> the students quickly.</div><div class="xj">避難訓練で、先生たちは生徒をすばやく避難させた。</div></button></li><li><button class="w" data-no="842"><div class="top"><span class="no">842</span><span class="en">modernize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を近代化する</div><div class="ex">The town plans to <b>modernize</b> its old train station.</div><div class="xj">その町は、古い駅を近代化する計画だ。</div></button></li><li><button class="w" data-no="843"><div class="top"><span class="no">843</span><span class="en">diagnose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を診断する</div><div class="ex">The doctor <b>diagnosed</b> Ken&#x27;s illness as a bad cold.</div><div class="xj">医者は、ケンの病気をひどいかぜだと診断した。</div></button></li><li><button class="w" data-no="844"><div class="top"><span class="no">844</span><span class="en">glance</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ちらっと見る</div><div class="ex">Tom <b>glanced</b> at the clock during the test.</div><div class="xj">トムはテスト中に、時計をちらっと見た。</div></button></li><li><button class="w" data-no="845"><div class="top"><span class="no">845</span><span class="en">accumulate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をためる；たまる</div><div class="ex">Ken <b>accumulated</b> a lot of points by shopping at that store.</div><div class="xj">ケンはその店で買い物をして、たくさんのポイントをためた。</div></button></li><li><button class="w" data-no="846"><div class="top"><span class="no">846</span><span class="en">notify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に通知する</div><div class="ex">The school <b>notified</b> parents about the change in schedule.</div><div class="xj">学校は、予定の変更について保護者に通知した。</div></button></li><li><button class="w" data-no="847"><div class="top"><span class="no">847</span><span class="en">lessen</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を減らす；軽くする</div><div class="ex">Taking a short walk can <b>lessen</b> the stress of studying.</div><div class="xj">少し散歩することで、勉強のストレスを減らすことができる。</div></button></li><li><button class="w" data-no="848"><div class="top"><span class="no">848</span><span class="en">incorporate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り入れる</div><div class="ex">Our teacher <b>incorporates</b> games into her English lessons.</div><div class="xj">先生は、英語の授業にゲームを取り入れている。</div></button></li><li><button class="w" data-no="849"><div class="top"><span class="no">849</span><span class="en">embrace</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を受け入れる；抱きしめる</div><div class="ex">The town <b>embraced</b> the new ideas of young people.</div><div class="xj">その町は、若者たちの新しい考えを受け入れた。</div></button></li><li><button class="w" data-no="850"><div class="top"><span class="no">850</span><span class="en">endanger</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を危険にさらす</div><div class="ex">Plastic trash in the sea <b>endangers</b> many animals.</div><div class="xj">海のプラスチックごみは、多くの動物を危険にさらしている。</div></button></li><li><button class="w" data-no="851"><div class="top"><span class="no">851</span><span class="en">enrich</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を豊かにする</div><div class="ex">Reading many kinds of books will <b>enrich</b> your life.</div><div class="xj">いろいろな本を読むことは、あなたの人生を豊かにするだろう。</div></button></li><li><button class="w" data-no="852"><div class="top"><span class="no">852</span><span class="en">nurture</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を育てる</div><div class="ex">Good teachers <b>nurture</b> the talents of their students.</div><div class="xj">よい先生は、生徒の才能を育てる。</div></button></li><li><button class="w" data-no="853"><div class="top"><span class="no">853</span><span class="en">lifespan</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">寿命</div><div class="ex">The <b>lifespan</b> of a dog is usually ten to fifteen years.</div><div class="xj">犬の寿命は、ふつう10年から15年だ。</div></button></li><li><button class="w" data-no="854"><div class="top"><span class="no">854</span><span class="en">rehabilitation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">リハビリ；社会復帰</div><div class="ex">After his leg injury, Tom needed three months of <b>rehabilitation</b>.</div><div class="xj">足のけがのあと、トムには3か月のリハビリが必要だった。</div></button></li><li><button class="w" data-no="855"><div class="top"><span class="no">855</span><span class="en">handful</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">一握り；少数</div><div class="ex">Only a <b>handful</b> of people came to the concert in the rain.</div><div class="xj">雨の中、そのコンサートに来たのはほんの一握りの人だけだった。</div></button></li><li><button class="w" data-no="856"><div class="top"><span class="no">856</span><span class="en">excess</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">超過；過剰</div><div class="ex">My suitcase was too heavy, and I paid for the <b>excess</b>.</div><div class="xj">スーツケースが重すぎて、私は超過分の料金を払った。</div></button></li><li><button class="w" data-no="857"><div class="top"><span class="no">857</span><span class="en">grief</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">深い悲しみ</div><div class="ex">Talking with friends can help you get over your <b>grief</b>.</div><div class="xj">友だちと話すことは、深い悲しみを乗りこえる助けになる。</div></button></li><li><button class="w" data-no="858"><div class="top"><span class="no">858</span><span class="en">controversy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">論争</div><div class="ex">The new school uniform caused a lot of <b>controversy</b>.</div><div class="xj">新しい制服は、多くの論争を引き起こした。</div></button></li><li><button class="w" data-no="859"><div class="top"><span class="no">859</span><span class="en">partnership</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">協力関係；共同経営</div><div class="ex">Our school has a <b>partnership</b> with a school in another country.</div><div class="xj">私たちの学校は、外国の学校と協力関係を結んでいる。</div></button></li><li><button class="w" data-no="860"><div class="top"><span class="no">860</span><span class="en">draft</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">下書き</div><div class="ex">Lisa wrote the first <b>draft</b> of her speech last night.</div><div class="xj">リサは昨夜、スピーチの最初の下書きを書いた。</div></button></li><li><button class="w" data-no="861"><div class="top"><span class="no">861</span><span class="en">immigration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（外国からの）移住；入国管理</div><div class="ex"><b>Immigration</b> from other countries has changed this town.</div><div class="xj">外国からの移住によって、この町は変わった。</div></button></li><li><button class="w" data-no="862"><div class="top"><span class="no">862</span><span class="en">epidemic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（病気の）流行</div><div class="ex">The flu <b>epidemic</b> closed many schools last winter.</div><div class="xj">昨年の冬、インフルエンザの流行で多くの学校が休校になった。</div></button></li><li><button class="w" data-no="863"><div class="top"><span class="no">863</span><span class="en">expertise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">専門知識</div><div class="ex">We need Ken&#x27;s <b>expertise</b> in computers for this project.</div><div class="xj">この企画には、コンピューターに関するケンの専門知識が必要だ。</div></button></li><li><button class="w" data-no="864"><div class="top"><span class="no">864</span><span class="en">merit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">長所；利点</div><div class="ex">Both plans have their own <b>merits</b>, so it is hard to choose.</div><div class="xj">どちらの計画にも長所があるので、選ぶのが難しい。</div></button></li><li><button class="w" data-no="865"><div class="top"><span class="no">865</span><span class="en">hygiene</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">衛生</div><div class="ex">Restaurant workers must pay close attention to <b>hygiene</b>.</div><div class="xj">レストランの従業員は、衛生によく気をつけなければならない。</div></button></li><li><button class="w" data-no="866"><div class="top"><span class="no">866</span><span class="en">complexity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">複雑さ</div><div class="ex">The <b>complexity</b> of the math problem surprised Ken.</div><div class="xj">ケンは、その数学の問題の複雑さに驚いた。</div></button></li><li><button class="w" data-no="867"><div class="top"><span class="no">867</span><span class="en">correction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">訂正；修正</div><div class="ex">The teacher made some <b>corrections</b> to my essay.</div><div class="xj">先生は、私の作文にいくつか訂正を加えた。</div></button></li><li><button class="w" data-no="868"><div class="top"><span class="no">868</span><span class="en">journalism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">報道；ジャーナリズム</div><div class="ex">Lisa wants to work in <b>journalism</b> after college.</div><div class="xj">リサは大学を出たら、報道の仕事をしたいと思っている。</div></button></li><li><button class="w" data-no="869"><div class="top"><span class="no">869</span><span class="en">chaos</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大混乱</div><div class="ex">The heavy snow caused <b>chaos</b> at the station.</div><div class="xj">大雪で、駅は大混乱になった。</div></button></li><li><button class="w" data-no="870"><div class="top"><span class="no">870</span><span class="en">legacy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">遺産</div><div class="ex">The old bridge is a <b>legacy</b> of the town&#x27;s history.</div><div class="xj">その古い橋は、町の歴史の遺産だ。</div></button></li><li><button class="w" data-no="871"><div class="top"><span class="no">871</span><span class="en">addiction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">中毒；依存</div><div class="ex">Many parents worry about their children&#x27;s <b>addiction</b> to video games.</div><div class="xj">多くの親が、子どものテレビゲーム中毒を心配している。</div></button></li><li><button class="w" data-no="872"><div class="top"><span class="no">872</span><span class="en">endurance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">忍耐（力）；持久力</div><div class="ex">Climbing that high mountain was a test of <b>endurance</b>.</div><div class="xj">あの高い山に登ることは、忍耐力の試練だった。</div></button></li><li><button class="w" data-no="873"><div class="top"><span class="no">873</span><span class="en">exaggeration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">誇張</div><div class="ex">Ken&#x27;s story about the big fish was an <b>exaggeration</b>.</div><div class="xj">大きな魚についてのケンの話は、誇張だった。</div></button></li><li><button class="w" data-no="874"><div class="top"><span class="no">874</span><span class="en">adolescent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">若者；青年</div><div class="ex">Many <b>adolescents</b> worry about their future and their friends.</div><div class="xj">多くの若者が、将来や友だちのことで悩んでいる。</div></button></li><li><button class="w" data-no="875"><div class="top"><span class="no">875</span><span class="en">obsession</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">執着；強迫観念</div><div class="ex">Tom has an <b>obsession</b> with collecting old coins.</div><div class="xj">トムは、古いコインを集めることに執着している。</div></button></li><li><button class="w" data-no="876"><div class="top"><span class="no">876</span><span class="en">flaw</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欠点；欠陥</div><div class="ex">Everyone has <b>flaws</b>, so don&#x27;t be too hard on yourself.</div><div class="xj">だれにでも欠点はあるのだから、自分に厳しくしすぎないで。</div></button></li><li><button class="w" data-no="877"><div class="top"><span class="no">877</span><span class="en">conscience</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">良心</div><div class="ex">Emi listened to her <b>conscience</b> and returned the lost wallet.</div><div class="xj">エミは自分の良心に従って、落とし物の財布を届けた。</div></button></li><li><button class="w" data-no="878"><div class="top"><span class="no">878</span><span class="en">pursuit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">追求</div><div class="ex">The <b>pursuit</b> of knowledge is the main goal of a university.</div><div class="xj">知識の追求は、大学の主な目的だ。</div></button></li><li><button class="w" data-no="879"><div class="top"><span class="no">879</span><span class="en">depression</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">うつ；不景気</div><div class="ex">Doctors say exercise can help people with <b>depression</b>.</div><div class="xj">医者によると、運動はうつの人の助けになることがある。</div></button></l
