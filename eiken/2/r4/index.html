xj">テストのためにもっと勉強しなかったことを後悔している。</div></button></li><li><button class="w" data-no="復185"><div class="top"><span class="no">復185</span><span class="en">decline</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">減少する；～を断る</div><div class="ex">The number of farmers in Japan is <b>declining</b>.</div><div class="xj">日本の農家の数は減少している。</div></button></li><li><button class="w" data-no="復186"><div class="top"><span class="no">復186</span><span class="en">predict</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を予測する</div><div class="ex">It is hard to <b>predict</b> the weather in the mountains.</div><div class="xj">山の天気を予測するのは難しい。</div></button></li><li><button class="w" data-no="復187"><div class="top"><span class="no">復187</span><span class="en">determine</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を決定する</div><div class="ex">The coach will <b>determine</b> who plays in the next game.</div><div class="xj">次の試合にだれが出るかは、コーチが決定する。</div></button></li><li><button class="w" data-no="復188"><div class="top"><span class="no">復188</span><span class="en">achieve</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を達成する</div><div class="ex">Emi worked hard to <b>achieve</b> her goal.</div><div class="xj">エミは目標を達成するために一生懸命がんばった。</div></button></li><li><button class="w" data-no="復189"><div class="top"><span class="no">復189</span><span class="en">confirm</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を確認する</div><div class="ex">Please call the hotel to <b>confirm</b> your reservation.</div><div class="xj">ホテルに電話して、予約を確認してください。</div></button></li><li><button class="w" data-no="復190"><div class="top"><span class="no">復190</span><span class="en">tend</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（tend to do）～しがちである</div><div class="ex">Ken <b>tends</b> to forget his homework.</div><div class="xj">ケンは宿題を忘れがちだ。</div></button></li><li><button class="w" data-no="復191"><div class="top"><span class="no">復191</span><span class="en">argue</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">言い争う；～と主張する</div><div class="ex">My brother and I often <b>argue</b> about the TV.</div><div class="xj">兄と私は、よくテレビのことで言い争う。</div></button></li><li><button class="w" data-no="復192"><div class="top"><span class="no">復192</span><span class="en">float</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">浮かぶ；漂う</div><div class="ex">Some leaves were <b>floating</b> on the pond.</div><div class="xj">池に何枚かの葉が浮かんでいた。</div></button></li><li><button class="w" data-no="復193"><div class="top"><span class="no">復193</span><span class="en">publish</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を出版する；発表する</div><div class="ex">The writer <b>published</b> her first book last year.</div><div class="xj">その作家は昨年、初めての本を出版した。</div></button></li><li><button class="w" data-no="復194"><div class="top"><span class="no">復194</span><span class="en">retire</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">退職する；引退する</div><div class="ex">My grandfather <b>retired</b> from his job at the age of 65.</div><div class="xj">祖父は65歳で仕事を退職した。</div></button></li><li><button class="w" data-no="復195"><div class="top"><span class="no">復195</span><span class="en">survive</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">生き残る；～を切り抜ける</div><div class="ex">Some plants can <b>survive</b> without much water.</div><div class="xj">水があまりなくても生き残ることができる植物もある。</div></button></li><li><button class="w" data-no="復196"><div class="top"><span class="no">復196</span><span class="en">control</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">支配；管理</div><div class="ex">Long ago, this island was under the <b>control</b> of a king.</div><div class="xj">昔、この島は王の支配下にあった。</div></button></li><li><button class="w" data-no="復197"><div class="top"><span class="no">復197</span><span class="en">length</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">長さ</div><div class="ex">The <b>length</b> of this river is about 300 kilometers.</div><div class="xj">この川の長さは約300キロメートルだ。</div></button></li><li><button class="w" data-no="復198"><div class="top"><span class="no">復198</span><span class="en">movement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">動き；運動</div><div class="ex">The cat watched every <b>movement</b> of the bird.</div><div class="xj">ねこは鳥の動きをじっと見ていた。</div></button></li><li><button class="w" data-no="復199"><div class="top"><span class="no">復199</span><span class="en">journey</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（長い）旅行</div><div class="ex">They went on a long <b>journey</b> across Europe.</div><div class="xj">彼らはヨーロッパを横断する長い旅行に出かけた。</div></button></li><li><button class="w" data-no="復200"><div class="top"><span class="no">復200</span><span class="en">discussion</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">話し合い；議論</div><div class="ex">We had a <b>discussion</b> about our school rules.</div><div class="xj">私たちは校則について話し合いをした。</div></button></li><li><button class="w" data-no="復201"><div class="top"><span class="no">復201</span><span class="en">advance</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">進歩；（in advance）前もって</div><div class="ex"><b>Advances</b> in science have made our lives easier.</div><div class="xj">科学の進歩によって、私たちの生活は便利になった。</div></button></li><li><button class="w" data-no="復202"><div class="top"><span class="no">復202</span><span class="en">impact</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">影響；衝撃</div><div class="ex">Smartphones have a big <b>impact</b> on our lives.</div><div class="xj">スマートフォンは私たちの生活に大き 09"><div class="top"><span class="no">復209</span><span class="en">advertisement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">広告</div><div class="ex">I saw an <b>advertisement</b> for a new phone on TV.</div><div class="xj">テレビで新しい携帯電話の広告を見た。</div></button></li><li><button class="w" data-no="復210"><div class="top"><span class="no">復210</span><span class="en">platform</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（駅の）ホーム；台</div><div class="ex">Please wait for the train on <b>platform</b> 2.</div><div class="xj">2番ホームで電車を待ってください。</div></button></li><li><button class="w" data-no="復211"><div class="top"><span class="no">復211</span><span class="en">construction</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">建設；工事</div><div class="ex">The <b>construction</b> of the new station will take two years.</div><div class="xj">新しい駅の建設には2年かかる。</div></button></li><li><button class="w" data-no="復212"><div class="top"><span class="no">復212</span><span class="en">trail</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（山などの）小道</div><div class="ex">We walked along a mountain <b>trail</b> to the lake.</div><div class="xj">私たちは湖まで山の小道を歩いた。</div></button></li><li><button class="w" data-no="復213"><div class="top"><span class="no">復213</span><span class="en">population</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">人口</div><div class="ex">The <b>population</b> of this town is about 5,000.</div><div class="xj">この町の人口は約5,000人だ。</div></button></li><li><button class="w" data-no="復214"><div class="top"><span class="no">復214</span><span class="en">relationship</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">関係</div><div class="ex">Ken has a good <b>relationship</b> with his classmates.</div><div class="xj">ケンはクラスメートとよい関係にある。</div></button></li><li><button class="w" data-no="復215"><div class="top"><span class="no">復215</span><span class="en">pressure</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">圧力；プレッシャー</div><div class="ex">Deep in the sea, the water <b>pressure</b> is very high.</div><div class="xj">海の深い所では、水の圧力がとても高い。</div></button></li><li><button class="w" data-no="復216"><div class="top"><span class="no">復216</span><span class="en">method</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">方法</div><div class="ex">This is a new <b>method</b> for learning English words.</div><div class="xj">これは英単語を覚えるための新しい方法だ。</div></button></li><li><button class="w" data-no="復217"><div class="top"><span class="no">復217</span><span class="en">photograph</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">写真</div><div class="ex">This <b>photograph</b> was taken in Hokkaido.</div><div class="xj">この写真は北海道でとられた。</div></button></li><li><button class="w" data-no="復218"><div class="top"><span class="no">復218</span><span class="en">kingdom</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">王国</div><div class="ex">Long ago, a kind king ruled this <b>kingdom</b>.</div><div class="xj">昔、やさしい王がこの王国を治めていた。</div></button></li><li><button class="w" data-no="復219"><div class="top"><span class="no">復219</span><span class="en">duty</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">義務；任務</div><div class="ex">Police officers have a <b>duty</b> to protect people.</div><div class="xj">警察官には人々を守る義務がある。</div></button></li><li><button class="w" data-no="復220"><div class="top"><span class="no">復220</span><span class="en">account</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">口座；（利用者の）アカウント；説明</div><div class="ex">I opened a bank <b>account</b> with my mother.</div><div class="xj">私は母といっしょに銀行口座を開いた。</div></button></li><li><button class="w" data-no="復221"><div class="top"><span class="no">復221</span><span class="en">term</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">用語；期間</div><div class="ex">Please look up this <b>term</b> in the dictionary.</div><div class="xj">この用語を辞書で調べてください。</div></button></li><li><button class="w" data-no="復222"><div class="top"><span class="no">復222</span><span class="en">muscle</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">筋肉</div><div class="ex">Swimming is a good way to build <b>muscle</b>.</div><div class="xj">水泳は筋肉をつけるよい方法だ。</div></button></li><li><button class="w" data-no="復223"><div class="top"><span class="no">復223</span><span class="en">solution</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">解決策</div><div class="ex">We need to find a <b>solution</b> to this problem.</div><div class="xj">私たちはこの問題の解決策を見つける必要がある。</div></button></li><li><button class="w" data-no="復224"><div class="top"><span class="no">復224</span><span class="en">major</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">主要な；大きいほうの</div><div class="ex">Tokyo is one of the <b>major</b> cities in the world.</div><div class="xj">東京は世界の主要な都市の1つだ。</div></button></li><li><button class="w" data-no="復225"><div class="top"><span class="no">復225</span><span class="en">sudden</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">突然の</div><div class="ex">The <b>sudden</b> rain made everyone run inside.</div><div class="xj">突然の雨で、みんな中にかけ込んだ。</div></button></li><li><button class="w" data-no="復226"><div class="top"><span class="no">復226</span><span class="en">creative</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">創造的な</div><div class="ex">Emi is very <b>creative</b> and loves to make things.</div><div class="xj">エミはとても創造的で、ものを作るのが大好きだ。</div></button></li><li><button class="w" data-no="復227"><div class="top"><span class="no">復227</span><span class="en">personal</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">個人的な</div><div class="ex">May I ask you a <b>personal</b> question?</div><div class="xj">個人的な質問をしてもいいですか。</div></button></li><li><button class="w" data-no="復228"><div class="top"><span class="no">復228</span><span class="en">ordinary</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">ふつうの；平凡な</div><div class="ex">It was just an <b>ordinary</b> day at school.</div><div class="xj">それは学校でのふつうの一日だった。</div></button></li><li><button class="w" data-no="復229"><div class="top"><span class="no">復229</span><span class="en">worth</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（be worth ～）～の価値がある</div><div class="ex">This old museum is <b>worth</b> a visit.</div><div class="xj">この古い博物館は一度訪れる価値がある。</div></button></li><li><button class="w" data-no="復230"><div class="top"><span class="no">復230</span><span class="en">aware</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（be aware of ～）～に気づいている</div><div class="ex">Tom was not <b>aware</b> of his mistake.</div><div class="xj">トムは自分のまちがいに気づいていなかった。</div></button></li><li><button class="w" data-no="復231"><div class="top"><span class="no">復231</span><span class="en">normal</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">ふつうの；正常な</div><div class="ex">It is <b>normal</b> to feel nervous before a test.</div><div class="xj">テストの前に緊張するのはふつうのことだ。</div></button></li><li><button class="w" data-no="復232"><div class="top"><span class="no">復232</span><span class="en">unfortunately</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">残念ながら；あいにく</div><div class="ex">We went to the museum, but <b>unfortunately</b> it was closed.</div><div class="xj">私たちは博物館に行ったが、残念ながら休館日だった。</div></button></li><li><button class="w" data-no="復233"><div class="top"><span class="no">復233</span><span class="en">directly</span><span class="ps">副</span><span cl
