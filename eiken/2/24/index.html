all tower.</div><div class="xj">その物語では、王女が高い塔に投獄されていた。</div></button></li><li><button class="w" data-no="1385"><div class="top"><span class="no">1385</span><span class="en">drag</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を引きずる</div><div class="ex">Ken <b>dragged</b> his heavy suitcase up the hill.</div><div class="xj">ケンは重いスーツケースを引きずって坂を上った。</div></button></li><li><button class="w" data-no="1386"><div class="top"><span class="no">1386</span><span class="en">swell</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">ふくらむ；はれる</div><div class="ex">The balloon <b>swelled</b> as Ken blew air into it.</div><div class="xj">ケンが息を吹きこむと、風船がふくらんだ。</div></button></li><li><button class="w" data-no="1387"><div class="top"><span class="no">1387</span><span class="en">tap</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を軽くたたく</div><div class="ex">Someone <b>tapped</b> me on the shoulder on the train.</div><div class="xj">電車の中で、だれかが私の肩を軽くたたいた。</div></button></li><li><button class="w" data-no="1388"><div class="top"><span class="no">1388</span><span class="en">breed</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を繁殖させる；飼育する</div><div class="ex">This zoo <b>breeds</b> rare birds to protect them.</div><div class="xj">この動物園は、めずらしい鳥を守るために繁殖させている。</div></button></li><li><button class="w" data-no="1389"><div class="top"><span class="no">1389</span><span class="en">rub</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をこする</div><div class="ex">Ken <b>rubbed</b> his eyes because he was still sleepy.</div><div class="xj">ケンはまだ眠かったので、目をこすった。</div></button></li><li><button class="w" data-no="1390"><div class="top"><span class="no">1390</span><span class="en">twist</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をねじる</div><div class="ex">Emi <b>twisted</b> the cap to open the bottle.</div><div class="xj">エミはふたをねじってびんを開けた。</div></button></li><li><button class="w" data-no="1391"><div class="top"><span class="no">1391</span><span class="en">chop</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を切り刻む</div><div class="ex">My father <b>chopped</b> the onions for the curry.</div><div class="xj">父はカレー用に玉ねぎを切り刻んだ。</div></button></li><li><button class="w" data-no="1392"><div class="top"><span class="no">1392</span><span class="en">bloom</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（花が）咲く</div><div class="ex">Cherry trees <b>bloom</b> in early April in our city.</div><div class="xj">私たちの市では、桜は4月初めに咲く。</div></button></li><li><button class="w" data-no="1393"><div class="top"><span class="no">1393</span><span class="en">cultivation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">耕作；栽培</div><div class="ex">The soil here is too dry for <b>cultivation</b>.</div><div class="xj">ここの土は乾きすぎていて、耕作には向いていない。</div></button></li><li><button class="w" data-no="1394"><div class="top"><span class="no">1394</span><span class="en">infrastructure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">社会基盤；インフラ</div><div class="ex">Roads and bridges are important parts of a city&#x27;s <b>infrastructure</b>.</div><div class="xj">道路や橋は、都市の社会基盤の重要な一部だ。</div></button></li><li><button class="w" data-no="1395"><div class="top"><span class="no">1395</span><span class="en">climax</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">最高潮；クライマックス</div><div class="ex">The festival reached its <b>climax</b> when the fireworks began.</div><div class="xj">花火が始まると、祭りは最高潮に達した。</div></button></li><li><button class="w" data-no="1396"><div class="top"><span class="no">1396</span><span class="en">cosmetics</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">化粧品</div><div class="ex">My sister spends a lot of money on <b>cosmetics</b>.</div><div class="xj">姉は化粧品にたくさんお金を使う。</div></button></li><li><button class="w" data-no="1397"><div class="top"><span class="no">1397</span><span class="en">conservationist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">自然保護論者</div><div class="ex">A <b>conservationist</b> taught us how to protect wild birds.</div><div class="xj">自然保護論者が、野鳥を守る方法を教えてくれた。</div></button></li><li><button class="w" data-no="1398"><div class="top"><span class="no">1398</span><span class="en">completion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">完成；完了</div><div class="ex">The <b>completion</b> of the new stadium is planned for next year.</div><div class="xj">新しいスタジアムの完成は来年の予定だ。</div></button></li><li><button class="w" data-no="1399"><div class="top"><span class="no">1399</span><span class="en">flame</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">炎</div><div class="ex">The <b>flame</b> of the candle moved in the wind.</div><div class="xj">ろうそくの炎が風でゆれた。</div></button></li><li><button class="w" data-no="1400"><div class="top"><span class="no">1400</span><span class="en">cliff</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">がけ</div><div class="ex">There is a lighthouse on the <b>cliff</b> by the sea.</div><div class="xj">海辺のがけの上に灯台がある。</div></button></li><li><button class="w" data-no="1401"><div class="top"><span class="no">1401</span><span class="en">moisture</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">湿気；水分</div><div class="ex">There is a lot of <b>moisture</b> in the air during the rainy season.</div><div class="xj">梅雨の時期は、空気中に湿気が多い。</div></button></li><li><button class="w" data-no="1402"><div class="top"><span class="no">1402</span><span class="en">fabric</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">布地</div><div class="ex">This shirt is made of soft cotton <b>fabric</b>.</div><div class="xj">このシャツは、やわらかい綿の布地でできている。</div></button></li><li><button class="w" data-no="1403"><div class="top"><span class="no">1403</span><span class="en">resort</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">行楽地</div><div class="ex">We spent three days at a beach <b>resort</b> last summer.</div><div class="xj">私たちは去年の夏、海辺の行楽地で3日間過ごした。</div></button></li><li><button class="w" data-no="1404"><div class="top"><span class="no">1404</span><span class="en">surgeon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">外科医</div><div class="ex">My aunt is a <b>surgeon</b> at a big hospital.</div><div class="xj">おばは大きな病院の外科医だ。</div></button></li><li><button class="w" data-no="1405"><div class="top"><span class="no">1405</span><span class="en">monument</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">記念碑</div><div class="ex">This <b>monument</b> was built in memory of a famous poet.</div><div class="xj">この記念碑は、ある有名な詩人をしのんで建てられた。</div></button></li><li><button class="w" data-no="1406"><div class="top"><span class="no">1406</span><span class="en">spectator</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">観客</div><div class="ex">Thousands of <b>spectators</b> watched the soccer game.</div><div class="xj">何千人もの観客が、そのサッカーの試合を見た。</div></button></li><li><button class="w" data-no="1407"><div class="top"><span class="no">1407</span><span class="en">summit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">頂上；首脳会談</div><div class="ex">We reached the <b>summit</b> of the mountain at noon.</div><div class="xj">私たちは正午に山の頂上に着いた。</div></button></li><li><button class="w" data-no="1408"><div class="top"><span class="no">1408</span><span class="en">tide</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">潮（の満ち引き）</div><div class="ex">The <b>tide</b> goes out in the afternoon, so we can walk to the island.</div><div class="xj">午後は潮が引くので、島まで歩いて行ける。</div></button></li><li><button class="w" data-no="1409"><div class="top"><span class="no">1409</span><span class="en">shelf</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">棚</div><div class="ex">Please put the books back on the <b>shelf</b>.</div><div class="xj">本を棚に戻してください。</div></button></li><li><button class="w" data-no="1410"><div class="top"><span class="no">1410</span><span class="en">grain</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">穀物；粒</div><div class="ex">Rice is the most important <b>grain</b> in Japan.</div><div class="xj">米は、日本で最も重要な穀物だ。</div></button></li><li><button class="w" data-no="1411"><div class="top"><span class="no">1411</span><span class="en">secretary</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">秘書</div><div class="ex">The <b>secretary</b> told me that the manager was in a meeting.</div><div class="xj">秘書は、部長は会議中だと教えてくれた。</div></button></li><li><button class="w" data-no="1412"><div class="top"><span class="no">1412</span><span class="en">stream</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小川；流れ</div><div class="ex">We caught small fish in the <b>stream</b> behind the school.</div><div class="xj">私たちは学校の裏の小川で小魚をとった。</div></button></li><li><button class="w" data-no="1413"><div class="top"><span class="no">1413</span><span class="en">detective</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">探偵；刑事</div><div class="ex">My brother loves to read <b>detective</b> stories.</div><div class="xj">兄は探偵小説を読むのが大好きだ。</div></button></li><li><button class="w" data-no="1414"><div class="top"><span class="no">1414</span><span class="en">root</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">根；起源</div><div class="ex">The <b>roots</b> of this tree go deep into the ground.</div><div class="xj">この木の根は、地中深くまでのびている。</div></button></li><li><button class="w" data-no="1415"><div class="top"><span class="no">1415</span><span class="en">boundary</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">境界</div><div class="ex">This river forms the <b>boundary</b> between the two towns.</div><div class="xj">この川が、2つの町の境界になっている。</div></button></li><li><button class="w" data-no="1416"><div class="top"><span class="no">1416</span><span class="en">wheat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小麦</div><div class="ex">This bread is made from <b>wheat</b> grown in Hokkaido.</div><div class="xj">このパンは、北海道産の小麦で作られている。</div></button></li><li><button class="w" data-no="1417"><div class="top"><span class="no">1417</span><span class="en">feather</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">羽</div><div class="ex">Lisa found a beautiful blue <b>feather</b> in the park.</div><div class="xj">リサは公園で美しい青い羽を見つけた。</div></button></li><li><button class="w" data-no="1418"><div class="top"><span class="no">1418</span><span class="en">flour</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小麦粉</div><div class="ex">Mix the <b>flour</b> and sugar in a large bowl.</div><div class="xj">大きなボウルで小麦粉と砂糖を混ぜなさい。</div></button></li><li><button class="w" data-no="1419"><div class="top"><span class="no">1419</span><span class="en">sweat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">汗</div><div class="ex">After the soccer game, Ken was covered in <b>sweat</b>.</div><div class="xj">サッカーの試合のあと、ケンは汗びっしょりだった。</div></button></li><li><button class="w" data-no="1420"><div class="top"><span class="no">1420</span><span class="en">valley</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">谷</div><div class="ex">A small village lies in the <b>valley</b> between the mountains.</div><div class="xj">山々の間の谷に、小さな村がある。</div></button></li><li><button class="w" data-no="1421"><div class="top"><span class="no">1421</span><span class="en">receptionist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">受付係</div><div class="ex">The <b>receptionist</b> at the hotel gave us our room key.</div><div class="xj">ホテルの受付係が、部屋のかぎを渡してくれた。</div></button></li><li><button class="w" data-no="1422"><div class="top"><span class="no">1422</span><span class="en">accountant</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">会計士</div><div class="ex">An <b>accountant</b> checks the company&#x27;s money records every year.</div><div class="xj">毎年、会計士が会社のお金の記録を調べている。</div></button></li><li><button class="w" data-no="1423"><div class="top"><span class="no">1423</span><span class="en">telescope</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">望遠鏡</div><div class="ex">We looked at the moon through a <b>telescope</b>.</div><div class="xj">私たちは望遠鏡で月を見た。</div></button></li><li><button class="w" data-no="1424"><div class="top"><span class="no">1424</span><span class="en">thunder</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">雷</div><div class="ex">The dog hid under the bed when it heard the <b>thunder</b>.</div><div class="xj">犬は雷の音を聞くと、ベッドの下にかくれた。</div></button></li><li><button class="w" data-no="1425"><div class="top"><span class="no">1425</span><span class="en">shore</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">岸；海岸</div><div class="ex">The little boat slowly came back to the <b>shore</b>.</div><div class="xj">小さなボートが、ゆっくり岸に戻ってきた。</div></button></li><li><button class="w" data-no="1426"><div class="top"><span class="no">1426</span><span class="en">allergy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">アレルギー</div><div class="ex">Tom has an <b>allergy</b> to eggs, so he can&#x27;t eat this cake.</div><div class="xj">トムは卵のアレルギーがあるので、このケーキは食べられない。</div></button></li><li><button class="w" data-no="1427"><div class="top"><span class="no">1427</span><span class="en">microbe</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">微生物</div><div class="ex">Some <b>microbes</b> in the soil help plants grow.</div><div class="xj">土の中の微生物には、植物の成長を助けるものもいる。</div></button></li><li><button class="w" data-no="1428"><div class="top"><span class="no">1428</span><span class="en">clay</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">粘土</div><div class="ex">The children made little animals out of <b>clay</b>.</div><div class="xj">子どもたちは粘土で小さな動物を作った。</div></button></li><li><button class="w" data-no="1429"><div class="top"><span class="no">1429</span><span class="en">garment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">衣服</div><div class="ex">This shop sells traditional <b>garments</b> from India.</div><div class="xj">この店では、インドの伝統的な衣服を売っている。</div></button></li><li><button class="w" data-no="1430"><div class="top"><span class="no">1430</span><span class="en">astronomy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">天文学</div><div class="ex">Emi became interested in <b>astronomy</b> after visiting a planetarium.</div><div class="xj">エミはプラネタリウムに行ってから、天文学に興味を持った。</div></button></li><li><button class="w" data-no="1431"><div class="top"><span class="no">1431</span><span class="en">wheelchair</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">車いす</div><div class="ex">The new station has an elevator for people in <b>wheelchairs</b>.</div><div class="xj">新しい駅には、車いすの人のためのエレベーターがある。</div></button></li><li><button class="w" data-no="1432"><div class="top"><span class="no">1432</span><span class="en">lawn</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">芝生</div><div class="ex">Our family had a picnic on the <b>lawn</b> in the park.</div><div class="xj">家族で公園の芝生の上でピクニックをした。</div></button></li><li><button class="w" data-no="1433"><div class="top"><span class="no">1433</span><span class="en">herd</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（牛などの）群れ</div><div class="ex">A <b>herd</b> of cows was walking slowly across the road.</div><div class="xj">牛の群れが、道路をゆっくり横切っていた。</div></button></li><li><button class="w" data-no="1434"><div class="top"><span class="no">1434</span><span class="en">catalog</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">カタログ；目録</div><div class="ex">I ordered a new jacket from the <b>catalog</b>.</div><div class="xj">私はそのカタログで新しい上着を注文した。</div></button></li><li><button class="w" data-no="1435"><div class="top"><span class="no">1435</span><span class="en">dealer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">販売業者</div><div class="ex">My father bought a used car from a local <b>dealer</b>.</div><div class="xj">父は地元の販売業者から中古車を買った。</div></button></li><li><button class="w" data-no="1436"><div class="top"><span class="no">1436</span><span class="en">chill</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">寒気；冷え</div><div class="ex">I felt a <b>chill</b>, so I put on a sweater.</div><div class="xj">寒気がしたので、セーターを着た。</div></button></li><li><button class="w" data-no="1437"><div class="top"><span class="no">1437</span><span class="en">liberal</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">自由主義の；寛大な</div><div class="ex">Our new teacher is <b>liberal</b> about where we sit in class.</div><div class="xj">新しい先生は、教室でどこに座るかについて寛大だ。</div></button></li><li><button class="w" data-no="1438"><div class="top"><span class="no">1438</span><span class="en">ecological</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">生態学の；環境の</div><div class="ex">Scientists did an <b>ecological</b> study of the birds in the forest.</div><div class="xj">科学者たちは、森の鳥について生態学の調査を行った。</div></button></li><li><button class="w" data-no="1439"><div class="top"><span class="no">1439</span><span class="en">horizontal</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">水平の</div><div class="ex">The picture on the wall is not <b>horizontal</b>, so please fix it.</div><div class="xj">壁の絵が水平になっていないので、直してください。</div></button></li><li><button class="w" data-no="1440"><div class="top"><span class="no">1440</span><span class="en">dusty</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ほこりっぽい</div><div class="ex">The old boxes in the storeroom were very <b>dusty</b>.</div><div class="xj">物置の古い箱は、とてもほこりっぽかった。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../23/">← 第23回</a><a href="../j01/">熟語 Set 1 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"1381": 5.05, "1382": 19.06, "1383": 32.88, "1384": 46.61, "1385": 61.12, "1386": 74.49, "1387": 87.95, "1388": 101.62, "1389": 116.6, "1390": 130.13, "1391": 143.28, "1392": 156.78, "1393": 170.05, "1394": 183.66, "1395": 198.51, "1396": 213.48, "1397": 226.75, "1398": 241.12, "1399": 255.37, "1400": 268.06, "1401": 280.92, "1402": 294.96, "1403": 308.01, "1404": 321.35, "1405": 334.28, "1406": 347.6, "1407": 360.75, "1408": 374.52, "1409": 388.77, "1410": 401.3, "1411": 414.68, "1412": 427.93, "1413": 441.53, "1414": 455.02, "1415": 468.04, "1416": 481.55, "1417": 494.72, "1418": 507.85, "1419": 520.95, "1420": 534.41, "1421": 548.01, "1422": 561.66, "1423": 575.2, "1424": 587.77, "1425": 600.82, "1426": 614.3, "1427": 628.2, "1428": 641.3, "1429": 654.2, "1430": 667.4, "1431": 681.48, "1432": 695.09, "1433": 708.09, "1434": 721.84, "1435": 735.28, "1436": 748.62, "1437": 761.79, "1438": 775.61, "1439": 790.72, "1440": 804.74}, "TE": {"1381": 6.92, "1382": 20.94, "1383": 34.76, "1384": 48.48, "1385": 63.0, "1386": 76.36, "1387": 89.82,
