iv class="xj">水を止めて。おふろがあふれるよ！</div></button></li><li><button class="w" data-no="1085"><div class="top"><span class="no">1085</span><span class="en">dispose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（dispose of で）～を処分する</div><div class="ex">Please <b>dispose</b> of old batteries in the right way.</div><div class="xj">古い電池は、正しい方法で処分してください。</div></button></li><li><button class="w" data-no="1086"><div class="top"><span class="no">1086</span><span class="en">recharge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を充電する</div><div class="ex">I need to <b>recharge</b> my phone before I go out.</div><div class="xj">出かける前に、携帯電話を充電する必要がある。</div></button></li><li><button class="w" data-no="1087"><div class="top"><span class="no">1087</span><span class="en">inhale</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を吸い込む</div><div class="ex"><b>Inhale</b> deeply, and then let your breath out slowly.</div><div class="xj">深く吸い込んで、それからゆっくり息をはいてください。</div></button></li><li><button class="w" data-no="1088"><div class="top"><span class="no">1088</span><span class="en">detach</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り外す</div><div class="ex">You can <b>detach</b> the keyboard from this computer.</div><div class="xj">このコンピューターからは、キーボードを取り外すことができる。</div></button></li><li><button class="w" data-no="1089"><div class="top"><span class="no">1089</span><span class="en">conquer</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を征服する</div><div class="ex">The king wanted to <b>conquer</b> the whole island.</div><div class="xj">王は島全体を征服したいと思っていた。</div></button></li><li><button class="w" data-no="1090"><div class="top"><span class="no">1090</span><span class="en">discard</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を捨てる</div><div class="ex">Please <b>discard</b> the old newspapers in this box.</div><div class="xj">古い新聞はこの箱に捨ててください。</div></button></li><li><button class="w" data-no="1091"><div class="top"><span class="no">1091</span><span class="en">tremble</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">震える</div><div class="ex">Ken&#x27;s hands <b>trembled</b> before his piano performance.</div><div class="xj">ピアノの演奏の前、ケンの手は震えた。</div></button></li><li><button class="w" data-no="1092"><div class="top"><span class="no">1092</span><span class="en">illuminate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を照らす</div><div class="ex">Thousands of lights <b>illuminate</b> the street at Christmas.</div><div class="xj">クリスマスには、何千もの明かりが通りを照らす。</div></button></li><li><button class="w" data-no="1093"><div class="top"><span class="no">1093</span><span class="en">devise</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を考案する</div><div class="ex">The students <b>devised</b> a new way to save water at school.</div><div class="xj">生徒たちは、学校で水を節約する新しい方法を考案した。</div></button></li><li><button class="w" data-no="1094"><div class="top"><span class="no">1094</span><span class="en">mount</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に登る；～を据えつける</div><div class="ex">The old man slowly <b>mounted</b> the steps of the temple.</div><div class="xj">その老人は、お寺の石段をゆっくりと登った。</div></button></li><li><button class="w" data-no="1095"><div class="top"><span class="no">1095</span><span class="en">narrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を語る；ナレーションをする</div><div class="ex">My grandmother <b>narrated</b> stories about her childhood to us.</div><div class="xj">祖母は、子どものころの話を私たちに語った。</div></button></li><li><button class="w" data-no="1096"><div class="top"><span class="no">1096</span><span class="en">infect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に感染させる</div><div class="ex">A cold virus <b>infected</b> almost everyone in my class.</div><div class="xj">かぜのウイルスが、クラスのほぼ全員に感染した。</div></button></li><li><button class="w" data-no="1097"><div class="top"><span class="no">1097</span><span class="en">freight</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">貨物</div><div class="ex">This long train carries <b>freight</b> from the port to the city.</div><div class="xj">この長い列車は、港から都市へ貨物を運んでいる。</div></button></li><li><button class="w" data-no="1098"><div class="top"><span class="no">1098</span><span class="en">fracture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">骨折</div><div class="ex">The X-ray showed a small <b>fracture</b> in Tom&#x27;s arm.</div><div class="xj">レントゲンで、トムの腕に小さな骨折が見つかった。</div></button></li><li><button class="w" data-no="1099"><div class="top"><span class="no">1099</span><span class="en">offering</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">提供されるもの；供え物</div><div class="ex">The museum&#x27;s online <b>offerings</b> include videos and games.</div><div class="xj">その博物館がオンラインで提供するものには、動画やゲームがある。</div></button></li><li><button class="w" data-no="1100"><div class="top"><span class="no">1100</span><span class="en">folk</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人々；民衆</div><div class="ex">Country <b>folk</b> are often very friendly to visitors.</div><div class="xj">田舎の人々は、訪れた人にとても親切なことが多い。</div></button></li><li><button class="w" data-no="1101"><div class="top"><span class="no">1101</span><span class="en">memorial</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">記念碑；記念館</div><div class="ex">We visited a <b>memorial</b> for the people who built the bridge.</div><div class="xj">私たちは、その橋を建てた人々の記念碑を訪れた。</div></button></li><li><button class="w" data-no="1102"><div class="top"><span class="no">1102</span><span class="en">destiny</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">運命</div><div class="ex">Emi believed that becoming a singer was her <b>destiny</b>.</div><div class="xj">エミは、歌手になることが自分の運命だと信じていた。</div></button></li><li><button class="w" data-no="1103"><div class="top"><span class="no">1103</span><span class="en">attendant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">係員；接客係</div><div class="ex">A parking <b>attendant</b> showed us where to park.</div><div class="xj">駐車場の係員が、車をとめる場所を教えてくれた。</div></button></li><li><button class="w" data-no="1104"><div class="top"><span class="no">1104</span><span class="en">headline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（新聞の）見出し</div><div class="ex">The <b>headline</b> of today&#x27;s newspaper is about a new robot.</div><div class="xj">今日の新聞の見出しは、新しいロボットについてだ。</div></button></li><li><button class="w" data-no="1105"><div class="top"><span class="no">1105</span><span class="en">operator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">操作する人；オペレーター</div><div class="ex">The <b>operator</b> of this machine must wear a helmet.</div><div class="xj">この機械を操作する人は、ヘルメットをかぶらなければならない。</div></button></li><li><button class="w" data-no="1106"><div class="top"><span class="no">1106</span><span class="en">stuff</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">物；こと</div><div class="ex">There is too much <b>stuff</b> in my room.</div><div class="xj">私の部屋には物が多すぎる。</div></button></li><li><button class="w" data-no="1107"><div class="top"><span class="no">1107</span><span class="en">orbit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">軌道</div><div class="ex">The moon moves in an <b>orbit</b> around the earth.</div><div class="xj">月は、地球のまわりの軌道を回っている。</div></button></li><li><button class="w" data-no="1108"><div class="top"><span class="no">1108</span><span class="en">physician</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">医師；内科医</div><div class="ex">Lisa wants to be a <b>physician</b> in her hometown.</div><div class="xj">リサは故郷で医師になりたいと思っている。</div></button></li><li><button class="w" data-no="1109"><div class="top"><span class="no">1109</span><span class="en">governor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知事</div><div class="ex">The <b>governor</b> visited our school to see the new garden.</div><div class="xj">知事が、新しい花壇を見に私たちの学校を訪れた。</div></button></li><li><button class="w" data-no="1110"><div class="top"><span class="no">1110</span><span class="en">disturbance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">騒ぎ；妨害</div><div class="ex">The noise from the party caused a <b>disturbance</b> in the neighborhood.</div><div class="xj">パーティーの音が、近所で騒ぎを引き起こした。</div></button></li><li><button class="w" data-no="1111"><div class="top"><span class="no">1111</span><span class="en">donor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">寄付者；提供者</div><div class="ex">A kind <b>donor</b> gave the library a thousand books.</div><div class="xj">親切な寄付者が、図書館に千冊の本を贈った。</div></button></li><li><button class="w" data-no="1112"><div class="top"><span class="no">1112</span><span class="en">prescription</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">処方箋</div><div class="ex">The doctor gave me a <b>prescription</b> for some medicine.</div><div class="xj">医者は私に薬の処方箋を出してくれた。</div></button></li><li><button class="w" data-no="1113"><div class="top"><span class="no">1113</span><span class="en">fossil</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">化石</div><div class="ex">The children found a <b>fossil</b> of a small fish near the river.</div><div class="xj">子どもたちは川の近くで、小さな魚の化石を見つけた。</div></button></li><li><button class="w" data-no="1114"><div class="top"><span class="no">1114</span><span class="en">poetry</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">詩（集合的に）</div><div class="ex">Emi likes reading <b>poetry</b> before she goes to bed.</div><div class="xj">エミは寝る前に詩を読むのが好きだ。</div></button></li><li><button class="w" data-no="1115"><div class="top"><span class="no">1115</span><span class="en">demonstration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">実演；デモ</div><div class="ex">The cook gave a <b>demonstration</b> of how to make sushi.</div><div class="xj">その料理人は、すしの作り方の実演をした。</div></button></li><li><button class="w" data-no="1116"><div class="top"><span class="no">1116</span><span class="en">channel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">チャンネル；経路</div><div class="ex">What <b>channel</b> is the soccer game on tonight?</div><div class="xj">今夜のサッカーの試合は、何チャンネルでやっていますか。</div></button></li><li><button class="w" data-no="1117"><div class="top"><span class="no">1117</span><span class="en">horn</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">角；警笛</div><div class="ex">The goat has two short <b>horns</b> on its head.</div><div class="xj">そのヤギは、頭に2本の短い角がある。</div></button></li><li><button class="w" data-no="1118"><div class="top"><span class="no">1118</span><span class="en">fertilizer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">肥料</div><div class="ex">The farmer uses natural <b>fertilizer</b> for his vegetables.</div><div class="xj">その農場主は、野菜に自然の肥料を使っている。</div></button></li><li><button class="w" data-no="1119"><div class="top"><span class="no">1119</span><span class="en">vessel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">船；血管</div><div class="ex">A large <b>vessel</b> entered the port this morning.</div><div class="xj">今朝、大きな船が港に入った。</div></button></li><li><button class="w" data-no="1120"><div class="top"><span class="no">1120</span><span class="en">province</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">州；地方</div><div class="ex">Lisa&#x27;s family lives in a <b>province</b> in western Canada.</div><div class="xj">リサの家族は、カナダ西部の州に住んでいる。</div></button></li><li><button class="w" data-no="1121"><div class="top"><span class="no">1121</span><span class="en">sponsor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">後援者；スポンサー</div><div class="ex">A local bakery is a <b>sponsor</b> of our soccer team.</div><div class="xj">地元のパン屋が、私たちのサッカーチームのスポンサーだ。</div></button></li><li><button class="w" data-no="1122"><div class="top"><span class="no">1122</span><span class="en">paragraph</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">段落</div><div class="ex">Please read the second <b>paragraph</b> of the story aloud.</div><div class="xj">物語の2つ目の段落を、声に出して読んでください。</div></button></li><li><button class="w" data-no="1123"><div class="top"><span class="no">1123</span><span class="en">adventurous</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">冒険好きな</div><div class="ex">Lisa is <b>adventurous</b> and loves trying new foods.</div><div class="xj">リサは冒険好きで、新しい食べ物を試すのが大好きだ。</div></button></li><li><button class="w" data-no="1124"><div class="top"><span class="no">1124</span><span class="en">naval</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">海軍の</div><div class="ex">My grandfather visited a <b>naval</b> museum and saw old ships.</div><div class="xj">祖父は海軍の博物館を訪れて、古い船を見た。</div></button></li><li><button class="w" data-no="1125"><div class="top"><span class="no">1125</span><span class="en">facial</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">顔の</div><div class="ex">Babies can read their mothers&#x27; <b>facial</b> expressions.</div><div class="xj">赤ちゃんは、母親の顔の表情を読み取ることができる。</div></button></li><li><button class="w" data-no="1126"><div class="top"><span class="no">1126</span><span class="en">explosive</span><sp
