</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第1回</h1><div class="sub">No.1〜60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">appeal</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">訴える；（appeal to で）～の心に訴える</div><div class="ex">After the storm, the city <b>appealed</b> for help from volunteers.</div><div class="xj">嵐のあと、市はボランティアの協力を訴えた。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">grant</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を与える；認める</div><div class="ex">The school <b>granted</b> Lisa permission to use the gym.</div><div class="xj">学校はリサに体育館を使う許可を与えた。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">grasp</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を理解する；つかむ</div><div class="ex">It took me a long time to <b>grasp</b> the main idea of the story.</div><div class="xj">その話の要点を理解するのに長い時間がかかった。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">compose</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を作曲する；構成する</div><div class="ex">Emi <b>composed</b> a song for her friend&#x27;s wedding.</div><div class="xj">エミは友人の結婚式のための歌を作曲した。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">accelerate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を加速させる</div><div class="ex">The new machines <b>accelerated</b> the work at the factory.</div><div class="xj">新しい機械が工場の作業を加速させた。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">indicate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を示す</div><div class="ex">The dark clouds <b>indicate</b> that it will rain soon.</div><div class="xj">黒い雲は、もうすぐ雨が降ることを示している。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">emphasize</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を強調する</div><div class="ex">Our teacher <b>emphasized</b> the importance of reading every day.</div><div class="xj">先生は毎日本を読むことの大切さを強調した。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">adopt</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を採用する；養子にする</div><div class="ex">Our school <b>adopted</b> a new system for school lunches.</div><div class="xj">私たちの学校は、給食に新しい方式を採用した。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">demonstrate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を実演する；証明する</div><div class="ex">The store clerk <b>demonstrated</b> how to use the new machine.</div><div class="xj">店員が新しい機械の使い方を実演した。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">devote</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をささげる；（時間・力など）を注ぐ</div><div class="ex">Lisa <b>devotes</b> her free time to volunteer work.</div><div class="xj">リサは自由な時間をボランティア活動にささげている。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">congratulate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を祝う</div><div class="ex">Everyone <b>congratulated</b> Aya on winning the speech contest.</div><div class="xj">みんながアヤのスピーチコンテスト優勝を祝った。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">yield</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を産出する；もたらす</div><div class="ex">This land <b>yields</b> good crops every year.</div><div class="xj">この土地は毎年よい作物を産出する。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">grip</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をしっかりつかむ；（注意など）を引きつける</div><div class="ex">The little girl <b>gripped</b> her mother&#x27;s hand in the crowd.</div><div class="xj">人ごみの中で、その女の子は母親の手をしっかりつかんだ。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">deceive</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をだます</div><div class="ex">Don&#x27;t be <b>deceived</b> by e-mails that promise free prizes.</div><div class="xj">無料の賞品を約束するメールにだまされないように。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">drift</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">漂う；漂流する</div><div class="ex">The small boat <b>drifted</b> slowly away from the beach.</div><div class="xj">小さなボートは、ゆっくりと浜辺から離れて漂っていった。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">regulate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を規制する；調整する</div><div class="ex">The city <b>regulates</b> the number of cars in the old town.</div><div class="xj">市は旧市街に入る車の数を規制している。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">qualify</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">資格を得る；～に資格を与える</div><div class="ex">Our team <b>qualified</b> for the national tournament this year.</div><div class="xj">今年、私たちのチームは全国大会への出場資格を得た。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">consequence</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">結果</div><div class="ex">Lack of sleep can have bad <b>consequences</b> for your health.</div><div class="xj">睡眠不足は、健康に悪い結果をもたらすことがある。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">judgment</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">判断（力）</div><div class="ex">The captain used good <b>judgment</b> during the difficult game.</div><div class="xj">キャプテンは難しい試合の中で、よい判断をした。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">assistance</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">援助</div><div class="ex">The town gave <b>assistance</b> to families after the big flood.</div><div class="xj">大洪水のあと、町は被害を受けた家族に援助を行った。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">feedback</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">意見；感想</div><div class="ex">Our teacher gave us helpful <b>feedback</b> on our speeches.</div><div class="xj">先生は私たちのスピーチについて、役に立つ意見をくれた。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">convention</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">大会；慣習</div><div class="ex">The science <b>convention</b> was held at a large hotel.</div><div class="xj">その科学大会は大きなホテルで開かれた。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">philosopher</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">哲学者</div><div class="ex">The <b>philosopher</b> asked many questions about how to live.</div><div class="xj">その哲学者は、どう生きるべきかについて多くの問いを投げかけた。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">intention</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">意図</div><div class="ex">I had no <b>intention</b> of hurting your feelings.</div><div class="xj">あなたの気持ちを傷つける意図はなかった。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">contribution</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">貢献</div><div class="ex">Everyone thanked Tom for his <b>contribution</b> to the event.</div><div class="xj">全員が、イベントへのトムの貢献に感謝した。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">authority</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">権威；当局</div><div class="ex">Lisa&#x27;s uncle is an <b>authority</b> on Japanese history.</div><div class="xj">リサのおじは日本史の権威だ。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">tendency</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">傾向</div><div class="ex">Tom has a <b>tendency</b> to forget his homework.</div><div class="xj">トムは宿題を忘れる傾向がある。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">outcome</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">結果</div><div class="ex">Nobody could guess the <b>outcome</b> of the close game.</div><div class="xj">その接戦の結果は、だれにも予想できなかった。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">criticism</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">批判</div><div class="ex">The mayor listened carefully to <b>criticism</b> of the new plan.</div><div class="xj">市長は新しい計画への批判に注意深く耳を傾けた。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">recommendation</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">推薦；おすすめ</div><div class="ex">The teacher wrote a letter of <b>recommendation</b> for Mike.</div><div class="xj">先生はマイクのために推薦状を書いた。</div></button></li><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">minority</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">少数派</div><div class="ex">Only a <b>minority</b> of the students walk to school.</div><div class="xj">歩いて通学する生徒は少数派にすぎない。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">welfare</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">福祉；幸福</div><div class="ex">The city spends a lot of money on <b>welfare</b> for older people.</div><div class="xj">市は高齢者の福祉に多くのお金を使っている。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">storage</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">保管；収納</div><div class="ex">We use the small room upstairs for <b>storage</b>.</div><div class="xj">私たちは2階の小部屋を物の保管に使っている。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">proverb</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ことわざ</div><div class="ex">My grandmother often tells me <b>proverbs</b> about saving money.</div><div class="xj">祖母はよく、お金をためることについてのことわざを教えてくれる。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">loyalty</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">忠誠心</div><div class="ex">Dogs are famous for their <b>loyalty</b> to their owners.</div><div class="xj">犬は飼い主への忠誠心で知られている。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">philosophy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">哲学</div><div class="ex">My brother studies <b>philosophy</b> at a university in Kyoto.</div><div class="xj">兄は京都の大学で哲学を勉強している。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">empire</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">帝国</div><div class="ex">The <b>empire</b> grew larger over hundreds of years.</div><div class="xj">その帝国は数百年かけて大きくなった。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">rejection</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">拒絶；不採用</div><div class="ex">Tom was sad about the <b>rejection</b> of his plan.</div><div class="xj">トムは自分の計画が拒絶されて悲しかった。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">mixture</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">混合（物）</div><div class="ex">Air is a <b>mixture</b> of several different gases.</div><div class="xj">空気は、いくつかの異なる気体の混合物だ。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">financial</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">財政上の；金銭的な</div><div class="ex">The small shop near our school has <b>financial</b> problems.</div><div class="xj">学校の近くの小さな店は、財政上の問題を抱えている。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">appealing</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">魅力的な</div><div class="ex">The new menu at the café looks very <b>appealing</b>.</div><div class="xj">そのカフェの新しいメニューは、とても魅力的に見える。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">exact</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">正確な</div><div class="ex">Do you know the <b>exact</b> time of the meeting?</div><div class="xj">会議の正確な時間を知っていますか。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">appropriate</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">適切な</div><div class="ex">Jeans are not <b>appropriate</b> for a job interview.</div><div class="xj">ジーンズは就職の面接には適切でない。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">consistent</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">一貫した</div><div class="ex">The coach&#x27;s message to the team is always <b>consistent</b>.</div><div class="xj">コーチがチームに伝えることは、いつも一貫している。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">internal</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">内部の</div><div class="ex">The company is checking its <b>internal</b> rules again.</div><div class="xj">その会社は内部の規則を見直している。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">distinct</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">はっきりした；異なる</div><div class="ex">Ken&#x27;s voice is very <b>distinct</b>, so I can find him easily.</div><div class="xj">ケンの声はとてもはっきりしているので、すぐに見つけられる。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">distant</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">遠い</div><div class="ex">We could see a <b>distant</b> mountain from the hotel window.</div><div class="xj">ホテルの窓から遠くの山が見えた。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">unconcerned</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">無関心な；気にしない</div><div class="ex">Tom seemed <b>unconcerned</b> about the test tomorrow.</div><div class="xj">トムは明日のテストに無関心な様子だった。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">upper</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">上の；上部の</div><div class="ex">Our classroom is on the <b>upper</b> floor of the building.</div><div class="xj">私たちの教室は建物の上の階にある。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">vague</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">あいまいな</div><div class="ex">His answer was so <b>vague</b> that nobody understood it.</div><div class="xj">彼の答えはとてもあいまいだったので、だれにも理解できなかった。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">moreover</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">さらに</div><div class="ex">This bike is light; <b>moreover</b>, it is not expensive.</div><div class="xj">この自転車は軽い。さらに、値段も高くない。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">strictly</span><span class="ps">副</span><sp iously</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">慎重に</div><div class="ex">The driver moved <b>cautiously</b> along the snowy road.</div><div class="xj">運転手は雪の道を慎重に進んだ。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">underneath</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">下に；真下に</div><div class="ex">Lisa lifted the rock and found a small crab <b>underneath</b>.</div><div class="xj">リサが石を持ち上げると、下に小さなカニがいた。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">correctly</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">正しく</div><div class="ex">Please make sure you have written your name <b>correctly</b>.</div><div class="xj">自分の名前を正しく書いたか確かめてください。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../n/">← 新しい意味</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"1": 4.67, "2": 21.7, "3": 36.12, "4": 51.19, "5": 65.85, "6": 79.89, "7": 93.44, "8": 107.91, "9": 123.15, "10": 138.26, "11": 154.24, "12": 168.45, "13": 182.92, "14": 198.56, "15": 212.52, "16": 226.73, "17": 241.63, "18": 257.03, "19": 270.56, "20": 283.98, "21": 297.63, "22": 311.74, "23": 325.63, "24": 339.11, "25": 352.09, "26": 365.36, "27": 379.3, "28": 392.4, "29": 405.43, "30": 418.94, "31": 432.8, "32": 445.88, "33": 460.23, "34": 473.83, "35": 487.56, "36": 500.9, "37": 514.64, "38": 527.98, "39": 541.76, "40": 554.93, "41": 569.88, "42": 583.1, "43": 595.5, "44": 608.58, "45": 622.01, "46": 635.11, "47": 649.8, "48": 662.94, "49": 677.22, "50": 690.63, "51": 703.85, "52": 717.82, "53": 731.37, "54": 746.34, "55": 759.52, "56": 772.88, "57": 786.29, "58": 800.59, "59": 814.0, "60": 828.23}, "TE": {"1": 6.54, "2
