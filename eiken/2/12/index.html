</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第12回</h1><div class="sub">No.661〜720</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">encounter</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に（偶然）出会う</div><div class="ex">We <b>encountered</b> a deer on our walk in the forest.</div><div class="xj">私たちは森を散歩していて、シカに出会った。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">implement</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を実行する</div><div class="ex">The school will <b>implement</b> a new plan to reduce paper waste.</div><div class="xj">学校は、紙のむだを減らす新しい計画を実行する予定だ。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">integrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を統合する；溶け込ませる</div><div class="ex">The two classes were <b>integrated</b> into one large class.</div><div class="xj">2つのクラスが、1つの大きなクラスに統合された。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">minimize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を最小限にする</div><div class="ex">We should <b>minimize</b> the use of plastic bags.</div><div class="xj">私たちは、レジ袋の使用を最小限にするべきだ。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">mislead</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を誤解させる；惑わす</div><div class="ex">This advertisement may <b>mislead</b> customers about the price.</div><div class="xj">この広告は、値段について客を誤解させるかもしれない。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">collaborate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">協力する；共同で行う</div><div class="ex">Our school <b>collaborated</b> with a local farm to grow vegetables.</div><div class="xj">私たちの学校は、野菜を育てるために地元の農場と協力した。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">resume</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を再開する</div><div class="ex">We <b>resumed</b> the game after the rain stopped.</div><div class="xj">雨がやんだあと、私たちは試合を再開した。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">comprehend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を理解する</div><div class="ex">It was hard for me to <b>comprehend</b> the science lecture.</div><div class="xj">その科学の講義を理解するのは、私には難しかった。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">retrieve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り戻す；回収する</div><div class="ex">Ken <b>retrieved</b> the ball from under the car.</div><div class="xj">ケンは、車の下からボールを取り戻した。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">revive</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を生き返らせる；復活させる</div><div class="ex">A little water <b>revived</b> the dry flowers in the garden.</div><div class="xj">少し水をやると、庭のしおれた花が生き返った。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">contradict</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～と矛盾する；～に反論する</div><div class="ex">Tom&#x27;s story <b>contradicts</b> what he told us yesterday.</div><div class="xj">トムの話は、昨日彼が私たちに言ったことと矛盾している。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">coordinate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を調整する；まとめる</div><div class="ex">Emi <b>coordinated</b> the schedule for the club&#x27;s summer camp.</div><div class="xj">エミは、部の夏合宿の予定を調整した。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">disrupt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を混乱させる；中断させる</div><div class="ex">The heavy snow <b>disrupted</b> train service in the area.</div><div class="xj">大雪が、その地域の電車の運行を混乱させた。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">frustration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欲求不満；いらだち</div><div class="ex">Not being able to play outside caused <b>frustration</b> among the children.</div><div class="xj">外で遊べないことで、子どもたちは欲求不満になった。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">appreciation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感謝；正しい評価</div><div class="ex">We gave our coach flowers to show our <b>appreciation</b>.</div><div class="xj">私たちは感謝の気持ちを示すために、コーチに花を贈った。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">entrepreneur</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">起業家</div><div class="ex">Lisa wants to become an <b>entrepreneur</b> and start her own company.</div><div class="xj">リサは起業家になって、自分の会社を立ち上げたいと思っている。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">enterprise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">企業；事業</div><div class="ex">This small <b>enterprise</b> makes toys out of wood.</div><div class="xj">この小さな企業は、木でおもちゃを作っている。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">incentive</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">動機；報奨</div><div class="ex">Free drinks are an <b>incentive</b> for people to join the event.</div><div class="xj">無料の飲み物は、人々がその催しに参加する動機になる。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">exposure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">さらされること</div><div class="ex">Too much <b>exposure</b> to the sun is bad for your skin.</div><div class="xj">日光にさらされることが多すぎると、肌に悪い。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">input</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">入力；意見</div><div class="ex">The computer cannot work without the correct <b>input</b>.</div><div class="xj">コンピューターは、正しい入力がないと動かない。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">mainstream</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">主流</div><div class="ex">Electric cars are becoming part of the <b>mainstream</b>.</div><div class="xj">電気自動車は、主流になりつつある。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">interpretation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">解釈</div><div class="ex">Each student had a different <b>interpretation</b> of the poem.</div><div class="xj">その詩について、生徒一人一人が異なる解釈をした。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">notion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">考え；概念</div><div class="ex">Ken&#x27;s <b>notion</b> that reading is boring changed after he found a good book.</div><div class="xj">読書は退屈だというケンの考えは、よい本に出会って変わった。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">obesity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">肥満</div><div class="ex">Eating too much fast food can lead to <b>obesity</b>.</div><div class="xj">ファストフードを食べすぎると、肥満につながることがある。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">outbreak</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（病気・戦争などの）発生</div><div class="ex">The <b>outbreak</b> of the flu closed the school for three days.</div><div class="xj">インフルエンザの発生で、学校は3日間休校になった。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">productivity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生産性</div><div class="ex">Short breaks can improve your <b>productivity</b> at work.</div><div class="xj">短い休憩をとると、仕事の生産性が上がることがある。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">outlook</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見通し；見解</div><div class="ex">The weather <b>outlook</b> for the weekend is good.</div><div class="xj">週末の天気の見通しはよい。</div></button></li><li><button class="w" data-no="688"> ><li><button class="w" data-no="694"><div class="top"><span class="no">694</span><span class="en">consent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">同意；承諾</div><div class="ex">You need your parents&#x27; <b>consent</b> to join the trip.</div><div class="xj">その旅行に参加するには、保護者の同意が必要だ。</div></button></li><li><button class="w" data-no="695"><div class="top"><span class="no">695</span><span class="en">description</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">説明；描写</div><div class="ex">Lisa gave a clear <b>description</b> of her lost bag.</div><div class="xj">リサは、なくしたかばんについてわかりやすく説明した。</div></button></li><li><button class="w" data-no="696"><div class="top"><span class="no">696</span><span class="en">dilemma</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">板ばさみ；ジレンマ</div><div class="ex">Lisa faced a <b>dilemma</b>: study for the test or go to the concert.</div><div class="xj">リサは、テスト勉強をするかコンサートに行くかで板ばさみになった。</div></button></li><li><button class="w" data-no="697"><div class="top"><span class="no">697</span><span class="en">disagreement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">意見の不一致</div><div class="ex">There was a <b>disagreement</b> about where to go on the trip.</div><div class="xj">旅行の行き先について、意見の不一致があった。</div></button></li><li><button class="w" data-no="698"><div class="top"><span class="no">698</span><span class="en">disruption</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混乱；中断</div><div class="ex">Road work caused some <b>disruption</b> to bus services.</div><div class="xj">道路工事で、バスの運行に少し混乱が生じた。</div></button></li><li><button class="w" data-no="699"><div class="top"><span class="no">699</span><span class="en">psychological</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">心理的な</div><div class="ex">Stress can have <b>psychological</b> effects on students.</div><div cla
