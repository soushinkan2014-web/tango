n Sunday.</div><div class="xj">学校は、生徒が日曜日に体育館を使うことを認可した。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">automate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を自動化する</div><div class="ex">The factory <b>automated</b> most of its work last year.</div><div class="xj">その工場は昨年、作業の大部分を自動化した。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">cite</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を引用する；挙げる</div><div class="ex">Lisa <b>cited</b> a famous book in her report.</div><div class="xj">リサはレポートで有名な本を引用した。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">retreat</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">退く；後退する</div><div class="ex">The waves <b>retreated</b>, and we found many shells on the beach.</div><div class="xj">波が退いて、私たちは浜辺でたくさんの貝殻を見つけた。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">anticipate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を予想する；期待する</div><div class="ex">We <b>anticipate</b> a large crowd at the school festival.</div><div class="xj">文化祭には大勢の人が来ると予想している。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">prevail</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">普及している；勝つ</div><div class="ex">This old custom still <b>prevails</b> in many villages.</div><div class="xj">この古い習慣は、今でも多くの村で広く行われている。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">dissolve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">溶ける；～を溶かす</div><div class="ex">Sugar <b>dissolves</b> quickly in hot tea or coffee.</div><div class="xj">砂糖は、熱い紅茶やコーヒーにすぐ溶ける。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">admiration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">称賛；感嘆</div><div class="ex">Everyone in the class looked at Lisa&#x27;s painting with <b>admiration</b>.</div><div class="xj">クラスのみんなが、称賛の目でリサの絵を見た。</div></button></li><li><button class="w" data-no="792"><div class="top"><span class="no">792</span><span class="en">affection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">愛情</div><div class="ex">Grandma showed her <b>affection</b> by cooking our favorite food.</div><div class="xj">祖母は、私たちの大好きな料理を作って愛情を示した。</div></button></li><li><button class="w" data-no="793"><div class="top"><span class="no">793</span><span class="en">nonsense</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ばかげたこと</div><div class="ex">Don&#x27;t talk <b>nonsense</b>; you can easily pass the test.</div><div class="xj">ばかげたことを言わないで。君ならテストに簡単に合格できるよ。</div></button></li><li><button class="w" data-no="794"><div class="top"><span class="no">794</span><span class="en">investor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">投資家</div><div class="ex">The small company needs <b>investors</b> to build a new factory.</div><div class="xj">その小さな会社は、新しい工場を建てるために投資家を必要としている。</div></button></li><li><button class="w" data-no="795"><div class="top"><span class="no">795</span><span class="en">implication</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">影響；含み</div><div class="ex">The new law will have big <b>implications</b> for small shops.</div><div class="xj">その新しい法律は、小さな店に大きな影響を与えるだろう。</div></button></li><li><button class="w" data-no="796"><div class="top"><span class="no">796</span><span class="en">hostility</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">敵意</div><div class="ex">The cat showed <b>hostility</b> toward the new dog.</div><div class="xj">そのネコは、新しい犬に敵意を見せた。</div></button></li><li><button class="w" data-no="797"><div class="top"><span class="no">797</span><span class="en">bias</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">偏見；先入観</div><div class="ex">We should try to judge other people without <b>bias</b>.</div><div class="xj">私たちは、偏見をもたずに他人を判断するようにするべきだ。</div></button></li><li><button class="w" data-no="798"><div class="top"><span class="no">798</span><span class="en">precision</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">正確さ；精密さ</div><div class="ex">The <b>precision</b> of this old clock is amazing.</div><div class="xj">この古い時計の正確さは驚くほどだ。</div></button></li><li><button class="w" data-no="799"><div class="top"><span class="no">799</span><span class="en">dialect</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">方言</div><div class="ex">My grandmother speaks a local <b>dialect</b> that I can&#x27;t understand.</div><div class="xj">祖母は、私には理解できない地元の方言を話す。</div></button></li><li><button class="w" data-no="800"><div class="top"><span class="no">800</span><span class="en">commerce</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">商業</div><div class="ex">This port city grew as a center of <b>commerce</b>.</div><div class="xj">この港町は、商業の中心地として発展した。</div></button></li><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">optimism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">楽観（主義）</div><div class="ex">The coach&#x27;s <b>optimism</b> made the players feel better.</div><div class="xj">コーチの楽観主義のおかげで、選手たちは気持ちが楽になった。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">engineering</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">工学</div><div class="ex">Tom wants to study <b>engineering</b> at university.</div><div class="xj">トムは大学で工学を勉強したいと思っている。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">commission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">委員会；手数料</div><div class="ex">The city set up a <b>commission</b> to study traffic problems.</div><div class="xj">市は、交通問題を調べるための委員会を設けた。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">interference</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">干渉；妨害</div><div class="ex">Children need to make choices without too much <b>interference</b> from parents.</div><div class="xj">子どもには、親にあまり干渉されずに物事を選ぶことが必要だ。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">defect</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欠陥</div><div class="ex">The company found a <b>defect</b> in its new bikes.</div><div class="xj">その会社は、新しい自転車に欠陥を見つけた。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">core</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">中心；核心</div><div class="ex">Trust is the <b>core</b> of a strong team.</div><div class="xj">信頼は、強いチームの中心となるものだ。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">injustice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不正；不公平</div><div class="ex">Emi always speaks up when she sees <b>injustice</b> at school.</div><div class="xj">エミは学校で不正を見ると、いつも声を上げる。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">grace</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">優雅さ；品位</div><div class="ex">Everyone was surprised by the <b>grace</b> of the young dancer.</div><div class="xj">みんなが、その若いダンサーの優雅さに驚いた。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">pollutant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">汚染物質</div><div class="ex">Cars and factories release many <b>pollutants</b> into the air.</div><div class="xj">車や工場は、空気中に多くの汚染物質を出す。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">fraud</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">詐欺</div><div class="ex">The police warned elderly people about phone <b>fraud</b>.</div><div class="xj">警察は、お年寄りに電話詐欺について注意を呼びかけた。</div></button></li><li><button class="w" data-no="811"><div class="top"><span class="no">811</span><span class="en">agenda</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">議題；予定表</div><div class="ex">What is the first item on today&#x27;s <b>agenda</b>?</div><div class="xj">今日の議題の最初の項目は何ですか。</div></button></li><li><button class="w" data-no="812"><div class="top"><span class="no">812</span><span class="en">migration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">移住；（鳥などの）渡り</div><div class="ex">Scientists study the <b>migration</b> of people from farms to cities.</div><div class="xj">科学者たちは、農村から都市への人々の移住を研究している。</div></button></li><li><button class="w" data-no="813"><div class="top"><span class="no">813</span><span class="en">fragment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">破片；断片</div><div class="ex">Ken found a <b>fragment</b> of an old pot in the garden.</div><div class="xj">ケンは庭で、古いつぼの破片を見つけた。</div></button></li><li><button class="w" data-no="814"><div class="top"><span class="no">814</span><span class="en">manufacturer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">製造業者；メーカー</div><div class="ex">This <b>manufacturer</b> makes parts for cars and bikes.</div><div class="xj">このメーカーは、車や自転車の部品を作っている。</div></button></li><li><button class="w" data-no="815"><div class="top"><span class="no">815</span><span class="en">novelty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目新しさ；新しいもの</div><div class="ex">The <b>novelty</b> of my new phone did not last long.</div><div class="xj">新しい電話の目新しさは、長く続かなかった。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">pesticide</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">殺虫剤；農薬</div><div class="ex">Mom used a <b>pesticide</b> to kill the bugs in the garden.</div><div class="xj">母は、庭の虫を退治するために殺虫剤を使った。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">ownership</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">所有（権）</div><div class="ex">The <b>ownership</b> of the old hotel changed last year.</div><div class="xj">その古いホテルの所有権は、昨年変わった。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">resemblance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">類似</div><div class="ex">There is a strong <b>resemblance</b> between the two paintings.</div><div class="xj">その2枚の絵には、強い類似が見られる。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">perfection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">完璧さ</div><div class="ex">My sister always aims for <b>perfection</b> in her piano practice.</div><div class="xj">姉は、ピアノの練習でいつも完璧さを目指している。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">tuition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">授業料</div><div class="ex">University <b>tuition</b> is very expensive in some countries.</div><div class="xj">いくつかの国では、大学の授業料がとても高い。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">privilege</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">特権</div><div class="ex">Older students have the <b>privilege</b> of using the new room.</div><div class="xj">上級生には、新しい部屋を使う特権がある。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">disposal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">処分；処理</div><div class="ex">The <b>disposal</b> of old computers needs special care.</div><div class="xj">古いコンピューターの処分には、特別な注意が必要だ。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">outgoing</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">社交的な</div><div class="ex">Emi is so <b>outgoing</b> that she makes friends easily.</div><div class="xj">エミはとても社交的なので、すぐに友だちができる。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">humorous</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ユーモアのある</div><div class="ex">Our English teacher is kind and very <b>humorous</b>.</div><div class="xj">私たちの英語の先生は、親切でとてもユーモアのある人だ。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">minimal</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">最小限の</div><div class="ex">This part-time job needs only <b>minimal</b> training.</div><div class="xj">このアルバイトには、最小限の研修しか必要ない。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">mechanical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">機械の</div><div class="ex">The train stopped because of a <b>mechanical</b> problem.</div><div class="xj">電車は機械のトラブルのために止まった。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">genetic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">遺伝子の；遺伝の</div><div class="ex">Scientists are studying the <b>genetic</b> differences between two kinds of rice.</div><div class="xj">科学者たちは、2種類の米の遺伝子の違いを研究している。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">functional</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">機能的な</div><div class="ex">The new kitchen is simple but very <b>functional</b>.</div><div class="xj">新しい台所はシンプルだが、とても機能的だ。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">predictable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">予測できる</div><div class="ex">The movie was boring because the ending was <b>predictable</b>.</div><div class="xj">結末が予測できたので、その映画は退屈だった。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">bilingual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">2か国語を話す</div><div class="ex">Lisa is <b>bilingual</b> in English and Japanese.</div><div class="xj">リサは、英語と日本語の2か国語を話す。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">reckless</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">向こう見ずな</div><div class="ex"><b>Reckless</b> driving on busy roads causes many accidents every year.</div><div class="xj">交通量の多い道路での向こう見ずな運転は、毎年多くの事故を引き起こす。</div></button></li><li><button class="w" data-no="832"><div
