</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第13回</h1><div class="sub">No.721〜780</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">reassure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を安心させる</div><div class="ex">The doctor <b>reassured</b> Emi that her cold was not serious.</div><div class="xj">医者は、かぜは重くないと言ってエミを安心させた。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">relocate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">移転する；～を移転させる</div><div class="ex">The library will <b>relocate</b> to the new building in April.</div><div class="xj">図書館は4月に新しい建物へ移転する。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">inhabit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に住む</div><div class="ex">Many kinds of birds <b>inhabit</b> this small island.</div><div class="xj">この小さな島には、多くの種類の鳥が住んでいる。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">enforce</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（法律など）を施行する；強いる</div><div class="ex">The city started to <b>enforce</b> the new parking rules.</div><div class="xj">市は新しい駐車のルールを施行し始めた。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">portray</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を描く；演じる</div><div class="ex">This painting <b>portrays</b> a quiet village in winter.</div><div class="xj">この絵は、冬の静かな村を描いている。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">excellence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">優秀さ</div><div class="ex">Our school won an award for <b>excellence</b> in music.</div><div class="xj">私たちの学校は、音楽の優秀さが認められて賞をもらった。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">formation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">形成；構成</div><div class="ex">Scientists study the <b>formation</b> of clouds in the sky.</div><div class="xj">科学者たちは、空の雲の形成を研究している。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">frequency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">頻度</div><div class="ex">The city will increase the <b>frequency</b> of buses next year.</div><div class="xj">市は来年、バスの運行の頻度を増やす予定だ。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">hazard</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">危険（要因）</div><div class="ex">Ice on the road is a serious <b>hazard</b> for drivers.</div><div class="xj">道路の氷は、運転する人にとって大きな危険だ。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">illustration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">イラスト；実例</div><div class="ex">Lisa drew an <b>illustration</b> of a dog for the class newspaper.</div><div class="xj">リサは学級新聞に犬のイラストをかいた。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">indication</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">しるし；兆候</div><div class="ex">Dark clouds are an <b>indication</b> that rain is coming.</div><div class="xj">黒い雲は、雨が近づいているしるしだ。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">interval</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">間隔；合間</div><div class="ex">The trains on this line run at <b>intervals</b> of ten minutes.</div><div class="xj">この路線の電車は、10分間隔で走っている。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">misery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">みじめさ；不幸</div><div class="ex">After losing the game, Tom could not hide his <b>misery</b>.</div><div class="xj">試合に負けたあと、トムはみじめさを隠せなかった。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">nutrient</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">栄養素</div><div class="ex">Vegetables contain many <b>nutrients</b> that our bodies need.</div><div class="xj">野菜には、私たちの体に必要な栄養素がたくさん含まれている。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">occurrence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出来事；発生</div><div class="ex">Heavy snow is a rare <b>occurrence</b> in this town.</div><div class="xj">この町では、大雪はめったにない出来事だ。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">fraction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ほんの一部；分数</div><div class="ex">Only a <b>fraction</b> of the students came to the meeting.</div><div class="xj">その集会に来たのは、生徒のほんの一部だけだった。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">biodiversity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生物多様性</div><div class="ex">Protecting forests helps maintain the <b>biodiversity</b> of the area.</div><div class="xj">森林を守ることは、その地域の生物多様性を保つのに役立つ。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">empathy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">共感</div><div class="ex">Reading stories can help children develop <b>empathy</b> for others.</div><div class="xj">物語を読むことは、子どもが他人への共感を育てる助けになる。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">inability</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">できないこと；無能</div><div class="ex">Tom&#x27;s <b>inability</b> to swim made him nervous at the beach.</div><div class="xj">泳ぐことができないことで、トムは海辺で不安になった。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">intent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">意図</div><div class="ex">Ken&#x27;s <b>intent</b> was to help, not to cause trouble.</div><div class="xj">ケンの意図は助けることで、迷惑をかけることではなかった。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">allowance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">こづかい；手当</div><div class="ex">Emi saves half of her <b>allowance</b> every month.</div><div class="xj">エミは毎月、こづかいの半分を貯金している。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">diplomat</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外交官</div><div class="ex">Lisa wants to become a <b>diplomat</b> and work abroad.</div><div class="xj">リサは外交官になって、外国で働きたいと思っている。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">pity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">哀れみ；残念なこと</div><div class="ex">Tom felt <b>pity</b> for the small cat in the rain.</div><div class="xj">トムは、雨の中の小さなネコに哀れみを感じた。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">distraction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">気を散らすもの</div><div class="ex">Phones can be a big <b>distraction</b> when you study.</div><div class="xj">勉強するとき、スマートフォンは大きな気を散らすものになりうる。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">faculty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">能力；学部</div><div class="ex">Ken wants to study in the <b>faculty</b> of law at a university in Osaka.</div><div class="xj">ケンは、大阪の大学の法学部で学びたいと思っている。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">breakthrough</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大発見；突破口</div><div class="ex">The scientists made an important <b>breakthrough</b> in medicine.</div><div class="xj">その科学者たちは、医学で重要な大発見をした。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">milestone</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">画期的な出来事；節目</div><div class="ex">The first moon landing was a <b>milestone</b> in history.</div><div class="xj">初めての月面着陸は、歴史上の画期的な出来事だった。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">availability</spa
