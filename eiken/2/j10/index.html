f ～ing</span></div><div class="ja">～する能力がある、～できる</div><div class="ex">This robot is capable of carrying heavy boxes.</div><div class="xj">このロボットは重い箱を運ぶことができる。</div></button></li><li><button class="w" data-no="熟96"><div class="top"><span class="no">熟96</span><span class="en">be grateful (to A) for B</span></div><div class="ja">（Aに）Bを感謝している</div><div class="ex">I am grateful to my host family for their kindness.</div><div class="xj">私はホストファミリーの親切に感謝している。</div></button></li><li><button class="w" data-no="熟97"><div class="top"><span class="no">熟97</span><span class="en">be superior to ～</span></div><div class="ja">～よりすぐれている</div><div class="ex">This new model is superior to the old one in many ways.</div><div class="xj">この新型は多くの点で旧型よりすぐれている。</div></button></li><li><button class="w" data-no="熟98"><div class="top"><span class="no">熟98</span><span class="en">be eager to ～</span></div><div class="ja">しきりに～したがる</div><div class="ex">The students were eager to hear about the trip.</div><div class="xj">生徒たちはその旅行の話をしきりに聞きたがった。</div></button></li><li><button class="w" data-no="熟99"><div class="top"><span class="no">熟99</span><span class="en">be reluctant to ～</span></div><div class="ja">～したがらない</div><div class="ex">He was reluctant to speak in front of the class.</div><div class="xj">彼はクラスの前で話したがらなかった。</div></button></li><li><button class="w" data-no="熟100"><div class="top"><span class="no">熟100</span><span class="en">be accustomed to ～</span></div><div class="ja">～に慣れている</div><div class="ex">She is accustomed to getting up early.</div><div class="xj">彼女は早起きに慣れている。</div></button></li><li><button class="w" data-no="会46"><div class="top"><span class="no">会46</span><span class="en">Sure, no problem.</span></div><div class="ja">いいよ、問題ないよ。</div><div class="ex">A: Can you pick up some milk on your way home?<br>B: Sure, no problem.</div></button></li><li><button class="w" data-no="会47"><div class="top"><span class="no">会47</span><span class="en">I&#x27;ll pass.</span></div><div class="ja">やめておくよ。（誘いを断る）</div><div class="ex">A: We&#x27;re going to karaoke tonight. Do you want to come?<br>B: Thanks, but I&#x27;ll pass. I have a test tomorrow.</div></button></li><li><button class="w" data-no="会48"><div class="top"><span class="no">会48</span><span class="en">I&#x27;m afraid not.</span></div><div class="ja">残念ながら、そうではありません。</div><div class="ex">A: Is there a bus to the airport after ten?<br>B: I&#x27;m afraid not. The last one leaves at 9:30.</div></button></li><li><button class="w" data-no="会49"><div class="top"><span class="no">会49</span><span class="en">I&#x27;d like to, but ～.</span></div><div class="ja">そうしたいけど、～。</div><div class="ex">A: Are you coming to the barbecue on Saturday?<br>B: I&#x27;d like to, but I have to work.</div></button></li><li><button class="w" data-no="会50"><div class="top"><span class="no">会50</span><span class="en">Thanks anyway.</span></div><div class="ja">とにかくありがとう。（期待どおりでなくてもお礼を言う）</div><div class="ex">A: Sorry, we don&#x27;t have that book right now.<br>B: OK. Thanks anyway.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j09/">← 熟語 Set 9</a><a href="../j11/">熟語 Set 11 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟91": 4.96, "熟92": 20.14, "熟93": 34.16, "熟94": 48.1, "熟95": 63.24, "熟96": 80.27, "熟97": 97.21, "熟98": 112.11, "熟99": 125.74, "熟100": 139.34, "会46": 152.54, "会47": 169.62, "会48": 190.97, "会49": 210.81, "会50": 228.54}, "TE": {"熟91": 7.07, "熟92": 22.16, "熟93": 36.2, "熟94": 50.14, "熟95": 65.83, "熟96": 83.42, "熟97": 99.25, "熟98": 113.98, "熟99": 127.68, "熟100": 141.31, "会46": 154.87, "会47": 171.49, "会48": 192.99, "会49": 213.09, "会50": 230.41}, "Q": [["熟91", "be disappointed in ～", "～に失望する"], ["熟92", "be typical of ～", "いかにも～らしい"], ["熟93", "be identical to ～", "～とまったく同じだ"], ["熟94", "be distinct from ～", "～とはっきり異なる"], ["熟95", "be capable of ～ing", "～する能力がある、～できる"], ["熟96",
