<div class="ex">He studied all night at the expense of his health.</div><div class="xj">彼は健康を犠牲にして徹夜で勉強した。</div></button></li><li><button class="w" data-no="熟126"><div class="top"><span class="no">熟126</span><span class="en">be at risk (of ～)</span></div><div class="ja">（～の）危険にさらされている</div><div class="ex">Some old buildings are at risk of falling down in an earthquake.</div><div class="xj">古い建物の中には地震で倒れる危険があるものもある。</div></button></li><li><button class="w" data-no="熟127"><div class="top"><span class="no">熟127</span><span class="en">cut down on ～</span></div><div class="ja">～（の量）を減らす</div><div class="ex">I&#x27;m trying to cut down on sweets.</div><div class="xj">甘い物を減らそうとしている。</div></button></li><li><button class="w" data-no="熟128"><div class="top"><span class="no">熟128</span><span class="en">have an advantage over ～</span></div><div class="ja">～より有利である</div><div class="ex">Online shops have an advantage over regular stores because they are open all day.</div><div class="xj">ネットショップは一日中開いているので、ふつうの店より有利だ。</div></button></li><li><button class="w" data-no="熟129"><div class="top"><span class="no">熟129</span><span class="en">do harm to ～</span></div><div class="ja">～に害を与える</div><div class="ex">Too much screen time can do harm to your eyes.</div><div class="xj">画面を見る時間が長すぎると目に害を与えることがある。</div></button></li><li><button class="w" data-no="熟130"><div class="top"><span class="no">熟130</span><span class="en">get in the way of ～</span></div><div class="ja">～のじゃまになる</div><div class="ex">Don&#x27;t let your part-time job get in the way of your studies.</div><div class="xj">アルバイトを勉強のじゃまにさせてはいけない。</div></button></li><li><button class="w" data-no="会61"><div class="top"><span class="no">会61</span><span class="en">I&#x27;d like to reserve a table for ～.</span></div><div class="ja">～（人数・時間）で席を予約したいのですが。</div><div class="ex">A: I&#x27;d like to reserve a table for four at seven.<br>B: Certainly. May I have your name?</div></button></li><li><button class="w" data-no="会62"><div class="top
