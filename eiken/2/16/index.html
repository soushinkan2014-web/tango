</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第16回</h1><div class="sub">No.901〜960</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="901"><div class="top"><span class="no">901</span><span class="en">prosper</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">繁栄する</div><div class="ex">The town <b>prospered</b> after the new railway was built.</div><div class="xj">新しい鉄道ができたあと、その町は繁栄した。</div></button></li><li><button class="w" data-no="902"><div class="top"><span class="no">902</span><span class="en">browse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を見て回る；（ネットを）閲覧する</div><div class="ex">We <b>browsed</b> the shops near the station for an hour.</div><div class="xj">私たちは、駅の近くの店を1時間見て回った。</div></button></li><li><button class="w" data-no="903"><div class="top"><span class="no">903</span><span class="en">regain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り戻す</div><div class="ex">After a short rest, Tom <b>regained</b> his energy.</div><div class="xj">少し休んだあと、トムは元気を取り戻した。</div></button></li><li><button class="w" data-no="904"><div class="top"><span class="no">904</span><span class="en">nourish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に栄養を与える；育てる</div><div class="ex">Good food <b>nourishes</b> the body and keeps us healthy.</div><div class="xj">よい食べ物は体に栄養を与え、私たちを健康に保つ。</div></button></li><li><button class="w" data-no="905"><div class="top"><span class="no">905</span><span class="en">flourish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">栄える；繁茂する</div><div class="ex">Long ago, trade <b>flourished</b> in this port town.</div><div class="xj">昔、この港町では貿易が栄えた。</div></button></li><li><button class="w" data-no="906"><div class="top"><span class="no">906</span><span class="en">asset</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">資産；強み</div><div class="ex">The old house is the family&#x27;s biggest <b>asset</b>.</div><div class="xj">その古い家は、家族の最大の資産だ。</div></button></li><li><button class="w" data-no="907"><div class="top"><span class="no">907</span><span class="en">itinerary</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">旅程（表）</div><div class="ex">Our teacher gave us the <b>itinerary</b> for the school trip.</div><div class="xj">先生は、私たちに修学旅行の旅程表を配った。</div></button></li><li><button class="w" data-no="908"><div class="top"><span class="no">908</span><span class="en">exhaustion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">極度の疲労</div><div class="ex">After the marathon, Ken fell asleep from <b>exhaustion</b>.</div><div class="xj">マラソンのあと、ケンは極度の疲労で眠りこんだ。</div></button></li><li><button class="w" data-no="909"><div class="top"><span class="no">909</span><span class="en">distress</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">苦痛；悩み</div><div class="ex">The loud noise caused <b>distress</b> to the animals at the zoo.</div><div class="xj">大きな音は、動物園の動物たちに苦痛を与えた。</div></button></li><li><button class="w" data-no="910"><div class="top"><span class="no">910</span><span class="en">scholar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">学者</div><div class="ex">A famous <b>scholar</b> gave a talk at our school.</div><div class="xj">有名な学者が、私たちの学校で講演をした。</div></button></li><li><button class="w" data-no="911"><div class="top"><span class="no">911</span><span class="en">reliability</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">信頼性</div><div class="ex">Many people buy this car because of its <b>reliability</b>.</div><div class="xj">多くの人が、その信頼性からこの車を買う。</div></button></li><li><button class="w" data-no="912"><div class="top"><span class="no">912</span><span class="en">compassion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">思いやり；同情</div><div class="ex">The nurse treated every patient with <b>compassion</b>.</div><div class="xj">その看護師は、どの患者にも思いやりをもって接した。</div></button></li><li><button class="w" data-no="913"><div class="top"><span class="no">913</span><span class="en">persistence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">粘り強さ</div><div class="ex">Emi&#x27;s <b>persistence</b> helped her pass the exam on her third try.</div><div class="xj">エミは粘り強さのおかげで、3回目の挑戦で試験に合格した。</div></button></li><li><button class="w" data-no="914"><div class="top"><span class="no">914</span><span class="en">norm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">標準；規範</div><div class="ex">In this town, walking to school is the <b>norm</b>.</div><div class="xj">この町では、歩いて通学するのが標準だ。</div></button></li><li><button class="w" data-no="915"><div class="top"><span class="no">915</span><span class="en">environmentalist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">環境保護論者</div><div class="ex">The <b>environmentalist</b> gave a speech about saving the forests.</div><div class="xj">その環境保護論者は、森林を守ることについて講演をした。</div></button></li><li><button class="w" data-no="916"><div class="top"><span class="no">916</span><span class="en">pregnancy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">妊娠</div><div class="ex">My aunt ate healthy food during her <b>pregnancy</b>.</div><div class="xj">おばは妊娠中、健康的な食事をとった。</div></button></li><li><button class="w" data-no="917"><div class="top"><span class="no">917</span><span class="en">personnel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">職員；人事部</div><div class="ex">All hospital <b>personnel</b> must wash their hands often.</div><div class="xj">病院の全職員は、こまめに手を洗わなければならない。</div></button></li><li><button class="w" data-no="918"><div class="top"><span class="no">918</span><span class="en">adjustment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">調整</div><div class="ex">The coach made a small <b>adjustment</b> to Ken&#x27;s swing.</div><div class="xj">コーチは、ケンのスイングに小さな調整を加えた。</div></button></li><li><button class="w" data-no="919"><div class="top"><span class="no">919</span><span class="en">engagement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">婚約；約束</div><div class="ex">My sister announced her <b>engagement</b> at dinner.</div><div class="xj">姉は、夕食のときに婚約を発表した。</div></button></li><li><button class="w" data-no="920"><div class="top"><span class="no">920</span><span class="en">merchandise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">商品</div><div class="ex">The store sells sports <b>merchandise</b> at low prices.</div><div class="xj">その店は、スポーツ商品を安い値段で売っている。</div></button></li><li><button class="w" data-no="921"><div class="top"><span class="no">921</span><span class="en">misfortune</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不運</div><div class="ex">Ken had the <b>misfortune</b> of losing his wallet on the trip.</div><div class="xj">ケンは、旅行中に財布をなくすという不運にあった。</div></button></li><li><button class="w" data-no="922"><div class="top"><span class="no">922</span><span class="en">preservation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">保存；保護</div><div class="ex">The town works hard on the <b>preservation</b> of its old buildings.</div><div class="xj">その町は、古い建物の保存に力を入れている。</div></button></li><li><button class="w" data-no="923"><div class="top"><span class="no">923</span><span class="en">modification</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">修正；変更</div><div class="ex">Ken made a few <b>modifications</b> to his speech.</div><div class="xj">ケンは、スピーチにいくつか修正を加えた。</div></button></li><li><button class="w" data-no="924"><div class="top"><span class="no">924</span><span class="en">revival</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">復活；再上演</div><div class="ex">The town hopes for a <b>revival</b> of its old festival.</div><div class="xj">その町は、昔の祭りの復活を願っている。</div></button></li><li><button class="w" data-no="925"><div class="top"><span class="no">925</span><span class="en">establishment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">設立；施設</div><div class="ex">We celebrated the <b>establishment</b> of our new science club.</div><div class="xj">私たちは、新しい科学部の設立を祝った。</div></button></li><li><button class="w" data-no="926"><div class="top"><span class="no">926</span><span class="en">coincidence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">偶然の一致</div><div class="ex">It was a <b>coincidence</b> that Ken and I wore the same shirt.</div><div class="xj">ケンと私が同じシャツを着ていたのは、偶然の一致だった。</div></button></li><li><button class="w" data-no="927"><div class="top"><span class="no">927</span><span class="en">confirmation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">確認</div><div class="ex">You will get an email <b>confirmation</b> after you buy the ticket.</div><div class="xj">チケットを買ったあとで、確認のメールが届きます。</div></button></li><li><button class="w" data-no="928"><div class="top"><span class="no">928</span><span class="en">calculation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">計算</div><div class="ex">Ken made a small mistake in his <b>calculation</b>.</div><div class="xj">ケンは計算で小さなまちがいをした。</div></button></li><li><button class="w" data-no="929"><div class="top"><span class="no">929</span><span class="en">longevity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">長寿</div><div class="ex">Healthy food and exercise are the keys to <b>longevity</b>.</div><div class="xj">健康的な食事と運動が、長寿の秘訣だ。</div></button></li><li><button class="w" data-no="930"><div class="top"><span class="no">930</span><span class="en">glimpse</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ちらっと見ること</div><div class="ex">I only caught a <b>glimpse</b> of the singer through the crowd.</div><div class="xj">人ごみの間から、その歌手をちらっと見ることしかできなかった。</div></button></li><li><button class="w" data-no="931"><div class="top"><span class="no">931</span><span class="en">petition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">嘆願（書）；請願</div><div class="ex">Many students signed a <b>petition</b> for a longer lunch break.</div><div class="xj">多くの生徒が、昼休みを長くしてほしいという嘆願書に署名した。</div></button></li><li><button class="w" data-no="932"><div class="top"><span class="no">932</span><span class="en">duration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（継続）期間</div><div class="ex">The <b>duration</b> of the English course is three months.</div><div class="xj">その英語講座の期間は3か月だ。</div></button></li><li><button class="w" data-no="933"><div class="top"><span class="no">933</span><span class="en">coverage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">報道；補償範囲</div><div class="ex">The newspaper&#x27;s <b>coverage</b> of the local festival was very good.</div><div class="xj">地元の祭りについてのその新聞の報道は、とてもよかった。</div></button></li><li><button class="w" data-no="934"><div class="top"><span class="no">934</span><span class="en">dignity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">威厳；尊厳</div><div class="ex">The old king walked slowly with great <b>dignity</b>.</div><div class="xj">年老いた王は、威厳のある様子でゆっくり歩いた。</div></button></li><li><button class="w" data-no="935"><div class="top"><span class="no">935</span><span class="en">courtesy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">礼儀；好意</div><div class="ex">It is common <b>courtesy</b> to say thank you.</div><div class="xj">ありがとうと言うのは、当たり前の礼儀だ。</div></button></li><li><button class="w" data-no="936"><div class="top"><span class="no">936</span><span class="en">possession</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">所有；（possessions で）所有物</div><div class="ex">The old castle is now in the <b>possession</b> of the city.</div><div class="xj">その古い城は今、市の所有となっている。</div></button></li><li><button class="w" data-no="937"><div class="top"><span class="no">937</span><span class="en">meditation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">瞑想</div><div class="ex">My mother does <b>meditation</b> for ten minutes every morning.</div><div class="xj">母は毎朝10分間、瞑想をしている。</div></button></li><li><button class="w" data-no="938"><div class="top"><span class="no">938</span><span class="en">advanced</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">進歩した；上級の</div><div class="ex">This hospital uses very <b>advanced</b> technology to help patients.</div><div class="xj">この病院は、患者を助けるためにとても進歩した技術を使っている。</div></button></li><li><button class="w" data-no="939"><div class="top"><span class="no">939</span><span class="en">immense</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">巨大な；莫大な</div><div class="ex">An <b>immense</b> rock stood in the middle of the field.</div><div class="xj">野原の真ん中に、巨大な岩があった。</div></button></li><li><button class="w" data-no="940"><div class="top"><span class="no">940</span><span class="en">preferable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">好ましい</div><div class="ex">For short trips, walking is <b>preferable</b> to driving.</div><div class="xj">近い所へ行くには、車より歩くほうが好ましい。</div></button></li><li><button class="w" data-no="941"><div class="top"><span class="no">941</span><span class="en">graceful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">優雅な</div><div class="ex">The swans looked <b>graceful</b> on the quiet lake.</div><div class="xj">静かな湖の上で、白鳥たちは優雅に見えた。</div></button></li><li><button class="w" data-no="942"><div class="top"><span class="no">942</span><span class="en">frustrating</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">いらいらさせる</div><div class="ex">Waiting in long lines can be very <b>frustrating</b>.</div><div class="xj">長い列に並んで待つのは、とてもいらいらさせるものだ。</div></button></li><li><button class="w" data-no="943"><div class="top"><span class="no">943</span><span class="en">progressive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">進歩的な</div><div class="ex">The school is known for its <b>progressive</b> ideas about education.</div><div class="xj">その学校は、教育についての進歩的な考え方で知られている。</div></button></li><li><button class="w" data-no="944"><div class="top"><span class="no">944</span><span class="en">competent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有能な</div><div class="ex">Our new coach is very <b>competent</b> and kind.</div><div class="xj">新しいコーチは、とても有能で親切だ。</div></button></li><li><button class="w" data-no="945"><div class="top"><span class="no">945</span><span class="en">exclusive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">独占的な；高級な</div><div class="ex">This magazine has an <b>exclusive</b> interview with the singer.</div><div class="xj">この雑誌には、その歌手への独占インタビューが載っている。</div></button></li><li><button class="w" data-no="946"><div class="top"><span class="no">946</span><span class="en">definite</spa
