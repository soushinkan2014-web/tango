～を選び出す</div><div class="ex">My sister helped me pick out a present for Mom.</div><div class="xj">妹が母へのプレゼントを選ぶのを手伝ってくれた。</div></button></li><li><button class="w" data-no="熟36"><div class="top"><span class="no">熟36</span><span class="en">rely on A (for B)</span></div><div class="ja">（Bを）Aに頼る</div><div class="ex">Many students rely on their parents for money.</div><div class="xj">多くの学生はお金を親に頼っている。</div></button></li><li><button class="w" data-no="熟37"><div class="top"><span class="no">熟37</span><span class="en">save up (for ～)</span></div><div class="ja">（～のために）お金をためる</div><div class="ex">I&#x27;m saving up for a new guitar.</div><div class="xj">新しいギターのためにお金をためている。</div></button></li><li><button class="w" data-no="熟38"><div class="top"><span class="no">熟38</span><span class="en">go off</span></div><div class="ja">（警報・目覚ましが）鳴る</div><div class="ex">My alarm didn&#x27;t go off this morning.</div><div class="xj">今朝、目覚ましが鳴らなかった。</div></button></li><li><button class="w" data-no="熟39"><div class="top"><span class="no">熟39</span><span class="en">feed on ～</span></div><div class="ja">～をえさにする</div><div class="ex">Some birds feed on small fish.</div><div class="xj">小魚をえさにする鳥もいる。</div></button></li><li><button class="w" data-no="熟40"><div class="top"><span class="no">熟40</span><span class="en">live on ～</span></div><div class="ja">～（お金・食べ物）で生活する</div><div class="ex">It is hard to live on a small income in a big city.</div><div class="xj">大都市で少ない収入で暮らすのは大変だ。</div></button></li><li><button class="w" data-no="会16"><div class="top"><span class="no">会16</span><span class="en">That&#x27;s great news!</span></div><div class="ja">それはいい知らせだね！</div><div class="ex">A: My sister is going to have a baby.<br>B: That&#x27;s great news!</div></button></li><li><button class="w" data-no="会17"><div class="top"><span class="no">会17</span><span class="en">You&#x27;re kidding!</span></div><div class="ja">冗談でしょう！・まさか！</div><div class="ex">A: I won first prize in the contest.<br>B: You&#x27;re kidding! That&#x27;s amazing!</div></button></li><li><button class="w" data-no="会18"><div class="top"><span class="no">会18</span><span class="en">What a surprise!</span></div><div class="ja">びっくりした！</div><div class="ex">A: Hi! I came all the way to see you.<br>B: What a surprise! I didn&#x27;t know you were in town.</div></button></li><li><button class="w" data-no="会19"><div class="top"><span class="no">会19</span><span class="en">That&#x27;s too bad.</span></div><div class="ja">それは残念だね。</div><div class="ex">A: I couldn&#x27;t get a ticket for the concert.<br>B: That&#x27;s too bad. Maybe next time.</div></button></li><li><button class="w" data-no="会20"><div class="top"><span class="no">会20</span><span class="en">Thank goodness.</span></div><div class="ja">よかった。（ほっとして）</div><div class="ex">A: I found your wallet under the sofa.<br>B: Thank goodness. I thought I had lost it.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j03/">← 熟語 Set 3</a><a href="../j05/">熟語 Set 5 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟31": 4.96, "熟32": 21.13, "熟33": 34.85, "熟34": 48.96, "熟35": 66.43, "熟36": 80.01, "熟37": 95.15, "熟38": 109.88, "熟39": 123.41, "熟40": 136.78, "会16": 152.16, "会17": 168.35, "会18": 186.58, "会19": 205.48, "会20": 222.8}, "TE": {"熟31": 6.9, "熟32": 23.0, "熟33": 36.72, "熟34": 51.24, "熟35": 68.3, "熟36": 82.72, "熟37": 97.5, "熟38": 111.75, "熟39": 125.28, "熟40": 138.65, "会16": 154.29, "会17": 170.22, "会18": 188.64, "会19": 207.43, "会20": 224.68}, "Q": [["熟31", "keep track of ～", "～を記録する、～を把握しておく"], ["熟32", "stare at ～", "～をじっと見つめる"], ["熟33", "make do with ～", "～で間に合わせる"], ["熟34", "keep A from ～ing", "Aに～させない"], ["熟35", "pick out ～", "～を選び出す"], ["熟36", "rely on A (for B)", "Aに頼る"], ["熟37", "save up (for ～)", "お金をためる"], ["熟38", "go off", "鳴る"], ["熟39", "feed on ～", "～をえさにする"], ["熟40", "live on ～", "～で生活する"], ["会16", "That's great news!",
