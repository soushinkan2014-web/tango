xj">父はアマチュアだが、すばらしい写真を撮る。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">retirement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">引退；退職</div><div class="ex">The famous player announced his <b>retirement</b> at the age of forty.</div><div class="xj">その有名な選手は、40歳で引退を発表した。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">defense</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">防御；守備</div><div class="ex">Thick fur is a good <b>defense</b> against the cold.</div><div class="xj">厚い毛皮は、寒さに対するよい防御になる。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">protection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">保護</div><div class="ex">Wear a hat for <b>protection</b> from the sun.</div><div class="xj">日差しから身を保護するために、帽子をかぶりなさい。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">warmth</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">暖かさ；温かさ</div><div class="ex">We enjoyed the <b>warmth</b> of the fire on a cold night.</div><div class="xj">寒い夜、私たちはたき火の暖かさを楽しんだ。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">workforce</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">労働力；全従業員</div><div class="ex">The country&#x27;s <b>workforce</b> is getting older every year.</div><div class="xj">その国の労働力は、年々高齢化している。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">interior</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">内部；室内</div><div class="ex">The <b>interior</b> of the old house was very modern.</div><div class="xj">その古い家の内部は、とても現代的だった。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">academy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">学院；専門学校</div><div class="ex">My cousin studies dance at an <b>academy</b> in Tokyo.</div><div class="xj">いとこは、東京のダンス学院で学んでいる。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">measurement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">測定；寸法</div><div class="ex">Careful <b>measurement</b> is important in science experiments.</div><div class="xj">理科の実験では、注意深い測定が大切だ。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">ministry</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（政府の）省</div><div class="ex">The <b>ministry</b> made new rules about school lunches.</div><div class="xj">その省は、給食について新しい規則を作った。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">gathering</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">集まり</div><div class="ex">We had a family <b>gathering</b> on New Year&#x27;s Day.</div><div class="xj">元日に家族の集まりがあった。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">activist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">活動家</div><div class="ex">The young <b>activist</b> works hard to protect the environment.</div><div class="xj">その若い活動家は、環境を守るために熱心に活動している。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">literacy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">読み書きの能力</div><div class="ex">Reading books to children helps improve their <b>literacy</b>.</div><div class="xj">子どもに本を読み聞かせると、読み書きの能力が伸びる。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">creativity</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">創造性</div><div class="ex">Playing with blocks helps children develop their <b>creativity</b>.</div><div class="xj">積み木遊びは、子どもの創造性を伸ばすのに役立つ。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">mercy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">慈悲；（at the mercy of で）～のなすがままに</div><div class="ex">The king showed <b>mercy</b> to the poor farmer.</div><div class="xj">王は貧しい農夫に慈悲を示した。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">officer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">役人；警官</div><div class="ex">A police <b>officer</b> helped the lost child find his mother.</div><div class="xj">警官が、迷子の男の子が母親を見つけるのを手伝った。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">agent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">代理人；係員</div><div class="ex">The <b>agent</b> at the counter gave us our plane tickets.</div><div class="xj">カウンターの係員が、私たちに航空券を渡してくれた。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">overtime</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">残業</div><div class="ex">My father often works <b>overtime</b> on Fridays.</div><div class="xj">父は金曜日によく残業する。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">alcohol</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">アルコール；酒</div><div class="ex">In Japan, people under twenty cannot drink <b>alcohol</b>.</div><div class="xj">日本では、20歳未満の人はアルコールを飲めない。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">economics</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">経済学</div><div class="ex">My older brother studies <b>economics</b> at a college in Osaka.</div><div class="xj">兄は大阪の大学で経済学を学んでいる。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">scandal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">不祥事；スキャンダル</div><div class="ex">The company&#x27;s <b>scandal</b> was in the news for weeks.</div><div class="xj">その会社の不祥事は、何週間もニュースで報じられた。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">fiber</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">繊維</div><div class="ex">Vegetables and beans contain a lot of <b>fiber</b>.</div><div class="xj">野菜や豆には、繊維がたくさん含まれている。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">layout</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">配置；レイアウト</div><div class="ex">I like the <b>layout</b> of this new kitchen.</div><div class="xj">私はこの新しい台所の配置が気に入っている。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">command</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">命令；（言語を）自由に使う力</div><div class="ex">The dog quickly followed its owner&#x27;s <b>command</b>.</div><div class="xj">その犬は、飼い主の命令にすぐに従った。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">novelist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小説家</div><div class="ex">Emi&#x27;s dream is to be
