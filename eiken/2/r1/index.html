</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　復習 第1回</h1><div class="sub">復1〜復60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../r1.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="復1"><div class="top"><span class="no">復1</span><span class="en">suggest</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を提案する；（それとなく）示す</div><div class="ex">Ken <b>suggested</b> a new plan for the school festival.</div><div class="xj">ケンは文化祭の新しい計画を提案した。</div></button></li><li><button class="w" data-no="復2"><div class="top"><span class="no">復2</span><span class="en">offer</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を申し出る；提供する</div><div class="ex">Ken <b>offered</b> to carry the heavy bags for his grandmother.</div><div class="xj">ケンは祖母のために重い荷物を運ぼうと申し出た。</div></button></li><li><button class="w" data-no="復3"><div class="top"><span class="no">復3</span><span class="en">allow</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を許す；（allow A to do）Aが～するのを許す</div><div class="ex">My parents <b>allowed</b> me to go to the concert with Emi.</div><div class="xj">両親は、私がエミとコンサートに行くのを許してくれた。</div></button></li><li><button class="w" data-no="復4"><div class="top"><span class="no">復4</span><span class="en">provide</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を提供する；与える</div><div class="ex">The school <b>provides</b> lunch for all students.</div><div class="xj">その学校は全生徒に昼食を提供している。</div></button></li><li><button class="w" data-no="復5"><div class="top"><span class="no">復5</span><span class="en">reduce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を減らす</div><div class="ex">Our city is working hard to <b>reduce</b> trash.</div><div class="xj">私たちの市は、ごみを減らすことに力を入れている。</div></button></li><li><button class="w" data-no="復6"><div class="top"><span class="no">復6</span><span class="en">improve</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を改善する；向上させる</div><div class="ex">Our team talked about how to <b>improve</b> our practice.</div><div class="xj">私たちのチームは、練習を改善する方法について話し合った。</div></button></li><li><button class="w" data-no="復7"><div class="top"><span class="no">復7</span><span class="en">cause</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を引き起こす；～の原因となる</div><div class="ex">Too much sugar can <b>cause</b> health problems.</div><div class="xj">砂糖のとりすぎは、健康上の問題を引き起こすことがある。</div></button></li><li><button class="w" data-no="復8"><div class="top"><span class="no">復8</span><span class="en">mail</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を郵送する</div><div class="ex">I <b>mailed</b> a birthday card to my aunt yesterday.</div><div class="xj">私は昨日、おばに誕生日カードを郵送した。</div></button></li><li><button class="w" data-no="復9"><div class="top"><span class="no">復9</span><span class="en">board</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（乗り物）に乗り込む</div><div class="ex">We <b>boarded</b> the plane at nine in the morning.</div><div class="xj">私たちは朝9時に飛行機に乗り込んだ。</div></button></li><li><button class="w" data-no="復10"><div class="top"><span class="no">復10</span><span class="en">attract</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を引きつける</div><div class="ex">The flower festival <b>attracts</b> many visitors every spring.</div><div class="xj">その花祭りは、毎年春に多くの観光客を引きつける。</div></button></li><li><button class="w" data-no="復11"><div class="top"><span class="no">復11</span><span class="en">produce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を生産する；生み出す</div><div class="ex">This farm <b>produces</b> a lot of milk every year.</div><div class="xj">この農場は毎年、たくさんの牛乳を生産している。</div></button></li><li><button class="w" data-no="復12"><div class="top"><span class="no">復12</span><span class="en">lead</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を導く；（lead to ～）～につながる</div><div class="ex">Our captain <b>led</b> the team to its first win.</div><div class="xj">キャプテンはチームを初勝利に導いた。</div></button></li><li><button class="w" data-no="復13"><div class="top"><span class="no">復13</span><span class="en">realize</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に気づく；～を実現する</div><div class="ex">Emi <b>realized</b> that she had left her umbrella on the bus.</div><div class="xj">エミはバスにかさを置き忘れたことに気づいた。</div></button></li><li><button class="w" data-no="復14"><div class="top"><span class="no">復14</span><span class="en">include</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を含む</div><div class="ex">The price of this hotel <b>includes</b> breakfast and dinner.</div><div class="xj">このホテルの料金には朝食と夕食が含まれている。</div></button></li><li><button class="w" data-no="復15"><div class="top"><span class="no">復15</span><span class="en">regard</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（regard A as B）AをBとみなす</div><div class="ex">Many people <b>regard</b> Tom as the best player on the team.</div><div class="xj">多くの人が、トムをチームでいちばんの選手とみなしている。</div></button></li><li><button class="w" data-no="復16"><div class="top"><span class="no">復16</span><span class="en">remove</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を取り除く</div><div class="ex">Tom <b>removed</b> the stones from the garden.</div><div class="xj">トムは庭から石を取り除いた。</div></button></li><li><button class="w" data-no="復17"><div class="top"><span class="no">復17</span><span class="en">expect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を予期する；期待する</div><div class="ex">I didn&#x27;t <b>expect</b> the test to be so easy.</div><div class="xj">テストがこんなに簡単だとは予期していなかった。</div></button></li><li><button class="w" data-no="復18"><div class="top"><span class="no">復18</span><span class="en">connect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をつなぐ；接続する</div><div class="ex">A new bridge <b>connects</b> the two towns.</div><div class="xj">新しい橋が2つの町をつないでいる。</div></button></li><li><button class="w" data-no="復19"><div class="top"><span class="no">復19</span><span class="en">drop</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を落とす；（人）を車から降ろす</div><div class="ex">Tom <b>dropped</b> his key on the way home.</div><div class="xj">トムは帰り道でかぎを落とした。</div></button></li><li><button class="w" data-no="復20"><div class="top"><span class="no">復20</span><span class="en">prevent</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を防ぐ；（prevent A from -ing）Aが～するのを妨げる</div><div class="ex">Washing your hands is a good way to <b>prevent</b> colds.</div><div class="xj">手を洗うことは、かぜを防ぐよい方法だ。</div></button></li><li><button class="w" data-no="復21"><div class="top"><span class="no">復21</span><span class="en">avoid</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を避ける</div><div class="ex">We left early to <b>avoid</b> the heavy traffic.</div><div class="xj">私たちは渋滞を避けるために早く出発した。</div></button></li><li><button class="w" data-no="復22"><div class="top"><span class="no">復22</span><span class="en">compare</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を比べる</div><div class="ex">Emi <b>compared</b> the prices at two stores.</div><div class="xj">エミは2つの店の値段を比べた。</div></button></li><li><button class="w" data-no="復23"><div class="top"><span class="no">復23</span><span class="en">hire</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を雇う</div><div class="ex">The bakery <b>hired</b> two new workers last month.</div><div class="xj">そのパン屋は先月、新しい店員を2人雇った。</div></button></li><li><button class="w" data-no="復24"><div class="top"><span class="no">復24</span><span class="en">encourage</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を励ます；（encourage A to do）Aに～するよう勧める</div><div class="ex">My friends <b>encouraged</b> me before the big game.</div><div class="xj">大事な試合の前に、友だちが私を励ましてくれた。</div></button></li><li><button class="w" data-no="復25"><div class="top"><span class="no">復25</span><span class="en">statement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">声明；発言</div><div class="ex">The school made a <b>statement</b> about the new rules.</div><div class="xj">学校は新しい規則について声明を出した。</div></button></li><li><button class="w" data-no="復26"><div class="top"><span class="no">復26</span><span class="en">item</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">品物；項目</div><div class="ex">This store sells many <b>items</b> for the kitchen.</div><div class="xj">この店は台所用の品物をたくさん売っている。</div></button></li><li><button class="w" data-no="復27"><div class="top"><span class="no">復27</span><span class="en">attention</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">注意；注目</div><div class="ex">When you cross the street, pay <b>attention</b> to cars.</div><div class="xj">道路を渡るときは、車に注意しなさい。</div></button></li><li><button class="w" data-no="復28"><div class="top"><span class="no">復28</span><span class="en">quality</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">質；品質</div><div class="ex">This shop sells clothes of high <b>quality</b>.</div><div class="xj">この店は質の高い服を売っている。</div></button></li><li><button class="w" data-no="復29"><div class="top"><span class="no">復29</span><span class="en">announcement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">発表；お知らせ</div><div class="ex">Our teacher made an <b>announcement</b> about the school trip.</div><div class="xj">先生が修学旅行について発表をした。</div></button></li><li><button class="w" data-no="復30"><div class="top"><span class="no">復30</span><span class="en">amount</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">量；金額</div><div class="ex">Lisa was surprised at the <b>amount</b> of homework.</div><div class="xj">リサは宿題の量に驚いた。</div></button></li><li><button class="w" data-no="復31"><div class="top"><span class="no">復31</span><span class="en">condition</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">状態；条件</div><div class="ex">This used bike is in good <b>condition</b>.</div><div class="xj">この中古の自転車は状態がよい。</div></button></li><li><button class="w" data-no="復32"><div class="top"><span class="no">復32</span><span class="en">opportunity</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">機会</div><div class="ex">Studying abroad is a great <b>opportunity</b> to learn English.</div><div class="xj">留学は英語を学ぶすばらしい機会だ。</div></button></li><li><button class="w" data-no="復33"><div class="top"><span class="no">復33</span><span class="en">benefit</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">利益；恩恵</div><div class="ex">Walking every day has many health <b>benefits</b>.</div><div class="xj">毎日歩くことには、健康上の利益がたくさんある。</div></button></li><li><button class="w" data-no="復34"><div class="top"><span class="no">復34</span><span class="en">effect</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">効果；影響</div><div class="ex">This medicine has a good <b>effect</b> on colds.</div><div class="xj">この薬はかぜによく効果がある。</div></button></li><li><button class="w" data-no="復35"><div class="top"><span class="no">復35</span><span class="en">challenge</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">難題；挑戦</div><div class="ex">Learning to swim was a big <b>challenge</b> for my little brother.</div><div class="xj">泳ぎを覚えることは、弟にとって大きな難題だった。</div></button></li><li><button class="w" data-no="復36"><div class="top"><span class="no">復36</span><span class="en">addition</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">追加；加えること</div><div class="ex">The <b>addition</b> of a new bus line made life easier.</div><div class="xj">新しいバス路線の追加で、生活が便利になった。</div></button></li><li><button class="w" data-no="復37"><div class="top"><span class="no">復37</span><span class="en">influence</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">影響</div><div class="ex">My grandfather had a big <b>influence</b> on my life.</div><div class="xj">祖父は私の人生に大きな影響を与えた。</div></button></li><li><button class="w" data-no="復38"><div class="top"><span class="no">復38</span><span class="en">research</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">研究；調査</div><div class="ex">Lisa is doing <b>research</b> on ocean animals.</div><div class="xj">リサは海の動物について研究をしている。</div></button></li><li><button class="w" data-no="復39"><div class="top"><span class="no">復39</span><span class="en">situation</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">状況；立場</div><div class="ex">Lisa explained the <b>situation</b> to her teacher.</div><div class="xj">リサは先生に状況を説明した。</div></button></li><li><button class="w" data-no="復40"><div class="top"><span class="no">復40</span><span class="en">detail</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">細部；詳細</div><div class="ex">Please tell me the <b>details</b> of your plan.</div><div class="xj">あなた
