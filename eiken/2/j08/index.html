ay to smartphone apps.</div><div class="xj">紙の地図はスマートフォンのアプリに取って代わられた。</div></button></li><li><button class="w" data-no="熟76"><div class="top"><span class="no">熟76</span><span class="en">set out</span></div><div class="ja">出発する、（～し）始める</div><div class="ex">The explorers set out on their journey in spring.</div><div class="xj">探検家たちは春に旅に出発した。</div></button></li><li><button class="w" data-no="熟77"><div class="top"><span class="no">熟77</span><span class="en">be known as ～</span></div><div class="ja">～として知られている</div><div class="ex">Osaka is known as the kitchen of Japan.</div><div class="xj">大阪は「天下の台所」として知られている。</div></button></li><li><button class="w" data-no="熟78"><div class="top"><span class="no">熟78</span><span class="en">put up ～</span></div><div class="ja">～を掲示する、～を建てる</div><div class="ex">We put up posters for the school festival.</div><div class="xj">私たちは文化祭のポスターを貼った。</div></button></li><li><button class="w" data-no="熟79"><div class="top"><span class="no">熟79</span><span class="en">in the course of ～</span></div><div class="ja">～の間に、～の過程で</div><div class="ex">The town changed a lot in the course of a hundred years.</div><div class="xj">その町は100年の間に大きく変わった。</div></button></li><li><button class="w" data-no="熟80"><div class="top"><span class="no">熟80</span><span class="en">for the sake of ～</span></div><div class="ja">～のために</div><div class="ex">He quit eating fast food for the sake of his health.</div><div class="xj">彼は健康のためにファストフードを食べるのをやめた。</div></button></li><li><button class="w" data-no="会36"><div class="top"><span class="no">会36</span><span class="en">Do you have anything cheaper?</span></div><div class="ja">もっと安いものはありますか？</div><div class="ex">A: This jacket is 20,000 yen.<br>B: Hmm. Do you have anything cheaper?</div></button></li><li><button class="w" data-no="会37"><div class="top"><span class="no">会37</span><span class="en">I&#x27;d like to exchange this.</span></div><div class="ja">これを交換したいのですが。</div><div class="ex">A: I&#x27;d like to exchange this shirt. It&#x27;s too small.<br>B: Sure. Do you have the receipt?</div></button></li><li><button class="w" data-no="会38"><div class="top"><span class="no">会38</span><span class="en">Can I try this on?</span></div><div class="ja">これを試着してもいいですか？</div><div class="ex">A: Can I try this on?<br>B: Of course. The fitting room is over there.</div></button></li><li><button class="w" data-no="会39"><div class="top"><span class="no">会39</span><span class="en">Here you are.</span></div><div class="ja">はい、どうぞ。（物を渡す）</div><div class="ex">A: May I see your ticket?<br>B: Here you are.</div></button></li><li><button class="w" data-no="会40"><div class="top"><span class="no">会40</span><span class="en">I&#x27;ll take it.</span></div><div class="ja">それをください。（買うと決める）</div><div class="ex">A: This one is on sale for 3,000 yen.<br>B: Great. I&#x27;ll take it.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j07/">← 熟語 Set 7</a><a href="../j09/">熟語 Set 9 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟71": 5.05, "熟72": 18.46, "熟73": 33.68, "熟74": 49.42, "熟75": 62.95, "熟76": 77.03, "熟77": 91.72, "熟78": 105.92, "熟79": 120.68, "熟80": 136.01, "会36": 149.78, "会37": 168.44, "会38": 189.17, "会39": 206.76, "会40": 222.92}, "TE": {"熟71": 7.0, "熟72": 20.34, "熟73": 35.55, "熟74": 51.36, "熟75": 64.82, "熟76": 78.9, "熟77": 93.68, "熟78": 107.79, "熟79": 122.55, "熟80": 137.95, "会36": 151.99, "会37": 170.92, "会38": 191.19, "会39": 208.63, "会40": 224.8}, "Q": [["熟71", "come to an end", "終わる"], ["熟72", "in search of ～", "～を探して、～を求めて"], ["熟73", "carry out ～", "～を実行する、～を行う"], ["熟74", "be based on ～", "～に基づいている"], ["熟75", "give way to ～", "～に取って代わられる"], ["熟76", "set out", "出発する、始める"], ["熟77", "be known as ～", "～として知られている"], ["熟78", "put up ～", "～を掲示する、～を建てる"], ["熟79", "in the course of ～", "～の間に、～の過程で"], ["熟80", "for the sake of ～", "～のために"], ["会36", "Do you have anything cheaper?", "
