How is your mother feeling?<br>B: Much better now. Thanks for asking.</div></button></li><li><button class="w" data-no="会98"><div class="top"><span class="no">会98</span><span class="en">I owe you one.</span></div><div class="ja">借りができたね。・恩に着るよ。</div><div class="ex">A: I finished your poster for you.<br>B: Really? Thanks. I owe you one.</div></button></li><li><button class="w" data-no="会99"><div class="top"><span class="no">会99</span><span class="en">My pleasure.</span></div><div class="ja">どういたしまして。（喜んで）</div><div class="ex">A: Thank you for helping me with my homework.<br>B: My pleasure.</div></button></li><li><button class="w" data-no="会100"><div class="top"><span class="no">会100</span><span class="en">You&#x27;re always welcome to ～.</span></div><div class="ja">いつでも～してね。</div><div class="ex">A: Thanks for dinner. I had a great time.<br>B: I&#x27;m glad. You&#x27;re always welcome to come over.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j19/">← 熟語 Set 19</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟191": 5.12, "熟192": 19.33, "熟193": 32.93, "熟194": 46.61, "熟195": 61.15, "熟196": 76.46, "熟197": 90.28, "熟198": 104.36, "熟199": 119.0, "熟200": 133.68, "会96": 147.19, "会97": 163.55, "会98": 180.6, "会99": 200.73, "会100": 217.55}, "TE": {"熟191": 7.0, "熟192": 21.2, "熟193": 35.09, "熟194": 48.84, "熟195": 63.02, "熟196": 78.33, "熟197": 92.22, "熟198": 106.23, "熟199": 120.87, "熟200": 135.58, "会96": 149.4, "会97": 165.47, "会98": 182.69, "会99": 202.6, "会100": 219.83}, "Q": [["熟191", "lay off ～", "～を解雇する"], ["熟192", "on one's own", "ひとりで、独力で"], ["熟193", "safe and sound", "無事に"], ["熟194", "make one's way through ～", "～をかき分けて進む"], ["熟195", "apply for ～", "～に申し込む、～に応募する"], ["熟196", "take on ～", "を引き受ける"], ["熟197", "make ends meet", "収入内でやりくりする"], ["熟198", "make up for ～", "～の埋め合わせをする"], ["熟199", "give away ～", "～をただで人
