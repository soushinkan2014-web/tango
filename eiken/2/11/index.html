</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第11回</h1><div class="sub">No.601〜660</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">capture</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を捕らえる</div><div class="ex">The zoo staff <b>captured</b> the monkey that had escaped.</div><div class="xj">動物園の職員は、逃げ出したサルを捕らえた。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">commit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（罪など）を犯す</div><div class="ex">In the mystery book, Lisa guessed who <b>committed</b> the crime.</div><div class="xj">その推理小説で、リサはだれが罪を犯したのかを言い当てた。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">cope</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（cope with で）～にうまく対処する</div><div class="ex">Emi learned to <b>cope</b> with stress by listening to music.</div><div class="xj">エミは音楽を聞いて、ストレスにうまく対処することを覚えた。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">declare</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を宣言する</div><div class="ex">The mayor <b>declared</b> the new park open.</div><div class="xj">市長は、新しい公園の開園を宣言した。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">define</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を定義する</div><div class="ex">How would you <b>define</b> the word happiness?</div><div class="xj">あなたなら、幸せという言葉をどう定義しますか。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">conserve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を保護する；節約する</div><div class="ex">Volunteers are working to <b>conserve</b> the forest near our town.</div><div class="xj">ボランティアの人々が、町の近くの森を保護する活動をしている。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">cultivate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を耕す；栽培する</div><div class="ex">Farmers <b>cultivate</b> the land before planting rice.</div><div class="xj">農家の人たちは、米を植える前に土地を耕す。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">decay</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">腐る；衰える</div><div class="ex">Fallen leaves <b>decay</b> and become food for plants.</div><div class="xj">落ち葉は腐って、植物の栄養になる。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">dedicate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をささげる</div><div class="ex">The singer <b>dedicated</b> the song to her mother.</div><div class="xj">その歌手は、その歌を母親にささげた。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">digest</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を消化する</div><div class="ex">Some people cannot easily <b>digest</b> cow&#x27;s milk.</div><div class="xj">牛乳をうまく消化できない人もいる。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">abandon</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を捨てる；断念する</div><div class="ex">Please do not <b>abandon</b> old bicycles near the station.</div><div class="xj">駅の近くに古い自転車を捨てないでください。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">acknowledge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を認める</div><div class="ex">Tom <b>acknowledged</b> that he had made a mistake.</div><div class="xj">トムは、自分が間違えたことを認めた。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">evolve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">進化する；発展する</div><div class="ex">Scientists believe that birds <b>evolved</b> from small dinosaurs.</div><div class="xj">科学者たちは、鳥は小型の恐竜から進化したと考えている。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">maximum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">最大限</div><div class="ex">This elevator can carry a <b>maximum</b> of ten people.</div><div class="xj">このエレベーターには、最大10人まで乗れる。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">medication</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">薬；薬物治療</div><div class="ex">Take this <b>medication</b> three times a day after meals.</div><div class="xj">この薬を1日3回、食後に飲んでください。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">motion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">動き；運動</div><div class="ex">The gentle <b>motion</b> of the boat made me sleepy.</div><div class="xj">ボートのゆるやかな動きで、私は眠くなった。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">nationality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">国籍</div><div class="ex">Students of many <b>nationalities</b> study at this school.</div><div class="xj">この学校では、さまざまな国籍の生徒が学んでいる。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">observation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">観察</div><div class="ex">Emi wrote down her <b>observations</b> of the moon every night.</div><div class="xj">エミは毎晩、月の観察を記録した。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">objective</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目的；目標</div><div class="ex">The main <b>objective</b> of this lesson is to improve your speaking.</div><div class="xj">この授業の主な目的は、話す力を伸ばすことだ。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">participation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">参加</div><div class="ex">Thank you for your <b>participation</b> in today&#x27;s event.</div><div class="xj">今日の催しへのご参加、ありがとうございます。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">pedestrian</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">歩行者</div><div class="ex">This street is only for <b>pedestrians</b> on Sundays.</div><div class="xj">この通りは、日曜日は歩行者専用だ。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">penalty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">罰；罰金</div><div class="ex">There is a small <b>penalty</b> for returning library books late.</div><div class="xj">図書館の本の返却が遅れると、軽い罰がある。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">phase</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">段階</div><div class="ex">The project is now in its final <b>phase</b>.</div><div class="xj">その計画は今、最後の段階にある。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">predator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">捕食動物</div><div class="ex">Lions are <b>predators</b> that hunt other animals.</div><div class="xj">ライオンは、ほかの動物を狩る捕食動物だ。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">prey</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">えじき；獲物</div><div class="ex">The owl was watching its <b>prey</b> from a tree.</div><div class="xj">フクロウは、木の上からえじきをじっと見ていた。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">prison</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">刑務所</div><div class="ex">The old <b>prison</b> on the hill is now a museum.</div><div class="xj">丘の上の古い刑務所は、今は博物館になっている。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">qualification</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">資格</div><div class="ex">You need a special <b>qualification</b> to become a nurse.</div><div class="xj">看護師になるには、特別な資格が必要だ。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">rainforest</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">熱帯雨林</div><div class="ex">Thousands of kinds of plants grow in the <b>rainforest</b>.</div><div iv></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">wisdom</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知恵</div><div class="ex">My grandmother shared her <b>wisdom</b> about life with me.</div><div class="xj">祖母は、人生についての知恵を私に話してくれた。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">abuse</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">乱用；虐待</div><div class="ex">The <b>abuse</b> of medicine can be dangerous to your health.</div><div class="xj">薬の乱用は、健康にとって危険なことがある。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">discipline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">しつけ；規律</div><div class="ex">Good <b>discipline</b> at home helps children grow up well.</div><div class="xj">家庭でのよいしつけは、子どもの健やかな成長を助ける。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">accuracy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">正確さ</div><div class="ex">Check your answers for <b>accuracy</b> before you hand them in.</div><div class="xj">提出する前に、答えの正確さを確かめなさい。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">maintenance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">維持；整備</div><div class="ex">The <b>maintenance</b> of this old castle costs a lot of money.</div><div class="xj">この古い城の維持には、多くのお金がかかる。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">motive</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">動機</div><div class="ex">What was your <b>motive</b> for joining the drama club?</div><div class="xj">演劇部に入った動機は
