</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第10回</h1><div class="sub">No.541〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">stimulate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を刺激する</div><div class="ex">Good questions can <b>stimulate</b> students&#x27; interest in science.</div><div class="xj">よい質問は、生徒の科学への興味を刺激することがある。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">substitute</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を代わりに使う</div><div class="ex">You can <b>substitute</b> honey for sugar in this recipe.</div><div class="xj">このレシピでは、はちみつを砂糖の代わりに使うことができる。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">suspend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を一時停止する；つるす</div><div class="ex">The club <b>suspended</b> its activities during the test period.</div><div class="xj">部はテスト期間中、活動を一時停止した。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">tolerate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を我慢する</div><div class="ex">I can&#x27;t <b>tolerate</b> loud noise when I&#x27;m studying.</div><div class="xj">勉強しているときは、大きな音が我慢できない。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">trace</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の跡をたどる</div><div class="ex">The hikers <b>traced</b> the old path through the forest.</div><div class="xj">ハイカーたちは、森の中の古い道の跡をたどった。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">vanish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">消える</div><div class="ex">The little rabbit <b>vanished</b> into the dark forest.</div><div class="xj">その小さなウサギは、暗い森の中へ消えた。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">wander</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">歩き回る；さまよう</div><div class="ex">We <b>wandered</b> around the old town all afternoon.</div><div class="xj">私たちは午後ずっと、古い町を歩き回った。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">accuse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を非難する；告発する</div><div class="ex">Lisa <b>accused</b> her little brother of eating her cake.</div><div class="xj">リサは、自分のケーキを食べたと言って弟を非難した。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">appoint</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を任命する</div><div class="ex">The coach <b>appointed</b> Ken as the new team captain.</div><div class="xj">コーチはケンを、チームの新しいキャプテンに任命した。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">assemble</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を組み立てる；集まる</div><div class="ex">My father and I <b>assembled</b> a new desk together.</div><div class="xj">父と私は、いっしょに新しい机を組み立てた。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">collapse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">崩壊する；倒れる</div><div class="ex">The old wooden house <b>collapsed</b> under the heavy snow.</div><div class="xj">古い木造の家が、大雪の重みで崩壊した。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">confess</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を告白する</div><div class="ex">Tom <b>confessed</b> that he had broken the window.</div><div class="xj">トムは、自分が窓を割ったことを告白した。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">dare</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">思いきって～する</div><div class="ex">Emi didn&#x27;t <b>dare</b> to speak to the famous singer.</div><div class="xj">エミはその有名な歌手に、思いきって話しかけることができなかった。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">deprive</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（deprive A of B で）AからBを奪う</div><div class="ex">Using a phone late at night can <b>deprive</b> you of sleep.</div><div class="xj">夜遅くにスマートフォンを使うと、睡眠を奪われることがある。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">differ</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">異なる</div><div class="ex">School rules <b>differ</b> from country to country.</div><div class="xj">校則は国によって異なる。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">dismiss</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を退ける；解雇する</div><div class="ex">The manager <b>dismissed</b> Ken&#x27;s idea without listening to it.</div><div class="xj">店長は、ケンの考えを聞きもせずに退けた。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">justify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を正当化する</div><div class="ex">Nothing can <b>justify</b> being rude to other people.</div><div class="xj">どんな理由があっても、人に失礼な態度をとることは正当化できない。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">thrive</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">繁栄する；よく育つ</div><div class="ex">Small shops <b>thrive</b> in this busy shopping street.</div><div class="xj">このにぎやかな商店街では、小さな店が繁栄している。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">territory</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">領土；縄張り</div><div class="ex">This island became part of the country&#x27;s <b>territory</b> long ago.</div><div class="xj">この島はずっと昔に、その国の領土の一部になった。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">therapy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">療法；治療</div><div class="ex">Music <b>therapy</b> helps patients feel more relaxed.</div><div class="xj">音楽療法は、患者の気持ちを落ち着かせるのに役立つ。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">vaccine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ワクチン</div><div class="ex">Scientists worked hard to develop a new <b>vaccine</b>.</div><div class="xj">科学者たちは、新しいワクチンを開発するために懸命に取り組んだ。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">wound</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">傷</div><div class="ex">The nurse cleaned the <b>wound</b> on my knee.</div><div class="xj">看護師が、ひざの傷をきれいにしてくれた。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">carbon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">炭素</div><div class="ex">Trees take in <b>carbon</b> from the air as they grow.</div><div class="xj">木は成長するとき、空気中の炭素を取り込む。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">consideration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">考慮；思いやり</div><div class="ex">After careful <b>consideration</b>, we decided to cancel the trip.</div><div class="xj">慎重に考慮した結果、私たちは旅行を中止することにした。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">despair</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">絶望</div><div class="ex">Ken did not fall into <b>despair</b> after losing the game.</div><div class="xj">ケンは試合に負けても、絶望しなかった。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">disability</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">障がい</div><div class="ex">This building is easy to use for people with <b>disabilities</b>.</div><div class="xj">この建物は、障がいのある人にも使いやすい。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">disorder</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">障害；混乱</div><div class="ex">Lisa has a sleep <b>disorder</b>, so she sees a doctor.</div><div class="xj">リサは睡眠障害があるので、医者に診てもらっている。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">dispute</span><span class="ps">名</span><span class="star">★</span> /span></div><div class="ja">港</div><div class="ex">Many fishing boats were waiting in the <b>harbor</b>.</div><div class="xj">たくさんの漁船が港で待機していた。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">hardship</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">苦難</div><div class="ex">The family faced many <b>hardships</b> after moving to a new country.</div><div class="xj">その家族は、新しい国に移ったあと、多くの苦難に直面した。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">hospitality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">もてなし</div><div class="ex">We were moved by the <b>hospitality</b> of the people in the village.</div><div class="xj">私たちは、その村の人々のもてなしに感動した。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">interaction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">交流；相互作用</div><div class="ex">The program encourages <b>interaction</b> between old and young people.</div><div class="xj">その企画は、お年寄りと若者の交流をうながしている。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">mankind</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人類</div><div class="ex">The invention of the wheel was a big step for <b>mankind</b>.</div><div class="xj">車輪の発明は、人類にとって大きな一歩だった。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">realistic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">現実的な</div><div class="ex">Let&#x27;s set a <b>realistic</b> goal for this summer.</div><div class="xj">この夏の現実的な目標を立てよう。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">relevant</span><span class=
