</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　復習 第6回</h1><div class="sub">復301〜復360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../r6.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="復301"><div class="top"><span class="no">復301</span><span class="en">disappear</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">消える；見えなくなる</div><div class="ex">The sun <b>disappeared</b> behind the clouds.</div><div class="xj">太陽が雲の向こうに消えた。</div></button></li><li><button class="w" data-no="復302"><div class="top"><span class="no">復302</span><span class="en">gain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を得る；（体重など）を増やす</div><div class="ex">My sister <b>gained</b> a lot of experience at her part-time job.</div><div class="xj">姉はアルバイトで多くの経験を得た。</div></button></li><li><button class="w" data-no="復303"><div class="top"><span class="no">復303</span><span class="en">suppose</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～だと思う；（be supposed to ～）～することになっている</div><div class="ex">I <b>suppose</b> Tom is still at soccer practice.</div><div class="xj">トムはまだサッカーの練習中だと思う。</div></button></li><li><button class="w" data-no="復304"><div class="top"><span class="no">復304</span><span class="en">select</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を選ぶ</div><div class="ex">Please <b>select</b> one color for your team T-shirt.</div><div class="xj">チームのTシャツの色を1つ選んでください。</div></button></li><li><button class="w" data-no="復305"><div class="top"><span class="no">復305</span><span class="en">rely</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（rely on ～）～に頼る</div><div class="ex">Many people <b>rely</b> on trains to get to work.</div><div class="xj">多くの人が、通勤を電車に頼っている。</div></button></li><li><button class="w" data-no="復306"><div class="top"><span class="no">復306</span><span class="en">suffer</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（suffer from ～）～に苦しむ</div><div class="ex">My brother often <b>suffers</b> from headaches in winter.</div><div class="xj">兄は冬になるとよく頭痛に苦しんでいる。</div></button></li><li><button class="w" data-no="復307"><div class="top"><span class="no">復307</span><span class="en">trust</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を信頼する</div><div class="ex">You can <b>trust</b> Ken because he always keeps his promises.</div><div class="xj">ケンはいつも約束を守るから、信頼してだいじょうぶだよ。</div></button></li><li><button class="w" data-no="復308"><div class="top"><span class="no">復308</span><span class="en">succeed</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">成功する；（succeed in -ing）～に成功する</div><div class="ex">After a lot of practice, Tom finally <b>succeeded</b>.</div><div class="xj">たくさん練習したあと、トムはついに成功した。</div></button></li><li><button class="w" data-no="復309"><div class="top"><span class="no">復309</span><span class="en">fry</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を油でいためる；揚げる</div><div class="ex">Dad <b>fried</b> onions and meat in a pan.</div><div class="xj">父はフライパンで玉ねぎと肉を油でいためた。</div></button></li><li><button class="w" data-no="復310"><div class="top"><span class="no">復310</span><span class="en">prefer</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～のほうを好む</div><div class="ex">I <b>prefer</b> tea to coffee in the morning.</div><div class="xj">朝はコーヒーより紅茶のほうが好きだ。</div></button></li><li><button class="w" data-no="復311"><div class="top"><span class="no">復311</span><span class="en">bury</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を埋める</div><div class="ex">The dog <b>buried</b> a bone in the garden.</div><div class="xj">犬は庭に骨を埋めた。</div></button></li><li><button class="w" data-no="復312"><div class="top"><span class="no">復312</span><span class="en">dig</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を掘る</div><div class="ex">The children <b>dug</b> a hole in the sand.</div><div class="xj">子どもたちは砂に穴を掘った。</div></button></li><li><button class="w" data-no="復313"><div class="top"><span class="no">復313</span><span class="en">register</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">登録する；～を登録する</div><div class="ex">You need to <b>register</b> online to join the event.</div><div class="xj">イベントに参加するには、オンラインで登録する必要がある。</div></button></li><li><button class="w" data-no="復314"><div class="top"><span class="no">復314</span><span class="en">locate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（be located in ～）～に位置している</div><div class="ex">The hotel is <b>located</b> in the center of the city.</div><div class="xj">そのホテルは市の中心に位置している。</div></button></li><li><button class="w" data-no="復315"><div class="top"><span class="no">復315</span><span class="en">assist</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を手伝う；援助する</div><div class="ex">Emi <b>assisted</b> her teacher with the science experiment.</div><div class="xj">エミは先生の理科の実験を手伝った。</div></button></li><li><button class="w" data-no="復316"><div class="top"><span class="no">復316</span><span class="en">seek</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を探し求める</div><div class="ex">Many young people come to the city to <b>seek</b> work.</div><div class="xj">多くの若者が仕事を探し求めて都市にやってくる。</div></button></li><li><button class="w" data-no="復317"><div class="top"><span class="no">復317</span><span class="en">destroy</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を破壊する</div><div class="ex">A big wave <b>destroyed</b> the sand castle we made.</div><div class="xj">大きな波が、私たちが作った砂の城を破壊した。</div></button></li><li><button class="w" data-no="復318"><div class="top"><span class="no">復318</span><span class="en">describe</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を描写する；説明する</div><div class="ex">The writer <b>described</b> the beautiful sunset in her book.</div><div class="xj">その作家は本の中で美しい夕日を描写した。</div></button></li><li><button class="w" data-no="復319"><div class="top"><span class="no">復319</span><span class="en">performer</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">演奏者；出演者</div><div class="ex">The street <b>performer</b> played the guitar beautifully.</div><div class="xj">その路上演奏者は、美しくギターをひいた。</div></button></li><li><button class="w" data-no="復320"><div class="top"><span class="no">復320</span><span class="en">track</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（競技場の）トラック；線路；跡</div><div class="ex">The runners ran around the <b>track</b> five times.</div><div class="xj">走者たちはトラックを5周走った。</div></button></li><li><button class="w" data-no="復321"><div class="top"><span class="no">復321</span><span class="en">plate</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（平たい）皿</div><div class="ex">Please put the cake on this <b>plate</b>.</div><div class="xj">ケーキをこの皿にのせてください。</div></button></li><li><button class="w" data-no="復322"><div class="top"><span class="no">復322</span><span class="en">shopper</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">買い物客</div><div class="ex">The mall was full of <b>shoppers</b> on Sunday.</div><div class="xj">日曜日、ショッピングモールは買い物客でいっぱいだった。</div></button></li><li><button class="w" data-no="復323"><div class="top"><span class="no">復323</span><span class="en">sunlight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">日光</div><div class="ex">Plants need <b>sunlight</b> and water to grow.</div><div class="xj">植物が育つには、日光と水が必要だ。</div></button></li><li><button class="w" data-no="復324"><div class="top"><span class="no">復324</span><span class="en">backpack</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">リュックサック</div><div class="ex">Tom put his lunch and a water bottle in his <b>backpack</b>.</div><div class="xj">トムは弁当と水筒をリュックサックに入れた。</div></button></li><li><button class="w" data-no="復325"><div class="top"><span class="no">復325</span><span class="en">seller</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">売り手；販売者</div><div class="ex">The <b>seller</b> at the market gave us some free apples.</div><div class="xj">市場の売り手が、私たちにりんごをおまけでくれた。</div></button></li><li><button class="w" data-no="復326"><div class="top"><span class="no">復326</span><span class="en">hiker</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ハイキングをする人</div><div class="ex">Many <b>hikers</b> visit this mountain in autumn.</div><div class="xj">秋には多くのハイキングをする人がこの山を訪れる。</div></button></li><li><button class="w" data-no="復327"><div class="top"><span class="no">復327</span><span class="en">hesitation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ためらい</div><div class="ex">Ken answered the teacher&#x27;s question without <b>hesitation</b>.</div><div class="xj">ケンは先生の質問にためらいなく答えた。</div></button></li><li><button class="w" data-no="復328"><div class="top"><span class="no">復328</span><span class="en">software</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ソフトウェア</div><div class="ex">You need new <b>software</b> to open this file.</div><div class="xj">このファイルを開くには、新しいソフトウェアが必要だ。</div></button></li><li><button class="w" data-no="復329"><div class="top"><span class="no">復329</span><span class="en">suggestion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">提案</div><div class="ex">Does anyone have a <b>suggestion</b> for the class party?</div><div class="xj">クラスのパーティーについて、だれか提案はありますか。</div></button></li><li><button class="w" data-no="復330"><div class="top"><span class="no">復330</span><span class="en">pattern</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">模様；型</div><div class="ex">Emi&#x27;s new dress has a flower <b>pattern</b>.</div><div class="xj">エミの新しいドレスには花の模様がついている。</div></button></li><li><button class="w" data-no="復331"><div class="top"><span class="no">復331</span><span class="en">baggage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">手荷物</div><div class="ex">We picked up our <b>baggage</b> at the airport.</div><div class="xj">私たちは空港で手荷物を受け取った。</div></button></li><li><button class="w" data-no="復332"><div class="top"><span class="no">復332</span><span class="en">value</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">価値</div><div class="ex">The <b>value</b> of this old coin is very high.</div><div class="xj">この古いコインの価値はとても高い。</div></button></li><li><button class="w" data-no="復333"><div class="top"><span class="no">復333</span><span class="en">spot</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">場所；地点</div><div class="ex">This beach is a popular <b>spot</b> for surfing.</div><div class="xj">このビーチはサーフィンの人気の場所だ。</div></button></li><li><button class="w" data-no="復334"><div class="top"><span class="no">復334</span><span class="en">inconvenience</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">不便；迷惑</div><div class="ex">Living far from the station is a great <b>inconvenience</b>.</div><div class="xj">駅から遠くに住むのは、とても不便だ。</div></button></li><li><button class="w" data-no="復335"><div class="top"><span class="no">復335</span><span class="en">essay</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">作文；小論文</div><div class="ex">We have to write an <b>essay</b> about our dreams.</div><div class="xj">私たちは自分の夢について作文を書かなければならない。</div></button></li><li><button class="w" data-no="復336"><div class="top"><span class="no">復336</span><span class="en">series</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ひと続き；シリーズ</div><div class="ex">A <b>series</b> of small mistakes made our team lose.</div><div class="xj">小さなミスの連続で、私たちのチームは負けてしまった。</div></button></li><li><button class="w" data-no="復337"><div class="top"><span class="no">復337</span><span class="en">enemy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">敵</div><div class="ex">Cats and dogs are not always <b>enemies</b>.</div><div class="xj">ねこと犬がいつも敵同士とは限らない。</div></button></li><li><button class="w" data-no="復338"><div class="top"><span class="no">復338</span><span class="en">talent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">才能</div><div class="ex">Emi has a <b>talent</b> for drawing pictures.</div><div class="xj">エミには絵をかく才能がある。</div></button></li><li><button class="w" data-no="復339"><div class="top"><span class="no">復339</span><span class="en">garage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">車庫；ガレージ</div><div class="ex">Dad keeps his bike in the <b>garage</b>.</div><div class="xj">父は車庫に自転車を置いている。</div></button></li><li><button class="w" data-no="復340"><div class="top"><span class="no">復340</span><span class="en">delivery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">配達</div><div class="ex">The <b>delivery</b> of our new sofa is on Sunday.</div><div class="xj">新しいソファの配達は日曜日だ。</div></button></li><li><button class="w" data-no="復341"
