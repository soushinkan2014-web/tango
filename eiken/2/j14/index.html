div><div class="xj">私はスポーツが好きで、特にテニスが大好きだ。</div></button></li><li><button class="w" data-no="熟136"><div class="top"><span class="no">熟136</span><span class="en">that is (to say)</span></div><div class="ja">すなわち、つまり</div><div class="ex">We will meet in three days, that is, on Friday.</div><div class="xj">3日後、つまり金曜日に会いましょう。</div></button></li><li><button class="w" data-no="熟137"><div class="top"><span class="no">熟137</span><span class="en">to some extent</span></div><div class="ja">ある程度は</div><div class="ex">I agree with you to some extent.</div><div class="xj">ある程度はあなたに賛成だ。</div></button></li><li><button class="w" data-no="熟138"><div class="top"><span class="no">熟138</span><span class="en">in a sense</span></div><div class="ja">ある意味では</div><div class="ex">In a sense, failure is a good teacher.</div><div class="xj">ある意味では、失敗はよい先生だ。</div></button></li><li><button class="w" data-no="熟139"><div class="top"><span class="no">熟139</span><span class="en">in any case</span></div><div class="ja">いずれにしても</div><div class="ex">It may rain tomorrow. In any case, we will hold the event.</div><div class="xj">明日は雨かもしれない。いずれにしても、イベントは行う。</div></button></li><li><button class="w" data-no="熟140"><div class="top"><span class="no">熟140</span><span class="en">all in all</span></div><div class="ja">全体的に見て、概して</div><div class="ex">All in all, it was a wonderful trip.</div><div class="xj">全体的に見て、すばらしい旅行だった。</div></button></li><li><button class="w" data-no="会66"><div class="top"><span class="no">会66</span><span class="en">What I mean is ～.</span></div><div class="ja">私が言いたいのは～ということです。</div><div class="ex">A: So you don&#x27;t like my plan?<br>B: I didn&#x27;t say that. What I mean is that it might cost too much.</div></button></li><li><button class="w" data-no="会67"><div class="top"><span class="no">会67</span><span class="en">Let me put it this way.</span></div><div class="ja">こう言えばわかるかな。</div><div class="ex">A: I don&#x27;t understand why this rule is important.<br>B: Let me put it this way. Without it, someone could get hurt.</div></button></li><li><button class="w" data-no="会68"><div class="top"><span class="no">会68</span><span class="en">That explains it.</span></div><div class="ja">それで納得した。</div><div class="ex">A: Mike stayed up all night studying.<br>B: That explains it. He looked so tired in class.</div></button></li><li><button class="w" data-no="会69"><div class="top"><span class="no">会69</span><span class="en">Now I get it.</span></div><div class="ja">やっとわかった。</div><div class="ex">A: You multiply this number first, and then add five.<br>B: Oh, now I get it. Thanks!</div></button></li><li><button class="w" data-no="会70"><div class="top"><span class="no">会70</span><span class="en">Got it.</span></div><div class="ja">了解。・わかった。</div><div class="ex">A: Remember to lock the door when you leave.<br>B: Got it.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j13/">← 熟語 Set 13</a><a href="../j15/">熟語 Set 15 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟131": 5.27, "熟132": 18.39, "熟133": 32.36, "熟134": 46.44, "熟135": 59.56, "熟136": 73.02, "熟137": 88.52, "熟138": 101.19, "熟139": 114.22, "熟140": 129.67, "会66": 143.83, "会67": 163.57, "会68": 183.32, "会69": 201.45, "会70": 219.52}, "TE": {"熟131": 7.14, "熟132": 20.26, "熟133": 34.23, "熟134": 48.31, "熟135": 61.44, "熟136": 75.33, "熟137": 90.52, "熟138": 103.06, "熟139": 116.24, "熟140": 131.54, "会66": 145.8, "会67": 165.71, "会68": 185.28, "会69": 203.32, "会70": 221.39}, "Q": [["熟131", "in short", "要するに"], ["熟132", "in brief", "手短に、簡単に言えば"], ["熟133", "in general", "一般に、たいてい"], ["熟134", "as a whole", "全体として"], ["熟135", "in particular", "特に"], ["熟136", "that is (to say)", "すなわち、つまり"], ["熟137", "to some extent", "ある程度は"], ["熟138", "in a sense", "ある意味では"], ["熟139", "in any case", "いずれにしても"], ["熟140", "all in all", "全体的に見て、概して"], ["会66", "What I mean is ～.", "私が言いたいのは～ということです。"], ["
