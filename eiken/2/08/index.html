</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第8回</h1><div class="sub">No.421〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">emerge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">現れる</div><div class="ex">A small cat <b>emerged</b> from under the car.</div><div class="xj">車の下から小さな猫が現れた。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">exceed</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を超える</div><div class="ex">The number of visitors <b>exceeded</b> 10,000 this year.</div><div class="xj">今年、来場者数は1万人を超えた。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">interpret</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を解釈する；通訳する</div><div class="ex">People <b>interpret</b> the same poem in different ways.</div><div class="xj">同じ詩でも、人によってさまざまに解釈する。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">inherit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を受け継ぐ；相続する</div><div class="ex">Emi <b>inherited</b> her mother&#x27;s talent for music.</div><div class="xj">エミは母親の音楽の才能を受け継いだ。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">manufacture</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を製造する</div><div class="ex">This factory <b>manufactures</b> toys for small children.</div><div class="xj">この工場は、幼い子ども向けのおもちゃを製造している。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">accompany</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に同行する；～に伴う</div><div class="ex">Children under twelve must be <b>accompanied</b> by an adult.</div><div class="xj">12歳未満の子どもには、大人が同行しなければならない。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">assign</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を割り当てる</div><div class="ex">The teacher <b>assigned</b> each student a different topic.</div><div class="xj">先生は、生徒一人ひとりに違うテーマを割り当てた。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">associate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を結びつけて考える</div><div class="ex">Many people <b>associate</b> summer with the beach.</div><div class="xj">多くの人は、夏を海と結びつけて考える。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">convey</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を伝える；運ぶ</div><div class="ex">Pictures can <b>convey</b> a message without words.</div><div class="xj">絵は、言葉がなくてもメッセージを伝えることができる。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">distinguish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を区別する</div><div class="ex">Can you <b>distinguish</b> between these two birds?</div><div class="xj">この2羽の鳥を区別することができますか。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">finance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">財政；財務</div><div class="ex">The city needs to fix its <b>finances</b> before building a new hall.</div><div class="xj">市は新しいホールを建てる前に、財政を立て直す必要がある。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">extinction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">絶滅</div><div class="ex">Many animals are in danger of <b>extinction</b>.</div><div class="xj">多くの動物が絶滅の危機にある。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">foundation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">基礎；財団</div><div class="ex">Good habits are the <b>foundation</b> of a healthy life.</div><div class="xj">よい習慣は、健康的な生活の基礎だ。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">funeral</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">葬式</div><div class="ex">In Japan, people usually wear black clothes to a <b>funeral</b>.</div><div class="xj">日本では、ふつう葬式には黒い服を着ていく。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">gender</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">性別</div><div class="ex">Please write your name, age, and <b>gender</b> on this form.</div><div class="xj">この用紙に、名前、年齢、性別を書いてください。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">horizon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地平線；水平線</div><div class="ex">The sun slowly went down below the <b>horizon</b>.</div><div class="xj">太陽がゆっくりと地平線の下に沈んだ。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">humanity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人類；人間性</div><div class="ex">Climate change is a big challenge for <b>humanity</b>.</div><div class="xj">気候変動は、人類にとって大きな課題だ。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">incident</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出来事；事件</div><div class="ex">A funny <b>incident</b> happened during our school trip.</div><div class="xj">修学旅行中に、おもしろい出来事があった。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">infection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感染（症）</div><div class="ex">Washing your hands often helps prevent <b>infection</b>.</div><div class="xj">こまめに手を洗うことは、感染の予防に役立つ。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">inhabitant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">住民</div><div class="ex">The island has only about 200 <b>inhabitants</b>.</div><div class="xj">その島には、住民が約200人しかいない。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">innovation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">革新</div><div class="ex"><b>Innovation</b> is important for a company to grow.</div><div class="xj">企業が成長するには、革新が大切だ。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">insight</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">洞察（力）</div><div class="ex">This book gives us <b>insight</b> into life in old Japan.</div><div class="xj">この本は、昔の日本の生活について洞察を与えてくれる。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">instinct</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">本能</div><div class="ex">Birds know how to build nests by <b>instinct</b>.</div><div class="xj">鳥は本能で巣の作り方を知っている。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">institution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">機関；制度</div><div class="ex">The university is a famous <b>institution</b> for medical research.</div><div class="xj">その大学は、医学研究で有名な機関だ。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">justice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">正義；公正</div><div class="ex">The hero in the story fought for <b>justice</b>.</div><div class="xj">物語の主人公は正義のために戦った。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">investment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">投資</div><div class="ex">Buying good shoes is a wise <b>investment</b> for runners.</div><div class="xj">よい靴を買うことは、ランナーにとって賢い投資だ。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">landmark</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目印；名所</div><div class="ex">The old clock tower is a famous <b>landmark</b> in our town.</div><div class="xj">その古い時計台は、私たちの町の有名な名所だ。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">layer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">層</div><div class="ex">A thick <b>layer</b> of snow covered the ground.</div><div class="xj">厚い雪の層が地面をおおっていた。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">legend</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">伝説</div><div class="ex">There is an old <b>legend</b> about a dragon in this lake.</div><div class="xj">この湖には、竜についての古い伝説がある。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">lifetime</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">一生</div><div class="ex">My grandmother traveled to thirty countries in her <b>lifetime</b>.</div><div class="xj">祖母は一生のうちに30か国を旅した。</div></button></li><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">mammal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">哺乳動物</div><div class="ex">Whales live in the sea, but they are <b>mammals</b>, not fish.</div><div class="xj">クジラは海にすんでいるが、魚ではなく哺乳動物だ。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">military</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">軍隊</div><div class="ex">My uncle served in the <b>military</b> for ten years.</div><div class="xj">おじは10年間、軍隊に勤めていた。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">mineral</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">鉱物；ミネラル</div><div class="ex">This country is rich in <b>minerals</b> such as gold.</div><div class="xj">この国は、金などの鉱物が豊富だ。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">minimum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">最低限</div><div class="ex">Please keep the noise to a <b>minimum</b> in the library.</div><div class="xj">図書館では、物音を最低限におさえてください。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">mission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">使命；任務</div><div class="ex">Our school&#x27;s <b>mission</b> is to help every student grow.</div><div class="xj">私たちの学校の使命は、すべての生徒の成長を助けることだ。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">moral</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">教訓；（morals で）道徳</div><div class="ex">The <b>moral</b> of this story is to be kind to others.</div><div class="xj">この物語の教訓は、他人に親切にすることだ。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">necessity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">必要（性）；必需品</div><div class="ex">Lisa explained the <b>necessity</b> of saving water.</div><div class="xj">リサは節水の必要性を説明した。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">dependent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">頼っている</div><div class="ex">Japan is <b>dependent</b> on other countries for oil.</div><div class="xj">日本は石油を他の国に頼っている。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">desperate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">必死の；絶望的な</div><div class="ex">Ken made a <b>desperate</b> effort to catch the last train.</div><div class="xj">ケンは終電に間に合うよう、必死の努力をした。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">domestic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">国内の；家庭の</div><div class="ex">This airport is only for <b>domestic</b> flights.</div><div class="xj">この空港は国内線専用だ。</div></button></li><li><button class="w" data-no="461"><div cla
