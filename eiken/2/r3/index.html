to.</div><div class="xj">おばは京都で小さなホテルを経営している。</div></button></li><li><button class="w" data-no="復125"><div class="top"><span class="no">復125</span><span class="en">earn</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（お金）をかせぐ；得る</div><div class="ex">Emi <b>earned</b> some money by washing her neighbors&#x27; cars.</div><div class="xj">エミは近所の人の車を洗ってお金をかせいだ。</div></button></li><li><button class="w" data-no="復126"><div class="top"><span class="no">復126</span><span class="en">mention</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～について述べる；言及する</div><div class="ex">Ken <b>mentioned</b> his trip to Hokkaido in his speech.</div><div class="xj">ケンはスピーチの中で北海道旅行について述べた。</div></button></li><li><button class="w" data-no="復127"><div class="top"><span class="no">復127</span><span class="en">occur</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">起こる；（考えが）浮かぶ</div><div class="ex">Mistakes often <b>occur</b> when you are in a hurry.</div><div class="xj">急いでいるときは、ミスがよく起こる。</div></button></li><li><button class="w" data-no="復128"><div class="top"><span class="no">復128</span><span class="en">approach</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に近づく</div><div class="ex">A large ship was <b>approaching</b> the port.</div><div class="xj">大きな船が港に近づいていた。</div></button></li><li><button class="w" data-no="復129"><div class="top"><span class="no">復129</span><span class="en">arrange</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を手配する；並べる</div><div class="ex">Dad <b>arranged</b> a taxi to the airport.</div><div class="xj">父は空港までのタクシーを手配した。</div></button></li><li><button class="w" data-no="復130"><div class="top"><span class="no">復130</span><span class="en">breathe</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">呼吸する</div><div class="ex">It is hard to <b>breathe</b> at the top of high mountains.</div><div class="xj">高い山の頂上では呼吸するのが難しい。</div></button></li><li><button class="w" data-no="復131"><div class="top"><span class="no">復131</span><span class="en">lower</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を下げる；低くする</div><div class="ex">The store <b>lowered</b> the price of the old computers.</div><div class="xj">その店は古いパソコンの値段を下げた。</div></button></li><li><button class="w" data-no="復132"><div class="top"><span class="no">復132</span><span class="en">progress</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">進歩；前進</div><div class="ex">Ken has made great <b>progress</b> in English.</div><div class="xj">ケンは英語で大きな進歩をとげた。</div></button></li><li><button class="w" data-no="復133"><div class="top"><span class="no">復133</span><span class="en">gardening</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">園芸；庭いじり</div><div class="ex">My grandmother enjoys <b>gardening</b> on weekends.</div><div class="xj">祖母は週末に園芸を楽しんでいる。</div></button></li><li><button class="w" data-no="復134"><div class="top"><span class="no">復134</span><span class="en">charge</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">料金；責任</div><div class="ex">There is no <b>charge</b> for children under six.</div><div class="xj">6歳未満の子どもは料金がかからない。</div></button></li><li><button class="w" data-no="復135"><div class="top"><span class="no">復135</span><span class="en">review</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">批評；見直し</div><div class="ex">I read a <b>review</b> of the new movie in the newspaper.</div><div class="xj">新聞で新しい映画の批評を読んだ。</div></button></li><li><button class="w" data-no="復136"><div class="top"><span class="no">復136</span><span class="en">discovery</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">発見</div><div class="ex">The <b>discovery</b> of the old coins surprised everyone.</div><div class="xj">古いコインの発見はみんなを驚かせた。</div></button></li><li><button class="w" data-no="復137"><div class="top"><span class="no">復137</span><span class="en">stress</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ストレス；圧力</div><div class="ex">Exercise is a good way to reduce <b>stress</b>.</div><div class="xj">運動はストレスを減らすよい方法だ。</div></button></li><li><button class="w" data-no="復138"><div class="top"><span class="no">復138</span><span class="en">source</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">源；出所</div><div class="ex">The sun is our main <b>source</b> of energy.</div><div class="xj">太陽は私たちのおもなエネルギーの源だ。</div></button></li><li><button class="w" data-no="復139"><div class="top"><span class="no">復139</span><span class="en">crop</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">作物；収穫高</div><div class="ex">Rice is the main <b>crop</b> in this area.</div><div class="xj">米はこの地域の主な作物だ。</div></button></li><li><button class="w" data-no="復140"><div class="top"><span class="no">復140</span><span class="en">airline</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">航空会社</div><div class="ex">This <b>airline</b> flies to many cities in Asia.</div><div class="xj">この航空会社はアジアの多くの都市に便を出している。</div></button></li><li><button class="w" data-no="復141"><div class="top"><span class="no">復141</span><span class="en">position</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">位置；地位</div><div class="ex">Please show me the <b>position</b> of our school on this map.</div><div class="xj">この地図で、私たちの学校の位置を教えてください。</div></button></li><li><button class="w" data-no="復142"><div class="top"><span class="no">復142</span><span class="en">emotion</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">感情</div><div class="ex">It is sometimes hard to hide your <b>emotions</b>.</div><div class="xj">自分の感情を隠すのは、ときに難しい。</div></button></li><li><button cl
