</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第4回</h1><div class="sub">No.181〜240</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">reverse</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を逆にする</div><div class="ex">Please <b>reverse</b> the order of these two words.</div><div class="xj">この2つの語の順番を逆にしてください。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">instruct</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に指示する；教える</div><div class="ex">The coach <b>instructed</b> us to run around the field.</div><div class="xj">コーチは私たちに、グラウンドを走るよう指示した。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">seize</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をつかむ；奪う</div><div class="ex">Ken <b>seized</b> the ball and ran toward the goal.</div><div class="xj">ケンはボールをつかんで、ゴールに向かって走った。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">flatten</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を平らにする</div><div class="ex">Lisa <b>flattened</b> the empty boxes before putting them out for recycling.</div><div class="xj">リサは空き箱をリサイクルに出す前に平らにした。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">resent</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に腹を立てる</div><div class="ex">Tom <b>resented</b> being treated like a little child.</div><div class="xj">トムは小さな子どものように扱われることに腹を立てた。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">crawl</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">はう</div><div class="ex">The baby <b>crawled</b> across the floor to her mother.</div><div class="xj">赤ちゃんは床をはって母親のところへ行った。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">carve</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を彫る</div><div class="ex">My grandfather <b>carved</b> a small bird out of wood.</div><div class="xj">祖父は木で小さな鳥を彫った。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">maintain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を維持する</div><div class="ex">It is important to <b>maintain</b> a healthy weight.</div><div class="xj">健康的な体重を維持することは大切だ。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">adjust</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を調整する</div><div class="ex">You can <b>adjust</b> the height of this chair.</div><div class="xj">このいすは高さを調整することができる。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">generate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を生み出す</div><div class="ex">We can use the wind to <b>generate</b> electricity.</div><div class="xj">風を使って電気を生み出すことができる。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">detect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を見つける；探知する</div><div class="ex">This machine can <b>detect</b> smoke in the kitchen.</div><div class="xj">この機械は台所の煙を見つけることができる。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">enable</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を可能にする</div><div class="ex">This new app <b>enables</b> us to study anywhere.</div><div class="xj">この新しいアプリは、どこでも勉強することを可能にする。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">absorb</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を吸収する</div><div class="ex">Plants <b>absorb</b> water from the ground through their roots.</div><div class="xj">植物は根を通して、地面から水を吸収する。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">geography</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地理（学）</div><div class="ex"><b>Geography</b> is my favorite subject at school.</div><div class="xj">地理は学校で一番好きな教科だ。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">distinction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">区別；違い</div><div class="ex">It is hard to make a <b>distinction</b> between the twins.</div><div class="xj">その双子を区別するのは難しい。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">offspring</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">子孫；（動物の）子</div><div class="ex">Animals pass on some of their features to their <b>offspring</b>.</div><div class="xj">動物は、自分の特徴の一部を子孫に伝える。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">honeymoon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">新婚旅行</div><div class="ex">My aunt and uncle went to Hawaii on their <b>honeymoon</b>.</div><div class="xj">おばとおじは新婚旅行でハワイに行った。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">glory</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">栄光</div><div class="ex">The old castle reminds us of the city&#x27;s past <b>glory</b>.</div><div class="xj">古い城は、その都市のかつての栄光を思い出させる。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">fireplace</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">暖炉</div><div class="ex">We sat around the <b>fireplace</b> on a cold winter night.</div><div class="xj">寒い冬の夜、私たちは暖炉のまわりに座った。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">rooftop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">屋上</div><div class="ex">We watched the fireworks from the <b>rooftop</b> of our school.</div><div class="xj">私たちは学校の屋上から花火を見た。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">troop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">部隊；群れ</div><div class="ex">The <b>troops</b> helped many people after the big flood.</div><div class="xj">大洪水のあと、部隊が多くの人々を助けた。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">jail</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">刑務所</div><div class="ex">The thief in the movie was sent to <b>jail</b> at the end.</div><div class="xj">その映画のどろぼうは、最後に刑務所に送られた。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">timetable</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">時刻表；予定表</div><div class="ex">Let&#x27;s check the bus <b>timetable</b> before we leave.</div><div class="xj">出発する前に、バスの時刻表を確認しよう。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">puzzle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">パズル；なぞ</div><div class="ex">Ken finished the 1,000-piece <b>puzzle</b> in two days.</div><div class="xj">ケンは1000ピースのパズルを2日で完成させた。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">warrior</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">戦士</div><div class="ex">In the old story, a brave <b>warrior</b> saved the village.</div><div class="xj">その昔話では、勇敢な戦士が村を救った。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">billboard</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">広告板</div><div class="ex">There is a large <b>billboard</b> for a new movie near the station.</div><div class="xj">駅の近くに、新しい映画の大きな広告板がある。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">heaven</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">天国</div><div class="ex">To us, the beautiful garden looked like <b>heaven</b>.</div><div class="xj">私たちには、その美しい庭が天国のように見えた。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">rage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">激怒</div><div class="ex">The king in the story shouted in <b>rage</b> at his men.</div><div class="xj">物語の王は激怒して、家来たちをどなりつけた。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">motivation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">やる気；動機</div><div class="ex">Good grades gave Kate more <b>motivation</b> to study.</div><div class="xj">よい成績を取って、ケイトは勉強へのやる気が高まった。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">inspiration</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ひらめき；刺激</div><div class="ex">The artist got <b>inspiration</b> for the painting from the sea.</div><div class="xj">その画家は、海からその絵のひらめきを得た。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">agency</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">代理店</div><div class="ex">We booked our trip through a travel <b>agency</b>.</div><div class="xj">私たちは旅行代理店を通して旅行を予約した。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">barrier</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">障壁</div><div class="ex">Language can be a <b>barrier</b> when you travel abroad.</div><div class="xj">海外旅行では、言葉が障壁になることがある。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">pace</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">速度；ペース</div><div class="ex">Let&#x27;s walk at a slower <b>pace</b> so Grandma can keep up.</div><div class="xj">おばあちゃんがついてこられるように、もっとゆっくりしたペースで歩こう。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">council</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">議会；評議会</div><div class="ex">The city <b>council</b> decided to build a new park.</div><div class="xj">市議会は、新しい公園を造ることを決めた。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">behalf</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（on behalf of で）～の代わりに</div><div class="ex">Ken accepted the prize on <b>behalf</b> of his team.</div><div class="xj">ケンはチームに代わって賞を受け取った。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">inquiry</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">問い合わせ</div><div class="ex">Thank you for your <b>inquiry</b> about our summer classes.</div><div class="xj">夏期講習についての問い合わせ、ありがとうございます。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">perspective</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">見方；観点</div><div class="ex">Traveling abroad gave Emi a new <b>perspective</b> on life.</div><div class="xj">海外旅行は、エミに人生についての新しい見方を与えた。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">alternative</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">代わりのもの；代案</div><div class="ex">Is there a good <b>alternative</b> to plastic bags?</div><div class="xj">ビニール袋のよい代わりのものはありますか。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">burden</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">負担；重荷</div><div class="ex">Ken didn&#x27;t want to be a <b>burden</b> to his family.</div><div class="xj">ケンは家族の負担になりたくなかった。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">ignorant</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">無知な</div><div class="ex">I was <b>ignorant</b> of the school&#x27;s new rules.</div>
