</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第23回</h1><div class="sub">No.1321〜1380</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1321"><div class="top"><span class="no">1321</span><span class="en">disapprove</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（disapprove of で）～に反対する</div><div class="ex">My parents <b>disapprove</b> of my staying up late.</div><div class="xj">両親は、私が夜ふかしをすることに反対している。</div></button></li><li><button class="w" data-no="1322"><div class="top"><span class="no">1322</span><span class="en">enclose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を同封する；囲む</div><div class="ex">I <b>enclosed</b> a photo with my letter to Lisa.</div><div class="xj">私はリサへの手紙に写真を同封した。</div></button></li><li><button class="w" data-no="1323"><div class="top"><span class="no">1323</span><span class="en">patrol</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を巡回する</div><div class="ex">Police officers <b>patrol</b> the park every night.</div><div class="xj">警察官が毎晩その公園を巡回している。</div></button></li><li><button class="w" data-no="1324"><div class="top"><span class="no">1324</span><span class="en">reunite</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">再会する；～を再会させる</div><div class="ex">The two old friends <b>reunited</b> after ten years.</div><div class="xj">その2人の旧友は、10年ぶりに再会した。</div></button></li><li><button class="w" data-no="1325"><div class="top"><span class="no">1325</span><span class="en">gaze</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">じっと見つめる</div><div class="ex">Emi <b>gazed</b> at the stars for a long time.</div><div class="xj">エミは長い間、星をじっと見つめた。</div></button></li><li><button class="w" data-no="1326"><div class="top"><span class="no">1326</span><span class="en">reinforce</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を強化する</div><div class="ex">Workers <b>reinforced</b> the old bridge with steel.</div><div class="xj">作業員たちは、古い橋を鉄で強化した。</div></button></li><li><button class="w" data-no="1327"><div class="top"><span class="no">1327</span><span class="en">crush</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を押しつぶす</div><div class="ex">Please <b>crush</b> the empty cans before you recycle them.</div><div class="xj">リサイクルに出す前に、空き缶を押しつぶしてください。</div></button></li><li><button class="w" data-no="1328"><div class="top"><span class="no">1328</span><span class="en">astonish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を驚かせる</div><div class="ex">The magician <b>astonished</b> everyone with his tricks.</div><div class="xj">その手品師は、手品でみんなを驚かせた。</div></button></li><li><button class="w" data-no="1329"><div class="top"><span class="no">1329</span><span class="en">mimic</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をまねる</div><div class="ex">Our parrot can <b>mimic</b> the sound of the doorbell.</div><div class="xj">うちのオウムは、玄関のチャイムの音をまねることができる。</div></button></li><li><button class="w" data-no="1330"><div class="top"><span class="no">1330</span><span class="en">extract</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を抜き取る；抽出する</div><div class="ex">The dentist <b>extracted</b> one of my back teeth yesterday.</div><div class="xj">昨日、歯医者が私の奥歯を1本抜き取った。</div></button></li><li><button class="w" data-no="1331"><div class="top"><span class="no">1331</span><span class="en">peel</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の皮をむく</div><div class="ex">Could you <b>peel</b> the apples for the pie?</div><div class="xj">パイ用に、リンゴの皮をむいてくれる？</div></button></li><li><button class="w" data-no="1332"><div class="top"><span class="no">1332</span><span class="en">exhale</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">息を吐く</div><div class="ex">Breathe in deeply, and then <b>exhale</b> slowly.</div><div class="xj">深く息を吸って、それからゆっくり息を吐いてください。</div></button></li><li><button class="w" data-no="1333"><div class="top"><span class="no">1333</span><span class="en">roam</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">歩き回る</div><div class="ex">Many deer <b>roam</b> freely in this large park.</div><div class="xj">この広い公園では、たくさんのシカが自由に歩き回っている。</div></button></li><li><button class="w" data-no="1334"><div class="top"><span class="no">1334</span><span class="en">disgust</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">嫌悪</div><div class="ex">Emi looked at the dirty kitchen with <b>disgust</b>.</div><div class="xj">エミは汚れた台所を嫌悪の目で見た。</div></button></li><li><button class="w" data-no="1335"><div class="top"><span class="no">1335</span><span class="en">revenue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">歳入；収益</div><div class="ex">The city&#x27;s <b>revenue</b> from tourism has grown a lot.</div><div class="xj">観光による市の歳入は大きく増えた。</div></button></li><li><button class="w" data-no="1336"><div class="top"><span class="no">1336</span><span class="en">radiation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">放射線；放射</div><div class="ex">X-rays are a type of <b>radiation</b> used in hospitals.</div><div class="xj">X線は、病院で使われる放射線の一種だ。</div></button></li><li><button class="w" data-no="1337"><div class="top"><span class="no">1337</span><span class="en">fuss</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大騒ぎ</div><div class="ex">Don&#x27;t make a <b>fuss</b> about such a small thing.</div><div class="xj">そんな小さなことで大騒ぎしないで。</div></button></li><li><button class="w" data-no="1338"><div class="top"><span class="no">1338</span><span class="en">relaxation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">くつろぎ；息抜き</div><div class="ex">This park is a good place for rest and <b>relaxation</b>.</div><div class="xj">この公園は、休息とくつろぎによい場所だ。</div></button></li><li><button class="w" data-no="1339"><div class="top"><span class="no">1339</span><span class="en">pension</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">年金</div><div class="ex">My grandfather started receiving a <b>pension</b> when he turned sixty-five.</div><div class="xj">祖父は65歳になって、年金を受け取り始めた。</div></button></li><li><button class="w" data-no="1340"><div class="top"><span class="no">1340</span><span class="en">civilian</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">一般市民；民間人</div><div class="ex">During the festival, <b>civilians</b> can visit the navy ship.</div><div class="xj">祭りの間は、一般市民もその海軍の船を見学できる。</div></button></li><li><button class="w" data-no="1341"><div class="top"><span class="no">1341</span><span class="en">merchant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">商人</div><div class="ex">In the past, <b>merchants</b> came to this port to sell silk.</div><div class="xj">昔、商人たちが絹を売りにこの港へやって来た。</div></button></li><li><button class="w" data-no="1342"><div class="top"><span class="no">1342</span><span class="en">recipient</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">受取人</div><div class="ex">Write the name of the <b>recipient</b> on the front of the envelope.</div><div class="xj">封筒の表に受取人の名前を書きなさい。</div></button></li><li><button class="w" data-no="1343"><div class="top"><span class="no">1343</span><span class="en">landslide</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地すべり；圧勝</div><div class="ex">Heavy rain caused a <b>landslide</b> near the mountain road.</div><div class="xj">大雨で、山道の近くで地すべりが起きた。</div></button></li><li><button class="w" data-no="1344"><div class="top"><span class="no">1344</span><span class="en">reflex</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">反射（作用）</div><div class="ex">Thanks to the goalkeeper&#x27;s quick <b>reflexes</b>, our team won the game.</div><div class="xj">ゴールキーパーのすばやい反射神経のおかげで、私たちのチームは試合に勝った。</div></button></li><li><button class="w" data-no="1345"><div class="top"><span class="no">1345</span><span class="en">supplement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">補足；栄養補助食品</div><div class="ex">Our teacher gave us a <b>supplement</b> to the textbook.</div><div class="xj">先生は教科書の補足資料をくれた。</div></button></li><li><button class="w" data-no="1346"><div class="top"><span class="no">1346</span><span class="en">dimension</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">側面；寸法</div><div class="ex">Learning a new language adds a new <b>dimension</b> to your life.</div><div class="xj">新しい言語を学ぶと、人生に新しい側面が加わる。</div></button></li><li><button class="w" data-no="1347"><div class="top"><span class="no">1347</span><span class="en">ratio</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">比率</div><div class="ex">The <b>ratio</b> of boys to girls in our class is one to one.</div><div class="xj">私たちのクラスの男子と女子の比率は1対1だ。</div></button></li><li><button class="w" data-no="1348"><div class="top"><span class="no">1348</span><span class="en">plague</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">疫病</div><div class="ex">Long ago, many towns had rules to stop a <b>plague</b> from spreading.</div><div class="xj">昔、多くの町には疫病が広がるのを防ぐための決まりがあった。</div></button></li><li><button class="w" data-no="1349"><div class="top"><span class="no">1349</span><span class="en">inventory</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">在庫（品）；目録</div><div class="ex">The store checks its <b>inventory</b> at the end of every month.</div><div class="xj">その店は毎月末に在庫を調べている。</div></button></li><li><button class="w" data-no="1350"><div class="top"><span class="no">1350</span><span class="en">expedition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">探検（隊）</div><div class="ex">They went on an <b>expedition</b> to the South Pole.</div><div class="xj">彼らは南極へ探検に出かけた。</div></button></li><li><button class="w" data-no="1351"><div class="top"><span class="no">1351</span><span class="en">observatory</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">天文台；観測所</div><div class="ex">Our class visited the <b>observatory</b> on the hill at night.</div><div class="xj">私たちのクラスは、夜に丘の上の天文台を訪れた。</div></button></li><li><button class="w" data-no="1352"><div class="top"><span class="no">1352</span><span class="en">interpreter</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">通訳者</div><div class="ex">Emi hopes to work as an <b>interpreter</b> at big sports events.</div><div class="xj">エミは、大きなスポーツ大会で通訳者として働きたいと思っている。</div></button></li><li><button class="w" data-no="1353"><div class="top"><span class="no">1353</span><span class="en">friction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">摩擦</div><div class="ex">Ice has very little <b>friction</b>, so it is easy to slip on.</div><div class="xj">氷はほとんど摩擦がないので、すべりやすい。</div></button></li><li><button class="w" data-no="1354"><div class="top"><span class="no">1354</span><span class="en">rhythm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">リズム</div><div class="ex">Clap your hands to the <b>rhythm</b> of the music.</div><div class="xj">音楽のリズムに合わせて手をたたきましょう。</div></button></li><li><button class="w" data-no="1355"><div class="top"><span class="no">1355</span><span class="en">forum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">討論会；フォーラム</div><div class="ex">Our town held a <b>forum</b> on how to reduce trash.</div><div class="xj">私たちの町は、ごみの減らし方について討論会を開いた。</div></button></li><li><button class="w" data-no="1356"><div class="top"><span class="no">1356</span><span class="en">dose</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（薬の）1回分の量</div><div class="ex">Take one <b>dose</b> of this medicine after each meal.</div><div class="xj">この薬は、毎食後に1回分の量を飲んでください。</div></button></li><li><button class="w" data-no="1357"><div class="top"><span class="no">1357</span><span class="en">heartbeat</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">心拍；鼓動</div><div class="ex">My <b>heartbeat</b> got faster as I waited for my turn to speak.</div><div class="xj">発表の順番を待っていると、心拍が速くなった。</div></button></li><li><button class="w" data-no="1358"><div class="top"><span class="no">1358</span><span class="en">rebel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">反逆者</div><div class="ex">In the story, a young <b>rebel</b> fights against an evil king.</div><div class="xj">その物語では、若い反逆者が悪い王と戦う。</div></button></li><li><button class="w" data-no="1359"><div class="top"><span class="no">1359</span><span class="en">copyright</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">著作権</div><div class="ex">You need permission to use music protected by <b>copyright</b>.</div><div class="xj">著作権で守られている音楽を使うには、許可が必要だ。</div></button></li><li><button class="w" data-no="1360"><div class="top"><span class="no">1360</span><span class="en">excursion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">遠足；小旅行</div><div class="ex">Our class went on an <b>excursion</b> to the zoo.</div><div class="xj">私たちのクラスは動物園へ遠足に行った。</div></button></li><li><button class="w" data-no="1361"><div class="top"><span class="no">1361</span><span class="en">beverage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">飲み物</div><div class="ex">Please don&#x27;t bring <b>beverages</b> into the computer room.</div><div class="xj">コンピューター室に飲み物を持ちこまないでください。</div></button></li><li><button class="w" data-no="1362"><div class="top"><span class="no">1362</span><span class="en">mutation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">突然変異</div><div class="ex">Scientists found a <b>mutation</b> that makes the plant grow faster.</div><div class="xj">科学者たちは、その植物の成長を速める突然変異を見つけた。</div></button></li><li><button class="w" data-no="1363"><div class="top"><span class="no">1363</span><span class="en">diplomacy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外交</div><div class="ex">Good <b>diplomacy</b> helps countries solve problems without fighting.</div><div class="xj">よい外交は、国々が争わずに問題を解決する助けになる。</div></button></li><li><button class="w" data-no="1364"><div class="top"><span class="no">1364</span><span class="en">bare</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">裸の；むき出しの</div><div class="ex">The children ran across the sand in <b>bare</b> feet.</div><div class="xj">子どもたちは裸足で砂浜をかけていった。</div></button></li><li><button class="w" data-no="1365"><div class="top"><span class="no">1365</span><span class="en">forgetful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">忘れっぽい</div><div class="ex">My grandfather is getting <b>forgetful</b>, so he writes everything down.</div><div class="xj">祖父は忘れっぽくなってきたので、何でも書きとめている。</div></button></li><li><button class="w" data-no="1366"><div class="top"><span class="no">1366</span><span class="en">overcrowded</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">混雑しすぎた</div><div class="ex">The train was so <b>overcrowded</b> that we couldn&#x27;t sit down.</div><div class="xj">電車が混雑しすぎていて、私たちは座れなかった。</div></button></li><li><button class="w" data-no="1367"><div class="top"><span class="no">1367</span><span class="en">periodic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">定期的な</div><div class="ex">Cars need <b>periodic</b> checks to stay safe.</div><div class="xj">車は安全のために定期的な点検が必要だ。</div></button></li><li><button class="w" data-no="1368"><div class="top"><span class="no">1368</span><span class="en">overdue</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">期限切れの；延滞した</div><div class="ex">This library book is two weeks <b>overdue</b>.</div><div class="xj">この図書館の本は、期限切れになって2週間たつ。</div></button></li><li><button class="w" data-no="1369"><div class="top"><span class="no">1369</span><span class="en">oral</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">口頭の；口の</div><div class="ex">We have an <b>oral</b> test in English class tomorrow.</div><div class="xj">明日、英語の授業で口頭試験がある。</div></button></li><li><button class="w" data-no="1370"><div class="top"><span class="no">1370</span><span class="en">accidental</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">偶然の</div><div class="ex">Our meeting at the station was completely <b>accidental</b>.</div><div class="xj">駅で私たちが会ったのは、まったくの偶然だった。</div></button></li><li><button class="w" data-no="1371"><div class="top"><span class="no">1371</span><span class="en">optical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">光学の；視覚の</div><div class="ex">This factory makes <b>optical</b> parts for cameras.</div><div class="xj">この工場では、カメラ用の光学部品を作っている。</div></button></li><li><button class="w" data-no="1372"><div class="top"><span class="no">1372</span><span class="en">literary</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">文学の</div><div class="ex">This <b>literary</b> magazine publishes short stories by students.</div><div class="xj">この文学雑誌には、学生の書いた短編小説がのっている。</div></button></li><li><button class="w" data-no="1373"><div class="top"><span class="no">1373</span><span class="en">impolite</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">無礼な</div><div class="ex">It is <b>impolite</b> to talk loudly on the train.</div><div class="xj">電車の中で大声で話すのは無礼なことだ。</div></button></li><li><button class="w" data-no="1374"><div class="top"><span class="no">1374</span><span class="en">prominent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">目立つ；著名な</div><div class="ex">The tall clock tower is the most <b>prominent</b> building in town.</div><div class="xj">その高い時計台は、町でいちばん目立つ建物だ。</div></button></li><li><button class="w" data-no="1375"><div class="top"><span class="no">1375</span><span class="en">rugged</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">でこぼこの；険しい</div><div class="ex">We walked along a <b>rugged</b> path in the mountains.</div><div class="xj">私たちは山のでこぼこの道を歩いた。</div></button></li><li><button class="w" data-no="1376"><div class="top"><span class="no">1376</span><span class="en">authentic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">本物の</div><div class="ex">This small restaurant serves <b>authentic</b> Italian food.</div><div class="xj">この小さなレストランでは、本物のイタリア料理が食べられる。</div></button></li><li><button class="w" data-no="1377"><div class="top"><span class="no">1377</span><span class="en">parallel</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">平行の</div><div class="ex">Draw two <b>parallel</b> lines on your paper.</div><div class="xj">紙に2本の平行な線を引きなさい。</div></button></li><li><button class="w" data-no="1378"><div class="top"><span class="no">1378</spa
