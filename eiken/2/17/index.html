</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第17回</h1><div class="sub">No.961〜1020</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="961"><div class="top"><span class="no">961</span><span class="en">prolong</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を延長する</div><div class="ex">They <b>prolonged</b> their stay in Kyoto by two days.</div><div class="xj">彼らは京都での滞在を2日延長した。</div></button></li><li><button class="w" data-no="962"><div class="top"><span class="no">962</span><span class="en">exploit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を利用する；搾取する</div><div class="ex">We should <b>exploit</b> the power of the sun more.</div><div class="xj">私たちは太陽の力をもっと利用するべきだ。</div></button></li><li><button class="w" data-no="963"><div class="top"><span class="no">963</span><span class="en">merge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">合併する；～を合併させる</div><div class="ex">The two small schools will <b>merge</b> next April.</div><div class="xj">その2つの小さな学校は、来年の4月に合併する。</div></button></li><li><button class="w" data-no="964"><div class="top"><span class="no">964</span><span class="en">refine</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を改良する；精製する</div><div class="ex">The team <b>refined</b> their robot after the first test.</div><div class="xj">チームは最初のテストのあと、ロボットを改良した。</div></button></li><li><button class="w" data-no="965"><div class="top"><span class="no">965</span><span class="en">blink</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">まばたきする</div><div class="ex">Tom <b>blinked</b> when the bright light hit his eyes.</div><div class="xj">まぶしい光が目に当たって、トムはまばたきした。</div></button></li><li><button class="w" data-no="966"><div class="top"><span class="no">966</span><span class="en">omit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を省略する</div><div class="ex">You can <b>omit</b> this part of the report if it is too long.</div><div class="xj">長すぎるなら、レポートのこの部分は省略してもよい。</div></button></li><li><button class="w" data-no="967"><div class="top"><span class="no">967</span><span class="en">descend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">下る</div><div class="ex">The climbers began to <b>descend</b> the mountain at noon.</div><div class="xj">登山者たちは正午に山を下り始めた。</div></button></li><li><button class="w" data-no="968"><div class="top"><span class="no">968</span><span class="en">grind</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をひく；すりつぶす</div><div class="ex">My father <b>grinds</b> coffee beans every morning.</div><div class="xj">父は毎朝、コーヒー豆をひく。</div></button></li><li><button class="w" data-no="969"><div class="top"><span class="no">969</span><span class="en">remedy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">治療（法）；解決策</div><div class="ex">Hot tea with honey is a good <b>remedy</b> for a sore throat.</div><div class="xj">はちみつ入りの温かいお茶は、のどの痛みのよい治療法だ。</div></button></li><li><button class="w" data-no="970"><div class="top"><span class="no">970</span><span class="en">resentment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">憤り</div><div class="ex">Emi felt <b>resentment</b> when her idea was ignored.</div><div class="xj">自分の考えが無視されて、エミは憤りを感じた。</div></button></li><li><button class="w" data-no="971"><div class="top"><span class="no">971</span><span class="en">curriculum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">教育課程；カリキュラム</div><div class="ex">Our school added programming to its <b>curriculum</b> this year.</div><div class="xj">今年、私たちの学校は教育課程にプログラミングを加えた。</div></button></li><li><button class="w" data-no="972"><div class="top"><span class="no">972</span><span class="en">trait</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">特性</div><div class="ex">Kindness is one of Tom&#x27;s best <b>traits</b>.</div><div class="xj">親切さは、トムのいちばんよい特性の1つだ。</div></button></li><li><button class="w" data-no="973"><div class="top"><span class="no">973</span><span class="en">adaptation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">適応；改作</div><div class="ex">Animals in the desert show amazing <b>adaptation</b> to the heat.</div><div class="xj">砂漠の動物は、暑さへのすばらしい適応を見せる。</div></button></li><li><button class="w" data-no="974"><div class="top"><span class="no">974</span><span class="en">contradiction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">矛盾</div><div class="ex">There is a <b>contradiction</b> between what Tom says and what he does.</div><div class="xj">トムの言うこととすることの間には矛盾がある。</div></button></li><li><button class="w" data-no="975"><div class="top"><span class="no">975</span><span class="en">diagnosis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">診断</div><div class="ex">The doctor&#x27;s <b>diagnosis</b> was just a simple cold.</div><div class="xj">医者の診断は、ただのかぜだった。</div></button></li><li><button class="w" data-no="976"><div class="top"><span class="no">976</span><span class="en">cuisine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">料理（法）</div><div class="ex">Lisa loves Italian <b>cuisine</b>, especially pasta with tomato sauce.</div><div class="xj">リサはイタリア料理、特にトマトソースのパスタが大好きだ。</div></button></li><li><button class="w" data-no="977"><div class="top"><span class="no">977</span><span class="en">repetition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">繰り返し</div><div class="ex"><b>Repetition</b> is important when you learn new words.</div><div class="xj">新しい単語を覚えるときは、繰り返しが大切だ。</div></button></li><li><button class="w" data-no="978"><div class="top"><span class="no">978</span><span class="en">jealousy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">嫉妬</div><div class="ex">Emi felt a little <b>jealousy</b> when her sister got a new phone.</div><div class="xj">妹が新しい携帯電話を手に入れたとき、エミは少し嫉妬を感じた。</div></button></li><li><button class="w" data-no="979"><div class="top"><span class="no">979</span><span class="en">provider</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">提供者；供給業者</div><div class="ex">Farmers are important <b>providers</b> of food for the city.</div><div class="xj">農家は、都市にとって大切な食料の提供者だ。</div></button></li><li><button class="w" data-no="980"><div class="top"><span class="no">980</span><span class="en">virtue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">美徳</div><div class="ex">Many people think that honesty is an important <b>virtue</b>.</div><div class="xj">多くの人は、正直さは大切な美徳だと考えている。</div></button></li><li><button class="w" data-no="981"><div class="top"><span class="no">981</span><span class="en">restoration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">修復；回復</div><div class="ex">The <b>restoration</b> of the old temple took five years.</div><div class="xj">その古いお寺の修復には5年かかった。</div></button></li><li><button class="w" data-no="982"><div class="top"><span class="no">982</span><span class="en">posture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">姿勢</div><div class="ex">Sitting with good <b>posture</b> helps prevent back pain.</div><div class="xj">よい姿勢で座ると、腰痛を防ぐのに役立つ。</div></button></li><li><button class="w" data-no="983"><div class="top"><span class="no">983</span><span class="en">congestion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混雑；渋滞</div><div class="ex">The new road will reduce <b>congestion</b> near the station.</div><div class="xj">新しい道路は、駅の近くの混雑を減らすだろう。</div></button></li><li><button class="w" data-no="984"><div class="top"><span class="no">984</span><span class="en">database</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">データベース</div><div class="ex">The library keeps all its book information in a <b>database</b>.</div><div class="xj">その図書館は、本の情報をすべてデータベースで管理している。</div></button></li><li><button class="w" data-no="985"><div class="top"><span class="no">985</span><span class="en">consultation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">相談；協議</div><div class="ex">You can have a free <b>consultation</b> with a teacher after school.</div><div class="xj">放課後、先生に無料で相談することができます。</div></button></li><li><button class="w" data-no="986"><div class="top"><span class="no">986</span><span class="en">intensity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">強さ；激しさ</div><div class="ex">The <b>intensity</b> of the rain increased in the afternoon.</div><div class="xj">午後になって、雨の強さが増した。</div></button></li><li><button class="w" data-no="987"><div class="top"><span class="no">987</span><span class="en">accomplishment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">業績；達成</div><div class="ex">Winning the contest was a great <b>accomplishment</b> for our band.</div><div class="xj">コンテストで優勝したことは、私たちのバンドにとって大きな業績だった。</div></button></li><li><button class="w" data-no="988"><div class="top"><span class="no">988</span><span class="en">generosity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">気前のよさ；寛大さ</div><div class="ex">The whole town thanked the old man for his <b>generosity</b>.</div><div class="xj">町じゅうの人が、その老人の気前のよさに感謝した。</div></button></li><li><button class="w" data-no="989"><div class="top"><span class="no">989</span><span class="en">mentor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">指導者；助言者</div><div class="ex">My first coach became my <b>mentor</b> for many years.</div><div class="xj">最初のコーチは、長年にわたって私の指導者となった。</div></button></li><li><button class="w" data-no="990"><div class="top"><span class="no">990</span><span class="en">prohibition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">禁止</div><div class="ex">There is a <b>prohibition</b> on smoking in this park.</div><div class="xj">この公園では、喫煙が禁止されている。</div></button></li><li><button class="w" data-no="991"><div class="top"><span class="no">991</span><span class="en">dedication</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">献身</div><div class="ex">The nurse was praised for her <b>dedication</b> to her patients.</div><div class="xj">その看護師は、患者への献身をたたえられた。</div></button></li><li><button class="w" data-no="992"><div class="top"><span class="no">992</span><span class="en">heap</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">山；積み重ね</div><div class="ex">There was a <b>heap</b> of dirty clothes on Ken&#x27;s bed.</div><div class="xj">ケンのベッドの上に、汚れた服の山があった。</div></button></li><li><button class="w" data-no="993"><div class="top"><span class="no">993</span><span class="en">ripple</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">さざ波；波紋</div><div class="ex">The stone made <b>ripples</b> on the surface of the pond.</div><div class="xj">石が池の水面にさざ波を立てた。</div></button></li><li><button class="w" data-no="994"><div class="top"><span class="no">994</span><span class="en">peak</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">頂上；ピーク</div><div class="ex">We reached the <b>peak</b> of the mountain before noon.</div><div class="xj">私たちは正午前に山の頂上に着いた。</div></button></li><li><button class="w" data-no="995"><div class="top"><span class="no">995</span><span class="en">remains</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">遺跡；残り物</div><div class="ex">We visited the <b>remains</b> of an old castle.</div><div class="xj">私たちは古い城の遺跡を訪れた。</div></button></li><li><button class="w" data-no="996"><div class="top"><span class="no">996</span><span class="en">reception</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">受付；歓迎会</div><div class="ex">Please ask at <b>reception</b> if you need a map of the hotel.</div><div class="xj">ホテルの地図が必要なら、受付でたずねてください。</div></button></li><li><button class="w" data-no="997"><div class="top"><span class="no">997</span><span class="en">cattle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">牛（集合的に）</div><div class="ex">The farmer keeps about fifty <b>cattle</b> on his land.</div><div class="xj">その農場主は、自分の土地で約50頭の牛を飼っている。</div></button></li><li><button class="w" data-no="998"><div class="top"><span class="no">998</span><span class="en">treaty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">条約</div><div class="ex">The two countries signed a <b>treaty</b> to protect the ocean.</div><div class="xj">両国は、海を守るための条約に署名した。</div></button></li><li><button class="w" data-no="999"><div class="top"><span class="no">999</span><span class="en">multicultural</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">多文化の</div><div class="ex">Ken goes to a <b>multicultural</b> school with students from ten countries.</div><div class="xj">ケンは、10か国から来た生徒がいる多文化の学校に通っている。</div></button></li><li><button class="w" data-no="1000"><div class="top"><span class="no">1000</span><span class="en">confidential</span><span class="ps">形</span><sp
