lass="xj">暗い空に星が明るく光っていた。</div></button></li><li><button class="w" data-no="1205"><div class="top"><span class="no">1205</span><span class="en">rebuild</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を再建する</div><div class="ex">The town <b>rebuilt</b> its old library after the big storm.</div><div class="xj">町は大きな嵐のあと、古い図書館を再建した。</div></button></li><li><button class="w" data-no="1206"><div class="top"><span class="no">1206</span><span class="en">blend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を混ぜ合わせる</div><div class="ex">My mother <b>blended</b> milk and bananas to make a drink.</div><div class="xj">母は牛乳とバナナを混ぜ合わせて飲み物を作った。</div></button></li><li><button class="w" data-no="1207"><div class="top"><span class="no">1207</span><span class="en">insert</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を差し込む</div><div class="ex">Please <b>insert</b> your card into the machine.</div><div class="xj">機械にカードを差し込んでください。</div></button></li><li><button class="w" data-no="1208"><div class="top"><span class="no">1208</span><span class="en">enroll</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">入学する；登録する</div><div class="ex">My brother <b>enrolled</b> at a college near our city last spring.</div><div class="xj">兄は去年の春、市の近くの大学に入学した。</div></button></li><li><button class="w" data-no="1209"><div class="top"><span class="no">1209</span><span class="en">entitle</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に権利を与える</div><div class="ex">This ticket <b>entitles</b> you to a free drink.</div><div class="xj">このチケットがあれば、飲み物を1杯無料でもらう権利が与えられる。</div></button></li><li><button class="w" data-no="1210"><div class="top"><span class="no">1210</span><span class="en">groan</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">うめく</div><div class="ex">Tom <b>groaned</b> when the teacher gave us more homework.</div><div class="xj">先生がさらに宿題を出すと、トムはうめいた。</div></button></li><li><button class="w" data-no="1211"><div class="top"><span class="no">1211</span><span class="en">fetch</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取ってくる</div><div class="ex">Could you <b>fetch</b> my glasses from the bedroom?</div><div class="xj">寝室から私のめがねを取ってきてくれる？</div></button></li><li><button class="w" data-no="1212"><div class="top"><span class="no">1212</span><span class="en">revolve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">回転する</div><div class="ex">The restaurant on the top floor of the tower slowly <b>revolves</b>.</div><div class="xj">タワーの最上階のレストランは、ゆっくり回転する。</div></button></li><li><button class="w" data-no="1213"><div class="top"><span class="no">1213</span><span class="en">characterize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を特徴づける</div><div class="ex">Bright colors and simple shapes <b>characterize</b> Lisa&#x27;s paintings.</div><div class="xj">明るい色と単純な形が、リサの絵を特徴づけている。</div></button></li><li><button class="w" data-no="1214"><div class="top"><span class="no">1214</span><span class="en">reside</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">住む</div><div class="ex">My uncle now <b>resides</b> in Canada with his family.</div><div class="xj">おじは現在、家族とカナダに住んでいる。</div></button></li><li><button class="w" data-no="1215"><div class="top"><span class="no">1215</span><span class="en">hatch</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（卵が）かえる</div><div class="ex">Five baby birds <b>hatched</b> from the eggs this morning.</div><div class="xj">今朝、卵から5羽のひながかえった。</div></button></li><li><button class="w" data-no="1216"><div class="top"><span class="no">1216</span><span class="en">mainland</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">本土</div><div class="ex">We took a ferry from the island to the <b>mainland</b>.</div><div class="xj">私たちは島から本土までフェリーに乗った。</div></button></li><li><button class="w" data-no="1217"><div class="top"><span class="no">1217</span><span class="en">ritual</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">儀式</div><div class="ex">In this village, people hold a special <b>ritual</b> before planting rice.</div><div class="xj">この村では、田植えの前に特別な儀式を行う。</div></button></li><li><button class="w" data-no="1218"><div class="top"><span class="no">1218</span><span class="en">landfill</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ごみ埋め立て地</div><div class="ex">Most of the city&#x27;s trash is taken to a <b>landfill</b>.</div><div class="xj">市のごみの大半はごみ埋め立て地に運ばれる。</div></button></li><li><button class="w" data-no="1219"><div class="top"><span class="no">1219</span><span class="en">hurricane</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ハリケーン</div><div class="ex">The <b>hurricane</b> brought strong winds and heavy rain to the coast.</div><div class="xj">そのハリケーンは、海岸に強い風と大雨をもたらした。</div></button></li><li><button class="w" data-no="1220"><div class="top"><span class="no">1220</span><span class="en">economist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">経済学者</div><div class="ex">The <b>economist</b> explained why prices are going up.</div><div class="xj">その経済学者は、物価が上がっている理由を説明した。</div></button></li><li><button class="w" data-no="1221"><div class="top"><span class="no">1221</span><span class="en">joint</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">関節；継ぎ目</div><div class="ex">My knee <b>joints</b> hurt after the long hike.</div><div class="xj">長いハイキングのあと、ひざの関節が痛んだ。</div></button></li><li><button class="w" data-no="1222"><div class="top"><span class="no">1222</span><span class="en">refreshment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（refreshments で）軽い飲食物</div><div class="ex">We will serve <b>refreshments</b> after the school concert.</div><div class="xj">学校のコンサートのあとに軽い飲食物をお出しします。</div></button></li><li><button class="w" data-no="1223"><div class="top"><span class="no">1223</span><span class="en">slavery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">奴隷制度</div><div class="ex">Many people in history worked hard to end <b>slavery</b>.</div><div class="xj">歴史上、多くの人々が奴隷制度をなくすために努力した。</div></button></li><li><button class="w" data-no="1224"><div class="top"><span class="no">1224</span><span class="en">devotion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">献身；愛情</div><div class="ex">The nurse was thanked for her <b>devotion</b> to her patients.</div><div class="xj">その看護師は、患者への献身に感謝された。</div></button></li><li><button class="w" data-no="1225"><div class="top"><span class="no">1225</span><span class="en">index</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">索引；指数</div><div class="ex">Look up the word in the <b>index</b> at the back of the book.</div><div class="xj">本の後ろにある索引でその語を調べなさい。</div></button></li><li><button class="w" data-no="1226"><div class="top"><span class="no">1226</span><span class="en">earthquake</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地震</div><div class="ex">Our school has an <b>earthquake</b> drill twice a year.</div><div class="xj">私たちの学校では、年に2回地震の避難訓練がある。</div></button></li><li><button class="w" data-no="1227"><div class="top"><span class="no">1227</span><span class="en">premium</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">割増金；保険料</div><div class="ex">You have to pay a <b>premium</b> for seats near the stage.</div><div class="xj">ステージに近い席は、割増金を払わなければならない。</div></button></li><li><button class="w" data-no="1228"><div class="top"><span class="no">1228</span><span class="en">peer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">同僚；同年代の人</div><div class="ex">Lisa&#x27;s <b>peers</b> at the office often ask her for advice.</div><div class="xj">リサの職場の同僚は、よく彼女に助言を求める。</div></button></li><li><button class="w" data-no="1229"><div class="top"><span class="no">1229</span><span class="en">finale</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">フィナーレ；最終場面</div><div class="ex">Everyone stood up and sang together at the <b>finale</b> of the show.</div><div class="xj">ショーのフィナーレでは、みんなが立ち上がっていっしょに歌った。</div></button></li><li><button class="w" data-no="1230"><div class="top"><span class="no">1230</span><span class="en">outskirts</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">郊外；町はずれ</div><div class="ex">My grandparents live on the <b>outskirts</b> of the city.</div><div class="xj">祖父母は市の郊外に住んでいる。</div></button></li><li><button class="w" data-no="1231"><div class="top"><span class="no">1231</span><span class="en">grave</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">墓</div><div class="ex">We visit my grandfather&#x27;s <b>grave</b> every summer.</div><div class="xj">私たちは毎年夏に、祖父の墓参りをする。</div></button></li><li><button class="w" data-no="1232"><div class="top"><span class="no">1232</span><span class="en">wilderness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">荒野</div><div class="ex">They spent a week camping in the <b>wilderness</b>.</div><div class="xj">彼らは荒野で1週間キャンプをした。</div></button></li><li><button class="w" data-no="1233"><div class="top"><span class="no">1233</span><span class="en">colony</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">植民地；（生物の）集団</div><div class="ex">Long ago, this island was a <b>colony</b> of a European country.</div><div class="xj">昔、この島はヨーロッパのある国の植民地だった。</div></button></li><li><button class="w" data-no="1234"><div class="top"><span class="no">1234</span><span class="en">coastline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">海岸線</div><div class="ex">We drove along the beautiful <b>coastline</b> for two hours.</div><div class="xj">私たちは美しい海岸線に沿って2時間ドライブした。</div></button></li><li><button class="w" data-no="1235"><div class="top"><span class="no">1235</span><span class="en">monopoly</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">独占</div><div class="ex">One company has a <b>monopoly</b> on bus service in this town.</div><div class="xj">この町では、1つの会社がバス事業を独占している。</div></button></li><li><button class="w" data-no="1236"><div class="top"><span class="no">1236</span><span class="en">livestock</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">家畜</div><div class="ex">Farmers in this area raise <b>livestock</b> such as cows and pigs.</div><div class="xj">この地域の農家は、牛や豚などの家畜を育てている。</div></button></li><li><button class="w" data-no="1237"><div class="top"><span class="no">1237</span><span class="en">erosion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">侵食</div><div class="ex">The roots of trees help stop soil <b>erosion</b> on hills.</div><div class="xj">木の根は、丘の土の侵食を防ぐのに役立つ。</div></button></li><li><button class="w" data-no="1238"><div class="top"><span class="no">1238</span><span class="en">icon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">アイコン；象徴</div><div class="ex">Touch the camera <b>icon</b> on the screen to take a photo.</div><div class="xj">写真をとるには、画面のカメラのアイコンに触れてください。</div></button></li><li><button class="w" data-no="1239"><div class="top"><span class="no">1239</span><span class="en">alien</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外国人；宇宙人</div><div class="ex">In the movie, a boy becomes friends with an <b>alien</b> from another planet.</div><div class="xj">その映画では、男の子がほかの星から来た宇宙人と友だちになる。</div></button></li><li><button class="w" data-no="1240"><div class="top"><span class="no">1240</span><
