/div><div class="ja">～という条件で、もし～なら</div><div class="ex">You can borrow my bike, provided that you return it by six.</div><div class="xj">6時までに返すなら、私の自転車を借りてもいいよ。</div></button></li><li><button class="w" data-no="熟6"><div class="top"><span class="no">熟6</span><span class="en">on condition that ～</span></div><div class="ja">～という条件で</div><div class="ex">My parents will let me go to the concert on condition that I come home by ten.</div><div class="xj">両親は、10時までに帰るという条件でコンサートに行かせてくれる。</div></button></li><li><button class="w" data-no="熟7"><div class="top"><span class="no">熟7</span><span class="en">not only A but (also) B</span></div><div class="ja">AだけでなくBも</div><div class="ex">The new museum is popular not only with children but also with adults.</div><div class="xj">その新しい博物館は子どもだけでなく大人にも人気がある。</div></button></li><li><button class="w" data-no="熟8"><div class="top"><span class="no">熟8</span><span class="en">as if ～</span></div><div class="ja">まるで～のように</div><div class="ex">He talked about the city as if he had lived there for years.</div><div class="xj">彼はまるで何年もそこに住んでいたかのように、その町について話した。</div></button></li><li><button class="w" data-no="熟9"><div class="top"><span class="no">熟9</span><span class="en">every time ～</span></div><div class="ja">～するたびに</div><div class="ex">Every time I visit my grandmother, she makes me a cake.</div><div class="xj">祖母を訪ねるたびに、祖母はケーキを作ってくれる。</div></button></li><li><button class="w" data-no="熟10"><div class="top"><span class="no">熟10</span><span class="en">whether A or B</span></div><div class="ja">AであろうとBであろうと</div><div class="ex">Whether you win or lose, you should do your best.</div><div class="xj">勝っても負けても、全力を尽くすべきだ。</div></button></li><li><button class="w" data-no="会1"><div class="top"><span class="no">会1</span><span class="en">How&#x27;s everything going?</span></div><div class="ja">調子はどう？（近況をたずねる）</div><div class="ex">A: Hi, Mr. Clark. It&#x27;s Yuka.<br>B: Hi, Yuka! How&#x27;s everything going at your new school?</div></button></li><li><button class="w" data-no="会2"><div class="top"><span class="no">会2</span><span class="en">What have you been up to?</span></div><div class="ja">最近どうしてたの？</div><div class="ex">A: Hi, Emma! What have you been up to?<br>B: I&#x27;ve been busy preparing for the exam.</div></button></li><li><button class="w" data-no="会3"><div class="top"><span class="no">会3</span><span class="en">Long time no see.</span></div><div class="ja">久しぶり。</div><div class="ex">A: Long time no see, Kenji!<br>B: Hi, Lisa! It&#x27;s been almost two years.</div></button></li><li><button class="w" data-no="会4"><div class="top"><span class="no">会4</span><span class="en">Congratulations on ～!</span></div><div class="ja">～おめでとう！</div><div class="ex">A: I got into Midori University!<br>B: Wow! Congratulations on your success!</div></button></li><li><button class="w" data-no="会5"><div class="top"><span class="no">会5</span><span class="en">Say hello to ～ for me.</span></div><div class="ja">～によろしく伝えてね。</div><div class="ex">A: I&#x27;m visiting my grandparents this weekend.<br>B: Have fun. Say hello to them for me.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../24/">← 第24回</a><a href="../j02/">熟語 Set 2 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟1": 4.91, "熟2": 18.78, "熟3": 33.65, "熟4": 48.36, "熟5": 62.95, "熟6": 79.89, "熟7": 95.29, "熟8": 113.24, "熟9": 127.49, "熟10": 141.74, "会1": 156.72, "会2": 178.33, "会3": 196.11, "会4": 214.44, "会5": 233.15}, "TE": {"熟1": 6.78, "熟2": 20.84, "熟3": 35.52, "熟4": 50.23, "熟5": 65.16, "熟6": 81.9, "熟7": 98.68, "熟8": 115.11, "熟9": 129.36, "熟10": 144.0, "会1": 158.78, "会2": 180.2, "会3": 198.36, "会4": 216.76, "会5": 235.45}, "Q": [["熟1", "ever since ～", "～以来ずっと"], ["熟2", "as far as I know", "私の知る限り"], ["熟3", "now that ～", "今や～なので"], ["熟4", "the moment ～", "～するとすぐに"], ["熟5", "provided (that) ～", "～という条件で、もし～なら"], ["熟6", "on condition that ～"
