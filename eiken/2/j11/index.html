lass="ja">～を提出する</div><div class="ex">Please turn in your essays by Friday.</div><div class="xj">金曜日までに作文を提出してください。</div></button></li><li><button class="w" data-no="熟106"><div class="top"><span class="no">熟106</span><span class="en">do without ～</span></div><div class="ja">～なしで済ませる</div><div class="ex">Many people today cannot do without their smartphones.</div><div class="xj">今日、多くの人はスマートフォンなしでは済ませられない。</div></button></li><li><button class="w" data-no="熟107"><div class="top"><span class="no">熟107</span><span class="en">drop in (on ～)</span></div><div class="ja">（人を）ふらりと訪ねる</div><div class="ex">My uncle sometimes drops in on us on Sunday afternoons.</div><div class="xj">おじは時々日曜日の午後にふらりと私たちを訪ねてくる。</div></button></li><li><button class="w" data-no="熟108"><div class="top"><span class="no">熟108</span><span class="en">long for ～</span></div><div class="ja">～を待ち望む</div><div class="ex">After the long winter, people longed for spring.</div><div class="xj">長い冬のあと、人々は春を待ち望んだ。</div></button></li><li><button class="w" data-no="熟109"><div class="top"><span class="no">熟109</span><span class="en">get off ～</span></div><div class="ja">（乗り物）を降りる</div><div class="ex">Get off the bus at the third stop.</div><div class="xj">3つ目のバス停でバスを降りてね。</div></button></li><li><button class="w" data-no="熟110"><div class="top"><span class="no">熟110</span><span class="en">fall back on ～</span></div><div class="ja">（いざというとき）～に頼る</div><div class="ex">It&#x27;s good to have some savings to fall back on.</div><div class="xj">いざというときに頼れる貯金があるのはよいことだ。</div></button></li><li><button class="w" data-no="会51"><div class="top"><span class="no">会51</span><span class="en">That&#x27;s true.</span></div><div class="ja">たしかにそうだね。</div><div class="ex">A: This restaurant is a little expensive.<br>B: That&#x27;s true, but the food is great.</div></button></li><li><button class="w" data-no="会52"><div class="top"><span class="no">会52</span><span class="en">I know the feeling.</span></div><div class="ja">その気持ち、わかるよ。</div><div class="ex">A: I always get nervous before a speech.<br>B: I know the feeling. I do, too.</div></button></li><li><button class="w" data-no="会53"><div class="top"><span class="no">会53</span><span class="en">Tell me about it.</span></div><div class="ja">まったくだよ。（強い同意）</div><div class="ex">A: Today&#x27;s homework is so difficult!<br>B: Tell me about it. I&#x27;ve been working on it for two hours.</div></button></li><li><button class="w" data-no="会54"><div class="top"><span class="no">会54</span><span class="en">You can say that again.</span></div><div class="ja">まったくそのとおり。</div><div class="ex">A: It&#x27;s really hot today.<br>B: You can say that again.</div></button></li><li><button class="w" data-no="会55"><div class="top"><span class="no">会55</span><span class="en">Great idea!</span></div><div class="ja">いい考えだね！</div><div class="ex">A: Why don&#x27;t we have a picnic in the park?<br>B: Great idea! I&#x27;ll make sandwiches.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j10/">← 熟語 Set 10</a><a href="../j12/">熟語 Set 12 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟101": 5.29, "熟102": 18.99, "熟103": 32.67, "熟104": 47.95, "熟105": 62.23, "熟106": 75.54, "熟107": 89.92, "熟108": 104.94, "熟109": 118.9, "熟110": 131.57, "会51": 146.11, "会52": 162.49, "会53": 180.99, "会54": 200.61, "会55": 216.49}, "TE": {"熟101": 7.16, "熟102": 20.86, "熟103": 34.54, "熟104": 49.82, "熟105": 64.1, "熟106": 77.42, "熟107": 92.03, "熟108": 106.81, "熟109": 120.77, "熟110": 133.58, "会51": 147.98, "会52": 164.51, "会53": 182.86, "会54": 202.82, "会55": 218.36}, "Q": [["熟101", "take over ～", "～を引き継ぐ"], ["熟102", "set aside ～", "～を取っておく"], ["熟103", "shut off ～", "を止める"], ["熟104", "bring out ～", "を発売する"], ["熟105", "turn in ～", "～を提出する"], ["熟106", "do without ～", "～なしで済ませる"], ["熟107", "drop in (on ～)", "ふらりと訪ねる"], ["熟108", "long for ～", "～を待ち望む"], ["熟109", "get off ～", "
