</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検2級　第7回</h1><div class="sub">No.361〜420</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">assume</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～だと思い込む；仮定する</div><div class="ex">I <b>assumed</b> the store was open, but it was closed.</div><div class="xj">私は店が開いていると思い込んでいたが、閉まっていた。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">conclude</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～と結論づける</div><div class="ex">After the experiment, Lisa <b>concluded</b> that plants need light.</div><div class="xj">実験の後、リサは植物には光が必要だと結論づけた。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">evaluate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を評価する</div><div class="ex">Teachers <b>evaluate</b> students&#x27; work at the end of each term.</div><div class="xj">先生は各学期の終わりに、生徒の作品を評価する。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">pursue</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を追い求める</div><div class="ex">Emi left her hometown to <b>pursue</b> her dream of acting.</div><div class="xj">エミは俳優になる夢を追い求めるために、故郷を離れた。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">acquire</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を習得する；手に入れる</div><div class="ex">Lisa <b>acquired</b> good cooking skills while living abroad.</div><div class="xj">リサは海外で暮らしている間に、すぐれた料理の腕を習得した。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">withdraw</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（お金）を引き出す；撤退する</div><div class="ex">I <b>withdrew</b> some money from the bank yesterday.</div><div class="xj">私は昨日、銀行からお金を引き出した。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">weaken</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を弱める</div><div class="ex">Lack of sleep can <b>weaken</b> your body.</div><div class="xj">睡眠不足は、体を弱めることがある。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">eliminate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り除く</div><div class="ex">We should <b>eliminate</b> plastic bags from our daily life.</div><div class="xj">私たちは、日常生活からレジ袋を取り除くべきだ。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">circumstance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（circumstances で）状況；事情</div><div class="ex">Under these <b>circumstances</b>, we have to stop the game.</div><div class="xj">こうした状況では、試合を中止しなければならない。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">tension</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">緊張</div><div class="ex">Ken felt a lot of <b>tension</b> before the speech contest.</div><div class="xj">ケンはスピーチコンテストの前に、強い緊張を感じた。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">context</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">文脈；背景</div><div class="ex">You can guess the meaning of a word from the <b>context</b>.</div><div class="xj">単語の意味は文脈から推測できる。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">crisis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">危機</div><div class="ex">The town faced a water <b>crisis</b> last summer.</div><div class="xj">その町は昨年の夏、水不足の危機に直面した。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">status</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地位；状況</div><div class="ex">Doctors have a high social <b>status</b> in many countries.</div><div class="xj">多くの国で、医者は社会的地位が高い。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">identity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">身元；独自性</div><div class="ex">Please show your student card to prove your <b>identity</b>.</div><div class="xj">身元を証明するために、学生証を見せてください。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">ambition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">野心；大望</div><div class="ex">Tom has a great <b>ambition</b> to open his own restaurant.</div><div class="xj">トムには、自分のレストランを開くという大きな野心がある。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">analysis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">分析</div><div class="ex">The <b>analysis</b> of the data took two weeks.</div><div class="xj">データの分析に2週間かかった。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">arrangement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手配；配置</div><div class="ex">My mother made all the <b>arrangements</b> for our trip.</div><div class="xj">母が私たちの旅行の手配をすべてしてくれた。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">battle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">戦い</div><div class="ex">The final match was an exciting <b>battle</b> between two strong teams.</div><div class="xj">決勝戦は、強い2チームによる白熱した戦いだった。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">awareness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">意識；認識</div><div class="ex">This event helped increase people&#x27;s <b>awareness</b> of recycling.</div><div class="xj">このイベントは、リサイクルに対する人々の意識を高めるのに役立った。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">candidate</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">候補者</div><div class="ex">Three <b>candidates</b> are running for student council president.</div><div class="xj">3人の候補者が生徒会長に立候補している。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">capacity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">収容能力；容量</div><div class="ex">This hall has a <b>capacity</b> of 500 people.</div><div class="xj">このホールは500人の収容能力がある。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">commitment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">約束；献身</div><div class="ex">Ken made a <b>commitment</b> to practice every day.</div><div class="xj">ケンは毎日練習するという約束をした。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">companion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">仲間；連れ</div><div class="ex">My dog is my best <b>companion</b> on long walks.</div><div class="xj">長い散歩では、犬が私の一番の仲間だ。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">component</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部品；構成要素</div><div class="ex">The factory makes small <b>components</b> for computers.</div><div class="xj">その工場は、コンピューターの小さな部品を作っている。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">compromise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">妥協</div><div class="ex">After a long talk, they finally reached a <b>compromise</b>.</div><div class="xj">長い話し合いの後、彼らはついに妥協点に達した。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">confusion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混乱</div><div class="ex">The new bus schedule caused a lot of <b>confusion</b>.</div><div class="xj">新しいバスの時刻表は、大きな混乱を引き起こした。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">conservation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">保護；保存</div><div class="ex">The group works on the <b>conservation</b> of wild birds.</div><div class="xj">そのグループは、野鳥の保護に取り組んでいる。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">definition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">定義</div><div class="ex">Look up the <b>definition</b> of this word in the dictionary.</div><div class="xj">辞書でこの単語の定義を調べなさい。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">destruction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">破壊</div><div class="ex">The <b>destruction</b> of forests is a serious problem.</div><div class="xj">森林の破壊は深刻な問題だ。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">district</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地区</div><div class="ex">This <b>district</b> is famous for its old temples.</div><div class="xj">この地区は古い寺で有名だ。</div></button></li><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">corporation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">企業；法人</div><div class="ex">My aunt works for a large <b>corporation</b> in Tokyo.</div><div class="xj">おばは東京の大きな企業で働いている。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">drought</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">干ばつ</div><div class="ex">Because of the <b>drought</b>, farmers could not grow enough rice.</div><div class="xj">干ばつのため、農家は十分な米を育てられなかった。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">currency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">通貨</div><div class="ex">The yen is the <b>currency</b> of Japan.</div><div class="xj">円は日本の通貨だ。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">ecosystem</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生態系</div><div class="ex">Every animal plays a role in the <b>ecosystem</b>.</div><div class="xj">すべての動物が、生態系の中で役割を果たしている。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">emission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">排出（物）</div><div class="ex">Electric cars produce no <b>emissions</b> while running.</div><div class="xj">電気自動車は、走っている間に排出物を出さない。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">equality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">平等</div><div class="ex">Lisa believes in the <b>equality</b> of all people.</div><div class="xj">リサは、すべての人の平等を信じている。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">evolution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">進化</div><div class="ex">Scientists study the <b>evolution</b> of birds from dinosaurs.</div><div class="xj">科学者たちは、恐竜から鳥への進化を研究している。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">existence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">存在</div><div class="ex">Do you believe in the <b>existence</b> of aliens?</div><div class="xj">あなたは宇宙人の存在を信じますか。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">expansion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">拡大</div><div class="ex">The <b>expansion</b> of the airport will bring more tourists.</div><div class="xj">空港の拡大で、より多くの観光客が来るだろう。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">rapid</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">速い；急速な</div><div class="ex">The town has seen <b>rapid</b> growth in recent years.</div><div class="
