n><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">賛成する；同意する</div><div class="ex">I <b>agree</b> with your idea.</div><div class="xj">私はあなたの考えに賛成します。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">bake</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（パンなど）を焼く</div><div class="ex">My mother <b>baked</b> bread this morning.</div><div class="xj">母は今朝、パンを焼いた。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">throw</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を投げる</div><div class="ex">Tom <b>threw</b> the ball to his dog.</div><div class="xj">トムは犬にボールを投げた。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">cut</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を切る</div><div class="ex">Please <b>cut</b> the cake into eight pieces.</div><div class="xj">ケーキを8つに切ってください。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">touch</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～にさわる</div><div class="ex">Please don&#x27;t <b>touch</b> the pictures in this room.</div><div class="xj">この部屋の絵にさわらないでください。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">wrap</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を包む</div><div class="ex">I <b>wrapped</b> the present in pretty paper.</div><div class="xj">私はプレゼントをきれいな紙で包んだ。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">mistake</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">まちがい</div><div class="ex">I made a <b>mistake</b> on the math test.</div><div class="xj">私は数学のテストでまちがいをした。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">pleasure</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">喜び；楽しみ</div><div class="ex">Reading books is a great <b>pleasure</b> for me.</div><div class="xj">本を読むことは、私にとって大きな喜びだ。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">century</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">世紀</div><div class="ex">This temple was built in the eighth <b>century</b>.</div><div class="xj">この寺は8世紀に建てられた。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">surprise</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">驚き；思いがけないこと</div><div class="ex">The party was a big <b>surprise</b> for Emi.</div><div class="xj">そのパーティーは、エミにとって大きな驚きだった。</div></button></li><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">promise</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">約束</div><div class="ex">Ken always keeps his <b>promise</b>.</div><div class="xj">ケンはいつも約束を守る。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">mirror</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">鏡</div><div class="ex">Emi looked at herself in the <b>mirror</b>.</div><div class="xj">エミは鏡で自分の姿を見た。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">culture</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">文化</div><div class="ex">Lisa is interested in Japanese <b>culture</b>.</div><div class="xj">リサは日本の文化に興味がある。</div></button></li><li><button class="w" data-no="64"><div class="t
