n class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">protect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を守る；～を保護する</div><div class="ex">We must <b>protect</b> the animals in the forest.</div><div class="xj">私たちは森の動物たちを守らなければならない。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">salesclerk</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">店員</div><div class="ex">The <b>salesclerk</b> showed me some T-shirts.</div><div class="xj">店員が私にTシャツを何枚か見せてくれた。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">marathon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">マラソン</div><div class="ex">My uncle ran a <b>marathon</b> last year.</div><div class="xj">おじは去年、マラソンを走った。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">journalist</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">記者；ジャーナリスト</div><div class="ex">My aunt works as a <b>journalist</b> for a newspaper.</div><div class="xj">おばは新聞社で記者として働いている。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">costume</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">衣装</div><div class="ex">Ken wore a funny <b>costume</b> at the party.</div><div class="xj">ケンはパーティーでおもしろい衣装を着た。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">captain</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">キャプテン；船長</div><div class="ex">Lisa is the <b>captain</b> of our volleyball team.</div><div class="xj">リサは私たちのバレーボールチームのキャプテンだ。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">tournament</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">トーナメント；大会</div><div class="ex">Our team won the city <b>tournament</b>.</div><div class="xj">私たちのチームは市の大会で優勝した。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">machine</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">機械</div><div class="ex">This <b>machine</b> makes ice cream.</div><div class="xj">この機械はアイスクリームを作る。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">stamp</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">切手</div><div class="ex">I need a <b>stamp</b> for this letter.</div><div class="xj">この手紙には切手が必要だ。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">army</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">軍隊</div><div class="ex">The <b>army</b> helped people after the big storm.</div><div class="xj">大きな嵐のあと、軍隊が人々を助けた。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">stomach</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">胃；おなか</div><div class="ex">My <b>stomach</b> feels full after the big lunch.</div><div class="xj">たっぷりの昼食のあとで、おなかがいっぱいだ。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">market</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">市場</div><div class="ex">We buy fish at the <b>market</b> near the sea.</div><div class="xj">私たちは海の近くの市場で魚を買う。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">classmate</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">クラスメート；同級生</div><div class="ex">Emi is my <b>classmate</b> and best friend.</div><div class="xj">エミは私のクラスメートで親友だ。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">stomachache</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">腹痛</div><div class="ex">Ken had a <b>stomachache</b>, so he stayed home.</div><div class="xj">ケンは腹痛がしたので、家で休んだ。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">community</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地域社会</div><div class="ex">People in our <b>community</b> clean the park every month.</div><div class="xj">私たちの地域社会の人々は、毎月公園を掃除している。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">snack</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">軽食；おやつ</div><div class="ex">I eat a <b>snack</b> after school.</div><div class="xj">私は放課後におやつを食べる。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">athlete</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">運動選手</div><div class="ex">Tom&#x27;s father was a famous <b>athlete</b>.</div><div class="xj">トムの父親は有名な運動選手だった。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">tour</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ツアー；見学</div><div class="ex">We joined a bus <b>tour</b> of the city.</div><div class="xj">私たちは市内のバスツアーに参加した。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">point</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">点；要点</div><div class="ex">Our team got ten <b>points</b> in the game.</div><div class="xj">私たちのチームは試合で10点を取った。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">space</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">宇宙；空間</div><div class="ex">I want to travel to <b>space</b> someday.</div><div class="xj">私はいつか宇宙へ旅行したい。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">success</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">成功</div><div class="ex">The school festival was a big <b>success</b>.</div><div class="xj">文化祭は大成功だった。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">exam</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">試験</div><div class="ex">I have to study for the math <b>exam</b>.</div><div class="xj">私は数学の試験のために勉強しなければならない。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">activity</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">活動</div><div class="ex">Our club does many <b>activities</b> in summer.</div><div class="xj">私たちの部は、夏にたくさんの活動をする。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">technology</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">科学技術</div><div class="ex"><b>Technology</b> makes our lives easier.</div><div class="xj">科学技術は私たちの生活をより便利にする。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">experience</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">経験</div><div class="ex">Working at the farm was a good <b>experience</b>.</div><div class="xj">農場で働いたことは、よい経験だった。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class=
