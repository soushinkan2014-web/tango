ton class="w" data-no="熟46"><div class="top"><span class="no">熟46</span><span class="en">be different from ～</span></div><div class="ja">～と異なる</div><div class="ex">My idea is different from yours.</div><div class="xj">私の考えはあなたのとは違う。</div></button></li><li><button class="w" data-no="熟47"><div class="top"><span class="no">熟47</span><span class="en">be late for ～</span></div><div class="ja">～に遅れる</div><div class="ex">Don&#x27;t be late for school.</div><div class="xj">学校に遅れないようにね。</div></button></li><li><button class="w" data-no="熟48"><div class="top"><span class="no">熟48</span><span class="en">be ready for ～</span></div><div class="ja">～の準備ができている</div><div class="ex">Are you ready for the test?</div><div class="xj">テストの準備はできている？</div></button></li><li><button class="w" data-no="熟49"><div class="top"><span class="no">熟49</span><span class="en">be surprised at ～</span></div><div class="ja">～に驚く</div><div class="ex">I was surprised at the news.</div><div class="xj">私はその知らせに驚いた。</div></button></li><li><button class="w" data-no="熟50"><div class="top"><span class="no">熟50</span><span class="en">get to ～</span></div><div class="ja">～に着く</div><div class="ex">How can I get to the station?</div><div class="xj">駅へはどうやって行けばいいですか。</div></button></li><li><button class="w" data-no="会21"><div class="top"><span class="no">会21</span><span class="en">Can I try it on?</span></div><div class="ja">試着してもいいですか。</div><div class="ex">A: I like this shirt. Can I try it on?<br>B: Sure. Please come this way.</div></button></li><li><button class="w" data-no="会22"><div class="top"><span class="no">会22</span><span class="en">I&#x27;ll take it.</span></div><div class="ja">それをください。</div><div class="ex">A: This bag is 2,000 yen.<br>B: OK. I&#x27;ll take it.</div></button></li><li><button class="w" data-no="会23"><div class="top"><span class="no">会23</span><span class="en">May I help you?</span></div><div class="ja">いらっしゃいませ。／お手伝いしましょうか。</div><div class="ex">A: May I help you?<br>B: Yes. I&#x27;m looking
