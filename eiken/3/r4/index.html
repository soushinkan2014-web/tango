</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検3級　復習 第4回</h1><div class="sub">復121〜復160</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../r4.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="復121"><div class="top"><span class="no">復121</span><span class="en">hard – harder – hardest</span><span class="star">★★★</span></div><div class="ja">難しい・熱心に</div><div class="ex">Math is <b>harder</b> than English for me.</div><div class="xj">私にとって、算数は英語より難しいです。</div></button></li><li><button class="w" data-no="復122"><div class="top"><span class="no">復122</span><span class="en">different</span><span class="star">★★★</span></div><div class="ja">ちがう・いろいろな</div><div class="ex">Ken and I are in <b>different</b> classes.</div><div class="xj">ケンと私はちがうクラスです。</div></button></li><li><button class="w" data-no="復123"><div class="top"><span class="no">復123</span><span class="en">farm</span><span class="star">★★★</span></div><div class="ja">農場</div><div class="ex">My uncle has a big <b>farm</b>.</div><div class="xj">おじは大きな農場を持っています。</div></button></li><li><button class="w" data-no="復124"><div class="top"><span class="no">復124</span><span class="en">pool</span><span class="star">★★★</span></div><div class="ja">プール</div><div class="ex">Ken swims in the <b>pool</b> every summer.</div><div class="xj">ケンは毎年夏にプールで泳ぎます。</div></button></li><li><button class="w" data-no="復125"><div class="top"><span class="no">復125</span><span class="en">parents</span><span class="star">★★★</span></div><div class="ja">両親</div><div class="ex">My <b>parents</b> are both teachers.</div><div class="xj">私の両親はふたりとも先生です。</div></button></li><li><button class="w" data-no="復126"><div class="top"><span class="no">復126</span><span class="en">grandfather</span><span class="star">★★★</span></div><div class="ja">祖父・おじいさん</div><div class="ex">My <b>grandfather</b> likes fishing.</div><div class="xj">私の祖父はつりが好きです。</div></button></li><li><button class="w" data-no="復127"><div class="top"><span class="no">復127</span><span class="en">cousin</span><span class="star">★★★</span></div><div class="ja">いとこ</div><div class="ex">My <b>cousin</b> lives in Canada.</div><div class="xj">私のいとこはカナダに住んでいます。</div></button></li><li><button class="w" data-no="復128"><div class="top"><span class="no">復128</span><span class="en">husband</span><span class="star">★★★</span></div><div class="ja">夫</div><div class="ex">Her <b>husband</b> is a police officer.</div><div class="xj">彼女の夫は警察官です。</div></button></li><li><button class="w" data-no="復129"><div class="top"><span class="no">復129</span><span class="en">ticket</span><span class="star">★★★</span></div><div class="ja">チケット・切符</div><div class="ex">I have two <b>tickets</b> for the concert.</div><div class="xj">私はコンサートのチケットを2まい持っています。</div></button></li><li><button class="w" data-no="復130"><div class="top"><span class="no">復130</span><span class="en">report</span><span class="star">★★★</span></div><div class="ja">レポート・報告</div><div class="ex">I wrote a <b>report</b> about my town.</div><div class="xj">私は自分の町についてレポートを書きました。</div></button></li><li><button class="w" data-no="復131"><div class="top"><span class="no">復131</span><span class="en">only</span><span class="star">★★★</span></div><div class="ja">ただ～だけ</div><div class="ex">I have <b>only</b> 100 yen.</div><div class="xj">私は100円だけ持っています。</div></button></li><li><button class="w" data-no="復132"><div class="top"><span class="no">復132</span><span class="en">again</span><span class="star">★★★</span></div><div class="ja">もう一度・また</div><div class="ex">Please say that <b>again</b>.</div><div class="xj">もう一度言ってください。</div></button></li><li><button class="w" data-no="復133"><div class="top"><span class="no">復133</span><span class="en">sing – sang</span><span class="star">★★★</span></div><div class="ja">歌う</div><div class="ex">We <b>sang</b> a song in music class.</div><div class="xj">私たちは音楽の授業で歌を歌いました。</div></button></li><li><button class="w" data-no="復134"><div class="top"><span class="no">復134</span><span class="en">drink – drank</span><span class="star">★★★</span></div><div class="ja">飲む</div><div class="ex">Ken <b>drank</b> some water after soccer.</div><div class="xj">ケンはサッカーのあと、水を飲みました。</div></button></li><li><button class="w" data-no="復135"><div class="top"><span class="no">復135</span><span class="en">ride – rode</span><span class="star">★★★</span></div><div class="ja">乗る</div><div class="ex">Lisa <b>rode</b> a horse in Hokkaido.</div><div class="xj">リサは北海道で馬に乗りました。</div></button></li><li><button class="w" data-no="復136"><div class="top"><span class="no">復136</span><span class="en">teach – taught</span><span class="star">★★★</span></div><div class="ja">教える</div><div class="ex">Mr. Brown <b>taught</b> us some English songs.</div><div class="xj">ブラウン先生は私たちに英語の歌を教えました。</div></button></li><li><button class="w" data-no="復137"><div class="top"><span class="no">復137</span><span class="en">ago</span><span class="star">★★★</span></div><div class="ja">（今から）～前に</div><div class="ex">Tom came to Japan two years <b>ago</b>.</div><div class="xj">トムは2年前に日本に来ました。</div></button></li><li><button class="w" data-no="復138"><div class="top"><span class="no">復138</span><span class="en">stop – stopped</span><span class="star">★★★</span></div><div class="ja">止める・やめる（p を重ねて ed）</div><div class="ex">Ken <b>stopped</b> the music and stood up.</div><div class="xj">ケンは音楽を止めて、立ち上がりました。</div></button></li><li><button class="w" data-no="復139"><div class="top"><span class="no">復139</span><span class="en">tired</span><span class="star">★★★</span></div><div class="ja">つかれた</div><div class="ex">I was very <b>tired</b> after soccer practice.</div><div class="xj">私はサッカーの練習のあと、とてもつかれていました。</div></button></li><li><button class="w" data-no="復140"><div class="top"><span class="no">復140</span><span class="en">angry</span><span class="star">★★★</span></div><div class="ja">おこった</div><div class="ex">Mom was <b>angry</b> with my brother.</div><div class="xj">お母さんは弟におこっていました。</div></button></li><li><button class="w" data-no="復141"><div class="top"><span class="no">復141</span><span class="en">vacation</span><span class="star">★★★</span></div><div class="ja">休み・休暇</div><div class="ex">My summer <b>vacation</b> begins next week.</div><div class="xj">私の夏休みは来週から始まります。</div></button></li><li><button class="w" data-no="復142"><div class="top"><span class="no">復142</span><span class="en">tonight</span><span class="star">★★★</span></div><div class="ja">今夜</div><div class="ex">It will be cold <b>tonight</b>.</div><div class="xj">今夜は寒くなるでしょう。</div></button></li><li><button class="w" data-no="復143"><div class="top"><span class="no">復143</span><span class="en">Christmas</span><span class="star">★★★</span></div><div class="ja">クリスマス</div><div class="ex">What do you want for <b>Christmas</b>?</div><div class="xj">クリスマスには何がほしいですか。</div></button></li><li><button class="w" data-no="復144"><div class="top"><span class="no">復144</span><span class="en">country</span><span class="star">★★★</span></div><div class="ja">国・いなか</div><div class="ex">Which <b>country</b> do you want to visit?</div><div class="xj">あなたはどの国をおとずれたいですか。</div></button></li><li><button class="w" data-no="復145"><div class="top"><span class="no">復145</span><span class="en">vegetable</span><span class="star">★★★</span></div><div class="ja">野菜</div><div class="ex">We buy <b>vegetables</b> at this store.</div><div class="xj">私たちはこのお店で野菜を買います。</div></button></li><li><button class="w" data-no="復146"><div class="top"><span class="no">復146</span><span class="en">coffee</span><span class="star">★★★</span></div><div class="ja">コーヒー</div><div class="ex">My father drinks <b>coffee</b> every morning.</div><div class="xj">お父さんは毎朝コーヒーを飲みます。</div></button></li><li><button class="w" data-no="復147"><div class="top"><span class="no">復147</span><span class="en">lend</span><span class="star">★★★</span></div><div class="ja">貸す</div><div class="ex">I will <b>lend</b> you this book.</div><div class="xj">この本をあなたに貸します。</div></button></li><li><button class="w" data-no="復148"><div class="top"><span class="no">復148</span><span class="en">ready</span><span class="star">★★★</span></div><div class="ja">用意ができて</div><div class="ex">Dinner is <b>ready</b>, Ken!</div><div class="xj">ケン、夕ごはんの用意ができましたよ！</div></button></li><li><button class="w" data-no="復149"><div class="top"><span class="no">復149</span><span class="en">hobby</span><span class="star">★★★</span></div><div class="ja">趣味</div><div class="ex">My <b>hobby</b> is cooking.</div><div class="xj">私の趣味は料理です。</div></button></li><li><button class="w" data-no="復150"><div class="top"><span class="no">復150</span><span class="en">fun</span><span class="star">★★★</span></div><div class="ja">楽しいこと</div><div class="ex">Playing tennis is a lot of <b>fun</b>.</div><div class="xj">テニスをするのはとても楽しいです。</div></button></li><li><button class="w" data-no="復151"><div class="top"><span class="no">復151</span><span class="en">painting</span><span class="star">★★★</span></div><div class="ja">絵（をかくこと）</div><div class="ex">Lisa&#x27;s <b>painting</b> is on the wall.</div><div class="xj">リサの絵がかべにかかっています。</div></button></li><li><button class="w" data-no="復152"><div class="top"><span class="no">復152</span><span class="en">race</span><span class="star">★★★</span></div><div class="ja">競走・レース</div><div class="ex">Lisa was first in the <b>race</b>.</div><div class="xj">リサは競走で1位でした。</div></button></li><li><button class="w" data-no="復153"><div class="top"><span class="no">復153</span><span class="en">contest</span><span class="star">★★★</span></div><div class="ja">コンテスト</div><div class="ex">Emi won the speech <b>contest</b>.</div><div class="xj">エミはスピーチコンテストで1位になりました。</div></button></li><li><button class="w" data-no="復154"><div class="top"><span class="no">復154</span><span class="en">photo</span><span class="star">★★★</span></div><div class="ja">写真</div><div class="ex">May I take a <b>photo</b> here?</div><div class="xj">ここで写真をとってもいいですか。</div></button></li><li><button class="w" data-no="復155"><div class="top"><span class="no">復155</span><span class="en">beautiful – more beautiful – most beautiful</span><span class="star">★★★</span></div><div class="ja">美しい</div><div class="ex">This is the <b>most beautiful</b> flower in the garden.</div><div class="xj">これは庭でいちばん美しい花です。</div></button></li><li><button class="w" data-no="復156"><div class="top"><span class="no">復156</span><span class="en">far</span><span class="star">★★★</span></div><div class="ja">遠い・遠くに</div><div class="ex">Is the park <b>far</b> from here?</div><div class="xj">公園はここから遠いですか。</div></button></li><li><button class="w" data-no="復157"><div class="top"><span class="no">復157</span><span class="en">show</span><span class="star">★★★</span></div><div class="ja">見せる</div><div class="ex">Please <b>show</b> me your new bike.</div><div class="xj">あなたの新しい自転車を私に見せてください。</div></button></li><li><button class="w" data-no="復158"><div class="top"><span class="no">復158</span><span class="en">mall</span><span class="star">★★★</span></div><div class="ja">ショッピングモール</div><div class="ex">Emi and I went shopping at the <b>mall</b>.</div><div class="xj">エミと私はショッピングモールに買い物に行きました。</div></button></li><li><button class="w" data-no="復159"><div class="top"><span class="no">復159</span><span class="en">aquarium</span><span class="star">★★★</span></div><div class="ja">水族館</div><div class="ex">We saw many fish at the <b>aquarium</b>.</div><div class="xj">私たちは水族館でたくさんの魚を見ました。</div></button></li><li><button class="w" data-no=
