pan><span class="star">★★</span></div><div class="ja">（手など）を振る</div><div class="ex">Emi <b>waved</b> her hand to say goodbye.</div><div class="xj">エミは手を振ってさようならをした。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">favor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">お願い；親切な行為</div><div class="ex">Ken, I have a <b>favor</b> to ask.</div><div class="xj">ケン、お願いがあるんだけど。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">wedding</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">結婚式</div><div class="ex">My aunt&#x27;s <b>wedding</b> is next month.</div><div class="xj">おばの結婚式は来月だ。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">reservation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">予約</div><div class="ex">I made a <b>reservation</b> at the restaurant.</div><div class="xj">私はそのレストランの予約をした。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">grade</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">学年；成績</div><div class="ex">Ken and I are in the same <b>grade</b>.</div><div class="xj">ケンと私は同じ学年だ。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">adult</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">大人</div><div class="ex">The ticket is 1,000 yen for <b>adults</b>.</div><div class="xj">チケットは大人1,000円だ。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">tower</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">塔；タワー</div><div class="ex">We could see the whole city from the <b>tower</b>.</div><div clas
