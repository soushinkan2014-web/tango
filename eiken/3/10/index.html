ton class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">appear</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">現れる</div><div class="ex">A rainbow <b>appeared</b> in the sky.</div><div class="xj">空に虹が現れた。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">waste</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をむだにする</div><div class="ex">We should not <b>waste</b> food.</div><div class="xj">私たちは食べ物をむだにするべきではない。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">wonder</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～だろうかと思う</div><div class="ex">I <b>wonder</b> where Ken is now.</div><div class="xj">ケンは今どこにいるのだろうか。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">discover</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を発見する</div><div class="ex">Scientists <b>discovered</b> a new kind of fish.</div><div class="xj">科学者たちが新しい種類の魚を発見した。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">cross</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を渡る；～を横切る</div><div class="ex">We <b>crossed</b> the river by boat.</div><div class="xj">私たちはボートで川を渡った。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">invent</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を発明する</div><div class="ex">Who <b>invented</b> the first telephone?</div><div class="xj">最初の電話はだれが発明したのですか。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">guest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">客；招待客</div><div class="ex">We had three <b>guests</b> for dinner last night.</div><div class="xj">昨夜、夕食に3人の客が来た。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">village</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">村</div><div class="ex">My grandparents live in a small <b>village</b>.</div><div class="xj">祖父母は小さな村に住んでいる。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">ground</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地面；グラウンド</div><div class="ex">The <b>ground</b> was wet after the rain.</div><div class="xj">雨のあとで地面がぬれていた。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">area</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地域；区域</div><div class="ex">There are many good restaurants in this <b>area</b>.</div><div class="xj">この地域にはよいレストランがたくさんある。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">flight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">飛行便；空の旅</div><div class="ex">Our <b>flight</b> to Hawaii leaves at ten.</div><div class="xj">私たちのハワイ行きの飛行便は10時に出発する。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">peace</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">平和</div><div class="ex">Everyone wants <b>peace</b> in the world.</div><div class="xj">だれもが世界の平和を願っている。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">tourist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">観光客</div><div class="ex">Many <b>tourists</b> visit Kyoto every year.</div><div class="xj">毎年、多くの観光客が京都を訪れる。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">souvenir</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">みやげ；記念品</div><div class="ex">In Okinawa, I bought a <b>souvenir</b> for my family.</div><div class="xj">私は沖縄で家族へのみやげを買った。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">goal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">目標；ゴール</div><div class="ex">My <b>goal</b> is to pass the test.</div><div class="xj">私の目標はそのテストに合格することだ。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">neighborhood</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">近所；地域</div><div class="ex">There is a nice park in my <b>neighborhood</b>.</div><div class="xj">私の近所にはすてきな公園がある。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">host</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（客をもてなす）主人；ホスト</div><div class="ex">My <b>host</b> family in Canada was very kind.</div><div class="xj">カナダのホストファミリーはとても親切だった。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">conversation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">会話</div><div class="ex">I had a long <b>conversation</b> with Lisa.</div><div class="xj">私はリサと長い会話をした。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">sightseeing</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">観光</div><div class="ex"><b>Sightseeing</b> in this city is a lot of fun.</div><div class="xj">この町での観光はとても楽しい。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">opinion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">意見</div><div class="ex">Please tell me your <b>opinion</b>.</div><div class="xj">あなたの意見を教えてください。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">fire</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">火；火事</div><div class="ex">We made a <b>fire</b> at the camp.</div><div class="xj">私たちはキャンプで火をおこした。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">past</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">過去</div><div class="ex">We learned about the <b>past</b> in history class.</div><div class="xj">私たちは歴史の授業で過去について学んだ。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">result</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">結果</div><div class="ex">Ken was happy with the <b>result</b> of the test.</div><div class="xj">ケンはテストの結果に満足した。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">voice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">声</div><div class="ex">Lisa has a beautiful <b>voice</b>.</div><div class="xj">リサは美しい声をしている。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">excellent</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">すばらしい；優秀な</div><div class="ex">Your speech in English was <b>excellent</b>.</div><div class="xj">あなたの英語のスピーチはすばらしかった。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">terrible</span><span class="ps">形</span><span class="star">★★</span></div><d
