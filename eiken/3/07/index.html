<button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">cover</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をおおう</div><div class="ex">Snow <b>covered</b> the whole town.</div><div class="xj">雪が町全体をおおった。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">hate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をひどく嫌う</div><div class="ex">My little brother <b>hates</b> carrots.</div><div class="xj">弟はニンジンが大嫌いだ。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">focus</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">集中する</div><div class="ex">I can&#x27;t <b>focus</b> when the TV is on.</div><div class="xj">テレビがついていると集中できない。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">remind</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に思い出させる</div><div class="ex">This song <b>reminds</b> me of my summer vacation.</div><div class="xj">この歌は私に夏休みを思い出させる。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">college</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">大学</div><div class="ex">My sister studies music at <b>college</b>.</div><div class="xj">姉は大学で音楽を学んでいる。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">health</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">健康</div><div class="ex">Sleeping well is important for your <b>health</b>.</div><div class="xj">よく眠ることは健康にとって大切だ。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">accident</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">事故</div><div class="ex">There was a small <b>accident</b> on the road this morning.</div><div class="xj">今朝、道路で小さな事故があった。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">forest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">森</div><div class="ex">Many animals live in this <b>forest</b>.</div><div class="xj">この森には、たくさんの動物がすんでいる。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">discount</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">割引</div><div class="ex">Students can get a <b>discount</b> at this shop.</div><div class="xj">この店では、学生は割引を受けられる。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">visitor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">訪問者；観光客</div><div class="ex">Many <b>visitors</b> come to this temple every year.</div><div class="xj">毎年たくさんの観光客がこの寺に来る。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">owner</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">持ち主；店主</div><div class="ex">The <b>owner</b> of this bike is Tom.</div><div class="xj">この自転車の持ち主はトムだ。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">recipe</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">レシピ；調理法</div><div class="ex">My grandmother gave me her cookie <b>recipe</b>.</div><div class="xj">祖母がクッキーのレシピを教えてくれた。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">air</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">空気</div><div class="ex">The <b>air</b> in the mountains is clean.</div><div class="xj">山の空気はきれいだ。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">model</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">模型；モデル</div><div class="ex">Ken made a <b>model</b> of a ship.</div><div class="xj">ケンは船の模型を作った。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">slice</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（薄い）1切れ</div><div class="ex">I ate a <b>slice</b> of pizza.</div><div class="xj">私はピザを1切れ食べた。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">traveler</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">旅行者</div><div class="ex">Many <b>travelers</b> stay at this hotel.</div><div class="xj">たくさんの旅行者がこのホテルに泊まる。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">capital</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">首都</div><div class="ex">What is the <b>capital</b> of this country?</div><div class="xj">この国の首都はどこですか。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">guard</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">警備員；見張り</div><div class="ex">A <b>guard</b> stands at the gate of the museum.</div><div class="xj">博物館の門には警備員が立っている。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">line</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">線；列</div><div class="ex">Draw a straight <b>line</b> under the word.</div><div class="xj">その単語の下に、まっすぐな線を引きなさい。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">north</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">北</div><div class="ex">This bird comes from the <b>north</b> in winter.</div><div class="xj">この鳥は冬に北からやって来る。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">fiction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小説；作り話</div><div class="ex">Ken likes reading <b>fiction</b> more than science books.</div><div class="xj">ケンは科学の本より小説を読むのが好きだ。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">king</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">王</div><div class="ex">The <b>king</b> lived in a big castle.</div><div class="xj">その王は大きな城に住んでいた。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">painter</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">画家</div><div class="ex">My uncle is a famous <b>painter</b>.</div><div class="xj">おじは有名な画家だ。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">seat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">座席</div><div class="ex">I gave my <b>seat</b> to an old man.</div><div class="xj">私はお年寄りに座席をゆずった。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">side</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">側；面</div><div class="ex">Please walk on the left <b>side</b> of the road.</div><div class="xj">道の左側を歩いてください。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">international</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">国際的な</div><div class="ex">
