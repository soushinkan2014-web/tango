 swam</span><span class="star">★★★</span></div><div class="ja">泳ぐ</div><div class="ex">Ken and I <b>swam</b> in the river.</div><div class="xj">ケンと私は川で泳ぎました。</div></button></li><li><button class="w" data-no="復46"><div class="top"><span class="no">復46</span><span class="en">say – said</span><span class="star">★★★</span></div><div class="ja">言う</div><div class="ex">Lisa <b>said</b> goodbye to her friends.</div><div class="xj">リサは友だちに「さようなら」と言いました。</div></button></li><li><button class="w" data-no="復47"><div class="top"><span class="no">復47</span><span class="en">sell – sold</span><span class="star">★★★</span></div><div class="ja">売る</div><div class="ex">Mr. Brown <b>sold</b> his old car.</div><div class="xj">ブラウンさんは古い車を売りました。</div></button></li><li><button class="w" data-no="復48"><div class="top"><span class="no">復48</span><span class="en">plan – planned</span><span class="star">★★★</span></div><div class="ja">計画する（n を重ねて ed）</div><div class="ex">Ken and Tom <b>planned</b> a soccer game for Sunday.</div><div class="xj">ケンとトムは日曜日のサッカーの試合を計画しました。</div></button></li><li><button class="w" data-no="復49"><div class="top"><span class="no">復49</span><span class="en">visit – visited</span><span class="star">★★★</span></div><div class="ja">おとずれる（ed の発音は［イド］）</div><div class="ex">We <b>visited</b> our uncle in Kobe.</div><div class="xj">私たちは神戸のおじさんをおとずれました。</div></button></li><li><button class="w" data-no="復50"><div class="top"><span class="no">復50</span><span class="en">happen – happened</span><span class="star">★★★</span></div><div class="ja">起こる</div><div class="ex">What <b>happened</b> at school today?</div><div class="xj">今日、学校で何が起こったのですか。</div></button></li><li><button class="w" data-no="復51"><div class="top"><span class="no">復51</span><span class="en">famous – more famous – most famous</span><span class="star">★★★</span></div><div class="ja">有名な</div><div class="ex">He is the <b>most famous</b> singer in Japan.</div><div class="xj">彼は日本でいちばん有名な歌手です。</div></button></li><li><button class="w" data-no="復52"><div class="top"><span class="no">復52</span><span class="en">right</span><span class="star">★★★</span></div><div class="ja">右・正しい</div><div class="ex">The post office is on your <b>right</b>.</div><div class="xj">郵便局は右にあります。</div></button></li><li><button class="w" data-no="復53"><div class="top"><span class="no">復53</span><span class="en">second</span><span class="star">★★★</span></div><div class="ja">2番目の・秒</div><div class="ex">Emi was <b>second</b> in the race.</div><div class="xj">エミはかけっこで2番でした。</div></button></li><li><button class="w" data-no="復54"><div class="top"><span class="no">復54</span><span class="en">write – wrote</span><span class="star">★★★</span></div><div class="ja">書く</div><div class="ex">Emi <b>wrote</b> a letter to her grandfather.</div><div class="xj">エミはおじいさんに手紙を書きました。</div></button></li><li><button class="w" data-no="復55"><div class="top"><span class="no">復55</span><span class="en">lose – lost</span><span class="star">★★★</span></div><div class="ja">なくす・負ける</div><div class="ex">Ken <b>lost</b> his watch at school.</div><div class="xj">ケンは学校でうで時計をなくしました。</div></button></li><li><button class="w" data-no="復56"><div class="top"><span class="no">復56</span><span class="en">catch – caught</span><span class="star">★★★</span></div><div class="ja">つかまえる</div><div class="ex">My brother <b>caught</b> a big fish.</div><div class="xj">兄は大きな魚をつかまえました。</div></button></li><li><button class="w" data-no="復57"><div class="top"><span class="no">復57</span><span class="en">yesterday</span><span class="star">★★★</span></div><div class="ja">昨日</div><div class="ex">I played tennis with Ken <b>yesterday</b>.</div><div class="xj">私はきのうケンとテニスをしました。</div></button></li><li><button class="w" data-no="復58"><div class="top"><span class="no">復58</span><span class="en">study – studied</span><span class="star">★★★</span></div><div class="ja">勉強する（y を i にかえて ed）</div><div class="ex">Emi <b>studied</b> English after school.</div><div class="xj">エミは放課後、英語を勉強しました。</div></button></li><li><button class="w" data-no="復59"><div class="top"><span class="no">復59</span><span class="en">practice – practiced</span><span class="star">★★★</span></div><div class="ja">練習する（d だけつける）</div><div class="ex">Lisa <b>practiced</b> the piano for an hour.</div><div class="xj">リサは1時間ピアノを練習しました。</div></button></li><li><button class="w" data-no="復60"><div class="top"><span class="no">復60</span><span class="en">learn – learned</span><span class="star">★★★</span></div><div class="ja">学ぶ・習う</div><div class="ex">Lisa <b>learned</b> Japanese songs at school.</div><div class="xj">リサは学校で日本の歌を学びました。</div></button></li><li><button class="w" data-no="復61"><div class="top"><span class="no">復61</span><span class="en">trip</span><span class="star">★★★</span></div><div class="ja">旅行</div><div class="ex">We are going to take a <b>trip</b> to Kyoto.</div><div class="xj">私たちは京都へ旅行に行く予定です。</div></button></li><li><button class="w" data-no="復62"><div class="top"><span class="no">復62</span><span class="en">soon</span><span class="star">★★★</span></div><div class="ja">すぐに・まもなく</div><div class="ex">The bus will come <b>soon</b>.</div><div class="xj">バスはすぐに来るでしょう。</div></button></li><li><button class="w" data-no="復63"><div class="top"><span class="no">復63</span><span class="en">borrow</span><span class="star">★★★</span></div><div class="ja">借りる</div><div class="ex">Can I <b>borrow</b> your eraser?</div><div class="xj">あなたの消しゴムを借りてもいいですか。</div></button></li><li><button class="w" data-no="復64"><div class="top"><span class="no">復64</span><span class="en">sick</span><span class="star">★★★</span></div><div class="ja">病気の</div><div class="ex">Tom is <b>sick</b> in bed today.</div><div class="xj">トムは今日、病気でねています。</div></button></li><li><button class="w" data-no="復65"><div class="top"><span class="no">復65</span><span class="en">hope</span><span class="star">★★★</span></div><div class="ja">望む・～だといいと思う</div><div class="ex">I <b>hope</b> to see you again.</div><div class="xj">またあなたに会えることを望んでいます。</div></button></li><li><button class="w" data-no="復66"><div class="top"><span class="no">復66</span><span class="en">party</span><span class="star">★★★</span></div><div class="ja">パーティー</div><div class="ex">Lisa had a birthday <b>party</b>.</div><div class="xj">リサは誕生日パーティーを開きました。</div></button></li><li><button class="w" data-no="復67"><div class="top"><span class="no">復67</span><span class="en">concert</span><span class="star">★★★</span></div><div class="ja">コンサート</div><div class="ex">We are going to a <b>concert</b> tonight.</div><div class="xj">私たちは今夜コンサートに行きます。</div></button></li><li><button class="w" data-no="復68"><div class="top"><span class="no">復68</span><span class="en">difficult – more difficult – most difficult</span><span class="star">★★★</span></div><div class="ja">難しい</div><div class="ex">The test was <b>more difficult</b> than last time.</div><div class="xj">テストはこの前より難しかったです。</div></button></li><li><button class="w" data-no="復69"><div class="top"><span class="no">復69</span><span class="en">expensive – more expensive – most expensive</span><span class="star">★★★</span></div><div class="ja">（値段が）高い</div><div class="ex">This bike is <b>more expensive</b> than mine.</div><div class="xj">この自転車は私の自転車より高いです。</div></button></li><li><button class="w" data-no="復70"><div class="top"><span class="no">復70</span><span class="en">delicious</span><span class="star">★★★</span></div><div class="ja">とてもおいしい</div><div class="ex">Your mother&#x27;s curry is <b>delicious</b>.</div><div class="xj">あなたのお母さんのカレーはとてもおいしいです。</div></button></li><li><button class="w" data-no="復71"><div class="top"><span class="no">復71</span><span class="en">if</span><span class="star">★★★</span></div><div class="ja">もし～ならば</div><div class="ex"><b>If</b> it rains tomorrow, I&#x27;ll stay home.</div><div class="xj">もしあした雨がふったら、家にいます。</div></button></li><li><button class="w" data-no="復72"><div class="top"><span class="no">復72</span><span class="en">gym</span><span class="star">★★★</span></div><div class="ja">体育館</div><div class="ex">We play basketball in the <b>gym</b>.</div><div class="xj">私たちは体育館でバスケットボールをします。</div></button></li><li><button class="w" data-no="復73"><div class="top"><span class="no">復73</span><span class="en">event</span><span class="star">★★★</span></div><div class="ja">行事・イベント</div><div class="ex">Our school has a big <b>event</b> in May.</div><div class="xj">私たちの学校では5月に大きな行事があります。</div></button></li><li><button class="w" data-no="復74"><div class="top"><span class="no">復74</span><span class="en">part</span><span class="star">★★★</span></div><div class="ja">部分・役</div><div class="ex">I like the last <b>part</b> of the movie.</div><div class="xj">私はその映画の最後の部分が好きです。</div></button></li><li><button class="w" data-no="復75"><div class="top"><span class="no">復75</span><span class="en">just</span><span class="star">★★★</span></div><div class="ja">ちょうど・ほんの</div><div class="ex">It&#x27;s <b>just</b> seven o&#x27;clock now.</div><div class="xj">今ちょうど7時です。</div></button></li><li><button class="w" data-no="復76"><div class="top"><span class="no">復76</span><span class="en">already</span><span class="star">★★★</span></div><div class="ja">すでに・もう</div><div class="ex">I <b>already</b> finished my homework.</div><div class="xj">私はもう宿題を終えました。</div></button></li><li><button class="w" data-no="復77"><div class="top"><span class="no">復77</span><span class="en">store</span><span class="star">★★★</span></div><div class="ja">店</div><div class="ex">This <b>store</b> opens at ten.</div><div class="xj">この店は10時に開きます。</div></button></li><li><button class="w" data-no="復78"><div class="top"><span class="no">復78</span><span class="en">read – read</span><span class="star">★★★</span></div><div class="ja">読む（過去形 read［レッド］）</div><div class="ex">Tom <b>read</b> a book in his room.</div><div class="xj">トムは自分の部屋で本を読みました。</div></button></li><li><button class="w" data-no="復79"><div class="top"><span class="no">復79</span><span class="en">run – ran</span><span class="sta
