tton></li><li><button class="w" data-no="熟86"><div class="top"><span class="no">熟86</span><span class="en">on time</span></div><div class="ja">時間通りに</div><div class="ex">The bus came on time.</div><div class="xj">バスは時間通りに来た。</div></button></li><li><button class="w" data-no="熟87"><div class="top"><span class="no">熟87</span><span class="en">at last</span></div><div class="ja">ついに</div><div class="ex">At last, we got to the top of the mountain.</div><div class="xj">ついに、私たちは山の頂上に着いた。</div></button></li><li><button class="w" data-no="熟88"><div class="top"><span class="no">熟88</span><span class="en">for free</span></div><div class="ja">無料で</div><div class="ex">You can get this map for free.</div><div class="xj">この地図は無料でもらえます。</div></button></li><li><button class="w" data-no="熟89"><div class="top"><span class="no">熟89</span><span class="en">by oneself</span></div><div class="ja">ひとりで</div><div class="ex">Mai made dinner by herself.</div><div class="xj">マイはひとりで夕食を作った。</div></button></li><li><button class="w" data-no="熟90"><div class="top"><span class="no">熟90</span><span class="en">each other</span></div><div class="ja">お互い</div><div class="ex">Tom and Ken often help each other.</div><div class="xj">トムとケンはよくお互いに助け合う。</div></button></li><li><button class="w" data-no="会41"><div class="top"><span class="no">会41</span><span class="en">Excuse me.</span></div><div class="ja">すみません。</div><div class="ex">A: Excuse me. Is this your pen?<br>B: Oh, yes. Thank you.</div></button></li><li><button class="w" data-no="会42"><div class="top"><span class="no">会42</span><span class="en">Could you tell me the way to ～?</span></div><div class="ja">～への行き方を教えてもらえますか。</div><div class="ex">A: Could you tell me the way to the library?<br>B: Sure. It&#x27;s near the park.</div></button></li><li><button class="w" data-no="会43"><div class="top"><span class="no">会43</span><span class="en">It&#x27;s over there.</span></div><div class="ja">あそこです。</div><div class="ex">A: Where&#x27;s the restroom?<br>B: It&
