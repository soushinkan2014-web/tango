o="285"><div class="top"><span class="no">285</span><span class="en">develop</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を発達させる；～を開発する</div><div class="ex">Playing outside helps <b>develop</b> children&#x27;s bodies.</div><div class="xj">外で遊ぶことは、子どもの体を発達させるのに役立つ。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">lock</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～にかぎをかける</div><div class="ex">Don&#x27;t forget to <b>lock</b> the door.</div><div class="xj">ドアにかぎをかけるのを忘れないで。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">taste</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～の味がする</div><div class="ex">This soup <b>tastes</b> like tomatoes.</div><div class="xj">このスープはトマトの味がする。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">add</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を加える</div><div class="ex"><b>Add</b> a little sugar to the tea.</div><div class="xj">紅茶に砂糖を少し加えてください。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">cheer</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を応援する；～を元気づける</div><div class="ex">We <b>cheered</b> for our team at the stadium.</div><div class="xj">私たちはスタジアムで、自分たちのチームを応援した。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">support</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を支える；～を支援する</div><div class="ex">My family always <b>supports</b> me.</div><div class="xj">家族はいつも私を支えてくれる。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">photographer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">写真家；カメラマン</div><div class="ex">The <b>photographer</b> took pictures of our class.</div><div class="xj">カメラマンが私たちのクラスの写真を撮った。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">rest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">休けい；残り</div><div class="ex">Let&#x27;s take a <b>rest</b> under that tree.</div><div class="xj">あの木の下で休けいしよう。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">address</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">住所；（メール）アドレス</div><div class="ex">Please write your name and <b>address</b> here.</div><div class="xj">ここにお名前と住所を書いてください。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">license</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">免許（証）</div><div class="ex">My brother got his driver&#x27;s <b>license</b> last month.</div><div class="xj">兄は先月、運転免許をとった。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">distance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">距離</div><div class="ex">What is the <b>distance</b> from here to the station?</div><div class="xj">ここから駅までの距離はどれくらいですか。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">list</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">リスト；一覧表</div><div class="ex">I made a shopping <b>list</b> for the party.</div><div class="xj">私はパーティーのための買い物リストを作った。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">topic</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">話題</div><div class="ex">What is the <b>topic</b> of your speech?</div><div class="xj">あなたのスピーチの話題は何ですか。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">astronaut</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">宇宙飛行士</div><div class="ex">An <b>astronaut</b> visited our school last week.</div><div class="xj">先週、宇宙飛行士が私たちの学校に来た。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">stage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">舞台；ステージ</div><div class="ex">The singers are dancing on the <b>stage</b>.</div><div class="xj">歌手たちが舞台の上でおどっている。</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">bottom</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">底；いちばん下</div><div class="ex">There are many fish at the <b>bottom</b> of the lake.</div><div class="xj">湖の底には、たくさんの魚がいる。</div></button></li><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">government</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">政府</div><div class="ex">The <b>government</b> built a new hospital in our city.</div><div class="xj">政府が私たちの市に新しい病院を建てた。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">camp</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">キャンプ（場）</div><div class="ex">We stayed at a <b>camp</b> near the river.</div><div class="xj">私たちは川の近くのキャンプ場に泊まった。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">exit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">出口</div><div class="ex">Please use the <b>exit</b> on the left.</div><div class="xj">左側の出口をご利用ください。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">bug</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">虫</div><div class="ex">There is a <b>bug</b> on your shoulder.</div><div class="xj">あなたの肩に虫がついているよ。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">author</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">作家；著者</div><div class="ex">Who is the <b>author</b> of this book?</div><div class="xj">この本の著者はだれですか。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">planet</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">惑星</div><div class="ex">We live on a beautiful <b>planet</b>.</div><div class="xj">私たちは美しい惑星に住んでいる。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">staff</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">職員；スタッフ</div><div class="ex">A <b>staff</b> member at the hotel carried our bags.</div><div class="xj">ホテルの職員が私たちの荷物を運んでくれた。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">librarian</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">図書館員</div><div class="ex">The <b>librarian</b> helped me find a book.</div><div class="xj">図書館員が本をさがすのを手伝ってくれた。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">human</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">人間</div><div class="ex">Dogs and <b>humans</b> have been friends for a long time.</div><div class="xj">犬と人間は、長い間ずっと友だちだ。</div></button></li><li><button class="w" data-no="310"><div class="top"><span
