class="star">★★★</span></div><div class="ja">持っている・食べる</div><div class="ex">Tom <b>had</b> a red cap in his hand.</div><div class="xj">トムは手に赤いぼうしを持っていました。</div></button></li><li><button class="w" data-no="復6"><div class="top"><span class="no">復6</span><span class="en">good – better – best</span><span class="star">★★★</span></div><div class="ja">よい</div><div class="ex">Your idea is <b>better</b> than mine.</div><div class="xj">あなたのアイデアは私のよりよいです。</div></button></li><li><button class="w" data-no="復7"><div class="top"><span class="no">復7</span><span class="en">many / much – more – most</span><span class="star">★★★</span></div><div class="ja">多い・たくさんの</div><div class="ex">Ken has <b>more</b> pencils than Tom.</div><div class="xj">ケンはトムよりたくさんえんぴつを持っています。</div></button></li><li><button class="w" data-no="復8"><div class="top"><span class="no">復8</span><span class="en">when</span><span class="star">★★★</span></div><div class="ja">～するとき</div><div class="ex">I was sleeping <b>when</b> you called me.</div><div class="xj">あなたが電話をくれたとき、私はねむっていました。</div></button></li><li><button class="w" data-no="復9"><div class="top"><span class="no">復9</span><span class="en">but</span><span class="star">★★★</span></div><div class="ja">しかし・でも</div><div class="ex">I like tennis, <b>but</b> Ken likes soccer.</div><div class="xj">私はテニスが好きです。でもケンはサッカーが好きです。</div></button></li><li><button class="w" data-no="復10"><div class="top"><span class="no">復10</span><span class="en">story</span><span class="star">★★★</span></div><div class="ja">物語・話</div><div class="ex">My father read me a <b>story</b>.</div><div class="xj">父は私に物語を読んでくれました。</div></button></li><li><button class="w" data-no="復11"><div class="top"><span class="no">復11</span><span class="en">first</span><span class="star">★★★</span></div><div class="ja">1番目の・最初に</div><div class="ex">Our <b>first</b> class is math.</div><div class="xj">最初の授業は算数です。</div></button></li><li><button class="w" data-no="復12"><div class="top"><span class="no">復12</span><span class="en">see – saw</span><span class="star">★★★</span></div><div class="ja">見る・会う</div><div class="ex">I <b>saw</b> a big bird in the tree.</div><div class="xj">私は木の上に大きな鳥を見ました。</div></button></li><li><button class="w" data-no="復13"><div class="top"><span class="no">復13</span><span class="en">make – made</span><span class="star">★★★</span></div><div class="ja">作る</div><div class="ex">Mom <b>made</b> a cake for my birthday.</div><div class="xj">お母さんは私の誕生日にケーキを作りました。</div></button></li><li><button class="w" data-no="復14"><div class="top"><span class="no">復14</span><span class="en">buy – bought</span><span class="star">★★★</span></div><div class="ja">買う</div><div class="ex">Dad <b>bought</b> some milk at the store.</div><div class="xj">お父さんはお店で牛乳を買いました。</div></button></li><li><button class="w" data-no="復15"><div class="top"><span class="no">復15</span><span class="en">give – gave</span><span class="star">★★★</span></div><div class="ja">あたえる・あげる</div><div class="ex">Emi <b>gave</b> some food to the cat.</div><div class="xj">エミはねこにえさをあげました。</div></button></li><li><button class="w" data-no="復16"><div class="top"><span class="no">復16</span><span class="en">meet – met</span><span class="star">★★★</span></div><div class="ja">会う</div><div class="ex">I <b>met</b> Lisa at the library.</div><div class="xj">私は図書館でリサに会いました。</div></button></li><li><button class="w" data-no="復17"><div class="top"><span class="no">復17</span><span class="en">think – thought</span><span class="star">★★★</span></div><div class="ja">思う・考える</div><div class="ex">Emi <b>thought</b> about a name for her new cat.</div><div class="xj">エミは新しいねこの名前について考えました。</div></button></li><li><button class="w" data-no="復18"><div class="top"><span class="no">復18</span><span class="en">know – knew</span><span class="star">★★★</span></div><div class="ja">知っている</div><div class="ex">Emi <b>knew</b> the answer.</div><div class="xj">エミは答えを知っていました。</div></button></li><li><button class="w" data-no="復19"><div class="top"><span class="no">復19</span><span class="en">need</span><span class="star">★★★</span></div><div class="ja">必要とする</div><div class="ex">I <b>need</b> a new notebook.</div><div class="xj">私は新しいノートが必要です。</div></button></li><li><button class="w" data-no="復20"><div class="top"><span class="no">復20</span><span class="en">work</span><span class="star">★★★</span></div><div class="ja">働く・仕事</div><div class="ex">My mother <b>works</b> at a hospital.</div><div class="xj">お母さんは病院で働いています。</div></button></li><li><button class="w" data-no="復21"><div class="top"><span class="no">復21</span><span class="en">so</span><span class="star">★★★</span></div><div class="ja">だから・それで</div><div class="ex">It was cold, <b>so</b> I wore my coat.</div><div class="xj">寒かったです。だから私はコートを着ました。</div></button></li><li><button class="w" data-no="復22"><div class="top"><span class="no">復22</span><span class="en">ask</span><span class="star">★★★</span></div><div class="ja">たずねる・たのむ</div><div class="ex">Can I <b>ask</b> you a question?</div><div class="xj">1つたずねてもいいですか。</div></button></li><li><button class="w" data-no="復23"><div class="top"><span class="no">復23</span><span class="en">problem</span><span class="star">★★★</span></div><div class="ja">問題</div><div class="ex">This math <b>problem</b> is difficult.</div><div class="xj">この算数の問題は難しいです。</div></button></li><li><button class="w" data-no="復24"><div class="top"><span class="no">復24</span><span class="en">leave – left</span><span class="star">★★★</span></div><div class="ja">出発する・置いてくる</div><div class="ex">The bus <b>left</b> at eight in the morning.</div><div class="xj">バスは朝8時に出発しました。</div></button></li><li><button class="w" data-no="復25"><div class="top"><span class="no">復25</span><span class="en">find – found</span><span class="star">★★★</span></div><div class="ja">見つける</div><div class="ex">I <b>found</b> my eraser under the desk.</div><div class="xj">私はつくえの下で消しゴムを見つけました。</div></button></li><li><button class="w" data-no="復26"><div class="top"><span class="no">復26</s
