ass="top"><span class="no">445</span><span class="en">copy</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を写す；～をコピーする</div><div class="ex">Please <b>copy</b> the sentences into your notebook.</div><div class="xj">その文をノートに写してください。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">set</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を置く；（時計など）をセットする</div><div class="ex">Emi <b>set</b> the plates on the table.</div><div class="xj">エミはテーブルに皿を置いた。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">pack</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を荷造りする；～を詰める</div><div class="ex">I <b>packed</b> for the school trip last night.</div><div class="xj">私は昨夜、修学旅行の荷造りをした。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">mix</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を混ぜる</div><div class="ex">Emi <b>mixed</b> the eggs and milk in a bowl.</div><div class="xj">エミはボウルで卵と牛乳を混ぜた。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">ocean</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">大洋；海</div><div class="ex">Many animals live in the deep <b>ocean</b>.</div><div class="xj">深い海には多くの動物がすんでいる。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">west</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">西</div><div class="ex">Our school is to the <b>west</b> of the station.</div><div class="xj">私たちの学校は駅の西にある。</div></button></li><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">novel</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小説</div><div class="ex">Lisa is reading a long <b>novel</b>.</div><div class="xj">リサは長い小説を読んでいる。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">style</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">様式；スタイル</div><div class="ex">This church is built in an old <b>style</b>.</div><div class="xj">この教会は古い様式で建てられている。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">dentist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">歯医者</div><div class="ex">I have to go to the <b>dentist</b> tomorrow.</div><div class="xj">私は明日、歯医者に行かなければならない。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">principal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">校長</div><div class="ex">The <b>principal</b> talked to all the students.</div><div class="xj">校長先生が全校生徒に話をした。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">thief</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">どろぼう</div><div class="ex">The police caught the <b>thief</b>.</div><div class="xj">警察がそのどろぼうをつかまえた。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">experiment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">実験</div><div class="ex">We did an <b>experiment</b> in science class.</div><div class="xj">私たちは理科の授業で実験をした。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">fan</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ファン；扇風機</div><div class="ex">Ken is a big <b>fan</b> of this singer.</div><div class="xj">ケンはこの歌手の大ファンだ。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">instrument</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">楽器；道具</div><div class="ex">Can you play any musical <b>instruments</b>?</div><div class="xj">あなたは何か楽器を演奏できますか。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">inventor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">発明家</div><div class="ex">The <b>inventor</b> of this machine was only fifteen.</div><div class="xj">この機械の発明家は、たった15歳だった。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">pain</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">痛み</div><div class="ex">I have a <b>pain</b> in my back.</div><div class="xj">私は背中に痛みがある。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">traffic</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">交通（量）</div><div class="ex">There was a lot of <b>traffic</b> this morning.</div><div class="xj">今朝は交通量が多かった。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">energy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">エネルギー</div><div class="ex">The sun gives us <b>energy</b>.</div><div class="xj">太陽は私たちにエネルギーを与えてくれる。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">collection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">収集；コレクション</div><div class="ex">Lisa has a big <b>collection</b> of stamps.</div><div class="xj">リサは切手の大きなコレクションを持っている。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">shape</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">形</div><div class="ex">This cookie is in the <b>shape</b> of a star.</div><div class="xj">このクッキーは星の形をしている。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">patient</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">患者</div><div class="ex">The doctor talked to the <b>patient</b>.</div><div class="xj">医者は患者と話をした。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">direction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">方向；（directions で）道順</div><div class="ex">Which <b>direction</b> should we go?</div><div class="xj">私たちはどちらの方向に行けばいいですか。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">article</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">記事</div><div class="ex">I read an interesting <b>article</b> about space.</div><div class="xj">私は宇宙についてのおもしろい記事を読んだ。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">worker</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">働く人；作業員</div><div class="ex">The <b>workers</b> at the shop are kind.</div><div class="xj">その店で働く人たちは親切だ。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">invention</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">発明（品）</div><div class="ex">The <b>invention</b> of the phone changed our lives.</div><div class="xj">電話の発明は私たちの生活を変えた。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">shy</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">内気な；恥ずかしがりの</div><div class="ex">Ken is <b>shy</b>, so he doesn&#x27;t talk much.</div><div class="xj">ケンは内気なので、あまり話さない。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">unusual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">めずらしい；ふつうでない</div><div class="ex">It is <b>unusual</b> to see snow here.</div><div class="xj">ここで雪を見るのはめずらしい。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">nearby</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">近くの</div><div class="ex">We had lunch at a <b>nearby</b> restaurant.</div><div class="xj">私たちは近くのレストランで昼食をとった。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">polite</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">礼儀正しい</div><div class="ex">Ken is always <b>polite</b> to older people.</div><div class="xj">ケンはいつも年上の人に礼儀正しい。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">final</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">最後の；決勝の</div><div class="ex">Today is the <b>final</b> day of summer vacation.</div><div class="xj">今日は夏休みの最後の日だ。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">powerful</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">強力な；力強い</div><div class="ex">This small car has a <b>powerful</b> engine.</div><div class="xj">この小さな車には強力なエンジンがついている。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">alive</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">生きている</div><div class="ex">The fish is still <b>alive</b>.</div><div class="xj">その魚はまだ生きている。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">upstairs</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">上の階へ；2階で</div><div class="ex">Ken ran <b>upstairs</b> to get his bag.</div><div class="xj">ケンはかばんを取りに上の階へ走っていった。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">clearly</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">はっきりと</div><div class="ex">Could you speak more <b>clearly</b>, please?</div><div class="xj">もっとはっきりと話していただけますか。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">ahead</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">前方に；先に</div><div class="ex">Look! There is a lake <b>ahead</b>.</div><div class="xj">見て！前方に湖がある。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">below</span><span class="ps">前</span><span class="star">★</span></div><div class="ja">～の下に；～より下に</div><div class="ex">Write your name <b>below</b> the picture.</div><div class="xj">絵の下に名前を書きなさい。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"441": 4.88, "442": 19.54, "443": 32.84, "444": 45.5, "445": 60.21, "446": 75.57, "447": 90.23, "448": 105.39, "449": 118.9, "450": 132.05, "451": 145.05, "452": 157.96, "453": 171.71, "454": 184.45, "455": 197.43, "456": 209.81, "457": 223.24, "458": 236.54, "459": 249.66, "460": 263.07, "461": 275.48, "462": 288.24, "463": 300.67, "464": 314.68, "465": 327.71, "466": 340.23, "467": 354.08, "468": 367.46, "469": 381.31, "470": 394.79, "471": 409.26, "472": 423.32, "473": 436.2,
