</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検3級　第3回</h1><div class="sub">No.81〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">notice</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に気づく</div><div class="ex">Emi <b>noticed</b> a small cat under the car.</div><div class="xj">エミは車の下の小さなネコに気づいた。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">fly</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">飛ぶ；飛行機で行く</div><div class="ex">Many birds <b>fly</b> to warm places in winter.</div><div class="xj">冬には、多くの鳥が暖かい場所へ飛んでいく。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">share</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を共有する；～を分け合う</div><div class="ex">I <b>share</b> a room with my brother.</div><div class="xj">私は弟と部屋を共有している。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">reach</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に着く；～に届く</div><div class="ex">We <b>reached</b> the station at noon.</div><div class="xj">私たちは正午に駅に着いた。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">relax</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">くつろぐ；リラックスする</div><div class="ex">On Sundays, I <b>relax</b> at home with my family.</div><div class="xj">日曜日、私は家族と家でくつろぐ。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">graduate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">卒業する</div><div class="ex">My brother will <b>graduate</b> from high school next year.</div><div class="xj">兄は来年、高校を卒業する。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">guess</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を推測する；（I guess で）～だと思う</div><div class="ex">Can you <b>guess</b> what is in this box?</div><div class="xj">この箱に何が入っているか推測できますか。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">steal</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を盗む</div><div class="ex">A monkey <b>stole</b> a banana from my bag.</div><div class="xj">サルが私のかばんからバナナを盗んだ。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">ring</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（ベル・電話が）鳴る</div><div class="ex">The phone <b>rang</b> during dinner.</div><div class="xj">夕食の間に電話が鳴った。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">skate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">スケートをする</div><div class="ex">Children were <b>skating</b> on the lake.</div><div class="xj">子どもたちが湖でスケートをしていた。</div></button></li><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">boil</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をゆでる；沸騰する</div><div class="ex"><b>Boil</b> the eggs for ten minutes.</div><div class="xj">卵を10分間ゆでてください。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">sign</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">標識；看板</div><div class="ex">The <b>sign</b> shows the way to the museum.</div><div class="xj">その標識は、博物館への道を示している。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">news</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ニュース；知らせ</div><div class="ex">Did you hear the <b>news</b> about the new teacher?</div><div class="xj">新しい先生についてのニュースを聞いた？</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">advice</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">助言；アドバイス</div><div class="ex">My coach gave me some good <b>advice</b>.</div><div class="xj">コーチは私によいアドバイスをくれた。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">plant</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">植物</div><div class="ex">Emi waters the <b>plants</b> every morning.</div><div class="xj">エミは毎朝、植物に水をやる。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">schedule</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">予定（表）；スケジュール</div><div class="ex">Let&#x27;s check the <b>schedule</b> for the school trip.</div><div class="xj">修学旅行の予定表を確認しよう。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">cafeteria</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">カフェテリア；（セルフサービスの）食堂</div><div class="ex">We eat lunch in the school <b>cafeteria</b>.</div><div class="xj">私たちは学校の食堂で昼食を食べる。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">center</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">中心；センター</div><div class="ex">A big tree stands in the <b>center</b> of the park.</div><div class="xj">公園の中心に、大きな木が立っている。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">life</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生活；人生；生命</div><div class="ex"><b>Life</b> in the city is very busy.</div><div class="xj">都会の生活はとても忙しい。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">chance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">機会；チャンス</div><div class="ex">This is a good <b>chance</b> to practice English.</div><div class="xj">これは英語を練習するよい機会だ。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">gift</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">贈り物</div><div class="ex">Ken bought a <b>gift</b> for his mother.</div><div class="xj">ケンは母への贈り物を買った。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">light</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">光；明かり</div><div class="ex">This plant needs a lot of <b>light</b>.</div><div class="xj">この植物には、たくさんの光が必要だ。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">pair</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">1組；1対</div><div class="ex">Emi bought a <b>pair</b> of gloves for winter.</div><div class="xj">エミは冬用の手ぶくろを1組買った。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">design</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">デザイン；設計</div><div class="ex">I like the <b>design</b> of this bag.</div><div class="xj">私はこのかばんのデザインが好きだ。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">score</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">得点；点数</div><div class="ex">The final <b>score</b> was 3 to 1.</div><div class="xj">最終得点は3対1だった。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">plastic</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">プラスチック；ビニール</div><div class="ex">This bottle is made of <b>plastic</b>.</div><div class="xj">このボトルはプラスチックでできている。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">clever</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">かしこい；利口な</div><div class="ex">Our dog is very <b>clever</b>.</div><div class="xj">うちの犬はとてもかしこい。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">same</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">同じ</div><div class="ex">Emi and I are in the <b>same</b> class.</div><div class="xj">エミと私は同じクラスだ。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">perfect</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">完全な；ぴったりの</div><div class="ex">Don&#x27;t worry. No one is <b>perfect</b>.</div><div class="xj">心配しないで。完全な人なんていないよ。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">low</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">低い</div><div class="ex">Ken spoke in a <b>low</b> voice.</div><div class="xj">ケンは低い声で話した。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">traditional</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">伝統的な</div><div class="ex">My grandmother taught me a <b>traditional</b> song.</div><div class="xj">祖母は私に伝統的な歌を教えてくれた。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">rich</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">金持ちの；豊かな</div><div class="ex">The man became <b>rich</b> by selling cars.</div><div class="xj">その男性は車を売って金持ちになった。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">weak</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">弱い</div><div class="ex">My grandfather&#x27;s legs are getting <b>weak</b>.</div><div class="xj">祖父の足は弱くなってきている。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">clear</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">晴れた；はっきりした</div><div class="ex">It was a <b>clear</b> day, so we went hiking.</div><div class="xj">晴れた日だったので、私たちはハイキングに行った。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">poor</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">貧しい；へたな</div><div class="ex">My grandfather was <b>poor</b> when he was young.</div><div class="xj">祖父は若いころ貧しかった。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">total</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">合計の；全体の</div><div class="ex">The <b>total</b> price is two thousand yen.</div><div class="xj">合計金額は2000円です。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">among</span><span class="ps">前</span><span class="star">★★</span></div><div class="ja">（3つ以上）の間で</div><div class="ex">This singer is popular <b>among</b> young people.</div><div class="xj">この歌手は若い人たちの間で人気がある。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">everything</span><span class="ps">代</span><span class="star">★★</span></div><div class="ja">すべてのもの；何もかも</div><div class="ex">Ken did <b>everything</b> he could for the team.</div><div class="xj">ケンはチームのために、できることをすべてやった。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">against</span><span class="ps">前</span><span class="star">★★</span></div><div class="ja">～に反対して；～に対して</div><div class="ex">Most students were <b>against</b> the new rule.</div><div class="xj">ほとんどの生徒は、新しい規則に反対していた。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">between</span><span class="ps">前</span><span class="star">★★</span></div><div class="ja">（2つ）の間に</div><div class="ex">The bank is <b>between</b> the post office and the park.</div><div class="xj">銀行は郵便局と公園の間にある。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"81": 4.69, "82": 18.42, "83": 32.64, "84": 47.5, "85": 61.92, "86": 76.91, "87": 90.54, "88": 105.99, "89": 119.48, "90": 132.55, "91": 145.27, "92": 159.35, "93": 172.86, "94": 186.18, "95": 199.78, "96": 212.64, "97": 226.46, "98": 241.82, "99": 255.8, "100": 269.24, "101": 282.94, "102": 295.49, "103": 308.25, "104": 321.3, "105": 334.55, "106": 348.03, "107": 361.61, "108":
