tton class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">pay</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（お金）を払う</div><div class="ex">I <b>paid</b> 500 yen for this notebook.</div><div class="xj">私はこのノートに500円払った。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">understand</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を理解する</div><div class="ex">I can&#x27;t <b>understand</b> this question.</div><div class="xj">私はこの問題が理解できない。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">fit</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（大きさが）～に合う</div><div class="ex">This jacket <b>fits</b> me very well.</div><div class="xj">このジャケットは私にぴったり合う。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">excuse</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を許す</div><div class="ex">Please <b>excuse</b> me for being late.</div><div class="xj">遅れたことを許してください。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">follow</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～について行く；～に従う</div><div class="ex">Please <b>follow</b> me to the meeting room.</div><div class="xj">会議室まで私について来てください。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">record</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を録音する；～を記録する</div><div class="ex">Lisa <b>recorded</b> her song on her phone.</div><div class="xj">リサは自分の歌をスマートフォンで録音した。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">born</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（be born で）生まれる</div><div class="ex">My sister was <b>born</b> in March.</div><div class="xj">妹は3月に生まれた。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">reason</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">理由</div><div class="ex">Can you tell me the <b>reason</b> you were late?</div><div class="xj">遅れた理由を教えてくれる？</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">weekday</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">平日</div><div class="ex">The library opens at nine on <b>weekdays</b>.</div><div class="xj">図書館は、平日は9時に開く。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">feeling</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">気持ち；感情</div><div class="ex">Tom doesn&#x27;t often show his <b>feelings</b>.</div><div class="xj">トムはあまり自分の気持ちを表に出さない。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">interview</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">インタビュー；面接</div><div class="ex">I watched an <b>interview</b> with a famous singer.</div><div class="xj">私は有名な歌手のインタビューを見た。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">million</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">100万</div><div class="ex">About one <b>million</b> people live in this city.</div><div class="xj">この市には約100万人が住んでいる。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">case</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">場合；入れ物（ケース）</div><div class="ex">In this <b>case</b>, you should ask your teacher.</div><div class="xj">この場合は、先生にたずねたほうがいい。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">exchange</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">交換；交流</div><div class="ex">We had a gift <b>exchange</b> at the Christmas party.</div><div class="xj">私たちはクリスマス会でプレゼント交換をした。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">meal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">食事</div><div class="ex">We have three <b>meals</b> a day.</div><div class="xj">私たちは1日に3回食事をする。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">project</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">計画；（学校の）課題</div><div class="ex">Our class started a new <b>project</b> to clean the river.</div><div class="xj">私たちのクラスは、川をきれいにする新しい計画を始めた。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">island</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">島</div><div class="ex">We took a boat to a small <b>island</b>.</div><div class="xj">私たちは船で小さな島へ行った。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">secret</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">秘密</div><div class="ex">Can you keep a <b>secret</b>?</div><div class="xj">秘密を守れる？</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">beginner</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">初心者</div><div class="ex">This tennis class is for <b>beginners</b>.</div><div class="xj">このテニス教室は初心者向けです。</div></button></li><l
