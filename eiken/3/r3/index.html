n">worry – worried</span><span class="star">★★★</span></div><div class="ja">心配する（y を i にかえて ed）</div><div class="ex">Ken <b>worried</b> about the math test.</div><div class="xj">ケンは算数のテストのことを心配しました。</div></button></li><li><button class="w" data-no="復86"><div class="top"><span class="no">復86</span><span class="en">travel</span><span class="star">★★★</span></div><div class="ja">旅行する</div><div class="ex">Mr. Brown will <b>travel</b> to Nara next month.</div><div class="xj">ブラウン先生は来月、奈良へ旅行します。</div></button></li><li><button class="w" data-no="復87"><div class="top"><span class="no">復87</span><span class="en">festival</span><span class="star">★★★</span></div><div class="ja">祭り</div><div class="ex">There is a summer <b>festival</b> in our town.</div><div class="xj">私たちの町では夏祭りがあります。</div></button></li><li><button class="w" data-no="復88"><div class="top"><span class="no">復88</span><span class="en">dish</span><span class="star">★★★</span></div><div class="ja">皿・料理</div><div class="ex">Ken washed the <b>dishes</b> after dinner.</div><div class="xj">ケンは夕ごはんのあと、皿をあらいました。</div></button></li><li><button class="w" data-no="復89"><div class="top"><span class="no">復89</span><span class="en">become</span><span class="star">★★★</span></div><div class="ja">～になる</div><div class="ex">Lisa wants to <b>become</b> a doctor.</div><div class="xj">リサは医者になりたいと思っています。</div></button></li><li><button class="w" data-no="復90"><div class="top"><span class="no">復90</span><span class="en">university</span><span class="star">★★★</span></div><div class="ja">大学</div><div class="ex">My sister studies at a <b>university</b>.</div><div class="xj">姉は大学で勉強しています。</div></button></li><li><button class="w" data-no="復91"><div class="top"><span class="no">復91</span><span class="en">idea</span><span class="star">★★★</span></div><div class="ja">考え・アイデア</div><div class="ex">That&#x27;s a good <b>idea</b>!</div><div class="xj">それはいい考えですね！</div></button></li><li><button class="w" data-no="復92"><div class="top"><span class="no">復92</span><span class="en">big – bigger – biggest</span><span class="star">★★★</span></div><div class="ja">大きい（g を重ねる）</div><div class="ex">An elephant is <b>bigger</b> than a horse.</div><div class="xj">ゾウはウマより大きいです。</div></button></li><li><button class="w" data-no="復93"><div class="top"><span class="no">復93</span><span class="en">small – smaller – smallest</span><span class="star">★★★</span></div><div class="ja">小さい</div><div class="ex">This is the <b>smallest</b> room in our house.</div><div class="xj">これは家でいちばん小さい部屋です。</div></button></li><li><button class="w" data-no="復94"><div class="top"><span class="no">復94</span><span class="en">fast – faster – fastest</span><span class="star">★★★</span></div><div class="ja">速い・速く</div><div class="ex">Tom can run <b>faster</b> than Ken.</div><div class="xj">トムはケンより速く走れます。</div></button></li><li><button class="w" data-no="復95"><div class="top"><span class="no">復95</span><span class="en">interesting – more interesting – most interesting</span><span class="star">★★★</span></div><div class="ja">おもしろい・興味深い</div><div class="ex">This book is <b>more interesting</b> than that movie.</div><div class="xj">この本はあの映画よりおもしろいです。</div></button></li><li><button class="w" data-no="復96"><div class="top"><span class="no">復96</span><span class="en">than</span><span class="star">★★★</span></div><div class="ja">～よりも</div><div class="ex">I like cats better <b>than</b> dogs.</div><div class="xj">私は犬よりねこのほうが好きです。</div></button></li><li><button class="w" data-no="復97"><div class="top"><span class="no">復97</span><span class="en">near</span><span class="star">★★★</span></div><div class="ja">近い・近くに</div><div class="ex">My house is <b>near</b> the station.</div><div class="xj">私の家は駅の近くにあります。</div></button></li><li><button class="w" data-no="復98"><div class="top"><span class="no">復98</span><span class="en">place</span><span class="star">★★★</span></div><div class="ja">場所</div><div class="ex">This park is my favorite <b>place</b>.</div><div class="xj">この公園は私のお気に入りの場所です。</div></button></li><li><button class="w" data-no="復99"><div class="top"><span class="no">復99</span><span class="en">wife</span><span class="star">★★★</span></div><div class="ja">妻</div><div class="ex">Mr. Brown&#x27;s <b>wife</b> is from France.</div><div class="xj">ブラウン先生の妻はフランスの出身です。</div></button></li><li><button class="w" data-no="復100"><div class="top"><span class="no">復100</span><span class="en">join</span><span class="star">★★★</span></div><div class="ja">参加する・加わる</div><div class="ex">Can I <b>join</b> your game?</div><div class="xj">あなたたちのゲームに参加してもいいですか。</div></button></li><li><button class="w" data-no="復101"><div class="top"><span class="no">復101</span><span class="en">invite</span><span class="star">★★★</span></div><div class="ja">招待する</div><div class="ex">Lisa <b>invited</b> me to her party.</div><div class="xj">リサが私をパーティーに招待してくれました。</div></button></li><li><button class="w" data-no="復102"><div class="top"><span class="no">復102</span><span class="en">meeting</span><span class="star">★★★</span></div><div class="ja">会議・集まり</div><div class="ex">The teachers have a <b>meeting</b> after school.</div><div class="xj">先生たちは放課後に会議があります。</div></button></li><li><button class="w" data-no="復103"><div class="top"><span class="no">復103</span><span class="en">money</span><span class="star">★★★</span></div><div class="ja">お金</div><div class="ex">I don&#x27;t have much <b>money</b>.</div><div class="xj">私はあまりお金を持っていません。</div></button></li><li><button class="w" data-no="復104"><div class="top"><span class="no">復104</span><span class="en">minute</span><span class="star">★★★</span></div><div class="ja">分</div><div class="ex">It takes ten <b>minutes</b> to walk to school.</div><div class="xj">学校まで歩いて10分かかります。</div></button></li><li><button class="w" data-no="復105"><div class="top"><span class="no">復105</span><span class="en">begin – began</span><span class="star">★★★</span></div><div class="ja">始める・始まる</div><div class="ex">We <b>began</b> our math homework after dinner.</div><div class="xj">私たちは夕ごはんのあと、算数の宿題を始めました。</div></button></li><li><button class="w" data-no="復106"><div class="top"><span class="no">復106</span><span class="en">feel – felt</span><span class="star">★★★</span></div><div class="ja">感じる</div><div class="ex">Emi <b>felt</b> cold in the morning.</div><div class="xj">エミは朝、寒く感じました。</div></button></li><li><button class="w" data-no="復107"><div class="top"><span class="no">復107</span><span class="en">sleep – slept</span><span class="star">★★★</span></div><div class="ja">ねむる</div><div class="ex">The baby <b>slept</b> for three hours.</div><div class="xj">赤ちゃんは3時間ねむりました。</div></button></li><li><button class="w" data-no="復108"><div class="top"><span class="no">復108</span><span class="en">move – moved</span><span class="star">★★★</span></div><div class="ja">引っこす・動かす（d だけつける）</div><div class="ex">Tom&#x27;s family <b>moved</b> to Osaka.</div><div class="xj">トムの家族は大阪に引っこしました。</div></button></li><li><button class="w" data-no="復109"><div class="top"><span class="no">復109</span><span class="en">clothes</span><span class="star">★★★</span></div><div class="ja">服</div><div class="ex">My mother was washing my <b>clothes</b>.</div><div class="xj">お母さんは私の服をあらっていました。</div></button></li><li><button class="w" data-no="復110"><div class="top"><span class="no">復110</span><span class="en">newspaper</span><span class="star">★★★</span></div><div class="ja">新聞</div><div class="ex">My grandfather reads the <b>newspaper</b> after breakfast.</div><div class="xj">おじいさんは朝ごはんのあとに新聞を読みます。</div></button></li><li><button class="w" data-no="復111"><div class="top"><span class="no">復111</span><span class="en">rain</span><span class="star">★★★</span></div><div class="ja">雨・雨がふる</div><div class="ex">The <b>rain</b> stopped in the afternoon.</div><div class="xj">午後に雨がやみました。</div></button></li><li><button class="w" data-no="復112"><div class="top"><span class="no">復112</span><span class="en">check</span><span class="star">★★★</span></div><div class="ja"
