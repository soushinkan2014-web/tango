class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">deliver</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を配達する</div><div class="ex">Ken <b>delivers</b> newspapers every morning.</div><div class="xj">ケンは毎朝、新聞を配達している。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">mind</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を気にする；～をいやがる</div><div class="ex">My dog doesn&#x27;t <b>mind</b> the rain at all.</div><div class="xj">私の犬は雨をまったく気にしない。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">driver</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">運転手</div><div class="ex">The bus <b>driver</b> said hello to everyone.</div><div class="xj">バスの運転手は、みんなにあいさつした。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">church</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">教会</div><div class="ex">There is an old <b>church</b> near the station.</div><div class="xj">駅の近くに古い教会がある。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">product</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">製品</div><div class="ex">This company makes <b>products</b> for babies.</div><div class="xj">この会社は赤ちゃん用の製品を作っている。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">actor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">俳優</div><div class="ex">Ken wants to become a famous <b>actor</b>.</div><div class="xj">ケンは有名な俳優になりたいと思っている。</div></button></li><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">finger</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指</div><div class="ex">Lisa cut her <b>finger</b> while she was cooking.</div><div class="xj">リサは料理をしているときに指を切った。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">boss</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">上司；社長</div><div class="ex">My mother had lunch with her <b>boss</b> today.</div><div class="xj">母は今日、上司と昼食を食べた。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">power</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">力；電力</div><div class="ex">Music has the <b>power</b> to make people happy.</div><div class="xj">音楽には人を幸せにする力がある。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">bakery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">パン屋</div><div class="ex">I bought some bread at the <b>bakery</b>.</div><div class="xj">私はパン屋でパンを買った。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">mystery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">なぞ；推理小説</div><div class="ex">Where my cat goes at night is a <b>mystery</b>.</div><div class="xj">私のネコが夜どこへ行くのかはなぞだ。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">joke</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">冗談</div><div class="ex">Tom told a funny <b>joke</b> in class.</div><div class="xj">トムは授業中におもしろい冗談を言った。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">musical</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ミュージカル</div><div class="ex">We went to see a <b>musical</b> last Sunday.</div><div class="xj">私たちはこの前の日曜日にミュージカルを見に行った。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">coin</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">硬貨</div><div class="ex">Lisa collects old <b>coins</b> from many countries.</div><div class="xj">リサはいろいろな国の古い硬貨を集めている。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">entrance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">入り口</div><div class="ex">Let&#x27;s meet at the <b>entrance</b> of the park.</div><div class="xj">公園の入り口で会おう。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">system</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">システム；仕組み</div><div class="ex">This city has a good bus <b>system</b>.</div><div class="xj">この市にはよいバスのシステムがある。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">cherry</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">サクランボ；桜</div><div class="ex">Emi put a <b>cherry</b> on top of the cake.</div><div class="xj">エミはケーキの上にサクランボをのせた。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">dolphin</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">イルカ</div><div class="ex">We saw <b>dolphins</b> swimming in the sea.</div><div class="xj">私たちはイルカが海で泳いでいるのを見た。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">earth</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地球</div><div class="ex">The <b>earth</b> goes around the sun.</div><div class="xj">地球は太陽のまわりを回っている。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">memory</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">思い出；記憶</div><div class="ex">I have many happy <b>memories</b> of this town.</div><div class="xj">私にはこの町での楽しい思い出がたくさんある。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">habit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">習慣；くせ</div><div class="ex">Reading before bed is a good <b>habit</b>.</div><div class="xj">寝る前の読書はよい習慣だ。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">winner</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">勝者；優勝者</div><div class="ex">The <b>winner</b> of the contest will get a prize.</div><div class="xj">コンテストの勝者は賞をもらえる。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">kindness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">親切（な行い）</div><div class="ex">I will never forget your <b>kindness</b>.</div><div class="xj">あなたの親切を決して忘れません。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">interest</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">興味；関心</div><div class="ex">Ken has a strong <b>interest</b> in science.</div><div class="xj">ケンは科学に強い興味を持っている。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">kid</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">子ども</div><div class="ex">The park is full of <b>kids</b> on Sundays.</div><div class="xj">日曜日の公園は子どもでいっぱいだ。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">heart</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">心臓；心</div><div class="ex">Swimming is good for your <b>heart</b>.</div><div class="xj">水泳は心臓によい。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">active</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">活動的な；活発な</div><div class="ex">My grandmother is still very <b>active</b>.</div><div class="xj">祖母は今でもとても活動的だ。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">round</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">丸い</div><div class="ex">We sat at a big <b>round</b> table.</div><div class="xj">私たちは大きな丸いテーブルについた。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">sharp</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">鋭い；よく切れる</div><div class="ex">This knife is <b>sharp</b>, so be careful.</div><div class="xj">このナイフは鋭いので、気をつけて。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">empty</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">空の；人のいない</div><div class="ex">The bottle was <b>empty</b>, so I bought another one.</div><div class="xj">びんが空だったので、私はもう1本買った。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">lonely</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">さびしい；孤独な</div><div class="ex">Emi felt <b>lonely</b> after her friend moved away.</div><div class="xj">友だちが引っ越して、エミはさびしく感じた。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">several</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">いくつかの</div><div class="ex">There are <b>several</b> parks in our town.</div><div class="xj">私たちの町にはいくつかの公園がある。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">successful</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">成功した</div><div class="ex">Our class concert was very <b>successful</b>.</div><div class="xj">私たちのクラスのコンサートは大いに成功した。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">lovely</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">すてきな；かわいらしい</div><div class="ex">Lisa lives in a <b>lovely</b> house by the sea.</div><div class="xj">リサは海辺のすてきな家に住んでいる。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">somewhere</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">どこかに</div><div class="ex">I left my umbrella <b>somewhere</b> in the school.</div><div class="xj">私は学校のどこかにかさを置き忘れた。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">perhaps</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">たぶん；もしかすると</div><div class="ex"><b>Perhaps</b> it will rain tomorrow.</div><div class="xj">たぶん明日は雨が降るだろう。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"321": 4.69, "322": 20.0, "323": 33.44, "324": 47.52, "325": 61.75, "326": 75.52, "327": 90.42, "328": 103.62, "329": 116.52, "330": 129.62, "331": 142.53, "332": 155.58, "333": 169.09, "334": 182.89, "335": 195.56, "336": 209.42, "337": 222.62, "338": 235.62, "339": 249.11, "340": 261.78, "341": 274.97, "342": 288.7, "343": 301.7, "344": 314.25, "345": 327.88, "346": 341.1, "
