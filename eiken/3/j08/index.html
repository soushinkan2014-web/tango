ss="w" data-no="熟76"><div class="top"><span class="no">熟76</span><span class="en">pick up ～</span></div><div class="ja">～を拾う、～を車で迎えに行く</div><div class="ex">My mother picked me up at the station.</div><div class="xj">母が駅まで車で迎えに来てくれた。</div></button></li><li><button class="w" data-no="熟77"><div class="top"><span class="no">熟77</span><span class="en">call ～ back</span></div><div class="ja">～に電話をかけ直す</div><div class="ex">Please call me back after dinner.</div><div class="xj">夕食のあとで電話をかけ直してね。</div></button></li><li><button class="w" data-no="熟78"><div class="top"><span class="no">熟78</span><span class="en">go on a trip</span></div><div class="ja">旅行に行く</div><div class="ex">We went on a trip to Okinawa last summer.</div><div class="xj">私たちは去年の夏、沖縄へ旅行に行った。</div></button></li><li><button class="w" data-no="熟79"><div class="top"><span class="no">熟79</span><span class="en">go abroad</span></div><div class="ja">海外に行く</div><div class="ex">My sister wants to go abroad someday.</div><div class="xj">姉はいつか海外に行きたいと思っている。</div></button></li><li><button class="w" data-no="熟80"><div class="top"><span class="no">熟80</span><span class="en">get well</span></div><div class="ja">（病気が）よくなる</div><div class="ex">I hope you get well soon.</div><div class="xj">早くよくなるといいね。</div></button></li><li><button class="w" data-no="会36"><div class="top"><span class="no">会36</span><span class="en">Hold on, please.</span></div><div class="ja">（電話で）切らずにお待ちください。</div><div class="ex">A: May I speak to Ken, please?<br>B: Sure. Hold on, please.</div></button></li><li><button class="w" data-no="会37"><div class="top"><span class="no">会37</span><span class="en">Can I leave a message?</span></div><div class="ja">伝言をお願いできますか。</div><div class="ex">A: Sorry, Emma is out now.<br>B: OK. Can I leave a message?</div></button></li><li><button class="w" data-no="会38"><div class="top"><span class="no">会38</span><span class="en">May I speak to ～?</span></div><div class="ja">（電話で）～さんをお願いします。</div><div class="ex">A: Hello. May I speak to Lisa?<br>B: Sorry, she isn&#x27;t home now.</div></button></li><li><button class="w" data-no="会39"><div class="top"><span class="no">会39</span><span class="en">Speaking.</span></div><div class="ja">（電話で）私です。</div><div class="ex">A: Hello. May I speak to Mr. Brown?<br>B: Speaking.</div></button></li><li><button class="w" data-no="会40"><div class="top"><span class="no">会40</span><span class="en">I&#x27;ll call you back.</span></div><div class="ja">かけ直します。</div><div class="ex">A: Sorry, I&#x27;m cooking dinner now. I&#x27;ll call you back.<br>B: OK. Talk to you later.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j07/">← 熟語 Set 7</a><a href="../j09/">熟語 Set 9 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟71": 5.1, "熟72": 18.56, "熟73": 32.31, "熟74": 44.88, "熟75": 57.84, "熟76": 71.1, "熟77": 86.48, "熟78": 100.28, "熟79": 113.98, "熟80": 127.42, "会36": 140.01, "会37": 159.32, "会38": 178.61, "会39": 197.52, "会40": 214.14}, "TE": {"熟71": 6.97, "熟72": 20.43, "熟73": 34.18, "熟74": 46.68, "熟75": 59.73, "熟76": 72.98, "熟77": 88.43, "熟78": 102.3, "熟79": 115.95, "熟80": 129.29, "会36": 142.41, "会37": 161.58, "会38": 180.68, "会39": 199.39, "会40": 216.37}, "Q": [["熟71", "give up", "あきらめる"], ["熟72", "grow up", "成長する、大人になる"], ["熟73", "wake up", "目を覚ます"], ["熟74", "hurry up", "急ぐ"], ["熟75", "run away", "逃げる"], ["熟76", "pick up ～", "～を拾う、～を車で迎えに行く"], ["熟77", "call ～ back", "～に電話をかけ直す"], ["熟78", "go on a trip", "旅行に行く"], ["熟79", "go abroad", "海外に行く"], ["熟80", "get well", "よくなる"], ["会36", "Hold on, please.", "切らずにお待ちください。"], ["会37", "Can I leave a message?", "伝言をお願いできますか。"], ["会38", "May I speak to ～?", "～さんをお願いします。"], ["会39", "Speaking.", "私です。"], ["会40", "I'll call you back.", "かけ直します。"]], "KEY": "e3-j08"};</script><script src="../../../app.js?v=2"></script></body></html>
