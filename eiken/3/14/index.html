v class="top"><span class="no">525</span><span class="en">print</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を印刷する</div><div class="ex">Can you <b>print</b> this page for me?</div><div class="xj">このページを印刷してくれますか。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">temperature</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">温度；気温</div><div class="ex">The water <b>temperature</b> is about 20 degrees.</div><div class="xj">水の温度は約20度だ。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">ceremony</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">式；式典</div><div class="ex">The opening <b>ceremony</b> starts at nine.</div><div class="xj">開会式は9時に始まる。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">title</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">題名；タイトル</div><div class="ex">What is the <b>title</b> of this book?</div><div class="xj">この本の題名は何ですか。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">speed</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">速さ；スピード</div><div class="ex">The ball flew at great <b>speed</b>.</div><div class="xj">ボールはすごい速さで飛んだ。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">chef</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">シェフ；料理人</div><div class="ex">The <b>chef</b> made a special cake for us.</div><div class="xj">シェフが私たちのために特別なケーキを作ってくれた。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">countryside</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">いなか；田園地帯</div><div class="ex">We enjoyed a quiet weekend in the <b>countryside</b>.</div><div class="xj">私たちはいなかで静かな週末を楽しんだ。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">tool</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">道具</div><div class="ex">My father keeps his <b>tools</b> in a box.</div><div class="xj">父は道具を箱にしまっている。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">smartphone</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">スマートフォン</div><div class="ex">Many students have a <b>smartphone</b> now.</div><div class="xj">今では多くの生徒がスマートフォンを持っている。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">safety</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">安全</div><div class="ex">For your <b>safety</b>, please wear a helmet.</div><div class="xj">安全のため、ヘルメットをかぶってください。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">sentence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">文</div><div class="ex">Please read the first <b>sentence</b> aloud.</div><div class="xj">最初の文を声に出して読んでください。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">apartment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">アパート；マンション</div><div class="ex">We live in an <b>apartment</b> near the station.</div><div class="xj">私たちは駅の近くのアパートに住んでいる。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">champion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">チャンピオン；優勝者</div><div class="ex">Ken became the tennis <b>champion</b> of our city.</div><div class="xj">ケンは私たちの市のテニスのチャンピオンになった。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">trash</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ごみ</div><div class="ex">Please put your <b>trash</b> in this box.</div><div class="xj">ごみはこの箱に入れてください。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">teenager</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">10代の若者</div><div class="ex">This book is popular among <b>teenagers</b>.</div><div class="xj">この本は10代の若者に人気がある。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">top</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">頂上；いちばん上</div><div class="ex">We reached the <b>top</b> of the mountain.</div><div class="xj">私たちは山の頂上に着いた。</div></button></li><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">middle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">真ん中</div><div class="ex">Emi stood in the <b>middle</b> of the stage.</div><div class="xj">エミはステージの真ん中に立った。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">engineer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">技師；エンジニア</div><div class="ex">My brother works as an <b>engineer</b>.</div><div class="xj">兄は技師として働いている。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">screen</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">画面；スクリーン</div><div class="ex">The <b>screen</b> of my smartphone is broken.</div><div class="xj">私のスマートフォンの画面が割れている。</div></button></li><li><button class="w" data-no="544"><d
