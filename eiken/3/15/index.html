</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検3級　第15回</h1><div class="sub">No.561〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">act</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">行動する；演じる</div><div class="ex">Ken always <b>acts</b> like a big brother.</div><div class="xj">ケンはいつもお兄さんのように行動する。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">download</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をダウンロードする</div><div class="ex">I <b>downloaded</b> a new game last night.</div><div class="xj">私は昨夜、新しいゲームをダウンロードした。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">kick</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をける</div><div class="ex">Ken <b>kicked</b> the ball into the goal.</div><div class="xj">ケンはボールをけってゴールに入れた。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">blow</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（風が）吹く；～を吹く</div><div class="ex">A cold wind was <b>blowing</b> from the north.</div><div class="xj">北から冷たい風が吹いていた。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">explore</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を探検する</div><div class="ex">We <b>explored</b> the old castle.</div><div class="xj">私たちは古い城を探検した。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">bite</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をかむ</div><div class="ex">Be careful! That dog may <b>bite</b> you.</div><div class="xj">気をつけて！あの犬はあなたをかむかもしれない。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">melt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">とける</div><div class="ex">The snow <b>melted</b> in the sun.</div><div class="xj">日なたで雪がとけた。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">hill</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">丘</div><div class="ex">We climbed a small <b>hill</b> near the school.</div><div class="xj">私たちは学校の近くの小さな丘に登った。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">firework</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">花火</div><div class="ex">We watched <b>fireworks</b> by the river.</div><div class="xj">私たちは川辺で花火を見た。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">soldier</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">兵士</div><div class="ex">This old story is about a brave <b>soldier</b>.</div><div class="xj">この昔話は勇敢な兵士の話だ。</div></button></li><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">furniture</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">家具</div><div class="ex">We bought some new <b>furniture</b> for our house.</div><div class="xj">私たちは家に新しい家具を買った。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">land</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">陸地；土地</div><div class="ex">Frogs can live on <b>land</b> and in water.</div><div class="xj">カエルは陸地でも水中でも生きられる。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">pond</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">池</div><div class="ex">There are many fish in the <b>pond</b>.</div><div class="xj">池にはたくさんの魚がいる。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">electricity</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">電気</div><div class="ex">Please don&#x27;t use too much <b>electricity</b>.</div><div class="xj">電気を使いすぎないでください。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">treasure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宝物</div><div class="ex">The children looked for <b>treasure</b> on the beach.</div><div class="xj">子どもたちは浜辺で宝物を探した。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">stairs</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">階段</div><div class="ex">Tom ran up the <b>stairs</b>.</div><div class="xj">トムは階段をかけ上がった。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">insect</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">昆虫</div><div class="ex">Ken likes to catch <b>insects</b> in summer.</div><div class="xj">ケンは夏に昆虫をつかまえるのが好きだ。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">sunset</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">日没；夕焼け</div><div class="ex">We came home before <b>sunset</b>.</div><div class="xj">私たちは日没前に帰宅した。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">film</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">映画；フィルム</div><div class="ex">Ken and I watched a French <b>film</b> last night.</div><div class="xj">ケンと私は昨夜、フランスの映画を見た。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">scenery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">景色；風景</div><div class="ex">The <b>scenery</b> from the hill was beautiful.</div><div class="xj">丘からの景色は美しかった。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">crowd</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">群衆；人ごみ</div><div class="ex">A large <b>crowd</b> watched the parade.</div><div class="xj">大勢の群衆がパレードを見た。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">magic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">魔法；手品</div><div class="ex">In the story, the girl uses <b>magic</b> to fly.</div><div class="xj">その物語では、少女は魔法を使って空を飛ぶ。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">hero</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">英雄；ヒーロー</div><div class="ex">Ken became the <b>hero</b> of the game.</div><div class="xj">ケンはその試合のヒーローになった。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">firefighter</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">消防士</div><div class="ex">A <b>firefighter</b> came to our school and talked to us.</div><div class="xj">消防士が学校に来て、私たちに話をしてくれた。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">heat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">暑さ；熱</div><div class="ex">Many people stayed home because of the <b>heat</b>.</div><div class="xj">暑さのため、多くの人が家にいた。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">desert</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">砂漠</div><div class="ex">It is very hot and dry in the <b>desert</b>.</div><div class="xj">砂漠はとても暑くて乾燥している。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">midnight</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">真夜中；夜の12時</div><div class="ex">Ken studied until <b>midnight</b> last night.</div><div class="xj">ケンは昨夜、真夜中まで勉強した。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">storm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">嵐</div><div class="ex">The <b>storm</b> stopped the trains.</div><div class="xj">嵐で電車が止まった。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">flavor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">味；風味</div><div class="ex">Which <b>flavor</b> of ice cream do you like?</div><div class="xj">アイスクリームはどの味が好きですか。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">hole</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">穴</div><div class="ex">The dog dug a <b>hole</b> in the garden.</div><div class="xj">犬が庭に穴をほった。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">coast</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">海岸；沿岸</div><div class="ex">We drove along the <b>coast</b>.</div><div class="xj">私たちは海岸に沿って車で走った。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">quiz</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">クイズ；小テスト</div><div class="ex">Let&#x27;s have a <b>quiz</b> about animals!</div><div class="xj">動物についてのクイズをしよう！</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">dinosaur</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">恐竜</div><div class="ex">We saw a big <b>dinosaur</b> at the museum.</div><div class="xj">私たちは博物館で大きな恐竜を見た。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">scared</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">おびえた；こわがった</div><div class="ex">The <b>scared</b> cat ran under the bed.</div><div class="xj">おびえたネコはベッドの下に逃げこんだ。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">cheerful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">元気のいい；陽気な</div><div class="ex">Emi is always <b>cheerful</b> and kind.</div><div class="xj">エミはいつも元気がよくて親切だ。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">tiny</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">とても小さい</div><div class="ex">The baby has <b>tiny</b> hands.</div><div class="xj">その赤ちゃんの手はとても小さい。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">electric</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">電気の；電動の</div><div class="ex">My father bought an <b>electric</b> car.</div><div class="xj">父は電気自動車を買った。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">northern</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">北の</div><div class="ex">It snows a lot in <b>northern</b> Japan.</div><div class="xj">日本の北の地方では雪がたくさん降る。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">outdoors</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">屋外で</div><div class="ex">We had lunch <b>outdoors</b> because it was sunny.</div><div class="xj">晴れていたので、私たちは屋外で昼食を食べた。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">happily</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">楽しく；幸せに</div><div class="ex">The children played <b>happily</b> in the park.</div><div class="xj">子どもたちは公園で楽しく遊んだ。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../14/">← 第14回</a><a href="../j01/">熟語 Set 1 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"561": 4.81, "562": 18.34, "563": 32.21, "564": 45.19, "565": 59.52, "566": 72.83, "567": 87.23, "568": 99.75, "569": 112.71, "570": 125.64, "571": 138.91, "572": 152.22, "573": 165.83, "574": 178.47, "575": 191.81, "576": 204.84, "577": 217.48, "578": 230.46, "579": 243.83, "580": 257.24, "581": 270.82, "582": 284.38, "583": 298.7, "584": 311.97, "585": 326.0, "586": 339.51, "587": 352.42, "588": 366.62, "589": 379.27, "590": 392.22, "591": 405.04, "592": 417.9, "593": 431.21, "594": 444.46, "595": 458.16, "596": 471.98, "597": 484.81, "59
