6"><div class="top"><span class="no">熟66</span><span class="en">put on ～</span></div><div class="ja">～を着る、身につける</div><div class="ex">Put on your coat. It&#x27;s cold outside.</div><div class="xj">コートを着なさい。外は寒いよ。</div></button></li><li><button class="w" data-no="熟67"><div class="top"><span class="no">熟67</span><span class="en">take off ～</span></div><div class="ja">～を脱ぐ</div><div class="ex">Please take off your shoes here.</div><div class="xj">ここでくつを脱いでください。</div></button></li><li><button class="w" data-no="熟68"><div class="top"><span class="no">熟68</span><span class="en">try on ～</span></div><div class="ja">～を試着する</div><div class="ex">Can I try on this shirt?</div><div class="xj">このシャツを試着してもいいですか。</div></button></li><li><button class="w" data-no="熟69"><div class="top"><span class="no">熟69</span><span class="en">turn off ～</span></div><div class="ja">～（電気など）を消す</div><div class="ex">Turn off the TV and go to bed.</div><div class="xj">テレビを消して寝なさい。</div></button></li><li><button class="w" data-no="熟70"><div class="top"><span class="no">熟70</span><span class="en">turn down ～</span></div><div class="ja">～（音量など）を下げる</div><div class="ex">Could you turn down the music?</div><div class="xj">音楽の音量を下げてくれますか。</div></button></li><li><button class="w" data-no="会31"><div class="top"><span class="no">会31</span><span class="en">I hope so.</span></div><div class="ja">そうだといいね。</div><div class="ex">A: Will it be sunny tomorrow?<br>B: I hope so.</div></button></li><li><button class="w" data-no="会32"><div class="top"><span class="no">会32</span><span class="en">I&#x27;m afraid not.</span></div><div class="ja">残念ながらそうではないと思う。</div><div class="ex">A: Do you have this shirt in blue?<br>B: I&#x27;m afraid not.</div></button></li><li><button class="w" data-no="会33"><div class="top"><span class="no">会33</span><span class="en">Of course.</span></div><div class="ja">もちろん。</div><div class="ex">A: Can I use your pen?<br>B: Of course.</div></button></li><li><button class="w" data-no="会34"><div class=
