on class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">return</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">帰る；～を返す</div><div class="ex">My father <b>returned</b> home late last night.</div><div class="xj">父は昨夜遅く、家に帰った。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">sound</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に聞こえる；～のように思われる</div><div class="ex">Your voice <b>sounds</b> different on the phone.</div><div class="xj">電話だと、あなたの声は違って聞こえる。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">wish</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を願う；～であればいいのにと思う</div><div class="ex">We all <b>wish</b> for peace in the world.</div><div class="xj">私たちはみな、世界の平和を願っている。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">repeat</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をくり返す</div><div class="ex">Could you <b>repeat</b> the question, please?</div><div class="xj">質問をくり返していただけますか。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">calendar</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">カレンダー</div><div class="ex">I wrote my friend&#x27;s birthday on the <b>calendar</b>.</div><div class="xj">私は友だちの誕生日をカレンダーに書いた。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">south</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">南</div><div class="ex">Our school is in the <b>south</b> of the city.</div><div class="xj">私たちの学校は市の南にある。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">passenger</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">乗客</div><div class="ex">There were many <b>passengers</b> on the bus.</div><div class="xj">バスにはたくさんの乗客がいた。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">designer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">デザイナー</div><div class="ex">Emi&#x27;s dream is to become a <b>designer</b>.</div><div class="xj">エミの夢はデザイナーになることだ。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">purpose</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">目的</div><div class="ex">What is the <b>purpose</b> of your trip?</div><div class="xj">あなたの旅行の目的は何ですか。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">danger</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">危険</div><div class="ex">Some people don&#x27;t know the <b>danger</b> of the sea.</div><div class="xj">海の危険を知らない人もいる。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">choice</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">選択；選んだもの</div><div class="ex">I think you made a good <b>choice</b>.</div><div class="xj">あなたはよい選択をしたと思う。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">field</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">野原；（運動）場</div><div class="ex">Cows were eating grass in the <b>field</b>.</div><div class="xj">牛が野原で草を食べていた。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">meaning</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">意味</div><div class="ex">What is the <b>meaning</b> of this word?</div><div class="xj">この単語の意味は何ですか。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">difference</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">違い</div><div class="ex">What is the <b>difference</b> between these two cameras?</div><div class="xj">この2つのカメラの違いは何ですか。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">trouble</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">困ったこと；もめごと</div><div class="ex">If you have any <b>trouble</b>, please call me.</div><div class="xj">何か困ったことがあれば、電話してください。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">percent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">パーセント</div><div class="ex">About 30 <b>percent</b> of the students walk to school.</div><div class="xj">生徒の約30パーセントが歩いて通学している。</div></button></li><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">hall</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ホール；会館</div><div class="ex">The concert was in a big <b>hall</b>.</div><div class="xj">コンサートは大きなホールで行われた。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">passport</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">パスポート</div><div class="ex">Don&#x27;t forget your <b>passport</b> when you travel abroad.</div><div class="xj">外国旅行のときは、パスポートを忘れないで。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">blanket</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">毛布</div><div class="ex">It&#x27;s cold, so I need another <b>blanket</b>.</div><div class="xj">寒いので、もう1枚毛布が必要だ。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">drama</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ドラマ；劇</div><div class="ex">I watched a funny TV <b>drama</b> last night.</div><div class="xj">昨夜、おもしろいテレビドラマを見た。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">chopsticks</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">はし</div><div class="ex">Tom can use <b>chopsticks</b> very well.</div><div class="xj">トムははしをとても上手に使える。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">dress</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ドレス；服装</div><div class="ex">Emi wore a white <b>dress</b> to the party.</div><div class="xj">エミはパーティーに白いドレスを着ていった。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">curtain</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">カーテン</div><div class="ex">Mom opened the <b>curtains</b> to let the sun in.</div><div class="xj">母は日光を入れるためにカーテンを開けた。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">tent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">テント</div><div class="ex">We slept in a <b>tent</b> by the lake.</div><div class="xj">私たちは湖のそばのテントで寝た。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">couple</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">1組；夫婦</div><div class="ex">An old <b>couple</b> lives next to our house.</div><div class="xj">私たちの家の隣に、年配の夫婦が住んでいる。</div></button></li><li><button class="w" data-no="190"><div
