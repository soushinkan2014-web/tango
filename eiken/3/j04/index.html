xj">あなたの夢がかなうといいですね。</div></button></li><li><button class="w" data-no="熟36"><div class="top"><span class="no">熟36</span><span class="en">make a mistake</span></div><div class="ja">間違える</div><div class="ex">Don&#x27;t be afraid of making mistakes.</div><div class="xj">間違えることをこわがらないで。</div></button></li><li><button class="w" data-no="熟37"><div class="top"><span class="no">熟37</span><span class="en">the same as ～</span></div><div class="ja">～と同じ</div><div class="ex">My bag is the same as yours.</div><div class="xj">私のかばんはあなたのと同じだ。</div></button></li><li><button class="w" data-no="熟38"><div class="top"><span class="no">熟38</span><span class="en">be able to ～</span></div><div class="ja">～することができる</div><div class="ex">My brother was able to swim 100 meters.</div><div class="xj">兄は100メートル泳ぐことができた。</div></button></li><li><button class="w" data-no="熟39"><div class="top"><span class="no">熟39</span><span class="en">leave a message</span></div><div class="ja">伝言を残す</div><div class="ex">Ken wasn&#x27;t at home, so I left a message.</div><div class="xj">ケンは家にいなかったので、私は伝言を残した。</div></button></li><li><button class="w" data-no="熟40"><div class="top"><span class="no">熟40</span><span class="en">spend A on B</span></div><div class="ja">BにA（お金・時間）を使う</div><div class="ex">I spent 1,000 yen on comic books.</div><div class="xj">私はマンガに1,000円使った。</div></button></li><li><button class="w" data-no="会16"><div class="top"><span class="no">会16</span><span class="en">Have you ever been to ～?</span></div><div class="ja">～に行ったことはある？</div><div class="ex">A: Have you ever been to Hokkaido?<br>B: Yes. I went there last winter.</div></button></li><li><button class="w" data-no="会17"><div class="top"><span class="no">会17</span><span class="en">How often ～?</span></div><div class="ja">どのくらいの頻度で～？</div><div class="ex">A: How often do you play tennis?<br>B: Twice a week.</div></button></li><li><button class="w" data-no="会18"><div class="top"><span class="no">会18</span><span class="en">How long ～?</span></div>
