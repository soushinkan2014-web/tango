</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検3級　新しい意味</h1><div class="sub">新1〜新21</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../n.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="新1"><div class="top"><span class="no">新1</span><span class="en">free</span><span class="ps">形</span></div><div class="xj">知っている意味：ひまな</div><div class="ja">無料の</div><div class="ex">You can get a <b>free</b> ticket at the station.</div><div class="xj">駅で無料のチケットがもらえます。</div></button></li><li><button class="w" data-no="新2"><div class="top"><span class="no">新2</span><span class="en">watch</span><span class="ps">名</span></div><div class="xj">知っている意味：（テレビなどを）見る</div><div class="ja">腕時計</div><div class="ex">My grandfather gave me a new <b>watch</b>.</div><div class="xj">祖父が私に新しい腕時計をくれた。</div></button></li><li><button class="w" data-no="新3"><div class="top"><span class="no">新3</span><span class="en">well</span><span class="ps">形</span></div><div class="xj">知っている意味：上手に</div><div class="ja">元気な；体調がよい</div><div class="ex">Lisa went to bed early because she wasn&#x27;t <b>well</b>.</div><div class="xj">リサは体調がよくなかったので、早く寝た。</div></button></li><li><button class="w" data-no="新4"><div class="top"><span class="no">新4</span><span class="en">catch</span><span class="ps">動</span></div><div class="xj">知っている意味：つかまえる</div><div class="ja">（かぜ）をひく；（電車など）に間に合う</div><div class="ex">Wear a coat, or you&#x27;ll <b>catch</b> a cold.</div><div class="xj">コートを着ないと、かぜをひくよ。</div></button></li><li><button class="w" data-no="新5"><div class="top"><span class="no">新5</span><span class="en">well</span><span class="ps">間</span></div><div class="xj">知っている意味：上手に</div><div class="ja">ええと；さて</div><div class="ex"><b>Well</b>, let me think about it for a minute.</div><div class="xj">ええと、少し考えさせてね。</div></button></li><li><button class="w" data-no="新6"><div class="top"><span class="no">新6</span><span class="en">pass</span><span class="ps">動</span></div><div class="xj">知っている意味：手わたす</div><div class="ja">（試験）に合格する</div><div class="ex">Tom was happy because he <b>passed</b> the swimming test.</div><div class="xj">トムは水泳のテストに合格したので、うれしかった。</div></button></li><li><button class="w" data-no="新7"><div class="top"><span class="no">新7</span><span class="en">break</span><span class="ps">動</span></div><div class="xj">知っている意味：こわす</div><div class="ja">（約束など）を破る</div><div class="ex">Lisa never <b>breaks</b> her promises to her friends.</div><div class="xj">リサは友だちとの約束を決して破らない。</div></button></li><li><button class="w" data-no="新8"><div class="top"><span class="no">新8</span><span class="en">see</span><span class="ps">動</span></div><div class="xj">知っている意味：見る；会う</div><div class="ja">（医者など）にみてもらう</div><div class="ex">If you still feel sick, <b>see</b> a doctor.</div><div class="xj">まだ気分が悪いなら、医者にみてもらいなさい。</div></button></li><li><button class="w" data-no="新9"><div class="top"><span class="no">新9</span><span class="en">hard</span><span class="ps">副</span></div><div class="xj">知っている意味：難しい；熱心に</div><div class="ja">激しく</div><div class="ex">It snowed <b>hard</b> all night in the mountains.</div><div class="xj">山では一晩中、雪が激しく降った。</div></button></li><li><button class="w" data-no="新10"><div class="top"><span class="no">新10</span><span class="en">fall</span><span class="ps">動</span></div><div class="xj">知っている意味：秋</div><div class="ja">落ちる；転ぶ</div><div class="ex">Many leaves <b>fell</b> from the trees in the park.</div><div class="xj">公園の木からたくさんの葉が落ちた。</div></button></li><li><button class="w" data-no="新11"><div class="top"><span class="no">新11</span><span class="en">close</span><span class="ps">形</span></div><div class="xj">知っている意味：閉める</div><div class="ja">近い；親しい</div><div class="ex">Our school is <b>close</b> to a big park.</div><div class="xj">私たちの学校は大きな公園に近い。</div></button></li><li><button class="w" data-no="新12"><div class="top"><span class="no">新12</span><span class="en">park</span><span class="ps">動</span></div><div class="xj">知っている意味：公園</div><div class="ja">（車）を駐車する</div><div class="ex">You can&#x27;t <b>park</b> your car in front of the store.</div><div class="xj">店の前に車を駐車することはできません。</div></button></li><li><button class="w" data-no="新13"><div class="top"><span class="no">新13</span><span class="en">just</span><span class="ps">副</span></div><div class="xj">知っている意味：ちょうど；ほんの</div><div class="ja">たった今（～したところ）</div><div class="ex">I have <b>just</b> finished my homework.</div><div class="xj">私はたった今宿題を終えたところだ。</div></button></li><li><button class="w" data-no="新14"><div class="top"><span class="no">新14</span><span class="en">show</span><span class="ps">名</span></div><div class="xj">知っている意味：見せる</div><div class="ja">ショー；（テレビ）番組</div><div class="ex">We watched a funny TV <b>show</b> last night.</div><div class="xj">私たちは昨夜、おもしろいテレビ番組を見た。</div></button></li><li><button class="w" data-no="新15"><div class="top"><span class="no">新15</span><span class="en">right</span><span class="ps">副</span></div><div class="xj">知っている意味：右；正しい</div><div class="ja">ちょうど；すぐ</div><div class="ex">The bus stop is <b>right</b> in front of the library.</div><div class="xj">バス停は図書館のすぐ前にある。</div></button></li><li><button class="w" data-no="新16"><div class="top"><span class="no">新16</span><span class="en">glass</span><span class="ps">名</span></div><div class="xj">知っている意味：ガラス；コップ</div><div class="ja">（glassesで）めがね</div><div class="ex">My father can&#x27;t read the newspaper without his <b>glasses</b>.</div><div class="xj">父はめがねがないと新聞が読めない。</div></button></li><li><button class="w" data-no="新17"><div class="top"><span class="no">新17</span><span class="en">still</span><span class="ps">副</span></div><div class="xj">知っている意味：まだ；今でも</div><div class="ja">それでも</div><div class="ex">It was raining, but we <b>still</b> enjoyed the game.</div><div class="xj">雨が降っていたが、それでも私たちは試合を楽しんだ。</div></button></li><li><button class="w" data-no="新18"><div class="top"><span class="no">新18</span><span class="en">pretty</span><span class="ps">副</span></div><div class="xj">知っている意味：きれいな；かわいい</div><div class="ja">かなり</div><div class="ex">This math problem is <b>pretty</b> difficult for me.</div><div class="xj">この数学の問題は、私にはかなり難しい。</div></button></li><li><button class="w" data-no="新19"><div class="top"><span class="no">新19</span><span class="en">last</span><span class="ps">動</span></div><div class="xj">知っている意味：最後の；この前の</div><div class="ja">続く</div><div class="ex">The school festival will <b>last</b> for three days.</div><div class="xj">文化祭は3日間続く予定だ。</div></button></li><li><button class="w" data-no="新20"><div class="top"><span class="no">新20</span><span class="en">work</span><span class="ps">動</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">（機械などが）動く；うまくいく</div><div class="ex">My old computer doesn&#x27;t <b>work</b> anymore.</div><div class="xj">私の古いコンピューターは、もう動かない。</div></button></li><li><button class="w" data-no="新21"><div class="top"><span class="no">新21</span><span class="en">play</span><span class="ps">名</span></div><div class="xj">知っている意味：（スポーツを）する；（楽器を）ひく</div><div class="ja">劇</div><div class="ex">Ken&#x27;s class practiced a <b>play</b> for the festival.</div><div class="xj">ケンのクラスは文化祭のために劇を練習した。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../r4/">← 復習 第4回</a><a href="../01/">第1回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"新1": 4.81, "新2": 17.65, "新3": 30.65, "新4": 45.14, "新5": 60.09, "新6": 73.31, "新7":
