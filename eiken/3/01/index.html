</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検3級　第1回</h1><div class="sub">No.1〜40</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">grow</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">成長する；～を育てる</div><div class="ex">Our puppy <b>grew</b> very fast this year.</div><div class="xj">うちの子犬は、今年とても速く成長した。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">keep</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を持ち続ける；～を（ある状態に）保つ</div><div class="ex">I still <b>keep</b> the letter from my grandmother.</div><div class="xj">私は祖母からの手紙を今も持ち続けている。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">pick</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をつむ；～を選ぶ</div><div class="ex">Emi <b>picked</b> some flowers in the garden.</div><div class="xj">エミは庭で花をつんだ。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">spend</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（時間・お金）を使う；～を過ごす</div><div class="ex">Ken <b>spent</b> all his money on comic books.</div><div class="xj">ケンはお金を全部マンガに使った。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">build</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を建てる</div><div class="ex">My uncle <b>built</b> a small house by the sea.</div><div class="xj">おじは海のそばに小さな家を建てた。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">hold</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を手に持つ；（会など）を開く</div><div class="ex">The girl was <b>holding</b> a big balloon.</div><div class="xj">その女の子は大きな風船を手に持っていた。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">collect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を集める</div><div class="ex">Ken <b>collects</b> old coins from many countries.</div><div class="xj">ケンはいろいろな国の古いコインを集めている。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">cost</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（費用が）かかる</div><div class="ex">It <b>costs</b> 500 yen to enter the museum.</div><div class="xj">その博物館に入るのに500円かかる。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">perform</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を演じる；～を演奏する</div><div class="ex">Our class <b>performed</b> a play at the school festival.</div><div class="xj">私たちのクラスは文化祭で劇を演じた。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">rise</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">上がる；（太陽が）のぼる</div><div class="ex">The price of vegetables <b>rose</b> last month.</div><div class="xj">先月、野菜の値段が上がった。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">order</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を注文する</div><div class="ex">I <b>ordered</b> a pizza for dinner.</div><div class="xj">私は夕食にピザを注文した。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">way</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">道；方法</div><div class="ex">Could you tell me the <b>way</b> to the station?</div><div class="xj">駅へ行く道を教えていただけますか。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">internet</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">インターネット</div><div class="ex">I often use the <b>internet</b> to study English.</div><div class="xj">私は英語を勉強するのに、よくインターネットを使う。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">company</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">会社</div><div class="ex">My mother works for a computer <b>company</b>.</div><div class="xj">母はコンピューターの会社で働いている。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">piece</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">1つ；1切れ</div><div class="ex">Emi gave me a <b>piece</b> of chocolate.</div><div class="xj">エミは私にチョコレートを1つくれた。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">fact</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">事実</div><div class="ex">It is a <b>fact</b> that the earth is round.</div><div class="xj">地球が丸いというのは事実だ。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">matter</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">問題；困ったこと</div><div class="ex">This is an important <b>matter</b> for our club.</div><div class="xj">これは私たちの部にとって大切な問題だ。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">website</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ウェブサイト</div><div class="ex">You can buy tickets on our <b>website</b>.</div><div class="xj">チケットは私たちのウェブサイトで買えます。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">special</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">特別な</div><div class="ex">We had a <b>special</b> lunch on my birthday.</div><div class="xj">私の誕生日に、特別な昼食を食べた。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">dangerous</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">危険な</div><div class="ex">It is <b>dangerous</b> to swim in this river.</div><div class="xj">この川で泳ぐのは危険だ。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">enough</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">十分な</div><div class="ex">We have <b>enough</b> food for the camp.</div><div class="xj">私たちには、キャンプのための十分な食べ物がある。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">proud</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">誇りに思っている</div><div class="ex">Tom&#x27;s parents are <b>proud</b> of him.</div><div class="xj">トムの両親は彼を誇りに思っている。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">able</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（be able to ～で）～することができる</div><div class="ex">Lisa was <b>able</b> to swim fifty meters.</div><div class="xj">リサは50メートル泳ぐことができた。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">professional</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">プロの；専門的な</div><div class="ex">Ken wants to be a <b>professional</b> soccer player.</div><div class="xj">ケンはプロのサッカー選手になりたいと思っている。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">silent</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">静かな；だまっている</div><div class="ex">The classroom was <b>silent</b> during the test.</div><div class="xj">テストの間、教室は静かだった。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">deep</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">深い</div><div class="ex">The lake near my house is very <b>deep</b>.</div><div class="xj">家の近くの湖はとても深い。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">afraid</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">こわがって；心配して</div><div class="ex">My little brother is <b>afraid</b> of dogs.</div><div class="xj">弟は犬をこわがっている。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">true</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">本当の</div><div class="ex">Is it <b>true</b> that Ken is leaving our school?</div><div class="xj">ケンが転校するというのは本当なの？</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">crowded</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">混雑した</div><div class="ex">The train was very <b>crowded</b> this morning.</div><div class="xj">今朝、電車はとても混雑していた。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">yet</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">（否定文で）まだ；（疑問文で）もう</div><div class="ex">I haven&#x27;t finished my homework <b>yet</b>.</div><div class="xj">私はまだ宿題を終えていない。</div></button></li><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">into</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～の中へ</div><div class="ex">The cat ran <b>into</b> the house.</div><div class="xj">ネコは家の中へ走っていった。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">while</span><span class="ps">接</span><span class="star">★★★</span></div><div class="ja">～する間に</div><div class="ex">My mother called me <b>while</b> I was taking a bath.</div><div class="xj">私がおふろに入っている間に、母が電話してきた。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">through</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～を通り抜けて；～を通して</div><div class="ex">We walked <b>through</b> the park to the station.</div><div class="xj">私たちは公園を通り抜けて駅まで歩いた。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">abroad</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">外国に；外国へ</div><div class="ex">My father often goes <b>abroad</b> for work.</div><div class="xj">父は仕事でよく外国に行く。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">away</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">離れて；向こうへ</div><div class="ex">Our school is two kilometers <b>away</b> from the station.</div><div class="xj">私たちの学校は、駅から2キロメートル離れている。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">around</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～のまわりに；～ごろ</div><div class="ex">We sat <b>around</b> the fire at the camp.</div><div class="xj">私たちはキャンプで火のまわりに座った。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">else</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">そのほかに</div><div class="ex">Would you like anything <b>else</b> to drink?</div><div class="xj">ほかに何か飲み物はいかがですか。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">anytime</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">いつでも</div><div class="ex">You can call me <b>anytime</b> after six.</div><div class="xj">6時以降ならいつでも電話していいよ。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">across</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～を横切って；～の向こう側に</div><div class="ex">A cat ran <b>across</b> the road.</div><div class="xj">ネコが道路を横切って走っていった。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">instead</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">その代わりに</div><div class="ex">There was no rice, so we ate bread <b>instead</b>.</div><div class="xj">ご飯がなかったので、代わりにパンを食べた。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../n/">← 新しい意味</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"1": 4.74, "2": 19.35, "3": 35.4, "4": 50.02, "5": 65.61, "6": 79.34, "7": 94.09, "8": 107.86, "9": 121.64, "10": 137.38, "11": 151.7, "12": 164.87, "13": 177.73, "14": 191.19, "15": 204.1, "16": 217.42, "17": 230.32, "18": 244.07, "19": 256.84, "20": 269.74, "21": 282.92, "22": 295.49, "23": 308.54, "
