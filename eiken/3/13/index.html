utton></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">count</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を数える</div><div class="ex">Tom <b>counted</b> the money in his wallet.</div><div class="xj">トムは財布の中のお金を数えた。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">spell</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をつづる</div><div class="ex">How do you <b>spell</b> your name?</div><div class="xj">あなたの名前はどうつづるのですか。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">note</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">メモ；短い手紙</div><div class="ex">Emi left a <b>note</b> on the table.</div><div class="xj">エミはテーブルの上にメモを残した。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">diary</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">日記</div><div class="ex">Lisa writes in her <b>diary</b> every night.</div><div class="xj">リサは毎晩日記を書いている。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">playground</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（学校の）運動場；遊び場</div><div class="ex">The children are playing on the <b>playground</b>.</div><div class="xj">子どもたちは運動場で遊んでいる。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">noise</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">物音；騒音</div><div class="ex">Please don&#x27;t make <b>noise</b> in the library.</div><div class="xj">図書館では物音を立てないでください。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">presentation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">発表；プレゼンテーション</div><div class="ex">I gave a <b>presentation</b> about my town.</div><div class="xj">私は自分の町について発表をした。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">partner</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">パートナー；相手</div><div class="ex">Please talk with your <b>partner</b> in English.</div><div class="xj">パートナーと英語で話してください。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">graduation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">卒業</div><div class="ex">My parents came to my <b>graduation</b> ceremony.</div><div class="xj">両親が私の卒業式に来てくれた。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">action</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">行動；動作</div><div class="ex">Small <b>actions</b> can help the earth.</div><div class="xj">小さな行動が地球を守る助けになる。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">medal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">メダル</div><div class="ex">Ken won a gold <b>medal</b> in the race.</div><div class="xj">ケンはレースで金メダルを取った。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">type</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">種類；型</div><div class="ex">What <b>type</b> of music do you like?</div><div class="xj">どんな種類の音楽が好きですか。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">factory</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">工場</div><div class="ex">My uncle works at a car <b>factory</b>.</div><div class="xj">おじは自動車工場で働いている。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">stranger</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見知らぬ人；（その土地に）不慣れな人</div><div class="ex">A <b>stranger</b> asked me the way to the station.</div><div class="xj">見知らぬ人が私に駅への道をたずねた。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">season</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">季節</div><div class="ex">Which <b>season</b> do you like the best?</div><div class="xj">どの季節がいちばん好きですか。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">business</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">仕事；商売</div><div class="ex">My father went to Osaka for <b>business</b>.</div><div class="xj">父は仕事で大阪へ行った。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">typhoon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">台風</div><div class="ex">School was closed because of the <b>typhoon</b>.</div><div class="xj">台風のため、学校は休校になった。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">reporter</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">記者；レポーター</div><div class="ex">A <b>reporter</b> asked the players some questions.</div><div class="xj">記者が選手たちにいくつか質問をした。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">manager</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">支配人；責任者</div><div class="ex">The hotel <b>manager</b> welcomed us.</div><div class="xj">ホテルの支配人が私たちを出迎えた。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">invitation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">招待（状）</div><div class="ex">Thank you for the <b>invitation</b> to your party.</div><div class="xj">パーティーへのご招待ありがとう。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">honest</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">正直な</div><div class="ex">An <b>honest</b> boy took the lost wallet to the police.</div><div class="xj">正直な少年が落とし物の財布を警察に届けた。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">dry</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">乾いた；乾燥した</div><div class="ex">The towels are already <b>dry</b>.</div><div class="xj">タオルはもう乾いている。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">thin</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">うすい；やせた</div><div class="ex">Emi cut the apple into <b>thin</b> pieces.</div><div class="xj">エミはリンゴをうすく切った。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">scary</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">こわい；おそろしい</div><div class="ex">I don&#x27;t like <b>scary</b> movies.</div><div class="xj">私はこわい映画が好きではない。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">fantastic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">すばらしい</div><div class="ex">The view from the top was <b>fantastic</b>.</div><div class="xj">頂上からのながめはすばらしかった。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">extra</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">余分な；追加の</div><div class="ex">Do you have an <b>extra</b> pen?</div><div class="xj">余分なペンを持っていますか。</div></button></li><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">whole</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">全体の；まるごとの</div><div class="ex">The <b>whole</b> class went to the zoo.</div><div class="xj">クラス全体で動物園に行った。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">public</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">公共の；公立の</div><div class="ex">You can use the <b>public</b> library for free.</div><div class="xj">公共の図書館は無料で使うことができる。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">bored</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">退屈した</div><div class="ex">I was <b>bored</b> because the movie was long.</div><div class="xj">映画が長かったので、私は退屈した。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">exactly</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">正確に；（返事で）その通り</div><div class="ex">I don&#x27;t know <b>exactly</b> where he lives.</div><div class="xj">私は彼がどこに住んでいるか正確には知らない。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">luckily</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">幸運にも</div><div class="ex"><b>Luckily</b>, it stopped raining before the game.</div><div class="xj">幸運にも、試合の前に雨がやんだ。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">behind</span><span class="ps">前</span><span class="star">★★</span></div><div class="ja">～の後ろに</div><div class="ex">The cat is hiding <b>behind</b> the sofa.</div><div class="xj">ネコはソファーの後ろに隠れている。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">nothing</span><span class="ps">代</span><span class="star">★★</span></div><div class="ja">何も～ない</div><div class="ex">There is <b>nothing</b> in the box.</div><div class="xj">箱の中には何もない。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">quietly</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">静かに</div><div class="ex">Lisa closed the door <b>quietly</b>.</div><div class="xj">リサは静かにドアを閉めた。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">downstairs</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">下の階へ；1階で</div><div class="ex">Ken went <b>downstairs</b> for breakfast.</div><div class="xj">ケンは朝食をとりに下の階へ降りていった。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">nobody</span><span class="ps">代</span><span class="star">★</span></div><div class="ja">だれも～ない</div><div class="ex"><b>Nobody</b> was in the classroom.</div><div class="xj">教室にはだれもいなかった。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"481": 4.88, "482": 19.76, "483": 34.2, "484": 48.41, "485": 61.77, "486": 75.06, "487": 87.47, "488": 100.69, "489": 113.79, "490": 128.16, "491": 141.72, "492": 156.21, "493": 169.33, "494": 183.08, "495": 196.37, "496": 209.26, "497": 222.12, "498": 235.02, "499": 250.07, "500": 262.66, "501": 276.46, "502": 289.8, "503": 303.72, "504": 317.51, "505": 330.73, "506": 344.55, "507": 358.13, "508": 371.59, "509": 384.74, "5
