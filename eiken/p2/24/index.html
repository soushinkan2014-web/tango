>他人の考えを侮辱してはいけない。</div></button></li><li><button class="w" data-no="1155"><div class="top"><span class="no">1155</span><span class="en">forbid</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を禁止する</div><div class="ex">My parents <b>forbid</b> me to use my phone at dinner.</div><div class="xj">両親は、夕食中に携帯電話を使うことを禁止している。</div></button></li><li><button class="w" data-no="1156"><div class="top"><span class="no">1156</span><span class="en">distribute</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を配る；分配する</div><div class="ex">The teacher <b>distributed</b> the test papers to the class.</div><div class="xj">先生はクラスにテスト用紙を配った。</div></button></li><li><button class="w" data-no="1157"><div class="top"><span class="no">1157</span><span class="en">expire</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">期限が切れる</div><div class="ex">My passport will <b>expire</b> next month.</div><div class="xj">私のパスポートは来月期限が切れる。</div></button></li><li><button class="w" data-no="1158"><div class="top"><span class="no">1158</span><span class="en">competitor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">競争相手；（競技の）参加者</div><div class="ex">Our store has many <b>competitors</b> in this area.</div><div class="xj">この地域には、私たちの店の競争相手がたくさんいる。</div></button></li><li><button class="w" data-no="1159"><div class="top"><span class="no">1159</span><span class="en">comparison</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">比較</div><div class="ex">We made a <b>comparison</b> of the prices at the two shops.</div><div class="xj">私たちは2つの店の値段の比較をした。</div></button></li><li><button class="w" data-no="1160"><div class="top"><span class="no">1160</span><span class="en">compliment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ほめ言葉</div><div class="ex">Lisa was happy to get a <b>compliment</b> on her dress.</div><div class="xj">リサはドレスについてほめ言葉をもらって、うれしかった。</div></button></li><li><button class="w" data-no="1161"><div class="top"><span class="no">1161</span><span class="en">guilt</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">罪悪感；有罪</div><div class="ex">Ken felt <b>guilt</b> after lying to his mother.</div><div class="xj">ケンは母にうそをついた後、罪悪感を感じた。</div></button></li><li><button class="w" data-no="1162"><div class="top"><span class="no">1162</span><span class="en">committee</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">委員会</div><div class="ex">Emi is on the school festival <b>committee</b> this year.</div><div class="xj">エミは今年、文化祭委員会のメンバーだ。</div></button></li><li><button class="w" data-no="1163"><div class="top"><span class="no">1163</span><span class="en">wage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">賃金</div><div class="ex">The <b>wage</b> for this part-time job is 1,200 yen an hour.</div><div class="xj">このアルバイトの賃金は1時間1200円だ。</div></button></li><li><button class="w" data-no="1164"><div class="top"><span class="no">1164</span><span class="en">myth</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">神話；俗説</div><div class="ex">Many Greek <b>myths</b> are about gods and heroes.</div><div class="xj">ギリシャ神話の多くは、神々と英雄の話だ。</div></button></li><li><button class="w" data-no="1165"><div class="top"><span class="no">1165</span><span class="en">gratitude</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感謝の気持ち</div><div class="ex">Emi wrote a letter to show her <b>gratitude</b> to her teacher.</div><div class="xj">エミは先生への感謝の気持ちを伝えるために手紙を書いた。</div></button></li><li><button class="w" data-no="1166"><div class="top"><span class="no">1166</span><span class="en">enthusiasm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">熱意</div><div class="ex">The students worked on the project with great <b>enthusiasm</b>.</div><div class="xj">生徒たちは大きな熱意を持って、その課題に取り組んだ。</div></button></li><li><button class="w" data-no="1167"><div class="top"><span class="no">1167</span><span class="en">infant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">幼児；赤ちゃん</div><div class="ex">Parents with <b>infants</b> can use this room.</div><div class="xj">幼児を連れた親は、この部屋を使うことができる。</div></button></li><li><button class="w" data-no="1168"><div class="top"><span class="no">1168</span><span class="en">harmony</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">調和</div><div class="ex">People and nature should live in <b>harmony</b>.</div><div class="xj">人と自然は調和して暮らすべきだ。</div></button></li><li><button class="w" data-no="1169"><div class="top"><span class="no">1169</span><span class="en">celebrity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">有名人</div><div class="ex">We saw a TV <b>celebrity</b> at the airport.</div><div class="xj">私たちは空港でテレビの有名人を見かけた。</div></button></li><li><button class="w" data-no="1170"><div class="top"><span class="no">1170</span><span class="en">cash</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">現金</div><div class="ex">Can I pay in <b>cash</b> at this shop?</div><div class="xj">この店では現金で払えますか。</div></button></li><li><button class="w" data-no="1171"><div class="top"><span class="no">1171</span><span class="en">plate</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（平たい）皿</div><div class="ex">Please put the cake on this <b>plate</b>.</div><div class="xj">ケーキをこの皿にのせてください。</div></button></li><li><button class="w" data-no="1172"><div class="top"><span class="no">1172</span><span class="en">refrigerator</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">冷蔵庫</div><div class="ex">Put the milk back in the <b>refrigerator</b>, please.</div><div class="xj">牛乳を冷蔵庫に戻しておいてね。</div></button></li><li><button class="w" data-no="1173"><div class="top"><span class="no">1173</span><span class="en">seed</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">種</div><div class="ex">We planted sunflower <b>seeds</b> in the school garden.</div><div class="xj">私たちは学校の花だんにヒマワリの種をまいた。</div></button></li><li><button class="w" data-no="1174"><div class="top"><span class="no">1174</span><span class="en">amusement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">楽しみ；（amusement park）遊園地</div><div class="ex">My father plays the guitar for <b>amusement</b>.</div><div class="xj">父は楽しみのためにギターをひく。</div></button></li><li><button class="w" data-no="1175"><div class="top"><span class="no">1175</span><span class="en">spice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">香辛料；スパイス</div><div class="ex">This curry has many kinds of <b>spices</b> in it.</div><div class="xj">このカレーには、何種類もの香辛料が入っている。</div></button></li><li><button class="w" data-no="1176"><div class="top"><span class="no">1176</span><span class="en">shrine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">神社；聖堂</div><div class="ex">We visited a <b>shrine</b> on New Year&#x27;s Day.</div><div class="xj">私たちは元日に神社にお参りした。</div></button></li><li><button class="w" data-no="1177"><div class="top"><span class="no">1177</span><span class="en">handy</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">便利な；手ごろな</div><div class="ex">This small bag is very <b>handy</b> for trips.</div><div class="xj">この小さなかばんは、旅行にとても便利だ。</div></button></li><li><button class="w" data-no="1178"><div class="top"><span class="no">1178</span><span class="en">artistic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">芸術的な</div><div class="ex">Emi has <b>artistic</b> talent and loves drawing.</div><div class="xj">エミには芸術的な才能があり、絵をかくのが大好きだ。</div></button></li><li><button class="w" data-no="1179"><div class="top"><span class="no">1179</span><span class="en">energetic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">精力的な；元気な</div><div class="ex">Our new coach is <b>energetic</b> and full of ideas.</div><div class="xj">新しいコーチは精力的で、アイデアにあふれている。</div></button></li><li><button class="w" data-no="1180"><div class="top"><span class="no">1180</span><span class="en">ashamed</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">恥じて</div><div class="ex">I was <b>ashamed</b> of my rude words to my friend.</div><div class="xj">私は友だちへの失礼な言葉を恥じた。</div></button></li><li><button class="w" data-no="1181"><div class="top"><span class="no">1181</span><span class="en">overweight</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">太りすぎの</div><div class="ex">The doctor told my father that he was <b>overweight</b>.</div><div class="xj">医者は父に、太りすぎだと言った。</div></button></li><li><button class="w" data-no="1182"><div class="top"><span class="no">1182</span><span class="en">suspicious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">疑わしい；疑い深い</div><div class="ex">The teacher thought Ken&#x27;s excuse was <b>suspicious</b>.</div><div class="xj">先生は、ケンの言い訳は疑わしいと思った。</div></button></li><li><button class="w" data-no="1183"><div class="top"><span class="no">1183</span><span class="en">skilled</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">熟練した；腕のいい</div><div class="ex">My uncle is a <b>skilled</b> cook at a Japanese restaurant.</div><div class="xj">おじは和食店の熟練した料理人だ。</div></button></li><li><button class="w" data-no="1184"><div class="top"><span class="no">1184</span><span class="en">bold</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">大胆な</div><div class="ex">It was a <b>bold</b> decision to study abroad alone.</div><div class="xj">一人で留学するのは大胆な決断だった。</div></button></li><li><button class="w" data-no="1185"><div class="top"><span class="no">1185</span><span class="en">modest</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">控えめな；謙虚な</div><div class="ex">Ken won first prize, but he was very <b>modest</b>.</div><div class="xj">ケンは1等賞を取ったが、とても控えめだった。</div></button></li><li><button class="w" data-no="1186"><div class="top"><span class="no">1186</span><span class="en">fragile</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">壊れやすい</div><div class="ex">These glasses are <b>fragile</b>, so please carry them carefully.</div><div class="xj">このグラスは壊れやすいので、気をつけて運んでください。</div></button></li><li><button class="w" data-no="1187"><div class="top"><span class="no">1187</span><span class="en">stubborn</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">頑固な</div><div class="ex">My grandfather is so <b>stubborn</b> that he never changes his mind.</div><div class="xj">祖父はとても頑固なので、決して考えを変えない。</div></button></li><li><button class="w" data-no="1188"><div class="top"><span class="no">1188</span><span class="en">frozen</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">冷凍の；凍った</div><div class="ex">We bought <b>frozen</b> vegetables at the supermarket.</div><div class="xj">私たちはスーパーで冷凍の野菜を買った。</div></button></li><li><button class="w" data-no="1189"><div class="top"><span class="no">1189</span><span class="en">rotten</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">腐った</div><div class="ex">Please throw away the <b>rotten</b> bananas in the kitchen.</div><div class="xj">台所の腐ったバナナを捨ててください。</div></button></li><li><button class="w" data-no="1190"><div class="top"><span class="no">1190</span><span class="en">spacious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">広々とした</div><div class="ex">Our new apartment is bright and <b>spacious</b>.</div><div class="xj">私たちの新しいアパートは、明るくて広々としている。</div></button></li><li><button class="w" data-no="1191"><div class="top"><span class="
