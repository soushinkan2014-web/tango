</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第5回</h1><div class="sub">No.201〜250</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">organize</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を組織する；計画する</div><div class="ex">Ken <b>organized</b> a volunteer group to clean the beach.</div><div class="xj">ケンは浜辺をそうじするボランティア団体を組織した。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">disappoint</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をがっかりさせる</div><div class="ex">The ending of the movie <b>disappointed</b> many fans.</div><div class="xj">その映画の結末は、多くのファンをがっかりさせた。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">affect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に影響する</div><div class="ex">The weather can <b>affect</b> how we feel.</div><div class="xj">天気は私たちの気分に影響することがある。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">advertise</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を宣伝する；広告する</div><div class="ex">The shop <b>advertises</b> its sales in the newspaper.</div><div class="xj">その店は新聞でセールを宣伝している。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">skip</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を抜かす；（食事など）を抜く</div><div class="ex">Let&#x27;s <b>skip</b> this question and go to the next one.</div><div class="xj">この問題は抜かして、次に進もう。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">seek</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を探し求める</div><div class="ex">Many young people come to the city to <b>seek</b> work.</div><div class="xj">多くの若者が仕事を探し求めて都市にやってくる。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">destroy</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を破壊する</div><div class="ex">A big wave <b>destroyed</b> the sand castle we made.</div><div class="xj">大きな波が、私たちが作った砂の城を破壊した。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">attack</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を攻撃する；～を襲う</div><div class="ex">Our team <b>attacked</b> again and again in the second half.</div><div class="xj">私たちのチームは後半、何度も攻撃した。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">describe</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を描写する；説明する</div><div class="ex">The writer <b>described</b> the beautiful sunset in her book.</div><div class="xj">その作家は本の中で美しい夕日を描写した。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">measure</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を測る</div><div class="ex">The nurse <b>measured</b> my height and weight.</div><div class="xj">看護師が私の身長と体重を測った。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">advertisement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">広告</div><div class="ex">I saw an <b>advertisement</b> for a new phone on TV.</div><div class="xj">テレビで新しい携帯電話の広告を見た。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">form</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">用紙；形</div><div class="ex">Please fill out this <b>form</b> with a pen.</div><div class="xj">この用紙にペンで記入してください。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">statement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">声明；発言</div><div class="ex">The school made a <b>statement</b> about the new rules.</div><div class="xj">学校は新しい規則について声明を出した。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">review</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">批評；見直し</div><div class="ex">I read a <b>review</b> of the new movie in the newspaper.</div><div class="xj">新聞で新しい映画の批評を読んだ。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">discovery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">発見</div><div class="ex">The <b>discovery</b> of the old coins surprised everyone.</div><div class="xj">古いコインの発見はみんなを驚かせた。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">stress</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ストレス；圧力</div><div class="ex">Exercise is a good way to reduce <b>stress</b>.</div><div class="xj">運動はストレスを減らすよい方法だ。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">production</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生産；製作</div><div class="ex">Rice <b>production</b> is important in this area.</div><div class="xj">この地域では米の生産が重要だ。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">opportunity</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">機会</div><div class="ex">Studying abroad is a great <b>opportunity</b> to learn English.</div><div class="xj">留学は英語を学ぶすばらしい機会だ。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">platform</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（駅の）ホーム；台</div><div class="ex">Please wait for the train on <b>platform</b> 2.</div><div class="xj">2番ホームで電車を待ってください。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">benefit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">利益；恩恵</div><div class="ex">Walking every day has many health <b>benefits</b>.</div><div class="xj">毎日歩くことには、健康上の利益がたくさんある。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">tunnel</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">トンネル</div><div class="ex">The train went through a long <b>tunnel</b>.</div><div class="xj">電車は長いトンネルを通り抜けた。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">mayor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">市長；町長</div><div class="ex">The <b>mayor</b> visited our school yesterday.</div><div class="xj">昨日、市長が私たちの学校を訪れた。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">gas</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ガス；ガソリン</div><div class="ex">Please turn off the <b>gas</b> after cooking.</div><div class="xj">料理のあとはガスを止めてください。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">credit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">信用；（credit card）クレジットカード</div><div class="ex">Can I pay with a <b>credit</b> card here?</div><div class="xj">ここではクレジットカードで払えますか。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">source</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">源；出所</div><div class="ex">The sun is our main <b>source</b> of energy.</div><div class="xj">太陽は私たちのおもなエネルギーの源だ。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">role</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">役割</div><div class="ex">Teachers play an important <b>role</b> in our lives.</div><div class="xj">先生は私たちの人生で大切な役割を果たしている。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">society</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">社会</div><div class="ex">Japanese <b>society</b> is getting older every year.</div><div class="xj">日本の社会は年々高齢化している。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">lack</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">不足；欠乏</div><div class="ex">A <b>lack</b> of sleep can make you tired.</div><div class="xj">睡眠不足だと疲れやすくなる。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">document</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">書類；文書</div><div class="ex">Please bring this <b>document</b> to the office.</div><div class="xj">この書類を事務所に持ってきてください。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">career</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">職業；経歴</div><div class="ex">Lisa is thinking about a <b>career</b> as a nurse.</div><div class="xj">リサは看護師という職業について考えている。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">forecast</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">予報；予測</div><div class="ex">The weather <b>forecast</b> says it will be sunny tomorrow.</div><div class="xj">天気予報によると、明日は晴れだ。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">risk</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">危険（性）</div><div class="ex">Swimming in this river alone is a big <b>risk</b>.</div><div class="xj">この川でひとりで泳ぐのは大きな危険だ。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">crop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">作物；収穫高</div><div class="ex">Rice is the main <b>crop</b> in this area.</div><div class="xj">米はこの地域の主な作物だ。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">scene</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">場面；現場</div><div class="ex">This is my favorite <b>scene</b> in the movie.</div><div class="xj">これはその映画で私のいちばん好きな場面だ。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">bean</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">豆</div><div class="ex">Mom cooked <b>beans</b> with tomatoes for dinner.</div><div class="xj">母は夕食に豆をトマトといっしょに煮た。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">construction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">建設；工事</div><div class="ex">The <b>construction</b> of the new station will take two years.</div><div class="xj">新しい駅の建設には2年かかる。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">trend</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">傾向；流行</div><div class="ex">These days, there is a <b>trend</b> toward eating less meat.</div><div class="xj">最近は、肉を食べる量を減らす傾向がある。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">negative</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">否定的な；よくない</div><div class="ex">Try not to have <b>negative</b> thoughts before a test.</div><div class="xj">テストの前に否定的な考えを持たないようにしよう。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">likely</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">ありそうな；（be likely to ～）～しそうである</div><div class="ex">It is <b>likely</b> that Emi will win the speech contest.</div><div class="xj">エミがスピーチコンテストで優勝することは十分ありそうだ。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">creative</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">創造的な</div><div class="ex">Emi is very <b>creative</b> and loves to make things.</div><div class="xj">エミはとても創造的で、ものを作るのが大好きだ。</div></button></li><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">gradually</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">だんだんと；徐々
