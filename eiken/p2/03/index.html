</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第3回</h1><div class="sub">No.101〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">rate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を評価する</div><div class="ex">Many people <b>rated</b> the new movie very highly.</div><div class="xj">多くの人がその新しい映画をとても高く評価した。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">apply</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">申し込む；～を応用する</div><div class="ex">Emi <b>applied</b> for a part-time job at the bakery.</div><div class="xj">エミはパン屋のアルバイトに申し込んだ。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">bury</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を埋める</div><div class="ex">The dog <b>buried</b> a bone in the garden.</div><div class="xj">犬は庭に骨を埋めた。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">refuse</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を断る；拒む</div><div class="ex">Tom <b>refused</b> to tell me his secret.</div><div class="xj">トムは自分の秘密を教えるのを断った。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">base</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（be based on ～）～に基づいている</div><div class="ex">This movie is <b>based</b> on a true story.</div><div class="xj">この映画は実話に基づいている。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">reform</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を改革する；改善する</div><div class="ex">The government plans to <b>reform</b> the school system.</div><div class="xj">政府は学校制度を改革する計画だ。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">bounce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">はずむ；～をはずませる</div><div class="ex">The ball <b>bounced</b> twice before Emi caught it.</div><div class="xj">エミがキャッチする前に、ボールは2回はずんだ。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">grab</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をつかむ；ひったくる</div><div class="ex">Ken <b>grabbed</b> his bag and ran to the bus.</div><div class="xj">ケンはかばんをつかんでバスへ走った。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">unlock</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～のかぎを開ける</div><div class="ex">Mom <b>unlocked</b> the front door and went inside.</div><div class="xj">母は玄関のドアのかぎを開けて中に入った。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">transfer</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">乗り換える；～を移す</div><div class="ex">We <b>transferred</b> to another train at Osaka Station.</div><div class="xj">私たちは大阪駅で別の電車に乗り換えた。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">ache</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">痛む</div><div class="ex">My legs <b>ached</b> after the long hike.</div><div class="xj">長いハイキングのあと、足が痛んだ。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">treat</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を扱う；～に（食事などを）ごちそうする</div><div class="ex">Please <b>treat</b> these old books carefully.</div><div class="xj">これらの古い本は注意して扱ってください。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">quit</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をやめる</div><div class="ex">Tom <b>quit</b> the soccer club to study harder.</div><div class="xj">トムはもっと勉強するためにサッカー部をやめた。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">bother</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を悩ませる；～に迷惑をかける</div><div class="ex">The loud music next door <b>bothered</b> me all night.</div><div class="xj">隣の大きな音楽に、一晩じゅう悩まされた。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">propose</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を提案する</div><div class="ex">Lisa <b>proposed</b> a new idea at the meeting.</div><div class="xj">リサは会議で新しいアイデアを提案した。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">require</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を必要とする；要求する</div><div class="ex">This job <b>requires</b> good English skills.</div><div class="xj">この仕事は高い英語力を必要とする。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">region</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">地域；地方</div><div class="ex">This <b>region</b> is famous for its apples.</div><div class="xj">この地域はりんごで有名だ。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">advance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">進歩；（in advance）前もって</div><div class="ex"><b>Advances</b> in science have made our lives easier.</div><div class="xj">科学の進歩によって、私たちの生活は便利になった。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">inconvenience</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">不便；迷惑</div><div class="ex">Living far from the station is a great <b>inconvenience</b>.</div><div class="xj">駅から遠くに住むのは、とても不便だ。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">essay</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">作文；小論文</div><div class="ex">We have to write an <b>essay</b> about our dreams.</div><div class="xj">私たちは自分の夢について作文を書かなければならない。</div></button></li><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">series</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ひと続き；シリーズ</div><div class="ex">A <b>series</b> of small mistakes made our team lose.</div><div class="xj">小さなミスの連続で、私たちのチームは負けてしまった。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">detail</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">細部；詳細</div><div class="ex">Please tell me the <b>details</b> of your plan.</div><div class="xj">あなたの計画の詳細を教えてください。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">enemy</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">敵</div><div class="ex">Cats and dogs are not always <b>enemies</b>.</div><div class="xj">ねこと犬がいつも敵同士とは限らない。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">reality</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">現実</div><div class="ex">Ken&#x27;s dream of going to space became a <b>reality</b>.</div><div class="xj">宇宙に行くというケンの夢が現実になった。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">rumor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">うわさ</div><div class="ex">I heard a <b>rumor</b> that a new student is coming.</div><div class="xj">新しい生徒が来るといううわさを聞いた。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">wealth</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">富；財産</div><div class="ex">The rich man used his <b>wealth</b> to build a hospital.</div><div class="xj">その金持ちの男性は、自分の富を使って病院を建てた。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">equipment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">装置；用具</div><div class="ex">The science room has new <b>equipment</b> for experiments.</div><div class="xj">理科室には実験用の新しい装置がある。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">impact</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">影響；衝撃</div><div class="ex">Smartphones have a big <b>impact</b> on our lives.</div><div class="xj">スマートフォンは私たちの生活に大きな影響を与えている。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">impression</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">印象</div><div class="ex">What was your first <b>impression</b> of Japan?</div><div class="xj">日本の最初の印象はどうでしたか。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">editor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">編集者</div><div class="ex">My aunt works as an <b>editor</b> for a magazine.</div><div class="xj">おばは雑誌の編集者として働いている。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">palace</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">宮殿</div><div class="ex">The king and queen lived in a beautiful <b>palace</b>.</div><div class="xj">王と女王は美しい宮殿に住んでいた。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">talent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">才能</div><div class="ex">Emi has a <b>talent</b> for drawing pictures.</div><div class="xj">エミには絵をかく才能がある。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">roof</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">屋根</div><div class="ex">A cat is sleeping on the <b>roof</b> of our house.</div><div class="xj">ねこが家の屋根の上で寝ている。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">advantage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">利点；有利</div><div class="ex">Being tall is an <b>advantage</b> in basketball.</div><div class="xj">背が高いことは、バスケットボールでは利点になる。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">tail</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">しっぽ；尾</div><div class="ex">That monkey has a very long <b>tail</b>.</div><div class="xj">あのサルはしっぽがとても長い。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">garage</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">車庫；ガレージ</div><div class="ex">Dad keeps his bike in the <b>garage</b>.</div><div class="xj">父は車庫に自転車を置いている。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">economy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">経済</div><div class="ex">Tourists help the local <b>economy</b> a lot.</div><div class="xj">観光客は地元の経済を大いに助けている。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">delivery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">配達</div><div class="ex">The <b>delivery</b> of our new sofa is on Sunday.</div><div class="xj">新しいソファの配達は日曜日だ。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">educational</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">教育的な；教育の</div><div class="ex">This is a fun and <b>educational</b> TV program for kids.</div><div class="xj">これは子ども向けの、楽しくて教育的なテレビ番組だ。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">unlikely</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">ありそうもない；（be unlikely to ～）～しそうにない</div><div class="ex">In Okinawa, snow is <b>unlikely</b> even in winter.</div><div class="xj">沖縄では、冬でも雪が降ることはありそうもない。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">unique</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">独特の；唯一の</div><div class="ex">Each person has a <b>unique
