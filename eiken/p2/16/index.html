ass="xj">コーチはエミの努力をほめた。</div></button></li><li><button class="w" data-no="755"><div class="top"><span class="no">755</span><span class="en">complete</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を完成させる；仕上げる</div><div class="ex">Tom <b>completed</b> his model ship last night.</div><div class="xj">トムは昨夜、船の模型を完成させた。</div></button></li><li><button class="w" data-no="756"><div class="top"><span class="no">756</span><span class="en">edit</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を編集する</div><div class="ex">Emi <b>edited</b> the video for the school festival.</div><div class="xj">エミは文化祭用の動画を編集した。</div></button></li><li><button class="w" data-no="757"><div class="top"><span class="no">757</span><span class="en">roll</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">転がる；～を転がす</div><div class="ex">The ball <b>rolled</b> down the hill.</div><div class="xj">ボールが坂を転がり落ちた。</div></button></li><li><button class="w" data-no="758"><div class="top"><span class="no">758</span><span class="en">polish</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をみがく</div><div class="ex">My father <b>polishes</b> his shoes every Sunday.</div><div class="xj">父は毎週日曜日にくつをみがく。</div></button></li><li><button class="w" data-no="759"><div class="top"><span class="no">759</span><span class="en">bet</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（I bet ～）きっと～だと思う；賭ける</div><div class="ex">I <b>bet</b> Lisa will win the speech contest.</div><div class="xj">きっとリサがスピーチコンテストで優勝するよ。</div></button></li><li><button class="w" data-no="760"><div class="top"><span class="no">760</span><span class="en">tear</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を引き裂く；破る</div><div class="ex">Ken <b>tore</b> the paper into small pieces.</div><div class="xj">ケンはその紙を細かく引き裂いた。</div></button></li><li><button class="w" data-no="761"><div class="top"><span class="no">761</span><span class="en">shoot</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を撃つ；（映画など）を撮影する</div><div class="ex">This movie was <b>shot</b> in Kyoto.</div><div class="xj">この映画は京都で撮影された。</div></button></li><li><button class="w" data-no="762"><div class="top"><span class="no">762</span><span class="en">membership</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">会員であること；会員資格</div><div class="ex">You need a <b>membership</b> card to use the gym.</div><div class="xj">そのジムを使うには会員証が必要だ。</div></button></li><li><button class="w" data-no="763"><div class="top"><span class="no">763</span><span class="en">ray</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">光線</div><div class="ex">The <b>rays</b> of the sun came through the window.</div><div class="xj">太陽の光線が窓から差しこんだ。</div></button></li><li><button class="w" data-no="764"><div class="top"><span class="no">764</span><span class="en">rope</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ロープ；なわ</div><div class="ex">The boys pulled the <b>rope</b> as hard as they could.</div><div class="xj">少年たちは力いっぱいロープを引いた。</div></button></li><li><button class="w" data-no="765"><div class="top"><span class="no">765</span><span class="en">voyage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">航海；船旅</div><div class="ex">The ship started a long <b>voyage</b> across the ocean.</div><div class="xj">その船は海をわたる長い航海に出発した。</div></button></li><li><button class="w" data-no="766"><div class="top"><span class="no">766</span><span class="en">literature</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">文学</div><div class="ex">My sister studies English <b>literature</b> at university.</div><div class="xj">姉は大学で英文学を学んでいる。</div></button></li><li><button class="w" data-no="767"><div class="top"><span class="no">767</span><span class="en">aisle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">通路</div><div class="ex">You can find the milk in the next <b>aisle</b>.</div><div class="xj">牛乳はとなりの通路にあります。</div></button></li><li><button class="w" data-no="768"><div class="top"><span class="no">768</span><span class="en">truth</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">真実</div><div class="ex">Ken finally told his mother the <b>truth</b>.</div><div class="xj">ケンはついに母親に真実を話した。</div></button></li><li><button class="w" data-no="769"><div class="top"><span class="no">769</span><span class="en">standard</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">基準；水準</div><div class="ex">This school has high <b>standards</b> for safety.</div><div class="xj">この学校は安全の基準が高い。</div></button></li><li><button class="w" data-no="770"><div class="top"><span class="no">770</span><span class="en">workshop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">講習会；作業場</div><div class="ex">Lisa joined a cooking <b>workshop</b> last weekend.</div><div class="xj">リサは先週末、料理の講習会に参加した。</div></button></li><li><button class="w" data-no="771"><div class="top"><span class="no">771</span><span class="en">producer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生産者；プロデューサー</div><div class="ex">This shop sells vegetables directly from local <b>producers</b>.</div><div class="xj">この店は、地元の生産者から直接届いた野菜を売っている。</div></button></li><li><button class="w" data-no="772"><div class="top"><span class="no">772</span><span class="en">poison</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">毒</div><div class="ex">Some mushrooms in the forest contain <b>poison</b>.</div><div class="xj">森のキノコの中には毒を含むものがある。</div></button></li><li><button class="w" data-no="773"><div class="top"><span class="no">773</span><span class="en">creature</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生き物</div><div class="ex">Many strange <b>creatures</b> live deep in the sea.</div><div class="xj">海の深いところには、たくさんの不思議な生き物がすんでいる。</div></button></li><li><button class="w" data-no="774"><div class="top"><span class="no">774</span><span class="en">alarm</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">警報；目覚まし時計</div><div class="ex">The fire <b>alarm</b> rang during the class.</div><div class="xj">授業中に火災警報が鳴った。</div></button></li><li><button class="w" data-no="775"><div class="top"><span class="no">775</span><span class="en">coworker</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">同僚</div><div class="ex">My mother went to lunch with her <b>coworkers</b>.</div><div class="xj">母は同僚と昼食に出かけた。</div></button></li><li><button class="w" data-no="776"><div class="top"><span class="no">776</span><span class="en">branch</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">支店；枝</div><div class="ex">The bank opened a new <b>branch</b> near the station.</div><div class="xj">その銀行は駅の近くに新しい支店を開いた。</div></button></li><li><button class="w" data-no="777"><div class="top"><span class="no">777</span><span class="en">desire</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">願望；欲求</div><div class="ex">Ken has a strong <b>desire</b> to become a pilot.</div><div class="xj">ケンはパイロットになりたいという強い願望を持っている。</div></button></li><li><button class="w" data-no="778"><div class="top"><span class="no">778</span><span class="en">researcher</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">研究者</div><div class="ex">A team of <b>researchers</b> found a new kind of frog.</div><div class="xj">研究者のチームが新しい種類のカエルを発見した。</div></button></li><li><button class="w" data-no="779"><div class="top"><span class="no">779</span><span class="en">sailor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">船員；水夫</div><div class="ex">The old <b>sailor</b> told us stories about the sea.</div><div class="xj">年老いた船員が海の話をしてくれた。</div></button></li><li><button class="w" data-no="780"><div class="top"><span class="no">780</span><span class="en">cell</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">細胞；（cell phone）携帯電話</div><div class="ex">Our bodies are made of many <b>cells</b>.</div><div class="xj">私たちの体はたくさんの細胞でできている。</div></button></li><li><button class="w" data-no="781"><div class="top"><span class="no">781</span><span class="en">edge</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">端；ふち</div><div class="ex">Don&#x27;t stand near the <b>edge</b> of the platform.</div><div class="xj">ホームの端の近くに立たないで。</div></button></li><li><button class="w" data-no="782"><div class="top"><span class="no">782</span><span class="en">craft</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">工芸（品）</div><div class="ex">This shop sells traditional <b>crafts</b> made in Kyoto.</div><div class="xj">この店では京都で作られた伝統工芸品を売っている。</div></button></li><li><button class="w" data-no="783"><div class="top"><span class="no">783</span><span class="en">debate</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">討論；議論</div><div class="ex">Our class had a <b>debate</b> about school uniforms.</div><div class="xj">私たちのクラスで、制服についての討論をした。</div></button></li><li><button class="w" data-no="784"><div class="top"><span class="no">784</span><span class="en">criminal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">犯罪者</div><div class="ex">The police caught the <b>criminal</b> at the station.</div><div class="xj">警察は駅でその犯罪者をつかまえた。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">landscape</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">景色；風景</div><div class="ex">The <b>landscape</b> from the top of the mountain was beautiful.</div><div class="xj">山頂からの景色は美しかった。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">performer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">演奏者；出演者</div><div class="ex">The street <b>performer</b> played the guitar beautifully.</div><div class="xj">その路上演奏者は、美しくギターをひいた。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">severe</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">厳しい；深刻な</div><div class="ex">The town had a <b>severe</b> winter this year.</div><div class="xj">その町は今年、厳しい冬を迎えた。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">ripe</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">熟した</div><div class="ex">These bananas are not <b>ripe</b> yet.</div><div class="xj">このバナナはまだ熟していない。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">portable</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">持ち運びのできる</div><div class="ex">I bought a <b>portable</b> speaker for camping.</div><div class="xj">私はキャンプ用に持ち運びのできるスピーカーを買った。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">useless</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">役に立たない</div><div class="ex">This old map is <b>useless</b> now.</div><div class="xj">この古い地図は今では役に立たない。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">tough</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">困難な；頑丈な</div><div class="ex">The math test was <b>tough</b>, but I did my best.</div><div class="xj">数学のテストは難しかったが、全力をつくした。</di
