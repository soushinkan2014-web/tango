</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第11回</h1><div class="sub">No.501〜550</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">employ</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を雇う</div><div class="ex">This factory <b>employs</b> about 200 people.</div><div class="xj">この工場は約200人を雇っている。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">chase</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を追いかける</div><div class="ex">The dog <b>chased</b> the cat around the garden.</div><div class="xj">犬は庭で猫を追いかけた。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">pause</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（ちょっと）止まる；休止する</div><div class="ex">Lisa <b>paused</b> at the door and looked back.</div><div class="xj">リサはドアのところでちょっと止まって、ふり返った。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">inform</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に知らせる</div><div class="ex">Please <b>inform</b> us if you can&#x27;t come.</div><div class="xj">来られない場合は、私たちに知らせてください。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">shut</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を閉める</div><div class="ex">Please <b>shut</b> the door when you leave the room.</div><div class="xj">部屋を出るときは、ドアを閉めてください。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">aim</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（aim to do）～することを目指す</div><div class="ex">Our team <b>aims</b> to win the city tournament.</div><div class="xj">私たちのチームは市の大会で優勝することを目指している。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">combine</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を組み合わせる；結合させる</div><div class="ex">This dance <b>combines</b> Japanese and Western styles.</div><div class="xj">このダンスは日本と西洋のスタイルを組み合わせている。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">flow</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">流れる</div><div class="ex">This river <b>flows</b> into the sea.</div><div class="xj">この川は海へと流れている。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">lift</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を持ち上げる</div><div class="ex">Can you help me <b>lift</b> this heavy box?</div><div class="xj">この重い箱を持ち上げるのを手伝ってくれる？</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">suit</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に似合う；～に都合がよい</div><div class="ex">That blue dress really <b>suits</b> you.</div><div class="xj">あの青いドレスは本当にあなたに似合っている。</div></button></li><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">cure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（病気・病人）を治す</div><div class="ex">This medicine can <b>cure</b> your cold in a few days.</div><div class="xj">この薬は数日でかぜを治すことができる。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">pretend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～のふりをする</div><div class="ex">My little brother <b>pretended</b> to be a lion.</div><div class="xj">弟はライオンのふりをした。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">figure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">数字；人物；姿</div><div class="ex">Can you add up these <b>figures</b> for me?</div><div class="xj">これらの数字を合計してくれますか。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">victory</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">勝利</div><div class="ex">The team celebrated its first <b>victory</b> of the season.</div><div class="xj">チームはシーズン初勝利を祝った。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">background</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">背景；経歴</div><div class="ex">The <b>background</b> of this photo is a beautiful lake.</div><div class="xj">この写真の背景は美しい湖だ。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">request</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">依頼；要望</div><div class="ex">Ken agreed to his friend&#x27;s <b>request</b> for help.</div><div class="xj">ケンは友だちの手伝いの依頼を引き受けた。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">application</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">申し込み（書）；応用</div><div class="ex">Please send your <b>application</b> by Friday.</div><div class="xj">金曜日までに申し込み書を送ってください。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">childhood</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">子ども時代</div><div class="ex">My mother often talks about her <b>childhood</b> in the country.</div><div class="xj">母はよく、いなかで過ごした子ども時代の話をする。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">employee</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">従業員</div><div class="ex">All <b>employees</b> must wear a name card at work.</div><div class="xj">従業員は全員、仕事中は名札をつけなければならない。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">documentary</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ドキュメンタリー（番組）</div><div class="ex">We watched a <b>documentary</b> about polar bears.</div><div class="xj">私たちはホッキョクグマについてのドキュメンタリーを見た。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">campus</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（大学などの）構内；キャンパス</div><div class="ex">The university <b>campus</b> has a large library.</div><div class="xj">その大学の構内には大きな図書館がある。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">greenhouse</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">温室</div><div class="ex">Grandpa grows tomatoes in a <b>greenhouse</b>.</div><div class="xj">祖父は温室でトマトを育てている。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">fare</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（乗り物の）運賃</div><div class="ex">How much is the bus <b>fare</b> to the zoo?</div><div class="xj">動物園までのバスの運賃はいくらですか。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">veterinarian</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">獣医</div><div class="ex">Lisa wants to be a <b>veterinarian</b> because she loves animals.</div><div class="xj">リサは動物が大好きなので、獣医になりたいと思っている。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">tourism</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">観光業</div><div class="ex"><b>Tourism</b> is important for this small island.</div><div class="xj">この小さな島にとって観光業は大切だ。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">instructor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指導員；インストラクター</div><div class="ex">Our swimming <b>instructor</b> is very kind.</div><div class="xj">私たちの水泳の指導員はとても親切だ。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">connection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">つながり；関係</div><div class="ex">Is there any <b>connection</b> between sleep and health?</div><div class="xj">睡眠と健康には何かつながりがあるのだろうか。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">process</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">過程；手順</div><div class="ex">We learned about the <b>process</b> of making paper.</div><div class="xj">私たちは紙を作る過程について学んだ。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">weight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">重さ；体重</div><div class="ex">What is the <b>weight</b> of this watermelon?</div><div class="xj">このスイカの重さはどれくらいですか。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">lifestyle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生活様式；ライフスタイル</div><div class="ex">Eating vegetables is part of a healthy <b>lifestyle</b>.</div><div class="xj">野菜を食べることは、健康的な生活様式の一部だ。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">shelter</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">避難所；保護施設</div><div class="ex">During the storm, people stayed in the <b>shelter</b>.</div><div class="xj">嵐の間、人々は避難所にとどまった。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">object</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">物体；目的</div><div class="ex">Ken found a strange metal <b>object</b> in the sand.</div><div class="xj">ケンは砂の中で、奇妙な金属の物体を見つけた。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">luggage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">手荷物</div><div class="ex">Please put your <b>luggage</b> on the shelf above.</div><div class="xj">手荷物は上の棚に置いてください。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">organization</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">組織；団体</div><div class="ex">Emi joined an <b>organization</b> that protects animals.</div><div class="xj">エミは動物を守る組織に入った。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">security</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">安全；警備</div><div class="ex">For <b>security</b>, all visitors must stop at the office.</div><div class="xj">安全のため、訪問者は全員、事務室に立ち寄らなければならない。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">argument</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">口論；主張</div><div class="ex">Ken had an <b>argument</b> with his brother about the TV.</div><div class="xj">ケンはテレビのことで兄と口論した。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">passion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">情熱</div><div class="ex">Lisa has a great <b>passion</b> for music.</div><div class="xj">リサは音楽に大きな情熱を持っている。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">evidence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">証拠</div><div class="ex">The scientist found <b>evidence</b> of water on the planet.</div><div class="xj">その科学者は、その惑星に水がある証拠を見つけた。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">balance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">つり合い；バランス</div><div class="ex">It is hard to keep my <b>balance</b> on ice.</div><div class="xj">氷の上でバランスを保つのは難しい。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">individual</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">個人</div><div class="ex">Our teacher treats each student as an <b>individual</b>.</div><div class="xj">先生は生徒一人ひとりを、一人の個人として扱う。</div></button></li><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">decade</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">1
