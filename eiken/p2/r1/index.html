><button class="w" data-no="復5"><div class="top"><span class="no">復5</span><span class="en">order</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を注文する</div><div class="ex">I <b>ordered</b> a pizza for dinner.</div><div class="xj">私は夕食にピザを注文した。</div></button></li><li><button class="w" data-no="復6"><div class="top"><span class="no">復6</span><span class="en">sound</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に聞こえる；～のように思われる</div><div class="ex">Your voice <b>sounds</b> different on the phone.</div><div class="xj">電話だと、あなたの声は違って聞こえる。</div></button></li><li><button class="w" data-no="復7"><div class="top"><span class="no">復7</span><span class="en">mind</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を気にする；～をいやがる</div><div class="ex">My dog doesn&#x27;t <b>mind</b> the rain at all.</div><div class="xj">私の犬は雨をまったく気にしない。</div></button></li><li><button class="w" data-no="復8"><div class="top"><span class="no">復8</span><span class="en">create</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を作り出す</div><div class="ex">The children <b>created</b> a new game.</div><div class="xj">子どもたちは新しい遊びを作り出した。</div></button></li><li><button class="w" data-no="復9"><div class="top"><span class="no">復9</span><span class="en">fix</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を修理する</div><div class="ex">My father <b>fixed</b> my bike.</div><div class="xj">父が私の自転車を修理してくれた。</div></button></li><li><button class="w" data-no="復10"><div class="top"><span class="no">復10</span><span class="en">build</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を建てる</div><div class="ex">My uncle <b>built</b> a small house by the sea.</div><div class="xj">おじは海のそばに小さな家を建てた。</div></button></li><li><button class="w" data-no="復11"><div class="top"><span class="no">復11</span><span class="en">miss</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に乗り遅れる；～がいなくてさびしく思う</div><div class="ex">Ken <b>missed</b> the bus this morning.</div><div class="xj">ケンは今朝、バスに乗り遅れた。</div></button></li><li><button class="w" data-no="復12"><div class="top"><span class="no">復12</span><span class="en">drive</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（車）を運転する</div><div class="ex">My mother <b>drives</b> a small red car.</div><div class="xj">母は小さな赤い車を運転する。</div></button></li><li><button class="w" data-no="復13"><div class="top"><span class="no">復13</span><span class="en">understand</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を理解する</div><div class="ex">I can&#x27;t <b>understand</b> this question.</div><div class="xj">私はこの問題が理解できない。</div></button></li><li><button class="w" data-no="復14"><div class="top"><span class="no">復14</span><span class="en">way</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">道；方法</div><div class="ex">Could you tell me the <b>way</b> to the station?</div><div class="xj">駅へ行く道を教えていただけますか。</div></button></li><li><button class="w" data-no="復15"><div class="top"><span class="no">復15</span><span class="en">interest</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">興味；関心</div><div class="ex">Ken has a strong <b>interest</b> in science.</div><div class="xj">ケンは科学に強い興味を持っている。</div></button></li><li><button class="w" data-no="復16"><div class="top"><span class="no">復16</span><span class="en">gift</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">贈り物</div><div class="ex">Ken bought a <b>gift</b> for his mother.</div><div class="xj">ケンは母への贈り物を買った。</div></button></li><li><button class="w" data-no="復17"><div class="top"><span class="no">復17</span><span class="en">experience</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">経験</div><div class="ex">Working at the farm was a good <b>experience</b>.</div><div class="xj">農場で働いたことは、よい経験だった。</div></button></li><li><button class="w" data-no="復18"><div class="top"><span class="no">復18</span><span class="en">college</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">大学</div><div class="ex">My sister studies music at <b>college</b>.</div><div class="xj">姉は大学で音楽を学んでいる。</div></button></li><li><button class="w" data-no="復19"><div class="top"><span class="no">復19</span><span class="en">smartphone</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">スマートフォン</div><div class="ex">Many students have a <b>smartphone</b> now.</div><div class="xj">今では多くの生徒がスマートフォンを持っている。</div></button></li><li><button class="w" data-no="復20"><div class="top"><span class="no">復20</span><span class="en">internet</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">インターネット</div><div class="ex">I often use the <b>internet</b> to study English.</div><div class="xj">私は英語を勉強するのに、よくインターネットを使う。</div></button></li><li><button class="w" data-no="復21"><div class="top"><span class="no">復21</span><span class="en">mistake</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">まちがい</div><div class="ex">I made a <b>mistake</b> on the math test.</div><div class="xj">私は数学のテストでまちがいをした。</div></button></li><li><button class="w" data-no="復22"><div class="top"><span class="no">復22</span><span class="en">end</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">終わり；端</div><div class="ex">Our school trip is at the <b>end</b> of May.</div><div class="xj">修学旅行は5月の終わりにある。</div></button></li><li><button class="w" data-no="復23"><div class="top"><span class="no">復23</span><span class="en">life</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">生活；人生；生命</div><div class="ex"><b>Life</b> in the city is very busy.</div><div class="xj">都会の生活はとても忙しい。</div></button></li><li><button class="w" data-no="復24"><div class="top"><span class="no">復24</span><span class="en">case</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">場合；入れ物（ケース）</div><div class="ex">In this <b>case</b>, you should ask your teacher.</div><div class="xj">この場合は、先生にたずねたほうがいい。</div></button></li><li><button class="w" data-no="復25"><div class="top"><span class="no">復25</span><span class="en">environment</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">環境</div><div class="ex">Let&#x27;s think about the <b>environment</b> and use less paper.</div><div class="xj">環境のことを考えて、紙を使うのを減らそう。</div></button></li><li><button class="w" data-no="復26"><div class="top"><span class="no">復26</span><span class="en">nature</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">自然</div><div class="ex">We should take care of <b>nature</b>.</div><div class="xj">私たちは自然を大切にすべきだ。</div></button></li><li><button class="w" data-no="復27"><div class="top"><span class="no">復27</span><span class="en">few</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（a few で）少しの；（few で）ほとんどない</div><div class="ex">I have a <b>few</b> questions about the homework.</div><div class="xj">宿題について少し質問があります。</div></button></li><li><button class="w" data-no="復28"><div class="top"><span class="no">復28</span><span class="en">own</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">自分自身の</div><div class="ex">Ken wants his <b>own</b> room.</div><div class="xj">ケンは自分の部屋をほしがっている。</div></button></li><li><button class="w" data-no="復29"><div class="top"><span class="no">復29</span><span class="en">such</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">そのような</div><div class="ex">I don&#x27;t like <b>such</b> movies.</div><div class="xj">私はそのような映画は好きではない。</div></button></li><li><button class="w" data-no="復30"><div class="top"><span class="no">復30</span><span class="en">several</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">いくつかの</div><div class="ex">There are <b>several</b> parks in our town.</div><div class="xj">私たちの町にはいくつかの公園がある。</div></button></li><li><button class="w" data-no="復31"><div class="top"><span class="no">復31</span><span class="en">enough</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">十分な</div><div class="ex">We have <b>enough</b> food for the camp.</div><div class="xj">私たちには、キャンプのための十分な食べ物がある。</div></button></li><li><button class="w" data-no="復32"><div class="top"><span class="no">復32</span><span class="en">true</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">本当の</div><div class="ex">Is it <b>true</b> that Ken is leaving our school?</div><div class="xj">ケンが転校するというのは本当なの？</div></button></li><li><button class="w" data-no="復33"><div class="top"><span class="no">復33</span><span class="en">main</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">主な</div><div class="ex">Fish is the <b>main</b> food on this island.</div><div class="xj">魚はこの島の主な食べ物だ。</div></button></li><li><button class="w" data-no="復34"><div class="top"><span class="no">復34</span><span class="en">special</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">特別な</div><div class="ex">We had a <b>special</b> lunch on my birthday.</div><div class="xj">私の誕生日に、特別な昼食を食べた。</div></button></li><li><button class="w" data-no="復35"><div class="top"><span class="no">復35</span><span class="en">able</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（be able to ～で）～することができる</div><div class="ex">Lisa was <b>able</b> to swim fifty meters.</div><div class="xj">リサは50メートル泳ぐことができた。</div></button></li><li><button class="w" data-no="復36"><div class="top"><span class="no">復36</span><span class="en">same</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">同じ</div><div class="ex">Emi and I are in the <b>same</b> class.</div><div class="xj">エミと私は同じクラスだ。</div></button></li><li><button class="w" data-no="復37"><div class="top"><span class="no">復37</span><span class="en">local</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">地元の</div><div class="ex">We bought vegetables at a <b>local</b> shop.</div><div class="xj">私たちは地元の店で野菜を買った。</div></button></li><li><button class="w" data-no="復38"><div class="top"><span class="no">復38</span><span class="en">while</span><span class="ps">接</span><span class="star">★★★</span></div><div class="ja">～する間に</div><div class="ex">My mother called me <b>while</b> I was taking a bath.</div><div class="xj">私がおふろに入っている間に、母が電話してきた。</div></button></li><li><button class="w" data-no="復39"><div class="top"><span class="no">復39</span><span class="en">away</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">離れて；向こうへ</div><div class="ex">Our school is two kilometers <b>away</b> from the station.</div><div class="xj">私たちの学校は、駅から2キロメートル離れている。</div></button></li><li><button class="w" data-no="復40"><div class="top"><span class="no">復40</span><span class="en">around</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～のまわりに；～ごろ</div><div class="ex">We sat <b>around</b> the fire at the camp.</div><div class="xj">私たちはキャンプで火のまわりに座った。</div></button></li><li><button class="w" data-no="復41"><div class="top"><span class="no">復41</span><span class="en">even</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">～でさえ；さらに</div><div class="ex"><b>Even</b> my little sister can ride a bike.</div><div class="xj">幼い妹でさえ、自転車に乗れる。</div></button></li><li><button class="w" data-no="復42"><div class="top"><span class="no">復42</span><span class="en">probably</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">たぶん；おそらく</div><div class="ex">It will <b>probably</b> rain tomorrow.</div><div class="xj">明日はたぶん雨が降るだろう。</div></button></li><li><button class="w" data-no="復43"><div class="top"><span class="no">復43</span><span class="en">yet</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">（否定文で）まだ；（疑問文で）もう</div><div class="ex">I haven&#x27;t finished my homework <b>yet</b>.</div><div class="xj">私はまだ宿題を終えていない。</div></button></li><li><button class="w" data-no="復44"><div class="top"><span class="no">復44</span><span class="en">instead</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">その代わりに</div><div class="ex">There was no rice, so we ate bread <b>instead</b>.</div><div class="xj">ご飯がなかったので、代わりにパンを食べた。</div></button></li><li><button class="w" data-no="復45"><div class="top"><span class="no">復45</span><span class="en">since</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～以来</div><div class="ex">I have lived in this town <b>since</b> 2015.</div><div class="xj">私は2015年以来、この町に住んでいる。</div></button></li><li><button class="w" data-no="復46"><div class="top"><span class="no">復46</span><span class="en">inside</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">内側に；屋内で</div><div class="ex">It&#x27;s cold, so please come <b>inside</b>.</div><div class="xj">寒いから、中に入ってください。</div></button></li><li><button class="w" data-no="復47"><div class="top"><span class="no">復47</span><span class="en">into</span><span class="ps">前</span><span class="star">★★★</span></div><div class="ja">～の中へ</div><div class="ex">The cat ran <b>into</b> the house.</div><div class="xj">ネコは家の中へ走っていった。</div></button></li><li><button class="w" data-no="復48"><div class="top"><span class="no">復48</span><span class="en">never</span><span class="ps">副</span><span class="star">★★★</span></div><div class="ja">一度も～ない；決して～ない</div><div class="ex">I have <b>never</b> seen a real panda.</div><div class="xj">私は本物のパンダを一度も見たことがない。</div></button></li><li><button class="w" data-no="復49"><div class="
