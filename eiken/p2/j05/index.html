 the party.</div><div class="xj">ケンはパーティーに姿を見せなかった。</div></button></li><li><button class="w" data-no="熟46"><div class="top"><span class="no">熟46</span><span class="en">break down</span></div><div class="ja">故障する</div><div class="ex">Our car broke down near the beach.</div><div class="xj">海の近くで車が故障した。</div></button></li><li><button class="w" data-no="熟47"><div class="top"><span class="no">熟47</span><span class="en">set up ～</span></div><div class="ja">～を準備する、～を設立する</div><div class="ex">We set up the tables for the party.</div><div class="xj">パーティーのためにテーブルを準備した。</div></button></li><li><button class="w" data-no="熟48"><div class="top"><span class="no">熟48</span><span class="en">carry out ～</span></div><div class="ja">～を実行する</div><div class="ex">The students carried out a survey about sleep.</div><div class="xj">生徒たちは睡眠についての調査を行った。</div></button></li><li><button class="w" data-no="熟49"><div class="top"><span class="no">熟49</span><span class="en">hand out ～</span></div><div class="ja">～を配る</div><div class="ex">The teacher handed out the test papers.</div><div class="xj">先生はテスト用紙を配った。</div></button></li><li><button class="w" data-no="熟50"><div class="top"><span class="no">熟50</span><span class="en">bring up ～</span></div><div class="ja">～を育てる</div><div class="ex">She was brought up in Kyoto.</div><div class="xj">彼女は京都で育った。</div></button></li><li><button class="w" data-no="会21"><div class="top"><span class="no">会21</span><span class="en">I&#x27;d love to.</span></div><div class="ja">ぜひそうしたいです。</div><div class="ex">A: Do you want to come to my birthday party?<br>B: I&#x27;d love to. Thank you.</div></button></li><li><button class="w" data-no="会22"><div class="top"><span class="no">会22</span><span class="en">I wish I could, but ～.</span></div><div class="ja">そうしたいけど、～。（ことわる）</div><div class="ex">A: Can you play tennis with us on Sunday?<br>B: I wish I could, but I have to study for a test.</div></button></li><li><button class="w" data-no="会23"><div class="top"><span class="no">会23</span><span class="en">Could we ～ instead?</span></div><div class="ja">代わりに～にしてもいい？</div><div class="ex">A: Let&#x27;s meet at the library today.<br>B: Sorry, I&#x27;m busy today. Could we meet tomorrow instead?</div></button></li><li><button class="w" data-no="会24"><div class="top"><span class="no">会24</span><span class="en">I&#x27;m afraid ～.</span></div><div class="ja">（残念ながら）～です。</div><div class="ex">A: Can you come to the meeting tomorrow?<br>B: I&#x27;m afraid I can&#x27;t. I have a dentist appointment.</div></button></li><li><button class="w" data-no="会25"><div class="top"><span class="no">会25</span><span class="en">Let me think about it.</span></div><div class="ja">少し考えさせて。</div><div class="ex">A: Will you join the drama club?<br>B: Let me think about it. I&#x27;ll tell you tomorrow.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j04/">← 熟語 Set 4</a><a href="../j06/">熟語 Set 6 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟41": 5.24, "熟42": 20.38, "熟43": 35.33, "熟44": 48.86, "熟45": 63.12, "熟46": 76.62, "熟47": 89.48, "熟48": 104.43, "熟49": 118.4, "熟50": 131.57, "会21": 144.38, "会22": 161.27, "会23": 182.21, "会24": 201.79, "会25": 220.4}, "TE": {"熟41": 7.6, "熟42": 22.26, "熟43": 37.3, "熟44": 50.76, "熟45": 64.99, "熟46": 78.5, "熟47": 91.36, "熟48": 106.3, "熟49": 120.27, "熟50": 133.44, "会21": 146.25, "会22": 163.81, "会23": 184.18, "会24": 203.66, "会25": 222.52}, "Q": [["熟41", "dress up (as ～)", "着飾る、仮装をする"], ["熟42", "back up ～", "～を裏づける、～を支援する"], ["熟43", "see ～ off", "～を見送る"], ["熟44", "catch up with ～", "～に追いつく"], ["熟45", "show up", "現れる、姿を見せる"], ["熟46", "break down", "故障する"], ["熟47", "set up ～", "～を準備する、～を設立する"], ["熟48", "carry out ～", "～を実行する"], ["熟49", "hand out ～", "～を配る"], ["熟50", "bring up ～", "～を育てる"], ["会21", "I'd love to.", "ぜひそうしたいです。"], ["会22", "I wish I could, but ～.", "そうしたいけど、～。"], ["会23", "Could we ～ inst
