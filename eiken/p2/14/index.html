</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第14回</h1><div class="sub">No.651〜700</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">overcome</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を克服する；乗り越える</div><div class="ex">Emi <b>overcame</b> her fear of swimming last summer.</div><div class="xj">エミは去年の夏、水泳へのこわさを克服した。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">compete</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">競争する；（試合に）参加する</div><div class="ex">The two bakeries <b>compete</b> for customers on this street.</div><div class="xj">この通りでは、2つのパン屋が客をめぐって競争している。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">pollute</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を汚染する</div><div class="ex">Plastic trash from cities <b>pollutes</b> the ocean.</div><div class="xj">都市から出るプラスチックごみが海を汚染している。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">translate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を翻訳する</div><div class="ex">Can you <b>translate</b> this letter into Japanese?</div><div class="xj">この手紙を日本語に翻訳してくれますか。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">scratch</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をひっかく</div><div class="ex">The cat <b>scratched</b> my hand when I touched it.</div><div class="xj">さわったら、ねこが私の手をひっかいた。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">update</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を最新のものにする；更新する</div><div class="ex">I <b>updated</b> the app on my phone last night.</div><div class="xj">私は昨夜、スマホのアプリを更新した。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">behave</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">ふるまう；行儀よくする</div><div class="ex">The children <b>behaved</b> well at the museum.</div><div class="xj">子どもたちは博物館できちんとふるまった。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">complain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">不平を言う；苦情を言う</div><div class="ex">Tom always <b>complains</b> about his homework.</div><div class="xj">トムはいつも宿題について不平を言う。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">appreciate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に感謝する；～を正しく評価する</div><div class="ex">I really <b>appreciate</b> your kind help.</div><div class="xj">親切に手伝ってくれて、本当に感謝します。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">rescue</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を救助する</div><div class="ex">The firefighters <b>rescued</b> a cat from the tall tree.</div><div class="xj">消防士たちが高い木からねこを救助した。</div></button></li><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">surface</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">表面</div><div class="ex">The <b>surface</b> of the lake was very calm.</div><div class="xj">湖の表面はとても静かだった。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">path</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">小道；進路</div><div class="ex">We walked along a narrow <b>path</b> in the forest.</div><div class="xj">私たちは森の中の細い小道を歩いた。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">mood</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">気分；機嫌</div><div class="ex">Listening to music always changes my <b>mood</b>.</div><div class="xj">音楽を聞くと、いつも気分が変わる。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">courage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">勇気</div><div class="ex">It took <b>courage</b> to speak in front of the whole school.</div><div class="xj">全校生徒の前で話すには勇気が必要だった。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">entertainment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">娯楽；楽しみ</div><div class="ex">Watching movies is my favorite kind of <b>entertainment</b>.</div><div class="xj">映画を見ることが、私のいちばん好きな娯楽だ。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">degree</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（温度などの）度；程度；学位</div><div class="ex">The temperature reached 35 <b>degrees</b> yesterday afternoon.</div><div class="xj">昨日の午後、気温は35度に達した。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">chest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">胸</div><div class="ex">The baby slept on her mother&#x27;s <b>chest</b>.</div><div class="xj">赤ちゃんは母親の胸の上で眠った。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">applause</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">拍手</div><div class="ex">The band received loud <b>applause</b> after the concert.</div><div class="xj">コンサートのあと、バンドは大きな拍手を受けた。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">frame</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">枠；額縁</div><div class="ex">The window <b>frame</b> is made of wood.</div><div class="xj">その窓枠は木でできている。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">instruction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（instructionsで）指示；説明書</div><div class="ex">Listen carefully to the coach&#x27;s <b>instructions</b>.</div><div class="xj">コーチの指示をよく聞きなさい。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">client</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">顧客；依頼人</div><div class="ex">The designer showed her ideas to the <b>client</b>.</div><div class="xj">デザイナーは顧客に自分のアイデアを見せた。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">campaign</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（社会的な）運動；キャンペーン</div><div class="ex">Our school started a <b>campaign</b> to save energy.</div><div class="xj">私たちの学校は、エネルギーを節約する運動を始めた。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">image</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">印象；イメージ；画像</div><div class="ex">The festival gave visitors a good <b>image</b> of the town.</div><div class="xj">その祭りは、訪れた人々に町のよい印象を与えた。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">relative</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">親せき</div><div class="ex">Many <b>relatives</b> came to my grandmother&#x27;s birthday party.</div><div class="xj">祖母の誕生日パーティーに、たくさんの親せきが来た。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">disaster</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">災害；大惨事</div><div class="ex">Everyone should prepare for natural <b>disasters</b> like earthquakes.</div><div class="xj">だれもが地震のような自然災害に備えるべきだ。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">error</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">誤り；エラー</div><div class="ex">There is an <b>error</b> in the second sentence.</div><div class="xj">2番目の文に誤りがある。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">selection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">選ぶこと；品ぞろえ</div><div class="ex">The <b>selection</b> of the class leader took a long time.</div><div class="xj">学級委員を選ぶのに長い時間がかかった。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">block</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（市街の）1区画；かたまり</div><div class="ex">The library is two <b>blocks</b> from the station.</div><div class="xj">図書館は駅から2区画先にある。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">dam</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ダム</div><div class="ex">This <b>dam</b> gives water to the whole city.</div><div class="xj">このダムは市全体に水を送っている。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">tablet</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">錠剤；タブレット端末</div><div class="ex">I use a <b>tablet</b> to do my homework.</div><div class="xj">私はタブレット端末を使って宿題をする。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">cooperation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">協力</div><div class="ex">Thank you for your <b>cooperation</b> at the school event.</div><div class="xj">学校行事へのご協力ありがとうございました。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">patience</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">忍耐；がまん強さ</div><div class="ex">Teaching small children takes a lot of <b>patience</b>.</div><div class="xj">小さな子どもに教えるには、大きな忍耐が必要だ。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">shame</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">恥；（a shameで）残念なこと</div><div class="ex">There is no <b>shame</b> in asking for help.</div><div class="xj">助けを求めるのは恥ではない。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">laboratory</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">実験室；研究所</div><div class="ex">The students did an experiment in the <b>laboratory</b>.</div><div class="xj">生徒たちは実験室で実験をした。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">adventure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">冒険</div><div class="ex">The movie is about a dog&#x27;s <b>adventure</b> in the city.</div><div class="xj">その映画は、都会での犬の冒険の話だ。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">official</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">公式の；公の</div><div class="ex">This is the <b>official</b> website of our city.</div><div class="xj">これは私たちの市の公式のウェブサイトだ。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">casual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ふだん着の；気軽な</div><div class="ex">You can wear <b>casual</b> clothes to the picnic.</div><div class="xj">ピクニックにはふだん着で来ていいですよ。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">mental</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">精神の；心の</div><div class="ex">Talking with friends is good for your <b>mental</b> health.</div><div class="xj">友だちと話すことは、精神の健康によい。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">proper</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">適切な；正しい</div><div class="ex">Please wear <b>proper</b> shoes for the mountain hike.</div><div class="xj">山歩きには適切な靴をはいてください。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">grateful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">感謝している</div><div class="ex">I am <b>grateful</b> for all your help.</div><div class="xj">いろいろ手伝ってくれたことに感謝しています。</div></button></li><li><button class="w" data-no="691"><div class="top"><span class="no">691</span><span class="en">humid</sp
