>ケンは終電に間に合うよう、駅へ急いで行った。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">vote</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">投票する</div><div class="ex">Everyone <b>voted</b> for Emi in the class election.</div><div class="xj">クラスの選挙で、みんながエミに投票した。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">donate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を寄付する</div><div class="ex">Tom <b>donated</b> his old books to the library.</div><div class="xj">トムは古い本を図書館に寄付した。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">import</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を輸入する</div><div class="ex">This shop <b>imports</b> coffee beans from Africa.</div><div class="xj">この店はアフリカからコーヒー豆を輸入している。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">confuse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を混乱させる；（confuse A with B）AをBと混同する</div><div class="ex">The new rules <b>confused</b> many students.</div><div class="xj">新しいルールは多くの生徒を混乱させた。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">defeat</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を負かす；打ち破る</div><div class="ex">Our team <b>defeated</b> the champion last Sunday.</div><div class="xj">私たちのチームは先週の日曜日、チャンピオンを負かした。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">relieve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（苦痛など）を和らげる；～を安心させる</div><div class="ex">This medicine will <b>relieve</b> your headache.</div><div class="xj">この薬は頭痛を和らげるだろう。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">pollution</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">汚染；公害</div><div class="ex">Cars are one cause of air <b>pollution</b>.</div><div class="xj">車は大気汚染の原因の一つだ。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">coupon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">割引券；クーポン</div><div class="ex">You can get 100 yen off with this <b>coupon</b>.</div><div class="xj">この割引券で100円引きになります。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">atmosphere</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">雰囲気；大気</div><div class="ex">This café has a warm and friendly <b>atmosphere</b>.</div><div class="xj">このカフェは温かくて親しみやすい雰囲気だ。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">comment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">論評；コメント</div><div class="ex">Thank you for your kind <b>comments</b> on my blog.</div><div class="xj">私のブログへの親切なコメントをありがとう。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">majority</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大多数；大部分</div><div class="ex">The <b>majority</b> of students walk to school.</div><div class="xj">大多数の生徒は歩いて通学している。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">arrival</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">到着</div><div class="ex">The <b>arrival</b> of the train was delayed by snow.</div><div class="xj">雪のため、電車の到着が遅れた。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">complaint</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不平；苦情</div><div class="ex">Tom always has some <b>complaint</b> about school lunch.</div><div class="xj">トムはいつも給食について何か不平を言っている。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">admission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">入場（料）；入学</div><div class="ex"><b>Admission</b> to the museum is free on Sundays.</div><div class="xj">日曜日は、博物館の入場が無料だ。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">salary</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">給料</div><div class="ex">My sister&#x27;s <b>salary</b> went up this year.</div><div class="xj">今年、姉の給料が上がった。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">deadline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">締め切り</div><div class="ex">The <b>deadline</b> for the report is next Monday.</div><div class="xj">レポートの締め切りは来週の月曜日だ。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">shortage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">不足</div><div class="ex">The town is facing a water <b>shortage</b> this summer.</div><div class="xj">この夏、町は水不足に直面している。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">routine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">いつもの手順；日課</div><div class="ex">Walking my dog every morning is part of my daily <b>routine</b>.</div><div class="xj">毎朝犬を散歩させるのは、私の日課の一つだ。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">target</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目標；標的</div><div class="ex">Our <b>target</b> is to collect 500 cans.</div><div class="xj">私たちの目標は、缶を500個集めることだ。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">permission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">許可</div><div class="ex">You need <b>permission</b> to use the gym after school.</div><div class="xj">放課後に体育館を使うには許可が必要だ。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">vehicle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">乗り物；車両</div><div class="ex">No <b>vehicles</b> can enter this street on Sundays.</div><div class="xj">日曜日は、この通りに車両は入れない。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">donation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">寄付（金）</div><div class="ex">Thanks to many <b>donations</b>, the town built a new park.</div><div class="xj">多くの寄付金のおかげで、町は新しい公園をつくった。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">destination</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目的地；行き先</div><div class="ex">Our final <b>destination</b> is a small island.</div><div class="xj">私たちの最終目的地は小さな島だ。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">charity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">慈善（団体）；チャリティー</div><div class="ex">Our class held a <b>charity</b> concert for sick children.</div><div class="xj">私たちのクラスは、病気の子どもたちのための慈善コンサートを開いた。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">
