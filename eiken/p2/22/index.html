lass="xj">ケンはグラウンドの向こうにいる友だちの名前を叫んだ。</div></button></li><li><button class="w" data-no="1055"><div class="top"><span class="no">1055</span><span class="en">drown</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">おぼれ死ぬ；おぼれる</div><div class="ex">Wear a life jacket so you won&#x27;t <b>drown</b> in the sea.</div><div class="xj">海でおぼれないように、ライフジャケットを着なさい。</div></button></li><li><button class="w" data-no="1056"><div class="top"><span class="no">1056</span><span class="en">possess</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を所有する</div><div class="ex">My uncle <b>possesses</b> a large house by the sea.</div><div class="xj">おじは海辺に大きな家を所有している。</div></button></li><li><button class="w" data-no="1057"><div class="top"><span class="no">1057</span><span class="en">guarantee</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を保証する</div><div class="ex">The store <b>guarantees</b> that the watch will work for two years.</div><div class="xj">その店は、その時計が2年間動くことを保証している。</div></button></li><li><button class="w" data-no="1058"><div class="top"><span class="no">1058</span><span class="en">rank</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（順位を）位置する；～を格付けする</div><div class="ex">Our soccer team <b>ranks</b> second in the city.</div><div class="xj">私たちのサッカーチームは、市内で2位に位置している。</div></button></li><li><button class="w" data-no="1059"><div class="top"><span class="no">1059</span><span class="en">found</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を設立する</div><div class="ex">This school was <b>founded</b> 100 years ago.</div><div class="xj">この学校は100年前に設立された。</div></button></li><li><button class="w" data-no="1060"><div class="top"><span class="no">1060</span><span class="en">swallow</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を飲み込む</div><div class="ex">Chew your food well before you <b>swallow</b> it.</div><div class="xj">食べ物はよくかんでから飲み込みなさい。</div></button></li><li><button class="w" data-no="1061"><div class="top"><span class="no">1061</span><span class="en">lean</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">寄りかかる；（体を）傾ける</div><div class="ex">Don&#x27;t <b>lean</b> against the doors of the train.</div><div class="xj">電車のドアに寄りかからないでください。</div></button></li><li><button class="w" data-no="1062"><div class="top"><span class="no">1062</span><span class="en">envy</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をうらやむ</div><div class="ex">I <b>envy</b> Emi because she can speak three languages.</div><div class="xj">3か国語を話せるエミを、私はうらやんでいる。</div></button></li><li><button class="w" data-no="1063"><div class="top"><span class="no">1063</span><span class="en">nod</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">うなずく</div><div class="ex">When I asked Emi for help, she <b>nodded</b> with a smile.</div><div class="xj">エミに手伝いを頼むと、彼女はほほえんでうなずいた。</div></button></li><li><button class="w" data-no="1064"><div class="top"><span class="no">1064</span><span class="en">shrink</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">縮む；小さくなる</div><div class="ex">My new sweater <b>shrank</b> in the wash.</div><div class="xj">私の新しいセーターは、洗濯で縮んだ。</div></button></li><li><button class="w" data-no="1065"><div class="top"><span class="no">1065</span><span class="en">sigh</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ため息をつく</div><div class="ex">Tom <b>sighed</b> when he saw his test score.</div><div class="xj">トムはテストの点数を見てため息をついた。</div></button></li><li><button class="w" data-no="1066"><div class="top"><span class="no">1066</span><span class="en">cheat</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ずるをする；カンニングする</div><div class="ex">It&#x27;s wrong to <b>cheat</b> when you play cards.</div><div class="xj">トランプでずるをするのは、いけないことだ。</div></button></li><li><button class="w" data-no="1067"><div class="top"><span class="no">1067</span><span class="en">resemble</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に似ている</div><div class="ex">Emi <b>resembles</b> her mother very much.</div><div class="xj">エミは母親にとてもよく似ている。</div></button></li><li><button class="w" data-no="1068"><div class="top"><span class="no">1068</span><span class="en">ceiling</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">天井</div><div class="ex">Lisa painted the <b>ceiling</b> of her room white.</div><div class="xj">リサは自分の部屋の天井を白く塗った。</div></button></li><li><button class="w" data-no="1069"><div class="top"><span class="no">1069</span><span class="en">poet</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">詩人</div><div class="ex">My favorite <b>poet</b> often writes about nature.</div><div class="xj">私の好きな詩人は、よく自然について書いている。</div></button></li><li><button class="w" data-no="1070"><div class="top"><span class="no">1070</span><span class="en">weapon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">武器</div><div class="ex">At the museum, we saw old <b>weapons</b> used by samurai.</div><div class="xj">博物館で、侍が使った古い武器を見た。</div></button></li><li><button class="w" data-no="1071"><div class="top"><span class="no">1071</span><span class="en">acquaintance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知り合い</div><div class="ex">She is not my friend, just an <b>acquaintance</b>.</div><div class="xj">彼女は友だちではなく、ただの知り合いだ。</div></button></li><li><button class="w" data-no="1072"><div class="top"><span class="no">1072</span><span class="en">virus</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ウイルス</div><div class="ex">My computer stopped working because of a <b>virus</b>.</div><div class="xj">ウイルスのせいで、私のコンピューターが動かなくなった。</div></button></li><li><button class="w" data-no="1073"><div class="top"><span class="no">1073</span><span class="en">absence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不在；欠席</div><div class="ex">Emi took care of the dog during her parents&#x27; <b>absence</b>.</div><div class="xj">両親の不在中、エミが犬の世話をした。</div></button></li><li><button class="w" data-no="1074"><div class="top"><span class="no">1074</span><span class="en">headquarters</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">本部；本社</div><div class="ex">The volunteer group&#x27;s <b>headquarters</b> is near the station.</div><div class="xj">そのボランティア団体の本部は駅の近くにある。</div></button></li><li><button class="w" data-no="1075"><div class="top"><span class="no">1075</span><span class="en">steel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">鋼鉄</div><div class="ex">This long bridge is made of <b>steel</b>.</div><div class="xj">この長い橋は鋼鉄でできている。</div></button></li><li><button class="w" data-no="1076"><div class="top"><span class="no">1076</span><span class="en">profession</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">職業；専門職</div><div class="ex">What <b>profession</b> do you want to have in the future?</div><div class="xj">将来、どんな職業につきたいですか。</div></button></li><li><button class="w" data-no="1077"><div class="top"><span class="no">1077</span><span class="en">heritage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">遺産</div><div class="ex">This old temple is part of our town&#x27;s <b>heritage</b>.</div><div class="xj">この古いお寺は、私たちの町の遺産の一つだ。</div></button></li><li><button class="w" data-no="1078"><div class="top"><span class="no">1078</span><span class="en">honesty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">正直</div><div class="ex">Everyone likes Ken because of his <b>honesty</b>.</div><div class="xj">ケンは正直なので、みんなに好かれている。</div></button></li><li><button class="w" data-no="1079"><div class="top"><span class="no">1079</span><span class="en">gravity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">重力</div><div class="ex">The moon&#x27;s <b>gravity</b> is weaker than the earth&#x27;s.</div><div class="xj">月の重力は地球の重力より弱い。</div></button></li><li><button class="w" data-no="1080"><div class="top"><span class="no">1080</span><span class="en">contract</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">契約（書）</div><div class="ex">The player signed a two-year <b>contract</b> with the team.</div><div class="xj">その選手はチームと2年間の契約を結んだ。</div></button></li><li><button class="w" data-no="1081"><div class="top"><span class="no">1081</span><span class="en">tribe</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部族</div><div class="ex">This <b>tribe</b> has lived in the forest for a long time.</div><div class="xj">この部族は、長い間その森で暮らしてきた。</div></button></li><li><button class="w" data-no="1082"><div class="top"><span class="no">1082</span><span class="en">loan</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">貸付金；ローン</div><div class="ex">My parents got a <b>loan</b> from the bank to buy a house.</div><div class="xj">両親は家を買うために、銀行からローンを借りた。</div></button></li><li><button class="w" data-no="1083"><div class="top"><span class="no">1083</span><span class="en">anger</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">怒り</div><div class="ex">Ken couldn&#x27;t hide his <b>anger</b> after the game.</div><div class="xj">ケンは試合の後、怒りを隠せなかった。</div></button></li><li><button class="w" data-no="1084"><div class="top"><span class="no">1084</span><span class="en">crazy</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">夢中で；ばかげた</div><div class="ex">My brother is <b>crazy</b> about video games.</div><div class="xj">弟はテレビゲームに夢中だ。</div></button></li><li><button class="w" data-no="1085"><div class="top"><span class="no">1085</span><span class="en">neat</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">きちんとした；こぎれいな</div><div class="ex">Emi&#x27;s notebook is always <b>neat</b> and clean.</div><div class="xj">エミのノートはいつもきちんとしていて、きれいだ。</div></button></li><li><button class="w" data-no="1086"><div class="top"><span class="no">1086</span><span class="en">selfish</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">わがままな；利己的な</div><div class="ex">It was <b>selfish</b> of Tom to eat all the cookies.</div><div class="xj">クッキーを全部食べてしまうなんて、トムはわがままだった。</div></button></li><li><button class="w" data-no="1087"><div class="top"><span class="no">1087</span><span class="en">cruel</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">残酷な</div><div class="ex">It is <b>cruel</b> to keep a big dog in a small cage.</div><div class="xj">大きな犬を小さなおりに入れておくのは残酷だ。</div></button></li><li><button class="w" data-no="1088"><div class="top"><span class="no">1088</span><span class="en">weird</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">奇妙な；変な</div><div class="ex">Tom wore a <b>weird</b> hat to the party.</div><div class="xj">トムはパーティーに奇妙な帽子をかぶってきた。</div></button></li><li><button class="w" data-no="1089"><div class="top"><span class="no">1089</span><span class="en">immediate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">即座の；すぐの</div><div class="ex">Thank you for your <b>immediate</b> reply to my email.</div><div class="xj">私のメールにすぐの返事をくれてありがとう。</div></button></li><li><button class="w" data-no="1090"><div class="top"><span class="no">1090</span><span class="en">eager</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">熱心な；（be eager to do）しきりに～したがる</div><div class="ex">Emi is an <b>eager</b> student who always asks questions.</div><div class="xj">エミはいつも質問をする熱心な生徒だ。</div></button></li><li><button class="w" data-no="1091"><div class="top
