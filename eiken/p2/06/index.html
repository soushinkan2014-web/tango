</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第6回</h1><div class="sub">No.251〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">exist</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">存在する</div><div class="ex">Do you think aliens really <b>exist</b>?</div><div class="xj">宇宙人は本当に存在すると思いますか。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">amaze</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をひどく驚かせる</div><div class="ex">The size of the whale <b>amazed</b> everyone on the boat.</div><div class="xj">クジラの大きさに、船の上のみんながひどく驚いた。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">deal</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（deal with ～）～を処理する；～に対処する</div><div class="ex">Ken <b>dealt</b> with the problem quickly.</div><div class="xj">ケンはその問題をすばやく処理した。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">manage</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を経営する；（manage to do）なんとか～する</div><div class="ex">My aunt <b>manages</b> a small hotel in Kyoto.</div><div class="xj">おばは京都で小さなホテルを経営している。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">earn</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（お金）をかせぐ；得る</div><div class="ex">Emi <b>earned</b> some money by washing her neighbors&#x27; cars.</div><div class="xj">エミは近所の人の車を洗ってお金をかせいだ。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">mention</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～について述べる；言及する</div><div class="ex">Ken <b>mentioned</b> his trip to Hokkaido in his speech.</div><div class="xj">ケンはスピーチの中で北海道旅行について述べた。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">occur</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">起こる；（考えが）浮かぶ</div><div class="ex">Mistakes often <b>occur</b> when you are in a hurry.</div><div class="xj">急いでいるときは、ミスがよく起こる。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">approach</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に近づく</div><div class="ex">A large ship was <b>approaching</b> the port.</div><div class="xj">大きな船が港に近づいていた。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">regret</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を後悔する</div><div class="ex">I <b>regret</b> not studying harder for the test.</div><div class="xj">テストのためにもっと勉強しなかったことを後悔している。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">link</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をつなぐ；結びつける</div><div class="ex">The new road <b>links</b> our town with the airport.</div><div class="xj">新しい道路が私たちの町と空港をつないでいる。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">decline</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">減少する；～を断る</div><div class="ex">The number of farmers in Japan is <b>declining</b>.</div><div class="xj">日本の農家の数は減少している。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">predict</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を予測する</div><div class="ex">It is hard to <b>predict</b> the weather in the mountains.</div><div class="xj">山の天気を予測するのは難しい。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">concern</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">心配；関心</div><div class="ex">My mother&#x27;s main <b>concern</b> is my health.</div><div class="xj">母のいちばんの心配は私の健康だ。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">ability</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">能力</div><div class="ex">Lisa has the <b>ability</b> to speak three languages.</div><div class="xj">リサには3か国語を話す能力がある。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">development</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">発達；開発</div><div class="ex">Sleep is important for the <b>development</b> of young children.</div><div class="xj">睡眠は幼い子どもの発達にとって大切だ。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">industry</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">産業；工業</div><div class="ex">The car <b>industry</b> is important to this city.</div><div class="xj">自動車産業はこの市にとって重要だ。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">content</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">内容；（contentsで）中身</div><div class="ex">The <b>content</b> of the speech was very interesting.</div><div class="xj">そのスピーチの内容はとてもおもしろかった。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">access</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">利用；接近（の方法）</div><div class="ex">All students have <b>access</b> to the school library.</div><div class="xj">全校生徒が学校図書館を利用できる。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">assignment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">宿題；割り当てられた仕事</div><div class="ex">I have to finish my math <b>assignment</b> by Friday.</div><div class="xj">金曜日までに数学の宿題を終えなければならない。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">effect</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">効果；影響</div><div class="ex">This medicine has a good <b>effect</b> on colds.</div><div class="xj">この薬はかぜによく効果がある。</div></button></li><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">trick</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">たくらみ；こつ；手品</div><div class="ex">In the story, the fox&#x27;s <b>trick</b> did not work.</div><div class="xj">その物語では、キツネのたくらみはうまくいかなかった。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">airline</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">航空会社</div><div class="ex">This <b>airline</b> flies to many cities in Asia.</div><div class="xj">この航空会社はアジアの多くの都市に便を出している。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">demand</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">需要；要求</div><div class="ex">The <b>demand</b> for electric cars is growing.</div><div class="xj">電気自動車の需要が高まっている。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">beauty</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">美しさ</div><div class="ex">We were moved by the <b>beauty</b> of the mountains.</div><div class="xj">私たちは山々の美しさに感動した。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">trail</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（山などの）小道</div><div class="ex">We walked along a mountain <b>trail</b> to the lake.</div><div class="xj">私たちは湖まで山の小道を歩いた。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">position</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">位置；地位</div><div class="ex">Please show me the <b>position</b> of our school on this map.</div><div class="xj">この地図で、私たちの学校の位置を教えてください。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">emotion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">感情</div><div class="ex">It is sometimes hard to hide your <b>emotions</b>.</div><div class="xj">自分の感情を隠すのは、ときに難しい。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">resource</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">資源；資料</div><div class="ex">Water is an important natural <b>resource</b>.</div><div class="xj">水は大切な天然資源だ。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">supply</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">供給；（suppliesで）必需品</div><div class="ex">The <b>supply</b> of water stopped for two hours.</div><div class="xj">水の供給が2時間止まった。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">laundry</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">洗濯（物）</div><div class="ex">I help my mother with the <b>laundry</b> on Sundays.</div><div class="xj">日曜日には母の洗濯を手伝う。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">contrast</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">対照；対比</div><div class="ex">The <b>contrast</b> between the white snow and the blue sky was beautiful.</div><div class="xj">白い雪と青い空の対照が美しかった。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">display</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">展示；陳列</div><div class="ex">The <b>display</b> of old toys at the museum was popular.</div><div class="xj">博物館の古いおもちゃの展示は人気があった。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">issue</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">問題；（雑誌などの）号</div><div class="ex">Food waste is a serious <b>issue</b> in Japan.</div><div class="xj">食品ロスは日本で深刻な問題だ。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">fat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">脂肪</div><div class="ex">This meat has too much <b>fat</b>.</div><div class="xj">この肉は脂肪が多すぎる。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">rental</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">賃貸し；レンタル</div><div class="ex">Bike <b>rental</b> costs 500 yen a day.</div><div class="xj">自転車のレンタルは1日500円だ。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">site</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">用地；場所；（ウェブ）サイト</div><div class="ex">This is the <b>site</b> for the new library.</div><div class="xj">ここが新しい図書館の用地だ。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">population</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">人口</div><div class="ex">The <b>population</b> of this town is about 5,000.</div><div class="xj">この町の人口は約5,000人だ。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">relationship</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">関係</div><div class="ex">Ken has a good <b>relationship</b> with his classmates.</div><div class="xj">ケンはクラスメートとよい関係にある。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">particular</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">特定の；特別の</div><div class="ex">Is there a <b>particular</b> book you want to read?</div><div class="xj">読みたい特定の本はありますか。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">specific</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">具体的な；特定の</div><div class="ex">Can you give me a more <b>specific</b> example?</div><div class="xj">もっと具体的な例を挙げてくれますか。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">global</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">地球規模の；世界的な</d
