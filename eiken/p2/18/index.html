</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第18回</h1><div class="sub">No.851〜900</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="851"><div class="top"><span class="no">851</span><span class="en">motivate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～にやる気を起こさせる</div><div class="ex">Our coach knows how to <b>motivate</b> the players.</div><div class="xj">コーチは選手たちにやる気を起こさせる方法を知っている。</div></button></li><li><button class="w" data-no="852"><div class="top"><span class="no">852</span><span class="en">crash</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">衝突する；墜落する</div><div class="ex">Tom&#x27;s toy car <b>crashed</b> into the wall.</div><div class="xj">トムのおもちゃの車がかべに衝突した。</div></button></li><li><button class="w" data-no="853"><div class="top"><span class="no">853</span><span class="en">spoil</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を台無しにする；（子ども）を甘やかす</div><div class="ex">The noise <b>spoiled</b> our quiet evening.</div><div class="xj">その騒音が、私たちの静かな夜を台無しにした。</div></button></li><li><button class="w" data-no="854"><div class="top"><span class="no">854</span><span class="en">hug</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を抱きしめる</div><div class="ex">Emi <b>hugged</b> her little sister tightly.</div><div class="xj">エミは妹をぎゅっと抱きしめた。</div></button></li><li><button class="w" data-no="855"><div class="top"><span class="no">855</span><span class="en">clap</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（手）をたたく；拍手する</div><div class="ex">Everyone <b>clapped</b> their hands to the music.</div><div class="xj">みんなが音楽に合わせて手をたたいた。</div></button></li><li><button class="w" data-no="856"><div class="top"><span class="no">856</span><span class="en">bark</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">ほえる</div><div class="ex">Our dog always <b>barks</b> when someone comes to the door.</div><div class="xj">だれかが玄関に来ると、うちの犬はいつもほえる。</div></button></li><li><button class="w" data-no="857"><div class="top"><span class="no">857</span><span class="en">sink</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">沈む；～を沈める</div><div class="ex">The sun <b>sank</b> slowly into the sea.</div><div class="xj">太陽がゆっくりと海に沈んだ。</div></button></li><li><button class="w" data-no="858"><div class="top"><span class="no">858</span><span class="en">resist</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に抵抗する；～をがまんする</div><div class="ex">The cat <b>resisted</b> when I tried to wash it.</div><div class="xj">洗おうとしたら、ねこは抵抗した。</div></button></li><li><button class="w" data-no="859"><div class="top"><span class="no">859</span><span class="en">obtain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を手に入れる；得る</div><div class="ex">You can <b>obtain</b> a map at the tourist office.</div><div class="xj">観光案内所で地図を手に入れることができる。</div></button></li><li><button class="w" data-no="860"><div class="top"><span class="no">860</span><span class="en">convert</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を変える；転換する</div><div class="ex">This machine <b>converts</b> sunlight into electricity.</div><div class="xj">この機械は日光を電気に変える。</div></button></li><li><button class="w" data-no="861"><div class="top"><span class="no">861</span><span class="en">slip</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">すべる；滑って転ぶ</div><div class="ex">Tom <b>slipped</b> on the icy road this morning.</div><div class="xj">トムは今朝、凍った道ですべった。</div></button></li><li><button class="w" data-no="862"><div class="top"><span class="no">862</span><span class="en">deserve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に値する；～を受けるにふさわしい</div><div class="ex">Emi practiced very hard, so she <b>deserves</b> the prize.</div><div class="xj">エミはとても熱心に練習したので、その賞に値する。</div></button></li><li><button class="w" data-no="863"><div class="top"><span class="no">863</span><span class="en">threaten</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をおどす；おびやかす</div><div class="ex">The big dog <b>threatened</b> the cat by barking.</div><div class="xj">大きな犬がほえて、ねこをおどした。</div></button></li><li><button class="w" data-no="864"><div class="top"><span class="no">864</span><span class="en">intend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（intend to do）～するつもりである</div><div class="ex">I <b>intend</b> to study abroad next year.</div><div class="xj">私は来年、留学するつもりだ。</div></button></li><li><button class="w" data-no="865"><div class="top"><span class="no">865</span><span class="en">refund</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">払い戻し；返金</div><div class="ex">Can I get a <b>refund</b> for this shirt?</div><div class="xj">このシャツの代金の払い戻しをしてもらえますか。</div></button></li><li><button class="w" data-no="866"><div class="top"><span class="no">866</span><span class="en">rival</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">競争相手；ライバル</div><div class="ex">The two schools have been <b>rivals</b> for many years.</div><div class="xj">その2つの学校は長年の競争相手だ。</div></button></li><li><button class="w" data-no="867"><div class="top"><span class="no">867</span><span class="en">certificate</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">証明書；免許状</div><div class="ex">Emi received a <b>certificate</b> for finishing the English course.</div><div class="xj">エミは英語講座を修了して証明書を受け取った。</div></button></li><li><button class="w" data-no="868"><div class="top"><span class="no">868</span><span class="en">cave</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">洞くつ；ほら穴</div><div class="ex">We explored a dark <b>cave</b> near the beach.</div><div class="xj">私たちは浜辺の近くの暗い洞くつを探検した。</div></button></li><li><button class="w" data-no="869"><div class="top"><span class="no">869</span><span class="en">religion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宗教</div><div class="ex">Students learn about different <b>religions</b> in this class.</div><div class="xj">この授業で、生徒たちはさまざまな宗教について学ぶ。</div></button></li><li><button class="w" data-no="870"><div class="top"><span class="no">870</span><span class="en">pill</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">錠剤</div><div class="ex">Take this <b>pill</b> before going to bed.</div><div class="xj">寝る前にこの錠剤を飲みなさい。</div></button></li><li><button class="w" data-no="871"><div class="top"><span class="no">871</span><span class="en">fur</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">毛皮；（動物の）毛</div><div class="ex">This coat is made of fake <b>fur</b>.</div><div class="xj">このコートは人工の毛皮でできている。</div></button></li><li><button class="w" data-no="872"><div class="top"><span class="no">872</span><span class="en">stove</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（料理用の）コンロ；ストーブ</div><div class="ex">Mom is cooking soup on the <b>stove</b>.</div><div class="xj">母はコンロでスープを作っている。</div></button></li><li><button class="w" data-no="873"><div class="top"><span class="no">873</span><span class="en">nest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">巣</div><div class="ex">A bird built a <b>nest</b> in our tree.</div><div class="xj">1羽の鳥がうちの木に巣を作った。</div></button></li><li><button class="w" data-no="874"><div class="top"><span class="no">874</span><span class="en">drawer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">引き出し</div><div class="ex">The scissors are in the top <b>drawer</b>.</div><div class="xj">はさみはいちばん上の引き出しに入っている。</div></button></li><li><button class="w" data-no="875"><div class="top"><span class="no">875</span><span class="en">envelope</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">封筒</div><div class="ex">Lisa put the letter in an <b>envelope</b>.</div><div class="xj">リサは手紙を封筒に入れた。</div></button></li><li><button class="w" data-no="876"><div class="top"><span class="no">876</span><span class="en">lane</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">車線；小道</div><div class="ex">This highway has three <b>lanes</b> on each side.</div><div class="xj">この高速道路は片側3車線だ。</div></button></li><li><button class="w" data-no="877"><div class="top"><span class="no">877</span><span class="en">skin</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">皮膚；肌</div><div class="ex">Too much sun is bad for your <b>skin</b>.</div><div class="xj">日光を浴びすぎるのは皮膚によくない。</div></button></li><li><button class="w" data-no="878"><div class="top"><span class="no">878</span><span class="en">restroom</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（公共の建物の）トイレ；化粧室</div><div class="ex">Excuse me, where is the <b>restroom</b>?</div><div class="xj">すみません、トイレはどこですか。</div></button></li><li><button class="w" data-no="879"><div class="top"><span class="no">879</span><span class="en">brick</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">れんが</div><div class="ex">The old house is made of red <b>bricks</b>.</div><div class="xj">その古い家は赤いれんがでできている。</div></button></li><li><button class="w" data-no="880"><div class="top"><span class="no">880</span><span class="en">architecture</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">建築；建築様式</div><div class="ex">Lisa is interested in old Japanese <b>architecture</b>.</div><div class="xj">リサは日本の古い建築に興味がある。</div></button></li><li><button class="w" data-no="881"><div class="top"><span class="no">881</span><span class="en">laughter</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">笑い（声）</div><div class="ex">The room was filled with <b>laughter</b>.</div><div class="xj">部屋は笑い声であふれていた。</div></button></li><li><button class="w" data-no="882"><div class="top"><span class="no">882</span><span class="en">entry</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">入ること；参加（申し込み）</div><div class="ex"><b>Entry</b> to the museum is free for children.</div><div class="xj">子どもは博物館への入場が無料だ。</div></button></li><li><button class="w" data-no="883"><div class="top"><span class="no">883</span><span class="en">occasion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（特定の）時；場合；行事</div><div class="ex">I wear this dress only on special <b>occasions</b>.</div><div class="xj">このドレスは特別な時にだけ着る。</div></button></li><li><button class="w" data-no="884"><div class="top"><span class="no">884</span><span class="en">volume</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">音量；量；（本の）巻</div><div class="ex">Please turn down the <b>volume</b> of the TV.</div><div class="xj">テレビの音量を下げてください。</div></button></li><li><button class="w" data-no="885"><div class="top"><span class="no">885</span><span class="en">version</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">版；バージョン</div><div class="ex">Please download the newest <b>version</b> of the app.</div><div class="xj">アプリの最新版をダウンロードしてください。</div></button></li><li><button class="w" data-no="886"><div class="top"><span class="no">886</span><span class="en">exception</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">例外</div><div class="ex">There are no <b>exceptions</b> to this rule.</div><div class="xj">この規則に例外はない。</div></button></li><li><button class="w" data-no="887"><div class="top"><span class="no">887</span><span class="en">concept</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">概念；考え</div><div class="ex">The <b>concept</b> of zero is hard for young children.</div><div class="xj">ゼロという概念は、幼い子どもには難しい。</div></button></li><li><button class="w" data-no="888"><div class="top"><span class="no">888</span><span class="en">pride</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">誇り；自尊心</div><div class="ex">The team&#x27;s win filled the town with <b>pride</b>.</div><div class="xj">チームの勝利で、町は誇りに満ちた。</div></button></li><li><button class="w" data-no="889"><div class="top"><span class="no">889</span><span class="en">nap</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">昼寝；うたた寝</div><div class="ex">My grandfather takes a <b>nap</b> after lunch.</div><div class="xj">祖父は昼食後に昼寝をする。</div></button></li><li><button class="w" data-no="890"><div class="top"><span class="no">890</span><span class="en">threat</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">脅威；おどし</div><div class="ex">Plastic trash is a <b>threat</b> to sea animals.</div><div class="xj">プラスチックごみは海の動物にとって脅威だ。</div></button></li><li><button class="w" data-no="891"><div class="top"><span class="no">891</span><span class="en">awake</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">目が覚めて；眠らずに</div><div class="ex">I was still <b>awake</b> at midnight.</div><div class="xj">真夜中になっても、私はまだ目が覚めていた。</div></button></li><li><button class="w" data-no="892"><div class="top"><span class="no">892</span
