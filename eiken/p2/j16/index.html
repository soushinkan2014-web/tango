 ～</span></div><div class="ja">～と時間を過ごす</div><div class="ex">I like to spend time with my family on weekends.</div><div class="xj">週末は家族と時間を過ごすのが好きだ。</div></button></li><li><button class="w" data-no="熟156"><div class="top"><span class="no">熟156</span><span class="en">make money</span></div><div class="ja">お金をかせぐ</div><div class="ex">Many high school students work part-time to make money.</div><div class="xj">お金をかせぐためにアルバイトをする高校生は多い。</div></button></li><li><button class="w" data-no="熟157"><div class="top"><span class="no">熟157</span><span class="en">one another</span></div><div class="ja">お互い</div><div class="ex">Club members should help one another.</div><div class="xj">部員はお互いに助け合うべきだ。</div></button></li><li><button class="w" data-no="熟158"><div class="top"><span class="no">熟158</span><span class="en">in public</span></div><div class="ja">人前で、公共の場で</div><div class="ex">Don&#x27;t talk loudly on the phone in public.</div><div class="xj">公共の場で大声で電話してはいけない。</div></button></li><li><button class="w" data-no="熟159"><div class="top"><span class="no">熟159</span><span class="en">face to face</span></div><div class="ja">面と向かって、直接会って</div><div class="ex">It&#x27;s better to talk face to face than by e-mail.</div><div class="xj">Eメールより直接会って話すほうがよい。</div></button></li><li><button class="w" data-no="熟160"><div class="top"><span class="no">熟160</span><span class="en">be harmful to ～</span></div><div class="ja">～に有害である</div><div class="ex">Too much screen time is harmful to your eyes.</div><div class="xj">画面を長時間見すぎることは目に有害だ。</div></button></li><li><button class="w" data-no="会76"><div class="top"><span class="no">会76</span><span class="en">I&#x27;d rather ～.</span></div><div class="ja">（どちらかといえば）～したい。</div><div class="ex">A: Do you want to go out for dinner?<br>B: I&#x27;d rather eat at home tonight.</div></button></li><li><button class="w" data-no="会77"><div class="top"><span class="no">会77</span><span class="en">It&#x27;s up to you.</span></div><div class="ja">あなた次第だよ。（任せるよ）</div><div class="ex">A: Should we watch a movie or play games?<br>B: It&#x27;s up to you.</div></button></li><li><button class="w" data-no="会78"><div class="top"><span class="no">会78</span><span class="en">Either is fine.</span></div><div class="ja">どちらでもいいよ。</div><div class="ex">A: Would you like tea or coffee?<br>B: Either is fine, thanks.</div></button></li><li><button class="w" data-no="会79"><div class="top"><span class="no">会79</span><span class="en">I don&#x27;t mind.</span></div><div class="ja">かまわないよ。</div><div class="ex">A: Is it OK if my brother comes with us?<br>B: Sure, I don&#x27;t mind.</div></button></li><li><button class="w" data-no="会80"><div class="top"><span class="no">会80</span><span class="en">I&#x27;ll go with ～.</span></div><div class="ja">～にします。（選ぶ）</div><div class="ex">A: We have chocolate cake and cheesecake.<br>B: I&#x27;ll go with the cheesecake.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j15/">← 熟語 Set 15</a><a href="../j17/">熟語 Set 17 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟151": 5.51, "熟152": 19.98, "熟153": 35.57, "熟154": 49.66, "熟155": 64.6, "熟156": 79.22, "熟157": 92.99, "熟158": 105.46, "熟159": 119.52, "熟160": 135.1, "会76": 149.59, "会77": 166.04, "会78": 183.53, "会79": 199.44, "会80": 215.36}, "TE": {"熟151": 7.5, "熟152": 22.02, "熟153": 37.44, "熟154": 51.6, "熟155": 66.67, "熟156": 81.09, "熟157": 94.86, "熟158": 107.34, "熟159": 121.71, "熟160": 137.14, "会76": 151.46, "会77": 167.94, "会78": 185.55, "会79": 201.38, "会80": 217.24}, "Q": [["熟151", "in my opinion", "私の意見では"], ["熟152", "for instance", "たとえば"], ["熟153", "compared with ～", "～と比べると"], ["熟154", "have a chance to ～", "～する機会がある"], ["熟155", "spend time with ～", "～と時間を過ごす"], ["熟156", "make money", "お金をかせぐ"], ["熟157", "one another", "お互い"], ["熟158", "in public", "人前で、公共の場で"], ["熟159", "face to face", "面と向かって、直接会って"], ["熟160", "be harmful t
