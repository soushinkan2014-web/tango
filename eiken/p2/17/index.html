</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第17回</h1><div class="sub">No.801〜850</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">roast</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を焼く；あぶる</div><div class="ex">We <b>roasted</b> corn over the fire at the camp.</div><div class="xj">キャンプで私たちは火でトウモロコシを焼いた。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">judge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を判断する；審査する</div><div class="ex">Don&#x27;t <b>judge</b> people by how they look.</div><div class="xj">人を見た目で判断してはいけない。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">install</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り付ける；（ソフト）をインストールする</div><div class="ex">We <b>installed</b> a new air conditioner in the living room.</div><div class="xj">私たちは居間に新しいエアコンを取り付けた。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">exhibit</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を展示する</div><div class="ex">The museum <b>exhibits</b> paintings by local artists.</div><div class="xj">その美術館は地元の画家の絵を展示している。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">stare</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（stare at ～）～をじっと見つめる</div><div class="ex">The baby <b>stared</b> at the colorful balloons.</div><div class="xj">赤ちゃんはカラフルな風船をじっと見つめた。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">ban</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を禁止する</div><div class="ex">Our city <b>banned</b> smoking in parks.</div><div class="xj">私たちの市は公園での喫煙を禁止した。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">conduct</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（調査など）を行う</div><div class="ex">The students <b>conducted</b> a survey about school lunches.</div><div class="xj">生徒たちは給食についての調査を行った。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">punish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を罰する</div><div class="ex">Tom was <b>punished</b> for breaking the window.</div><div class="xj">トムは窓を割ったことで罰せられた。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">arrest</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を逮捕する</div><div class="ex">The police <b>arrested</b> the man at the airport.</div><div class="xj">警察は空港でその男を逮捕した。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">prohibit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を禁止する</div><div class="ex">Swimming is <b>prohibited</b> in this river.</div><div class="xj">この川では泳ぐことが禁止されている。</div></button></li><li><button class="w" data-no="811"><div class="top"><span class="no">811</span><span class="en">establish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を設立する；確立する</div><div class="ex">This school was <b>established</b> in 1950.</div><div class="xj">この学校は1950年に設立された。</div></button></li><li><button class="w" data-no="812"><div class="top"><span class="no">812</span><span class="en">decoration</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">飾り；装飾</div><div class="ex">We made paper <b>decorations</b> for the Christmas party.</div><div class="xj">私たちはクリスマス会のために紙の飾りを作った。</div></button></li><li><button class="w" data-no="813"><div class="top"><span class="no">813</span><span class="en">shipping</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">発送；配送</div><div class="ex"><b>Shipping</b> to Hokkaido takes about three days.</div><div class="xj">北海道への発送には約3日かかります。</div></button></li><li><button class="w" data-no="814"><div class="top"><span class="no">814</span><span class="en">gasoline</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ガソリン</div><div class="ex">The price of <b>gasoline</b> went up again.</div><div class="xj">ガソリンの値段がまた上がった。</div></button></li><li><button class="w" data-no="815"><div class="top"><span class="no">815</span><span class="en">postage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">郵便料金</div><div class="ex">How much is the <b>postage</b> for this letter?</div><div class="xj">この手紙の郵便料金はいくらですか。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">vegetarian</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">菜食主義者</div><div class="ex">Lisa is a <b>vegetarian</b>, so she doesn&#x27;t eat meat.</div><div class="xj">リサは菜食主義者なので、肉を食べない。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">biology</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">生物学</div><div class="ex">Emi wants to study <b>biology</b> at university.</div><div class="xj">エミは大学で生物学を学びたいと思っている。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">cage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">鳥かご；おり</div><div class="ex">The bird is singing in its <b>cage</b>.</div><div class="xj">鳥が鳥かごの中で歌っている。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">flashlight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">懐中電灯</div><div class="ex">Take a <b>flashlight</b> when you go camping.</div><div class="xj">キャンプに行くときは懐中電灯を持っていきなさい。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">wool</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">羊毛；ウール</div><div class="ex">This warm sweater is made of <b>wool</b>.</div><div class="xj">この暖かいセーターは羊毛でできている。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">wrist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">手首</div><div class="ex">Lisa wears a watch on her left <b>wrist</b>.</div><div class="xj">リサは左の手首に腕時計をしている。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">grocery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（groceriesで）食料品；食料雑貨店</div><div class="ex">Can you help me carry the <b>groceries</b>?</div><div class="xj">食料品を運ぶのを手伝ってくれる？</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">poem</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">詩</div><div class="ex">Emi wrote a <b>poem</b> about her hometown.</div><div class="xj">エミは故郷についての詩を書いた。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">trainer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">トレーナー；指導者</div><div class="ex">My <b>trainer</b> at the gym is very kind.</div><div class="xj">ジムの私のトレーナーはとても親切だ。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">wheel</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">車輪；ハンドル</div><div class="ex">One <b>wheel</b> of my bike is broken.</div><div class="xj">私の自転車の車輪が1つこわれている。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">physics</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">物理学</div><div class="ex">Tom is good at <b>physics</b> and math.</div><div class="xj">トムは物理学と数学が得意だ。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">cotton</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">綿；木綿</div><div class="ex"><b>Cotton</b> shirts are comfortable in hot weather.</div><div class="xj">綿のシャツは暑い日に着心地がよい。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">fence</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">塀；さく</div><div class="ex">The dog jumped over the <b>fence</b>.</div><div class="xj">犬が塀を飛び越えた。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">row</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">列</div><div class="ex">We sat in the front <b>row</b> at the concert.</div><div class="xj">私たちはコンサートで最前列に座った。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">vocabulary</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">語い；単語</div><div class="ex">Reading books helps you build your <b>vocabulary</b>.</div><div class="xj">本を読むと語いが増える。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">translation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">翻訳</div><div class="ex">This book is a Japanese <b>translation</b> of an English novel.</div><div class="xj">この本は、英語の小説を日本語に翻訳したものだ。</div></button></li><li><button class="w" data-no="832"><div class="top"><span class="no">832</span><span class="en">quantity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">量</div><div class="ex">Quality is more important than <b>quantity</b>.</div><div class="xj">量より質のほうが大切だ。</div></button></li><li><button class="w" data-no="833"><div class="top"><span class="no">833</span><span class="en">track</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（競技場の）トラック；線路；跡</div><div class="ex">The runners ran around the <b>track</b> five times.</div><div class="xj">走者たちはトラックを5周走った。</div></button></li><li><button class="w" data-no="834"><div class="top"><span class="no">834</span><span class="en">satellite</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人工衛星</div><div class="ex">The <b>satellite</b> sends pictures of the earth.</div><div class="xj">その人工衛星は地球の写真を送ってくる。</div></button></li><li><button class="w" data-no="835"><div class="top"><span class="no">835</span><span class="en">reputation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">評判</div><div class="ex">This restaurant has a good <b>reputation</b>.</div><div class="xj">このレストランは評判がよい。</div></button></li><li><button class="w" data-no="836"><div class="top"><span class="no">836</span><span class="en">instance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">例；（for instance）例えば</div><div class="ex">This is just one <b>instance</b> of his kindness.</div><div class="xj">これは彼の親切さのほんの一例にすぎない。</div></button></li><li><button class="w" data-no="837"><div class="top"><span class="no">837</span><span class="en">globe</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地球；地球儀</div><div class="ex">People all over the <b>globe</b> enjoy soccer.</div><div class="xj">地球上のあらゆる所で、人々がサッカーを楽しんでいる。</div></button></li><li><button class="w" data-no="838"><div class="top"><span class="no">838</span><span class="en">saving</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（savingsで）貯金</div><div class="ex">Lisa bought a guitar with her <b>savings</b>.</div><div class="xj">リサは貯金でギターを買った。</div></button></li><li><button class="w" data-no="839"><div class="top"><span class="no">839</span><span class="en">victim</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">犠牲者；被害者</div><div class="ex">Tom was the <b>victim</b> of his sister&#x27;s joke.</div><div class="xj">トムは姉のいたずらの犠牲者になった。</div></button></li><li><button class="w" data-no="840"><div class="top"><span class="no">840</span><span class="en">politics</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">政治</div><div class="ex">My father likes to talk about <b>politics</b>.</div><div class="xj">父は政治について話すのが好きだ。</div></button></li><li><button class="w" data-no="841"><div class="top"><span class="no">841</span><span class="en">sidewalk</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">歩道</div><div class="ex">Please walk on the <b>sidewalk</b>, not on the road.</div><div class="xj">車道ではなく歩道を歩いてください。</div></button></li><li><button class="w" data-no="842"><div class="top"><span class="no">842</span><span class="en">c
