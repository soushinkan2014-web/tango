>兄は冬になるとよく頭痛に苦しんでいる。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">trust</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を信頼する</div><div class="ex">You can <b>trust</b> Ken because he always keeps his promises.</div><div class="xj">ケンはいつも約束を守るから、信頼してだいじょうぶだよ。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">succeed</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">成功する；（succeed in -ing）～に成功する</div><div class="ex">After a lot of practice, Tom finally <b>succeeded</b>.</div><div class="xj">たくさん練習したあと、トムはついに成功した。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">transport</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を輸送する</div><div class="ex">Big ships <b>transport</b> cars to many countries.</div><div class="xj">大きな船が多くの国へ車を輸送している。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">depend</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（depend on ～）～しだいである；～に頼る</div><div class="ex">Our plans for tomorrow <b>depend</b> on the weather.</div><div class="xj">明日の予定は天気しだいだ。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">decrease</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">減る；～を減らす</div><div class="ex">The number of children in this town has <b>decreased</b>.</div><div class="xj">この町の子どもの数は減った。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">provide</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を提供する；与える</div><div class="ex">The school <b>provides</b> lunch for all students.</div><div class="xj">その学校は全生徒に昼食を提供している。</div></button></li><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">strike</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を打つ；（災害などが）～を襲う</div><div class="ex">Tom <b>struck</b> the ball hard with his bat.</div><div class="xj">トムはバットで強くボールを打った。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">fry</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を油でいためる；揚げる</div><div class="ex">Dad <b>fried</b> onions and meat in a pan.</div><div class="xj">父はフライパンで玉ねぎと肉を油でいためた。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">regard</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（regard A as B）AをBとみなす</div><div class="ex">Many people <b>regard</b> Tom as the best player on the team.</div><div class="xj">多くの人が、トムをチームでいちばんの選手とみなしている。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">prefer</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～のほうを好む</div><div class="ex">I <b>prefer</b> tea to coffee in the morning.</div><div class="xj">朝はコーヒーより紅茶のほうが好きだ。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">erase</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を消す</div><div class="ex">Please <b>erase</b> the board after class.</div><div class="xj">授業のあとで黒板の字を消してください。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">compare</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を比べる</div><div class="ex">Emi <b>compared</b> the prices at two stores.</div><div class="xj">エミは2つの店の値段を比べた。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">escape</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">逃げる；～を免れる</div><div class="ex">A bird <b>escaped</b> from its cage this morning.</div><div class="xj">けさ、鳥がかごから逃げた。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">remove</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を取り除く</div><div class="ex">Tom <b>removed</b> the stones from the garden.</div><div class="xj">トムは庭から石を取り除いた。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">delay</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を遅らせる</div><div class="ex">We <b>delayed</b> the start of the game because of rain.</div><div class="xj">雨のため、私たちは試合の開始を遅らせた。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">effort</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">努力</div><div class="ex">Emi made a great <b>effort</b> to pass the test.</div><div class="xj">エミはテストに合格するために大変な努力をした。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">variety</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">多様性；（a variety of ～）さまざまな～</div><div class="ex">This city is known for the <b>variety</b> of its cultures.</div><div class="xj">この都市は文化の多様性で知られている。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">receipt</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">領収書；レシート</div><div class="ex">The clerk gave me a <b>receipt</b> for the new desk.</div><div class="xj">店員は新しい机の領収書をくれた。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">bowl</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">はち；どんぶり</div><div class="ex">Mom put the salad in a large glass <b>bowl</b>.</div><div class="xj">母はサラダを大きなガラスのはちに入れた。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">ingredient</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（料理の）材料</div><div class="ex">Eggs and milk are the main <b>ingredients</b> of this cake.</div><div class="xj">卵と牛乳がこのケーキの主な材料だ。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">section</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">区域；部分</div><div class="ex">Children&#x27;s books are in this <b>section</b> of the library.</div><div class="xj">子ども向けの本は、図書館のこの区域にある。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">movement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">動き；運動</div><div class="ex">The cat watched every <b>movement</b> of the bird.</div><div class="xj">ねこは鳥の動きをじっと見ていた。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">pattern</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">模様；型</div><div class="ex">Emi&#x27;s new dress has a flower <b>pattern</b>.</div><div class="xj">エミの新しいドレスには花の模様がついている。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">fault</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">欠点；責任</div><div class="ex">His only <b>fault</b> is that he talks too much.</div><div class="xj">彼の唯一の欠点は、しゃべりすぎることだ。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><s
