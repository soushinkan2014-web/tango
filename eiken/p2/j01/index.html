e test.</div><div class="xj">気楽にね。テストはきっとうまくいくよ。</div></button></li><li><button class="w" data-no="熟6"><div class="top"><span class="no">熟6</span><span class="en">take care of ～</span></div><div class="ja">～を引き受ける、～の世話をする</div><div class="ex">Don&#x27;t worry. I&#x27;ll take care of the cleaning.</div><div class="xj">心配しないで。掃除は私が引き受けるよ。</div></button></li><li><button class="w" data-no="熟7"><div class="top"><span class="no">熟7</span><span class="en">take part in ～</span></div><div class="ja">～に参加する</div><div class="ex">Over 100 students took part in the contest.</div><div class="xj">100人以上の生徒がそのコンテストに参加した。</div></button></li><li><button class="w" data-no="熟8"><div class="top"><span class="no">熟8</span><span class="en">take advantage of ～</span></div><div class="ja">～を利用する</div><div class="ex">You should take advantage of this chance.</div><div class="xj">このチャンスを利用するべきだよ。</div></button></li><li><button class="w" data-no="熟9"><div class="top"><span class="no">熟9</span><span class="en">take after ～</span></div><div class="ja">～（親など）に似ている</div><div class="ex">Kenta takes after his father.</div><div class="xj">健太は父親に似ている。</div></button></li><li><button class="w" data-no="熟10"><div class="top"><span class="no">熟10</span><span class="en">take out ～</span></div><div class="ja">～を取り出す、（ごみ）を出す</div><div class="ex">Could you take out the trash?</div><div class="xj">ごみを出してくれる？</div></button></li><li><button class="w" data-no="会1"><div class="top"><span class="no">会1</span><span class="en">How have you been?</span></div><div class="ja">元気にしてた？（久しぶりに会って）</div><div class="ex">A: Hi, Ken! It&#x27;s me, Emi.<br>B: Emi! How have you been?</div></button></li><li><button class="w" data-no="会2"><div class="top"><span class="no">会2</span><span class="en">It&#x27;s been a while.</span></div><div class="ja">久しぶりだね。</div><div class="ex">A: Hello, Mr. Brown. Do you remember me?<br>B: Of course, Aya! It&#x27;s been a while.</div></button></li><li><button class="w" data-no="会3"><div class="top"><span class="no">会3</span><span class="en">How did it go?</span></div><div class="ja">どうだった？（結果をたずねる）</div><div class="ex">A: I had my piano contest yesterday.<br>B: Oh, really? How did it go?</div></button></li><li><button class="w" data-no="会4"><div class="top"><span class="no">会4</span><span class="en">Not really.</span></div><div class="ja">あまり（そうでもない）。</div><div class="ex">A: Was the movie exciting?<br>B: Not really. It was a little boring.</div></button></li><li><button class="w" data-no="会5"><div class="top"><span class="no">会5</span><span class="en">Guess what!</span></div><div class="ja">ねえ、聞いて！</div><div class="ex">A: You look happy, Tom.<br>B: Guess what! I got a ticket for the concert.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../24/">← 第24回</a><a href="../j02/">熟語 Set 2 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟1": 5.15, "熟2": 19.83, "熟3": 35.14, "熟4": 48.46, "熟5": 61.12, "熟6": 76.43, "熟7": 92.48, "熟8": 106.64, "熟9": 120.46, "熟10": 133.75, "会1": 147.4, "会2": 167.89, "会3": 187.28, "会4": 206.56, "会5": 223.52}, "TE": {"熟1": 7.07, "熟2": 22.42, "熟3": 37.04, "熟4": 50.47, "熟5": 63.07, "熟6": 78.35, "熟7": 94.43, "熟8": 108.8, "熟9": 122.33, "熟10": 135.62, "会1": 149.3, "会2": 169.91, "会3": 189.15, "会4": 208.44, "会5": 225.4}, "Q": [["熟1", "take place", "行われる、開催される"], ["熟2", "take turns ～ing", "交代で～する"], ["熟3", "take action", "行動を起こす"], ["熟4", "take a look at ～", "～を見る"], ["熟5", "take it easy", "気楽にする、のんびりする"], ["熟6", "take care of ～", "～を引き受ける、～の世話をする"], ["熟7", "take part in ～", "～に参加する"], ["熟8", "take advantage of ～", "～を利用する"], ["熟9", "take after ～", "～に似ている"], ["熟10", "take out ～", "～を取り出す、を出す"], ["会1", "How have you been?", "元気にしてた？"], ["会2", "It's been a while.", "久しぶりだね。"], ["会3", "How did it go?", "どうだった？"], ["会4", "Not really.", "あまり。"], ["会5", "Guess what!", "ねえ、聞いて！"]], "KEY": "ep2-j01"};</script><scrip
