まとまらなかった。</div></button></li><li><button class="w" data-no="熟56"><div class="top"><span class="no">熟56</span><span class="en">succeed in ～</span></div><div class="ja">～に成功する</div><div class="ex">He succeeded in climbing Mt. Fuji.</div><div class="xj">彼は富士山に登ることに成功した。</div></button></li><li><button class="w" data-no="熟57"><div class="top"><span class="no">熟57</span><span class="en">laugh at ～</span></div><div class="ja">～を笑う</div><div class="ex">Everyone laughed at his funny story.</div><div class="xj">みんな彼のおもしろい話に笑った。</div></button></li><li><button class="w" data-no="熟58"><div class="top"><span class="no">熟58</span><span class="en">find fault with ～</span></div><div class="ja">～のあら探しをする、～にけちをつける</div><div class="ex">My brother always finds fault with my cooking.</div><div class="xj">兄はいつも私の料理にけちをつける。</div></button></li><li><button class="w" data-no="熟59"><div class="top"><span class="no">熟59</span><span class="en">focus on ～</span></div><div class="ja">～に集中する</div><div class="ex">Turn off the TV and focus on your homework.</div><div class="xj">テレビを消して宿題に集中しなさい。</div></button></li><li><button class="w" data-no="熟60"><div class="top"><span class="no">熟60</span><span class="en">belong to ～</span></div><div class="ja">～に所属する、～のものである</div><div class="ex">I belong to the brass band.</div><div class="xj">私は吹奏楽部に所属している。</div></button></li><li><button class="w" data-no="会26"><div class="top"><span class="no">会26</span><span class="en">That&#x27;s a good point.</span></div><div class="ja">それはいい指摘だね。</div><div class="ex">A: We should start practicing earlier for the contest.<br>B: That&#x27;s a good point. Let&#x27;s start next week.</div></button></li><li><button class="w" data-no="会27"><div class="top"><span class="no">会27</span><span class="en">It depends.</span></div><div class="ja">場合によるね。</div><div class="ex">A: Do you usually walk to school?<br>B: It depends. When it rains, I take the bus.</div></button></li><li><button class="w" data-no="会28"><div class="top"><span class="no">会28</span><span class="en">I agree with you.</span></div><div class="ja">あなたに賛成です。</div><div class="ex">A: I think students should have more time to sleep.<br>B: I agree with you.</div></button></li><li><button class="w" data-no="会29"><div class="top"><span class="no">会29</span><span class="en">I&#x27;m not so sure about that.</span></div><div class="ja">それはどうかなあ。</div><div class="ex">A: Smartphones are bad for children.<br>B: I&#x27;m not so sure about that. They can be useful for studying.</div></button></li><li><button class="w" data-no="会30"><div class="top"><span class="no">会30</span><span class="en">What do you think of ～?</span></div><div class="ja">～をどう思う？</div><div class="ex">A: I just read the new book by Mr. Ito.<br>B: Really? What do you think of it?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j05/">← 熟語 Set 5</a><a href="../j07/">熟語 Set 7 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟51": 5.46, "熟52": 18.18, "熟53": 32.57, "熟54": 47.5, "熟55": 60.4, "熟56": 74.8, "熟57": 88.57, "熟58": 101.6, "熟59": 118.01, "熟60": 132.22, "会26": 146.83, "会27": 166.12, "会28": 184.06, "会29": 200.64, "会30": 221.0}, "TE": {"熟51": 7.36, "熟52": 20.07, "熟53": 34.56, "熟54": 49.37, "熟55": 62.35, "熟56": 76.79, "熟57": 90.44, "熟58": 103.74, "熟59": 119.98, "熟60": 134.09, "会26": 148.89, "会27": 168.04, "会28": 186.12, "会29": 203.23, "会30": 222.95}, "Q": [["熟51", "rely on ～", "～に頼る"], ["熟52", "depend on ～", "～次第である、～に頼る"], ["熟53", "suffer from ～", "～に苦しむ、をわずらう"], ["熟54", "hope for ～", "～を望む"], ["熟55", "agree on ～", "～について意見が一致する"], ["熟56", "succeed in ～", "～に成功する"], ["熟57", "laugh at ～", "～を笑う"], ["熟58", "find fault with ～", "～のあら探しをする、～にけちをつける"], ["熟59", "focus on ～", "～に集中する"], ["熟60", "belong to ～", "～に所属する、～のものである"], ["会26", "That's a good point.", "それはいい指摘だね。"], ["会27", "It depends.", "場合によるね。"], ["会28", "I agree with you.", "あな
