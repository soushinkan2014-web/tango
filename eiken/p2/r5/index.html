><button class="w" data-no="復205"><div class="top"><span class="no">復205</span><span class="en">share</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を共有する；～を分け合う</div><div class="ex">I <b>share</b> a room with my brother.</div><div class="xj">私は弟と部屋を共有している。</div></button></li><li><button class="w" data-no="復206"><div class="top"><span class="no">復206</span><span class="en">reach</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に着く；～に届く</div><div class="ex">We <b>reached</b> the station at noon.</div><div class="xj">私たちは正午に駅に着いた。</div></button></li><li><button class="w" data-no="復207"><div class="top"><span class="no">復207</span><span class="en">graduate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">卒業する</div><div class="ex">My brother will <b>graduate</b> from high school next year.</div><div class="xj">兄は来年、高校を卒業する。</div></button></li><li><button class="w" data-no="復208"><div class="top"><span class="no">復208</span><span class="en">steal</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を盗む</div><div class="ex">A monkey <b>stole</b> a banana from my bag.</div><div class="xj">サルが私のかばんからバナナを盗んだ。</div></button></li><li><button class="w" data-no="復209"><div class="top"><span class="no">復209</span><span class="en">born</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（be born で）生まれる</div><div class="ex">My sister was <b>born</b> in March.</div><div class="xj">妹は3月に生まれた。</div></button></li><li><button class="w" data-no="復210"><div class="top"><span class="no">復210</span><span class="en">explain</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を説明する</div><div class="ex">Can you <b>explain</b> this word to me?</div><div class="xj">この単語を私に説明してくれますか。</div></button></li><li><button class="w" data-no="復211"><div class="top"><span class="no">復211</span><span class="en">focus</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">集中する</div><div class="ex">I can&#x27;t <b>focus</b> when the TV is on.</div><div class="xj">テレビがついていると集中できない。</div></button></li><li><button class="w" data-no="復212"><div class="top"><span class="no">復212</span><span class="en">damage</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に損害を与える；～をいためる</div><div class="ex">The strong wind <b>damaged</b> many houses.</div><div class="xj">強い風が多くの家に損害を与えた。</div></button></li><li><button class="w" data-no="復213"><div class="top"><span class="no">復213</span><span class="en">search</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">さがす；検索する</div><div class="ex">Emi <b>searched</b> for her cat all morning.</div><div class="xj">エミは午前中ずっと、ネコをさがした。</div></button></li><li><button class="w" data-no="復214"><div class="top"><span class="no">復214</span><span class="en">feed</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～にえさをやる</div><div class="ex">Emi <b>feeds</b> her cat every morning.</div><div class="xj">エミは毎朝、ネコにえさをやる。</div></button></li><li><button class="w" data-no="復215"><div class="top"><span class="no">復215</span><span class="en">hide</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を隠す；隠れる</div><div class="ex">Tom <b>hid</b> the present under his bed.</div><div class="xj">トムはプレゼントをベッドの下に隠した。</div></button></li><li><button class="w" data-no="復216"><div class="top"><span class="no">復216</span><span class="en">recommend</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を勧める</div><div class="ex">The waiter <b>recommended</b> the fish soup.</div><div class="xj">ウェイターは魚のスープを勧めた。</div></button></li><li><button class="w" data-no="復217"><div class="top"><span class="no">復217</span><span class="en">trash</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ごみ</div><div class="ex">Please put your <b>trash</b> in this box.</div><div class="xj">ごみはこの箱に入れてください。</div></button></li><li><button class="w" data-no="復218"><div class="top"><span class="no">復218</span><span class="en">top</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">頂上；いちばん上</div><div class="ex">We reached the <b>top</b> of the mountain.</div><div class="xj">私たちは山の頂上に着いた。</div></button></li><li><button class="w" data-no="復219"><div class="top"><span class="no">復219</span><span class="en">hole</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">穴</div><div class="ex">The dog dug a <b>hole</b> in the garden.</div><div class="xj">犬が庭に穴をほった。</div></button></li><li><button class="w" data-no="復220"><div class="top"><span class="no">復220</span><span class="en">plant</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">植物</div><div class="ex">Emi waters the <b>plants</b> every morning.</div><div class="xj">エミは毎朝、植物に水をやる。</div></button></li><li><button class="w" data-no="復221"><div class="top"><span class="no">復221</span><span class="en">design</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">デザイン；設計</div><div class="ex">I like the <b>design</b> of this bag.</div><div class="xj">私はこのかばんのデザインが好きだ。</div></button></li><li><button class="w" data-no="復222"><div class="top"><span class="no">復222</span><span class="en">weekday</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">平日</div><div class="ex">The library opens at nine on <b>weekdays</b>.</div><div class="xj">図書館は、平日は9時に開く。</div></button></li><li><button class="w" data-no="復223"><div class="top"><span class="no">復223</span><span class="en">interview</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">インタビュー；面接</div><div class="ex">I watched an <b>interview</b> with a famous singer.</div><div class="xj">私は有名な歌手のインタビューを見た。</div></button></li><li><button class="w" data-no="復224"><div class="top"><span class="no">復224</span><span class="en">neighbor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">近所の人</div><div class="ex">Our <b>neighbor</b> gave us some apples.</div><div class="xj">近所の人がリンゴをくれた。</div></button></li><li><button class="w" data-no="復225"><div class="top"><span class="no">復225</span><span class="en">choice</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">選択；選んだもの</div><div class="ex">I think you made a good <b>choice</b>.</div><div class="xj">あなたはよい選択をしたと思う。</div></button></li><li><button class="w" data-no="復226"><div class="top"><span class="no">復226</span><span class="en">dress</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ドレス；服装</div><div class="ex">Emi wore a white <b>dress</b> to the party.</div><div class="xj">エミはパーティーに白いドレスを着ていった。</div></button></li><li><button class="w" data-no="復227"><div class="top"><span class="no">復227</span><span class="en">stamp</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">切手</div><div class="ex">I need a <b>stamp</b> for this letter.</div><div class="xj">この手紙には切手が必要だ。</div></button></li><li><button class="w" data-no="復228"><div class="top"><span class="no">復228</span><span class="en">community</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">地域社会</div><div class="ex">People in our <b>community</b> clean the park every month.</div><div class="xj">私たちの地域社会の人々は、毎月公園を掃除している。</div></button></li><li><button class="w" data-no="復229"><div class="top"><span class="no">復229</span><span class="en">list</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">リスト；一覧表</div><div class="ex">I made a shopping <b>list</b> for the party.</div><div class="xj">私はパーティーのための買い物リストを作った。</div></button></li><li><button class="w" data-no="復230"><div class="top"><span class="no">復230</span><spa
