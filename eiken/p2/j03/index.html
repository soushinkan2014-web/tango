いついた。</div></button></li><li><button class="w" data-no="熟26"><div class="top"><span class="no">熟26</span><span class="en">come across ～</span></div><div class="ja">～に偶然出会う、～を偶然見つける</div><div class="ex">I came across an old photo in my desk.</div><div class="xj">机の中で古い写真を偶然見つけた。</div></button></li><li><button class="w" data-no="熟27"><div class="top"><span class="no">熟27</span><span class="en">come over</span></div><div class="ja">（家に）やって来る</div><div class="ex">My friends are coming over this afternoon.</div><div class="xj">今日の午後、友達が家に遊びに来る。</div></button></li><li><button class="w" data-no="熟28"><div class="top"><span class="no">熟28</span><span class="en">go through ～</span></div><div class="ja">～を経験する</div><div class="ex">She went through a hard time last year.</div><div class="xj">彼女は去年つらい時期を経験した。</div></button></li><li><button class="w" data-no="熟29"><div class="top"><span class="no">熟29</span><span class="en">go on ～ing</span></div><div class="ja">～し続ける</div><div class="ex">He went on talking for an hour.</div><div class="xj">彼は1時間話し続けた。</div></button></li><li><button class="w" data-no="熟30"><div class="top"><span class="no">熟30</span><span class="en">go wrong</span></div><div class="ja">うまくいかない</div><div class="ex">Everything went wrong today.</div><div class="xj">今日は何もかもうまくいかなかった。</div></button></li><li><button class="w" data-no="会11"><div class="top"><span class="no">会11</span><span class="en">Do you want me to ～?</span></div><div class="ja">（私が）～しようか？</div><div class="ex">A: I can&#x27;t find my phone anywhere.<br>B: Do you want me to call it?</div></button></li><li><button class="w" data-no="会12"><div class="top"><span class="no">会12</span><span class="en">Why don&#x27;t I ～?</span></div><div class="ja">（私が）～しようか？</div><div class="ex">A: I don&#x27;t have time to cook dinner tonight.<br>B: Why don&#x27;t I cook tonight?</div></button></li><li><button class="w" data-no="会13"><div class="top"><span class="no">会13</span><span class="en">I can take you there.</span></div><div class="ja">そこまで連れて行ってあげますよ。</div><div class="ex">A: Excuse me. Where is the city museum?<br>B: I&#x27;m going that way, so I can take you there.</div></button></li><li><button class="w" data-no="会14"><div class="top"><span class="no">会14</span><span class="en">I&#x27;d be happy to ～.</span></div><div class="ja">喜んで～します。</div><div class="ex">A: This box is too heavy for me.<br>B: I&#x27;d be happy to help you carry it.</div></button></li><li><button class="w" data-no="会15"><div class="top"><span class="no">会15</span><span class="en">Leave it to me.</span></div><div class="ja">任せて。</div><div class="ex">A: Who will make the poster for the festival?<br>B: Leave it to me. I love drawing.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j02/">← 熟語 Set 2</a><a href="../j04/">熟語 Set 4 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟21": 5.24, "熟22": 18.85, "熟23": 33.7, "熟24": 49.01, "熟25": 61.44, "熟26": 74.49, "熟27": 90.61, "熟28": 103.74, "熟29": 117.2, "熟30": 131.02, "会11": 143.44, "会12": 159.85, "会13": 176.36, "会14": 195.79, "会15": 213.13}, "TE": {"熟21": 7.12, "熟22": 20.72, "熟23": 35.57, "熟24": 50.88, "熟25": 63.31, "熟26": 76.48, "熟27": 92.48, "熟28": 105.61, "熟29": 119.52, "熟30": 132.89, "会11": 145.32, "会12": 161.72, "会13": 178.47, "会14": 197.9, "会15": 215.0}, "Q": [["熟21", "get along with ～", "～と仲よくやっていく"], ["熟22", "get rid of ～", "～を取り除く、～を処分する"], ["熟23", "get over ～", "～から回復する、～を乗り越える"], ["熟24", "get together", "集まる"], ["熟25", "come up with ～", "～を思いつく"], ["熟26", "come across ～", "～に偶然出会う、～を偶然見つける"], ["熟27", "come over", "やって来る"], ["熟28", "go through ～", "～を経験する"], ["熟29", "go on ～ing", "～し続ける"], ["熟30", "go wrong", "うまくいかない"], ["会11", "Do you want me to ～?", "～しようか？"], ["会12", "Why don't I ～?", "～しようか？"], ["会13", "I can take you there.", "そこまで連れて行ってあげますよ。"], ["会14", "I'd be happy to ～.", "喜んで～します。"], ["会15", "Lea
