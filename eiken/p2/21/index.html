</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第21回</h1><div class="sub">No.1001〜1050</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1001"><div class="top"><span class="no">1001</span><span class="en">illustrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を説明する；～に挿絵を入れる</div><div class="ex">The teacher <b>illustrated</b> her point with a simple example.</div><div class="xj">先生は簡単な例を使って、言いたいことを説明した。</div></button></li><li><button class="w" data-no="1002"><div class="top"><span class="no">1002</span><span class="en">specialize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（specialize in ～）～を専門にする</div><div class="ex">This doctor <b>specializes</b> in children&#x27;s health.</div><div class="xj">この医者は子どもの健康を専門にしている。</div></button></li><li><button class="w" data-no="1003"><div class="top"><span class="no">1003</span><span class="en">analyze</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を分析する</div><div class="ex">Scientists <b>analyzed</b> the water from the river.</div><div class="xj">科学者たちは、その川の水を分析した。</div></button></li><li><button class="w" data-no="1004"><div class="top"><span class="no">1004</span><span class="en">approve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を承認する；（approve of ～）～に賛成する</div><div class="ex">The school <b>approved</b> our plan for the festival.</div><div class="xj">学校は私たちの文化祭の計画を承認した。</div></button></li><li><button class="w" data-no="1005"><div class="top"><span class="no">1005</span><span class="en">delight</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を大喜びさせる</div><div class="ex">The good news <b>delighted</b> everyone in the class.</div><div class="xj">そのよい知らせは、クラスのみんなを大喜びさせた。</div></button></li><li><button class="w" data-no="1006"><div class="top"><span class="no">1006</span><span class="en">rob</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（rob A of B）AからBを奪う</div><div class="ex">The rain <b>robbed</b> us of the chance to play outside.</div><div class="xj">雨のせいで、私たちは外で遊ぶ機会を奪われた。</div></button></li><li><button class="w" data-no="1007"><div class="top"><span class="no">1007</span><span class="en">wipe</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をふく；ぬぐう</div><div class="ex">Please <b>wipe</b> the table with this cloth.</div><div class="xj">このふきんでテーブルをふいてください。</div></button></li><li><button class="w" data-no="1008"><div class="top"><span class="no">1008</span><span class="en">annoy</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をいらいらさせる</div><div class="ex">My little brother <b>annoys</b> me when I am studying.</div><div class="xj">勉強しているとき、弟が私をいらいらさせる。</div></button></li><li><button class="w" data-no="1009"><div class="top"><span class="no">1009</span><span class="en">restore</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を修復する；回復させる</div><div class="ex">Workers are <b>restoring</b> the old temple in our town.</div><div class="xj">作業員たちが、町の古いお寺を修復している。</div></button></li><li><button class="w" data-no="1010"><div class="top"><span class="no">1010</span><span class="en">sweep</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を掃く；掃除する</div><div class="ex">Please <b>sweep</b> the floor after lunch.</div><div class="xj">昼食の後で、床を掃いてください。</div></button></li><li><button class="w" data-no="1011"><div class="top"><span class="no">1011</span><span class="en">pronounce</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を発音する</div><div class="ex">How do you <b>pronounce</b> this word?</div><div class="xj">この単語はどう発音するのですか。</div></button></li><li><button class="w" data-no="1012"><div class="top"><span class="no">1012</span><span class="en">amuse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をおもしろがらせる</div><div class="ex">Tom&#x27;s funny stories always <b>amuse</b> his friends.</div><div class="xj">トムのおもしろい話は、いつも友だちをおもしろがらせる。</div></button></li><li><button class="w" data-no="1013"><div class="top"><span class="no">1013</span><span class="en">squeeze</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をしぼる；押し込む</div><div class="ex">Lisa <b>squeezed</b> a lemon into her tea.</div><div class="xj">リサは紅茶にレモンをしぼった。</div></button></li><li><button class="w" data-no="1014"><div class="top"><span class="no">1014</span><span class="en">adapt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">適応する；～を適応させる</div><div class="ex">The new students quickly <b>adapted</b> to school life.</div><div class="xj">新入生たちは、すぐに学校生活に適応した。</div></button></li><li><button class="w" data-no="1015"><div class="top"><span class="no">1015</span><span class="en">imitate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をまねる</div><div class="ex">Some birds can <b>imitate</b> the voices of people.</div><div class="xj">人の声をまねることができる鳥もいる。</div></button></li><li><button class="w" data-no="1016"><div class="top"><span class="no">1016</span><span class="en">sail</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">航海する；帆走する</div><div class="ex">The ship <b>sailed</b> across the Pacific Ocean.</div><div class="xj">その船は太平洋を航海した。</div></button></li><li><button class="w" data-no="1017"><div class="top"><span class="no">1017</span><span class="en">load</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">積み荷；（仕事などの）量</div><div class="ex">The truck was carrying a heavy <b>load</b> of wood.</div><div class="xj">そのトラックは木材の重い積み荷を運んでいた。</div></button></li><li><button class="w" data-no="1018"><div class="top"><span class="no">1018</span><span class="en">scholarship</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">奨学金</div><div class="ex">Emi got a <b>scholarship</b> to study in Canada.</div><div class="xj">エミはカナダに留学するための奨学金をもらった。</div></button></li><li><button class="w" data-no="1019"><div class="top"><span class="no">1019</span><span class="en">agriculture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">農業</div><div class="ex">Many people in this town work in <b>agriculture</b>.</div><div class="xj">この町の多くの人は農業の仕事をしている。</div></button></li><li><button class="w" data-no="1020"><div class="top"><span class="no">1020</span><span class="en">avenue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大通り</div><div class="ex">There are many shops along this <b>avenue</b>.</div><div class="xj">この大通り沿いには、店がたくさんある。</div></button></li><li><button class="w" data-no="1021"><div class="top"><span class="no">1021</span><span class="en">stock</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">在庫；株</div><div class="ex">That shoe store has a large <b>stock</b> of sneakers.</div><div class="xj">その靴屋には、スニーカーの在庫がたくさんある。</div></button></li><li><button class="w" data-no="1022"><div class="top"><span class="no">1022</span><span class="en">bacteria</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">細菌；バクテリア</div><div class="ex">Some <b>bacteria</b> are good for our health.</div><div class="xj">細菌の中には、私たちの健康によいものもある。</div></button></li><li><button class="w" data-no="1023"><div class="top"><span class="no">1023</span><span class="en">comfort</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">快適さ；慰め</div><div class="ex">When I buy shoes, I think about <b>comfort</b> first.</div><div class="xj">靴を買うとき、私はまず快適さを考える。</div></button></li><li><button class="w" data-no="1024"><div class="top"><span class="no">1024</span><span class="en">manual</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">説明書；マニュアル</div><div class="ex">Read the <b>manual</b> before you use the new printer.</div><div class="xj">新しいプリンターを使う前に、説明書を読みなさい。</div></button></li><li><button class="w" data-no="1025"><div class="top"><span class="no">1025</span><span class="en">clue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手がかり</div><div class="ex">The teacher gave us a <b>clue</b> to the answer.</div><div class="xj">先生は答えの手がかりをくれた。</div></button></li><li><button class="w" data-no="1026"><div class="top"><span class="no">1026</span><span class="en">lawyer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">弁護士</div><div class="ex">Tom&#x27;s mother works as a <b>lawyer</b> in a big city.</div><div class="xj">トムの母親は大都市で弁護士として働いている。</div></button></li><li><button class="w" data-no="1027"><div class="top"><span class="no">1027</span><span class="en">chore</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（家庭の）雑用；家事</div><div class="ex">I help my mother with the <b>chores</b> every Sunday.</div><div class="xj">私は毎週日曜日に、母の家事を手伝う。</div></button></li><li><button class="w" data-no="1028"><div class="top"><span class="no">1028</span><span class="en">intelligence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知能</div><div class="ex">Dolphins are famous for their high <b>intelligence</b>.</div><div class="xj">イルカは知能が高いことで有名だ。</div></button></li><li><button class="w" data-no="1029"><div class="top"><span class="no">1029</span><span class="en">obstacle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">障害（物）</div><div class="ex">There was a big <b>obstacle</b> in the middle of the road.</div><div class="xj">道の真ん中に大きな障害物があった。</div></button></li><li><button class="w" data-no="1030"><div class="top"><span class="no">1030</span><span class="en">encouragement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">励まし</div><div class="ex">Thank you for your kind words of <b>encouragement</b>.</div><div class="xj">温かい励ましの言葉をありがとう。</div></button></li><li><button class="w" data-no="1031"><div class="top"><span class="no">1031</span><span class="en">survival</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生き残ること；生存</div><div class="ex">Water is needed for the <b>survival</b> of plants and animals.</div><div class="xj">動植物の生存には、水が必要だ。</div></button></li><li><button class="w" data-no="1032"><div class="top"><span class="no">1032</span><span class="en">appetite</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">食欲</div><div class="ex">I have no <b>appetite</b> because of my cold.</div><div class="xj">かぜのせいで食欲がない。</div></button></li><li><button class="w" data-no="1033"><div class="top"><span class="no">1033</span><span class="en">panic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">パニック；恐慌</div><div class="ex">Ken was in a <b>panic</b> because he lost his ticket.</div><div class="xj">ケンはチケットをなくしてパニックになっていた。</div></button></li><li><button class="w" data-no="1034"><div class="top"><span class="no">1034</span><span class="en">symptom</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">症状</div><div class="ex">Coughing is a common <b>symptom</b> of a cold.</div><div class="xj">せきは、かぜによくある症状だ。</div></button></li><li><button class="w" data-no="1035"><div class="top"><span class="no">1035</span><span class="en">commercial</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">コマーシャル</div><div class="ex">I saw a funny <b>commercial</b> on TV last night.</div><div class="xj">昨夜、テレビでおもしろいコマーシャルを見た。</div></button></li><li><button class="w" data-no="1036"><div class="top"><span class="no">1036</span><span class="en">mess</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">散らかった状態</div><div class="ex">Who made this <b>mess</b> in the kitchen?</div><div class="xj">台所をこんな散らかった状態にしたのはだれ？</div></button></li><li><button class="w" data-no="1037"><div class="top"><span class="no">1037</span><span class="en">liquid</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">液体</div><div class="ex">Please don&#x27;t bring any <b>liquids</b> into the computer room.</div><div class="xj">コンピューター室には液体を持ち込まないでください。</div></button></li><li><button class="w" data-no="1038"><div class="top"><span class="no">1038</span><span class="en">fame</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">名声</div><div class="ex">The singer gained <b>fame</b> at a young age.</div><div class="xj">その歌手は若くして名声を得た。</div></button></li><li><button class="w" data-no="1039"><div class="top"><span class="no">1039</span><span class="en">depth</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">深さ</div><div class="ex">The <b>depth</b> of this pool is two meters.</div><div class="xj">このプールの深さは2メートルだ。</div></button></li><li><button class="w" data-no="1040"><div class="top"><span class="no">1040</span><span class="en">solid</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">固体の；しっかりした</div><div class="ex">Ice is water in a <b>solid</b> form.</div><div class="xj">氷は固体の状態の水である。</div></button></li><li><button class="w" data-no="1041"><div class="top"><span class="no">1041</span><span class="en">fashionable</span><span class="ps">形</
