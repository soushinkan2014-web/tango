ass="xj">母は帰りが遅かったことで私をしかった。</div></button></li><li><button class="w" data-no="955"><div class="top"><span class="no">955</span><span class="en">owe</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に借りがある；（owe A to B）AはBのおかげである</div><div class="ex">I <b>owe</b> Tom 500 yen for lunch.</div><div class="xj">私はトムに昼食代500円の借りがある。</div></button></li><li><button class="w" data-no="956"><div class="top"><span class="no">956</span><span class="en">estimate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を見積もる；推定する</div><div class="ex">We <b>estimated</b> the trip would cost about 10,000 yen.</div><div class="xj">私たちは、旅行に約1万円かかると見積もった。</div></button></li><li><button class="w" data-no="957"><div class="top"><span class="no">957</span><span class="en">vary</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">変わる；さまざまである</div><div class="ex">The prices of vegetables <b>vary</b> from season to season.</div><div class="xj">野菜の値段は季節によって変わる。</div></button></li><li><button class="w" data-no="958"><div class="top"><span class="no">958</span><span class="en">trap</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を閉じ込める；わなで捕らえる</div><div class="ex">The heavy snow <b>trapped</b> us in the hotel for two days.</div><div class="xj">大雪で、私たちは2日間ホテルに閉じ込められた。</div></button></li><li><button class="w" data-no="959"><div class="top"><span class="no">959</span><span class="en">sort</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を分類する</div><div class="ex">Please <b>sort</b> the trash before you throw it away.</div><div class="xj">捨てる前に、ごみを分類してください。</div></button></li><li><button class="w" data-no="960"><div class="top"><span class="no">960</span><span class="en">cooperate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">協力する</div><div class="ex">All the students <b>cooperated</b> to make the festival a success.</div><div class="xj">生徒全員が、文化祭を成功させるために協力した。</div></button></li><li><button class="w" data-no="961"><div class="top"><span class="no">961</span><span class="en">container</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">容器；コンテナ</div><div class="ex">Please put the cookies in this plastic <b>container</b>.</div><div class="xj">クッキーをこのプラスチックの容器に入れてください。</div></button></li><li><button class="w" data-no="962"><div class="top"><span class="no">962</span><span class="en">fund</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">資金；基金</div><div class="ex">The students collected <b>funds</b> for the new library.</div><div class="xj">生徒たちは新しい図書館のための資金を集めた。</div></button></li><li><button class="w" data-no="963"><div class="top"><span class="no">963</span><span class="en">debt</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">借金；負債</div><div class="ex">My uncle worked hard to pay back his <b>debt</b>.</div><div class="xj">おじは借金を返すために一生懸命働いた。</div></button></li><li><button class="w" data-no="964"><div class="top"><span class="no">964</span><span class="en">humor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ユーモア</div><div class="ex">Our new teacher has a good sense of <b>humor</b>.</div><div class="xj">新しい先生にはユーモアのセンスがある。</div></button></li><li><button class="w" data-no="965"><div class="top"><span class="no">965</span><span class="en">fuel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">燃料</div><div class="ex">This new car uses less <b>fuel</b> than our old one.</div><div class="xj">この新しい車は、前の車より使う燃料が少ない。</div></button></li><li><button class="w" data-no="966"><div class="top"><span class="no">966</span><span class="en">universe</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宇宙</div><div class="ex">Scientists think there are many planets in the <b>universe</b>.</div><div class="xj">科学者たちは、宇宙にはたくさんの惑星があると考えている。</div></button></li><li><button class="w" data-no="967"><div class="top"><span class="no">967</span><span class="en">brand</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">銘柄；ブランド</div><div class="ex">My father always buys the same <b>brand</b> of coffee.</div><div class="xj">父はいつも同じ銘柄のコーヒーを買う。</div></button></li><li><button class="w" data-no="968"><div class="top"><span class="no">968</span><span class="en">remark</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">発言；意見</div><div class="ex">Ken&#x27;s <b>remark</b> in the meeting surprised everyone.</div><div class="xj">会議でのケンの発言は、みんなを驚かせた。</div></button></li><li><button class="w" data-no="969"><div class="top"><span class="no">969</span><span class="en">punishment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">罰</div><div class="ex">Cleaning the classroom was his <b>punishment</b> for being late.</div><div class="xj">教室の掃除が、遅刻した彼への罰だった。</div></button></li><li><button class="w" data-no="970"><div class="top"><span class="no">970</span><span class="en">imagination</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">想像（力）</div><div class="ex">Writing stories is a good way to use your <b>imagination</b>.</div><div class="xj">物語を書くことは、想像力を使うよい方法だ。</div></button></li><li><button class="w" data-no="971"><div class="top"><span class="no">971</span><span class="en">flu</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">インフルエンザ</div><div class="ex">Tom stayed home from school with the <b>flu</b>.</div><div class="xj">トムはインフルエンザで学校を休んだ。</div></button></li><li><button class="w" data-no="972"><div class="top"><span class="no">972</span><span class="en">bargain</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">お買い得品；格安品</div><div class="ex">I found a great <b>bargain</b> at the shop near the station.</div><div class="xj">駅の近くの店で、すごいお買い得品を見つけた。</div></button></li><li><button class="w" data-no="973"><div class="top"><span class="no">973</span><span class="en">theory</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">理論；学説</div><div class="ex">Scientists are testing a new <b>theory</b> about dinosaurs.</div><div class="xj">科学者たちは、恐竜についての新しい理論を確かめている。</div></button></li><li><button class="w" data-no="974"><div class="top"><span class="no">974</span><span class="en">conclusion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">結論</div><div class="ex">What is the <b>conclusion</b> of your report?</div><div class="xj">あなたのレポートの結論は何ですか。</div></button></li><li><button class="w" data-no="975"><div class="top"><span class="no">975</span><span class="en">curiosity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">好奇心</div><div class="ex">The baby looked at the dog with <b>curiosity</b>.</div><div class="xj">赤ちゃんは好奇心いっぱいに犬を見つめた。</div></button></li><li><button class="w" data-no="976"><div class="top"><span class="no">976</span><span class="en">election</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">選挙</div><div class="ex">Ken won the student council <b>election</b>.</div><div class="xj">ケンは生徒会の選挙で勝った。</div></button></li><li><button class="w" data-no="977"><div class="top"><span class="no">977</span><span class="en">gap</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">すき間；隔たり</div><div class="ex">The cat got through a <b>gap</b> in the fence.</div><div class="xj">ねこはへいのすき間を通り抜けた。</div></button></li><li><button class="w" data-no="978"><div class="top"><span class="no">978</span><span class="en">ambulance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">救急車</div><div class="ex">The <b>ambulance</b> arrived at the station in five minutes.</div><div class="xj">救急車は5分で駅に到着した。</div></button></li><li><button class="w" data-no="979"><div class="top"><span class="no">979</span><span class="en">hunger</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">空腹；飢え</div><div class="ex">The baby was crying from <b>hunger</b>.</div><div class="xj">赤ちゃんは空腹で泣いていた。</div></button></li><li><button class="w" data-no="980"><div class="top"><span class="no">980</span><span class="en">youth</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">若さ；青年時代</div><div class="ex">Swimming helps my grandmother keep her <b>youth</b>.</div><div class="xj">水泳のおかげで、祖母は若さを保っている。</div></button></li><li><button class="w" data-no="981"><div class="top"><span class="no">981</span><span class="en">affordable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">手ごろな値段の</div><div class="ex">This shop sells <b>affordable</b> clothes for students.</div><div class="xj">この店は学生向けの手ごろな値段の服を売っている。</div></button></li><li><button class="w" data-no="982"><div class="top"><span class="no">982</span><span class="en">talented</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">才能のある</div><div class="ex">Emi is a <b>talented</b> piano player.</div><div class="xj">エミは才能のあるピアノ奏者だ。</div></button></li><li><button class="w" data-no="983"><div class="top"><span class="no">983</span><span class="en">vast</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">広大な；ばく大な</div><div class="ex">Many animals live in the <b>vast</b> forest.</div><div class="xj">その広大な森には、多くの動物がすんでいる。</div></button></li><li><button class="w" data-no="984"><div class="top"><span class="no">984</span><span class="en">pure</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">純粋な</div><div class="ex">Small children usually have <b>pure</b> hearts.</div><div class="xj">小さな子どもたちは、たいてい純粋な心を持っている。</div></button></li><li><button class="w" data-no="985"><div class="top"><span class="no">985</span><span class="en">organic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有機（栽培）の</div><div class="ex">My aunt grows <b>organic</b> vegetables on her farm.</div><div class="xj">おばは自分の農場で有機栽培の野菜を育てている。</div></button></li><li><button class="w" data-no="986"><div class="top"><span class="no">986</span><span class="en">loose</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ゆるい；（固定されず）外れた</div><div class="ex">These pants are a little <b>loose</b> for me.</div><div class="xj">このズボンは私には少しゆるい。</div></button></li><li><button class="w" data-no="987"><div class="top"><span class="no">987</span><span class="en">raw</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">生の；加工していない</div><div class="ex">In Japan, people often eat <b>raw</b> fish.</div><div class="xj">日本では、人々はよく生の魚を食べる。</div></button></li><li><button class="w" data-no="988"><div class="top"><span class="no">988</span><span class="en">mysterious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不思議な；なぞの</div><div class="ex">There are many <b>mysterious</b> stories about this lake.</div><div class="xj">この湖には不思議な話がたくさんある。</div></button></li><li><button class="w" data-no="989"><div class="top"><span class="no">989</span><span class="en">endangered</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">絶滅の危機にある</div><div class="ex">We learned about <b>endangered</b> animals in science class.</div><div class="xj">私たちは理科の授業で絶滅の危機にある動物について学んだ。</div></button></li><li><button class="w" data-no="990"><div class="top"><span class="no">990</span><span class="en">temporary</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">一時的な</div><div class="ex">Lisa found a <b>temporary</b> job for the summer.</div><div class="xj">リサは夏の間の一時的な仕事を見つけた。</div></button></li><li><button class="w" data-no="991"><div class="top"><span class="no">991</span><span class="en">wise</span><span class="ps">形</span><span class="star">★</
