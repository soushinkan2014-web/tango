</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第10回</h1><div class="sub">No.451〜500</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">operate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を操作する；手術する</div><div class="ex">Ken learned how to <b>operate</b> the new copy machine.</div><div class="xj">ケンは新しいコピー機を操作する方法を覚えた。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">release</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を放す；～を発売する</div><div class="ex">The children <b>released</b> the baby turtles into the sea.</div><div class="xj">子どもたちは子ガメを海に放した。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">observe</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を観察する；～に気づく</div><div class="ex">We <b>observed</b> the moon every night for a week.</div><div class="xj">私たちは1週間、毎晩月を観察した。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">react</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">反応する</div><div class="ex">How did your mother <b>react</b> to the news?</div><div class="xj">お母さんはその知らせにどう反応したの？</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">inspire</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を奮い立たせる；～にひらめきを与える</div><div class="ex">The coach&#x27;s words <b>inspired</b> the team.</div><div class="xj">コーチの言葉がチームを奮い立たせた。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">announce</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を発表する；知らせる</div><div class="ex">The school <b>announced</b> the date of the sports day.</div><div class="xj">学校は運動会の日程を発表した。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">dislike</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を嫌う</div><div class="ex">My little sister <b>dislikes</b> green peppers.</div><div class="xj">妹はピーマンを嫌っている。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">impress</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に感銘を与える</div><div class="ex">Ken&#x27;s speech <b>impressed</b> everyone in the hall.</div><div class="xj">ケンのスピーチは会場のみんなに感銘を与えた。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">consult</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に相談する；（辞書など）を調べる</div><div class="ex">You should <b>consult</b> a doctor about your cough.</div><div class="xj">せきのことは、医者に相談したほうがいいよ。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">blame</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を責める；～のせいにする</div><div class="ex">Don&#x27;t <b>blame</b> Tom for losing the game.</div><div class="xj">試合に負けたことで、トムを責めないで。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">discourage</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をがっかりさせる；（discourage A from -ing）Aに～するのを思いとどまらせる</div><div class="ex">Losing the first game <b>discouraged</b> our team.</div><div class="xj">初戦に負けたことが、私たちのチームをがっかりさせた。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">insist</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（insist on ～）～を主張する；言い張る</div><div class="ex">Tom <b>insisted</b> on paying for everyone&#x27;s lunch.</div><div class="xj">トムは全員の昼食代を自分が払うと主張した。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">export</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を輸出する</div><div class="ex">Japan <b>exports</b> many cars to other countries.</div><div class="xj">日本は多くの車を外国に輸出している。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">disadvantage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">不利な点</div><div class="ex">One <b>disadvantage</b> of this phone is its small screen.</div><div class="xj">このスマートフォンの不利な点の一つは、画面が小さいことだ。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">income</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">収入</div><div class="ex">My aunt has a good <b>income</b> from her new job.</div><div class="xj">おばは新しい仕事でよい収入を得ている。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">preparation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">準備</div><div class="ex">We spent a week on <b>preparations</b> for the festival.</div><div class="xj">私たちは文化祭の準備に1週間かけた。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">chemical</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">化学物質；化学薬品</div><div class="ex">Some <b>chemicals</b> can be dangerous to fish.</div><div class="xj">化学物質の中には、魚にとって危険なものもある。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">blood</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">血；血液</div><div class="ex">The heart sends <b>blood</b> to every part of the body.</div><div class="xj">心臓は血を体のすみずみに送り出している。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">importance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">重要性</div><div class="ex">Our teacher told us about the <b>importance</b> of sleep.</div><div class="xj">先生は睡眠の重要性について話してくれた。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">law</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">法律</div><div class="ex">Drivers must follow the <b>law</b> and drive safely.</div><div class="xj">運転手は法律を守って安全に運転しなければならない。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">profit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">利益</div><div class="ex">The shop made a big <b>profit</b> last year.</div><div class="xj">その店は昨年、大きな利益を上げた。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">route</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">道筋；ルート</div><div class="ex">Let&#x27;s check the <b>route</b> to the museum on the map.</div><div class="xj">地図で、博物館までのルートを確かめよう。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">function</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">機能</div><div class="ex">This phone has a useful camera <b>function</b>.</div><div class="xj">このスマートフォンには便利なカメラ機能がある。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">soil</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">土；土壌</div><div class="ex">These vegetables grow well in rich <b>soil</b>.</div><div class="xj">これらの野菜は豊かな土でよく育つ。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">professor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">教授</div><div class="ex">My uncle is a history <b>professor</b> at a university.</div><div class="xj">おじは大学の歴史の教授だ。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">specialist</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">専門家；専門医</div><div class="ex">Tom asked a computer <b>specialist</b> for help.</div><div class="xj">トムはコンピューターの専門家に助けを求めた。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">pharmacy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">薬局</div><div class="ex">You can buy this medicine at any <b>pharmacy</b>.</div><div class="xj">この薬はどの薬局でも買える。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">property</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">財産；所有物；不動産</div><div class="ex">This bike is school <b>property</b>, so please be careful.</div><div class="xj">この自転車は学校の財産なので、大切に扱ってください。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">border</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">国境；境界</div><div class="ex">The river forms the <b>border</b> between the two countries.</div><div class="xj">その川が2つの国の国境になっている。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">failure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">失敗</div><div class="ex">Ken learned a lot from his <b>failure</b> in the contest.</div><div class="xj">ケンはコンテストでの失敗から多くを学んだ。</div></button></li><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">passage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（文章の）一節；通路</div><div class="ex">Read this <b>passage</b> from the story aloud.</div><div class="xj">この物語の一節を声に出して読みなさい。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">network</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">網状組織；ネットワーク</div><div class="ex">The internet is a huge computer <b>network</b>.</div><div class="xj">インターネットは巨大なコンピューターネットワークだ。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">aid</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">援助；手当て</div><div class="ex">Many countries sent <b>aid</b> to the island after the storm.</div><div class="xj">嵐のあと、多くの国がその島に援助を送った。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">female</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">女性の；メスの</div><div class="ex">The number of <b>female</b> doctors is growing.</div><div class="xj">女性の医師の数が増えている。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">strict</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">厳しい</div><div class="ex">Our soccer coach is very <b>strict</b>.</div><div class="xj">私たちのサッカーのコーチはとても厳しい。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">accurate</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">正確な</div><div class="ex">This old clock is still very <b>accurate</b>.</div><div class="xj">この古い時計は今でもとても正確だ。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">rural</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">いなかの；農村の</div><div class="ex">My grandparents live in a <b>rural</b> area.</div><div class="xj">祖父母はいなかの地域に住んでいる。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">general</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">一般的な；全体的な</div><div class="ex">This website gives <b>general</b> information about the town.</div><div class="xj">このウェブサイトは、町についての一般的な情報を伝えている。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">rare</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">まれな；珍しい</div><div class="ex">It is <b>rare</b> for Ken to be late for school.</div><div class="xj">ケンが学校に遅刻するのはまれなことだ。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">capable</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">（be capable of ～）～ができる；有能な</div><div class="ex">Emi is <b>capable</b> of running ten kilometers.</div><div class="xj">エミは10キロメートル走ることができる。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class
