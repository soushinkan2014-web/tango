he typhoon.</div><div class="xj">台風のためコンサートは中止された。</div></button></li><li><button class="w" data-no="熟86"><div class="top"><span class="no">熟86</span><span class="en">sign up for ～</span></div><div class="ja">～に申し込む、～に登録する</div><div class="ex">I signed up for the summer camp.</div><div class="xj">私はサマーキャンプに申し込んだ。</div></button></li><li><button class="w" data-no="熟87"><div class="top"><span class="no">熟87</span><span class="en">fill out ～</span></div><div class="ja">～に記入する</div><div class="ex">Please fill out this form.</div><div class="xj">この用紙に記入してください。</div></button></li><li><button class="w" data-no="熟88"><div class="top"><span class="no">熟88</span><span class="en">by the end of ～</span></div><div class="ja">～の終わりまでに</div><div class="ex">I&#x27;ll finish the book by the end of this week.</div><div class="xj">今週末までにその本を読み終えるつもりだ。</div></button></li><li><button class="w" data-no="熟89"><div class="top"><span class="no">熟89</span><span class="en">by the time ～</span></div><div class="ja">～するまでに（は）</div><div class="ex">By the time we got there, the store was closed.</div><div class="xj">私たちが着いたころには、店は閉まっていた。</div></button></li><li><button class="w" data-no="熟90"><div class="top"><span class="no">熟90</span><span class="en">as soon as ～</span></div><div class="ja">～するとすぐに</div><div class="ex">Call me as soon as you arrive.</div><div class="xj">着いたらすぐに電話して。</div></button></li><li><button class="w" data-no="会41"><div class="top"><span class="no">会41</span><span class="en">Are you free on ～?</span></div><div class="ja">～はひま？（予定があいている？）</div><div class="ex">A: Let&#x27;s go to the new café sometime.<br>B: Sure. Are you free on Saturday?</div></button></li><li><button class="w" data-no="会42"><div class="top"><span class="no">会42</span><span class="en">～ works for me.</span></div><div class="ja">～なら都合がいいです。</div><div class="ex">A: Can we meet on Monday or Tuesday?<br>B: Tuesday works for me.</div></button></li><li><button class="w" data-no="会43"><div class="top"><span class="no">会43</span><span class="en">I can&#x27;t make it.</span></div><div class="ja">（都合が悪くて）行けません。</div><div class="ex">A: The party starts at six tomorrow.<br>B: Sorry, I can&#x27;t make it. I have a piano lesson.</div></button></li><li><button class="w" data-no="会44"><div class="top"><span class="no">会44</span><span class="en">I&#x27;ll be there.</span></div><div class="ja">（その場所・時間に）行きます。</div><div class="ex">A: The game starts at two o&#x27;clock.<br>B: OK. I&#x27;ll be there.</div></button></li><li><button class="w" data-no="会45"><div class="top"><span class="no">会45</span><span class="en">Let me check my schedule.</span></div><div class="ja">予定を確認させて。</div><div class="ex">A: Can you help us at the event next Sunday?<br>B: Let me check my schedule.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j08/">← 熟語 Set 8</a><a href="../j10/">熟語 Set 10 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟81": 5.22, "熟82": 20.53, "熟83": 35.24, "熟84": 47.9, "熟85": 60.76, "熟86": 74.8, "熟87": 90.06, "熟88": 102.85, "熟89": 116.64, "熟90": 130.92, "会41": 144.4, "会42": 164.46, "会43": 181.01, "会44": 200.18, "会45": 218.1}, "TE": {"熟81": 7.81, "熟82": 22.66, "熟83": 37.16, "熟84": 49.78, "熟85": 62.64, "熟86": 76.94, "熟87": 91.93, "熟88": 104.84, "熟89": 118.52, "熟90": 132.96, "会41": 146.42, "会42": 166.33, "会43": 182.96, "会44": 202.05, "会45": 220.5}, "Q": [["熟81", "look forward to ～ing", "～するのを楽しみに待つ"], ["熟82", "keep in touch with ～", "～と連絡を取り合う"], ["熟83", "in advance", "前もって"], ["熟84", "by the way", "ところで"], ["熟85", "call off ～", "～を中止する"], ["熟86", "sign up for ～", "～に申し込む、～に登録する"], ["熟87", "fill out ～", "～に記入する"], ["熟88", "by the end of ～", "～の終わりまでに"], ["熟89", "by the time ～", "～するまでに"], ["熟90", "as soon as ～", "～するとすぐに"], ["会41", "Are you free on ～?", "～はひま？"], ["会42", "～ works for me.", "～なら都合がいいです。"], ["会43", "I can't make it.", "行けません。"], ["会44",
