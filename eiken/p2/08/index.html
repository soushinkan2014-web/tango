</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第8回</h1><div class="sub">No.351〜400</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">satisfy</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を満足させる</div><div class="ex">The new menu <b>satisfied</b> all the customers.</div><div class="xj">新しいメニューは、すべての客を満足させた。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">respond</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">答える；反応する</div><div class="ex">Emi <b>responded</b> quickly to the teacher&#x27;s question.</div><div class="xj">エミは先生の質問にすばやく答えた。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">recognize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を見分ける；認める</div><div class="ex">Lisa could <b>recognize</b> her cat by its voice.</div><div class="xj">リサは鳴き声で自分の猫を見分けることができた。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">admit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を認める</div><div class="ex">Tom <b>admitted</b> that he had forgotten his homework.</div><div class="xj">トムは宿題を忘れたことを認めた。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">contribute</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">貢献する；（contribute to ～）～に貢献する</div><div class="ex">Each student <b>contributed</b> to the success of the festival.</div><div class="xj">生徒一人ひとりが文化祭の成功に貢献した。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">afford</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（can afford ～）～を買う（する）余裕がある</div><div class="ex">We can&#x27;t <b>afford</b> a new car this year.</div><div class="xj">今年は新しい車を買う余裕がない。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">float</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">浮かぶ；漂う</div><div class="ex">Some leaves were <b>floating</b> on the pond.</div><div class="xj">池に何枚かの葉が浮かんでいた。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">publish</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を出版する；発表する</div><div class="ex">The writer <b>published</b> her first book last year.</div><div class="xj">その作家は昨年、初めての本を出版した。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">retire</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">退職する；引退する</div><div class="ex">My grandfather <b>retired</b> from his job at the age of 65.</div><div class="xj">祖父は65歳で仕事を退職した。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">grill</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を焼く；網焼きにする</div><div class="ex">Dad <b>grilled</b> some fish for dinner.</div><div class="xj">父は夕食に魚を焼いた。</div></button></li><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">fold</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を折りたたむ</div><div class="ex">Please <b>fold</b> the towels and put them away.</div><div class="xj">タオルを折りたたんで、片づけてください。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">surround</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を囲む</div><div class="ex">The village is <b>surrounded</b> by tall mountains.</div><div class="xj">その村は高い山に囲まれている。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">involve</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を含む；巻き込む</div><div class="ex">This job <b>involves</b> a lot of traveling abroad.</div><div class="xj">この仕事には海外への出張が多く含まれる。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">remain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～のままである；残る</div><div class="ex">The shop <b>remained</b> open until late at night.</div><div class="xj">その店は夜遅くまで開いたままだった。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">warn</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に警告する；注意する</div><div class="ex">The teacher <b>warned</b> us not to swim in the river.</div><div class="xj">先生は私たちに、川で泳がないように警告した。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">heal</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（傷など）を治す；治る</div><div class="ex">This medicine will help <b>heal</b> the cut on your finger.</div><div class="xj">この薬は指の切り傷を治すのに役立つ。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">range</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">範囲；（a range of ～）さまざまな～</div><div class="ex">The age <b>range</b> for this camp is 8 to 12.</div><div class="xj">このキャンプの対象年齢の範囲は8歳から12歳だ。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">treatment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">治療；扱い</div><div class="ex">The doctor said the <b>treatment</b> would take two weeks.</div><div class="xj">医者は、治療には2週間かかると言った。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">confidence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">自信；信頼</div><div class="ex">Winning the contest gave Ken a lot of <b>confidence</b>.</div><div class="xj">コンテストで優勝して、ケンは大きな自信をつけた。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">knowledge</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知識</div><div class="ex">My grandfather has a lot of <b>knowledge</b> about birds.</div><div class="xj">祖父は鳥について多くの知識を持っている。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">responsibility</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">責任</div><div class="ex">Taking care of the class rabbit is my <b>responsibility</b>.</div><div class="xj">クラスのウサギの世話をするのは私の責任だ。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">duty</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">義務；任務</div><div class="ex">Police officers have a <b>duty</b> to protect people.</div><div class="xj">警察官には人々を守る義務がある。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">breath</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">息；呼吸</div><div class="ex">Take a deep <b>breath</b> before you start your speech.</div><div class="xj">スピーチを始める前に、深く息を吸いなさい。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">account</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">口座；（利用者の）アカウント；説明</div><div class="ex">I opened a bank <b>account</b> with my mother.</div><div class="xj">私は母といっしょに銀行口座を開いた。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">sculpture</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">彫刻</div><div class="ex">There is a large <b>sculpture</b> in front of the city hall.</div><div class="xj">市役所の前に大きな彫刻がある。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">closet</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">クローゼット；押し入れ</div><div class="ex">Please put your coat in the <b>closet</b>.</div><div class="xj">コートはクローゼットに入れてください。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">scar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">傷あと</div><div class="ex">Tom has a small <b>scar</b> on his knee.</div><div class="xj">トムはひざに小さな傷あとがある。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">data</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">データ；資料</div><div class="ex">The students collected <b>data</b> about the town&#x27;s weather.</div><div class="xj">生徒たちは町の天気についてデータを集めた。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">flood</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">洪水</div><div class="ex">The heavy rain caused a <b>flood</b> in the town.</div><div class="xj">大雨で町に洪水が起きた。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">wildlife</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">野生生物</div><div class="ex">Many kinds of <b>wildlife</b> live in this forest.</div><div class="xj">この森には多くの種類の野生生物がすんでいる。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">device</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">装置；機器</div><div class="ex">This small <b>device</b> tells you how far you walked.</div><div class="xj">この小さな装置は、歩いた距離を教えてくれる。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">behavior</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ふるまい；行動</div><div class="ex">The teacher was happy with the students&#x27; good <b>behavior</b>.</div><div class="xj">先生は生徒たちのよいふるまいに満足した。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">attempt</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">試み</div><div class="ex">This is my first <b>attempt</b> at baking bread.</div><div class="xj">パンを焼くのは、これが初めての試みだ。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">facility</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">施設；設備</div><div class="ex">Our town has a new sports <b>facility</b>.</div><div class="xj">私たちの町には新しいスポーツ施設がある。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">dawn</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">夜明け</div><div class="ex">We got up at <b>dawn</b> to climb the mountain.</div><div class="xj">私たちは山に登るため、夜明けに起きた。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">studio</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">スタジオ；仕事場</div><div class="ex">The singer recorded a new song in the <b>studio</b>.</div><div class="xj">その歌手はスタジオで新しい曲を録音した。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">location</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">場所；位置</div><div class="ex">This map shows the <b>location</b> of the new library.</div><div class="xj">この地図は新しい図書館の場所を示している。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">lecture</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">講義；講演</div><div class="ex">We listened to a <b>lecture</b> about the history of our city.</div><div class="xj">私たちは市の歴史についての講義を聞いた。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">consumer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">消費者</div><div class="ex"><b>Consumers</b> want cheaper and safer food.</div><div class="xj">消費者は、より安くて安全な食品を求めている。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">ideal</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">理想的な</div><div class="ex">This park is an <b>ideal</b> place for a picnic.</div><div class="xj">この公園はピクニックに理想的な場所だ。</div></button></li><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">certain</span><span class="ps">形</span><span class="sta
