art.</div><div class="xj">映画がもうすぐ始まるところだ。</div></button></li><li><button class="w" data-no="熟66"><div class="top"><span class="no">熟66</span><span class="en">be willing to ～</span></div><div class="ja">～するのをいとわない、進んで～する</div><div class="ex">I&#x27;m willing to help you.</div><div class="xj">喜んで手伝うよ。</div></button></li><li><button class="w" data-no="熟67"><div class="top"><span class="no">熟67</span><span class="en">be sure to ～</span></div><div class="ja">必ず～する</div><div class="ex">Be sure to call me when you get home.</div><div class="xj">家に着いたら必ず電話してね。</div></button></li><li><button class="w" data-no="熟68"><div class="top"><span class="no">熟68</span><span class="en">be known for ～</span></div><div class="ja">～で知られている</div><div class="ex">This town is known for its hot springs.</div><div class="xj">この町は温泉で知られている。</div></button></li><li><button class="w" data-no="熟69"><div class="top"><span class="no">熟69</span><span class="en">be busy ～ing</span></div><div class="ja">～するのに忙しい</div><div class="ex">My mother is busy cooking dinner.</div><div class="xj">母は夕食を作るのに忙しい。</div></button></li><li><button class="w" data-no="熟70"><div class="top"><span class="no">熟70</span><span class="en">be aware of ～</span></div><div class="ja">～に気づいている</div><div class="ex">Are you aware of the danger?</div><div class="xj">その危険に気づいていますか？</div></button></li><li><button class="w" data-no="会31"><div class="top"><span class="no">会31</span><span class="en">There&#x27;s something wrong with ～.</span></div><div class="ja">～の調子がおかしい。</div><div class="ex">A: Why aren&#x27;t you using your computer?<br>B: There&#x27;s something wrong with it. It won&#x27;t turn on.</div></button></li><li><button class="w" data-no="会32"><div class="top"><span class="no">会32</span><span class="en">What seems to be the problem?</span></div><div class="ja">どうなさいましたか？</div><div class="ex">A: Hello. I&#x27;m calling about my washing machine.<br>B: Sure. What seems to be the problem?</div></button></li><li><button class="w" data-no="会33"><div class="top"><span class="no">会33</span><span class="en">It&#x27;s my fault.</span></div><div class="ja">私のせいです。</div><div class="ex">A: Who broke this cup?<br>B: Sorry, it&#x27;s my fault.</div></button></li><li><button class="w" data-no="会34"><div class="top"><span class="no">会34</span><span class="en">It won&#x27;t happen again.</span></div><div class="ja">二度としません。</div><div class="ex">A: You were late again today.<br>B: I&#x27;m sorry. It won&#x27;t happen again.</div></button></li><li><button class="w" data-no="会35"><div class="top"><span class="no">会35</span><span class="en">I didn&#x27;t mean to.</span></div><div class="ja">わざとじゃないんです。</div><div class="ex">A: You stepped on my foot!<br>B: Oh, sorry! I didn&#x27;t mean to.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j06/">← 熟語 Set 6</a><a href="../j08/">熟語 Set 8 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟61": 5.29, "熟62": 19.81, "熟63": 32.76, "熟64": 46.97, "熟65": 60.55, "熟66": 74.06, "熟67": 88.6, "熟68": 101.79, "熟69": 116.07, "熟70": 130.92, "会31": 143.97, "会32": 163.09, "会33": 183.27, "会34": 198.67, "会35": 216.2}, "TE": {"熟61": 7.84, "熟62": 21.68, "熟63": 34.73, "熟64": 48.98, "熟65": 62.42, "熟66": 75.98, "熟67": 90.47, "熟68": 103.88, "熟69": 118.56, "熟70": 132.91, "会31": 146.28, "会32": 165.47, "会33": 185.19, "会34": 200.9, "会35": 218.24}, "Q": [["熟61", "be used to ～ing", "～することに慣れている"], ["熟62", "get used to ～", "～に慣れる"], ["熟63", "be supposed to ～", "～することになっている"], ["熟64", "be likely to ～", "～しそうである"], ["熟65", "be about to ～", "～しようとしている"], ["熟66", "be willing to ～", "～するのをいとわない、進んで～する"], ["熟67", "be sure to ～", "必ず～する"], ["熟68", "be known for ～", "～で知られている"], ["熟69", "be busy ～ing", "～するのに忙しい"], ["熟70", "be aware of ～", "～に気づいている"], ["会31", "There's something wrong with ～.", "～の調子がおかしい。"], ["会32", "What seems to be the problem?", "どうなさいましたか？"],
