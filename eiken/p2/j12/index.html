div class="ex">This song reminds me of my school days.</div><div class="xj">この歌を聞くと学生時代を思い出す。</div></button></li><li><button class="w" data-no="熟116"><div class="top"><span class="no">熟116</span><span class="en">encourage A to ～</span></div><div class="ja">Aに～するよう勧める、Aを励まして～させる</div><div class="ex">My teacher encouraged me to take the test.</div><div class="xj">先生は私にその試験を受けるよう勧めてくれた。</div></button></li><li><button class="w" data-no="熟117"><div class="top"><span class="no">熟117</span><span class="en">protect A from B</span></div><div class="ja">AをBから守る</div><div class="ex">Sunglasses protect your eyes from the sun.</div><div class="xj">サングラスは日光から目を守る。</div></button></li><li><button class="w" data-no="熟118"><div class="top"><span class="no">熟118</span><span class="en">provide A with B</span></div><div class="ja">AにBを与える、提供する</div><div class="ex">The school provides students with lunch.</div><div class="xj">その学校は生徒に昼食を提供している。</div></button></li><li><button class="w" data-no="熟119"><div class="top"><span class="no">熟119</span><span class="en">share A with B</span></div><div class="ja">AをBと分け合う、共有する</div><div class="ex">I shared my umbrella with my friend.</div><div class="xj">私は友達とかさをいっしょに使った。</div></button></li><li><button class="w" data-no="熟120"><div class="top"><span class="no">熟120</span><span class="en">help A with B</span></div><div class="ja">AのBを手伝う</div><div class="ex">Can you help me with my homework?</div><div class="xj">宿題を手伝ってくれる？</div></button></li><li><button class="w" data-no="会56"><div class="top"><span class="no">会56</span><span class="en">I&#x27;m looking for ～.</span></div><div class="ja">～を探しています。</div><div class="ex">A: Hello. Can I help you?<br>B: Yes. I&#x27;m looking for a birthday present for my mother.</div></button></li><li><button class="w" data-no="会57"><div class="top"><span class="no">会57</span><span class="en">I&#x27;ll have ～, please.</span></div><div class="ja">～をください。（注文）</div><div class="ex">A: What would you like to drink?<br>B: I&#x27;ll have orange juice, please.</div></button></li><li><button class="w" data-no="会58"><div class="top"><span class="no">会58</span><span class="en">Which one would you like?</span></div><div class="ja">どれになさいますか？</div><div class="ex">A: I want to buy one of these T-shirts.<br>B: Sure. Which one would you like?</div></button></li><li><button class="w" data-no="会59"><div class="top"><span class="no">会59</span><span class="en">Do you have this in ～?</span></div><div class="ja">これの～（色・サイズ）はありますか？</div><div class="ex">A: How is the jacket?<br>B: I like it. Do you have this in a larger size?</div></button></li><li><button class="w" data-no="会60"><div class="top"><span class="no">会60</span><span class="en">I&#x27;m just looking.</span></div><div class="ja">見ているだけです。</div><div class="ex">A: May I help you?<br>B: No, thank you. I&#x27;m just looking.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j11/">← 熟語 Set 11</a><a href="../j13/">熟語 Set 13 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟111": 5.34, "熟112": 22.33, "熟113": 36.56, "熟114": 51.02, "熟115": 66.45, "熟116": 81.81, "熟117": 99.04, "熟118": 113.31, "熟119": 128.09, "熟120": 143.26, "会56": 156.26, "会57": 176.12, "会58": 194.57, "会59": 212.71, "会60": 231.9}, "TE": {"熟111": 7.76, "熟112": 24.68, "熟113": 38.74, "熟114": 53.57, "熟115": 68.97, "熟116": 83.99, "熟117": 101.2, "熟118": 115.45, "熟119": 130.32, "熟120": 145.22, "会56": 158.32, "会57": 178.57, "会58": 196.76, "会59": 214.72, "会60": 233.84}, "Q": [["熟111", "exchange A for B", "AをBと交換する、AをBに両替する"], ["熟112", "regard A as B", "AをBとみなす"], ["熟113", "replace A with B", "AをBと取りかえる"], ["熟114", "prevent A from ～ing", "Aが～するのをさまたげる"], ["熟115", "remind A of B", "AにBを思い出させる"], ["熟116", "encourage A to ～", "Aに～するよう勧める、Aを励まして～させる"], ["熟117", "protect A from B", "AをBから守る"], ["熟118", "provide A with B", "AにBを与える、提供する"], ["熟119", "share A wit
