</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第19回</h1><div class="sub">No.901〜950</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="901"><div class="top"><span class="no">901</span><span class="en">spill</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をこぼす</div><div class="ex">Tom <b>spilled</b> milk on the table.</div><div class="xj">トムはテーブルに牛乳をこぼした。</div></button></li><li><button class="w" data-no="902"><div class="top"><span class="no">902</span><span class="en">pray</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">祈る</div><div class="ex">We <b>prayed</b> for good weather on sports day.</div><div class="xj">私たちは運動会の日が晴れるように祈った。</div></button></li><li><button class="w" data-no="903"><div class="top"><span class="no">903</span><span class="en">suspect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～ではないかと思う；～を疑う</div><div class="ex">I <b>suspect</b> that Tom forgot about the club meeting.</div><div class="xj">トムは部のミーティングのことを忘れたのではないかと思う。</div></button></li><li><button class="w" data-no="904"><div class="top"><span class="no">904</span><span class="en">recall</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を思い出す</div><div class="ex">My grandfather often <b>recalls</b> his school days.</div><div class="xj">祖父はよく学生時代のことを思い出す。</div></button></li><li><button class="w" data-no="905"><div class="top"><span class="no">905</span><span class="en">identify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を確認する；特定する</div><div class="ex">The staff <b>identified</b> the owner of the lost umbrella.</div><div class="xj">スタッフは忘れ物のかさの持ち主を確認した。</div></button></li><li><button class="w" data-no="906"><div class="top"><span class="no">906</span><span class="en">scream</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">悲鳴を上げる；叫ぶ</div><div class="ex">Emi <b>screamed</b> when she saw a big spider.</div><div class="xj">大きなクモを見て、エミは悲鳴を上げた。</div></button></li><li><button class="w" data-no="907"><div class="top"><span class="no">907</span><span class="en">obey</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に従う</div><div class="ex">All drivers should <b>obey</b> the traffic rules.</div><div class="xj">すべての運転手は交通ルールに従うべきだ。</div></button></li><li><button class="w" data-no="908"><div class="top"><span class="no">908</span><span class="en">transform</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を一変させる；変える</div><div class="ex">The volunteers <b>transformed</b> the old park into a beautiful garden.</div><div class="xj">ボランティアたちが古い公園を美しい庭に一変させた。</div></button></li><li><button class="w" data-no="909"><div class="top"><span class="no">909</span><span class="en">fulfill</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（夢・約束など）を果たす；実現する</div><div class="ex">Ken <b>fulfilled</b> his promise to clean his room.</div><div class="xj">ケンは部屋をそうじするという約束を果たした。</div></button></li><li><button class="w" data-no="910"><div class="top"><span class="no">910</span><span class="en">construct</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を建設する</div><div class="ex">The city plans to <b>construct</b> a new bridge.</div><div class="xj">市は新しい橋を建設する予定だ。</div></button></li><li><button class="w" data-no="911"><div class="top"><span class="no">911</span><span class="en">invest</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を投資する</div><div class="ex">My uncle <b>invested</b> his money in a new business.</div><div class="xj">おじは新しい事業にお金を投資した。</div></button></li><li><button class="w" data-no="912"><div class="top"><span class="no">912</span><span class="en">consume</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を消費する</div><div class="ex">Air conditioners <b>consume</b> a lot of electricity.</div><div class="xj">エアコンは多くの電気を消費する。</div></button></li><li><button class="w" data-no="913"><div class="top"><span class="no">913</span><span class="en">consist</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（consist of ～）～から成る</div><div class="ex">Our team <b>consists</b> of ten members.</div><div class="xj">私たちのチームは10人のメンバーから成る。</div></button></li><li><button class="w" data-no="914"><div class="top"><span class="no">914</span><span class="en">whisper</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ささやく</div><div class="ex">Emi <b>whispered</b> something in my ear.</div><div class="xj">エミは私の耳もとで何かをささやいた。</div></button></li><li><button class="w" data-no="915"><div class="top"><span class="no">915</span><span class="en">summarize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を要約する</div><div class="ex">Please <b>summarize</b> the story in three sentences.</div><div class="xj">その物語を3文で要約してください。</div></button></li><li><button class="w" data-no="916"><div class="top"><span class="no">916</span><span class="en">urge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（urge A to do）Aに～するよう強く勧める</div><div class="ex">The doctor <b>urged</b> my father to stop smoking.</div><div class="xj">医者は父にたばこをやめるよう強く勧めた。</div></button></li><li><button class="w" data-no="917"><div class="top"><span class="no">917</span><span class="en">entertain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を楽しませる</div><div class="ex">The magician <b>entertained</b> the children at the party.</div><div class="xj">パーティーで、手品師が子どもたちを楽しませた。</div></button></li><li><button class="w" data-no="918"><div class="top"><span class="no">918</span><span class="en">admire</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を称賛する；～に感心する</div><div class="ex">Everyone at the art show <b>admired</b> Emi&#x27;s painting.</div><div class="xj">展覧会に来た人はみな、エミの絵を称賛した。</div></button></li><li><button class="w" data-no="919"><div class="top"><span class="no">919</span><span class="en">occupation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">職業</div><div class="ex">Please write your name and <b>occupation</b> on this form.</div><div class="xj">この用紙に名前と職業を書いてください。</div></button></li><li><button class="w" data-no="920"><div class="top"><span class="no">920</span><span class="en">shade</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">日陰；陰</div><div class="ex">Let&#x27;s rest in the <b>shade</b> of that tree.</div><div class="xj">あの木の日陰で休もう。</div></button></li><li><button class="w" data-no="921"><div class="top"><span class="no">921</span><span class="en">grammar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">文法</div><div class="ex">Ken asked the teacher a question about English <b>grammar</b>.</div><div class="xj">ケンは英語の文法について先生に質問した。</div></button></li><li><button class="w" data-no="922"><div class="top"><span class="no">922</span><span class="en">anxiety</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不安；心配</div><div class="ex">Many students feel <b>anxiety</b> before exams.</div><div class="xj">多くの生徒が試験の前に不安を感じる。</div></button></li><li><button class="w" data-no="923"><div class="top"><span class="no">923</span><span class="en">poverty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">貧困</div><div class="ex">Many people in the world still live in <b>poverty</b>.</div><div class="xj">世界ではまだ多くの人が貧困の中で暮らしている。</div></button></li><li><button class="w" data-no="924"><div class="top"><span class="no">924</span><span class="en">household</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">家庭；世帯</div><div class="ex">Most <b>households</b> in Japan have a microwave.</div><div class="xj">日本のほとんどの家庭に電子レンジがある。</div></button></li><li><button class="w" data-no="925"><div class="top"><span class="no">925</span><span class="en">vision</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">視力；展望</div><div class="ex">My <b>vision</b> got worse, so I started wearing glasses.</div><div class="xj">視力が落ちたので、私はめがねをかけ始めた。</div></button></li><li><button class="w" data-no="926"><div class="top"><span class="no">926</span><span class="en">nutrition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">栄養</div><div class="ex">Good <b>nutrition</b> is important for growing children.</div><div class="xj">成長期の子どもにとって、よい栄養は大切だ。</div></button></li><li><button class="w" data-no="927"><div class="top"><span class="no">927</span><span class="en">apology</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">謝罪</div><div class="ex">Tom made an <b>apology</b> to Lisa for being late.</div><div class="xj">トムは遅刻したことをリサに謝罪した。</div></button></li><li><button class="w" data-no="928"><div class="top"><span class="no">928</span><span class="en">gesture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">身ぶり；ジェスチャー</div><div class="ex">Tom used <b>gestures</b> to talk with the tourist.</div><div class="xj">トムは身ぶりを使って観光客と話した。</div></button></li><li><button class="w" data-no="929"><div class="top"><span class="no">929</span><span class="en">relation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">関係</div><div class="ex">Japan has good <b>relations</b> with many countries.</div><div class="xj">日本は多くの国とよい関係にある。</div></button></li><li><button class="w" data-no="930"><div class="top"><span class="no">930</span><span class="en">relief</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">安心；（苦痛の）軽減</div><div class="ex">Finishing the test was a great <b>relief</b> for Ken.</div><div class="xj">テストが終わって、ケンは大いに安心した。</div></button></li><li><button class="w" data-no="931"><div class="top"><span class="no">931</span><span class="en">shift</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（交代制の）勤務時間；変化</div><div class="ex">My mother works the night <b>shift</b> at the hospital.</div><div class="xj">母は病院で夜の勤務についている。</div></button></li><li><button class="w" data-no="932"><div class="top"><span class="no">932</span><span class="en">pronunciation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">発音</div><div class="ex">Lisa&#x27;s Japanese <b>pronunciation</b> is very good.</div><div class="xj">リサの日本語の発音はとても上手だ。</div></button></li><li><button class="w" data-no="933"><div class="top"><span class="no">933</span><span class="en">phrase</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">句；言い回し</div><div class="ex">Write down useful English <b>phrases</b> in your notebook.</div><div class="xj">役に立つ英語の言い回しをノートに書き出しなさい。</div></button></li><li><button class="w" data-no="934"><div class="top"><span class="no">934</span><span class="en">independence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">独立；自立</div><div class="ex">The country gained <b>independence</b> in 1960.</div><div class="xj">その国は1960年に独立した。</div></button></li><li><button class="w" data-no="935"><div class="top"><span class="no">935</span><span class="en">ancestor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">先祖；祖先</div><div class="ex">My <b>ancestors</b> came from a small village in Kyushu.</div><div class="xj">私の先祖は九州の小さな村の出身だ。</div></button></li><li><button class="w" data-no="936"><div class="top"><span class="no">936</span><span class="en">trial</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">試み；試験；裁判</div><div class="ex">After many <b>trials</b>, Ken finally made a perfect cake.</div><div class="xj">何度もの試みのあと、ケンはついに完璧なケーキを作った。</div></button></li><li><button class="w" data-no="937"><div class="top"><span class="no">937</span><span class="en">unexpected</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">予期しない；思いがけない</div><div class="ex">We had an <b>unexpected</b> visitor last night.</div><div class="xj">昨夜、予期しない客が来た。</div></button></li><li><button class="w" data-no="938"><div class="top"><span class="no">938</span><span class="en">urgent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">緊急の</div><div class="ex">I have an <b>urgent</b> message for Ken.</div><div class="xj">ケンに緊急の伝言がある。</div></button></li><li><button class="w" data-no="939"><div class="top"><span class="no">939</span><span class="en">sore</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">（体が）痛い；ひりひりする</div><div class="ex">My legs are <b>sore</b> after the long hike.</div><div class="xj">長いハイキングのあとで足が痛い。</div></button></li><li><button class="w" data-no="940"><div class="top"><span class="no">940</span><span class="en">permanent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">永久的な；終身の</div><div class="ex">Lisa wants to make Japan her <b>permanent</b> home.</div><div class="xj">リサは日本を永久的な住まいにしたいと考えている。</div></button></li><li><button class="w" data-no="941"><div class="top"><span class="no">941</span><span class="en">thick</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">厚い；濃い</div><div class="ex">Lisa is reading a very <b>thick</b> book.</div><div class="xj">リサはとても厚い本を読んでいる。</div></button></li><li><button class="w" data-no="942"><div class="top"><span class="no">942</span><span class="en">complicated</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">複雑な</div><div class="ex">The rules of this game are too <b>complicated</b>.</div><div class="xj">このゲームのルールは複雑すぎる。</div></button></li><li><button class="w" data-no="943"><div class="top"><span class="no">943</span><span class="en">digital</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">デジタルの</div><div class="ex">My grandfather bought a <b>digital</b> camera.</div><div class="xj">祖父はデジタルカメラを買った。</div></button></li><li><button class="w" data-no="944"><div class="top"><span class="no">944</span><span class="en">extinct</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">絶滅した</div><div class="ex">Dinosaurs became <b>extinct</b> about 66 million years ago.</div><div class="xj">恐竜は約6600万年前に絶滅した。</div></button></li><li><button class="w" data-no="945"><div class="top"><span class="no">945</span><span class="en">secure</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">安全な；確かな</div><div class="ex">Keep your passport in a <b>secure</b> place.</div><div class="xj">パスポートは安全な場所に保管しなさい。</div></button></li><li><button class="w" data-no="946"><div class="top"><span class="no">946</span><span class="en">precious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">貴重な；大切な</div><div class="ex">These old photos are <b>precious</b> to my family.</div><div class="xj">これらの古い写真は、私の家族にとって貴重だ。</div></button></li><li><button class="w" data-no="947"><div class="top"><span class="no">947</span><span class="en">legal</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">法律の；合法の</div><div class="ex">My aunt gives <b>legal</b> advice to companies.</div><div class="xj">おばは会社に法律の助言をしている。</div></button></li><li><button class="w" data-no="948"><div class="top"><span class="no">948</span><span class="en">mild</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">穏やかな；（味が）まろやかな</div><div class="ex">The weather was <b>mild</b> and sunny today.</div><div class="xj">今日は穏やかな晴れの天気だった。</div></button></li><li><button class="w" data-no="949"><div class="top"><span class="no">949</span><span class="en">possibly</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">ひょっとすると；（canと）なんとかして</div><div class="ex">That umbrella could <b>possibly</b> be Emi&#x27;s.</div><div class="xj">あのかさは、ひょっとするとエミのものかもしれない。</div></button></li><li><button class="w" data-no="950"><div class="top"><span class="no">950</span><span class="en">seldom</span><span class="ps">副</span><span class="star">★</span></div><div class="ja">めったに～ない</div><div class="ex">My father <b>seldom</b> watches TV on weekdays.</div><div class="xj">父は平日にはめったにテレビを見ない。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"901": 5.12, "902": 18.15, "903": 31.13, "904": 46.8, "905": 60.81, "906": 75.98, "907": 89.96, "908": 103.59, "909": 119.26, "910": 134.66, "911": 148.48, "912": 162.45, "913": 176.34, "914": 190.9, "915": 203.5, "916": 217.97, "917": 233.92, "918": 247.62, "919": 263.53, "920": 276.87, "921": 289.49, "922": 303.0, "923": 316.92, "924": 330.04, "925": 343.6, "926": 358.14, "927": 371.24, "928": 384.67, "929": 398.37, "930": 411.66, "931": 425.89, "932": 440.55, "933": 454.37, "934": 468.17, "935": 482.47, "936": 496.53, "937": 511.04, "938": 525.1, "939": 537.7, "940": 551.95, "941": 566.25, "942": 579.35, "943": 592.4, "944": 605.22, "945": 619.56, "946": 633.07, "947": 647.01, "948": 660
