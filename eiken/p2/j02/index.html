 door.</div><div class="xj">必ずドアにかぎをかけてね。</div></button></li><li><button class="w" data-no="熟16"><div class="top"><span class="no">熟16</span><span class="en">make a reservation</span></div><div class="ja">予約する</div><div class="ex">I made a reservation at the restaurant.</div><div class="xj">そのレストランを予約した。</div></button></li><li><button class="w" data-no="熟17"><div class="top"><span class="no">熟17</span><span class="en">make a decision</span></div><div class="ja">決定する</div><div class="ex">We have to make a decision by Friday.</div><div class="xj">金曜日までに決めなければならない。</div></button></li><li><button class="w" data-no="熟18"><div class="top"><span class="no">熟18</span><span class="en">make a speech</span></div><div class="ja">スピーチをする</div><div class="ex">I have to make a speech in English tomorrow.</div><div class="xj">明日、英語でスピーチをしなければならない。</div></button></li><li><button class="w" data-no="熟19"><div class="top"><span class="no">熟19</span><span class="en">make progress</span></div><div class="ja">進歩する、上達する</div><div class="ex">You are making great progress in English.</div><div class="xj">あなたは英語がとても上達している。</div></button></li><li><button class="w" data-no="熟20"><div class="top"><span class="no">熟20</span><span class="en">have trouble ～ing</span></div><div class="ja">～するのに苦労する</div><div class="ex">I had trouble finding the station.</div><div class="xj">駅を見つけるのに苦労した。</div></button></li><li><button class="w" data-no="会6"><div class="top"><span class="no">会6</span><span class="en">Could you tell me ～?</span></div><div class="ja">～を教えてもらえますか？</div><div class="ex">A: Welcome to City Library.<br>B: Hi. Could you tell me where the history books are?</div></button></li><li><button class="w" data-no="会7"><div class="top"><span class="no">会7</span><span class="en">I&#x27;d like to ～.</span></div><div class="ja">～したいのですが。</div><div class="ex">A: Good morning. How can I help you?<br>B: I&#x27;d like to send this package to Osaka.</div></button></li><li><button class="w" data-no="会8"><div class="top"><span class="no">会8</span><span class="en">Would you mind ～ing?</span></div><div class="ja">～していただけませんか？</div><div class="ex">A: Can I help you with anything?<br>B: Yes. Would you mind carrying this box?</div></button></li><li><button class="w" data-no="会9"><div class="top"><span class="no">会9</span><span class="en">Do you mind if I ～?</span></div><div class="ja">～してもかまいませんか？</div><div class="ex">A: It&#x27;s really hot today.<br>B: Yes. Do you mind if I open the window?</div></button></li><li><button class="w" data-no="会10"><div class="top"><span class="no">会10</span><span class="en">Can I ask you a favor?</span></div><div class="ja">お願いがあるんだけど。</div><div class="ex">A: What&#x27;s up, Kenji?<br>B: Can I ask you a favor? I need help with my homework.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j01/">← 熟語 Set 1</a><a href="../j03/">熟語 Set 3 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟11": 5.22, "熟12": 18.92, "熟13": 33.68, "熟14": 48.34, "熟15": 62.18, "熟16": 78.02, "熟17": 91.33, "熟18": 104.34, "熟19": 117.72, "熟20": 132.12, "会6": 146.71, "会7": 165.44, "会8": 183.22, "会9": 202.15, "会10": 220.52}, "TE": {"熟11": 7.55, "熟12": 21.08, "熟13": 35.55, "熟14": 50.26, "熟15": 64.46, "熟16": 80.2, "熟17": 93.32, "熟18": 106.35, "熟19": 119.81, "熟20": 134.54, "会6": 148.58, "会7": 167.32, "会8": 185.6, "会9": 204.14, "会10": 222.83}, "Q": [["熟11", "make up one's mind", "決心する"], ["熟12", "make an excuse", "言い訳をする"], ["熟13", "make out ～", "～を見分ける、～を読み取る"], ["熟14", "have ～ in common", "～を共通に持っている"], ["熟15", "make sure (that) ～", "必ず～するようにする、～を確かめる"], ["熟16", "make a reservation", "予約する"], ["熟17", "make a decision", "決定する"], ["熟18", "make a speech", "スピーチをする"], ["熟19", "make progress", "進歩する、上達する"], ["熟20", "have trouble ～ing", "～するのに苦労する"], ["会6", "Could you tell me ～?", "～を教えてもらえますか？"], ["会7", "I'd like to ～.", "～したいのですが。"], ["会8", "W
