s="xj">その科学者は自分の考えが正しいことを証明した。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">handle</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を扱う；処理する</div><div class="ex">Please <b>handle</b> these glass cups with care.</div><div class="xj">このガラスのカップは注意して扱ってください。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">deny</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を否定する</div><div class="ex">Tom <b>denied</b> that he ate the last cookie.</div><div class="xj">トムは最後のクッキーを食べたことを否定した。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">permit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を許可する</div><div class="ex">Students are not <b>permitted</b> to use phones in class.</div><div class="xj">授業中、生徒はスマホを使うことを許可されていない。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">delete</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を削除する</div><div class="ex">I <b>deleted</b> the old photos from my phone.</div><div class="xj">私はスマホから古い写真を削除した。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">ruin</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を台無しにする；破壊する</div><div class="ex">The sudden rain <b>ruined</b> our picnic in the park.</div><div class="xj">突然の雨が、公園でのピクニックを台無しにした。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">stick</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をはりつける；くっつく</div><div class="ex">Emi <b>stuck</b> a photo of her dog on the wall.</div><div class="xj">エミは壁に犬の写真をはりつけた。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">doubt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を疑う；～ではないと思う</div><div class="ex">At first, Lisa <b>doubted</b> the news on the internet.</div><div class="xj">最初、リサはインターネット上のそのニュースを疑った。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">examine</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を調べる；検査する</div><div class="ex">The doctor carefully <b>examined</b> the boy&#x27;s eyes.</div><div class="xj">医者は男の子の目を注意深く調べた。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">commute</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">通勤する；通学する</div><div class="ex">My father <b>commutes</b> to work by train.</div><div class="xj">父は電車で会社に通勤している。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">hesitate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ためらう</div><div class="ex">Please don&#x27;t <b>hesitate</b> to ask questions.</div><div class="xj">ためらうことなく質問してください。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">submit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を提出する</div><div class="ex">Please <b>submit</b> your report by Friday.</div><div class="xj">金曜日までにレポートを提出してください。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">persuade</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を説得する</div><div class="ex">Ken <b>persuaded</b> his parents to buy him a bike.</div><div class="xj">ケンは自転車を買ってくれるように両親を説得した。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">billion</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">10億</div><div class="ex">The new stadium cost one <b>billion</b> yen.</div><div class="xj">新しいスタジアムには10億円かかった。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">luxury</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ぜいたく（品）</div><div class="ex">Eating at that restaurant is a <b>luxury</b> for us.</div><div class="xj">あのレストランで食事をするのは、私たちにはぜいたくだ。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">species</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（生物の）種</div><div class="ex">Many <b>species</b> of birds live on this island.</div><div class="xj">この島には多くの種の鳥がすんでいる。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">user</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">利用者；使用者</div><div class="ex">This app has over a million <b>users</b>.</div><div class="xj">このアプリには100万人以上の利用者がいる。</div></button></li><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">tax</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">税金</div><div class="ex">The price of this bag includes <b>tax</b>.</div><div class="xj">このかばんの値段には税金が含まれている。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">cough</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">せき</div><div class="ex">Lisa has had a bad <b>cough</b> since Monday.</div><div class="xj">リサは月曜日からひどいせきが出ている。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">colleague</span><spa /div><div class="ja">小さいほうの；重要でない</div><div class="ex">There are some <b>minor</b> mistakes in your report.</div><div class="xj">きみのレポートにはささいなまちがいがいくつかある。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">senior</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">年長の；上級の</div><div class="ex"><b>Senior</b> members of the club teach the new students.</div><div class="xj">クラブの年長のメンバーが新入生に教える。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">brief</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">短い；簡潔な</div><div class="ex">Our teacher gave a <b>brief</b> talk about the trip.</div><div class="xj">先生は旅行について短い話をした。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">extreme</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">極端な；極度の</div><div class="ex">Some animals can live in <b>extreme</b> cold.</div><div class="xj">極度の寒さの中で生きられる動物もいる。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">remote</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">遠く離れた；へんぴな</div><div class="ex">My grandparents live in a <b>remote</b> village in the mountains.</div><div class="xj">祖父母は山の中の遠く離れた村に住んでいる。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">fascinating</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">魅力的な；とてもおもしろい</div><div class="ex">The talk about space was <b>fascinating</b> for everyone.</div><div class="xj">宇宙についての話は、みんなにとって魅力的だった。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">intelligent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">知能の高い；頭のよい</div><div class="ex">Dolphins are known as very <b>intelligent</b> animals.</div><div class="xj">イルカはとても知能の高い動物として知られている。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">sensitive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">敏感な；傷つきやすい</div><div class="ex">Dogs are very <b>sensitive</b> to sounds.</div><div class="xj">犬は音にとても敏感だ。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">obvious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">明らかな</div><div class="ex">It was <b>obvious</b> that Ken was tired.</div><div class="xj">ケンが疲れているのは明らかだった。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">anxious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">心配して；（be anxious to do）～したがっている</div><div class="ex">Emi was <b>anxious</b> about her test results.</div><div class="xj">エミはテストの結果を心配していた。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">careless</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不注意な</div><div class="ex">I made a <b>careless</b> mistake on the math test.</div><div class="xj">私は数学のテストで不注意なまちがいをした。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">instant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">即席の；即時の</div><div class="ex">I had <b>instant</b> noodles for lunch.</div><div class="xj">昼食に即席めんを食べた。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">generous</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">気前のよい；寛大な</div><div class="ex">It w
