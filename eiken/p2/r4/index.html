ss="no">復161</span><span class="en">package</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">小包</div><div class="ex">A <b>package</b> arrived from my uncle today.</div><div class="xj">今日、おじから小包が届いた。</div></button></li><li><button class="w" data-no="復162"><div class="top"><span class="no">復162</span><span class="en">purpose</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">目的</div><div class="ex">What is the <b>purpose</b> of your trip?</div><div class="xj">あなたの旅行の目的は何ですか。</div></button></li><li><button class="w" data-no="復163"><div class="top"><span class="no">復163</span><span class="en">trouble</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">困ったこと；もめごと</div><div class="ex">If you have any <b>trouble</b>, please call me.</div><div class="xj">何か困ったことがあれば、電話してください。</div></button></li><li><button class="w" data-no="復164"><div class="top"><span class="no">復164</span><span class="en">hall</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ホール；会館</div><div class="ex">The concert was in a big <b>hall</b>.</div><div class="xj">コンサートは大きなホールで行われた。</div></button></li><li><button class="w" data-no="復165"><div class="top"><span class="no">復165</span><span class="en">couple</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">1組；夫婦</div><div class="ex">An old <b>couple</b> lives next to our house.</div><div class="xj">私たちの家の隣に、年配の夫婦が住んでいる。</div></button></li><li><button class="w" data-no="復166"><div class="top"><span class="no">復166</span><span class="en">machine</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">機械</div><div class="ex">This <b>machine</b> makes ice cream.</div><div class="xj">この機械はアイスクリームを作る。</div></button></li><li><button class="w" data-no="復167"><div class="top"><span class="no">復167</span><span class="en">classmate</span><span class="ps">名</span><span class="star">★★★</spa
