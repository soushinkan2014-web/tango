</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第12回</h1><div class="sub">No.551〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">attach</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り付ける；（メールに）～を添付する</div><div class="ex">Ken <b>attached</b> a light to his bike.</div><div class="xj">ケンは自転車にライトを取り付けた。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">postpone</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を延期する</div><div class="ex">The game was <b>postponed</b> because of the rain.</div><div class="xj">試合は雨のため延期された。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">disturb</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をじゃまする；妨げる</div><div class="ex">Please don&#x27;t <b>disturb</b> me while I&#x27;m studying.</div><div class="xj">私が勉強している間はじゃましないで。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">weigh</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の重さがある；～の重さを量る</div><div class="ex">This baby <b>weighs</b> about three kilograms.</div><div class="xj">この赤ちゃんは約3キログラムの重さがある。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">relate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（be related to ～）～と関係がある</div><div class="ex">This question is <b>related</b> to today&#x27;s lesson.</div><div class="xj">この質問は今日の授業と関係がある。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">bend</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を曲げる；曲がる</div><div class="ex"><b>Bend</b> your knees and touch the floor.</div><div class="xj">ひざを曲げて、床にさわりなさい。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">interact</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">交流する；ふれ合う</div><div class="ex">Students can <b>interact</b> with people from other countries.</div><div class="xj">生徒たちは外国の人々と交流することができる。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">forgive</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を許す</div><div class="ex">Please <b>forgive</b> me for being late.</div><div class="xj">遅れたことを許してください。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">director</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（映画などの）監督；重役</div><div class="ex">The <b>director</b> of this movie is only twenty-five.</div><div class="xj">この映画の監督はまだ25歳だ。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">growth</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">成長；増加</div><div class="ex">We watched the <b>growth</b> of the sunflowers all summer.</div><div class="xj">私たちは夏の間ずっと、ヒマワリの成長を見守った。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">fortune</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">運；財産</div><div class="ex">Ken had the good <b>fortune</b> to meet a famous singer.</div><div class="xj">ケンは運よく、有名な歌手に会えた。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">departure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出発</div><div class="ex">Our <b>departure</b> time is eight in the morning.</div><div class="xj">私たちの出発時刻は朝8時だ。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">celebration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">お祝い；祝典</div><div class="ex">We had a big <b>celebration</b> for Grandma&#x27;s 80th birthday.</div><div class="xj">祖母の80歳の誕生日に、盛大なお祝いをした。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">proposal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">提案；プロポーズ</div><div class="ex">The class accepted Emi&#x27;s <b>proposal</b> for the festival.</div><div class="xj">クラスは、文化祭についてのエミの提案を受け入れた。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">height</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">高さ；身長</div><div class="ex">What is the <b>height</b> of that tower?</div><div class="xj">あの塔の高さはどれくらいですか。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">combination</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">組み合わせ</div><div class="ex">This salad is a good <b>combination</b> of fruit and vegetables.</div><div class="xj">このサラダは果物と野菜のよい組み合わせだ。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">freedom</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">自由</div><div class="ex">Students have the <b>freedom</b> to choose their own topics.</div><div class="xj">生徒には自分でテーマを選ぶ自由がある。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">reaction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">反応</div><div class="ex">What was your mother&#x27;s <b>reaction</b> to your test score?</div><div class="xj">テストの点数に対するお母さんの反応はどうだった？</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">assistant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">助手；アシスタント</div><div class="ex">The teacher&#x27;s <b>assistant</b> handed out the worksheets.</div><div class="xj">先生の助手がプリントを配った。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">operation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手術；操作；運営</div><div class="ex">My grandfather had an <b>operation</b> on his knee.</div><div class="xj">祖父はひざの手術を受けた。</div></button></li><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">reward</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ほうび；報酬</div><div class="ex">Mom gave me ice cream as a <b>reward</b> for cleaning my room.</div><div class="xj">部屋を掃除したほうびに、母がアイスクリームをくれた。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">strength</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">強さ；長所</div><div class="ex">We tested the <b>strength</b> of the paper bridge.</div><div class="xj">私たちは紙の橋の強さを試した。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">conference</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">会議</div><div class="ex">My mother went to a <b>conference</b> in Tokyo last week.</div><div class="xj">母は先週、東京での会議に出席した。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">climate</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">気候</div><div class="ex">The <b>climate</b> here is warm all year.</div><div class="xj">この地域の気候は一年中暖かい。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">sight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">視力；光景；（sightsで）名所</div><div class="ex">My grandmother&#x27;s <b>sight</b> is getting worse.</div><div class="xj">祖母の視力は悪くなってきている。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">substance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">物質</div><div class="ex">Scientists found a new <b>substance</b> in the sea.</div><div class="xj">科学者たちは海の中で新しい物質を発見した。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">injury</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">けが</div><div class="ex">Tom could not play because of a leg <b>injury</b>.</div><div class="xj">トムは足のけがのため、試合に出られなかった。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">shadow</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">影</div><div class="ex">In the evening, our <b>shadows</b> become very long.</div><div class="xj">夕方になると、私たちの影はとても長くなる。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">semester</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">学期</div><div class="ex">The new <b>semester</b> starts in April.</div><div class="xj">新しい学期は4月に始まる。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">harvest</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">収穫</div><div class="ex">The rice <b>harvest</b> was good this year.</div><div class="xj">今年は米の収穫がよかった。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">factor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">要因</div><div class="ex">Hard work was the main <b>factor</b> in our team&#x27;s success.</div><div class="xj">努力が、私たちのチームの成功の主な要因だった。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">explanation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">説明</div><div class="ex">The teacher&#x27;s <b>explanation</b> was easy to understand.</div><div class="xj">先生の説明はわかりやすかった。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">politician</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">政治家</div><div class="ex">The <b>politician</b> gave a speech at the station.</div><div class="xj">その政治家は駅で演説をした。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">painful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">痛い；つらい</div><div class="ex">The shot at the hospital was not <b>painful</b> at all.</div><div class="xj">病院での注射は少しも痛くなかった。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">false</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">誤った；うその</div><div class="ex">Some news on the internet is <b>false</b>.</div><div class="xj">インターネット上のニュースの中には誤ったものもある。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">annual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">毎年の；年1回の</div><div class="ex">The <b>annual</b> school festival will be held next week.</div><div class="xj">年に一度の文化祭が来週開かれる。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">cultural</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">文化の；文化的な</div><div class="ex">We learned about <b>cultural</b> differences between Japan and other countries.</div><div class="xj">私たちは日本と外国の文化の違いについて学んだ。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">economic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">経済の</div><div class="ex">Our teacher explained the <b>economic</b> news in simple words.</div><div class="xj">先生は経済のニュースをやさしい言葉で説明してくれた。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">sincere</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">誠実な；心からの</div><div class="ex">Ken is a <b>sincere</b> boy who never tells lies.</div><div class="xj">ケンは決してうそをつかない誠実な少年だ。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">indoor</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">屋内の</div><div class="ex">Our school has an <b>indoor</b> swimming pool.</div><div class="xj">私たちの学校には屋内プールがある。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">honestly</span><span class="ps">副</span><span clas
