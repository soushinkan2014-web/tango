li><button class="w" data-no="熟76"><div class="top"><span class="no">熟76</span><span class="en">on one&#x27;s own</span></div><div class="ja">ひとりで、独力で</div><div class="ex">She made this dress on her own.</div><div class="xj">彼女はこのドレスをひとりで作った。</div></button></li><li><button class="w" data-no="熟77"><div class="top"><span class="no">熟77</span><span class="en">all over ～</span></div><div class="ja">～じゅうに、～一面に</div><div class="ex">There were leaves all over the ground.</div><div class="xj">地面一面に落ち葉があった。</div></button></li><li><button class="w" data-no="熟78"><div class="top"><span class="no">熟78</span><span class="en">for nothing</span></div><div class="ja">むだに、無料で</div><div class="ex">The shop was closed, so we went there for nothing.</div><div class="xj">店が閉まっていたので、行ったのがむだになった。</div></button></li><li><button class="w" data-no="熟79"><div class="top"><span class="no">熟79</span><span class="en">at length</span></div><div class="ja">長々と、くわしく</div><div class="ex">We talked at length about our future.</div><div class="xj">私たちは将来について長い時間話し合った。</div></button></li><li><button class="w" data-no="熟80"><div class="top"><span class="no">熟80</span><span class="en">out of the question</span></div><div class="ja">問題外で、ありえない</div><div class="ex">Going out in this storm is out of the question.</div><div class="xj">この嵐の中で出かけるなんてありえない。</div></button></li><li><button class="w" data-no="会36"><div class="top"><span class="no">会36</span><span class="en">Are you serious?</span></div><div class="ja">本気なの？／本当に？</div><div class="ex">A: I&#x27;m going to run a full marathon.<br>B: Are you serious? That&#x27;s amazing!</div></button></li><li><button class="w" data-no="会37"><div class="top"><span class="no">会37</span><span class="en">No way!</span></div><div class="ja">まさか！</div><div class="ex">A: Our teacher is going to sing at the festival.<br>B: No way! That will be fun.</div></button></li><li><button class="w" data-no="会38"><div class="top"><span class="no">会38</span><span class="en">I can&#x27;t believe ～.</span></div><div class="ja">～なんて信じられない。</div><div class="ex">A: I lost my wallet again.<br>B: I can&#x27;t believe it! That&#x27;s the third time this month.</div></button></li><li><button class="w" data-no="会39"><div class="top"><span class="no">会39</span><span class="en">You must be ～.</span></div><div class="ja">～にちがいないね。</div><div class="ex">A: I walked for five hours today.<br>B: Wow. You must be tired.</div></button></li><li><button class="w" data-no="会40"><div class="top"><span class="no">会40</span><span class="en">No wonder ～.</span></div><div class="ja">どうりで～なわけだ。</div><div class="ex">A: Ken played games until 3 a.m.<br>B: No wonder he looks so sleepy.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j07/">← 熟語 Set 7</a><a href="../j09/">熟語 Set 9 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟71": 5.27, "熟72": 18.49, "熟73": 31.23, "熟74": 44.4, "熟75": 58.44, "熟76": 70.36, "熟77": 83.77, "熟78": 98.14, "熟79": 112.01, "熟80": 125.4, "会36": 139.58, "会37": 158.46, "会38": 175.85, "会39": 194.97, "会40": 212.68}, "TE": {"熟71": 7.21, "熟72": 20.53, "熟73": 33.17, "熟74": 46.39, "熟75": 60.31, "熟76": 72.33, "熟77": 85.64, "熟78": 100.02, "熟79": 113.88, "熟80": 127.46, "会36": 141.64, "会37": 160.33, "会38": 177.96, "会39": 196.92, "会40": 214.55}, "Q": [["熟71", "on business", "仕事で"], ["熟72", "on purpose", "わざと"], ["熟73", "by mistake", "まちがって"], ["熟74", "in place of ～", "～の代わりに"], ["熟75", "in a minute", "すぐに"], ["熟76", "on one's own", "ひとりで、独力で"], ["熟77", "all over ～", "～じゅうに、～一面に"], ["熟78", "for nothing", "むだに、無料で"], ["熟79", "at length", "長々と、くわしく"], ["熟80", "out of the question", "問題外で、ありえない"], ["会36", "Are you serious?", "本気なの？／本当に？"], ["会37", "No way!", "まさか！"], ["会38", "I can't believe ～.", "～なんて信じられない。"], ["会39", "You must be ～.", "～にちがいないね。"], ["会40", "No wonder ～.", "どうりで～なわけだ。"]], "KEY": "ep2-j08"};</script><script src
