/button></li><li><button class="w" data-no="熟146"><div class="top"><span class="no">熟146</span><span class="en">from now on</span></div><div class="ja">今後は、これからは</div><div class="ex">From now on, I&#x27;ll get up earlier.</div><div class="xj">これからはもっと早く起きるつもりだ。</div></button></li><li><button class="w" data-no="熟147"><div class="top"><span class="no">熟147</span><span class="en">little by little</span></div><div class="ja">少しずつ</div><div class="ex">My English is getting better little by little.</div><div class="xj">私の英語は少しずつ上達している。</div></button></li><li><button class="w" data-no="熟148"><div class="top"><span class="no">熟148</span><span class="en">one after another</span></div><div class="ja">次々に</div><div class="ex">The guests arrived one after another.</div><div class="xj">客が次々に到着した。</div></button></li><li><button class="w" data-no="熟149"><div class="top"><span class="no">熟149</span><span class="en">sooner or later</span></div><div class="ja">遅かれ早かれ</div><div class="ex">He will find out the truth sooner or later.</div><div class="xj">遅かれ早かれ彼は真実を知るだろう。</div></button></li><li><button class="w" data-no="熟150"><div class="top"><span class="no">熟150</span><span class="en">at the same time</span></div><div class="ja">同時に</div><div class="ex">I can&#x27;t do two things at the same time.</div><div class="xj">私は2つのことを同時にできない。</div></button></li><li><button class="w" data-no="会71"><div class="top"><span class="no">会71</span><span class="en">Thanks for letting me know.</span></div><div class="ja">知らせてくれてありがとう。</div><div class="ex">A: Your bag is open.<br>B: Oh, thanks for letting me know.</div></button></li><li><button class="w" data-no="会72"><div class="top"><span class="no">会72</span><span class="en">I appreciate it.</span></div><div class="ja">感謝します。</div><div class="ex">A: I&#x27;ll carry your bags to the car.<br>B: Thank you. I really appreciate it.</div></button></li><li><button class="w" data-no="会73"><div class="top"><span class="no">会73</span><span class="en">Sorry to
