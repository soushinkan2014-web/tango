/li><li><button class="w" data-no="熟36"><div class="top"><span class="no">熟36</span><span class="en">turn out (to be) ～</span></div><div class="ja">～だとわかる、結局～になる</div><div class="ex">The test turned out to be easy.</div><div class="xj">テストは結局やさしかった。</div></button></li><li><button class="w" data-no="熟37"><div class="top"><span class="no">熟37</span><span class="en">put away ～</span></div><div class="ja">～を片づける</div><div class="ex">Put away your toys before dinner.</div><div class="xj">夕食の前におもちゃを片づけなさい。</div></button></li><li><button class="w" data-no="熟38"><div class="top"><span class="no">熟38</span><span class="en">put off ～</span></div><div class="ja">～を延期する</div><div class="ex">The game was put off because of the rain.</div><div class="xj">雨のため試合は延期された。</div></button></li><li><button class="w" data-no="熟39"><div class="top"><span class="no">熟39</span><span class="en">put up with ～</span></div><div class="ja">～をがまんする</div><div class="ex">I can&#x27;t put up with this noise.</div><div class="xj">この騒音にはがまんできない。</div></button></li><li><button class="w" data-no="熟40"><div class="top"><span class="no">熟40</span><span class="en">put out ～</span></div><div class="ja">（火・明かり）を消す</div><div class="ex">The firefighters put out the fire quickly.</div><div class="xj">消防士たちはすぐに火を消した。</div></button></li><li><button class="w" data-no="会16"><div class="top"><span class="no">会16</span><span class="en">Would you like to ～?</span></div><div class="ja">～しませんか？（誘う）</div><div class="ex">A: What are you doing this Sunday?<br>B: Nothing special. Would you like to go shopping?</div></button></li><li><button class="w" data-no="会17"><div class="top"><span class="no">会17</span><span class="en">Why don&#x27;t we ～?</span></div><div class="ja">（いっしょに）～しようよ。</div><div class="ex">A: I&#x27;m hungry.<br>B: Me, too. Why don&#x27;t we have lunch at that café?</div></button></li><li><button class="w" data-no="会18"><div class="top"><span class="no">会18</span><span class="en">Shall we ～?</span></div><div class="ja">～しましょうか？</div><div class="ex">A: It&#x27;s already five o&#x27;clock.<br>B: Shall we go home now?</div></button></li><li><button class="w" data-no="会19"><div class="top"><span class="no">会19</span><span class="en">What do you say to ～ing?</span></div><div class="ja">～するのはどう？</div><div class="ex">A: It&#x27;s a nice day today.<br>B: What do you say to going on a picnic?</div></button></li><li><button class="w" data-no="会20"><div class="top"><span class="no">会20</span><span class="en">How does ～ sound?</span></div><div class="ja">～はどう？（都合・案をたずねる）</div><div class="ex">A: When should we meet tomorrow?<br>B: How does ten o&#x27;clock sound?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j03/">← 熟語 Set 3</a><a href="../j05/">熟語 Set 5 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟31": 5.12, "熟32": 18.63, "熟33": 32.45, "熟34": 45.62, "熟35": 59.04, "熟36": 72.21, "熟37": 87.97, "熟38": 101.1, "熟39": 114.58, "熟40": 127.7, "会16": 141.26, "会17": 160.36, "会18": 178.32, "会19": 194.04, "会20": 211.79}, "TE": {"熟31": 7.0, "熟32": 20.5, "熟33": 34.32, "熟34": 47.5, "熟35": 60.93, "熟36": 74.54, "熟37": 89.84, "熟38": 102.97, "熟39": 116.45, "熟40": 129.58, "会16": 143.13, "会17": 162.23, "会18": 180.2, "会19": 196.7, "会20": 213.73}, "Q": [["熟31", "Look out!", "気をつけて！"], ["熟32", "look up ～", "～を調べる"], ["熟33", "look over ～", "～にざっと目を通す"], ["熟34", "look up to ～", "～を尊敬する"], ["熟35", "turn into ～", "～に変わる"], ["熟36", "turn out (to be) ～", "～だとわかる、結局～になる"], ["熟37", "put away ～", "～を片づける"], ["熟38", "put off ～", "～を延期する"], ["熟39", "put up with ～", "～をがまんする"], ["熟40", "put out ～", "を消す"], ["会16", "Would you like to ～?", "～しませんか？"], ["会17", "Why don't we ～?", "～しようよ。"], ["会18", "Shall we ～?", "～しましょうか？"], ["会19", "What do you say to ～ing?", "～するのはどう？"], ["会20", "How does ～ sound?", "～はどう？"]], "KEY": "ep2-j04"};</script><script src="../../../app.js?v=2"
