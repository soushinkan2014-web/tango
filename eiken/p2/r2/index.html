an class="en">hike</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">ハイキングをする</div><div class="ex">We <b>hiked</b> in the mountains last weekend.</div><div class="xj">先週末、私たちは山でハイキングをした。</div></button></li><li><button class="w" data-no="復62"><div class="top"><span class="no">復62</span><span class="en">cancel</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を中止する；～を取り消す</div><div class="ex">The game was <b>canceled</b> because of the rain.</div><div class="xj">雨のため、試合は中止された。</div></button></li><li><button class="w" data-no="復63"><div class="top"><span class="no">復63</span><span class="en">remind</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に思い出させる</div><div class="ex">This song <b>reminds</b> me of my summer vacation.</div><div class="xj">この歌は私に夏休みを思い出させる。</div></button></li><li><button class="w" data-no="復64"><div class="top"><span class="no">復64</span><span class="en">deliver</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を配達する</div><div class="ex">Ken <b>delivers</b> newspapers every morning.</div><div class="xj">ケンは毎朝、新聞を配達している。</div></button></li><li><button class="w" data-no="復65"><div class="top"><span class="no">復65</span><span class="en">continue</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を続ける；続く</div><div class="ex">Ken <b>continued</b> his story after a short break.</div><div class="xj">ケンは少し休んでから話を続けた。</div></button></li><li><button class="w" data-no="復66"><div class="top"><span class="no">復66</span><span class="en">solve</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を解く；～を解決する</div><div class="ex">Tom <b>solved</b> the math problem quickly.</div><div class="xj">トムはその数学の問題をすぐに解いた。</div></button></li><li><button class="w" data-no="復67"><div class="top"><span class="no">復67</span><span class="en">fill</span><span class="ps">動</span><span class=
