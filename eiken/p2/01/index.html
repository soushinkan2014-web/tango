</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第1回</h1><div class="sub">No.1〜50</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">suggest</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を提案する；（それとなく）示す</div><div class="ex">Ken <b>suggested</b> a new plan for the school festival.</div><div class="xj">ケンは文化祭の新しい計画を提案した。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">offer</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を申し出る；提供する</div><div class="ex">Ken <b>offered</b> to carry the heavy bags for his grandmother.</div><div class="xj">ケンは祖母のために重い荷物を運ぼうと申し出た。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">reduce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を減らす</div><div class="ex">Our city is working hard to <b>reduce</b> trash.</div><div class="xj">私たちの市は、ごみを減らすことに力を入れている。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">improve</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を改善する；向上させる</div><div class="ex">Our team talked about how to <b>improve</b> our practice.</div><div class="xj">私たちのチームは、練習を改善する方法について話し合った。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">connect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をつなぐ；接続する</div><div class="ex">A new bridge <b>connects</b> the two towns.</div><div class="xj">新しい橋が2つの町をつないでいる。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">hire</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を雇う</div><div class="ex">The bakery <b>hired</b> two new workers last month.</div><div class="xj">そのパン屋は先月、新しい店員を2人雇った。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">cause</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を引き起こす；～の原因となる</div><div class="ex">Too much sugar can <b>cause</b> health problems.</div><div class="xj">砂糖のとりすぎは、健康上の問題を引き起こすことがある。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">mail</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を郵送する</div><div class="ex">I <b>mailed</b> a birthday card to my aunt yesterday.</div><div class="xj">私は昨日、おばに誕生日カードを郵送した。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">drop</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を落とす；（人）を車から降ろす</div><div class="ex">Tom <b>dropped</b> his key on the way home.</div><div class="xj">トムは帰り道でかぎを落とした。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">greet</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～にあいさつする；～を出迎える</div><div class="ex">Our principal <b>greets</b> students at the school gate every morning.</div><div class="xj">校長先生は毎朝、校門で生徒たちにあいさつする。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">attract</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を引きつける</div><div class="ex">The flower festival <b>attracts</b> many visitors every spring.</div><div class="xj">その花祭りは、毎年春に多くの観光客を引きつける。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">allow</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を許す；（allow A to do）Aが～するのを許す</div><div class="ex">My parents <b>allowed</b> me to go to the concert with Emi.</div><div class="xj">両親は、私がエミとコンサートに行くのを許してくれた。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">disappear</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">消える；見えなくなる</div><div class="ex">The sun <b>disappeared</b> behind the clouds.</div><div class="xj">太陽が雲の向こうに消えた。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">produce</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を生産する；生み出す</div><div class="ex">This farm <b>produces</b> a lot of milk every year.</div><div class="xj">この農場は毎年、たくさんの牛乳を生産している。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">gain</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を得る；（体重など）を増やす</div><div class="ex">My sister <b>gained</b> a lot of experience at her part-time job.</div><div class="xj">姉はアルバイトで多くの経験を得た。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">respect</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を尊敬する；尊重する</div><div class="ex">I <b>respect</b> my coach because he never gives up.</div><div class="xj">コーチは決してあきらめないので、私は彼を尊敬している。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">lay</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を置く；（卵）を産む</div><div class="ex">Tom <b>laid</b> a large map on the table.</div><div class="xj">トムはテーブルの上に大きな地図を置いた。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">suppose</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～だと思う；（be supposed to ～）～することになっている</div><div class="ex">I <b>suppose</b> Tom is still at soccer practice.</div><div class="xj">トムはまだサッカーの練習中だと思う。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">encourage</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を励ます；（encourage A to do）Aに～するよう勧める</div><div class="ex">My friends <b>encouraged</b> me before the big game.</div><div class="xj">大事な試合の前に、友だちが私を励ましてくれた。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">purchase</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を購入する</div><div class="ex">You can <b>purchase</b> concert tickets on this website.</div><div class="xj">このウェブサイトでコンサートのチケットを購入することができます。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">board</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（乗り物）に乗り込む</div><div class="ex">We <b>boarded</b> the plane at nine in the morning.</div><div class="xj">私たちは朝9時に飛行機に乗り込んだ。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">express</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を表現する</div><div class="ex">It is hard for me to <b>express</b> my feelings in English.</div><div class="xj">英語で自分の気持ちを表現するのは難しい。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">prevent</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を防ぐ；（prevent A from -ing）Aが～するのを妨げる</div><div class="ex">Washing your hands is a good way to <b>prevent</b> colds.</div><div class="xj">手を洗うことは、かぜを防ぐよい方法だ。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">accept</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を受け入れる</div><div class="ex">Ken <b>accepted</b> his friend&#x27;s advice and practiced harder.</div><div class="xj">ケンは友だちのアドバイスを受け入れて、もっと熱心に練習した。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">lead</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を導く；（lead to ～）～につながる</div><div class="ex">Our captain <b>led</b> the team to its first win.</div><div class="xj">キャプテンはチームを初勝利に導いた。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">realize</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に気づく；～を実現する</div><div class="ex">Emi <b>realized</b> that she had left her umbrella on the bus.</div><div class="xj">エミはバスにかさを置き忘れたことに気づいた。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">include</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を含む</div><div class="ex">The price of this hotel <b>includes</b> breakfast and dinner.</div><div class="xj">このホテルの料金には朝食と夕食が含まれている。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">avoid</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を避ける</div><div class="ex">We left early to <b>avoid</b> the heavy traffic.</div><div class="xj">私たちは渋滞を避けるために早く出発した。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">attention</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">注意；注目</div><div class="ex">When you cross the street, pay <b>attention</b> to cars.</div><div class="xj">道路を渡るときは、車に注意しなさい。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">announcement</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">発表；お知らせ</div><div class="ex">Our teacher made an <b>announcement</b> about the school trip.</div><div class="xj">先生が修学旅行について発表をした。</div></button></li><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">addition</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">追加；加えること</div><div class="ex">The <b>addition</b> of a new bus line made life easier.</div><div class="xj">新しいバス路線の追加で、生活が便利になった。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">item</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">品物；項目</div><div class="ex">This store sells many <b>items</b> for the kitchen.</div><div class="xj">この店は台所用の品物をたくさん売っている。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">amount</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">量；金額</div><div class="ex">Lisa was surprised at the <b>amount</b> of homework.</div><div class="xj">リサは宿題の量に驚いた。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">influence</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">影響</div><div class="ex">My grandfather had a big <b>influence</b> on my life.</div><div class="xj">祖父は私の人生に大きな影響を与えた。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">control</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">支配；管理</div><div class="ex">Long ago, this island was under the <b>control</b> of a king.</div><div class="xj">昔、この島は王の支配下にあった。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">department</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（会社の）部；（大学の）学科；売り場</div><div class="ex">My father works in the sales <b>department</b> of a big company.</div><div class="xj">父は大きな会社の営業部で働いている。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">length</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">長さ</div><div class="ex">The <b>length</b> of this river is about 300 kilometers.</div><div class="xj">この川の長さは約300キロメートルだ。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">appointment</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（面会などの）予約；約束</div><div class="ex">I have an <b>appointment</b> with the doctor at three.</div><div class="xj">私は3時に医者の予約がある。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">suggestion</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">提案</div><div class="ex">Does anyone have a <b>suggestion</b> for the class party?</div><div class="xj">クラスのパーティーについて、だれか提案はありますか。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">plenty</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">たくさん；（plenty of ～）たくさんの～
