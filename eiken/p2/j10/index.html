. On the other hand, they are noisy.</div><div class="xj">都会は便利だ。一方で、うるさい。</div></button></li><li><button class="w" data-no="熟96"><div class="top"><span class="no">熟96</span><span class="en">in other words</span></div><div class="ja">言いかえると</div><div class="ex">He is my mother&#x27;s brother. In other words, he is my uncle.</div><div class="xj">彼は母の兄弟だ。言いかえると、私のおじだ。</div></button></li><li><button class="w" data-no="熟97"><div class="top"><span class="no">熟97</span><span class="en">as well as ～</span></div><div class="ja">～だけでなく、～と同様に</div><div class="ex">She speaks French as well as English.</div><div class="xj">彼女は英語だけでなくフランス語も話す。</div></button></li><li><button class="w" data-no="熟98"><div class="top"><span class="no">熟98</span><span class="en">rather than ～</span></div><div class="ja">～よりむしろ</div><div class="ex">Many people use e-mail rather than letters.</div><div class="xj">多くの人が手紙よりもEメールを使う。</div></button></li><li><button class="w" data-no="熟99"><div class="top"><span class="no">熟99</span><span class="en">in spite of ～</span></div><div class="ja">～にもかかわらず</div><div class="ex">They played soccer in spite of the rain.</div><div class="xj">雨にもかかわらず、彼らはサッカーをした。</div></button></li><li><button class="w" data-no="熟100"><div class="top"><span class="no">熟100</span><span class="en">in addition to ～</span></div><div class="ja">～に加えて</div><div class="ex">In addition to English, Ken studies Chinese.</div><div class="xj">英語に加えて、ケンは中国語も勉強している。</div></button></li><li><button class="w" data-no="会46"><div class="top"><span class="no">会46</span><span class="en">Do you have anything about ～?</span></div><div class="ja">～についての（本など）はありますか？</div><div class="ex">A: Welcome to the library.<br>B: Hi. Do you have anything about Japanese history?</div></button></li><li><button class="w" data-no="会47"><div class="top"><span class="no">会47</span><span class="en">Is there anywhere I can ～?</span></div><div class="ja">～できる場所はありますか？</div><div class="ex">A: Here is your room key.<br>B: Thank you. Is there anywhere I can buy snacks?</div></button></li><li><button class="w" data-no="会48"><div class="top"><span class="no">会48</span><span class="en">What do you mean?</span></div><div class="ja">どういう意味？</div><div class="ex">A: This homework is a piece of cake.<br>B: What do you mean?</div></button></li><li><button class="w" data-no="会49"><div class="top"><span class="no">会49</span><span class="en">Could you say that again?</span></div><div class="ja">もう一度言ってもらえますか？</div><div class="ex">A: The meeting room is on the fifth floor, next to the elevator.<br>B: Sorry, could you say that again?</div></button></li><li><button class="w" data-no="会50"><div class="top"><span class="no">会50</span><span class="en">How come?</span></div><div class="ja">どうして？</div><div class="ex">A: I don&#x27;t want to go to the party.<br>B: How come? It&#x27;ll be fun.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j09/">← 熟語 Set 9</a><a href="../j11/">熟語 Set 11 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟91": 5.15, "熟92": 20.43, "熟93": 35.31, "熟94": 49.13, "熟95": 63.96, "熟96": 79.43, "熟97": 94.72, "熟98": 109.93, "熟99": 123.51, "熟100": 137.33, "会46": 151.65, "会47": 171.49, "会48": 190.56, "会49": 205.77, "会50": 224.44}, "TE": {"熟91": 7.07, "熟92": 22.3, "熟93": 37.18, "熟94": 51.02, "熟95": 66.0, "熟96": 81.45, "熟97": 96.71, "熟98": 111.8, "熟99": 125.5, "熟100": 139.3, "会46": 153.86, "会47": 173.77, "会48": 192.44, "会49": 207.91, "会50": 226.31}, "Q": [["熟91", "as a result", "その結果"], ["熟92", "due to ～", "～が原因で、～のために"], ["熟93", "according to ～", "～によると"], ["熟94", "instead of ～", "～の代わりに、～しないで"], ["熟95", "on the other hand", "一方では"], ["熟96", "in other words", "言いかえると"], ["熟97", "as well as ～", "～だけでなく、～と同様に"], ["熟98", "rather than ～", "～よりむしろ"], ["熟99", "in spite of ～", "～にもかかわらず"], ["熟100", "in addition to ～", "～に加えて"], ["会46", "Do you have anything abo
