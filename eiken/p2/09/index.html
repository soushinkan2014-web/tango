</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第9回</h1><div class="sub">No.401〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">pour</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を注ぐ；（雨が）激しく降る</div><div class="ex">Mom <b>poured</b> hot tea into my cup.</div><div class="xj">母は私のカップに熱いお茶を注いだ。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">broadcast</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を放送する</div><div class="ex">The game will be <b>broadcast</b> live on TV tonight.</div><div class="xj">その試合は今夜、テレビで生放送される。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">extend</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を延長する；伸ばす</div><div class="ex">The library <b>extended</b> its opening hours.</div><div class="xj">図書館は開館時間を延長した。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">promote</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を促進する；～を昇進させる</div><div class="ex">The city made posters to <b>promote</b> recycling.</div><div class="xj">市はリサイクルを促進するためにポスターを作った。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">arrange</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を手配する；並べる</div><div class="ex">Dad <b>arranged</b> a taxi to the airport.</div><div class="xj">父は空港までのタクシーを手配した。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">breathe</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">呼吸する</div><div class="ex">It is hard to <b>breathe</b> at the top of high mountains.</div><div class="xj">高い山の頂上では呼吸するのが難しい。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">frighten</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をこわがらせる；おびえさせる</div><div class="ex">The loud thunder <b>frightened</b> the little dog.</div><div class="xj">大きな雷の音が子犬をこわがらせた。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">convince</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を納得させる；確信させる</div><div class="ex">Tom&#x27;s words finally <b>convinced</b> his mother.</div><div class="xj">トムの言葉が、ついに母親を納得させた。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">lower</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を下げる；低くする</div><div class="ex">The store <b>lowered</b> the price of the old computers.</div><div class="xj">その店は古いパソコンの値段を下げた。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">survive</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">生き残る；～を切り抜ける</div><div class="ex">Some plants can <b>survive</b> without much water.</div><div class="xj">水があまりなくても生き残ることができる植物もある。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">budget</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">予算</div><div class="ex">Our club has a small <b>budget</b> for the trip.</div><div class="xj">私たちの部の旅行の予算は少ない。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">honor</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">名誉；光栄</div><div class="ex">It is a great <b>honor</b> to speak at this event.</div><div class="xj">このイベントでスピーチできるのは大変な名誉です。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">signal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">信号；合図</div><div class="ex">The traffic <b>signal</b> turned green, so we crossed the street.</div><div class="xj">信号が青に変わったので、私たちは通りを渡った。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">term</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">用語；期間</div><div class="ex">Please look up this <b>term</b> in the dictionary.</div><div class="xj">この用語を辞書で調べてください。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">response</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">返答；反応</div><div class="ex">I sent an email, but got no <b>response</b>.</div><div class="xj">メールを送ったが、返答がなかった。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">participant</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">参加者</div><div class="ex">Each <b>participant</b> in the race got a T-shirt.</div><div class="xj">レースの参加者は全員、Tシャツをもらった。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">structure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">構造；建造物</div><div class="ex">The students studied the <b>structure</b> of the old bridge.</div><div class="xj">生徒たちは古い橋の構造を調べた。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">education</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">教育</div><div class="ex">Everyone should be able to get a good <b>education</b>.</div><div class="xj">だれもがよい教育を受けられるべきだ。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">policy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">方針；政策</div><div class="ex">Our school has a new <b>policy</b> on smartphones.</div><div class="xj">私たちの学校には、スマートフォンについての新しい方針がある。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">difficulty</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">困難；難しさ</div><div class="ex">We had many <b>difficulties</b> on our first camping trip.</div><div class="xj">初めてのキャンプ旅行では、多くの困難があった。</div></button></li><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">limit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">制限；限度</div><div class="ex">There is a time <b>limit</b> of 30 minutes for this test.</div><div class="xj">このテストには30分の時間制限がある。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">brain</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">脳；頭脳</div><div class="ex">Reading books is good exercise for your <b>brain</b>.</div><div class="xj">読書は脳のよい運動になる。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">muscle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">筋肉</div><div class="ex">Swimming is a good way to build <b>muscle</b>.</div><div class="xj">水泳は筋肉をつけるよい方法だ。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">chemistry</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">化学</div><div class="ex">Lisa likes <b>chemistry</b> the best of all her subjects.</div><div class="xj">リサは全教科の中で化学がいちばん好きだ。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">leftover</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（leftoversで）食べ残し；残り物</div><div class="ex">We ate the <b>leftovers</b> from last night&#x27;s dinner.</div><div class="xj">私たちは昨夜の夕食の残り物を食べた。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">goods</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">商品；品物</div><div class="ex">This market sells <b>goods</b> from all over the world.</div><div class="xj">この市場では世界中の商品を売っている。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">achievement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">業績；達成</div><div class="ex">The scientist is famous for her <b>achievements</b> in medicine.</div><div class="xj">その科学者は医学での業績で有名だ。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">convenience</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">便利さ；（convenience store）コンビニ</div><div class="ex">I like the <b>convenience</b> of living near the station.</div><div class="xj">駅の近くに住む便利さが気に入っている。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">resident</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">住民；居住者</div><div class="ex">The <b>residents</b> of this town cleaned the park.</div><div class="xj">この町の住民が公園を掃除した。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">continent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">大陸</div><div class="ex">Africa is a very large <b>continent</b>.</div><div class="xj">アフリカはとても大きな大陸だ。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">witness</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">目撃者</div><div class="ex">The police asked a <b>witness</b> about the accident.</div><div class="xj">警察は事故について目撃者に話を聞いた。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">survey</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（アンケート）調査</div><div class="ex">Our class did a <b>survey</b> about favorite foods.</div><div class="xj">私たちのクラスは、好きな食べ物についてアンケート調査をした。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">origin</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">起源；由来</div><div class="ex">Grandpa told us about the <b>origin</b> of the summer festival.</div><div class="xj">祖父が夏祭りの起源について話してくれた。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">requirement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">必要条件；要件</div><div class="ex">Good English is a <b>requirement</b> for this job.</div><div class="xj">英語が上手なことは、この仕事の必要条件だ。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">leisure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">余暇；レジャー</div><div class="ex">My father enjoys fishing in his <b>leisure</b> time.</div><div class="xj">父は余暇に釣りを楽しむ。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">miracle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">奇跡</div><div class="ex">It was a <b>miracle</b> that nobody was hurt.</div><div class="xj">だれもけがをしなかったのは奇跡だった。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">transportation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">交通機関；輸送</div><div class="ex">Many people in this city use public <b>transportation</b>.</div><div class="xj">この市では多くの人が公共交通機関を使う。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">feature</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">特徴；（目玉となる）呼び物</div><div class="ex">A big garden is the best <b>feature</b> of this house.</div><div class="xj">広い庭がこの家のいちばんの特徴だ。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">material</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">材料；素材</div><div class="ex">We bought <b>materials</b> for the art project.</div><div class="xj">私たちは美術の課題の材料を買った。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">solution</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">解決策</div><div class="ex">We need to find a <b>solution</b> to this problem.</div><div class="xj">私たちはこの問題の解決策を見つける必要がある。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">popularity</span><span class="
