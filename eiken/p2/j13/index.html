tains.</div><div class="xj">その町は山に囲まれている。</div></button></li><li><button class="w" data-no="熟126"><div class="top"><span class="no">熟126</span><span class="en">be against ～</span></div><div class="ja">～に反対している</div><div class="ex">My parents are against my plan.</div><div class="xj">両親は私の計画に反対している。</div></button></li><li><button class="w" data-no="熟127"><div class="top"><span class="no">熟127</span><span class="en">be familiar with ～</span></div><div class="ja">～をよく知っている</div><div class="ex">Are you familiar with this area?</div><div class="xj">このあたりにくわしいですか？</div></button></li><li><button class="w" data-no="熟128"><div class="top"><span class="no">熟128</span><span class="en">be satisfied with ～</span></div><div class="ja">～に満足している</div><div class="ex">I&#x27;m satisfied with my test score.</div><div class="xj">私はテストの点数に満足している。</div></button></li><li><button class="w" data-no="熟129"><div class="top"><span class="no">熟129</span><span class="en">be similar to ～</span></div><div class="ja">～に似ている</div><div class="ex">My bag is similar to yours.</div><div class="xj">私のかばんはあなたのに似ている。</div></button></li><li><button class="w" data-no="熟130"><div class="top"><span class="no">熟130</span><span class="en">be tired of ～</span></div><div class="ja">～にうんざりしている、～にあきている</div><div class="ex">I&#x27;m tired of eating the same food every day.</div><div class="xj">毎日同じ物を食べるのにうんざりしている。</div></button></li><li><button class="w" data-no="会61"><div class="top"><span class="no">会61</span><span class="en">I&#x27;m not feeling well.</span></div><div class="ja">体調がよくないんです。</div><div class="ex">A: You look tired, Ken.<br>B: I&#x27;m not feeling well. I think I have a cold.</div></button></li><li><button class="w" data-no="会62"><div class="top"><span class="no">会62</span><span class="en">What&#x27;s wrong?</span></div><div class="ja">どうしたの？</div><div class="ex">A: Ouch!<br>B: What&#x27;s wrong? Are you OK?</div></button></li><li><button class="w" data-no="会63"><div class="top"><span class="no">会63</span><span class="en">You look pale.</span></div><div class="ja">顔色が悪いよ。</div><div class="ex">A: I didn&#x27;t sleep well last night.<br>B: You look pale. You should go home early.</div></button></li><li><button class="w" data-no="会64"><div class="top"><span class="no">会64</span><span class="en">Get some rest.</span></div><div class="ja">少し休んでね。</div><div class="ex">A: I have a fever.<br>B: That&#x27;s too bad. Get some rest.</div></button></li><li><button class="w" data-no="会65"><div class="top"><span class="no">会65</span><span class="en">I hope you feel better soon.</span></div><div class="ja">早くよくなるといいね。</div><div class="ex">A: I can&#x27;t go to school today. I have a bad cold.<br>B: I hope you feel better soon.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j12/">← 熟語 Set 12</a><a href="../j14/">熟語 Set 14 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟121": 5.44, "熟122": 18.44, "熟123": 35.16, "熟124": 49.22, "熟125": 62.85, "熟126": 77.08, "熟127": 90.64, "熟128": 104.41, "熟129": 118.92, "熟130": 132.29, "会61": 148.41, "会62": 167.48, "会63": 183.36, "会64": 201.45, "会65": 218.32}, "TE": {"熟121": 7.38, "熟122": 20.89, "熟123": 37.52, "熟124": 51.17, "熟125": 65.01, "熟126": 79.0, "熟127": 92.8, "熟128": 106.69, "熟129": 120.94, "熟130": 134.35, "会61": 150.69, "会62": 169.36, "会63": 185.38, "会64": 203.47, "会65": 220.86}, "Q": [["熟121", "be short of ～", "～が不足している"], ["熟122", "be responsible for ～", "～に責任がある、～を担当している"], ["熟123", "be caught in a shower", "にわか雨にあう"], ["熟124", "be filled with ～", "～でいっぱいである"], ["熟125", "be surrounded by ～", "～に囲まれている"], ["熟126", "be against ～", "～に反対している"], ["熟127", "be familiar with ～", "～をよく知っている"], ["熟128", "be satisfied with ～", "～に満足している"], ["熟129", "be similar to ～", "～に似ている"], ["熟130", "be tired of ～", "～にうんざりしている、～にあきている"], ["会61", "I'm not feeling well.", "体調がよくないんです。"], ["会62", "What's wrong?",
