n class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">ease</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を和らげる；楽にする</div><div class="ex">This medicine will <b>ease</b> your headache.</div><div class="xj">この薬があなたの頭痛を和らげるだろう。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">consider</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～をよく考える；（consider A B）AをBとみなす</div><div class="ex">Emi is <b>considering</b> studying abroad next year.</div><div class="xj">エミは来年留学することをよく考えている。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">claim</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～だと主張する；（権利として）～を要求する</div><div class="ex">Tom <b>claims</b> that he saw a UFO.</div><div class="xj">トムはUFOを見たと主張している。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">reject</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を断る；拒否する</div><div class="ex">Emi <b>rejected</b> the job offer from the bank.</div><div class="xj">エミは銀行からの仕事の誘いを断った。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">freeze</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">凍る；～を凍らせる</div><div class="ex">The lake <b>froze</b> during the cold winter.</div><div class="xj">寒い冬の間に湖が凍った。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">media</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">メディア；マスコミ</div><div class="ex">The festival got a lot of attention from the <b>media</b>.</div><div class="xj">そのお祭りはメディアから大きな注目を集めた。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">progress</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">進歩；前進</div><div class="ex">Ken has made great <b>progress</b> in English.</div><div class="xj">ケンは英語で大きな進歩をとげた。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">gardening</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">園芸；庭いじり</div><div class="ex">My grandmother enjoys <b>gardening</b> on weekends.</div><div class="xj">祖母は週末に園芸を楽しんでいる。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">quality</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">質；品質</div><div class="ex">This shop sells clothes of high <b>quality</b>.</div><div class="xj">この店は質の高い服を売っている。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">joy</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">喜び</div><div class="ex">Lisa cried with <b>joy</b> when she won the prize.</div><div class="xj">リサは賞を取ったとき、喜びのあまり泣いた。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">metal</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">金属</div><div class="ex">This chair is made of <b>metal</b>.</div><div class="xj">このいすは金属でできている。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">harm</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">害；損害</div><div class="ex">Too much screen time can do <b>harm</b> to your eyes.</div><div class="xj">画面の見すぎは、目に害を与えることがある。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">task</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">仕事；課題</div><div class="ex">Cleaning the classroom is our daily <b>task</b>.</div><div class="xj">教室のそうじは私たちの毎日の仕事だ。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">gallery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">美術館；画廊</div><div class="ex">We saw many old paintings at the <b>gallery</b>.</div><div class="xj">私たちは美術館で多くの古い絵を見た。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">level</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">水準；レベル</div><div class="ex">The <b>level</b> of education in this country is high.</div><div class="xj">この国の教育の水準は高い。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">expert</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">専門家</div><div class="ex">My uncle is an <b>expert</b> on Japanese history.</div><div class="xj">おじは日本史の専門家だ。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">charge</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">料金；責任</div><div class="ex">There is no <b>charge</b> for children under six.</div><div class="xj">6歳未満の子どもは料金がかからない。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">custom</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">習慣；（customsで）税関</div><div class="ex">Taking off your shoes at home is a Japanese <b>custom</b>.</div><div class="xj">家でくつを脱ぐのは日本の習慣だ。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">theme</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">テーマ；主題</div>< >attractive</b> places for tourists.</div><div class="xj">その町には、観光客にとって魅力的な場所がたくさんある。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">valuable</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">貴重な；高価な</div><div class="ex">Thank you for giving me such <b>valuable</b> advice.</div><div class="xj">そんな貴重なアドバイスをくれてありがとう。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">major</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">主要な；大きいほうの</div><div class="ex">Tokyo is one of the <b>major</b> cities in the world.</div><div class="xj">東京は世界の主要な都市の1つだ。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">disappointed</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">がっかりした</div><div class="ex">Tom was <b>disappointed</b> with the result of the game.</div><div class="xj">トムは試合の結果にがっかりした。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">sudden</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">突然の</div><div class="ex">The <b>sudden</b> rain made everyone run inside.</div><div class="xj">突然の雨で、みんな中にかけ込んだ。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">familiar</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">よく知られた；（be familiar with ～）～をよく知っている</div><div class="ex">The park is a <b>familiar</b> place to everyone in town.</div><div class="xj">その公園は町のみんなによく知られた場所だ。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">blank</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">空白の；（頭が）真っ白な</div><div class="ex">Writ
