 class="xj">訪問者の数が増えている。</div></button></li><li><button class="w" data-no="熟106"><div class="top"><span class="no">熟106</span><span class="en">quite a few ～</span></div><div class="ja">かなり多くの～</div><div class="ex">Quite a few people came to the event.</div><div class="xj">かなり多くの人がそのイベントに来た。</div></button></li><li><button class="w" data-no="熟107"><div class="top"><span class="no">熟107</span><span class="en">hundreds of ～</span></div><div class="ja">何百もの～</div><div class="ex">Hundreds of birds were flying over the lake.</div><div class="xj">何百羽もの鳥が湖の上を飛んでいた。</div></button></li><li><button class="w" data-no="熟108"><div class="top"><span class="no">熟108</span><span class="en">all kinds of ～</span></div><div class="ja">あらゆる種類の～</div><div class="ex">You can see all kinds of animals at this zoo.</div><div class="xj">この動物園ではあらゆる種類の動物が見られる。</div></button></li><li><button class="w" data-no="熟109"><div class="top"><span class="no">熟109</span><span class="en">at least</span></div><div class="ja">少なくとも</div><div class="ex">I read at least one book a month.</div><div class="xj">私は少なくとも月に1冊は本を読む。</div></button></li><li><button class="w" data-no="熟110"><div class="top"><span class="no">熟110</span><span class="en">and so on</span></div><div class="ja">～など</div><div class="ex">We need pens, paper, glue, and so on.</div><div class="xj">ペン、紙、のりなどが必要だ。</div></button></li><li><button class="w" data-no="会51"><div class="top"><span class="no">会51</span><span class="en">That makes sense.</span></div><div class="ja">なるほど、納得だね。</div><div class="ex">A: I&#x27;m tired because I studied until midnight.<br>B: That makes sense.</div></button></li><li><button class="w" data-no="会52"><div class="top"><span class="no">会52</span><span class="en">Exactly.</span></div><div class="ja">その通り。</div><div class="ex">A: So we need to finish the poster by Friday?<br>B: Exactly.</div></button></li><li><button class="w" data-no="会53"><div class="top"><span class="no">会53</span><span class="en">I see what you mean.</span></div><div class="ja">言いたいことはわかるよ。</div><div class="ex">A: The test was hard because the questions were so long.<br>B: I see what you mean.</div></button></li><li><button class="w" data-no="会54"><div class="top"><span class="no">会54</span><span class="en">I bet ～.</span></div><div class="ja">きっと～だと思う。</div><div class="ex">A: Ken practiced the guitar every day for the show.<br>B: I bet he&#x27;ll play well.</div></button></li><li><button class="w" data-no="会55"><div class="top"><span class="no">会55</span><span class="en">Is that so?</span></div><div class="ja">そうなの？</div><div class="ex">A: This restaurant was on TV last week.<br>B: Is that so? I didn&#x27;t know that.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j10/">← 熟語 Set 10</a><a href="../j12/">熟語 Set 12 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟101": 5.51, "熟102": 18.92, "熟103": 33.15, "熟104": 47.21, "熟105": 61.89, "熟106": 74.85, "熟107": 88.24, "熟108": 101.98, "熟109": 116.6, "熟110": 129.17, "会51": 143.78, "会52": 161.12, "会53": 176.52, "会54": 194.11, "会55": 211.12}, "TE": {"熟101": 7.38, "熟102": 21.1, "熟103": 35.33, "熟104": 49.08, "熟105": 63.79, "熟106": 76.72, "熟107": 90.13, "熟108": 104.05, "熟109": 118.47, "熟110": 131.18, "会51": 145.92, "会52": 163.0, "会53": 178.73, "会54": 195.98, "会55": 212.99}, "Q": [["熟101", "plenty of ～", "たくさんの～"], ["熟102", "a variety of ～", "さまざまな～"], ["熟103", "a large amount of ～", "大量の～"], ["熟104", "a number of ～", "多くの～、いくつかの～"], ["熟105", "the number of ～", "～の数"], ["熟106", "quite a few ～", "かなり多くの～"], ["熟107", "hundreds of ～", "何百もの～"], ["熟108", "all kinds of ～", "あらゆる種類の～"], ["熟109", "at least", "少なくとも"], ["熟110", "and so on", "～など"], ["会51", "That makes sense.", "なるほど、納得だね。"], ["会52", "Exactly.", "その通り。"], ["会53", "I see what you mean.", "言いたいことはわかるよ。"], ["会54", "I bet ～.", "きっと～だと思う。"], ["会55", "Is that so?", "そうなの？"]], "K
