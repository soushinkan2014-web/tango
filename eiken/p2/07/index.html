題を忘れがちだ。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">expand</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を拡大する；広がる</div><div class="ex">The shop plans to <b>expand</b> its business next year.</div><div class="xj">その店は来年、事業を拡大する予定だ。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">divide</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を分ける</div><div class="ex">Mom <b>divided</b> the cake into eight pieces.</div><div class="xj">母はケーキを8つに分けた。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">reflect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を反射する；反映する</div><div class="ex">White clothes <b>reflect</b> the light from the sun.</div><div class="xj">白い服は太陽の光を反射する。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">argue</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">言い争う；～と主張する</div><div class="ex">My brother and I often <b>argue</b> about the TV.</div><div class="xj">兄と私は、よくテレビのことで言い争う。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">struggle</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">奮闘する；もがく</div><div class="ex">Tom <b>struggled</b> to finish his homework on time.</div><div class="xj">トムは宿題を時間内に終わらせようと奮闘した。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">stretch</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を伸ばす；ストレッチする</div><div class="ex"><b>Stretch</b> your arms and legs before running.</div><div class="xj">走る前に腕と脚を伸ばしなさい。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">mark</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に印をつける</div><div class="ex">Please <b>mark</b> the important words with a red pen.</div><div class="xj">大事な語に赤ペンで印をつけてください。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">participate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（participate in ～）～に参加する</div><div class="ex">Ken <b>participated</b> in the city marathon last year.</div><div class="xj">ケンは去年、市のマラソン大会に参加した。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">ignore</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を無視する</div><div class="ex">Tom <b>ignored</b> my advice and got lost.</div><div class="xj">トムは私の助言を無視して、道に迷った。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">recover</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">回復する；～を取り戻す</div><div class="ex">Lisa quickly <b>recovered</b> from her cold.</div><div class="xj">リサはかぜからすぐに回復した。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">embarrass</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～に恥ずかしい思いをさせる</div><div class="ex">Please don&#x27;t <b>embarrass</b> me in front of my friends.</div><div class="xj">友だちの前で私に恥ずかしい思いをさせないで。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">educate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を教育する</div><div class="ex">Parents should <b>educate</b> their children about money.</div><div class="xj">親は子どもにお金について教育するべきだ。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">represent</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を表す；代表する</div><div class="ex">The red circle on the flag <b>represents</b> the sun.</div><div class="xj">旗の赤い丸は太陽を表している。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">pressure</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">圧力；プレッシャー</div><div class="ex">Deep in the sea, the water <b>pressure</b> is very high.</div><div class="xj">海の深い所では、水の圧力がとても高い。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">method</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">方法</div><div class="ex">This is a new <b>method</b> for learning English words.</div><div class="xj">これは英単語を覚えるための新しい方法だ。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">purse</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">財布；ハンドバッグ</div><div class="ex">Mom took some coins out of her <b>purse</b>.</div><div class="xj">母は財布から小銭を取り出した。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">architect</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">建築家</div><div class="ex">A famous <b>architect</b> designed this beautiful library.</div><div class="xj">有名な建築家がこの美しい図書館を設計した。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">sense</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">感覚；意味</div><div class="ex">Ken has a good <b>sense</b> of direction, so he never gets lost.</div><div class="xj">ケンは方向感覚がよいので、決して道に迷わない。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">photograph</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">写真</div><div class="ex">This <b>photograph</b> was taken in Hokkaido.</div><div class="xj">この写真は北海道でとられた。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">attitude</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">態度；考え方</div><div class="ex">Lisa&#x27;s positive <b>attitude</b> makes everyone around her happy.</div><div class="xj">リサの前向きな態度は、周りのみんなを明るくする。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">kingdom</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">王国</div><div class="ex">Long ago, a kind king ruled this <b>kingdom</b>.</div><div class="xj">昔、やさしい王がこの王国を治めていた。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">improvement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">改善；向上</div><div class="ex">Our school lunch menu needs some <b>improvement</b>.</div><div class="xj">学校給食の献立には改善が必要だ。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">disease</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">病気</div><div class="ex">Heart <b>disease</b> is common among older people.</div><div class="xj">心臓の病気は高齢者に多い。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">period</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">期間；時代</div><div class="ex">You can borrow books for a <b>period</b> of two weeks.</div><div class="xj">本は2週間の期間借りることができる。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span cla
