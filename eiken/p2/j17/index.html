 a break for ten minutes.</div><div class="xj">10分休憩しよう。</div></button></li><li><button class="w" data-no="熟166"><div class="top"><span class="no">熟166</span><span class="en">work out</span></div><div class="ja">運動する、うまくいく</div><div class="ex">My father works out at the gym every morning.</div><div class="xj">父は毎朝ジムで運動している。</div></button></li><li><button class="w" data-no="熟167"><div class="top"><span class="no">熟167</span><span class="en">do well on ～</span></div><div class="ja">～でよい成績をとる、～がうまくいく</div><div class="ex">I hope you do well on the test.</div><div class="xj">テストがうまくいくといいね。</div></button></li><li><button class="w" data-no="熟168"><div class="top"><span class="no">熟168</span><span class="en">keep up with ～</span></div><div class="ja">～に遅れずについていく</div><div class="ex">It&#x27;s hard to keep up with the class.</div><div class="xj">授業についていくのは大変だ。</div></button></li><li><button class="w" data-no="熟169"><div class="top"><span class="no">熟169</span><span class="en">run out of ～</span></div><div class="ja">～を使い果たす、～を切らす</div><div class="ex">We&#x27;ve run out of milk.</div><div class="xj">牛乳を切らしてしまった。</div></button></li><li><button class="w" data-no="熟170"><div class="top"><span class="no">熟170</span><span class="en">deal with ～</span></div><div class="ja">～に対処する、～を扱う</div><div class="ex">How do you deal with stress?</div><div class="xj">ストレスにどう対処していますか？</div></button></li><li><button class="w" data-no="会81"><div class="top"><span class="no">会81</span><span class="en">Good for you!</span></div><div class="ja">よかったね！／えらいね！</div><div class="ex">A: I passed the Eiken test!<br>B: Good for you!</div></button></li><li><button class="w" data-no="会82"><div class="top"><span class="no">会82</span><span class="en">Well done.</span></div><div class="ja">よくやったね。</div><div class="ex">A: I finished the 10-kilometer race.<br>B: Well done! I&#x27;m proud of you.</div></button></li><li><button class="w" data-no="会83"><div class="top"><span class="no">会83</span><span class="en">I&#x27;m glad to hear that.</span></div><div class="ja">それを聞いてうれしいです。</div><div class="ex">A: My grandmother is out of the hospital now.<br>B: I&#x27;m glad to hear that.</div></button></li><li><button class="w" data-no="会84"><div class="top"><span class="no">会84</span><span class="en">That&#x27;s a relief.</span></div><div class="ja">ほっとしたよ。</div><div class="ex">A: Your lost wallet was found at the station.<br>B: That&#x27;s a relief!</div></button></li><li><button class="w" data-no="会85"><div class="top"><span class="no">会85</span><span class="en">Keep it up!</span></div><div class="ja">その調子でがんばって！</div><div class="ex">A: I got 90 points on the math test.<br>B: Great job! Keep it up!</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j16/">← 熟語 Set 16</a><a href="../j18/">熟語 Set 18 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟161": 5.44, "熟162": 19.81, "熟163": 33.1, "熟164": 47.98, "熟165": 62.16, "熟166": 74.92, "熟167": 89.05, "熟168": 104.36, "熟169": 118.16, "熟170": 132.5, "会81": 146.68, "会82": 163.02, "会83": 180.2, "会84": 197.54, "会85": 213.4}, "TE": {"熟161": 7.64, "熟162": 21.92, "熟163": 35.6, "熟164": 49.85, "熟165": 64.03, "熟166": 76.79, "熟167": 90.95, "熟168": 106.23, "熟169": 120.08, "熟170": 134.38, "会81": 148.56, "会82": 164.89, "会83": 182.48, "会84": 199.56, "会85": 215.27}, "Q": [["熟161", "keep in good shape", "体調をよく保つ"], ["熟162", "stay up late", "夜ふかしする"], ["熟163", "on one's way (to ～)", "途中で"], ["熟164", "check out ～", "～を見てみる、を借りる"], ["熟165", "take a break", "ひと休みする"], ["熟166", "work out", "運動する、うまくいく"], ["熟167", "do well on ～", "～でよい成績をとる、～がうまくいく"], ["熟168", "keep up with ～", "～に遅れずについていく"], ["熟169", "run out of ～", "～を使い果たす、～を切らす"], ["熟170", "deal with ～", "～に対処する、～を扱う"], ["会81", "Good for you!", "よかったね！／えらいね！"], ["会82", "Well done.", "よくやったね。"], ["会83", "I'm glad to hear that.", "それを聞いてうれしいです。"], ["会84", "That's a relief
