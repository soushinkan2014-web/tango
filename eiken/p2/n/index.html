<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>英検準2級 新しい意味｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　新しい意味</h1><div class="sub">新1〜新36</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../n.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="新1"><div class="top"><span class="no">新1</span><span class="en">subject</span><span class="ps">名</span></div><div class="xj">知っている意味：教科</div><div class="ja">（メールの）件名；話題</div><div class="ex">Lisa forgot to write a <b>subject</b> for her e-mail.</div><div class="xj">リサはメールに件名を書き忘れた。</div></button></li><li><button class="w" data-no="新2"><div class="top"><span class="no">新2</span><span class="en">free</span><span class="ps">形</span></div><div class="xj">知っている意味：ひまな</div><div class="ja">無料の</div><div class="ex">The new café gives a <b>free</b> cookie to every customer.</div><div class="xj">その新しいカフェは、お客さん全員に無料のクッキーを配っている。</div></button></li><li><button class="w" data-no="新3"><div class="top"><span class="no">新3</span><span class="en">miss</span><span class="ps">動</span></div><div class="xj">知っている意味：～に乗り遅れる；～がいなくてさびしく思う</div><div class="ja">～を見逃す；（機会など）を逃す</div><div class="ex">I <b>missed</b> the beautiful sunset because I was asleep.</div><div class="xj">寝ていたので、きれいな夕日を見逃した。</div></button></li><li><button class="w" data-no="新4"><div class="top"><span class="no">新4</span><span class="en">work</span><span class="ps">動</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">（機械などが）動く；うまくいく</div><div class="ex">My grandfather&#x27;s old radio still <b>works</b> very well.</div><div class="xj">祖父の古いラジオは今でもとてもよく動く。</div></button></li><li><button class="w" data-no="新5"><div class="top"><span class="no">新5</span><span class="en">close</span><span class="ps">形</span></div><div class="xj">知っている意味：～を閉める</div><div class="ja">近い；接近した</div><div class="ex">Our school is very <b>close</b> to the station.</div><div class="xj">私たちの学校は駅にとても近い。</div></button></li><li><button class="w" data-no="新6"><div class="top"><span class="no">新6</span><span class="en">leave</span><span class="ps">動</span></div><div class="xj">知っている意味：出発する；置いてくる</div><div class="ja">～を残す；（be leftで）残っている</div><div class="ex">There are only two cakes <b>left</b> in the box.</div><div class="xj">箱にはケーキが2個しか残っていない。</div></button></li><li><button class="w" data-no="新7"><div class="top"><span class="no">新7</span><span class="en">train</span><span class="ps">動</span></div><div class="xj">知っている意味：電車</div><div class="ja">～を訓練する；トレーニングする</div><div class="ex">Emi <b>trains</b> at the pool every morning before school.</div><div class="xj">エミは毎朝登校前に、プールでトレーニングしている。</div></button></li><li><button class="w" data-no="新8"><div class="top"><span class="no">新8</span><span class="en">right</span><span class="ps">副</span></div><div class="xj">知っている意味：右；正しい</div><div class="ja">ちょうど；すぐ</div><div class="ex">My house is <b>right</b> behind the big supermarket.</div><div class="xj">私の家は大きなスーパーのすぐ裏にある。</div></button></li><li><button class="w" data-no="新9"><div class="top"><span class="no">新9</span><span class="en">early</span><span class="ps">形</span></div><div class="xj">知っている意味：早く</div><div class="ja">初めの；初期の</div><div class="ex">We have a school trip in <b>early</b> June.</div><div class="xj">6月の初めに修学旅行がある。</div></button></li><li><button class="w" data-no="新10"><div class="top"><span class="no">新10</span><span class="en">show</span><span class="ps">名</span></div><div class="xj">知っている意味：～を見せる</div><div class="ja">（テレビの）番組；ショー</div><div class="ex">There is a new cooking <b>show</b> on TV tonight.</div><div class="xj">今夜、テレビで新しい料理番組がある。</div></button></li><li><button class="w" data-no="新11"><div class="top"><span class="no">新11</span><span class="en">land</span><span class="ps">動</span></div><div class="xj">知っている意味：陸地；土地</div><div class="ja">着陸する；（陸に）着く</div><div class="ex">Our plane will <b>land</b> at the airport in thirty minutes.</div><div class="xj">私たちの飛行機はあと30分で空港に着陸する。</div></button></li><li><button class="w" data-no="新12"><div class="top"><span class="no">新12</span><span class="en">run</span><span class="ps">動</span></div><div class="xj">知っている意味：走る</div><div class="ja">（機械などが）動く；作動する</div><div class="ex">Our washing machine is <b>running</b>, so please wait a little.</div><div class="xj">洗濯機が動いているので、少し待ってね。</div></button></li><li><button class="w" data-no="新13"><div class="top"><span class="no">新13</span><span class="en">matter</span><span class="ps">動</span></div><div class="xj">知っている意味：問題；困ったこと</div><div class="ja">重要である</div><div class="ex">What you wear does not <b>matter</b> at this party.</div><div class="xj">このパーティーでは、何を着るかは重要ではない。</div></button></li><li><button class="w" data-no="新14"><div class="top"><span class="no">新14</span><span class="en">note</span><span class="ps">動</span></div><div class="xj">知っている意味：メモ；短い手紙</div><div class="ja">～に注意する；～を心に留める</div><div class="ex">Please <b>note</b> the change in the bus schedule.</div><div class="xj">バスの時刻表の変更にご注意ください。</div></button></li><li><button class="w" data-no="新15"><div class="top"><span class="no">新15</span><span class="en">book</span><span class="ps">動</span></div><div class="xj">知っている意味：本</div><div class="ja">～を予約する</div><div class="ex">I <b>booked</b> a table at the restaurant for Friday.</div><div class="xj">金曜日のそのレストランの席を予約した。</div></button></li><li><button class="w" data-no="新16"><div class="top"><span class="no">新16</span><span class="en">face</span><span class="ps">動</span></div><div class="xj">知っている意味：顔</div><div class="ja">～に直面する</div><div class="ex">The town <b>faces</b> a big problem with too much trash.</div><div class="xj">その町はごみが多すぎるという大きな問題に直面している。</div></button></li><li><button class="w" data-no="新17"><div class="top"><span class="no">新17</span><span class="en">last</span><span class="ps">動</span></div><div class="xj">知っている意味：最後の；この前の</div><div class="ja">続く；長持ちする</div><div class="ex">The heavy rain <b>lasted</b> for three days.</div><div class="xj">大雨は3日間続いた。</div></button></li><li><button class="w" data-no="新18"><div class="top"><span class="no">新18</span><span class="en">own</span><span class="ps">動</span></div><div class="xj">知っている意味：自分自身の</div><div class="ja">～を所有する</div><div class="ex">Ken&#x27;s family <b>owns</b> three horses and a large farm.</div><div class="xj">ケンの家族は馬3頭と大きな農場を所有している。</div></button></li><li><button class="w" data-no="新19"><div class="top"><span class="no">新19</span><span class="en">light</span><span class="ps">名</span></div><div class="xj">知っている意味：光；明かり</div><div class="ja">信号（機）</div><div class="ex">Please stop your bike when the <b>light</b> is red.</div><div class="xj">信号が赤のときは自転車を止めてください。</div></button></li><li><button class="w" data-no="新20"><div class="top"><span class="no">新20</span><span class="en">light</span><span class="ps">形</span></div><div class="xj">知っている意味：光；明かり</div><div class="ja">軽い；（色が）うすい</div><div class="ex">This bag is very <b>light</b>, so it is easy to carry.</div><div class="xj">このバッグはとても軽いので、運びやすい。</div></button></li><li><button class="w" data-no="新21"><div class="top"><span class="no">新21</span><span class="en">story</span><span class="ps">名</span></div><div class="xj">知っている意味：物語；話</div><div class="ja">（新聞などの）記事</div><div class="ex">There was a <b>story</b> about our school in the newspaper.</div><div class="xj">新聞に私たちの学校についての記事がのっていた。</div></button></li><li><button class="w" data-no="新22"><div class="top"><span class="no">新22</span><span class="en">model</span><span class="ps">名</span></div><div class="xj">知っている意味：模型；モデル</div><div class="ja">（製品の）型；機種</div><div class="ex">This smartphone is the newest <b>model</b> in the shop.</div><div class="xj">このスマートフォンは店でいちばん新しい機種だ。</div></button></li><li><button class="w" data-no="新23"><div class="top"><span class="no">新23</span><span class="en">work</span><span class="ps">名</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">作品</div><div class="ex">The art teacher showed us some <b>works</b> by her students.</div><div class="xj">美術の先生が生徒たちの作品をいくつか見せてくれた。</div></button></li><li><button class="w" data-no="新24"><div class="top"><span class="no">新24</span><span class="en">play</span><span class="ps">名</span></div><div class="xj">知っている意味：（スポーツを）する；（楽器を）ひく</div><div class="ja">劇；芝居</div><div class="ex">We watched a funny <b>play</b> at the theater last night.</div><div class="xj">昨夜、劇場でおもしろい劇を見た。</div></button></li><li><button class="w" data-no="新25"><div class="top"><span class="no">新25</span><span class="en">course</span><span class="ps">名</span></div><div class="xj">知っている意味：（of courseで）もちろん</div><div class="ja">講座；課程</div><div class="ex">My mother is taking a cooking <b>course</b> at the community center.</div><div class="xj">母は公民館で料理の講座を受けている。</div></button></li><li><button class="w" data-no="新26"><div class="top"><span class="no">新26</span><span class="en">break</span><span class="ps">名</span></div><div class="xj">知っている意味：～をこわす</div><div class="ja">休憩；（学校の）休み</div><div class="ex">We have a ten-minute <b>break</b> between classes.</div><div class="xj">授業と授業の間に10分の休憩がある。</div></button></li><li><button class="w" data-no="新27"><div class="top"><span class="no">新27</span><span class="en">park</span><span class="ps">動</span></div><div class="xj">知っている意味：公園</div><div class="ja">（車）を駐車する</div><div class="ex">My father <b>parked</b> the car near the stadium.</div><div class="xj">父はスタジアムの近くに車を駐車した。</div></button></li><li><button class="w" data-no="新28"><div class="top"><span class="no">新28</span><span class="en">save</span><span class="ps">動</span></div><div class="xj">知っている意味：～を救う；（お金）をためる</div><div class="ja">～を取っておく</div><div class="ex">Let&#x27;s <b>save</b> the rest of the pizza for tomorrow.</div><div class="xj">残りのピザは明日のために取っておこう。</div></button></li><li><button class="w" data-no="新29"><div class="top"><span class="no">新29</span><span class="en">turn</span><span class="ps">名</span></div><div class="xj">知っている意味：曲がる；～を回す</div><div class="ja">順番</div><div class="ex">Please wait here until it is your <b>turn</b>.</div><div class="xj">自分の順番になるまでここで待っていてください。</div></button></li><li><button class="w" data-no="新30"><div class="top"><span class="no">新30</span><span class="en">run</span><span class="ps">動</span></div><div class="xj">知っている意味：走る</div><div class="ja">～を経営する</div><div class="ex">Lisa&#x27;s aunt <b>runs</b> a flower shop in our town.</div><div class="xj">リサのおばは町で花屋を経営している。</div></button></li><li><button class="w" data-no="新31"><div class="top"><span class="no">新31</span><span class="en">key</span><span class="ps">名</span></div><div class="xj">知っている意味：かぎ</div><div class="ja">（成功などの）秘けつ；重要な点</div><div class="ex">Sleeping well is the <b>key</b> to good health.</div><div class="xj">よく眠ることが健康の秘けつだ。</div></button></li><li><button class="w" data-no="新32"><div class="top"><span class="no">新32</span><span class="en">mind</span><span class="ps">名</span></div><div class="xj">知っている意味：～を気にする；～をいやがる</div><div class="ja">心；考え</div><div class="ex">Reading books is good for your <b>mind</b>.</div><div class="xj">本を読むことは心によい。</div></button></li><li><button class="w" data-no="新33"><div class="top"><span class="no">新33</span><span class="en">match</span><span class="ps">動</span></div><div class="xj">知っている意味：試合</div><div class="ja">～に合う；～と調和する</div><div class="ex">This blue bag <b>matches</b> your new shoes very well.</div><div class="xj">この青いバッグはあなたの新しいくつにとてもよく合う。</div></button></li><li><button class="w" data-no="新34"><div class="top"><span class="no">新34</span><span class="en">stand</span><span class="ps">動</span></div><div class="xj">知っている意味：立
