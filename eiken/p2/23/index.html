</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級　第23回</h1><div class="sub">No.1101〜1150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1101"><div class="top"><span class="no">1101</span><span class="en">fade</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（色・音などが）薄れる；消えていく</div><div class="ex">The sound of the train slowly <b>faded</b>.</div><div class="xj">電車の音が、だんだん消えていった。</div></button></li><li><button class="w" data-no="1102"><div class="top"><span class="no">1102</span><span class="en">investigate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を調査する</div><div class="ex">Scientists are <b>investigating</b> why the fish are disappearing.</div><div class="xj">科学者たちは、なぜ魚が減っているのかを調査している。</div></button></li><li><button class="w" data-no="1103"><div class="top"><span class="no">1103</span><span class="en">overhear</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をふと耳にする</div><div class="ex">I <b>overheard</b> my parents talking about a family trip.</div><div class="xj">両親が家族旅行について話しているのをふと耳にした。</div></button></li><li><button class="w" data-no="1104"><div class="top"><span class="no">1104</span><span class="en">explode</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">爆発する</div><div class="ex">The volcano <b>exploded</b> many years ago.</div><div class="xj">その火山は何年も前に爆発した。</div></button></li><li><button class="w" data-no="1105"><div class="top"><span class="no">1105</span><span class="en">starve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">飢える；餓死する</div><div class="ex">Without food, the animals would <b>starve</b> in winter.</div><div class="xj">食べ物がなければ、動物たちは冬に飢えてしまうだろう。</div></button></li><li><button class="w" data-no="1106"><div class="top"><span class="no">1106</span><span class="en">reuse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を再利用する</div><div class="ex">We <b>reuse</b> old bottles as flower vases.</div><div class="xj">私たちは古いびんを花びんとして再利用している。</div></button></li><li><button class="w" data-no="1107"><div class="top"><span class="no">1107</span><span class="en">renovate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を改装する；修復する</div><div class="ex">The city is <b>renovating</b> the old station building.</div><div class="xj">市は古い駅の建物を改装している。</div></button></li><li><button class="w" data-no="1108"><div class="top"><span class="no">1108</span><span class="en">renew</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を更新する</div><div class="ex">I need to <b>renew</b> my library card this week.</div><div class="xj">今週、図書館のカードを更新する必要がある。</div></button></li><li><button class="w" data-no="1109"><div class="top"><span class="no">1109</span><span class="en">fasten</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を締める；固定する</div><div class="ex">Please <b>fasten</b> your seat belt before we start.</div><div class="xj">出発する前に、シートベルトを締めてください。</div></button></li><li><button class="w" data-no="1110"><div class="top"><span class="no">1110</span><span class="en">strengthen</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を強くする</div><div class="ex">Ken runs every day to <b>strengthen</b> his legs.</div><div class="xj">ケンは足を強くするために毎日走っている。</div></button></li><li><button class="w" data-no="1111"><div class="top"><span class="no">1111</span><span class="en">cancer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">がん</div><div class="ex">Eating vegetables may lower the risk of <b>cancer</b>.</div><div class="xj">野菜を食べると、がんになる危険性が下がるかもしれない。</div></button></li><li><button class="w" data-no="1112"><div class="top"><span class="no">1112</span><span class="en">nightmare</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">悪夢</div><div class="ex">Last night Tom had a <b>nightmare</b> about being late for the test.</div><div class="xj">昨夜トムは、テストに遅刻する悪夢を見た。</div></button></li><li><button class="w" data-no="1113"><div class="top"><span class="no">1113</span><span class="en">association</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">協会；団体</div><div class="ex">My father is a member of the tennis <b>association</b>.</div><div class="xj">父はテニス協会の会員だ。</div></button></li><li><button class="w" data-no="1114"><div class="top"><span class="no">1114</span><span class="en">regulation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">規則；規制</div><div class="ex">Our school has strict <b>regulations</b> about phones.</div><div class="xj">私たちの学校には、携帯電話についての厳しい規則がある。</div></button></li><li><button class="w" data-no="1115"><div class="top"><span class="no">1115</span><span class="en">era</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">時代</div><div class="ex">This castle was built in the Edo <b>era</b>.</div><div class="xj">この城は江戸時代に建てられた。</div></button></li><li><button class="w" data-no="1116"><div class="top"><span class="no">1116</span><span class="en">percentage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">割合；パーセンテージ</div><div class="ex">What <b>percentage</b> of the students walk to school?</div><div class="xj">歩いて登校する生徒の割合はどのくらいですか。</div></button></li><li><button class="w" data-no="1117"><div class="top"><span class="no">1117</span><span class="en">aspect</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">側面；面</div><div class="ex">We talked about every <b>aspect</b> of the plan.</div><div class="xj">私たちは計画のあらゆる側面について話し合った。</div></button></li><li><button class="w" data-no="1118"><div class="top"><span class="no">1118</span><span class="en">employer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">雇い主</div><div class="ex">My sister&#x27;s <b>employer</b> is very kind to her.</div><div class="xj">姉の雇い主は、姉にとても親切だ。</div></button></li><li><button class="w" data-no="1119"><div class="top"><span class="no">1119</span><span class="en">portion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部分；（食べ物の）1人前</div><div class="ex">A large <b>portion</b> of the money was used for books.</div><div class="xj">そのお金の大きな部分は、本に使われた。</div></button></li><li><button class="w" data-no="1120"><div class="top"><span class="no">1120</span><span class="en">approval</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">承認；賛成</div><div class="ex">You need the teacher&#x27;s <b>approval</b> to use this room.</div><div class="xj">この部屋を使うには、先生の承認が必要だ。</div></button></li><li><button class="w" data-no="1121"><div class="top"><span class="no">1121</span><span class="en">tutor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">家庭教師；個別指導の先生</div><div class="ex">Emi&#x27;s <b>tutor</b> comes to her house every Tuesday.</div><div class="xj">エミの家庭教師は毎週火曜日に家に来る。</div></button></li><li><button class="w" data-no="1122"><div class="top"><span class="no">1122</span><span class="en">applicant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">応募者；志願者</div><div class="ex">There were fifty <b>applicants</b> for the job.</div><div class="xj">その仕事には50人の応募者がいた。</div></button></li><li><button class="w" data-no="1123"><div class="top"><span class="no">1123</span><span class="en">appliance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（家庭用の）電気器具</div><div class="ex">This shop sells <b>appliances</b> like rice cookers and fridges.</div><div class="xj">この店は炊飯器や冷蔵庫のような電気器具を売っている。</div></button></li><li><button class="w" data-no="1124"><div class="top"><span class="no">1124</span><span class="en">sample</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見本；サンプル</div><div class="ex">The shop gave us a free <b>sample</b> of cheese.</div><div class="xj">その店はチーズの無料の見本をくれた。</div></button></li><li><button class="w" data-no="1125"><div class="top"><span class="no">1125</span><span class="en">attendance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出席</div><div class="ex">Our teacher checks <b>attendance</b> every morning.</div><div class="xj">先生は毎朝出席をとる。</div></button></li><li><button class="w" data-no="1126"><div class="top"><span class="no">1126</span><span class="en">supporter</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">支持者；サポーター</div><div class="ex">Many <b>supporters</b> came to cheer for our team.</div><div class="xj">多くのサポーターが、私たちのチームを応援しに来た。</div></button></li><li><button class="w" data-no="1127"><div class="top"><span class="no">1127</span><span class="en">labor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">労働；労働力</div><div class="ex">Building the castle took a lot of <b>labor</b>.</div><div class="xj">城を建てるには、多くの労働が必要だった。</div></button></li><li><button class="w" data-no="1128"><div class="top"><span class="no">1128</span><span class="en">journal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">日誌；（専門の）雑誌</div><div class="ex">Emi writes in her <b>journal</b> every night.</div><div class="xj">エミは毎晩日誌をつけている。</div></button></li><li><button class="w" data-no="1129"><div class="top"><span class="no">1129</span><span class="en">proof</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">証拠</div><div class="ex">This photo is <b>proof</b> that we saw the rare bird.</div><div class="xj">この写真は、私たちがその珍しい鳥を見た証拠だ。</div></button></li><li><button class="w" data-no="1130"><div class="top"><span class="no">1130</span><span class="en">awkward</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ぎこちない；気まずい</div><div class="ex">Ken gave an <b>awkward</b> smile when he met the new teacher.</div><div class="xj">新しい先生に会ったとき、ケンはぎこちない笑顔を見せた。</div></button></li><li><button class="w" data-no="1131"><div class="top"><span class="no">1131</span><span class="en">thrilled</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">わくわくした；大喜びの</div><div class="ex">The children were <b>thrilled</b> about the trip to the zoo.</div><div class="xj">子どもたちは、動物園への遠足にわくわくしていた。</div></button></li><li><button class="w" data-no="1132"><div class="top"><span class="no">1132</span><span class="en">lively</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">元気な；活気のある</div><div class="ex">My grandmother is still <b>lively</b> at the age of eighty.</div><div class="xj">祖母は80歳になっても元気だ。</div></button></li><li><button class="w" data-no="1133"><div class="top"><span class="no">1133</span><span class="en">punctual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">時間に正確な</div><div class="ex">Japanese trains are famous for being <b>punctual</b>.</div><div class="xj">日本の電車は時間に正確なことで有名だ。</div></button></li><li><button class="w" data-no="1134"><div class="top"><span class="no">1134</span><span class="en">enthusiastic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">熱心な；熱狂的な</div><div class="ex">Ken is an <b>enthusiastic</b> member of the science club.</div><div class="xj">ケンは科学部の熱心な部員だ。</div></button></li><li><button class="w" data-no="1135"><div class="top"><span class="no">1135</span><span class="en">innocent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">無罪の；無邪気な</div><div class="ex">In the drama, the lawyer proved that the man was <b>innocent</b>.</div><div class="xj">そのドラマで、弁護士は男性が無罪であることを証明した。</div></button></li><li><button class="w" data-no="1136"><div class="top"><span class="no">1136</span><span class="en">ambitious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">野心的な；大望を抱いた</div><div class="ex">Ken is <b>ambitious</b> and wants to start his own company.</div><div class="xj">ケンは野心的で、自分の会社を始めたいと思っている。</div></button></li><li><button class="w" data-no="1137"><div class="top"><span class="no">1137</span><span class="en">unfair</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不公平な</div><div class="ex">It&#x27;s <b>unfair</b> that only Tom got a prize.</div><div class="xj">トムだけが賞をもらうのは不公平だ。</div></button></li><li><button class="w" data-no="1138"><div class="top"><span class="no">1138</span><span class="en">brilliant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">すばらしい；光り輝く</div><div class="ex">Lisa had a <b>brilliant</b> idea for the school festival.</div><div class="xj">リサは文化祭のためのすばらしいアイデアを思いついた。</div></button></li><li><button class="w" data-no="1139"><div class="top"><span class="no">1139</span><span class="en">fake</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">にせの</div><div class="ex">Don&#x27;t believe <b>fake</b> news on the Internet.</div><div class="xj">インターネット上のにせのニュースを信じてはいけない。</div></button></li><li><button class="w" data-no="1140"><div class="top"><span class="no">1140</span><span class="en">automatic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">自動の</div><div class="ex">This store has an <b>automatic</b> door at the entrance.</div><div class="xj">この店の入
