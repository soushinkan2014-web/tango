 if it rains.</div><div class="xj">たとえ雨が降っても行くよ。</div></button></li><li><button class="w" data-no="熟136"><div class="top"><span class="no">熟136</span><span class="en">in case ～</span></div><div class="ja">～の場合に備えて</div><div class="ex">Take an umbrella in case it rains.</div><div class="xj">雨が降るといけないから、かさを持って行きなさい。</div></button></li><li><button class="w" data-no="熟137"><div class="top"><span class="no">熟137</span><span class="en">neither A nor B</span></div><div class="ja">AもBも～ない</div><div class="ex">Neither Ken nor Mike was at home.</div><div class="xj">ケンもマイクも家にいなかった。</div></button></li><li><button class="w" data-no="熟138"><div class="top"><span class="no">熟138</span><span class="en">used to ～</span></div><div class="ja">以前は～したものだ、以前は～だった</div><div class="ex">I used to live in Kobe.</div><div class="xj">私は以前、神戸に住んでいた。</div></button></li><li><button class="w" data-no="熟139"><div class="top"><span class="no">熟139</span><span class="en">not ～ until …</span></div><div class="ja">…まで～しない、…になって初めて～する</div><div class="ex">The store doesn&#x27;t open until ten.</div><div class="xj">その店は10時まで開かない。</div></button></li><li><button class="w" data-no="熟140"><div class="top"><span class="no">熟140</span><span class="en">no longer ～</span></div><div class="ja">もはや～ない</div><div class="ex">This shop is no longer open.</div><div class="xj">この店はもう営業していない。</div></button></li><li><button class="w" data-no="会66"><div class="top"><span class="no">会66</span><span class="en">This is ～ speaking.</span></div><div class="ja">（電話で）こちらは～です。</div><div class="ex">A: Can you answer the phone?<br>B: Sure. Hello, Sakura Restaurant. This is Kumi speaking.</div></button></li><li><button class="w" data-no="会67"><div class="top"><span class="no">会67</span><span class="en">Who&#x27;s calling, please?</span></div><div class="ja">（電話で）どちら様ですか？</div><div class="ex">A: Hello. May I speak to Mr. Brown?<br>B: Who&#x27;s calling, please?</div></button></li><li><button class="w" data-no="会68"><div class="top"><span class="no">会68</span><span class="en">Can I take a message?</span></div><div class="ja">（電話で）伝言をうかがいましょうか？</div><div class="ex">A: Hi. Is Tom there?<br>B: Sorry, he&#x27;s out now. Can I take a message?</div></button></li><li><button class="w" data-no="会69"><div class="top"><span class="no">会69</span><span class="en">You have the wrong number.</span></div><div class="ja">番号をおまちがえですよ。</div><div class="ex">A: Hello. Is this Pizza King?<br>B: No. I think you have the wrong number.</div></button></li><li><button class="w" data-no="会70"><div class="top"><span class="no">会70</span><span class="en">Could you ask him to call me back?</span></div><div class="ja">彼に折り返し電話するよう伝えてもらえますか？</div><div class="ex">A: I&#x27;m sorry, Ken is out right now.<br>B: OK. Could you ask him to call me back?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j13/">← 熟語 Set 13</a><a href="../j15/">熟語 Set 15 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟131": 5.44, "熟132": 19.18, "熟133": 34.83, "熟134": 47.9, "熟135": 62.16, "熟136": 74.85, "熟137": 88.62, "熟138": 102.92, "熟139": 117.72, "熟140": 132.86, "会66": 145.92, "会67": 166.45, "会68": 185.26, "会69": 205.29, "会70": 225.11}, "TE": {"熟131": 7.31, "熟132": 21.27, "熟133": 36.77, "熟134": 49.99, "熟135": 64.03, "熟136": 76.74, "熟137": 90.9, "熟138": 104.79, "熟139": 119.62, "熟140": 134.76, "会66": 147.93, "会67": 168.97, "会68": 187.42, "会69": 207.55, "会70": 227.7}, "Q": [["熟131", "in order to ～", "～するために"], ["熟132", "as long as ～", "～しさえすれば、～する限り"], ["熟133", "except for ～", "～を除いて"], ["熟134", "so that ～ can …", "～が…できるように"], ["熟135", "even if ～", "たとえ～でも"], ["熟136", "in case ～", "～の場合に備えて"], ["熟137", "neither A nor B", "AもBも～ない"], ["熟138", "used to ～", "以前は～したものだ、以前は～だった"], ["熟139", "not ～ until …", "…まで～しない、…になって初めて～する"], ["熟140", "no longer ～", "もはや～ない"], ["会66", "This is ～ speaking.", "こちらは～です。"], ["会67", "W
