div><div class="ex">Emi plays the <b>piano</b> well.</div><div class="xj">エミはピアノを上手にひきます。</div></button></li><li><button class="w" data-no="復126"><div class="top"><span class="no">復126</span><span class="en">grandma</span><span class="star">★★★</span></div><div class="ja">おばあちゃん</div><div class="ex">My <b>grandma</b> makes good cookies.</div><div class="xj">私のおばあちゃんはおいしいクッキーを作ります。</div></button></li><li><button class="w" data-no="復127"><div class="top"><span class="no">復127</span><span class="en">close</span><span class="star">★★★</span></div><div class="ja">閉める</div><div class="ex">Please <b>close</b> the door.</div><div class="xj">ドアを閉めてください。</div></button></li><li><button class="w" data-no="復128"><div class="top"><span class="no">復128</span><span class="en">listen</span><span class="star">★★★</span></div><div class="ja">聞く</div><div class="ex">I <b>listen</b> to the radio every night.</div><div class="xj">私は毎晩ラジオを聞きます。</div></button></li><li><button class="w" data-no="復129"><div class="top"><span class="no">復129</span><span class="en">kitchen</span><span class="star">★★★</span></div><div class="ja">台所</div><div class="ex">Mom is cooking in the <b>kitchen</b>.</div><div class="xj">お母さんは台所で料理をしています。</div></button></li><li><button class="w" data-no="復130"><div class="top"><span class="no">復130</span><span class="en">bed</span><span class="star">★★★</span></div><div class="ja">ベッド</div><div class="ex">My <b>bed</b> is new.</div><div class="xj">私のベッドは新しいです。</div></button></li><li><button class="w" data-no="復131"><div class="top"><span class="no">復131</span><span class="en">wash</span><span class="star">★★★</span></div><div class="ja">洗う</div><div class="ex">I <b>wash</b> the dishes with my mother.</div><div class="xj">私は母といっしょにお皿を洗います。</div></button></li><li><button class="w" data-no="復132"><div class="top"><span class="no">復132</span><span class="en">pizza</span><span class="star">★★★</span></div><div class="ja">ピザ</div><div class="ex">Tom likes <b>pizza</b> very much.</div><div class="xj">トムはピザが大好きです。</div></button></li><li><button class="w" data-no="復133"><div class="top"><span class="no">復133</span><span class="en">breakfast</span><span class="star">★★★</span></div><div class="ja">朝ごはん</div><div class="ex">I eat <b>breakfast</b> at seven.</div><div class="xj">私は7時に朝ごはんを食べます。</div></button></li><li><button class="w" data-no="復134"><div class="top"><span class="no">復134</span><span class="en">green</span><span class="star">★★★</span></div><div class="ja">緑</div><div class="ex">My favorite color is <b>green</b>.</div><div class="xj">私の好きな色は緑です。</div></button></li><li><button class="w" data-no="復135"><div class="top"><span class="no">復135</span><span class="en">Thursday</span><span class="star">★★★</span></div><div class="ja">木曜日</div><div class="ex">A: What day is it today?<br>B: It&#x27;s <b>Thursday</b>.</div><div class="xj">A：今日は何曜日ですか。 B：木曜日です。</div></button></li><li><button class="w" data-no="復136"><div class="top"><span class="no">復136</span><span class="en">station</span><span class="star">★★★</span></div><div class="ja">駅</div><div class="ex">Where is the <b>station</b>?</div><div class="xj">駅はどこですか。</div></button></li><li><button class="w" data-no="復137"><div class="top"><span class="no">復137</span><span class="en">city</span><span class="star">★★★</span></div><div class="ja">市・都市</div><div class="ex">Our <b>city</b> has a big zoo.</div><div class="xj">私たちの市には大きな動物園があります。</div></button></li><li><button class="w" data-no="復138"><div class="top"><span class="no">復138</span><span class="en">sunny</span><span class="star">★★★</span></div><div class="ja">晴れた</div><div class="ex">It is <b>sunny</b> today.</div><div class="xj">今日は晴れです。</div></button></li><li><button class="w" data-no="復139"><div class="top"><span class="no">復139</span><span class="en">math</span><span class="star">★★★</span></div><div class="ja">算数・数学</div><div class="ex"><b>Math</b> is my favorite subject.</div><div class="xj">算数は私の好きな教科です。</div></button></li><li><button class="w" data-no="復140"><div class="top"><span class="no">復140</span><span class="en">art</span><span class="star">★★★</span></div><div class="ja">図工・美術</div><div class="ex"><b>Art</b> is fun.</div><div class="xj">図工は楽しいです。</div></button></li><li><button class="w" data-no="復141"><div class="top"><span class="no">復141</span><span class="en">lesson</span><span class="star">★★★</span></div><div class="ja">レッスン・授業</div><div class="ex">My piano <b>lesson</b> is at four.</div><div class="xj">私のピアノのレッスンは4時です。</div></button></li><li><button class="w" data-no="復142"><div class="top"><span class="no">復142</span><span class="en">picture</span><span class="star">★★★</span></div><div class="ja">絵・写真</div><div class="ex">Look at this <b>picture</b>.</div><div class="xj">この絵を見てください。</div></button></li><li><button class="w" data-no="復143"><div class="top"><span class="no">復143</span><span class="en">umbrella</span><span class="star">★★★</span></div><div class="ja">かさ</div><div class="ex">Take your <b>umbrella</b>, Ken.</div><div class="xj">ケン、かさを持って行きなさい。</div></button></li><li><button class="w" data-no="復144"><div class="top"><span class="no">復144</span><span class="en">shoes</span><span class="star">★★★</span></div><div class="ja">くつ</div><div class="ex">These <b>shoes</b> are new.</div><div class="xj">このくつは新しいです。</div></button></li><li><button class="w" data-no="復145"><div class="top"><span class="no">復145</span><span class="en">free</span><span class="star">★★★</span></div><div class="ja">ひまな</div><div class="ex">Are you <b>free</b> today?</div><div class="xj">あなたは今日ひまですか。</div></button></li><li><button class="w" data-no="復146"><div class="top"><span class="no">復146</span><span class="en">busy</span><span class="star">★★★</span></div><div class="ja">いそがしい</div><div class="ex">My mother is <b>busy</b> now.</div><div class="xj">私の母は今いそがしいです。</div></button></li><li><button class="w" data-no="復147"><div class="top"><span class="no">復147</span><span class="en">classroom</span><span class="star">★★★</span></div><div class="ja">教室</div><div class="ex">This is our <b>classroom</b>.</div><div class="xj">ここが私たちの教室です。</div></button></li><li><button class="w" data-no="復148"><div class="top"><span class="no">復148</span><span class="en">notebook</span><span class="star">★★★</span></div><div class="ja">ノート</div><div class="ex">Is this your <b>notebook</b>?</div><div class="xj">これはあなたのノートですか。</div></button></li><li><button class="w" data-no="復149"><div class="top"><span class="no">復149</span><span class="en">desk</span><span class="star">★★★</span></div><div class="ja">机</div><div class="ex">My <b>desk</b> is by the window.</div><div class="xj">私の机は窓のそばにあります。</div></button></li><li><button class="w" data-no="復150"><div class="top"><span class="no">復150</span><span class="en">bag</span><span class="star">★★★</span></div><div class="ja">かばん</div><div class="ex">My <b>bag</b> is blue.</div><div class="xj">私のかばんは青いです。</div></button></li><li><button class="w" data-no="復151"><div class="top"><span class="no">復151</span><span class="en">dictionary</span><span class="star">★★★</span></div><div class="ja">辞書</div><div class="ex">I use a <b>dictionary</b> in English class.</div><div class="xj">私は英語の授業で辞書を使います。</div></button></li><li><button class="w" data-no="復152"><div class="top"><span class="no">復152</span><span class="en">cat</span><span class="star">★★★</span></div><div class="ja">ネコ</div><div class="ex">The <b>cat</b> is under the table.</div><div class="xj">ネコがテーブルの下にいます。</div></button></li><li><button class="w" data-no="復153"><div class="top"><span class="no">復153</span><span class="en">bird</span><span class="star">★★★</span></div><div class="ja">鳥</div><div class="ex">Look at that <b>bird</b>!</div><div class="xj">あの鳥を見て！</div></button></li><li><button class="w" data-no="復154"><div class="top"><span class="no">復154</span><span class="en">beautiful</span><span class="star">★★★</span></div><div class="ja">美しい</div><div class="ex">The flowers
