</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検4級　第5回</h1><div class="sub">将来の夢・職業　No.161〜200</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">hope</span><span class="star">★★★</span></div><div class="ja">望む・～だといいと思う</div><div class="ex">I <b>hope</b> to see you again.</div><div class="xj">またあなたに会えることを望んでいます。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">need</span><span class="star">★★★</span></div><div class="ja">必要とする</div><div class="ex">I <b>need</b> a new notebook.</div><div class="xj">私は新しいノートが必要です。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">decide</span><span class="star">★★</span></div><div class="ja">決める</div><div class="ex">Ken <b>decided</b> to buy a new bike.</div><div class="xj">ケンは新しい自転車を買うことに決めました。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">start</span><span class="star">★★★</span></div><div class="ja">始める・始まる</div><div class="ex">Emi <b>started</b> to learn the piano.</div><div class="xj">エミはピアノを習い始めました。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">remember</span><span class="star">★★</span></div><div class="ja">覚えている・思い出す</div><div class="ex">Do you <b>remember</b> me?</div><div class="xj">私のことを覚えていますか。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">would like to ～</span><span class="star">★</span></div><div class="ja">～したい（want to のていねいな形）</div><div class="ex">I <b>would like to</b> drink some tea.</div><div class="xj">私は紅茶を飲みたいです。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">become</span><span class="star">★★★</span></div><div class="ja">～になる</div><div class="ex">Lisa wants to <b>become</b> a doctor.</div><div class="xj">リサは医者になりたいと思っています。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">dream</span><span class="star">★★</span></div><div class="ja">夢</div><div class="ex">My <b>dream</b> is to have a big house.</div><div class="xj">私の夢は大きな家を持つことです。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">future</span><span class="star">★★</span></div><div class="ja">将来・未来</div><div class="ex">What do you want to be in the <b>future</b>?</div><div class="xj">あなたは将来何になりたいですか。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">job</span><span class="star">★★★</span></div><div class="ja">仕事</div><div class="ex">Do you like your <b>job</b>?</div><div class="xj">あなたは自分の仕事が好きですか。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">work</span><span class="star">★★★</span></div><div class="ja">働く・仕事</div><div class="ex">My mother <b>works</b> at a hospital.</div><div class="xj">お母さんは病院で働いています。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">something</span><span class="star">★★★</span></div><div class="ja">何か</div><div class="ex">I want <b>something</b> to drink.</div><div class="xj">私は何か飲むものがほしいです。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">important</span><span class="star">★★★</span></div><div class="ja">大切な</div><div class="ex">Breakfast is very <b>important</b>.</div><div class="xj">朝ごはんはとても大切です。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">another</span><span class="star">★★★</span></div><div class="ja">もう1つの・別の</div><div class="ex">Can I have <b>another</b> cookie?</div><div class="xj">クッキーをもう1つもらってもいいですか。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">pilot</span><span class="star">★★</span></div><div class="ja">パイロット</div><div class="ex">Ken wants to be a <b>pilot</b>.</div><div class="xj">ケンはパイロットになりたいです。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">scientist</span><span class="star">★★</span></div><div class="ja">科学者</div><div class="ex">My uncle is a <b>scientist</b>.</div><div class="xj">私のおじは科学者です。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">artist</span><span class="star">★★</span></div><div class="ja">芸術家・画家</div><div class="ex">That <b>artist</b> draws pictures of animals.</div><div class="xj">その芸術家は動物の絵をかきます。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">musician</span><span class="star">★★</span></div><div class="ja">音楽家</div><div class="ex">Mr. Brown was a <b>musician</b> in America.</div><div class="xj">ブラウンさんはアメリカで音楽家をしていました。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">writer</span><span class="star">★★</span></div><div class="ja">作家</div><div class="ex">The <b>writer</b> wrote many stories for children.</div><div class="xj">その作家は子どものための話をたくさん書きました。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">farmer</span><span class="star">★★</span></div><div class="ja">農家の人</div><div class="ex">The <b>farmer</b> has many cows.</div><div class="xj">その農家の人はたくさんの牛をかっています。</div></button></li><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">police officer</span><span class="star">★</span></div><div class="ja">警察官</div><div class="ex">A <b>police officer</b> helped me.</div><div class="xj">警察官が私を助けてくれました。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">word</span><span class="star">★★★</span></div><div class="ja">単語・ことば</div><div class="ex">Can you read this <b>word</b>?</div><div class="xj">あなたはこの単語が読めますか。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">baker</span><span class="star">★★</span></div><div class="ja">パン屋さん</div><div class="ex">The <b>baker</b> makes bread every morning.</div><div class="xj">そのパン屋さんは毎朝パンを作ります。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">dancer</span><span class="star">★★</span></div><div class="ja">ダンサー</div><div class="ex">The <b>dancer</b> on TV was very cool.</div><div class="xj">テレビのダンサーはとてもかっこよかったです。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">pianist</span><span class="star">★★</span></div><div class="ja">ピアニスト</div><div class="ex">Lisa wants to be a <b>pianist</b>.</div><div class="xj">リサはピアニストになりたいです。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">subject</span><span class="star">★★★</span></div><div class="ja">教科</div><div class="ex">What <b>subject</b> do you like?</div><div class="xj">あなたはどの教科が好きですか。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">question</span><span class="star">★★★</span></div><div class="ja">質問・問題</div><div class="ex">May I ask a <b>question</b>?</div><div class="xj">質問をしてもいいですか。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">volunteer</span><span class="star">★★</span></div><div class="ja">ボランティア</div><div class="ex">Ken is a <b>volunteer</b> at the library.</div><div class="xj">ケンは図書館でボランティアをしています。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">robot</span><span class="star">★★</span></div><div class="ja">ロボット</div><div class="ex">This <b>robot</b> can talk.</div><div class="xj">このロボットは話すことができます。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">choose</span><span class="star">★★★</span></div><div class="ja">選ぶ</div><div class="ex">Can you <b>choose</b> a book for me?</div><div class="xj">私のために本を1さつ選んでくれますか。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">office</span><span class="star">★★★</span></div><div class="ja">会社・事務所</div><div class="ex">My father goes to the <b>office</b> by train.</div><div class="xj">お父さんは電車で会社に行きます。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">university</span><span class="star">★★★</span></div><div class="ja">大学</div><div class="ex">My sister studies at a <b>university</b>.</div><div class="xj">姉は大学で勉強しています。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">high school</span><span class="star">★</span></div><div class="ja">高校</div><div class="ex">My brother is a <b>high school</b> student.</div><div class="xj">兄は高校生です。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">junior high school</span><span class="star">★</span></div><div class="ja">中学校</div><div class="ex">I will go to <b>junior high school</b> next year.</div><div class="xj">私は来年、中学校に行きます。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">language</span><span class="star">★★★</span></div><div class="ja">言語・ことば</div><div class="ex">How many <b>languages</b> can you speak?</div><div class="xj">あなたはいくつの言語を話せますか。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">French</span><span class="star">★★★</span></div><div class="ja">フランス語</div><div class="ex">Lisa can speak <b>French</b>.</div><div class="xj">リサはフランス語を話せます。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">Spanish</span><span class="star">★★★</span></div><div class="ja">スペイン語</div><div class="ex">Tom is learning <b>Spanish</b> now.</div><div class="xj">トムは今、スペイン語を習っています。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">Chinese</span><span class="star">★★★</span></div><div class="ja">中国語</div><div class="ex">I want to study <b>Chinese</b>.</div><div class="xj">私は中国語を勉強したいです。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">idea</span><span class="star">★★★</span></div><div class="ja">考え・アイデア</div><div class="ex">That&#x27;s a good <b>idea</b>!</div><div class="xj">それはいい考えですね！</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">speech</span><span class="star">★★★</span></div><div class="ja">スピーチ</div><div class="ex">Ken made a <b>speech</b> in English.</div><div class="xj">ケンは英語でスピーチをしま
