"245"><div class="top"><span class="no">245</span><span class="en">small – smaller – smallest</span><span class="star">★★★</span></div><div class="ja">小さい</div><div class="ex">This is the <b>smallest</b> room in our house.</div><div class="xj">これは家でいちばん小さい部屋です。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">large – larger – largest</span><span class="star">★★★</span></div><div class="ja">大きい・広い</div><div class="ex">Our new school is <b>larger</b> than the old one.</div><div class="xj">新しい学校は前の学校より大きいです。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">long – longer – longest</span><span class="star">★★★</span></div><div class="ja">長い</div><div class="ex">My pencil is <b>longer</b> than yours.</div><div class="xj">私のえんぴつはあなたのより長いです。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">short – shorter – shortest</span><span class="star">★★</span></div><div class="ja">短い・背が低い</div><div class="ex">My hair is <b>shorter</b> than Lisa&#x27;s.</div><div class="xj">私のかみはリサのかみより短いです。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">high – higher – highest</span><span class="star">★★★</span></div><div class="ja">高い</div><div class="ex">Mt. Fuji is the <b>highest</b> mountain in Japan.</div><div class="xj">富士山は日本でいちばん高い山です。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">fast – faster – fastest</span><span class="star">★★★</span></div><div class="ja">速い・速く</div><div class="ex">Tom can run <b>faster</b> than Ken.</div><div class="xj">トムはケンより速く走れます。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">early – earlier – earliest</span><span class="star">★★★</span></div><div class="ja">早い・早く（y を i にかえる）</div><div class="ex">I got up <b>earlier</b> than my brother today.</div><div class="xj">今日、私は兄より早く起きました。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">easy – easier – easiest</span><span class="star">★★</span></div><div class="ja">かんたんな（y を i にかえる）</div><div class="ex">Which is <b>easier</b>, math or science?</div><div class="xj">算数と理科では、どちらがかんたんですか。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">heavy – heavier – heaviest</span><span class="star">★★</span></div><div class="ja">重い（y を i にかえる）</div><div class="ex">This box is the <b>heaviest</b> of the three.</div><div class="xj">3つの中で、この箱がいちばん重いです。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">cheap – cheaper – cheapest</span><span class="star">★★★</span></div><div class="ja">安い</div><div class="ex">This pen is the <b>cheapest</b> in this shop.</div><div class="xj">このペンはこの店でいちばん安いです。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">hard – harder – hardest</span><span class="star">★★★</span></div><div class="ja">難しい・熱心に</div><div class="ex">Math is <b>harder</b> than English for me.</div><div class="xj">私にとって、算数は英語より難しいです。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">good – better – best</span><span class="star">★★★</span></div><div class="ja">よい</div><div class="ex">Your idea is <b>better</b> than mine.</div><div class="xj">あなたのアイデアは私のよりよいです。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">many / much – more – most</span><span class="star">★★★</span></div><div class="ja">多い・たくさんの</div><div class="ex">Ken has <b>more</b> pencils than Tom.</div><div class="xj">ケンはトムよりたくさんえんぴつを持っています。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">bad – worse – worst</span><span class="star">★★★</span></div><div class="ja">悪い</div><div class="ex">The weather is <b>worse</b> today than yesterday.</div><div class="xj">今日の天気はきのうより悪いです。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">beautiful – more beautiful – most beautiful</span><span class="star">★★★</span></div><div class="ja">美しい</div><div class="ex">This is the <b>most beautiful</b> flower in the garden.</div><div class="xj">これは庭でいちばん美しい花です。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">popular – more popular – most popular</span><span class="star">★★★</span></div><div class="ja">人気のある</div><div class="ex">Soccer is <b>more popular</b> than baseball in my class.</div><div class="xj">私のクラスでは、サッカーは野球より人気があります。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">famous – more famous – most famous</span><span class="star">★★★</span></div><div class="ja">有名な</div><div class="ex">He is the <b>most famous</b> singer in Japan.</div><div class="xj">彼は日本でいちばん有名な歌手です。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">difficult – more difficult – most difficult</span><span class="star">★★★</span></div><div class="ja">難しい</div><div class="ex">The test was <b>more difficult</b> than last time.</div><div class="xj">テストはこの前より難しかったです。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">expensive – more expensive – most expensive</span><span class="star">★★★</span></div><div class="ja">（値段が）高い</div><div class="ex">This bike is <b>more expensive</b> than mine.</div><div class="xj">この自転車は私の自転車より高いです。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">interesting – more interesting – most interesting</span><span class="star">★★★</span></div><div class="ja">おもしろい・興味深い</div><div class="ex">This book is <b>more interesting</b> than that movie.</div><div class="xj">この本はあの映画よりおもしろいです。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">useful – more useful – most useful</span><span class="star">★★★</span></div><div class="ja">役に立つ</div><div class="ex">This map is <b>more useful</b> than that one.</div><div class="xj">この地図はあの地図より役に立ちます。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">than</span><span class="star">★★★</span></div><div class="ja">～よりも</div><div class="ex">I like cats better <b>than</b> dogs.</div><div class="xj">私は犬よりねこのほうが好きです。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">as ～ as …</span><span class="star">★</span></div><div class="ja">…と同じくらい～</div><div class="ex">Tom is <b>as tall as</b> his father.</div><div class="xj">トムはお父さんと同じくらい背が高いです。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">quiet</span><span class="star">★★★</span></div><div class="ja">静かな</div><div class="ex">The library is <b>quiet</b> in the morning.</div><div class="xj">図書館は朝は静かです。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">near</span><span class="star">★★★</span></div><div class="ja">近い・近くに</div><div class="ex">My house is <b>near</b> the station.</div><div class="xj">私の家は駅の近くにあります。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">far</span><span class="star">★★★</span></div><div class="ja">遠い・遠くに</div><div class="ex">Is the park <b>far</b> from here?</div><div c
