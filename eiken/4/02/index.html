★★★</span></div><div class="ja">勉強する（y を i にかえて ed）</div><div class="ex">Emi <b>studied</b> English after school.</div><div class="xj">エミは放課後、英語を勉強しました。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">try – tried</span><span class="star">★★★</span></div><div class="ja">やってみる（y を i にかえて ed）</div><div class="ex">Ken <b>tried</b> a new game.</div><div class="xj">ケンは新しいゲームをやってみました。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">carry – carried</span><span class="star">★★</span></div><div class="ja">運ぶ（y を i にかえて ed）</div><div class="ex">Tom <b>carried</b> the chairs to the classroom.</div><div class="xj">トムはいすを教室まで運びました。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">cry – cried</span><span class="star">★★</span></div><div class="ja">泣く・さけぶ（y を i にかえて ed）</div><div class="ex">The baby <b>cried</b> all night.</div><div class="xj">赤ちゃんはひと晩じゅう泣きました。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">worry – worried</span><span class="star">★★★</span></div><div class="ja">心配する（y を i にかえて ed）</div><div class="ex">Ken <b>worried</b> about the math test.</div><div class="xj">ケンは算数のテストのことを心配しました。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">stop – stopped</span><span class="star">★★★</span></div><div class="ja">止める・やめる（p を重ねて ed）</div><div class="ex">Ken <b>stopped</b> the music and stood up.</div><div class="xj">ケンは音楽を止めて、立ち上がりました。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">drop – dropped</span><span class="star">★★</span></div><div class="ja">落とす（p を重ねて ed）</div><div class="ex">Lisa <b>dropped</b> her pencil case.</div><div class="xj">リサは筆箱を落としました。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">plan – planned</span><span class="star">★★</span></div><div class="ja">計画する（n を重ねて ed）</div><div class="ex">Ken and Tom <b>planned</b> a soccer game for Sunday.</div><div class="xj">ケンとトムは日曜日のサッカーの試合を計画しました。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">shop – shopped</span><span class="star">★★★</span></div><div class="ja">買い物をする（p を重ねて ed）</div><div class="ex">We <b>shopped</b> at the new store.</div><div class="xj">私たちは新しいお店で買い物をしました。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">practice – practiced</span><span class="star">★★★</span></div><div class="ja">練習する（d だけつける）</div><div class="ex">Lisa <b>practiced</b> the piano for an hour.</div><div class="xj">リサは1時間ピアノを練習しました。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">arrive – arrived</span><span class="star">★★★</span></div><div class="ja">着く（d だけつける）</div><div class="ex">We <b>arrived</b> at the station at ten.</div><div class="xj">私たちは10時に駅に着きました。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">move – moved</span><span class="star">★★</span></div><div class="ja">引っこす・動かす（d だけつける）</div><div class="ex">Tom&#x27;s family <b>moved</b> to Osaka.</div><div class="xj">トムの家族は大阪に引っこしました。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">change – changed</span><span class="star">★★★</span></div><div class="ja">かえる・着がえる（d だけつける）</div><div class="ex">I <b>changed</b> the water for my fish.</div><div class="xj">私は魚の水をかえました。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">smile – smiled</span><span class="star">★★</span></div><div class="ja">ほほえむ（d だけつける）</div><div class="ex">My grandmother <b>smiled</b> at us.</div><div class="xj">おばあさんは私たちにほほえみました。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">visit – visited</span><span class="star">★★★</span></div><div class="ja">おとずれる（ed の発音は［イド］）</div><div class="ex">We <b>visited</b> our uncle in Kobe.</div><div class="xj">私たちは神戸のおじさんをおとずれました。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">shout – shouted</span><span class="star">★★★</span></div><div class="ja">さけぶ（ed の発音は［イド］）</div><div class="ex">Emi <b>shouted</b> my name from the window.</div><div class="xj">エミはまどから私の名前をさけびました。</div></button></li><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">happen – happened</span><span class="star">★★★</span></div><div class="ja">起こる</div><div class="ex">What <b>happened</b> at school today?</div><div class="xj">今日、学校で何が起こったのですか。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">learn – learned</span><span class="star">★★★</span></div><div class="ja">学ぶ・習う</div><div class="ex">Lisa <b>learned</b> Japanese songs at school.</div><div class="xj">リサは学校で日本の歌を学びました。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">call – called</span><span class="star">★★★</span></div><div class="ja">電話する・呼ぶ</div><div class="ex">I <b>called</b> Emi in the evening.</div><div class="xj">私は夕方、エミに電話しました。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">answer – answered</span><span class="star">★★★</span></div><div class="ja">答える・（電話に）出る</div><div class="ex">Lisa <b>answered</b> the teacher in English.</div><div class="xj">リサは英語で先生に答えました。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><spa ine</span><span class="star">★★★</span></div><div class="ja">雑誌</div><div class="ex">Lisa bought a soccer <b>magazine</b>.</div><div class="xj">リサはサッカーの雑誌を買いました。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">program</span><span class="star">★★★</span></div><div class="ja">番組</div><div class="ex">I watched a TV <b>program</b> about animals.</div><div class="xj">私は動物についてのテレビ番組を見ました。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"41": 4.62, "42": 17.46, "43": 31.8, "44": 45.55, "45": 58.36, "46": 74.78, "47": 89.8, "48": 105.58, "49": 121.4, "50": 137.23, "51": 153.36, "52": 168.26, "53": 184.67, "54": 199.93, "55": 215.74, "56": 230.64, "57": 246.38, "58": 262.14, "59": 277.45, "60": 292.71, "61": 308.09, "62": 321.58, "63": 336.26, "64": 350.13, "65": 365.0, "66": 378.37, "67": 391.3, "68": 403.97, "69": 416.64, "70": 430.36, "71": 444.56, "72": 457.26, "73": 469.32, "74": 481.73, "75": 494.76, "76": 507.81, "77": 520.64, "78": 533.53, "79": 547.56, "80": 560.47}, "TE": {"41": 6.49, "42": 19.33, "43": 33.68, "44": 47.42, "45": 61.1, "46": 77.18, "47": 92.34, "48": 108.13, "49": 123.82, "50": 139.9, "51": 155.73, "52": 170.85, "53": 187.19, "54": 202.69, "55": 218.48, "56": 233.18, "57": 249.02, "58": 264.95, "59": 279.92, "60": 295.28, "61": 310.56, "62": 324.0, "63": 338.64, "64": 352.55, "65": 366.88, "66": 380.24, "67": 393.17, "68": 405.84, "69": 418.51, "70": 432.59, "71": 446.44, "72": 459.13, "73": 471.2, "74": 483.67, "75": 496.65, "76": 509.7, "77": 522.52, "78": 535.5, "79": 549.53, "80": 562.34}, "Q": [[41, "yesterday", "昨日"], [42, "last ～", "この前の～"], [43, "ago", "～前に"], [44, "then", "そのとき・それから"], [45, "study – studied", "勉強する"], [46, "try – tried", "やってみる"], [47,
