</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検4級　第3回</h1><div class="sub">予定・旅行・天気　No.81〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">weekend</span><span class="star">★★★</span></div><div class="ja">週末</div><div class="ex">What are you going to do this <b>weekend</b>?</div><div class="xj">この週末は何をする予定ですか。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">vacation</span><span class="star">★★★</span></div><div class="ja">休み・休暇</div><div class="ex">My summer <b>vacation</b> begins next week.</div><div class="xj">私の夏休みは来週から始まります。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">holiday</span><span class="star">★★★</span></div><div class="ja">休日・祝日</div><div class="ex">Tomorrow is a <b>holiday</b>.</div><div class="xj">あしたは休日です。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">trip</span><span class="star">★★★</span></div><div class="ja">旅行</div><div class="ex">We are going to take a <b>trip</b> to Kyoto.</div><div class="xj">私たちは京都へ旅行に行く予定です。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">travel</span><span class="star">★★★</span></div><div class="ja">旅行する</div><div class="ex">Mr. Brown will <b>travel</b> to Nara next month.</div><div class="xj">ブラウン先生は来月、奈良へ旅行します。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">festival</span><span class="star">★★★</span></div><div class="ja">祭り</div><div class="ex">There is a summer <b>festival</b> in our town.</div><div class="xj">私たちの町では夏祭りがあります。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">stay</span><span class="star">★★★</span></div><div class="ja">泊まる・とどまる</div><div class="ex">We will <b>stay</b> at a hotel in Tokyo.</div><div class="xj">私たちは東京のホテルに泊まります。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">tonight</span><span class="star">★★★</span></div><div class="ja">今夜</div><div class="ex">It will be cold <b>tonight</b>.</div><div class="xj">今夜は寒くなるでしょう。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">soon</span><span class="star">★★★</span></div><div class="ja">すぐに・まもなく</div><div class="ex">The bus will come <b>soon</b>.</div><div class="xj">バスはすぐに来るでしょう。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">later</span><span class="star">★★★</span></div><div class="ja">あとで</div><div class="ex">I will call you <b>later</b>.</div><div class="xj">あとであなたに電話します。</div></button></li><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">someday</span><span class="star">★★</span></div><div class="ja">（未来の）いつか</div><div class="ex">I want to visit Canada <b>someday</b>.</div><div class="xj">私はいつかカナダをおとずれたいです。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">maybe</span><span class="star">★★</span></div><div class="ja">たぶん</div><div class="ex"><b>Maybe</b> it will rain tomorrow.</div><div class="xj">たぶんあしたは雨がふるでしょう。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">the day after tomorrow</span><span class="star">★</span></div><div class="ja">あさって</div><div class="ex">I will see Ken <b>the day after tomorrow</b>.</div><div class="xj">私はあさってケンに会います。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">rain</span><span class="star">★★★</span></div><div class="ja">雨・雨がふる</div><div class="ex">The <b>rain</b> stopped in the afternoon.</div><div class="xj">午後に雨がやみました。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">windy</span><span class="star">★★</span></div><div class="ja">風の強い</div><div class="ex">It will be <b>windy</b> tomorrow.</div><div class="xj">あしたは風が強いでしょう。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">outside</span><span class="star">★★★</span></div><div class="ja">外で・外に</div><div class="ex">Let&#x27;s play <b>outside</b> after lunch.</div><div class="xj">昼ごはんのあと、外で遊びましょう。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">warm</span><span class="star">★★★</span></div><div class="ja">暖かい</div><div class="ex">It will be <b>warm</b> this weekend.</div><div class="xj">今週末は暖かくなるでしょう。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">cool</span><span class="star">★★</span></div><div class="ja">すずしい・かっこいい</div><div class="ex">It was <b>cool</b> in the mountains.</div><div class="xj">山の中はすずしかったです。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">sky</span><span class="star">★★</span></div><div class="ja">空</div><div class="ex">The <b>sky</b> is very blue today.</div><div class="xj">今日は空がとても青いです。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">sun</span><span class="star">★</span></div><div class="ja">太陽</div><div class="ex">The <b>sun</b> will come out soon.</div><div class="xj">もうすぐ太陽が出るでしょう。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">cloud</span><span class="star">★★</span></div><div class="ja">雲</div><div class="ex">There are no <b>clouds</b> in the sky.</div><div class="xj">空には雲がひとつもありません。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">plane</span><span class="star">★★★</span></div><div class="ja">飛行機</div><div class="ex">We will go to Okinawa by <b>plane</b>.</div><div class="xj">私たちは飛行機で沖縄に行きます。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">ship</span><span class="star">★★</span></div><div class="ja">（大きな）船</div><div class="ex">We traveled to Shikoku by <b>ship</b>.</div><div class="xj">私たちは船で四国へ旅行しました。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">hotel</span><span class="star">★★</span></div><div class="ja">ホテル</div><div class="ex">Our <b>hotel</b> has a big pool.</div><div class="xj">私たちのホテルには大きなプールがあります。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">suitcase</span><span class="star">★★</span></div><div class="ja">スーツケース</div><div class="ex">Dad is going to carry my <b>suitcase</b>.</div><div class="xj">お父さんが私のスーツケースを運んでくれます。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">Christmas</span><span class="star">★★</span></div><div class="ja">クリスマス</div><div class="ex">What do you want for <b>Christmas</b>?</div><div class="xj">クリスマスには何がほしいですか。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">map</span><span class="star">★★</span></div><div class="ja">地図</div><div class="ex">Let&#x27;s look at the <b>map</b>.</div><div class="xj">地図を見ましょう。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">raincoat</span><span class="star">★★</span></div><div class="ja">レインコート</div><div class="ex">Wear your <b>raincoat</b> today.</div><div class="xj">今日はレインコートを着ていきなさい。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">picnic</span><span class="star">★★</span></div><div class="ja">ピクニック</div><div class="ex">We will have a <b>picnic</b> by the river.</div><div class="xj">私たちは川のそばでピクニックをします。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">beach</span><span class="star">★★★</span></div><div class="ja">浜辺・海岸</div><div class="ex">We played on the <b>beach</b> all day.</div><div class="xj">私たちは一日じゅう浜辺で遊びました。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">mountain</span><span class="star">★★★</span></div><div class="ja">山</div><div class="ex">My family will go to the <b>mountains</b> this summer.</div><div class="xj">私の家族はこの夏、山に行きます。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">sea</span><span class="star">★★</span></div><div class="ja">海</div><div class="ex">I swam in the <b>sea</b> last summer.</div><div class="xj">私は去年の夏、海で泳ぎました。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">lake</span><span class="star">★★</span></div><div class="ja">湖</div><div class="ex">There are many fish in this <b>lake</b>.</div><div class="xj">この湖にはたくさんの魚がいます。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">boat</span><span class="star">★★</span></div><div class="ja">ボート・小さな船</div><div class="ex">We rode a <b>boat</b> on the lake.</div><div class="xj">私たちは湖でボートに乗りました。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">hometown</span><span class="star">★★★</span></div><div class="ja">ふるさと</div><div class="ex">Lisa will go back to her <b>hometown</b> in August.</div><div class="xj">リサは8月にふるさとに帰ります。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">country</span><span class="star">★★★</span></div><div class="ja">国・いなか</div><div class="ex">Which <b>country</b> do you want to visit?</div><div class="xj">あなたはどの国をおとずれたいですか。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">world</span><span class="star">★★</span></div><div class="ja">世界</div><div class="ex">This is a map of the <b>world</b>.</div><div class="xj">これは世界の地図です。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">Australia</span><span class="star">★★★</span></div><div class="ja">オーストラリア</div><div class="ex">Tom is from <b>Australia</b>.</div><div class="xj">トムはオーストラリアの出身です。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">Canada</span><span class="star">★★★</span></div><div class="ja">カナダ</div><div class="ex">Emi&#x27;s aunt lives in <b>Canada</b>.</div><div class="xj">エミのおばさんはカナダに住んでいます。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">France</span><span class="star">★★★</span></div><div class="ja">フランス</div><div class="ex">Lisa is going to visit <b>France</b> next year.</div><div class="xj">リサは来年、フランスをおとずれる予定です。</div></button></li></ol></d
