ss="ex">Playing tennis is a lot of <b>fun</b>.</div><div class="xj">テニスをするのはとても楽しいです。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">camping</span><span class="star">★★</span></div><div class="ja">キャンプ</div><div class="ex">We enjoyed <b>camping</b> by the lake.</div><div class="xj">私たちは湖のそばでキャンプを楽しみました。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">fishing</span><span class="star">★★★</span></div><div class="ja">つり</div><div class="ex">My grandfather and I went <b>fishing</b>.</div><div class="xj">おじいさんと私はつりに行きました。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">hiking</span><span class="star">★★★</span></div><div class="ja">ハイキング</div><div class="ex">Let&#x27;s go <b>hiking</b> this Sunday.</div><div class="xj">今度の日曜日にハイキングに行きましょう。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">skiing</span><span class="star">★★</span></div><div class="ja">スキー</div><div class="ex">Ken goes <b>skiing</b> every winter.</div><div class="xj">ケンは毎年冬にスキーに行きます。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">present</span><span class="star">★★★</span></div><div class="ja">プレゼント</div><div class="ex">Thank you for the nice <b>present</b>.</div><div class="xj">すてきなプレゼントをありがとうございます。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">party</span><span class="star">★★★</span></div><div class="ja">パーティー</div><div class="ex">Lisa had a birthday <b>party</b>.</div><div class="xj">リサは誕生日パーティーを開きました。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">surfing</span><span class="star">★★</span></div><div class="ja">サーフィン</div><div class="ex">Tom is good at <b>surfing</b>.</div><div class="xj">トムはサーフィンが得意です。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">snowboarding</span><span class="star">★★</span></div><div class="ja">スノーボード</div><div class="ex">I tried <b>snowboarding</b> last winter.</div><div class="xj">私は去年の冬、スノーボードをやってみました。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">painting</span><span class="star">★★</span></div><div class="ja">絵（をかくこと）</div><div class="ex">Lisa&#x27;s <b>painting</b> is on the wall.</div><div class="xj">リサの絵がかべにかかっています。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">chess</span><span class="star">★★</span></div><div class="ja">チェス</div><div class="ex">My grandfather and I play <b>chess</b> on Sundays.</div><div class="xj">おじいさんと私は日曜日にチェスをします。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">badminton</span><span class="star">★★</span></div><div class="ja">バドミントン</div><div class="ex">Let&#x27;s play <b>badminton</b> after school.</div><div class="xj">放課後、バドミントンをしましょう。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">golf</span><span class="star">★★</span></div><div class="ja">ゴルフ</div><div class="ex">My uncle plays <b>golf</b> every weekend.</div><div class="xj">おじは毎週末ゴルフをします。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">table tennis</span><span class="star">★</span></div><div class="ja">卓球</div><div class="ex">Ken and Tom are playing <b>table tennis</b>.</div><div class="xj">ケンとトムは卓球をしています。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">ball</span><span class="star">★★★</span></div><div class="ja">ボール</div><div class="ex">The dog is running after the <b>ball</b>.</div><div class="xj">その犬はボールを追いかけています。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">racket</span><span class="star">★★</span></div><div class="ja">ラケット</div><div class="ex">I bought a new tennis <b>racket</b>.</div><div class="xj">私は新しいテニスのラケットを買いました。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">bat</span><span class="star">★★</span></div><div class="ja">バット</div><div class="ex">Whose <b>bat</b> is this?</div><div class="xj">これはだれのバットですか。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">glove</span><span class="star">★★</span></div><div class="ja">グローブ・手ぶくろ</div><div class="ex">Ken caught the ball with his <b>glove</b>.</div><div class="xj">ケンはグローブでボールをとりました。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">match</span><span class="star">★★</span></div><div class="ja">試合</div><div class="ex">When is the next <b>match</b>?</div><div class="xj">次の試合はいつですか。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">race</span><span class="star">★★</span></div><div class="ja">競走・レース</div><div class="ex">Lisa was first in the <b>race</b>.</div><div class="xj">リサは競走で1位でした。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">coach</span><span class="star">★★</span></div><div class="ja">コーチ</div><div class="ex">Our <b>coach</b> is very kind.</div><div class="xj">私たちのコーチはとてもやさしいです。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">contest</span><span class="star">★★★</span></div><div class="ja">コンテスト</div><div class="ex">Emi won the speech <b>contest</b>.</div><div class="xj">エミはスピーチコンテストで1位になりました。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">chorus</span><span class="star">★★</span></div><div class="ja">合唱</div><div class="ex">I&#x27;m in the school <b>chorus</b>.</div><div class="xj">私は学校の合唱部に入っています。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">band</span><span class="star">★★★</span></div><div class="ja">バンド</div><div class="ex">My brother plays the guitar in a <b>band</b>.</div><div class="xj">兄はバンドでギターをひいています。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">concert</span><span class="star">★★★</span></div><div class="ja">コンサート</div><div class="ex">We are going to a <b>concert</b> tonight.</div><div class="xj">私たちは今夜コンサートに行きます。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">drum</span><span class="star">★</span></div><div class="ja">ドラム・たいこ</div><div class="ex">Can you play the <b>drums</b>?</div><div class="xj">あなたはドラムをえんそうできますか。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">violin</span><span class="star">★★</span></div><div class="ja">バイオリン</div><div class="ex">Lisa started playing the <b>violin</b> at six.</div><div class="xj">リサは6さいでバイオリンをひき始めました。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">amazing</span><span class="star">★★</span></div><div class="ja">おどろくほどすごい</div><div class="ex">Your dance was <b>amazing</b>!</div><div class="xj">あなたのダンスはすごかったです！</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">trumpet</span><span class="star">★★</span></div><div class="ja">トランペット</div><div class="ex">Mr. Brown plays the <b>trumpet</b> well.</div><div class="xj">ブラウン先生はトランペットをじょうずにふきます。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">rock</span><span class="star">★★</span></div><div class="ja">ロック（音楽）・岩</div><div class="ex">My father likes <b>rock</b> music.</div><div class="xj">お父さんはロック音楽が好きです。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">performance</span><span class="star">★★</span></div><div class="ja">演奏・演技</div><div class="ex">Everyone liked Emi&#x27;s piano <b>performance</b>.</div><div class="xj">みんながエミのピアノの演奏を気に入りました。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">exciting</span><span class="star">★★★</span></div><div class="ja">わくわくさせる</div><div class="ex">The soccer game was very <b>exciting</b>.</div><div class="xj">サッカーの試合はとてもわくわくしました。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">boring</span><span class="star">★★</span></div><div class="ja">たいくつな</div><div class="ex">This TV program is <b>boring</b>.</div><div class="xj">このテレビ番組はたいくつです。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">card</span><span class="star">★★★</span></div><div class="ja">カード・トランプ</div><div class="ex">I made a birthday <b>card</b> for Emi.</div><div class="xj">私はエミに誕生日カードを作りました。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">photo</span><span class="star">★★★</span></div><div class="ja">写真</div><div class="ex">May I take a <b>photo</b> here?</div><div class="xj">ここで写真をとってもいいですか。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">be interested in ～</span><span class="star">★</span></div><div class="ja">～に興味がある</div><div class="ex">Ken <b>is interested in</b> robots.</div><div class="xj">ケンはロボットに興味があります。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"201": 4.72, "202": 17.41, "203": 29.76, "204": 42.55, "205": 54.69, "206": 67.43, "207": 80.17, "208": 92.91, "209": 105.39, "210": 118.1, "211": 130.39, "212": 142.84, "213": 155.1, "214": 168.3, "215": 181.13, "216": 194.76, "217": 207.74, "218": 220.74, "219": 234.42, "220": 247.16, "221": 259.66, "222": 271.68, "223": 284.95, "224": 297.06, "225": 310.24, "226": 322.76, "227": 335.48, "228": 347.76, "229": 360.43, "230": 372.98, "231": 385.5, "232": 399.03, "233": 411.89, "234": 424.8, "235": 438.31, "236": 452.46, "237": 465.61, "238": 478.4, "239": 491.57, "240": 503.81}, "TE": {"201": 6.59, "202": 19.28, "203": 31.71, "204": 44.42, "205": 56.56, "206": 69.3, "207": 82.04, "208": 94.78, "209": 107.26, "210": 119.98, "211": 132.26, "212": 144.71, "213": 157.14, "214": 170.17, "215": 183.0, "216": 196.68, "217": 209.61, "218": 222.88, "219": 236.29, "220": 249.03, "221": 261.53, "222": 273.55, "223": 286.82, "224": 298.94, "225": 312.11, "226": 324.66, "227": 337.35, "228": 349.46, "229": 362.3, "230": 374.85, "231": 387.37, "232": 400.93, "233": 413.76, "234": 426.67, "235": 440.37, "236": 454.34, "237": 467.48, "238": 480.27, "239": 493.44, "240": 505.99}, "Q": [[201, "enjoy", "楽しむ"], [202, "finish", "終える"], [203, "be good at ～", "～が得意だ"], [204, "hobby", "趣味"], [205, "fun", "楽しいこと"], [206, "camping", "キャンプ"], [207, "fishing", "つり"], [208, "hiking", "ハイキング"], [209, "skiing", "スキー"], [210, "present", "プレゼント"], [211, "party", "パーティー"], [212, "surfing", "サーフィン"], [213, "snowboarding", "スノーボード"], [214, "painting", "絵"], [215, "chess", "チェス"], [216, "badminton", "バドミントン"], [217, "golf", "ゴルフ"], [218, "table tennis", "卓球"], [219, "
