 very <b>old</b>.</div><div class="xj">この家はとても古いです。</div></button></li><li><button class="w" data-no="復46"><div class="top"><span class="no">復46</span><span class="en">big</span><span class="star">★★★</span></div><div class="ja">大きい</div><div class="ex">Elephants are very <b>big</b>.</div><div class="xj">ゾウはとても大きいです。</div></button></li><li><button class="w" data-no="復47"><div class="top"><span class="no">復47</span><span class="en">cold</span><span class="star">★★★</span></div><div class="ja">寒い・冷たい</div><div class="ex">It is <b>cold</b> this morning.</div><div class="xj">今朝は寒いです。</div></button></li><li><button class="w" data-no="復48"><div class="top"><span class="no">復48</span><span class="en">eat</span><span class="star">★★★</span></div><div class="ja">食べる</div><div class="ex">Rabbits <b>eat</b> carrots.</div><div class="xj">ウサギはニンジンを食べます。</div></button></li><li><button class="w" data-no="復49"><div class="top"><span class="no">復49</span><span class="en">tennis</span><span class="star">★★★</span></div><div class="ja">テニス</div><div class="ex">Lisa plays <b>tennis</b> with her mother.</div><div class="xj">リサはお母さんとテニスをします。</div></button></li><li><button class="w" data-no="復50"><div class="top"><span class="no">復50</span><span class="en">music</span><span class="star">★★★</span></div><div class="ja">音楽</div><div class="ex">I like <b>music</b> class.</div><div class="xj">私は音楽の授業が好きです。</div></button></li><li><button class="w" data-no="復51"><div class="top"><span class="no">復51</span><span class="en">man</span><span class="star">★★★</span></div><div class="ja">男の人</div><div class="ex">He is a tall <b>man</b>.</div><div class="xj">彼は背の高い男の人です。</div></button></li><li><button class="w" data-no="復52"><div class="top"><span class="no">復52</span><span class="en">help</span><span class="star">★★★</span></div><div class="ja">手伝う・助ける</div><div class="ex">Can you <b>help</b> me?</div><div class="xj">私を手伝ってくれますか。</div></button></li><li><button class="w" data-no="復53"><div class="top" an><span class="star">★★★</span></div><div class="ja">年</div><div class="ex">A <b>year</b> has twelve months.</div><div class="xj">1年は12か月です。</div></button></li><li><button class="w" data-no="復61"><div class="top"><span class="no">復61</span><span class="en">today</span><span class="star">★★★</span></div><div class="ja">今日</div><div class="ex">I have no homework <b>today</b>.</div><div class="xj">今日は宿題がありません。</div></button></li><li><button class="w" data-no="復62"><div class="top"><span class="no">復62</span><span class="en">birthday</span><span class="star">★★★</span></div><div class="ja">誕生日</div><div class="ex">Happy <b>birthday</b>, Emi!</div><div class="xj">エミ、誕生日おめでとう！</div></button></li><li><button class="w" data-no="復63"><div class="top"><span class="no">復63</span><span class="en">shop</span><span class="star">★★★</span></div><div class="ja">店</div><div class="ex">This <b>shop</b> has good bread.</div><div class="xj">この店のパンはおいしいです。</div></button></li><li><button class="w" data-no="復64"><div class="top"><span class="no">復64</span><span class="en">museum</span><span class="star">★★★</span></div><div class="ja">博物館・美術館</div><div class="ex">Emi and I are at the <b>museum</b>.</div><div class="xj">エミと私は博物館にいます。</div></button></li><li><button class="w" data-no="復65"><div class="top"><span class="no">復65</span><span class="en">train</span><span class="star">★★★</span></div><div class="ja">電車</div><div class="ex">Tom likes <b>trains</b> very much.</div><div class="xj">トムは電車が大好きです。</div></button></li><li><button class="w" data-no="復66"><div class="top"><span class="no">復66</span><span class="en">bike</span><span class="star">★★★</span></div><div class="ja">自転車</div><div class="ex">I go to the park by <b>bike</b>.</div><div class="xj">私は自転車で公園に行きます。</div></button></li><li><button class="w" data-no="復67"><div class="top"><span class="no">復67</span><span class="en">English</span><span class="star">★★★</span></div><div class="ja">英語</div><div class="ex">I study <b>English</
