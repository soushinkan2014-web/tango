★★★</span></div><div class="ja">取る・連れていく</div><div class="ex">I <b>took</b> a banana from the table.</div><div class="xj">私はテーブルからバナナを1本取りました。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">get – got</span><span class="star">★★★</span></div><div class="ja">手に入れる</div><div class="ex">Emi <b>got</b> a nice T-shirt at the shop.</div><div class="xj">エミはお店ですてきなTシャツを手に入れました。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">have – had</span><span class="star">★★★</span></div><div class="ja">持っている・食べる</div><div class="ex">Tom <b>had</b> a red cap in his hand.</div><div class="xj">トムは手に赤いぼうしを持っていました。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">eat – ate</span><span class="star">★★★</span></div><div class="ja">食べる</div><div class="ex">We <b>ate</b> pizza for lunch.</div><div class="xj">私たちは昼ごはんにピザを食べました。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">buy – bought</span><span class="star">★★★</span></div><div class="ja">買う</div><div class="ex">Dad <b>bought</b> some milk at the store.</div><div class="xj">お父さんはお店で牛乳を買いました。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">give – gave</span><span class="star">★★★</span></div><div class="ja">あたえる・あげる</div><div class="ex">Emi <b>gave</b> some food to the cat.</div><div class="xj">エミはねこにえさをあげました。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">leave – left</span><span class="star">★★★</span></div><div class="ja">出発する・置いてくる</div><div class="ex">The bus <b>left</b> at eight in the morning.</div><div class="xj">バスは朝8時に出発しました。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">meet – met</span><span class="star">★★★</span></div><div class="ja">会う</div><div class="ex">I <b>met</b> Lisa at the library.</div><div class="xj">私は図書館でリサに会いました。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">begin – began</span><span class="star">★★★</span></div><div class="ja">始める・始まる</div><div class="ex">We <b>began</b> our math homework after dinner.</div><div class="xj">私たちは夕ごはんのあと、算数の宿題を始めました。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">write – wrote</span><span class="star">★★★</span></div><div class="ja">書く</div><div class="ex">Emi <b>wrote</b> a letter to her grandfather.</div><div class="xj">エミはおじいさんに手紙を書きました。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">read – read</span><span class="star">★★★</span></div><div class="ja">読む（過去形 read［レッド］）</div><div class="ex">Tom <b>read</b> a book in his room.</div><div class="xj">トムは自分の部屋で本を読みました。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">swim – swam</span><span class="star">★★★</span></div><div class="ja">泳ぐ</div><div class="ex">Ken and I <b>swam</b> in the river.</div><div class="xj">ケンと私は川で泳ぎました。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">draw – drew</span><span class="star">★★★</span></div><div class="ja">（絵を）かく</div><div class="ex">Lisa <b>drew</b> a picture of her dog.</div><div class="xj">リサは自分の犬の絵をかきました。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">run – ran</span><span class="star">★★★</span></div><div class="ja">走る</div><div class="ex">Tom <b>ran</b> to the station.</div><div class="xj">トムは駅まで走りました。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">sing – sang</span><span class="star">★★</span></div><div class="ja">歌う</div><div class="ex">We <b>sang</b> a song in music class.</div><div class="xj">私たちは音楽の授業で歌を歌いました。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">find – found</span><span class="star">★★★</span></div><div class="ja">見つける</div><div class="ex">I <b>found</b> my eraser under the desk.</div><div class="xj">私はつくえの下で消しゴムを見つけました。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">lose – lost</span><span class="star">★★★</span></div><div class="ja">なくす・負ける</div><div class="ex">Ken <b>lost</b> his watch at school.</div><div class="xj">ケンは学校でうで時計をなくしました。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">tell – told</span><span class="star">★★★</span></div><div class="ja">話す・伝える</div><div class="ex">My grandmother <b>told</b> me a story about her cat.</div><div class="xj">おばあさんは私に、自分のねこの話を話してくれました。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">say – said</span><span class="star">★★★</span></div><div class="ja">言う</div><div class="ex">Lisa <b>said</b> goodbye to her friends.</div><div class="xj">リサは友だちに「さようなら」と言いました。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">think – thought</span><span class="star">★★★</span></div><div class="ja">思う・考える</div><div class="ex">Emi <b>thought</b> about a name for her new cat.</div><div class="xj">エミは新しいねこの名前について考えました。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">bring – brought</span><span class="star">★★★</span></div><div class="ja">持ってくる</div><div class="ex">Tom <b>brought</b> his lunch to school.</div><div class="xj">トムは学校にお弁当を持ってきました。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">sell – sold</span><span class="star">★★</span></div><div class="ja">売る</div><div class="ex">Mr. Brown <b>sold</b> his old car.</div><div class="xj">ブラウンさんは古い車を売りました。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">send – sent</span><span class="star">★★★</span></div><div class="ja">送る</div><div class="ex">I <b>sent</b> some pictures to my grandmother.</div><div class="xj">私はおばあさんに写真を何まいか送りました。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">forget – forgot</span><span class="star">★★★</span></div><div class="ja">忘れる</div><div class="ex">Ken <b>forgot</b> his math homework today.</div><div class="xj">ケンは今日、算数の宿題を忘れました。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">catch – caught</span><span class="star">★★★</span></div><div class="ja">つかまえる</div><div class="ex">My brother <b>caught</b> a big fish.</div><div class="xj">兄は大きな魚をつかまえました。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">feel – felt</span><span class="star">★★</span></div><div class="ja">感じる</div><div class="ex">Emi <b>felt</b> cold in the morning.</div><div class="xj">エミは朝、寒く感じました。</div></button></li><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">sleep – slept</span><span class="star">★★★</span></div><div class="ja">ねむる</div><div class="ex">The baby <b>slept</b> for three hours.</div><div class="xj">赤ちゃんは3時間ねむりました。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">sit – sat</span><span class="star">★★★</span></div><div class="ja">すわる</div><div class="ex">Lisa <b>sat</b> next to me in class.</div><div class="xj">リサは授業で私のとなりにすわりました。</div></button></li><li><button class
