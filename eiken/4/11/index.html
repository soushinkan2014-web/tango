></div><div class="ja">目をさます</div><div class="ex">Ken <b>woke up</b> late and ran to school.</div><div class="xj">ケンはおそく目をさまして、学校まで走りました。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">get on</span><span class="star">★</span></div><div class="ja">（乗り物に）乗る</div><div class="ex">We <b>got on</b> the bus at the station.</div><div class="xj">私たちは駅でバスに乗りました。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">get off</span><span class="star">★</span></div><div class="ja">（乗り物を）降りる</div><div class="ex"><b>Get off</b> the train at the next station.</div><div class="xj">次の駅で電車を降りてください。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">get to ～</span><span class="star">★</span></div><div class="ja">～に着く</div><div class="ex">We <b>got to</b> the hotel at noon.</div><div class="xj">私たちは正午にホテルに着きました。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">arrive at / in ～</span><span class="star">★</span></div><div class="ja">～に着く</div><div class="ex">Our plane <b>arrived in</b> Hawaii at seven.</div><div class="xj">私たちの飛行機は7時にハワイに着きました。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">go back to ～</span><span class="star">★</span></div><div class="ja">～へもどる</div><div class="ex">After lunch, we <b>went back to</b> the classroom.</div><div class="xj">昼ごはんのあと、私たちは教室へもどりました。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">come back</span><span class="star">★</span></div><div class="ja">帰ってくる・もどる</div><div class="ex">Please <b>come back</b> by five.</div><div class="xj">5時までに帰ってきてください。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">leave A for B</span><span class="star">★</span></div><div class="ja">A を出て B へ向かう</div><div class="ex">My family <b>left Osaka for Tokyo</b> this morning.</div><div class="xj">私の家族は今朝、大阪を出て東京へ向かいました。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">look for ～</span><span class="star">★</span></div><div class="ja">～をさがす</div><div class="ex">I&#x27;m <b>looking for</b> my key.</div><div class="xj">私はかぎをさがしています。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">look forward to ～ing</span><span class="star">★</span></div><div class="ja">～するのを楽しみに待つ</div><div class="ex">I&#x27;m <b>looking forward to</b> seeing you.</div><div class="xj">あなたに会えるのを楽しみにしています。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">be late for ～</span><span class="star">★</span></div><div class="ja">～におくれる</div><div class="ex">Tom <b>was late for</b> school today.</div><div class="xj">トムは今日、学校におくれました。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">be famous for ～</span><span class="star">★</span></div><div class="ja">～で有名だ</div><div class="ex">Kyoto <b>is famous for</b> its old temples.</div><div class="xj">京都は古いお寺で有名です。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">help ～ with …</span><span class="star">★</span></div><div class="ja">～の…を手伝う</div><div class="ex">Can you <b>help me with</b> my homework?</div><div class="xj">私の宿題を手伝ってくれませんか。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">hear about ～</span><span class="star">★</span></div><div class="ja">～について聞く</div><div class="ex">Did you <b>hear about</b> the new teacher?</div><div class="xj">新しい先生について聞きましたか。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">talk with ～</span><span class="star">★</span></div><div class="ja">～と話す</div><div class="ex">I <b>talked with</b> Lisa after lunch.</div><div class="xj">私は昼ごはんのあと、リサと話しました。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">wait for ～</span><span class="star">★</span></div><div class="ja">～を待つ</div><div class="ex">I&#x27;m <b>waiting for</b> the bus.</div><div class="xj">私はバスを待っています。</div></button></li><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">stay with ～</span><span class="star">★</span></div><div class="ja">～の家に泊まる</div><div class="ex">I <b>stayed with</b> my aunt last summer.</div><div class="xj">去年の夏、私はおばの家に泊まりました。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">give a speech</span><span class="star">★</span></div><div class="ja">スピーチをする</div><div class="ex">Emi <b>gave a speech</b> in English.</div><div class="xj">エミは英語でスピーチをしました。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">give up</span><span class="star">★</span></div><div class="ja">あきらめる</div><div class="ex">Don&#x27;t <b>give up</b>! You can do it.</div><div class="xj">あきらめないでください！きっとできます。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">slow down</span><span class="star">★</span></div><div class="ja">スピードを落とす</div><div class="ex">Please <b>slow down</b>. You&#x27;re walking too fast.</div><div class="xj">スピードを落としてください。歩くのが速すぎます。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">hurry up</span><span class="star">★</span></div><div class="ja">急ぐ</div><div class="ex"><b>Hurry up</b>! The bus is coming.</div><div class="xj">急いでください！バスが来ます。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">come in</span><span class="star">★</span></div><div class="ja">中に入る</div><div class="ex">Please <b>come in</b>. It&#x27;s cold outside.</div><div class="xj">どうぞ中に入ってください。外は寒いですよ。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">sit down</span><span class="star">★</span></div><div class="ja">すわる</div><div class="ex">Please <b>sit down</b> on this chair.</div><div class="xj">このいすにすわってください。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">stand up</span><span class="star">★</span></div><div class="ja">立ち上がる</div><div class="ex">Everyone, please <b>stand up</b>.</div><div class="xj">みなさん、立ち上がってください。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">for example</span><span class="star">★</span></div><div class="ja">たとえば</div><div class="ex">I like fruit, <b>for example</b>, apples and bananas.</div><div class="xj">私はくだもの、たとえばリンゴやバナナが好きです。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">a little</span><span class="star">★</span></div><div class="ja">少し</div><div class="ex">I can speak English <b>a little</b>.</div><div class="xj">私は英語が少し話せます。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">a lot of ～</span><span class="star">★</span></div><div class="ja">たくさんの～</div><div class="ex">There are <b>a lot of</b> books in the library.</div><div class="xj">図書館にはたくさんの本があります。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">a cup of ～</span><span class="star">★</span></div><div class="ja">カップ1ぱいの～</div><div class="ex">My father drinks <b>a cup of</b> coffee every morning.</d
