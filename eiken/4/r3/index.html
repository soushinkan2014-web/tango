x27;t <b>use</b> your phone in class.</div><div class="xj">授業中にけいたい電話を使ってはいけません。</div></button></li><li><button class="w" data-no="復86"><div class="top"><span class="no">復86</span><span class="en">TV</span><span class="star">★★★</span></div><div class="ja">テレビ</div><div class="ex">The <b>TV</b> is next to the window.</div><div class="xj">テレビは窓のとなりにあります。</div></button></li><li><button class="w" data-no="復87"><div class="top"><span class="no">復87</span><span class="en">dinner</span><span class="star">★★★</span></div><div class="ja">夕ごはん</div><div class="ex">My family eats <b>dinner</b> together.</div><div class="xj">私の家族はいっしょに夕ごはんを食べます。</div></button></li><li><button class="w" data-no="復88"><div class="top"><span class="no">復88</span><span class="en">Monday</span><span class="star">★★★</span></div><div class="ja">月曜日</div><div class="ex">Today is <b>Monday</b>.</div><div class="xj">今日は月曜日です。</div></button></li><li><button class="w" data-no="復89"><div class="top"><span class="no">復89</span><span class="en">o&#x27;clock</span><span class="star">★★★</span></div><div class="ja">～時（ちょうど）</div><div class="ex">I get up at six <b>o&#x27;clock</b>.</div><div class="xj">私は6時に起きます。</div></button></li><li><button class="w" data-no="復90"><div class="top"><span class="no">復90</span><span class="en">library</span><span class="star">★★★</span></div><div class="ja">図書館</div><div class="ex">I study in the <b>library</b>.</div><div class="xj">私は図書館で勉強します。</div></button></li><li><button class="w" data-no="復91"><div class="top"><span class="no">復91</span><span class="en">bus</span><span class="star">★★★</span></div><div class="ja">バス</div><div class="ex">The <b>bus</b> is coming.</div><div class="xj">バスが来ています。</div></button></li><li><button class="w" data-no="復92"><div class="top"><span class="no">復92</span><span class="en">weather</span><span class="star">★★★</span></div><div class="ja">天気</div><div class="ex">How is the <b>weather</b> today?</div><div class="xj">今日の天気はどうですか。</div></butt p"><span class="no">復100</span><span class="en">dog</span><span class="star">★★★</span></div><div class="ja">犬</div><div class="ex">This is my <b>dog</b>.</div><div class="xj">これは私の犬です。</div></button></li><li><button class="w" data-no="復101"><div class="top"><span class="no">復101</span><span class="en">little</span><span class="star">★★★</span></div><div class="ja">小さい</div><div class="ex">This is a <b>little</b> cat.</div><div class="xj">これは小さいネコです。</div></button></li><li><button class="w" data-no="復102"><div class="top"><span class="no">復102</span><span class="en">read</span><span class="star">★★★</span></div><div class="ja">読む</div><div class="ex">My father <b>reads</b> the newspaper.</div><div class="xj">私の父は新聞を読みます。</div></button></li><li><button class="w" data-no="復103"><div class="top"><span class="no">復103</span><span class="en">baseball</span><span class="star">★★★</span></div><div class="ja">野球</div><div class="ex">We watch <b>baseball</b> on TV.</div><div class="xj">私たちはテレビで野球を見ます。</div></button></li><li><button class="w" data-no="復104"><div class="top"><span class="no">復104</span><span class="en">guitar</span><span class="star">★★★</span></div><div class="ja">ギター</div><div class="ex">Do you play the <b>guitar</b>?</div><div class="xj">あなたはギターをひきますか。</div></button></li><li><button class="w" data-no="復105"><div class="top"><span class="no">復105</span><span class="en">people</span><span class="star">★★★</span></div><div class="ja">人々</div><div class="ex">Many <b>people</b> are at the station.</div><div class="xj">駅にはたくさんの人々がいます。</div></button></li><li><button class="w" data-no="復106"><div class="top"><span class="no">復106</span><span class="en">swim</span><span class="star">★★★</span></div><div class="ja">泳ぐ</div><div class="ex">Ken can <b>swim</b> fast.</div><div class="xj">ケンは速く泳ぐことができます。</div></button></li><li><button class="w" data-no="復107"><div class="top"><span class="no">復107</span><span class="en">speak</span><span class="star">★★★</span></div><div
