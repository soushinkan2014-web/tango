</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検4級　第8回</h1><div class="sub">つなぐ語・町の施設・家族　No.281〜320</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">when</span><span class="star">★★★</span></div><div class="ja">～するとき</div><div class="ex">I was sleeping <b>when</b> you called me.</div><div class="xj">あなたが電話をくれたとき、私はねむっていました。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">because</span><span class="star">★★★</span></div><div class="ja">（なぜなら）～だから</div><div class="ex">I&#x27;m hungry <b>because</b> I didn&#x27;t eat breakfast.</div><div class="xj">朝ごはんを食べなかったから、おなかがすいています。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">if</span><span class="star">★★★</span></div><div class="ja">もし～ならば</div><div class="ex"><b>If</b> it rains tomorrow, I&#x27;ll stay home.</div><div class="xj">もしあした雨がふったら、家にいます。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">so</span><span class="star">★★★</span></div><div class="ja">だから・それで</div><div class="ex">It was cold, <b>so</b> I wore my coat.</div><div class="xj">寒かったです。だから私はコートを着ました。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">but</span><span class="star">★★★</span></div><div class="ja">しかし・でも</div><div class="ex">I like tennis, <b>but</b> Ken likes soccer.</div><div class="xj">私はテニスが好きです。でもケンはサッカーが好きです。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">There was / were ～</span><span class="star">★</span></div><div class="ja">～があった・～がいた</div><div class="ex"><b>There were</b> many people in the park.</div><div class="xj">公園にはたくさんの人がいました。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">show</span><span class="star">★★★</span></div><div class="ja">見せる</div><div class="ex">Please <b>show</b> me your new bike.</div><div class="xj">あなたの新しい自転車を私に見せてください。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">ask</span><span class="star">★★★</span></div><div class="ja">たずねる・たのむ</div><div class="ex">Can I <b>ask</b> you a question?</div><div class="xj">1つたずねてもいいですか。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">airport</span><span class="star">★★★</span></div><div class="ja">空港</div><div class="ex">We went to the <b>airport</b> by bus.</div><div class="xj">私たちはバスで空港に行きました。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">bank</span><span class="star">★★★</span></div><div class="ja">銀行</div><div class="ex">My father works at a <b>bank</b>.</div><div class="xj">父は銀行で働いています。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">theater</span><span class="star">★★★</span></div><div class="ja">劇場</div><div class="ex">My class saw a play at the <b>theater</b>.</div><div class="xj">私のクラスは劇場で劇を見ました。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">stadium</span><span class="star">★★</span></div><div class="ja">スタジアム・競技場</div><div class="ex">We watched a soccer game at the <b>stadium</b>.</div><div class="xj">私たちはスタジアムでサッカーの試合を見ました。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">farm</span><span class="star">★★★</span></div><div class="ja">農場</div><div class="ex">My uncle has a big <b>farm</b>.</div><div class="xj">おじは大きな農場を持っています。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">bookstore</span><span class="star">★★★</span></div><div class="ja">本屋</div><div class="ex">I bought a dictionary at the <b>bookstore</b>.</div><div class="xj">私は本屋で辞書を買いました。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">supermarket</span><span class="star">★★★</span></div><div class="ja">スーパーマーケット</div><div class="ex">My mother goes to the <b>supermarket</b> every day.</div><div class="xj">母は毎日スーパーマーケットに行きます。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">department store</span><span class="star">★</span></div><div class="ja">デパート</div><div class="ex">Let&#x27;s buy a present at the <b>department store</b>.</div><div class="xj">デパートでプレゼントを買いましょう。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">mall</span><span class="star">★★★</span></div><div class="ja">ショッピングモール</div><div class="ex">Emi and I went shopping at the <b>mall</b>.</div><div class="xj">エミと私はショッピングモールに買い物に行きました。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">café</span><span class="star">★</span></div><div class="ja">カフェ・喫茶店</div><div class="ex">Let&#x27;s have some juice at that <b>café</b>.</div><div class="xj">あのカフェでジュースを飲みましょう。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">aquarium</span><span class="star">★★</span></div><div class="ja">水族館</div><div class="ex">We saw many fish at the <b>aquarium</b>.</div><div class="xj">私たちは水族館でたくさんの魚を見ました。</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">gym</span><span class="star">★★★</span></div><div class="ja">体育館</div><div class="ex">We play basketball in the <b>gym</b>.</div><div class="xj">私たちは体育館でバスケットボールをします。</div></button></li><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">pool</span><span class="star">★★★</span></div><div class="ja">プール</div><div class="ex">Ken swims in the <b>pool</b> every summer.</div><div class="xj">ケンは毎年夏にプールで泳ぎます。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">convenience store</span><span class="star">★</span></div><div class="ja">コンビニ</div><div class="ex">I bought some water at the <b>convenience store</b>.</div><div class="xj">私はコンビニで水を買いました。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">temple</span><span class="star">★★</span></div><div class="ja">寺</div><div class="ex">We visited an old <b>temple</b> in Kyoto.</div><div class="xj">私たちは京都の古いお寺をおとずれました。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">castle</span><span class="star">★★</span></div><div class="ja">城</div><div class="ex">We can see the <b>castle</b> from here.</div><div class="xj">ここからお城が見えます。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">town</span><span class="star">★★★</span></div><div class="ja">町</div><div class="ex">Our <b>town</b> has a big park.</div><div class="xj">私たちの町には大きな公園があります。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">building</span><span class="star">★★★</span></div><div class="ja">建物・ビル</div><div class="ex">That tall <b>building</b> is a hospital.</div><div class="xj">あの高い建物は病院です。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">place</span><span class="star">★★★</span></div><div class="ja">場所</div><div class="ex">This park is my favorite <b>place</b>.</div><div class="xj">この公園は私のお気に入りの場所です。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">corner</span><span class="star">★★</span></div><div class="ja">角</div><div class="ex">There is a café on the <b>corner</b>.</div><div class="xj">角にカフェがあります。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">right</span><span class="star">★★★</span></div><div class="ja">右・正しい</div><div class="ex">The post office is on your <b>right</b>.</div><div class="xj">郵便局は右にあります。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">turn</span><span class="star">★★</span></div><div class="ja">曲がる・回す</div><div class="ex"><b>Turn</b> left at the bookstore.</div><div class="xj">本屋のところで左に曲がってください。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">next to ～</span><span class="star">★</span></div><div class="ja">～のとなりに</div><div class="ex">Ken sat <b>next to</b> me.</div><div class="xj">ケンは私のとなりにすわりました。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">parents</span><span class="star">★★★</span></div><div class="ja">両親</div><div class="ex">My <b>parents</b> are both teachers.</div><div class="xj">私の両親はふたりとも先生です。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">grandparents</span><span class="star">★★★</span></div><div class="ja">祖父母</div><div class="ex">I visited my <b>grandparents</b> last summer.</div><div class="xj">去年の夏、私は祖父母に会いに行きました。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">grandmother</span><span class="star">★★★</span></div><div class="ja">祖母・おばあさん</div><div class="ex">My <b>grandmother</b> makes delicious cookies.</div><div class="xj">私の祖母はとてもおいしいクッキーを作ります。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">grandfather</span><span class="star">★★★</span></div><div class="ja">祖父・おじいさん</div><div class="ex">My <b>grandfather</b> likes fishing.</div><div class="xj">私の祖父はつりが好きです。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">son</span><span class="star">★★★</span></div><div class="ja">むすこ</div><div class="ex">Mr. Brown&#x27;s <b>son</b> goes to junior high school.</div><div class="xj">ブラウン先生のむすこさんは中学校に通っています。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">daughter</span><span class="star">★★★</span></div><div class="ja">むすめ</div><div class="ex">My uncle has two <b>daughters</b>.</div><div class="xj">おじにはむすめが2人います。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">cousin</span><span class="star">★★</span></div><div class="ja">いとこ</div><div class="ex">My <b>cousin</b> lives in Canada.</div><div class="xj">私のいとこはカナダに住んでいます。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">husband</span><span class="star">★★★</span></div><div class="ja">夫</div><div class="ex">Her <b>husband</b> is a police officer.</div><div class="xj">彼女の夫は警察官です。</div></button></li><li><button class="w" data-no
