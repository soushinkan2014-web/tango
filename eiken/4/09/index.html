</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検4級　第9回</h1><div class="sub">お知らせ・Eメール・物語　No.321〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">information</span><span class="star">★★</span></div><div class="ja">情報・案内</div><div class="ex">This book has <b>information</b> about dogs.</div><div class="xj">この本には犬についての情報がのっています。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">event</span><span class="star">★★</span></div><div class="ja">行事・イベント</div><div class="ex">Our school has a big <b>event</b> in May.</div><div class="xj">私たちの学校では5月に大きな行事があります。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">sale</span><span class="star">★★★</span></div><div class="ja">特売・セール</div><div class="ex">That store is having a <b>sale</b> today.</div><div class="xj">あの店は今日特売をしています。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">ticket</span><span class="star">★★★</span></div><div class="ja">チケット・切符</div><div class="ex">I have two <b>tickets</b> for the concert.</div><div class="xj">私はコンサートのチケットを2まい持っています。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">member</span><span class="star">★★★</span></div><div class="ja">メンバー・部員</div><div class="ex">Ken is a <b>member</b> of the soccer team.</div><div class="xj">ケンはサッカーチームのメンバーです。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">welcome</span><span class="star">★★★</span></div><div class="ja">かんげいする・ようこそ</div><div class="ex">We <b>welcomed</b> the new student.</div><div class="xj">私たちは新しい生徒をかんげいしました。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">join</span><span class="star">★★★</span></div><div class="ja">参加する・加わる</div><div class="ex">Can I <b>join</b> your game?</div><div class="xj">あなたたちのゲームに参加してもいいですか。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">kind</span><span class="star">★★★</span></div><div class="ja">種類（many kinds of ～ いろいろな種類の～）</div><div class="ex">This shop sells many <b>kinds</b> of bread.</div><div class="xj">この店ではたくさんの種類のパンを売っています。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">for free</span><span class="star">★</span></div><div class="ja">無料で</div><div class="ex">You can get this pen <b>for free</b>.</div><div class="xj">このペンは無料でもらえます。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">fee</span><span class="star">★★</span></div><div class="ja">料金</div><div class="ex">The <b>fee</b> is 300 yen for children.</div><div class="xj">子どもの料金は300円です。</div></button></li><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">during</span><span class="star">★★★</span></div><div class="ja">～の間に</div><div class="ex">I went to Okinawa <b>during</b> summer vacation.</div><div class="xj">私は夏休みの間に沖縄に行きました。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">until</span><span class="star">★★</span></div><div class="ja">～まで（ずっと）</div><div class="ex">I studied <b>until</b> nine last night.</div><div class="xj">私はきのうの夜、9時まで勉強しました。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">e-mail</span><span class="star">★</span></div><div class="ja">Eメール</div><div class="ex">I sent an <b>e-mail</b> to my cousin.</div><div class="xj">私はいとこにEメールを送りました。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">message</span><span class="star">★★</span></div><div class="ja">伝言・メッセージ</div><div class="ex">Can I leave a <b>message</b>?</div><div class="xj">伝言を残してもいいですか。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">invite</span><span class="star">★★</span></div><div class="ja">招待する</div><div class="ex">Lisa <b>invited</b> me to her party.</div><div class="xj">リサが私をパーティーに招待してくれました。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">Dear ～</span><span class="star">★</span></div><div class="ja">～へ・～様（手紙の書き出し）</div><div class="ex"><b>Dear</b> Emi, Thank you for the present.</div><div class="xj">エミへ、プレゼントをどうもありがとう。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">nervous</span><span class="star">★★★</span></div><div class="ja">きんちょうした</div><div class="ex">I was <b>nervous</b> before the speech.</div><div class="xj">私はスピーチの前、きんちょうしていました。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">surprised</span><span class="star">★★★</span></div><div class="ja">おどろいた</div><div class="ex">Emi was <b>surprised</b> at the news.</div><div class="xj">エミはそのニュースにおどろきました。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">excited</span><span class="star">★★★</span></div><div class="ja">わくわくした</div><div class="ex">The children were <b>excited</b> about the trip.</div><div class="xj">子どもたちは旅行にわくわくしていました。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">glad</span><span class="star">★★★</span></div><div class="ja">うれしい</div><div class="ex">I&#x27;m <b>glad</b> to see you again.</div><div class="xj">またあなたに会えてうれしいです。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">lucky</span><span class="star">★★</span></div><div class="ja">運のよい</div><div class="ex">You&#x27;re <b>lucky</b>! You got the last cake.</div><div class="xj">運がいいですね！最後のケーキがもらえましたね。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">prize</span><span class="star">★★</span></div><div class="ja">賞・賞品</div><div class="ex">Lisa got a <b>prize</b> for her painting.</div><div class="xj">リサは自分の絵で賞をもらいました。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">poster</span><span class="star">★★</span></div><div class="ja">ポスター</div><div class="ex">Let&#x27;s make a <b>poster</b> for the festival.</div><div class="xj">お祭りのポスターを作りましょう。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">gate</span><span class="star">★★★</span></div><div class="ja">門</div><div class="ex">Let&#x27;s meet at the school <b>gate</b>.</div><div class="xj">学校の門のところで会いましょう。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">meeting</span><span class="star">★★★</span></div><div class="ja">会議・集まり</div><div class="ex">The teachers have a <b>meeting</b> after school.</div><div class="xj">先生たちは放課後に会議があります。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">closed</span><span class="star">★★</span></div><div class="ja">閉まっている</div><div class="ex">The library is <b>closed</b> on Mondays.</div><div class="xj">図書館は月曜日は閉まっています。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">report</span><span class="star">★★★</span></div><div class="ja">レポート・報告</div><div class="ex">I wrote a <b>report</b> about my town.</div><div class="xj">私は自分の町についてレポートを書きました。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">story</span><span class="star">★★★</span></div><div class="ja">物語・話</div><div class="ex">My father read me a <b>story</b>.</div><div class="xj">父は私に物語を読んでくれました。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">part</span><span class="star">★★★</span></div><div class="ja">部分・役</div><div class="ex">I like the last <b>part</b> of the movie.</div><div class="xj">私はその映画の最後の部分が好きです。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">everyone</span><span class="star">★★★</span></div><div class="ja">みんな</div><div class="ex"><b>Everyone</b> in my class likes Mr. Brown.</div><div class="xj">クラスのみんながブラウン先生を好きです。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">one day</span><span class="star">★</span></div><div class="ja">ある日</div><div class="ex"><b>One day</b>, a cat came to our house.</div><div class="xj">ある日、ねこが私たちの家に来ました。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">also</span><span class="star">★★★</span></div><div class="ja">～もまた</div><div class="ex">Tom likes soccer. He <b>also</b> likes baseball.</div><div class="xj">トムはサッカーが好きです。野球も好きです。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">only</span><span class="star">★★★</span></div><div class="ja">ただ～だけ</div><div class="ex">I have <b>only</b> 100 yen.</div><div class="xj">私は100円だけ持っています。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">just</span><span class="star">★★★</span></div><div class="ja">ちょうど・ほんの</div><div class="ex">It&#x27;s <b>just</b> seven o&#x27;clock now.</div><div class="xj">今ちょうど7時です。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">already</span><span class="star">★★★</span></div><div class="ja">すでに・もう</div><div class="ex">I <b>already</b> finished my homework.</div><div class="xj">私はもう宿題を終えました。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">still</span><span class="star">★★</span></div><div class="ja">まだ・今でも</div><div class="ex">Ken is <b>still</b> sleeping.</div><div class="xj">ケンはまだねむっています。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">again</span><span class="star">★★</span></div><div class="ja">もう一度・また</div><div class="ex">Please say that <b>again</b>.</div><div class="xj">もう一度言ってください。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">almost</span><span class="star">★★</span></div><div class="ja">ほとんど</div><div class="ex">I ate <b>almost</b> all the cookies.</div><div class="xj">私はクッキーをほとんど全部食べました。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">anything</span><span class="star">★★★</span></div><div class="ja">何か・何でも</div><div class="ex">Do you want <b>anything</b> to drink?</div><div class="xj">何か飲み物はいりますか。</div></button></li><li><button class="w" data-no="360"><div class="top"><span cla
