ta-no="445"><div class="top"><span class="no">445</span><span class="en">I have no idea.</span><span class="star">★</span></div><div class="ja">まったくわかりません</div><div class="ex">A: Where is Tom?<br>B: <b>I have no idea</b>.</div><div class="xj">A：トムはどこにいますか。 B：まったくわかりません。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">I&#x27;m not sure.</span><span class="star">★</span></div><div class="ja">よくわかりません</div><div class="ex">A: Will it rain tomorrow?<br>B: <b>I&#x27;m not sure</b>.</div><div class="xj">A：あしたは雨がふりますか。 B：よくわかりません。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">That sounds good.</span><span class="star">★</span></div><div class="ja">それはいいですね</div><div class="ex">A: Let&#x27;s have a picnic.<br>B: <b>That sounds good</b>.</div><div class="xj">A：ピクニックをしましょう。 B：それはいいですね。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">Here you are.</span><span class="star">★</span></div><div class="ja">はい、どうぞ</div><div class="ex">A: Can I borrow your eraser?<br>B: Sure. <b>Here you are</b>.</div><div class="xj">A：消しゴムを借りてもいい？ B：いいよ。はい、どうぞ。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">Here&#x27;s ～.</span><span class="star">★</span></div><div class="ja">はい、～をどうぞ</div><div class="ex"><b>Here&#x27;s</b> a present for you.</div><div class="xj">はい、どうぞ。あなたへのプレゼントです。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">No, thanks.</span><span class="star">★</span></div><div class="ja">いいえ、けっこうです</div><div class="ex">A: Do you want some more juice?<br>B: <b>No, thanks</b>. I&#x27;m full.</div><div class="xj">A：ジュースをもう少しどう？ B：いいえ、けっこうです。おなかがいっぱいです。</div></button></li><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">Why not?</span><span class="star">★</span></div><div class="ja">どうして（～ないの）？・もちろん</div><div class="ex">A: I don&#x27;t like carrots.<br>B: <b>Why not</b>? They&#x27;re delicious!</div><div class="xj">A：ニンジンは好きじゃないんだ。 B：どうして？おいしいのに！</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">How about ～?</span><span class="star">★</span></div><div class="ja">～はどうですか</div><div class="ex"><b>How about</b> this blue T-shirt?</div><div class="xj">この青いTシャツはどうですか。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">What&#x27;s wrong?</span><span class="star">★</span></div><div class="ja">どうしたの？</div><div class="ex">A: <b>What&#x27;s wrong</b>?<br>B: I can&#x27;t find my pen.</div><div class="xj">A：どうしたの？ B：ペンが見つからないんです。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">Are you OK?</span><span class="star">★</span></div><div class="ja">だいじょうぶ？</div><div class="ex">A: Ouch!<br>B: <b>Are you OK</b>?</div><div class="xj">A：いたっ！ B：だいじょうぶ？</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">You don&#x27;t look well.</span><span class="star">★</span></div><div class="ja">具合が悪そうだね</div><div class="ex">A: <b>You don&#x27;t look well</b>.<br>B: I have a headache.</div><div class="xj">A：具合が悪そうだね。 B：頭が痛いんです。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">That&#x27;s too bad.</span><span class="star">★</span></div><div class="ja">それは残念だね</div><div class="ex">A: I can&#x27;t go to the concert.<br>B: <b>That&#x27;s too bad</b>.</div><div class="xj">A：コンサートに行けないんだ。 B：それは残念だね。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">Don&#x27;t worry.</span><span class="star">★</span></div><div class="ja">心配しないで
