ex">I like my <b>class</b>.</div><div class="xj">私は自分のクラスが好きです。</div></button></li><li><button class="w" data-no="復6"><div class="top"><span class="no">復6</span><span class="en">new</span><span class="star">★★★</span></div><div class="ja">新しい</div><div class="ex">We have a <b>new</b> teacher.</div><div class="xj">私たちには新しい先生がいます。</div></button></li><li><button class="w" data-no="復7"><div class="top"><span class="no">復7</span><span class="en">long</span><span class="star">★★★</span></div><div class="ja">長い</div><div class="ex">This pencil is <b>long</b>.</div><div class="xj">このえんぴつは長いです。</div></button></li><li><button class="w" data-no="復8"><div class="top"><span class="no">復8</span><span class="en">nice</span><span class="star">★★★</span></div><div class="ja">すてきな</div><div class="ex">Your bag is very <b>nice</b>.</div><div class="xj">あなたのかばんはとてもすてきです。</div></button></li><li><button class="w" data-no="復9"><div class="top"><span class="no">復9</span><span class="en">like</span><span class="star">★★★</span></div><div class="ja">好きである</div><div class="ex">I <b>like</b> cats very much.</div><div class="xj">私はネコがとても好きです。</div></button></li><li><button class="w" data-no="復10"><div class="top"><span class="no">復10</span><span class="en">play</span><span class="star">★★★</span></div><div class="ja">（スポーツを）する・（楽器を）ひく</div><div class="ex">My brother <b>plays</b> baseball every day.</div><div class="xj">私の兄は毎日野球をします。</div></button></li><li><button class="w" data-no="復11"><div class="top"><span class="no">復11</span><span class="en">have</span><span class="star">★★★</span></div><div class="ja">持っている・食べる</div><div class="ex">Do you <b>have</b> a pen?</div><div class="xj">あなたはペンを持っていますか。</div></button></li><li><button class="w" data-no="復12"><div class="top"><span class="no">復12</span><span class="en">want</span><span class="star">★★★</span></div><div class="ja">ほしい</div><div class="ex">I <b>want</b> a cute dog.</div><div class="xj">私はかわいい犬がほしいです。</div></button></li><li><button class="w" data-no="復13"><div class="top"><span class="no">復13</span><span class="en">study</span><span class="star">★★★</span></div><div class="ja">勉強する</div><div class="ex">Tom <b>studies</b> Japanese at home.</div><div class="xj">トムは家で日本語を勉強します。</div></button></li><li><button class="w" data-no="復14"><div class="top"><span class="no">復14</span><span class="en">mother</span><span class="star">★★★</span></div><div class="ja">母</div><div class="ex">My <b>mother</b> cooks dinner every day.</div><div class="xj">私の母は毎日夕ごはんを作ります。</div></button></li><li><button class="w" data-no="復15"><div class="top"><span class="no">復15</span><span class="en">father</span><span class="star">★★★</span></div><div class="ja">父</div><div class="ex">My <b>father</b> goes to work by car.</div><div class="xj">私の父は車で仕事に行きます。</div></button></li><li><button class="w" data-no="復16"><div class="top"><span class="no">復16</span><span class="en">boy</span><span class="star">★★★</span></div><div class="ja">男の子</div><div class="ex">That <b>boy</b> is my brother.</div><div class="xj">あの男の子は私の弟です。</div></button></li><li><button class="w" data-no="復17"><div class="top"><span class="no">復17</span><span class="en">girl</span><span class="star">★★★</span></div><div class="ja">女の子</div><div class="ex">The <b>girl</b> with long hair is Lisa.</div><div class="xj">かみの長い女の子はリサです。</div></button></li><li><button class="w" data-no="復18"><div class="top"><span class="no">復18</span><span class="en">write</span><span class="star">★★★</span></div><div class="ja">書く</div><div class="ex">Please <b>write</b> your name.</div><div class="xj">あなたの名前を書いてください。</div></button></li><li><button class="w" data-no="復19"><div class="top"><span class="no">復19</span><span class="en">come</span><span class="star">★★★</span></div><div class="ja">来る</div><div class="ex">Please <b>come</b> to my party.</div><div class="xj">私のパーティーに来てください。</div></button></li><li><button class="w" data-no="復20"><div class="top"><span class="no">復20</span><span class="en">go</span><span class="star">★★★</span></div><div class="ja">行く</div><div class="ex">Let&#x27;s <b>go</b> to the park.</div><div class="xj">公園に行きましょう。</div></button></li><li><button class="w" data-no="復21"><div class="top"><span class="no">復21</span><span class="en">look</span><span class="star">★★★</span></div><div class="ja">見る</div><div class="ex"><b>Look</b> at the blackboard.</div><div class="xj">黒板を見てください。</div></button></li><li><button class="w" data-no="復22"><div class="top"><span class="no">復22</span><span class="en">house</span><span class="star">★★★</span></div><div class="ja">家</div><div class="ex">That white <b>house</b> is Ken&#x27;s.</div><div class="xj">あの白い家はケンの家です。</div></button></li><li><button class="w" data-no="復23"><div class="top"><span class="no">復23</span><span class="en">watch</span><span class="star">★★★</span></div><div class="ja">（テレビなどを）見る</div><div class="ex">Ken is <b>watching</b> TV now.</div><div class="xj">ケンは今テレビを見ています。</div></button></li><li><button class="w" data-no="復24"><div class="top"><span class="no">復24</span><span class="en">talk</span><span class="star">★★★</span></div><div class="ja">話す・しゃべる</div><div class="ex">Ken is <b>talking</b> with Tom.</div><div class="xj">ケンはトムと話しています。</div></button></li><li><button class="w" data-no="復25"><div class="top"><span class="no">復25</span><span class="en">Saturday</span><span class="star">★★★</span></div><div class="ja">土曜日</div><div class="ex">I have no school on <b>Saturday</b>.</div><div class="xj">土曜日は学校がありません。</div></button></li><li><button class="w" data-no="復26"><div class="top"><span class="no">復26</span><span class="en">week</span><span class="star">★★★</span></div><div class="ja">週</div><div class="ex">I study English three days a <b>week</b>.</div><div class="xj">私は週に3日、英語を勉強します。</div></button></li><li><button class="w" data-no="復27"><div class="top"><span class="no">復27</span><span class="en">tomorrow</span><span class="star">★★★</span></div><div class="ja">明日</div><div class="ex">See you <b>tomorrow</b>!</div><div class="xj">また明日会いましょう！</div></button></li><li><button class="w" data-no="復28"><div class="top"><span class="no">復28</span><span class="en">time</span><span class="star">★★★</span></div><div class="ja">時間・時刻</div><div class="ex">Do you have <b>time</b> now?</div><div class="xj">あなたは今時間がありますか。</div></button></li><li><button class="w" data-no="復29"><div class="top"><span class="no">復29</span><span class="en">restaurant</span><span class="star">★★★</span></div><div class="ja">レストラン</div><div class="ex">Let&#x27;s go to that <b>restaurant</b>.</div><div class="xj">あのレストランに行きましょう。</div></button></li><li><button class="w" data-no="復30"><div class="top"><span class="no">復30</span><span class="en">home</span><span class="star">★★★</span></div><div class="ja">家（で）・家庭</div><div class="ex">Ken is at <b>home</b> now.</div><div class="xj">ケンは今家にいます。</div></button></li><li><button class="w" data-no="復31"><div class="top"><span class="no">復31</span><span class="en">car</span><span class="star">★★★</span></div><div class="ja">車</div><div class="ex">Dad is washing the <b>car</b>.</div><div class="xj">お父さんは車を洗っています。</div></button></li><li><button class="w" data-no="復32"><div class="top"><span class="no">復32</span><span class="en">practice</span><span class="star">★★★</span></div><div class="ja">練習（する）</div><div class="ex">We <b>practice</b> soccer every day.</div><div class="xj">私たちは毎日サッカーを練習します。</div></button></li><li><button class="w" data-no="復33"><div class="top"><span class="no">復33</span><span class="en">every</span><span class="star">★★★</span></div><div class="ja">毎～</div><div class="ex">I play tennis <b>every</b> day.</div><div class="xj">私は毎日テニスをします。</div></button></li><li><button class="w" data-no="復34"><div class="top"><span class="no">復34</span><span class="en">very</span><span class="star">★★★</span></div><div class="ja">とても</div><div class="ex">It&#x27;s <b>very</b> cold today.</div><div class="xj">今日はとても寒いです。</div></bu
