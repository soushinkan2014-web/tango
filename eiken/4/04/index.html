</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検4級　第4回</h1><div class="sub">お願い・お手伝い・体調　No.121〜160</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">must</span><span class="star">★★★</span></div><div class="ja">～しなければならない</div><div class="ex">You <b>must</b> wash your hands before lunch.</div><div class="xj">昼ごはんの前に手をあらわなければなりません。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">have to ～</span><span class="star">★</span></div><div class="ja">～しなければならない</div><div class="ex">I <b>have to</b> go home by five.</div><div class="xj">私は5時までに家に帰らなければなりません。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">should</span><span class="star">★★★</span></div><div class="ja">～したほうがよい</div><div class="ex">You <b>should</b> take an umbrella.</div><div class="xj">かさを持っていったほうがよいです。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">May I ～?</span><span class="star">★</span></div><div class="ja">～してもいいですか</div><div class="ex"><b>May I</b> open the window?</div><div class="xj">まどを開けてもいいですか。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">Could you ～?</span><span class="star">★</span></div><div class="ja">～していただけませんか</div><div class="ex"><b>Could you</b> help me with my homework?</div><div class="xj">宿題を手伝っていただけませんか。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">Shall I ～?</span><span class="star">★</span></div><div class="ja">（私が）～しましょうか</div><div class="ex"><b>Shall I</b> carry your bag?</div><div class="xj">かばんを運びましょうか。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">housework</span><span class="star">★★★</span></div><div class="ja">家事</div><div class="ex">I help with the <b>housework</b> on Sundays.</div><div class="xj">私は日曜日に家事を手伝います。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">dish</span><span class="star">★★</span></div><div class="ja">皿・料理</div><div class="ex">Ken washed the <b>dishes</b> after dinner.</div><div class="xj">ケンは夕ごはんのあと、皿をあらいました。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">garbage</span><span class="star">★★</span></div><div class="ja">ごみ</div><div class="ex">Tom takes out the <b>garbage</b> every Monday.</div><div class="xj">トムは毎週月曜日にごみを出します。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">pet</span><span class="star">★★★</span></div><div class="ja">ペット</div><div class="ex">Do you have a <b>pet</b>?</div><div class="xj">あなたはペットをかっていますか。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">key</span><span class="star">★★★</span></div><div class="ja">かぎ</div><div class="ex">I can&#x27;t find my <b>key</b>.</div><div class="xj">私のかぎが見つかりません。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">box</span><span class="star">★★</span></div><div class="ja">箱</div><div class="ex">What&#x27;s in this <b>box</b>?</div><div class="xj">この箱の中には何が入っていますか。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">knife</span><span class="star">★★★</span></div><div class="ja">ナイフ</div><div class="ex">Please be careful with that <b>knife</b>.</div><div class="xj">そのナイフには気をつけてください。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">vegetable</span><span class="star">★★★</span></div><div class="ja">野菜</div><div class="ex">We buy <b>vegetables</b> at this store.</div><div class="xj">私たちはこのお店で野菜を買います。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">coffee</span><span class="star">★★★</span></div><div class="ja">コーヒー</div><div class="ex">My father drinks <b>coffee</b> every morning.</div><div class="xj">お父さんは毎朝コーヒーを飲みます。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">bottle</span><span class="star">★★</span></div><div class="ja">びん・ボトル</div><div class="ex">Ken has a <b>bottle</b> of water.</div><div class="xj">ケンは水の入ったボトルを持っています。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">dessert</span><span class="star">★★★</span></div><div class="ja">デザート</div><div class="ex">We had ice cream for <b>dessert</b>.</div><div class="xj">私たちはデザートにアイスクリームを食べました。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">chocolate</span><span class="star">★★★</span></div><div class="ja">チョコレート</div><div class="ex">May I have some <b>chocolate</b>?</div><div class="xj">チョコレートをもらってもいいですか。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">glasses</span><span class="star">★★</span></div><div class="ja">めがね</div><div class="ex">My grandfather wears <b>glasses</b>.</div><div class="xj">おじいさんはめがねをかけています。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">borrow</span><span class="star">★★★</span></div><div class="ja">借りる</div><div class="ex">Can I <b>borrow</b> your eraser?</div><div class="xj">あなたの消しゴムを借りてもいいですか。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">lend</span><span class="star">★★</span></div><div class="ja">貸す</div><div class="ex">I will <b>lend</b> you this book.</div><div class="xj">この本をあなたに貸します。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">pass</span><span class="star">★★</span></div><div class="ja">手わたす</div><div class="ex">Please <b>pass</b> this letter to Emi.</div><div class="xj">この手紙をエミに手わたしてください。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">check</span><span class="star">★★★</span></div><div class="ja">調べる・確かめる</div><div class="ex">Let&#x27;s <b>check</b> the weather on TV.</div><div class="xj">テレビで天気を調べましょう。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">careful</span><span class="star">★★★</span></div><div class="ja">注意深い（Be careful. 気をつけて）</div><div class="ex">Be <b>careful</b>! The floor is wet.</div><div class="xj">気をつけて！ゆかがぬれています。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">rule</span><span class="star">★★</span></div><div class="ja">きまり・ルール</div><div class="ex">We have many <b>rules</b> at school.</div><div class="xj">学校にはたくさんのきまりがあります。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">uniform</span><span class="star">★★</span></div><div class="ja">制服・ユニフォーム</div><div class="ex">We wear a <b>uniform</b> at our school.</div><div class="xj">私たちの学校では制服を着ます。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">ready</span><span class="star">★★★</span></div><div class="ja">用意ができて</div><div class="ex">Dinner is <b>ready</b>, Ken!</div><div class="xj">ケン、夕ごはんの用意ができましたよ！</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">toy</span><span class="star">★★★</span></div><div class="ja">おもちゃ</div><div class="ex">Please put your <b>toys</b> in the box.</div><div class="xj">おもちゃを箱に入れてください。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">wet</span><span class="star">★★</span></div><div class="ja">ぬれた</div><div class="ex">My shoes got <b>wet</b> in the rain.</div><div class="xj">雨でくつがぬれてしまいました。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">full</span><span class="star">★★</span></div><div class="ja">いっぱいの・満腹の</div><div class="ex">The bus was <b>full</b> of people.</div><div class="xj">バスは人でいっぱいでした。</div></button></li><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">sick</span><span class="star">★★★</span></div><div class="ja">病気の</div><div class="ex">Tom is <b>sick</b> in bed today.</div><div class="xj">トムは今日、病気でねています。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">have a cold</span><span class="star">★</span></div><div class="ja">かぜをひいている</div><div class="ex">Emi <b>has a cold</b> today.</div><div class="xj">エミは今日、かぜをひいています。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">fever</span><span class="star">★</span></div><div class="ja">熱</div><div class="ex">I had a high <b>fever</b> last night.</div><div class="xj">私はきのうの夜、高い熱が出ました。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">medicine</span><span class="star">★★</span></div><div class="ja">薬</div><div class="ex">You should take this <b>medicine</b>.</div><div class="xj">この薬を飲んだほうがよいです。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">headache</span><span class="star">★</span></div><div class="ja">頭痛</div><div class="ex">My mother has a <b>headache</b> today.</div><div class="xj">お母さんは今日、頭痛がします。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">floor</span><span class="star">★★★</span></div><div class="ja">ゆか・～階</div><div class="ex">Don&#x27;t sit on the <b>floor</b>.</div><div class="xj">ゆかにすわってはいけません。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">hurt</span><span class="star">★★</span></div><div class="ja">痛む・けがをさせる</div><div class="ex">My leg <b>hurts</b> a lot.</div><div class="xj">足がとても痛みます。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">alone</span><span class="star">★★</span></div><div class="ja">ひとりで</div><div class="ex">Can you go there <b>alone</b>?</div><div class="xj">あなたはひとりでそこへ行けますか。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">healthy</span><span class="star">★★</span></div><div class="ja">健康な</div><div class="ex">My grandmother is very <b>healthy</b>.</div><div class="xj">おばあさんはとても健康です。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">thirsty</span><span class="star">★★</span></div><div class="ja">のどがかわいた</div><div class="ex">I&#x27;m so <b>thirsty</b>. Let&#x27;s buy some juice.</div><div class="xj">とてものどがかわきました。ジュースを買いましょう。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"121": 4.72, "122": 18.82, "123": 32.43, "124": 45.17, "125": 58.05, "126": 71.49, "127": 84.66, "128": 97.66, "129": 110.88, "130": 124.06, "131": 135.79, "132": 148.12, "133": 160.14, "134": 172.76, "135": 185.43, "136": 198.53, "137": 211.03, "138": 223.65, "139": 235.76, "140": 248.74, "141": 260.55, "142": 272.76, "143": 285.36, "144": 298.82, "145": 315.16, "146": 328.11, "147": 341.43, "148": 354.05, "149": 366.81, "150": 379.38, "151": 392.7, "152": 405.34, "153": 418.16, "154": 430.9, "155": 443.18, "156": 455.82, "157": 468.61, "158": 481.66, "159": 493.61, "160": 506.28}, "TE": {"121": 6.59, "122": 20.7, "123": 34.3, "124": 47.04, "125": 59.92, "126": 73.36, "127": 86.53, "128": 99.54, "129": 112.76, "130": 125.93, "131": 137.66, "132": 149.99, "133": 162.01, "134": 174.63, "135": 187.3, "136": 200.4, "137": 212.9, "138": 225.52, "139": 237.71, "140": 250.42, "141": 262.42, "142": 274.63, "143": 287.23, "144": 300.69, "145": 317.03, "146": 329.98, "147": 343.3, "148": 355.92, "149": 368.68, "150": 381.26, "151": 394.57, "152": 407.31, "153": 420.03, "154": 432.77, "155": 445.05, "156": 457.7, "157": 470.48, "158": 483.54, "159": 495.48, "160": 508.15}, "Q": [[121, "must", "～しなければならない"], [122, "have to ～", "～しなければならない"], [123, "should", "～したほうがよい"], [124, "May I ～?", "～してもいいですか"], [125, "Could you ～?", "～していただけませんか"], [126, "Shall I ～?", "～しましょうか"], [127, "housework", "家事"], [128, "dish", "皿・料理"], [129, "garbage", "ごみ"], [130, "pet", "ペット"], [131, "key", "かぎ"], [132, "box", "箱"], [133, "knife", "ナイフ"], [134, "vegetable", "野菜"], [135, "coffee", "コーヒー"], [136, "bottle", "びん・ボトル"], [137, "dessert", "デザート"], [138, "chocolate", "チョコレート"], [139, "glasses", "めがね"], [140, "borrow", "借りる"
