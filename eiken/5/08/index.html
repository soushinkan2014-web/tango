日</div><div class="ex">A: What day is it today?<br>B: It&#x27;s <b>Thursday</b>.</div><div class="xj">A：今日は何曜日ですか。 B：木曜日です。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">Friday</span><span class="star">★★★</span></div><div class="ja">金曜日</div><div class="ex">Ken swims on <b>Fridays</b>.</div><div class="xj">ケンは毎週金曜日に泳ぎます。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">Saturday</span><span class="star">★★★</span></div><div class="ja">土曜日</div><div class="ex">I have no school on <b>Saturday</b>.</div><div class="xj">土曜日は学校がありません。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">week</span><span class="star">★★★</span></div><div class="ja">週</div><div class="ex">I study English three days a <b>week</b>.</div><div class="xj">私は週に3日、英語を勉強します。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">month</span><span class="star">★★★</span></div><div class="ja">月（1か月）</div><div class="ex">I read five books a <b>month</b>.</div><div class="xj">私は月に5さつ本を読みます。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">year</span><span class="star">★★★</span></div><div class="ja">年</div><div class="ex">A <b>year</b> has twelve months.</div><div class="xj">1年は12か月です。</div></button></li><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">today</span><span class="star">★★★</span></div><div class="ja">今日</div><div class="ex">I have no homework <b>today</b>.</div><div class="xj">今日は宿題がありません。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">tomorrow</span><span class="star">★★★</span></div><div class="ja">明日</div><div class="ex">See you <b>tomorrow</b>!</div><div class="xj">また明日会いましょう！</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">time</span><span class="star">★★★</span></div><div class="ja">時間・時刻</div><div class="ex">Do you have <b>time</b> now?</div><div class="xj">あなたは今時間がありますか。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">hour</span><span class="star">★★★</span></div><div class="ja">1時間</div><div class="ex">I study for an <b>hour</b> every day.</div><div class="xj">私は毎日1時間勉強します。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">o&#x27;clock</span><span class="star">★★★</span></div><div class="ja">～時（ちょうど）</div><div class="ex">I get up at six <b>o&#x27;clock</b>.</div><div class="xj">私は6時に起きます。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">birthday</span><span class="star">★★★</span></div><div class="ja">誕生日</div><div class="ex">Happy <b>birthday</b>, Emi!</div><div class="xj">エミ、誕生日おめでとう！</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">April</span><span class="star">★★★</span></div><div class="ja">4月</div><div class="ex">We go on a picnic in <b>April</b>.</div><div class="xj">私たちは4月にピクニックに行きます。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">September</span><span class="star">★★</span></div><div class="ja">9月</div><div class="ex"><b>September</b> is the ninth month.</div><div class="xj">9月は9番目の月です。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">October</span><span class="star">★★</span></div><div class="ja">10月</div><div class="ex">Halloween is in <b>October</b>.</div><div class="xj">ハロウィーンは10月にあります。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">December</span><span class="star">★★</span></div><div class="ja">12月</div><div class="ex">We have winter vacation in <b>December</b>.</div><div class="xj">12月には冬休みがあります。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"141": 4.64, "142": 17.48, "143": 29.62, "144": 42.29, "145": 55.44, "146": 70.33, "147": 83.07, "148": 96.22, "149": 109.44, "150": 122.52, "151": 135.11, "152": 147.73, "153": 159.87, "154": 172.32, "155": 185.38, "156": 198.55, "157": 211.22, "158": 223.91, "159": 237.01, "160": 249.7}, "TE": {"141": 6.59, "142": 19.35, "143": 31.54, "144": 44.21, "145": 57.33, "146": 72.2, "147": 85.06, "148": 98.09, "149": 111.31, "150": 124.39, "151": 136.98, "152": 149.65, "153": 161.74, "154": 174.2, "155": 187.34, "156": 200.42, "157": 213.09, "158": 225.95, "159": 238.98, "160": 251.62}, "Q": [[141, "Sunday", "日曜日"], [142, "Monday", "月曜日"], [143, "Tuesday", "火曜日"], [144, "Wednesday", "水曜日"], [145, "Thursday", "木曜日"], [146, "Friday", "金曜日"], [147, "Saturday", "土曜日"], [148, "week", "週"], [149, "month", "月"], [150, "year", "年"], [151, "today", "今日"], [152, "tomorrow", "明日"], [153, "time", "時間・時刻"], [154, "hour", "1時間"], [155, "o'clock", "～時"], [156, "birthday", "誕生日"], [157, "April", "4月"], [158, "September", "9月"], [159, "October", "10月"], [160, "December", "12月"]], "KEY": "e5-08"};</script><script src="../../../app.js?v=2"></script></body></html>
