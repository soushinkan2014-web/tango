</span><span class="star">★★★</span></div><div class="ja">来る</div><div class="ex">Please <b>come</b> to my party.</div><div class="xj">私のパーティーに来てください。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">go</span><span class="star">★★★</span></div><div class="ja">行く</div><div class="ex">Let&#x27;s <b>go</b> to the park.</div><div class="xj">公園に行きましょう。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">look</span><span class="star">★★★</span></div><div class="ja">見る</div><div class="ex"><b>Look</b> at the blackboard.</div><div class="xj">黒板を見てください。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">listen</span><span class="star">★★★</span></div><div class="ja">聞く</div><div class="ex">I <b>listen</b> to the radio every night.</div><div class="xj">私は毎晩ラジオを聞きます。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">wait</span><span class="star">★★</span></div><div class="ja">待つ</div><div class="ex">A: Let&#x27;s go, Ken.<br>B: <b>Wait</b> a minute!</div><div class="xj">A：ケン、行きましょう。 B：ちょっと待ってください！</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">walk</span><span class="star">★★★</span></div><div class="ja">歩く</div><div class="ex">I <b>walk</b> to school every day.</div><div class="xj">私は毎日歩いて学校に行きます。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">make</span><span class="star">★★★</span></div><div class="ja">作る</div><div class="ex">I can <b>make</b> a paper plane.</div><div class="xj">私は紙飛行機を作ることができます。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">use</span><span class="star">★★★</span></div><div class="ja">使う</div><div class="ex"
