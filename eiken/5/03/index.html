v></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">tennis</span><span class="star">★★★</span></div><div class="ja">テニス</div><div class="ex">Lisa plays <b>tennis</b> with her mother.</div><div class="xj">リサはお母さんとテニスをします。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">basketball</span><span class="star">★★★</span></div><div class="ja">バスケットボール</div><div class="ex">I play <b>basketball</b> with my friends.</div><div class="xj">私は友だちとバスケットボールをします。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">volleyball</span><span class="star">★★</span></div><div class="ja">バレーボール</div><div class="ex">My sister likes <b>volleyball</b>.</div><div class="xj">私の姉はバレーボールが好きです。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">music</span><span class="star">★★★</span></div><div class="ja">音楽</div><div class="ex">I like <b>music</b> class.</div><div class="xj">私は音楽の授業が好きです。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">piano</span><span class="star">★★★</span></div><div class="ja">ピアノ</div><div class="ex">Emi plays the <b>piano</b> well.</div><div class="xj">エミはピアノを上手にひきます。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">guitar</span><span class="star">★★★</span></div><div class="ja">ギター</div><div class="ex">Do you play the <b>guitar</b>?</div><div class="xj">あなたはギターをひきますか。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">sport</span><span class="star">★★★</span></div><div class="ja">スポーツ</div><div class="ex">My favorite <b>sport</b> is tennis.</div><div class="xj">私のいちばん好きなスポーツはテニスです。</div></button></li><li><button class="w" data-no="60"><di
