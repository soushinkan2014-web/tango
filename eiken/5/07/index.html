s <b>pizza</b> very much.</div><div class="xj">トムはピザが大好きです。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">bread</span><span class="star">★★</span></div><div class="ja">パン</div><div class="ex">I like <b>bread</b> with jam.</div><div class="xj">私はジャムをつけたパンが好きです。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">rice</span><span class="star">★★</span></div><div class="ja">ごはん・米</div><div class="ex">Japanese people eat <b>rice</b>.</div><div class="xj">日本の人々はごはんを食べます。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">milk</span><span class="star">★★★</span></div><div class="ja">牛乳</div><div class="ex">I like cold <b>milk</b>.</div><div class="xj">私は冷たい牛乳が好きです。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">juice</span><span class="star">★★</span></div><div class="ja">ジュース</div><div class="ex">Ken is drinking apple <b>juice</b>.</div><div class="xj">ケンはリンゴジュースを飲んでいます。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">tea</span><span class="star">★★★</span></div><div class="ja">お茶・紅茶</div><div class="ex">A: Do you want some <b>tea</b>?<br>B: Yes, please.</div><div class="xj">A：お茶はいかがですか。 B：はい、お願いします。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">water</span><span class="star">★★</span></div><div class="ja">水</div><div class="ex">This <b>water</b> is cold.</div><div class="xj">この水は冷たいです。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">sandwich</span><span class="star">★★★</span></div><div class="ja">サンドイッチ</div><div class="ex">Emi is making <b>sandwiches</b> now.</div><div class="xj">エミは今サンドイッチを作っています。</div
