lass="ex">Let&#x27;s go to that <b>restaurant</b>.</div><div class="xj">あのレストランに行きましょう。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">shop</span><span class="star">★★★</span></div><div class="ja">店</div><div class="ex">This <b>shop</b> has good bread.</div><div class="xj">この店のパンはおいしいです。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">zoo</span><span class="star">★★★</span></div><div class="ja">動物園</div><div class="ex">We can see lions at the <b>zoo</b>.</div><div class="xj">動物園でライオンを見ることができます。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">museum</span><span class="star">★★★</span></div><div class="ja">博物館・美術館</div><div class="ex">Emi and I are at the <b>museum</b>.</div><div class="xj">エミと私は博物館にいます。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">post office</span><span class="star">★</span></div><div class="ja">郵便局</div><div class="ex">The <b>post office</b> opens at nine.</div><div class="xj">郵便局は9時に開きます。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">home</span><span class="star">★★★</span></div><div class="ja">家（で）・家庭</div><div class="ex">Ken is at <b>home</b> now.</div><div class="xj">ケンは今家にいます。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">bus</span><span class="star">★★★</span></div><div class="ja">バス</div><div class="ex">The <b>bus</b> is coming.</div><div class="xj">バスが来ています。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">train</span><span class="star">★★★</span></div><div class="ja">電車</div><div class="ex">Tom likes <b>trains</b> very much.</div><div class="xj">トムは電車が大好きです。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">car</span><span class="star">★★★</span></div><div class="ja">車</div><div class="ex">Dad is washing the <b>car</b>.</div><div class="xj">お父さんは車を洗っています。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">bike</span><span class="star">★★★</span></div><div class="ja">自転車</div><div class="ex">I go to the park by <b>bike</b>.</div><div class="xj">私は自転車で公園に行きます。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">garden</span><span class="star">★★★</span></div><div class="ja">庭</div><div class="ex">Mom is in the <b>garden</b> now.</div><div class="xj">お母さんは今庭にいます。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">tree</span><span class="star">★★★</span></div><div class="ja">木</div><div class="ex">Look at that tall <b>tree</b>.</div><div class="xj">あの高い木を見てください。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">flower</span><span class="star">★★★</span></div><div class="ja">花</div><div class="ex">Emi likes yellow <b>flowers</b>.</div><div class="xj">エミは黄色い花が好きです。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">river</span><span class="star">★★</span></div><div class="ja">川</div><div class="ex">We swim in the <b>river</b> in summer.</div><div class="xj">私たちは夏に川で泳ぎます。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">bridge</span><span class="star">★★</span></div><div class="ja">橋</div><div class="ex">That <b>bridge</b> is very long.</div><div class="xj">あの橋はとても長いです。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">
