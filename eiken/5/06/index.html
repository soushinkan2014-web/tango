">Our <b>bathroom</b> is very clean.</div><div class="xj">うちのふろ場はとてもきれいです。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">window</span><span class="star">★★★</span></div><div class="ja">窓</div><div class="ex">Can I open the <b>window</b>?</div><div class="xj">窓を開けてもいいですか。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">door</span><span class="star">★★★</span></div><div class="ja">ドア</div><div class="ex">Ken is opening the <b>door</b>.</div><div class="xj">ケンはドアを開けています。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">bed</span><span class="star">★★★</span></div><div class="ja">ベッド</div><div class="ex">My <b>bed</b> is new.</div><div class="xj">私のベッドは新しいです。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">table</span><span class="star">★★★</span></div><div class="ja">テーブル</div><div class="ex">The <b>table</b> in the kitchen is big.</div><div class="xj">台所のテーブルは大きいです。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">wall</span><span class="star">★★★</span></div><div class="ja">かべ</div><div class="ex">Lisa&#x27;s picture is on the <b>wall</b>.</div><div class="xj">リサの絵がかべにかかっています。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">TV</span><span class="star">★★★</span></div><div class="ja">テレビ</div><div class="ex">The <b>TV</b> is next to the window.</div><div class="xj">テレビは窓のとなりにあります。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">computer</span><span class="star">★★★</span></div><div class="ja">コンピューター</div><div class="ex">Tom is using the <b>computer</b>.</div><div class="xj">トムはコンピューターを使っています。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">phone</span><span class="star">★★★</span></div><div class="ja">電話</div><div class="ex">Mom is talking on the <b>phone</b>.</div><div class="xj">お母さんは電話で話しています。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">clock</span><span class="star">★★★</span></div><div class="ja">時計</div><div class="ex">That <b>clock</b> is very old.</div><div class="xj">あの時計はとても古いです。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">wash</span><span class="star">★★★</span></div><div class="ja">洗う</div><div class="ex">I <b>wash</b> the dishes with my mother.</div><div class="xj">私は母といっしょにお皿を洗います。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">clean</span><span class="star">★★★</span></div><div class="ja">そうじする</div><div class="ex">We <b>clean</b> our classroom every day.</div><div class="xj">私たちは毎日教室をそうじします。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">sleep</span><span class="star">★★★</span></div><div class="ja">ねむる</div><div class="ex">My dog <b>sleeps</b> in my room.</div><div class="xj">私の犬は私の部屋でねむります。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">watch</span><span class="star">★★★</span></div><div class="ja">（テレビなどを）見る</div><div class="ex">Ken is <b>watching</b> TV now.</div><div class="xj">ケンは今テレビを見ています。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">talk</span><span class="star">★★★</span></div><div class="ja">話す・しゃべる</div><div class="ex">Ken is <b>talking</b> with Tom.</div><div class="xj">ケンはトムと話しています。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">bath</span><span class="star">★★</span></div><div class="ja">ふろ</div><div class="ex">I take a <b>bath</b> at nine.</div><div class="xj">私は9時にふろに入ります。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"101": 4.6, "102": 17.26, "103": 29.28, "104": 41.88, "105": 54.48, "106": 67.72, "107": 79.86, "108": 92.34, "109": 104.45, "110": 117.17, "111": 129.88, "112": 142.82, "113": 155.46, "114": 168.13, "115": 180.8, "116": 193.78, "117": 206.76, "118": 219.5, "119": 232.55, "120": 245.5}, "TE": {"101": 6.47, "102": 19.14, "103": 31.16, "104": 43.75, "105": 56.37, "106": 69.59, "107": 81.73, "108": 94.21, "109": 106.32, "110": 119.04, "111": 131.76, "112": 144.71, "113": 157.33, "114": 170.0, "115": 182.72, "116": 195.65, "117": 208.63, "118": 221.37, "119": 234.42, "120": 247.38}, "Q": [[101, "house", "家"], [102, "room", "部屋"], [103, "kitchen", "台所"], [104, "bedroom", "寝室"], [105, "bathroom", "ふろ場・トイレ"], [106, "window", "窓"], [107, "door", "ドア"], [108, "bed", "ベッド"], [109, "table", "テーブル"], [110, "wall", "かべ"], [111, "TV", "テレビ"], [112, "computer", "コンピューター"], [113, "phone", "電話"], [114, "clock", "時計"], [115, "wash", "洗う"], [116, "clean", "そうじする"], [117, "sleep", "ねむる"], [118, "watch", "見る"], [119, "talk", "話す・しゃべる"], [120, "bath", "ふろ"]], "KEY": "e5-06"};</script><script src="../../../app.js?v=2"></script></body></html>
