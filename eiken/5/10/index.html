y?</div><div class="xj">今日の天気はどうですか。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">spring</span><span class="star">★★</span></div><div class="ja">春</div><div class="ex">School starts in <b>spring</b> in Japan.</div><div class="xj">日本では春に学校が始まります。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">summer</span><span class="star">★★</span></div><div class="ja">夏</div><div class="ex">Do you like <b>summer</b>?</div><div class="xj">あなたは夏が好きですか。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">fall</span><span class="star">★★</span></div><div class="ja">秋</div><div class="ex">We have a sports day in <b>fall</b>.</div><div class="xj">秋には運動会があります。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">winter</span><span class="star">★★★</span></div><div class="ja">冬</div><div class="ex">We have snow in <b>winter</b>.</div><div class="xj">冬には雪がふります。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">head</span><span class="star">★★★</span></div><div class="ja">頭</div><div class="ex">Put your hands on your <b>head</b>.</div><div class="xj">両手を頭の上に置いてください。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">hand</span><span class="star">★★★</span></div><div class="ja">手</div><div class="ex">Put up your <b>hand</b>.</div><div class="xj">手をあげてください。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">face</span><span class="star">★★</span></div><div class="ja">顔</div><div class="ex">Wash your <b>face</b>, Ken.</div><div class="xj">ケン、顔を洗いなさい。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">1
