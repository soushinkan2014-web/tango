nese <b>history</b>.</div><div class="xj">ブラウンさんは日本の歴史が好きです。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">homework</span><span class="star">★★★</span></div><div class="ja">宿題</div><div class="ex">Do your <b>homework</b> now, Ken.</div><div class="xj">ケン、今宿題をしなさい。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">test</span><span class="star">★★★</span></div><div class="ja">テスト</div><div class="ex">I have a math <b>test</b> today.</div><div class="xj">今日は算数のテストがあります。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">lesson</span><span class="star">★★★</span></div><div class="ja">レッスン・授業</div><div class="ex">My piano <b>lesson</b> is at four.</div><div class="xj">私のピアノのレッスンは4時です。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">club</span><span class="star">★★★</span></div><div class="ja">クラブ・部活動</div><div class="ex">I am in the music <b>club</b>.</div><div class="xj">私は音楽クラブに入っています。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">practice</span><span class="star">★★★</span></div><div class="ja">練習（する）</div><div class="ex">We <b>practice</b> soccer every day.</div><div class="xj">私たちは毎日サッカーを練習します。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">picture</span><span class="star">★★★</span></div><div class="ja">絵・写真</div><div class="ex">Look at this <b>picture</b>.</div><div class="xj">この絵を見てください。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">letter</span><span class="star">★★★</span></div><div class="ja">手紙</div><div class="ex">I write a <b>letter</b> to my grandma.</div><div class="xj">私はおばあちゃんに手紙を書きます。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">song</span><span class="star">★★★</span></div><div class="ja">歌</div><div class="ex">I like this <b>song</b>.</div><div class="xj">私はこの歌が好きです。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">movie</span><span class="star">★★★</span></div><div class="ja">映画</div><div class="ex">We are watching a <b>movie</b> now.</div><div class="xj">私たちは今映画を見ています。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">game</span><span class="star">★★★</span></div><div class="ja">ゲーム・試合</div><div class="ex">Ken likes video <b>games</b>.</div><div class="xj">ケンはテレビゲームが好きです。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">camera</span><span class="star">★★★</span></div><div class="ja">カメラ</div><div class="ex">Ken is taking pictures with his <b>camera</b>.</div><div class="xj">ケンはカメラで写真をとっています。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">umbrella</span><span class="star">★★</span></div><div class="ja">かさ</div><div class="ex">Take your <b>umbrella</b>, Ken.</div><div class="xj">ケン、かさを持って行きなさい。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">shoes</span><span class="star">★★★</span></div><div class="ja">くつ</div><div class="ex">These <b>shoes</b> are new.</div><div class="xj">このくつは新しいです。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">shirt</span><span class="star">★★★</span></div><div class="ja">シャツ</div><div class="ex">I like your <b>shirt</b>.</div><div class="xj">私はあなたのシャツが好きです。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</s
