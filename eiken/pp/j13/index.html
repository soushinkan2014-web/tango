span></div><div class="ja">～する目的で</div><div class="ex">The city started the project with the aim of reducing traffic.</div><div class="xj">市は交通量を減らす目的でその計画を始めた。</div></button></li><li><button class="w" data-no="熟126"><div class="top"><span class="no">熟126</span><span class="en">end up ～ing</span></div><div class="ja">結局～することになる</div><div class="ex">We planned to go hiking, but we ended up staying home.</div><div class="xj">ハイキングに行く予定だったが、結局家にいることになった。</div></button></li><li><button class="w" data-no="熟127"><div class="top"><span class="no">熟127</span><span class="en">as a result of ～</span></div><div class="ja">～の結果として</div><div class="ex">As a result of the new rule, fewer students are late for school.</div><div class="xj">新しい規則の結果、遅刻する生徒が減った。</div></button></li><li><button class="w" data-no="熟128"><div class="top"><span class="no">熟128</span><span class="en">give rise to ～</span></div><div class="ja">～を引き起こす</div><div class="ex">The new factory gave rise to many problems in the town.</div><div class="xj">新しい工場は町に多くの問題を引き起こした。</div></button></li><li><button class="w" data-no="熟129"><div class="top"><span class="no">熟129</span><span class="en">in an effort to ～</span></div><div class="ja">～しようとして</div><div class="ex">The store lowered its prices in an effort to attract more customers.</div><div class="xj">その店はもっと客を集めようとして値段を下げた。</div></button></li><li><button class="w" data-no="熟130"><div class="top"><span class="no">熟130</span><span class="en">in response to ～</span></div><div class="ja">～に応えて</div><div class="ex">In response to many requests, the library now opens on Sundays.</div><div class="xj">多くの要望に応えて、図書館は日曜日も開くようになった。</div></button></li><li><button class="w" data-no="会61"><div class="top"><span class="no">会61</span><span class="en">I suppose so.</span></div><div class="ja">まあ、そうだと思う。</div><div class="ex">A: We should leave early to avoid traffic.<br>B: I suppose so.</div></button></li><li><button class="w" data-no="会62"><div class="top"><span class="no">会62</span><span class="en">You&#x27;re right.</span></div><div class="ja">そのとおりだね。</div><div class="ex">A: We need more practice before the game.<br>B: You&#x27;re right. Let&#x27;s practice on Saturday, too.</div></button></li><li><button class="w" data-no="会63"><div class="top"><span class="no">会63</span><span class="en">I don&#x27;t think so.</span></div><div class="ja">そうは思わない。</div><div class="ex">A: Do you think it&#x27;ll rain today?<br>B: I don&#x27;t think so. The sky is clear.</div></button></li><li><button class="w" data-no="会64"><div class="top"><span class="no">会64</span><span class="en">That&#x27;s not what I meant.</span></div><div class="ja">そういう意味じゃないよ。</div><div class="ex">A: So you don&#x27;t like my cooking?<br>B: That&#x27;s not what I meant. It&#x27;s just a little salty.</div></button></li><li><button class="w" data-no="会65"><div class="top"><span class="no">会65</span><span class="en">Fair enough.</span></div><div class="ja">もっともだね。／それでいいよ。</div><div class="ex">A: I&#x27;ll do the dishes if you cook.<br>B: Fair enough.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j12/">← 熟語 Set 12</a><a href="../j14/">熟語 Set 14 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟121": 5.82, "熟122": 21.99, "熟123": 38.09, "熟124": 52.08, "熟125": 66.19, "熟126": 82.5, "熟127": 98.51, "熟128": 114.1, "熟129": 128.72, "熟130": 143.81, "会61": 159.62, "会62": 176.56, "会63": 194.91, "会64": 212.37, "会65": 231.16}, "TE": {"熟121": 7.98, "熟122": 24.08, "熟123": 40.06, "熟124": 54.02, "熟125": 68.85, "熟126": 84.83, "熟127": 100.64, "熟128": 116.05, "熟129": 130.71, "熟130": 145.82, "会61": 161.78, "会62": 178.43, "会63": 196.95, "会64": 214.56, "会65": 233.1}, "Q": [["熟121", "for the benefit of ～", "～の利益のために、～のために"], ["熟122", "for fear of ～", "～を恐れて、～しないように"], ["熟123", "on account of ～", "～のために"], ["熟124", "so as to ～", "～するために"], ["熟125", "with the ai
