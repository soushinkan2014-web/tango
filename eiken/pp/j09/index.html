><div class="ex">After traveling around the world, he settled down in a small village.</div><div class="xj">世界中を旅したあと、彼は小さな村に落ち着いた。</div></button></li><li><button class="w" data-no="熟86"><div class="top"><span class="no">熟86</span><span class="en">slow down</span></div><div class="ja">速度を落とす</div><div class="ex">Please slow down. You&#x27;re driving too fast.</div><div class="xj">スピードを落として。速すぎるよ。</div></button></li><li><button class="w" data-no="熟87"><div class="top"><span class="no">熟87</span><span class="en">show off ～</span></div><div class="ja">～を見せびらかす</div><div class="ex">Taro showed off his new smartphone to everyone in class.</div><div class="xj">太郎はクラスのみんなに新しいスマホを見せびらかした。</div></button></li><li><button class="w" data-no="熟88"><div class="top"><span class="no">熟88</span><span class="en">set off</span></div><div class="ja">出発する</div><div class="ex">We set off early in the morning to avoid traffic.</div><div class="xj">渋滞を避けるため、私たちは朝早く出発した。</div></button></li><li><button class="w" data-no="熟89"><div class="top"><span class="no">熟89</span><span class="en">pass away</span></div><div class="ja">亡くなる</div><div class="ex">The famous actor passed away at the age of ninety.</div><div class="xj">その有名な俳優は90歳で亡くなった。</div></button></li><li><button class="w" data-no="熟90"><div class="top"><span class="no">熟90</span><span class="en">fill up ～</span></div><div class="ja">～をいっぱいにする</div><div class="ex">We stopped at a gas station to fill up the tank.</div><div class="xj">私たちはガソリンスタンドに寄って満タンにした。</div></button></li><li><button class="w" data-no="会41"><div class="top"><span class="no">会41</span><span class="en">Sounds great.</span></div><div class="ja">いいね。</div><div class="ex">A: Let&#x27;s go to the beach on Sunday.<br>B: Sounds great. I&#x27;ll bring some drinks.</div></button></li><li><button class="w" data-no="会42"><div class="top"><span class="no">会42</span><span class="en">Count me in.</span></div><div class="ja">私も参加するよ。</div><div class="ex">A: We&#x27;re playing soccer after school. Do you want to join?<br>B: Sure, count me in.</div></button></li><li><button class="w" data-no="会43"><div class="top"><span class="no">会43</span><span class="en">Maybe some other time.</span></div><div class="ja">また今度ね。（誘いを断る）</div><div class="ex">A: Do you want to see a movie tonight?<br>B: I&#x27;m busy tonight. Maybe some other time.</div></button></li><li><button class="w" data-no="会44"><div class="top"><span class="no">会44</span><span class="en">Why not?</span></div><div class="ja">もちろん、いいよ。</div><div class="ex">A: Shall we try that new ramen shop?<br>B: Why not? I&#x27;m hungry.</div></button></li><li><button class="w" data-no="会45"><div class="top"><span class="no">会45</span><span class="en">I&#x27;ll think about it.</span></div><div class="ja">考えておくね。</div><div class="ex">A: Would you like to join the drama club?<br>B: I&#x27;ll think about it.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j08/">← 熟語 Set 8</a><a href="../j10/">熟語 Set 10 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟81": 5.63, "熟82": 20.7, "熟83": 34.44, "熟84": 49.32, "熟85": 63.88, "熟86": 80.01, "熟87": 94.86, "熟88": 109.78, "熟89": 123.32, "熟90": 136.9, "会41": 151.08, "会42": 168.73, "会43": 186.63, "会44": 207.07, "会45": 224.03}, "TE": {"熟81": 7.5, "熟82": 22.57, "熟83": 36.32, "熟84": 51.19, "熟85": 65.88, "熟86": 82.0, "熟87": 96.78, "熟88": 111.66, "熟89": 125.19, "熟90": 138.77, "会41": 153.07, "会42": 170.6, "会43": 188.96, "会44": 208.94, "会45": 226.02}, "Q": [["熟81", "cheer up (～)", "元気を出す、元気づける"], ["熟82", "use up ～", "～を使い果たす"], ["熟83", "wear out", "すり減る、使い古される"], ["熟84", "sort out ～", "～を解決する、整理する"], ["熟85", "settle down", "落ち着く、住みつく"], ["熟86", "slow down", "速度を落とす"], ["熟87", "show off ～", "～を見せびらかす"], ["熟88", "set off", "出発する"], ["熟89", "pass away", "亡くなる"], ["熟90", "fill up ～", "～をいっぱいにする"], ["会41", "Sounds great.", "いいね。"], ["会42", "C
