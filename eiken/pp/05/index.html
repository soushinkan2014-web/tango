</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第5回</h1><div class="sub">No.201〜250</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">generate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を生み出す；発生させる</div><div class="ex">These solar panels <b>generate</b> electricity for the whole school.</div><div class="xj">これらの太陽光パネルが、学校全体の電気を生み出している。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">isolate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を孤立させる；隔離する</div><div class="ex">The village was <b>isolated</b> by the heavy snow.</div><div class="xj">大雪のため、その村は孤立した。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">enable</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（enable A to doで）Aが～するのを可能にする</div><div class="ex">The new bridge <b>enables</b> people to cross the river easily.</div><div class="xj">新しい橋は、人々が簡単に川を渡ることを可能にしている。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">restrict</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を制限する</div><div class="ex">The school <b>restricts</b> the use of smartphones in class.</div><div class="xj">その学校は、授業中のスマートフォンの使用を制限している。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">adjust</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を調整する；慣れる</div><div class="ex">Please <b>adjust</b> the chair to the right height.</div><div class="xj">いすをちょうどよい高さに調整してください。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">arise</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（問題などが）生じる</div><div class="ex">Call me if any problems <b>arise</b> during the trip.</div><div class="xj">旅行中に何か問題が生じたら、電話してください。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">absorb</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を吸収する</div><div class="ex">This soft towel <b>absorbs</b> water very quickly.</div><div class="xj">このやわらかいタオルは、とても速く水を吸収する。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">adopt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を採用する；養子にする</div><div class="ex">Our school <b>adopted</b> a new uniform this year.</div><div class="xj">私たちの学校は、今年新しい制服を採用した。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">criticize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を批判する</div><div class="ex">Some people <b>criticized</b> the plan to build a new road.</div><div class="xj">新しい道路を作る計画を批判する人もいた。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">misunderstand</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を誤解する</div><div class="ex">Sorry, I <b>misunderstood</b> what you said in the email.</div><div class="xj">ごめんなさい、メールに書いてあったことを誤解していました。</div></button></li><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">fascinate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を魅了する</div><div class="ex">The stars in the night sky have always <b>fascinated</b> me.</div><div class="xj">夜空の星は、いつも私を魅了してきた。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">vanish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">消える；消滅する</div><div class="ex">The rainbow <b>vanished</b> from the sky after a few minutes.</div><div class="xj">数分後、虹は空から消えた。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">psychology</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">心理学；心理</div><div class="ex">My sister wants to study <b>psychology</b> at college.</div><div class="xj">姉は大学で心理学を学びたいと思っている。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">sum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">金額；合計</div><div class="ex">Ken paid a large <b>sum</b> of money for the guitar.</div><div class="xj">ケンはそのギターに、かなりの金額を払った。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">amateur</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">アマチュア；素人</div><div class="ex">My uncle is an <b>amateur</b>, but he takes great photos.</div><div class="xj">おじはアマチュアだが、とてもすばらしい写真を撮る。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">presence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">存在；出席</div><div class="ex">I didn&#x27;t notice his <b>presence</b> in the room.</div><div class="xj">私は、部屋にいる彼の存在に気づかなかった。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">warehouse</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">倉庫</div><div class="ex">The company keeps its products in a large <b>warehouse</b>.</div><div class="xj">その会社は、商品を大きな倉庫に保管している。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">personality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">性格；個性</div><div class="ex">Emi has a bright and friendly <b>personality</b>.</div><div class="xj">エミは明るくて人なつっこい性格だ。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">restriction</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">制限</div><div class="ex">There is a weight <b>restriction</b> on this old bridge.</div><div class="xj">この古い橋には、重さの制限がある。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">venue</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">開催地；会場</div><div class="ex">The city was chosen as the <b>venue</b> for the sports festival.</div><div class="xj">その市は、スポーツ大会の開催地に選ばれた。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">creativity</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">創造性</div><div class="ex">Art classes help children develop their <b>creativity</b>.</div><div class="xj">美術の授業は、子どもの創造性を伸ばすのに役立つ。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">inquiry</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">問い合わせ；調査</div><div class="ex">The shop received many <b>inquiries</b> about the new game.</div><div class="xj">その店には、新しいゲームについて多くの問い合わせがあった。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">habitat</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（動植物の）生息地</div><div class="ex">Cutting down forests destroys the <b>habitat</b> of many animals.</div><div class="xj">森林を切り開くと、多くの動物の生息地が壊されてしまう。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">fabric</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">布；織物</div><div class="ex">This shirt is made of a soft <b>fabric</b>.</div><div class="xj">このシャツは、やわらかい布でできている。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">root</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">根；（複数形で）ルーツ</div><div class="ex">The <b>roots</b> of this tree go deep into the ground.</div><div class="xj">この木の根は、地中深くまでのびている。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">telescope</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">望遠鏡</div><div class="ex">We looked at the moon through a <b>telescope</b>.</div><div class="xj">私たちは望遠鏡で月を見た。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">guideline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">指針；ガイドライン</div><div class="ex">Teachers made new <b>guidelines</b> for using tablets in class.</div><div class="xj">先生たちは、授業でタブレットを使うための新しい指針を作った。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">tide</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">潮；潮の満ち引き</div><div class="ex">When the <b>tide</b> goes out, we can walk to the small island.</div><div class="xj">潮が引くと、小さな島まで歩いて行ける。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">workplace</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">職場</div><div class="ex">A clean <b>workplace</b> helps people do their jobs better.</div><div class="xj">きれいな職場は、人々がよりよく働くのに役立つ。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">grain</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">穀物；粒</div><div class="ex">Rice is the most important <b>grain</b> in Japan.</div><div class="xj">米は、日本で最も重要な穀物だ。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">wheat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">小麦</div><div class="ex">This bread is made from <b>wheat</b> grown in Hokkaido.</div><div class="xj">このパンは、北海道でとれた小麦から作られている。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">officer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">警官；役人</div><div class="ex">A police <b>officer</b> helped the lost child find her mother.</div><div class="xj">警官が、迷子の子どもが母親を見つけるのを手伝った。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">potential</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">可能性；潜在能力</div><div class="ex">Our coach says Ken has great <b>potential</b> as a player.</div><div class="xj">コーチは、ケンには選手として大きな可能性があると言う。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">barrier</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">障壁；さく</div><div class="ex">Language can be a <b>barrier</b> when you travel abroad.</div><div class="xj">海外旅行では、言葉が障壁になることがある。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">mechanism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">仕組み；装置</div><div class="ex">Ken studied the <b>mechanism</b> of an old clock.</div><div class="xj">ケンは古い時計の仕組みを調べた。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">session</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（活動の）時間；会</div><div class="ex">We have a practice <b>session</b> every Saturday morning.</div><div class="xj">毎週土曜日の朝に、練習の時間がある。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">cabinet</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">戸棚；内閣</div><div class="ex">Please put the cups back in the kitchen <b>cabinet</b>.</div><div class="xj">カップを台所の戸棚に戻しておいてください。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">court</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">裁判所；（テニスなどの）コート</div><div class="ex">The <b>court</b> decided that the company had to pay the money.</div><div class="xj">裁判所は、その会社がお金を払わなければならないと判断した。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">trace</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">跡；痕跡</div><div class="ex">We found <b>traces</b> of an old house in the forest.</div><div class="xj">私たちは森の中で、古い家の跡を見つけた。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">spirit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">精神；気分</div><div class="ex">The pla
