</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第9回</h1><div class="sub">No.401〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">accomplish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を成しとげる</div><div class="ex">We <b>accomplished</b> our goal of cleaning the whole beach.</div><div class="xj">私たちは、海岸全体をきれいにするという目標を成しとげた。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">frustrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をいらいらさせる；挫折させる</div><div class="ex">The slow Internet connection <b>frustrated</b> Tom all evening.</div><div class="xj">インターネットの接続が遅くて、トムは一晩中いらいらさせられた。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">boost</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を高める；増やす</div><div class="ex">Winning the first game <b>boosted</b> the team&#x27;s confidence.</div><div class="xj">最初の試合に勝ったことで、チームの自信が高まった。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">unite</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を団結させる；結合する</div><div class="ex">The festival <b>united</b> people of all ages in the town.</div><div class="xj">その祭りは、町のあらゆる年代の人々を団結させた。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">refresh</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をさわやかにする；元気づける</div><div class="ex">A cold shower <b>refreshed</b> me after the long run.</div><div class="xj">長く走ったあと、冷たいシャワーが私をさわやかにしてくれた。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">associate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を結びつけて考える</div><div class="ex">Many people <b>associate</b> summer with the beach.</div><div class="xj">多くの人は、夏を海と結びつけて考える。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">negotiate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">交渉する</div><div class="ex">Ken <b>negotiated</b> with his parents about his bedtime.</div><div class="xj">ケンは寝る時間について両親と交渉した。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">highlight</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を強調する；目立たせる</div><div class="ex">The teacher <b>highlighted</b> the important points in red.</div><div class="xj">先生は大切な点を赤で強調した。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">subscribe</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">定期購読する；（サービスに）登録する</div><div class="ex">My father <b>subscribes</b> to a monthly science magazine.</div><div class="xj">父は月刊の科学雑誌を定期購読している。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">neglect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を怠る；放っておく</div><div class="ex">Don&#x27;t <b>neglect</b> your homework because of club activities.</div><div class="xj">部活のせいで宿題を怠ってはいけない。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">enroll</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">入学する；登録する</div><div class="ex">My cousin <b>enrolled</b> in a college in Kyoto this spring.</div><div class="xj">いとこはこの春、京都の大学に入学した。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">efficiency</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">効率</div><div class="ex">This new heater has high energy <b>efficiency</b>.</div><div class="xj">この新しいヒーターは、エネルギー効率が高い。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">assistance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">援助；手伝い</div><div class="ex">Please ask the staff if you need <b>assistance</b>.</div><div class="xj">手伝いが必要な場合は、係の人に声をかけてください。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">recommendation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">推薦；勧め</div><div class="ex">Lisa asked her coach to write a letter of <b>recommendation</b>.</div><div class="xj">リサはコーチに推薦状を書いてくれるよう頼んだ。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">renovation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">改修；リフォーム</div><div class="ex">The library is closed for <b>renovation</b> until next month.</div><div class="xj">図書館は来月まで改修のため休館している。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">historian</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">歴史家</div><div class="ex">The <b>historian</b> told us interesting stories about the old castle.</div><div class="xj">その歴史家は、古い城について面白い話をしてくれた。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">motivation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">やる気；動機</div><div class="ex">Good grades gave Emi the <b>motivation</b> to study harder.</div><div class="xj">よい成績をとって、エミはもっと勉強するやる気が出た。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">insurance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">保険</div><div class="ex">You should buy travel <b>insurance</b> before going abroad.</div><div class="xj">海外に行く前には、旅行保険に入るべきだ。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">inspiration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ひらめき；刺激</div><div class="ex">Ken got the <b>inspiration</b> for his song while walking by the sea.</div><div class="xj">ケンは海辺を歩いているときに、その歌のひらめきを得た。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">gene</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">遺伝子</div><div class="ex">Eye color is decided by our <b>genes</b>.</div><div class="xj">目の色は遺伝子によって決まる。</div></button></li><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">moisture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">湿気；水分</div><div class="ex">This box keeps <b>moisture</b> away from the cookies.</div><div class="xj">この箱は、クッキーを湿気から守ってくれる。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">burden</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">負担；重荷</div><div class="ex">Doing all the housework alone is a big <b>burden</b> for Mom.</div><div class="xj">家事をすべて一人でやるのは、母にとって大きな負担だ。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">prey</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">獲物；えじき</div><div class="ex">The eagle flew down quickly to catch its <b>prey</b>.</div><div class="xj">ワシは獲物をとらえるために、すばやく舞い降りた。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">foundation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">基礎；財団</div><div class="ex">Workers are building the <b>foundation</b> of the new house.</div><div class="xj">作業員たちが、新しい家の基礎を造っている。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">checkout</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（スーパーなどの）レジ；チェックアウト</div><div class="ex">There was a long line at the <b>checkout</b> in the supermarket.</div><div class="xj">スーパーのレジには長い列ができていた。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">beverage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">飲み物</div><div class="ex">Food and <b>beverages</b> are not allowed in the library.</div><div class="xj">図書館では、食べ物と飲み物は禁止されている。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">evolution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">進化；発展</div><div class="ex">The museum shows the <b>evolution</b> of horses over millions of years.</div><div class="xj">その博物館では、何百万年にもわたる馬の進化を紹介している。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">peak</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">頂上；ピーク</div><div class="ex">We reached the <b>peak</b> of the mountain before noon.</div><div class="xj">私たちは正午前に山の頂上に着いた。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">reunion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">同窓会；再会</div><div class="ex">I saw many old friends at the class <b>reunion</b>.</div><div class="xj">クラスの同窓会で、昔の友だちにたくさん会った。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">cast</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出演者；配役</div><div class="ex">The <b>cast</b> of the school play practiced every day after school.</div><div class="xj">学校劇の出演者たちは、毎日放課後に練習した。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">opposition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">反対；対立</div><div class="ex">There was strong <b>opposition</b> to the plan to cut down the old tree.</div><div class="xj">古い木を切り倒す計画には、強い反対があった。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">notion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">考え；概念</div><div class="ex">The <b>notion</b> of time is different in each culture.</div><div class="xj">時間に対する考えは、文化によって異なる。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">oxygen</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">酸素</div><div class="ex">Trees give us the <b>oxygen</b> that we need to live.</div><div class="xj">木は、私たちが生きるのに必要な酸素を与えてくれる。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">hospitality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">もてなし；歓待</div><div class="ex">We thanked the host family for their warm <b>hospitality</b>.</div><div class="xj">私たちはホストファミリーの温かいもてなしに感謝した。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">component</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">部品；構成要素</div><div class="ex">Ken bought the <b>components</b> to build his own computer.</div><div class="xj">ケンは自分でコンピューターを組み立てるための部品を買った。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">ghost</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">幽霊</div><div class="ex">My little brother dressed up as a <b>ghost</b> for Halloween.</div><div class="xj">弟はハロウィーンで幽霊の仮装をした。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">overall</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">全体的な</div><div class="ex">Our team&#x27;s <b>overall</b> performance this season was very good.</div><div class="xj">今シーズンのチームの全体的な成績は、とてもよかった。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">religious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">宗教の；信心深い</div><div class="ex">Christmas is a <b>religious</b> holiday in many countries.</div><div class="xj">多くの国で、クリスマスは宗教の祝日だ。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">significant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">重要な；かなりの</div><div class="ex">Graduation is a <b>significant</b> event in our lives.</div><div class="xj">卒業は、人生の重要な出来事だ。</div></button></li><li><button class="w" data-no="440"><div class="top"><span clas
