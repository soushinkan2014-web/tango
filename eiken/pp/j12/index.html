 class="ja">～の場合に限り</div><div class="ex">You can use the gym only if a teacher is with you.</div><div class="xj">先生がいっしょにいる場合に限り体育館を使ってよい。</div></button></li><li><button class="w" data-no="熟116"><div class="top"><span class="no">熟116</span><span class="en">no matter how ～</span></div><div class="ja">どんなに～しても</div><div class="ex">No matter how busy she is, she always makes time for her family.</div><div class="xj">どんなに忙しくても、彼女はいつも家族のための時間を作る。</div></button></li><li><button class="w" data-no="熟117"><div class="top"><span class="no">熟117</span><span class="en">even though ～</span></div><div class="ja">～ではあるが（実際にそうであること）</div><div class="ex">Even though it was cold, the children played outside all day.</div><div class="xj">寒かったが、子どもたちは一日中外で遊んだ。</div></button></li><li><button class="w" data-no="熟118"><div class="top"><span class="no">熟118</span><span class="en">whether or not ～</span></div><div class="ja">～かどうかにかかわらず</div><div class="ex">Whether or not you agree, we have to make a decision today.</div><div class="xj">あなたが賛成でも反対でも、今日決めなければならない。</div></button></li><li><button class="w" data-no="熟119"><div class="top"><span class="no">熟119</span><span class="en">so ～ that …</span></div><div class="ja">とても～なので…</div><div class="ex">The box was so heavy that I couldn&#x27;t lift it.</div><div class="xj">その箱はとても重かったので持ち上げられなかった。</div></button></li><li><button class="w" data-no="熟120"><div class="top"><span class="no">熟120</span><span class="en">as long as ～</span></div><div class="ja">～する限り、～さえすれば</div><div class="ex">You can stay here as long as you keep quiet.</div><div class="xj">静かにしている限り、ここにいてもいいよ。</div></button></li><li><button class="w" data-no="会56"><div class="top"><span class="no">会56</span><span class="en">That&#x27;s very kind of you.</span></div><div class="ja">ご親切にありがとう。</div><div class="ex">A: Let me carry your bag.<br>B: That&#x27;s very kind of you.</div></button></li><li><button class="w" data-no="会57"><div class="top"><span class="no">会57</span><span class="en">Don&#x27;t mention it.</span></div><div class="ja">どういたしまして。</div><div class="ex">A: Thanks for helping me with my homework.<br>B: Don&#x27;t mention it.</div></button></li><li><button class="w" data-no="会58"><div class="top"><span class="no">会58</span><span class="en">Sorry to keep you waiting.</span></div><div class="ja">お待たせしてすみません。</div><div class="ex">A: Sorry to keep you waiting.<br>B: That&#x27;s OK. I just got here.</div></button></li><li><button class="w" data-no="会59"><div class="top"><span class="no">会59</span><span class="en">I apologize for ～.</span></div><div class="ja">～についておわびします。</div><div class="ex">A: I apologize for the delay.<br>B: It&#x27;s all right. These things happen.</div></button></li><li><button class="w" data-no="会60"><div class="top"><span class="no">会60</span><span class="en">Thanks a lot for ～.</span></div><div class="ja">～をどうもありがとう。</div><div class="ex">A: Thanks a lot for the birthday card.<br>B: You&#x27;re welcome. I&#x27;m glad you liked it.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j11/">← 熟語 Set 11</a><a href="../j13/">熟語 Set 13 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟111": 5.72, "熟112": 19.74, "熟113": 35.84, "熟114": 49.92, "熟115": 63.88, "熟116": 78.09, "熟117": 93.73, "熟118": 109.88, "熟119": 125.04, "熟120": 138.62, "会56": 154.22, "会57": 170.63, "会58": 186.03, "会59": 204.07, "会60": 223.26}, "TE": {"熟111": 7.6, "熟112": 22.21, "熟113": 37.8, "熟114": 51.79, "熟115": 65.76, "熟116": 80.13, "熟117": 95.6, "熟118": 111.87, "熟119": 126.92, "熟120": 140.71, "会56": 156.52, "会57": 172.5, "会58": 188.33, "会59": 206.49, "会60": 225.35}, "Q": [["熟111", "even if ～", "たとえ～でも"], ["熟112", "(just) in case (～)", "念のため、～するといけないから"], ["熟113", "in case of ～", "～の場合には"], ["熟114", "as though ～", "まるで～のように"], ["熟115", "only if ～", "～の場合に限り"], ["熟116", "no matter how ～", "どんなに～しても"], ["熟117", "even
