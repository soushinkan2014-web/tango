</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第20回</h1><div class="sub">No.951〜1000</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="951"><div class="top"><span class="no">951</span><span class="en">navigate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を操縦する；道を見つける</div><div class="ex">The captain <b>navigated</b> the ship through the storm.</div><div class="xj">船長は嵐の中、船を操縦した。</div></button></li><li><button class="w" data-no="952"><div class="top"><span class="no">952</span><span class="en">enrich</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を豊かにする</div><div class="ex">Reading many kinds of books will <b>enrich</b> your life.</div><div class="xj">いろいろな種類の本を読むことは、人生を豊かにするだろう。</div></button></li><li><button class="w" data-no="953"><div class="top"><span class="no">953</span><span class="en">persist</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（persist in ～で）～を貫く；続く</div><div class="ex">Ken <b>persisted</b> in his belief that his plan would work.</div><div class="xj">ケンは、自分の計画はうまくいくという信念を貫いた。</div></button></li><li><button class="w" data-no="954"><div class="top"><span class="no">954</span><span class="en">anticipate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を予想する；期待する</div><div class="ex">We didn&#x27;t <b>anticipate</b> so many people at the event.</div><div class="xj">そのイベントにこんなに多くの人が来るとは、予想していなかった。</div></button></li><li><button class="w" data-no="955"><div class="top"><span class="no">955</span><span class="en">integrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を統合する；溶け込む</div><div class="ex">The school <b>integrated</b> the two small classes into one.</div><div class="xj">学校は、2つの少人数クラスを1つに統合した。</div></button></li><li><button class="w" data-no="956"><div class="top"><span class="no">956</span><span class="en">facilitate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を容易にする；促進する</div><div class="ex">The new bridge will <b>facilitate</b> travel between the two towns.</div><div class="xj">新しい橋は、2つの町の間の行き来を容易にするだろう。</div></button></li><li><button class="w" data-no="957"><div class="top"><span class="no">957</span><span class="en">extract</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を抽出する；取り出す</div><div class="ex">Scientists <b>extracted</b> a useful oil from the plant&#x27;s seeds.</div><div class="xj">科学者たちは、その植物の種から役に立つ油を抽出した。</div></button></li><li><button class="w" data-no="958"><div class="top"><span class="no">958</span><span class="en">undergo</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（手術・変化など）を受ける；経験する</div><div class="ex">My grandfather <b>underwent</b> knee surgery and is walking again.</div><div class="xj">祖父はひざの手術を受けて、また歩けるようになった。</div></button></li><li><button class="w" data-no="959"><div class="top"><span class="no">959</span><span class="en">tempt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を誘惑する；～する気にさせる</div><div class="ex">The smell of fresh bread <b>tempted</b> me to go into the shop.</div><div class="xj">焼きたてのパンのにおいに誘惑されて、私は店に入った。</div></button></li><li><button class="w" data-no="960"><div class="top"><span class="no">960</span><span class="en">obligation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">義務</div><div class="ex">Parents have an <b>obligation</b> to send their children to school.</div><div class="xj">親には、子どもを学校に通わせる義務がある。</div></button></li><li><button class="w" data-no="961"><div class="top"><span class="no">961</span><span class="en">obesity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">肥満</div><div class="ex">Eating too much fast food can lead to <b>obesity</b>.</div><div class="xj">ファストフードの食べすぎは、肥満につながることがある。</div></button></li><li><button class="w" data-no="962"><div class="top"><span class="no">962</span><span class="en">explosion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">爆発；急増</div><div class="ex">The science teacher showed us a small <b>explosion</b> in a bottle.</div><div class="xj">理科の先生が、びんの中の小さな爆発を見せてくれた。</div></button></li><li><button class="w" data-no="963"><div class="top"><span class="no">963</span><span class="en">tension</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">緊張；緊迫状態</div><div class="ex">There was a lot of <b>tension</b> before the final game.</div><div class="xj">決勝戦の前、会場は強い緊張に包まれていた。</div></button></li><li><button class="w" data-no="964"><div class="top"><span class="no">964</span><span class="en">ecology</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生態学；生態系</div><div class="ex">Lisa wants to study <b>ecology</b> at college.</div><div class="xj">リサは大学で生態学を学びたいと思っている。</div></button></li><li><button class="w" data-no="965"><div class="top"><span class="no">965</span><span class="en">queue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（順番を待つ人の）列</div><div class="ex">There was a long <b>queue</b> in front of the ramen shop.</div><div class="xj">ラーメン店の前には、長い列ができていた。</div></button></li><li><button class="w" data-no="966"><div class="top"><span class="no">966</span><span class="en">migration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">移住；（鳥などの）渡り</div><div class="ex">The <b>migration</b> of people to big cities continues.</div><div class="xj">大都市への人々の移住が続いている。</div></button></li><li><button class="w" data-no="967"><div class="top"><span class="no">967</span><span class="en">awareness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">意識；認識</div><div class="ex">The event raised <b>awareness</b> of ocean pollution.</div><div class="xj">そのイベントは、海の汚染に対する意識を高めた。</div></button></li><li><button class="w" data-no="968"><div class="top"><span class="no">968</span><span class="en">newcomer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">新しく来た人；新人</div><div class="ex">The <b>newcomers</b> to our town joined the summer festival.</div><div class="xj">私たちの町に新しく来た人たちも、夏祭りに参加した。</div></button></li><li><button class="w" data-no="969"><div class="top"><span class="no">969</span><span class="en">restoration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">修復；回復</div><div class="ex">The <b>restoration</b> of the old temple took five years.</div><div class="xj">その古い寺の修復には5年かかった。</div></button></li><li><button class="w" data-no="970"><div class="top"><span class="no">970</span><span class="en">prospect</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見込み；見通し</div><div class="ex">There is little <b>prospect</b> of rain this week.</div><div class="xj">今週は雨の見込みはほとんどない。</div></button></li><li><button class="w" data-no="971"><div class="top"><span class="no">971</span><span class="en">finance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">財政；金融</div><div class="ex">The town needs to improve its <b>finances</b>.</div><div class="xj">その町は財政を立て直す必要がある。</div></button></li><li><button class="w" data-no="972"><div class="top"><span class="no">972</span><span class="en">equivalent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">同等のもの；相当するもの</div><div class="ex">This drink contains the <b>equivalent</b> of ten teaspoons of sugar.</div><div class="xj">この飲み物には、小さじ10杯分に相当する砂糖が入っている。</div></button></li><li><button class="w" data-no="973"><div class="top"><span class="no">973</span><span class="en">entrepreneur</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">起業家</div><div class="ex">Lisa&#x27;s dream is to become a successful <b>entrepreneur</b>.</div><div class="xj">リサの夢は、成功した起業家になることだ。</div></button></li><li><button class="w" data-no="974"><div class="top"><span class="no">974</span><span class="en">productivity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生産性</div><div class="ex">Taking short breaks can improve your <b>productivity</b>.</div><div class="xj">短い休憩をとると、生産性が上がることがある。</div></button></li><li><button class="w" data-no="975"><div class="top"><span class="no">975</span><span class="en">charm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">魅力；お守り</div><div class="ex">The <b>charm</b> of this town is its friendly people.</div><div class="xj">この町の魅力は、人々が親切なことだ。</div></button></li><li><button class="w" data-no="976"><div class="top"><span class="no">976</span><span class="en">cautious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">用心深い；慎重な</div><div class="ex">My father is a very <b>cautious</b> driver.</div><div class="xj">父はとても用心深いドライバーだ。</div></button></li><li><button class="w" data-no="977"><div class="top"><span class="no">977</span><span class="en">productive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">生産的な；実りの多い</div><div class="ex">We had a <b>productive</b> meeting about the school festival.</div><div class="xj">私たちは文化祭について、生産的な話し合いをした。</div></button></li><li><button class="w" data-no="978"><div class="top"><span class="no">978</span><span class="en">ultimate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">最終的な；究極の</div><div class="ex">Our <b>ultimate</b> goal is to win the national tournament.</div><div class="xj">私たちの最終的な目標は、全国大会で優勝することだ。</div></button></li><li><button class="w" data-no="979"><div class="top"><span class="no">979</span><span class="en">drastic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">思い切った；徹底的な</div><div class="ex">The shop made <b>drastic</b> price cuts this weekend.</div><div class="xj">その店は今週末、思い切った値下げをした。</div></button></li><li><button class="w" data-no="980"><div class="top"><span class="no">980</span><span class="en">subtle</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">かすかな；微妙な</div><div class="ex">There is a <b>subtle</b> smell of flowers in this room.</div><div class="xj">この部屋には、花のかすかなにおいがする。</div></button></li><li><button class="w" data-no="981"><div class="top"><span class="no">981</span><span class="en">worthy</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">（be worthy of ～で）～に値する</div><div class="ex">This movie is <b>worthy</b> of an award.</div><div class="xj">この映画は賞に値する。</div></button></li><li><button class="w" data-no="982"><div class="top"><span class="no">982</span><span class="en">versatile</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">用途の広い；多才な</div><div class="ex">This <b>versatile</b> bag can be used for school or travel.</div><div class="xj">この用途の広いかばんは、学校にも旅行にも使える。</div></button></li><li><button class="w" data-no="983"><div class="top"><span class="no">983</span><span class="en">residential</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">住宅の；居住の</div><div class="ex">This is a quiet <b>residential</b> area with many parks.</div><div class="xj">ここは公園が多い、静かな住宅地だ。</div></button></li><li><button class="w" data-no="984"><div class="top"><span class="no">984</span><span class="en">furious</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">激怒した</div><div class="ex">Dad was <b>furious</b> when he saw the broken window.</div><div class="xj">割れた窓を見て、父は激怒した。</div></button></li><li><button class="w" data-no="985"><div class="top"><span class="no">985</span><span class="en">evident</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">明らかな</div><div class="ex">It was <b>evident</b> that Emi had practiced very hard.</div><div class="xj">エミがとても熱心に練習したことは明らかだった。</div></button></li><li><button class="w" data-no="986"><div class="top"><span class="no">986</span><span class="en">relevant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">関係のある；適切な</div><div class="ex">Please ask questions that are <b>relevant</b> to today&#x27;s topic.</div><div class="xj">今日のテーマに関係のある質問をしてください。</div></button></li><li><button class="w" data-no="987"><div class="top"><span class="no">987</span><span class="en">progressive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">進歩的な；前進する</div><div class="ex">Our new teacher has <b>progressive</b> ideas about education.</div><div class="xj">新しい先生は、教育について進歩的な考えを持っている。</div></button></li><li><button class="w" data-no="988"><div class="top"><span class="no">988</span><span class="en">devoted</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">献身的な；熱心な</div><div class="ex">Emi is a <b>devoted</b> member of the volunteer club.</div><div class="xj">エミはボランティア部の献身的な部員だ。</div></button></li><li><button class="w" data-no="989"><div class="top"><span class="no">989</span><span class="en">inadequate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不十分な；不適切な</div><div class="ex">The room was too small, and the lighting was <b>inadequate</b>.</div><div class="xj">その部屋は狭すぎて、明かりも不十分だった。</div></button></li><li><button class="w" data-no="990"><div class="top"><span class="no">990</span><span
