<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>英検準2級プラス 新しい意味｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　新しい意味</h1><div class="sub">新1〜新42</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../n.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="新1"><div class="top"><span class="no">新1</span><span class="en">subject</span><span class="ps">名</span></div><div class="xj">知っている意味：教科</div><div class="ja">（Eメールの）件名；話題</div><div class="ex">Please write a short <b>subject</b> when you send an e-mail.</div><div class="xj">メールを送るときは、短い件名を書いてください。</div></button></li><li><button class="w" data-no="新2"><div class="top"><span class="no">新2</span><span class="en">show</span><span class="ps">動</span></div><div class="xj">知っている意味：見せる</div><div class="ja">（研究などが）～を示す</div><div class="ex">The study <b>shows</b> that sleep is important for young people.</div><div class="xj">その研究は、睡眠が若い人にとって大切であることを示している。</div></button></li><li><button class="w" data-no="新3"><div class="top"><span class="no">新3</span><span class="en">free</span><span class="ps">形</span></div><div class="xj">知っている意味：ひまな；自由な</div><div class="ja">無料の</div><div class="ex">The museum gives a <b>free</b> map to every visitor.</div><div class="xj">その博物館は、来館者全員に無料の地図を配っている。</div></button></li><li><button class="w" data-no="新4"><div class="top"><span class="no">新4</span><span class="en">stay</span><span class="ps">動</span></div><div class="xj">知っている意味：泊まる；とどまる</div><div class="ja">～のままでいる</div><div class="ex">Please <b>stay</b> quiet while you are in the library.</div><div class="xj">図書館にいる間は、静かにしていてください。</div></button></li><li><button class="w" data-no="新5"><div class="top"><span class="no">新5</span><span class="en">face</span><span class="ps">動</span></div><div class="xj">知っている意味：顔</div><div class="ja">～に直面する</div><div class="ex">Our city <b>faces</b> a big problem with trash on the streets.</div><div class="xj">私たちの市は、路上のごみという大きな問題に直面している。</div></button></li><li><button class="w" data-no="新6"><div class="top"><span class="no">新6</span><span class="en">work</span><span class="ps">動</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">（機械などが）動く；うまくいく</div><div class="ex">The school computer did not <b>work</b>, so we used paper instead.</div><div class="xj">学校のコンピューターが動かなかったので、代わりに紙を使った。</div></button></li><li><button class="w" data-no="新7"><div class="top"><span class="no">新7</span><span class="en">pass</span><span class="ps">動</span></div><div class="xj">知っている意味：手わたす</div><div class="ja">（試験）に合格する</div><div class="ex">Emi studied hard and <b>passed</b> the math test.</div><div class="xj">エミは一生けんめい勉強して、数学のテストに合格した。</div></button></li><li><button class="w" data-no="新8"><div class="top"><span class="no">新8</span><span class="en">close</span><span class="ps">形</span></div><div class="xj">知っている意味：閉める</div><div class="ja">近い</div><div class="ex">Our school is very <b>close</b> to the station, so it is convenient.</div><div class="xj">私たちの学校は駅にとても近いので、便利だ。</div></button></li><li><button class="w" data-no="新9"><div class="top"><span class="no">新9</span><span class="en">find</span><span class="ps">動</span></div><div class="xj">知っている意味：見つける</div><div class="ja">（find A B）AがBだと思う；分かる</div><div class="ex">I <b>found</b> the book very interesting, so I read it twice.</div><div class="xj">その本はとてもおもしろいと思ったので、2回読んだ。</div></button></li><li><button class="w" data-no="新10"><div class="top"><span class="no">新10</span><span class="en">step</span><span class="ps">名</span></div><div class="xj">知っている意味：段；一歩</div><div class="ja">手順；段階</div><div class="ex">Read the <b>steps</b> carefully before you start the science experiment.</div><div class="xj">理科の実験を始める前に、手順をよく読みなさい。</div></button></li><li><button class="w" data-no="新11"><div class="top"><span class="no">新11</span><span class="en">break</span><span class="ps">名</span></div><div class="xj">知っている意味：こわす</div><div class="ja">休けい</div><div class="ex">Let&#x27;s take a short <b>break</b> after we finish this page.</div><div class="xj">このページが終わったら、少し休けいしよう。</div></button></li><li><button class="w" data-no="新12"><div class="top"><span class="no">新12</span><span class="en">save</span><span class="ps">動</span></div><div class="xj">知っている意味：～を救う；（お金）をためる</div><div class="ja">～を節約する</div><div class="ex">We can <b>save</b> water by taking shorter showers.</div><div class="xj">シャワーの時間を短くすれば、水を節約することができる。</div></button></li><li><button class="w" data-no="新13"><div class="top"><span class="no">新13</span><span class="en">key</span><span class="ps">形</span></div><div class="xj">知っている意味：かぎ</div><div class="ja">重要な；かぎとなる</div><div class="ex">Listening to others is a <b>key</b> skill for a team leader.</div><div class="xj">人の話を聞くことは、チームリーダーにとって重要な技能だ。</div></button></li><li><button class="w" data-no="新14"><div class="top"><span class="no">新14</span><span class="en">late</span><span class="ps">形</span></div><div class="xj">知っている意味：おそく；遅れた</div><div class="ja">（時期の）後半の；終わりごろの</div><div class="ex">The new library will open in <b>late</b> October.</div><div class="xj">新しい図書館は、10月下旬に開館する予定だ。</div></button></li><li><button class="w" data-no="新15"><div class="top"><span class="no">新15</span><span class="en">left</span><span class="ps">形</span></div><div class="xj">知っている意味：左；置いてきた（leave の過去形）</div><div class="ja">残っている</div><div class="ex">There is only a little milk <b>left</b> in the bottle.</div><div class="xj">びんの中には、牛乳が少ししか残っていない。</div></button></li><li><button class="w" data-no="新16"><div class="top"><span class="no">新16</span><span class="en">drive</span><span class="ps">動</span></div><div class="xj">知っている意味：（車）を運転する</div><div class="ja">（人）を車で送る</div><div class="ex">Dad <b>drove</b> my friends and me to the soccer game.</div><div class="xj">父が、友だちと私をサッカーの試合まで車で送ってくれた。</div></button></li><li><button class="w" data-no="新17"><div class="top"><span class="no">新17</span><span class="en">express</span><span class="ps">形</span></div><div class="xj">知っている意味：～を表現する</div><div class="ja">急行の</div><div class="ex">If you take the <b>express</b> train, you will get there faster.</div><div class="xj">急行列車に乗れば、もっと早くそこに着くだろう。</div></button></li><li><button class="w" data-no="新18"><div class="top"><span class="no">新18</span><span class="en">plant</span><span class="ps">動</span></div><div class="xj">知っている意味：植物</div><div class="ja">～を植える</div><div class="ex">We <b>planted</b> tomatoes in the school garden last spring.</div><div class="xj">私たちは去年の春、学校の畑にトマトを植えた。</div></button></li><li><button class="w" data-no="新19"><div class="top"><span class="no">新19</span><span class="en">park</span><span class="ps">動</span></div><div class="xj">知っている意味：公園</div><div class="ja">（車）を駐車する</div><div class="ex">Dad <b>parked</b> the car near the entrance of the shopping mall.</div><div class="xj">父は、ショッピングモールの入り口の近くに車を駐車した。</div></button></li><li><button class="w" data-no="新20"><div class="top"><span class="no">新20</span><span class="en">work</span><span class="ps">名</span></div><div class="xj">知っている意味：働く；仕事</div><div class="ja">作品</div><div class="ex">Tom&#x27;s <b>work</b> won first prize at the city art contest.</div><div class="xj">トムの作品が、市の美術コンクールで1位をとった。</div></button></li><li><button class="w" data-no="新21"><div class="top"><span class="no">新21</span><span class="en">run</span><span class="ps">動</span></div><div class="xj">知っている意味：走る</div><div class="ja">（川・道などが）流れる；通っている</div><div class="ex">This road <b>runs</b> along the river to the next town.</div><div class="xj">この道は、川に沿ってとなりの町まで通っている。</div></button></li><li><button class="w" data-no="新22"><div class="top"><span class="no">新22</span><span class="en">drop</span><span class="ps">動</span></div><div class="xj">知っている意味：落とす</div><div class="ja">（数・量が）下がる；減る</div><div class="ex">The number of visitors <b>dropped</b> because of the bad weather.</div><div class="xj">悪天候のため、訪問者の数が減った。</div></button></li><li><button class="w" data-no="新23"><div class="top"><span class="no">新23</span><span class="en">book</span><span class="ps">動</span></div><div class="xj">知っている意味：本</div><div class="ja">～を予約する</div><div class="ex">I <b>booked</b> two tickets for the concert online.</div><div class="xj">私はコンサートのチケットを2枚、インターネットで予約した。</div></button></li><li><button class="w" data-no="新24"><div class="top"><span class="no">新24</span><span class="en">run</span><span class="ps">動</span></div><div class="xj">知っている意味：走る</div><div class="ja">～を経営する</div><div class="ex">Emi&#x27;s aunt <b>runs</b> a small bakery near the station.</div><div class="xj">エミのおばは、駅の近くで小さなパン屋を経営している。</div></button></li><li><button class="w" data-no="新25"><div class="top"><span class="no">新25</span><span class="en">line</span><span class="ps">名</span></div><div class="xj">知っている意味：線；列</div><div class="ja">（劇の）せりふ</div><div class="ex">Ken practiced his <b>lines</b> every night for the school play.</div><div class="xj">ケンは学校の劇のために、毎晩せりふを練習した。</div></button></li><li><button class="w" data-no="新26"><div class="top"><span class="no">新26</span><span class="en">last</span><span class="ps">動</span></div><div class="xj">知っている意味：最後の；この前の</div><div class="ja">続く；長持ちする</div><div class="ex">The school festival <b>lasted</b> for three days this year.</div><div class="xj">今年の文化祭は3日間続いた。</div></button></li><li><button class="w" data-no="新27"><div class="top"><span class="no">新27</span><span class="en">treat</span><span class="ps">動</span></div><div class="xj">知っている意味：～を扱う；～にごちそうする</div><div class="ja">（病気・けが）を治療する</div><div class="ex">The doctor <b>treated</b> the boy&#x27;s arm at the hospital.</div><div class="xj">医者は病院で、その男の子の腕を治療した。</div></button></li><li><button class="w" data-no="新28"><div class="top"><span class="no">新28</span><span class="en">sign</span><span class="ps">動</span></div><div class="xj">知っている意味：標識；看板</div><div class="ja">～に署名する；サインする</div><div class="ex">Your parents need to <b>sign</b> this form before the school trip.</div><div class="xj">修学旅行の前に、この用紙に保護者が署名する必要がある。</div></button></li><li><button class="w" data-no="新29"><div class="top"><span class="no">新29</span><span class="en">view</span><span class="ps">名</span></div><div class="xj">知っている意味：ながめ；景色</div><div class="ja">見方；意見</div><div class="ex">Lisa and Tom have different <b>views</b> about school uniforms.</div><div class="xj">リサとトムは、制服について異なる意見を持っている。</div></button></li><li><button class="w" data-no="新30"><div class="top"><span class="no">新30</span><span class="en">support</span><span class="ps">動</span></div><div class="xj">知っている意味：～を支える；～を支援する</div><div class="ja">（家族）を養う</div><div class="ex">He works hard to <b>support</b> his family of five.</div><div class="xj">彼は5人家族を養うために、一生けんめい働いている。</div></button></li><li><button class="w" data-no="新31"><div class="top"><span class="no">新31</span><span class="en">turn</span><span class="ps">動</span></div><div class="xj">知っている意味：曲がる；回す</div><div class="ja">（ある年齢・状態に）なる</div><div class="ex">My little sister will <b>turn</b> ten next month.</div><div class="xj">私の妹は、来月10歳になる。</div></button></li><li><button class="w" data-no="新32"><div class="top"><span class="no">新32</span><span class="en">meet</span><span class="ps">動</span></div><div class="xj">知っている意味：会う</div><div class="ja">（必要・目標など）を満たす；～を達成する</div><div class="ex">The class worked together to <b>meet</b> its goal of reading 100 books.</div><div class="xj">クラスは、100冊読むという目標を達成するために協力した。</div></button></li><li><button class="w" data-no="新33"><div class="top"><span class="no">新33</span><span class="en">cover</span><span class="ps">動</span></div><div class="xj">知っている意味：～をおおう</div><div class="ja">（話題など）を扱う</div><div class="ex">Today&#x27;s lesson will <b>cover</b> the history of Japanese food.</div><div class="xj">今日の授業では、和食の歴史を扱う。</div></button></li><li><button class="w" data-no="新34"><div class="top"><span class="no">新34</span><span class="en">charge</span><span class="ps">動</span></div><div class="xj">知っている意味：料金；責任</div><div class="ja">（料金）を請求する</div><div class="ex">The hotel <b>charged</b> us extra money for breakfast.</div><div class="xj">ホテルは、朝食代として私たちに追加料金を請求した。</div></button></li><li><button class="w" data-no="新35"><div class="top"><span class="no">新35</span><span class="en">rate</span><span class="ps">名</span></div><div class="xj">知っている意味：～を評価する</div><div class="ja">率；割合</div><div class="ex">The success <b>rate</b> of this new plan is very high.</div><div class="xj">この新しい計画の成功率はとても高い。</div></button></li><li><button class="w" data-no="新36"><div class="top"><span class="no">新36</span><span class="en">sink</span><span class="ps">名</span></div><div class="xj">知っている意味：沈む</div><div class="ja">（台所の）流し</div><div class="ex">Please put your dirty dishes in the kitchen <b>sink</b>.</div><div class="xj">よごれたお皿は、台所の流しに入れてください。</div></button></li><li><button class="w" data-no="新37"><div class="top"><span class="no">新37</span><span class="en">block</span><span class="ps">動</span></div><div class="xj">知っている意味：（市街の）1区画；かたまり</div><div class="ja">～をふさぐ；さえぎる</div><div class="ex">A big tree fell and <b>blocked</b> the road after the storm.</div><div class="xj">嵐のあと、大きな木がたおれて道をふさいだ。</div></button></li><li><button class="w" data-no="新38"><div class="top"><span class="no">新38</span><span class="en">fix</span><span class="ps">動</span></div><div class="xj">知っている意味：～を修理する</div><div class="ja">（日時など）を決める</div><div class="ex">Let&#x27;s <b>fix</b> a time to meet before the trip.</div><div class="xj">旅行の前に、会う時間を決めよう。</div></button></li><li><button class="w" data-no="新39"><div class="top"><span class="no">新39</span><span class="en">land</span><span class="ps">動</span></div><div class="xj">知っている意味：陸地；土地</div><div class="ja">着陸する；（物が）落ちる</div><div class="ex">Our plane <b>landed</b> at the airport thirty minutes late.</div><div class="xj">私たちの飛行機は、30分遅れて空港に着陸した。</div></button></li><li><button class="w" data-no="新40"><div class="top"><span class="no">新40</span><span class="en">draw</span><span class="ps">動</span></div><div class="xj">知っている意味：（絵を）かく</div><div class="ja">（注意・人）を引きつける</div><div class="ex">The big festival <b>draws</b> many visitors to the small town.</div><div class="xj">その大きな祭りは、小さな町に多くの観光客を引きつける。</div></button></li><li><button class="w" data-no="新41"><div class="top"><span class="no">新41</span><span class="en">fine</span><span class="ps">形</span></div><div class="xj">知っている意味：元気な；すばらしい</div><div class="ja">細かい</div><div class="ex">The sand on this beach is white, soft, and very <b>fine</b>.</div><div class="xj">この浜辺の砂は白くてやわらかく、とても細かい。</div></button></li><li><button class="w" data-no="新42"><div class="top"><span class="no">新42</span><span class="en">fit</span><span class="ps">形</span></div><div class="xj">知っている意味：（大きさが）～に合う</div><div class="ja">健康な；体調がよい</div><div class="ex">My grandfather walks every morning to keep <b>fit</b>.</div><div class="xj">祖父は、健康を保つために毎朝歩いている。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../r4/">← 復習 第4回</a><a href="../01/">第1回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"新1": 5.41, "新2": 19.9, "新3": 34.83, "新4": 48.17, "新5": 61.72, "新6": 76.34, "新7": 91.74, "新8": 105.58, "新9": 119.76, "新10": 135.62, "新11": 150.12, "新12": 163.67, "新13": 177.83, "新14": 192.25, "新15": 206.62, "新16": 219.62, "新17": 233.56, "新18": 247.19, "新19": 260.99, "新20": 275.12, "新21": 289.08, "新22": 304.44, "新23": 318.86, "新24": 332.63, "新25": 346.86, "新26": 360.7, "新27": 375.2, "新28": 389.33, "新29": 404.61, "新30": 418.91, "新31": 432.59, "新32": 446.86, "新33": 464.4, "新34": 478.61, "新35": 492.74, "新36
