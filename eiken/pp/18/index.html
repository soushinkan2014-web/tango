</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第18回</h1><div class="sub">No.851〜900</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="851"><div class="top"><span class="no">851</span><span class="en">implement</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（計画など）を実行する</div><div class="ex">The school will <b>implement</b> the new plan next April.</div><div class="xj">学校は来年の4月に、新しい計画を実行する。</div></button></li><li><button class="w" data-no="852"><div class="top"><span class="no">852</span><span class="en">bully</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をいじめる</div><div class="ex">It is never OK to <b>bully</b> others.</div><div class="xj">人をいじめることは決して許されない。</div></button></li><li><button class="w" data-no="853"><div class="top"><span class="no">853</span><span class="en">blend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を混ぜ合わせる；溶け込む</div><div class="ex">Emi <b>blended</b> milk and bananas to make a drink.</div><div class="xj">エミは牛乳とバナナを混ぜ合わせて飲み物を作った。</div></button></li><li><button class="w" data-no="854"><div class="top"><span class="no">854</span><span class="en">customize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を好みに合わせて作り変える</div><div class="ex">You can <b>customize</b> the color and design of your sneakers.</div><div class="xj">スニーカーの色やデザインを好みに合わせて作り変えることができる。</div></button></li><li><button class="w" data-no="855"><div class="top"><span class="no">855</span><span class="en">enlarge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を大きくする；拡大する</div><div class="ex">Can you <b>enlarge</b> this photo for our class poster?</div><div class="xj">クラスのポスター用に、この写真を大きくしてくれますか。</div></button></li><li><button class="w" data-no="856"><div class="top"><span class="no">856</span><span class="en">revive</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を復活させる；生き返る</div><div class="ex">The town is trying to <b>revive</b> its old summer festival.</div><div class="xj">その町は、昔の夏祭りを復活させようとしている。</div></button></li><li><button class="w" data-no="857"><div class="top"><span class="no">857</span><span class="en">clarify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を明らかにする；はっきりさせる</div><div class="ex">The study <b>clarified</b> why some birds fly so far.</div><div class="xj">その研究は、なぜ一部の鳥がそんなに遠くまで飛ぶのかを明らかにした。</div></button></li><li><button class="w" data-no="858"><div class="top"><span class="no">858</span><span class="en">inherit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を受け継ぐ；相続する</div><div class="ex">Emi <b>inherited</b> her mother&#x27;s love of music.</div><div class="xj">エミは母親の音楽好きを受け継いだ。</div></button></li><li><button class="w" data-no="859"><div class="top"><span class="no">859</span><span class="en">thrive</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">繁栄する；よく育つ</div><div class="ex">The small town <b>thrived</b> thanks to its hot springs.</div><div class="xj">その小さな町は、温泉のおかげで繁栄した。</div></button></li><li><button class="w" data-no="860"><div class="top"><span class="no">860</span><span class="en">trigger</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を引き起こす；～のきっかけとなる</div><div class="ex">Spicy food can <b>trigger</b> headaches in some people.</div><div class="xj">人によっては、辛い食べ物が頭痛を引き起こすことがある。</div></button></li><li><button class="w" data-no="861"><div class="top"><span class="no">861</span><span class="en">infrastructure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（社会の）基盤；インフラ</div><div class="ex">The city is repairing old <b>infrastructure</b> such as roads and bridges.</div><div class="xj">市は、道路や橋などの古いインフラを修理している。</div></button></li><li><button class="w" data-no="862"><div class="top"><span class="no">862</span><span class="en">interaction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">交流；相互作用</div><div class="ex">The event encourages <b>interaction</b> between students and local people.</div><div class="xj">そのイベントは、生徒と地域の人々の交流を促している。</div></button></li><li><button class="w" data-no="863"><div class="top"><span class="no">863</span><span class="en">sequence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">順序；連続</div><div class="ex">Put these pictures in the correct <b>sequence</b>.</div><div class="xj">これらの絵を正しい順序に並べなさい。</div></button></li><li><button class="w" data-no="864"><div class="top"><span class="no">864</span><span class="en">exposure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">さらされること；露出</div><div class="ex">Too much <b>exposure</b> to the sun is bad for your skin.</div><div class="xj">日光にさらされることが多すぎると、肌によくない。</div></button></li><li><button class="w" data-no="865"><div class="top"><span class="no">865</span><span class="en">grief</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">深い悲しみ</div><div class="ex">Tom was full of <b>grief</b> when his pet bird died.</div><div class="xj">ペットの鳥が死んだとき、トムは深い悲しみに包まれた。</div></button></li><li><button class="w" data-no="866"><div class="top"><span class="no">866</span><span class="en">outbreak</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（戦争・病気などの）発生；勃発</div><div class="ex">There was an <b>outbreak</b> of flu at our school last winter.</div><div class="xj">去年の冬、私たちの学校でインフルエンザが発生した。</div></button></li><li><button class="w" data-no="867"><div class="top"><span class="no">867</span><span class="en">physician</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">医師；内科医</div><div class="ex">Ken wants to become a <b>physician</b> in the future.</div><div class="xj">ケンは将来、医師になりたいと思っている。</div></button></li><li><button class="w" data-no="868"><div class="top"><span class="no">868</span><span class="en">analysis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">分析</div><div class="ex">The scientists made a careful <b>analysis</b> of the water.</div><div class="xj">科学者たちは、その水を注意深く分析した。</div></button></li><li><button class="w" data-no="869"><div class="top"><span class="no">869</span><span class="en">scenario</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">筋書き；シナリオ</div><div class="ex">The teacher gave us a <b>scenario</b> for our English role play.</div><div class="xj">先生は、英語のロールプレイ用の筋書きをくれた。</div></button></li><li><button class="w" data-no="870"><div class="top"><span class="no">870</span><span class="en">dilemma</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ジレンマ；板ばさみ</div><div class="ex">Choosing between the two clubs was a real <b>dilemma</b> for Emi.</div><div class="xj">2つの部のどちらかを選ぶのは、エミにとって本当のジレンマだった。</div></button></li><li><button class="w" data-no="871"><div class="top"><span class="no">871</span><span class="en">genre</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ジャンル；分野</div><div class="ex">What <b>genre</b> of music do you like best?</div><div class="xj">どんなジャンルの音楽がいちばん好きですか。</div></button></li><li><button class="w" data-no="872"><div class="top"><span class="no">872</span><span class="en">participation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">参加</div><div class="ex">Thank you for your <b>participation</b> in today&#x27;s event.</div><div class="xj">本日のイベントへのご参加、ありがとうございます。</div></button></li><li><button class="w" data-no="873"><div class="top"><span class="no">873</span><span class="en">destiny</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">運命</div><div class="ex">Tom believes it was his <b>destiny</b> to become a baker.</div><div class="xj">トムは、パン職人になるのが自分の運命だったと信じている。</div></button></li><li><button class="w" data-no="874"><div class="top"><span class="no">874</span><span class="en">trait</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">特徴；特性</div><div class="ex">Kindness is one of Emi&#x27;s best <b>traits</b>.</div><div class="xj">優しさは、エミのいちばんよい特徴の1つだ。</div></button></li><li><button class="w" data-no="875"><div class="top"><span class="no">875</span><span class="en">outlook</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見通し；見解</div><div class="ex">The weather <b>outlook</b> for the weekend is good.</div><div class="xj">週末の天気の見通しはよい。</div></button></li><li><button class="w" data-no="876"><div class="top"><span class="no">876</span><span class="en">frustration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欲求不満；いらだち</div><div class="ex">The players felt a lot of <b>frustration</b> because they couldn&#x27;t practice outside.</div><div class="xj">外で練習できないので、選手たちは強いいらだちを感じていた。</div></button></li><li><button class="w" data-no="877"><div class="top"><span class="no">877</span><span class="en">incentive</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">動機づけ；報奨金</div><div class="ex">Free gifts are a good <b>incentive</b> for customers to come back.</div><div class="xj">無料の景品は、客がまた来店するためのよい動機づけになる。</div></button></li><li><button class="w" data-no="878"><div class="top"><span class="no">878</span><span class="en">prevention</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">予防；防止</div><div class="ex">The city held an event about fire <b>prevention</b> last weekend.</div><div class="xj">市は先週末、火災予防についての行事を開いた。</div></button></li><li><button class="w" data-no="879"><div class="top"><span class="no">879</span><span class="en">elaborate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">手の込んだ；精巧な</div><div class="ex">Mom made an <b>elaborate</b> cake for my birthday.</div><div class="xj">母は私の誕生日に手の込んだケーキを作ってくれた。</div></button></li><li><button class="w" data-no="880"><div class="top"><span class="no">880</span><span class="en">moral</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">道徳の；道徳的な</div><div class="ex">Our school has a <b>moral</b> education class every week.</div><div class="xj">私たちの学校では、毎週道徳の授業がある。</div></button></li><li><button class="w" data-no="881"><div class="top"><span class="no">881</span><span class="en">promising</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有望な；見込みのある</div><div class="ex">Lisa is a <b>promising</b> young tennis player.</div><div class="xj">リサは有望な若いテニス選手だ。</div></button></li><li><button class="w" data-no="882"><div class="top"><span class="no">882</span><span class="en">voluntary</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">自発的な；ボランティアの</div><div class="ex">Joining the morning cleanup is <b>voluntary</b>, not required.</div><div class="xj">朝のそうじへの参加は、強制ではなく自発的なものだ。</div></button></li><li><button class="w" data-no="883"><div class="top"><span class="no">883</span><span class="en">overdue</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">期限が過ぎた；遅れた</div><div class="ex">This library book is two weeks <b>overdue</b>.</div><div class="xj">この図書館の本は、返却期限が過ぎて2週間になる。</div></button></li><li><button class="w" data-no="884"><div class="top"><span class="no">884</span><span class="en">prior</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">前の；（prior to ～で）～より前に</div><div class="ex">I couldn&#x27;t go because I had a <b>prior</b> appointment.</div><div class="xj">前からの約束があったので、私は行けなかった。</div></button></li><li><button class="w" data-no="885"><div class="top"><span class="no">885</span><span class="en">mechanical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">機械の；機械的な</div><div class="ex">The train stopped because of a <b>mechanical</b> problem.</div><div class="xj">その電車は機械の故障で止まった。</div></button></li><li><button class="w" data-no="886"><div class="top"><span class="no">886</span><span class="en">radical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">根本的な；過激な</div><div class="ex">The company made <b>radical</b> changes to its working hours.</div><div class="xj">その会社は、勤務時間に根本的な変更を加えた。</div></button></li><li><button class="w" data-no="887"><div class="top"><span class="no">887</span><span class="en">vital</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">きわめて重要な；生命の</div><div class="ex">Water is <b>vital</b> for all living things.</div><div class="xj">水はすべての生き物にとってきわめて重要だ。</div></button></li><li><button class="w" data-no="888"><div class="top"><span class="no">888</span><span class="en">compact</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">小型の；コンパクトな</div><div class="ex">This <b>compact</b> camera fits easily in my pocket.</div><div class="xj">この小型のカメラは、ポケットに楽に入る。</div></button></li><li><button class="w" data-no="889"><div class="top"><span class="no">889</span><span class="en">chronic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">慢性の</div><div class="ex">My grandfather has <b>chronic</b> pain in his back.</div><div class="xj">祖父には慢性の腰の痛みがある。</div></button></li><li><button class="w" data-no="890"><div class="top"><span class="no">890</s
