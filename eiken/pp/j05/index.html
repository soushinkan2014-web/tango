div class="ja">AをBとまちがえる</div><div class="ex">I mistook the man for my uncle because they look alike.</div><div class="xj">その男性はおじに似ていたので、おじとまちがえた。</div></button></li><li><button class="w" data-no="熟46"><div class="top"><span class="no">熟46</span><span class="en">take A for granted</span></div><div class="ja">Aを当然のことと思う</div><div class="ex">We often take clean water for granted.</div><div class="xj">私たちはきれいな水があるのを当たり前だと思いがちだ。</div></button></li><li><button class="w" data-no="熟47"><div class="top"><span class="no">熟47</span><span class="en">associate A with B</span></div><div class="ja">AでBを連想する、AとBを結びつける</div><div class="ex">Many people associate summer with fireworks.</div><div class="xj">多くの人は夏と言えば花火を連想する。</div></button></li><li><button class="w" data-no="熟48"><div class="top"><span class="no">熟48</span><span class="en">inform A of B</span></div><div class="ja">AにBを知らせる</div><div class="ex">Please inform us of any changes to your plans.</div><div class="xj">予定に変更があればお知らせください。</div></button></li><li><button class="w" data-no="熟49"><div class="top"><span class="no">熟49</span><span class="en">spend A on B</span></div><div class="ja">AをBに使う</div><div class="ex">She spends most of her money on books.</div><div class="xj">彼女はお金のほとんどを本に使う。</div></button></li><li><button class="w" data-no="熟50"><div class="top"><span class="no">熟50</span><span class="en">supply A with B</span></div><div class="ja">AにBを供給する</div><div class="ex">The farm supplies local schools with fresh vegetables.</div><div class="xj">その農場は地元の学校に新鮮な野菜を供給している。</div></button></li><li><button class="w" data-no="会21"><div class="top"><span class="no">会21</span><span class="en">I&#x27;d like to book ～.</span></div><div class="ja">～を予約したいのですが。</div><div class="ex">A: I&#x27;d like to book a room for two nights.<br>B: Certainly. Which dates would you like?</div></button></li><li><button class="w" data-no="会22"><div class="top"><span class="no">会22</span><span class="en">I need to cancel ～.</span></div><div class="ja">～を取り消さないといけません。</div><div class="ex">A: I need to cancel my appointment tomorrow.<br>B: No problem. Would you like to make a new one?</div></button></li><li><button class="w" data-no="会23"><div class="top"><span class="no">会23</span><span class="en">Could we change it to ～?</span></div><div class="ja">～に変えてもらえますか？</div><div class="ex">A: The meeting is at three, right?<br>B: Yes, but could we change it to four?</div></button></li><li><button class="w" data-no="会24"><div class="top"><span class="no">会24</span><span class="en">What time is good for you?</span></div><div class="ja">何時が都合いい？</div><div class="ex">A: Let&#x27;s meet tomorrow. What time is good for you?<br>B: Any time after lunch.</div></button></li><li><button class="w" data-no="会25"><div class="top"><span class="no">会25</span><span class="en">Are there any seats left?</span></div><div class="ja">まだ席は残っていますか？</div><div class="ex">A: Are there any seats left for tonight&#x27;s concert?<br>B: Only a few in the back.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j04/">← 熟語 Set 4</a><a href="../j06/">熟語 Set 6 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟41": 5.65, "熟42": 21.92, "熟43": 36.17, "熟44": 50.33, "熟45": 65.4, "熟46": 80.39, "熟47": 94.79, "熟48": 112.09, "熟49": 127.01, "熟50": 141.58, "会21": 157.63, "会22": 176.48, "会23": 196.3, "会24": 214.22, "会25": 232.62}, "TE": {"熟41": 7.74, "熟42": 24.08, "熟43": 38.43, "熟44": 52.85, "熟45": 67.65, "熟46": 82.53, "熟47": 97.28, "熟48": 114.49, "熟49": 129.48, "熟50": 144.1, "会21": 159.62, "会22": 178.64, "会23": 198.34, "会24": 216.55, "会25": 235.04}, "Q": [["熟41", "blame A for B", "BのことでAを責める"], ["熟42", "compare A with B", "AをBと比べる"], ["熟43", "turn A into B", "AをBに変える"], ["熟44", "divide A into B", "AをBに分ける"], ["熟45", "mistake A for B", "AをBとまちがえる"], ["熟46", "take A for granted", "Aを当然のことと思う"], ["熟47", "associate A with B"
