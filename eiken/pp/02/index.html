</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第2回</h1><div class="sub">No.51〜100</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">elect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を選挙で選ぶ</div><div class="ex">Our class <b>elected</b> Emi as class leader.</div><div class="xj">私たちのクラスは、エミを学級委員に選挙で選んだ。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">protest</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">抗議する</div><div class="ex">Many people <b>protested</b> against the plan to cut down the forest.</div><div class="xj">多くの人々が、森を切り開く計画に抗議した。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">capture</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を捕らえる；とらえる</div><div class="ex">The farmers finally <b>captured</b> the monkey that was eating their fruit.</div><div class="xj">農家の人たちは、果物を食べていたサルをついに捕らえた。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">devote</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（時間・力など）をささげる</div><div class="ex">The doctor <b>devoted</b> her life to helping poor children.</div><div class="xj">その医師は、貧しい子どもたちを助けることに一生をささげた。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">govern</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を治める；統治する</div><div class="ex">The king <b>governed</b> the country for forty years.</div><div class="xj">その王は40年間、国を治めた。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">frown</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">顔をしかめる；まゆをひそめる</div><div class="ex">Dad <b>frowned</b> when he saw my messy room.</div><div class="xj">父は散らかった私の部屋を見て、顔をしかめた。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">spray</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を吹きかける；スプレーする</div><div class="ex">Dad <b>sprayed</b> water on the plants in the garden.</div><div class="xj">父は庭の植物に水を吹きかけた。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">grasp</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をつかむ；理解する</div><div class="ex">The baby <b>grasped</b> my finger with her small hand.</div><div class="xj">赤ちゃんは小さな手で私の指をつかんだ。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">accelerate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">加速する；～を速める</div><div class="ex">The train <b>accelerated</b> as it left the station.</div><div class="xj">電車は駅を出ると加速した。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">maintenance</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">維持；整備</div><div class="ex">Old buildings need regular <b>maintenance</b> to stay safe.</div><div class="xj">古い建物は、安全を保つために定期的な維持管理が必要だ。</div></button></li><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">agreement</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">合意；協定</div><div class="ex">The two schools reached an <b>agreement</b> about the sports event.</div><div class="xj">2つの学校は、スポーツ大会について合意に達した。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">candidate</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">候補者</div><div class="ex">There are three <b>candidates</b> for student council president.</div><div class="xj">生徒会長には3人の候補者がいる。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">description</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">説明；描写</div><div class="ex">Read the <b>description</b> of the job carefully before you apply.</div><div class="xj">応募する前に、仕事の説明をよく読みなさい。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">exploration</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">探検；探査</div><div class="ex">Space <b>exploration</b> helps us learn more about other planets.</div><div class="xj">宇宙探査は、ほかの惑星についてもっと知るのに役立つ。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">mass</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">大量；かたまり</div><div class="ex">The desk was covered with a <b>mass</b> of papers.</div><div class="xj">机は大量の書類でおおわれていた。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">expectation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">期待；予想</div><div class="ex">The movie was much better than my <b>expectations</b>.</div><div class="xj">その映画は、私の期待よりずっとよかった。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">separation</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">分離；別れ</div><div class="ex">In science class, we learned about the <b>separation</b> of salt from water.</div><div class="xj">理科の授業で、水から塩を分離することについて学んだ。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">judgment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">判断；判決</div><div class="ex">I trust my coach&#x27;s <b>judgment</b> in important games.</div><div class="xj">大事な試合では、私はコーチの判断を信頼している。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">pace</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">速さ；ペース</div><div class="ex">The runner kept the same <b>pace</b> until the end of the race.</div><div class="xj">その走者は、レースの最後まで同じ速さを保った。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">civilization</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">文明</div><div class="ex">Ancient Egypt had one of the oldest <b>civilizations</b> in the world.</div><div class="xj">古代エジプトには、世界で最も古い文明の1つがあった。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">tendency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">傾向</div><div class="ex">Tom has a <b>tendency</b> to forget his homework.</div><div class="xj">トムは宿題を忘れる傾向がある。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">murder</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">殺人</div><div class="ex">The detective in this novel solves a <b>murder</b> case.</div><div class="xj">この小説の探偵は、殺人事件を解決する。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">philosopher</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">哲学者</div><div class="ex">My uncle likes to read books by ancient <b>philosophers</b>.</div><div class="xj">おじは古代の哲学者の本を読むのが好きだ。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">bride</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">花嫁</div><div class="ex">The <b>bride</b> wore a beautiful white dress.</div><div class="xj">花嫁は美しい白いドレスを着ていた。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">ignorance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">無知；知らないこと</div><div class="ex">His mistake came from <b>ignorance</b> of the rules.</div><div class="xj">彼の失敗は、ルールに対する無知が原因だった。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">cliff</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">がけ；絶壁</div><div class="ex">Don&#x27;t go near the edge of the <b>cliff</b>.</div><div class="xj">がけのふちに近づいてはいけない。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">minority</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">少数；少数派</div><div class="ex">Only a <b>minority</b> of students walk to school.</div><div class="xj">歩いて通学する生徒は、ごく少数だ。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">loyalty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">忠誠；忠実</div><div class="ex">Dogs are known for their <b>loyalty</b> to their owners.</div><div class="xj">犬は、飼い主に対する忠誠心で知られている。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">storage</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">保管；収納場所</div><div class="ex">We use the small room under the stairs for <b>storage</b>.</div><div class="xj">私たちは、階段の下の小部屋を物の保管に使っている。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">convention</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大会；慣習</div><div class="ex">My mother went to a <b>convention</b> for nurses in Tokyo.</div><div class="xj">母は東京で開かれた看護師の大会に行った。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">scale</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">規模；はかり</div><div class="ex">The festival was held on a large <b>scale</b> this year.</div><div class="xj">今年の祭りは、大規模に開かれた。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">sweat</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">汗</div><div class="ex">After the long run, Ken was covered in <b>sweat</b>.</div><div class="xj">長い距離を走ったあと、ケンは汗びっしょりだった。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">grand</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">壮大な；雄大な</div><div class="ex">The hotel has a <b>grand</b> view of the mountains.</div><div class="xj">そのホテルからは、山の壮大な景色が見える。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">gorgeous</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">豪華な；すばらしい</div><div class="ex">Lisa wore a <b>gorgeous</b> dress to the party.</div><div class="xj">リサはパーティーに豪華なドレスを着ていった。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">authentic</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">本物の</div><div class="ex">This small restaurant serves <b>authentic</b> Italian food.</div><div class="xj">この小さなレストランは、本物のイタリア料理を出す。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">polar</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">北極の；極地の</div><div class="ex"><b>Polar</b> bears live in very cold places.</div><div class="xj">北極グマはとても寒い場所に住んでいる。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">complex</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">複雑な</div><div class="ex">This math problem is too <b>complex</b> for me.</div><div class="xj">この数学の問題は、私には複雑すぎる。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">stuck</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">動けない；行き詰まった</div><div class="ex">We were <b>stuck</b> in traffic for two hours.</div><div class="xj">私たちは2時間、渋滞で動けなかった。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">upper</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">上の；上部の</div><div class="ex">My room is on the <b>upper</b> floor of the house.</div><div class="xj">私の部屋は、家の上の階にある。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">consistent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">一貫した；変わらない</div><div class="ex">Ken&#x27;s opinion has been <b>consistent</b> from the start.</div><div class="xj">ケンの意見は、最初から一貫している。</div></button></li><li><button class="w" data-no="91"><div c
