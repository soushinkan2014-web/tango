</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第8回</h1><div class="sub">No.351〜400</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">digest</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を消化する</div><div class="ex">Babies cannot <b>digest</b> some kinds of food well.</div><div class="xj">赤ちゃんは、ある種の食べ物をうまく消化することができない。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">exaggerate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を大げさに言う</div><div class="ex">Ken always <b>exaggerates</b> when he talks about his fishing trips.</div><div class="xj">ケンは釣りに行った話をするとき、いつも大げさに言う。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">recruit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を募集する；採用する</div><div class="ex">The soccer club is <b>recruiting</b> new members this month.</div><div class="xj">サッカー部は今月、新しい部員を募集している。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">endure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に耐える；我慢する</div><div class="ex">The runners <b>endured</b> the heat until the end of the race.</div><div class="xj">ランナーたちは、レースの最後まで暑さに耐えた。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">assume</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～と思い込む；仮定する</div><div class="ex">I <b>assumed</b> that the store was open on Sunday.</div><div class="xj">私は、その店は日曜日も開いていると思い込んでいた。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">manufacture</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を製造する</div><div class="ex">This factory <b>manufactures</b> parts for cars and bikes.</div><div class="xj">この工場は、車や自転車の部品を製造している。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">migrate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（鳥などが）渡る；移住する</div><div class="ex">Every autumn, these birds <b>migrate</b> to warmer countries.</div><div class="xj">毎年秋になると、これらの鳥は暖かい国へ渡る。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">define</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を定義する</div><div class="ex">Can you <b>define</b> the word happiness in English?</div><div class="xj">「幸せ」という言葉を英語で定義することができますか。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">evolve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">進化する；発展する</div><div class="ex">Scientists believe that birds <b>evolved</b> from dinosaurs.</div><div class="xj">科学者たちは、鳥は恐竜から進化したと考えている。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">sneeze</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">くしゃみをする</div><div class="ex">Emi <b>sneezed</b> three times because of the dust.</div><div class="xj">エミはほこりのせいで3回くしゃみをした。</div></button></li><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">pioneer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">先駆者；開拓者</div><div class="ex">She was a <b>pioneer</b> in the study of space.</div><div class="xj">彼女は宇宙研究の先駆者だった。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">choir</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">合唱団；聖歌隊</div><div class="ex">Emi sings in the school <b>choir</b> every Tuesday.</div><div class="xj">エミは毎週火曜日に、学校の合唱団で歌っている。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">tomb</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">墓</div><div class="ex">Many tourists visit the <b>tomb</b> of an old king in this park.</div><div class="xj">この公園では、多くの観光客が昔の王の墓を訪れる。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">fossil</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">化石</div><div class="ex">Ken found a small <b>fossil</b> of a shell on the beach.</div><div class="xj">ケンは浜辺で、小さな貝の化石を見つけた。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">cattle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（集合的に）牛</div><div class="ex">The farmer raises <b>cattle</b> on a large farm in Hokkaido.</div><div class="xj">その農家は、北海道の大きな牧場で牛を育てている。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">extinction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">絶滅</div><div class="ex">Many kinds of animals are in danger of <b>extinction</b>.</div><div class="xj">多くの種類の動物が絶滅の危機にある。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">strategy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">戦略；作戦</div><div class="ex">Our coach explained a new <b>strategy</b> for the next game.</div><div class="xj">コーチは次の試合のための新しい戦略を説明した。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">stuff</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">物；持ち物</div><div class="ex">There is a lot of <b>stuff</b> in my brother&#x27;s room.</div><div class="xj">兄の部屋にはたくさんの物がある。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">prediction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">予測；予言</div><div class="ex">Lisa&#x27;s <b>prediction</b> about the game was correct.</div><div class="xj">試合についてのリサの予測は当たっていた。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">confusion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混乱</div><div class="ex">There was some <b>confusion</b> about the meeting time.</div><div class="xj">集合時間について、少し混乱があった。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">mud</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">泥</div><div class="ex">After playing in the rain, the boys were covered in <b>mud</b>.</div><div class="xj">雨の中で遊んだあと、男の子たちは泥だらけだった。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">penalty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">罰；罰金</div><div class="ex">There is a <b>penalty</b> for returning library books late.</div><div class="xj">図書館の本を返すのが遅れると、罰がある。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">ritual</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">儀式；習慣的な行為</div><div class="ex">The village holds an old <b>ritual</b> every summer to pray for rain.</div><div class="xj">その村では毎年夏に、雨を祈る昔からの儀式が行われる。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">corporation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">企業；法人</div><div class="ex">My aunt works for a large <b>corporation</b> in Tokyo.</div><div class="xj">おばは東京の大きな企業で働いている。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">arrangement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手配；（複数形で）準備</div><div class="ex">Ken made <b>arrangements</b> for the hotel and the train tickets.</div><div class="xj">ケンはホテルと電車の切符の手配をした。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">addiction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">中毒；依存</div><div class="ex">Playing games every night can lead to an <b>addiction</b>.</div><div class="xj">毎晩ゲームをしていると、中毒になることがある。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">basis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">基礎；根拠</div><div class="ex">Good sleep is the <b>basis</b> of good health.</div><div class="xj">よい睡眠は健康の基礎だ。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">allergy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">アレルギー</div><div class="ex">Tom has an <b>allergy</b> to eggs, so he can&#x27;t eat this cake.</div><div class="xj">トムは卵アレルギーなので、このケーキを食べられない。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">minimum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">最小限；最低限</div><div class="ex">You need to sleep a <b>minimum</b> of seven hours a night.</div><div class="xj">一晩に最低限7時間は眠る必要がある。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">supplement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">栄養補助食品；補足</div><div class="ex">My mother takes a vitamin <b>supplement</b> every morning.</div><div class="xj">母は毎朝、ビタミンのサプリメントを飲んでいる。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">conservation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（自然などの）保護；保存</div><div class="ex">The group works for the <b>conservation</b> of wild birds.</div><div class="xj">そのグループは、野鳥の保護のために活動している。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">width</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">幅</div><div class="ex">Please measure the <b>width</b> of the window.</div><div class="xj">窓の幅を測ってください。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">rainforest</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">熱帯雨林</div><div class="ex">Many kinds of plants and animals live in the <b>rainforest</b>.</div><div class="xj">熱帯雨林には、多くの種類の動植物がすんでいる。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">revolution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">革命；大変革</div><div class="ex">The Internet caused a <b>revolution</b> in the way we communicate.</div><div class="xj">インターネットは、私たちの連絡の取り方に革命を起こした。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">layer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">層</div><div class="ex">This cake has three <b>layers</b> of cream.</div><div class="xj">このケーキはクリームが3層になっている。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">mammal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">哺乳動物</div><div class="ex">Whales live in the sea, but they are <b>mammals</b>.</div><div class="xj">クジラは海にすんでいるが、哺乳動物だ。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">wound</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">傷；けが</div><div class="ex">The nurse cleaned the <b>wound</b> on Ken&#x27;s knee.</div><div class="xj">看護師はケンのひざの傷をきれいにした。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">privilege</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">特権；名誉</div><div class="ex">Third-year students have the <b>privilege</b> of using this room.</div><div class="xj">3年生には、この部屋を使える特権がある。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">deposit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">預金；頭金</div><div class="ex">Lisa made a <b>deposit</b> of 5,000 yen at the bank.</div><div class="xj">リサは銀行に5,000円の預金をした。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">identity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">身元；独自性</div><div class="ex">You need to show your student card to prove your <b>identity</b>.</div><div class="xj">身元を証明するには、学生証を見せる必要がある。</div></button></li><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">feedback</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">意見；反応</div><div class="ex">Our teacher gave us useful <b>feedback</b> on our essays.</div><div class="xj">先生は私たちの作文について、役に立つ意見をくれた。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">marine</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">海の；海洋の</div><div class="ex">Lisa wants to study <b>marine</b> animals at university.</div><div class="xj">リサは大学で海の生き物を研究したいと思っている。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">abundant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">豊富な</div><div class="ex">Fish are <b>abundant</b> in this river, so many birds come here.</div><div class="xj">この川は魚が豊富なので、多くの鳥がやって来る。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">precise</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">正確な；精密な</div><div class="ex">Scientists need <b>precise</b> data for their research.</div><div class="xj">科学者は、研究のために正確なデータを必要とする。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">sufficient</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">十分な</div><div class="ex">We don&#x27;t have <b>sufficient</b> time to finish the project today.</div><div class="xj">今日は、その課題を終えるのに十分な時間がない。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">reluctant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">気が進まない；（be reluctant to doで）～し
