</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第12回</h1><div class="sub">No.551〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">confront</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に立ち向かう；直面する</div><div class="ex">Ken <b>confronted</b> his fear and jumped into the pool.</div><div class="xj">ケンは恐怖に立ち向かい、プールに飛び込んだ。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">recital</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">リサイタル；発表会</div><div class="ex">Emi played the piano at her first <b>recital</b>.</div><div class="xj">エミは初めての発表会でピアノをひいた。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">workout</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">運動；トレーニング</div><div class="ex">I do a short <b>workout</b> every morning before school.</div><div class="xj">私は毎朝、学校へ行く前に短い運動をする。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">academy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">学院；専門学校</div><div class="ex">My sister studies ballet at an <b>academy</b> in the city.</div><div class="xj">姉は市内の専門学校でバレエを学んでいる。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">involvement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">関わり；参加</div><div class="ex">Parents&#x27; <b>involvement</b> in school events is very important.</div><div class="xj">学校行事への保護者の関わりはとても大切だ。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">leather</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">革；皮革</div><div class="ex">My father bought a <b>leather</b> bag for work.</div><div class="xj">父は仕事用に革のかばんを買った。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">radar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">レーダー</div><div class="ex">The ship used <b>radar</b> to find its way in the fog.</div><div class="xj">その船は霧の中で進路を見つけるためにレーダーを使った。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">republic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">共和国</div><div class="ex">France is a <b>republic</b> with a long history.</div><div class="xj">フランスは長い歴史をもつ共和国だ。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">plaza</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">広場；ショッピングセンター</div><div class="ex">There is a big Christmas tree in the <b>plaza</b>.</div><div class="xj">広場に大きなクリスマスツリーがある。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">referee</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">審判</div><div class="ex">The <b>referee</b> stopped the game because of the rain.</div><div class="xj">審判は雨のため試合を止めた。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">misunderstanding</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">誤解</div><div class="ex">There was a <b>misunderstanding</b> about the meeting time.</div><div class="xj">会議の時間について誤解があった。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">doorway</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">戸口；出入り口</div><div class="ex">Our cat likes to sleep in the <b>doorway</b>.</div><div class="xj">うちのねこは戸口で寝るのが好きだ。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">homestay</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ホームステイ</div><div class="ex">Lisa enjoyed her <b>homestay</b> in Canada last summer.</div><div class="xj">リサは去年の夏、カナダでのホームステイを楽しんだ。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">triumph</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">勝利；大成功</div><div class="ex">Winning the national contest was a great <b>triumph</b> for our team.</div><div class="xj">全国大会での優勝は、私たちのチームにとって大きな勝利だった。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">critic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">批評家</div><div class="ex">The movie got good reviews from many <b>critics</b>.</div><div class="xj">その映画は多くの批評家からよい評価を受けた。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">interior</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">内部；室内</div><div class="ex">The <b>interior</b> of the old church was beautiful.</div><div class="xj">その古い教会の内部は美しかった。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">arena</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">競技場；アリーナ</div><div class="ex">Thousands of fans came to the <b>arena</b> for the concert.</div><div class="xj">何千人ものファンが、コンサートのためにアリーナにやって来た。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">bubble</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">泡</div><div class="ex">The children enjoyed making soap <b>bubbles</b> in the park.</div><div class="xj">子どもたちは公園でシャボンの泡を作って楽しんだ。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">scandal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">不祥事；スキャンダル</div><div class="ex">The <b>scandal</b> made the company lose many customers.</div><div class="xj">その不祥事で、会社は多くの客を失った。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">creator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">創作者；作者</div><div class="ex">The <b>creator</b> of this game is only twenty years old.</div><div class="xj">このゲームの創作者は、まだ20歳だ。</div></button></li><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">psychologist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">心理学者</div><div class="ex">The <b>psychologist</b> gave a talk about stress.</div><div class="xj">その心理学者はストレスについて講演をした。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">activist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">活動家</div><div class="ex">The young <b>activist</b> works to protect the ocean.</div><div class="xj">その若い活動家は、海を守るために活動している。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">individuality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">個性</div><div class="ex">Our school respects the <b>individuality</b> of each student.</div><div class="xj">私たちの学校は、生徒一人ひとりの個性を大切にしている。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">honeymoon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">新婚旅行</div><div class="ex">My aunt went to Hawaii on her <b>honeymoon</b>.</div><div class="xj">おばは新婚旅行でハワイに行った。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">concentration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">集中；集中力</div><div class="ex">Playing chess needs a lot of <b>concentration</b>.</div><div class="xj">チェスをするには、高い集中力が必要だ。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">cleanup</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">清掃；片付け</div><div class="ex">We joined the beach <b>cleanup</b> on Sunday morning.</div><div class="xj">私たちは日曜日の朝、海岸の清掃に参加した。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">intention</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">意図；つもり</div><div class="ex">Ken&#x27;s <b>intention</b> was to help, not to hurt anyone.</div><div class="xj">ケンの意図は手助けすることで、だれかを傷つけることではなかった。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">flexibility</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">柔軟性；融通</div><div class="ex">Yoga can improve the <b>flexibility</b> of your body.</div><div class="xj">ヨガで体の柔軟性を高めることができる。</div></butt
