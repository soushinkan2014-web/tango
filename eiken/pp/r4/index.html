="xj">私たちのチームは市の大会で優勝することを目指している。</div></button></li><li><button class="w" data-no="復155"><div class="top"><span class="no">復155</span><span class="en">relate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（be related to ～）～と関係がある</div><div class="ex">This question is <b>related</b> to today&#x27;s lesson.</div><div class="xj">この質問は今日の授業と関係がある。</div></button></li><li><button class="w" data-no="復156"><div class="top"><span class="no">復156</span><span class="en">translate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を翻訳する</div><div class="ex">Can you <b>translate</b> this letter into Japanese?</div><div class="xj">この手紙を日本語に翻訳してくれますか。</div></button></li><li><button class="w" data-no="復157"><div class="top"><span class="no">復157</span><span class="en">appreciate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に感謝する；～を正しく評価する</div><div class="ex">I really <b>appreciate</b> your kind help.</div><div class="xj">親切に手伝ってくれて、本当に感謝します。</div></button></li><li><button class="w" data-no="復158"><div class="top"><span class="no">復158</span><span class="en">stick</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～をはりつける；くっつく</div><div class="ex">Emi <b>stuck</b> a photo of her dog on the wall.</div><div class="xj">エミは壁に犬の写真をはりつけた。</div></button></li><li><button class="w" data-no="復159"><div class="top"><span class="no">復159</span><span class="en">complete</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を完成させる；仕上げる</div><div class="ex">Tom <b>completed</b> his model ship last night.</div><div class="xj">トムは昨夜、船の模型を完成させた。</div></button></li><li><button class="w" data-no="復160"><div class="top"><span class="no">復160</span><span class="en">gain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を得る；（体重など）を増やす</div><div class="ex">My sister <b>gained</b> a lot of experience at her part-time job.</div><div class="xj">姉はアルバイトで多くの経験を得た。</div></button></li><li><button class="w" data-no="復161"><div class="top"><span class="no">復161</span><span class="en">honor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">名誉；光栄</div><div class="ex">It is a great <b>honor</b> to speak at this event.</div><div class="xj">このイベントでスピーチできるのは大変な名誉です。</div></button></li><li><button class="w" data-no="復162"><div class="top"><span class="no">復162</span><span class="en">transportation</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">交通機関；輸送</div><div class="ex">Many people in this city use public <b>transportation</b>.</div><div class="xj">この市では多くの人が公共交通機関を使う。</div></button></li><li><button class="w" data-no="復163"><div class="top"><span class="no">復163</span><span class="en">chemical</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">化学物質；化学薬品</div><div class="ex">Some <b>chemicals</b> can be dangerous to fish.</div><div class="xj">化学物質の中には、魚にとって危険なものもある。</div></button></li><li><button class="w" data-no="復164"><div class="top"><span class="no">復164</span><span class="en">route</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">道筋；ルート</div><div class="ex">Let&#x27;s check the <b>route</b> to the museum on the map.</div><div class="xj">地図で、博物館までのルートを確かめよう。</div></button></li><li><button class="w" data-no="復165"><div class="top"><span class="no">復165</span><span class="en">professor</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">教授</div><div class="ex">My uncle is a history <b>professor</b> at a university.</div><div class="xj">おじは大学の歴史の教授だ。</div></button></li><li><button class="w" data-no="復166"><div class="top"><span class="no">復166</span><span class="en">request</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">依頼；要望</div><div class="ex">Ken agreed to his friend&#x27;s <b>request</b> for help.</div><div class="xj">ケンは友だちの手伝いの依頼を引き受けた。</div></button></li><li><button class="w" data-no="復167"><div class="top"><span class="no">復167</span><span class="en">tourism</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">観光業</div><div class="ex"><b>Tourism</b> is important for this small island.</div><div class="xj">この小さな島にとって観光業は大切だ。</div></button></li><li><button class="w" data-no="復168"><div class="top"><span class="no">復168</span><span class="en">process</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">過程；手順</div><div class="ex">We learned about the <b>process</b> of making paper.</div><div class="xj">私たちは紙を作る過程について学んだ。</div></button></li><li><button class="w" data-no="復169"><div class="top"><span class="no">復169</span><span class="en">weight</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">重さ；体重</div><div class="ex">What is the <b>weight</b> of this watermelon?</div><div class="xj">このスイカの重さはどれくらいですか。</div></button></li><li><button class="w" data-no="復170"><div class="top"><span class="no">復170</span><span class="en">lifestyle</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">生活様式；ライフスタイル</div><div class="ex">Eating vegetables is part of a healthy <b>lifestyle</b>.</div><div class="xj">野菜を食べることは、健康的な生活様式の一部だ。</div></button></li><li><button class="w" data-no="復171"><div class="top"><span class="no">復171</span><span class="en">shelter</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">避難所；保護施設</div><div class="ex">During the storm, people stayed in the <b>shelter</b>.</div><div class="xj">嵐の間、人々は避難所にとどまった。</div></button></li><li><button class="w" data-no="復172"><div class="top"><span class="no">復172</span><span class="en">organization</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">組織；団体</div><div class="ex">Emi joined an <b>organization</b> that protects animals.</div><div class="xj">エミは動物を守る組織に入った。</div></button></li><li><button class="w" data-no="復173"><div class="top"><span class="no">復173</span><span class="en">attraction</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">呼び物；名所；魅力</div><div class="ex">This castle is the main <b>attraction</b> of the town.</div><div class="xj">この城は町いちばんの呼び物だ。</div></button></li><li><button class="w" data-no="復174"><div class="top"><span class="no">復174</span><span class="en">sight</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">視力；光景；（sightsで）名所</div><div class="ex">My grandmother&#x27;s <b>sight</b> is getting worse.</div><div class="xj">祖母の視力は悪くなってきている。</div></button></li><li><button class="w" data-no="復175"><div class="top"><span class="no">復175</span><span class="en">pollution</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">汚染；公害</div><div class="ex">Cars are one cause of air <b>pollution</b>.</div><div class="xj">車は大気汚染の原因の一つだ。</div></button></li><li><button class="w" data-no="復176"><div class="top"><span class="no">復176</span><span class="en">salary</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">給料</div><div class="ex">My sister&#x27;s <b>salary</b> went up this year.</div><div class="xj">今年、姉の給料が上がった。</div></button></li><li><button class="w" data-no="復177"><div class="top"><span class="no">復177</span><span class="en">shortage</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">不足</div><div class="ex">The town is facing a water <b>shortage</b> this summer.</div><div class="xj">この夏、町は水不足に直面している。</div></button></li><li><button class="w" data-no="復178"><div class="top"><span class="no">復178</span><span class="en">crime</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">犯罪</div><div class="ex">The town is safe and has little <b>crime</b>.</div><div class="xj">その町は安全で、犯罪がほとんどない。</div></button></ lass="w" data-no="復185"><div class="top"><span class="no">復185</span><span class="en">seed</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">種</div><div class="ex">We planted sunflower <b>seeds</b> in the school garden.</div><div class="xj">私たちは学校の花だんにヒマワリの種をまいた。</div></button></li><li><button class="w" data-no="復186"><div class="top"><span class="no">復186</span><span class="en">actual</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">実際の</div><div class="ex">The <b>actual</b> price was higher than we thought.</div><div class="xj">実際の値段は、思っていたより高かった。</div></button></li><li><button class="w" data-no="復187"><div class="top"><span class="no">復187</span><span class="en">official</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">公式の；公の</div><div class="ex">This is the <b>official</b> website of our city.</div><div class="xj">これは私たちの市の公式のウェブサイトだ。</div></button></li><li><button class="w" data-no="復188"><div class="top"><span class="no">復188</span><span class="en">regular</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">規則正しい；ふつうの</div><div class="ex">It is important to eat <b>regular</b> meals.</div><div class="xj">規則正しい食事をとることが大切だ。</div></button></li><li><button class="w" data-no="復189"><div class="top"><span class="no">復189</span><span class="en">royal</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">王の；王室の</div><div class="ex">Long ago, the <b>royal</b> family lived in this castle.</div><div class="xj">昔、この城には王の一家が住んでいた。</div></button></li><li><button class="w" data-no="復190"><div class="top"><span class="no">復190</span><span class="en">western</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">西の；西洋の</div><div class="ex">The sun sets in the <b>western</b> sky.</div><div class="xj">太陽は西の空に沈む。</div></button></li><li><button class="w" data-no="復191"><div class="top"><span class="no"
