n">in vain</span></div><div class="ja">むだに、むだな</div><div class="ex">We looked for the lost ring all day, but in vain.</div><div class="xj">私たちは一日中なくした指輪をさがしたが、むだだった。</div></button></li><li><button class="w" data-no="熟56"><div class="top"><span class="no">熟56</span><span class="en">in a row</span></div><div class="ja">連続して</div><div class="ex">Our team has won five games in a row.</div><div class="xj">私たちのチームは5試合連続で勝っている。</div></button></li><li><button class="w" data-no="熟57"><div class="top"><span class="no">熟57</span><span class="en">in time (for ～)</span></div><div class="ja">（～に）間に合って</div><div class="ex">We arrived at the theater in time for the show.</div><div class="xj">私たちはショーに間に合うように劇場に着いた。</div></button></li><li><button class="w" data-no="熟58"><div class="top"><span class="no">熟58</span><span class="en">on board</span></div><div class="ja">（乗り物に）乗って</div><div class="ex">There were about 200 passengers on board the ship.</div><div class="xj">その船には約200人の乗客が乗っていた。</div></button></li><li><button class="w" data-no="熟59"><div class="top"><span class="no">熟59</span><span class="en">on second thought</span></div><div class="ja">考え直してみると</div><div class="ex">I&#x27;ll have coffee. On second thought, I&#x27;ll have tea.</div><div class="xj">コーヒーにします。いや、やっぱり紅茶にします。</div></button></li><li><button class="w" data-no="熟60"><div class="top"><span class="no">熟60</span><span class="en">on the spot</span></div><div class="ja">その場で、即座に</div><div class="ex">He was offered the job on the spot.</div><div class="xj">彼はその場で採用が決まった。</div></button></li><li><button class="w" data-no="会26"><div class="top"><span class="no">会26</span><span class="en">How can I get to ～?</span></div><div class="ja">～へはどう行けばいいですか？</div><div class="ex">A: Excuse me. How can I get to the museum?<br>B: Take the Number 5 bus.</div></button></li><li><button class="w" data-no="会27"><div class="top"><span class="no">会27</span><span class="en">Does this bus go to ～?</span></div><div class="ja">このバスは～へ行きますか？</div><div class="ex">A: Does this bus go to the airport?<br>B: No. You need to take the blue one.</div></button></li><li><button class="w" data-no="会28"><div class="top"><span class="no">会28</span><span class="en">It&#x27;s just around the corner.</span></div><div class="ja">すぐそこの角を曲がったところです。</div><div class="ex">A: Is there a bank near here?<br>B: Yes. It&#x27;s just around the corner.</div></button></li><li><button class="w" data-no="会29"><div class="top"><span class="no">会29</span><span class="en">You&#x27;ll see it on your right.</span></div><div class="ja">右手に見えますよ。</div><div class="ex">A: Where is the post office?<br>B: Walk straight, and you&#x27;ll see it on your right.</div></button></li><li><button class="w" data-no="会30"><div class="top"><span class="no">会30</span><span class="en">I&#x27;m a stranger here myself.</span></div><div class="ja">私もこのあたりは初めてなんです。</div><div class="ex">A: Excuse me. Where&#x27;s the city hall?<br>B: Sorry, I&#x27;m a stranger here myself.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j05/">← 熟語 Set 5</a><a href="../j07/">熟語 Set 7 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟51": 5.84, "熟52": 21.01, "熟53": 35.93, "熟54": 49.9, "熟55": 65.83, "熟56": 79.82, "熟57": 93.04, "熟58": 107.7, "熟59": 121.44, "熟60": 137.3, "会26": 150.67, "会27": 169.14, "会28": 187.92, "会29": 207.09, "会30": 224.51}, "TE": {"熟51": 7.84, "熟52": 23.0, "熟53": 37.85, "熟54": 52.34, "熟55": 67.7, "熟56": 81.69, "熟57": 95.36, "熟58": 109.57, "熟59": 123.58, "熟60": 139.18, "会26": 152.64, "会27": 171.32, "会28": 190.28, "会29": 209.42, "会30": 227.2}, "Q": [["熟51", "in my opinion", "私の意見では"], ["熟52", "in spite of ～", "～にもかかわらず"], ["熟53", "in particular", "特に"], ["熟54", "in return (for ～)", "お返しに"], ["熟55", "in vain", "むだに、むだな"], ["熟56", "in a row", "連続して"], ["熟57", "in time (for ～)", "間に合って"], ["熟58", "on board", "乗って"], ["熟59", "on sec
