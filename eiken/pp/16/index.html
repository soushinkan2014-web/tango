problem of trash.</div><div class="xj">私たちの市は、ごみ問題に取り組もうとしている。</div></button></li><li><button class="w" data-no="755"><div class="top"><span class="no">755</span><span class="en">coordinate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を調整する；まとめる</div><div class="ex">Emi <b>coordinated</b> everyone&#x27;s schedules for the class trip.</div><div class="xj">エミはクラス旅行のために、みんなの予定を調整した。</div></button></li><li><button class="w" data-no="756"><div class="top"><span class="no">756</span><span class="en">reassure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を安心させる</div><div class="ex">The doctor <b>reassured</b> Emi that her cold was not serious.</div><div class="xj">医者は、かぜは重くないと言ってエミを安心させた。</div></button></li><li><button class="w" data-no="757"><div class="top"><span class="no">757</span><span class="en">incorporate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り入れる；組み込む</div><div class="ex">Our team <b>incorporated</b> new ideas into the practice plan.</div><div class="xj">私たちのチームは、練習計画に新しいアイデアを取り入れた。</div></button></li><li><button class="w" data-no="758"><div class="top"><span class="no">758</span><span class="en">repay</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を返済する；～に報いる</div><div class="ex">Ken <b>repaid</b> the money he borrowed from his brother.</div><div class="xj">ケンは兄から借りたお金を返済した。</div></button></li><li><button class="w" data-no="759"><div class="top"><span class="no">759</span><span class="en">assess</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を評価する；査定する</div><div class="ex">Teachers <b>assess</b> students&#x27; speaking skills in the interview test.</div><div class="xj">先生たちは面接テストで、生徒の話す力を評価する。</div></button></li><li><button class="w" data-no="760"><div class="top"><span class="no">760</span><span class="en">enclose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を同封する；囲む</div><div class="ex">I <b>enclosed</b> a photo with my letter to Grandma.</div><div class="xj">私は祖母への手紙に写真を同封した。</div></button></li><li><button class="w" data-no="761"><div class="top"><span class="no">761</span><span class="en">diminish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">減る；～を減らす</div><div class="ex">The number of fish in this river has <b>diminished</b>.</div><div class="xj">この川の魚の数は減ってきた。</div></button></li><li><button class="w" data-no="762"><div class="top"><span class="no">762</span><span class="en">surpass</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を上回る；しのぐ</div><div class="ex">Ken&#x27;s new score <b>surpassed</b> his best record from last year.</div><div class="xj">ケンの新しい得点は、去年の自己最高記録を上回った。</div></button></li><li><button class="w" data-no="763"><div class="top"><span class="no">763</span><span class="en">hygiene</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">衛生</div><div class="ex">The nurse taught us about <b>hygiene</b> and hand washing.</div><div class="xj">看護師さんが、衛生と手洗いについて教えてくれた。</div></button></li><li><button class="w" data-no="764"><div class="top"><span class="no">764</span><span class="en">compassion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">思いやり；同情</div><div class="ex">Emi showed <b>compassion</b> for the lost little boy.</div><div class="xj">エミは迷子の小さな男の子に思いやりを示した。</div></button></li><li><button class="w" data-no="765"><div class="top"><span class="no">765</span><span class="en">compromise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">妥協；歩み寄り</div><div class="ex">Ken and his sister found a <b>compromise</b> on which show to watch.</div><div class="xj">ケンと妹は、どの番組を見るかについて妥協点を見つけた。</div></button></li><li><button class="w" data-no="766"><div class="top"><span class="no">766</span><span class="en">controversy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">論争；議論</div><div class="ex">The new school rule caused a lot of <b>controversy</b>.</div><div class="xj">新しい校則は、多くの論争を引き起こした。</div></button></li><li><button class="w" data-no="767"><div class="top"><span class="no">767</span><span class="en">bond</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">きずな；結びつき</div><div class="ex">Playing sports together created a strong <b>bond</b> between the boys.</div><div class="xj">いっしょにスポーツをしたことで、少年たちの間に強いきずなが生まれた。</div></button></li><li><button class="w" data-no="768"><div class="top"><span class="no">768</span><span class="en">medication</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">薬；投薬</div><div class="ex">Grandpa takes his <b>medication</b> after every meal.</div><div class="xj">祖父は毎食後に薬を飲む。</div></button></li><li><button class="w" data-no="769"><div class="top"><span class="no">769</span><span class="en">criteria</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（判断の）基準</div><div class="ex">The judges explained the <b>criteria</b> for the speech contest.</div><div class="xj">審査員たちは、スピーチコンテストの基準を説明した。</div></button></li><li><button class="w" data-no="770"><div class="top"><span class="no">770</span><span class="en">framework</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">枠組み；構造</div><div class="ex">The teachers made a <b>framework</b> for the new English course.</div><div class="xj">先生たちは、新しい英語の授業の枠組みを作った。</div></button></li><li><button class="w" data-no="771"><div class="top"><span class="no">771</span><span class="en">earnings</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">収入；所得</div><div class="ex">Tom saves half of his <b>earnings</b> from his part-time job.</div><div class="xj">トムはアルバイトの収入の半分を貯金している。</div></button></li><li><button class="w" data-no="772"><div class="top"><span class="no">772</span><span class="en">therapy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">療法；治療</div><div class="ex">Music <b>therapy</b> can help people relax and feel better.</div><div class="xj">音楽療法は、人がリラックスして気分をよくするのに役立つ。</div></button></li><li><button class="w" data-no="773"><div class="top"><span class="no">773</span><span class="en">scope</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">範囲；余地</div><div class="ex">This question is outside the <b>scope</b> of today&#x27;s lesson.</div><div class="xj">この質問は、今日の授業の範囲外だ。</div></button></li><li><button class="w" data-no="774"><div class="top"><span class="no">774</span><span class="en">conscience</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">良心</div><div class="ex">Tom followed his <b>conscience</b> and told the truth.</div><div class="xj">トムは自分の良心に従って、本当のことを話した。</div></button></li><li><button class="w" data-no="775"><div class="top"><span class="no">775</span><span class="en">correction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">訂正；修正</div><div class="ex">The teacher made a few <b>corrections</b> to my essay.</div><div class="xj">先生は私の作文に少し訂正を加えた。</div></button></li><li><button class="w" data-no="776"><div class="top"><span class="no">776</span><span class="en">output</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生産高；出力</div><div class="ex">The factory increased its <b>output</b> by ten percent this year.</div><div class="xj">その工場は今年、生産高を10パーセント増やした。</div></button></li><li><button class="w" data-no="777"><div class="top"><span class="no">777</span><span class="en">resistance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">抵抗；抵抗力</div><div class="ex">There was strong <b>resistance</b> to the plan to close the library.</div><div class="xj">図書館を閉める計画には、強い抵抗があった。</div></button></li><li><button class="w" data-no="778"><div class="top"><span class="no">778</span><span class="en">gender</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">性；性別</div><div class="ex">This club is open to people of any age or <b>gender</b>.</div><div class="xj">このクラブには、年齢や性別に関係なくだれでも入れる。</div></button></li><li><button class="w" data-no="779"><div class="top"><span class="no">779</span><span class="en">remedy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">治療法；解決策</div><div class="ex">Hot ginger tea is a popular <b>remedy</b> for colds.</div><div class="xj">熱いしょうが湯は、かぜのよく知られた治療法だ。</div></button></li><li><button class="w" data-no="780"><div class="top"><span class="no">780</span><span class="en">publicity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宣伝；評判</div><div class="ex">The festival got a lot of <b>publicity</b> on social media.</div><div class="xj">その祭りは、SNSで大いに宣伝された。</div></button></li><li><button class="w" data-no="781"><div class="top"><span class="no">781</span><span class="en">expertise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">専門知識；専門技術</div><div class="ex">We need someone with <b>expertise</b> in computers.</div><div class="xj">私たちには、コンピューターの専門知識がある人が必要だ。</div></button></li><li><button class="w" data-no="782"><div class="top"><span class="no">782</span><span class="en">observation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">観察；観測</div><div class="ex">We learned a lot from the <b>observation</b> of birds in the park.</div><div class="xj">公園での鳥の観察から、私たちは多くのことを学んだ。</div></button></li><li><button class="w" data-no="783"><div class="top"><span class="no">783</span><span class="en">motive</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">動機</div><div class="ex">What was your <b>motive</b> for joining the volunteer club?</div><div class="xj">ボランティア部に入った動機は何でしたか。</div></button></li><li><button class="w" data-no="784"><div class="top"><span class="no">784</span><span class="en">recovery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">回復</div><div class="ex">We all hope for your quick <b>recovery</b>.</div><div class="xj">みんな、あなたの早い回復を願っています。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">pesticide</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">殺虫剤；農薬</div><div class="ex">This farm grows vegetables without using any <b>pesticides</b>.</div><div class="xj">この農場では、農薬を使わずに野菜を育てている。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">phase</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">段階；局面</div><div class="ex">The building project is now in its final <b>phase</b>.</div><div class="xj">その建設計画は、今、最終段階にある。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">refusal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">拒絶；拒否</div><div class="ex">Everyone was surprised at Emi&#x27;s <b>refusal</b> to join the trip.</div><div class="xj">エミが旅行への参加を拒否したことに、みんなが驚いた。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">exotic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">異国風の；珍しい</div><div class="ex">Emi enjoyed the <b>exotic</b> music at the international festival.</div><div class="xj">エミは国際フェスティバルで異国風の音楽を楽しんだ。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">protective</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">保護する；保護用の</div><div class="ex">Firefighters wear <b>protective</b> clothing when they fight fires.</div><div class="xj">消防士は火を消すとき、身を保護する服を着る。</div></button></li><li><button class="w" data-no="790"><di
