x">My sister went on a diet and stopped eating sweets.</div><div class="xj">姉はダイエットを始めて、甘い物を食べるのをやめた。</div></button></li><li><button class="w" data-no="熟146"><div class="top"><span class="no">熟146</span><span class="en">get into the habit of ～ing</span></div><div class="ja">～する習慣がつく</div><div class="ex">I got into the habit of reading before bed.</div><div class="xj">寝る前に読書する習慣がついた。</div></button></li><li><button class="w" data-no="熟147"><div class="top"><span class="no">熟147</span><span class="en">recover from ～</span></div><div class="ja">～から回復する</div><div class="ex">It took him two weeks to recover from the flu.</div><div class="xj">彼がインフルエンザから回復するのに2週間かかった。</div></button></li><li><button class="w" data-no="熟148"><div class="top"><span class="no">熟148</span><span class="en">take a day off</span></div><div class="ja">1日休みを取る</div><div class="ex">My mother took a day off to come to my sports day.</div><div class="xj">母は私の体育祭に来るために1日休みを取った。</div></button></li><li><button class="w" data-no="熟149"><div class="top"><span class="no">熟149</span><span class="en">eat out</span></div><div class="ja">外食する</div><div class="ex">We usually eat out on Saturday nights.</div><div class="xj">私たちはたいてい土曜の夜に外食する。</div></button></li><li><button class="w" data-no="熟150"><div class="top"><span class="no">熟150</span><span class="en">clean up ～</span></div><div class="ja">～をきれいに片づける</div><div class="ex">Let&#x27;s clean up the kitchen after dinner.</div><div class="xj">夕食後に台所を片づけよう。</div></button></li><li><button class="w" data-no="会71"><div class="top"><span class="no">会71</span><span class="en">Don&#x27;t forget to ～.</span></div><div class="ja">～するのを忘れないでね。</div><div class="ex">A: Don&#x27;t forget to take out the trash.<br>B: OK, Mom. I&#x27;ll do it now.</div></button></li><li><button class="w" data-no="会72"><div class="top"><span class="no">会72</span><span class="en">I&#x27;ll be back by ～.</span></div><div class="ja">～までには戻るよ。</div><div class="ex">A: Where are you going?<br>B: To the library. I&#x27;ll be back by six.</div></button></li><li><button class="w" data-no="会73"><div class="top"><span class="no">会73</span><span class="en">Have you seen my ～?</span></div><div class="ja">私の～を見なかった？</div><div class="ex">A: Have you seen my glasses?<br>B: They&#x27;re on the kitchen table.</div></button></li><li><button class="w" data-no="会74"><div class="top"><span class="no">会74</span><span class="en">Hurry up, or you&#x27;ll ～.</span></div><div class="ja">急がないと～するよ。</div><div class="ex">A: Hurry up, or you&#x27;ll miss the bus.<br>B: I&#x27;m coming!</div></button></li><li><button class="w" data-no="会75"><div class="top"><span class="no">会75</span><span class="en">Dinner&#x27;s ready.</span></div><div class="ja">夕食ができたよ。</div><div class="ex">A: Dinner&#x27;s ready!<br>B: Coming. I&#x27;ll wash my hands first.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j14/">← 熟語 Set 14</a><a href="../j16/">熟語 Set 16 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟141": 5.72, "熟142": 20.98, "熟143": 33.92, "熟144": 46.7, "熟145": 62.52, "熟146": 76.7, "熟147": 92.7, "熟148": 106.88, "熟149": 121.52, "熟150": 134.62, "会71": 148.34, "会72": 166.79, "会73": 184.71, "会74": 201.28, "会75": 218.7}, "TE": {"熟141": 7.98, "熟142": 22.86, "熟143": 35.79, "熟144": 48.82, "熟145": 64.51, "熟146": 79.55, "熟147": 94.67, "熟148": 109.02, "熟149": 123.39, "熟150": 136.49, "会71": 150.24, "会72": 168.9, "会73": 186.7, "会74": 203.73, "会75": 220.6}, "Q": [["熟141", "stay in shape", "健康［体型］を保つ"], ["熟142", "put on weight", "太る"], ["熟143", "lose weight", "やせる"], ["熟144", "be out of shape", "体がなまっている、運動不足だ"], ["熟145", "go on a diet", "ダイエットをする"], ["熟146", "get into the habit of ～ing", "～する習慣がつく"], ["熟147", "recover from ～", "～から回復する"], ["熟148", "take a day off", "1日休みを取る"], ["熟149", "eat out", "外食する"], ["熟150", "clean up ～", "～をきれいに片づける"], ["会71", "Don't forget to
