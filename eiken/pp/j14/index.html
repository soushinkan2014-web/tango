="no">熟135</span><span class="en">as a matter of fact</span></div><div class="ja">実は</div><div class="ex">I know Ms. Green well. As a matter of fact, she is my aunt.</div><div class="xj">グリーンさんのことはよく知っている。実は彼女は私のおばだ。</div></button></li><li><button class="w" data-no="熟136"><div class="top"><span class="no">熟136</span><span class="en">in the same way</span></div><div class="ja">同じように</div><div class="ex">Birds build nests. In the same way, some fish make homes.</div><div class="xj">鳥は巣を作る。同じように、すみかを作る魚もいる。</div></button></li><li><button class="w" data-no="熟137"><div class="top"><span class="no">熟137</span><span class="en">in this way</span></div><div class="ja">このようにして</div><div class="ex">She read every day. In this way, she improved her English.</div><div class="xj">彼女は毎日読書をした。こうして英語力を伸ばした。</div></button></li><li><button class="w" data-no="熟138"><div class="top"><span class="no">熟138</span><span class="en">above all</span></div><div class="ja">とりわけ、何よりも</div><div class="ex">Above all, you need to get enough sleep before the test.</div><div class="xj">何よりも、テストの前は十分に寝る必要がある。</div></button></li><li><button class="w" data-no="熟139"><div class="top"><span class="no">熟139</span><span class="en">to begin with</span></div><div class="ja">まず第一に</div><div class="ex">To begin with, let me explain the rules of the game.</div><div class="xj">まず初めに、ゲームのルールを説明します。</div></button></li><li><button class="w" data-no="熟140"><div class="top"><span class="no">熟140</span><span class="en">even so</span></div><div class="ja">それでも</div><div class="ex">The test was very hard. Even so, most students passed it.</div><div class="xj">テストはとても難しかった。それでも、ほとんどの生徒が合格した。</div></button></li><li><button class="w" data-no="会66"><div class="top"><span class="no">会66</span><span class="en">Pardon me?</span></div><div class="ja">もう一度言ってください。</div><div class="ex">A: The bus leaves at 3:15.<br>B: Pardon me? I didn&#x27;t catch that.</div></button></li><li><button class="w" data-no="会67"><div class="top"><span class="no">会67</span><span class="en">Could you speak more slowly?</span></div><div class="ja">もっとゆっくり話していただけますか？</div><div class="ex">A: Could you speak more slowly, please?<br>B: Sure. Sorry about that.</div></button></li><li><button class="w" data-no="会68"><div class="top"><span class="no">会68</span><span class="en">How do you spell that?</span></div><div class="ja">それはどうつづりますか？</div><div class="ex">A: I live on Lincoln Street.<br>B: How do you spell that?</div></button></li><li><button class="w" data-no="会69"><div class="top"><span class="no">会69</span><span class="en">Do you mean ～?</span></div><div class="ja">～ということ？</div><div class="ex">A: The test is next Friday.<br>B: Do you mean the math test?</div></button></li><li><button class="w" data-no="会70"><div class="top"><span class="no">会70</span><span class="en">Let me make sure.</span></div><div class="ja">確認させてください。</div><div class="ex">A: Let me make sure. Two tickets for Saturday?<br>B: Yes, that&#x27;s right.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j13/">← 熟語 Set 13</a><a href="../j15/">熟語 Set 15 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟131": 5.87, "熟132": 20.14, "熟133": 35.93, "熟134": 51.6, "熟135": 71.68, "熟136": 88.14, "熟137": 104.34, "熟138": 119.82, "熟139": 134.45, "熟140": 148.39, "会66": 163.8, "会67": 181.67, "会68": 201.22, "会69": 217.24, "会70": 233.08}, "TE": {"熟131": 7.98, "熟132": 22.02, "熟133": 38.19, "熟134": 54.74, "熟135": 74.04, "熟136": 90.21, "熟137": 106.21, "熟138": 121.69, "熟139": 136.35, "熟140": 150.26, "会66": 165.67, "会67": 184.12, "会68": 203.31, "会69": 219.12, "会70": 235.14}, "Q": [["熟131", "in any case", "いずれにしても"], ["熟132", "what is more", "さらに、その上"], ["熟133", "in addition (to ～)", "加えて"], ["熟134", "on the one hand ～, on the other hand …", "一方では～、他方では…"], ["熟135", "as a matter of fact", "実は"], ["熟136", "in the same way", "同じように"], [
