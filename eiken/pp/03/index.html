</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第3回</h1><div class="sub">No.101〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">withdraw</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">（お金）を引き出す；撤退する</div><div class="ex">I <b>withdrew</b> some money from the bank to buy a bike.</div><div class="xj">自転車を買うために、銀行からお金を引き出した。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">upgrade</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を性能のよいものにする；格上げする</div><div class="ex">Dad <b>upgraded</b> his old computer, so now it runs faster.</div><div class="xj">父が古いパソコンの性能を上げたので、今は速く動く。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">utilize</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を利用する</div><div class="ex">We should <b>utilize</b> the library more for our studies.</div><div class="xj">私たちは勉強のために、もっと図書館を利用するべきだ。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">regulate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を規制する；調整する</div><div class="ex">The city <b>regulates</b> the use of fireworks in parks.</div><div class="xj">市は、公園での花火の使用を規制している。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">offend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の気分を害する</div><div class="ex">I&#x27;m sorry if my words <b>offended</b> you.</div><div class="xj">私の言葉であなたの気分を害したなら、ごめんなさい。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">drag</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を引きずる</div><div class="ex">Tom <b>dragged</b> the heavy box across the floor.</div><div class="xj">トムは重い箱を床の上で引きずった。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">proceed</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">進む；続ける</div><div class="ex">Please <b>proceed</b> to Gate 5 for your flight.</div><div class="xj">ご搭乗の方は、5番ゲートへ進んでください。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">drift</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">漂う；漂流する</div><div class="ex">The small boat <b>drifted</b> slowly toward the island.</div><div class="xj">小さなボートは、島のほうへゆっくりと漂っていった。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">appeal</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">訴える；（appeal to ～で）～の心に訴える</div><div class="ex">The town <b>appealed</b> to people to save water in summer.</div><div class="xj">町は人々に、夏は水を節約するよう訴えた。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">compose</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を構成する；作曲する</div><div class="ex">Our team is <b>composed</b> of ten players.</div><div class="xj">私たちのチームは10人の選手で構成されている。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">congratulate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を祝う</div><div class="ex">Everyone <b>congratulated</b> Lisa on winning the contest.</div><div class="xj">みんながリサのコンテスト優勝を祝った。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">emphasize</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を強調する</div><div class="ex">The coach <b>emphasized</b> the importance of teamwork.</div><div class="xj">コーチはチームワークの大切さを強調した。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">split</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を分ける；割る</div><div class="ex">Let&#x27;s <b>split</b> the pizza into eight pieces.</div><div class="xj">ピザを8切れに分けよう。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">occupy</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を占める；使用する</div><div class="ex">Large bookshelves <b>occupy</b> most of the room.</div><div class="xj">大きな本棚が、部屋の大部分を占めている。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">altitude</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">高度；標高</div><div class="ex">The plane is flying at a high <b>altitude</b> now.</div><div class="xj">飛行機は今、高い高度を飛んでいる。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">robbery</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">強盗（事件）</div><div class="ex">Thanks to the new cameras, the number of <b>robberies</b> went down.</div><div class="xj">新しい防犯カメラのおかげで、強盗事件の件数が減った。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">carbon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">炭素</div><div class="ex">Trees take in <b>carbon</b> from the air.</div><div class="xj">木は空気中の炭素を取り込む。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">filter</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">フィルター；ろ過装置</div><div class="ex">Please clean the <b>filter</b> of the air conditioner once a month.</div><div class="xj">月に一度、エアコンのフィルターを掃除してください。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">democracy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">民主主義</div><div class="ex">In a <b>democracy</b>, people choose their leaders by voting.</div><div class="xj">民主主義では、人々は投票でリーダーを選ぶ。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">welfare</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">福祉；幸福</div><div class="ex">The town spends a lot of money on <b>welfare</b> for older people.</div><div class="xj">その町は、お年寄りの福祉に多くのお金を使っている。</div></button></li><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">carriage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">馬車；車両</div><div class="ex">The prince and princess rode in a beautiful <b>carriage</b>.</div><div class="xj">王子と王女は、美しい馬車に乗った。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">rejection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">拒否；不合格</div><div class="ex">The <b>rejection</b> of his plan made Ken sad.</div><div class="xj">計画を拒否されて、ケンは悲しんだ。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">outcome</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">結果；成果</div><div class="ex">Everyone was happy with the <b>outcome</b> of the meeting.</div><div class="xj">全員がその会議の結果に満足した。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">minister</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大臣</div><div class="ex">The <b>minister</b> visited our school to see the new library.</div><div class="xj">大臣が、新しい図書館を見るために私たちの学校を訪れた。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">mixture</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混合物；混ざったもの</div><div class="ex">Salt water is a <b>mixture</b> of salt and water.</div><div class="xj">塩水は、塩と水の混合物だ。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">flame</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">炎</div><div class="ex">The <b>flame</b> of the candle moved in the wind.</div><div class="xj">ろうそくの炎が風にゆれた。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">subscription</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">定期購読；（サービスの）定額利用</div><div class="ex">My father has a <b>subscription</b> to a science magazine.</div><div class="xj">父は科学雑誌を定期購読している。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">liberty</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">自由</div><div class="ex">Long ago, the people fought hard for their <b>liberty</b>.</div><div class="xj">昔、人々は自由のために懸命に戦った。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">empire</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">帝国</div><div class="ex">The Roman <b>Empire</b> lasted for hundreds of years.</div><div class="xj">ローマ帝国は何百年も続いた。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">consequence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">結果；影響</div><div class="ex">You must think about the <b>consequences</b> of your actions.</div><div class="xj">自分の行動の結果をよく考えなければならない。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">emperor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">皇帝；天皇</div><div class="ex">The <b>emperor</b> lived in a large palace.</div><div class="xj">その皇帝は大きな宮殿に住んでいた。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">conductor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">指揮者；車掌</div><div class="ex">The <b>conductor</b> raised his hands, and the music began.</div><div class="xj">指揮者が両手を上げると、音楽が始まった。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">suspicion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">疑い</div><div class="ex">The cat looked at the new dog with <b>suspicion</b>.</div><div class="xj">ネコは新しい犬を疑いの目で見た。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">volcano</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">火山</div><div class="ex">Mt. Fuji is the most famous <b>volcano</b> in Japan.</div><div class="xj">富士山は、日本で最も有名な火山だ。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">faith</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">信頼；信仰</div><div class="ex">The players have complete <b>faith</b> in their captain.</div><div class="xj">選手たちは、キャプテンに全面的な信頼を置いている。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">inferior</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">劣った；（be inferior to ～で）～より劣る</div><div class="ex">This cheap bag is <b>inferior</b> to the one I had before.</div><div class="xj">この安いかばんは、前に持っていたものより劣っている。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">rapid</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">速い；急速な</div><div class="ex">The small town has grown at a <b>rapid</b> pace.</div><div class="xj">その小さな町は、速いペースで大きくなってきた。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">exact</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">正確な；ちょうどの</div><div class="ex">Do you know the <b>exact</b> time of the meeting?</div><div class="xj">会議の正確な時間を知っていますか。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">vague</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">あいまいな；ぼんやりした</div><div class="ex">His answer was so <b>vague</b> that I couldn&#x27;t understand it.</div><div class="xj">彼の答えはとてもあいまいで、私には理解できなかった。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">distant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">遠い；離れた</div><div class="ex">We could see a <b>distant</b> island from the beach.</div><div class="xj">浜辺から遠くの島が見えた。</div></button></li><li><butto
