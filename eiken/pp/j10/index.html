an class="en">give ～ a call</span></div><div class="ja">～に電話する</div><div class="ex">Give me a call when you get to the hotel.</div><div class="xj">ホテルに着いたら電話してね。</div></button></li><li><button class="w" data-no="熟96"><div class="top"><span class="no">熟96</span><span class="en">give ～ a try</span></div><div class="ja">～を試してみる</div><div class="ex">I&#x27;ve never eaten Thai food, but I&#x27;ll give it a try.</div><div class="xj">タイ料理は食べたことがないけど、試してみるよ。</div></button></li><li><button class="w" data-no="熟97"><div class="top"><span class="no">熟97</span><span class="en">take a chance</span></div><div class="ja">思い切ってやってみる</div><div class="ex">She took a chance and applied for a job abroad.</div><div class="xj">彼女は思い切って海外の仕事に応募した。</div></button></li><li><button class="w" data-no="熟98"><div class="top"><span class="no">熟98</span><span class="en">pay a visit to ～</span></div><div class="ja">～を訪れる</div><div class="ex">We paid a visit to our old teacher during the holidays.</div><div class="xj">私たちは休みの間に昔の先生を訪ねた。</div></button></li><li><button class="w" data-no="熟99"><div class="top"><span class="no">熟99</span><span class="en">lose one&#x27;s way</span></div><div class="ja">道に迷う</div><div class="ex">I lost my way in the big station and missed my train.</div><div class="xj">大きな駅で道に迷い、電車に乗り遅れた。</div></button></li><li><button class="w" data-no="熟100"><div class="top"><span class="no">熟100</span><span class="en">do ～ a favor</span></div><div class="ja">～の頼みを聞く</div><div class="ex">Could you do me a favor and carry this box?</div><div class="xj">お願いがあるんだけど、この箱を運んでくれない？</div></button></li><li><button class="w" data-no="会46"><div class="top"><span class="no">会46</span><span class="en">Can I get a refund?</span></div><div class="ja">返金してもらえますか？</div><div class="ex">A: This shirt has a hole. Can I get a refund?<br>B: Of course. Do you have the receipt?</div></button></li><li><button class="w" data-no="会47"><div class="top"><span class="no">会47</span><span class="en">Do you have it in another color?</span></div><div class="ja">ほかの色はありますか？</div><div class="ex">A: I like this sweater. Do you have it in another color?<br>B: Yes, we also have it in gray and navy.</div></button></li><li><button class="w" data-no="会48"><div class="top"><span class="no">会48</span><span class="en">Can I pay by card?</span></div><div class="ja">カードで払えますか？</div><div class="ex">A: Can I pay by card?<br>B: Sorry, we only take cash.</div></button></li><li><button class="w" data-no="会49"><div class="top"><span class="no">会49</span><span class="en">Is this on sale?</span></div><div class="ja">これはセール中ですか？</div><div class="ex">A: Excuse me. Is this on sale?<br>B: Yes, it&#x27;s 30 percent off this week.</div></button></li><li><button class="w" data-no="会50"><div class="top"><span class="no">会50</span><span class="en">We&#x27;ve run out of ～.</span></div><div class="ja">～を切らしています。</div><div class="ex">A: I&#x27;d like two loaves of bread, please.<br>B: I&#x27;m sorry. We&#x27;ve run out of bread today.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j09/">← 熟語 Set 9</a><a href="../j11/">熟語 Set 11 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟91": 5.58, "熟92": 21.3, "熟93": 35.86, "熟94": 50.04, "熟95": 64.65, "熟96": 77.94, "熟97": 92.27, "熟98": 106.45, "熟99": 120.99, "熟100": 135.24, "会46": 149.04, "会47": 168.95, "会48": 188.69, "会49": 205.15, "会50": 223.93}, "TE": {"熟91": 8.2, "熟92": 23.17, "熟93": 37.8, "熟94": 52.18, "熟95": 66.52, "熟96": 79.82, "熟97": 94.28, "熟98": 108.46, "熟99": 123.15, "熟100": 137.11, "会46": 151.15, "会47": 171.35, "会48": 190.9, "会49": 207.31, "会50": 226.04}, "Q": [["熟91", "shake hands (with ～)", "握手する"], ["熟92", "give ～ a ride", "～を車で送る"], ["熟93", "make fun of ～", "～をからかう"], ["熟94", "make room for ～", "～のために場所をあける"], ["熟95", "give ～ a call", "～に電話する"], ["熟96", "give ～ a try", "～を試してみる"], ["熟97", "take a chance", "思い切ってやって
