</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第1回</h1><div class="sub">No.1〜50</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">indicate</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を示す</div><div class="ex">This map <b>indicates</b> where the nearest hospital is.</div><div class="xj">この地図は、いちばん近い病院の場所を示している。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">launch</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を発売する；開始する</div><div class="ex">The company will <b>launch</b> a new smartphone next month.</div><div class="xj">その会社は来月、新しいスマートフォンを発売する予定だ。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">ensure</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を確実にする；保証する</div><div class="ex">Please check your answers to <b>ensure</b> that there are no mistakes.</div><div class="xj">まちがいがないことを確実にするために、答えを見直してください。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">bow</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">おじぎする</div><div class="ex">In Japan, people often <b>bow</b> when they meet someone.</div><div class="xj">日本では、人に会うときによくおじぎする。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">emerge</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">現れる；出てくる</div><div class="ex">A small cat <b>emerged</b> from under the car.</div><div class="xj">車の下から小さなネコが現れた。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">portray</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を描く；描写する</div><div class="ex">This movie <b>portrays</b> the life of a young farmer.</div><div class="xj">この映画は、若い農家の人の生活を描いている。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">wander</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">歩き回る；さまよう</div><div class="ex">We <b>wandered</b> around the old town all afternoon.</div><div class="xj">私たちは午後ずっと、古い町並みを歩き回った。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">demonstrate</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を実演する；証明する</div><div class="ex">The teacher <b>demonstrated</b> how to use the new machine.</div><div class="xj">先生は新しい機械の使い方を実演した。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">maintain</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を維持する；保つ</div><div class="ex">It is important to <b>maintain</b> good health by eating well.</div><div class="xj">よく食べて健康を維持することは大切だ。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">detect</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を見つける；検出する</div><div class="ex">This machine can <b>detect</b> smoke in the room quickly.</div><div class="xj">この機械は、部屋の煙をすばやく検出することができる。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">exclude</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を除外する；締め出す</div><div class="ex">We <b>excluded</b> the old data from our science report.</div><div class="xj">私たちは理科のレポートから、古いデータを除外した。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">preference</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">好み</div><div class="ex">Do you have a <b>preference</b> for tea or coffee?</div><div class="xj">紅茶とコーヒーでは、どちらがお好みですか。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">script</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">台本；脚本</div><div class="ex">The drama club members are reading the <b>script</b> for the play.</div><div class="xj">演劇部の部員たちは、劇の台本を読んでいる。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">opponent</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">対戦相手；反対者</div><div class="ex">Our team&#x27;s <b>opponent</b> in the final was very strong.</div><div class="xj">決勝での私たちのチームの対戦相手は、とても強かった。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">inventory</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">在庫；在庫品</div><div class="ex">The store checks its <b>inventory</b> at the end of every month.</div><div class="xj">その店は毎月末に在庫を確認する。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">leak</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">漏れ；水漏れ</div><div class="ex">There is a <b>leak</b> in the pipe under the kitchen sink.</div><div class="xj">台所の流しの下のパイプに水漏れがある。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">emission</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">排出；排出物</div><div class="ex">Factories should reduce their <b>emissions</b> of harmful gases.</div><div class="xj">工場は有害なガスの排出を減らすべきだ。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">challenge</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">難題；挑戦</div><div class="ex">Learning to swim was a big <b>challenge</b> for my little brother.</div><div class="xj">泳ぎを覚えることは、弟にとって大きな難題だった。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">assault</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">暴行；襲撃</div><div class="ex">Bright street lights help prevent crimes such as <b>assault</b>.</div><div class="xj">明るい街灯は、暴行などの犯罪を防ぐのに役立つ。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">pursuit</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">追跡；追求</div><div class="ex">After a long <b>pursuit</b>, the police stopped the car.</div><div class="xj">長い追跡の末、警察はその車を止めた。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">characteristic</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">特徴</div><div class="ex">Long ears are a <b>characteristic</b> of this kind of rabbit.</div><div class="xj">長い耳は、この種類のウサギの特徴だ。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">proverb</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ことわざ</div><div class="ex">My grandmother often teaches me old Japanese <b>proverbs</b>.</div><div class="xj">祖母はよく私に、日本の古いことわざを教えてくれる。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">philosophy</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">哲学；（人生などの）考え方</div><div class="ex">My brother is studying <b>philosophy</b> at a university in Tokyo.</div><div class="xj">兄は東京の大学で哲学を学んでいる。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">monument</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">記念碑；記念建造物</div><div class="ex">There is a <b>monument</b> to a famous poet in the park.</div><div class="xj">公園には、有名な詩人の記念碑がある。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">alternative</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">代わりのもの；選択肢</div><div class="ex">If the train stops, the bus is a good <b>alternative</b>.</div><div class="xj">電車が止まったら、バスがよい代わりになる。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">fiber</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">繊維</div><div class="ex">Vegetables like carrots contain a lot of <b>fiber</b>.</div><div class="xj">ニンジンのような野菜には、繊維がたくさん含まれている。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">panel</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（専門家の）委員会；（板状の）パネル</div><div class="ex">A <b>panel</b> of teachers chose the winner of the speech contest.</div><div class="xj">先生たちの委員会が、スピーチコンテストの優勝者を選んだ。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">shopper</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">買い物客</div><div class="ex">The mall was full of <b>shoppers</b> on Sunday.</div><div class="xj">日曜日、ショッピングモールは買い物客でいっぱいだった。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">agency</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">代理店；（政府の）機関</div><div class="ex">My aunt works at a travel <b>agency</b> in Osaka.</div><div class="xj">おばは大阪の旅行代理店で働いている。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">dealer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">販売業者</div><div class="ex">My father bought a used car from a local <b>dealer</b>.</div><div class="xj">父は地元の販売業者から中古車を買った。</div></button></li><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">outline</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">概要；輪郭</div><div class="ex">First, write an <b>outline</b> of your speech.</div><div class="xj">まず、スピーチの概要を書きなさい。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">whistle</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">笛；口笛</div><div class="ex">The game started when the referee blew the <b>whistle</b>.</div><div class="xj">審判が笛を吹くと、試合が始まった。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">affection</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">愛情</div><div class="ex">The old man showed great <b>affection</b> for his dog.</div><div class="xj">そのおじいさんは、自分の犬に深い愛情を示した。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">horizon</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地平線；水平線</div><div class="ex">From the hill, we watched the sun go down below the <b>horizon</b>.</div><div class="xj">丘の上から、私たちは太陽が地平線の下に沈むのを見た。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">financial</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">財政の；お金の</div><div class="ex">The small museum is having <b>financial</b> problems these days.</div><div class="xj">その小さな博物館は、最近財政上の問題を抱えている。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">oral</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">口頭の；口の</div><div class="ex">We will have an <b>oral</b> test in English class tomorrow.</div><div class="xj">明日、英語の授業で口頭試験がある。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">beneficial</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">有益な；ためになる</div><div class="ex">Walking every day is <b>beneficial</b> to your health.</div><div class="xj">毎日歩くことは、健康に有益だ。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">located</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">（ある場所に）位置している</div><div class="ex">Our school is <b>located</b> near a large park.</div><div class="xj">私たちの学校は、大きな公園の近くに位置している。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">everyday</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">毎日の；日常の</div><div class="ex">We use a lot of plastic in <b>everyday</b> life.</div><div class="xj">私たちは毎日の生活で、たくさんのプラスチックを使っている。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">central</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">中心の；主要な</div><div class="ex">
