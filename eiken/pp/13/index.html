<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>英検準2級プラス 第13回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第13回</h1><div class="sub">No.601〜650</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">yield</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（作物など）を生み出す；屈する</div><div class="ex">This small field <b>yields</b> a lot of rice every year.</div><div class="xj">この小さな田んぼは、毎年たくさんの米を生み出す。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">overlap</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">重なる；～と重なる</div><div class="ex">The two meetings <b>overlap</b>, so I can only go to one.</div><div class="xj">2つの会議が重なるので、1つにしか行けない。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">replacement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">交換；代わりの人・物</div><div class="ex">The <b>replacement</b> of the old windows took two days.</div><div class="xj">古い窓の交換には2日かかった。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">viewer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">視聴者；見る人</div><div class="ex">The program was popular with young <b>viewers</b>.</div><div class="xj">その番組は若い視聴者に人気があった。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">logo</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ロゴ；（会社などの）マーク</div><div class="ex">The new school <b>logo</b> was designed by a student.</div><div class="xj">学校の新しいロゴは、生徒がデザインした。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">programmer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">プログラマー</div><div class="ex">My cousin works as a <b>programmer</b> at a game company.</div><div class="xj">いとこはゲーム会社でプログラマーとして働いている。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">limitation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">制限；限界</div><div class="ex">There is a <b>limitation</b> on the number of books you can borrow.</div><div class="xj">借りられる本の数には制限がある。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">mascot</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">マスコット</div><div class="ex">Our town&#x27;s <b>mascot</b> is a cute orange cat.</div><div class="xj">私たちの町のマスコットは、かわいいオレンジ色のねこだ。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">excitement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">興奮；わくわくすること</div><div class="ex">The children could not hide their <b>excitement</b> before the trip.</div><div class="xj">旅行の前、子どもたちは興奮をかくしきれなかった。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">introduction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">導入；紹介</div><div class="ex">The <b>introduction</b> of tablets changed the way we study.</div><div class="xj">タブレットの導入で、私たちの勉強のしかたが変わった。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">ankle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">足首</div><div class="ex">Ken hurt his <b>ankle</b> during soccer practice.</div><div class="xj">ケンはサッカーの練習中に足首をけがした。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">spotlight</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">スポットライト；注目</div><div class="ex">The singer stood in the <b>spotlight</b> on the stage.</div><div class="xj">その歌手はステージでスポットライトを浴びて立っていた。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">campsite</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">キャンプ場</div><div class="ex">We put up our tent at the <b>campsite</b> by the lake.</div><div class="xj">私たちは湖のそばのキャンプ場にテントを張った。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">injection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">注射</div><div class="ex">The doctor gave me an <b>injection</b> for the flu.</div><div class="xj">医者は私にインフルエンザの注射をした。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">motor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">モーター</div><div class="ex">This toy car runs on a small <b>motor</b>.</div><div class="xj">このおもちゃの車は、小さなモーターで動く。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">microwave</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">電子レンジ</div><div class="ex">Heat the soup in the <b>microwave</b> for two minutes.</div><div class="xj">スープを電子レンジで2分間温めてください。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">accommodation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">宿泊施設</div><div class="ex">We need to find <b>accommodation</b> near the station.</div><div class="xj">私たちは駅の近くで宿泊施設を見つける必要がある。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">retirement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">退職；引退</div><div class="ex">After his <b>retirement</b>, Grandpa started growing vegetables.</div><div class="xj">祖父は退職後、野菜を育て始めた。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">bulb</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">電球；球根</div><div class="ex">Can you change the light <b>bulb</b> in the kitchen?</div><div class="xj">台所の電球を取りかえてくれる？</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">warmth</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">暖かさ；温かみ</div><div class="ex">We sat near the fire and enjoyed its <b>warmth</b>.</div><div class="xj">私たちは火のそばに座って、その暖かさを楽しんだ。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">navy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">海軍</div><div class="ex">My uncle works as a doctor in the <b>navy</b>.</div><div class="xj">おじは海軍で医者として働いている。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">overtime</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">残業；時間外労働</div><div class="ex">My father did two hours of <b>overtime</b> yesterday.</div><div class="xj">父は昨日、2時間の残業をした。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">novelist</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">小説家</div><div class="ex">Emi wants to be a <b>novelist</b> in the future.</div><div class="xj">エミは将来、小説家になりたいと思っている。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">invasion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">侵略；侵入</div><div class="ex">The castle was built to stop an <b>invasion</b> from the sea.</div><div class="xj">その城は、海からの侵略を防ぐために建てられた。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">seminar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">セミナー；講習会</div><div class="ex">My sister went to a <b>seminar</b> about job hunting.</div><div class="xj">姉は就職活動についてのセミナーに行った。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">storytelling</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">物語をすること；語り</div><div class="ex">Grandpa is good at <b>storytelling</b>, so children love him.</div><div class="xj">祖父は物語をすることが上手なので、子どもたちに大人気だ。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">alcohol</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">アルコール；酒</div><div class="ex">Children should not drink <b>alcohol</b> for their health.</div><div class="xj">子どもは健康のためにアルコールを飲んではいけない。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">overuse</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">使いすぎ</div><div class="ex">The <b>overuse</b> of plastic bags is a big problem.</div><div class="xj">レジ袋の使いすぎは大きな問題だ。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">automobile</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">自動車</div><div class="ex">My grandfather worked in an <b>automobile</b> factory for forty years.</div><div class="xj">祖父は40年間、自動車工場で働いた。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">summary</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">要約；まとめ</div><div class="ex">Please write a short <b>summary</b> of the story.</div><div class="xj">その物語の短い要約を書いてください。</div></button></li><li><button class="w" data-no="631"><div class="top"><span class="no">631</span><span class="en">advisor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">助言者；アドバイザー</div><div class="ex">Ken asked his <b>advisor</b> which college to choose.</div><div class="xj">ケンはどの大学を選ぶべきか、アドバイザーにたずねた。</div></button></li><li><button class="w" data-no="632"><div class="top"><span class="no">632</span><span class="en">measurement</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">測定；（複数形で）寸法</div><div class="ex">Careful <b>measurement</b> is very important in science experiments.</div><div class="xj">理科の実験では、ていねいな測定がとても大切だ。</div></button></li><li><button class="w" data-no="633"><div class="top"><span class="no">633</span><span class="en">heaven</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">天国</div><div class="ex">In the story, an angel came down from <b>heaven</b>.</div><div class="xj">その物語では、天使が天国から降りてきた。</div></button></li><li><button class="w" data-no="634"><div class="top"><span class="no">634</span><span class="en">jungle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ジャングル；密林</div><div class="ex">Many kinds of animals live in the <b>jungle</b>.</div><div class="xj">ジャングルには、たくさんの種類の動物がすんでいる。</div></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">graphic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">図表の；生々しい</div><div class="ex">Lisa showed the results of her survey in <b>graphic</b> form.</div><div class="xj">リサは調査の結果を図表の形で示した。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">passionate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">情熱的な；熱烈な</div><div class="ex">Our coach is very <b>passionate</b> about baseball.</div><div class="xj">私たちのコーチは、野球にとても情熱的だ。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">unnecessary</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不必要な</div><div class="ex">Turn off <b>unnecessary</b> lights to save energy.</div><div class="xj">エネルギーを節約するために、不必要な明かりを消しなさい。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">uncertain</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不確かな；はっきりしない</div><div class="ex">It is still <b>uncertain</b> whether the game will be held.</div><div class="xj">試合が行われるかどうかは、まだはっきりしない。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">overwhelming</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">圧倒的な</div><div class="ex">The plan got <b>overwhelming</b> support from the students.</div><div class="xj">その計画は、生徒たちから圧倒的な支持を得た。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">lunar</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">月の</div><div class="ex">Scientists studied rocks from the <b>lunar</b> surface.</div><div class="xj">
