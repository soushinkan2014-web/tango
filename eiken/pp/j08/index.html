: Maybe we should go home now.</div></button></li><li><button class="w" data-no="会38"><div class="top"><span class="no">会38</span><span class="en">If I were you, I&#x27;d ～.</span></div><div class="ja">私だったら～するよ。</div><div class="ex">A: Should I buy the red bag or the black one?<br>B: If I were you, I&#x27;d get the black one.</div></button></li><li><button class="w" data-no="会39"><div class="top"><span class="no">会39</span><span class="en">You might want to ～.</span></div><div class="ja">～したほうがいいかもしれませんよ。</div><div class="ex">A: You might want to bring a jacket. It&#x27;s cold in the hall.<br>B: Thanks for telling me.</div></button></li><li><button class="w" data-no="会40"><div class="top"><span class="no">会40</span><span class="en">What about ～?</span></div><div class="ja">～はどう？</div><div class="ex">A: Where should we eat lunch?<br>B: What about the new curry shop?</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j07/">← 熟語 Set 7</a><a href="../j09/">熟語 Set 9 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟71": 5.68, "熟72": 18.75, "熟73": 33.34, "熟74": 47.11, "熟75": 61.7, "熟76": 75.38, "熟77": 89.7, "熟78": 104.24, "熟79": 117.63, "熟80": 132.26, "会36": 146.23, "会37": 163.26, "会38": 179.33, "会39": 198.38, "会40": 217.24}, "TE": {"熟71": 7.55, "熟72": 20.62, "熟73": 35.24, "熟74": 48.98, "熟75": 63.6, "熟76": 77.25, "熟77": 91.57, "熟78": 106.11, "熟79": 119.5, "熟80": 134.28, "会36": 148.1, "会37": 165.25, "会38": 181.85, "会39": 200.32, "会40": 219.11}, "Q": [["熟71", "break down", "故障する"], ["熟72", "break out", "起こる"], ["熟73", "break into ～", "～に押し入る"], ["熟74", "look through ～", "～にざっと目を通す"], ["熟75", "look around (～)", "見て回る"], ["熟76", "turn up", "現れる、見つかる"], ["熟77", "turn to ～", "～に頼る"], ["熟78", "run away", "逃げる"], ["熟79", "call for ～", "～を求める、必要とする"], ["熟80", "keep away from ～", "～に近づかない"], ["会36", "Why don't you ～?", "～したらどう？"], ["会37", "M
