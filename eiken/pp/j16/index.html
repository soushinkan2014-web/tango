って食べる</div><div class="ex">Please help yourself to the cookies.</div><div class="xj">クッキーを自由に食べてください。</div></button></li><li><button class="w" data-no="熟156"><div class="top"><span class="no">熟156</span><span class="en">be into ～</span></div><div class="ja">～に夢中だ</div><div class="ex">My brother is really into K-pop these days.</div><div class="xj">兄は最近K-POPにはまっている。</div></button></li><li><button class="w" data-no="熟157"><div class="top"><span class="no">熟157</span><span class="en">have a hard time ～ing</span></div><div class="ja">～するのに苦労する</div><div class="ex">I had a hard time finding the hotel.</div><div class="xj">ホテルを見つけるのに苦労した。</div></button></li><li><button class="w" data-no="熟158"><div class="top"><span class="no">熟158</span><span class="en">call ～ back</span></div><div class="ja">～に電話をかけ直す</div><div class="ex">I&#x27;m in a meeting now. Can I call you back later?</div><div class="xj">今会議中なんです。あとでかけ直してもいいですか。</div></button></li><li><button class="w" data-no="熟159"><div class="top"><span class="no">熟159</span><span class="en">show ～ around</span></div><div class="ja">～を案内して回る</div><div class="ex">Let me show you around our school.</div><div class="xj">私たちの学校を案内しましょう。</div></button></li><li><button class="w" data-no="熟160"><div class="top"><span class="no">熟160</span><span class="en">work on ～</span></div><div class="ja">～に取り組む</div><div class="ex">I&#x27;m going to work on my science report this weekend.</div><div class="xj">今週末は理科のレポートに取り組むつもりだ。</div></button></li><li><button class="w" data-no="会76"><div class="top"><span class="no">会76</span><span class="en">Speaking of ～, …</span></div><div class="ja">～と言えば、…</div><div class="ex">A: I watched a baseball game yesterday.<br>B: Speaking of baseball, did you hear that Ken&#x27;s team won?</div></button></li><li><button class="w" data-no="会77"><div class="top"><span class="no">会77</span><span class="en">To tell the truth, ～.</span></div><div class="ja">実を言うと、～。</div><div class="ex">A: Did you enjoy the movie?<br>B: To tell the truth, I fell asleep.</div></button></li><li><button class="w" data-no="会78"><div class="top"><span class="no">会78</span><span class="en">Anyway, ～.</span></div><div class="ja">とにかく、～。（話を元にもどす）</div><div class="ex">A: My train stopped for twenty minutes. Anyway, let&#x27;s start.<br>B: Sure. Open your textbook to page 10.</div></button></li><li><button class="w" data-no="会79"><div class="top"><span class="no">会79</span><span class="en">You know what?</span></div><div class="ja">ねえ、聞いて。</div><div class="ex">A: You know what? I&#x27;m going to study in Canada.<br>B: Really? That&#x27;s wonderful!</div></button></li><li><button class="w" data-no="会80"><div class="top"><span class="no">会80</span><span class="en">Now that you mention it, ～.</span></div><div class="ja">そう言われてみると、～。</div><div class="ex">A: Ms. Kato looks a little tired today.<br>B: Now that you mention it, she does.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j15/">← 熟語 Set 15</a><a href="../j17/">熟語 Set 17 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟151": 5.92, "熟152": 22.06, "熟153": 36.12, "熟154": 49.82, "熟155": 65.25, "熟156": 79.5, "熟157": 93.35, "熟158": 108.8, "熟159": 124.04, "熟160": 137.81, "会76": 151.6, "会77": 169.52, "会78": 186.56, "会79": 209.97, "会80": 228.4}, "TE": {"熟151": 7.79, "熟152": 24.06, "熟153": 38.0, "熟154": 51.7, "熟155": 67.39, "熟156": 81.38, "熟157": 96.04, "熟158": 110.67, "熟159": 126.08, "熟160": 139.68, "会76": 153.64, "会77": 171.64, "会78": 188.43, "会79": 211.84, "会80": 230.6}, "Q": [["熟151", "go ahead", "どうぞ、先に進める"], ["熟152", "feel free to ～", "遠慮なく～する"], ["熟153", "next to ～", "～の隣に"], ["熟154", "make it", "間に合う、都合がつく、うまくいく"], ["熟155", "help oneself to ～", "～を自由に取って食べる"], ["熟156", "be into ～", "～に夢中だ"], ["熟157", "have a hard time ～ing", "～するのに苦労する"], ["熟158", "call ～ back", "～に電話をかけ直す"], ["熟159", "show ～ around", "～を案内して
