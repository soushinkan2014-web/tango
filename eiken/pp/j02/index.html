問題が）起こる</div><div class="ex">The topic of the school trip came up during lunch.</div><div class="xj">昼食中に修学旅行の話が出た。</div></button></li><li><button class="w" data-no="熟16"><div class="top"><span class="no">熟16</span><span class="en">go by</span></div><div class="ja">（時が）過ぎる</div><div class="ex">Three years have gone by since I moved to Osaka.</div><div class="xj">大阪に引っ越してから3年が過ぎた。</div></button></li><li><button class="w" data-no="熟17"><div class="top"><span class="no">熟17</span><span class="en">go with ～</span></div><div class="ja">～に合う、似合う</div><div class="ex">This red tie goes well with your white shirt.</div><div class="xj">この赤いネクタイはあなたの白いシャツによく合う。</div></button></li><li><button class="w" data-no="熟18"><div class="top"><span class="no">熟18</span><span class="en">get through ～</span></div><div class="ja">～を乗り切る、終える</div><div class="ex">Talking with my friends helped me get through a difficult time.</div><div class="xj">友達と話すことで、つらい時期を乗り切ることができた。</div></button></li><li><button class="w" data-no="熟19"><div class="top"><span class="no">熟19</span><span class="en">get by</span></div><div class="ja">なんとかやっていく</div><div class="ex">I can get by in English when I travel abroad.</div><div class="xj">海外旅行のとき、英語でなんとかやっていける。</div></button></li><li><button class="w" data-no="熟20"><div class="top"><span class="no">熟20</span><span class="en">get ～ across</span></div><div class="ja">（考えなど）を相手に伝える</div><div class="ex">Using pictures helped her get her idea across to the class.</div><div class="xj">絵を使ったことで、彼女は自分の考えをクラスに伝えることができた。</div></button></li><li><button class="w" data-no="会6"><div class="top"><span class="no">会6</span><span class="en">Would it be possible to ～?</span></div><div class="ja">～することはできますか？（ていねいな依頼）</div><div class="ex">A: Would it be possible to change my room?<br>B: Let me check. Yes, we have one on the fifth floor.</div></button></li><li><button class="w" data-no="会7"><div class="top"><span class="no">会7</span><span class="en">Is it all right if I ～?</span></div><div class="ja">～してもいいですか？</div><div class="ex">A: Is it all right if I leave early today?<br>B: Sure. Just finish your report first.</div></button></li><li><button class="w" data-no="会8"><div class="top"><span class="no">会8</span><span class="en">Could I borrow ～?</span></div><div class="ja">～を借りてもいい？</div><div class="ex">A: Could I borrow your eraser?<br>B: Of course. Here you are.</div></button></li><li><button class="w" data-no="会9"><div class="top"><span class="no">会9</span><span class="en">Would you be able to ～?</span></div><div class="ja">～してもらうことはできますか？</div><div class="ex">A: Would you be able to come in on Saturday?<br>B: Sorry, I have plans that day.</div></button></li><li><button class="w" data-no="会10"><div class="top"><span class="no">会10</span><span class="en">I&#x27;d appreciate it if you could ～.</span></div><div class="ja">～していただけるとありがたいです。</div><div class="ex">A: I&#x27;d appreciate it if you could reply by Friday.<br>B: Of course. I&#x27;ll email you tomorrow.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j01/">← 熟語 Set 1</a><a href="../j03/">熟語 Set 3 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟11": 5.6, "熟12": 21.15, "熟13": 35.12, "熟14": 48.5, "熟15": 63.45, "熟16": 78.09, "熟17": 91.67, "熟18": 105.78, "熟19": 120.63, "熟20": 134.14, "会6": 149.4, "会7": 171.37, "会8": 190.25, "会9": 207.16, "会10": 224.82}, "TE": {"熟11": 7.5, "熟12": 23.19, "熟13": 36.99, "熟14": 50.38, "熟15": 65.32, "熟16": 79.96, "熟17": 93.54, "熟18": 107.65, "熟19": 122.5, "熟20": 136.06, "会6": 151.6, "会7": 173.56, "会8": 192.12, "会9": 209.16, "会10": 227.41}, "Q": [["熟11", "come alive", "活気づく、生き生きする"], ["熟12", "come to an end", "終わる"], ["熟13", "come about", "起こる、生じる"], ["熟14", "come out", "出る、発売される"], ["熟15", "come up", "出る、起こる"], ["熟16", "go by", "過ぎる"], ["熟17", "go with ～", "～に合う、似合う"], ["熟18", "get through ～", "～を乗り切る、終える"], ["熟19", "get
