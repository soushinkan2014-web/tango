<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>英検準2級プラス 第6回｜創心館</title><style>

</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第6回</h1><div class="sub">No.251〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">collapse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">崩れる；倒れる</div><div class="ex">The sand castle <b>collapsed</b> when a big wave hit it.</div><div class="xj">大きな波が当たって、砂の城が崩れた。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">distinguish</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を区別する</div><div class="ex">It is difficult to <b>distinguish</b> Ken from his twin brother.</div><div class="xj">ケンと双子の弟を区別するのは難しい。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">cultivate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を耕す；栽培する</div><div class="ex">The farmers <b>cultivate</b> the land before planting rice.</div><div class="xj">農家の人たちは、米を植える前に土地を耕す。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">declare</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を宣言する；申告する</div><div class="ex">The mayor <b>declared</b> the start of the summer festival.</div><div class="xj">市長が夏祭りの開始を宣言した。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">bloom</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（花が）咲く</div><div class="ex">Cherry trees <b>bloom</b> in early April in this area.</div><div class="xj">この地域では、桜は4月の初めに咲く。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">erupt</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">噴火する</div><div class="ex">This volcano has not <b>erupted</b> for 300 years.</div><div class="xj">この火山は300年間噴火していない。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">supervisor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">監督者；上司</div><div class="ex">Ken asked his <b>supervisor</b> for a day off next week.</div><div class="xj">ケンは来週休みを取れるよう上司に頼んだ。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">orbit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">軌道</div><div class="ex">The moon travels in an <b>orbit</b> around the earth.</div><div class="xj">月は地球のまわりの軌道を回っている。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">scholar</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">学者</div><div class="ex">The old <b>scholar</b> wrote many books about Japanese history.</div><div class="xj">その年配の学者は、日本の歴史について多くの本を書いた。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">sibling</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（男女の）きょうだい</div><div class="ex">Emi has three <b>siblings</b>, so her house is always busy.</div><div class="xj">エミにはきょうだいが3人いるので、家はいつもにぎやかだ。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">currency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">通貨</div><div class="ex">Before the trip, Tom changed his yen into the local <b>currency</b>.</div><div class="xj">旅行の前に、トムは円を現地の通貨に両替した。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">microscope</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">顕微鏡</div><div class="ex">In science class, we looked at leaves through a <b>microscope</b>.</div><div class="xj">理科の授業で、顕微鏡で葉を観察した。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">powder</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">粉</div><div class="ex">Mix this <b>powder</b> with water to make a cold drink.</div><div class="xj">この粉を水に混ぜると、冷たい飲み物ができる。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">privacy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">プライバシー；私生活</div><div class="ex">Please respect other people&#x27;s <b>privacy</b> and don&#x27;t read their messages.</div><div class="xj">他人のプライバシーを尊重し、メッセージを読まないようにしましょう。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">autograph</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（有名人の）サイン</div><div class="ex">Tom got the soccer player&#x27;s <b>autograph</b> on his T-shirt.</div><div class="xj">トムはそのサッカー選手のサインをTシャツにもらった。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">prejudice</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">偏見</div><div class="ex">We should not have <b>prejudice</b> against people from other countries.</div><div class="xj">外国の人々に対して偏見を持つべきではない。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">ecosystem</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生態系</div><div class="ex">Plastic trash in the sea is harming the ocean <b>ecosystem</b>.</div><div class="xj">海のプラスチックごみが、海の生態系に害を与えている。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">prescription</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">処方箋</div><div class="ex">The doctor gave me a <b>prescription</b> for my cough.</div><div class="xj">医者はせきのための処方箋を出してくれた。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">instinct</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">本能</div><div class="ex">Baby turtles go toward the sea by <b>instinct</b>.</div><div class="xj">ウミガメの赤ちゃんは、本能で海に向かう。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">substitute</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">代わりの人・物</div><div class="ex">We used honey as a <b>substitute</b> for sugar in this cake.</div><div class="xj">このケーキでは、砂糖の代わりにはちみつを使った。</div></button></li><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">unemployment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">失業</div><div class="ex">The new factory helped solve the problem of <b>unemployment</b> in town.</div><div class="xj">新しい工場は、町の失業問題の解決に役立った。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">incident</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出来事；事件</div><div class="ex">Tom told us about a funny <b>incident</b> on the school trip.</div><div class="xj">トムは修学旅行での面白い出来事について話してくれた。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">nutrient</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">栄養素</div><div class="ex">Vegetables contain many <b>nutrients</b> that our bodies need.</div><div class="xj">野菜には、体に必要な栄養素がたくさん含まれている。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">glacier</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">氷河</div><div class="ex">The <b>glacier</b> in this valley is getting smaller every year.</div><div class="xj">この谷の氷河は、年々小さくなっている。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">refugee</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">難民</div><div class="ex">Our school collected clothes for <b>refugees</b> from other countries.</div><div class="xj">私たちの学校は、外国から来た難民のために衣服を集めた。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">merchant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">商人</div><div class="ex">Long ago, <b>merchants</b> carried silk from China to Europe.</div><div class="xj">昔、商人たちは中国からヨーロッパへ絹を運んだ。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">coal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">石炭</div><div class="ex">In the past, many trains ran on <b>coal</b>.</div><div class="xj">昔は、多くの列車が石炭で走っていた。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">context</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">文脈；背景</div><div class="ex">You can often guess the meaning of a word from the <b>context</b>.</div><div class="xj">単語の意味は、文脈から推測できることが多い。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">maximum</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">最大限；最大量</div><div class="ex">This elevator can carry a <b>maximum</b> of ten people.</div><div class="xj">このエレベーターは最大10人まで乗せられる。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">organ</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">器官；臓器</div><div class="ex">The heart is one of the most important <b>organs</b> in the body.</div><div class="xj">心臓は、体の中で最も大切な器官の一つだ。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">district</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">地区；地域</div><div class="ex">My grandparents live in a quiet <b>district</b> near the river.</div><div class="xj">祖父母は川の近くの静かな地区に住んでいる。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">mission</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">任務；使命</div><div class="ex">The astronauts&#x27; <b>mission</b> was to repair the space station.</div><div class="xj">宇宙飛行士たちの任務は、宇宙ステーションを修理することだった。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">dependent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">（be dependent on ～で）～に頼っている</div><div class="ex">Small children are <b>dependent</b> on their parents for many things.</div><div class="xj">小さな子どもは、多くのことで親に頼っている。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">accustomed</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">（be accustomed to ～で）～に慣れている</div><div class="ex">Lisa soon became <b>accustomed</b> to life in Japan.</div><div class="xj">リサはすぐに日本での生活に慣れた。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">toxic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有毒な</div><div class="ex">Smoke from burning plastic is <b>toxic</b> to people and animals.</div><div class="xj">プラスチックを燃やした煙は、人や動物にとって有毒だ。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">remarkable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">注目すべき；すばらしい</div><div class="ex">Ken made <b>remarkable</b> progress in English this year.</div><div class="xj">ケンは今年、英語ですばらしい進歩をとげた。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">visual</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">視覚の</div><div class="ex">Our teacher uses many <b>visual</b> materials, like photos and videos.</div><div class="xj">先生は写真や動画など、視覚教材をたくさん使う。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">poisonous</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有毒な</div><div class="ex">Some mushrooms in this forest are <b>poisonous</b>, so don&#x27;t pick them.</div><div class="xj">この森のキノコの中には有毒なものもあるので、とってはいけない。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">sensible</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">分別のある；賢明な</div><div class="ex">Lisa is a <b>sensible</b> girl, so her parents trust her.</div><div class="xj">リサは分別のある子なので、両親は彼女を信頼している。</div></button></li><li><button cl
