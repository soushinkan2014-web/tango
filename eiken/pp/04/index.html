</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第4回</h1><div class="sub">No.151〜200</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">irritate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をいらいらさせる</div><div class="ex">The loud music next door <b>irritated</b> my father.</div><div class="xj">隣の家の大きな音楽が、父をいらいらさせた。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">reverse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を逆にする；元に戻す</div><div class="ex">If you <b>reverse</b> the order of the letters, you get a new word.</div><div class="xj">文字の順番を逆にすると、新しい単語ができる。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">resolve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を解決する；決心する</div><div class="ex">The two friends talked and <b>resolved</b> their problem.</div><div class="xj">2人の友だちは話し合って、問題を解決した。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">crawl</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">はう；はって進む</div><div class="ex">The baby <b>crawled</b> across the floor to her mother.</div><div class="xj">赤ちゃんは床をはって、母親のところまで行った。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">classify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を分類する</div><div class="ex">In science class, we <b>classified</b> animals into five groups.</div><div class="xj">理科の授業で、動物を5つのグループに分類した。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">defend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を守る；弁護する</div><div class="ex">The players worked hard to <b>defend</b> their goal.</div><div class="xj">選手たちは、自分たちのゴールを守るために懸命にがんばった。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">instruct</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に指示する；教える</div><div class="ex">The teacher <b>instructed</b> us to stay in our seats.</div><div class="xj">先生は私たちに、席を離れないよう指示した。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">sacrifice</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を犠牲にする</div><div class="ex">My mother <b>sacrificed</b> her free time to help me study.</div><div class="xj">母は自分の自由な時間を犠牲にして、私の勉強を手伝ってくれた。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">monitor</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を監視する；観察する</div><div class="ex">Cameras <b>monitor</b> the entrance of the building day and night.</div><div class="xj">カメラが、建物の入り口を昼も夜も監視している。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">criticism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">批判；批評</div><div class="ex">The new rule received a lot of <b>criticism</b> from students.</div><div class="xj">新しい規則は、生徒から多くの批判を受けた。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">tragedy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">悲劇</div><div class="ex">Our drama club will perform a <b>tragedy</b> at the festival.</div><div class="xj">演劇部は文化祭で悲劇を上演する予定だ。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">warrior</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">戦士</div><div class="ex">This old story is about a brave <b>warrior</b>.</div><div class="xj">この昔話は、勇かんな戦士の話だ。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">immigrant</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（外国からの）移民</div><div class="ex">Many <b>immigrants</b> came to this country to find work.</div><div class="xj">多くの移民が、仕事を求めてこの国にやって来た。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">genius</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">天才</div><div class="ex">My friend Ken is a <b>genius</b> at math.</div><div class="xj">友だちのケンは数学の天才だ。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">biography</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">伝記</div><div class="ex">I read a <b>biography</b> of a famous scientist.</div><div class="xj">私はある有名な科学者の伝記を読んだ。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">element</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">要素；元素</div><div class="ex">Teamwork is an important <b>element</b> of success.</div><div class="xj">チームワークは、成功の重要な要素だ。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">discrimination</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">差別</div><div class="ex">Our school does not allow any kind of <b>discrimination</b>.</div><div class="xj">私たちの学校では、どんな差別も許されない。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">conflict</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">対立；争い</div><div class="ex">The two clubs had a <b>conflict</b> over the use of the gym.</div><div class="xj">2つの部は、体育館の使い方をめぐって対立した。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">disappointment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">失望；がっかりすること</div><div class="ex">Ken couldn&#x27;t hide his <b>disappointment</b> after losing the game.</div><div class="xj">試合に負けたあと、ケンは失望を隠せなかった。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">proportion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">割合；比率</div><div class="ex">A large <b>proportion</b> of the students come to school by bike.</div><div class="xj">生徒のかなりの割合が、自転車で通学している。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">investigation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">調査；捜査</div><div class="ex">The city began an <b>investigation</b> into the cause of the noise.</div><div class="xj">市はその騒音の原因について調査を始めた。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">resort</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">行楽地；リゾート</div><div class="ex">We spent our summer vacation at a beach <b>resort</b>.</div><div class="xj">私たちは、夏休みを海辺のリゾートで過ごした。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">spectator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（スポーツなどの）観客</div><div class="ex">Thousands of <b>spectators</b> watched the soccer game.</div><div class="xj">何千人もの観客が、そのサッカーの試合を見た。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">priority</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">優先；優先事項</div><div class="ex">Safety is our top <b>priority</b> on the school trip.</div><div class="xj">修学旅行では、安全がいちばんの優先事項だ。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">surgeon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外科医</div><div class="ex">My uncle is a <b>surgeon</b> at a big hospital.</div><div class="xj">おじは大きな病院の外科医だ。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">surgery</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手術</div><div class="ex">My grandfather had <b>surgery</b> on his knee last month.</div><div class="xj">祖父は先月、ひざの手術を受けた。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">distinction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">区別；違い</div><div class="ex">Can you see the <b>distinction</b> between these two colors?</div><div class="xj">この2つの色の区別がつきますか。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">representative</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">代表者；担当者</div><div class="ex">Emi was chosen as the class <b>representative</b> for the meeting.</div><div class="xj">エミは、その会議に出るクラスの代表者に選ばれた。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">composition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">構成；作文</div><div class="ex">The <b>composition</b> of the class changed when new students joined.</div><div class="xj">新しい生徒が加わって、クラスの構成が変わった。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">contribution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">貢献；寄付</div><div class="ex">Ken made a big <b>contribution</b> to the team&#x27;s victory.</div><div class="xj">ケンはチームの勝利に大きな貢献をした。</div></button></li><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">principle</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">原理；原則</div><div class="ex">This machine works on a simple <b>principle</b>.</div><div class="xj">この機械は、簡単な原理で動いている。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">slope</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">坂；斜面</div><div class="ex">We rode our bikes down the gentle <b>slope</b>.</div><div class="xj">私たちは、ゆるやかな坂を自転車で下った。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">authority</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">権威；（複数形で）当局</div><div class="ex">Dr. Smith is an <b>authority</b> on space science.</div><div class="xj">スミス博士は、宇宙科学の権威だ。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">fitness</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">健康；体力づくり</div><div class="ex">My father jogs every morning to improve his <b>fitness</b>.</div><div class="xj">父は健康づくりのために、毎朝ジョギングをしている。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">disabled</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">障がいのある</div><div class="ex">This building has a special entrance for <b>disabled</b> people.</div><div class="xj">この建物には、障がいのある人のための特別な入り口がある。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">neutral</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">中立の</div><div class="ex">The referee must stay <b>neutral</b> during the game.</div><div class="xj">審判は試合中、中立でなければならない。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">massive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">巨大な；大規模な</div><div class="ex">A <b>massive</b> tree stands in front of the temple.</div><div class="xj">寺の前に巨大な木が立っている。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">amusing</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">おもしろい；楽しい</div><div class="ex">Grandpa told us an <b>amusing</b> story about his school days.</div><div class="xj">祖父は、学生時代のおもしろい話をしてくれた。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">gradual</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">徐々の；ゆるやかな</div><div class="ex">There has been a <b>gradual</b> increase in the number of visitors.</div><div class="xj">訪れる人の数が徐々に増えてきた。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">advanced</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">進んだ；上級の</div><div class="ex"
