</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第10回</h1><div class="sub">No.451〜500</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">exceed</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を超える</div><div class="ex">The number of visitors <b>exceeded</b> 10,000 this year.</div><div class="xj">今年の来場者数は1万人を超えた。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">cope</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（cope with ～で）～にうまく対処する</div><div class="ex">Emi is learning to <b>cope</b> with stress before tests.</div><div class="xj">エミは、テスト前のストレスにうまく対処する方法を学んでいる。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">modify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を修正する；変更する</div><div class="ex">We <b>modified</b> our plan because of the rain.</div><div class="xj">雨のため、私たちは計画を修正した。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">inspect</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を検査する；点検する</div><div class="ex">Workers <b>inspect</b> the trains carefully every night.</div><div class="xj">作業員は毎晩、電車を注意深く検査する。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">refill</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を詰め替える；補充する</div><div class="ex">Please <b>refill</b> the shampoo bottle when it is empty.</div><div class="xj">シャンプーの容器が空になったら、詰め替えてください。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">interpret</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を解釈する；通訳する</div><div class="ex">People <b>interpret</b> this poem in many different ways.</div><div class="xj">人々は、この詩をさまざまに解釈する。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">commit</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（罪など）を犯す</div><div class="ex">The player <b>committed</b> a foul and got a yellow card.</div><div class="xj">その選手は反則を犯して、イエローカードを受けた。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">grant</span><span class="ps">動</span><span class="star">★★</span></div><div class="ja">～を与える；認める</div><div class="ex">The school <b>granted</b> Ken permission to leave early.</div><div class="xj">学校はケンに早退の許可を与えた。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">circumstance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（複数形で）状況；事情</div><div class="ex">We must think about the <b>circumstances</b> before we decide.</div><div class="xj">決める前に、状況をよく考えなければならない。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">tuition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">授業料</div><div class="ex">My brother works part-time to help pay his <b>tuition</b>.</div><div class="xj">兄は授業料の足しにするため、アルバイトをしている。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">pedestrian</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">歩行者</div><div class="ex">This street is only for <b>pedestrians</b> on Sundays.</div><div class="xj">この通りは、日曜日は歩行者専用だ。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">insight</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">洞察；見識</div><div class="ex">The book gave me new <b>insight</b> into Japanese culture.</div><div class="xj">その本は、日本文化についての新しい洞察を与えてくれた。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">outlet</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">コンセント；直販店</div><div class="ex">Is there an <b>outlet</b> near the desk for my laptop?</div><div class="xj">ノートパソコン用に、机の近くにコンセントはありますか。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">logic</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">論理</div><div class="ex">I can&#x27;t understand the <b>logic</b> of his answer.</div><div class="xj">私には、彼の答えの論理が理解できない。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">lawn</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">芝生</div><div class="ex">Please don&#x27;t walk on the <b>lawn</b> in the park.</div><div class="xj">公園の芝生の上を歩かないでください。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">landmark</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">目印となる建物；名所</div><div class="ex">The old clock tower is a <b>landmark</b> of our town.</div><div class="xj">その古い時計台は、私たちの町の名所だ。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">innovation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">革新；新しい考え</div><div class="ex">Smartphones were a big <b>innovation</b> in communication.</div><div class="xj">スマートフォンは、通信の分野での大きな革新だった。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">vaccine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ワクチン</div><div class="ex">Many people got the flu <b>vaccine</b> this winter.</div><div class="xj">この冬、多くの人がインフルエンザのワクチンを受けた。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">cuisine</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">料理；料理法</div><div class="ex">Lisa loves Italian <b>cuisine</b>, especially pizza and pasta.</div><div class="xj">リサはイタリア料理が大好きで、特にピザとパスタが好きだ。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">draft</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">下書き；草稿</div><div class="ex">Ken showed the first <b>draft</b> of his speech to his teacher.</div><div class="xj">ケンはスピーチの最初の下書きを先生に見せた。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">wildfire</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">山火事</div><div class="ex">Dry weather makes <b>wildfires</b> more likely in summer.</div><div class="xj">夏は、乾燥した天気のせいで山火事が起こりやすくなる。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">merit</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">長所；利点</div><div class="ex">One <b>merit</b> of this school is its large library.</div><div class="xj">この学校の長所の一つは、大きな図書館があることだ。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">contrary</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">反対；逆</div><div class="ex">The test wasn&#x27;t difficult. On the <b>contrary</b>, it was very easy.</div><div class="xj">テストは難しくなかった。逆に、とても簡単だった。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">sunlight</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">日光</div><div class="ex">Plants need <b>sunlight</b> and water to grow.</div><div class="xj">植物が育つには、日光と水が必要だ。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">backpack</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">リュックサック</div><div class="ex">Tom put his lunch and a water bottle in his <b>backpack</b>.</div><div class="xj">トムは弁当と水筒をリュックサックに入れた。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">championship</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">選手権；優勝</div><div class="ex">Our team won the city basketball <b>championship</b> last year.</div><div class="xj">私たちのチームは昨年、市のバスケットボール選手権で優勝した。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">leadership</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">指導力；リーダーシップ</div><div class="ex">Emi showed great <b>leadership</b> as captain of the team.</div><div class="xj">エミはチームのキャプテンとして、すばらしい指導力を発揮した。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">category</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">部類；カテゴリー</div><div class="ex">Please sort these books into three <b>categories</b>.</div><div class="xj">これらの本を3つのカテゴリーに分けてください。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">laptop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">ノートパソコン</div><div class="ex">Lisa does her homework on her <b>laptop</b> at the library.</div><div class="xj">リサは図書館で、ノートパソコンを使って宿題をする。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">timetable</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">時刻表；予定表</div><div class="ex">Let&#x27;s check the bus <b>timetable</b> before we leave.</div><div class="xj">出発する前に、バスの時刻表を確認しよう。</div></button></li><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">terminal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（空港の）ターミナル；終点</div><div class="ex">Please take the bus to the international <b>terminal</b>.</div><div class="xj">国際線ターミナルへはバスで行ってください。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">rooftop</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（建物の）屋上</div><div class="ex">There is a small garden on the <b>rooftop</b> of our school.</div><div class="xj">私たちの学校の屋上には、小さな庭がある。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">railway</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">鉄道</div><div class="ex">The new <b>railway</b> will connect the two cities.</div><div class="xj">新しい鉄道が2つの都市を結ぶ予定だ。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">dioxide</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">二酸化物（carbon dioxideで二酸化炭素）</div><div class="ex">Trees take in carbon <b>dioxide</b> from the air.</div><div class="xj">木は空気中の二酸化炭素を取り入れる。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">union</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">組合；連合</div><div class="ex">My mother is a member of the workers&#x27; <b>union</b>.</div><div class="xj">母は労働組合の一員だ。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">belonging</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（複数形で）持ち物；所属</div><div class="ex">Please take all your <b>belongings</b> when you leave the train.</div><div class="xj">電車を降りるときは、持ち物をすべてお持ちください。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">seller</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">売り手；販売者</div><div class="ex">The <b>seller</b> at the market gave us some free apples.</div><div class="xj">市場の売り手が、私たちにりんごをおまけでくれた。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">artwork</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">芸術作品；挿絵</div><div class="ex">Students&#x27; <b>artwork</b> is on display in the school hall.</div><div class="xj">生徒たちの芸術作品が、学校のホールに展示されている。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">thorough</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">徹底的な</div><div class="ex">We gave the classroom a <b>thorough</b> cleaning before summer vacation.</div><div class="xj">夏休みの前に、教室を徹底的に掃除した。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">classic</span><span class="ps">形</span><span cl
