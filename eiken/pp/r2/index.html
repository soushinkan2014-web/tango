 her book.</div><div class="xj">その作家は本の中で美しい夕日を描写した。</div></button></li><li><button class="w" data-no="復55"><div class="top"><span class="no">復55</span><span class="en">occur</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">起こる；（考えが）浮かぶ</div><div class="ex">Mistakes often <b>occur</b> when you are in a hurry.</div><div class="xj">急いでいるときは、ミスがよく起こる。</div></button></li><li><button class="w" data-no="復56"><div class="top"><span class="no">復56</span><span class="en">lower</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を下げる；低くする</div><div class="ex">The store <b>lowered</b> the price of the old computers.</div><div class="xj">その店は古いパソコンの値段を下げた。</div></button></li><li><button class="w" data-no="復57"><div class="top"><span class="no">復57</span><span class="en">release</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を放す；～を発売する</div><div class="ex">The children <b>released</b> the baby turtles into the sea.</div><div class="xj">子どもたちは子ガメを海に放した。</div></button></li><li><button class="w" data-no="復58"><div class="top"><span class="no">復58</span><span class="en">suit</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～に似合う；～に都合がよい</div><div class="ex">That blue dress really <b>suits</b> you.</div><div class="xj">あの青いドレスは本当にあなたに似合っている。</div></button></li><li><button class="w" data-no="復59"><div class="top"><span class="no">復59</span><span class="en">prove</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を証明する；（prove to be ～）～だとわかる</div><div class="ex">The scientist <b>proved</b> that her idea was right.</div><div class="xj">その科学者は自分の考えが正しいことを証明した。</div></button></li><li><button class="w" data-no="復60"><div class="top"><span class="no">復60</span><span class="en">handle</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を扱う；処理する</div><div class="ex">Please <b>handle</b> these glass cups with care.</div><div class="xj">このガラスのカップは注意して扱ってください。</div></button></li><li><button class="w" data-no="復61"><div class="top"><span class="no">復61</span><span class="en">exhibit</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を展示する</div><div class="ex">The museum <b>exhibits</b> paintings by local artists.</div><div class="xj">その美術館は地元の画家の絵を展示している。</div></button></li><li><button class="w" data-no="復62"><div class="top"><span class="no">復62</span><span class="en">hire</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を雇う</div><div class="ex">The bakery <b>hired</b> two new workers last month.</div><div class="xj">そのパン屋は先月、新しい店員を2人雇った。</div></button></li><li><button class="w" data-no="復63"><div class="top"><span class="no">復63</span><span class="en">mail</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を郵送する</div><div class="ex">I <b>mailed</b> a birthday card to my aunt yesterday.</div><div class="xj">私は昨日、おばに誕生日カードを郵送した。</div></button></li><li><button class="w" data-no="復64"><div class="top"><span class="no">復64</span><span class="en">drop</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を落とす；（人）を車から降ろす</div><div class="ex">Tom <b>dropped</b> his key on the way home.</div><div class="xj">トムは帰り道でかぎを落とした。</div></button></li><li><button class="w" data-no="復65"><div class="top"><span class="no">復65</span><span class="en">suppose</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～だと思う；（be supposed to ～）～することになっている</div><div class="ex">I <b>suppose</b> Tom is still at soccer practice.</div><div class="xj">トムはまだサッカーの練習中だと思う。</div></button></li><li><button class="w" data-no="復66"><div class="top"><span class="no">復66</span><span class="en">purchase</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を購入する</div><div class="ex">You can <b>purchase</b> concert tickets on this website.</div><div class="xj">このウェブサイトでコンサートのチケットを購入することができます。</div></button></li><li><button class="w" data-no="復67"><div class="top"><span class="no">復67</span><span class="en">accept</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を受け入れる</div><div class="ex">Ken <b>accepted</b> his friend&#x27;s advice and practiced harder.</div><div class="xj">ケンは友だちのアドバイスを受け入れて、もっと熱心に練習した。</div></button></li><li><button class="w" data-no="復68"><div class="top"><span class="no">復68</span><span class="en">avoid</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">～を避ける</div><div class="ex">We left early to <b>avoid</b> the heavy traffic.</div><div class="xj">私たちは渋滞を避けるために早く出発した。</div></button></li><li><button class="w" data-no="復69"><div class="top"><span class="no">復69</span><span class="en">rely</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">（rely on ～）～に頼る</div><div class="ex">Many people <b>rely</b> on trains to get to work.</div><div class="xj">多くの人が、通勤を電車に頼っている。</div></button></li><li><button class="w" data-no="復70"><div class="top"><span class="no">復70</span><span class="en">succeed</span><span class="ps">動</span><span class="star">★★★</span></div><div class="ja">成功する；（succeed in -ing）～に成功する</div><div class="ex">After a lot of practice, Tom finally <b>succeeded</b>.</div><div class="xj">たくさん練習したあと、トムはついに成功した。</div></button></li><li><button class="w" data-no="復71"><div class="top"><span class="no">復71</span><span class="en">level</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">水準；レベル</div><div class="ex">The <b>level</b> of education in this country is high.</div><div class="xj">この国の教育の水準は高い。</div></button></li><li><button class="w" data-no="復72"><div class="top"><span class="no">復72</span><span class="en">custom</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">習慣；（customsで）税関</div><div class="ex">Taking off your shoes at home is a Japanese <b>custom</b>.</div><div class="xj">家でくつを脱ぐのは日本の習慣だ。</div></button></li><li><button class="w" data-no="復73"><div class="top"><span class="no">復73</span><span class="en">opportunity</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">機会</div><div class="ex">Studying abroad is a great <b>opportunity</b> to learn English.</div><div class="xj">留学は英語を学ぶすばらしい機会だ。</div></button></li><li><button class="w" data-no="復74"><div class="top"><span class="no">復74</span><span class="en">benefit</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">利益；恩恵</div><div class="ex">Walking every day has many health <b>benefits</b>.</div><div class="xj">毎日歩くことには、健康上の利益がたくさんある。</div></button></li><li><button class="w" data-no="復75"><div class="top"><span class="no">復75</span><span class="en">gas</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ガス；ガソリン</div><div class="ex">Please turn off the <b>gas</b> after cooking.</div><div class="xj">料理のあとはガスを止めてください。</div></button></li><li><button class="w" data-no="復76"><div class="top"><span class="no">復76</span><span class="en">forecast</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">予報；予測</div><div class="ex">The weather <b>forecast</b> says it will be sunny tomorrow.</div><div class="xj">天気予報によると、明日は晴れだ。</div></button></li><li><button class="w" data-no="復77"><div class="top"><span class="no">復77</span><span class="en">supply</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">供給；（suppliesで）必需品</div><div class="ex">The <b>supply</b> of water stopped for two hours.</div><div class="xj">水の供給が2時間止まった。</div></button></li><li><button class="w" data-no="復78"><div class="top"><span class="no">復78</span><span class="en">period</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">期間；時代</div><div class="ex">You can borrow books for a <b>period</b> of two weeks.</div><div class="xj">本は2週間の期間借りることができる。</div></button></li><li><button class="w" data-no="復79"><div class="top"><span class="no">復79</span><span class="en">behavior</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">ふるまい；行動</div><div class="ex">The teacher was happy with the students&#x27; good <b>behavior</b>.</div><div class="xj">先生は生徒たちのよいふるまいに満足した。</div></button></li><li><button class="w" data-no="復80"><div class="top"><span class="no">復80</span><span class="en">convenience</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">便利さ；（convenience store）コンビニ</div><div class="ex">I like the <b>convenience</b> of living near the station.</div><div class="xj">駅の近くに住む便利さが気に入っている。</div></button></li><li><button class="w" data-no="復81"><div class="top"><span class="no">復81</span><span class="en">feature</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">特徴；（目玉となる）呼び物</div><div class="ex">A big garden is the best <b>feature</b> of this house.</div><div class="xj">広い庭がこの家のいちばんの特徴だ。</div></button></li><li><button class="w" data-no="復82"><div class="top"><span class="no">復82</span><span class="en">material</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">材料；素材</div><div class="ex">We bought <b>materials</b> for the art project.</div><div class="xj">私たちは美術の課題の材料を買った。</div></button></li><li><button class="w" data-no="復83"><div class="top"><span class="no">復83</span><span class="en">solution</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">解決策</div><div class="ex">We need to find a <b>solution</b> to this problem.</div><div class="xj">私たちはこの問題の解決策を見つける必要がある。</div></button></li><li><button class="w" data-no="復84"><div class="top"><span class="no">復84</span><span class="en">cooperation</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">協力</div><div class="ex">Thank you for your <b>cooperation</b> at the school event.</div><div class="xj">学校行事へのご協力ありがとうございました。</div></button></li><li><button class="w" data-no="復85"><div class="top"><span class="no">復85</span><span class="en">control</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">支配；管理</div><div class="ex">Long ago, this island was under the <b>control</b> of a king.</div><div class="xj">昔、この島は王の支配下にあった。</div></button></li><li><button class="w" data-no="復86"><div class="top"><span class="no">復86</span><span class="en">department</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">（会社の）部；（大学の）学科；売り場</div><div class="ex">My father works in the sales <b>department</b> of a big company.</div><div class="xj">父は大きな会社の営業部で働いている。</div></button></li><li><button class="w" data-no="復87"><div class="top"><span class="no">復87</span><span class="en">plenty</span><span class="ps">名</span><span class="star">★★★</span></div><div class="ja">たくさん；（plenty of ～）たくさんの～</div><div class="ex">Don&#x27;t worry. We have <b>plenty</b> of time.</div><div class="xj">心配しないで。時間はたくさんあるよ。</div></button></li><li><button class="w" data-no="復88"><div class="top"><span class="no">復88</span><span class="en">negative</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">否定的な；よくない</div><div class="ex">Try not to have <b>negative</b> thoughts before a test.</div><div class="xj">テストの前に否定的な考えを持たないようにしよう。</div></button></li><li><button class="w" data-no="復89"><div class="top"><span class="no">復89</span><span class="en">particular</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">特定の；特別の</div><div class="ex">Is there a <b>particular</b> book you want to read?</div><div class="xj">読みたい特定の本はありますか。</div></button></li><li><button class="w" data-no="復90"><div class="top"><span class="no">復90</span><span class="en">suitable</span><span class="ps">形</span><span class="star">★★★</span></div><div class="ja">適した；ふさわしい</div><div cl
