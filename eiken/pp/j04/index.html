</div><div class="ex">You can refer to your dictionary during the test.</div><div class="xj">テスト中に辞書を見てもよい。</div></button></li><li><button class="w" data-no="熟36"><div class="top"><span class="no">熟36</span><span class="en">cope with ～</span></div><div class="ja">～にうまく対処する</div><div class="ex">Many students learn how to cope with stress before exams.</div><div class="xj">多くの生徒が試験前のストレスにうまく対処する方法を学ぶ。</div></button></li><li><button class="w" data-no="熟37"><div class="top"><span class="no">熟37</span><span class="en">adapt to ～</span></div><div class="ja">～に適応する、慣れる</div><div class="ex">Animals in the desert have adapted to the dry climate.</div><div class="xj">砂漠の動物は乾燥した気候に適応してきた。</div></button></li><li><button class="w" data-no="熟38"><div class="top"><span class="no">熟38</span><span class="en">specialize in ～</span></div><div class="ja">～を専門にする</div><div class="ex">This restaurant specializes in seafood dishes.</div><div class="xj">このレストランは魚介料理を専門にしている。</div></button></li><li><button class="w" data-no="熟39"><div class="top"><span class="no">熟39</span><span class="en">decide on ～</span></div><div class="ja">～に決める</div><div class="ex">We decided on a name for our new puppy.</div><div class="xj">私たちは新しい子犬の名前を決めた。</div></button></li><li><button class="w" data-no="熟40"><div class="top"><span class="no">熟40</span><span class="en">devote oneself to ～</span></div><div class="ja">～に打ち込む、身をささげる</div><div class="ex">She devoted herself to helping children in need.</div><div class="xj">彼女は困っている子どもたちを助けることに身をささげた。</div></button></li><li><button class="w" data-no="会16"><div class="top"><span class="no">会16</span><span class="en">May I speak to ～?</span></div><div class="ja">～さんをお願いします。（電話で）</div><div class="ex">A: Hello. May I speak to Ms. Ito?<br>B: Just a moment, please.</div></button></li><li><button class="w" data-no="会17"><div class="top"><span class="no">会17</span><span class="en">I&#x27;m calling about ～.</span></div><div class="ja">～の件でお電話しました。</div><div class="ex">A: I&#x27;m calling about the part-time job at your shop.<br>B: Thank you. Can I have your name?</div></button></li><li><button class="w" data-no="会18"><div class="top"><span class="no">会18</span><span class="en">He&#x27;s out at the moment.</span></div><div class="ja">彼は今出かけています。</div><div class="ex">A: Is Mr. Clark there?<br>B: Sorry, he&#x27;s out at the moment.</div></button></li><li><button class="w" data-no="会19"><div class="top"><span class="no">会19</span><span class="en">Would you like to leave a message?</span></div><div class="ja">伝言を残しますか？</div><div class="ex">A: She&#x27;s in a meeting. Would you like to leave a message?<br>B: Yes. Please tell her I called.</div></button></li><li><button class="w" data-no="会20"><div class="top"><span class="no">会20</span><span class="en">I&#x27;m returning your call.</span></div><div class="ja">お電話をいただいたので、かけ直しました。</div><div class="ex">A: Hello, this is Mika Sato. I&#x27;m returning your call.<br>B: Oh, thank you for calling back.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j03/">← 熟語 Set 3</a><a href="../j05/">熟語 Set 5 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟31": 5.58, "熟32": 20.84, "熟33": 34.16, "熟34": 49.1, "熟35": 63.84, "熟36": 79.58, "熟37": 94.52, "熟38": 109.3, "熟39": 124.3, "熟40": 137.69, "会16": 153.24, "会17": 172.62, "会18": 191.76, "会19": 208.46, "会20": 228.68}, "TE": {"熟31": 7.45, "熟32": 22.71, "熟33": 36.2, "熟34": 51.26, "熟35": 65.71, "熟36": 81.45, "熟37": 96.4, "熟38": 111.49, "熟39": 126.22, "熟40": 139.97, "会16": 155.18, "会17": 174.73, "会18": 193.92, "会19": 210.88, "会20": 230.96}, "Q": [["熟31", "go through ～", "～を経験する、行う"], ["熟32", "look after ～", "～の世話をする"], ["熟33", "insist on ～", "～を強く主張する、言い張る"], ["熟34", "concentrate on ～", "～に集中する"], ["熟35", "refer to ～", "～を参照する、～に言及する"], ["熟36", "cope with ～", "～にうまく対処する"], ["熟37", "adapt to ～", "～に適応する、慣れる"], ["熟38", "speciali
