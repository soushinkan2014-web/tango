</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第19回</h1><div class="sub">No.901〜950</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="901"><div class="top"><span class="no">901</span><span class="en">assure</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に保証する；安心させる</div><div class="ex">The clerk <b>assured</b> me that the watch was new.</div><div class="xj">店員は、その時計が新品だと私に保証した。</div></button></li><li><button class="w" data-no="902"><div class="top"><span class="no">902</span><span class="en">confess</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（～を）告白する；白状する</div><div class="ex">Ken <b>confessed</b> to his friend that he was afraid of dogs.</div><div class="xj">ケンは友だちに、犬がこわいことを告白した。</div></button></li><li><button class="w" data-no="903"><div class="top"><span class="no">903</span><span class="en">accuse</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を非難する；告発する</div><div class="ex">Lisa <b>accused</b> her brother of breaking her pen.</div><div class="xj">リサは、弟が自分のペンを壊したと非難した。</div></button></li><li><button class="w" data-no="904"><div class="top"><span class="no">904</span><span class="en">glance</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">ちらっと見る</div><div class="ex">Emi <b>glanced</b> at the clock and ran out of the room.</div><div class="xj">エミは時計をちらっと見て、部屋から走り出た。</div></button></li><li><button class="w" data-no="905"><div class="top"><span class="no">905</span><span class="en">regain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り戻す</div><div class="ex">Ken soon <b>regained</b> his confidence after the game.</div><div class="xj">ケンは試合のあと、すぐに自信を取り戻した。</div></button></li><li><button class="w" data-no="906"><div class="top"><span class="no">906</span><span class="en">embrace</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を受け入れる；抱きしめる</div><div class="ex">Our town <b>embraced</b> the idea of a weekend market.</div><div class="xj">私たちの町は、週末に市場を開くという考えを受け入れた。</div></button></li><li><button class="w" data-no="907"><div class="top"><span class="no">907</span><span class="en">retrieve</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り戻す；回収する</div><div class="ex">Ken <b>retrieved</b> his ball from the neighbor&#x27;s yard.</div><div class="xj">ケンは隣の家の庭から、ボールを取り戻した。</div></button></li><li><button class="w" data-no="908"><div class="top"><span class="no">908</span><span class="en">swap</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を交換する</div><div class="ex">Emi and Lisa <b>swapped</b> seats on the bus.</div><div class="xj">エミとリサは、バスで席を交換した。</div></button></li><li><button class="w" data-no="909"><div class="top"><span class="no">909</span><span class="en">depict</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を描く；描写する</div><div class="ex">This painting <b>depicts</b> life in a small fishing village.</div><div class="xj">この絵は、小さな漁村の暮らしを描いている。</div></button></li><li><button class="w" data-no="910"><div class="top"><span class="no">910</span><span class="en">verify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を確かめる；立証する</div><div class="ex">Please <b>verify</b> the information before you write your report.</div><div class="xj">レポートを書く前に、情報を確かめてください。</div></button></li><li><button class="w" data-no="911"><div class="top"><span class="no">911</span><span class="en">engage</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（engage in ～で）～に従事する；～を引きつける</div><div class="ex">Many students <b>engage</b> in volunteer work during the summer.</div><div class="xj">夏の間、多くの生徒がボランティア活動に従事している。</div></button></li><li><button class="w" data-no="912"><div class="top"><span class="no">912</span><span class="en">reunite</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">再会する；～を再会させる</div><div class="ex">The old classmates <b>reunited</b> after twenty years.</div><div class="xj">昔の同級生たちが、20年ぶりに再会した。</div></button></li><li><button class="w" data-no="913"><div class="top"><span class="no">913</span><span class="en">supervise</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を監督する；管理する</div><div class="ex">Two teachers <b>supervise</b> the students during lunch.</div><div class="xj">昼食の間は、2人の先生が生徒を監督する。</div></button></li><li><button class="w" data-no="914"><div class="top"><span class="no">914</span><span class="en">stimulate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を刺激する；活発にする</div><div class="ex">Reading books can <b>stimulate</b> young children&#x27;s imagination.</div><div class="xj">本を読むことは、幼い子どもの想像力を刺激する。</div></button></li><li><button class="w" data-no="915"><div class="top"><span class="no">915</span><span class="en">fatigue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">疲労</div><div class="ex">Lack of sleep can cause <b>fatigue</b> and headaches.</div><div class="xj">睡眠不足は、疲労や頭痛を引き起こすことがある。</div></button></li><li><button class="w" data-no="916"><div class="top"><span class="no">916</span><span class="en">organism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">生物；有機体</div><div class="ex">Tiny <b>organisms</b> live in this pond water.</div><div class="xj">この池の水には、小さな生物がすんでいる。</div></button></li><li><button class="w" data-no="917"><div class="top"><span class="no">917</span><span class="en">disorder</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混乱；（心身の）不調</div><div class="ex">The long train delay threw the station into <b>disorder</b>.</div><div class="xj">電車の長い遅れで、駅は混乱した。</div></button></li><li><button class="w" data-no="918"><div class="top"><span class="no">918</span><span class="en">shortcoming</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欠点；短所</div><div class="ex">Ken&#x27;s biggest <b>shortcoming</b> is that he is often late.</div><div class="xj">ケンの最大の欠点は、よく遅刻することだ。</div></button></li><li><button class="w" data-no="919"><div class="top"><span class="no">919</span><span class="en">mainstream</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">主流</div><div class="ex">Electric cars are becoming part of the <b>mainstream</b>.</div><div class="xj">電気自動車は主流になりつつある。</div></button></li><li><button class="w" data-no="920"><div class="top"><span class="no">920</span><span class="en">transition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">移り変わり；移行</div><div class="ex">The <b>transition</b> from summer to fall is beautiful here.</div><div class="xj">ここでは、夏から秋への移り変わりが美しい。</div></button></li><li><button class="w" data-no="921"><div class="top"><span class="no">921</span><span class="en">mentor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（信頼できる）指導者；助言者</div><div class="ex">My piano teacher has been a great <b>mentor</b> to me.</div><div class="xj">ピアノの先生は、私にとってすばらしい指導者だ。</div></button></li><li><button class="w" data-no="922"><div class="top"><span class="no">922</span><span class="en">promotion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">昇進；販売促進</div><div class="ex">My father got a <b>promotion</b> at work last month.</div><div class="xj">父は先月、職場で昇進した。</div></button></li><li><button class="w" data-no="923"><div class="top"><span class="no">923</span><span class="en">congestion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">混雑；渋滞</div><div class="ex">There is always <b>congestion</b> on this road in the morning.</div><div class="xj">この道路は、朝はいつも混雑している。</div></button></li><li><button class="w" data-no="924"><div class="top"><span class="no">924</span><span class="en">appreciation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感謝；理解</div><div class="ex">We gave our coach flowers to show our <b>appreciation</b>.</div><div class="xj">私たちは感謝の気持ちを表すため、コーチに花を贈った。</div></button></li><li><button class="w" data-no="925"><div class="top"><span class="no">925</span><span class="en">excess</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">過剰；超過</div><div class="ex">An <b>excess</b> of salt is bad for your health.</div><div class="xj">塩分が過剰だと、健康によくない。</div></button></li><li><button class="w" data-no="926"><div class="top"><span class="no">926</span><span class="en">dispute</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">論争；紛争</div><div class="ex">There was a <b>dispute</b> between the two schools about the game&#x27;s result.</div><div class="xj">試合の結果をめぐって、2つの学校の間で論争が起きた。</div></button></li><li><button class="w" data-no="927"><div class="top"><span class="no">927</span><span class="en">stereotype</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">固定観念；ステレオタイプ</div><div class="ex">It is a <b>stereotype</b> that all boys like sports.</div><div class="xj">男の子はみんなスポーツが好きだというのは固定観念だ。</div></button></li><li><button class="w" data-no="928"><div class="top"><span class="no">928</span><span class="en">immigration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（外国からの）移住；入国管理</div><div class="ex">The museum shows the history of <b>immigration</b> to this country.</div><div class="xj">その博物館は、この国への移住の歴史を展示している。</div></button></li><li><button class="w" data-no="929"><div class="top"><span class="no">929</span><span class="en">occurrence</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">出来事；発生</div><div class="ex">Snow in April is a rare <b>occurrence</b> here.</div><div class="xj">ここでは、4月の雪は珍しい出来事だ。</div></button></li><li><button class="w" data-no="930"><div class="top"><span class="no">930</span><span class="en">hazard</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">危険；危険要因</div><div class="ex">Ice on the road is a <b>hazard</b> for drivers.</div><div class="xj">道路の氷は、運転する人にとって危険だ。</div></button></li><li><button class="w" data-no="931"><div class="top"><span class="no">931</span><span class="en">ownership</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">所有；所有権</div><div class="ex">Car <b>ownership</b> is less common among young people today.</div><div class="xj">最近は、若い人の間で車の所有が少なくなっている。</div></button></li><li><button class="w" data-no="932"><div class="top"><span class="no">932</span><span class="en">incredible</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">信じられない；すばらしい</div><div class="ex">It is <b>incredible</b> that Tom ran ten kilometers in thirty minutes.</div><div class="xj">トムが10キロを30分で走ったなんて信じられない。</div></button></li><li><button class="w" data-no="933"><div class="top"><span class="no">933</span><span class="en">economical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">経済的な；節約になる</div><div class="ex">Riding a bike to school is <b>economical</b> and healthy.</div><div class="xj">自転車通学は経済的で健康的だ。</div></button></li><li><button class="w" data-no="934"><div class="top"><span class="no">934</span><span class="en">ongoing</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">進行中の；継続している</div><div class="ex">The repair work on the bridge is still <b>ongoing</b>.</div><div class="xj">その橋の修理工事は、まだ進行中だ。</div></button></li><li><button class="w" data-no="935"><div class="top"><span class="no">935</span><span class="en">unprecedented</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">前例のない</div><div class="ex">The festival had an <b>unprecedented</b> number of visitors this year.</div><div class="xj">今年、その祭りには前例のない数の来場者があった。</div></button></li><li><button class="w" data-no="936"><div class="top"><span class="no">936</span><span class="en">theoretical</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">理論的な；理論上の</div><div class="ex">This book is too <b>theoretical</b> for beginners.</div><div class="xj">この本は、初心者には理論的すぎる。</div></button></li><li><button class="w" data-no="937"><div class="top"><span class="no">937</span><span class="en">delightful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">楽しい；うれしい</div><div class="ex">We spent a <b>delightful</b> afternoon at the park.</div><div class="xj">私たちは公園で楽しい午後を過ごした。</div></button></li><li><button class="w" data-no="938"><div class="top"><span class="no">938</span><span class="en">symbolic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">象徴的な</div><div class="ex">The old tower is <b>symbolic</b> of our city&#x27;s long history.</div><div class="xj">その古い塔は、私たちの市の長い歴史の象徴的な存在だ。</div></button></li><li><button class="w" data-no="939"><div class="top"><span class="no">939</span><span class="en">vibrant</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">活気のある；鮮やかな</div><div class="ex">This shopping street is <b>vibrant</b> on weekends.</div><div class="xj">この商店街は、週末になると活気がある。</div></button></li><li><button class="w" data-no="940"><div class="top"><span class="no">940</span><span class="en">offensive</span><span cla
