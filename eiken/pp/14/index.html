</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第14回</h1><div class="sub">No.651〜700</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">weep</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（涙を流して）泣く</div><div class="ex">Emi <b>wept</b> with joy when she won the contest.</div><div class="xj">エミはコンテストで優勝して、うれしくて泣いた。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">resign</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">辞職する；辞任する</div><div class="ex">Mr. Brown <b>resigned</b> from his job to open a café.</div><div class="xj">ブラウンさんはカフェを開くために仕事を辞職した。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">alter</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を変える；変わる</div><div class="ex">We had to <b>alter</b> our plans because of the typhoon.</div><div class="xj">台風のため、私たちは計画を変えなければならなかった。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">weaken</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を弱める；弱まる</div><div class="ex">The storm <b>weakened</b> as it moved north.</div><div class="xj">嵐は北へ進むにつれて弱まった。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">conceal</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を隠す</div><div class="ex">Tom tried to <b>conceal</b> his test score from his parents.</div><div class="xj">トムはテストの点数を両親に隠そうとした。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">glory</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">栄光</div><div class="ex">The players enjoyed the <b>glory</b> of their first win.</div><div class="xj">選手たちは初勝利の栄光を味わった。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">syndrome</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">症候群</div><div class="ex">The doctor explained the <b>syndrome</b> to the patient&#x27;s family.</div><div class="xj">医者は患者の家族に、その症候群について説明した。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">perspective</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">見方；観点</div><div class="ex">Traveling abroad gave me a new <b>perspective</b> on life.</div><div class="xj">海外旅行で、私は人生について新しい見方をするようになった。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">inheritance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">相続；遺産</div><div class="ex">The lawyer explained the rules of <b>inheritance</b> to us.</div><div class="xj">弁護士が私たちに相続の決まりを説明してくれた。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">command</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">命令；（言語の）運用力</div><div class="ex">The dog sat down at its owner&#x27;s <b>command</b>.</div><div class="xj">その犬は飼い主の命令で座った。</div></button></li><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">literacy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">読み書きの能力</div><div class="ex">Reading books every day improves children&#x27;s <b>literacy</b>.</div><div class="xj">毎日本を読むと、子どもの読み書きの能力が向上する。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">sensation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感覚；大評判</div><div class="ex">I felt a strange <b>sensation</b> in my leg after the long walk.</div><div class="xj">長い距離を歩いたあと、足に変な感覚があった。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">geography</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">地理；地理学</div><div class="ex">Tom is good at <b>geography</b> and knows many countries.</div><div class="xj">トムは地理が得意で、たくさんの国を知っている。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">layout</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">配置；レイアウト</div><div class="ex">I really like the <b>layout</b> of this new kitchen.</div><div class="xj">私はこの新しい台所の配置がとても気に入っている。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">navigation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">航行；ナビゲーション</div><div class="ex">The lighthouse is important for safe <b>navigation</b> at night.</div><div class="xj">その灯台は、夜の安全な航行のために大切だ。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">tobacco</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">たばこ</div><div class="ex"><b>Tobacco</b> is very bad for your lungs and heart.</div><div class="xj">たばこは肺や心臓にとても悪い。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">guidance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">指導；案内</div><div class="ex">With the coach&#x27;s <b>guidance</b>, our team improved a lot.</div><div class="xj">コーチの指導のおかげで、私たちのチームは大きく成長した。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">boom</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（急な）ブーム；好景気</div><div class="ex">There is a camping <b>boom</b> in Japan now.</div><div class="xj">今、日本ではキャンプのブームが起きている。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">gathering</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">集まり；集会</div><div class="ex">We had a family <b>gathering</b> at Grandma&#x27;s house.</div><div class="xj">私たちは祖母の家で家族の集まりを開いた。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">orientation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（新人向けの）説明会；方向づけ</div><div class="ex">New students must attend the <b>orientation</b> on the first day.</div><div class="xj">新入生は初日に説明会に出なければならない。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">workspace</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">作業場所；仕事場</div><div class="ex">Keep your <b>workspace</b> clean so that you can work well.</div><div class="xj">うまく作業できるように、作業場所をきれいにしておきなさい。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">mercy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">慈悲；情け</div><div class="ex">The king showed <b>mercy</b> to the poor farmer.</div><div class="xj">王はその貧しい農民に慈悲を示した。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">hardware</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">金物；（コンピューターの）ハードウェア</div><div class="ex">Dad bought some nails at the <b>hardware</b> store.</div><div class="xj">父は金物店でくぎを買った。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">repairman</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">修理工</div><div class="ex">A <b>repairman</b> came to fix our washing machine.</div><div class="xj">修理工が洗濯機を直しに来てくれた。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">waterfall</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">滝</div><div class="ex">We took pictures in front of a beautiful <b>waterfall</b>.</div><div class="xj">私たちは美しい滝の前で写真をとった。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">detector</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">探知機；感知器</div><div class="ex">The smoke <b>detector</b> in the kitchen started beeping.</div><div class="xj">台所の煙探知機が鳴り始めた。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">narrative</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">物語；話</div><div class="ex">This book is a <b>narrative</b> about a boy and his dog.</div><div class="xj">この本は、少年と犬の物語だ。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">appearance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">外見；出現</div><div class="ex">You should not judge people by their <b>appearance</b>.</div><div class="xj">人を外見で判断してはいけない。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">fisherman</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">漁師；釣り人</div><div class="ex">The <b>fisherman</b> caught a big fish this morning.</div><div class="xj">その漁師は今朝、大きな魚をとった。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">questionnaire</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">アンケート用紙；質問票</div><div class="ex">Please fill out this <b>questionnaire</b> about the school lunch.</div><div class="xj">給食についてのこのアンケート用紙に記入してください。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">procedure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">手順；手続き</div><div class="ex">Follow the <b>procedure</b> carefully when you use this machine.</div><div class="xj">この機械を使うときは、手順を注意して守りなさい。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">input</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">入力；意見</div><div class="ex">Data <b>input</b> took the whole afternoon.</div><div class="xj">データの入力に午後いっぱいかかった。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">frequency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">頻度；周波数</div><div class="ex">The <b>frequency</b> of buses increases during rush hour.</div><div class="xj">通勤時間帯は、バスの頻度が増える。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">variation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">変化；変動</div><div class="ex">There is a large <b>variation</b> in temperature between day and night.</div><div class="xj">昼と夜とで、気温に大きな変化がある。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">unsafe</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">安全でない；危険な</div><div class="ex">It is <b>unsafe</b> to swim in this river.</div><div class="xj">この川で泳ぐのは安全でない。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">stylish</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">おしゃれな；流行の</div><div class="ex">Lisa bought a <b>stylish</b> jacket at the department store.</div><div class="xj">リサはデパートでおしゃれなジャケットを買った。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">tense</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">緊張した；張りつめた</div><div class="ex">Everyone felt <b>tense</b> before the final game.</div><div class="xj">決勝戦の前、みんな緊張していた。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">moist</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">湿った；しっとりした</div><div class="ex">Keep the soil <b>moist</b> when you grow tomatoes.</div><div class="xj">トマトを育てるときは、土を湿った状態に保ちなさい。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">thoughtful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">思いやりのある；考え深い</div><div class="ex">It was <b>thoughtful</b> of you to send me a card.</div><div class="xj">カードを送ってくれるなんて、あなたは思いやりがあるね。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">prompt</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">即座の；迅速な</div><div class="ex">Thank you for your <b>prompt</b> reply to my email.</div><div c
