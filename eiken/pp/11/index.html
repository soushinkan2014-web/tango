</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第11回</h1><div class="sub">No.501〜550</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">reschedule</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～の予定を変更する</div><div class="ex">We had to <b>reschedule</b> the game because of the rain.</div><div class="xj">雨のため、私たちは試合の予定を変更しなければならなかった。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">rearrange</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を並べ替える；（予定）を変更する</div><div class="ex">We <b>rearranged</b> the desks for the group activity.</div><div class="xj">私たちはグループ活動のために机を並べ替えた。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">comedian</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">お笑い芸人；喜劇俳優</div><div class="ex">The <b>comedian</b> made everyone in the hall laugh.</div><div class="xj">そのお笑い芸人は、ホールにいた全員を笑わせた。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">hiker</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ハイキングをする人</div><div class="ex">Many <b>hikers</b> visit this mountain in autumn.</div><div class="xj">秋には多くのハイキングをする人がこの山を訪れる。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">council</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">議会；評議会</div><div class="ex">The city <b>council</b> decided to build a new library.</div><div class="xj">市議会は、新しい図書館を建てることを決めた。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">hesitation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ためらい</div><div class="ex">Ken answered the teacher&#x27;s question without <b>hesitation</b>.</div><div class="xj">ケンは先生の質問にためらいなく答えた。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">software</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ソフトウェア</div><div class="ex">You need new <b>software</b> to open this file.</div><div class="xj">このファイルを開くには、新しいソフトウェアが必要だ。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">drawback</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">欠点；不利な点</div><div class="ex">The only <b>drawback</b> of this house is its small kitchen.</div><div class="xj">この家の唯一の欠点は、台所がせまいことだ。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">snowstorm</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">吹雪</div><div class="ex">School was closed because of the <b>snowstorm</b>.</div><div class="xj">吹雪のため、学校は休校になった。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">takeout</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">持ち帰り用の料理；テイクアウト</div><div class="ex">We were tired, so we got <b>takeout</b> for dinner.</div><div class="xj">疲れていたので、夕食は持ち帰り用の料理を買ってきた。</div></button></li><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">highway</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">幹線道路；高速道路</div><div class="ex">There was a lot of traffic on the <b>highway</b> today.</div><div class="xj">今日は幹線道路がとても混んでいた。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">teamwork</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">チームワーク；協力</div><div class="ex">Good <b>teamwork</b> helped us win the relay race.</div><div class="xj">よいチームワークのおかげで、私たちはリレーで勝てた。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">agent</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">代理人；係員</div><div class="ex">The baseball player&#x27;s <b>agent</b> talked with the team.</div><div class="xj">その野球選手の代理人が、球団と話し合った。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">workforce</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">労働力；全従業員</div><div class="ex">The <b>workforce</b> in this town is getting older every year.</div><div class="xj">この町の労働力は、年々高齢化している。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">nonfiction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ノンフィクション</div><div class="ex">Emi likes reading <b>nonfiction</b> more than novels.</div><div class="xj">エミは小説よりもノンフィクションを読むのが好きだ。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">protection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">保護</div><div class="ex">Wear a hat for <b>protection</b> from the sun.</div><div class="xj">日差しから身を保護するために、帽子をかぶりなさい。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">escalator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">エスカレーター</div><div class="ex">Please hold the handrail on the <b>escalator</b>.</div><div class="xj">エスカレーターでは手すりにおつかまりください。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">administration</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">管理；行政</div><div class="ex">Mr. Brown is in charge of the <b>administration</b> of the hospital.</div><div class="xj">ブラウンさんは、その病院の管理を担当している。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">defense</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">防御；守備</div><div class="ex">The town built a high wall as a <b>defense</b> against big waves.</div><div class="xj">町は大波に対する防御として、高い壁を造った。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">cartoon</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">漫画；アニメ</div><div class="ex">Tom drew a funny <b>cartoon</b> of his dog.</div><div class="xj">トムは自分の犬のおもしろい漫画をかいた。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">ministry</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（政府の）省</div><div class="ex">The <b>ministry</b> announced a new plan for schools.</div><div class="xj">その省は、学校に関する新しい計画を発表した。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">villager</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">村人</div><div class="ex">The <b>villagers</b> welcomed us with a big dinner.</div><div class="xj">村人たちは、豪華な夕食で私たちを歓迎してくれた。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">superhero</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">スーパーヒーロー</div><div class="ex">My little brother wants to be a <b>superhero</b> like in the movies.</div><div class="xj">弟は映画に出てくるようなスーパーヒーローになりたがっている。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">dishwasher</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">食器洗い機</div><div class="ex">Please put the plates in the <b>dishwasher</b>.</div><div class="xj">お皿を食器洗い機に入れてください。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">reflection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">反射；熟考</div><div class="ex">We saw the <b>reflection</b> of the mountain in the lake.</div><div class="xj">湖に山が反射して映っているのが見えた。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">fireplace</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">暖炉</div><div class="ex">The family sat around the <b>fireplace</b> on a cold night.</div><div class="xj">寒い夜、家族は暖炉のまわりに座った。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">cleanliness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">清潔さ</div><div class="ex">This hotel is famous for its <b>cleanliness</b>.</div><div class="xj">このホテルは清潔さで有名だ。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">creation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">創造；作品</div><div class="ex">The art class focuses on the <b>creation</b> of original works.</div><div class="xj">美術の授業では、オリジナル作品の創造に力を入れている。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">humidity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">湿度；湿気</div><div class="ex">The <b>humidity</b> is very high in Japan in summer.</div><div class="xj">日本の夏は湿度がとても高い。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">urgency</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">緊急；切迫</div><div class="ex">The doctor understood the <b>urgency</b> of the situation.</div><div class="xj">医者はその状況の緊急性を理解した。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">timeline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">予定表；年表</div><div class="ex">Our group made a <b>timeline</b> for the project.</div><div class="xj">私たちのグループは、その企画の予定表を作った。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">management</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">経営；管理</div><div class="ex">Good <b>management</b> made the small shop successful.</div><div class="xj">よい経営のおかげで、その小さな店は成功した。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">unhealthy</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">健康によくない；不健康な</div><div class="ex">Eating snacks late at night is <b>unhealthy</b>.</div><div class="xj">夜遅くにおやつを食べるのは健康によくない。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">underwater</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">水中の</div><div class="ex">Lisa took beautiful <b>underwater</b> photos of fish.</div><div class="xj">リサは魚の美しい水中写真をとった。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">hopeful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">希望をもっている；有望な</div><div class="ex">Emi is <b>hopeful</b> that she will pass the test.</div><div class="xj">エミは試験に合格できるという希望をもっている。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">unfamiliar</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">よく知らない；なじみのない</div><div class="ex">This word is <b>unfamiliar</b> to most students.</div><div class="xj">この単語は、ほとんどの生徒にとってなじみのないものだ。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">meaningful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">意味のある；有意義な</div><div class="ex">Volunteering at the hospital was a <b>meaningful</b> experience.</div><div class="xj">病院でのボランティアは有意義な経験だった。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">inaccurate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不正確な</div><div class="ex">The information on that website was <b>inaccurate</b>.</div><div class="xj">そのウェブサイトの情報は不正確だった。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">cashless</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">現金を使わない；キャッシュレスの</div><div class="ex">More and more people use <b>cashless</b> payment at stores.</div><div class="xj">店で現金を使わない支払いをする人が、ますます増えている。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">differently</span><span class="ps">副</span><span class="star">★★</span></div><div class="ja">違ったふうに；異なって</div><div class="ex">Each student solved
