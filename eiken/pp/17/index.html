</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第17回</h1><div class="sub">No.801〜850</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">quote</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を引用する</div><div class="ex">Ken <b>quoted</b> a famous saying in his speech.</div><div class="xj">ケンはスピーチの中で、有名な言葉を引用した。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">insert</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を差し込む；挿入する</div><div class="ex">Please <b>insert</b> your card into the machine.</div><div class="xj">機械にカードを差し込んでください。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">convey</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を伝える；運ぶ</div><div class="ex">It is hard to <b>convey</b> your feelings in a short message.</div><div class="xj">短いメッセージで気持ちを伝えるのは難しい。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">merge</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">合併する；～を合併させる</div><div class="ex">Two local banks <b>merged</b> to form a larger one.</div><div class="xj">地元の2つの銀行が合併して、大きな銀行になった。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">notify</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に通知する；知らせる</div><div class="ex">The school will <b>notify</b> parents by email if classes are canceled.</div><div class="xj">授業が中止になる場合、学校はメールで保護者に通知する。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">diagnose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を診断する</div><div class="ex">The doctor <b>diagnosed</b> Tom&#x27;s illness as the flu.</div><div class="xj">医者はトムの病気をインフルエンザと診断した。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">interfere</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（interfere with ～で）～を妨げる；干渉する</div><div class="ex">Don&#x27;t let video games <b>interfere</b> with your studies.</div><div class="xj">テレビゲームが勉強を妨げることのないようにしなさい。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">sustain</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を維持する；支える</div><div class="ex">The town needs more tourists to <b>sustain</b> its economy.</div><div class="xj">その町は、経済を維持するために、もっと多くの観光客を必要としている。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">nationality</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">国籍</div><div class="ex">Students of many <b>nationalities</b> study at this school.</div><div class="xj">この学校では、さまざまな国籍の生徒が学んでいる。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">diversity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">多様性</div><div class="ex">Our city is proud of the <b>diversity</b> of its people.</div><div class="xj">私たちの市は、住民の多様性を誇りにしている。</div></button></li><li><button class="w" data-no="811"><div class="top"><span class="no">811</span><span class="en">setback</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">つまずき；挫折</div><div class="ex">Losing the first game was a big <b>setback</b> for our team.</div><div class="xj">初戦で負けたことは、私たちのチームにとって大きなつまずきだった。</div></button></li><li><button class="w" data-no="812"><div class="top"><span class="no">812</span><span class="en">channel</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（テレビの）チャンネル；経路</div><div class="ex">Let&#x27;s change the <b>channel</b> and watch the soccer game.</div><div class="xj">チャンネルを変えて、サッカーの試合を見よう。</div></button></li><li><button class="w" data-no="813"><div class="top"><span class="no">813</span><span class="en">housing</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">住宅；住宅供給</div><div class="ex">The city plans to build more <b>housing</b> for young families.</div><div class="xj">市は、若い家族のための住宅をもっと建てる予定だ。</div></button></li><li><button class="w" data-no="814"><div class="top"><span class="no">814</span><span class="en">resolution</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">決意；解決</div><div class="ex">My New Year&#x27;s <b>resolution</b> is to read one book every month.</div><div class="xj">私の新年の決意は、毎月1冊本を読むことだ。</div></button></li><li><button class="w" data-no="815"><div class="top"><span class="no">815</span><span class="en">sentiment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感情；意見</div><div class="ex">Lisa&#x27;s letter was full of warm <b>sentiments</b> for her old teacher.</div><div class="xj">リサの手紙は、昔の先生への温かい感情にあふれていた。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">likelihood</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">可能性；見込み</div><div class="ex">There is a high <b>likelihood</b> of rain tomorrow.</div><div class="xj">明日は雨が降る可能性が高い。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">investment</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">投資</div><div class="ex">Buying a good bike was a wise <b>investment</b> for me.</div><div class="xj">よい自転車を買ったことは、私にとって賢い投資だった。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">emphasis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">強調；重点</div><div class="ex">Our coach&#x27;s <b>emphasis</b> on teamwork made us stronger.</div><div class="xj">コーチがチームワークを強調したことで、私たちは強くなった。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">sensor</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">センサー；感知装置</div><div class="ex">The door has a <b>sensor</b>, so it opens when you come near.</div><div class="xj">そのドアにはセンサーがついているので、近づくと開く。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">initiative</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">主導権；率先</div><div class="ex">Emi took the <b>initiative</b> and started cleaning the classroom.</div><div class="xj">エミは率先して教室のそうじを始めた。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">perception</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">認識；知覚</div><div class="ex">The trip changed my <b>perception</b> of life in the countryside.</div><div class="xj">その旅行で、いなかの生活に対する私の認識が変わった。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">commitment</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">献身；約束</div><div class="ex">Thank you for your <b>commitment</b> to our volunteer group.</div><div class="xj">私たちのボランティアグループへのあなたの献身に感謝します。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">interval</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">間隔；休憩時間</div><div class="ex">The buses run at ten-minute <b>intervals</b> during the day.</div><div class="xj">日中、バスは10分間隔で運行している。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">headline</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（新聞の）見出し</div><div class="ex">I read the <b>headlines</b> in the newspaper every morning.</div><div class="xj">私は毎朝、新聞の見出しを読む。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">core</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">中心；核心</div><div class="ex">Reading is the <b>core</b> of our English lessons.</div><div class="xj">読むことが、私たちの英語の授業の中心だ。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">landfill</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ごみの埋め立て地</div><div class="ex">Most of our trash goes to a <b>landfill</b> outside the city.</div><div class="xj">私たちのごみの大部分は、市の外にあるごみの埋め立て地に運ばれる。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">bias</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">偏見；先入観</div><div class="ex">A good judge should not have any <b>bias</b>.</div><div class="xj">よい審査員は偏見を持つべきではない。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">spectacular</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">壮観な；目を見張るような</div><div class="ex">We saw a <b>spectacular</b> view from the top of the mountain.</div><div class="xj">私たちは山頂から壮観な景色を見た。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">decent</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">まともな；きちんとした</div><div class="ex">Everyone needs a <b>decent</b> place to live.</div><div class="xj">だれにでもまともな住む場所が必要だ。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">genetic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">遺伝の；遺伝子の</div><div class="ex">Doctors say that some diseases have <b>genetic</b> causes.</div><div class="xj">医者によると、遺伝が原因で起こる病気もある。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">infinite</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">無限の</div><div class="ex">As a child, I thought space was <b>infinite</b>.</div><div class="xj">子どものころ、私は宇宙は無限だと思っていた。</div></button></li><li><button class="w" data-no="832"><div class="top"><span class="no">832</span><span class="en">sympathetic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">同情的な；思いやりのある</div><div class="ex">My friends were very <b>sympathetic</b> when I broke my leg.</div><div class="xj">私が足を骨折したとき、友だちはとても同情的だった。</div></button></li><li><button class="w" data-no="833"><div class="top"><span class="no">833</span><span class="en">obsolete</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">時代遅れの；廃れた</div><div class="ex">Many people think paper maps will soon become <b>obsolete</b>.</div><div class="xj">紙の地図はまもなく時代遅れになると、多くの人が考えている。</div></button></li><li><button class="w" data-no="834"><div class="top"><span class="no">834</span><span class="en">doubtful</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">疑わしい；疑っている</div><div class="ex">It is <b>doubtful</b> that the rain will stop by noon.</div><div class="xj">正午までに雨がやむかどうかは疑わしい。</div></button></li><li><button class="w" data-no="835"><div class="top"><span class="no">835</span><span class="en">desperate</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">必死の；絶望的な</div><div class="ex">Ken made a <b>desperate</b> effort to catch the last train.</div><div class="xj">ケンは最終電車に乗るために必死の努力をした。</div></button></li><li><button class="w" data-no="836"><div class="top"><span class="no">836</span><span class="en">controversial</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">議論を呼ぶ；論争の的になる</div><div class="ex">Using smartphones in class is a <b>controversial</b> topic.</div><div class="xj">授業中にスマートフォンを使うことは、議論を呼ぶ話題だ。</div></button></li><li><button class="w" data-no="837"><div class="top"><span class="no">837</span><span class="en">hardworking</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">勤勉な；働き者の</div><div class="ex">Emi is the most <b>hardworking</b> student in our class.</div><div class="xj">エミはクラスでいちばん勤勉な生徒だ。</div></button></li><li><button class="w" data-no="838"><div class="top"><span class="no">838</span><span class="en">frightened</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">おびえた；こわがって</div><div class="ex">The little boy was <b>frightened</b> by the loud thunder.</div><div class="xj">その小さな男の子は、大きな雷の音におびえた。</div></button></li><li><button class="w" data-no="839"><div class="top"><span class="no">839</span><span class="en">tragic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">悲劇的な；痛ましい</div><div class="ex">The story has a <b>tragic</b> ending, but it is beautiful.</div><div class="xj">その物語は悲劇的な結末だが、美しい。</div></button></li><li><button class="w" data-no="840
