ass="en">take steps to ～</span></div><div class="ja">～するための対策をとる</div><div class="ex">The city is taking steps to reduce garbage.</div><div class="xj">市はごみを減らすための対策をとっている。</div></button></li><li><button class="w" data-no="熟166"><div class="top"><span class="no">熟166</span><span class="en">be in danger of ～</span></div><div class="ja">～の危険にさらされている</div><div class="ex">This kind of frog is in danger of disappearing from the island.</div><div class="xj">この種類のカエルは、その島から姿を消すおそれがある。</div></button></li><li><button class="w" data-no="熟167"><div class="top"><span class="no">熟167</span><span class="en">on a large scale</span></div><div class="ja">大規模に</div><div class="ex">Rice is grown on a large scale in this area.</div><div class="xj">この地域では米が大規模に栽培されている。</div></button></li><li><button class="w" data-no="熟168"><div class="top"><span class="no">熟168</span><span class="en">in the wild</span></div><div class="ja">野生で、自然の中で</div><div class="ex">Pandas living in the wild eat mostly bamboo.</div><div class="xj">野生のパンダは主に竹を食べる。</div></button></li><li><button class="w" data-no="熟169"><div class="top"><span class="no">熟169</span><span class="en">be made from ～</span></div><div class="ja">～から作られる（原料が形を変える）</div><div class="ex">This paper is made from used milk cartons.</div><div class="xj">この紙は使用済みの牛乳パックから作られている。</div></button></li><li><button class="w" data-no="熟170"><div class="top"><span class="no">熟170</span><span class="en">be on the rise</span></div><div class="ja">増加している</div><div class="ex">The number of people who work from home is on the rise in this city.</div><div class="xj">この町では在宅で働く人の数が増えている。</div></button></li><li><button class="w" data-no="会81"><div class="top"><span class="no">会81</span><span class="en">Good luck with ～.</span></div><div class="ja">～がんばってね。</div><div class="ex">A: I have a piano recital tomorrow.<br>B: Good luck with it!</div></button></li><li><button class="w" data-no="会82"><div class="top"><span class="no">会82</span><span class="en">I&#x27;ll keep my fingers crossed.</span></div><div class="ja">うまくいくよう祈ってるよ。</div><div class="ex">A: I&#x27;ll get my test results tomorrow.<br>B: I&#x27;ll keep my fingers crossed for you.</div></button></li><li><button class="w" data-no="会83"><div class="top"><span class="no">会83</span><span class="en">You can do it.</span></div><div class="ja">君ならできるよ。</div><div class="ex">A: I&#x27;m nervous about the speech.<br>B: Don&#x27;t worry. You can do it.</div></button></li><li><button class="w" data-no="会84"><div class="top"><span class="no">会84</span><span class="en">Have a nice weekend.</span></div><div class="ja">よい週末を。</div><div class="ex">A: See you on Monday.<br>B: Have a nice weekend.</div></button></li><li><button class="w" data-no="会85"><div class="top"><span class="no">会85</span><span class="en">See you around.</span></div><div class="ja">またね。</div><div class="ex">A: I have to go now.<br>B: OK. See you around.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j16/">← 熟語 Set 16</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟161": 5.87, "熟162": 20.41, "熟163": 35.55, "熟164": 50.47, "熟165": 65.06, "熟166": 79.94, "熟167": 96.16, "熟168": 110.29, "熟169": 124.68, "熟170": 140.26, "会81": 155.06, "会82": 170.92, "会83": 189.53, "会84": 206.47, "会85": 222.04}, "TE": {"熟161": 7.79, "熟162": 22.28, "熟163": 37.42, "熟164": 52.39, "熟165": 67.0, "熟166": 82.24, "熟167": 98.41, "熟168": 112.16, "熟169": 126.65, "熟170": 142.46, "会81": 156.93, "会82": 173.65, "会83": 191.4, "会84": 208.68, "会85": 224.15}, "Q": [["熟161", "take place", "行われる、開かれる"], ["熟162", "carry out ～", "～を実行する、行う"], ["熟163", "die out", "絶滅する、すたれる"], ["熟164", "put an end to ～", "～を終わらせる"], ["熟165", "take steps to ～", "～するための対策をとる"], ["熟166", "be in danger of ～", "～の危険にさらされている"], ["熟167", "on a large scale", "大規模に"], ["熟168", "in the wild", "野生で、自然の中で"], ["熟169", "be made fro
