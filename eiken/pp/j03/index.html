～と関係がある</div><div class="ex">Many health problems are related to lack of sleep.</div><div class="xj">多くの健康問題は睡眠不足と関係がある。</div></button></li><li><button class="w" data-no="熟26"><div class="top"><span class="no">熟26</span><span class="en">be involved in ～</span></div><div class="ja">～にかかわっている</div><div class="ex">My brother is involved in a volunteer project at the library.</div><div class="xj">兄は図書館のボランティア活動にかかわっている。</div></button></li><li><button class="w" data-no="熟27"><div class="top"><span class="no">熟27</span><span class="en">be independent of ～</span></div><div class="ja">～から独立している</div><div class="ex">She wants to be independent of her parents after college.</div><div class="xj">彼女は大学卒業後、親から独立したいと思っている。</div></button></li><li><button class="w" data-no="熟28"><div class="top"><span class="no">熟28</span><span class="en">be ashamed of ～</span></div><div class="ja">～を恥じている</div><div class="ex">He was ashamed of his rude words to his friend.</div><div class="xj">彼は友達に失礼なことを言ったのを恥じていた。</div></button></li><li><button class="w" data-no="熟29"><div class="top"><span class="no">熟29</span><span class="en">be sensitive to ～</span></div><div class="ja">～に敏感だ</div><div class="ex">My skin is sensitive to strong sunlight.</div><div class="xj">私の肌は強い日ざしに敏感だ。</div></button></li><li><button class="w" data-no="熟30"><div class="top"><span class="no">熟30</span><span class="en">be keen on ～</span></div><div class="ja">～に熱心だ、～が大好きだ</div><div class="ex">Lisa is keen on learning Japanese.</div><div class="xj">リサは日本語の勉強に熱心だ。</div></button></li><li><button class="w" data-no="会11"><div class="top"><span class="no">会11</span><span class="en">What do you recommend?</span></div><div class="ja">おすすめは何ですか？</div><div class="ex">A: What do you recommend?<br>B: The fish curry is very popular.</div></button></li><li><button class="w" data-no="会12"><div class="top"><span class="no">会12</span><span class="en">A table for two, please.</span></div><div class="ja">2人です。（店で席をたのむ）</div><div class="ex">A: Good evening. How many people?<br>B: A table for two, please.</div></button></li><li><button class="w" data-no="会13"><div class="top"><span class="no">会13</span><span class="en">Could I see the menu?</span></div><div class="ja">メニューを見せてもらえますか？</div><div class="ex">A: Could I see the menu, please?<br>B: Sure. Here you are.</div></button></li><li><button class="w" data-no="会14"><div class="top"><span class="no">会14</span><span class="en">Can I have this to go?</span></div><div class="ja">これを持ち帰りにできますか？</div><div class="ex">A: Can I have this to go?<br>B: Sure. I&#x27;ll put it in a bag.</div></button></li><li><button class="w" data-no="会15"><div class="top"><span class="no">会15</span><span class="en">Let&#x27;s split the bill.</span></div><div class="ja">割り勘にしよう。</div><div class="ex">A: That was delicious. Let&#x27;s split the bill.<br>B: OK. It&#x27;s 1,500 yen each.</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../j02/">← 熟語 Set 2</a><a href="../j04/">熟語 Set 4 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"熟21": 5.65, "熟22": 21.27, "熟23": 36.44, "熟24": 50.93, "熟25": 64.92, "熟26": 79.31, "熟27": 94.5, "熟28": 109.88, "熟29": 124.25, "熟30": 138.48, "会11": 154.27, "会12": 170.41, "会13": 191.21, "会14": 208.94, "会15": 226.69}, "TE": {"熟21": 7.86, "熟22": 23.46, "熟23": 38.69, "熟24": 52.99, "熟25": 66.91, "熟26": 81.38, "熟27": 96.76, "熟28": 112.04, "熟29": 126.36, "熟30": 140.57, "会11": 156.31, "会12": 173.32, "会13": 193.28, "会14": 211.12, "会15": 228.8}, "Q": [["熟21", "be inferior to ～", "～より劣っている"], ["熟22", "be anxious about ～", "～を心配している"], ["熟23", "be suitable for ～", "～に適している"], ["熟24", "be free from ～", "～がない"], ["熟25", "be related to ～", "～と関係がある"], ["熟26", "be involved in ～", "～にかかわっている"], ["熟27", "be independent of ～", "～から独立している"], ["熟28", "be ashamed of ～", "～を恥じている"], ["熟29", "be sensitive to ～", "～に敏感だ"], ["熟30", "be keen on ～",
