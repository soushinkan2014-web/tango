birds fly so far.</div><div class="xj">科学者たちは、鳥がどのようにしてそれほど遠くまで飛ぶのか、その秘密を明らかにした。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">enhance</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を高める；強化する</div><div class="ex">Good lighting can <b>enhance</b> the beauty of a room.</div><div class="xj">よい照明は、部屋の美しさを高めることができる。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">resume</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を再開する</div><div class="ex">We <b>resumed</b> our practice after the rain stopped.</div><div class="xj">雨がやんだあと、私たちは練習を再開した。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">relocate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">移転する；～を移転させる</div><div class="ex">Our office will <b>relocate</b> to Osaka next year.</div><div class="xj">私たちの事務所は、来年大阪に移転する。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">prescribe</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（薬）を処方する</div><div class="ex">The doctor <b>prescribed</b> some medicine for my cold.</div><div class="xj">医者は私のかぜに薬を処方した。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">distract</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（注意など）をそらす</div><div class="ex">Loud music can <b>distract</b> you from your studies.</div><div class="xj">大きな音の音楽は、勉強から注意をそらすことがある。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">burst</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">破裂する；（burst into ～で）急に～しだす</div><div class="ex">The balloon <b>burst</b> with a loud noise.</div><div class="xj">風船が大きな音を立てて破裂した。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">impose</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">（税・罰など）を課す；押しつける</div><div class="ex">The city <b>imposed</b> a new tax on plastic bags.</div><div class="xj">市はレジ袋に新しい税を課した。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">suspend</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を一時停止する；つるす</div><div class="ex">The train service was <b>suspended</b> because of the strong wind.</div><div class="xj">強風のため、電車の運転が一時停止された。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">dedicate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～をささげる；（dedicate oneself to ～で）～に専念する</div><div class="ex">Ms. White <b>dedicated</b> her life to helping children.</div><div class="xj">ホワイトさんは、子どもたちを助けることに人生をささげた。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">humanity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人類；人間らしさ</div><div class="ex">This new medicine may help all of <b>humanity</b>.</div><div class="xj">この新しい薬は、全人類の役に立つかもしれない。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">optimism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">楽観主義</div><div class="ex">Lisa&#x27;s <b>optimism</b> made everyone on the team feel better.</div><div class="xj">リサの楽観主義のおかげで、チームのみんなが元気になった。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">weakness</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">弱さ；弱点</div><div class="ex">My biggest <b>weakness</b> is that I am often late.</div><div class="xj">私のいちばんの弱点は、よく遅刻することだ。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">interpretation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">解釈；通訳</div><div class="ex">There are different <b>interpretations</b> of this poem.</div><div class="xj">この詩には、さまざまな解釈がある。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">usage</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">使用；使用量</div><div class="ex">Smartphone <b>usage</b> during the test is not allowed.</div><div class="xj">試験中のスマートフォンの使用は認められていない。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">definition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">定義；意味</div><div class="ex">Look up the <b>definition</b> of this word in the dictionary.</div><div class="xj">この単語の定義を辞書で調べなさい。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">merchandise</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（集合的に）商品</div><div class="ex">The store has a lot of new <b>merchandise</b> for summer.</div><div class="xj">その店には、夏向けの新しい商品がたくさんある。</div></button></li><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">depression</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">うつ病；不景気</div><div class="ex">Regular exercise can help people with <b>depression</b>.</div><div class="xj">定期的な運動は、うつ病の人の助けになることがある。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">brochure</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">パンフレット</div><div class="ex">I got a <b>brochure</b> about the summer camp at school.</div><div class="xj">私は学校で、サマーキャンプのパンフレットをもらった。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">fundraising</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">資金集め；募金活動</div><div class="ex">Our club held a <b>fundraising</b> event for the animal shelter.</div><div class="xj">私たちの部は、動物保護施設のために募金活動のイベントを開いた。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">removal</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">除去；撤去</div><div class="ex">The <b>removal</b> of snow from the roads took all night.</div><div class="xj">道路の雪の除去には、ひと晩かかった。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">marketing</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">マーケティング；市場活動</div><div class="ex">My cousin works in <b>marketing</b> at a toy company.</div><div class="xj">いとこはおもちゃ会社でマーケティングの仕事をしている。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">indicator</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">指標；表示器</div><div class="ex">Your heart rate is an important <b>indicator</b> of your health.</div><div class="xj">心拍数は、健康の大切な指標だ。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">bonus</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ボーナス；おまけ</div><div class="ex">My father got a summer <b>bonus</b> from his company.</div><div class="xj">父は会社から夏のボーナスをもらった。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">findings</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（調査・研究の）結果；発見</div><div class="ex">The scientists shared their <b>findings</b> at the meeting.</div><div class="xj">科学者たちは会議で研究の結果を発表した。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">label</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ラベル；表示</div><div class="ex">Read the <b>label</b> before you take this medicine.</div><div class="xj">この薬を飲む前に、ラベルを読みなさい。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">racism</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">人種差別</div><div class="ex">Our class discussed how to stop <b>racism</b> in sports.</div><div class="xj">私たちのクラスは、スポーツにおける人種差別をなくす方法を話し合った。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">allowance</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">おこづかい；手当</div><div class="ex">I get a monthly <b>allowance</b> of 3,000 yen.</div><div class="xj">私は毎月3,000円のおこづかいをもらっている。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">relaxation</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">くつろぎ；息抜き</div><div class="ex">I listen to music for <b>relaxation</b> after school.</div><div class="xj">私は放課後、くつろぎのために音楽を聞く。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">immense</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">ばく大な；巨大な</div><div class="ex">The hotel has an <b>immense</b> garden with a pond.</div><div class="xj">そのホテルには、池のある巨大な庭がある。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">irregular</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不規則な；ふぞろいの</div><div class="ex">Eating at <b>irregular</b> times is bad for your health.</div><div class="xj">不規則な時間に食事をするのは、健康に悪い。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">deadly</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">命にかかわる；致命的な</div><div class="ex">Some mushrooms in this forest are <b>deadly</b>.</div><div class="xj">この森のキノコの中には、命にかかわるものもある。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">indispensable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">不可欠な</div><div class="ex">Water is <b>indispensable</b> for all living things.</div><div class="xj">水は、すべての生き物にとって不可欠だ。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">scarce</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">乏しい；不足している</div><div class="ex">Water becomes <b>scarce</b> in this area in summer.</div><div class="xj">この地域では、夏になると水が乏しくなる。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">notable</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">注目に値する；有名な</div><div class="ex">The museum has a <b>notable</b> collection of old toys.</div><div class="xj">その博物館には、古いおもちゃの注目に値するコレクションがある。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">extensive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">広範囲にわたる；大規模な</div><div class="ex">The storm caused <b>extensive</b> damage to the farms.</div><div class="xj">その嵐は、農場に広範囲にわたる被害をもたらした。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">ethnic</span><span class="ps">形<
