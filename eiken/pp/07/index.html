</style></head><body><header><div class="brand">創心館　英検単語帳の音声</div><h1>英検準2級プラス　第7回</h1><div class="sub">No.301〜350</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">invade</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に侵入する；侵略する</div><div class="ex">Some insects <b>invaded</b> our kitchen through a small hole.</div><div class="xj">小さな穴から虫が台所に侵入した。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">eliminate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を取り除く；なくす</div><div class="ex">This new filter <b>eliminates</b> dust from the air.</div><div class="xj">この新しいフィルターは、空気中のほこりを取り除く。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">vacuum</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に掃除機をかける</div><div class="ex">Please <b>vacuum</b> the living room before the guests arrive.</div><div class="xj">お客さんが来る前に、居間に掃除機をかけてください。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">encounter</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に（偶然）出会う；直面する</div><div class="ex">We <b>encountered</b> a deer on our way up the mountain.</div><div class="xj">山を登る途中で、私たちはシカに出会った。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">acquire</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を身につける；手に入れる</div><div class="ex">Emi <b>acquired</b> good cooking skills while living abroad.</div><div class="xj">エミは海外で暮らしている間に、料理の腕を身につけた。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">accompany</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に同行する；～に伴う</div><div class="ex">Parents must <b>accompany</b> children under ten in this pool.</div><div class="xj">このプールでは、10歳未満の子どもには親が同行しなければならない。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">equip</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～に装備する；備えつける</div><div class="ex">All the classrooms are <b>equipped</b> with air conditioners.</div><div class="xj">すべての教室にエアコンが装備されている。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">evaluate</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を評価する</div><div class="ex">Teachers <b>evaluate</b> our speeches on three points.</div><div class="xj">先生たちは、私たちのスピーチを3つの点で評価する。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">conclude</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～と結論づける；～を終える</div><div class="ex">The scientists <b>concluded</b> that the water was safe to drink.</div><div class="xj">科学者たちは、その水は飲んでも安全だと結論づけた。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">reveal</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を明らかにする</div><div class="ex">The study <b>revealed</b> that sleep helps us remember things.</div><div class="xj">その研究は、睡眠が物事を覚えるのに役立つことを明らかにした。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">abandon</span><span class="ps">動</span><span class="star">★</span></div><div class="ja">～を捨てる；断念する</div><div class="ex">Some people <b>abandon</b> old bikes near the station.</div><div class="xj">駅の近くに古い自転車を捨てる人がいる。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">dialect</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">方言</div><div class="ex">My grandmother speaks the <b>dialect</b> of her hometown.</div><div class="xj">祖母は故郷の方言で話す。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">ambition</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">大きな望み；野心</div><div class="ex">Ken&#x27;s <b>ambition</b> is to become a famous chef.</div><div class="xj">ケンの大きな望みは、有名な料理人になることだ。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">livestock</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">家畜</div><div class="ex">The farmer keeps <b>livestock</b> such as cows and pigs.</div><div class="xj">その農家は、牛や豚などの家畜を飼っている。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">companion</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">仲間；連れ</div><div class="ex">Lisa&#x27;s dog is her best <b>companion</b> on long walks.</div><div class="xj">リサにとって犬は、長い散歩のいちばんの仲間だ。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">protein</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">たんぱく質</div><div class="ex">Eggs and beans are good sources of <b>protein</b>.</div><div class="xj">卵と豆は、たんぱく質をとるのによい食べ物だ。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">hardship</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">苦難；困難</div><div class="ex">My grandfather went through many <b>hardships</b> when he was young.</div><div class="xj">祖父は若いころ、多くの苦難を経験した。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">reptile</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">は虫類</div><div class="ex">Snakes and turtles are both kinds of <b>reptiles</b>.</div><div class="xj">ヘビもカメもは虫類の一種だ。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">firm</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">会社</div><div class="ex">My uncle works for a small design <b>firm</b> in the city.</div><div class="xj">おじは町の小さなデザイン会社で働いている。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">infection</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">感染；感染症</div><div class="ex">Wash your hands well to prevent <b>infection</b>.</div><div class="xj">手をよく洗って、感染を防ぎましょう。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">lifetime</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">一生；生涯</div><div class="ex">Ken hopes to visit fifty countries in his <b>lifetime</b>.</div><div class="xj">ケンは一生のうちに50か国を訪れたいと思っている。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">outfit</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">（ひとそろいの）服装</div><div class="ex">Lisa wore a cute <b>outfit</b> to the party.</div><div class="xj">リサはかわいい服装でパーティーに行った。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">capacity</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">収容能力；能力</div><div class="ex">This stadium has a <b>capacity</b> of 40,000 people.</div><div class="xj">このスタジアムには4万人の収容能力がある。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">suburb</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">郊外</div><div class="ex">Tom&#x27;s family moved to a quiet <b>suburb</b> of the city.</div><div class="xj">トムの家族は、町の静かな郊外に引っ越した。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">sympathy</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">同情；共感</div><div class="ex">We all felt <b>sympathy</b> for Ken when he missed the final game.</div><div class="xj">ケンが決勝戦に出られなかったとき、私たちはみな彼に同情した。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">organizer</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">主催者；まとめ役</div><div class="ex">The <b>organizers</b> of the event thanked all the volunteers.</div><div class="xj">イベントの主催者は、ボランティア全員にお礼を言った。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">drought</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">干ばつ</div><div class="ex">The long <b>drought</b> made it hard for farmers to grow rice.</div><div class="xj">長い干ばつのせいで、農家の人々は米を育てるのに苦労した。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">reminder</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">思い出させるもの；（予定などの）通知</div><div class="ex">This photo is a nice <b>reminder</b> of our school trip.</div><div class="xj">この写真は、修学旅行を思い出させてくれるものだ。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">possession</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">所有；（複数形で）所有物</div><div class="ex">The old painting is now in the <b>possession</b> of the city museum.</div><div class="xj">その古い絵は今、市の博物館の所有となっている。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">crisis</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">危機</div><div class="ex">The town faced a water <b>crisis</b> during the hot summer.</div><div class="xj">暑い夏の間、その町は水不足の危機に直面した。</div></button></li><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">qualification</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">資格；能力</div><div class="ex">You need a teaching <b>qualification</b> to work at this school.</div><div class="xj">この学校で働くには、教員資格が必要だ。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">tissue</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">（生物の）組織；ティッシュペーパー</div><div class="ex">The scientist studied the <b>tissue</b> of the plant&#x27;s leaves.</div><div class="xj">その科学者は、植物の葉の組織を調べた。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">reduction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">削減；減少</div><div class="ex">Our school aims for a 20 percent <b>reduction</b> in paper use.</div><div class="xj">私たちの学校は、紙の使用量の20パーセント削減を目指している。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">dozen</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">ダース；12個</div><div class="ex">Mom bought a <b>dozen</b> eggs at the supermarket.</div><div class="xj">母はスーパーで卵を1ダース買った。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">institution</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">機関；施設</div><div class="ex">Universities and hospitals are important public <b>institutions</b>.</div><div class="xj">大学や病院は大切な公共機関だ。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">rehearsal</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">リハーサル；下げいこ</div><div class="ex">We had a final <b>rehearsal</b> for the play on Friday.</div><div class="xj">私たちは金曜日に、劇の最後のリハーサルをした。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">consent</span><span class="ps">名</span><span class="star">★★</span></div><div class="ja">同意；承諾</div><div class="ex">You need your parents&#x27; <b>consent</b> to join the trip.</div><div class="xj">旅行に参加するには、親の同意が必要だ。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">destruction</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">破壊</div><div class="ex">The <b>destruction</b> of forests is a serious problem for wild animals.</div><div class="xj">森林の破壊は、野生動物にとって深刻な問題だ。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">wisdom</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">知恵；賢明さ</div><div class="ex">Older people often have a lot of <b>wisdom</b> about life.</div><div class="xj">お年寄りは、人生についての知恵をたくさん持っていることが多い。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">fertilizer</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">肥料</div><div class="ex">The farmer uses natural <b>fertilizer</b> to grow vegetables.</div><div class="xj">その農家は、野菜を育てるのに自然の肥料を使っている。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">statistics</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">統計；統計学</div><div class="ex">The <b>statistics</b> show that more people are riding bikes these days.</div><div class="xj">その統計によると、最近は自転車に乗る人が増えている。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">signature</span><span class="ps">名</span><span class="star">★</span></div><div class="ja">署名</div><div class="ex">Please write your <b>signature</b> at the bottom of the form.</div><div class="xj">用紙のいちばん下に署名をしてください。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">pessimistic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">悲観的な</div><div class="ex">Don&#x27;t be so <b>pessimistic</b>; I&#x27;m sure you&#x27;ll pass the test.</div><div class="xj">そんなに悲観的にならないで。きっと試験に受かるよ。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">aggressive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">攻撃的な；積極的な</div><div class="ex">Some dogs become <b>aggressive</b> when they are scared.</div><div class="xj">犬の中には、こわがると攻撃的になるものもいる。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">passive</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">受け身の；消極的な</div><div class="ex">Don&#x27;t be <b>passive</b> in class; ask questions when you don&#x27;t understand.</div><div class="xj">授業で受け身にならないで、わからないときは質問しなさい。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">annoyed</span><span class="ps">形</span><span class="star">★★</span></div><div class="ja">いらいらした</div><div class="ex">Ken was <b>annoyed</b> because his brother used his bike without asking.</div><div class="xj">弟が勝手に自転車を使ったので、ケンはいらいらした。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">valid</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">有効な；妥当な</div><div class="ex">This ticket is <b>valid</b> for three days.</div><div class="xj">このチケットは3日間有効だ。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">occasional</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">時折の</div><div class="ex">Tomorrow will be cloudy with <b>occasional</b> rain.</div><div class="xj">明日はくもりで、時折雨が降るでしょう。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">domestic</span><span class="ps">形</span><span class="star">★</span></div><div class="ja">国内の；家庭の</div><div class="ex">We took a <b>domestic</b> flight from Osaka to Sapporo.</div><div class="xj">私たちは大阪から札幌まで国内線の飛行機に乗った。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">whereas</span><span class="ps">接</span><span class="star">★</span></div><div class="ja">～である一方で</div><div class="ex">Ken likes sports, <b>whereas</b> his brother likes reading books.</div><div class="xj">ケンはスポーツが好きである一方で、兄は本を読むのが好きだ。</div></button></li></ol></div><div id="quiz"><p class="hint">英語を見て、意味を言おう。「答えを見る」で意味と発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../06/">← 第6回</a><a href="../08/">第8回 →</a></nav></main><footer>創心館オリジナル 英検単語帳</footer><script>window.DATA = {"T": {"301": 5.27, "302": 20.77, "303": 35.48, "304
