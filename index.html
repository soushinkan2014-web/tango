<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>英単語の音声｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
header { background: var(--red); color: #fff; padding: 14px 16px 12px; }
header .brand { font-size: 13px; opacity: .9; letter-spacing: .1em; }
header h1 { margin: 2px 0 0; font-size: 24px; }
header .sub { font-size: 13px; opacity: .95; margin-top: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
.player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
audio { width: 100%; }
.row2 { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; min-height: 46px; border: 2px solid var(--red); background: #fff; color: var(--red); border-radius: 10px; font-size: 16px; font-weight: 700; }
.btn.on { background: var(--red); color: #fff; }
.hint { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
ol.words { list-style: none; margin: 8px 0 0; padding: 0; }
.w { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; font: inherit; color: inherit; }
.w.now { border-color: var(--red); box-shadow: 0 0 0 2px var(--red) inset; }
.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.no { font-size: 13px; color: var(--sub); min-width: 2.2em; }
.en { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
.ps { font-size: 12px; border: 1px solid #999; border-radius: 4px; padding: 0 4px; color: #444; }
.star { color: var(--red); font-size: 14px; }
.ja { font-size: 16px; font-weight: 700; margin-top: 4px; }
.ex { font-family: Georgia, serif; font-size: 15px; margin-top: 6px; color: #333; }
.ex b { text-decoration: underline; }
.xj { font-size: 13px; color: var(--sub); margin-top: 2px; }
body.hide .ja, body.hide .xj { visibility: hidden; }
nav.pn { display: flex; gap: 8px; margin-top: 18px; }
nav.pn a { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; }
ul.list { list-style: none; padding: 0; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
ul.list a { display: block; padding: 14px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); }
ul.list b { display: block; font-size: 18px; } ul.list span { font-size: 12px; color: var(--sub); }
footer { text-align: center; font-size: 12px; color: var(--sub); padding: 24px 16px 32px; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #eee; --sub: #aaa; --line: #333; --bg: #121212; --card: #1d1d1d; }
  .btn, nav.pn a, ul.list a { background: #1d1d1d; } .ex { color: #ddd; } .ps { color: #ccc; }
}
</style></head><body><header><div class="brand">創心館</div><h1>英単語の音声</h1><div class="sub">単語帳のQRコードから開いてください</div></header><main><ul class="list"><li><a href="s/1/"><b>中1</b><span>SUNSHINE（開隆堂）</span></a></li><li><a href="s/2/"><b>中2</b><span>SUNSHINE（開隆堂）</span></a></li><li><a href="s/3/"><b>中3</b><span>SUNSHINE（開隆堂）</span></a></li></ul></main><footer>創心館オリジナル 中学英単語帳</footer></body></html>
