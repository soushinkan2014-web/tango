<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#E60012"><link rel="manifest" href="../../../manifest.json"><link rel="icon" href="../../../icon-192.png"><link rel="apple-touch-icon" href="../../../icon-192.png"><meta name="apple-mobile-web-app-title" content="創心館 単語"><title>上宮高校 英語 攻略テキスト 付録2 リスニング｜創心館</title><style>
:root { --red: #E60012; --ink: #1a1a1a; --sub: #666; --line: #e5e5e5; --bg: #fafafa; --card: #fff; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
header { background: var(--red); color: #fff; padding: 14px 16px 12px; }
header .brand { font-size: 13px; opacity: .9; letter-spacing: .1em; }
header h1 { margin: 2px 0 0; font-size: 24px; }
header .sub { font-size: 13px; opacity: .95; margin-top: 2px; }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
.player { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
audio { width: 100%; }
.row2 { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; min-height: 46px; border: 2px solid var(--red); background: #fff; color: var(--red); border-radius: 10px; font-size: 16px; font-weight: 700; }
.btn.on { background: var(--red); color: #fff; }
.hint { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
ol.words { list-style: none; margin: 8px 0 0; padding: 0; }
.w { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; font: inherit; color: inherit; }
.w.now { border-color: var(--red); box-shadow: 0 0 0 2px var(--red) inset; }
.top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.no { font-size: 13px; color: var(--sub); min-width: 2.2em; }
.en { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
.ps { font-size: 12px; border: 1px solid #999; border-radius: 4px; padding: 0 4px; color: #444; }
.star { color: var(--red); font-size: 14px; }
.ja { font-size: 16px; font-weight: 700; margin-top: 4px; }
.ex { font-family: Georgia, serif; font-size: 15px; margin-top: 6px; color: #333; }
.ex b { text-decoration: underline; }
.xj { font-size: 13px; color: var(--sub); margin-top: 2px; }
body.hide .ja, body.hide .xj { visibility: hidden; }
nav.pn { display: flex; gap: 8px; margin-top: 18px; }
nav.pn a { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 700; }
ul.list { list-style: none; padding: 0; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
ul.list a { display: block; padding: 14px 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); }
ul.list b { display: block; font-size: 18px; } ul.list span { font-size: 12px; color: var(--sub); }
.ek { font-size: 11px; border: 1px solid var(--sub); border-radius: 6px; padding: 0 5px; color: var(--sub); }
.tabs { display: flex; gap: 8px; margin: 12px 0 0; }
.tabs .btn { min-height: 50px; font-size: 17px; }
#quiz { display: none; } body.quiz #quiz { display: block; } body.quiz #learn, body.quiz .player { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 16px; margin-top: 12px; text-align: center; }
.card .prog { font-size: 13px; color: var(--sub); }
.card .qja { font-size: 24px; font-weight: 700; margin: 18px 0 8px; line-height: 1.4; }
.card .qen { font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: var(--red); min-height: 44px; margin: 10px 0; visibility: hidden; }
.card.open .qen { visibility: visible; }
.card .btns { display: flex; gap: 8px; margin-top: 12px; } .card .btns[hidden] { display: none; }
.card .ok { border-color: #1a7f37; color: #1a7f37; } .card .ng { border-color: var(--red); color: var(--red); }
.res h2 { font-size: 28px; margin: 6px 0; } .res ul { text-align: left; padding-left: 18px; } .res li { margin: 6px 0; }
.res .en2 { font-family: Georgia, serif; font-weight: 700; }
.last { font-size: 13px; color: var(--sub); text-align: center; margin: 8px 0 0; min-height: 1em; }
footer { text-align: center; font-size: 12px; color: var(--sub); padding: 24px 16px 32px; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #eee; --sub: #aaa; --line: #333; --bg: #121212; --card: #1d1d1d; }
  .btn, nav.pn a, ul.list a { background: #1d1d1d; } .ex { color: #ddd; } .ps { color: #ccc; }
}

.big { display:flex; gap:8px; margin-top:8px; }
.howto { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:14px; font-size:15px; line-height:1.7; }
.howto b { color: var(--red); }
</style></head><body><header><div class="brand">創心館　私立高校 志望校別 合格特訓</div><h1>付録2　リスニング</h1><div class="sub">上宮高校 英語 攻略テキスト</div></header><main><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button></div><div class="big"><button class="btn" id="back">10秒もどる</button><button class="btn" id="top">はじめから</button></div></div><div class="howto"><b>使い方</b><br>テキストの問題を見ながら聞きます。英語は本番と同じ回数だけ流れます。<br>まず「ふつう」の速さで本番のように解き、答え合わせのあとに、聞き取れなかった所を「ゆっくり」「10秒もどる」で聞き直しましょう。</div><nav class="pn"><a href="../07/">← 付録1</a><a href="../">講の一覧</a></nav></main><footer>創心館オリジナル 私立高校 志望校別 合格特訓</footer><script>
const a = document.getElementById('a');
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  a.playbackRate = +b.dataset.r;
  document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('back').onclick = () => { a.currentTime = Math.max(0, a.currentTime - 10); a.play(); };
document.getElementById('top').onclick = () => { a.currentTime = 0; a.play(); };
</script></body></html>
