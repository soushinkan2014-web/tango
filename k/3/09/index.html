</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第9回</h1><div class="sub">No.241〜270</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">joy</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">喜び</div><div class="ex">She cried with <b>joy</b> when she heard the news.</div><div class="xj">彼女はその知らせを聞いて喜びのあまり泣きました。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">marathon</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">マラソン</div><div class="ex">Lisa practices every morning for the <b>marathon</b>.</div><div class="xj">リサはマラソンに向けて毎朝練習しています。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">medical</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">医療の；医学の</div><div class="ex">He works at a <b>medical</b> center.</div><div class="xj">彼は医療センターで働いています。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">view</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">見方；意見</div><div class="ex">Your <b>view</b> is different from mine.</div><div class="xj">あなたの見方は私のとはちがいます。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">Spain</span><span class="ps">名</span></div><div class="ja">スペイン</div><div class="ex">Flamenco is a famous dance from <b>Spain</b>.</div><div class="xj">フラメンコはスペインの有名なおどりです。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">business</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">仕事；商売；事業</div><div class="ex">My father went to Tokyo on <b>business</b> last week.</div><div class="xj">父は先週、仕事で東京へ行きました。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">little by little</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">少しずつ</div><div class="ex">My English is getting better <b>little by little</b>.</div><div class="xj">私の英語は少しずつ上達しています。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">facility</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">施設；設備</div><div class="ex">This sports <b>facility</b> was built last year.</div><div class="xj">このスポーツ施設は去年建てられました。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">graduation</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">卒業</div><div class="ex">Our <b>graduation</b> ceremony is on March fifteenth.</div><div class="xj">私たちの卒業式は3月15日です。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">movement</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">運動；動き</div><div class="ex">The <b>movement</b> to save the forest is growing.</div><div class="xj">森を守る運動は広がっています。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">touch</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">感動させる；（心を）動かす</div><div class="ex">I was deeply <b>touched</b> by his kind words.</div><div class="xj">私は彼のやさしい言葉に深く感動しました。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">sale</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">販売；特売；セール</div><div class="ex">The <b>sale</b> of tickets starts next Monday.</div><div class="xj">チケットの販売は次の月曜日に始まります。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">value</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">価値</div><div class="ex">This old coin has great <b>value</b>.</div><div class="xj">この古い硬貨には大きな価値があります。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">wife</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">妻；奥さん</div><div class="ex">Mr. Sato and his <b>wife</b> enjoy walking in the park.</div><div class="xj">佐藤さんと奥さんは公園での散歩を楽しんでいます。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">diary</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">日記</div><div class="ex">My sister writes in her <b>diary</b> every night.</div><div class="xj">姉は毎晩日記を書いています。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">change trains</span><span class="ps">熟</span></div><div class="ja">電車を乗りかえる</div><div class="ex">You need to <b>change trains</b> at the next station.</div><div class="xj">次の駅で電車を乗りかえる必要があります。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">official</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">公式の；正式な</div><div class="ex">This is the <b>official</b> website of our city.</div><div class="xj">これは私たちの市の公式ウェブサイトです。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">order</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">順番；順序；注文</div><div class="ex">Please put these cards in <b>order</b>.</div><div class="xj">これらのカードを順番に並べてください。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">tear</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">涙</div><div class="ex">Her eyes were full of <b>tears</b> after the game.</div><div class="xj">試合のあと、彼女の目は涙でいっぱいでした。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">address</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">住所；アドレス</div><div class="ex">Please write your name and <b>address</b> here.</div><div class="xj">ここにあなたの名前と住所を書いてください。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">kill</span><span class="ps">動</span></div><div class="ja">（植物を）枯らす；殺す</div><div class="ex">Too much water can <b>kill</b> your flowers.</div><div class="xj">水のやりすぎは花を枯らすことがあります。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">kindness</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">親切；やさしさ</div><div class="ex">Thank you very much for your <b>kindness</b>.</div><div class="xj">ご親切に本当にありがとうございます。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">limited</span><span class="ps">形</span></div><div class="ja">限られた</div><div class="ex">This cake is sold for a <b>limited</b> time only.</div><div class="xj">このケーキは限られた期間だけ売られます。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">concentrate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">集中する</div><div class="ex">I can’t <b>concentrate</b> when the TV is on.</div><div class="xj">テレビがついていると集中できません。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">recycle</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（～に）作り変える；再生する</div><div class="ex">This shop <b>recycles</b> old jeans into bags.</div><div class="xj">この店は古いジーンズをかばんに作り変えています。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">far away</span><span class="ps">熟</span></div><div class="ja">遠くに；遠く離れて</div><div class="ex">My best friend lives <b>far away</b> from here now.</div><div class="xj">私の親友は今、ここから遠く離れたところに住んでいます。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">figure</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">図；人物</div><div class="ex">Please look at the <b>figure</b> on page ten.</div><div class="xj">10ページの図を見てください。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">habit</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">習慣；くせ</div><div class="ex">Reading before bed is a good <b>habit</b>.</div><div class="xj">寝る前に読書をするのはよい習慣です。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">happily</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">楽しそうに；幸せに</div><div class="ex">The children are playing <b>happily</b> in the park.</div><div class="xj">子どもたちが公園で楽しそうに遊んでいます。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">northern</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">北の；北部の</div><div class="ex">It snows a lot in <b>northern</b> Japan.</div><div class="xj">日本の北部では雪がたくさん降ります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"241": 4.38, "242": 17.83, "243": 31.3, "244": 44.12, "245": 56.95, "246": 70.25, "247": 84.48, "248": 97.59, "249": 110.9, "250": 124.71, "251": 138.33, "252": 153.19, "253": 166.81, "254": 179.55, "255": 193.57, "256": 206.9, "257": 220.94, "258": 234.68, "259": 247.65, "260": 261.02, "261": 274.26, "262": 288.55, "263": 302.0, "264": 315.37, "265": 328.73, "266": 344.26, "267": 358.57, "268": 371.92, "269": 385.12, "270": 399.2}, "TE": {"241": 6.34, "242": 19.78, "243": 33.26, "244": 46.08, "245": 58.91, "246": 72.21, "247": 86.48, "248": 99.41, "249": 112.86, "250": 126.66, "251": 140.29, "252": 155.14, "253": 168.77, "254": 181.51, "255": 195.53, "256": 209.07, "257": 222.9, "258": 236.64, "259": 249.6, "260": 262.98, "261": 276.22, "262": 290.51, "263": 303.95, "264": 317.32, "265": 330.69, "266": 346.22, "267": 360.52, "268": 373.88, "269": 387.08, "270": 401.16}, "Q": [[241, "喜び", "joy"], [242, "マラソン", "marathon"], [243, "医療の", "medical"], [244, "見方", "view"], [245, "スペイン", "Spain"], [246, "仕事", "business"], [247, "少しずつ（3語で）", "little by little"], [248, "施設", "facility"], [249, "卒業", "graduation"], [250, "運動", "movement"], [251, "感動させる", "touch"], [252, "販売", "sale"], [253, "価値", "value"], [254, "妻", "wife"], [255, "日記", "diary"], [256, "電車を乗りかえる（2語で）", "change trains"], [257, "公式の", "official"], [258, "順番", "order"], [259, "涙", "tear"], [260, "住所", "address"], [261, "（植物を）枯らす", "kill"], [262, "親切", "kindness"], [263, "限られた", "limited"], [264, "集中する", "concentrate"], [265, "（～に）作り変える", "recycle"
