</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第3回</h1><div class="sub">No.61〜90</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">several</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">いくつかの；数人の；何度か</div><div class="ex">I have visited Kyoto <b>several</b> times.</div><div class="xj">私は京都を何度か訪れたことがあります。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">kept</span><span class="ps">動</span></div><div class="ja">keep の過去・過去分詞</div><div class="ex">Ken <b>kept</b> his promise to me.</div><div class="xj">ケンは私との約束を守りました。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">all right</span><span class="ps">熟</span></div><div class="ja">大丈夫で；よろしい</div><div class="ex">A: I’m sorry I’m late.<br>B: That’s <b>all right</b>.</div><div class="xj">A：遅れてごめんなさい。B：大丈夫ですよ。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">topic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">話題；テーマ</div><div class="ex">What is the <b>topic</b> of your speech?</div><div class="xj">あなたのスピーチの話題は何ですか。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">take</span><span class="ps">動</span></div><div class="ja">（乗り物に）乗る</div><div class="ex">Let’s <b>take</b> a bus to the zoo.</div><div class="xj">動物園までバスに乗りましょう。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">reduce</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">減らす</div><div class="ex">We can <b>reduce</b> waste by using our own bags.</div><div class="xj">自分のバッグを使うことで、ごみを減らすことができます。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">enter</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">入る；入学する</div><div class="ex">Please take off your shoes before you <b>enter</b> the room.</div><div class="xj">部屋に入る前にくつをぬいでください。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">perfect</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">完ぺきな；最適な</div><div class="ex">Your English speech was <b>perfect</b>!</div><div class="xj">あなたの英語のスピーチは完ぺきでした！</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">guess</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">推測する；当てる；（～だと）思う</div><div class="ex">Can you <b>guess</b> the answer to this quiz?</div><div class="xj">このクイズの答えを推測できますか。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">throw</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">投げる</div><div class="ex">Please <b>throw</b> the ball to me.</div><div class="xj">私にボールを投げてください。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">waste</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">むだにする；浪費する</div><div class="ex">Don’t <b>waste</b> water when you brush your teeth.</div><div class="xj">歯をみがくときに水をむだにしてはいけません。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">help</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">助け；手伝い</div><div class="ex">Ken asked for my <b>help</b> with his homework.</div><div class="xj">ケンは宿題のことで私に助けを求めました。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">thanks to ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～のおかげで</div><div class="ex"><b>Thanks to</b> your help, I finished my homework.</div><div class="xj">あなたの助けのおかげで、宿題が終わりました。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">star</span><span class="ps">名</span></div><div class="ja">星；スター</div><div class="ex">We saw many <b>stars</b> from the top of the mountain.</div><div class="xj">私たちは山の頂上からたくさんの星を見ました。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">done</span><span class="ps">動</span></div><div class="ja">do の過去分詞</div><div class="ex">This job was <b>done</b> by Ken and Tom.</div><div class="xj">この仕事はケンとトムによってなされました。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">age</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">年齢</div><div class="ex">Lisa and I are the same <b>age</b>.</div><div class="xj">リサと私は同じ年齢です。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">mark</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">印；マーク</div><div class="ex">Put a <b>mark</b> next to the right answers.</div><div class="xj">正しい答えの横に印をつけてください。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">meaning</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">意味</div><div class="ex">What is the <b>meaning</b> of this word?</div><div class="xj">この単語の意味は何ですか。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">has</span><span class="ps">助</span></div><div class="ja">（has＋過去分詞で）～したことがある</div><div class="ex">Yuki <b>has</b> visited Kyoto three times.</div><div class="xj">ユキは京都を3回訪れたことがあります。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">you’ve</span><span class="ps">代</span></div><div class="ja">you have の短縮形</div><div class="ex"><b>You’ve</b> seen this movie before, right?</div><div class="xj">あなたは前にこの映画を見たことがありますよね。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">given</span><span class="ps">動</span></div><div class="ja">give の過去分詞</div><div class="ex">This prize was <b>given</b> to Emi.</div><div class="xj">この賞はエミに与えられました。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">go with ～</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">～と合う；～と一緒に行く</div><div class="ex">This bread <b>goes with</b> the soup very well.</div><div class="xj">このパンはスープにとてもよく合います。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">type</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">種類；型；タイプ</div><div class="ex">What <b>type</b> of music do you like?</div><div class="xj">あなたはどんな種類の音楽が好きですか。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">decrease</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">減る；減少する</div><div class="ex">The number of children in this town is <b>decreasing</b>.</div><div class="xj">この町の子どもの数は減ってきています。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">forgot</span><span class="ps">動</span></div><div class="ja">forget の過去形</div><div class="ex">I <b>forgot</b> Ken’s phone number.</div><div class="xj">私はケンの電話番号を忘れました。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">last</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">最後に；いちばん後に</div><div class="ex">Ken will run <b>last</b> in the class relay.</div><div class="xj">ケンはクラスリレーで最後に走ります。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">tour</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ツアー；（見学）旅行</div><div class="ex">We went on a bus <b>tour</b> of Kyoto.</div><div class="xj">私たちは京都のバスツアーに参加しました。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">eaten</span><span class="ps">動</span></div><div class="ja">eat の過去分詞</div><div class="ex">Rice is <b>eaten</b> in many countries.</div><div class="xj">米は多くの国で食べられています。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">past</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">過去</div><div class="ex">We can learn a lot from the <b>past</b>.</div><div class="xj">私たちは過去から多くのことを学ぶことができます。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">ground</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">地面；グラウンド</div><div class="ex">Snow covered the <b>ground</b> this morning.</div><div class="xj">今朝、雪が地面をおおっていました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><
