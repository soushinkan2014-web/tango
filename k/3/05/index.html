</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第5回</h1><div class="sub">No.121〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">system</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">制度；仕組み；システム</div><div class="ex">This city has a good recycling <b>system</b>.</div><div class="xj">この市にはよいリサイクルの仕組みがあります。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">around</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">約；およそ</div><div class="ex"><b>Around</b> three hundred students came to the concert.</div><div class="xj">約300人の生徒がそのコンサートに来ました。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">trash</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ごみ</div><div class="ex">Let’s pick up the <b>trash</b> on the beach.</div><div class="xj">浜辺のごみを拾いましょう。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">addition</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">追加；加わったもの</div><div class="ex">The cat is the newest <b>addition</b> to our family.</div><div class="xj">そのネコは私たちの家族に最も新しく加わったものです。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">cause</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を引き起こす；～の原因となる</div><div class="ex">The heavy rain <b>caused</b> many problems.</div><div class="xj">大雨が多くの問題を引き起こしました。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">hometown</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">故郷；ふるさと</div><div class="ex">My <b>hometown</b> is famous for its beautiful sea.</div><div class="xj">私の故郷は美しい海で有名です。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">hear of ～</span><span class="ps">熟</span></div><div class="ja">～のことを聞く；～について聞く</div><div class="ex">Have you ever <b>heard of</b> this singer?</div><div class="xj">あなたは今までにこの歌手のことを聞いたことがありますか。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">government</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">政府</div><div class="ex">The <b>government</b> made a new rule about food waste.</div><div class="xj">政府は食品ロスについて新しいルールを作りました。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">future</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">未来の；将来の</div><div class="ex">Ken talked about his <b>future</b> plans with his teacher.</div><div class="xj">ケンは先生と将来の計画について話しました。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">musician</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">音楽家；ミュージシャン</div><div class="ex">My uncle wants to be a <b>musician</b>.</div><div class="xj">私のおじは音楽家になりたがっています。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">there’s</span><span class="ps">熟</span></div><div class="ja">there is の短縮形</div><div class="ex"><b>There’s</b> a big park near my house.</div><div class="xj">私の家の近くに大きな公園があります。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">tonight</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">今夜（は）</div><div class="ex">It will be very cold <b>tonight</b>.</div><div class="xj">今夜はとても寒くなるでしょう。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">tournament</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">大会；トーナメント</div><div class="ex">Our team won the tennis <b>tournament</b>.</div><div class="xj">私たちのチームはテニスの大会で優勝しました。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">son</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">息子</div><div class="ex">Their <b>son</b> is a member of the soccer team.</div><div class="xj">彼らの息子はサッカー部の部員です。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">dark</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">暗い；（色が）濃い</div><div class="ex">It was already <b>dark</b> when I got home.</div><div class="xj">私が家に着いたときには、もう暗かったです。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">second</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">秒；ちょっとの間</div><div class="ex">This train stops here for only thirty <b>seconds</b>.</div><div class="xj">この電車はここでたった30秒しか止まりません。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">on the other hand</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">一方で；他方では</div><div class="ex">My brother likes summer; <b>on the other hand</b>, I like winter.</div><div class="xj">兄は夏が好きです。一方で、私は冬が好きです。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">chocolate</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">チョコレート</div><div class="ex">Emi gave me some <b>chocolate</b> on Valentine’s Day.</div><div class="xj">エミはバレンタインデーにチョコレートをくれました。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">expression</span><span class="ps">名</span></div><div class="ja">表現；表情</div><div class="ex">I learned a new English <b>expression</b> today.</div><div class="xj">今日、英語の新しい表現を学びました。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">south</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">南</div><div class="ex">Kagoshima is in the <b>south</b> of Kyushu.</div><div class="xj">鹿児島は九州の南にあります。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">weak</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">弱い</div><div class="ex">Our team was <b>weak</b> last year, but now it is strong.</div><div class="xj">私たちのチームは去年は弱かったけれど、今は強いです。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">baker</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">パン職人；パン屋さん</div><div class="ex">The <b>baker</b> gets up at four every morning.</div><div class="xj">そのパン職人は毎朝4時に起きます。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">life</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">命；生命</div><div class="ex">I think that every <b>life</b> is important.</div><div class="xj">私はすべての命が大切だと思います。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">behind</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～のうしろに</div><div class="ex">My house is <b>behind</b> the post office.</div><div class="xj">私の家は郵便局のうしろにあります。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">bill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">紙幣；請求書</div><div class="ex">She paid for the book with a thousand-yen <b>bill</b>.</div><div class="xj">彼女は千円札でその本の代金をはらいました。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">in addition</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">さらに；その上</div><div class="ex"><b>In addition</b>, the hotel has a large pool.</div><div class="xj">さらに、そのホテルには大きなプールがあります。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">bright</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">明るい；輝いている</div><div class="ex">This room is <b>bright</b> and warm.</div><div class="xj">この部屋は明るくて暖かいです。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">original</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">独自の；もとの；最初の</div><div class="ex">Our class made an <b>original</b> T-shirt for the festival.</div><div class="xj">私たちのクラスは文化祭のために独自のTシャツを作りました。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">notice</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">気づく</div><div class="ex">Did you <b>notice</b> the new picture on the wall?</div><div class="xj">かべの新しい絵に気づきましたか。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">magazine</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">雑誌</div><div class="ex">I bought a soccer <b>magazine</b> at the bookstore.</div><div class="xj">私は本屋でサッカーの雑誌を買いました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../04/">← 第4回</a><a href="../06/">第6回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"121": 4.24, "122": 17.55, "123": 30.99, "124": 43.63, "125": 57.74, "126": 73.17, "127": 87.13, "128": 101.58, "129": 115.01, "130": 128.86, "131": 142.2, "132": 155.54, "133": 167.87, "134": 181.18, "135": 194.12, "136": 207.31, "137": 221.59, "138": 236.78, "139": 250.16, "140": 263.5, "141": 276.41, "142": 290.23, "143": 304.08, "144": 316.98, "145": 330.35, "146": 344.22, "147": 358.28, "148": 371.66, "149": 385.65, "150": 398.25}, "TE": {"121": 6.11, "122": 19.42, "123": 32.86, "124": 45.5, "125": 59.61, "126": 75.04, "127": 89.0, "128": 103.45, "129": 116.88, "130": 130.73, "131": 144.07, "132": 157.41, "133": 169.74, "134": 183.06, "135": 195.99, "136": 209.18, "137": 223.63, "138": 238.65, "139": 252.04, "140": 265.38, "141": 278.28, "142": 292.1, "143": 305.95, "144": 318.86, "145": 332.22, "146": 346.09, "147": 360.15, "148": 373.54, "149": 387.52, "150": 400.12}, "Q": [[121, "制度", "system"], [122, "約", "around"], [123, "ごみ", "trash"], [124, "追加", "addition"], [125, "～を引き起こす", "cause"], [126, "故郷", "hometown"], [127, "～のことを聞く（2語で）", "hear of"], [128, "政府", "government"], [129, "未来の", "future"], [130, "音楽家", "musician"], [131, "there is の短縮形", "there’s"], [132, "今夜（は）", "tonight"], [133, "大会", "tournament"], [134, "息子", "son"], [135, "暗い", "dark"], [136, "秒", "second"], [137, "一方で（4語で）", "on the other hand"], [138, "チョコレート", "chocolate"], [139, "表現", "ex
