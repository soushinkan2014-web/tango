</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第11回</h1><div class="sub">No.301〜330</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">deep</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">深く</div><div class="ex">The roots of this tree go <b>deep</b> into the ground.</div><div class="xj">この木の根は地面の深くまで伸びています。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">wake up</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">目を覚ます；起きる</div><div class="ex">I <b>wake up</b> at six every morning.</div><div class="xj">私は毎朝6時に目を覚まします。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">huge</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">巨大な；ばく大な</div><div class="ex">There is a <b>huge</b> tree in the park.</div><div class="xj">公園に巨大な木があります。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">knife</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ナイフ；包丁</div><div class="ex">Be careful when you use a <b>knife</b>.</div><div class="xj">ナイフを使うときは気をつけなさい。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">pardon</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">（Pardon? で）もう一度言ってください；許し</div><div class="ex">A: I’m from Brazil.<br>B: <b>Pardon</b>?</div><div class="xj">A：私はブラジル出身です。B：もう一度言ってください。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">position</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">ポジション；位置；立場</div><div class="ex">What <b>position</b> do you play on the team?</div><div class="xj">あなたはチームでどのポジションですか。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">strict</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">厳しい</div><div class="ex">Our coach is very <b>strict</b>.</div><div class="xj">私たちのコーチはとても厳しいです。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">stick</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">棒；枝；スティック</div><div class="ex">The boy is drawing a picture in the sand with a <b>stick</b>.</div><div class="xj">その男の子は棒で砂に絵をかいています。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">itself</span><span class="ps">代</span></div><div class="ja">それ自身；それ自体</div><div class="ex">The house <b>itself</b> is old, but the kitchen is new.</div><div class="xj">家自体は古いですが、台所は新しいです。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">kilogram</span><span class="ps">名</span></div><div class="ja">キログラム</div><div class="ex">I bought five <b>kilograms</b> of rice.</div><div class="xj">私は米を5キログラム買いました。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">belong to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～に所属している；～のものである</div><div class="ex">I <b>belong to</b> the tennis team.</div><div class="xj">私はテニス部に所属しています。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">neck</span><span class="ps">名</span></div><div class="ja">首</div><div class="ex">Emi put a warm scarf around her <b>neck</b>.</div><div class="xj">エミは首に暖かいマフラーを巻きました。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">stomach</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">胃；おなか</div><div class="ex">I ate too much, and now my <b>stomach</b> hurts.</div><div class="xj">食べすぎて、今おなかが痛いです。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">valuable</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">貴重な；高価な</div><div class="ex">This old map is very <b>valuable</b>.</div><div class="xj">この古い地図はとても貴重です。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">award</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">賞</div><div class="ex">Emi won an <b>award</b> for her painting.</div><div class="xj">エミは自分の絵で賞をとりました。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">relay</span><span class="ps">動</span></div><div class="ja">（伝言などを）伝える；中継する</div><div class="ex">Please <b>relay</b> this message to Ms. Tanaka.</div><div class="xj">このメッセージを田中さんに伝えてください。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">blog</span><span class="ps">名</span></div><div class="ja">ブログ</div><div class="ex">My cousin writes a <b>blog</b> about cooking.</div><div class="xj">私のいとこは料理についてのブログを書いています。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">cage</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（鳥などの）かご；おり</div><div class="ex">The bird is singing in the <b>cage</b>.</div><div class="xj">鳥がかごの中で鳴いています。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">florist</span><span class="ps">名</span></div><div class="ja">花屋；花屋さん</div><div class="ex">I bought some roses from the <b>florist</b> near the station.</div><div class="xj">私は駅の近くの花屋でバラを買いました。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">nursing home</span><span class="ps">熟</span></div><div class="ja">老人ホーム</div><div class="ex">We visited a <b>nursing home</b> and sang songs together.</div><div class="xj">私たちは老人ホームを訪れて、いっしょに歌を歌いました。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">lawyer</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">弁護士</div><div class="ex">Her father is a <b>lawyer</b> in Osaka.</div><div class="xj">彼女のお父さんは大阪で弁護士をしています。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">lazy</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">怠けた；怠け者の</div><div class="ex">My dog is <b>lazy</b> and sleeps all day.</div><div class="xj">私の犬は怠け者で、一日中寝ています。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">shoot</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（写真・映画を）撮る</div><div class="ex">We <b>shot</b> a short film for the school festival.</div><div class="xj">私たちは文化祭のために短い映画を撮りました。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">male</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">おすの；男性の</div><div class="ex"><b>Male</b> lions have long hair around their necks.</div><div class="xj">おすのライオンは首の周りに長い毛があります。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">perhaps</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">たぶん；もしかすると</div><div class="ex"><b>Perhaps</b> Ken is still at the library now.</div><div class="xj">たぶんケンは今もまだ図書館にいるでしょう。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">silent</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">静かな；無言の</div><div class="ex">The classroom was <b>silent</b> during the test.</div><div class="xj">テストの間、教室は静かでした。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">unfortunately</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">残念ながら；不運にも</div><div class="ex"><b>Unfortunately</b>, it rained on the day of the picnic.</div><div class="xj">残念ながら、ピクニックの日は雨が降りました。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">suitcase</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スーツケース</div><div class="ex">My <b>suitcase</b> is very heavy.</div><div class="xj">私のスーツケースはとても重いです。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">get along with ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～と仲よくする</div><div class="ex">Lisa <b>gets along with</b> everyone in her class.</div><div class="xj">リサはクラスのみんなと仲よくしています。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">shot</span><span class="ps">動</span></div><div class="ja">（シュートを）打った；撃った（shoot の過去形・過去分詞）</div><div class="ex">Ken <b>shot</b> the ball, and it went into the goal.</div><div class="xj">ケンがボールをシュートし、それはゴールに入りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"301": 4.55, "302": 17.7, "303": 30.99, "304": 44.35, "305": 57.33, "306": 74.56, "307": 87.39, "308": 99.8, "309": 113.35, "310": 127.8, "311": 140.75, "312": 155.58, "313": 168.63, "314": 182.36, "315": 195.67, "316": 208.29, "317": 222.93, "318": 235.76, "319": 248.77, "320": 262.95, "321": 276.86, "322": 289.63, "323": 303.69, "324": 317.53, "325": 331.23, "326": 344.98, "327": 358.51, "328": 373.48, "329": 386.44, "330": 400.31}, "TE": {"301": 6.42, "302": 19.57, "303": 32.86, "304": 46.22, "305": 59.2, "306": 76.43, "307": 89.26, "308": 101.67, "309": 115.22, "310": 129.67, "311": 142.62, "312": 157.45, "313": 170.5, "314": 184.23, "315": 197.54, "316": 210.16, "317": 224.8, "318": 237.64, "319": 250.64, "320": 264.89, "321": 278.74, "322": 291.5, "323": 305.56, "324": 319.4, "325": 333.1, "326": 346.85, "327": 360.55, "328": 375.5, "329": 388.31, "330": 402.18}, "Q": [[301, "深く", "deep"], [302, "目を覚ます（2語で）", "wake up"], [303, "巨大な", "huge"], [304, "ナイフ", "knife"], [305, "もう一度言ってください", "Pardon?"], [306, "ポジション", "position"], [307, "厳しい", "strict"], [308, "棒", "stick"], [309, "それ自身", "itself"], [310, "キログラム", "kilogram"], [311, "～に所属している（2語で）", "belong to"], [312, "首", "neck"], [313, "胃", "stomach"], [314, "貴重な", "valuable"], [315, "賞", "award"], [316, "（伝言などを）伝える", "relay"], [317, "ブログ", "blog"], [318, "（鳥などの）かご", "cage"], [319, "花屋", "florist"], [320, "老人ホーム（2語で）", "nursing home"], [321, "弁護士", "lawyer"], [322, "怠けた", "lazy"], [323, "（写真・映画を）撮る", "shoot"], [324, "おすの", "male"], [325, "たぶん", "perhaps"], [326, "静かな", "silent"], [327, "残念ながら", "unfortunate
