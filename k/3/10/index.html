</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第10回</h1><div class="sub">No.271〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">rock</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ロック（音楽）；岩</div><div class="ex">My brother likes <b>rock</b> music very much.</div><div class="xj">兄はロック音楽が大好きです。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">suggest</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">提案する</div><div class="ex">Ken <b>suggested</b> a new idea at the meeting.</div><div class="xj">ケンは会議で新しいアイデアを提案しました。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">sign</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">しるし；兆し</div><div class="ex">Cherry blossoms are a <b>sign</b> of spring.</div><div class="xj">桜の花は春が来たしるしです。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">tent</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">テント</div><div class="ex">We slept in a <b>tent</b> at the camp.</div><div class="xj">私たちはキャンプでテントの中で寝ました。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">all the time</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">いつも；その間ずっと</div><div class="ex">My little brother plays games <b>all the time</b>.</div><div class="xj">弟はいつもゲームをしています。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">base</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">土台；基礎；基地</div><div class="ex">The <b>base</b> of this tower is very wide.</div><div class="xj">このタワーの土台はとても広いです。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">dentist</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">歯科医；歯医者</div><div class="ex">I went to the <b>dentist</b> last week.</div><div class="xj">私は先週歯医者に行きました。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">powerful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">力強い；強力な</div><div class="ex">The singer has a <b>powerful</b> voice.</div><div class="xj">その歌手は力強い声をしています。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">pray</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">祈る</div><div class="ex">We <b>pray</b> at the shrine.</div><div class="xj">私たちは神社で祈ります。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">set</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">置く；設置する</div><div class="ex">We <b>set</b> the chairs along the wall.</div><div class="xj">私たちは壁に沿っていすを置きました。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">quality</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">質；品質</div><div class="ex">This shop sells vegetables of high <b>quality</b>.</div><div class="xj">この店は品質の高い野菜を売っています。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">roof</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">屋根</div><div class="ex">The <b>roof</b> of my house is red.</div><div class="xj">私の家の屋根は赤いです。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">user</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">利用者；使用者</div><div class="ex">This library has many young <b>users</b>.</div><div class="xj">この図書館には若い利用者がたくさんいます。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">food waste</span><span class="ps">熟</span></div><div class="ja">食品ロス；食べ物のむだ</div><div class="ex">Let’s think about <b>food waste</b> in our town.</div><div class="xj">私たちの町の食品ロスについて考えましょう。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">announcement</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">発表；お知らせ；アナウンス</div><div class="ex">Please listen to the <b>announcement</b> carefully.</div><div class="xj">お知らせをよく聞いてください。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">certainly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">確かに；（返事で）もちろん</div><div class="ex">This is <b>certainly</b> the best cake in town.</div><div class="xj">これは確かに町でいちばんおいしいケーキです。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">hit</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（台風などが）襲う</div><div class="ex">A big typhoon <b>hit</b> Okinawa last week.</div><div class="xj">先週、大きな台風が沖縄を襲いました。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">creative</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">創造力のある；独創的な</div><div class="ex">Your idea is very <b>creative</b>.</div><div class="xj">あなたの考えはとても独創的です。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">fight</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">戦う；けんかする</div><div class="ex">Many doctors <b>fight</b> against dangerous diseases.</div><div class="xj">多くの医者が危険な病気と戦っています。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">hide</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">隠れる；隠す</div><div class="ex">The cat <b>hid</b> under the bed.</div><div class="xj">ネコはベッドの下に隠れました。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">marry</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～と結婚する</div><div class="ex">My aunt will <b>marry</b> a man from Canada next year.</div><div class="xj">おばは来年、カナダ出身の男性と結婚します。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">it is said that ～</span><span class="ps">熟</span></div><div class="ja">～と言われている</div><div class="ex"><b>It is said that</b> this tree is five hundred years old.</div><div class="xj">この木は樹齢500年だと言われています。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">pianist</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ピアニスト</div><div class="ex">The <b>pianist</b> played a beautiful song at the concert.</div><div class="xj">そのピアニストはコンサートで美しい曲を演奏しました。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">land</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">土地；陸地</div><div class="ex">The <b>land</b> here is good for growing rice.</div><div class="xj">ここの土地は米を育てるのに向いています。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">fever</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">熱</div><div class="ex">I stayed home because I had a <b>fever</b>.</div><div class="xj">私は熱があったので家にいました。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">husband</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">夫</div><div class="ex">Her <b>husband</b> is a cook at a hotel.</div><div class="xj">彼女の夫はホテルのコックです。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">gotten</span><span class="ps">動</span></div><div class="ja">get の過去分詞</div><div class="ex">Have you ever <b>gotten</b> a letter from abroad?</div><div class="xj">あなたは今までに海外から手紙をもらったことがありますか。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">shake</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">振る；揺れる；揺らす</div><div class="ex"><b>Shake</b> the bottle well before you drink.</div><div class="xj">飲む前にびんをよく振ってください。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">shoot</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">シュートする；撃つ</div><div class="ex"><b>Shoot</b> the ball, Ken!</div><div class="xj">ケン、ボールをシュートして！</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">subway</span><span class="ps">名</span></div><div class="ja">地下鉄</div><div class="ex">Let’s take the <b>subway</b> to the museum.</div><div class="xj">博物館まで地下鉄に乗りましょう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../09/">← 第9回</a><a href="../11/">第11回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"271": 4.38, "272": 18.25, "273": 31.3, "274": 44.86, "275": 57.31, "276": 71.61, "277": 84.8, "278": 97.66, "279": 111.46, "280": 123.53, "281": 136.63, "282": 150.3, "283": 162.68, "284": 176.29, "285": 190.95, "286": 204.19, "287": 218.2, "288": 231.95, "289": 246.11, "290": 260.26, "291": 272.81, "292": 286.99, "293": 301.29, "294": 314.66, "295": 327.97, "296": 340.78, "297": 353.4, "298": 366.53, "299": 379.53, "300": 392.37}, "TE": {"271": 6.25, "272": 20.14, "273": 33.17, "274": 46.73, "275": 59.25, "276": 73.48, "277": 86.68, "278": 99.54, "279": 113.33, "280": 125.4, "281": 138.5, "282": 152.18, "283": 164.56, "284": 178.33, "285": 192.82, "286": 206.06, "287": 220.08, "288": 233.82, "289": 247.98, "290": 262.14, "291": 274.68, "292": 289.01, "293": 303.16, "294": 316.53, "295": 329.84, "296": 342.66, "297": 355.28, "298": 368.4, "299": 381.4, "300": 394.24}, "Q": [[271, "ロック（音楽）", "rock"], [272, "提案する", "suggest"], [273, "しるし", "sign"], [274, "テント", "tent"], [275, "いつも（3語で）", "all the time"], [276, "土台", "base"], [277, "歯科医", "dentist"], [278, "力強い", "powerful"], [279, "祈る", "pray"], [280, "置く", "set"], [281, "質", "quality"], [282, "屋根", "roof"], [283, "利用者", "user"], [284, "食品ロス（2語で）", "food waste"], [285, "発表", "announcement"], [286, "確かに", "certainly"], [287, "（台風などが）襲う", "hit"], [288, "創造力のある", "creative"], [289, "戦う", "fight"], [290, "隠れる", "hide"], [291, "～と結婚する", "marry"], [292, "～と言われている（4語で）", "it is said that"], [293, "ピアニスト", "pianist"], [294, "土地", "land"], [295, "熱", "fever"], [296, "夫", "husband"], [297, "get の過去分詞", "gotten"], [298, "振る", "shake"], [299, "シュートする", "shoot"], [300, "地下鉄",
