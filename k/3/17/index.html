</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第17回</h1><div class="sub">No.481〜510</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">everybody</span><span class="ps">代</span></div><div class="ja">みんな</div><div class="ex"><b>Everybody</b> who came to the party enjoyed the music.</div><div class="xj">そのパーティーに来た人はみんな音楽を楽しみました。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">hang</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を掛ける；ぶら下がる</div><div class="ex">Let’s <b>hang</b> this picture over the sofa.</div><div class="xj">この絵をソファーの上に掛けましょう。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">knock</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">ノックする；たたく</div><div class="ex">Emi <b>knocked</b> on the classroom door and went in.</div><div class="xj">エミは教室のドアをノックして中に入りました。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">mobile</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">携帯の；移動式の</div><div class="ex">Please turn off your <b>mobile</b> phone in the library.</div><div class="xj">図書館では携帯電話の電源を切ってください。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">remain</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～のままである；残る</div><div class="ex">The door <b>remained</b> open all day.</div><div class="xj">ドアは一日中開いたままでした。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">skin</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">皮膚；肌</div><div class="ex">Too much sun is bad for your <b>skin</b>.</div><div class="xj">日に当たりすぎるのは皮膚によくありません。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">who</span><span class="ps">代</span></div><div class="ja">（関係代名詞）～する（人）；～である（人）</div><div class="ex">I have a friend <b>who</b> lives in Canada.</div><div class="xj">私にはカナダに住んでいる友だちがいます。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">wing</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">翼；羽</div><div class="ex">The bird opened its <b>wings</b> and flew away.</div><div class="xj">その鳥は翼を広げて飛び去りました。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">joke</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">冗談</div><div class="ex">My uncle always tells <b>jokes</b> that make us laugh.</div><div class="xj">おじはいつも私たちを笑わせる冗談を言います。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">passport</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">パスポート</div><div class="ex">Don’t forget your <b>passport</b> when you go abroad.</div><div class="xj">海外に行くときはパスポートを忘れてはいけません。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">truth</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">真実</div><div class="ex">I wish I knew the <b>truth</b> about that old story.</div><div class="xj">あの古い話についての真実を知っていたらいいのに。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">copy</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を写す；～をコピーする</div><div class="ex">Emi <b>copied</b> the words on the board into her notebook.</div><div class="xj">エミは黒板の語をノートに写しました。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">deal</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（deal with ～で）～を処理する；～に対処する</div><div class="ex">We have to <b>deal with</b> this problem now.</div><div class="xj">私たちは今、この問題を処理しなければなりません。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">fit</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（大きさが）～に合う</div><div class="ex">The shoes I bought yesterday don’t <b>fit</b> me.</div><div class="xj">きのう買った靴は私に合いません。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">parade</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">パレード；行進</div><div class="ex">The people watching the <b>parade</b> looked very happy.</div><div class="xj">パレードを見ている人たちはとてもうれしそうでした。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">quick</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">すばやい</div><div class="ex">Cats are <b>quick</b> animals that can jump high.</div><div class="xj">ネコは高く跳ぶことができるすばやい動物です。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">salty</span><span class="ps">形</span></div><div class="ja">塩からい</div><div class="ex">The soup my father made was a little <b>salty</b>.</div><div class="xj">父が作ったスープは少し塩からかったです。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">southern</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">南の</div><div class="ex">Okinawa is in the <b>southern</b> part of Japan.</div><div class="xj">沖縄は日本の南の方にあります。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">traveler</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">旅行者</div><div class="ex">This small hotel is popular among <b>travelers</b> from all over the world.</div><div class="xj">この小さなホテルは世界中からの旅行者に人気があります。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">backpack</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">リュックサック</div><div class="ex">The boy carrying a big <b>backpack</b> is my cousin.</div><div class="xj">大きなリュックサックを背負っている男の子は私のいとこです。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">deliver</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を配達する</div><div class="ex">The man who <b>delivers</b> our newspaper gets up at three.</div><div class="xj">私たちの新聞を配達する人は3時に起きます。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">furniture</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">家具</div><div class="ex">All the <b>furniture</b> in this room is made of wood.</div><div class="xj">この部屋の家具はすべて木でできています。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">throw ～ away</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を捨てる</div><div class="ex">Don’t <b>throw away</b> the things you can still use.</div><div class="xj">まだ使えるものを捨てないで。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">memorial</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">記念碑；記念館</div><div class="ex">There is a <b>memorial</b> to a famous writer in this park.</div><div class="xj">この公園には有名な作家の記念碑があります。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">response</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">返答；反応</div><div class="ex">I sent a letter, but there was no <b>response</b>.</div><div class="xj">私は手紙を送りましたが、返答はありませんでした。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">underline</span><span class="ps">動</span></div><div class="ja">～に下線を引く；強調する</div><div class="ex">Please <b>underline</b> the important words in this story.</div><div class="xj">この物語の大切な語に下線を引いてください。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">cancer</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">がん</div><div class="ex">Many doctors study <b>cancer</b> to help people.</div><div class="xj">多くの医師は人々を助けるためにがんを研究しています。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">fat</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">脂肪</div><div class="ex">Butter has a lot of <b>fat</b> in it.</div><div class="xj">バターには脂肪がたくさんふくまれています。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">German</span><span class="ps">形名</span></div><div class="ja">ドイツの；ドイツ語</div><div class="ex">A <b>German</b> student who stayed with us taught me a song.</div><div class="xj">私たちの家に滞在したドイツの学生が私に歌を教えてくれました。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">design</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">デザイン；設計</div><div class="ex">I love the <b>design</b> of the cap made by Lisa.</div><div class="xj">私はリサが作ったぼうしのデザインが大好きです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../16/">← 第16回</a><a href="../18/">第18回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"481": 4.6, "482": 18.09, "483": 32.28, "484": 46.05, "485": 60.04, "486": 74.13, "487": 87.29, "488": 103.02, "489": 116.19, "490": 129.89, "491": 143.01, "492": 156.38, "493": 172.04, "494": 188.24, "495": 202.06, "496": 216.06, "497": 229.13, "498": 242.37, "499": 255.65, "500": 270.28, "501": 283.78, "502": 298.12, "503": 311.39, "504": 324.87, "505": 339.26, "506": 353.37, "507": 368.57, "508": 381.81, "509": 394.22, "510": 408.45}, "TE": {"481": 6.55, "482": 20.05, "483": 34.23, "484": 48.01, "485": 62.0, "486": 76.09, "487": 89.25, "488": 104.97, "489": 118.14, "490": 131.85, "491": 144.96, "492": 158.34, "493": 174.0, "494": 190.2, "495": 204.01, "496": 218.01, "497": 231.08, "498": 244.33, "499": 257.6, "500": 272.24, "501": 285.73, "502": 300.08, "503": 313.34, "504": 326.83, "505": 341.21, "506": 355.33, "507": 370.52, "508": 383.77, "509": 396.18, "510": 410.41}, "Q": [[481, "みんな", "everybody"], [482, "～を掛ける", "hang"], [483, "ノックする", "knock"], [484, "携帯の", "mobile"], [485, "～のままである", "remain"], [486, "皮膚", "skin"], [488, "翼", "wing"], [489, "冗談", "joke"], [490, "パスポート", "passport"], [491, "真実", "truth"], [492, "～を写す", "copy"], [493, "～を処理する（2語で）", "deal with"], [494, "（大きさが）～に合う", "fit"], [495, "パレード", "parade"], [496, "すばやい", "quick"], [497, "塩からい", "salty"], [498, "南の", "souther
