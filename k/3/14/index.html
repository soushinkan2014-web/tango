</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第14回</h1><div class="sub">No.391〜420</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">barrier</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">障壁；さく</div><div class="ex">Language can be a <b>barrier</b> when you travel abroad.</div><div class="xj">海外を旅行するとき、言語が障壁になることがあります。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">conclusion</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">結論</div><div class="ex">After a long talk, we reached a <b>conclusion</b>.</div><div class="xj">長い話し合いの後、私たちは結論に達しました。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">handle</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を扱う；処理する</div><div class="ex">You must <b>handle</b> these glasses with care.</div><div class="xj">これらのグラスは注意して扱わなければなりません。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">instruction</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（instructionsで）指示；説明書</div><div class="ex">Please listen to the teacher’s <b>instructions</b> carefully.</div><div class="xj">先生の指示を注意深く聞いてください。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">major</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">主要な；大きいほうの</div><div class="ex">Osaka is a <b>major</b> city in Japan.</div><div class="xj">大阪は日本の主要な都市です。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">nation</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">国家；国民</div><div class="ex">Leaders of many <b>nations</b> met to talk about peace.</div><div class="xj">多くの国家の指導者が平和について話し合うために集まりました。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">select</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を選ぶ</div><div class="ex">We <b>selected</b> three songs for the concert.</div><div class="xj">私たちはコンサートのために3曲を選びました。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">universal</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">普遍的な；万人の</div><div class="ex">A smile is a <b>universal</b> sign of kindness.</div><div class="xj">ほほえみは親切さを表す普遍的なしるしです。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">used to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">以前はよく～した；以前は～だった</div><div class="ex">We <b>used to swim</b> in this river.</div><div class="xj">私たちはこの川で以前はよく泳ぎました。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">hug</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を抱きしめる</div><div class="ex">Emi <b>hugged</b> her mother at the airport.</div><div class="xj">エミは空港で母親を抱きしめました。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">organize</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を組織する；計画する</div><div class="ex">The students <b>organized</b> a volunteer group to clean the beach.</div><div class="xj">生徒たちは海岸をそうじするボランティアグループを組織しました。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">translate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を翻訳する</div><div class="ex">Can you <b>translate</b> this letter into Japanese?</div><div class="xj">この手紙を日本語に翻訳してくれますか。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">comedian</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">お笑い芸人；喜劇俳優</div><div class="ex">The <b>comedian</b> made everyone laugh.</div><div class="xj">そのお笑い芸人はみんなを笑わせました。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">correspond</span><span class="ps">動</span><span class="ek">英2</span></div><div class="ja">対応する；一致する</div><div class="ex">Each number on the map <b>corresponds</b> to a shop on this list.</div><div class="xj">地図の各番号はこのリストの店に対応しています。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">exam</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">試験</div><div class="ex">The English <b>exam</b> will start at nine tomorrow.</div><div class="xj">英語の試験は明日9時に始まります。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">manage</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を経営する；なんとか～する</div><div class="ex">My aunt <b>manages</b> a small hotel near the sea.</div><div class="xj">おばは海の近くで小さなホテルを経営しています。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">pond</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">池</div><div class="ex">Many fish are swimming in the <b>pond</b>.</div><div class="xj">たくさんの魚が池で泳いでいます。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">single</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">たった1つの；1人用の</div><div class="ex">I did not make a <b>single</b> mistake on the test.</div><div class="xj">私はテストでたった1つのまちがいもしませんでした。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">have been to ～</span><span class="ps">熟</span></div><div class="ja">～へ行ったことがある</div><div class="ex">I <b>have been to</b> Okinawa twice.</div><div class="xj">私は沖縄に2回行ったことがあります。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">suppose</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～だと思う</div><div class="ex">I <b>suppose</b> he is still at school.</div><div class="xj">彼はまだ学校にいると思います。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">wipe</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～をふく；ぬぐう</div><div class="ex">My brother <b>wiped</b> the table with a clean cloth.</div><div class="xj">兄はきれいな布でテーブルをふきました。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">couple</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">夫婦；1組；（a couple of ～で）2，3の</div><div class="ex">A young <b>couple</b> opened a small cafe near the station.</div><div class="xj">若い夫婦が駅の近くに小さなカフェを開きました。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">double</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">2倍の；2人用の</div><div class="ex">The shop gave me <b>double</b> points on my birthday.</div><div class="xj">その店は誕生日に2倍のポイントをくれました。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">gender</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">性別；性</div><div class="ex">People of any <b>gender</b> can join our club.</div><div class="xj">どんな性別の人でも私たちのクラブに入ることができます。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">plus</span><span class="ps">前</span></div><div class="ja">～を加えて</div><div class="ex">Five <b>plus</b> three is eight.</div><div class="xj">5に3を加えると8になります。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">reporter</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">記者；レポーター</div><div class="ex">A <b>reporter</b> from the newspaper asked me some questions.</div><div class="xj">新聞の記者が私にいくつか質問をしました。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">spell</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をつづる</div><div class="ex">How do you <b>spell</b> this word?</div><div class="xj">この単語はどうつづりますか。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">within</span><span class="ps">前</span><span class="ek">準2</span></div><div class="ja">～以内に</div><div class="ex">You have to return these books <b>within</b> two weeks.</div><div class="xj">これらの本は2週間以内に返さなければなりません。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">work on ～</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">～に取り組む</div><div class="ex">Tom is <b>working on</b> his science project now.</div><div class="xj">トムは今、理科の研究課題に取り組んでいます。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">call</span><span class="ps">動</span></div><div class="ja">（call A B で）AをBと呼ぶ</div><div class="ex">We <b>call</b> our dog Momo.</div><div class="xj">私たちは犬をモモと呼んでいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"391": 4.55, "392": 18.3, "393": 31.8, "394": 46.06, "395": 61.0, "396": 75.02, "397": 89.08, "398": 102.39, "399": 116.96, "400": 131.98, "401": 145.1, "402": 160.7, "403": 174.54, "404": 188.7, "405": 203.79, "406": 216.96, "407": 232.72, "408": 245.54, "409": 259.86, "410": 273.42, "411": 286.47, "412": 300.6, "413": 314.83, "414": 328.77, "415": 342.06, "416": 354.97, "417": 369.12, "418": 381.48, "419": 395.13, "420": 408.81}, "TE": {"391": 6.42, "392": 20.17, "393": 33.68, "394": 47.93, "395": 62.88, "396": 76.89, "397": 90.95, "398": 104.31, "399": 118.83, "400": 133.85, "401": 147.02, "402": 162.57, "403": 176.41, "404": 190.71, "405": 205.66, "406": 218.83, "407": 234.6, "408": 247.41, "409": 261.73, "410": 275.34, "411": 288.34, "412": 302.47, "413": 316.7, "414": 330.64, "415": 343.93, "416": 356.84, "417": 371.0, "418": 383.35, "419": 397.0, "420": 410.68}, "Q": [[391, "障壁", "barrier"], [392, "結論", "conclusion"], [393, "～を扱う", "handle"], [394, "指示", "instructions"], [395, "主要な", "major"], [396, "国家", "nation"], [397, "～を選ぶ", "select"], [398, "普遍的な", "universal"], [399, "以前はよく～した（2語で）", "used to"], [400, "～を抱きしめる", "hug"], [401, "～を組織する", "organize"], [402, "～を翻訳する", "translate"], [403, "お笑い芸人", "comedian"], [404, "対応する", "correspond"], [405, "試験", "exam"], [406, "～を経営する", "manage"], [
