</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第6回</h1><div class="sub">No.151〜180</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">name</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">名前を言う；名前を挙げる；名づける</div><div class="ex">Can you <b>name</b> five colors in English?</div><div class="xj">英語で色の名前を5つ言えますか。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">purpose</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">目的</div><div class="ex">The <b>purpose</b> of this event is to clean the town.</div><div class="xj">この行事の目的は町をきれいにすることです。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">calligraphy</span><span class="ps">名</span></div><div class="ja">書道；書写</div><div class="ex">We have a <b>calligraphy</b> class on Fridays.</div><div class="xj">私たちは金曜日に書道の授業があります。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">dry</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">かわいた；乾燥した</div><div class="ex">The air is very <b>dry</b> in winter.</div><div class="xj">冬は空気がとても乾燥しています。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">come true</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">実現する；かなう</div><div class="ex">I hope your dream will <b>come true</b>.</div><div class="xj">あなたの夢がかなうといいですね。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">medicine</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">薬</div><div class="ex">Take this <b>medicine</b> after dinner.</div><div class="xj">夕食後にこの薬を飲んでください。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">raise</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">上げる；育てる</div><div class="ex"><b>Raise</b> your hand if you have a question.</div><div class="xj">質問があれば手を上げてください。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">over</span><span class="ps">副</span></div><div class="ja">終わって；済んで</div><div class="ex">Summer vacation is <b>over</b>, and school starts tomorrow.</div><div class="xj">夏休みが終わって、明日から学校が始まります。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">serve</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（食事などを）出す；仕える</div><div class="ex">This restaurant <b>serves</b> good curry.</div><div class="xj">このレストランはおいしいカレーを出します。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">audience</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">観客；聴衆</div><div class="ex">The <b>audience</b> enjoyed the concert very much.</div><div class="xj">観客はコンサートをとても楽しみました。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">below</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～の下に；～より下に</div><div class="ex">Write your name <b>below</b> the line.</div><div class="xj">線の下に名前を書いてください。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">Italy</span><span class="ps">名</span></div><div class="ja">イタリア</div><div class="ex">Pizza and pasta are famous foods from <b>Italy</b>.</div><div class="xj">ピザとパスタはイタリアの有名な食べ物です。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">lead</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">導く；案内する</div><div class="ex">Mr. Sato has <b>led</b> our team for ten years.</div><div class="xj">佐藤先生は10年間、私たちのチームを導いてきました。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">even if ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">たとえ～でも</div><div class="ex">I will go jogging <b>even if</b> it rains.</div><div class="xj">たとえ雨が降っても、私はジョギングに行きます。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">hold</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（会などを）開く；開催する</div><div class="ex">Our school <b>holds</b> a music festival every fall.</div><div class="xj">私たちの学校は毎年秋に音楽祭を開きます。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">shocked</span><span class="ps">形</span></div><div class="ja">ショックを受けた；ぎょっとした</div><div class="ex">I was <b>shocked</b> to hear the news.</div><div class="xj">私はその知らせを聞いてショックを受けました。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">disappear</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">消える；見えなくなる</div><div class="ex">The sun <b>disappeared</b> behind the clouds.</div><div class="xj">太陽が雲の後ろに消えました。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">east</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">東</div><div class="ex">The sun rises in the <b>east</b>.</div><div class="xj">太陽は東からのぼります。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">gesture</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">身ぶり；ジェスチャー</div><div class="ex">He used <b>gestures</b> to explain the way.</div><div class="xj">彼は身ぶりを使って道を説明しました。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">tower</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">塔；タワー</div><div class="ex">We can see the whole city from the <b>tower</b>.</div><div class="xj">そのタワーから町全体が見えます。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">wild</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">野生の</div><div class="ex">Many <b>wild</b> animals live in this forest.</div><div class="xj">この森にはたくさんの野生の動物がすんでいます。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">point</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">指さす；指し示す</div><div class="ex">The little boy <b>pointed</b> at the airplane in the sky.</div><div class="xj">その小さな男の子は空の飛行機を指さしました。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">clearly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">はっきりと；明らかに</div><div class="ex">Please speak more <b>clearly</b> in front of the class.</div><div class="xj">クラスの前ではもっとはっきりと話してください。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">as a result</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">その結果</div><div class="ex">Emi practiced hard, and <b>as a result</b> she won the contest.</div><div class="xj">エミは一生懸命練習し、その結果コンテストで優勝しました。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">daughter</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">娘</div><div class="ex">Mr. Sato has two <b>daughters</b> and one son.</div><div class="xj">佐藤さんには娘が2人と息子が1人います。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">probably</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">たぶん；おそらく</div><div class="ex">It will <b>probably</b> rain tomorrow.</div><div class="xj">明日はたぶん雨が降るでしょう。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">ton</span><span class="ps">名</span></div><div class="ja">トン（重さの単位）</div><div class="ex">This truck can carry ten <b>tons</b>.</div><div class="xj">このトラックは10トン運べます。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">women</span><span class="ps">名</span></div><div class="ja">女性たち（woman の複数形）</div><div class="ex">Three <b>women</b> are talking in the cafe.</div><div class="xj">3人の女性がカフェで話しています。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">must</span><span class="ps">助</span><span class="ek">英4</span></div><div class="ja">～にちがいない</div><div class="ex">Emi <b>must</b> be hungry after practice.</div><div class="xj">エミは練習のあとでおなかがすいているにちがいありません。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">actor</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">俳優</div><div class="ex">My cousin wants to be an <b>actor</b> in the future.</div><div class="xj">私のいとこは将来俳優になりたがっています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"151": 4.36, "152": 18.47, "153": 31.77, "154": 45.17, "155": 58.8, "156": 72.06, "157": 84.59, "158": 97.87, "159": 112.45, "160": 126.39, "161": 140.24, "162": 154.75, "163": 168.45, "164": 182.86, "165": 196.31, "166": 211.18, "167": 225.1, "168": 238.86, "169": 251.5, "170": 265.04, "171": 278.2, "172": 291.42, "173": 305.83, "174": 319.84, "175": 334.2, "176": 347.65, "177": 360.62, "178": 374.12, "179": 388.29, "180": 401.91}, "TE": {"151": 6.31, "152": 20.42, "153": 33.72, "154": 47.13, "155": 60.75, "156": 74.01, "157": 86.55, "158": 99.82, "159": 114.4, "160": 128.35, "161": 142.2, "162": 156.7, "163": 170.4, "164": 184.81, "165": 198.27, "166": 213.14, "167": 227.05, "168": 240.81, "169": 253.45, "170": 267.0, "171": 280.16, "172": 293.38, "173": 307.78, "174": 321.8, "175": 336.16, "176": 349.6, "177": 362.58, "178": 376.07, "179": 390.24, "180": 403.86}, "Q": [[151, "名前を言う", "name"], [152, "目的", "purpose"], [153, "書道", "calligraphy"], [154, "かわいた", "dry"], [155, "実現する（2語で）", "come true"], [156, "薬", "medicine"], [157, "上げる", "raise"], [158, "終わって", "over"], [159, "（食事などを）出す", "serve"], [160, "観客", "audience"], [161, "～の下に", "below"], [162, "イタリア", "Italy"], [163, "導く", "lead"], [164, "たとえ～でも（2語で）", "even if"], [165, "（会などを）開く", "hold"], [166, "ショックを受けた", "shocked"], [167, "消える", "disappear"], [168, "東", "east"], [169, "身ぶり", "gesture"], [170, "塔", "tower"], [171, "野生の", "wild"], [172, "指さす", "point"], [173, "はっきりと", "clearly"], [174, "その結果（3語で）", "as a result"], [175, "娘", "daughter"], [176, "たぶん", "probably"], [177, "トン（重さの単位）", "ton"],
