</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第8回</h1><div class="sub">No.211〜240</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">gather</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">集まる；集める</div><div class="ex">Many people <b>gathered</b> at the station to see the famous singer.</div><div class="xj">多くの人がその有名な歌手を見るために駅に集まりました。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">hair</span><span class="ps">名</span></div><div class="ja">かみの毛；毛</div><div class="ex">Dry your <b>hair</b> before you go to bed.</div><div class="xj">寝る前にかみの毛をかわかしなさい。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">insect</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">昆虫；虫</div><div class="ex">My brother likes catching <b>insects</b> in summer.</div><div class="xj">弟は夏に昆虫をつかまえるのが好きです。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">race</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">競走；レース</div><div class="ex">Ken came first in the 100-meter <b>race</b>.</div><div class="xj">ケンは100メートル競走で1位になりました。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">sleep</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">睡眠；眠り</div><div class="ex">I didn’t get enough <b>sleep</b> last night.</div><div class="xj">昨夜は十分な睡眠がとれませんでした。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">remove</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">取り除く；取り外す</div><div class="ex">We <b>removed</b> the stones from the field.</div><div class="xj">私たちは畑から石を取り除きました。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">achieve</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">達成する；成し遂げる</div><div class="ex">She worked hard to <b>achieve</b> her goal.</div><div class="xj">彼女は目標を達成するために一生けんめい努力しました。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">hmm</span><span class="ps">間</span></div><div class="ja">うーん；ふーん</div><div class="ex">A: Which do you like better?<br>B: <b>Hmm</b>, I like this one.</div><div class="xj">A：どちらのほうが好きですか。B：うーん、こっちが好きです。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">feel like ～</span><span class="ps">熟</span></div><div class="ja">～したい気がする</div><div class="ex">I <b>feel like</b> eating ice cream today.</div><div class="xj">今日はアイスクリームが食べたい気分です。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">hurt</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">傷つける；痛める；痛む</div><div class="ex">I <b>hurt</b> my leg when I was playing soccer.</div><div class="xj">サッカーをしていたとき、私は足を痛めました。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">injured</span><span class="ps">形</span></div><div class="ja">けがをした</div><div class="ex">The <b>injured</b> bird can’t fly.</div><div class="xj">そのけがをした鳥は飛べません。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">close</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">親しい；近い</div><div class="ex">Emi and I are <b>close</b> friends.</div><div class="xj">エミと私は親しい友だちです。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">musical</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ミュージカル</div><div class="ex">We watched a <b>musical</b> in Tokyo last month.</div><div class="xj">私たちは先月、東京でミュージカルを見ました。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">patient</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">患者；（形）がまん強い</div><div class="ex">The doctor is talking with a <b>patient</b>.</div><div class="xj">医者は患者と話しています。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">surprisingly</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">驚いたことに；意外にも</div><div class="ex"><b>Surprisingly</b>, my little brother won the game.</div><div class="xj">驚いたことに、弟がその試合に勝ちました。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">discussion</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">話し合い；議論</div><div class="ex">We had a <b>discussion</b> about the school trip.</div><div class="xj">私たちは修学旅行について話し合いをしました。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">exhibition</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">展示会；展覧会</div><div class="ex">We visited an art <b>exhibition</b> in Kyoto.</div><div class="xj">私たちは京都で美術展覧会を訪れました。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">lots of ～</span><span class="ps">熟</span></div><div class="ja">たくさんの～</div><div class="ex">There are <b>lots of</b> interesting books in our library.</div><div class="xj">私たちの図書館にはたくさんのおもしろい本があります。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">image</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">イメージ；印象；画像</div><div class="ex">My <b>image</b> of London changed after the trip.</div><div class="xj">旅行のあと、私のロンドンのイメージは変わりました。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">draw</span><span class="ps">動</span></div><div class="ja">引き寄せる；（水などを）引く</div><div class="ex">The festival <b>draws</b> many people to this town.</div><div class="xj">その祭りは多くの人をこの町に引き寄せます。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">wake</span><span class="ps">動</span></div><div class="ja">起こす；目を覚ます</div><div class="ex">Please don’t <b>wake</b> the baby.</div><div class="xj">赤ちゃんを起こさないでください。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">belong</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（～の）ものである；属する</div><div class="ex">This umbrella <b>belongs</b> to my father.</div><div class="xj">このかさは父のものです。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">forever</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">永遠に；いつまでも</div><div class="ex">I will remember this day <b>forever</b>.</div><div class="xj">私はこの日をいつまでも覚えているでしょう。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">hurry</span><span class="ps">動</span></div><div class="ja">急ぐ</div><div class="ex">We have to <b>hurry</b> to catch the train.</div><div class="xj">電車に間に合うように急がなければなりません。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">suffer</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">苦しむ；（suffer from で）～に苦しむ</div><div class="ex">Many animals <b>suffer</b> from the heat in summer.</div><div class="xj">多くの動物が夏の暑さに苦しんでいます。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">winner</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">勝者；受賞者</div><div class="ex">The <b>winner</b> of the contest got a big prize.</div><div class="xj">コンテストの勝者は大きな賞をもらいました。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">relax</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をくつろがせる；リラックスさせる</div><div class="ex">Soft music always <b>relaxes</b> me.</div><div class="xj">やさしい音楽はいつも私をリラックスさせてくれます。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">community center</span><span class="ps">熟</span></div><div class="ja">公民館；地域センター</div><div class="ex">We have a dance class at the <b>community center</b>.</div><div class="xj">私たちは公民館でダンス教室があります。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">control</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">コントロールする；操作する；管理する</div><div class="ex">You can <b>control</b> this robot with your phone.</div><div class="xj">このロボットは電話でコントロールできます。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">disease</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">病気</div><div class="ex">Doctors are working hard to stop this <b>disease</b>.</div><div class="xj">医師たちはこの病気を止めるために一生けんめい働いています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"211": 4.38, "212": 18.71, "213": 31.84, "214": 45.59, "215": 59.42, "216": 72.69, "217": 86.52, "218": 100.18, "219": 115.35, "220": 128.97, "221": 142.69, "222": 155.3, "223": 168.52, "224": 181.89, "225": 195.96, "226": 210.68, "227": 224.11, "228": 238.19, "229": 251.99, "230": 265.99, "231": 280.36, "232": 293.38, "233": 307.67, "234": 321.15, "235": 333.81, "236": 349.29, "237": 363.14, "238": 378.32, "239": 393.15, "240": 407.35}, "TE": {"211": 6.34, "212": 20.67, "213": 33.79, "214": 47.55, "215": 61.37, "216": 74.65, "217": 88.48, "218": 102.13, "219": 117.31, "220": 130.92, "221": 144.64, "222": 157.25, "223": 170.47, "224": 183.85, "225": 197.97, "226": 212.64, "227": 226.06, "228": 240.14, "229": 253.95, "230": 267.94, "231": 282.31, "232": 295.34, "233": 309.62, "234": 323.1, "235": 335.77, "236": 351.25, "237": 365.1, "238": 380.45, "239": 395.11, "240": 409.31}, "Q": [[211, "集まる", "gather"], [212, "かみの毛", "hair"], [213, "昆虫", "insect"], [214, "競走", "race"], [215, "睡眠", "sleep"], [216, "取り除く", "remove"], [217, "達成する", "achieve"], [218, "うーん", "hmm"], [219, "～したい気がする（2語で）", "feel like"], [220, "傷つける", "hurt"], [221, "けがをした", "injured"], [222, "親しい", "close"], [223, "ミュージカル", "musical"], [224, "患者", "patient"], [225, "驚いたことに", "surprisingly"], [226, "話し合い", "discussion"], [227, "展示会", "exhibition"], [228, "たくさんの～（2語で）", "lots of"], [229, "イメージ", "image"], [230, "引き寄せる", "draw"], [231, "起こす", "wake"], [232, "（～の）ものである", "belong"], [233, "永遠に", "forever"], [234, "急ぐ", "hurry"], [235, "
