</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第4回</h1><div class="sub">No.91〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">not only ～ but also ...</span><span class="ps">熟</span></div><div class="ja">～だけでなく…も</div><div class="ex">Ken can play <b>not only soccer but also baseball</b>.</div><div class="xj">ケンはサッカーだけでなく野球もできます。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">ice</span><span class="ps">名</span></div><div class="ja">氷</div><div class="ex">Do you want some <b>ice</b> in your juice?</div><div class="xj">ジュースに氷を入れますか。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">right</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">権利</div><div class="ex">Every child has the <b>right</b> to go to school.</div><div class="xj">すべての子どもには学校へ行く権利があります。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">adult</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">大人</div><div class="ex">Tickets for <b>adults</b> are more expensive than tickets for children.</div><div class="xj">大人用のチケットは子ども用より高いです。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">serious</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">まじめな；深刻な</div><div class="ex">Mr. Sato is a <b>serious</b> teacher, but he sometimes tells jokes.</div><div class="xj">佐藤先生はまじめな先生ですが、ときどき冗談を言います。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">side</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">側；面</div><div class="ex">Cars drive on the left <b>side</b> of the road in Japan.</div><div class="xj">日本では車は道路の左側を走ります。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">band</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">バンド；楽団</div><div class="ex">Tom plays the drums in a rock <b>band</b>.</div><div class="xj">トムはロックバンドでドラムを演奏しています。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">spread</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">広がる；広げる</div><div class="ex">The news <b>spread</b> quickly through the school.</div><div class="xj">その知らせはすぐに学校中に広がりました。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">stage</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">舞台；ステージ</div><div class="ex">Yuki sang a song on the <b>stage</b> at the festival.</div><div class="xj">ユキはお祭りの舞台で歌を歌いました。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">or</span><span class="ps">接</span></div><div class="ja">（命令文のあとで）さもないと</div><div class="ex">Hurry up, <b>or</b> you will be late for school.</div><div class="xj">急ぎなさい、さもないと学校に遅れますよ。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">instead of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～の代わりに</div><div class="ex">Let’s walk <b>instead of</b> taking the bus.</div><div class="xj">バスに乗る代わりに歩きましょう。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">effective</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">効果的な；効果のある</div><div class="ex">Walking every day is an <b>effective</b> way to stay healthy.</div><div class="xj">毎日歩くことは健康でいるための効果的な方法です。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">human</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">人間；（形）人間の</div><div class="ex"><b>Humans</b> and animals live together on the earth.</div><div class="xj">人間と動物は地球でいっしょに暮らしています。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">main</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">主な；主要な</div><div class="ex">The <b>main</b> event of the day was the relay race.</div><div class="xj">その日の主な行事はリレーでした。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">rest</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">休息；休けい</div><div class="ex">Let’s take a short <b>rest</b>.</div><div class="xj">少し休けいしましょう。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">spent</span><span class="ps">動</span></div><div class="ja">過ごした；（お金を）使った（spend の過去形・過去分詞）</div><div class="ex">We <b>spent</b> three days in Hokkaido last summer.</div><div class="xj">私たちは去年の夏、北海道で3日間過ごしました。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">connect</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">つなぐ；結びつける</div><div class="ex">This bridge <b>connects</b> the two towns.</div><div class="xj">この橋は2つの町をつないでいます。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">sure</span><span class="ps">形</span></div><div class="ja">確信して；きっと～だと思って</div><div class="ex">I’m <b>sure</b> that our team will win.</div><div class="xj">私は私たちのチームが勝つと確信しています。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">following</span><span class="ps">形</span></div><div class="ja">次の；以下の</div><div class="ex">We had a math test on the <b>following</b> day.</div><div class="xj">次の日に、私たちは数学のテストがありました。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">these days</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">最近；このごろ</div><div class="ex"><b>These days</b>, many people read books on their phones.</div><div class="xj">最近、多くの人がスマートフォンで本を読みます。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">choice</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">選択；選んだもの</div><div class="ex">You made a good <b>choice</b>.</div><div class="xj">あなたはよい選択をしましたね。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">simple</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">簡単な；単純な；質素な</div><div class="ex">The rules of this game are very <b>simple</b>.</div><div class="xj">このゲームのルールはとても簡単です。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">society</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">社会</div><div class="ex">Robots will help our <b>society</b> in many ways.</div><div class="xj">ロボットはいろいろな方法で私たちの社会を助けるでしょう。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">elderly</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">年配の；お年寄りの</div><div class="ex">Ken often helps <b>elderly</b> people in his town.</div><div class="xj">ケンはよく町の年配の人たちを手伝います。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">long</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">長く；長い間</div><div class="ex">I can’t stay <b>long</b> today.</div><div class="xj">今日は長くはいられません。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">century</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">世紀；100年</div><div class="ex">This temple was built in the eighth <b>century</b>.</div><div class="xj">この寺は8世紀に建てられました。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">opening</span><span class="ps">名</span></div><div class="ja">開店；開始；開会</div><div class="ex">Many people came to the <b>opening</b> of the new cake shop.</div><div class="xj">多くの人が新しいケーキ店の開店に来ました。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">period</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">時代；期間；（授業の）時間</div><div class="ex">We learned about the Edo <b>period</b> in class.</div><div class="xj">私たちは授業で江戸時代について学びました。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">take part in ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～に参加する</div><div class="ex">Many students <b>took part in</b> the volunteer activity.</div><div class="xj">多くの生徒がボランティア活動に参加しました。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">ceremony</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">式；儀式</div><div class="ex">The entrance <b>ceremony</b> was held in April.</div><div class="xj">入学式は4月に行われました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"91": 4.4, "92": 19.91, "93": 32.41, "94": 45.49, "95": 59.5, "96": 75.1, "97": 88.73, "98": 102.35, "99": 115.97, "100": 130.0, "101": 144.2, "102": 157.62, "103": 172.53, "104": 186.96, "105": 200.64, "106": 213.43, "107": 230.07, "108": 243.75, "109": 258.31, "110": 271.57, "111": 286.13, "112": 299.06, "113": 312.97, "114": 326.54, "115": 340.61, "116": 353.92, "117": 367.51, "118": 381.76, "119": 395.34, "120": 409.52}, "TE": {"91": 6.81, "92": 21.87, "93": 34.36, "94": 47.45, "95": 61.45, "96": 77.06, "97": 90.68, "98": 104.31, "99": 117.92, "100": 131.96, "101": 146.15, "102": 159.58, "103": 174.48, "104": 188.91, "105": 202.59, "106": 215.39, "107": 232.02, "108": 245.71, "109": 260.26, "110": 273.53, "111": 288.08, "112": 301.02, "113": 314.93, "114": 328.5, "115": 342.57, "116": 355.87, "117": 369.47, "118": 383.72, "119": 397.3, "120": 411.47}, "Q": [[91, "～だけでなく…も（5語で）", "not only but also ..."], [92, "氷", "ice"], [93, "権利", "right"], [94, "大人", "adult"], [95, "まじめな", "serious"], [96, "側", "side"], [97, "バンド", "band"], [98, "広がる", "spread"], [99, "舞台", "stage"], [100, "（命令文のあとで）さもないと", "or"], [101, "～の代わりに（2語で）", "instead of"], [102, "効果的な", "effective"], [103, "人間", "human"], [104, "主な", "main"], [105, "休息", "rest"], [106, "過ごした", "spent"], [107, "つなぐ", "connect"], [108, "確信して", "sure"], [109, "次の", "following"], [110, "最近（2語で）", "these days"], [111, "選択", "choice"], [112, "簡単な", "simple"], [113, "社会", "society"], [114, "年配の", "elderly"], [
