</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第2回</h1><div class="sub">No.31〜60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">especially</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">特に</div><div class="ex">I like fruit very much, <b>especially</b> bananas.</div><div class="xj">私は果物が大好きで、特にバナナが好きです。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">abroad</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">外国に（で）；海外に（で）</div><div class="ex">My sister wants to study <b>abroad</b> in the future.</div><div class="xj">姉は将来、外国で勉強したがっています。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">website</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ウェブサイト</div><div class="ex">You can find the information on our <b>website</b>.</div><div class="xj">その情報は私たちのウェブサイトで見つけられます。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">solve</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">解く；解決する</div><div class="ex">Can you <b>solve</b> this math problem?</div><div class="xj">この数学の問題を解けますか。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">among</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">（3つ以上）の間で；～の中で</div><div class="ex">This song is popular <b>among</b> young people.</div><div class="xj">この歌は若い人たちの間で人気があります。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">time</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">時代；（～の）ころ</div><div class="ex">In those <b>times</b>, people didn’t have cars.</div><div class="xj">その時代には、人々は車を持っていませんでした。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">according to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～によれば；～によると</div><div class="ex"><b>According to</b> Ken, the test will be easy.</div><div class="xj">ケンによると、テストは簡単だそうです。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">environment</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">環境</div><div class="ex">We must protect the natural <b>environment</b>.</div><div class="xj">私たちは自然環境を守らなければなりません。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">health</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">健康</div><div class="ex">Walking is good for your <b>health</b>.</div><div class="xj">歩くことは健康によいです。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">writing</span><span class="ps">名</span></div><div class="ja">書くこと；文字</div><div class="ex"><b>Writing</b> in English is not easy for me.</div><div class="xj">英語で書くことは私には簡単ではありません。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">presentation</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">発表；プレゼンテーション</div><div class="ex">I will give a <b>presentation</b> in English tomorrow.</div><div class="xj">私は明日、英語で発表をします。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">various</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">さまざまな</div><div class="ex">People from <b>various</b> countries live in this city.</div><div class="xj">この市にはさまざまな国から来た人々が住んでいます。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">make</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（スピーチ・まちがいなどを）する</div><div class="ex">Ken <b>made</b> a speech in English.</div><div class="xj">ケンは英語でスピーチをしました。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">brought</span><span class="ps">動</span></div><div class="ja">bring の過去・過去分詞</div><div class="ex">Emi <b>brought</b> her lunch to the park.</div><div class="xj">エミは公園にお弁当を持ってきました。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">take care of ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～の世話をする</div><div class="ex">I <b>take care of</b> my little brother after school.</div><div class="xj">私は放課後、弟の世話をします。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">collect</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">集める</div><div class="ex">Ken has <b>collected</b> stamps for three years.</div><div class="xj">ケンは3年間切手を集めています。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">explain</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">説明する</div><div class="ex">Can you <b>explain</b> this rule to me?</div><div class="xj">このルールを私に説明してくれませんか。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">memory</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">思い出；記憶</div><div class="ex">I have a lot of good <b>memories</b> of my school life.</div><div class="xj">私には学校生活のよい思い出がたくさんあります。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">opinion</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">意見</div><div class="ex">In my <b>opinion</b>, this book is better than that one.</div><div class="xj">私の意見では、この本のほうがあの本よりよいです。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">more</span><span class="ps">代</span></div><div class="ja">もっと多くのこと；それ以上</div><div class="ex">Please tell me <b>more</b> about your trip.</div><div class="xj">あなたの旅行のことをもっと話してください。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">afraid</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">こわがって；（I&#x27;m afraid ～で）残念ながら～</div><div class="ex">My little sister is <b>afraid</b> of dogs.</div><div class="xj">妹は犬をこわがっています。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">imagine</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">想像する</div><div class="ex">Can you <b>imagine</b> life without phones?</div><div class="xj">電話のない生活を想像できますか。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">understood</span><span class="ps">動</span></div><div class="ja">理解した；わかった（understand の過去形・過去分詞）</div><div class="ex">I finally <b>understood</b> the meaning of the question.</div><div class="xj">私はやっとその問題の意味がわかりました。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">agree with ～</span><span class="ps">熟</span></div><div class="ja">～に賛成する；～と同じ意見である</div><div class="ex">I <b>agree with</b> Ken’s idea.</div><div class="xj">私はケンの考えに賛成です。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">result</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">結果</div><div class="ex">I was happy with the test <b>results</b>.</div><div class="xj">私はテストの結果に満足しました。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">daily</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">毎日の；日常の</div><div class="ex">Reading is a part of my <b>daily</b> life.</div><div class="xj">読書は私の毎日の生活の一部です。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">get</span><span class="ps">動</span></div><div class="ja">（ある状態に）なる</div><div class="ex">It <b>gets</b> dark early in winter.</div><div class="xj">冬は早く暗くなります。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">China</span><span class="ps">名</span></div><div class="ja">中国</div><div class="ex">Pandas live in the mountains of <b>China</b>.</div><div class="xj">パンダは中国の山の中にすんでいます。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">along</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～に沿って</div><div class="ex">We walked <b>along</b> the river in the morning.</div><div class="xj">私たちは朝、川に沿って歩きました。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">instead</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">代わりに</div><div class="ex">There was no milk, so I drank tea <b>instead</b>.</div><div class="xj">牛乳がなかったので、代わりに紅茶を飲みました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"31": 4.26, "32": 17.98, "33": 32.4, "34": 45.38, "35": 58.36, "36": 73.41, "37": 87.73, "38": 102.7, "39": 115.52, "40": 127.87, "41": 141.16, "42": 155.54, "43": 168.64, "44": 182.34, "45": 196.16, "46": 209.88, "47": 223.05, "48": 235.5, "49": 249.16, "50": 262.64, "51": 276.56, "52": 292.82, "53": 305.59, "54": 322.14, "55": 337.4, "56": 350.05, "57": 363.72, "58": 376.51, "59": 389.11, "60": 402.11}, "TE": {"31": 6.13, "32": 19.86, "33": 34.28, "34": 47.26, "35": 60.24, "36": 75.28, "37": 89.6, "38": 104.58, "39": 117.39, "40": 129.74, "41": 143.11, "42": 157.41, "43": 170.51, "44": 184.21, "45": 198.08, "46": 211.75, "47": 224.92, "48": 237.38, "49": 251.03, "50": 264.51, "51": 278.43, "52": 294.7, "53": 307.46, "54": 324.02, "55": 339.28, "56": 351.92, "57": 365.6, "58": 378.38, "59": 390.98, "60": 403.98}, "Q": [[31, "特に", "especially"], [32, "外国に（で）", "abroad"], [33, "ウェブサイト", "website"], [34, "解く", "solve"], [35, "（3つ以上）の間で", "among"], [36, "時代", "time"], [37, "～によれば（2語で）", "according to"], [38, "環境", "environment"], [39, "健康", "health"], [40, "書くこと", "writing"], [41, "発表", "presentation"], [42, "さまざまな", "various"], [43, "（スピーチ・まちがいなどを）する", "make"], [44, "bring の過去・過去分詞", "brought"], [45, "～の世話をする（3語で）", "take care of"], [46, "集める", "collect"], [47, "説明する", "explain"], [48, "思い出", "memory"], [49, "意見", "opinion"], [50, "もっと多くのこと", "more"], [51, "こわがって", "afraid"], [52, "想像する", "imagine"], [53, "理解した", "understood"], [54, "～に賛成する（2語で）", "agree with"], [55, "結果", "result"], [56, "毎日の", "daily"], [57, "（ある状態に）なる", "get"], [58, "中国", "China"], [59, "～に沿って", "along"], [60, "代わりに
