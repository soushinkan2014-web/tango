</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第18回</h1><div class="sub">No.511〜532</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">horror</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">ホラー；恐怖</div><div class="ex">I can’t watch <b>horror</b> movies alone.</div><div class="xj">私はホラー映画を一人では見られません。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">landscape</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">景色；風景</div><div class="ex">The <b>landscape</b> we saw from the top of the mountain was beautiful.</div><div class="xj">山の頂上から見た景色は美しかったです。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">pressure</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">圧力；プレッシャー</div><div class="ex">The water <b>pressure</b> is very high deep in the sea.</div><div class="xj">海の深いところでは水の圧力がとても高いです。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">rope</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">なわ；ロープ</div><div class="ex">The children are jumping <b>rope</b> in the park.</div><div class="xj">子どもたちが公園でなわとびをしています。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">silently</span><span class="ps">副</span></div><div class="ja">静かに；だまって</div><div class="ex">The students were reading <b>silently</b> in the library.</div><div class="xj">生徒たちは図書館で静かに本を読んでいました。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">sore</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">（体が）痛い；ひりひりする</div><div class="ex">My legs are still <b>sore</b> from yesterday’s long run.</div><div class="xj">きのうたくさん走ったので、足がまだ痛いです。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">super</span><span class="ps">形</span></div><div class="ja">すばらしい；とびきりの</div><div class="ex">My uncle is a <b>super</b> cook.</div><div class="xj">おじはすばらしい料理人です。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">thirteenth</span><span class="ps">形</span></div><div class="ja">13番目の</div><div class="ex">Emi’s name is <b>thirteenth</b> on the list.</div><div class="xj">エミの名前はリストの13番目です。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">thirtieth</span><span class="ps">形</span></div><div class="ja">30番目の</div><div class="ex">Ken was the <b>thirtieth</b> visitor who came to the new museum today.</div><div class="xj">ケンは今日その新しい博物館に来た30番目の来館者でした。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">throat</span><span class="ps">名</span></div><div class="ja">のど</div><div class="ex">I drink hot tea when my <b>throat</b> hurts.</div><div class="xj">私はのどが痛いときに温かいお茶を飲みます。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">till</span><span class="ps">前</span></div><div class="ja">～まで（ずっと）</div><div class="ex">We stayed at the park <b>till</b> five o’clock.</div><div class="xj">私たちは5時まで公園にいました。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">death</span><span class="ps">名</span></div><div class="ja">死</div><div class="ex">This book is about the life and <b>death</b> of a painter.</div><div class="xj">この本はある画家の生涯と死についての話です。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">fought</span><span class="ps">動</span></div><div class="ja">戦った；けんかした（fight の過去形・過去分詞）</div><div class="ex">Our team <b>fought</b> hard in the final game.</div><div class="xj">私たちのチームは決勝戦で懸命に戦いました。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">inventor</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">発明者；発明家</div><div class="ex">Who was the <b>inventor</b> of the telephone?</div><div class="xj">電話の発明者はだれでしたか。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">lent</span><span class="ps">動</span></div><div class="ja">lend の過去・過去分詞</div><div class="ex">Yuki <b>lent</b> me her pen.</div><div class="xj">ユキは私にペンを貸してくれました。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">shut</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を閉める</div><div class="ex">Could you <b>shut</b> the door quietly?</div><div class="xj">ドアを静かに閉めていただけますか。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">skate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">スケートをする</div><div class="ex">The girl <b>skating</b> on the ice is my sister.</div><div class="xj">氷の上でスケートをしている女の子は私の妹です。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">somebody</span><span class="ps">代</span></div><div class="ja">だれか</div><div class="ex"><b>Somebody</b> ate the last cookie.</div><div class="xj">だれかが最後のクッキーを食べました。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">unfair</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">不公平な</div><div class="ex">I think this rule is <b>unfair</b> to the younger students.</div><div class="xj">この規則は年下の生徒に対して不公平だと思います。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">victim</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">犠牲者；被害者</div><div class="ex">We prayed for the <b>victims</b> of the earthquake.</div><div class="xj">私たちは地震の犠牲者のために祈りました。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">depend on ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～による；～に頼る</div><div class="ex">Our plan for tomorrow <b>depends on</b> the weather.</div><div class="xj">明日の私たちの予定は天気によります。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">wish</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（I wish ～で）～ならいいのにと思う</div><div class="ex">I <b>wish</b> I could fly like a bird.</div><div class="xj">鳥のように飛べたらいいのに。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../17/">← 第17回</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"511": 4.64, "512": 17.84, "513": 32.26, "514": 46.37, "515": 59.37, "516": 73.24, "517": 87.95, "518": 101.24, "519": 114.44, "520": 128.76, "521": 141
