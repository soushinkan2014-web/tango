</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第1回</h1><div class="sub">No.1〜30</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">been</span><span class="ps">動</span></div><div class="ja">be の過去分詞</div><div class="ex">Have you ever <b>been</b> to Okinawa?</div><div class="xj">あなたは今までに沖縄へ行ったことがありますか。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">never</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">決して～ない；一度も～ない</div><div class="ex">My sister <b>never</b> eats green peppers.</div><div class="xj">姉はピーマンを決して食べません。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">heard</span><span class="ps">動</span></div><div class="ja">hear の過去・過去分詞</div><div class="ex">I <b>heard</b> the news from Ken.</div><div class="xj">私はその知らせをケンから聞きました。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">activity</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">活動</div><div class="ex">Volunteer <b>activities</b> are popular at our school.</div><div class="xj">私たちの学校ではボランティア活動が人気です。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">lives</span><span class="ps">名</span></div><div class="ja">life の複数形</div><div class="ex">Doctors save many <b>lives</b> every day.</div><div class="xj">医師は毎日たくさんの命を救っています。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">chance</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">機会；チャンス</div><div class="ex">I had a <b>chance</b> to talk with a famous singer.</div><div class="xj">私は有名な歌手と話す機会がありました。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">have</span><span class="ps">助</span><span class="ek">英5</span></div><div class="ja">（have＋過去分詞で）～したことがある</div><div class="ex">I <b>have</b> played tennis with Tom many times.</div><div class="xj">私はトムと何度もテニスをしたことがあります。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">felt</span><span class="ps">動</span></div><div class="ja">feel の過去・過去分詞</div><div class="ex">I <b>felt</b> happy after the game.</div><div class="xj">試合のあと、私はうれしく感じました。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">not ～ but ...</span><span class="ps">熟</span></div><div class="ja">～ではなく…</div><div class="ex">Mr. Sato is <b>not a teacher but</b> a doctor.</div><div class="xj">佐藤さんは先生ではなく医者です。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">since</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～以来；～から</div><div class="ex">Yesterday was the coldest day <b>since</b> last February.</div><div class="xj">昨日は去年の2月以来いちばん寒い日でした。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">begin</span><span class="ps">動</span></div><div class="ja">始まる；始める</div><div class="ex">The summer vacation will <b>begin</b> next week.</div><div class="xj">夏休みは来週始まります。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">few</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">ほとんど～ない；少数の</div><div class="ex">Very <b>few</b> people know this song.</div><div class="xj">この歌を知っている人はほとんどいません。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">smile</span><span class="ps">動</span></div><div class="ja">ほほえむ；にっこり笑う</div><div class="ex">The baby <b>smiled</b> at me.</div><div class="xj">赤ちゃんが私にほほえみました。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">that</span><span class="ps">副</span></div><div class="ja">そんなに；それほど</div><div class="ex">The test wasn’t <b>that</b> difficult.</div><div class="xj">テストはそんなに難しくありませんでした。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">ever</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">今までに；これまでに；かつて</div><div class="ex">Have you <b>ever</b> climbed Mt. Fuji?</div><div class="xj">あなたは今までに富士山に登ったことがありますか。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">improve</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">改善する；向上させる</div><div class="ex">I want to <b>improve</b> my English.</div><div class="xj">私は英語の力を向上させたいです。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">held</span><span class="ps">動</span></div><div class="ja">hold の過去・過去分詞</div><div class="ex">Our sports day was <b>held</b> last Saturday.</div><div class="xj">体育祭は先週の土曜日に行われました。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">a few ～</span><span class="ps">熟</span></div><div class="ja">少しの～；2、3の～</div><div class="ex">I stayed in Kyoto for <b>a few</b> days.</div><div class="xj">私は京都に2、3日滞在しました。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">graph</span><span class="ps">名</span></div><div class="ja">グラフ</div><div class="ex">This <b>graph</b> shows our favorite sports.</div><div class="xj">このグラフは私たちの好きなスポーツを表しています。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">began</span><span class="ps">動</span></div><div class="ja">始まった；始めた（begin の過去形）</div><div class="ex">The concert <b>began</b> at six o’clock.</div><div class="xj">コンサートは6時に始まりました。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">necessary</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">必要な</div><div class="ex">Sleep is <b>necessary</b> for good health.</div><div class="xj">健康のためには睡眠が必要です。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">much</span><span class="ps">副</span></div><div class="ja">（比較級を強めて）ずっと</div><div class="ex">This room is <b>much</b> bigger than mine.</div><div class="xj">この部屋は私の部屋よりずっと広いです。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">introduce</span><span class="ps">動</span></div><div class="ja">紹介する；導入する</div><div class="ex">I will <b>introduce</b> my family to you.</div><div class="xj">あなたに私の家族を紹介します。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">haven’t</span><span class="ps">助</span></div><div class="ja">have not の短縮形</div><div class="ex">I <b>haven’t</b> visited Hokkaido before.</div><div class="xj">私は以前に北海道を訪れたことがありません。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">according</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">（according to ～で）～によれば</div><div class="ex"><b>According</b> to the weather report, it will rain tomorrow.</div><div class="xj">天気予報によると、明日は雨が降るそうです。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">someone</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">だれか</div><div class="ex"><b>Someone</b> left an umbrella in the classroom.</div><div class="xj">だれかが教室にかさを忘れていきました。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">at first</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">最初は；はじめは</div><div class="ex"><b>At first</b>, I didn’t like natto.</div><div class="xj">最初は、私は納豆が好きではありませんでした。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">yet</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">（否定文で）まだ；（疑問文で）もう</div><div class="ex">The bath isn’t ready <b>yet</b>.</div><div class="xj">おふろはまだ準備ができていません。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">like</span><span class="ps">前</span><span class="ek">英5</span></div><div class="ja">～のような；～のように</div><div class="ex">I want to be a doctor <b>like</b> my father.</div><div class="xj">私は父のような医者になりたいです。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">realize</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">気づく；実感する</div><div class="ex">I <b>realized</b> that Ken was right.</div><div class="xj">私はケンが正しいと気づきました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><
