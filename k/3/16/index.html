</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第16回</h1><div class="sub">No.451〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">law</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">法律</div><div class="ex">We have to follow the <b>laws</b> of this country.</div><div class="xj">私たちはこの国の法律に従わなければなりません。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">outdoor</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">屋外の</div><div class="ex">There is a big <b>outdoor</b> pool near my grandmother’s house.</div><div class="xj">祖母の家の近くに大きな屋外のプールがあります。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">beauty</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">美しさ</div><div class="ex">We were moved by the <b>beauty</b> of the mountains.</div><div class="xj">私たちは山々の美しさに感動しました。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">development</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">発達；開発</div><div class="ex">The <b>development</b> of computers has changed our lives.</div><div class="xj">コンピューターの発達は私たちの生活を変えました。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">offer</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を申し出る；提供する</div><div class="ex">Tom <b>offered</b> to carry my heavy bag.</div><div class="xj">トムは私の重いかばんを運ぶと申し出ました。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">trust</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を信頼する</div><div class="ex">Yuki is a friend I can always <b>trust</b>.</div><div class="xj">ユキは私がいつでも信頼できる友だちです。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">destroy</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を破壊する</div><div class="ex">People should not <b>destroy</b> the homes of wild animals.</div><div class="xj">人々は野生動物のすみかを破壊するべきではありません。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">restroom</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（公共の建物の）トイレ</div><div class="ex">Could you tell me where the <b>restroom</b> is?</div><div class="xj">トイレがどこにあるか教えていただけますか。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">western</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">西の；西洋の</div><div class="ex">The sun goes down in the <b>western</b> sky.</div><div class="xj">太陽は西の空に沈みます。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">bean</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">豆</div><div class="ex">Natto is a Japanese food made from <b>beans</b>.</div><div class="xj">納豆は豆から作られる日本の食べ物です。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">soil</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">土；土壌</div><div class="ex">Many vegetables grow well in this <b>soil</b>.</div><div class="xj">多くの野菜はこの土でよく育ちます。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">calendar</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">カレンダー</div><div class="ex">The <b>calendar</b> hanging on the wall has pictures of cats.</div><div class="xj">かべに掛かっているカレンダーにはネコの写真がのっています。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">gas</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">ガス；ガソリン</div><div class="ex">My mother cooks with <b>gas</b> at home.</div><div class="xj">家では母はガスで料理をします。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">hunt</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">狩りをする</div><div class="ex">People long ago <b>hunted</b> for food.</div><div class="xj">昔の人々は食べ物を求めて狩りをしました。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">which</span><span class="ps">代</span></div><div class="ja">（関係代名詞）～する（もの）；～である（もの）</div><div class="ex">This is the train <b>which</b> goes to Kyoto.</div><div class="xj">これは京都へ行く電車です。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">kick</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をける</div><div class="ex">The boy who <b>kicked</b> the ball is my brother.</div><div class="xj">そのボールをけった男の子は私の弟です。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">modern</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">現代の；近代的な</div><div class="ex">Phones are an important part of <b>modern</b> life.</div><div class="xj">電話は現代の生活の大切な一部です。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">shine</span><span class="ps">動</span></div><div class="ja">輝く；光る</div><div class="ex">The moon is <b>shining</b> over the lake tonight.</div><div class="xj">今夜は湖の上で月が輝いています。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">toward</span><span class="ps">前</span><span class="ek">準2</span></div><div class="ja">～の方へ；～に向かって</div><div class="ex">The bird flew <b>toward</b> the mountains.</div><div class="xj">その鳥は山の方へ飛んでいきました。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">brave</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">勇敢な</div><div class="ex">If I were <b>brave</b>, I would speak to the new student.</div><div class="xj">もし私が勇敢だったら、その新しい生徒に話しかけるのに。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">crane</span><span class="ps">名</span></div><div class="ja">ツル（鳥）；クレーン</div><div class="ex">The <b>cranes</b> that live in Hokkaido are beautiful.</div><div class="xj">北海道にすんでいるツルは美しいです。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">fail</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～に失敗する；（試験）に落ちる</div><div class="ex">Yuki <b>failed</b> the first time, but she did not give up.</div><div class="xj">ユキは最初は失敗しましたが、あきらめませんでした。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">manager</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">支配人；責任者</div><div class="ex">The <b>manager</b> of the hotel speaks three languages.</div><div class="xj">そのホテルの支配人は3か国語を話します。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">partner</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">パートナー；相手</div><div class="ex">Ken is the tennis <b>partner</b> I always practice with.</div><div class="xj">ケンは私がいつもいっしょに練習するテニスのパートナーです。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">no one</span><span class="ps">熟</span></div><div class="ja">だれも～ない</div><div class="ex"><b>No one</b> knew the answer.</div><div class="xj">だれもその答えを知りませんでした。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">shelter</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">避難所；保護施設</div><div class="ex">The school gym is used as a <b>shelter</b> when a big earthquake happens.</div><div class="xj">大きな地震が起きると、学校の体育館は避難所として使われます。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">sour</span><span class="ps">形</span></div><div class="ja">すっぱい</div><div class="ex">The orange I ate this morning was very <b>sour</b>.</div><div class="xj">今朝食べたオレンジはとてもすっぱかったです。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">specific</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">具体的な；特定の</div><div class="ex">Can you give me a <b>specific</b> example?</div><div class="xj">具体的な例を挙げてくれますか。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">aloud</span><span class="ps">副</span></div><div class="ja">声に出して</div><div class="ex">Ken read the letter <b>aloud</b> to his grandfather.</div><div class="xj">ケンは祖父にその手紙を声に出して読みました。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">cancel</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を中止する；～を取り消す</div><div class="ex">The outdoor party will be <b>canceled</b> if it rains tomorrow.</div><div class="xj">もし明日雨なら、屋外のパーティーは中止されます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../15/">← 第15回</a><a href="../17/">第17回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"451": 4.52, "452": 17.59, "453": 31.47, "454": 44.62, "455": 58.88, "456": 73.36, "457": 87.23, "458": 101.69, "459": 115.19, "460": 128.9, "461": 142.65, "462": 156.21, "463": 170.04, "464": 183.31, "465": 196.15, "466": 211.95, "467": 225.26, "468": 239.49, "469": 253.06, "470": 267.66, "471": 281.3, "472": 295.1, "473": 310.99, "474": 325.56, "475": 339.44, "476": 352.09, "477": 367.51, "478": 380.91, "479": 394.56, "480": 407.9}, "TE": {"451": 6.48, "452": 19.55, "453": 33.43, "454": 46.57, "455": 60.84, "456": 75.32, "457": 89.19, "458": 103.64, "459": 117.14, "460": 130.86, "461": 144.61, "462": 158.17, "463": 171.99, "464": 185.27, "465": 198.11, "466": 213.91, "467": 227.22, "468": 241.44, "469": 255.02, "470": 269.61, "471": 283.26, "472": 297.05, "473": 312.95, "474": 327.51, "475": 341.4, "476": 354.04, "477": 369.47, "478": 382.86, "479": 396.51, "480": 409.85}, "Q": [[451, "法律", "law"], [452, "屋外の", "outdoor"], [453, "美しさ", "beauty"], [454, "発達", "development"], [455, "～を申し出る", "offer"], [456, "～を信頼する", "trust"], [457, "～を破壊する", "destroy"], [458, "（公共の建物の）トイレ", "restroom"], [459, "西の", "western"], [460, "豆", "bean"], [461, "土", "soil"], [462, "カレンダー", "calendar"], [463, "ガス", "gas"], [464, "狩りをする", "hunt"], [466, "～をける", "kick"], [467, "現代の", "modern"], [468, "輝く", "shine"], [469, "～の方へ", "toward"], [470, "勇敢な", "brave"], [471, "ツル（鳥）", "crane"], [472, "～に失敗する", "fail"],
