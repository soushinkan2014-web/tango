</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第7回</h1><div class="sub">No.181〜210</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">against</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～に対して；～を相手に；～に反対して</div><div class="ex">Our team will play <b>against</b> Class 3-A in the final.</div><div class="xj">私たちのチームは決勝で3年A組を相手に試合をします。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">laugh</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（声を出して）笑う</div><div class="ex">Everyone <b>laughed</b> at Tom’s joke.</div><div class="xj">みんながトムの冗談に笑いました。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">right now</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">今すぐ；ちょうど今</div><div class="ex">Please come here <b>right now</b>.</div><div class="xj">今すぐここに来てください。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">challenge</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">挑戦；難題</div><div class="ex">Climbing Mt. Fuji was a big <b>challenge</b> for me.</div><div class="xj">富士山に登ることは私にとって大きな挑戦でした。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">repair</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">修理する</div><div class="ex">My father <b>repaired</b> my bike yesterday.</div><div class="xj">父は昨日、私の自転車を修理してくれました。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">whole</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">全体の；全部の</div><div class="ex">We cleaned the <b>whole</b> house last Sunday.</div><div class="xj">私たちはこの前の日曜日、家全体をそうじしました。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">move</span><span class="ps">動</span></div><div class="ja">～を動かす；移動させる</div><div class="ex">Please <b>move</b> your desk to the back of the room.</div><div class="xj">机を部屋の後ろへ動かしてください。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">colorful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">色とりどりの；カラフルな</div><div class="ex">Lisa is wearing a <b>colorful</b> T-shirt.</div><div class="xj">リサは色とりどりのTシャツを着ています。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">item</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">品物；項目</div><div class="ex">This shop has many popular <b>items</b>.</div><div class="xj">この店には人気の品物がたくさんあります。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">title</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">題名；タイトル</div><div class="ex">What is the <b>title</b> of this song?</div><div class="xj">この歌の題名は何ですか。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">bench</span><span class="ps">名</span></div><div class="ja">ベンチ；長いす</div><div class="ex">Let’s sit on the <b>bench</b> in the park.</div><div class="xj">公園のベンチに座りましょう。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">be full of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～でいっぱいである</div><div class="ex">The park <b>was full of</b> families on Sunday.</div><div class="xj">日曜日、公園は家族連れでいっぱいでした。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">comment</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">コメント；意見</div><div class="ex">Mr. Sato wrote a <b>comment</b> on my report.</div><div class="xj">佐藤先生は私のレポートにコメントを書いてくれました。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">dream</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">夢を見る；夢見る</div><div class="ex">I often <b>dream</b> of flying in the sky.</div><div class="xj">私はよく空を飛ぶ夢を見ます。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">bank</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">銀行；土手</div><div class="ex">There is a <b>bank</b> next to the post office.</div><div class="xj">郵便局のとなりに銀行があります。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">celebrate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">祝う</div><div class="ex">We <b>celebrated</b> my father’s birthday at home.</div><div class="xj">私たちは家で父の誕生日を祝いました。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">hint</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">ヒント</div><div class="ex">Do you want a <b>hint</b>?</div><div class="xj">ヒントがほしいですか。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">including</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～を含めて</div><div class="ex">Ten people, <b>including</b> my sister, came to the party.</div><div class="xj">姉を含めて10人がパーティーに来ました。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">north</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">北</div><div class="ex">The wind from the <b>north</b> is very cold in winter.</div><div class="xj">冬は北からの風がとても冷たいです。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">scene</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">場面；光景</div><div class="ex">I like the last <b>scene</b> of this story.</div><div class="xj">私はこの物語の最後の場面が好きです。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">care</span><span class="ps">動</span></div><div class="ja">（care about ～で）気にかける；大切に思う</div><div class="ex">Ken really <b>cares</b> about animals.</div><div class="xj">ケンは動物のことを本当に大切に思っています。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">cherry blossom</span><span class="ps">熟</span></div><div class="ja">桜の花</div><div class="ex">The <b>cherry blossoms</b> are beautiful in April.</div><div class="xj">4月は桜の花が美しいです。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">variety</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">いろいろ（なもの）；多様性</div><div class="ex">This shop sells a <b>variety</b> of bread.</div><div class="xj">この店はいろいろなパンを売っています。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">west</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">西</div><div class="ex">The sun sets in the <b>west</b>.</div><div class="xj">太陽は西にしずみます。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">wide</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">広い；幅の広い</div><div class="ex">The river near my house is very <b>wide</b>.</div><div class="xj">私の家の近くの川はとても広いです。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">affect</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～に影響する</div><div class="ex">Using a smartphone at night can <b>affect</b> your sleep.</div><div class="xj">夜にスマートフォンを使うことは、睡眠に影響することがあります。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">screen</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">画面；スクリーン</div><div class="ex">Don’t look at the <b>screen</b> for too long.</div><div class="xj">画面を長く見すぎてはいけません。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">end</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">終わる；終える</div><div class="ex">Our summer vacation <b>ended</b> last week.</div><div class="xj">私たちの夏休みは先週終わりました。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">bake</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（パンなどを）焼く</div><div class="ex">My sister <b>baked</b> cookies for us.</div><div class="xj">姉が私たちにクッキーを焼いてくれました。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">say to oneself</span><span class="ps">熟</span></div><div class="ja">心の中で思う；ひとりごとを言う</div><div class="ex">Ken <b>said to himself</b> that he must try again.</div><div class="xj">ケンはもう一度やってみなければと心の中で思いました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../06/">← 第6回</a><a href="../08/">第8回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"181": 4.43, "182": 20.25, "183": 33.45, "184": 46.52, "185": 60.47, "186": 73.39, "187": 87.18, "188": 101.58, "189": 115.73, "190": 129.54, "191": 142.53, "192": 155.76, "193": 169.67, "194": 183.4, "195": 197.24, "196": 210.79, "197": 224.11, "198": 235.94, "199": 250.51, "200": 263.85, "201": 277.05, "202": 292.5, "203": 305.94, "204": 319.97, "205": 332.46, "206": 346.15, "207": 360.47, "208": 373.72, "209": 387.17, "210": 400.16}, "TE": {"181": 6.38, "182": 22.2, "183": 35.4, "184": 48.48, "185": 62.42, "186": 75.34, "187": 89.13, "188": 103.54, "189": 117.68, "190": 131.5, "191": 144.48, "192": 157.72, "193": 171.63, "194": 185.35, "195": 199.19, "196": 212.74, "197": 226.06, "198": 237.9, "199": 252.46, "200": 265.81, "201": 279.0, "202": 294.51, "203": 307.89, "204": 321.92, "205": 334.41, "206": 348.11, "207": 362.43, "208": 375.67, "209": 389.13, "210": 402.49}, "Q": [[181, "～に対して", "against"], [182, "（声を出して）笑う", "laugh"], [183, "今すぐ（2語で）", "right now"], [184, "挑戦", "challenge"], [185, "修理する", "repair"], [186, "全体の", "whole"], [187, "～を動かす", "move"], [188, "色とりどりの", "colorful"], [189, "品物", "item"], [190, "題名", "title"], [191, "ベンチ", "bench"], [192, "～でいっぱいである（3語で）", "be full of"], [193, "コメント", "comment"], [194, "夢を見る", "dream"], [195, "銀行", "bank"], [196, "祝う", "celebrate"], [197, "ヒント", "hint"], [198, "～を含めて", "including"], [199, "北", "north"], [200, "場面", "scene"], [201, "気にかける（2語で）", "care about"], [202, "桜の花（2語で）", "cherry blossom"], [203, "いろいろ（なもの）", "variety"], [204, "西", "west"], [205, "広い", "wide"], [206, "～に影響する", "affect"], [207, "画面"
