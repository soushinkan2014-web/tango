</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第13回</h1><div class="sub">No.361〜390</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">battery</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">電池；バッテリー</div><div class="ex">I have to change the <b>battery</b> in this clock.</div><div class="xj">私はこの時計の電池を交換しなければなりません。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">officer</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">警官；役人</div><div class="ex">A police <b>officer</b> showed me the way to the station.</div><div class="xj">警官が私に駅への道を教えてくれました。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">statue</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">像</div><div class="ex">There is a large <b>statue</b> of a dog in the park.</div><div class="xj">公園に大きな犬の像があります。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">block</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">区画；ブロック</div><div class="ex">Walk two <b>blocks</b> and turn left.</div><div class="xj">2ブロック歩いて、左に曲がってください。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">level</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">水準；レベル</div><div class="ex">The <b>level</b> of this team is very high.</div><div class="xj">このチームの水準はとても高いです。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">originally</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">もともと；最初は</div><div class="ex">This building was <b>originally</b> a school.</div><div class="xj">この建物はもともと学校でした。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">content</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">内容；（contentsで）中身</div><div class="ex">The <b>content</b> of her speech was very interesting.</div><div class="xj">彼女のスピーチの内容はとてもおもしろかったです。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">disagree</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">意見が合わない；反対する</div><div class="ex">I <b>disagree</b> with you on this point.</div><div class="xj">この点では、私はあなたと意見が合いません。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">sunshine</span><span class="ps">名</span></div><div class="ja">日光；日なた</div><div class="ex">The children are playing in the warm <b>sunshine</b>.</div><div class="xj">子どもたちは暖かい日光の中で遊んでいます。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">make ～ happy</span><span class="ps">熟</span></div><div class="ja">～を幸せにする</div><div class="ex">Her kind words always <b>make me happy</b>.</div><div class="xj">彼女のやさしい言葉はいつも私を幸せにします。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">application</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">申し込み（書）；応用</div><div class="ex">Send your <b>application</b> to the office by Friday.</div><div class="xj">金曜日までに申し込み書を事務所に送ってください。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">section</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">区域；部分</div><div class="ex">The children’s <b>section</b> of this library is on the second floor.</div><div class="xj">この図書館の子ども向けの区域は2階にあります。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">bitter</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">苦い；つらい</div><div class="ex">This coffee is too <b>bitter</b> for me.</div><div class="xj">このコーヒーは私には苦すぎます。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">delivery</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">配達</div><div class="ex">Pizza <b>delivery</b> is very useful on rainy days.</div><div class="xj">雨の日にはピザの配達がとても便利です。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">greatly</span><span class="ps">副</span><span class="ek">準2+</span></div><div class="ja">大いに；非常に</div><div class="ex">This town has changed <b>greatly</b> in the last ten years.</div><div class="xj">この町はこの10年で大いに変わりました。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">interviewer</span><span class="ps">名</span></div><div class="ja">面接官；インタビュアー</div><div class="ex">The <b>interviewer</b> asked Ken to talk about his dream.</div><div class="xj">面接官はケンに自分の夢について話すように頼みました。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">mirror</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">鏡</div><div class="ex">She checks her hair in the <b>mirror</b> every morning.</div><div class="xj">彼女は毎朝、鏡で髪を確かめます。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">novel</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">小説</div><div class="ex">I have read this <b>novel</b> three times.</div><div class="xj">私はこの小説を3回読んだことがあります。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">not ～ yet</span><span class="ps">熟</span></div><div class="ja">まだ～ない</div><div class="ex">The bus has <b>not come yet</b>.</div><div class="xj">バスはまだ来ていません。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">tie</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を結ぶ；～をしばる</div><div class="ex">My little brother can <b>tie</b> his shoes by himself now.</div><div class="xj">弟は今では一人で靴ひもを結ぶことができます。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">ancient</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">古代の；昔の</div><div class="ex">We saw <b>ancient</b> tools at the museum.</div><div class="xj">私たちは博物館で古代の道具を見ました。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">charge</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">料金；責任</div><div class="ex">There is no <b>charge</b> for children under six.</div><div class="xj">6歳未満の子どもは料金がかかりません。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">diversity</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">多様性</div><div class="ex">The <b>diversity</b> of our team makes us strong.</div><div class="xj">チームの多様性が私たちを強くしています。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">Italian</span><span class="ps">形名</span></div><div class="ja">イタリアの；イタリア語</div><div class="ex">This <b>Italian</b> restaurant opened last month.</div><div class="xj">このイタリアの料理店は先月開店しました。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">method</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">方法</div><div class="ex">This is a good <b>method</b> for learning new words.</div><div class="xj">これは新しい単語を覚えるのによい方法です。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">personal</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">個人的な</div><div class="ex">This is only my <b>personal</b> opinion.</div><div class="xj">これは私の個人的な意見にすぎません。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">smoke</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">煙</div><div class="ex">We saw white <b>smoke</b> over the mountain.</div><div class="xj">山の上に白い煙が見えました。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">species</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（生物の）種</div><div class="ex">Many <b>species</b> of birds live in this forest.</div><div class="xj">この森には多くの種の鳥がすんでいます。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">too ～ to ...</span><span class="ps">熟</span></div><div class="ja">～すぎて…できない</div><div class="ex">This soup is <b>too hot to eat</b>.</div><div class="xj">このスープは熱すぎて飲めません。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">stamp</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">切手</div><div class="ex">I need a <b>stamp</b> for this letter.</div><div class="xj">この手紙には切手が必要です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"361": 4.55, "362": 18.24, "363": 32.15, "364": 45.52, "365": 58.99, "366": 72.46, "367": 86.19, "368": 100.85, "369": 114.82, "370": 128.68, "371": 142.77, "372": 157.16, "373": 171.45, "374": 184.7, "375": 198.08, "376": 212.53, "377": 227.16, "378": 240.41, "379": 252.8, "380": 265.45, "381": 280.95, "382": 294.4, "383": 308.24, "384": 321.34, "385": 335.29, "386": 348.51, "387": 361.32, "388": 374.21, "389": 387.8, "390": 401.39}, "TE": {"361": 6.5, "362": 20.2, "363": 34.1, "364": 47.48, "365": 60.94, "366": 74.42, "367": 88.15, "368": 102.81, "369": 116.77, "370": 130.64, "371": 144.73, "372": 159.11, "373": 173.4, "374": 186.44, "375": 200.03, "376": 214.48, "377": 229.12, "378": 242.08, "379": 254.76, "380": 267.4, "381": 282.91, "382": 296.35, "383": 310.2, "384": 323.29, "385": 337.24, "386": 350.46, "387": 363.27, "388": 376.16, "389": 389.75, "390": 403.35}, "Q": [[361, "電池", "battery"], [362, "警官", "officer"], [363, "像", "statue"], [364, "区画", "block"], [365, "水準", "level"], [366, "もともと", "originally"], [367, "内容", "content"], [368, "意見が合わない", "disagree"], [369, "日光", "sunshine"], [370, "～を幸せにする（2語で）", "make happy"], [371, "申し込み（書）", "application"], [372, "区域", "section"], [373, "苦い", "bitter"], [374, "配達", "delivery"], [375, "大いに", "greatly"], [376, "面接官", "interviewer"], [377, "鏡", "mirror"], [378, "小説", "novel"], [379, "まだ～ない（2語で）", "not yet"], [380, "～を結ぶ", "tie"], [381, "古代の", "ancient"], [382, "料金", "charge"], [383, "多様性", "diversity"], [384, "イタリアの", "Italian"], [3
