</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第15回</h1><div class="sub">No.421〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">group</span><span class="ps">名</span></div><div class="ja">グループ；集団</div><div class="ex">I joined a <b>group</b> that cleans the beach.</div><div class="xj">私は浜辺をそうじするグループに参加しました。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">chose</span><span class="ps">動</span></div><div class="ja">選んだ（choose の過去形）</div><div class="ex">The bag I <b>chose</b> was too big.</div><div class="xj">私が選んだかばんは大きすぎました。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">anyone</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">だれか；だれでも</div><div class="ex">Is there <b>anyone</b> who can speak Chinese?</div><div class="xj">中国語を話せる人はだれかいますか。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">prize</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">（競技・くじなどの）賞；賞品</div><div class="ex">If I won first <b>prize</b>, I would buy a new guitar.</div><div class="xj">もし1等賞をとったら、新しいギターを買うのに。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">drive</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">運転する；車で送る</div><div class="ex">If I were an adult, I would <b>drive</b> to the sea.</div><div class="xj">もし私が大人なら、海まで車を運転して行くのに。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">researcher</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">研究者</div><div class="ex">My aunt is a <b>researcher</b> who studies birds.</div><div class="xj">私のおばは鳥を研究している研究者です。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">cultural</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">文化の；文化的な</div><div class="ex">The <b>cultural</b> event that we saw in Nara was exciting.</div><div class="xj">私たちが奈良で見た文化的な行事はわくわくするものでした。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">average</span><span class="ps">名形</span><span class="ek">準2</span></div><div class="ja">平均；平均の</div><div class="ex">The <b>average</b> of my test scores is eighty.</div><div class="xj">私のテストの点の平均は80点です。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">although</span><span class="ps">接</span><span class="ek">英3</span></div><div class="ja">～だけれども</div><div class="ex"><b>Although</b> Ken was tired, he finished his homework.</div><div class="xj">ケンは疲れていたけれども、宿題を終えました。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">rate</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">割合；料金</div><div class="ex">The recycling <b>rate</b> of this town is very high.</div><div class="xj">この町のリサイクルの割合はとても高いです。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">relate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">関係がある；関連づける</div><div class="ex">This story <b>relates</b> to Japanese history.</div><div class="xj">この物語は日本の歴史と関係があります。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">council</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">議会；協議会</div><div class="ex">The city <b>council</b> decided to build a new library.</div><div class="xj">市議会は新しい図書館を建てることを決めました。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">distance</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">距離</div><div class="ex">The <b>distance</b> from my house to school is about three kilometers.</div><div class="xj">家から学校までの距離は約3キロメートルです。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">pollution</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">汚染</div><div class="ex">We can reduce air <b>pollution</b> by using buses and trains.</div><div class="xj">バスや電車を使うことで大気汚染を減らすことができます。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">provide</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を提供する；与える</div><div class="ex">The school <b>provides</b> lunch for all students.</div><div class="xj">その学校はすべての生徒に昼食を提供しています。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">artificial</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">人工の</div><div class="ex">This park has an <b>artificial</b> lake that was made fifty years ago.</div><div class="xj">この公園には50年前に作られた人工の湖があります。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">board</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">板；掲示板</div><div class="ex">My father cut the <b>board</b> in half.</div><div class="xj">父はその板を半分に切りました。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">leaflet</span><span class="ps">名</span></div><div class="ja">チラシ；パンフレット</div><div class="ex">The girl standing by the gate gave me a <b>leaflet</b>.</div><div class="xj">門のそばに立っていた女の子が私にチラシをくれました。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">blank</span><span class="ps">名形</span><span class="ek">準2</span></div><div class="ja">空所；空白の</div><div class="ex">Fill in the <b>blanks</b> with the right words.</div><div class="xj">正しい語を空所に入れなさい。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">directly</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">直接に</div><div class="ex">You should talk to her <b>directly</b>.</div><div class="xj">彼女に直接話したほうがいいですよ。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">everyday</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">毎日の；日常の</div><div class="ex">Emi uses English in her <b>everyday</b> life.</div><div class="xj">エミは毎日の生活で英語を使います。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">thing</span><span class="ps">名</span></div><div class="ja">（things で）持ち物；身の回りのもの</div><div class="ex">Please take home the <b>things</b> you left in your locker.</div><div class="xj">ロッカーに置いている持ち物を家に持って帰ってください。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">preserve</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">保存する；守る</div><div class="ex">We must <b>preserve</b> old buildings in this town.</div><div class="xj">私たちはこの町の古い建物を保存しなければなりません。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">Asian</span><span class="ps">形</span></div><div class="ja">アジアの</div><div class="ex">Rice is a main food in many <b>Asian</b> countries.</div><div class="xj">米は多くのアジアの国々で主食です。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">plate</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">皿</div><div class="ex">The <b>plate</b> you are holding is very old.</div><div class="xj">あなたが持っている皿はとても古いものです。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">wheelchair</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">車いす</div><div class="ex">The woman who uses a <b>wheelchair</b> works at the library.</div><div class="xj">車いすを使っているその女性は図書館で働いています。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">detail</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">詳細；細部</div><div class="ex">Please tell me the <b>details</b> of your plan.</div><div class="xj">あなたの計画の詳細を教えてください。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">look for ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～をさがす</div><div class="ex">I’m <b>looking for</b> a girl who has a red bag.</div><div class="xj">私は赤いかばんを持っている女の子をさがしています。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">opportunity</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">機会</div><div class="ex">I wish I had more <b>opportunities</b> to speak English.</div><div class="xj">英語を話す機会がもっとあればいいのに。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">designer</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">デザイナー</div><div class="ex">She is a <b>designer</b> who makes clothes for children.</div><div class="xj">彼女は子ども服を作るデザイナーです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"421": 4.48, "422": 18.12, "423": 31.67, "424": 44.97, "425": 60.6, "426": 75.05, "427": 88.52, "428": 103.09, "429": 117.01, "430": 131.22, "431": 145.15, "432": 159.57, "433": 173.91, "434": 187.7, "435": 201.8, "436": 216.54, "437": 230.74, "438": 244.04, "439": 258.28, "440": 271.79, "441": 284.23, "442": 298.44, "443": 313.38, "444": 327.19, "445": 340.83, "446": 353.72, "447": 367.42, "448": 380.84, "449": 394.51, "450": 408.11}, "TE": {"421": 6.43, "422": 20.07, "423": 33.63, "424": 46.93, "425": 62.55, "426": 77.0, "427": 90.48, "428": 105.05, "429": 118.96, "430": 133.17, "431": 147.1, "432": 161.52, "433": 175.71, "434": 189.65, "435": 203.76, "436": 218.49, "437": 232.7, "438": 246.0, "439": 260.24, "440": 273.75, "441": 286.19, "442": 300.4, "443": 315.34, "444": 329.14, "445": 342.79, "446": 355.68, "447": 369.38, "448": 382.79, "449": 396.47, "450": 410.07}, "Q": [[421, "グループ", "group"], [422, "選んだ（choose の過去形）", "chose"], [423, "だれか", "anyone"], [424, "（競技・くじなどの）賞", "prize"], [425, "運転する", "drive"], [426, "研究者", "researcher"], [427, "文化の", "cultural"], [428, "平均", "average"], [429, "～だけれども", "although"], [430, "割合", "rate"], [431, "関係がある", "relate"], [432, "議会", "council"], [433, "距離", "distance"], [434, "汚染", "pollution"], [435, "～を提供する", "provide"], [436, "人工の", "artificial
