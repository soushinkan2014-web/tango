</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル3　第12回</h1><div class="sub">No.331〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">let</span><span class="ps">動</span></div><div class="ja">～させる；（let me ～で）私に～させて</div><div class="ex">A: This box is heavy.<br>B: <b>Let</b> me help you.</div><div class="xj">A：この箱は重いです。B：私に手伝わせてください。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">possible</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">可能な；できる</div><div class="ex">Is it <b>possible</b> to visit the museum on Monday?</div><div class="xj">月曜日に博物館を訪れることは可能ですか。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">impressed</span><span class="ps">形</span></div><div class="ja">感動した；感心した</div><div class="ex">Emi was <b>impressed</b> by the old temple in Kyoto.</div><div class="xj">エミは京都の古い寺に感動しました。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">state</span><span class="ps">名</span></div><div class="ja">州；状態</div><div class="ex">Florida is a warm <b>state</b> in America.</div><div class="xj">フロリダはアメリカの暖かい州です。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">knowledge</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">知識</div><div class="ex">Reading many books gives you a lot of <b>knowledge</b>.</div><div class="xj">たくさんの本を読むと、多くの知識が身につきます。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">relationship</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">関係</div><div class="ex">It is important to build a good <b>relationship</b> with your neighbors.</div><div class="xj">近所の人とよい関係を築くことは大切です。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">reuse</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">再利用する</div><div class="ex">We can <b>reuse</b> these glass bottles many times.</div><div class="xj">私たちはこれらのガラスびんを何度も再利用することができます。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">discount</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">割引</div><div class="ex">Students can get a ten percent <b>discount</b> at this shop.</div><div class="xj">学生はこの店で10パーセントの割引を受けられます。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">sustainable</span><span class="ps">形</span><span class="ek">準2+</span></div><div class="ja">持続可能な</div><div class="ex">We want to make our town more <b>sustainable</b>.</div><div class="xj">私たちは自分たちの町をもっと持続可能なものにしたいです。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">want ～ to ...</span><span class="ps">熟</span></div><div class="ja">～に…してほしい</div><div class="ex">I <b>want you to come</b> to my birthday party.</div><div class="xj">あなたに私の誕生日パーティーに来てほしいです。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">generation</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">世代</div><div class="ex">People of every <b>generation</b> enjoy this game.</div><div class="xj">どの世代の人たちもこのゲームを楽しみます。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">cleaner</span><span class="ps">名</span></div><div class="ja">そうじ機；洗剤</div><div class="ex">My grandmother’s new vacuum <b>cleaner</b> is light and easy to use.</div><div class="xj">祖母の新しいそうじ機は軽くて使いやすいです。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">cycling</span><span class="ps">名</span></div><div class="ja">サイクリング</div><div class="ex">We went <b>cycling</b> around the lake last Sunday.</div><div class="xj">私たちはこの前の日曜日、湖のまわりをサイクリングしました。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">Korean</span><span class="ps">形名</span></div><div class="ja">韓国の；韓国語</div><div class="ex">Lisa has never tried <b>Korean</b> food.</div><div class="xj">リサは韓国の料理を一度も食べたことがありません。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">population</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">人口</div><div class="ex">What is the <b>population</b> of your city?</div><div class="xj">あなたの市の人口はどのくらいですか。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">symbol</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">象徴；記号</div><div class="ex">The big cherry tree in the park is a <b>symbol</b> of our town.</div><div class="xj">公園の大きな桜の木は私たちの町の象徴です。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">custom</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">習慣；（customsで）税関</div><div class="ex">Eating rice cakes on New Year’s Day is a Japanese <b>custom</b>.</div><div class="xj">元日にもちを食べるのは日本の習慣です。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">impossible</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">不可能な</div><div class="ex">It is <b>impossible</b> for me to finish this work today.</div><div class="xj">今日この仕事を終えることは私には不可能です。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">feature</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">特徴；（目玉となる）呼び物</div><div class="ex">Long ears are a <b>feature</b> of rabbits.</div><div class="xj">長い耳はウサギの特徴です。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">tell ～ to ...</span><span class="ps">熟</span></div><div class="ja">～に…するように言う</div><div class="ex">My mother <b>told me to clean</b> my room.</div><div class="xj">母は私に部屋をそうじするように言いました。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">refer</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（refer to ～で）～を指す；～に言及する；参照する</div><div class="ex">What does this word <b>refer to</b>?</div><div class="xj">この語は何を指していますか。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">courage</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">勇気</div><div class="ex">Yuki needed <b>courage</b> to sing in front of everyone.</div><div class="xj">ユキがみんなの前で歌うには勇気が必要でした。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">discuss</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">話し合う</div><div class="ex">We <b>discussed</b> the school festival in class.</div><div class="xj">私たちはクラスで文化祭について話し合いました。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">judge</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を判断する；審査する</div><div class="ex">Don’t <b>judge</b> a person by one mistake.</div><div class="xj">1つのまちがいで人を判断してはいけません。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">apply</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">申し込む；～を応用する</div><div class="ex">I will <b>apply</b> for the summer English program.</div><div class="xj">私は夏の英語プログラムに申し込むつもりです。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">ourselves</span><span class="ps">代</span></div><div class="ja">私たち自身</div><div class="ex">We painted this wall <b>ourselves</b>.</div><div class="xj">私たちは自分たちでこの壁にペンキをぬりました。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">pop</span><span class="ps">名形</span></div><div class="ja">ポップス；大衆向けの</div><div class="ex">My sister likes <b>pop</b> better than rock.</div><div class="xj">姉はロックよりポップスのほうが好きです。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">billion</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">10億</div><div class="ex">More than one <b>billion</b> people live in India.</div><div class="xj">インドには10億人以上の人々が住んでいます。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">drill</span><span class="ps">名</span></div><div class="ja">訓練；ドリル</div><div class="ex">We had a fire <b>drill</b> at school this morning.</div><div class="xj">今朝、学校で火災訓練がありました。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">ask ～ to ...</span><span class="ps">熟</span></div><div class="ja">～に…するように頼む</div><div class="ex">Tom <b>asked Emi to open</b> the window.</div><div class="xj">トムはエミに窓を開けるように頼みました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"331": 4.48, "332": 22.54, "333": 36.28, "334": 50.7, "335": 64.25, "336": 77.58, "337": 91.43, "338": 105.24, "339": 118.86, "340": 132.12, "341": 145.82, "342": 159.25, "343": 174.3, "344": 187.6, "345": 201.68, "346": 214.35, "347": 228.88, "348": 244.35, "349": 257.83, "350": 272.43, "351": 286.25, "352": 301.92, "353": 315.42, "354": 328.72, "355": 343.37, "356": 358.1, "357": 371.2, "358": 385.3, "359": 398.49, "360": 412.0}, "TE": {"331": 6.43, "332": 24.5, "333": 38.23, "334": 52.66, "335": 66.21, "336": 79.53, "337": 93.38, "338": 107.19, "339": 120.84, "340": 134.08, "341": 147.78, "342": 161.2, "343": 176.26, "344": 189.55, "345": 203.64, "346": 216.31, "347": 230.83, "348": 246.31, "349": 259.78, "350": 274.38, "351": 288.21, "352": 303.88, "353": 317.38, "354": 330.68, "355": 345.33, "356": 360.05, "357": 373.15, "358": 387.25, "359": 400.45, "360": 413.95}, "Q": [[331, "～させる", "let"], [332, "可能な", "possible"], [333, "感動した", "impressed"], [334, "州", "state"], [335, "知識", "knowledge"], [336, "関係", "relationship"], [337, "再利用する", "reuse"], [338, "割引", "discount"], [339, "持続可能な", "sustainable"], [340, "～に…してほしい（3語で）", "want to ..."], [341, "世代", "generation"], [342, "そうじ機", "cleaner"], [343, "サイクリング", "cycling"], [344, "韓国の", "Korean"], [345, "人口", "population"], [346, "象徴", "symbol"], [347, "習慣", "custom"], [348, "不可能な", "impossible"], [349, "特徴", "feature"], [350, "～に…するように言う（3語で）", "tell to ..."], [351, "～を指す（2語で）", "refer to"], [352, "勇
