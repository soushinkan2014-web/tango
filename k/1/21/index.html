</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第21回</h1><div class="sub">No.601〜630</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">eleven</span><span class="ps">数</span></div><div class="ja">11（の）</div><div class="ex">A soccer team has <b>eleven</b> players.</div><div class="xj">サッカーのチームには11人の選手がいます。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">low</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">低い</div><div class="ex">That wall is very <b>low</b>.</div><div class="xj">あのかべはとても低いです。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">next to ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～のとなりに</div><div class="ex">My school is <b>next to</b> the library.</div><div class="xj">私の学校は図書館のとなりにあります。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">tall</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">背が高い；高い</div><div class="ex">My father is very <b>tall</b>.</div><div class="xj">父はとても背が高いです。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">cut</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">切る</div><div class="ex">Can you <b>cut</b> this bread?</div><div class="xj">このパンを切ってくれますか。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">window</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">窓</div><div class="ex">Can I open the <b>window</b>?</div><div class="xj">窓を開けてもいいですか。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">dad</span><span class="ps">名</span></div><div class="ja">お父さん；パパ</div><div class="ex">My <b>dad</b> cooks dinner on Saturdays.</div><div class="xj">お父さんは土曜日に夕食を作ります。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">he’s</span><span class="ps">代</span></div><div class="ja">彼は～です（he is の短縮形）</div><div class="ex"><b>He’s</b> my classmate.</div><div class="xj">彼は私のクラスメートです。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">touch</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">さわる；触れる</div><div class="ex">Can I <b>touch</b> your dog?</div><div class="xj">あなたの犬にさわってもいいですか。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">pizza</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ピザ</div><div class="ex">What <b>pizza</b> do you want?</div><div class="xj">あなたはどんなピザがほしいですか。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">forty</span><span class="ps">数</span></div><div class="ja">40（の）</div><div class="ex">I can swim <b>forty</b> meters.</div><div class="xj">私は40メートル泳げます。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">baby</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">赤ちゃん</div><div class="ex">My aunt’s <b>baby</b> is very small.</div><div class="xj">おばの赤ちゃんはとても小さいです。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">fly</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">飛ぶ；飛ばす</div><div class="ex">Penguins can’t <b>fly</b>.</div><div class="xj">ペンギンは飛べません。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">No problem.</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">いいですよ；問題ないよ</div><div class="ex">A: Can you help me?<br>B: <b>No problem.</b></div><div class="xj">A：手伝ってくれますか。B：いいですよ。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">heavy</span><span class="ps">形</span></div><div class="ja">重い</div><div class="ex">I can’t carry this <b>heavy</b> box.</div><div class="xj">私はこの重い箱を運べません。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">holiday</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">休日；祝日</div><div class="ex">Today is a <b>holiday</b>.</div><div class="xj">今日は休日です。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">top</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">頂上；いちばん上</div><div class="ex">We can see the sea from the <b>top</b>.</div><div class="xj">頂上から海が見えます。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">uncle</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">おじ</div><div class="ex">My <b>uncle</b> can speak French.</div><div class="xj">私のおじはフランス語を話せます。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">dollar</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ドル（お金の単位）</div><div class="ex">You can buy it for two <b>dollars</b>.</div><div class="xj">それは2ドルで買えます。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">air</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">空気</div><div class="ex">The <b>air</b> is clean here.</div><div class="xj">ここは空気がきれいです。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">road</span><span class="ps">名</span></div><div class="ja">道路；道</div><div class="ex">This <b>road</b> goes to the station.</div><div class="xj">この道路は駅に通じています。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">tomato</span><span class="ps">名</span></div><div class="ja">トマト</div><div class="ex">This <b>tomato</b> is very sweet.</div><div class="xj">このトマトはとても甘いです。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">France</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">フランス</div><div class="ex">Paris is in <b>France</b>.</div><div class="xj">パリはフランスにあります。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">singer</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">歌手</div><div class="ex">Which <b>singer</b> do you like?</div><div class="xj">あなたはどの歌手が好きですか。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">look like ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～のように見える；～に似ている</div><div class="ex">That cloud <b>looks like</b> a cat.</div><div class="xj">あの雲はネコのように見えます。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">size</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">大きさ；サイズ</div><div class="ex">What <b>size</b> do you want?</div><div class="xj">あなたはどのサイズがほしいですか。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">sun</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">太陽；日光</div><div class="ex">We can’t see the <b>sun</b> today.</div><div class="xj">今日は太陽が見えません。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">she’s</span><span class="ps">代</span></div><div class="ja">彼女は～です（she is の短縮形）</div><div class="ex"><b>She’s</b> from Canada.</div><div class="xj">彼女はカナダ出身です。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">January</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">1月</div><div class="ex">My birthday is in <b>January</b>.</div><div class="xj">私の誕生日は1月です。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">set</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（太陽などが）沈む；置く；セットする</div><div class="ex">In winter, the sun <b>sets</b> early.</div><div class="xj">冬は日が早く沈みます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../20/">← 第20回</a><a href="../22/">第22回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"601": 4.84, "602": 18.7, "603": 31.78, "604": 45.9, "605": 59.81, "606": 72.49, "607": 85.24, "608": 99.64, "609": 114.47, "610": 127.58, "611": 140.4, "612": 153.71, "613": 167.46, "614": 180.72, "615": 197.0, "616": 210.61, "617": 224
