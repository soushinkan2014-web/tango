</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第15回</h1><div class="sub">No.421〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">fourteen</span><span class="ps">数</span></div><div class="ja">14（の）</div><div class="ex">Two weeks is <b>fourteen</b> days.</div><div class="xj">2週間は14日です。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">kilometer</span><span class="ps">名</span></div><div class="ja">キロメートル</div><div class="ex">I walk two <b>kilometers</b> to school.</div><div class="xj">私は学校まで2キロメートル歩きます。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">meat</span><span class="ps">名</span></div><div class="ja">肉</div><div class="ex">I don’t eat <b>meat</b>.</div><div class="xj">私は肉を食べません。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">towel</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">タオル</div><div class="ex">Please use this <b>towel</b>.</div><div class="xj">このタオルを使ってください。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">in total</span><span class="ps">熟</span></div><div class="ja">全部で；合計で</div><div class="ex">We have ten students <b>in total</b>.</div><div class="xj">生徒は全部で10人います。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">cousin</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">いとこ</div><div class="ex">We are <b>cousins</b>.</div><div class="xj">私たちはいとこ同士です。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">ah</span><span class="ps">間</span></div><div class="ja">ああ</div><div class="ex"><b>Ah</b>, I see.</div><div class="xj">ああ、なるほど。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">banana</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">バナナ</div><div class="ex">Monkeys like <b>bananas</b>.</div><div class="xj">サルはバナナが好きです。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">panda</span><span class="ps">名</span></div><div class="ja">パンダ</div><div class="ex"><b>Pandas</b> are black and white.</div><div class="xj">パンダは白と黒です。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">rabbit</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ウサギ</div><div class="ex">We have two <b>rabbits</b> at school.</div><div class="xj">私たちは学校でウサギを2羽飼っています。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">eighteen</span><span class="ps">数</span></div><div class="ja">18（の）</div><div class="ex">We have <b>eighteen</b> students in our club.</div><div class="xj">私たちの部には18人の生徒がいます。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">hill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">丘</div><div class="ex">Let’s go up that small <b>hill</b>.</div><div class="xj">あの小さな丘に登ろう。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">horse</span><span class="ps">名</span></div><div class="ja">馬</div><div class="ex">I want to ride a <b>horse</b>.</div><div class="xj">私は馬に乗りたいです。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">seventy</span><span class="ps">数</span></div><div class="ja">70（の）</div><div class="ex">I read <b>seventy</b> pages every day.</div><div class="xj">私は毎日70ページ読みます。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">autumn</span><span class="ps">名</span></div><div class="ja">秋</div><div class="ex">Apples are delicious in <b>autumn</b>.</div><div class="xj">秋はりんごがおいしいです。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">market</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">市場</div><div class="ex">We buy fish at the <b>market</b>.</div><div class="xj">私たちは市場で魚を買います。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">French fries</span><span class="ps">熟</span></div><div class="ja">フライドポテト</div><div class="ex">I like <b>French fries</b> very much.</div><div class="xj">私はフライドポテトが大好きです。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">exactly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">そのとおり；正確に</div><div class="ex">A: You like dogs, right?<br>B: <b>Exactly</b>!</div><div class="xj">A：あなたは犬が好きですよね。B：そのとおり！</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">guest</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">客；お客さん</div><div class="ex">We have a <b>guest</b> today.</div><div class="xj">今日はお客さんが来ます。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">ski</span><span class="ps">動</span></div><div class="ja">スキーをする</div><div class="ex">We <b>ski</b> in Nagano every winter.</div><div class="xj">私たちは毎年冬に長野でスキーをします。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">cheerful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">明るい；元気のよい</div><div class="ex">You are very <b>cheerful</b>.</div><div class="xj">あなたはとても明るいですね。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">runner</span><span class="ps">名</span></div><div class="ja">走る人；ランナー</div><div class="ex">I want to be a fast <b>runner</b>.</div><div class="xj">私は速いランナーになりたいです。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">feed</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">えさをやる；食べ物を与える</div><div class="ex">I <b>feed</b> my cat every morning.</div><div class="xj">私は毎朝ネコにえさをやります。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">pool</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">プール</div><div class="ex">We swim in the school <b>pool</b> in summer.</div><div class="xj">私たちは夏に学校のプールで泳ぎます。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">rugby</span><span class="ps">名</span></div><div class="ja">ラグビー</div><div class="ex"><b>Rugby</b> is popular in New Zealand.</div><div class="xj">ニュージーランドではラグビーが人気です。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">seventh</span><span class="ps">数</span></div><div class="ja">7番目（の）；（日付の）7日</div><div class="ex">Tanabata is on July <b>seventh</b>.</div><div class="xj">七夕は7月7日です。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">spaghetti</span><span class="ps">名</span></div><div class="ja">スパゲッティ</div><div class="ex">Do you like <b>spaghetti</b>?</div><div class="xj">あなたはスパゲッティが好きですか。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">bamboo</span><span class="ps">名</span></div><div class="ja">竹</div><div class="ex">Pandas eat <b>bamboo</b>.</div><div class="xj">パンダは竹を食べます。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">sixty</span><span class="ps">数</span></div><div class="ja">60（の）</div><div class="ex">We have <b>sixty</b> books in our classroom.</div><div class="xj">私たちの教室には60冊の本があります。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">police station</span><span class="ps">名</span></div><div class="ja">警察署</div><div class="ex">The <b>police station</b> is next to the park.</div><div class="xj">警察署は公園のとなりにあります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"421": 4.6, "422": 18.2, "423": 31.95, "424": 44.5, "425": 57.41, "426": 71.57, "427": 84.19, "428": 97.1, "429": 110.22, "430": 123.38, "431": 136.85, "432": 150.55, "433": 163.79, "434": 176.75, "435": 190.6, "436": 203.96, "437": 217.08, "438": 231.16, "439": 247.94, "440": 261.18, "441": 274.92, "442": 288.74, "443": 302.56, "444": 317.22, "445": 330.91, "446": 344.58, "447": 359.66, "448": 372.24, "449": 385.12, "450": 398.79}, "TE": {"421": 6.78, "422": 20.39,
