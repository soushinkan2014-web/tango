</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第8回</h1><div class="sub">No.211〜240</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">soccer</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">サッカー</div><div class="ex">Let’s play <b>soccer</b> in the park.</div><div class="xj">公園でサッカーをしよう。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">be from ～</span><span class="ps">熟</span></div><div class="ja">～出身である</div><div class="ex">We <b>are from</b> Canada.</div><div class="xj">私たちはカナダ出身です。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">history</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">歴史</div><div class="ex">We have a <b>history</b> test tomorrow.</div><div class="xj">明日、歴史のテストがあります。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">homework</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">宿題</div><div class="ex">I have a lot of <b>homework</b> today.</div><div class="xj">今日は宿題がたくさんあります。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">drink</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">飲む</div><div class="ex">I <b>drink</b> milk every morning.</div><div class="xj">私は毎朝牛乳を飲みます。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">Australia</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">オーストラリア</div><div class="ex">I want to go to <b>Australia</b>.</div><div class="xj">私はオーストラリアへ行きたいです。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">museum</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">博物館；美術館</div><div class="ex">Let’s go to the <b>museum</b> on Sunday.</div><div class="xj">日曜日に博物館へ行こう。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">free</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">ひまな；自由な；無料の</div><div class="ex">Are you <b>free</b> this afternoon?</div><div class="xj">今日の午後はひまですか。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">TV</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">テレビ</div><div class="ex">I watch <b>TV</b> after dinner.</div><div class="xj">私は夕食のあとでテレビを見ます。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">its</span><span class="ps">代</span></div><div class="ja">それの；その</div><div class="ex">I like that shop and <b>its</b> cakes.</div><div class="xj">私はあの店とそのケーキが好きです。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">woman</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">女性</div><div class="ex">I want to talk with that <b>woman</b>.</div><div class="xj">私はあの女性と話したいです。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">classmate</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">クラスメート；同級生</div><div class="ex">Ken and I are <b>classmates</b>.</div><div class="xj">ケンと私はクラスメートです。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">worry</span><span class="ps">動</span></div><div class="ja">心配する</div><div class="ex">Don’t <b>worry</b>.</div><div class="xj">心配しないで。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">open</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">開ける；開く</div><div class="ex"><b>Open</b> your notebooks.</div><div class="xj">ノートを開けなさい。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">go shopping</span><span class="ps">熟</span></div><div class="ja">買い物に行く</div><div class="ex">Let’s <b>go shopping</b> this weekend.</div><div class="xj">今週末、買い物に行こう。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">water</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">水</div><div class="ex">I want some cold <b>water</b>.</div><div class="xj">私は冷たい水がほしいです。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">dinner</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">夕食</div><div class="ex">We eat <b>dinner</b> at seven.</div><div class="xj">私たちは7時に夕食を食べます。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">large</span><span class="ps">形</span></div><div class="ja">大きい；（サイズが）Lの</div><div class="ex">I want a <b>large</b> pizza.</div><div class="xj">私は大きなピザがほしいです。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">flower</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">花</div><div class="ex">These <b>flowers</b> are beautiful.</div><div class="xj">これらの花はきれいです。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">out</span><span class="ps">副</span></div><div class="ja">外へ；外に</div><div class="ex">Let’s go <b>out</b> for lunch.</div><div class="xj">お昼を食べに外へ出かけよう。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">cook</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">料理する</div><div class="ex">I <b>cook</b> with my mother on Sundays.</div><div class="xj">私は日曜日に母と料理をします。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">team</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">チーム</div><div class="ex">We are a good <b>team</b>.</div><div class="xj">私たちはよいチームです。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">trip</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">旅行</div><div class="ex">Have a nice <b>trip</b>!</div><div class="xj">よい旅行を！</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">exciting</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">わくわくさせる；おもしろい</div><div class="ex">Basketball games are <b>exciting</b>.</div><div class="xj">バスケットボールの試合はわくわくします。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">delicious</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">とてもおいしい</div><div class="ex">These cookies are <b>delicious</b>.</div><div class="xj">このクッキーはとてもおいしいです。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">isn’t</span><span class="ps">動</span></div><div class="ja">～ではない（is not の短縮形）</div><div class="ex">This <b>isn’t</b> my pen.</div><div class="xj">これは私のペンではありません。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">Would you like ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～はいかがですか</div><div class="ex">A: <b>Would you like</b> some tea?<br>B: Yes, please.</div><div class="xj">A：紅茶はいかがですか。B：はい、お願いします。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">boy</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">男の子；少年</div><div class="ex">The <b>boys</b> are in the gym.</div><div class="xj">男の子たちは体育館にいます。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">green</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">緑の；緑色</div><div class="ex">I have a <b>green</b> bag.</div><div class="xj">私は緑のかばんを持っています。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">song</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">歌</div><div class="ex">Do you know this <b>song</b>?</div><div class="xj">あなたはこの歌を知っていますか。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"211": 4.48, "212": 17.8, "213": 31.26, "214": 44.7, "215": 57.94, "216": 71.12, "217": 84.4, "218": 98.88, "219": 112.22, "220": 125.66, "221": 139.49, "222": 152.59, "223": 167.07, "224": 179.7, "225": 192.9
