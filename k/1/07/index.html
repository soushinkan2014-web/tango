</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第7回</h1><div class="sub">No.181〜210</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">anything</span><span class="ps">代</span><span class="ek">英4</span></div><div class="ja">（疑問文で）何か；（否定文で）何も</div><div class="ex">Do you need <b>anything</b>?</div><div class="xj">何か必要ですか。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">four</span><span class="ps">数</span></div><div class="ja">4；4つ（の）</div><div class="ex">We have <b>four</b> seasons in Japan.</div><div class="xj">日本には4つの季節があります。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">put</span><span class="ps">動</span></div><div class="ja">置く</div><div class="ex"><b>Put</b> your bag here.</div><div class="xj">かばんをここに置いてください。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">wait</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">待つ</div><div class="ex">Please <b>wait</b> here for a minute.</div><div class="xj">ここで少し待っていてください。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">Saturday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">土曜日</div><div class="ex">We play soccer on <b>Saturdays</b>.</div><div class="xj">私たちは毎週土曜日にサッカーをします。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">club</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">クラブ；部</div><div class="ex">I’m in the tennis <b>club</b>.</div><div class="xj">私はテニス部に入っています。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">around the world</span><span class="ps">熟</span></div><div class="ja">世界中で；世界中の</div><div class="ex">People <b>around the world</b> love soccer.</div><div class="xj">世界中の人々がサッカーを愛しています。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">clean</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">掃除する；きれいにする</div><div class="ex">We <b>clean</b> our classroom after lunch.</div><div class="xj">私たちは昼食のあとで教室を掃除します。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">night</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">夜；晩</div><div class="ex">I study English every <b>night</b>.</div><div class="xj">私は毎晩英語を勉強します。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">those</span><span class="ps">代</span></div><div class="ja">あれらの；あれら</div><div class="ex"><b>Those</b> shoes are Emi’s.</div><div class="xj">あれらのくつはエミのものです。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">afternoon</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">午後</div><div class="ex">I have a piano lesson this <b>afternoon</b>.</div><div class="xj">今日の午後ピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">junior</span><span class="ps">形</span></div><div class="ja">下級の；年下の</div><div class="ex">We are <b>junior</b> members of the team.</div><div class="xj">私たちはチームの下級生のメンバーです。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">music</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">音楽</div><div class="ex">I listen to <b>music</b> every night.</div><div class="xj">私は毎晩音楽を聞きます。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">restaurant</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">レストラン</div><div class="ex">Let’s eat at that <b>restaurant</b>.</div><div class="xj">あのレストランで食べよう。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">still</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">まだ；今でも</div><div class="ex">I’m <b>still</b> hungry.</div><div class="xj">私はまだおなかがすいています。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">excited</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">わくわくした；興奮した</div><div class="ex">We are <b>excited</b> about the trip.</div><div class="xj">私たちは旅行にわくわくしています。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">brother</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">兄；弟；兄弟</div><div class="ex">Are you Ken’s <b>brother</b>?</div><div class="xj">あなたはケンのお兄さんですか。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">internet</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">インターネット</div><div class="ex">I use the <b>internet</b> at home.</div><div class="xj">私は家でインターネットを使います。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">story</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">物語；話</div><div class="ex">I like this <b>story</b> very much.</div><div class="xj">私はこの物語が大好きです。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">come back</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">帰ってくる；戻る</div><div class="ex">Please <b>come back</b> soon.</div><div class="xj">すぐに戻ってきてね。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">bus</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">バス</div><div class="ex">Let’s take the <b>bus</b>.</div><div class="xj">バスに乗ろう。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">sport</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">スポーツ；運動</div><div class="ex">I like winter <b>sports</b>.</div><div class="xj">私は冬のスポーツが好きです。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">welcome</span><span class="ps">間</span><span class="ek">英4</span></div><div class="ja">ようこそ；歓迎される</div><div class="ex"><b>Welcome</b> to our school!</div><div class="xj">私たちの学校へようこそ！</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">children</span><span class="ps">名</span></div><div class="ja">子どもたち（child の複数形）</div><div class="ex">The <b>children</b> are in the park.</div><div class="xj">子どもたちは公園にいます。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">ten</span><span class="ps">数</span></div><div class="ja">10；10（の）</div><div class="ex">I have <b>ten</b> pencils.</div><div class="xj">私は鉛筆を10本持っています。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">front</span><span class="ps">名</span></div><div class="ja">前；正面</div><div class="ex">Let’s meet at the <b>front</b> of the station.</div><div class="xj">駅の正面で会おう。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">point</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">点；得点；要点</div><div class="ex">We have three <b>points</b> now.</div><div class="xj">私たちは今、3点です。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">man</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">男性；男の人</div><div class="ex">Do you know that <b>man</b>?</div><div class="xj">あなたはあの男性を知っていますか。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">train</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">電車；列車</div><div class="ex">I go to school by <b>train</b> every day.</div><div class="xj">私は毎日電車で学校に行きます。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">movie</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">映画</div><div class="ex">Let’s see a <b>movie</b> on Saturday.</div><div class="xj">土曜日に映画を見よう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../06/">← 第6回</a><a href="../08/">第8回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"181": 4.48, "182": 18.76, "183": 32.64, "184": 45.35, "185": 58.37, "186": 72.03, "187": 84.95, "188": 99.76, "189": 114.43, "190": 127.85, "191": 141.19, "192": 155.0
