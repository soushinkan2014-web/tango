</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第11回</h1><div class="sub">No.301〜330</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">eight</span><span class="ps">数</span></div><div class="ja">8；8つ（の）</div><div class="ex">I get up at <b>eight</b> on Sundays.</div><div class="xj">私は日曜日は8時に起きます。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">Wednesday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">水曜日</div><div class="ex">I have a piano lesson on <b>Wednesdays</b>.</div><div class="xj">私は毎週水曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">rice</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ごはん；米</div><div class="ex">We eat <b>rice</b> almost every day.</div><div class="xj">私たちはほとんど毎日ごはんを食べます。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">we’re</span><span class="ps">代</span></div><div class="ja">私たちは～です（we are の短縮形）</div><div class="ex"><b>We’re</b> good friends.</div><div class="xj">私たちは仲よしです。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">twenty</span><span class="ps">数</span></div><div class="ja">20（の）</div><div class="ex">I have <b>twenty</b> comic books.</div><div class="xj">私はマンガを20冊持っています。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">fifteen</span><span class="ps">数</span></div><div class="ja">15（の）</div><div class="ex">We need <b>fifteen</b> chairs.</div><div class="xj">私たちは15脚のいすが必要です。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">gym</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">体育館</div><div class="ex">We play volleyball in the <b>gym</b>.</div><div class="xj">私たちは体育館でバレーボールをします。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">April</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">4月</div><div class="ex">It is warm in <b>April</b>.</div><div class="xj">4月は暖かいです。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">dance</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">おどる；ダンスをする</div><div class="ex">Let’s <b>dance</b> to the music.</div><div class="xj">音楽に合わせておどろう。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">red</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">赤い</div><div class="ex">Look at those <b>red</b> flowers.</div><div class="xj">あの赤い花を見て。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">video</span><span class="ps">名</span></div><div class="ja">動画；ビデオ</div><div class="ex">Let’s watch this <b>video</b>.</div><div class="xj">この動画を見よう。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">Nice to meet you.</span><span class="ps">熟</span></div><div class="ja">はじめまして；お会いできてうれしいです</div><div class="ex">A: I’m Lisa.<br>B: <b>Nice to meet you</b>, Lisa.</div><div class="xj">A：私はリサです。B：はじめまして、リサ。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">design</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">デザインする；設計する</div><div class="ex">I want to <b>design</b> T-shirts.</div><div class="xj">私はTシャツをデザインしたいです。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">desk</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">机</div><div class="ex">This is my <b>desk</b>.</div><div class="xj">これは私の机です。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">tea</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">お茶；紅茶</div><div class="ex">Do you want some <b>tea</b>?</div><div class="xj">お茶はいかがですか。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">break</span><span class="ps">名</span></div><div class="ja">休憩；休み時間</div><div class="ex">Let’s take a <b>break</b>.</div><div class="xj">休憩しよう。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">hungry</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">おなかがすいた；空腹の</div><div class="ex">Are you <b>hungry</b>?</div><div class="xj">あなたはおなかがすいていますか。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">bird</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">鳥</div><div class="ex">Look at the <b>bird</b> in the tree.</div><div class="xj">木の上の鳥を見て。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">staff</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">スタッフ；職員</div><div class="ex">Please ask the <b>staff</b>.</div><div class="xj">スタッフにたずねてください。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">hundred</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">100（の）</div><div class="ex">I have two <b>hundred</b> yen.</div><div class="xj">私は2百円持っています。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">map</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">地図</div><div class="ex">Let’s look at the <b>map</b>.</div><div class="xj">地図を見よう。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">off</span><span class="ps">副</span></div><div class="ja">（明かりなどが）消えて；離れて；脱いで</div><div class="ex">Turn <b>off</b> the TV, please.</div><div class="xj">テレビを消してください。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">wish</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">願い；願いごと</div><div class="ex">Make a <b>wish</b>, Emi!</div><div class="xj">エミ、願いごとをして！</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">fine</span><span class="ps">形</span></div><div class="ja">元気な；よい；晴れた</div><div class="ex">A: Are you OK?<br>B: Yes, I’m <b>fine</b>.</div><div class="xj">A：大丈夫ですか。B：はい、元気です。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">club activities</span><span class="ps">名</span></div><div class="ja">部活動</div><div class="ex">We have <b>club activities</b> after school.</div><div class="xj">放課後に部活動があります。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">coffee</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">コーヒー</div><div class="ex">Do you drink <b>coffee</b>?</div><div class="xj">あなたはコーヒーを飲みますか。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">fruit</span><span class="ps">名</span></div><div class="ja">果物</div><div class="ex">Apples are my favorite <b>fruit</b>.</div><div class="xj">リンゴは私のいちばん好きな果物です。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">wash</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">洗う</div><div class="ex">I <b>wash</b> the dishes every night.</div><div class="xj">私は毎晩お皿を洗います。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">face</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">顔</div><div class="ex">Wash your <b>face</b> in the morning.</div><div class="xj">朝は顔を洗いなさい。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">cat</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ネコ</div><div class="ex">I have a black <b>cat</b>.</div><div class="xj">私は黒いネコを飼っています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"301": 4.64, "302": 17.86, "303": 31.35, "304": 44.5, "305": 58.87, "306": 71.61, "307": 84.66, "308": 97.45, "309": 109.78, "310": 123.1, "311": 135.69, "312": 148.72, "313": 166.3, "314": 180.46, "315": 192.58, "316": 205.0, "317": 217.91, "318": 230.82, "319": 243.22, "320": 256.49, "321": 268.9, "322": 280.96, "323": 295.26, "324"
