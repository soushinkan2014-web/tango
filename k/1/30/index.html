</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第30回</h1><div class="sub">No.871〜900</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../30.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="871"><div class="top"><span class="no">871</span><span class="en">cloud</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">雲</div><div class="ex">A big white <b>cloud</b> was in the sky.</div><div class="xj">大きな白い雲が空に浮かんでいました。</div></button></li><li><button class="w" data-no="872"><div class="top"><span class="no">872</span><span class="en">football</span><span class="ps">名</span></div><div class="ja">フットボール；サッカー</div><div class="ex">Tom played <b>football</b> in America.</div><div class="xj">トムはアメリカでフットボールをしました。</div></button></li><li><button class="w" data-no="873"><div class="top"><span class="no">873</span><span class="en">all day</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">一日中</div><div class="ex">We played soccer <b>all day</b>.</div><div class="xj">私たちは一日中サッカーをしました。</div></button></li><li><button class="w" data-no="874"><div class="top"><span class="no">874</span><span class="en">album</span><span class="ps">名</span></div><div class="ja">アルバム</div><div class="ex">Yuki made a photo <b>album</b> of her trip.</div><div class="xj">ユキは旅行の写真アルバムを作りました。</div></button></li><li><button class="w" data-no="875"><div class="top"><span class="no">875</span><span class="en">blackboard</span><span class="ps">名</span></div><div class="ja">黒板</div><div class="ex">Mr. Sato wrote his name on the <b>blackboard</b>.</div><div class="xj">佐藤先生は黒板に自分の名前を書きました。</div></button></li><li><button class="w" data-no="876"><div class="top"><span class="no">876</span><span class="en">doll</span><span class="ps">名</span></div><div class="ja">人形</div><div class="ex">My little sister sleeps with her <b>doll</b>.</div><div class="xj">妹は人形といっしょに寝ます。</div></button></li><li><button class="w" data-no="877"><div class="top"><span class="no">877</span><span class="en">dress</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ドレス；服装</div><div class="ex">Emi bought a white <b>dress</b> last week.</div><div class="xj">エミは先週、白いドレスを買いました。</div></button></li><li><button class="w" data-no="878"><div class="top"><span class="no">878</span><span class="en">sheep</span><span class="ps">名</span></div><div class="ja">ヒツジ</div><div class="ex">We saw many <b>sheep</b> in New Zealand.</div><div class="xj">私たちはニュージーランドでたくさんのヒツジを見ました。</div></button></li><li><button class="w" data-no="879"><div class="top"><span class="no">879</span><span class="en">stay home</span><span class="ps">熟</span></div><div class="ja">家にいる</div><div class="ex">We <b>stayed home</b> because it was rainy.</div><div class="xj">雨だったので、私たちは家にいました。</div></button></li><li><button class="w" data-no="880"><div class="top"><span class="no">880</span><span class="en">speed</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">速さ；スピード</div><div class="ex">Ken ran at full <b>speed</b>.</div><div class="xj">ケンは全速力で走りました。</div></button></li><li><button class="w" data-no="881"><div class="top"><span class="no">881</span><span class="en">stomachache</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">腹痛</div><div class="ex">Ken had a <b>stomachache</b> after lunch.</div><div class="xj">ケンは昼食のあと腹痛になりました。</div></button></li><li><button class="w" data-no="882"><div class="top"><span class="no">882</span><span class="en">tooth</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">歯</div><div class="ex">The baby has two <b>teeth</b> now.</div><div class="xj">その赤ちゃんは今、歯が2本あります。</div></button></li><li><button class="w" data-no="883"><div class="top"><span class="no">883</span><span class="en">circle</span><span class="ps">名</span></div><div class="ja">丸；円</div><div class="ex">Draw a <b>circle</b> in your notebook.</div><div class="xj">ノートに丸を描きなさい。</div></button></li><li><button class="w" data-no="884"><div class="top"><span class="no">884</span><span class="en">Egypt</span><span class="ps">名</span></div><div class="ja">エジプト</div><div class="ex">My aunt saw the pyramids in <b>Egypt</b>.</div><div class="xj">おばはエジプトでピラミッドを見ました。</div></button></li><li><button class="w" data-no="885"><div class="top"><span class="no">885</span><span class="en">take a picture</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">写真をとる</div><div class="ex">We <b>took a picture</b> at the zoo.</div><div class="xj">私たちは動物園で写真をとりました。</div></button></li><li><button class="w" data-no="886"><div class="top"><span class="no">886</span><span class="en">corn</span><span class="ps">名</span></div><div class="ja">トウモロコシ</div><div class="ex">Lisa bought some <b>corn</b> at the market.</div><div class="xj">リサは市場でトウモロコシを買いました。</div></button></li><li><button class="w" data-no="887"><div class="top"><span class="no">887</span><span class="en">DVD</span><span class="ps">名</span></div><div class="ja">DVD</div><div class="ex">We watched a <b>DVD</b> at Tom’s house.</div><div class="xj">私たちはトムの家でDVDを見ました。</div></button></li><li><button class="w" data-no="888"><div class="top"><span class="no">888</span><span class="en">grandpa</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">おじいちゃん</div><div class="ex">My <b>grandpa</b> took me to the zoo.</div><div class="xj">私のおじいちゃんは私を動物園に連れていってくれました。</div></button></li><li><button class="w" data-no="889"><div class="top"><span class="no">889</span><span class="en">zero</span><span class="ps">名</span></div><div class="ja">ゼロ</div><div class="ex">We won the game two to <b>zero</b>.</div><div class="xj">私たちは2対ゼロで試合に勝ちました。</div></button></li><li><button class="w" data-no="890"><div class="top"><span class="no">890</span><span class="en">How often ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">どのくらいの頻度で～しますか</div><div class="ex"><b>How often</b> do you play tennis?</div><div class="xj">あなたはどのくらいの頻度でテニスをしますか。</div></button></li><li><button class="w" data-no="891"><div class="top"><span class="no">891</span><span class="en">giraffe</span><span class="ps">名</span></div><div class="ja">キリン</div><div class="ex"><b>Giraffes</b> are very tall.</div><div class="xj">キリンはとても背が高いです。</div></button></li><li><button class="w" data-no="892"><div class="top"><span class="no">892</span><span class="en">nose</span><span class="ps">名</span></div><div class="ja">鼻</div><div class="ex">Emi touched the dog’s <b>nose</b>.</div><div class="xj">エミはその犬の鼻にさわりました。</div></button></li><li><button class="w" data-no="893"><div class="top"><span class="no">893</span><span class="en">Russia</span><span class="ps">名</span></div><div class="ja">ロシア</div><div class="ex"><b>Russia</b> is a very large country.</div><div class="xj">ロシアはとても大きな国です。</div></button></li><li><button class="w" data-no="894"><div class="top"><span class="no">894</span><span class="en">Kenya</span><span class="ps">名</span></div><div class="ja">ケニア</div><div class="ex">Mr. Sato took pictures of lions in <b>Kenya</b>.</div><div class="xj">佐藤さんはケニアでライオンの写真をとりました。</div></button></li><li><button class="w" data-no="895"><div class="top"><span class="no">895</span><span class="en">lettuce</span><span class="ps">名</span></div><div class="ja">レタス</div><div class="ex">Ken put <b>lettuce</b> and tomatoes in the sandwich.</div><div class="xj">ケンはサンドイッチにレタスとトマトを入れました。</div></button></li><li><button class="w" data-no="896"><div class="top"><span class="no">896</span><span class="en">say hello</span><span class="ps">熟</span></div><div class="ja">あいさつをする</div><div class="ex">Emi <b>said hello</b> to her new teacher.</div><div class="xj">エミは新しい先生にあいさつをしました。</div></button></li><li><button class="w" data-no="897"><div class="top"><span class="no">897</span><span class="en">mouse</span><span class="ps">名</span></div><div class="ja">ネズミ</div><div class="ex">The cat is looking at a <b>mouse</b>.</div><div class="xj">ネコがネズミを見ています。</div></button></li><li><button class="w" data-no="898"><div class="top"><span class="no">898</span><span class="en">pumpkin</span><span class="ps">名</span></div><div class="ja">カボチャ</div><div class="ex">We made soup with a big <b>pumpkin</b>.</div><div class="xj">私たちは大きなカボチャでスープを作りました。</div></button></li><li><button class="w" data-no="899"><div class="top"><span class="no">899</span><span class="en">snake</span><span class="ps">名</span></div><div class="ja">ヘビ</div><div class="ex">A long <b>snake</b> was under the tree.</div><div class="xj">長いヘビが木の下にいました。</div></button></li><li><button class="w" data-no="900"><div class="top"><span class="no">900</span><span class="en">telephone</span><span class="ps">名</span></div><div class="ja">電話</div><div class="ex">Emi is talking on the <b>telephone</b>.</div><div class="xj">エミは電話で話しています。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../29/">← 第29回</a><a href="../31/">第31回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"871": 4.74, "872": 18.53, "873": 32.92, "874": 46.34, "875": 60.21, "876": 74.38, "877": 88.04, "878": 102.19, "879": 115.84, "880": 129.45, "881": 143.14, "882": 156.95, "883": 170.39, "884": 183.81, "885": 197.67, "886": 210.94, "887": 224.61, "888": 238.82, "889": 252.22, "890
