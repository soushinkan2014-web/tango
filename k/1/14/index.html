名</span><span class="ek">英4</span></div><div class="ja">フランス語；フランスの</div><div class="ex">I want to learn <b>French</b>.</div><div class="xj">私はフランス語を習いたいです。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">perform</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">演じる；演奏する；披露する</div><div class="ex">We <b>perform</b> a play at the school festival.</div><div class="xj">私たちは文化祭で劇を演じます。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">salad</span><span class="ps">名</span></div><div class="ja">サラダ</div><div class="ex">We eat <b>salad</b> for breakfast.</div><div class="xj">私たちは朝食にサラダを食べます。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">February</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">2月</div><div class="ex">It is very cold in <b>February</b>.</div><div class="xj">2月はとても寒いです。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">yeah</span><span class="ps">間</span></div><div class="ja">うん；ええ</div><div class="ex">A: Do you like soccer?<br>B: <b>Yeah</b>, I love it.</div><div class="xj">A：サッカーは好き？<br>B：うん、大好き。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">take a bath</span><span class="ps">熟</span></div><div class="ja">ふろに入る</div><div class="ex">I <b>take a bath</b> at nine.</div><div class="xj">私は9時にふろに入ります。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">across</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～を横切って；～を渡って</div><div class="ex">Let’s walk <b>across</b> the bridge.</div><div class="xj">歩いて橋を渡ろう。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">plane</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">飛行機</div><div class="ex">I want to go to Hokkaido by <b>plane</b>.</div><div class="xj">私は飛行機で北海道に行きたいです。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">fourth</span><span class="ps">数</span></div><div class="ja">4番目（の）；（日付の）4日</div><div class="ex">Our classroom is on the <b>fourth</b> floor.</div><div class="xj">私たちの教室は4階にあります。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">bicycle</span><span class="ps">名</span></div><div class="ja">自転車</div><div class="ex">I have a new <b>bicycle</b>.</div><div class="xj">私は新しい自転車を持っています。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">shy</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">恥ずかしがりの；内気な</div><div class="ex">Are you <b>shy</b>?</div><div class="xj">あなたは恥ずかしがりやですか。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">artist</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">芸術家；画家</div><div class="ex">You are a great <b>artist</b>!</div><div class="xj">あなたはすばらしい芸術家ですね！</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">sleepy</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">眠い</div><div class="ex">I’m very <b>sleepy</b> now.</div><div class="xj">私は今とても眠いです。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">bread</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">パン</div><div class="ex">I eat <b>bread</b> and milk every morning.</div><div class="xj">私は毎朝パンと牛乳をとります。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">gate</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">門</div><div class="ex">Let’s meet at the school <b>gate</b>.</div><div class="xj">学校の門で会おう。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">fifth</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">5番目（の）；（日付の）5日</div><div class="ex">Children’s Day is May <b>fifth</b>.</div><div class="xj">こどもの日は5月5日です。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">meal</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">食事</div><div class="ex">We have three <b>meals</b> a day.</div><div class="xj">私たちは1日に3回食事をします。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">social studies</span><span class="ps">熟</span></div><div class="ja">社会（科）</div><div class="ex">We have <b>social studies</b> on Friday.</div><div class="xj">私たちは金曜日に社会があります。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">pencil</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">えんぴつ</div><div class="ex">Do you have a <b>pencil</b>?</div><div class="xj">あなたはえんぴつを持っていますか。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">cookie</span><span class="ps">名</span></div><div class="ja">クッキー</div><div class="ex">Let’s make <b>cookies</b> together.</div><div class="xj">いっしょにクッキーを作ろう。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">grandparent</span><span class="ps">名</span></div><div class="ja">祖父母（の1人）</div><div class="ex">My <b>grandparents</b> live in Kagoshima.</div><div class="xj">私の祖父母は鹿児島に住んでいます。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">hat</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ぼうし</div><div class="ex">Wear your <b>hat</b>, Ken.</div><div class="xj">ケン、ぼうしをかぶりなさい。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">robot</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ロボット</div><div class="ex">I want to make a <b>robot</b>.</div><div class="xj">私はロボットを作りたいです。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">P.E.</span><span class="ps">名</span></div><div class="ja">体育</div><div class="ex">We have <b>P.E.</b> today.</div><div class="xj">今日は体育があります。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">badminton</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">バドミントン</div><div class="ex">I play <b>badminton</b> with my sister.</div><div class="xj">私は妹とバドミントンをします。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">Brazil</span><span class="ps">名</span></div><div class="ja">ブラジル</div><div class="ex">Many people play soccer in <b>Brazil</b>.</div><div class="xj">ブラジルではたくさんの人がサッカーをします。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"391": 4.67, "392": 17.53, "393": 30.48, "394": 43.85, "395": 56.54, "396": 69.78, "397": 83.77, "398": 96.9, "399": 110.07, "400": 124.99, "401": 137.94, "402": 153.18, "403": 166.28, "404": 180.6, "405": 193.15, "406": 205.65, "407":
