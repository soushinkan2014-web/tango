n">small</span><span class="ps">形</span></div><div class="ja">小さい</div><div class="ex">I have a <b>small</b> dog.</div><div class="xj">私は小さい犬を飼っています。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">usually</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">ふつうは；たいてい</div><div class="ex">I <b>usually</b> walk to school.</div><div class="xj">私はふつうは歩いて学校へ行きます。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">sometimes</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">ときどき</div><div class="ex">I <b>sometimes</b> cook dinner.</div><div class="xj">私はときどき夕食を作ります。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">speak</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">話す</div><div class="ex">We <b>speak</b> English in this class.</div><div class="xj">このクラスでは英語を話します。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">summer</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">夏</div><div class="ex">I love <b>summer</b>.</div><div class="xj">私は夏が大好きです。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">town</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">町</div><div class="ex">I love my <b>town</b>.</div><div class="xj">私は自分の町が大好きです。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">tomorrow</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">明日（は）</div><div class="ex">Let’s play tennis <b>tomorrow</b>.</div><div class="xj">明日テニスをしよう。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">～ year(s) old</span><span class="ps">熟</span></div><div class="ja">～歳</div><div class="ex">I am thirteen <b>years old</b>.</div><div class="xj">私は13歳です。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">back</span><span class="ps">副</span></div><div class="ja">もとへ；戻って</div><div class="ex">Please go <b>back</b> to your seat.</div><div class="xj">自分の席に戻ってください。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">game</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">試合；ゲーム</div><div class="ex">We have a soccer <b>game</b> on Sunday.</div><div class="xj">日曜日にサッカーの試合があります。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">wonderful</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">すばらしい</div><div class="ex">We have a <b>wonderful</b> teacher.</div><div class="xj">私たちにはすばらしい先生がいます。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">course</span><span class="ps">名</span></div><div class="ja">コース；進路；講座</div><div class="ex">We run on this <b>course</b>.</div><div class="xj">私たちはこのコースを走ります。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">sorry</span><span class="ps">形</span></div><div class="ja">すまなく思って；残念で</div><div class="ex">I’m very <b>sorry</b>.</div><div class="xj">私はとても申し訳なく思っています。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">love</span><span class="ps">動</span></div><div class="ja">大好きである；愛する</div><div class="ex">I <b>love</b> my dog.</div><div class="xj">私は自分の犬が大好きです。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">father</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">父；お父さん</div><div class="ex">I play catch with my <b>father</b>.</div><div class="xj">私は父とキャッチボールをします。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">five</span><span class="ps">数</span></div><div class="ja">5（の）</div><div class="ex">I get up at <b>five</b>.</div><div class="xj">私は5時に起きます。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">Sunday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">日曜日</div><div class="ex">I’m free on <b>Sunday</b>.</div><div class="xj">私は日曜日はひまです。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">little</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">（a little で）少し；小さい</div><div class="ex">I’m a <b>little</b> hungry.</div><div class="xj">私は少しおなかがすいています。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">up</span><span class="ps">副</span></div><div class="ja">上へ；起きて</div><div class="ex">Stand <b>up</b>, please.</div><div class="xj">立ち上がってください。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">Ms.</span><span class="ps">名</span></div><div class="ja">～さん（女性に）</div><div class="ex">This is <b>Ms.</b> Tanaka.</div><div class="xj">こちらは田中さんです。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">after school</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">放課後</div><div class="ex">We play soccer <b>after school</b>.</div><div class="xj">私たちは放課後サッカーをします。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">library</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">図書館</div><div class="ex">We often study in the <b>library</b>.</div><div class="xj">私たちはよく図書館で勉強します。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">room</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">部屋</div><div class="ex">I like my <b>room</b>.</div><div class="xj">私は自分の部屋が好きです。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">famous</span><span class="ps">形</span></div><div class="ja">有名な</div><div class="ex">I want to be a <b>famous</b> singer.</div><div class="xj">私は有名な歌手になりたいです。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">member</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">一員；メンバー</div><div class="ex">I am a <b>member</b> of the tennis team.</div><div class="xj">私はテニス部の一員です。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">you’re</span><span class="ps">代</span></div><div class="ja">あなたは～です（you are の短縮形）</div><div class="ex"><b>You’re</b> early today.</div><div class="xj">あなたは今日は早いですね。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"151": 4.43, "152": 18.75, "153": 32.02, "154": 45.41, "155": 58.48, "156": 71.03, "157": 84.23, "158": 97.59, "159": 110.45, "160": 122.52, "161": 134.71, "162": 147.4, "163": 160.74, "164": 173.77, "165": 187.08, "166": 199.8, "167": 212.71, "168": 226.29, "169": 239.46, "170": 252.68, "171": 264.99, "172": 277.54, "173": 291.02, "174": 304.1, "175": 317.15, "176": 330.63, "177": 343.8,
