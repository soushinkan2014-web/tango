pan><span class="ek">英4</span></div><div class="ja">もちろん</div><div class="ex">A: Can you help me?<br>B: <b>Of course</b>.</div><div class="xj">A：手伝ってくれる？B：もちろん。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">station</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">駅</div><div class="ex">Where is the <b>station</b>?</div><div class="xj">駅はどこですか。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">fun</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">楽しみ；楽しいこと</div><div class="ex">This game is a lot of <b>fun</b>.</div><div class="xj">このゲームはとても楽しいです。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">lunch</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">昼食</div><div class="ex">What time is <b>lunch</b>?</div><div class="xj">昼食は何時ですか。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">mean</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">意味する</div><div class="ex">What does this word <b>mean</b>?</div><div class="xj">この単語はどういう意味ですか。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">event</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">行事；出来事；イベント</div><div class="ex">The school festival is a big <b>event</b>.</div><div class="xj">文化祭は大きな行事です。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">weekend</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">週末</div><div class="ex">What do you do on <b>weekends</b>?</div><div class="xj">あなたは週末に何をしますか。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">park</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">公園</div><div class="ex">Emi often plays tennis in the <b>park</b>.</div><div class="xj">エミはよく公園でテニスをします。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">name</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">名前</div><div class="ex">What’s your <b>name</b>?</div><div class="xj">あなたの名前は何ですか。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">child</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">子ども</div><div class="ex">My aunt has two <b>children</b>.</div><div class="xj">おばには子どもが2人います。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">foreign</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">外国の</div><div class="ex">Can you speak a <b>foreign</b> language?</div><div class="xj">あなたは外国の言葉を話せますか。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">Can I ～?</span><span class="ps">熟</span></div><div class="ja">～してもいいですか</div><div class="ex">A: <b>Can I</b> use your pen?<br>B: Sure.</div><div class="xj">A：あなたのペンを使ってもいいですか。B：いいよ。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">shop</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">店</div><div class="ex">My aunt has a small <b>shop</b>.</div><div class="xj">私のおばは小さな店を持っています。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">hour</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">1時間；時間</div><div class="ex">Ken studies for two <b>hours</b> every day.</div><div class="xj">ケンは毎日2時間勉強します。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">sister</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">姉；妹；姉妹</div><div class="ex">My <b>sister</b> can make cookies.</div><div class="xj">私の姉はクッキーを作れます。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">over</span><span class="ps">前</span></div><div class="ja">～の上を；～を越えて</div><div class="ex">An airplane flies <b>over</b> my house every day.</div><div class="xj">毎日飛行機が私の家の上を飛んでいきます。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">left</span><span class="ps">名</span></div><div class="ja">左；左側</div><div class="ex">The bank is on your <b>left</b>.</div><div class="xj">銀行は左側にあります。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">shopping</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">買い物</div><div class="ex">My mother does the <b>shopping</b> on Saturdays.</div><div class="xj">母は土曜日に買い物をします。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">birthday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">誕生日</div><div class="ex">When is your <b>birthday</b>?</div><div class="xj">あなたの誕生日はいつですか。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">doesn’t</span><span class="ps">助</span></div><div class="ja">～しない（does not の短縮形）</div><div class="ex">Ken <b>doesn’t</b> like cats.</div><div class="xj">ケンはネコが好きではありません。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">young</span><span class="ps">形</span></div><div class="ja">若い</div><div class="ex">My aunt is very <b>young</b>.</div><div class="xj">私のおばはとても若いです。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">bag</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">かばん；ふくろ</div><div class="ex">Ken’s <b>bag</b> is very heavy.</div><div class="xj">ケンのかばんはとても重いです。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">listen to ～</span><span class="ps">熟</span></div><div class="ja">～を聞く</div><div class="ex">Emi <b>listens to</b> English songs every day.</div><div class="xj">エミは毎日英語の歌を聞きます。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">animal</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">動物</div><div class="ex">What <b>animal</b> do you like?</div><div class="xj">あなたはどんな動物が好きですか。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">traditional</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">伝統的な</div><div class="ex">We can see <b>traditional</b> houses in Kyoto.</div><div class="xj">京都では伝統的な家を見ることができます。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">third</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">3番目の；第3の</div><div class="ex">This is my <b>third</b> trip to Kyoto.</div><div class="xj">これは私の3回目の京都旅行です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../17/">← 第17回</a><a href="../19/">第19回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"511": 4.69, "512": 18.18, "513": 31.42, "514": 44.16, "515": 57.0, "516": 71.51, "517": 83.79, "518": 97.42, "519": 109.58, "520": 12
