</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第28回</h1><div class="sub">No.811〜840</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../28.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="811"><div class="top"><span class="no">811</span><span class="en">toy</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">おもちゃ</div><div class="ex">My brother is playing with his <b>toys</b>.</div><div class="xj">弟はおもちゃで遊んでいます。</div></button></li><li><button class="w" data-no="812"><div class="top"><span class="no">812</span><span class="en">do one’s homework</span><span class="ps">熟</span></div><div class="ja">宿題をする</div><div class="ex">Ken <b>did his homework</b> before dinner.</div><div class="xj">ケンは夕食の前に宿題をしました。</div></button></li><li><button class="w" data-no="813"><div class="top"><span class="no">813</span><span class="en">chef</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">料理人；シェフ</div><div class="ex">My uncle is a <b>chef</b> at a restaurant.</div><div class="xj">おじはレストランの料理人です。</div></button></li><li><button class="w" data-no="814"><div class="top"><span class="no">814</span><span class="en">shirt</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">シャツ</div><div class="ex">My mother bought a blue <b>shirt</b> for my father.</div><div class="xj">母は父に青いシャツを買いました。</div></button></li><li><button class="w" data-no="815"><div class="top"><span class="no">815</span><span class="en">camping</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">キャンプ（をすること）</div><div class="ex">We went <b>camping</b> by the river last summer.</div><div class="xj">私たちは去年の夏、川のそばへキャンプに行きました。</div></button></li><li><button class="w" data-no="816"><div class="top"><span class="no">816</span><span class="en">head</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">頭</div><div class="ex">I hit my <b>head</b> on the door.</div><div class="xj">私はドアに頭をぶつけました。</div></button></li><li><button class="w" data-no="817"><div class="top"><span class="no">817</span><span class="en">camp</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">キャンプ場；合宿</div><div class="ex">We stayed at a <b>camp</b> near the lake.</div><div class="xj">私たちは湖の近くのキャンプ場に泊まりました。</div></button></li><li><button class="w" data-no="818"><div class="top"><span class="no">818</span><span class="en">go out</span><span class="ps">熟</span></div><div class="ja">外出する；出かける</div><div class="ex">We didn’t <b>go out</b> yesterday.</div><div class="xj">私たちは昨日、外出しませんでした。</div></button></li><li><button class="w" data-no="819"><div class="top"><span class="no">819</span><span class="en">koala</span><span class="ps">名</span></div><div class="ja">コアラ</div><div class="ex"><b>Koalas</b> sleep for a long time every day.</div><div class="xj">コアラは毎日長い時間眠ります。</div></button></li><li><button class="w" data-no="820"><div class="top"><span class="no">820</span><span class="en">police</span><span class="ps">名</span></div><div class="ja">警察</div><div class="ex">I took the bag to the <b>police</b>.</div><div class="xj">私はそのかばんを警察に届けました。</div></button></li><li><button class="w" data-no="821"><div class="top"><span class="no">821</span><span class="en">drum</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ドラム；たいこ</div><div class="ex">My brother plays the <b>drums</b> very well.</div><div class="xj">兄はとても上手にドラムをたたきます。</div></button></li><li><button class="w" data-no="822"><div class="top"><span class="no">822</span><span class="en">onion</span><span class="ps">名</span></div><div class="ja">タマネギ</div><div class="ex">Emi is cutting an <b>onion</b> in the kitchen.</div><div class="xj">エミは台所でタマネギを切っています。</div></button></li><li><button class="w" data-no="823"><div class="top"><span class="no">823</span><span class="en">have fun</span><span class="ps">熟</span></div><div class="ja">楽しむ</div><div class="ex">We <b>had fun</b> at the beach.</div><div class="xj">私たちは海辺で楽しみました。</div></button></li><li><button class="w" data-no="824"><div class="top"><span class="no">824</span><span class="en">terrible</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">ひどい；恐ろしい</div><div class="ex">The weather was <b>terrible</b> on our trip.</div><div class="xj">旅行中の天気はひどかったです。</div></button></li><li><button class="w" data-no="825"><div class="top"><span class="no">825</span><span class="en">broke</span><span class="ps">動</span></div><div class="ja">こわした；割った（break の過去形）</div><div class="ex">I <b>broke</b> my cup.</div><div class="xj">私はカップを割りました。</div></button></li><li><button class="w" data-no="826"><div class="top"><span class="no">826</span><span class="en">pie</span><span class="ps">名</span></div><div class="ja">パイ</div><div class="ex">Grandma made an apple <b>pie</b> for us.</div><div class="xj">おばあちゃんは私たちにアップルパイを作ってくれました。</div></button></li><li><button class="w" data-no="827"><div class="top"><span class="no">827</span><span class="en">taxi</span><span class="ps">名</span></div><div class="ja">タクシー</div><div class="ex">We took a <b>taxi</b> to the station.</div><div class="xj">私たちは駅までタクシーに乗りました。</div></button></li><li><button class="w" data-no="828"><div class="top"><span class="no">828</span><span class="en">arm</span><span class="ps">名</span></div><div class="ja">うで</div><div class="ex">Tom is holding a cat in his <b>arms</b>.</div><div class="xj">トムはうでにネコをだいています。</div></button></li><li><button class="w" data-no="829"><div class="top"><span class="no">829</span><span class="en">in the evening</span><span class="ps">熟</span></div><div class="ja">夕方に；晩に</div><div class="ex">My father comes home <b>in the evening</b>.</div><div class="xj">父は夕方に帰宅します。</div></button></li><li><button class="w" data-no="830"><div class="top"><span class="no">830</span><span class="en">ocean</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（大きな）海；大洋</div><div class="ex">Many fish live in the <b>ocean</b>.</div><div class="xj">多くの魚が海にすんでいます。</div></button></li><li><button class="w" data-no="831"><div class="top"><span class="no">831</span><span class="en">Singapore</span><span class="ps">名</span></div><div class="ja">シンガポール</div><div class="ex"><b>Singapore</b> is a small country in Asia.</div><div class="xj">シンガポールはアジアの小さな国です。</div></button></li><li><button class="w" data-no="832"><div class="top"><span class="no">832</span><span class="en">jacket</span><span class="ps">名</span></div><div class="ja">上着；ジャケット</div><div class="ex">Where did you buy that <b>jacket</b>?</div><div class="xj">その上着はどこで買いましたか。</div></button></li><li><button class="w" data-no="833"><div class="top"><span class="no">833</span><span class="en">ship</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">（大きな）船</div><div class="ex">A big <b>ship</b> came to Kobe yesterday.</div><div class="xj">昨日、大きな船が神戸に来ました。</div></button></li><li><button class="w" data-no="834"><div class="top"><span class="no">834</span><span class="en">funny</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">おかしな；おもしろい</div><div class="ex">Tom’s story was very <b>funny</b>.</div><div class="xj">トムの話はとてもおかしかったです。</div></button></li><li><button class="w" data-no="835"><div class="top"><span class="no">835</span><span class="en">go straight</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">まっすぐ行く</div><div class="ex"><b>Go straight</b> and you can see the station.</div><div class="xj">まっすぐ行くと駅が見えます。</div></button></li><li><button class="w" data-no="836"><div class="top"><span class="no">836</span><span class="en">homeroom</span><span class="ps">名</span></div><div class="ja">ホームルーム</div><div class="ex">We talked about the school trip in <b>homeroom</b>.</div><div class="xj">私たちはホームルームで修学旅行について話しました。</div></button></li><li><button class="w" data-no="837"><div class="top"><span class="no">837</span><span class="en">beef</span><span class="ps">名</span></div><div class="ja">牛肉</div><div class="ex">My father cooked <b>beef</b> for dinner.</div><div class="xj">父は夕食に牛肉を料理しました。</div></button></li><li><button class="w" data-no="838"><div class="top"><span class="no">838</span><span class="en">CD</span><span class="ps">名</span></div><div class="ja">CD</div><div class="ex">Emi bought a <b>CD</b> of her favorite singer.</div><div class="xj">エミは大好きな歌手のCDを買いました。</div></button></li><li><button class="w" data-no="839"><div class="top"><span class="no">839</span><span class="en">cheese</span><span class="ps">名</span></div><div class="ja">チーズ</div><div class="ex">This pizza has a lot of <b>cheese</b>.</div><div class="xj">このピザにはチーズがたくさんのっています。</div></button></li><li><button class="w" data-no="840"><div class="top"><span class="no">840</span><span class="en">anything else</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">ほかに何か</div><div class="ex">A: Do you want <b>anything else</b>?<br>B: No, thank you.</div><div class="xj">A：ほかに何かほしいですか。B：いいえ、けっこうです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../27/">← 第27回</a><a href="../29/">第29回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"811": 4.88, "812": 17.94, "813": 31.97, "814": 45.6, "815": 59.04, "816": 72.62, "817": 85.09, "818":
