</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第10回</h1><div class="sub">No.271〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">seven</span><span class="ps">数</span></div><div class="ja">7；7つ（の）</div><div class="ex">We have <b>seven</b> days in a week.</div><div class="xj">1週間は7日あります。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">under</span><span class="ps">前</span></div><div class="ja">～の下に；～の下で</div><div class="ex">Look <b>under</b> the desk.</div><div class="xj">机の下を見て。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">cold</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">寒い；冷たい</div><div class="ex">It is very <b>cold</b> in Hokkaido in winter.</div><div class="xj">冬の北海道はとても寒いです。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">win</span><span class="ps">動</span></div><div class="ja">勝つ；（賞などを）得る</div><div class="ex">I want to <b>win</b> the game.</div><div class="xj">私はその試合に勝ちたいです。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">be good at ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～が得意である；～が上手である</div><div class="ex">We <b>are good at</b> soccer.</div><div class="xj">私たちはサッカーが得意です。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">Monday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">月曜日</div><div class="ex">I have a math test on <b>Monday</b>.</div><div class="xj">月曜日に数学のテストがあります。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">late</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">遅れた；遅い</div><div class="ex">Don’t be <b>late</b> for school.</div><div class="xj">学校に遅れないでね。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">communicate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">意思を伝え合う；連絡をとる</div><div class="ex">We <b>communicate</b> in English.</div><div class="xj">私たちは英語で意思を伝え合います。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">grandmother</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">祖母；おばあさん</div><div class="ex">I write letters to my <b>grandmother</b>.</div><div class="xj">私は祖母に手紙を書きます。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">support</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">支える；支援する；応援する</div><div class="ex">Many people <b>support</b> the team.</div><div class="xj">多くの人がそのチームを応援しています。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">cool</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">かっこいい；すずしい</div><div class="ex">Your shoes are <b>cool</b>!</div><div class="xj">あなたのくつはかっこいいね！</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">zoo</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">動物園</div><div class="ex">Let’s go to the <b>zoo</b>.</div><div class="xj">動物園へ行こう。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">evening</span><span class="ps">名</span></div><div class="ja">夕方；晩</div><div class="ex">I practice the guitar in the <b>evening</b>.</div><div class="xj">私は夕方にギターを練習します。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">grandfather</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">祖父；おじいさん</div><div class="ex">I visit my <b>grandfather</b> in summer.</div><div class="xj">私は夏に祖父をたずねます。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">math</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">数学</div><div class="ex">We have <b>math</b> on Mondays.</div><div class="xj">私たちは毎週月曜日に数学があります。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">down</span><span class="ps">副</span></div><div class="ja">下へ；下に</div><div class="ex">Don’t look <b>down</b>!</div><div class="xj">下を見ないで！</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">I’m sorry.</span><span class="ps">熟</span></div><div class="ja">ごめんなさい；すみません</div><div class="ex">A: Oh, <b>I’m sorry.</b><br>B: That’s OK.</div><div class="xj">A：あっ、ごめんなさい。B：だいじょうぶですよ。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">cute</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">かわいい</div><div class="ex">You have a <b>cute</b> cat.</div><div class="xj">あなたはかわいいネコを飼っていますね。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">sunny</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">晴れた；日の照る</div><div class="ex">It is <b>sunny</b> in Osaka.</div><div class="xj">大阪は晴れです。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">dish</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">料理；皿</div><div class="ex">I want to try this <b>dish</b>.</div><div class="xj">私はこの料理を食べてみたいです。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">doctor</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">医者</div><div class="ex">Are you a <b>doctor</b>?</div><div class="xj">あなたは医者ですか。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">blue</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">青い</div><div class="ex">I like the <b>blue</b> T-shirt.</div><div class="xj">私はその青いTシャツが好きです。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">once</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">1回；一度；かつて</div><div class="ex">I practice the piano <b>once</b> a week.</div><div class="xj">私は週に1回ピアノを練習します。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">warm</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">暖かい；温かい</div><div class="ex">Drink this <b>warm</b> milk.</div><div class="xj">この温かい牛乳を飲んで。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">ready</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">用意ができた；準備ができた</div><div class="ex">Are you <b>ready</b>?</div><div class="xj">準備はできていますか。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">someday</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">いつか</div><div class="ex">I want to visit Australia <b>someday</b>.</div><div class="xj">私はいつかオーストラリアを訪れたいです。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">concert</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">コンサート；演奏会</div><div class="ex">Let’s go to the <b>concert</b> together.</div><div class="xj">いっしょにコンサートに行こう。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">turn</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">曲がる；回す</div><div class="ex"><b>Turn</b> right at the bank.</div><div class="xj">銀行のところで右に曲がってください。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">Thursday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">木曜日</div><div class="ex">We have P.E. on <b>Thursdays</b>.</div><div class="xj">毎週木曜日に体育があります。</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">over there</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">向こうに；あそこに</div><div class="ex">Look at the tall tree <b>over there</b>.</div><div class="xj">向こうの高い木を見て。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../09/">← 第9回</a><a href="../11/">第11回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"271": 4.48, "272": 18.03, "273": 32.57, "274": 47.15, "275": 60.76, "276": 76.1, "277": 89.63, "278": 102.91, "279": 117.
