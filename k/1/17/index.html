</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第17回</h1><div class="sub">No.481〜510</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">us</span><span class="ps">代</span></div><div class="ja">私たちを；私たちに</div><div class="ex">Come with <b>us</b>.</div><div class="xj">私たちといっしょに来て。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">question</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">質問；問題</div><div class="ex">Can I ask a <b>question</b>?</div><div class="xj">質問してもいいですか。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">high school</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">高校</div><div class="ex">My brother is a <b>high school</b> student.</div><div class="xj">私の兄は高校生です。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">way</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">道；方法</div><div class="ex">Is this the <b>way</b> to the station?</div><div class="xj">これは駅へ行く道ですか。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">idea</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">考え；アイデア</div><div class="ex">That’s a good <b>idea</b>!</div><div class="xj">それはいい考えだね！</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">important</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">大切な；重要な</div><div class="ex">Breakfast is very <b>important</b>.</div><div class="xj">朝食はとても大切です。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">does</span><span class="ps">助</span></div><div class="ja">（疑問文で）～しますか；する（do の3単現）</div><div class="ex"><b>Does</b> Emi play the piano?</div><div class="xj">エミはピアノを弾きますか。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">sure</span><span class="ps">副</span></div><div class="ja">もちろん；いいですよ</div><div class="ex">A: Can I use this?<br>B: <b>Sure</b>.</div><div class="xj">A：これを使ってもいいですか。B：もちろん。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">interesting</span><span class="ps">形</span></div><div class="ja">おもしろい；興味深い</div><div class="ex">This book is very <b>interesting</b>.</div><div class="xj">この本はとてもおもしろいです。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">only</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">ただ～だけ；唯一の</div><div class="ex">He has <b>only</b> one brother.</div><div class="xj">彼には兄弟が1人だけいます。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">country</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">国</div><div class="ex">Canada is a big <b>country</b>.</div><div class="xj">カナダは大きな国です。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">where</span><span class="ps">副</span></div><div class="ja">どこに；どこで</div><div class="ex"><b>Where</b> do you want to go?</div><div class="xj">あなたはどこに行きたいですか。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">him</span><span class="ps">代</span></div><div class="ja">彼を；彼に</div><div class="ex">Do you know <b>him</b>?</div><div class="xj">あなたは彼を知っていますか。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">～, you know.</span><span class="ps">熟</span></div><div class="ja">～だよ；～でしょ</div><div class="ex">Emi is a good singer, <b>you know</b>.</div><div class="xj">エミは歌が上手なんだよ。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">work</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">働く；（機械が）動く</div><div class="ex">My mother <b>works</b> at a bank.</div><div class="xj">母は銀行で働いています。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">place</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">場所</div><div class="ex">Kyoto is a nice <b>place</b>.</div><div class="xj">京都はすてきな場所です。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">long</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">長い</div><div class="ex">Her hair is <b>long</b>.</div><div class="xj">彼女の髪は長いです。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">can’t</span><span class="ps">助</span></div><div class="ja">～できない（cannot の短縮形）</div><div class="ex">I <b>can’t</b> sing well.</div><div class="xj">私は上手に歌うことができません。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">join</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">参加する；加わる；（部に）入る</div><div class="ex">Can I <b>join</b> the game?</div><div class="xj">その試合に参加してもいいですか。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">hard</span><span class="ps">副</span></div><div class="ja">一生懸命に；熱心に</div><div class="ex">Ken studies <b>hard</b>.</div><div class="xj">ケンは一生懸命勉強します。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">feel</span><span class="ps">動</span></div><div class="ja">感じる；（～の）気分である</div><div class="ex">Can you <b>feel</b> the wind?</div><div class="xj">風を感じますか。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">house</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">家</div><div class="ex">Ken’s <b>house</b> has a big garden.</div><div class="xj">ケンの家には大きな庭があります。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">morning</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">朝；午前</div><div class="ex">My father drinks coffee every <b>morning</b>.</div><div class="xj">父は毎朝コーヒーを飲みます。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">month</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">（暦の）月</div><div class="ex">What <b>month</b> is it now?</div><div class="xj">今は何月ですか。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">Can you ～?</span><span class="ps">熟</span></div><div class="ja">～してくれませんか</div><div class="ex"><b>Can you</b> open the window?</div><div class="xj">窓を開けてくれませんか。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">experience</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">経験；体験</div><div class="ex">This trip is a great <b>experience</b> for me.</div><div class="xj">この旅行は私にとってすばらしい経験です。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">popular</span><span class="ps">形</span></div><div class="ja">人気のある</div><div class="ex">This song is <b>popular</b> in Japan.</div><div class="xj">この歌は日本で人気があります。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">Mr.</span><span class="ps">名</span></div><div class="ja">～さん；～先生（男性に）</div><div class="ex"><b>Mr.</b> Sato is my father’s friend.</div><div class="xj">佐藤さんは父の友だちです。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">surprised</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">驚いた</div><div class="ex">Why are you <b>surprised</b>?</div><div class="xj">あなたはなぜ驚いているのですか。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">second</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">2番目の；第2の</div><div class="ex">February is the <b>second</b> month of the year.</div><div class="xj">2月は1年の2番目の月です。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../16/">← 第16回</a><a href="../18/">第18回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"481": 4.72, "482": 18.44, "483": 31.7, "484": 45.25, "485": 58.77, "486": 72.0, "487": 85.94, "488": 101.84, "489": 117.71, "490": 132.12, "491": 146.14, "492": 159.43, "493": 172.25, "494": 185.14, "495": 199.86, "496": 214.01, "497": 227.29, "498": 240.01, "499": 254.63, "500": 267.95, "501": 282.09, "502": 296.28, "503": 309
