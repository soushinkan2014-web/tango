ss="en">hello</span><span class="ps">間</span></div><div class="ja">こんにちは；もしもし</div><div class="ex"><b>Hello</b>, are you Tom?</div><div class="xj">こんにちは、あなたがトムですか。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">teacher</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">先生；教師</div><div class="ex">Are you an English <b>teacher</b>?</div><div class="xj">あなたは英語の先生ですか。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">choose</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">選ぶ</div><div class="ex"><b>Choose</b> one card.</div><div class="xj">カードを1枚選んで。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">big</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">大きい</div><div class="ex">Your dog is very <b>big</b>!</div><div class="xj">あなたの犬はとても大きいね！</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">answer</span><span class="ps">動</span></div><div class="ja">答える；答え</div><div class="ex">Please <b>answer</b> my question.</div><div class="xj">私の質問に答えてください。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">That’s right.</span><span class="ps">熟</span></div><div class="ja">そのとおり；正解</div><div class="ex">A: Is this a cherry?<br>B: <b>That’s right.</b></div><div class="xj">A：これはさくらんぼですか。B：そのとおりです。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">world</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">世界</div><div class="ex">I want to visit many countries in the <b>world</b>.</div><div class="xj">私は世界のたくさんの国を訪れたいです。</div></button></li><li><button class="w" data-no="139"><div class="
