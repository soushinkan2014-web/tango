</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第27回</h1><div class="sub">No.781〜810</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../27.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="781"><div class="top"><span class="no">781</span><span class="en">dancing</span><span class="ps">名</span></div><div class="ja">ダンス；おどること</div><div class="ex">The <b>dancing</b> in the movie was great.</div><div class="xj">その映画のダンスはすばらしかったです。</div></button></li><li><button class="w" data-no="782"><div class="top"><span class="no">782</span><span class="en">jam</span><span class="ps">名</span></div><div class="ja">ジャム；渋滞</div><div class="ex">My mother made strawberry <b>jam</b>.</div><div class="xj">母はイチゴのジャムを作りました。</div></button></li><li><button class="w" data-no="783"><div class="top"><span class="no">783</span><span class="en">textbook</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">教科書</div><div class="ex">I put my math <b>textbook</b> in my bag.</div><div class="xj">私は数学の教科書をかばんに入れました。</div></button></li><li><button class="w" data-no="784"><div class="top"><span class="no">784</span><span class="en">Sounds good.</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">いいですね</div><div class="ex">A: Let’s eat lunch here.<br>B: <b>Sounds good.</b></div><div class="xj">A：ここで昼食を食べよう。B：いいですね。</div></button></li><li><button class="w" data-no="785"><div class="top"><span class="no">785</span><span class="en">bridge</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">橋</div><div class="ex">The bus went over a long <b>bridge</b>.</div><div class="xj">バスは長い橋を渡りました。</div></button></li><li><button class="w" data-no="786"><div class="top"><span class="no">786</span><span class="en">chorus</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">合唱</div><div class="ex">Emi sings in the school <b>chorus</b>.</div><div class="xj">エミは学校の合唱部で歌っています。</div></button></li><li><button class="w" data-no="787"><div class="top"><span class="no">787</span><span class="en">corner</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">角</div><div class="ex">The post office is on the <b>corner</b>.</div><div class="xj">郵便局はその角にあります。</div></button></li><li><button class="w" data-no="788"><div class="top"><span class="no">788</span><span class="en">invent</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">発明する</div><div class="ex">Who <b>invented</b> the telephone?</div><div class="xj">だれが電話を発明しましたか。</div></button></li><li><button class="w" data-no="789"><div class="top"><span class="no">789</span><span class="en">sandwich</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">サンドイッチ</div><div class="ex">I ate a ham <b>sandwich</b> for lunch.</div><div class="xj">私は昼食にハムのサンドイッチを食べました。</div></button></li><li><button class="w" data-no="790"><div class="top"><span class="no">790</span><span class="en">last night</span><span class="ps">熟</span></div><div class="ja">昨夜；昨晩</div><div class="ex">I watched a soccer game <b>last night</b>.</div><div class="xj">私は昨夜サッカーの試合を見ました。</div></button></li><li><button class="w" data-no="791"><div class="top"><span class="no">791</span><span class="en">cream</span><span class="ps">名</span></div><div class="ja">クリーム</div><div class="ex">My mother put <b>cream</b> on the cake.</div><div class="xj">母はケーキにクリームをのせました。</div></button></li><li><button class="w" data-no="792"><div class="top"><span class="no">792</span><span class="en">Europe</span><span class="ps">名</span></div><div class="ja">ヨーロッパ</div><div class="ex">Mr. Sato visited <b>Europe</b> last summer.</div><div class="xj">佐藤さんは去年の夏にヨーロッパを訪れました。</div></button></li><li><button class="w" data-no="793"><div class="top"><span class="no">793</span><span class="en">painting</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">絵（をかくこと）</div><div class="ex">We saw a famous <b>painting</b> at the museum.</div><div class="xj">私たちは美術館で有名な絵を見ました。</div></button></li><li><button class="w" data-no="794"><div class="top"><span class="no">794</span><span class="en">Korea</span><span class="ps">名</span></div><div class="ja">韓国；朝鮮</div><div class="ex">We ate delicious food in <b>Korea</b>.</div><div class="xj">私たちは韓国でおいしい料理を食べました。</div></button></li><li><button class="w" data-no="795"><div class="top"><span class="no">795</span><span class="en">page</span><span class="ps">名</span></div><div class="ja">ページ</div><div class="ex">Open your books to <b>page</b> ten.</div><div class="xj">本の10ページを開きなさい。</div></button></li><li><button class="w" data-no="796"><div class="top"><span class="no">796</span><span class="en">on TV</span><span class="ps">熟</span></div><div class="ja">テレビで</div><div class="ex">My brother watched the game <b>on TV</b>.</div><div class="xj">兄はテレビでその試合を見ました。</div></button></li><li><button class="w" data-no="797"><div class="top"><span class="no">797</span><span class="en">reach</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">着く；届く</div><div class="ex">We <b>reached</b> the top of the mountain.</div><div class="xj">私たちは山の頂上に着きました。</div></button></li><li><button class="w" data-no="798"><div class="top"><span class="no">798</span><span class="en">wind</span><span class="ps">名</span></div><div class="ja">風</div><div class="ex">The <b>wind</b> was strong yesterday.</div><div class="xj">昨日は風が強かったです。</div></button></li><li><button class="w" data-no="799"><div class="top"><span class="no">799</span><span class="en">skiing</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スキー</div><div class="ex">Nagano is famous for <b>skiing</b>.</div><div class="xj">長野はスキーで有名です。</div></button></li><li><button class="w" data-no="800"><div class="top"><span class="no">800</span><span class="en">Africa</span><span class="ps">名</span></div><div class="ja">アフリカ</div><div class="ex">My uncle worked in <b>Africa</b> last year.</div><div class="xj">おじは去年、アフリカで働きました。</div></button></li><li><button class="w" data-no="801"><div class="top"><span class="no">801</span><span class="en">Don’t worry.</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">心配しないで</div><div class="ex">A: I can’t find my key.<br>B: <b>Don’t worry.</b> Let’s look for it.</div><div class="xj">A：かぎが見つからないんだ。B：心配しないで。さがそう。</div></button></li><li><button class="w" data-no="802"><div class="top"><span class="no">802</span><span class="en">weren’t</span><span class="ps">動</span></div><div class="ja">（～で）なかった；（～に）いなかった（were not の短縮形）</div><div class="ex">We <b>weren’t</b> at home yesterday.</div><div class="xj">私たちは昨日、家にいませんでした。</div></button></li><li><button class="w" data-no="803"><div class="top"><span class="no">803</span><span class="en">key</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">かぎ</div><div class="ex">Tom opened the door with a <b>key</b>.</div><div class="xj">トムはかぎでドアを開けました。</div></button></li><li><button class="w" data-no="804"><div class="top"><span class="no">804</span><span class="en">match</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">試合</div><div class="ex">We watched a tennis <b>match</b> on TV.</div><div class="xj">私たちはテレビでテニスの試合を見ました。</div></button></li><li><button class="w" data-no="805"><div class="top"><span class="no">805</span><span class="en">aquarium</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">水族館</div><div class="ex">We saw many fish at the <b>aquarium</b>.</div><div class="xj">私たちは水族館でたくさんの魚を見ました。</div></button></li><li><button class="w" data-no="806"><div class="top"><span class="no">806</span><span class="en">Asia</span><span class="ps">名</span></div><div class="ja">アジア</div><div class="ex">Japan is in <b>Asia</b>.</div><div class="xj">日本はアジアにあります。</div></button></li><li><button class="w" data-no="807"><div class="top"><span class="no">807</span><span class="en">at night</span><span class="ps">熟</span></div><div class="ja">夜に</div><div class="ex">My father works <b>at night</b>.</div><div class="xj">父は夜に働きます。</div></button></li><li><button class="w" data-no="808"><div class="top"><span class="no">808</span><span class="en">Germany</span><span class="ps">名</span></div><div class="ja">ドイツ</div><div class="ex">My music teacher studied in <b>Germany</b>.</div><div class="xj">音楽の先生はドイツで勉強しました。</div></button></li><li><button class="w" data-no="809"><div class="top"><span class="no">809</span><span class="en">kitchen</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">台所</div><div class="ex">My mother is cooking in the <b>kitchen</b>.</div><div class="xj">母は台所で料理をしています。</div></button></li><li><button class="w" data-no="810"><div class="top"><span class="no">810</span><span class="en">elephant</span><span class="ps">名</span></div><div class="ja">ゾウ</div><div class="ex">A baby <b>elephant</b> is drinking water.</div><div class="xj">赤ちゃんゾウが水を飲んでいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../26/">← 第26回</a><a href="../28/">第28回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"781": 4.91, "782": 18.49, "783": 31.64, "784": 45.19, "785": 60.64, "786": 73.64, "787": 86.79, "788": 99.6, "789": 112.18
