</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第12回</h1><div class="sub">No.331〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">guitar</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ギター</div><div class="ex">I play the <b>guitar</b> in my room.</div><div class="xj">私は自分の部屋でギターをひきます。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">ride</span><span class="ps">動</span></div><div class="ja">乗る</div><div class="ex">I <b>ride</b> my bike to the park.</div><div class="xj">私は自転車に乗って公園へ行きます。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">September</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">9月</div><div class="ex">My birthday is in <b>September</b>.</div><div class="xj">私の誕生日は9月です。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">careful</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">注意深い；気をつける</div><div class="ex">Please be <b>careful</b> on the road.</div><div class="xj">道路では気をつけてください。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">close</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">閉める；閉じる</div><div class="ex"><b>Close</b> the window, please.</div><div class="xj">窓を閉めてください。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">rainy</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">雨の；雨の多い</div><div class="ex">June is a <b>rainy</b> month in Japan.</div><div class="xj">日本では6月は雨の多い月です。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">city hall</span><span class="ps">名</span></div><div class="ja">市役所</div><div class="ex">The <b>city hall</b> is near the station.</div><div class="xj">市役所は駅の近くにあります。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">draw</span><span class="ps">動</span></div><div class="ja">（線で絵を）描く；引く</div><div class="ex">I <b>draw</b> pictures of animals.</div><div class="xj">私は動物の絵を描きます。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">ball</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ボール；球</div><div class="ex">I have a new soccer <b>ball</b>.</div><div class="xj">私は新しいサッカーボールを持っています。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">proud</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">誇りに思う；誇らしい</div><div class="ex">We are <b>proud</b> of our school.</div><div class="xj">私たちは自分たちの学校を誇りに思っています。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">sky</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">空</div><div class="ex">Look at the <b>sky</b>!</div><div class="xj">空を見て！</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">yours</span><span class="ps">代</span></div><div class="ja">あなたのもの</div><div class="ex">Is this pen <b>yours</b>?</div><div class="xj">このペンはあなたのものですか。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">communication</span><span class="ps">名</span></div><div class="ja">コミュニケーション；意思の疎通</div><div class="ex">We use English for <b>communication</b>.</div><div class="xj">私たちはコミュニケーションのために英語を使います。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">juice</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ジュース</div><div class="ex">I drink apple <b>juice</b> every morning.</div><div class="xj">私は毎朝リンゴジュースを飲みます。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">date</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">日付</div><div class="ex">Write the <b>date</b> on your paper.</div><div class="xj">紙に日付を書いてください。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">October</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">10月</div><div class="ex">Halloween is in <b>October</b>.</div><div class="xj">ハロウィーンは10月にあります。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">May</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">5月</div><div class="ex">Mother’s Day is in <b>May</b>.</div><div class="xj">母の日は5月にあります。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">fall</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">秋</div><div class="ex">The mountains are beautiful in the <b>fall</b>.</div><div class="xj">秋は山がきれいです。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">hamburger</span><span class="ps">名</span></div><div class="ja">ハンバーガー</div><div class="ex">Let’s eat <b>hamburgers</b> for lunch.</div><div class="xj">昼ごはんにハンバーガーを食べよう。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">go down</span><span class="ps">熟</span></div><div class="ja">下りる；（太陽が）沈む</div><div class="ex">Let’s <b>go down</b> the stairs.</div><div class="xj">階段を下りよう。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">orange</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">オレンジ；オレンジ色</div><div class="ex">Let’s eat <b>oranges</b> after lunch.</div><div class="xj">昼ごはんのあとにオレンジを食べよう。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">stand</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">立つ；立っている</div><div class="ex">Please <b>stand</b> here.</div><div class="xj">ここに立ってください。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">cup</span><span class="ps">名</span></div><div class="ja">カップ；茶わん</div><div class="ex">We need five <b>cups</b>.</div><div class="xj">私たちはカップが5つ必要です。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">relax</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">くつろぐ；リラックスする</div><div class="ex">I <b>relax</b> in the bath.</div><div class="xj">私はおふろでくつろぎます。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">black</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">黒い</div><div class="ex">I want a <b>black</b> cap.</div><div class="xj">私は黒いぼうしがほしいです。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">view</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">眺め；景色</div><div class="ex">The <b>view</b> from my room is beautiful.</div><div class="xj">私の部屋からの眺めはきれいです。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">beach</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">浜辺；ビーチ</div><div class="ex">Let’s walk on the <b>beach</b>.</div><div class="xj">浜辺を歩こう。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">apple</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">りんご</div><div class="ex">I eat an <b>apple</b> for breakfast.</div><div class="xj">私は朝食にりんごを食べます。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">June</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">6月</div><div class="ex">We have a lot of rain in <b>June</b>.</div><div class="xj">6月は雨が多いです。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">miss</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（いなくて）さびしく思う；乗り遅れる</div><div class="ex">I <b>miss</b> you very much.</div><div class="xj">あなたがいなくてとてもさびしいです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"331": 4.62, "332": 17.41, "333": 30.15, "334": 43.18, "335": 56.76, "336": 70.05, "337": 83.7, "338": 97.18, "339": 110.88, "340": 123.72, "341": 137.3, "342": 149.32, "343": 161.58, "344": 176.5,
