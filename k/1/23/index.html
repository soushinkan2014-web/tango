</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第23回</h1><div class="sub">No.661〜690</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">ours</span><span class="ps">代</span></div><div class="ja">私たちのもの</div><div class="ex">This classroom is <b>ours</b>.</div><div class="xj">この教室は私たちのものです。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">scenery</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">景色；風景</div><div class="ex">I like the <b>scenery</b> of this town.</div><div class="xj">私はこの町の景色が好きです。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">lemon</span><span class="ps">名</span></div><div class="ja">レモン</div><div class="ex">I like <b>lemon</b> tea.</div><div class="xj">私はレモンティーが好きです。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">round</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">丸い</div><div class="ex">The earth is <b>round</b>.</div><div class="xj">地球は丸いです。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">snowy</span><span class="ps">形</span></div><div class="ja">雪の多い；雪の降る</div><div class="ex">Sapporo is <b>snowy</b> in winter.</div><div class="xj">札幌は冬に雪が多いです。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">eighty</span><span class="ps">数</span></div><div class="ja">80（の）</div><div class="ex">My grandfather is <b>eighty</b> years old.</div><div class="xj">私の祖父は80歳です。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">sixth</span><span class="ps">数</span></div><div class="ja">6番目（の）；（日付の）6日</div><div class="ex">My sister is in the <b>sixth</b> grade.</div><div class="xj">私の妹は6年生です。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">be famous for ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～で有名である</div><div class="ex">Okinawa <b>is famous for</b> its beautiful sea.</div><div class="xj">沖縄は美しい海で有名です。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">stair</span><span class="ps">名</span></div><div class="ja">（stairs で）階段</div><div class="ex">Go up the <b>stairs</b>, please.</div><div class="xj">階段を上がってください。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">tiger</span><span class="ps">名</span></div><div class="ja">トラ</div><div class="ex"><b>Tigers</b> are very strong.</div><div class="xj">トラはとても強いです。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">cow</span><span class="ps">名</span></div><div class="ja">牛；雌牛</div><div class="ex">That <b>cow</b> gives a lot of milk.</div><div class="xj">あの牛はたくさん牛乳を出します。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">eraser</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">消しゴム</div><div class="ex">Can I use your <b>eraser</b>?</div><div class="xj">あなたの消しゴムを使ってもいいですか。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">kangaroo</span><span class="ps">名</span></div><div class="ja">カンガルー</div><div class="ex"><b>Kangaroos</b> can jump very high.</div><div class="xj">カンガルーはとても高く跳ぶことができます。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">pull</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">引く；引っぱる</div><div class="ex"><b>Pull</b> the rope hard!</div><div class="xj">ロープを強く引いて！</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">grape</span><span class="ps">名</span></div><div class="ja">ブドウ</div><div class="ex">I like <b>grapes</b> very much.</div><div class="xj">私はブドウが大好きです。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">hers</span><span class="ps">代</span></div><div class="ja">彼女のもの</div><div class="ex">This bag is <b>hers</b>.</div><div class="xj">このかばんは彼女のものです。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">shower</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">シャワー；にわか雨</div><div class="ex">I take a <b>shower</b> every morning.</div><div class="xj">私は毎朝シャワーを浴びます。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">ninth</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">9番目（の）；（日付の）9日</div><div class="ex">September is the <b>ninth</b> month of the year.</div><div class="xj">9月は1年の9番目の月です。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">What’s the matter?</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">どうしたの？</div><div class="ex">A: <b>What’s the matter?</b><br>B: I’m hungry.</div><div class="xj">A：どうしたの？B：おなかがすいたよ。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">theirs</span><span class="ps">代</span></div><div class="ja">彼らのもの；彼女らのもの</div><div class="ex">That house is <b>theirs</b>.</div><div class="xj">あの家は彼らのものです。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">turtle</span><span class="ps">名</span></div><div class="ja">カメ</div><div class="ex">My brother has two <b>turtles</b>.</div><div class="xj">私の兄はカメを2匹飼っています。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">flute</span><span class="ps">名</span></div><div class="ja">フルート</div><div class="ex">I want to play the <b>flute</b>.</div><div class="xj">私はフルートを吹きたいです。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">butterfly</span><span class="ps">名</span></div><div class="ja">チョウ</div><div class="ex">We can see many <b>butterflies</b> in spring.</div><div class="xj">春にはたくさんのチョウが見られます。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">drone</span><span class="ps">名</span></div><div class="ja">ドローン</div><div class="ex">Can you fly a <b>drone</b>?</div><div class="xj">あなたはドローンを飛ばせますか。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">fifteenth</span><span class="ps">数</span></div><div class="ja">15番目（の）；（日付の）15日</div><div class="ex">We have a test on the <b>fifteenth</b>.</div><div class="xj">15日にテストがあります。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">ruler</span><span class="ps">名</span></div><div class="ja">定規</div><div class="ex">Emi uses a <b>ruler</b> in math class.</div><div class="xj">エミは数学の授業で定規を使います。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">shoulder</span><span class="ps">名</span></div><div class="ja">肩</div><div class="ex">Ken carries a big bag on his <b>shoulder</b>.</div><div class="xj">ケンは大きなかばんを肩にかけて運びます。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">sunrise</span><span class="ps">名</span></div><div class="ja">日の出</div><div class="ex">What time is <b>sunrise</b> tomorrow?</div><div class="xj">明日の日の出は何時ですか。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">pudding</span><span class="ps">名</span></div><div class="ja">プリン</div><div class="ex">Which <b>pudding</b> do you want?</div><div class="xj">どちらのプリンがほしいですか。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">table tennis</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">卓球</div><div class="ex">Can you play <b>table tennis</b>?</div><div class="xj">あなたは卓球ができますか。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../22/">← 第22回</a><a href="../24/">第24回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"661": 4.88, "662": 17.82, "663": 31.35, "664": 43.63, "665": 55.87, "666": 70.12, "667": 83.32, "668": 97.57, "669": 113.16, "670": 126.74, "671": 139.24, "672": 152.42, "673": 164.84, "674": 178.06, "675": 190.56, "676": 203.18, "677": 215.56, "678": 229.05, "679": 243.61, "680": 258.41, "681": 271.97, "682": 284.71, "683": 296.99, "684": 310.43, "685": 322.59, "686": 337.47, "687": 350.88, "688": 364.29, "689": 377.9, "690": 390.04}, "TE": {"661": 6.78, "662": 19.81,
