span></div><div class="ja">もの；こと</div><div class="ex">I have many <b>things</b> in my bag.</div><div class="xj">私はかばんにたくさんのものを入れています。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">other</span><span class="ps">形</span></div><div class="ja">ほかの；別の</div><div class="ex">Do you have any <b>other</b> questions?</div><div class="xj">何かほかの質問はありますか。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">first</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">最初の；初めての</div><div class="ex">This is my <b>first</b> trip to Kyoto.</div><div class="xj">これは私の初めての京都旅行です。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">no</span><span class="ps">副</span></div><div class="ja">いいえ</div><div class="ex">A: Are you hungry?<br>B: <b>No</b>, I’m not.</div><div class="xj">A：おなかはすいていますか。B：いいえ、すいていません。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">year</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">年；～歳</div><div class="ex">I go to Okinawa every <b>year</b>.</div><div class="xj">私は毎年沖縄に行きます。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">an</span><span class="ps">冠</span></div><div class="ja">1つの；ある</div><div class="ex">I want <b>an</b> egg.</div><div class="xj">私は卵が1つほしいです。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">that’s</span><span class="ps">代</span></div><div class="ja">あれは～です；それは～です（that is の短縮形）</div><div class="ex"><b>That’s</b> my school.</div><div class="xj">あれは私の学校です。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">Japan</span><span class="ps">名</span></div><div class="ja">日本</div><div class="ex">Do you like <b>Japan</b>?</div><div class="xj">あなたは日本が好きですか。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">student</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">生徒；学生</div><div class="ex">We are <b>students</b> of this school.</div><div class="xj">私たちはこの学校の生徒です。</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">oh</span><span class="ps">間</span></div><div class="ja">おお；ああ；あら</div><div class="ex"><b>Oh</b>, you are tall!</div><div class="xj">おお、あなたは背が高いですね！</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">every day</span><span class="ps">熟</span></div><div class="ja">毎日</div><div class="ex">I practice the piano <b>every day</b>.</div><div class="xj">私は毎日ピアノを練習します。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">her</span><span class="ps">代</span></div><div class="ja">彼女の；彼女を</div><div class="ex">I like <b>her</b> songs.</div><div class="xj">私は彼女の歌が好きです。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">their</span><span class="ps">代</span></div><div class="ja">彼らの；彼女らの；それらの</div><div class="ex">I know <b>their</b> names.</div><div class="xj">私は彼らの名前を知っています。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">really</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">本当に</div><div class="ex">I <b>really</b> like soccer.</div><div class="xj">私はサッカーが本当に好きです。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">today</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">今日（は）</div><div class="ex">I don’t have club practice <b>today</b>.</div><div class="xj">今日は部活の練習がありません。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">his</span><span class="ps">代</span></div><div class="ja">彼の；彼のもの</div><div class="ex">This is <b>his</b> bike.</div><div class="xj">これは彼の自転車です。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">right</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">正しい；右の</div><div class="ex">You are <b>right</b>.</div><div class="xj">あなたは正しいです。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">before</span><span class="ps">前</span><span class="ek">英5</span></div><div class="ja">～の前に</div><div class="ex">Wash your hands <b>before</b> lunch.</div><div class="xj">昼食の前に手を洗いなさい。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">two</span><span class="ps">数</span></div><div class="ja">2（の）</div><div class="ex">I have <b>two</b> brothers.</div><div class="xj">私には兄弟が2人います。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">show</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ショー；見せ物</div><div class="ex">Let’s see the magic <b>show</b>.</div><div class="xj">マジックショーを見よう。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">friend</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">友だち</div><div class="ex">I have many <b>friends</b> in Canada.</div><div class="xj">私にはカナダにたくさんの友だちがいます。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">please</span><span class="ps">副</span></div><div class="ja">どうぞ；お願いします</div><div class="ex"><b>Please</b> sit down.</div><div class="xj">どうぞ座ってください。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">very much</span><span class="ps">熟</span></div><div class="ja">とても；たいへん</div><div class="ex">I like music <b>very much</b>.</div><div class="xj">私は音楽がとても好きです。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">try</span><span class="ps">動</span></div><div class="ja">やってみる；試す</div><div class="ex">Let’s <b>try</b> again.</div><div class="xj">もう一度やってみよう。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">new</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">新しい</div><div class="ex">Are you a <b>new</b> student?</div><div class="xj">あなたは新しい生徒ですか。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">let’s</span><span class="ps">熟</span></div><div class="ja">～しよう（let us の短縮形）</div><div class="ex"><b>Let’s</b> go to the gym.</div><div class="xj">体育館へ行きましょう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"61": 4.45, "62": 18.04, "63": 33.31, "64": 46.9, "65": 61.27, "66": 74.8, "67": 88.27, "68": 102.52, "69": 118.09, "70": 132.43, "71": 145.15, "72": 161.17, "73": 173.74, "74": 187.5, "75": 200.42, "76": 214.2, "77": 227.72, "78": 241.27, "79": 254.29, "80": 267.73, "81": 280.97, "82": 294.03, "83": 307.83, "84": 320.82, "85": 334.09, "86": 347.51, "87": 360.79, "88": 374.39, "89": 387.71, "90": 400.42}, "TE": {"61": 6.64, "62": 20.23, "63": 35.49, "64": 49.08, "65": 63.45, "66": 76.97, "67": 90.45, "68": 104.71, "69": 120.28, "70": 134.62, "71": 147.34, "72": 163.35, "73": 175.92, "7
