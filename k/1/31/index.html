</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第31回</h1><div class="sub">No.901〜929</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../31.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="901"><div class="top"><span class="no">901</span><span class="en">find out</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">わかる；（調べて）見つけ出す</div><div class="ex">I <b>found out</b> his name.</div><div class="xj">私は彼の名前がわかりました。</div></button></li><li><button class="w" data-no="902"><div class="top"><span class="no">902</span><span class="en">ant</span><span class="ps">名</span></div><div class="ja">アリ</div><div class="ex"><b>Ants</b> are small but very strong.</div><div class="xj">アリは小さいけれど、とても力持ちです。</div></button></li><li><button class="w" data-no="903"><div class="top"><span class="no">903</span><span class="en">cabbage</span><span class="ps">名</span></div><div class="ja">キャベツ</div><div class="ex">Rabbits ate the <b>cabbage</b> in our garden.</div><div class="xj">ウサギが私たちの庭のキャベツを食べました。</div></button></li><li><button class="w" data-no="904"><div class="top"><span class="no">904</span><span class="en">cucumber</span><span class="ps">名</span></div><div class="ja">キュウリ</div><div class="ex">My grandfather grows <b>cucumbers</b> in his garden.</div><div class="xj">祖父は庭でキュウリを育てています。</div></button></li><li><button class="w" data-no="905"><div class="top"><span class="no">905</span><span class="en">melon</span><span class="ps">名</span></div><div class="ja">メロン</div><div class="ex">The <b>melon</b> was sweet and delicious.</div><div class="xj">そのメロンは甘くておいしかったです。</div></button></li><li><button class="w" data-no="906"><div class="top"><span class="no">906</span><span class="en">pants</span><span class="ps">名</span></div><div class="ja">ズボン</div><div class="ex">These <b>pants</b> are too long.</div><div class="xj">このズボンは長すぎます。</div></button></li><li><button class="w" data-no="907"><div class="top"><span class="no">907</span><span class="en">What’s wrong?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">どうしたのですか</div><div class="ex">A: <b>What’s wrong?</b><br>B: I can’t find my notebook.</div><div class="xj">A：どうしたのですか。B：ノートが見つからないんです。</div></button></li><li><button class="w" data-no="908"><div class="top"><span class="no">908</span><span class="en">pig</span><span class="ps">名</span></div><div class="ja">ブタ</div><div class="ex">My uncle has many <b>pigs</b>.</div><div class="xj">おじはたくさんのブタを飼っています。</div></button></li><li><button class="w" data-no="909"><div class="top"><span class="no">909</span><span class="en">pork</span><span class="ps">名</span></div><div class="ja">豚肉</div><div class="ex">This soup has <b>pork</b> in it.</div><div class="xj">このスープには豚肉が入っています。</div></button></li><li><button class="w" data-no="910"><div class="top"><span class="no">910</span><span class="en">scissors</span><span class="ps">名</span></div><div class="ja">はさみ</div><div class="ex">Can I use your <b>scissors</b>?</div><div class="xj">あなたのはさみを使ってもいいですか。</div></button></li><li><button class="w" data-no="911"><div class="top"><span class="no">911</span><span class="en">soda</span><span class="ps">名</span></div><div class="ja">炭酸飲料；ソーダ</div><div class="ex">Tom drank a cold <b>soda</b> after the game.</div><div class="xj">トムは試合のあと、冷たい炭酸飲料を飲みました。</div></button></li><li><button class="w" data-no="912"><div class="top"><span class="no">912</span><span class="en">say goodbye</span><span class="ps">熟</span></div><div class="ja">さよならを言う</div><div class="ex">We <b>said goodbye</b> at the station.</div><div class="xj">私たちは駅でさよならを言いました。</div></button></li><li><button class="w" data-no="913"><div class="top"><span class="no">913</span><span class="en">belt</span><span class="ps">名</span></div><div class="ja">ベルト</div><div class="ex">Ken is looking for his <b>belt</b>.</div><div class="xj">ケンは自分のベルトをさがしています。</div></button></li><li><button class="w" data-no="914"><div class="top"><span class="no">914</span><span class="en">fox</span><span class="ps">名</span></div><div class="ja">キツネ</div><div class="ex">A <b>fox</b> came into our garden.</div><div class="xj">1匹のキツネが私たちの庭に入ってきました。</div></button></li><li><button class="w" data-no="915"><div class="top"><span class="no">915</span><span class="en">frog</span><span class="ps">名</span></div><div class="ja">カエル</div><div class="ex">I found a small <b>frog</b> in the pool.</div><div class="xj">私はプールで小さなカエルを見つけました。</div></button></li><li><button class="w" data-no="916"><div class="top"><span class="no">916</span><span class="en">Peru</span><span class="ps">名</span></div><div class="ja">ペルー</div><div class="ex"><b>Peru</b> is a country in South America.</div><div class="xj">ペルーは南アメリカの国です。</div></button></li><li><button class="w" data-no="917"><div class="top"><span class="no">917</span><span class="en">pineapple</span><span class="ps">名</span></div><div class="ja">パイナップル</div><div class="ex">We ate sweet <b>pineapple</b> in Okinawa.</div><div class="xj">私たちは沖縄で甘いパイナップルを食べました。</div></button></li><li><button class="w" data-no="918"><div class="top"><span class="no">918</span><span class="en">put on ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～を着る；～を身につける</div><div class="ex">Tom <b>put on</b> his jacket and went out.</div><div class="xj">トムは上着を着て出かけました。</div></button></li><li><button class="w" data-no="919"><div class="top"><span class="no">919</span><span class="en">toilet</span><span class="ps">名</span></div><div class="ja">トイレ</div><div class="ex">Ken cleaned the <b>toilet</b> at home.</div><div class="xj">ケンは家でトイレを掃除しました。</div></button></li><li><button class="w" data-no="920"><div class="top"><span class="no">920</span><span class="en">knee</span><span class="ps">名</span></div><div class="ja">ひざ</div><div class="ex">Ken put his hands on his <b>knees</b>.</div><div class="xj">ケンはひざに手を置きました。</div></button></li><li><button class="w" data-no="921"><div class="top"><span class="no">921</span><span class="en">lamp</span><span class="ps">名</span></div><div class="ja">電灯；ランプ</div><div class="ex">Emi turned on the <b>lamp</b> by the bed.</div><div class="xj">エミはベッドのそばの電灯をつけました。</div></button></li><li><button class="w" data-no="922"><div class="top"><span class="no">922</span><span class="en">octopus</span><span class="ps">名</span></div><div class="ja">タコ</div><div class="ex">An <b>octopus</b> has eight arms.</div><div class="xj">タコには8本のうでがあります。</div></button></li><li><button class="w" data-no="923"><div class="top"><span class="no">923</span><span class="en">Can I help you?</span><span class="ps">熟</span></div><div class="ja">いらっしゃいませ；何かお手伝いしましょうか</div><div class="ex">A: <b>Can I help you?</b><br>B: Yes. I’m looking for a bag.</div><div class="xj">A：いらっしゃいませ。B：はい。かばんをさがしています。</div></button></li><li><button class="w" data-no="924"><div class="top"><span class="no">924</span><span class="en">Greece</span><span class="ps">名</span></div><div class="ja">ギリシャ</div><div class="ex">My English teacher is from <b>Greece</b>.</div><div class="xj">私の英語の先生はギリシャ出身です。</div></button></li><li><button class="w" data-no="925"><div class="top"><span class="no">925</span><span class="en">stapler</span><span class="ps">名</span></div><div class="ja">ホチキス</div><div class="ex">I bought a new <b>stapler</b> yesterday.</div><div class="xj">私は昨日、新しいホチキスを買いました。</div></button></li><li><button class="w" data-no="926"><div class="top"><span class="no">926</span><span class="en">toe</span><span class="ps">名</span></div><div class="ja">足の指</div><div class="ex">Emi put her <b>toes</b> in the water.</div><div class="xj">エミは足の指を水に入れました。</div></button></li><li><button class="w" data-no="927"><div class="top"><span class="no">927</span><span class="en">toothache</span><span class="ps">名</span></div><div class="ja">歯痛</div><div class="ex">Yuki has a <b>toothache</b> today.</div><div class="xj">ユキは今日、歯が痛いです。</div></button></li><li><button class="w" data-no="928"><div class="top"><span class="no">928</span><span class="en">yogurt</span><span class="ps">名</span></div><div class="ja">ヨーグルト</div><div class="ex">My sister likes strawberry <b>yogurt</b>.</div><div class="xj">妹はイチゴヨーグルトが好きです。</div></button></li><li><button class="w" data-no="929"><div class="top"><span class="no">929</span><span class="en">take a walk</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">散歩する</div><div class="ex">We <b>took a walk</b> in the park.</div><div class="xj">私たちは公園を散歩しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../30/">← 第30回</a><a href="../">回の一覧</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"901": 4.96, "902": 18.92, "903": 32.04, "904": 45.26, "905": 59.18, "906": 72.18, "907": 84.73, "908": 100.25, "909": 113.02, "910": 125.44, "911": 138.23, "912": 152.87, "913": 166.5, "914": 179.02, "915": 191.98, "916": 205.1, "917": 218.39, "918": 231.9, "919": 246.92, "920": 259.78, "921": 272.71, "922": 286.2, "923": 299.7, "924": 318.58, "925": 331.73, "926": 344.95, "927": 357.69, "928": 370.84, "929": 383.84}, "TE": {"901": 7.02, "902": 20.79, "903": 33.96, "904": 47.23, "905": 61.05, "906": 74.08, "907": 86.7, "908": 102.12, "909": 114.89, "910": 127.56, "911": 140.2, "912": 155.08, "913": 168.37, "914": 181.01, "915": 193.85, "916": 206.97, "917": 220.31, "918":
