</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第25回</h1><div class="sub">No.721〜750</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../25.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">enough</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">十分な</div><div class="ex">We had <b>enough</b> food for everyone.</div><div class="xj">みんなの分の十分な食べ物がありました。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">into</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～の中へ</div><div class="ex">The cat went <b>into</b> the box.</div><div class="xj">ネコは箱の中へ入りました。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">in the morning</span><span class="ps">熟</span></div><div class="ja">午前中に；朝に</div><div class="ex">We cleaned the park <b>in the morning</b>.</div><div class="xj">私たちは午前中に公園を掃除しました。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">volunteer</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ボランティア</div><div class="ex">We were <b>volunteers</b> at the city library.</div><div class="xj">私たちは市立図書館のボランティアでした。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">cooking</span><span class="ps">名</span></div><div class="ja">料理</div><div class="ex">Everyone liked Ken’s <b>cooking</b>.</div><div class="xj">みんながケンの料理を気に入りました。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">Canada</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">カナダ</div><div class="ex">My aunt lived in <b>Canada</b> for two years.</div><div class="xj">おばは2年間カナダに住んでいました。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">wasn’t</span><span class="ps">動</span></div><div class="ja">（～で）なかった（was not の短縮形）</div><div class="ex">The test <b>wasn’t</b> difficult.</div><div class="xj">テストは難しくありませんでした。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">meeting</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">会議；集まり</div><div class="ex">We had a club <b>meeting</b> after school.</div><div class="xj">放課後、部の会議がありました。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">talk to ～</span><span class="ps">熟</span></div><div class="ja">～に話しかける</div><div class="ex">Yuki <b>talked to</b> the new student.</div><div class="xj">ユキは新しい生徒に話しかけました。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">ate</span><span class="ps">動</span></div><div class="ja">食べた（eat の過去形）</div><div class="ex">I <b>ate</b> watermelon at the beach.</div><div class="xj">私は海辺ですいかを食べました。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">yen</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">円（お金の単位）</div><div class="ex">This cap was one thousand <b>yen</b>.</div><div class="xj">このぼうしは千円でした。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">until</span><span class="ps">前</span><span class="ek">英4</span></div><div class="ja">～まで（ずっと）</div><div class="ex">I studied <b>until</b> ten last night.</div><div class="xj">私は昨夜10時まで勉強しました。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">sleep</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">眠る</div><div class="ex">The baby is <b>sleeping</b> now.</div><div class="xj">赤ちゃんは今眠っています。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">How long ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">どのくらい長く～ですか</div><div class="ex"><b>How long</b> did you stay in Hawaii?</div><div class="xj">あなたはどのくらい長くハワイに滞在しましたか。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">elementary</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">初等の；初歩の（elementary school で小学校）</div><div class="ex">I went to this <b>elementary</b> school.</div><div class="xj">私はこの小学校に通っていました。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">vegetable</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">野菜</div><div class="ex">We grew <b>vegetables</b> in the school garden.</div><div class="xj">私たちは学校の庭で野菜を育てました。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">nervous</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">緊張して；不安で</div><div class="ex">I was very <b>nervous</b> before the game.</div><div class="xj">私は試合の前、とても緊張していました。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">letter</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">手紙；文字</div><div class="ex">I wrote a <b>letter</b> to my grandmother.</div><div class="xj">私は祖母に手紙を書きました。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">stadium</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スタジアム；競技場</div><div class="ex">Many people came to the <b>stadium</b> last Sunday.</div><div class="xj">この前の日曜日、多くの人がスタジアムに来ました。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">in the afternoon</span><span class="ps">熟</span></div><div class="ja">午後に</div><div class="ex">Emi studied in the library <b>in the afternoon</b>.</div><div class="xj">エミは午後に図書館で勉強しました。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">August</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">8月</div><div class="ex">We went to the sea in <b>August</b>.</div><div class="xj">私たちは8月に海へ行きました。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">T-shirt</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">Tシャツ</div><div class="ex">Ken bought a white <b>T-shirt</b>.</div><div class="xj">ケンは白いTシャツを買いました。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">sit</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">座る</div><div class="ex">Ken is <b>sitting</b> by the window.</div><div class="xj">ケンは窓のそばに座っています。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">increase</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">増える；増やす</div><div class="ex">The number of visitors <b>increased</b> last year.</div><div class="xj">昨年、訪問者の数が増えました。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">temple</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">寺</div><div class="ex">We visited an old <b>temple</b> in Nara.</div><div class="xj">私たちは奈良の古い寺を訪れました。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">the next day</span><span class="ps">熟</span></div><div class="ja">次の日</div><div class="ex">It was rainy, but it was sunny <b>the next day</b>.</div><div class="xj">雨でしたが、次の日は晴れました。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">American</span><span class="ps">形名</span></div><div class="ja">アメリカの；アメリカ人</div><div class="ex">We watched an <b>American</b> movie last night.</div><div class="xj">私たちは昨夜、アメリカの映画を見ました。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">garden</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">庭</div><div class="ex">My father is working in the <b>garden</b>.</div><div class="xj">父は庭で作業をしています。</div></button></li><li><button class="w" data-no="749"><div class="top"><span class="no">749</span><span class="en">card</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">カード；はがき</div><div class="ex">I wrote a birthday <b>card</b> for Mom.</div><div class="xj">私はお母さんに誕生日カードを書きました。</div></button></li><li><button class="w" data-no="750"><div class="top"><span class="no">750</span><span class="en">poster</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ポスター</div><div class="ex">We made a <b>poster</b> for the concert.</div><div class="xj">私たちはコンサートのポスターを作りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p>
