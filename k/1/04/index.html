</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第4回</h1><div class="sub">No.91〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">or</span><span class="ps">接</span></div><div class="ja">それとも；または</div><div class="ex">Do you like dogs <b>or</b> cats?</div><div class="xj">あなたは犬が好きですか、それともネコが好きですか。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">need</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">必要とする</div><div class="ex">Do you <b>need</b> an umbrella today?</div><div class="xj">今日はかさが必要ですか。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">happy</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">幸せな；うれしい</div><div class="ex">I am very <b>happy</b> today.</div><div class="xj">私は今日とても幸せです。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">OK</span><span class="ps">形</span></div><div class="ja">大丈夫な；よろしい</div><div class="ex">Are you <b>OK</b>?</div><div class="xj">大丈夫ですか。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">English</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">英語</div><div class="ex">I want to speak <b>English</b> well.</div><div class="xj">私は英語を上手に話したいです。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">something</span><span class="ps">代</span><span class="ek">英4</span></div><div class="ja">何か</div><div class="ex">I want to eat <b>something</b>.</div><div class="xj">私は何か食べたいです。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">every</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">毎～；どの～も</div><div class="ex">I get up at six <b>every</b> morning.</div><div class="xj">私は毎朝6時に起きます。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">great</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">すばらしい；すごい</div><div class="ex">That’s <b>great</b>!</div><div class="xj">それはすごいね！</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">nice</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">すてきな；よい</div><div class="ex">You have a <b>nice</b> bag.</div><div class="xj">あなたはすてきなかばんを持っていますね。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">at home</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">家で</div><div class="ex">I study <b>at home</b>.</div><div class="xj">私は家で勉強します。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">buy</span><span class="ps">動</span></div><div class="ja">買う</div><div class="ex">I want to <b>buy</b> a new bike.</div><div class="xj">私は新しい自転車を買いたいです。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">here</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">ここに；ここで</div><div class="ex">Come <b>here</b>, please.</div><div class="xj">ここに来てください。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">hi</span><span class="ps">間</span></div><div class="ja">やあ；こんにちは</div><div class="ex"><b>Hi</b>, I’m Emi.</div><div class="xj">やあ、私はエミです。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">home</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">家；家庭；家に</div><div class="ex">This is my <b>home</b>.</div><div class="xj">ここが私の家です。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">week</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">週；1週間</div><div class="ex">We have five English classes a <b>week</b>.</div><div class="xj">私たちは1週間に5回英語の授業があります。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">kind</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">親切な；やさしい</div><div class="ex">Be <b>kind</b> to animals.</div><div class="xj">動物にやさしくしなさい。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">picture</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">絵；写真</div><div class="ex">I like your <b>picture</b>.</div><div class="xj">私はあなたの絵が好きです。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">study</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">勉強する</div><div class="ex">We <b>study</b> English at school.</div><div class="xj">私たちは学校で英語を勉強します。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">read</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">読む</div><div class="ex">I <b>read</b> books in the library.</div><div class="xj">私は図書館で本を読みます。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">together</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">いっしょに</div><div class="ex">Let’s study <b>together</b>.</div><div class="xj">いっしょに勉強しよう。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">play</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（スポーツを）する；演奏する；遊ぶ</div><div class="ex">I <b>play</b> tennis on Sundays.</div><div class="xj">私は日曜日にテニスをします。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">junior high school</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">中学校</div><div class="ex">Is this your <b>junior high school</b>?</div><div class="xj">これがあなたの中学校ですか。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">eat</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">食べる</div><div class="ex">Do you <b>eat</b> natto?</div><div class="xj">あなたは納豆を食べますか。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">high</span><span class="ps">形</span></div><div class="ja">高い；高く</div><div class="ex">I want to climb that <b>high</b> mountain.</div><div class="xj">私はあの高い山に登りたいです。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">three</span><span class="ps">数</span></div><div class="ja">3（の）</div><div class="ex">I have <b>three</b> brothers.</div><div class="xj">私には兄弟が3人います。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">family</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">家族</div><div class="ex">I eat dinner with my <b>family</b>.</div><div class="xj">私は家族といっしょに夕食を食べます。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">book</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">本</div><div class="ex">This is my favorite <b>book</b>.</div><div class="xj">これは私のお気に入りの本です。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">watch</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（じっと）見る；見守る</div><div class="ex">We <b>watch</b> soccer games on TV.</div><div class="xj">私たちはテレビでサッカーの試合を見ます。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">these</span><span class="ps">代</span></div><div class="ja">これら；これらの</div><div class="ex"><b>These</b> are my books.</div><div class="xj">これらは私の本です。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">around</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～のまわりを；～のあちこちを</div><div class="ex">Let’s walk <b>around</b> the park.</div><div class="xj">公園のまわりを歩こう。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"91": 4.48, "92": 17.77, "93": 30.36, "94": 43.68, "95": 56.25, "96": 68.94, "97": 81.13, "98": 95.29, "99": 107.74, "100": 120.17, "101": 132.45, "102": 144.93, "103": 157.52, "104": 170.17, "105": 182.5, "106": 196.3, "107": 209.49, "108": 221.8, "109": 234.49, "110": 247.21, "111": 259.37, "112": 273.43, "113": 287.13, "114"
