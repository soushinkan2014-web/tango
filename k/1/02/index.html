</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第2回</h1><div class="sub">No.31〜60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">much</span><span class="ps">形</span></div><div class="ja">（量が）たくさんの；（very much で）とても</div><div class="ex">Do you have <b>much</b> homework today?</div><div class="xj">今日は宿題がたくさんありますか。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">on</span><span class="ps">前</span></div><div class="ja">～の上に；（曜日・日付）に</div><div class="ex">Put your bag <b>on</b> the desk.</div><div class="xj">かばんを机の上に置いて。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">me</span><span class="ps">代</span></div><div class="ja">私を；私に</div><div class="ex">Look at <b>me</b>.</div><div class="xj">私を見て。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">like</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">～が好きである</div><div class="ex">I <b>like</b> apples.</div><div class="xj">私はりんごが好きです。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">your</span><span class="ps">代</span></div><div class="ja">あなたの；あなたたちの</div><div class="ex">Is this <b>your</b> pen?</div><div class="xj">これはあなたのペンですか。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">think</span><span class="ps">動</span></div><div class="ja">思う；考える</div><div class="ex">I <b>think</b> so, too.</div><div class="xj">私もそう思います。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">I see.</span><span class="ps">熟</span></div><div class="ja">なるほど；わかりました</div><div class="ex">A: My birthday is in May.<br>B: <b>I see.</b></div><div class="xj">A：私の誕生日は5月です。B：なるほど。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">from</span><span class="ps">前</span></div><div class="ja">～から；～出身の</div><div class="ex">I’m <b>from</b> Osaka.</div><div class="xj">私は大阪出身です。</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">one</span><span class="ps">数</span></div><div class="ja">1（の）；1つ</div><div class="ex">I want <b>one</b> more cookie.</div><div class="xj">クッキーがもう1枚ほしいです。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">they</span><span class="ps">代</span></div><div class="ja">彼らは；彼女らは；それらは</div><div class="ex"><b>They</b> are from Australia.</div><div class="xj">彼らはオーストラリア出身です。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">very</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">とても</div><div class="ex">I’m <b>very</b> happy.</div><div class="xj">私はとてもうれしいです。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">time</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">時間；時刻；～回</div><div class="ex">I don’t have <b>time</b> today.</div><div class="xj">今日は時間がありません。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">some</span><span class="ps">形</span></div><div class="ja">いくつかの；いくらかの；少しの</div><div class="ex">I want <b>some</b> cookies.</div><div class="xj">私はクッキーがいくつかほしいです。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">people</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">人々</div><div class="ex">Many <b>people</b> visit Kyoto in fall.</div><div class="xj">秋には多くの人々が京都を訪れます。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">look</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">見る；目を向ける</div><div class="ex"><b>Look</b>! It’s Mt. Fuji.</div><div class="xj">見て！富士山だよ。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">know</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">知っている</div><div class="ex">I <b>know</b> your sister.</div><div class="xj">私はあなたのお姉さんを知っています。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">make</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">作る</div><div class="ex">I <b>make</b> cookies with my sister.</div><div class="xj">私は姉といっしょにクッキーを作ります。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">don’t</span><span class="ps">助</span></div><div class="ja">～しない（do not の短縮形）</div><div class="ex">I <b>don’t</b> like tomatoes.</div><div class="xj">私はトマトが好きではありません。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">school</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">学校</div><div class="ex">I walk to <b>school</b>.</div><div class="xj">私は歩いて学校へ行きます。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">Thank you.</span><span class="ps">熟</span></div><div class="ja">ありがとう</div><div class="ex">A: Here you are.<br>B: <b>Thank you.</b></div><div class="xj">A：はい、どうぞ。B：ありがとう。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">yes</span><span class="ps">副</span></div><div class="ja">はい</div><div class="ex">A: Do you like sushi?<br>B: <b>Yes</b>, I do.</div><div class="xj">A：おすしは好きですか。B：はい、好きです。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">thank</span><span class="ps">動</span></div><div class="ja">感謝する；礼を言う</div><div class="ex">We <b>thank</b> our teachers.</div><div class="xj">私たちは先生たちに感謝しています。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">day</span><span class="ps">名</span></div><div class="ja">日；1日</div><div class="ex">Have a nice <b>day</b>!</div><div class="xj">よい1日を！</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">our</span><span class="ps">代</span></div><div class="ja">私たちの</div><div class="ex">This is <b>our</b> classroom.</div><div class="xj">これは私たちの教室です。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">come</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">来る</div><div class="ex">Please <b>come</b> to my birthday party.</div><div class="xj">私の誕生日パーティーに来てください。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">say</span><span class="ps">動</span></div><div class="ja">言う</div><div class="ex"><b>Say</b> it again, please.</div><div class="xj">もう一度それを言ってください。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">get</span><span class="ps">動</span></div><div class="ja">手に入れる；得る</div><div class="ex">I want to <b>get</b> a new racket.</div><div class="xj">私は新しいラケットを手に入れたいです。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">enjoy</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">楽しむ</div><div class="ex">We <b>enjoy</b> the summer festival.</div><div class="xj">私たちは夏祭りを楽しみます。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">after</span><span class="ps">前</span><span class="ek">英5</span></div><div class="ja">～のあとに</div><div class="ex">Let’s play <b>after</b> lunch.</div><div class="xj">昼食のあとで遊ぼう。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">take</span><span class="ps">動</span></div><div class="ja">取る；持っていく；（乗り物に）乗る</div><div class="ex"><b>Take</b> one, please.</div><div class="xj">1つ取ってください。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"31": 4.38, "32": 18.75, "33": 33.15, "34": 45.5, "35": 58.12, "36": 70.74, "37": 83.72, "38": 99.34, "39": 113.02, "40": 125.83, "41": 138.9, "42": 151.07, "43": 163.78, "44": 176.98, "45": 190.25, "46": 204.4, "47": 216.52, "48": 229.24, "49": 243.27, "50": 255.56, "51": 269.68, "52": 284.65, "53": 297.82, "54": 310.06, "55": 322.42, "56": 335.11, "57": 347.82, "58": 360.64, "59": 373.42, "60": 386.21}, "TE": {"31": 6.25, "32": 20.62, "33": 35.02, "34": 47.38, "35": 60.0, "36": 72.62, "37": 85.69, "38": 101.21, "39": 114.89, "40": 127.7, "41": 140.78, "42": 152.94, "43": 165.7, "44": 178.85, "45": 192.12, "46": 206.28, "47": 218.39, "48": 231.
