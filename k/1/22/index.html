</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第22回</h1><div class="sub">No.631〜660</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../22.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="631"><div class="top"><span class="no">631</span><span class="en">cherry</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">さくらんぼ；桜</div><div class="ex">This <b>cherry</b> is red and sweet.</div><div class="xj">このさくらんぼは赤くて甘いです。</div></button></li><li><button class="w" data-no="632"><div class="top"><span class="no">632</span><span class="en">whose</span><span class="ps">代</span></div><div class="ja">だれの；だれのもの</div><div class="ex"><b>Whose</b> notebook is this?</div><div class="xj">これはだれのノートですか。</div></button></li><li><button class="w" data-no="633"><div class="top"><span class="no">633</span><span class="en">hobby</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">趣味</div><div class="ex">Ken has many <b>hobbies</b>.</div><div class="xj">ケンには趣味がたくさんあります。</div></button></li><li><button class="w" data-no="634"><div class="top"><span class="no">634</span><span class="en">matter</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">問題；事がら</div><div class="ex">This is an important <b>matter</b>.</div><div class="xj">これは大切な問題です。</div></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">Here you are.</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">はい、どうぞ（物を渡すとき）</div><div class="ex">A: Can I have some water?<br>B: Sure. <b>Here you are.</b></div><div class="xj">A：お水をもらえますか。B：もちろん。はい、どうぞ。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">menu</span><span class="ps">名</span></div><div class="ja">メニュー</div><div class="ex">Can I see the <b>menu</b>?</div><div class="xj">メニューを見せてもらえますか。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">college</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">大学</div><div class="ex">My brother is a <b>college</b> student.</div><div class="xj">私の兄は大学生です。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">lion</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ライオン</div><div class="ex">Can you see the <b>lion</b>?</div><div class="xj">ライオンが見えますか。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">leg</span><span class="ps">名</span></div><div class="ja">脚；足</div><div class="ex">A spider has eight <b>legs</b>.</div><div class="xj">クモには脚が8本あります。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">clock</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">時計（置き時計・かけ時計）</div><div class="ex">The <b>clock</b> in our classroom is five minutes fast.</div><div class="xj">教室の時計は5分進んでいます。</div></button></li><li><button class="w" data-no="641"><div class="top"><span class="no">641</span><span class="en">land</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">着陸する；（陸に）降りる</div><div class="ex">The plane <b>lands</b> in Sydney.</div><div class="xj">その飛行機はシドニーに着陸します。</div></button></li><li><button class="w" data-no="642"><div class="top"><span class="no">642</span><span class="en">common</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">よくある；ふつうの；共通の</div><div class="ex">Sato is a <b>common</b> name in Japan.</div><div class="xj">佐藤は日本でよくある名前です。</div></button></li><li><button class="w" data-no="643"><div class="top"><span class="no">643</span><span class="en">cost</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（費用が）かかる；（値段が）～する</div><div class="ex">The ticket <b>costs</b> ten dollars.</div><div class="xj">そのチケットは10ドルします。</div></button></li><li><button class="w" data-no="644"><div class="top"><span class="no">644</span><span class="en">rich</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">豊かな；金持ちの</div><div class="ex">This sea is <b>rich</b> in fish.</div><div class="xj">この海は魚が豊かです。</div></button></li><li><button class="w" data-no="645"><div class="top"><span class="no">645</span><span class="en">warming</span><span class="ps">名</span></div><div class="ja">（global warming で）地球温暖化</div><div class="ex">Global <b>warming</b> is a big problem.</div><div class="xj">地球温暖化は大きな問題です。</div></button></li><li><button class="w" data-no="646"><div class="top"><span class="no">646</span><span class="en">convenience store</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">コンビニエンスストア；コンビニ</div><div class="ex">The <b>convenience store</b> is near my house.</div><div class="xj">そのコンビニは私の家の近くにあります。</div></button></li><li><button class="w" data-no="647"><div class="top"><span class="no">647</span><span class="en">anywhere</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">どこにでも；（否定文で）どこへも</div><div class="ex">You can sit <b>anywhere</b>.</div><div class="xj">どこにでも座っていいですよ。</div></button></li><li><button class="w" data-no="648"><div class="top"><span class="no">648</span><span class="en">clerk</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">店員</div><div class="ex">That <b>clerk</b> is very kind.</div><div class="xj">あの店員はとても親切です。</div></button></li><li><button class="w" data-no="649"><div class="top"><span class="no">649</span><span class="en">rise</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（太陽などが）昇る；上がる</div><div class="ex">The sun <b>rises</b> in the east.</div><div class="xj">太陽は東から昇ります。</div></button></li><li><button class="w" data-no="650"><div class="top"><span class="no">650</span><span class="en">thirteen</span><span class="ps">数</span></div><div class="ja">13（の）</div><div class="ex">My brother is <b>thirteen</b> years old.</div><div class="xj">私の兄は13歳です。</div></button></li><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">teammate</span><span class="ps">名</span></div><div class="ja">チームメイト；チームの仲間</div><div class="ex">Ken is my <b>teammate</b>.</div><div class="xj">ケンは私のチームメイトです。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">sixteen</span><span class="ps">数</span></div><div class="ja">16（の）</div><div class="ex">Our team has <b>sixteen</b> members.</div><div class="xj">私たちのチームには16人の部員がいます。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">airplane</span><span class="ps">名</span></div><div class="ja">飛行機</div><div class="ex">This <b>airplane</b> goes to Hawaii.</div><div class="xj">この飛行機はハワイに行きます。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">jump</span><span class="ps">動</span></div><div class="ja">跳ぶ；ジャンプする</div><div class="ex">Can you <b>jump</b> high?</div><div class="xj">あなたは高く跳べますか。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">pretty</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">かわいい；きれいな</div><div class="ex">Yuki has a <b>pretty</b> bag.</div><div class="xj">ユキはかわいいかばんを持っています。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">grandma</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">おばあちゃん</div><div class="ex">My <b>grandma</b> makes delicious cookies.</div><div class="xj">私のおばあちゃんはおいしいクッキーを作ります。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">be proud of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を誇りに思う</div><div class="ex">My grandmother <b>is proud of</b> her garden.</div><div class="xj">祖母は自分の庭を誇りに思っています。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">safety</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">安全</div><div class="ex">We learn about <b>safety</b> at school.</div><div class="xj">私たちは学校で安全について学びます。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">seventeen</span><span class="ps">数</span></div><div class="ja">17（の）</div><div class="ex">This book has <b>seventeen</b> stories.</div><div class="xj">この本には17の物語が入っています。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">monkey</span><span class="ps">名</span></div><div class="ja">サル</div><div class="ex">Can you see the <b>monkey</b> in the tree?</div><div class="xj">木の上のサルが見えますか。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../21/">← 第21回</a><a href="../23/">第23回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"631": 4.79, "632": 18.25, "633": 31.32, "634": 43.9, "635": 56.83, "636": 74
