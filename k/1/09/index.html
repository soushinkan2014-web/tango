</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第9回</h1><div class="sub">No.241〜270</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">sing</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">歌う</div><div class="ex">We <b>sing</b> English songs in class.</div><div class="xj">私たちは授業で英語の歌を歌います。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">girl</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">女の子；少女</div><div class="ex">The <b>girls</b> are in the gym.</div><div class="xj">女の子たちは体育館にいます。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">grow</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">育てる；成長する</div><div class="ex">We <b>grow</b> tomatoes in our garden.</div><div class="xj">私たちは庭でトマトを育てています。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">classroom</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">教室</div><div class="ex">Our <b>classroom</b> is on the third floor.</div><div class="xj">私たちの教室は3階にあります。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">six</span><span class="ps">数</span></div><div class="ja">6（の）</div><div class="ex">We have <b>six</b> classes on Monday.</div><div class="xj">月曜日は授業が6時間あります。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">tennis</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">テニス</div><div class="ex">Do you play <b>tennis</b>?</div><div class="xj">あなたはテニスをしますか。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">Friday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">金曜日</div><div class="ex">I have piano lessons on <b>Fridays</b>.</div><div class="xj">私は毎週金曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">run</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">走る</div><div class="ex">Let’s <b>run</b> to the park.</div><div class="xj">公園まで走ろう。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">lesson</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">レッスン；授業；教訓</div><div class="ex">I have a piano <b>lesson</b> every Friday.</div><div class="xj">私は毎週金曜日にピアノのレッスンがあります。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">You’re welcome.</span><span class="ps">熟</span></div><div class="ja">どういたしまして</div><div class="ex">A: Thank you.<br>B: <b>You’re welcome.</b></div><div class="xj">A：ありがとう。B：どういたしまして。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">science</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">理科；科学</div><div class="ex">I want to be a <b>science</b> teacher.</div><div class="xj">私は理科の先生になりたいです。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">thirty</span><span class="ps">数</span></div><div class="ja">30（の）</div><div class="ex">We have <b>thirty</b> students in our class.</div><div class="xj">私たちのクラスには30人の生徒がいます。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">table</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">テーブル；食卓</div><div class="ex">Let’s sit at that <b>table</b> by the window.</div><div class="xj">窓のそばのあのテーブルにすわりましょう。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">dog</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">犬</div><div class="ex">Do you have a <b>dog</b>?</div><div class="xj">あなたは犬を飼っていますか。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">hand</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">手</div><div class="ex">I write with my right <b>hand</b>.</div><div class="xj">私は右手で字を書きます。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">weather</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">天気；天候</div><div class="ex">We have nice <b>weather</b> today.</div><div class="xj">今日はいい天気です。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">outside</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">外で；外は</div><div class="ex">It’s cold <b>outside</b>.</div><div class="xj">外は寒いです。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">hot</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">暑い；熱い</div><div class="ex">It’s very <b>hot</b> today.</div><div class="xj">今日はとても暑いです。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">art</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">美術；芸術</div><div class="ex">I’m in the <b>art</b> club.</div><div class="xj">私は美術部に入っています。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">strong</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">強い</div><div class="ex">Elephants are <b>strong</b> animals.</div><div class="xj">ゾウは力の強い動物です。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">almost</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">ほとんど；もう少しで</div><div class="ex"><b>Almost</b> all my friends like soccer.</div><div class="xj">私の友だちのほとんどみんながサッカーが好きです。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">get up</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">起きる</div><div class="ex">I <b>get up</b> at six.</div><div class="xj">私は6時に起きます。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">parent</span><span class="ps">名</span></div><div class="ja">親；（parents で）両親</div><div class="ex">My <b>parents</b> are teachers.</div><div class="xj">私の両親は教師です。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">baseball</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">野球</div><div class="ex">We are on the <b>baseball</b> team.</div><div class="xj">私たちは野球部に入っています。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">end</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">終わり；端</div><div class="ex">Our school trip is at the <b>end</b> of May.</div><div class="xj">修学旅行は5月の終わりにあります。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">spring</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">春</div><div class="ex"><b>Spring</b> is my favorite season.</div><div class="xj">春は私の大好きな季節です。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">basketball</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">バスケットボール</div><div class="ex">We play <b>basketball</b> in the park.</div><div class="xj">私たちは公園でバスケットボールをします。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">street</span><span class="ps">名</span></div><div class="ja">通り；道路</div><div class="ex">I live on this <b>street</b>.</div><div class="xj">私はこの通りに住んでいます。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">clothes</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">服；衣服</div><div class="ex">I want new <b>clothes</b>.</div><div class="xj">私は新しい服がほしいです。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">computer</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">コンピューター</div><div class="ex">I have a <b>computer</b> in my room.</div><div class="xj">私の部屋にはコンピューターがあります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"241": 4.48, "242": 18.31, "243": 31.94, "244": 46.32, "245": 59.98, "246": 73.58, "247":
