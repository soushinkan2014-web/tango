</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第13回</h1><div class="sub">No.361〜390</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">follow</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">ついて行く；従う</div><div class="ex">Please <b>follow</b> me.</div><div class="xj">私について来てください。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">show ～ around</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">～を案内する</div><div class="ex">Please <b>show me around</b> Kyoto.</div><div class="xj">私に京都を案内してください。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">straight</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">まっすぐに</div><div class="ex">Go <b>straight</b> along this street.</div><div class="xj">この通りをまっすぐ行ってください。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">sweet</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">甘い</div><div class="ex">I don’t like <b>sweet</b> food.</div><div class="xj">私は甘い食べ物が好きではありません。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">umbrella</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">かさ</div><div class="ex">Do you have an <b>umbrella</b>?</div><div class="xj">あなたはかさを持っていますか。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">fan</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ファン</div><div class="ex">I’m a <b>fan</b> of this team.</div><div class="xj">私はこのチームのファンです。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">November</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">11月</div><div class="ex">We have a school festival in <b>November</b>.</div><div class="xj">11月に文化祭があります。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">dear</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">親愛なる（手紙の書き出し）；大切な</div><div class="ex"><b>Dear</b> Tom, I am in Okinawa this week.</div><div class="xj">親愛なるトムへ、私は今週、沖縄にいます。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">notebook</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ノート</div><div class="ex">I need a new <b>notebook</b>.</div><div class="xj">私は新しいノートが必要です。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">December</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">12月</div><div class="ex">Christmas is in <b>December</b>.</div><div class="xj">クリスマスは12月にあります。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">hey</span><span class="ps">間</span></div><div class="ja">ねえ；おい</div><div class="ex"><b>Hey</b>, look at that bird!</div><div class="xj">ねえ、あの鳥を見て！</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">luck</span><span class="ps">名</span></div><div class="ja">幸運；運</div><div class="ex">Wish me <b>luck</b>!</div><div class="xj">幸運を祈っていてね！</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">twelve</span><span class="ps">数</span></div><div class="ja">12（の）</div><div class="ex">We eat lunch at <b>twelve</b>.</div><div class="xj">私たちは12時に昼食を食べます。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">yellow</span><span class="ps">形</span></div><div class="ja">黄色の；黄色</div><div class="ex">Lemons are <b>yellow</b>.</div><div class="xj">レモンは黄色です。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">Good luck!</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">がんばって；幸運を祈る</div><div class="ex">A: I have a test today.<br>B: <b>Good luck!</b></div><div class="xj">A：今日テストがあるんだ。B：がんばってね！</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">curry</span><span class="ps">名</span></div><div class="ja">カレー</div><div class="ex">Let’s make <b>curry</b> for dinner.</div><div class="xj">夕食にカレーを作ろう。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">thousand</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">1000（の）；千</div><div class="ex">This T-shirt is two <b>thousand</b> yen.</div><div class="xj">このTシャツは2千円です。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">pen</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ペン</div><div class="ex">I want a red <b>pen</b>.</div><div class="xj">私は赤いペンがほしいです。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">fifty</span><span class="ps">数</span></div><div class="ja">50（の）</div><div class="ex">I have <b>fifty</b> comic books.</div><div class="xj">私はマンガを50冊持っています。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">swim</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">泳ぐ</div><div class="ex">Let’s <b>swim</b> in the sea.</div><div class="xj">海で泳ごう。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">chair</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">いす</div><div class="ex">Please carry these <b>chairs</b> to the gym.</div><div class="xj">これらのいすを体育館へ運んでください。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">aunt</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">おば</div><div class="ex">I have an <b>aunt</b> in Tokyo.</div><div class="xj">私には東京におばがいます。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">full</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">いっぱいの；満腹の</div><div class="ex">I’m <b>full</b>, thank you.</div><div class="xj">おなかがいっぱいです、ありがとう。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">nurse</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">看護師</div><div class="ex">I want to be a <b>nurse</b>.</div><div class="xj">私は看護師になりたいです。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">quiet</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">静かな</div><div class="ex">Be <b>quiet</b> in the library.</div><div class="xj">図書館では静かにしなさい。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">aren’t</span><span class="ps">動</span></div><div class="ja">～でない（are not の短縮形）</div><div class="ex">We <b>aren’t</b> in the same class.</div><div class="xj">私たちは同じクラスではありません。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">curry and rice</span><span class="ps">熟</span></div><div class="ja">カレーライス</div><div class="ex">Let’s make <b>curry and rice</b>.</div><div class="xj">カレーライスを作ろう。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">drawing</span><span class="ps">名</span></div><div class="ja">絵（線でかいた絵）</div><div class="ex">This is my <b>drawing</b>.</div><div class="xj">これは私の絵です。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">egg</span><span class="ps">名</span></div><div class="ja">卵</div><div class="ex">I need three <b>eggs</b> for this cake.</div><div class="xj">このケーキには卵が3個必要です。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">milk</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">牛乳；ミルク</div><div class="ex">Please buy some <b>milk</b> for breakfast.</div><div class="xj">朝食用に牛乳を買ってください。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</a><a href="../14/">第14回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"361": 4.64, "362": 17.31, "363": 31.42, "364": 43.94, "365": 56.44, "366": 68.68, "367": 81.11, "368": 94.38, "369": 110.24, "370": 122.81, "371": 135.36, "372": 148.12, "373": 160.31, "374": 172.78, "375": 185.43, "376": 201.52, "377": 213.98, "378": 227.53, "379": 239.74, "380":
