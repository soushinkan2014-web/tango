</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第16回</h1><div class="sub">No.451〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">that</span><span class="ps">代</span></div><div class="ja">あれ；あの</div><div class="ex">What’s <b>that</b>?</div><div class="xj">あれは何ですか。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">can</span><span class="ps">助</span></div><div class="ja">～できる</div><div class="ex">I <b>can</b> swim fast.</div><div class="xj">私は速く泳ぐことができます。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">what</span><span class="ps">代</span></div><div class="ja">何；何の</div><div class="ex"><b>What</b> food do you like?</div><div class="xj">あなたは何の食べ物が好きですか。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">but</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">しかし；でも</div><div class="ex">I can swim, <b>but</b> I can’t ski.</div><div class="xj">私は泳げますが、スキーはできません。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">there</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">そこに；そこで；そこへ</div><div class="ex">My grandmother lives <b>there</b>.</div><div class="xj">私の祖母はそこに住んでいます。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">see</span><span class="ps">動</span></div><div class="ja">見える；見る；会う</div><div class="ex">I can <b>see</b> Mt. Fuji from here.</div><div class="xj">ここから富士山が見えます。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">when</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">いつ</div><div class="ex"><b>When</b> is the summer festival?</div><div class="xj">夏祭りはいつですか。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">well</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">上手に；よく</div><div class="ex">You can sing <b>well</b>.</div><div class="xj">あなたは上手に歌えますね。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">because</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">なぜなら～だから；～なので</div><div class="ex">A: Why do you like summer?<br>B: <b>Because</b> I can swim.</div><div class="xj">A：あなたはなぜ夏が好きなのですか。B：泳げるからです。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">them</span><span class="ps">代</span></div><div class="ja">彼らを；彼らに；それらを</div><div class="ex">I know <b>them</b> well.</div><div class="xj">私は彼らをよく知っています。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">a lot of ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">たくさんの～</div><div class="ex">Lisa has <b>a lot of</b> comic books.</div><div class="xj">リサはたくさんのマンガ本を持っています。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">now</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">今</div><div class="ex">What time is it <b>now</b>?</div><div class="xj">今何時ですか。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">tell</span><span class="ps">動</span></div><div class="ja">伝える；話す</div><div class="ex">Can you <b>tell</b> Ken about the test?</div><div class="xj">ケンにテストのことを伝えてくれますか。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">by</span><span class="ps">前</span></div><div class="ja">～で（手段）；～のそばに</div><div class="ex">Ken goes to school <b>by</b> bike.</div><div class="xj">ケンは自転車で学校へ行きます。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">also</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">～もまた；さらに</div><div class="ex">My sister is <b>also</b> a student here.</div><div class="xj">私の姉もここの生徒です。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">he</span><span class="ps">代</span></div><div class="ja">彼は；彼が</div><div class="ex"><b>He</b> can run fast.</div><div class="xj">彼は速く走れます。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">talk</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">話す</div><div class="ex">She often <b>talks</b> with her friends.</div><div class="xj">彼女はよく友だちと話します。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">it’s</span><span class="ps">代</span></div><div class="ja">それは～です（it is の短縮形）</div><div class="ex">A: What’s this?<br>B: <b>It’s</b> a lemon.</div><div class="xj">A：これは何ですか。B：それはレモンです。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">why</span><span class="ps">副</span></div><div class="ja">なぜ</div><div class="ex"><b>Why</b> do you like dogs?</div><div class="xj">あなたはなぜ犬が好きなのですか。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">next</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">次の；となりの</div><div class="ex">The <b>next</b> bus comes at nine.</div><div class="xj">次のバスは9時に来ます。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">she</span><span class="ps">代</span></div><div class="ja">彼女は；彼女が</div><div class="ex"><b>She</b> can play the guitar.</div><div class="xj">彼女はギターを弾けます。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">How about ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～はどうですか</div><div class="ex">A: What do you want to eat?<br>B: <b>How about</b> pizza?</div><div class="xj">A：何が食べたい？<br>B：ピザはどう？</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">help</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">手伝う；助ける</div><div class="ex">Can you <b>help</b> me?</div><div class="xj">私を手伝ってくれますか。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">find</span><span class="ps">動</span></div><div class="ja">見つける</div><div class="ex">I can’t <b>find</b> my key.</div><div class="xj">私はかぎを見つけられません。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">has</span><span class="ps">動</span></div><div class="ja">持っている；飼っている（have の3単現）</div><div class="ex">Emi <b>has</b> two cats.</div><div class="xj">エミはネコを2匹飼っています。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">use</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">使う</div><div class="ex">You can <b>use</b> my umbrella.</div><div class="xj">私のかさを使っていいですよ。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">which</span><span class="ps">代</span></div><div class="ja">どちら；どの</div><div class="ex"><b>Which</b> cap do you like?</div><div class="xj">どちらのぼうしが好きですか。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">all</span><span class="ps">形</span></div><div class="ja">すべての；全部の</div><div class="ex">She knows <b>all</b> the songs.</div><div class="xj">彼女は全部の歌を知っています。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">Japanese</span><span class="ps">名</span></div><div class="ja">日本語；日本人</div><div class="ex">Can you speak <b>Japanese</b>?</div><div class="xj">あなたは日本語を話せますか。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">who</span><span class="ps">代</span></div><div class="ja">だれ；だれが</div><div class="ex"><b>Who</b> can play the piano?</div><div class="xj">だれがピアノを弾けますか。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../15/">← 第15回</a><a href="../17/">第17回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"451": 4.64, "452": 17.16, "453": 30.33, "454": 43.41, "455": 57.58, "456": 71.07, "457": 84.7, "458": 97.77, "459": 110.87, "460": 128.31, "461": 141.5, "462": 155.73, "463": 168.48, "464": 182.39, "465": 197.39, "466": 211.99, "467": 225.26, "468": 238.88, "469": 256.02, "470": 268.88, "471": 282.44, "472": 296.17, "473": 312.22, "474": 325.23, "475": 338.32, "476": 353.33, "477": 366.34, "478": 379.35, "479": 393.2, "480": 407.15}, "TE": {"451": 6.82,
