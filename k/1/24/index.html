</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第24回</h1><div class="sub">No.691〜720</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../24.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="691"><div class="top"><span class="no">691</span><span class="en">was</span><span class="ps">動</span></div><div class="ja">（I・he・she・it などが主語で）～であった；いた</div><div class="ex">It <b>was</b> sunny yesterday.</div><div class="xj">昨日は晴れでした。</div></button></li><li><button class="w" data-no="692"><div class="top"><span class="no">692</span><span class="en">did</span><span class="ps">動</span></div><div class="ja">した（do の過去形）</div><div class="ex">I <b>did</b> my homework in the library.</div><div class="xj">私は図書館で宿題をしました。</div></button></li><li><button class="w" data-no="693"><div class="top"><span class="no">693</span><span class="en">were</span><span class="ps">動</span></div><div class="ja">（you・we・they が主語で）～であった；いた</div><div class="ex">We <b>were</b> in the gym then.</div><div class="xj">私たちはそのとき体育館にいました。</div></button></li><li><button class="w" data-no="694"><div class="top"><span class="no">694</span><span class="en">last</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">この前の；昨～；最後の</div><div class="ex">I visited Kyoto <b>last</b> month.</div><div class="xj">私は先月京都を訪れました。</div></button></li><li><button class="w" data-no="695"><div class="top"><span class="no">695</span><span class="en">visit</span><span class="ps">動</span></div><div class="ja">訪れる；訪ねる</div><div class="ex">I <b>visited</b> my grandmother last Sunday.</div><div class="xj">私はこの前の日曜日に祖母を訪ねました。</div></button></li><li><button class="w" data-no="696"><div class="top"><span class="no">696</span><span class="en">a lot</span><span class="ps">熟</span></div><div class="ja">たくさん；とても</div><div class="ex">I ate <b>a lot</b> at the party.</div><div class="xj">私はパーティーでたくさん食べました。</div></button></li><li><button class="w" data-no="697"><div class="top"><span class="no">697</span><span class="en">start</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">始まる；始める</div><div class="ex">The game <b>started</b> at ten.</div><div class="xj">試合は10時に始まりました。</div></button></li><li><button class="w" data-no="698"><div class="top"><span class="no">698</span><span class="en">give</span><span class="ps">動</span></div><div class="ja">与える；あげる</div><div class="ex">Emi <b>gave</b> flowers to her mother.</div><div class="xj">エミはお母さんに花をあげました。</div></button></li><li><button class="w" data-no="699"><div class="top"><span class="no">699</span><span class="en">had</span><span class="ps">動</span></div><div class="ja">持っていた；食べた（have の過去形）</div><div class="ex">I <b>had</b> a red bike last year.</div><div class="xj">私は去年、赤い自転車を持っていました。</div></button></li><li><button class="w" data-no="700"><div class="top"><span class="no">700</span><span class="en">didn’t</span><span class="ps">助</span></div><div class="ja">～しなかった（did not の短縮形）</div><div class="ex">I <b>didn’t</b> watch TV yesterday.</div><div class="xj">私は昨日テレビを見ませんでした。</div></button></li><li><button class="w" data-no="701"><div class="top"><span class="no">701</span><span class="en">talk about ～</span><span class="ps">熟</span></div><div class="ja">～について話す</div><div class="ex">We <b>talked about</b> our school trip in class.</div><div class="xj">私たちは授業で修学旅行について話しました。</div></button></li><li><button class="w" data-no="702"><div class="top"><span class="no">702</span><span class="en">went</span><span class="ps">動</span></div><div class="ja">行った（go の過去形）</div><div class="ex">I <b>went</b> to the library yesterday.</div><div class="xj">私は昨日図書館へ行きました。</div></button></li><li><button class="w" data-no="703"><div class="top"><span class="no">703</span><span class="en">found</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">見つけた（find の過去形）</div><div class="ex">I <b>found</b> my key under the bed.</div><div class="xj">私はベッドの下でかぎを見つけました。</div></button></li><li><button class="w" data-no="704"><div class="top"><span class="no">704</span><span class="en">came</span><span class="ps">動</span></div><div class="ja">来た（come の過去形）</div><div class="ex">Lisa <b>came</b> to Japan last year.</div><div class="xj">リサは去年日本に来ました。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">stay</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">滞在する；泊まる</div><div class="ex">We are <b>staying</b> at a hotel in Kyoto.</div><div class="xj">私たちは京都のホテルに滞在しています。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">call</span><span class="ps">動</span></div><div class="ja">電話する；呼ぶ</div><div class="ex">I <b>called</b> Ken last night.</div><div class="xj">私は昨夜ケンに電話しました。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">think about ～</span><span class="ps">熟</span></div><div class="ja">～について考える</div><div class="ex">I <b>thought about</b> my dream last night.</div><div class="xj">昨夜、私は自分の夢について考えました。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">saw</span><span class="ps">動</span></div><div class="ja">見た（see の過去形）</div><div class="ex">I <b>saw</b> fireworks last summer.</div><div class="xj">私は去年の夏、花火を見ました。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">ago</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">（今から）～前に</div><div class="ex">Tom came to Osaka two years <b>ago</b>.</div><div class="xj">トムは2年前に大阪に来ました。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">finish</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">終える；終わる</div><div class="ex">Did you <b>finish</b> your homework?</div><div class="xj">宿題を終えましたか。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">yesterday</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">昨日（は）</div><div class="ex">I played tennis with Emi <b>yesterday</b>.</div><div class="xj">私は昨日エミとテニスをしました。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">from ～ to ...</span><span class="ps">熟</span></div><div class="ja">～から…まで</div><div class="ex">I stayed in Kyoto <b>from Monday to Friday</b>.</div><div class="xj">私は月曜日から金曜日まで京都に滞在しました。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">stop</span><span class="ps">動</span></div><div class="ja">止まる；止める；やめる</div><div class="ex">The bus <b>stopped</b> near my house.</div><div class="xj">バスは私の家の近くで止まりました。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">took</span><span class="ps">動</span></div><div class="ja">連れて行った；取った（take の過去形）</div><div class="ex">Ken <b>took</b> his dog to the park.</div><div class="xj">ケンは犬を公園に連れて行きました。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">hold</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">持つ；抱く；（手に）にぎる</div><div class="ex">Ken is <b>holding</b> a big box.</div><div class="xj">ケンは大きな箱を持っています。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">America</span><span class="ps">名</span></div><div class="ja">アメリカ</div><div class="ex">Tom came to Japan from <b>America</b>.</div><div class="xj">トムはアメリカから日本に来ました。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">bought</span><span class="ps">動</span></div><div class="ja">買った（buy の過去形）</div><div class="ex">I <b>bought</b> a new bike.</div><div class="xj">私は新しい自転車を買いました。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">good idea</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">いい考え</div><div class="ex">Emi had a <b>good idea</b> for the trip.</div><div class="xj">エミには旅行についてのいい考えがありました。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">finally</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">ついに；最後に</div><div class="ex">The rain <b>finally</b> stopped.</div><div class="xj">ついに雨がやみました。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">p.m.</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">午後</div><div class="ex">I came home at five <b>p.m.</b></div><div class="xj">私は午後5時に帰宅しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../23/">← 第23回</a><a href="../25/">第25回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"691": 4.88, "692": 21.27, "693": 34.66, "694": 49.66, "695": 63.6, "696": 77.51, "697": 90.3, "698": 103.3, "699": 116.5, "700": 130.82, "701": 145.63, "702": 160.19, "703": 173.84, "704": 187.74,
