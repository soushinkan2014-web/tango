</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第19回</h1><div class="sub">No.541〜570</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">cannot</span><span class="ps">助</span></div><div class="ja">～できない</div><div class="ex">We <b>cannot</b> play soccer here.</div><div class="xj">ここではサッカーができません。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">bad</span><span class="ps">形</span></div><div class="ja">悪い</div><div class="ex">The weather is <b>bad</b> today.</div><div class="xj">今日は天気が悪いです。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">dream</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">夢</div><div class="ex">What is your <b>dream</b>?</div><div class="xj">あなたの夢は何ですか。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">language</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">言語；言葉</div><div class="ex">How many <b>languages</b> can you speak?</div><div class="xj">あなたはいくつの言語を話せますか。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">what’s</span><span class="ps">代</span></div><div class="ja">何（what is の短縮形）</div><div class="ex"><b>What’s</b> in your bag?</div><div class="xj">あなたのかばんには何が入っていますか。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">vacation</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">休暇；休み</div><div class="ex">Summer <b>vacation</b> starts next week.</div><div class="xj">夏休みは来週始まります。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">early</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">早く；早い</div><div class="ex">Emi gets up <b>early</b> every day.</div><div class="xj">エミは毎日早く起きます。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">How many ～?</span><span class="ps">熟</span></div><div class="ja">いくつの～か</div><div class="ex"><b>How many</b> pencils do you have?</div><div class="xj">あなたはえんぴつを何本持っていますか。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">spend</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（時間を）過ごす；（お金を）使う</div><div class="ex">Ken <b>spends</b> Sundays with his grandmother.</div><div class="xj">ケンは日曜日をおばあさんと過ごします。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">busy</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">忙しい</div><div class="ex">My father is <b>busy</b> every day.</div><div class="xj">父は毎日忙しいです。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">winter</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">冬</div><div class="ex">We can ski in <b>winter</b>.</div><div class="xj">私たちは冬にスキーができます。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">car</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">車；自動車</div><div class="ex">My father washes his <b>car</b> on Sundays.</div><div class="xj">父は日曜日に車を洗います。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">excuse</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（Excuse me. で）すみません；許す</div><div class="ex"><b>Excuse</b> me. Is this your pen?</div><div class="xj">すみません。これはあなたのペンですか。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">hospital</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">病院</div><div class="ex">Her mother is a nurse at this <b>hospital</b>.</div><div class="xj">彼女のお母さんはこの病院の看護師です。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">tired</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">疲れた</div><div class="ex">My mother is <b>tired</b> today.</div><div class="xj">母は今日疲れています。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">o’clock</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">～時</div><div class="ex">School starts at eight <b>o’clock</b>.</div><div class="xj">学校は8時に始まります。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">mom</span><span class="ps">名</span></div><div class="ja">お母さん；ママ</div><div class="ex"><b>Mom</b>, where is my bag?</div><div class="xj">お母さん、私のかばんはどこ？</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">a.m.</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">午前</div><div class="ex">The shop opens at nine <b>a.m.</b></div><div class="xj">その店は午前9時に開きます。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">many kinds of ～</span><span class="ps">熟</span></div><div class="ja">たくさんの種類の～</div><div class="ex">This shop has <b>many kinds of</b> bread.</div><div class="xj">この店にはたくさんの種類のパンがあります。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">player</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">選手</div><div class="ex">Tom is a good soccer <b>player</b>.</div><div class="xj">トムは上手なサッカー選手です。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">carry</span><span class="ps">動</span></div><div class="ja">運ぶ；持ち歩く</div><div class="ex">Can you <b>carry</b> my bag?</div><div class="xj">私のかばんを運んでくれますか。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">sick</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">病気の；具合が悪い</div><div class="ex">My sister is <b>sick</b> today.</div><div class="xj">妹は今日、具合が悪いです。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">company</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">会社</div><div class="ex">My father works for a car <b>company</b>.</div><div class="xj">私の父は自動車会社で働いています。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">tree</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">木</div><div class="ex">I can see a big <b>tree</b> from my room.</div><div class="xj">私の部屋から大きな木が見えます。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">white</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">白い</div><div class="ex">Yuki has a <b>white</b> cat.</div><div class="xj">ユキは白いネコを飼っています。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">piano</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ピアノ</div><div class="ex">Can you play the <b>piano</b>?</div><div class="xj">あなたはピアノをひけますか。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">season</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">季節</div><div class="ex">Which <b>season</b> do you like?</div><div class="xj">あなたはどの季節が好きですか。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">bed</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ベッド；寝床</div><div class="ex">My cat sleeps on my <b>bed</b>.</div><div class="xj">私のネコは私のベッドの上で寝ます。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">fast</span><span class="ps">副</span><span class="ek">英5</span></div><div class="ja">速く；速い</div><div class="ex">You can run very <b>fast</b>.</div><div class="xj">あなたはとても速く走れますね。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">a little</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">少し</div><div class="ex">I can speak English <b>a little</b>.</div><div class="xj">私は英語が少し話せます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../18/">← 第18回</a><a href="../20/">第20回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"541": 4.72, "542": 17.67, "543": 30.15, "544": 42.02, "545": 55.41, "546": 68.37, "547": 82.12, "548": 95.46, "549": 108.51, "550": 123.05
