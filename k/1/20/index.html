</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第20回</h1><div class="sub">No.571〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">bike</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">自転車</div><div class="ex">Whose <b>bike</b> is this?</div><div class="xj">これはだれの自転車ですか。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">cake</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">ケーキ</div><div class="ex">Emi makes <b>cakes</b> on Sundays.</div><div class="xj">エミは日曜日にケーキを作ります。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">office</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">事務所；会社；職員室（teachers&#x27; office）</div><div class="ex">The school <b>office</b> is on the first floor.</div><div class="xj">学校の事務所は1階にあります。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">river</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">川</div><div class="ex">We can swim in this <b>river</b> in summer.</div><div class="xj">私たちは夏にこの川で泳ぐことができます。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">expensive</span><span class="ps">形</span></div><div class="ja">高価な；（値段が）高い</div><div class="ex">This watch is very <b>expensive</b>.</div><div class="xj">この腕時計はとても高価です。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">amazing</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">すごい；驚くべき</div><div class="ex">Ken’s dance is <b>amazing</b>!</div><div class="xj">ケンのダンスはすごい！</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">bear</span><span class="ps">名</span></div><div class="ja">クマ</div><div class="ex">I can see a <b>bear</b> in the picture.</div><div class="xj">絵の中にクマが見えます。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">July</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">7月</div><div class="ex">Our summer vacation starts in <b>July</b>.</div><div class="xj">私たちの夏休みは7月に始まります。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">Tuesday</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">火曜日</div><div class="ex">Ken goes to the library on <b>Tuesdays</b>.</div><div class="xj">ケンは毎週火曜日に図書館に行きます。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">fish</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">魚</div><div class="ex">We can see many <b>fish</b> here.</div><div class="xj">ここではたくさんの魚が見られます。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">How much ～?</span><span class="ps">熟</span></div><div class="ja">（値段が）いくら</div><div class="ex"><b>How much</b> is this T-shirt?</div><div class="xj">このTシャツはいくらですか。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">else</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">ほかに</div><div class="ex">What <b>else</b> do you want?</div><div class="xj">ほかに何がほしいですか。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">safe</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">安全な</div><div class="ex">This park is <b>safe</b> for children.</div><div class="xj">この公園は子どもたちにとって安全です。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">phone</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">電話（機）；スマートフォン</div><div class="ex">Can I use your <b>phone</b>?</div><div class="xj">あなたの電話を使ってもいいですか。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">nine</span><span class="ps">数</span></div><div class="ja">9；9つ（の）</div><div class="ex">My sister is <b>nine</b> years old.</div><div class="xj">私の妹は9歳です。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">box</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">箱</div><div class="ex">What’s in the <b>box</b>?</div><div class="xj">箱の中には何が入っていますか。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">floor</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">階；床</div><div class="ex">The shoe shop is on the fourth <b>floor</b>.</div><div class="xj">くつ屋は4階にあります。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">supermarket</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スーパーマーケット</div><div class="ex">My mother often goes to the <b>supermarket</b>.</div><div class="xj">母はよくスーパーに行きます。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">far</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">遠くに；遠い</div><div class="ex">Is the station <b>far</b> from here?</div><div class="xj">駅はここから遠いですか。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">prepare</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">準備する；用意する</div><div class="ex">My mother <b>prepares</b> dinner for us.</div><div class="xj">母は私たちのために夕食を準備します。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">mine</span><span class="ps">代</span></div><div class="ja">私のもの</div><div class="ex">That umbrella is <b>mine</b>.</div><div class="xj">あのかさは私のものです。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">Why don’t we ～?</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～しませんか；～しようよ</div><div class="ex"><b>Why don’t we</b> go to the beach?</div><div class="xj">海へ行きませんか。</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">breakfast</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">朝食</div><div class="ex">What do you eat for <b>breakfast</b>?</div><div class="xj">あなたは朝食に何を食べますか。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">yourself</span><span class="ps">代</span></div><div class="ja">あなた自身；自分で</div><div class="ex">Tell us about <b>yourself</b>.</div><div class="xj">あなた自身について話してください。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">skill</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">技術；技能</div><div class="ex">He has good soccer <b>skills</b>.</div><div class="xj">彼はすぐれたサッカーの技術を持っています。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">cap</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">（つばのある）ぼうし</div><div class="ex">Tom always wears a red <b>cap</b>.</div><div class="xj">トムはいつも赤いぼうしをかぶっています。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">subject</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">教科</div><div class="ex">What <b>subject</b> do you like?</div><div class="xj">あなたはどの教科が好きですか。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">dangerous</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">危険な</div><div class="ex">This river is <b>dangerous</b>.</div><div class="xj">この川は危険です。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">dictionary</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">辞書</div><div class="ex">Can I use your <b>dictionary</b>?</div><div class="xj">あなたの辞書を使ってもいいですか。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">March</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">3月</div><div class="ex">The school year ends in <b>March</b> in Japan.</div><div class="xj">日本では学年は3月に終わります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../19/">← 第19回</a><a href="../21/">第21回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"571": 4.62, "572": 16.83, "573": 29.88, "574": 43
