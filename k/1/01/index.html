</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第1回</h1><div class="sub">No.1〜30</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">be</span><span class="ps">動</span></div><div class="ja">（～に）なる；（～で）ある；いる</div><div class="ex">I want to <b>be</b> a doctor.</div><div class="xj">私は医者になりたいです。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">to</span><span class="ps">前</span></div><div class="ja">～へ；～に</div><div class="ex">I want to go <b>to</b> Okinawa.</div><div class="xj">私は沖縄へ行きたいです。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">the</span><span class="ps">冠</span></div><div class="ja">その；あの</div><div class="ex">I want <b>the</b> blue cap.</div><div class="xj">私はその青いぼうしがほしいです。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">a</span><span class="ps">冠</span></div><div class="ja">1つの；1人の；ある</div><div class="ex">I have <b>a</b> sister.</div><div class="xj">私には姉が1人います。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">I</span><span class="ps">代</span></div><div class="ja">私は；私が</div><div class="ex"><b>I</b> like music.</div><div class="xj">私は音楽が好きです。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">you</span><span class="ps">代</span></div><div class="ja">あなたは；あなたを；あなたたち</div><div class="ex"><b>You</b> are very kind.</div><div class="xj">あなたはとても親切ですね。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">do</span><span class="ps">動</span></div><div class="ja">する</div><div class="ex">I <b>do</b> my homework after dinner.</div><div class="xj">私は夕食のあとに宿題をします。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">in</span><span class="ps">前</span></div><div class="ja">～の中に；～で</div><div class="ex">I have a pen <b>in</b> my bag.</div><div class="xj">私のかばんの中にペンが入っています。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">is</span><span class="ps">動</span></div><div class="ja">（he・she・it などが主語で）～である；いる</div><div class="ex">This <b>is</b> my bag.</div><div class="xj">これは私のかばんです。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">it</span><span class="ps">代</span></div><div class="ja">それは；それを</div><div class="ex">A: Do you like curry?<br>B: Yes, I love <b>it</b>.</div><div class="xj">A：カレーは好きですか。B：はい、それが大好きです。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">have</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">持っている；飼っている；食べる</div><div class="ex">I <b>have</b> a dog.</div><div class="xj">私は犬を飼っています。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">want to ～</span><span class="ps">熟</span></div><div class="ja">～したい</div><div class="ex">I <b>want to</b> go to Hokkaido.</div><div class="xj">私は北海道へ行きたいです。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">and</span><span class="ps">接</span></div><div class="ja">～と…；そして</div><div class="ex">I like dogs <b>and</b> cats.</div><div class="xj">私は犬とネコが好きです。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">for</span><span class="ps">前</span></div><div class="ja">～のために；～用の；～の間</div><div class="ex">This is <b>for</b> you.</div><div class="xj">これはあなたのためのものです。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">of</span><span class="ps">前</span></div><div class="ja">～の</div><div class="ex">This is a picture <b>of</b> my family.</div><div class="xj">これは私の家族の写真です。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">not</span><span class="ps">副</span></div><div class="ja">～でない；～しない</div><div class="ex">I’m <b>not</b> a teacher.</div><div class="xj">私は先生ではありません。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">about</span><span class="ps">前</span></div><div class="ja">～について</div><div class="ex">Tell me <b>about</b> your town.</div><div class="xj">あなたの町について教えて。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">are</span><span class="ps">動</span></div><div class="ja">（you・we・they が主語で）～である；いる</div><div class="ex">You <b>are</b> my friend.</div><div class="xj">あなたは私の友だちです。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">at</span><span class="ps">前</span></div><div class="ja">～で；～に（時刻）</div><div class="ex">Let’s meet <b>at</b> the station.</div><div class="xj">駅で会いましょう。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">this</span><span class="ps">代</span></div><div class="ja">これ；この</div><div class="ex">Is <b>this</b> your notebook?</div><div class="xj">これはあなたのノートですか。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">my</span><span class="ps">代</span></div><div class="ja">私の</div><div class="ex">Please come to <b>my</b> house.</div><div class="xj">私の家に来てください。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">many</span><span class="ps">形</span></div><div class="ja">たくさんの；多くの</div><div class="ex">I have <b>many</b> friends.</div><div class="xj">私にはたくさんの友だちがいます。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">good</span><span class="ps">形</span></div><div class="ja">よい；上手な</div><div class="ex">I have a <b>good</b> idea.</div><div class="xj">私によい考えがあります。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">go</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">行く</div><div class="ex">We <b>go</b> to the sea in summer.</div><div class="xj">私たちは夏に海へ行きます。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">look at ～</span><span class="ps">熟</span></div><div class="ja">～を見る</div><div class="ex"><b>Look at</b> this picture.</div><div class="xj">この絵を見て。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">want</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">～がほしい；（want to ～で）～したい</div><div class="ex">I <b>want</b> a new bag.</div><div class="xj">私は新しいかばんがほしいです。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">with</span><span class="ps">前</span></div><div class="ja">～と（いっしょに）；～を使って</div><div class="ex">I play tennis <b>with</b> my friends.</div><div class="xj">私は友だちとテニスをします。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">we</span><span class="ps">代</span></div><div class="ja">私たちは；私たちが</div><div class="ex"><b>We</b> are classmates.</div><div class="xj">私たちはクラスメイトです。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">so</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">とても；そのように</div><div class="ex">I’m <b>so</b> happy.</div><div class="xj">私はとてもうれしいです。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">how</span><span class="ps">副</span></div><div class="ja">どう；どのように；どれくらい</div><div class="ex">A: I’m hungry. <b>How</b> about you?<br>B: Me, too.</div><div class="xj">A：おなかがすいたよ。あなたはどう？B：私も。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"1": 4.48, "2": 18.22, "3": 31.71, "4": 43.99, "5": 56.59, "6": 68.58, "7": 81.56, "8": 94.3, "9": 108.1, "10": 123.6, "11": 138.9, "12": 151.72, "13": 164.31, "14": 177.68, "15": 191.28, "16": 204.07, "17": 217.6, "18": 230.24, "19": 245.19, "20": 258.87, "21": 271.08, "22": 283.46, "23": 296.2, "24": 308.8, "25": 321.32, "26": 333.65, "27": 348.82, "28": 363.67, "29": 377.03, "30": 389.82}, "TE": {"1": 6.35, "2": 20.1, "3": 33.58, "4": 45.86, "5": 58.2, "6": 70.46, "7": 83.44, "8": 96.18, "9": 109.97, "10": 125.47, "11": 140.78, "12": 153.59, "13": 166.18, "14": 179.57, "15": 193.15, "16": 205.94, "17": 219.47, "18": 232.12, "19": 247.06, "20": 260.74, "21": 272.95, "22": 285.33, "23": 298.07, "24": 310.67, "25": 323.22, "26": 335.52, "27": 350.69, "28": 365.54, "29": 378.9, "30": 391.69}, "Q": [[1, "（～に）なる", "be"], [2, "～へ", "to"], [3, "その", "the"], [4, "1つの",
