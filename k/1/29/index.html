</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル1　第29回</h1><div class="sub">No.841〜870</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../29.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="841"><div class="top"><span class="no">841</span><span class="en">headache</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">頭痛</div><div class="ex">I had a bad <b>headache</b> last night.</div><div class="xj">昨夜はひどい頭痛がしました。</div></button></li><li><button class="w" data-no="842"><div class="top"><span class="no">842</span><span class="en">Thailand</span><span class="ps">名</span></div><div class="ja">タイ</div><div class="ex">My cousin lives in <b>Thailand</b>.</div><div class="xj">いとこはタイに住んでいます。</div></button></li><li><button class="w" data-no="843"><div class="top"><span class="no">843</span><span class="en">carrot</span><span class="ps">名</span></div><div class="ja">ニンジン</div><div class="ex">Emi doesn’t like <b>carrots</b>.</div><div class="xj">エミはニンジンが好きではありません。</div></button></li><li><button class="w" data-no="844"><div class="top"><span class="no">844</span><span class="en">moon</span><span class="ps">名</span></div><div class="ja">月</div><div class="ex">We looked at the full <b>moon</b>.</div><div class="xj">私たちは満月を見ました。</div></button></li><li><button class="w" data-no="845"><div class="top"><span class="no">845</span><span class="en">sofa</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ソファー</div><div class="ex">My cat is sleeping on the <b>sofa</b>.</div><div class="xj">私のネコはソファーの上で眠っています。</div></button></li><li><button class="w" data-no="846"><div class="top"><span class="no">846</span><span class="en">get home</span><span class="ps">熟</span></div><div class="ja">家に帰る</div><div class="ex">I <b>got home</b> at six yesterday.</div><div class="xj">私は昨日6時に家に帰りました。</div></button></li><li><button class="w" data-no="847"><div class="top"><span class="no">847</span><span class="en">noodle</span><span class="ps">名</span></div><div class="ja">めん類</div><div class="ex">We ate hot <b>noodles</b> on a cold day.</div><div class="xj">私たちは寒い日に温かいめんを食べました。</div></button></li><li><button class="w" data-no="848"><div class="top"><span class="no">848</span><span class="en">slept</span><span class="ps">動</span></div><div class="ja">眠った（sleep の過去形）</div><div class="ex">I <b>slept</b> for ten hours last night.</div><div class="xj">私は昨夜10時間眠りました。</div></button></li><li><button class="w" data-no="849"><div class="top"><span class="no">849</span><span class="en">Christmas</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">クリスマス</div><div class="ex">We sang <b>Christmas</b> songs at school.</div><div class="xj">私たちは学校でクリスマスの歌を歌いました。</div></button></li><li><button class="w" data-no="850"><div class="top"><span class="no">850</span><span class="en">salt</span><span class="ps">名</span></div><div class="ja">塩</div><div class="ex">Put a little <b>salt</b> in the soup.</div><div class="xj">スープに塩を少し入れて。</div></button></li><li><button class="w" data-no="851"><div class="top"><span class="no">851</span><span class="en">See you.</span><span class="ps">熟</span></div><div class="ja">またね</div><div class="ex">A: I’m going home now.<br>B: OK. <b>See you.</b></div><div class="xj">A：今から家に帰るよ。B：うん。またね。</div></button></li><li><button class="w" data-no="852"><div class="top"><span class="no">852</span><span class="en">sweater</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">セーター</div><div class="ex">My grandmother made this <b>sweater</b> for me.</div><div class="xj">祖母が私にこのセーターを作ってくれました。</div></button></li><li><button class="w" data-no="853"><div class="top"><span class="no">853</span><span class="en">rose</span><span class="ps">名</span></div><div class="ja">バラ</div><div class="ex">We grew red <b>roses</b> in the garden.</div><div class="xj">私たちは庭で赤いバラを育てました。</div></button></li><li><button class="w" data-no="854"><div class="top"><span class="no">854</span><span class="en">strawberry</span><span class="ps">名</span></div><div class="ja">イチゴ</div><div class="ex">My sister ate all the <b>strawberries</b>.</div><div class="xj">姉がそのイチゴを全部食べました。</div></button></li><li><button class="w" data-no="855"><div class="top"><span class="no">855</span><span class="en">thirsty</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">のどがかわいた</div><div class="ex">We were very <b>thirsty</b> after the game.</div><div class="xj">私たちは試合のあと、とてものどがかわいていました。</div></button></li><li><button class="w" data-no="856"><div class="top"><span class="no">856</span><span class="en">finger</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">指</div><div class="ex">The baby is holding my <b>finger</b>.</div><div class="xj">赤ちゃんが私の指をにぎっています。</div></button></li><li><button class="w" data-no="857"><div class="top"><span class="no">857</span><span class="en">turn left</span><span class="ps">熟</span></div><div class="ja">左に曲がる</div><div class="ex"><b>Turn left</b> at the park.</div><div class="xj">公園のところで左に曲がってください。</div></button></li><li><button class="w" data-no="858"><div class="top"><span class="no">858</span><span class="en">foot</span><span class="ps">名</span></div><div class="ja">足（足首から先）</div><div class="ex">Ken is standing on his left <b>foot</b>.</div><div class="xj">ケンは左足で立っています。</div></button></li><li><button class="w" data-no="859"><div class="top"><span class="no">859</span><span class="en">rainbow</span><span class="ps">名</span></div><div class="ja">にじ</div><div class="ex">We saw a beautiful <b>rainbow</b> in the sky.</div><div class="xj">空に美しいにじが見えました。</div></button></li><li><button class="w" data-no="860"><div class="top"><span class="no">860</span><span class="en">ninety</span><span class="ps">数</span></div><div class="ja">90（の）</div><div class="ex">I got <b>ninety</b> points on the test.</div><div class="xj">私はテストで90点を取りました。</div></button></li><li><button class="w" data-no="861"><div class="top"><span class="no">861</span><span class="en">photographer</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">写真家；カメラマン</div><div class="ex">The <b>photographer</b> took pictures of animals.</div><div class="xj">その写真家は動物の写真をとりました。</div></button></li><li><button class="w" data-no="862"><div class="top"><span class="no">862</span><span class="en">turn right</span><span class="ps">熟</span></div><div class="ja">右に曲がる</div><div class="ex">The bus <b>turned right</b> at the station.</div><div class="xj">バスは駅のところで右に曲がりました。</div></button></li><li><button class="w" data-no="863"><div class="top"><span class="no">863</span><span class="en">bell</span><span class="ps">名</span></div><div class="ja">ベル；鐘</div><div class="ex">Our school has an old <b>bell</b>.</div><div class="xj">私たちの学校には古い鐘があります。</div></button></li><li><button class="w" data-no="864"><div class="top"><span class="no">864</span><span class="en">dancer</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ダンサー</div><div class="ex">Yuki wants to be a <b>dancer</b>.</div><div class="xj">ユキはダンサーになりたいと思っています。</div></button></li><li><button class="w" data-no="865"><div class="top"><span class="no">865</span><span class="en">eighth</span><span class="ps">数</span></div><div class="ja">8番目（の）；（日付の）8日</div><div class="ex">Ken finished <b>eighth</b> in the race.</div><div class="xj">ケンはレースで8位でした。</div></button></li><li><button class="w" data-no="866"><div class="top"><span class="no">866</span><span class="en">glasses</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">めがね</div><div class="ex">I can’t find my <b>glasses</b>.</div><div class="xj">私のめがねが見つかりません。</div></button></li><li><button class="w" data-no="867"><div class="top"><span class="no">867</span><span class="en">seafood</span><span class="ps">名</span></div><div class="ja">魚介類；シーフード</div><div class="ex">We ate delicious <b>seafood</b> in Hokkaido.</div><div class="xj">私たちは北海道でおいしい魚介類を食べました。</div></button></li><li><button class="w" data-no="868"><div class="top"><span class="no">868</span><span class="en">go fishing</span><span class="ps">熟</span></div><div class="ja">釣りに行く</div><div class="ex">My father and I <b>went fishing</b> in the river.</div><div class="xj">父と私は川へ釣りに行きました。</div></button></li><li><button class="w" data-no="869"><div class="top"><span class="no">869</span><span class="en">violin</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">バイオリン</div><div class="ex">Emi played the <b>violin</b> at the concert.</div><div class="xj">エミはコンサートでバイオリンをひきました。</div></button></li><li><button class="w" data-no="870"><div class="top"><span class="no">870</span><span class="en">candy</span><span class="ps">名</span></div><div class="ja">あめ；キャンディー</div><div class="ex">Please don’t eat <b>candy</b> before dinner.</div><div class="xj">夕食の前にあめを食べないでください。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../28/">← 第28回</a><a href="../30/">第30回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"841": 4.91, "842": 18.43, "843": 31.81, "844": 44.91, "845": 57.93, "846": 71.48, "847": 84.93, "848": 98.82, "849": 113.5, "850": 127.22, "851": 140.38, "852": 157.43, "853": 171.13, "854": 184.73, "855": 198.5, "856": 212.4, "857": 225.78
