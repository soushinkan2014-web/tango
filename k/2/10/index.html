</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第10回</h1><div class="sub">No.271〜300</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../10.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="271"><div class="top"><span class="no">271</span><span class="en">during</span><span class="ps">前</span><span class="ek">英4</span></div><div class="ja">～の間ずっと；～の間中</div><div class="ex">I stayed in Hokkaido <b>during</b> the summer vacation.</div><div class="xj">私は夏休みの間ずっと北海道にいました。</div></button></li><li><button class="w" data-no="272"><div class="top"><span class="no">272</span><span class="en">add</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">加える</div><div class="ex"><b>Add</b> some salt to the soup.</div><div class="xj">スープに塩を少し加えなさい。</div></button></li><li><button class="w" data-no="273"><div class="top"><span class="no">273</span><span class="en">known</span><span class="ps">形</span></div><div class="ja">知られた（know の過去分詞）</div><div class="ex">Kyoto is a well-<b>known</b> city in Japan.</div><div class="xj">京都は日本のよく知られた都市です。</div></button></li><li><button class="w" data-no="274"><div class="top"><span class="no">274</span><span class="en">prefecture</span><span class="ps">名</span></div><div class="ja">県</div><div class="ex">Nara <b>Prefecture</b> has many old temples.</div><div class="xj">奈良県には古いお寺がたくさんあります。</div></button></li><li><button class="w" data-no="275"><div class="top"><span class="no">275</span><span class="en">art museum</span><span class="ps">熟</span></div><div class="ja">美術館</div><div class="ex">We visited the <b>art museum</b> last Saturday.</div><div class="xj">私たちはこの前の土曜日に美術館を訪れました。</div></button></li><li><button class="w" data-no="276"><div class="top"><span class="no">276</span><span class="en">bye</span><span class="ps">間</span></div><div class="ja">さようなら；じゃあね</div><div class="ex"><b>Bye</b>, Dad. I’ll be back at five.</div><div class="xj">じゃあね、お父さん。5時に帰るよ。</div></button></li><li><button class="w" data-no="277"><div class="top"><span class="no">277</span><span class="en">same</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">同じもの；同じこと</div><div class="ex">A: I’ll have pizza.<br>B: I’ll have the <b>same</b>.</div><div class="xj">A：ピザにします。B：私も同じものにします。</div></button></li><li><button class="w" data-no="278"><div class="top"><span class="no">278</span><span class="en">broken</span><span class="ps">形</span></div><div class="ja">壊れた（break の過去分詞）</div><div class="ex">Don’t use this <b>broken</b> chair.</div><div class="xj">この壊れたいすを使わないで。</div></button></li><li><button class="w" data-no="279"><div class="top"><span class="no">279</span><span class="en">paint</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（絵の具で）描く；ペンキを塗る</div><div class="ex">Yuki <b>paints</b> pictures of the sea.</div><div class="xj">ユキは海の絵を描きます。</div></button></li><li><button class="w" data-no="280"><div class="top"><span class="no">280</span><span class="en">clear</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">晴れた；澄んだ；はっきりした</div><div class="ex">The sky was <b>clear</b> this morning.</div><div class="xj">今朝は空が晴れていました。</div></button></li><li><button class="w" data-no="281"><div class="top"><span class="no">281</span><span class="en">he’ll</span><span class="ps">代</span></div><div class="ja">彼は～するだろう（he will の短縮形）</div><div class="ex"><b>He’ll</b> come back soon.</div><div class="xj">彼はすぐに戻ってくるでしょう。</div></button></li><li><button class="w" data-no="282"><div class="top"><span class="no">282</span><span class="en">call</span><span class="ps">名</span></div><div class="ja">電話（の呼び出し）；呼びかけ</div><div class="ex">I got a <b>call</b> from Yuki last night.</div><div class="xj">昨夜ユキから電話がありました。</div></button></li><li><button class="w" data-no="283"><div class="top"><span class="no">283</span><span class="en">million</span><span class="ps">数</span><span class="ek">英3</span></div><div class="ja">100万（の）</div><div class="ex">One <b>million</b> yen is a lot of money.</div><div class="xj">100万円は大金です。</div></button></li><li><button class="w" data-no="284"><div class="top"><span class="no">284</span><span class="en">poor</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">かわいそうな；貧しい</div><div class="ex">The <b>poor</b> cat was very hungry.</div><div class="xj">そのかわいそうなネコはとてもおなかがすいていました。</div></button></li><li><button class="w" data-no="285"><div class="top"><span class="no">285</span><span class="en">temperature</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">気温；温度</div><div class="ex">The <b>temperature</b> is high today.</div><div class="xj">今日は気温が高いです。</div></button></li><li><button class="w" data-no="286"><div class="top"><span class="no">286</span><span class="en">out of ～</span><span class="ps">熟</span></div><div class="ja">～の中から外へ</div><div class="ex">A cat jumped <b>out of</b> the box.</div><div class="xj">ネコが箱から飛び出しました。</div></button></li><li><button class="w" data-no="287"><div class="top"><span class="no">287</span><span class="en">accident</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">事故</div><div class="ex">There was a car <b>accident</b> near the station.</div><div class="xj">駅の近くで自動車事故がありました。</div></button></li><li><button class="w" data-no="288"><div class="top"><span class="no">288</span><span class="en">second</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">第二に；次に</div><div class="ex"><b>Second</b>, add some milk to the eggs.</div><div class="xj">第二に、卵に牛乳を加えなさい。</div></button></li><li><button class="w" data-no="289"><div class="top"><span class="no">289</span><span class="en">successful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">成功した</div><div class="ex">The school festival was very <b>successful</b>.</div><div class="xj">文化祭は大いに成功しました。</div></button></li><li><button class="w" data-no="290"><div class="top"><span class="no">290</span><span class="en">tablet</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">タブレット</div><div class="ex">We use <b>tablets</b> in English class.</div><div class="xj">私たちは英語の授業でタブレットを使います。</div></button></li><li><button class="w" data-no="291"><div class="top"><span class="no">291</span><span class="en">attention</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">注意；注目</div><div class="ex">Please pay <b>attention</b> to the teacher.</div><div class="xj">先生の話に注意を払ってください。</div></button></li><li><button class="w" data-no="292"><div class="top"><span class="no">292</span><span class="en">hit</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">打つ；ぶつける</div><div class="ex">Ken can <b>hit</b> the ball very far.</div><div class="xj">ケンはボールをとても遠くまで打つことができます。</div></button></li><li><button class="w" data-no="293"><div class="top"><span class="no">293</span><span class="en">just</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">ちょうど；まさに</div><div class="ex">It’s <b>just</b> six o’clock now.</div><div class="xj">今ちょうど6時です。</div></button></li><li><button class="w" data-no="294"><div class="top"><span class="no">294</span><span class="en">positive</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">前向きな；積極的な</div><div class="ex">Ken is always <b>positive</b>.</div><div class="xj">ケンはいつも前向きです。</div></button></li><li><button class="w" data-no="295"><div class="top"><span class="no">295</span><span class="en">taste</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">味；味見する</div><div class="ex">I like the <b>taste</b> of this soup.</div><div class="xj">私はこのスープの味が好きです。</div></button></li><li><button class="w" data-no="296"><div class="top"><span class="no">296</span><span class="en">wood</span><span class="ps">名</span></div><div class="ja">木材；木</div><div class="ex">We need some <b>wood</b> for the campfire.</div><div class="xj">私たちはキャンプファイヤー用の木材が必要です。</div></button></li><li><button class="w" data-no="297"><div class="top"><span class="no">297</span><span class="en">plastic bag</span><span class="ps">名</span></div><div class="ja">ビニール袋；レジ袋</div><div class="ex">I don’t need a <b>plastic bag</b>.</div><div class="xj">レジ袋はいりません。</div></button></li><li><button class="w" data-no="298"><div class="top"><span class="no">298</span><span class="en">back</span><span class="ps">名</span></div><div class="ja">後ろ；裏；背中</div><div class="ex">There is a garden at the <b>back</b> of the house.</div><div class="xj">その家の裏には庭があります。</div></button></li><li><button class="w" data-no="299"><div class="top"><span class="no">299</span><span class="en">education</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">教育</div><div class="ex"><b>Education</b> is important for children.</div><div class="xj">教育は子どもたちにとって大切です。</div></button></li><li><button class="w" data-no="300"><div class="top"><span class="no">300</span><span class="en">drew</span><span class="ps">動</span></div><div class="ja">描いた；（線を）引いた（draw の過去形）</div><div class="ex">Yuki <b>drew</b> a picture of her dog.</div><div class="xj">ユキは自分の犬の絵を描きました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../09/">← 第9回</a><a href="../11/">第11回 →</a></nav></main><footer>創心館オ
