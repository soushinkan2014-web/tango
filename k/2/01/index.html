</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第1回</h1><div class="sub">No.1〜30</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../01.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="1"><div class="top"><span class="no">1</span><span class="en">will</span><span class="ps">助</span></div><div class="ja">～だろう；～するつもりだ</div><div class="ex">Tom <b>will</b> be busy tomorrow.</div><div class="xj">トムは明日忙しいでしょう。</div></button></li><li><button class="w" data-no="2"><div class="top"><span class="no">2</span><span class="en">more</span><span class="ps">形</span></div><div class="ja">もっと多くの；（比較）もっと～</div><div class="ex">Can I have some <b>more</b> juice?</div><div class="xj">ジュースをもう少しもらえますか。</div></button></li><li><button class="w" data-no="3"><div class="top"><span class="no">3</span><span class="en">if</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">もし～ならば</div><div class="ex"><b>If</b> you are free, let’s play tennis.</div><div class="xj">もしひまなら、テニスをしよう。</div></button></li><li><button class="w" data-no="4"><div class="top"><span class="no">4</span><span class="en">learn</span><span class="ps">動</span></div><div class="ja">学ぶ；習う</div><div class="ex">We <b>learned</b> a lot from the game.</div><div class="xj">私たちはその試合から多くのことを学びました。</div></button></li><li><button class="w" data-no="5"><div class="top"><span class="no">5</span><span class="en">to</span><span class="ps">前</span></div><div class="ja">～まで</div><div class="ex">The shop is open from ten <b>to</b> seven.</div><div class="xj">その店は10時から7時まで開いています。</div></button></li><li><button class="w" data-no="6"><div class="top"><span class="no">6</span><span class="en">should</span><span class="ps">助</span><span class="ek">英4</span></div><div class="ja">～したほうがよい；～すべきだ</div><div class="ex">You <b>should</b> see this movie.</div><div class="xj">この映画は見たほうがいいよ。</div></button></li><li><button class="w" data-no="7"><div class="top"><span class="no">7</span><span class="en">ask</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">たずねる；質問する</div><div class="ex">I <b>asked</b> Mr. Sato about the homework.</div><div class="xj">私は佐藤先生に宿題についてたずねました。</div></button></li><li><button class="w" data-no="8"><div class="top"><span class="no">8</span><span class="en">hear</span><span class="ps">動</span></div><div class="ja">聞こえる；聞く</div><div class="ex">I <b>heard</b> a nice song on the radio.</div><div class="xj">ラジオですてきな歌を聞きました。</div></button></li><li><button class="w" data-no="9"><div class="top"><span class="no">9</span><span class="en">could</span><span class="ps">助</span></div><div class="ja">～できた（can の過去形）</div><div class="ex">I <b>could</b> see many stars last night.</div><div class="xj">昨夜は星がたくさん見えました。</div></button></li><li><button class="w" data-no="10"><div class="top"><span class="no">10</span><span class="en">one of ～</span><span class="ps">熟</span></div><div class="ja">～の1つ；～の1人</div><div class="ex"><b>One of</b> my friends lives in Canada.</div><div class="xj">私の友だちの1人はカナダに住んでいます。</div></button></li><li><button class="w" data-no="11"><div class="top"><span class="no">11</span><span class="en">a</span><span class="ps">冠</span></div><div class="ja">～につき；～ごとに</div><div class="ex">Mr. Sato runs ten kilometers <b>a</b> week.</div><div class="xj">佐藤先生は1週間に10キロメートル走ります。</div></button></li><li><button class="w" data-no="12"><div class="top"><span class="no">12</span><span class="en">as</span><span class="ps">前</span></div><div class="ja">～として</div><div class="ex">My aunt works <b>as</b> a nurse.</div><div class="xj">おばは看護師として働いています。</div></button></li><li><button class="w" data-no="13"><div class="top"><span class="no">13</span><span class="en">said</span><span class="ps">動</span></div><div class="ja">言った（say の過去形）</div><div class="ex">Emi <b>said</b> that she was tired.</div><div class="xj">エミは疲れていると言いました。</div></button></li><li><button class="w" data-no="14"><div class="top"><span class="no">14</span><span class="en">become</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">～になる</div><div class="ex">I want to <b>become</b> a nurse.</div><div class="xj">私は看護師になりたいです。</div></button></li><li><button class="w" data-no="15"><div class="top"><span class="no">15</span><span class="en">made</span><span class="ps">動</span></div><div class="ja">作った（make の過去形・過去分詞）</div><div class="ex">Emi <b>made</b> lunch for her family.</div><div class="xj">エミは家族のために昼食を作りました。</div></button></li><li><button class="w" data-no="16"><div class="top"><span class="no">16</span><span class="en">in</span><span class="ps">前</span></div><div class="ja">（今から）～後に</div><div class="ex">The next bus leaves <b>in</b> ten minutes.</div><div class="xj">次のバスは10分後に出ます。</div></button></li><li><button class="w" data-no="17"><div class="top"><span class="no">17</span><span class="en">interested</span><span class="ps">形</span></div><div class="ja">興味を持った</div><div class="ex">Emi was <b>interested</b> in the story.</div><div class="xj">エミはその話に興味を持ちました。</div></button></li><li><button class="w" data-no="18"><div class="top"><span class="no">18</span><span class="en">hope</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">望む；願う</div><div class="ex">A: Can we win the game?<br>B: I <b>hope</b> so.</div><div class="xj">A：私たちは試合に勝てるかな。B：そう願うよ。</div></button></li><li><button class="w" data-no="19"><div class="top"><span class="no">19</span><span class="en">each</span><span class="ps">形</span></div><div class="ja">それぞれの；各～</div><div class="ex"><b>Each</b> student has a computer.</div><div class="xj">それぞれの生徒がコンピューターを持っています。</div></button></li><li><button class="w" data-no="20"><div class="top"><span class="no">20</span><span class="en">be interested in ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～に興味がある</div><div class="ex">Ken <b>is interested in</b> old cars.</div><div class="xj">ケンは古い車に興味があります。</div></button></li><li><button class="w" data-no="21"><div class="top"><span class="no">21</span><span class="en">different</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">違う；異なる</div><div class="ex">Ken and I have <b>different</b> ideas.</div><div class="xj">ケンと私は違う考えを持っています。</div></button></li><li><button class="w" data-no="22"><div class="top"><span class="no">22</span><span class="en">for</span><span class="ps">前</span></div><div class="ja">～の間</div><div class="ex">I lived in Kyoto <b>for</b> three years.</div><div class="xj">私は3年間京都に住んでいました。</div></button></li><li><button class="w" data-no="23"><div class="top"><span class="no">23</span><span class="en">understand</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">理解する；わかる</div><div class="ex">I can’t <b>understand</b> this question.</div><div class="xj">私はこの問題が理解できません。</div></button></li><li><button class="w" data-no="24"><div class="top"><span class="no">24</span><span class="en">difficult</span><span class="ps">形</span></div><div class="ja">難しい</div><div class="ex">This question is <b>difficult</b> for me.</div><div class="xj">この問題は私には難しいです。</div></button></li><li><button class="w" data-no="25"><div class="top"><span class="no">25</span><span class="en">thought</span><span class="ps">動</span></div><div class="ja">思った；考えた（think の過去形）</div><div class="ex">I <b>thought</b> the movie was interesting.</div><div class="xj">私はその映画はおもしろいと思いました。</div></button></li><li><button class="w" data-no="26"><div class="top"><span class="no">26</span><span class="en">leave</span><span class="ps">動</span></div><div class="ja">出発する；去る；離れる</div><div class="ex">I <b>leave</b> home at seven every morning.</div><div class="xj">私は毎朝7時に家を出ます。</div></button></li><li><button class="w" data-no="27"><div class="top"><span class="no">27</span><span class="en">of</span><span class="ps">前</span></div><div class="ja">～のうちの；～の中で</div><div class="ex">Two <b>of</b> my friends live in Kyoto.</div><div class="xj">私の友だちのうち2人は京都に住んでいます。</div></button></li><li><button class="w" data-no="28"><div class="top"><span class="no">28</span><span class="en">told</span><span class="ps">動</span></div><div class="ja">話した；言った（tell の過去形・過去分詞）</div><div class="ex">Ken <b>told</b> me about his trip.</div><div class="xj">ケンは私に旅行のことを話してくれました。</div></button></li><li><button class="w" data-no="29"><div class="top"><span class="no">29</span><span class="en">most</span><span class="ps">形</span></div><div class="ja">ほとんどの；（比較）最も～</div><div class="ex"><b>Most</b> students in my class walk to school.</div><div class="xj">私のクラスのほとんどの生徒は歩いて通学します。</div></button></li><li><button class="w" data-no="30"><div class="top"><span class="no">30</span><span class="en">future</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">将来；未来</div><div class="ex">What do you want to be in the <b>future</b>?</div><div class="xj">あなたは将来何になりたいですか。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../">回の一覧</a><a href="../02/">第2回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"1": 4.24, "2": 18.46, "3": 32.6, "4": 46.13, "5": 58.84, "6": 71.92, "7": 86.15, "8": 100.04, "9": 113.21, "10": 127.25, "11": 141.74, "12": 156.86, "13": 169.64, "14": 182.67, "15": 195.22, "16": 209.74, "17": 223.34, "18": 236.3, "19": 251.1, "20": 264.65, "21": 278.83, "22
