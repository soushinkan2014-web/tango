</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第23回</h1><div class="sub">No.661〜690</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../23.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="661"><div class="top"><span class="no">661</span><span class="en">natural</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">自然の；天然の</div><div class="ex">This is a <b>natural</b> lake.</div><div class="xj">これは自然の湖です。</div></button></li><li><button class="w" data-no="662"><div class="top"><span class="no">662</span><span class="en">exchange</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">交換；交流</div><div class="ex">We had an <b>exchange</b> of ideas in class.</div><div class="xj">私たちは授業で意見の交換をしました。</div></button></li><li><button class="w" data-no="663"><div class="top"><span class="no">663</span><span class="en">because of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～のために；～が原因で</div><div class="ex">The game was stopped <b>because of</b> the rain.</div><div class="xj">試合は雨のために中止されました。</div></button></li><li><button class="w" data-no="664"><div class="top"><span class="no">664</span><span class="en">comic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">漫画</div><div class="ex">My brother reads <b>comics</b> before bed.</div><div class="xj">私の兄は寝る前に漫画を読みます。</div></button></li><li><button class="w" data-no="665"><div class="top"><span class="no">665</span><span class="en">entrance</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">入り口</div><div class="ex">Let’s meet at the <b>entrance</b> of the museum.</div><div class="xj">博物館の入り口で会いましょう。</div></button></li><li><button class="w" data-no="666"><div class="top"><span class="no">666</span><span class="en">be happy to ～</span><span class="ps">熟</span></div><div class="ja">～してうれしい</div><div class="ex">Yuki <b>was happy to</b> see her old friend.</div><div class="xj">ユキは昔の友だちに会えてうれしかったです。</div></button></li><li><button class="w" data-no="667"><div class="top"><span class="no">667</span><span class="en">shrine</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">神社</div><div class="ex">There is a small <b>shrine</b> on the hill.</div><div class="xj">丘の上に小さな神社があります。</div></button></li><li><button class="w" data-no="668"><div class="top"><span class="no">668</span><span class="en">percentage</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">割合；パーセンテージ</div><div class="ex">The <b>percentage</b> of boys in this club is high.</div><div class="xj">この部の男子の割合は高いです。</div></button></li><li><button class="w" data-no="669"><div class="top"><span class="no">669</span><span class="en">on the internet</span><span class="ps">熟</span></div><div class="ja">インターネットで</div><div class="ex">I found this cake recipe <b>on the internet</b>.</div><div class="xj">私はこのケーキのレシピをインターネットで見つけました。</div></button></li><li><button class="w" data-no="670"><div class="top"><span class="no">670</span><span class="en">seat</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">座席</div><div class="ex">Let’s find our <b>seats</b> before the movie starts.</div><div class="xj">映画が始まる前に私たちの座席を見つけましょう。</div></button></li><li><button class="w" data-no="671"><div class="top"><span class="no">671</span><span class="en">condition</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">状態；条件</div><div class="ex">My old bike is still in good <b>condition</b>.</div><div class="xj">私の古い自転車はまだよい状態です。</div></button></li><li><button class="w" data-no="672"><div class="top"><span class="no">672</span><span class="en">both ～ and ...</span><span class="ps">熟</span></div><div class="ja">～も…も両方とも</div><div class="ex">I like <b>both dogs and cats</b>.</div><div class="xj">私は犬もねこも両方とも好きです。</div></button></li><li><button class="w" data-no="673"><div class="top"><span class="no">673</span><span class="en">step</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">段；一歩</div><div class="ex">This old temple has three hundred <b>steps</b>.</div><div class="xj">この古い寺には300の段があります。</div></button></li><li><button class="w" data-no="674"><div class="top"><span class="no">674</span><span class="en">accept</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を受け入れる</div><div class="ex">My teacher <b>accepted</b> my idea.</div><div class="xj">先生は私の考えを受け入れました。</div></button></li><li><button class="w" data-no="675"><div class="top"><span class="no">675</span><span class="en">conversation</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">会話</div><div class="ex">I had a long <b>conversation</b> with my grandfather.</div><div class="xj">私は祖父と長い会話をしました。</div></button></li><li><button class="w" data-no="676"><div class="top"><span class="no">676</span><span class="en">the number of ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～の数</div><div class="ex"><b>The number of</b> visitors is growing every year.</div><div class="xj">訪問者の数は毎年増えています。</div></button></li><li><button class="w" data-no="677"><div class="top"><span class="no">677</span><span class="en">schedule</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">予定；予定表</div><div class="ex">What is your <b>schedule</b> for tomorrow?</div><div class="xj">明日のあなたの予定は何ですか。</div></button></li><li><button class="w" data-no="678"><div class="top"><span class="no">678</span><span class="en">character</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">登場人物；キャラクター</div><div class="ex">Who is your favorite <b>character</b> in this story?</div><div class="xj">この物語であなたのいちばん好きな登場人物はだれですか。</div></button></li><li><button class="w" data-no="679"><div class="top"><span class="no">679</span><span class="en">begin to ～</span><span class="ps">熟</span></div><div class="ja">（だんだん）～し始める</div><div class="ex">The leaves <b>began to</b> change color in October.</div><div class="xj">10月に葉の色が変わり始めました。</div></button></li><li><button class="w" data-no="680"><div class="top"><span class="no">680</span><span class="en">comfortable</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">心地よい；快適な</div><div class="ex">This sofa is more <b>comfortable</b> than that one.</div><div class="xj">このソファはあのソファより心地よいです。</div></button></li><li><button class="w" data-no="681"><div class="top"><span class="no">681</span><span class="en">strange</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">奇妙な；見知らぬ</div><div class="ex">This fruit has a <b>strange</b> shape.</div><div class="xj">この果物は奇妙な形をしています。</div></button></li><li><button class="w" data-no="682"><div class="top"><span class="no">682</span><span class="en">for a long time</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">長い間</div><div class="ex">We waited for the bus <b>for a long time</b>.</div><div class="xj">私たちは長い間バスを待ちました。</div></button></li><li><button class="w" data-no="683"><div class="top"><span class="no">683</span><span class="en">survey</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（アンケート）調査</div><div class="ex">We did a <b>survey</b> about school lunch.</div><div class="xj">私たちは学校給食について調査をしました。</div></button></li><li><button class="w" data-no="684"><div class="top"><span class="no">684</span><span class="en">wonder</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～だろうかと思う</div><div class="ex">I <b>wonder</b> if Ken will come to the party.</div><div class="xj">ケンはパーティーに来るだろうかと思います。</div></button></li><li><button class="w" data-no="685"><div class="top"><span class="no">685</span><span class="en">Could you ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～していただけませんか</div><div class="ex"><b>Could you</b> carry this bag for me?</div><div class="xj">このかばんを運んでいただけませんか。</div></button></li><li><button class="w" data-no="686"><div class="top"><span class="no">686</span><span class="en">graduate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">卒業する</div><div class="ex">My brother will <b>graduate</b> from high school next spring.</div><div class="xj">私の兄は来年の春に高校を卒業します。</div></button></li><li><button class="w" data-no="687"><div class="top"><span class="no">687</span><span class="en">active</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">活動的な；活発な</div><div class="ex">My grandfather is still very <b>active</b>.</div><div class="xj">私の祖父は今でもとても活動的です。</div></button></li><li><button class="w" data-no="688"><div class="top"><span class="no">688</span><span class="en">disaster</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">災害；大惨事</div><div class="ex">We learned about natural <b>disasters</b> at school.</div><div class="xj">私たちは学校で自然災害について学びました。</div></button></li><li><button class="w" data-no="689"><div class="top"><span class="no">689</span><span class="en">get to ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～に着く</div><div class="ex">We <b>got to</b> the hotel at six.</div><div class="xj">私たちは6時にホテルに着きました。</div></button></li><li><button class="w" data-no="690"><div class="top"><span class="no">690</span><span class="en">include</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を含む</div><div class="ex">This price <b>includes</b> lunch.</div><div class="xj">この値段は昼食を含んでいます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../22/">← 第22回</a><a href="../24/">第24回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"661": 4.76, "662": 17.5, "663": 31.54, "664": 46.54, "665": 59.61, "666": 72.42, "667": 86.39, "668": 99.15, "669": 113.74, "670": 127.13, "671": 140.54, "672": 154.22, "673": 168.4, "674": 181.74, "675": 195.12, "676": 208.99, "677": 222.84, "678": 235.96, "679": 250.21, "680": 264.58, "681": 278.72, "682": 292.1, "683": 306.04, "684": 319.36, "685": 333.01, "686": 346.52, "687": 360.2, "688": 374.35, "689": 388.63, "690": 401.58}, "TE": {"661": 6.64, "662": 19.5, "663": 33.48, "664": 48.41, "665": 61.48, "666": 74.44, "667": 88.26, "668": 101.19, "669": 115.68, "670": 129.0, "671": 142.41, "672": 156.23, "673": 170.27, "674": 183.61, "675": 197.19, "676": 211.01, "677": 224.71, "678": 237.83, "679": 252.08, "680": 266.46, "681": 280.66, "682": 294.41, "683": 307.92, "684": 321.23, "685": 334.88, "686": 348.39, "687": 362.07, "688": 376.32, "689": 390.5, "690": 403.5}, "Q": [[661, "自然の", "natural"], [662, "交換", "exchange"], [663, "～のために（2語で）", "because of"], [664, "漫画", "comic"], [665, "入り口", "entrance"], [666, "～してうれしい（3語で）", "be happy to"], [667, "神社", "shrine"], [668, "割合", "percentage"], [669, "インターネットで（3語で）", "on the internet"], [670, "座席", "seat"], [671, "状態", "condition"], [672, "～も…も両方とも（3語で）", "both and ..."], [673, "段", "step"], [674, "～を受け入れる", "accept"], [675, "会話", "conversation"], [676, "～の数（3語で）", "the number of"], [677, "予定", "schedule"], [678, "登場人物", "character"], [679, "（だんだん）～し始める（2語で）", "begin to"], [680, "心地よい", "comfortable"], [681, "奇妙な", "strange"], [682, "長い間（4語で）", "for a long time"], [683, "
