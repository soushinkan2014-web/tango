</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第21回</h1><div class="sub">No.601〜630</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../21.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="601"><div class="top"><span class="no">601</span><span class="en">recipe</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">レシピ；調理法</div><div class="ex">My grandmother gave me her <b>recipe</b> for curry.</div><div class="xj">祖母は私にカレーのレシピをくれました。</div></button></li><li><button class="w" data-no="602"><div class="top"><span class="no">602</span><span class="en">treasure</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">宝物</div><div class="ex">This old letter is my <b>treasure</b>.</div><div class="xj">この古い手紙は私の宝物です。</div></button></li><li><button class="w" data-no="603"><div class="top"><span class="no">603</span><span class="en">be worried about ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を心配している</div><div class="ex">Ken <b>is worried about</b> his English test.</div><div class="xj">ケンは英語のテストを心配しています。</div></button></li><li><button class="w" data-no="604"><div class="top"><span class="no">604</span><span class="en">data</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">データ；資料</div><div class="ex">We used this <b>data</b> in our report.</div><div class="xj">私たちはこのデータをレポートに使いました。</div></button></li><li><button class="w" data-no="605"><div class="top"><span class="no">605</span><span class="en">firework</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">花火</div><div class="ex">We watched <b>fireworks</b> by the river last night.</div><div class="xj">私たちは昨夜、川のそばで花火を見ました。</div></button></li><li><button class="w" data-no="606"><div class="top"><span class="no">606</span><span class="en">spot</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">場所；地点</div><div class="ex">This is a good <b>spot</b> for taking pictures.</div><div class="xj">ここは写真をとるのによい場所です。</div></button></li><li><button class="w" data-no="607"><div class="top"><span class="no">607</span><span class="en">anymore</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">（否定文で）もう（～ない）；これ以上</div><div class="ex">Ken doesn’t live here <b>anymore</b>.</div><div class="xj">ケンはもうここに住んでいません。</div></button></li><li><button class="w" data-no="608"><div class="top"><span class="no">608</span><span class="en">be different from ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～とちがう</div><div class="ex">My bag <b>is different from</b> yours.</div><div class="xj">私のかばんはあなたのものとちがいます。</div></button></li><li><button class="w" data-no="609"><div class="top"><span class="no">609</span><span class="en">tradition</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">伝統</div><div class="ex">This dance is an old <b>tradition</b> in our town.</div><div class="xj">この踊りは私たちの町の古い伝統です。</div></button></li><li><button class="w" data-no="610"><div class="top"><span class="no">610</span><span class="en">style</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">やり方；様式；スタイル</div><div class="ex">Each singer has a different <b>style</b>.</div><div class="xj">歌手にはそれぞれちがうやり方があります。</div></button></li><li><button class="w" data-no="611"><div class="top"><span class="no">611</span><span class="en">grade</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">学年；成績</div><div class="ex">My sister is in the third <b>grade</b>.</div><div class="xj">私の妹は3年生です。</div></button></li><li><button class="w" data-no="612"><div class="top"><span class="no">612</span><span class="en">print</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を印刷する</div><div class="ex">Please <b>print</b> this page for me.</div><div class="xj">私のためにこのページを印刷してください。</div></button></li><li><button class="w" data-no="613"><div class="top"><span class="no">613</span><span class="en">Shall I ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">（私が）～しましょうか</div><div class="ex"><b>Shall I</b> make some tea for you?</div><div class="xj">お茶をいれましょうか。</div></button></li><li><button class="w" data-no="614"><div class="top"><span class="no">614</span><span class="en">fantastic</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">すてきな；すばらしい</div><div class="ex">We had a <b>fantastic</b> time at the beach.</div><div class="xj">私たちは海辺ですてきな時間をすごしました。</div></button></li><li><button class="w" data-no="615"><div class="top"><span class="no">615</span><span class="en">anyway</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">とにかく；いずれにしても</div><div class="ex">I was tired, but I went to practice <b>anyway</b>.</div><div class="xj">私は疲れていましたが、とにかく練習に行きました。</div></button></li><li><button class="w" data-no="616"><div class="top"><span class="no">616</span><span class="en">nobody</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">だれも～ない</div><div class="ex"><b>Nobody</b> was in the classroom.</div><div class="xj">教室にはだれもいませんでした。</div></button></li><li><button class="w" data-no="617"><div class="top"><span class="no">617</span><span class="en">relieved</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">ほっとした；安心した</div><div class="ex">I was <b>relieved</b> to hear the news.</div><div class="xj">その知らせを聞いて私はほっとしました。</div></button></li><li><button class="w" data-no="618"><div class="top"><span class="no">618</span><span class="en">let me know</span><span class="ps">熟</span></div><div class="ja">知らせてください</div><div class="ex">Please <b>let me know</b> the time of the game.</div><div class="xj">試合の時間を知らせてください。</div></button></li><li><button class="w" data-no="619"><div class="top"><span class="no">619</span><span class="en">brush</span><span class="ps">動名</span><span class="ek">英4</span></div><div class="ja">（歯など）をみがく；ブラシ</div><div class="ex">Don’t forget to <b>brush</b> your teeth.</div><div class="xj">歯をみがくのを忘れないで。</div></button></li><li><button class="w" data-no="620"><div class="top"><span class="no">620</span><span class="en">pleasure</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">喜び；楽しみ</div><div class="ex">Reading is a great <b>pleasure</b> for me.</div><div class="xj">読書は私にとって大きな喜びです。</div></button></li><li><button class="w" data-no="621"><div class="top"><span class="no">621</span><span class="en">relaxing</span><span class="ps">形</span></div><div class="ja">くつろがせる；リラックスできる</div><div class="ex">Taking a bath is very <b>relaxing</b>.</div><div class="xj">お風呂に入ることはとてもくつろげます。</div></button></li><li><button class="w" data-no="622"><div class="top"><span class="no">622</span><span class="en">everywhere</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">どこでも；いたるところに</div><div class="ex">You can buy this juice <b>everywhere</b> in Japan.</div><div class="xj">このジュースは日本のどこでも買えます。</div></button></li><li><button class="w" data-no="623"><div class="top"><span class="no">623</span><span class="en">Spanish</span><span class="ps">形名</span><span class="ek">英4</span></div><div class="ja">スペイン語；スペインの</div><div class="ex">Lisa can speak <b>Spanish</b> well.</div><div class="xj">リサはスペイン語を上手に話せます。</div></button></li><li><button class="w" data-no="624"><div class="top"><span class="no">624</span><span class="en">be ready to ～</span><span class="ps">熟</span></div><div class="ja">～する準備ができている</div><div class="ex">We <b>are ready to</b> start the game.</div><div class="xj">私たちは試合を始める準備ができています。</div></button></li><li><button class="w" data-no="625"><div class="top"><span class="no">625</span><span class="en">war</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">戦争</div><div class="ex">We must not forget the history of <b>war</b>.</div><div class="xj">私たちは戦争の歴史を忘れてはいけません。</div></button></li><li><button class="w" data-no="626"><div class="top"><span class="no">626</span><span class="en">excellent</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">すばらしい；優秀な</div><div class="ex">That is an <b>excellent</b> idea.</div><div class="xj">それはすばらしい考えです。</div></button></li><li><button class="w" data-no="627"><div class="top"><span class="no">627</span><span class="en">wet</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">ぬれた</div><div class="ex">My shoes got <b>wet</b> in the rain.</div><div class="xj">雨で靴がぬれました。</div></button></li><li><button class="w" data-no="628"><div class="top"><span class="no">628</span><span class="en">beginner</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">初心者</div><div class="ex">I am a <b>beginner</b> at tennis.</div><div class="xj">私はテニスの初心者です。</div></button></li><li><button class="w" data-no="629"><div class="top"><span class="no">629</span><span class="en">Thanks for ～.</span><span class="ps">熟</span></div><div class="ja">～をありがとう</div><div class="ex"><b>Thanks for</b> helping me, Ken.</div><div class="xj">手伝ってくれてありがとう、ケン。</div></button></li><li><button class="w" data-no="630"><div class="top"><span class="no">630</span><span class="en">positive</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">よい；好ましい；前向きな</div><div class="ex">Reading has a <b>positive</b> effect on children.</div><div class="xj">読書は子どもによい影響を与えます。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../20/">← 第20回</a><a href="../22/">第22回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"601": 4.74, "602": 18.92, "603": 31.47, "604": 46.01, "605": 59.06, "606": 72.59, "607": 85.88, "608": 100.35, "609": 113.86, "610": 127.25, "611": 140.8, "612": 154.1, "613": 167.27, "614": 180.54, "615": 194.81, "616": 209.33, "617": 222.14, "618": 235.65, "619": 248.58, "620": 262.14, "621": 275.62, "622": 289.97, "623": 304.05, "624": 317.92, "625": 331.74, "626": 344.72, "627": 357.94, "628": 370.51, "629": 383.01, "630": 396.16}, "TE": {"601": 6.61, "602": 20.79, "603": 33.65, "604": 47.88, "605": 60.98, "606": 74.46, "607": 87.76, "608": 102.44, "609": 115.73, "610": 129.14, "611": 142.68, "612": 155.97, "613": 169.14, "614": 182.65, "615": 196.68, "616": 211.2, "617": 224.01, "618": 237.52, "619": 250.45, "620": 264.01, "621": 277.56, "622": 291.84, "623": 306.07, "624": 319.89, "625": 333.61, "626": 346.59, "627": 359.81, "628": 372.38, "629": 384.91, "630": 398.03}, "Q": [[601, "レシピ", "recipe"], [602, "宝物", "treasure"], [603, "～を心配している（3語で）", "be worried about"], [604, "データ", "data"], [605, "花火", "firework"], [606, "場所", "spot"], [607, "（否定文で）もう（～ない）", "anymore"], [608, "～とちがう（3語で）", "be different from"], [609, "伝統", "tradition"], [610, "やり方", "style"], [611, "学年", "grade"], [612, "～を印刷する", "print"], [613, "（私が）～しましょうか（3語で）", "Shall I ?"], [614, "すてきな", "fantastic"], [615, "とにかく", "anyway"], [616, "だれも～ない", "nobody"], [617, "ほっとした", "relieved"], [618, "知らせてください（3語で）", "let me know"], [619, "（歯など）をみがく", "brush"], [620, "喜び", "pleasure"], [621, "くつろがせる", "relaxing"], [622, "どこでも", "everywhere"], [623, "スペイン語", "Spanish"], [624, "～する準備ができている（3語で）", "be ready to"], [625, "戦争", "war"], [626, "すばらしい", "excellent"],
