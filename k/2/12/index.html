</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第12回</h1><div class="sub">No.331〜360</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../12.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="331"><div class="top"><span class="no">331</span><span class="en">third</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">第三に</div><div class="ex"><b>Third</b>, mix them well with a spoon.</div><div class="xj">第三に、スプーンでそれらをよく混ぜなさい。</div></button></li><li><button class="w" data-no="332"><div class="top"><span class="no">332</span><span class="en">agriculture</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">農業</div><div class="ex"><b>Agriculture</b> is important in this town.</div><div class="xj">この町では農業が大切です。</div></button></li><li><button class="w" data-no="333"><div class="top"><span class="no">333</span><span class="en">boring</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">退屈な；つまらない</div><div class="ex">The movie was long and <b>boring</b>.</div><div class="xj">その映画は長くて退屈でした。</div></button></li><li><button class="w" data-no="334"><div class="top"><span class="no">334</span><span class="en">emergency</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">緊急（事態）</div><div class="ex">Call 119 in an <b>emergency</b>.</div><div class="xj">緊急のときは119番に電話しなさい。</div></button></li><li><button class="w" data-no="335"><div class="top"><span class="no">335</span><span class="en">radio</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ラジオ</div><div class="ex">My grandfather listens to the <b>radio</b> every morning.</div><div class="xj">祖父は毎朝ラジオを聞きます。</div></button></li><li><button class="w" data-no="336"><div class="top"><span class="no">336</span><span class="en">water</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">水をやる</div><div class="ex">I <b>water</b> the flowers every morning.</div><div class="xj">私は毎朝、花に水をやります。</div></button></li><li><button class="w" data-no="337"><div class="top"><span class="no">337</span><span class="en">men</span><span class="ps">名</span></div><div class="ja">男の人たち（man の複数形）</div><div class="ex">Two <b>men</b> are standing by the gate.</div><div class="xj">2人の男の人が門のそばに立っています。</div></button></li><li><button class="w" data-no="338"><div class="top"><span class="no">338</span><span class="en">boat</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ボート；船</div><div class="ex">We rode a <b>boat</b> on the lake.</div><div class="xj">私たちは湖でボートに乗りました。</div></button></li><li><button class="w" data-no="339"><div class="top"><span class="no">339</span><span class="en">What’s up?</span><span class="ps">熟</span><span class="ek">英2</span></div><div class="ja">どうしたの；元気？</div><div class="ex">A: <b>What’s up?</b><br>B: I can’t find my pen.</div><div class="xj">A：どうしたの？<br>B：ペンが見つからないんだ。</div></button></li><li><button class="w" data-no="340"><div class="top"><span class="no">340</span><span class="en">coach</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">コーチ；監督</div><div class="ex">Mr. Sato is our soccer <b>coach</b>.</div><div class="xj">佐藤先生は私たちのサッカーのコーチです。</div></button></li><li><button class="w" data-no="341"><div class="top"><span class="no">341</span><span class="en">solution</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">解決法；解答</div><div class="ex">We need a good <b>solution</b> to this problem.</div><div class="xj">私たちにはこの問題のよい解決法が必要です。</div></button></li><li><button class="w" data-no="342"><div class="top"><span class="no">342</span><span class="en">out</span><span class="ps">副</span></div><div class="ja">（外に）出て；現れて</div><div class="ex">The sun came <b>out</b> after the rain.</div><div class="xj">雨のあと、太陽が出てきました。</div></button></li><li><button class="w" data-no="343"><div class="top"><span class="no">343</span><span class="en">disappointed</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">がっかりした</div><div class="ex">Emi was <b>disappointed</b> with the result.</div><div class="xj">エミはその結果にがっかりしました。</div></button></li><li><button class="w" data-no="344"><div class="top"><span class="no">344</span><span class="en">email</span><span class="ps">名</span></div><div class="ja">Eメール；電子メール</div><div class="ex">I got an <b>email</b> from Lisa.</div><div class="xj">私はリサからEメールをもらいました。</div></button></li><li><button class="w" data-no="345"><div class="top"><span class="no">345</span><span class="en">moment</span><span class="ps">名</span></div><div class="ja">ちょっとの間；瞬間</div><div class="ex">Please wait a <b>moment</b>.</div><div class="xj">少しの間お待ちください。</div></button></li><li><button class="w" data-no="346"><div class="top"><span class="no">346</span><span class="en">quiz</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">小テスト；クイズ</div><div class="ex">We had a math <b>quiz</b> today.</div><div class="xj">今日、数学の小テストがありました。</div></button></li><li><button class="w" data-no="347"><div class="top"><span class="no">347</span><span class="en">early</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">早い；初期の</div><div class="ex">I took the <b>early</b> train this morning.</div><div class="xj">今朝、私は早い電車に乗りました。</div></button></li><li><button class="w" data-no="348"><div class="top"><span class="no">348</span><span class="en">smart</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">賢い；頭のよい</div><div class="ex">Dolphins are very <b>smart</b> animals.</div><div class="xj">イルカはとても賢い動物です。</div></button></li><li><button class="w" data-no="349"><div class="top"><span class="no">349</span><span class="en">flight</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（飛行機の）便；飛行</div><div class="ex">Our <b>flight</b> leaves at ten.</div><div class="xj">私たちの便は10時に出発します。</div></button></li><li><button class="w" data-no="350"><div class="top"><span class="no">350</span><span class="en">sports day</span><span class="ps">熟</span></div><div class="ja">運動会；体育祭</div><div class="ex"><b>Sports day</b> is in October this year.</div><div class="xj">今年の運動会は10月です。</div></button></li><li><button class="w" data-no="351"><div class="top"><span class="no">351</span><span class="en">recycled</span><span class="ps">形</span></div><div class="ja">再生された；リサイクルされた</div><div class="ex">We use <b>recycled</b> paper at our school.</div><div class="xj">私たちの学校では再生紙を使っています。</div></button></li><li><button class="w" data-no="352"><div class="top"><span class="no">352</span><span class="en">search</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">探す；調べる</div><div class="ex">I <b>searched</b> for my key everywhere.</div><div class="xj">私はあちこちでかぎを探しました。</div></button></li><li><button class="w" data-no="353"><div class="top"><span class="no">353</span><span class="en">into</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">（変化・分割して）～に</div><div class="ex">Please cut the pizza <b>into</b> eight pieces.</div><div class="xj">ピザを8つに切ってください。</div></button></li><li><button class="w" data-no="354"><div class="top"><span class="no">354</span><span class="en">smell</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">におい；においがする</div><div class="ex">I love the <b>smell</b> of fresh bread.</div><div class="xj">私は焼きたてのパンのにおいが大好きです。</div></button></li><li><button class="w" data-no="355"><div class="top"><span class="no">355</span><span class="en">beside</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～のそばに；～のとなりに</div><div class="ex">Ken sat <b>beside</b> me in class.</div><div class="xj">授業中、ケンは私のとなりにすわりました。</div></button></li><li><button class="w" data-no="356"><div class="top"><span class="no">356</span><span class="en">how’s</span><span class="ps">副</span></div><div class="ja">～はどうですか（how is の短縮形）</div><div class="ex"><b>How’s</b> your new school?</div><div class="xj">新しい学校はどうですか。</div></button></li><li><button class="w" data-no="357"><div class="top"><span class="no">357</span><span class="en">mouth</span><span class="ps">名</span></div><div class="ja">口</div><div class="ex">Open your <b>mouth</b>, please.</div><div class="xj">口を開けてください。</div></button></li><li><button class="w" data-no="358"><div class="top"><span class="no">358</span><span class="en">grow</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">成長する；育つ</div><div class="ex">Children <b>grow</b> very fast.</div><div class="xj">子どもはとても早く成長します。</div></button></li><li><button class="w" data-no="359"><div class="top"><span class="no">359</span><span class="en">soft</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">やわらかい</div><div class="ex">This bread is very <b>soft</b>.</div><div class="xj">このパンはとてもやわらかいです。</div></button></li><li><button class="w" data-no="360"><div class="top"><span class="no">360</span><span class="en">appear</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">現れる；出てくる</div><div class="ex">A rainbow <b>appeared</b> after the rain.</div><div class="xj">雨のあとに、にじが現れました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../11/">← 第11回</a><a href="../13/">第13回 →<
