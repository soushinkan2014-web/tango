</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第15回</h1><div class="sub">No.421〜450</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../15.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="421"><div class="top"><span class="no">421</span><span class="en">loud</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">（声・音が）大きい；うるさい</div><div class="ex">The music is too <b>loud</b>.</div><div class="xj">音楽の音が大きすぎます。</div></button></li><li><button class="w" data-no="422"><div class="top"><span class="no">422</span><span class="en">pocket</span><span class="ps">名</span></div><div class="ja">ポケット</div><div class="ex">He put his hands in his <b>pockets</b>.</div><div class="xj">彼はポケットに手を入れました。</div></button></li><li><button class="w" data-no="423"><div class="top"><span class="no">423</span><span class="en">draw</span><span class="ps">動</span></div><div class="ja">（線を）引く</div><div class="ex"><b>Draw</b> a line under this word.</div><div class="xj">この単語の下に線を引きなさい。</div></button></li><li><button class="w" data-no="424"><div class="top"><span class="no">424</span><span class="en">quarter</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">4分の1；15分</div><div class="ex">I ate a <b>quarter</b> of the cake.</div><div class="xj">私はケーキの4分の1を食べました。</div></button></li><li><button class="w" data-no="425"><div class="top"><span class="no">425</span><span class="en">for free</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">無料で；ただで</div><div class="ex">You can get this bag <b>for free</b>.</div><div class="xj">このかばんは無料でもらえます。</div></button></li><li><button class="w" data-no="426"><div class="top"><span class="no">426</span><span class="en">shelf</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">棚</div><div class="ex">Please put the books on the <b>shelf</b>.</div><div class="xj">本を棚に置いてください。</div></button></li><li><button class="w" data-no="427"><div class="top"><span class="no">427</span><span class="en">bottom</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">底；いちばん下</div><div class="ex">There is a coin at the <b>bottom</b> of the box.</div><div class="xj">箱の底にコインがあります。</div></button></li><li><button class="w" data-no="428"><div class="top"><span class="no">428</span><span class="en">degree</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（温度の）度</div><div class="ex">It’s thirty <b>degrees</b> today.</div><div class="xj">今日は30度です。</div></button></li><li><button class="w" data-no="429"><div class="top"><span class="no">429</span><span class="en">fall</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">落ちる；倒れる</div><div class="ex">Be careful. Don’t <b>fall</b> off the chair.</div><div class="xj">気をつけて。いすから落ちないでね。</div></button></li><li><button class="w" data-no="430"><div class="top"><span class="no">430</span><span class="en">planet</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">惑星</div><div class="ex">Mars is the fourth <b>planet</b> from the sun.</div><div class="xj">火星は太陽から4番目の惑星です。</div></button></li><li><button class="w" data-no="431"><div class="top"><span class="no">431</span><span class="en">purple</span><span class="ps">形</span></div><div class="ja">紫色の</div><div class="ex">Grapes are <b>purple</b> or green.</div><div class="xj">ぶどうは紫色か緑色です。</div></button></li><li><button class="w" data-no="432"><div class="top"><span class="no">432</span><span class="en">stick</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">貼る；くっつく</div><div class="ex"><b>Stick</b> this note on the door.</div><div class="xj">このメモをドアに貼ってください。</div></button></li><li><button class="w" data-no="433"><div class="top"><span class="no">433</span><span class="en">typhoon</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">台風</div><div class="ex">A big <b>typhoon</b> is coming to Osaka.</div><div class="xj">大きな台風が大阪に近づいています。</div></button></li><li><button class="w" data-no="434"><div class="top"><span class="no">434</span><span class="en">orange</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">オレンジ色の</div><div class="ex">Lisa has an <b>orange</b> umbrella.</div><div class="xj">リサはオレンジ色のかさを持っています。</div></button></li><li><button class="w" data-no="435"><div class="top"><span class="no">435</span><span class="en">Good for you.</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">よかったね；よくやったね</div><div class="ex">A: I won the game!<br>B: <b>Good for you.</b></div><div class="xj">A：試合に勝ったよ！B：よかったね。</div></button></li><li><button class="w" data-no="436"><div class="top"><span class="no">436</span><span class="en">fill</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">満たす；いっぱいにする</div><div class="ex">Please <b>fill</b> this glass with water.</div><div class="xj">このコップを水で満たしてください。</div></button></li><li><button class="w" data-no="437"><div class="top"><span class="no">437</span><span class="en">flew</span><span class="ps">動</span></div><div class="ja">飛んだ（fly の過去形）</div><div class="ex">A bird <b>flew</b> into our classroom.</div><div class="xj">1羽の鳥が教室に飛んで入ってきました。</div></button></li><li><button class="w" data-no="438"><div class="top"><span class="no">438</span><span class="en">narrow</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">狭い；細い</div><div class="ex">This street is very <b>narrow</b>.</div><div class="xj">この通りはとても狭いです。</div></button></li><li><button class="w" data-no="439"><div class="top"><span class="no">439</span><span class="en">stand</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（建物などが）建っている；立っている</div><div class="ex">An old temple <b>stands</b> on the hill.</div><div class="xj">丘の上に古いお寺が建っています。</div></button></li><li><button class="w" data-no="440"><div class="top"><span class="no">440</span><span class="en">quietly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">静かに</div><div class="ex">Please close the door <b>quietly</b>.</div><div class="xj">ドアを静かに閉めてください。</div></button></li><li><button class="w" data-no="441"><div class="top"><span class="no">441</span><span class="en">seed</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">種</div><div class="ex">Let’s plant these <b>seeds</b> in the garden.</div><div class="xj">この種を庭にまきましょう。</div></button></li><li><button class="w" data-no="442"><div class="top"><span class="no">442</span><span class="en">stationery</span><span class="ps">名</span></div><div class="ja">文房具</div><div class="ex">This shop sells cute <b>stationery</b>.</div><div class="xj">この店ではかわいい文房具を売っています。</div></button></li><li><button class="w" data-no="443"><div class="top"><span class="no">443</span><span class="en">bowl</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">ボウル；おわん；どんぶり</div><div class="ex">Put the salad in a big <b>bowl</b>.</div><div class="xj">サラダを大きなボウルに入れて。</div></button></li><li><button class="w" data-no="444"><div class="top"><span class="no">444</span><span class="en">lend</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">貸す</div><div class="ex">Can you <b>lend</b> your eraser to me?</div><div class="xj">私に消しゴムを貸してくれますか。</div></button></li><li><button class="w" data-no="445"><div class="top"><span class="no">445</span><span class="en">low</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">最低気温</div><div class="ex">Tonight’s <b>low</b> will be five degrees.</div><div class="xj">今夜の最低気温は5度でしょう。</div></button></li><li><button class="w" data-no="446"><div class="top"><span class="no">446</span><span class="en">cut down ～</span><span class="ps">熟</span></div><div class="ja">～を切り倒す</div><div class="ex">People <b>cut down</b> many trees here last year.</div><div class="xj">昨年、人々はここでたくさんの木を切り倒しました。</div></button></li><li><button class="w" data-no="447"><div class="top"><span class="no">447</span><span class="en">might</span><span class="ps">助</span></div><div class="ja">～かもしれない</div><div class="ex">Take an umbrella because it <b>might</b> rain.</div><div class="xj">雨が降るかもしれないから、かさを持っていって。</div></button></li><li><button class="w" data-no="448"><div class="top"><span class="no">448</span><span class="en">pack</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">荷物を詰める；詰める</div><div class="ex">Let’s <b>pack</b> our bags for the trip.</div><div class="xj">旅行のためにかばんに荷物を詰めましょう。</div></button></li><li><button class="w" data-no="449"><div class="top"><span class="no">449</span><span class="en">relay</span><span class="ps">名</span></div><div class="ja">リレー；中継</div><div class="ex">Our class won the <b>relay</b> on sports day.</div><div class="xj">私たちのクラスは運動会のリレーで勝ちました。</div></button></li><li><button class="w" data-no="450"><div class="top"><span class="no">450</span><span class="en">miss</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">見逃す；乗り遅れる</div><div class="ex">Don’t <b>miss</b> the fireworks tonight.</div><div class="xj">今夜の花火を見逃さないでね。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../14/">← 第14回</a><a href="../16/">第16回 →</a></nav></main>
