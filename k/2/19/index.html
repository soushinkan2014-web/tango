</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第19回</h1><div class="sub">No.541〜570</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../19.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="541"><div class="top"><span class="no">541</span><span class="en">smartphone</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">スマートフォン</div><div class="ex">Don’t use your <b>smartphone</b> at dinner.</div><div class="xj">夕食のときにスマートフォンを使ってはいけません。</div></button></li><li><button class="w" data-no="542"><div class="top"><span class="no">542</span><span class="en">friendly</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">親しみやすい；友好的な</div><div class="ex">The people in this town are very <b>friendly</b>.</div><div class="xj">この町の人々はとても親しみやすいです。</div></button></li><li><button class="w" data-no="543"><div class="top"><span class="no">543</span><span class="en">worry about ～</span><span class="ps">熟</span></div><div class="ja">～について心配する</div><div class="ex">Don’t <b>worry about</b> the test.</div><div class="xj">テストについて心配しないで。</div></button></li><li><button class="w" data-no="544"><div class="top"><span class="no">544</span><span class="en">similar</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">似ている</div><div class="ex">Your idea is <b>similar</b> to mine.</div><div class="xj">あなたの考えは私のものと似ています。</div></button></li><li><button class="w" data-no="545"><div class="top"><span class="no">545</span><span class="en">convenient</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">便利な；都合のよい</div><div class="ex">This town is <b>convenient</b> for shopping.</div><div class="xj">この町は買い物に便利です。</div></button></li><li><button class="w" data-no="546"><div class="top"><span class="no">546</span><span class="en">passage</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（文章の）一節；通路</div><div class="ex">Read this <b>passage</b> and answer the questions.</div><div class="xj">この一節を読んで、問題に答えなさい。</div></button></li><li><button class="w" data-no="547"><div class="top"><span class="no">547</span><span class="en">online</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">オンラインで</div><div class="ex">I bought these shoes <b>online</b>.</div><div class="xj">私はこのくつをオンラインで買いました。</div></button></li><li><button class="w" data-no="548"><div class="top"><span class="no">548</span><span class="en">get better</span><span class="ps">熟</span></div><div class="ja">よくなる；上達する</div><div class="ex">Ken’s English is <b>getting better</b>.</div><div class="xj">ケンの英語はよくなってきています。</div></button></li><li><button class="w" data-no="549"><div class="top"><span class="no">549</span><span class="en">leaves</span><span class="ps">名</span></div><div class="ja">葉（leaf の複数形）</div><div class="ex">The <b>leaves</b> turn red in the fall.</div><div class="xj">秋には葉が赤くなります。</div></button></li><li><button class="w" data-no="550"><div class="top"><span class="no">550</span><span class="en">convenience</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">便利さ</div><div class="ex">People love the <b>convenience</b> of online shopping.</div><div class="xj">人々はオンラインショッピングの便利さを気に入っています。</div></button></li><li><button class="w" data-no="551"><div class="top"><span class="no">551</span><span class="en">shape</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">形</div><div class="ex">What <b>shape</b> is this cookie?</div><div class="xj">このクッキーはどんな形ですか。</div></button></li><li><button class="w" data-no="552"><div class="top"><span class="no">552</span><span class="en">suddenly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">突然；急に</div><div class="ex"><b>Suddenly</b>, it started to rain.</div><div class="xj">突然、雨が降り始めました。</div></button></li><li><button class="w" data-no="553"><div class="top"><span class="no">553</span><span class="en">have a chance to ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～する機会がある</div><div class="ex">I <b>had a chance to</b> sing in front of many people.</div><div class="xj">私は大勢の人の前で歌う機会がありました。</div></button></li><li><button class="w" data-no="554"><div class="top"><span class="no">554</span><span class="en">express</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を表現する</div><div class="ex">I can’t <b>express</b> my feelings well in English.</div><div class="xj">私は英語で自分の気持ちをうまく表現できません。</div></button></li><li><button class="w" data-no="555"><div class="top"><span class="no">555</span><span class="en">climb</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～に登る</div><div class="ex">Monkeys can <b>climb</b> trees quickly.</div><div class="xj">サルはすばやく木に登ることができます。</div></button></li><li><button class="w" data-no="556"><div class="top"><span class="no">556</span><span class="en">fresh</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">新鮮な</div><div class="ex">This fish is very <b>fresh</b>.</div><div class="xj">この魚はとても新鮮です。</div></button></li><li><button class="w" data-no="557"><div class="top"><span class="no">557</span><span class="en">interview</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">インタビュー；面接</div><div class="ex">Emi watched an <b>interview</b> with her favorite singer.</div><div class="xj">エミは大好きな歌手のインタビューを見ました。</div></button></li><li><button class="w" data-no="558"><div class="top"><span class="no">558</span><span class="en">be careful</span><span class="ps">熟</span></div><div class="ja">気をつける</div><div class="ex"><b>Be careful</b> when you cross the street.</div><div class="xj">通りを渡るときは気をつけてください。</div></button></li><li><button class="w" data-no="559"><div class="top"><span class="no">559</span><span class="en">anime</span><span class="ps">名</span></div><div class="ja">アニメ</div><div class="ex">Many people around the world watch Japanese <b>anime</b>.</div><div class="xj">世界中の多くの人が日本のアニメを見ています。</div></button></li><li><button class="w" data-no="560"><div class="top"><span class="no">560</span><span class="en">importance</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">大切さ；重要性</div><div class="ex">Our teacher talked about the <b>importance</b> of reading.</div><div class="xj">先生は読書の大切さについて話しました。</div></button></li><li><button class="w" data-no="561"><div class="top"><span class="no">561</span><span class="en">case</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">場合；入れ物（ケース）</div><div class="ex">In that <b>case</b>, let’s stay home.</div><div class="xj">その場合は、家にいましょう。</div></button></li><li><button class="w" data-no="562"><div class="top"><span class="no">562</span><span class="en">heart</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">心臓；心</div><div class="ex">Running is good for your <b>heart</b>.</div><div class="xj">走ることは心臓によいです。</div></button></li><li><button class="w" data-no="563"><div class="top"><span class="no">563</span><span class="en">social</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">社会の</div><div class="ex">Our class talked about <b>social</b> problems.</div><div class="xj">私たちのクラスは社会の問題について話し合いました。</div></button></li><li><button class="w" data-no="564"><div class="top"><span class="no">564</span><span class="en">a kind of ～</span><span class="ps">熟</span></div><div class="ja">一種の～</div><div class="ex">A penguin is <b>a kind of</b> bird.</div><div class="xj">ペンギンは鳥の一種です。</div></button></li><li><button class="w" data-no="565"><div class="top"><span class="no">565</span><span class="en">leader</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">リーダー；指導者</div><div class="ex">Who is the <b>leader</b> of your team?</div><div class="xj">あなたのチームのリーダーはだれですか。</div></button></li><li><button class="w" data-no="566"><div class="top"><span class="no">566</span><span class="en">real</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">本当の；本物の</div><div class="ex">This is a <b>real</b> story.</div><div class="xj">これは本当の話です。</div></button></li><li><button class="w" data-no="567"><div class="top"><span class="no">567</span><span class="en">unit</span><span class="ps">名</span></div><div class="ja">単元；単位</div><div class="ex">We finished <b>Unit</b> Three in class today.</div><div class="xj">私たちは今日の授業で第3単元を終えました。</div></button></li><li><button class="w" data-no="568"><div class="top"><span class="no">568</span><span class="en">phrase</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">句；言い回し</div><div class="ex">I wrote this <b>phrase</b> in my notebook.</div><div class="xj">私はこの句をノートに書きました。</div></button></li><li><button class="w" data-no="569"><div class="top"><span class="no">569</span><span class="en">at the same time</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">同時に</div><div class="ex">Ken and Emi stood up <b>at the same time</b>.</div><div class="xj">ケンとエミは同時に立ち上がりました。</div></button></li><li><button class="w" data-no="570"><div class="top"><span class="no">570</span><span class="en">hard</span><span class="ps">形</span></div><div class="ja">（やるのが）大変な；難しい</div><div class="ex">Speaking English is <b>hard</b> for me.</div><div class="xj">英語を話すのは私には大変です。</div></button></li></ol></div><div id="quiz"><p c
