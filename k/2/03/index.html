</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第3回</h1><div class="sub">No.61〜90</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../03.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="61"><div class="top"><span class="no">61</span><span class="en">plan</span><span class="ps">名</span></div><div class="ja">計画；予定</div><div class="ex">What are your <b>plans</b> for summer vacation?</div><div class="xj">あなたの夏休みの計画は何ですか。</div></button></li><li><button class="w" data-no="62"><div class="top"><span class="no">62</span><span class="en">culture</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">文化</div><div class="ex">I want to learn about Japanese <b>culture</b>.</div><div class="xj">私は日本の文化について学びたいです。</div></button></li><li><button class="w" data-no="63"><div class="top"><span class="no">63</span><span class="en">such as ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～のような；たとえば～</div><div class="ex">I like vegetables <b>such as</b> carrots and onions.</div><div class="xj">私はにんじんや玉ねぎのような野菜が好きです。</div></button></li><li><button class="w" data-no="64"><div class="top"><span class="no">64</span><span class="en">without</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～なしで</div><div class="ex">Don’t go out <b>without</b> a coat.</div><div class="xj">コートなしで出かけてはいけません。</div></button></li><li><button class="w" data-no="65"><div class="top"><span class="no">65</span><span class="en">much</span><span class="ps">代</span></div><div class="ja">たくさんのこと；（否定文で）あまり多く</div><div class="ex">I don’t know <b>much</b> about Canada.</div><div class="xj">私はカナダについてあまり知りません。</div></button></li><li><button class="w" data-no="66"><div class="top"><span class="no">66</span><span class="en">even</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">～でさえ；（比較級を強めて）さらに</div><div class="ex"><b>Even</b> my little brother can swim.</div><div class="xj">私の弟でさえ泳げます。</div></button></li><li><button class="w" data-no="67"><div class="top"><span class="no">67</span><span class="en">number</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">番号；数</div><div class="ex">What’s your phone <b>number</b>?</div><div class="xj">あなたの電話番号は何番ですか。</div></button></li><li><button class="w" data-no="68"><div class="top"><span class="no">68</span><span class="en">both</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">両方の；両方</div><div class="ex"><b>Both</b> my sisters play tennis.</div><div class="xj">私の姉は2人ともテニスをします。</div></button></li><li><button class="w" data-no="69"><div class="top"><span class="no">69</span><span class="en">own</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">自分自身の</div><div class="ex">I want my <b>own</b> room.</div><div class="xj">私は自分だけの部屋がほしいです。</div></button></li><li><button class="w" data-no="70"><div class="top"><span class="no">70</span><span class="en">agree</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">賛成する；同意する</div><div class="ex">Ken <b>agreed</b> with my idea.</div><div class="xj">ケンは私の考えに賛成しました。</div></button></li><li><button class="w" data-no="71"><div class="top"><span class="no">71</span><span class="en">on</span><span class="ps">前</span></div><div class="ja">（乗り物）に乗って；～の上に</div><div class="ex">There were many people <b>on</b> the bus.</div><div class="xj">バスにはたくさんの人が乗っていました。</div></button></li><li><button class="w" data-no="72"><div class="top"><span class="no">72</span><span class="en">festival</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">祭り</div><div class="ex">We went to the summer <b>festival</b> last night.</div><div class="xj">私たちは昨夜、夏祭りに行きました。</div></button></li><li><button class="w" data-no="73"><div class="top"><span class="no">73</span><span class="en">believe</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">信じる</div><div class="ex">I can’t <b>believe</b> it!</div><div class="xj">信じられない！</div></button></li><li><button class="w" data-no="74"><div class="top"><span class="no">74</span><span class="en">～, don’t you?</span><span class="ps">熟</span></div><div class="ja">～ですよね（念をおす言い方）</div><div class="ex">You like music, <b>don’t you?</b></div><div class="xj">あなたは音楽が好きですよね。</div></button></li><li><button class="w" data-no="75"><div class="top"><span class="no">75</span><span class="en">actually</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">実は；実際に</div><div class="ex"><b>Actually</b>, I don’t like tomatoes.</div><div class="xj">実は、私はトマトが好きではありません。</div></button></li><li><button class="w" data-no="76"><div class="top"><span class="no">76</span><span class="en">see</span><span class="ps">動</span></div><div class="ja">（医者に）診てもらう；会う</div><div class="ex">I’ll <b>see</b> a doctor tomorrow.</div><div class="xj">私は明日、医者に診てもらいます。</div></button></li><li><button class="w" data-no="77"><div class="top"><span class="no">77</span><span class="en">part</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">部分；役</div><div class="ex">This is my favorite <b>part</b> of the movie.</div><div class="xj">ここがその映画で私がいちばん好きな部分です。</div></button></li><li><button class="w" data-no="78"><div class="top"><span class="no">78</span><span class="en">speech</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">スピーチ；演説</div><div class="ex">Lisa made a <b>speech</b> in English at the contest.</div><div class="xj">リサはコンテストで英語のスピーチをしました。</div></button></li><li><button class="w" data-no="79"><div class="top"><span class="no">79</span><span class="en">useful</span><span class="ps">形</span></div><div class="ja">役に立つ</div><div class="ex">This dictionary is very <b>useful</b>.</div><div class="xj">この辞書はとても役に立ちます。</div></button></li><li><button class="w" data-no="80"><div class="top"><span class="no">80</span><span class="en">sad</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">悲しい</div><div class="ex">The story was very <b>sad</b>.</div><div class="xj">その物語はとても悲しかったです。</div></button></li><li><button class="w" data-no="81"><div class="top"><span class="no">81</span><span class="en">when</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">～するとき</div><div class="ex"><b>When</b> I got home, my mother was cooking.</div><div class="xj">私が家に帰ったとき、母は料理をしていました。</div></button></li><li><button class="w" data-no="82"><div class="top"><span class="no">82</span><span class="en">job</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">仕事</div><div class="ex">My father likes his <b>job</b>.</div><div class="xj">父は自分の仕事が好きです。</div></button></li><li><button class="w" data-no="83"><div class="top"><span class="no">83</span><span class="en">between</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">（2つ）の間に；～の間で</div><div class="ex">The bank is <b>between</b> the post office and the park.</div><div class="xj">銀行は郵便局と公園の間にあります。</div></button></li><li><button class="w" data-no="84"><div class="top"><span class="no">84</span><span class="en">May I ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～してもよいですか</div><div class="ex">A: <b>May I</b> open the window?<br>B: Sure.</div><div class="xj">A：窓を開けてもよいですか。B：いいですよ。</div></button></li><li><button class="w" data-no="85"><div class="top"><span class="no">85</span><span class="en">you’ll</span><span class="ps">代</span></div><div class="ja">あなたは～するだろう（you will の短縮形）</div><div class="ex"><b>You’ll</b> like this book.</div><div class="xj">あなたはこの本を気に入るでしょう。</div></button></li><li><button class="w" data-no="86"><div class="top"><span class="no">86</span><span class="en">living</span><span class="ps">形</span></div><div class="ja">生きている</div><div class="ex">Plants are <b>living</b> things.</div><div class="xj">植物は生きているものです。</div></button></li><li><button class="w" data-no="87"><div class="top"><span class="no">87</span><span class="en">well</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">元気な；健康な</div><div class="ex">I was sick yesterday, but I’m <b>well</b> now.</div><div class="xj">昨日は具合が悪かったけれど、今は元気です。</div></button></li><li><button class="w" data-no="88"><div class="top"><span class="no">88</span><span class="en">easily</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">簡単に</div><div class="ex">You can make this cake <b>easily</b>.</div><div class="xj">このケーキは簡単に作れます。</div></button></li><li><button class="w" data-no="89"><div class="top"><span class="no">89</span><span class="en">share</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">分け合う；共有する</div><div class="ex">Let’s <b>share</b> this pizza.</div><div class="xj">このピザを分け合いましょう。</div></button></li><li><button class="w" data-no="90"><div class="top"><span class="no">90</span><span class="en">move</span><span class="ps">動</span></div><div class="ja">引っ越す；動かす</div><div class="ex">My family <b>moved</b> to Osaka last year.</div><div class="xj">私の家族は去年大阪に引っ越しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../02/">← 第2回</a><a href="../04/">第4回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"61": 4
