</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第2回</h1><div class="sub">No.31〜60</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../02.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="31"><div class="top"><span class="no">31</span><span class="en">one day</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">ある日</div><div class="ex"><b>One day</b>, Ken found a small cat in the park.</div><div class="xj">ある日、ケンは公園で小さなネコを見つけました。</div></button></li><li><button class="w" data-no="32"><div class="top"><span class="no">32</span><span class="en">again</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">また；再び</div><div class="ex">Let’s play tennis <b>again</b> tomorrow.</div><div class="xj">明日またテニスをしよう。</div></button></li><li><button class="w" data-no="33"><div class="top"><span class="no">33</span><span class="en">that</span><span class="ps">接</span></div><div class="ja">～ということ</div><div class="ex">I know <b>that</b> Emi likes music.</div><div class="xj">私はエミが音楽好きだということを知っています。</div></button></li><li><button class="w" data-no="34"><div class="top"><span class="no">34</span><span class="en">however</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">しかしながら；けれども</div><div class="ex">It was cold; <b>however</b>, we enjoyed the game.</div><div class="xj">寒かったです。しかしながら、私たちは試合を楽しみました。</div></button></li><li><button class="w" data-no="35"><div class="top"><span class="no">35</span><span class="en">change</span><span class="ps">動</span></div><div class="ja">変える；変わる；乗りかえる</div><div class="ex">I <b>changed</b> my plan for Sunday.</div><div class="xj">私は日曜日の予定を変えました。</div></button></li><li><button class="w" data-no="36"><div class="top"><span class="no">36</span><span class="en">life</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">生活；人生；命</div><div class="ex">My <b>life</b> in Canada was a lot of fun.</div><div class="xj">カナダでの私の生活はとても楽しかったです。</div></button></li><li><button class="w" data-no="37"><div class="top"><span class="no">37</span><span class="en">teach</span><span class="ps">動</span></div><div class="ja">教える</div><div class="ex">Ms. Tanaka <b>teaches</b> English at our school.</div><div class="xj">田中さんは私たちの学校で英語を教えています。</div></button></li><li><button class="w" data-no="38"><div class="top"><span class="no">38</span><span class="en">what</span><span class="ps">形</span></div><div class="ja">なんという～（だろう）</div><div class="ex">A: This is my new bike.<br>B: <b>What</b> a cool bike!</div><div class="xj">A：これがぼくの新しい自転車だよ。B：なんてかっこいい自転車なんだろう！</div></button></li><li><button class="w" data-no="39"><div class="top"><span class="no">39</span><span class="en">easy</span><span class="ps">形</span></div><div class="ja">簡単な；やさしい</div><div class="ex">The math test was <b>easy</b>.</div><div class="xj">数学のテストは簡単でした。</div></button></li><li><button class="w" data-no="40"><div class="top"><span class="no">40</span><span class="en">keep</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">持っておく；保つ</div><div class="ex">Can I <b>keep</b> this photo?</div><div class="xj">この写真を持っていてもいいですか。</div></button></li><li><button class="w" data-no="41"><div class="top"><span class="no">41</span><span class="en">such</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">そのような；そんな</div><div class="ex">Don’t say <b>such</b> a thing.</div><div class="xj">そんなことを言わないで。</div></button></li><li><button class="w" data-no="42"><div class="top"><span class="no">42</span><span class="en">more than ～</span><span class="ps">熟</span></div><div class="ja">～以上；～より多い</div><div class="ex"><b>More than</b> thirty people came to the party.</div><div class="xj">30人以上の人がパーティーに来ました。</div></button></li><li><button class="w" data-no="43"><div class="top"><span class="no">43</span><span class="en">this</span><span class="ps">形</span></div><div class="ja">今の；今度の</div><div class="ex">We have a lot of homework <b>this</b> week.</div><div class="xj">今週は宿題がたくさんあります。</div></button></li><li><button class="w" data-no="44"><div class="top"><span class="no">44</span><span class="en">word</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">言葉；単語</div><div class="ex">I will always remember Mr. Sato’s kind <b>words</b>.</div><div class="xj">私は佐藤先生の優しい言葉をずっと覚えています。</div></button></li><li><button class="w" data-no="45"><div class="top"><span class="no">45</span><span class="en">another</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">別の；もう1つの</div><div class="ex">Let’s meet <b>another</b> day.</div><div class="xj">別の日に会いましょう。</div></button></li><li><button class="w" data-no="46"><div class="top"><span class="no">46</span><span class="en">couldn’t</span><span class="ps">助</span></div><div class="ja">～できなかった（could not の短縮形）</div><div class="ex">I <b>couldn’t</b> answer the last question.</div><div class="xj">私は最後の問題に答えられませんでした。</div></button></li><li><button class="w" data-no="47"><div class="top"><span class="no">47</span><span class="en">bring</span><span class="ps">動</span></div><div class="ja">持ってくる；連れてくる</div><div class="ex">Please <b>bring</b> your lunch tomorrow.</div><div class="xj">明日はお弁当を持ってきてください。</div></button></li><li><button class="w" data-no="48"><div class="top"><span class="no">48</span><span class="en">information</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">情報</div><div class="ex">This website has a lot of <b>information</b> about Kyoto.</div><div class="xj">このウェブサイトには京都についての情報がたくさんあります。</div></button></li><li><button class="w" data-no="49"><div class="top"><span class="no">49</span><span class="en">many</span><span class="ps">代</span></div><div class="ja">多く；多くの人</div><div class="ex"><b>Many</b> of my friends play tennis.</div><div class="xj">私の友だちの多くはテニスをします。</div></button></li><li><button class="w" data-no="50"><div class="top"><span class="no">50</span><span class="en">soon</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">すぐに；まもなく</div><div class="ex">Summer vacation is coming <b>soon</b>.</div><div class="xj">もうすぐ夏休みがやってきます。</div></button></li><li><button class="w" data-no="51"><div class="top"><span class="no">51</span><span class="en">special</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">特別な</div><div class="ex">Today is a <b>special</b> day for me.</div><div class="xj">今日は私にとって特別な日です。</div></button></li><li><button class="w" data-no="52"><div class="top"><span class="no">52</span><span class="en">each other</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">お互い</div><div class="ex">Ken and Tom often help <b>each other</b>.</div><div class="xj">ケンとトムはよくお互いに助け合っています。</div></button></li><li><button class="w" data-no="53"><div class="top"><span class="no">53</span><span class="en">minute</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">（時間の）分；ちょっとの間</div><div class="ex">The train will come in five <b>minutes</b>.</div><div class="xj">電車は5分後に来ます。</div></button></li><li><button class="w" data-no="54"><div class="top"><span class="no">54</span><span class="en">with</span><span class="ps">前</span></div><div class="ja">～のある；～を持った</div><div class="ex">I want a house <b>with</b> a big garden.</div><div class="xj">私は大きな庭のある家がほしいです。</div></button></li><li><button class="w" data-no="55"><div class="top"><span class="no">55</span><span class="en">through</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～を通して；～を通り抜けて</div><div class="ex">We make friends <b>through</b> sports.</div><div class="xj">私たちはスポーツを通して友だちを作ります。</div></button></li><li><button class="w" data-no="56"><div class="top"><span class="no">56</span><span class="en">remember</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">覚えている；思い出す</div><div class="ex">Do you <b>remember</b> my name?</div><div class="xj">私の名前を覚えていますか。</div></button></li><li><button class="w" data-no="57"><div class="top"><span class="no">57</span><span class="en">later</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">あとで</div><div class="ex">I’ll call you <b>later</b>.</div><div class="xj">あとで電話するね。</div></button></li><li><button class="w" data-no="58"><div class="top"><span class="no">58</span><span class="en">glad</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">うれしい</div><div class="ex">A: I passed the test!<br>B: I’m so <b>glad</b>.</div><div class="xj">A：テストに合格したよ！B：とてもうれしいわ。</div></button></li><li><button class="w" data-no="59"><div class="top"><span class="no">59</span><span class="en">true</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">本当の；本当で</div><div class="ex">Is that story <b>true</b>?</div><div class="xj">その話は本当ですか。</div></button></li><li><button class="w" data-no="60"><div class="top"><span class="no">60</span><span class="en">so</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">だから；それで</div><div class="ex">It was cold, <b>so</b> I stayed home.</div><div class="xj">寒かったので、私は家にいました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../01/">← 第1回</a><a href="../03/">第3回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><scrip
