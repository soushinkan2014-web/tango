</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第7回</h1><div class="sub">No.181〜210</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../07.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="181"><div class="top"><span class="no">181</span><span class="en">rule</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">規則；ルール</div><div class="ex">Do you know the <b>rules</b> of this game?</div><div class="xj">あなたはこのゲームのルールを知っていますか。</div></button></li><li><button class="w" data-no="182"><div class="top"><span class="no">182</span><span class="en">wrong</span><span class="ps">形</span></div><div class="ja">間違った；具合が悪い</div><div class="ex">I think this answer is <b>wrong</b>.</div><div class="xj">この答えは間違っていると思います。</div></button></li><li><button class="w" data-no="183"><div class="top"><span class="no">183</span><span class="en">nothing</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">何も～ない</div><div class="ex">There is <b>nothing</b> in the box.</div><div class="xj">箱の中には何もありません。</div></button></li><li><button class="w" data-no="184"><div class="top"><span class="no">184</span><span class="en">new</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">初めての；不慣れな</div><div class="ex">In Canada, everything was <b>new</b> to me.</div><div class="xj">カナダでは、すべてが私にとって初めてでした。</div></button></li><li><button class="w" data-no="185"><div class="top"><span class="no">185</span><span class="en">fishing</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">釣り；漁業</div><div class="ex">We went <b>fishing</b> at the lake.</div><div class="xj">私たちは湖へ釣りに行きました。</div></button></li><li><button class="w" data-no="186"><div class="top"><span class="no">186</span><span class="en">respect</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">尊敬する</div><div class="ex">Emi <b>respects</b> her teacher.</div><div class="xj">エミは先生を尊敬しています。</div></button></li><li><button class="w" data-no="187"><div class="top"><span class="no">187</span><span class="en">action</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">行動；動作</div><div class="ex">Small <b>actions</b> can change the world.</div><div class="xj">小さな行動が世界を変えることができます。</div></button></li><li><button class="w" data-no="188"><div class="top"><span class="no">188</span><span class="en">carefully</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">注意深く；慎重に</div><div class="ex">Read the question <b>carefully</b>.</div><div class="xj">問題を注意深く読みなさい。</div></button></li><li><button class="w" data-no="189"><div class="top"><span class="no">189</span><span class="en">invite</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">招待する；招く</div><div class="ex">Emi <b>invited</b> me to her birthday party.</div><div class="xj">エミは私を誕生日パーティーに招待してくれました。</div></button></li><li><button class="w" data-no="190"><div class="top"><span class="no">190</span><span class="en">way</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">方向；方</div><div class="ex">Please come this <b>way</b>.</div><div class="xj">こちらの方へどうぞ。</div></button></li><li><button class="w" data-no="191"><div class="top"><span class="no">191</span><span class="en">go to bed</span><span class="ps">熟</span></div><div class="ja">寝る</div><div class="ex">I usually <b>go to bed</b> at ten.</div><div class="xj">私はふつう10時に寝ます。</div></button></li><li><button class="w" data-no="192"><div class="top"><span class="no">192</span><span class="en">spoke</span><span class="ps">動</span></div><div class="ja">話した（speak の過去形）</div><div class="ex">Lisa <b>spoke</b> to me in Japanese.</div><div class="xj">リサは日本語で私に話しかけました。</div></button></li><li><button class="w" data-no="193"><div class="top"><span class="no">193</span><span class="en">taken</span><span class="ps">形</span></div><div class="ja">take の過去分詞；（席が）ふさがっている</div><div class="ex">A: Is this seat <b>taken</b>?<br>B: No, it isn’t.</div><div class="xj">A：この席はふさがっていますか。B：いいえ、空いていますよ。</div></button></li><li><button class="w" data-no="194"><div class="top"><span class="no">194</span><span class="en">guide</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">案内人；ガイド</div><div class="ex">The <b>guide</b> took us to a beautiful lake.</div><div class="xj">ガイドが私たちを美しい湖に連れて行ってくれました。</div></button></li><li><button class="w" data-no="195"><div class="top"><span class="no">195</span><span class="en">great</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">偉大な；大きな</div><div class="ex">My grandfather was a <b>great</b> doctor.</div><div class="xj">祖父は偉大な医者でした。</div></button></li><li><button class="w" data-no="196"><div class="top"><span class="no">196</span><span class="en">energy</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">エネルギー</div><div class="ex">Let’s save <b>energy</b> at school.</div><div class="xj">学校でエネルギーを節約しましょう。</div></button></li><li><button class="w" data-no="197"><div class="top"><span class="no">197</span><span class="en">farmer</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">農家の人；農場主</div><div class="ex">My uncle is a rice <b>farmer</b>.</div><div class="xj">おじは米農家です。</div></button></li><li><button class="w" data-no="198"><div class="top"><span class="no">198</span><span class="en">unique</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">独特な；ほかにない</div><div class="ex">Emi’s drawings are <b>unique</b>.</div><div class="xj">エミの絵は独特です。</div></button></li><li><button class="w" data-no="199"><div class="top"><span class="no">199</span><span class="en">power</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">力</div><div class="ex">Words have great <b>power</b>.</div><div class="xj">言葉には大きな力があります。</div></button></li><li><button class="w" data-no="200"><div class="top"><span class="no">200</span><span class="en">return</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">戻る；帰る；返す</div><div class="ex">Lisa will <b>return</b> to Canada next month.</div><div class="xj">リサは来月カナダに戻ります。</div></button></li><li><button class="w" data-no="201"><div class="top"><span class="no">201</span><span class="en">may</span><span class="ps">助</span><span class="ek">英5</span></div><div class="ja">～してもよい；～かもしれない</div><div class="ex">You <b>may</b> use my dictionary.</div><div class="xj">私の辞書を使ってもいいですよ。</div></button></li><li><button class="w" data-no="202"><div class="top"><span class="no">202</span><span class="en">Here is ～.</span><span class="ps">熟</span></div><div class="ja">はい、～をどうぞ；ここに～があります</div><div class="ex"><b>Here is</b> my homework, Mr. Sato.</div><div class="xj">佐藤先生、宿題をどうぞ。</div></button></li><li><button class="w" data-no="203"><div class="top"><span class="no">203</span><span class="en">report</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">レポート；報告（書）</div><div class="ex">I wrote a <b>report</b> about food waste.</div><div class="xj">私は食品ロスについてのレポートを書きました。</div></button></li><li><button class="w" data-no="204"><div class="top"><span class="no">204</span><span class="en">fact</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">事実</div><div class="ex">This is an interesting <b>fact</b> about the moon.</div><div class="xj">これは月についてのおもしろい事実です。</div></button></li><li><button class="w" data-no="205"><div class="top"><span class="no">205</span><span class="en">voice</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">声</div><div class="ex">Emi has a beautiful <b>voice</b>.</div><div class="xj">エミは美しい声をしています。</div></button></li><li><button class="w" data-no="206"><div class="top"><span class="no">206</span><span class="en">work</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">仕事；作品</div><div class="ex">My mother has a lot of <b>work</b> today.</div><div class="xj">母は今日、仕事がたくさんあります。</div></button></li><li><button class="w" data-no="207"><div class="top"><span class="no">207</span><span class="en">develop</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">開発する；発達させる</div><div class="ex">They <b>developed</b> a new kind of shoe.</div><div class="xj">彼らは新しい種類の靴を開発しました。</div></button></li><li><button class="w" data-no="208"><div class="top"><span class="no">208</span><span class="en">mistake</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">間違い；誤り</div><div class="ex">I made a <b>mistake</b> on the test.</div><div class="xj">私はテストで間違いをしました。</div></button></li><li><button class="w" data-no="209"><div class="top"><span class="no">209</span><span class="en">eye</span><span class="ps">名</span></div><div class="ja">目</div><div class="ex">My cat has blue <b>eyes</b>.</div><div class="xj">私のネコは青い目をしています。</div></button></li><li><button class="w" data-no="210"><div class="top"><span class="no">210</span><span class="en">sold</span><span class="ps">動</span></div><div class="ja">売った（sell の過去形・過去分詞）</div><div class="ex">The shop <b>sold</b> all the bread by noon.</div><div class="xj">その店は正午までにパンを全部売りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../06/">← 第6回</a><a href="../08/">第8回 →</
