</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第8回</h1><div class="sub">No.211〜240</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../08.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="211"><div class="top"><span class="no">211</span><span class="en">Sounds nice.</span><span class="ps">熟</span></div><div class="ja">いいね；楽しそうだね</div><div class="ex">A: Let’s have lunch in the park.<br>B: <b>Sounds nice.</b></div><div class="xj">A：公園でお昼を食べよう。B：いいね。</div></button></li><li><button class="w" data-no="212"><div class="top"><span class="no">212</span><span class="en">high</span><span class="ps">名</span></div><div class="ja">最高気温</div><div class="ex">Tomorrow’s <b>high</b> will be twenty-five degrees.</div><div class="xj">明日の最高気温は25度でしょう。</div></button></li><li><button class="w" data-no="213"><div class="top"><span class="no">213</span><span class="en">London</span><span class="ps">名</span></div><div class="ja">ロンドン</div><div class="ex">My aunt lives in <b>London</b>.</div><div class="xj">おばはロンドンに住んでいます。</div></button></li><li><button class="w" data-no="214"><div class="top"><span class="no">214</span><span class="en">piece</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">1つ；1切れ；1枚</div><div class="ex">Can I have a <b>piece</b> of cake?</div><div class="xj">ケーキを1切れもらえますか。</div></button></li><li><button class="w" data-no="215"><div class="top"><span class="no">215</span><span class="en">price</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">値段；価格</div><div class="ex">The <b>price</b> of vegetables went up this month.</div><div class="xj">今月、野菜の値段が上がりました。</div></button></li><li><button class="w" data-no="216"><div class="top"><span class="no">216</span><span class="en">they’re</span><span class="ps">代</span></div><div class="ja">彼らは～である（they are の短縮形）</div><div class="ex"><b>They’re</b> my new classmates.</div><div class="xj">彼らは私の新しいクラスメートです。</div></button></li><li><button class="w" data-no="217"><div class="top"><span class="no">217</span><span class="en">place</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">順位；～位</div><div class="ex">Our team was in first <b>place</b> last year.</div><div class="xj">私たちのチームは昨年1位でした。</div></button></li><li><button class="w" data-no="218"><div class="top"><span class="no">218</span><span class="en">trouble</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">困ったこと；トラブル</div><div class="ex">We had some <b>trouble</b> on the trip.</div><div class="xj">旅行中、少し困ったことがありました。</div></button></li><li><button class="w" data-no="219"><div class="top"><span class="no">219</span><span class="en">earth</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">地球</div><div class="ex">The <b>earth</b> goes around the sun.</div><div class="xj">地球は太陽のまわりを回っています。</div></button></li><li><button class="w" data-no="220"><div class="top"><span class="no">220</span><span class="en">pass</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">（時が）過ぎる；手渡す；合格する</div><div class="ex">Time <b>passes</b> quickly when I’m with friends.</div><div class="xj">友だちといると時間が早く過ぎます。</div></button></li><li><button class="w" data-no="221"><div class="top"><span class="no">221</span><span class="en">airport</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">空港</div><div class="ex">We arrived at the <b>airport</b> at nine.</div><div class="xj">私たちは9時に空港に着きました。</div></button></li><li><button class="w" data-no="222"><div class="top"><span class="no">222</span><span class="en">around</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～のあちこちを；～じゅうを</div><div class="ex">I want to travel <b>around</b> Japan.</div><div class="xj">私は日本のあちこちを旅行したいです。</div></button></li><li><button class="w" data-no="223"><div class="top"><span class="no">223</span><span class="en">get well</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">（病気が）よくなる；元気になる</div><div class="ex">I hope you <b>get well</b> soon.</div><div class="xj">早くよくなるといいですね。</div></button></li><li><button class="w" data-no="224"><div class="top"><span class="no">224</span><span class="en">amount</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">量</div><div class="ex">Please check the <b>amount</b> of sugar.</div><div class="xj">砂糖の量を確認してください。</div></button></li><li><button class="w" data-no="225"><div class="top"><span class="no">225</span><span class="en">hotel</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ホテル</div><div class="ex">We stayed at a <b>hotel</b> in Kyoto.</div><div class="xj">私たちは京都のホテルに泊まりました。</div></button></li><li><button class="w" data-no="226"><div class="top"><span class="no">226</span><span class="en">line</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">線；列</div><div class="ex">Write your name on this <b>line</b>.</div><div class="xj">この線の上に名前を書いてください。</div></button></li><li><button class="w" data-no="227"><div class="top"><span class="no">227</span><span class="en">noon</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">正午</div><div class="ex">Let’s meet at the station at <b>noon</b>.</div><div class="xj">正午に駅で会いましょう。</div></button></li><li><button class="w" data-no="228"><div class="top"><span class="no">228</span><span class="en">any</span><span class="ps">形</span></div><div class="ja">どんな～でも</div><div class="ex">You can choose <b>any</b> color.</div><div class="xj">どんな色を選んでもいいですよ。</div></button></li><li><button class="w" data-no="229"><div class="top"><span class="no">229</span><span class="en">twice</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">2回；2度；2倍</div><div class="ex">I clean my room <b>twice</b> a week.</div><div class="xj">私は週に2回部屋をそうじします。</div></button></li><li><button class="w" data-no="230"><div class="top"><span class="no">230</span><span class="en">angry</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">怒った；腹を立てた</div><div class="ex">Mom was <b>angry</b> because I came home late.</div><div class="xj">私が遅く帰ったので、母は怒っていました。</div></button></li><li><button class="w" data-no="231"><div class="top"><span class="no">231</span><span class="en">cheap</span><span class="ps">形</span></div><div class="ja">安い</div><div class="ex">This T-shirt was very <b>cheap</b>.</div><div class="xj">このTシャツはとても安かったです。</div></button></li><li><button class="w" data-no="232"><div class="top"><span class="no">232</span><span class="en">bottle</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">びん；ボトル</div><div class="ex">Put the empty <b>bottles</b> in this box.</div><div class="xj">空のびんはこの箱に入れてください。</div></button></li><li><button class="w" data-no="233"><div class="top"><span class="no">233</span><span class="en">best</span><span class="ps">名</span></div><div class="ja">最善；全力</div><div class="ex">Try your <b>best</b> in the game.</div><div class="xj">試合では全力を尽くしてね。</div></button></li><li><button class="w" data-no="234"><div class="top"><span class="no">234</span><span class="en">post office</span><span class="ps">熟</span><span class="ek">英5</span></div><div class="ja">郵便局</div><div class="ex">Is the <b>post office</b> near your house?</div><div class="xj">郵便局はあなたの家の近くにありますか。</div></button></li><li><button class="w" data-no="235"><div class="top"><span class="no">235</span><span class="en">slowly</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">ゆっくりと</div><div class="ex">Can you speak <b>slowly</b>, please?</div><div class="xj">ゆっくり話してもらえますか。</div></button></li><li><button class="w" data-no="236"><div class="top"><span class="no">236</span><span class="en">space</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">宇宙；空間；場所</div><div class="ex">I want to go to <b>space</b> someday.</div><div class="xj">私はいつか宇宙へ行きたいです。</div></button></li><li><button class="w" data-no="237"><div class="top"><span class="no">237</span><span class="en">machine</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">機械</div><div class="ex">This <b>machine</b> makes coffee.</div><div class="xj">この機械はコーヒーを作ります。</div></button></li><li><button class="w" data-no="238"><div class="top"><span class="no">238</span><span class="en">inside</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～の中に；内側に</div><div class="ex">What is <b>inside</b> the box?</div><div class="xj">その箱の中には何がありますか。</div></button></li><li><button class="w" data-no="239"><div class="top"><span class="no">239</span><span class="en">old</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">年をとった；高齢の</div><div class="ex">My grandfather is <b>old</b> but very healthy.</div><div class="xj">祖父は年をとっていますが、とても元気です。</div></button></li><li><button class="w" data-no="240"><div class="top"><span class="no">240</span><span class="en">order</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">注文する；命令する</div><div class="ex">I <b>ordered</b> a pizza for lunch.</div><div class="xj">私は昼食にピザを注文しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../07/">← 第7回</a><a href="../09/">第9回 →</
