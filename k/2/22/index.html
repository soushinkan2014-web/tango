</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第22回</h1><div class="sub">No.631〜660</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../22.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="631"><div class="top"><span class="no">631</span><span class="en">than</span><span class="ps">接</span><span class="ek">英4</span></div><div class="ja">～よりも</div><div class="ex">There are more <b>than</b> thirty students in my class.</div><div class="xj">私のクラスには30人より多くの生徒がいます。</div></button></li><li><button class="w" data-no="632"><div class="top"><span class="no">632</span><span class="en">better</span><span class="ps">形</span></div><div class="ja">よりよい；よりじょうずに（good / well の比較級）</div><div class="ex">This plan is <b>better</b> than that one.</div><div class="xj">この案はあの案よりよいです。</div></button></li><li><button class="w" data-no="633"><div class="top"><span class="no">633</span><span class="en">be going to ～</span><span class="ps">熟</span></div><div class="ja">～するつもりだ；～しそうだ</div><div class="ex">We <b>are going to</b> have a party on Sunday.</div><div class="xj">私たちは日曜日にパーティーを開くつもりです。</div></button></li><li><button class="w" data-no="634"><div class="top"><span class="no">634</span><span class="en">used</span><span class="ps">形</span></div><div class="ja">使われた；中古の</div><div class="ex">This room is <b>used</b> for club meetings.</div><div class="xj">この部屋は部活の集まりに使われています。</div></button></li><li><button class="w" data-no="635"><div class="top"><span class="no">635</span><span class="en">seen</span><span class="ps">動</span></div><div class="ja">（see の過去分詞）見られる</div><div class="ex">Mt. Fuji can be <b>seen</b> from here.</div><div class="xj">ここから富士山が見られます。</div></button></li><li><button class="w" data-no="636"><div class="top"><span class="no">636</span><span class="en">written</span><span class="ps">動</span></div><div class="ja">（write の過去分詞）書かれる</div><div class="ex">This book is <b>written</b> in easy English.</div><div class="xj">この本はやさしい英語で書かれています。</div></button></li><li><button class="w" data-no="637"><div class="top"><span class="no">637</span><span class="en">how to ～</span><span class="ps">熟</span></div><div class="ja">～のしかた</div><div class="ex">I don’t know <b>how to</b> use this machine.</div><div class="xj">私はこの機械の使い方を知りません。</div></button></li><li><button class="w" data-no="638"><div class="top"><span class="no">638</span><span class="en">area</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">地域；区域</div><div class="ex">This <b>area</b> is famous for its apples.</div><div class="xj">この地域はリンゴで有名です。</div></button></li><li><button class="w" data-no="639"><div class="top"><span class="no">639</span><span class="en">host</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ホスト；（客をもてなす）主人</div><div class="ex">My <b>host</b> family in Canada was very kind.</div><div class="xj">カナダのホストファミリーはとても親切でした。</div></button></li><li><button class="w" data-no="640"><div class="top"><span class="no">640</span><span class="en">try to ～</span><span class="ps">熟</span></div><div class="ja">～しようとする</div><div class="ex">I <b>tried to</b> open the door, but I couldn’t.</div><div class="xj">私はドアを開けようとしましたが、できませんでした。</div></button></li><li><button class="w" data-no="641"><div class="top"><span class="no">641</span><span class="en">advice</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">助言；アドバイス</div><div class="ex">My teacher gave me good <b>advice</b>.</div><div class="xj">先生は私によい助言をくれました。</div></button></li><li><button class="w" data-no="642"><div class="top"><span class="no">642</span><span class="en">born</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（be born で）生まれる</div><div class="ex">My sister was <b>born</b> in May.</div><div class="xj">妹は5月に生まれました。</div></button></li><li><button class="w" data-no="643"><div class="top"><span class="no">643</span><span class="en">need to ～</span><span class="ps">熟</span></div><div class="ja">～する必要がある</div><div class="ex">We <b>need to</b> leave at seven.</div><div class="xj">私たちは7時に出発する必要があります。</div></button></li><li><button class="w" data-no="644"><div class="top"><span class="no">644</span><span class="en">plastic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">プラスチック；ビニール</div><div class="ex">This bottle is made of <b>plastic</b>.</div><div class="xj">このボトルはプラスチックでできています。</div></button></li><li><button class="w" data-no="645"><div class="top"><span class="no">645</span><span class="en">technology</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">科学技術</div><div class="ex">New <b>technology</b> is changing our lives.</div><div class="xj">新しい科学技術が私たちの生活を変えています。</div></button></li><li><button class="w" data-no="646"><div class="top"><span class="no">646</span><span class="en">in the future</span><span class="ps">熟</span></div><div class="ja">将来（は）</div><div class="ex">Emi wants to work at a zoo <b>in the future</b>.</div><div class="xj">エミは将来、動物園で働きたいと思っています。</div></button></li><li><button class="w" data-no="647"><div class="top"><span class="no">647</span><span class="en">encourage</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を励ます</div><div class="ex">Her letter <b>encouraged</b> me.</div><div class="xj">彼女の手紙は私を励ましました。</div></button></li><li><button class="w" data-no="648"><div class="top"><span class="no">648</span><span class="en">pick</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をつむ；～を選ぶ</div><div class="ex">Emi <b>picked</b> some flowers in the garden.</div><div class="xj">エミは庭で花をつみました。</div></button></li><li><button class="w" data-no="649"><div class="top"><span class="no">649</span><span class="en">community</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">地域社会；地域の人々</div><div class="ex">Our <b>community</b> has a summer festival every year.</div><div class="xj">私たちの地域社会では毎年、夏祭りがあります。</div></button></li><li><button class="w" data-no="650"><div class="top"><span class="no">650</span><span class="en">decide to ～</span><span class="ps">熟</span></div><div class="ja">～することに決める</div><div class="ex">Emi <b>decided to</b> join the music club.</div><div class="xj">エミは音楽部に入ることに決めました。</div></button></li><li><button class="w" data-no="651"><div class="top"><span class="no">651</span><span class="en">produce</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を生産する；生み出す</div><div class="ex">This village <b>produces</b> a lot of rice.</div><div class="xj">この村はたくさんの米を生産しています。</div></button></li><li><button class="w" data-no="652"><div class="top"><span class="no">652</span><span class="en">complete</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を完成させる；仕上げる</div><div class="ex">I <b>completed</b> my science report last night.</div><div class="xj">私は昨夜、理科のレポートを完成させました。</div></button></li><li><button class="w" data-no="653"><div class="top"><span class="no">653</span><span class="en">some of ～</span><span class="ps">熟</span></div><div class="ja">～のいくつか；～の一部</div><div class="ex"><b>Some of</b> these books are too hard for me.</div><div class="xj">これらの本のいくつかは私には難しすぎます。</div></button></li><li><button class="w" data-no="654"><div class="top"><span class="no">654</span><span class="en">percent</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">パーセント</div><div class="ex">Thirty <b>percent</b> of the students in my class have a dog.</div><div class="xj">私のクラスの生徒の30パーセントは犬を飼っています。</div></button></li><li><button class="w" data-no="655"><div class="top"><span class="no">655</span><span class="en">less</span><span class="ps">形</span></div><div class="ja">より少ない；より少なく</div><div class="ex">Let’s use <b>less</b> water at home.</div><div class="xj">家では水を少なめに使いましょう。</div></button></li><li><button class="w" data-no="656"><div class="top"><span class="no">656</span><span class="en">Will you ～?</span><span class="ps">熟</span></div><div class="ja">～してくれませんか</div><div class="ex"><b>Will you</b> close the door, please?</div><div class="xj">ドアを閉めてくれませんか。</div></button></li><li><button class="w" data-no="657"><div class="top"><span class="no">657</span><span class="en">product</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">製品</div><div class="ex">These <b>products</b> were made in Japan.</div><div class="xj">これらの製品は日本で作られました。</div></button></li><li><button class="w" data-no="658"><div class="top"><span class="no">658</span><span class="en">influence</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">影響</div><div class="ex">This movie had a great <b>influence</b> on me.</div><div class="xj">この映画は私に大きな影響を与えました。</div></button></li><li><button class="w" data-no="659"><div class="top"><span class="no">659</span><span class="en">start to ～</span><span class="ps">熟</span></div><div class="ja">～し始める</div><div class="ex">It <b>started to</b> rain during the game.</div><div class="xj">試合の間に雨が降り始めました。</div></button></li><li><button class="w" data-no="660"><div class="top"><span class="no">660</span><span class="en">department</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">売り場；部門</div><div class="ex">The toy <b>department</b> is on the fifth floor.</div><div class="xj">おもちゃ売り場は5階にあります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、
