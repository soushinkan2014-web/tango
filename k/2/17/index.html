</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第17回</h1><div class="sub">No.481〜510</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../17.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="481"><div class="top"><span class="no">481</span><span class="en">passenger</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">乗客</div><div class="ex">There were about two hundred <b>passengers</b> on the plane.</div><div class="xj">その飛行機には約200人の乗客が乗っていました。</div></button></li><li><button class="w" data-no="482"><div class="top"><span class="no">482</span><span class="en">president</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">大統領；社長</div><div class="ex">The <b>president</b> of the country visited Japan.</div><div class="xj">その国の大統領が日本を訪れました。</div></button></li><li><button class="w" data-no="483"><div class="top"><span class="no">483</span><span class="en">gate</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">搭乗口；ゲート</div><div class="ex">Please go to <b>Gate</b> 5 now.</div><div class="xj">今すぐ5番搭乗口へ行ってください。</div></button></li><li><button class="w" data-no="484"><div class="top"><span class="no">484</span><span class="en">seventeenth</span><span class="ps">数</span></div><div class="ja">17番目（の）；（日付の）17日</div><div class="ex">Today is the <b>seventeenth</b>.</div><div class="xj">今日は17日です。</div></button></li><li><button class="w" data-no="485"><div class="top"><span class="no">485</span><span class="en">sixteenth</span><span class="ps">数</span></div><div class="ja">16番目（の）；（日付の）16日</div><div class="ex">Lisa came to Japan on April <b>sixteenth</b>.</div><div class="xj">リサは4月16日に日本に来ました。</div></button></li><li><button class="w" data-no="486"><div class="top"><span class="no">486</span><span class="en">tenth</span><span class="ps">数</span></div><div class="ja">10番目（の）；（日付の）10日</div><div class="ex">Today is the <b>tenth</b> day of our trip.</div><div class="xj">今日は旅行の10日目です。</div></button></li><li><button class="w" data-no="487"><div class="top"><span class="no">487</span><span class="en">trumpet</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">トランペット</div><div class="ex">I can play the <b>trumpet</b>.</div><div class="xj">私はトランペットを吹くことができます。</div></button></li><li><button class="w" data-no="488"><div class="top"><span class="no">488</span><span class="en">leg</span><span class="ps">名</span></div><div class="ja">（机・いすなどの）脚</div><div class="ex">This table has four <b>legs</b>.</div><div class="xj">このテーブルには脚が4本あります。</div></button></li><li><button class="w" data-no="489"><div class="top"><span class="no">489</span><span class="en">rice ball</span><span class="ps">熟</span></div><div class="ja">おにぎり</div><div class="ex">I made two <b>rice balls</b> for the picnic.</div><div class="xj">私はピクニックのためにおにぎりを2つ作りました。</div></button></li><li><button class="w" data-no="490"><div class="top"><span class="no">490</span><span class="en">twelfth</span><span class="ps">数</span><span class="ek">英4</span></div><div class="ja">12番目（の）；（日付の）12日</div><div class="ex">December is the <b>twelfth</b> month of the year.</div><div class="xj">12月は1年の12番目の月です。</div></button></li><li><button class="w" data-no="491"><div class="top"><span class="no">491</span><span class="en">vet</span><span class="ps">名</span></div><div class="ja">獣医</div><div class="ex">My aunt is a <b>vet</b>.</div><div class="xj">私のおばは獣医です。</div></button></li><li><button class="w" data-no="492"><div class="top"><span class="no">492</span><span class="en">windy</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">風の強い</div><div class="ex">It was very <b>windy</b> yesterday.</div><div class="xj">昨日はとても風が強かったです。</div></button></li><li><button class="w" data-no="493"><div class="top"><span class="no">493</span><span class="en">lady</span><span class="ps">名</span></div><div class="ja">女性；婦人（ていねいな言い方）</div><div class="ex">Let’s help that old <b>lady</b>.</div><div class="xj">あの年配の女性を手伝いましょう。</div></button></li><li><button class="w" data-no="494"><div class="top"><span class="no">494</span><span class="en">cost</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">費用；値段</div><div class="ex">The <b>cost</b> of the trip was about 30,000 yen.</div><div class="xj">その旅行の費用は約3万円でした。</div></button></li><li><button class="w" data-no="495"><div class="top"><span class="no">495</span><span class="en">magic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">手品；魔法</div><div class="ex">Can you do <b>magic</b>?</div><div class="xj">あなたは手品ができますか。</div></button></li><li><button class="w" data-no="496"><div class="top"><span class="no">496</span><span class="en">queen</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">女王</div><div class="ex">I’m the <b>queen</b> in our class play.</div><div class="xj">私はクラスの劇で女王の役です。</div></button></li><li><button class="w" data-no="497"><div class="top"><span class="no">497</span><span class="en">beat</span><span class="ps">動</span></div><div class="ja">（相手を）負かす；（心臓が）打つ</div><div class="ex">Our team <b>beat</b> Tom’s team last Sunday.</div><div class="xj">私たちのチームは先週の日曜日、トムのチームを負かしました。</div></button></li><li><button class="w" data-no="498"><div class="top"><span class="no">498</span><span class="en">air conditioner</span><span class="ps">熟</span></div><div class="ja">エアコン</div><div class="ex">Please turn off the <b>air conditioner</b>.</div><div class="xj">エアコンを消してください。</div></button></li><li><button class="w" data-no="499"><div class="top"><span class="no">499</span><span class="en">rich</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">（味が）濃厚な；こってりした</div><div class="ex">This chocolate cake is very <b>rich</b>.</div><div class="xj">このチョコレートケーキはとても濃厚です。</div></button></li><li><button class="w" data-no="500"><div class="top"><span class="no">500</span><span class="en">bedroom</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">寝室</div><div class="ex">I have a TV in my <b>bedroom</b>.</div><div class="xj">私の寝室にはテレビがあります。</div></button></li><li><button class="w" data-no="501"><div class="top"><span class="no">501</span><span class="en">deer</span><span class="ps">名</span></div><div class="ja">シカ</div><div class="ex">We saw many <b>deer</b> in Nara.</div><div class="xj">私たちは奈良でたくさんのシカを見ました。</div></button></li><li><button class="w" data-no="502"><div class="top"><span class="no">502</span><span class="en">laundry</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">洗濯；洗濯物</div><div class="ex">I help my mother with the <b>laundry</b> on Sundays.</div><div class="xj">私は日曜日に母の洗濯を手伝います。</div></button></li><li><button class="w" data-no="503"><div class="top"><span class="no">503</span><span class="en">shot</span><span class="ps">名</span></div><div class="ja">シュート；（写真の）1枚</div><div class="ex">Ken made a great <b>shot</b> in the last game.</div><div class="xj">ケンは最後の試合ですごいシュートを決めました。</div></button></li><li><button class="w" data-no="504"><div class="top"><span class="no">504</span><span class="en">thick</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">太い；厚い</div><div class="ex">This ramen has <b>thick</b> noodles.</div><div class="xj">このラーメンは麺が太いです。</div></button></li><li><button class="w" data-no="505"><div class="top"><span class="no">505</span><span class="en">shower</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">にわか雨</div><div class="ex">There will be <b>showers</b> in the afternoon.</div><div class="xj">午後にはにわか雨があるでしょう。</div></button></li><li><button class="w" data-no="506"><div class="top"><span class="no">506</span><span class="en">bit</span><span class="ps">名</span></div><div class="ja">少し；小片</div><div class="ex">I ate a <b>bit</b> of bread for breakfast.</div><div class="xj">朝食にパンを少し食べました。</div></button></li><li><button class="w" data-no="507"><div class="top"><span class="no">507</span><span class="en">bomb</span><span class="ps">名</span></div><div class="ja">爆弾</div><div class="ex">We learned about the atomic <b>bomb</b> in our history class.</div><div class="xj">私たちは歴史の授業で原子爆弾について学びました。</div></button></li><li><button class="w" data-no="508"><div class="top"><span class="no">508</span><span class="en">eastern</span><span class="ps">形</span></div><div class="ja">東の；東部の</div><div class="ex">Our school is in the <b>eastern</b> part of the city.</div><div class="xj">私たちの学校は市の東部にあります。</div></button></li><li><button class="w" data-no="509"><div class="top"><span class="no">509</span><span class="en">opening ceremony</span><span class="ps">熟</span></div><div class="ja">開会式；始業式</div><div class="ex">The <b>opening ceremony</b> of sports day was exciting.</div><div class="xj">運動会の開会式はわくわくしました。</div></button></li><li><button class="w" data-no="510"><div class="top"><span class="no">510</span><span class="en">kid</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">冗談を言う；からかう</div><div class="ex">I’m just <b>kidding</b>, Emi.</div><div class="xj">ほんの冗談だよ、エミ。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../16/">← 第16回</a><a href="../18/">第18回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"481": 4.55
