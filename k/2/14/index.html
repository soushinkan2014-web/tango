</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第14回</h1><div class="sub">No.391〜420</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../14.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="391"><div class="top"><span class="no">391</span><span class="en">turn</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">順番；番</div><div class="ex">Now it’s your <b>turn</b>, Yuki.</div><div class="xj">さあ、ユキ、あなたの番ですよ。</div></button></li><li><button class="w" data-no="392"><div class="top"><span class="no">392</span><span class="en">deep</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">深い</div><div class="ex">This part of the river is very <b>deep</b>.</div><div class="xj">川のこのあたりはとても深いです。</div></button></li><li><button class="w" data-no="393"><div class="top"><span class="no">393</span><span class="en">coffee shop</span><span class="ps">熟</span></div><div class="ja">喫茶店；コーヒー店</div><div class="ex">Let’s meet at the <b>coffee shop</b> at three.</div><div class="xj">3時に喫茶店で会おう。</div></button></li><li><button class="w" data-no="394"><div class="top"><span class="no">394</span><span class="en">jog</span><span class="ps">動</span></div><div class="ja">ジョギングする</div><div class="ex">My father <b>jogs</b> in the park every morning.</div><div class="xj">父は毎朝公園でジョギングします。</div></button></li><li><button class="w" data-no="395"><div class="top"><span class="no">395</span><span class="en">peace</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">平和</div><div class="ex">We hope for world <b>peace</b>.</div><div class="xj">私たちは世界の平和を願っています。</div></button></li><li><button class="w" data-no="396"><div class="top"><span class="no">396</span><span class="en">gym</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ジム；体育館</div><div class="ex">My father goes to the <b>gym</b> after work.</div><div class="xj">父は仕事のあとでジムに行きます。</div></button></li><li><button class="w" data-no="397"><div class="top"><span class="no">397</span><span class="en">postcard</span><span class="ps">名</span></div><div class="ja">はがき；絵はがき</div><div class="ex">I sent a <b>postcard</b> to my grandmother.</div><div class="xj">私は祖母に絵はがきを送りました。</div></button></li><li><button class="w" data-no="398"><div class="top"><span class="no">398</span><span class="en">quite</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">かなり；とても</div><div class="ex">This question is <b>quite</b> difficult.</div><div class="xj">この問題はかなり難しいです。</div></button></li><li><button class="w" data-no="399"><div class="top"><span class="no">399</span><span class="en">wrap</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">包む</div><div class="ex">Let’s <b>wrap</b> the present in this paper.</div><div class="xj">プレゼントをこの紙で包みましょう。</div></button></li><li><button class="w" data-no="400"><div class="top"><span class="no">400</span><span class="en">above</span><span class="ps">前</span><span class="ek">英3</span></div><div class="ja">～の上に；～の上方に</div><div class="ex">The moon is <b>above</b> the mountain.</div><div class="xj">月が山の上に出ています。</div></button></li><li><button class="w" data-no="401"><div class="top"><span class="no">401</span><span class="en">sit</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（sit up で）体を起こす</div><div class="ex">Emi <b>sat</b> up and looked at the clock.</div><div class="xj">エミは体を起こして時計を見ました。</div></button></li><li><button class="w" data-no="402"><div class="top"><span class="no">402</span><span class="en">coat</span><span class="ps">名</span></div><div class="ja">コート</div><div class="ex">It’s cold, so wear your <b>coat</b>.</div><div class="xj">寒いからコートを着てね。</div></button></li><li><button class="w" data-no="403"><div class="top"><span class="no">403</span><span class="en">have no idea</span><span class="ps">熟</span></div><div class="ja">まったくわからない</div><div class="ex">A: Where is Ken?<br>B: I <b>have no idea</b>.</div><div class="xj">A：ケンはどこにいますか。B：まったくわかりません。</div></button></li><li><button class="w" data-no="404"><div class="top"><span class="no">404</span><span class="en">king</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">王；王様</div><div class="ex">The <b>king</b> lived in a big castle.</div><div class="xj">王様は大きな城に住んでいました。</div></button></li><li><button class="w" data-no="405"><div class="top"><span class="no">405</span><span class="en">penguin</span><span class="ps">名</span></div><div class="ja">ペンギン</div><div class="ex"><b>Penguins</b> can’t fly, but they swim well.</div><div class="xj">ペンギンは飛べませんが、じょうずに泳ぎます。</div></button></li><li><button class="w" data-no="406"><div class="top"><span class="no">406</span><span class="en">pink</span><span class="ps">形</span></div><div class="ja">ピンク色の</div><div class="ex">Yuki likes <b>pink</b> flowers.</div><div class="xj">ユキはピンク色の花が好きです。</div></button></li><li><button class="w" data-no="407"><div class="top"><span class="no">407</span><span class="en">break</span><span class="ps">動</span></div><div class="ja">壊す；割る</div><div class="ex">Ken <b>broke</b> his bike yesterday.</div><div class="xj">ケンは昨日、自転車を壊しました。</div></button></li><li><button class="w" data-no="408"><div class="top"><span class="no">408</span><span class="en">contact</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">連絡する</div><div class="ex">Please <b>contact</b> me by email.</div><div class="xj">メールで私に連絡してください。</div></button></li><li><button class="w" data-no="409"><div class="top"><span class="no">409</span><span class="en">danger</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">危険</div><div class="ex">This sign means <b>danger</b>.</div><div class="xj">この標識は危険を意味しています。</div></button></li><li><button class="w" data-no="410"><div class="top"><span class="no">410</span><span class="en">deeply</span><span class="ps">副</span><span class="ek">準2+</span></div><div class="ja">深く</div><div class="ex">Lisa thought <b>deeply</b> about her future.</div><div class="xj">リサは自分の将来について深く考えました。</div></button></li><li><button class="w" data-no="411"><div class="top"><span class="no">411</span><span class="en">environmental</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">環境の</div><div class="ex">We talked about <b>environmental</b> problems in class.</div><div class="xj">私たちは授業で環境問題について話し合いました。</div></button></li><li><button class="w" data-no="412"><div class="top"><span class="no">412</span><span class="en">off</span><span class="ps">前</span></div><div class="ja">～から（離れて）</div><div class="ex">The cat jumped <b>off</b> the table.</div><div class="xj">ネコがテーブルから飛び降りました。</div></button></li><li><button class="w" data-no="413"><div class="top"><span class="no">413</span><span class="en">glove</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">手袋；グローブ</div><div class="ex">I lost one of my <b>gloves</b> on the bus.</div><div class="xj">私はバスで手袋を片方なくしました。</div></button></li><li><button class="w" data-no="414"><div class="top"><span class="no">414</span><span class="en">hear from ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～から連絡［便り］がある</div><div class="ex">I <b>heard from</b> my friend in Canada yesterday.</div><div class="xj">昨日、カナダの友だちから連絡がありました。</div></button></li><li><button class="w" data-no="415"><div class="top"><span class="no">415</span><span class="en">ingredient</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">材料</div><div class="ex">What <b>ingredients</b> do you need for curry?</div><div class="xj">カレーにはどんな材料が必要ですか。</div></button></li><li><button class="w" data-no="416"><div class="top"><span class="no">416</span><span class="en">picnic</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ピクニック</div><div class="ex">We are going to go on a <b>picnic</b> this Sunday.</div><div class="xj">私たちは今度の日曜日にピクニックに行く予定です。</div></button></li><li><button class="w" data-no="417"><div class="top"><span class="no">417</span><span class="en">slow</span><span class="ps">形</span></div><div class="ja">遅い；ゆっくりした</div><div class="ex">This old computer is very <b>slow</b>.</div><div class="xj">この古いコンピューターはとても遅いです。</div></button></li><li><button class="w" data-no="418"><div class="top"><span class="no">418</span><span class="en">wish</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">願う；望む</div><div class="ex">We <b>wish</b> for peace in the world.</div><div class="xj">私たちは世界の平和を願っています。</div></button></li><li><button class="w" data-no="419"><div class="top"><span class="no">419</span><span class="en">sugar</span><span class="ps">名</span></div><div class="ja">砂糖</div><div class="ex">I don’t put <b>sugar</b> in my coffee.</div><div class="xj">私はコーヒーに砂糖を入れません。</div></button></li><li><button class="w" data-no="420"><div class="top"><span class="no">420</span><span class="en">donate</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">寄付する</div><div class="ex">We <b>donated</b> old books to the library.</div><div class="xj">私たちは古い本を図書館に寄付しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../13/">← 第13回</a><a href="../15/">第15回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><
