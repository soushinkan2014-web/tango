class="top"><span class="no">695</span><span class="en">be surprised to ～</span><span class="ps">熟</span></div><div class="ja">～して驚く</div><div class="ex">I <b>was surprised to</b> hear the news.</div><div class="xj">私はその知らせを聞いて驚きました。</div></button></li><li><button class="w" data-no="696"><div class="top"><span class="no">696</span><span class="en">role</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">役割</div><div class="ex">Water plays an important <b>role</b> in our lives.</div><div class="xj">水は私たちの生活で大切な役割をはたします。</div></button></li><li><button class="w" data-no="697"><div class="top"><span class="no">697</span><span class="en">professional</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">プロの；専門的な</div><div class="ex">Ken wants to be a <b>professional</b> soccer player.</div><div class="xj">ケンはプロのサッカー選手になりたいと思っています。</div></button></li><li><button class="w" data-no="698"><div class="top"><span class="no">698</span><span class="en">be glad to ～</span><span class="ps">熟</span></div><div class="ja">喜んで～する；～してうれしい</div><div class="ex">I will <b>be glad to</b> help you.</div><div class="xj">私は喜んであなたを手伝います。</div></button></li><li><button class="w" data-no="699"><div class="top"><span class="no">699</span><span class="en">repeat</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～をくり返す</div><div class="ex">Please <b>repeat</b> these words after me.</div><div class="xj">私のあとについて、これらの単語をくり返してください。</div></button></li><li><button class="w" data-no="700"><div class="top"><span class="no">700</span><span class="en">discover</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">発見する</div><div class="ex">Who <b>discovered</b> this island?</div><div class="xj">だれがこの島を発見しましたか。</div></button></li><li><button class="w" data-no="701"><div class="top"><span class="no">701</span><span class="en">fee</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">料金</div><div class="ex">The <b>fee</b> for this museum is five hundred yen.</div><div class="xj">この博物館の料金は500円です。</div></button></li><li><button class="w" data-no="702"><div class="top"><span class="no">702</span><span class="en">at that time</span><span class="ps">熟</span></div><div class="ja">そのとき；当時</div><div class="ex">My father lived in Osaka <b>at that time</b>.</div><div class="xj">父はそのとき大阪に住んでいました。</div></button></li><li><button class="w" data-no="703"><div class="top"><span class="no">703</span><span class="en">record</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を録音する；～を記録する</div><div class="ex">I <b>recorded</b> my speech on my smartphone.</div><div class="xj">私はスマートフォンで自分のスピーチを録音しました。</div></button></li><li><button class="w" data-no="704"><div class="top"><span class="no">704</span><span class="en">cafeteria</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">カフェテリア；（セルフサービスの）食堂</div><div class="ex">We eat lunch in the school <b>cafeteria</b>.</div><div class="xj">私たちは学校のカフェテリアで昼食を食べます。</div></button></li><li><button class="w" data-no="705"><div class="top"><span class="no">705</span><span class="en">hear about ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～について聞く</div><div class="ex">Did you <b>hear about</b> the new teacher?</div><div class="xj">新しい先生について聞きましたか。</div></button></li><li><button class="w" data-no="706"><div class="top"><span class="no">706</span><span class="en">factory</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">工場</div><div class="ex">These cars are made in this <b>factory</b>.</div><div class="xj">これらの車はこの工場で作られています。</div></button></li><li><button class="w" data-no="707"><div class="top"><span class="no">707</span><span class="en">recently</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">最近</div><div class="ex"><b>Recently</b>, I started to run in the morning.</div><div class="xj">最近、私は朝に走り始めました。</div></button></li><li><button class="w" data-no="708"><div class="top"><span class="no">708</span><span class="en">Shall we ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">（いっしょに）～しましょうか</div><div class="ex"><b>Shall we</b> eat lunch under that tree?</div><div class="xj">あの木の下で昼食を食べましょうか。</div></button></li><li><button class="w" data-no="709"><div class="top"><span class="no">709</span><span class="en">remind</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～に思い出させる</div><div class="ex">This song <b>reminds</b> me of my summer in Okinawa.</div><div class="xj">この歌は私に沖縄での夏を思い出させます。</div></button></li><li><button class="w" data-no="710"><div class="top"><span class="no">710</span><span class="en">burn</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">燃える；～を焦がす</div><div class="ex">Paper <b>burns</b> easily.</div><div class="xj">紙は簡単に燃えます。</div></button></li><li><button class="w" data-no="711"><div class="top"><span class="no">711</span><span class="en">dolphin</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">イルカ</div><div class="ex"><b>Dolphins</b> are not fish.</div><div class="xj">イルカは魚ではありません。</div></button></li><li><button class="w" data-no="712"><div class="top"><span class="no">712</span><span class="en">think of ～</span><span class="ps">熟</span></div><div class="ja">～のことを考える；～を思いつく</div><div class="ex">I often <b>think of</b> my friends in Canada.</div><div class="xj">私はよくカナダの友だちのことを考えます。</div></button></li><li><button class="w" data-no="713"><div class="top"><span class="no">713</span><span class="en">device</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">装置；機器</div><div class="ex">A smartphone is a very useful <b>device</b>.</div><div class="xj">スマートフォンはとても役に立つ機器です。</div></button></li><li><button class="w" data-no="714"><div class="top"><span class="no">714</span><span class="en">pair</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">1組；1対</div><div class="ex">I bought a <b>pair</b> of gloves for the winter.</div><div class="xj">私は冬のために手袋を1組買いました。</div></button></li><li><button class="w" data-no="715"><div class="top"><span class="no">715</span><span class="en">be born</span><span class="ps">熟</span></div><div class="ja">生まれる</div><div class="ex">Tom <b>was born</b> in Canada.</div><div class="xj">トムはカナダで生まれました。</div></button></li><li><button class="w" data-no="716"><div class="top"><span class="no">716</span><span class="en">cheer</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を応援する；～を元気づける</div><div class="ex">We <b>cheered</b> for our team at the stadium.</div><div class="xj">私たちはスタジアムで自分たちのチームを応援しました。</div></button></li><li><button class="w" data-no="717"><div class="top"><span class="no">717</span><span class="en">snack</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">軽食；おやつ</div><div class="ex">I ate a <b>snack</b> after school.</div><div class="xj">私は放課後に軽食を食べました。</div></button></li><li><button class="w" data-no="718"><div class="top"><span class="no">718</span><span class="en">most of ～</span><span class="ps">熟</span></div><div class="ja">～のほとんど</div><div class="ex"><b>Most of</b> my friends live near the school.</div><div class="xj">私の友だちのほとんどは学校の近くに住んでいます。</div></button></li><li><button class="w" data-no="719"><div class="top"><span class="no">719</span><span class="en">flyer</span><span class="ps">名</span></div><div class="ja">チラシ</div><div class="ex">We made <b>flyers</b> for the school festival.</div><div class="xj">私たちは文化祭のチラシを作りました。</div></button></li><li><button class="w" data-no="720"><div class="top"><span class="no">720</span><span class="en">neighbor</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">近所の人</div><div class="ex">Our <b>neighbor</b> gave us some apples.</div><div class="xj">近所の人が私たちにリンゴをくれました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../23/">← 第23回</a><a href="../25/">第25回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"691": 4.76, "692": 17.86, "693": 31.59, "694": 44.66, "695": 58.03, "696": 71.92, "697": 85.24, "698": 99.49, "699": 114.12, "700": 127.51, "701": 139.84, "702": 153.26, "703": 167.58, "704": 183.13, "705": 198.48, "706": 211.56, "707": 224.42, "708": 237.59, "709": 251.22, "710": 265.66, "711": 279.12, "712": 291.41, "713": 306.96, "714": 320.8, "715": 333.73, "716": 346.21, "717": 361.56, "718": 374.93, "719": 388.34, "720": 401.32}, "TE": {"691": 6.64, "692": 19.93, "693": 33.46, "694": 46.63, "695": 60.19, "696": 73.79, "697": 87.2, "698": 101.43, "699": 116.0, "700": 129.38, "701": 141.72, "702": 155.3, "703": 169.45, "704": 185.24, "705": 200.38, "706": 213.43, "707": 226.29, "708": 239.46, "709": 253.09, "710": 267.54, "711": 281.0, "712": 293.28, "713": 308.85, "714": 322.46, "715": 335.6, "716": 348.08, "717": 363.46, "718": 376.8, "719": 390.21, "720": 403.19}, "Q": [[691, "運転手", "driver"], [692, "…と同じくらい～（3語で）", "as as ..."], [693, "ショッピングモール", "mall"], [694, "魅力的な", "attractive"], [695, "～して驚く（3語で）", "be surprised to"], [696, "役割", "role"], [697, "プロの", "professional"], [698, "喜んで～する（3語で）", "be glad to"], [699, "～をくり返す", "repeat"], [700, "発見する", "discover"], [701, "料金", "fee"], [702, "そのとき（3語で）", "at that time"], [703, "～を録音する", "record"], [704, "カフェテリア", "cafeteria"], [705, "～について聞く（2語で）", "hear about"], [706, "工場", "factory"], [707, "最近", "recently"], [708, "（いっしょに）～しましょうか（3語で）", "Shall we ?"], [709, "～に思い出させる", "remind"], [710, "燃える", "burn"], [711, "イルカ", "dolphin"], [712, "～のことを考える（2語で）", "think of"], [713, "装置", "device"], [714, "1組", "pair"], [715, "生まれる（2語で）", "be born"], [716, "～を応援する", "cheer"], [717, "軽食", "snack"], [718, "～のほとんど（2語で）", "most of"],
