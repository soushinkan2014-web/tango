</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第11回</h1><div class="sub">No.301〜330</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../11.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="301"><div class="top"><span class="no">301</span><span class="en">electricity</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">電気</div><div class="ex">We use a lot of <b>electricity</b> in summer.</div><div class="xj">私たちは夏にたくさんの電気を使います。</div></button></li><li><button class="w" data-no="302"><div class="top"><span class="no">302</span><span class="en">meter</span><span class="ps">名</span></div><div class="ja">メートル</div><div class="ex">This pool is fifty <b>meters</b> long.</div><div class="xj">このプールは長さ50メートルです。</div></button></li><li><button class="w" data-no="303"><div class="top"><span class="no">303</span><span class="en">tool</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">道具</div><div class="ex">A computer is a useful <b>tool</b>.</div><div class="xj">コンピューターは便利な道具です。</div></button></li><li><button class="w" data-no="304"><div class="top"><span class="no">304</span><span class="en">up</span><span class="ps">副</span></div><div class="ja">起きて（いる）；目が覚めて</div><div class="ex">I was <b>up</b> late last night.</div><div class="xj">昨夜は遅くまで起きていました。</div></button></li><li><button class="w" data-no="305"><div class="top"><span class="no">305</span><span class="en">blossom</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（果樹の）花</div><div class="ex">The apple <b>blossoms</b> are white.</div><div class="xj">りんごの花は白いです。</div></button></li><li><button class="w" data-no="306"><div class="top"><span class="no">306</span><span class="en">friendship</span><span class="ps">名</span></div><div class="ja">友情</div><div class="ex">Our <b>friendship</b> is very important to me.</div><div class="xj">私たちの友情は私にとってとても大切です。</div></button></li><li><button class="w" data-no="307"><div class="top"><span class="no">307</span><span class="en">in fact</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">実は；実際に</div><div class="ex"><b>In fact</b>, I can’t swim.</div><div class="xj">実は、私は泳げません。</div></button></li><li><button class="w" data-no="308"><div class="top"><span class="no">308</span><span class="en">caught</span><span class="ps">動</span></div><div class="ja">捕まえた（catch の過去形）</div><div class="ex">I <b>caught</b> a big fish in the river.</div><div class="xj">私は川で大きな魚を捕まえました。</div></button></li><li><button class="w" data-no="309"><div class="top"><span class="no">309</span><span class="en">clean</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">きれいな；清潔な</div><div class="ex">The water in this river is very <b>clean</b>.</div><div class="xj">この川の水はとてもきれいです。</div></button></li><li><button class="w" data-no="310"><div class="top"><span class="no">310</span><span class="en">cover</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">おおう；かぶせる</div><div class="ex">Snow <b>covered</b> the town last night.</div><div class="xj">昨夜、雪が町をおおいました。</div></button></li><li><button class="w" data-no="311"><div class="top"><span class="no">311</span><span class="en">fire</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">火；火事</div><div class="ex">Be careful with <b>fire</b> in the kitchen.</div><div class="xj">台所では火に気をつけて。</div></button></li><li><button class="w" data-no="312"><div class="top"><span class="no">312</span><span class="en">earthquake</span><span class="ps">名</span><span class="ek">英2</span></div><div class="ja">地震</div><div class="ex">Japan has many <b>earthquakes</b>.</div><div class="xj">日本は地震が多いです。</div></button></li><li><button class="w" data-no="313"><div class="top"><span class="no">313</span><span class="en">engineer</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">技術者；エンジニア</div><div class="ex">My mother works as an <b>engineer</b>.</div><div class="xj">母は技術者として働いています。</div></button></li><li><button class="w" data-no="314"><div class="top"><span class="no">314</span><span class="en">hiking</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ハイキング</div><div class="ex">My father loves <b>hiking</b>.</div><div class="xj">父はハイキングが大好きです。</div></button></li><li><button class="w" data-no="315"><div class="top"><span class="no">315</span><span class="en">over</span><span class="ps">前</span></div><div class="ja">～を超えて；～以上</div><div class="ex">My grandfather is <b>over</b> eighty.</div><div class="xj">祖父は80歳を超えています。</div></button></li><li><button class="w" data-no="316"><div class="top"><span class="no">316</span><span class="en">material</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">材料；素材</div><div class="ex">Wood is a good <b>material</b> for desks.</div><div class="xj">木は机のよい材料です。</div></button></li><li><button class="w" data-no="317"><div class="top"><span class="no">317</span><span class="en">potato</span><span class="ps">名</span></div><div class="ja">ジャガイモ</div><div class="ex">My grandfather grows <b>potatoes</b> in his garden.</div><div class="xj">祖父は畑でジャガイモを育てています。</div></button></li><li><button class="w" data-no="318"><div class="top"><span class="no">318</span><span class="en">a long time ago</span><span class="ps">熟</span></div><div class="ja">昔；ずっと前に</div><div class="ex"><b>A long time ago</b>, there was a small village.</div><div class="xj">昔、小さな村がありました。</div></button></li><li><button class="w" data-no="319"><div class="top"><span class="no">319</span><span class="en">damage</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">被害；損害</div><div class="ex">There was a lot of <b>damage</b> after the typhoon.</div><div class="xj">台風のあと、たくさんの被害がありました。</div></button></li><li><button class="w" data-no="320"><div class="top"><span class="no">320</span><span class="en">left</span><span class="ps">動</span></div><div class="ja">出発した；去った（leave の過去形）</div><div class="ex">The bus <b>left</b> at eight.</div><div class="xj">バスは8時に出発しました。</div></button></li><li><button class="w" data-no="321"><div class="top"><span class="no">321</span><span class="en">goods</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">商品；品物</div><div class="ex">This store sells sports <b>goods</b>.</div><div class="xj">この店はスポーツ用品を売っています。</div></button></li><li><button class="w" data-no="322"><div class="top"><span class="no">322</span><span class="en">overseas</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">海外へ；海外で</div><div class="ex">My sister wants to travel <b>overseas</b>.</div><div class="xj">姉は海外へ旅行したがっています。</div></button></li><li><button class="w" data-no="323"><div class="top"><span class="no">323</span><span class="en">cafe</span><span class="ps">名</span></div><div class="ja">カフェ；喫茶店</div><div class="ex">Let’s have lunch at that <b>cafe</b>.</div><div class="xj">あのカフェで昼ごはんを食べましょう。</div></button></li><li><button class="w" data-no="324"><div class="top"><span class="no">324</span><span class="en">chicken</span><span class="ps">名</span></div><div class="ja">とり肉；ニワトリ</div><div class="ex">We had <b>chicken</b> curry for dinner.</div><div class="xj">私たちは夕食にとり肉のカレーを食べました。</div></button></li><li><button class="w" data-no="325"><div class="top"><span class="no">325</span><span class="en">drop</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">落とす；落ちる</div><div class="ex">I <b>dropped</b> my phone on the floor.</div><div class="xj">私は床に電話を落としました。</div></button></li><li><button class="w" data-no="326"><div class="top"><span class="no">326</span><span class="en">point</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">要点；ポイント</div><div class="ex">This is an important <b>point</b>.</div><div class="xj">これは大切なポイントです。</div></button></li><li><button class="w" data-no="327"><div class="top"><span class="no">327</span><span class="en">either</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">（否定文で）～もまた（…ない）</div><div class="ex">I don’t like natto, <b>either</b>.</div><div class="xj">私も納豆が好きではありません。</div></button></li><li><button class="w" data-no="328"><div class="top"><span class="no">328</span><span class="en">exercise</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">運動；練習（問題）</div><div class="ex"><b>Exercise</b> is good for your health.</div><div class="xj">運動は健康によいです。</div></button></li><li><button class="w" data-no="329"><div class="top"><span class="no">329</span><span class="en">flower shop</span><span class="ps">熟</span></div><div class="ja">花屋</div><div class="ex">I bought roses at the <b>flower shop</b> for Mother’s Day.</div><div class="xj">私は母の日のために花屋でバラを買いました。</div></button></li><li><button class="w" data-no="330"><div class="top"><span class="no">330</span><span class="en">safely</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">安全に；無事に</div><div class="ex">Please ride your bike <b>safely</b>.</div><div class="xj">自転車には安全に乗ってね。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../10/">← 第10回</a><a href="../12/">第12回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"301": 4.5
