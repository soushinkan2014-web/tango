</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第26回</h1><div class="sub">No.751〜780</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../26.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="751"><div class="top"><span class="no">751</span><span class="en">go on</span><span class="ps">熟</span></div><div class="ja">続く；続ける</div><div class="ex">The rain <b>went on</b> all day.</div><div class="xj">雨は一日中続きました。</div></button></li><li><button class="w" data-no="752"><div class="top"><span class="no">752</span><span class="en">hero</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">英雄；ヒーロー</div><div class="ex">Ken was the <b>hero</b> of the game.</div><div class="xj">ケンは試合の英雄でした。</div></button></li><li><button class="w" data-no="753"><div class="top"><span class="no">753</span><span class="en">peaceful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">平和な；おだやかな</div><div class="ex">I want to live in a <b>peaceful</b> world.</div><div class="xj">私は平和な世界に住みたいです。</div></button></li><li><button class="w" data-no="754"><div class="top"><span class="no">754</span><span class="en">look around ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を見て回る</div><div class="ex">Let’s <b>look around</b> the old town.</div><div class="xj">古い町を見て回りましょう。</div></button></li><li><button class="w" data-no="755"><div class="top"><span class="no">755</span><span class="en">promise</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">約束</div><div class="ex">I will keep my <b>promise</b>.</div><div class="xj">私は約束を守ります。</div></button></li><li><button class="w" data-no="756"><div class="top"><span class="no">756</span><span class="en">ring</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（ベル・電話が）鳴る</div><div class="ex">The school bell <b>rings</b> at eight thirty.</div><div class="xj">学校のベルは8時30分に鳴ります。</div></button></li><li><button class="w" data-no="757"><div class="top"><span class="no">757</span><span class="en">pick up ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を拾う；～を車で迎えに行く</div><div class="ex">Tom <b>picked up</b> the pen on the floor.</div><div class="xj">トムは床の上のペンを拾いました。</div></button></li><li><button class="w" data-no="758"><div class="top"><span class="no">758</span><span class="en">surfing</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">サーフィン</div><div class="ex">Tom goes <b>surfing</b> every summer.</div><div class="xj">トムは毎年夏にサーフィンに行きます。</div></button></li><li><button class="w" data-no="759"><div class="top"><span class="no">759</span><span class="en">pilot</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">パイロット</div><div class="ex">My cousin is a <b>pilot</b>.</div><div class="xj">私のいとこはパイロットです。</div></button></li><li><button class="w" data-no="760"><div class="top"><span class="no">760</span><span class="en">let me see</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">ええと；そうですね</div><div class="ex">A: What time is it?<br>B: <b>Let me see</b>. It’s ten.</div><div class="xj">A：何時ですか。B：ええと。10時です。</div></button></li><li><button class="w" data-no="761"><div class="top"><span class="no">761</span><span class="en">sung</span><span class="ps">動</span></div><div class="ja">（sing の過去分詞）歌われる</div><div class="ex">This song is <b>sung</b> in many countries.</div><div class="xj">この歌は多くの国で歌われています。</div></button></li><li><button class="w" data-no="762"><div class="top"><span class="no">762</span><span class="en">twentieth</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">20番目の；20回目の</div><div class="ex">Today is my sister’s <b>twentieth</b> birthday.</div><div class="xj">今日は私の姉の20回目の誕生日です。</div></button></li><li><button class="w" data-no="763"><div class="top"><span class="no">763</span><span class="en">mission</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">任務；使命</div><div class="ex">The team’s <b>mission</b> was to find the lost dog.</div><div class="xj">そのチームの任務は迷子の犬を見つけることでした。</div></button></li><li><button class="w" data-no="764"><div class="top"><span class="no">764</span><span class="en">more and more</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">ますます</div><div class="ex"><b>More and more</b> people are visiting this town.</div><div class="xj">ますます多くの人がこの町を訪れています。</div></button></li><li><button class="w" data-no="765"><div class="top"><span class="no">765</span><span class="en">apron</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">エプロン</div><div class="ex">Put on your <b>apron</b> before cooking.</div><div class="xj">料理をする前にエプロンをつけなさい。</div></button></li><li><button class="w" data-no="766"><div class="top"><span class="no">766</span><span class="en">atomic</span><span class="ps">形</span></div><div class="ja">原子の；原子力の</div><div class="ex">Some countries use <b>atomic</b> energy.</div><div class="xj">いくつかの国は原子力を使っています。</div></button></li><li><button class="w" data-no="767"><div class="top"><span class="no">767</span><span class="en">on one’s way</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">途中で</div><div class="ex">I met Ken <b>on my way</b> to school.</div><div class="xj">私は学校へ行く途中でケンに会いました。</div></button></li><li><button class="w" data-no="768"><div class="top"><span class="no">768</span><span class="en">bathroom</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">浴室；ふろ場；トイレ</div><div class="ex">Our <b>bathroom</b> is very small.</div><div class="xj">うちのふろ場はとても小さいです。</div></button></li><li><button class="w" data-no="769"><div class="top"><span class="no">769</span><span class="en">beyond</span><span class="ps">前</span><span class="ek">準2</span></div><div class="ja">～の向こうに；～を越えて</div><div class="ex">There is a small town <b>beyond</b> the river.</div><div class="xj">川の向こうに小さな町があります。</div></button></li><li><button class="w" data-no="770"><div class="top"><span class="no">770</span><span class="en">spend time with ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～と時間をすごす</div><div class="ex">I <b>spend time with</b> my grandmother on Sundays.</div><div class="xj">私は日曜日に祖母と時間をすごします。</div></button></li><li><button class="w" data-no="771"><div class="top"><span class="no">771</span><span class="en">bat</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">バット</div><div class="ex">Ken hit the ball with a new <b>bat</b>.</div><div class="xj">ケンは新しいバットでボールを打ちました。</div></button></li><li><button class="w" data-no="772"><div class="top"><span class="no">772</span><span class="en">lovely</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">すてきな；かわいらしい</div><div class="ex">You have a <b>lovely</b> garden.</div><div class="xj">すてきなお庭ですね。</div></button></li><li><button class="w" data-no="773"><div class="top"><span class="no">773</span><span class="en">be made from ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～から作られる</div><div class="ex">Butter <b>is made from</b> milk.</div><div class="xj">バターは牛乳から作られます。</div></button></li><li><button class="w" data-no="774"><div class="top"><span class="no">774</span><span class="en">nap</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">昼寝；うたた寝</div><div class="ex">My grandfather takes a <b>nap</b> after lunch.</div><div class="xj">祖父は昼食のあとに昼寝をします。</div></button></li><li><button class="w" data-no="775"><div class="top"><span class="no">775</span><span class="en">neither</span><span class="ps">副</span><span class="ek">準2</span></div><div class="ja">（否定の文に続けて）～もまた…ない</div><div class="ex">A: I don’t like math.<br>B: Me <b>neither</b>.</div><div class="xj">A：私は数学が好きではありません。B：私も好きではありません。</div></button></li><li><button class="w" data-no="776"><div class="top"><span class="no">776</span><span class="en">sank</span><span class="ps">動</span></div><div class="ja">沈んだ（sink の過去形）</div><div class="ex">My toy boat <b>sank</b> in the bath.</div><div class="xj">私のおもちゃの船がお風呂で沈みました。</div></button></li><li><button class="w" data-no="777"><div class="top"><span class="no">777</span><span class="en">get on ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">（乗り物に）乗る</div><div class="ex">Let’s <b>get on</b> the next bus.</div><div class="xj">次のバスに乗りましょう。</div></button></li><li><button class="w" data-no="778"><div class="top"><span class="no">778</span><span class="en">scarf</span><span class="ps">名</span></div><div class="ja">マフラー；スカーフ</div><div class="ex">My grandmother made this <b>scarf</b> for me.</div><div class="xj">祖母が私にこのマフラーを作ってくれました。</div></button></li><li><button class="w" data-no="779"><div class="top"><span class="no">779</span><span class="en">sink</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">沈む</div><div class="ex">Stones <b>sink</b> in water.</div><div class="xj">石は水の中で沈みます。</div></button></li><li><button class="w" data-no="780"><div class="top"><span class="no">780</span><span class="en">take off ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を脱ぐ</div><div class="ex">Please <b>take off</b> your shoes here.</div><div class="xj">ここでくつを脱いでください。</div></button></li></ol></div><div id="quiz"><p
