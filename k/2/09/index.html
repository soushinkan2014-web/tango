</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第9回</h1><div class="sub">No.241〜270</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../09.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="241"><div class="top"><span class="no">241</span><span class="en">himself</span><span class="ps">代</span></div><div class="ja">彼自身</div><div class="ex">Tom looked at <b>himself</b> in the mirror.</div><div class="xj">トムは鏡で自分自身を見ました。</div></button></li><li><button class="w" data-no="242"><div class="top"><span class="no">242</span><span class="en">leaf</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">葉</div><div class="ex">I found a big <b>leaf</b> in the park.</div><div class="xj">私は公園で大きな葉を見つけました。</div></button></li><li><button class="w" data-no="243"><div class="top"><span class="no">243</span><span class="en">give up ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～をあきらめる；やめる</div><div class="ex">Don’t <b>give up</b> your dream.</div><div class="xj">夢をあきらめないで。</div></button></li><li><button class="w" data-no="244"><div class="top"><span class="no">244</span><span class="en">meet</span><span class="ps">動</span></div><div class="ja">出迎える；（初めて）知り合う</div><div class="ex">I will <b>meet</b> my aunt at the airport.</div><div class="xj">私は空港でおばを出迎えます。</div></button></li><li><button class="w" data-no="245"><div class="top"><span class="no">245</span><span class="en">mind</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">心；考え</div><div class="ex">Music is good for your body and <b>mind</b>.</div><div class="xj">音楽は体と心によいです。</div></button></li><li><button class="w" data-no="246"><div class="top"><span class="no">246</span><span class="en">cry</span><span class="ps">動</span></div><div class="ja">泣く</div><div class="ex">The baby <b>cried</b> all night.</div><div class="xj">その赤ちゃんは一晩中泣きました。</div></button></li><li><button class="w" data-no="247"><div class="top"><span class="no">247</span><span class="en">die</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">死ぬ；枯れる</div><div class="ex">My goldfish <b>died</b> last summer.</div><div class="xj">私の金魚は去年の夏に死にました。</div></button></li><li><button class="w" data-no="248"><div class="top"><span class="no">248</span><span class="en">forest</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">森</div><div class="ex">Many animals live in this <b>forest</b>.</div><div class="xj">この森には多くの動物がすんでいます。</div></button></li><li><button class="w" data-no="249"><div class="top"><span class="no">249</span><span class="en">farm</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">農場</div><div class="ex">My grandfather has a large <b>farm</b> in Hokkaido.</div><div class="xj">祖父は北海道に大きな農場を持っています。</div></button></li><li><button class="w" data-no="250"><div class="top"><span class="no">250</span><span class="en">experience</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">経験する；体験する</div><div class="ex">We <b>experienced</b> farm work last summer.</div><div class="xj">私たちは去年の夏、農作業を体験しました。</div></button></li><li><button class="w" data-no="251"><div class="top"><span class="no">251</span><span class="en">gift</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">贈り物</div><div class="ex">This book was a <b>gift</b> from my aunt.</div><div class="xj">この本はおばからの贈り物でした。</div></button></li><li><button class="w" data-no="252"><div class="top"><span class="no">252</span><span class="en">India</span><span class="ps">名</span></div><div class="ja">インド</div><div class="ex"><b>India</b> is a big country in Asia.</div><div class="xj">インドはアジアの大きな国です。</div></button></li><li><button class="w" data-no="253"><div class="top"><span class="no">253</span><span class="en">recommend</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">すすめる</div><div class="ex">I <b>recommend</b> this book to you.</div><div class="xj">私はあなたにこの本をすすめます。</div></button></li><li><button class="w" data-no="254"><div class="top"><span class="no">254</span><span class="en">school trip</span><span class="ps">熟</span></div><div class="ja">修学旅行</div><div class="ex">We will go to Tokyo on our <b>school trip</b>.</div><div class="xj">私たちは修学旅行で東京に行きます。</div></button></li><li><button class="w" data-no="255"><div class="top"><span class="no">255</span><span class="en">big</span><span class="ps">形</span><span class="ek">英5</span></div><div class="ja">大の；重大な</div><div class="ex">Ken is a <b>big</b> fan of baseball.</div><div class="xj">ケンは野球の大ファンです。</div></button></li><li><button class="w" data-no="256"><div class="top"><span class="no">256</span><span class="en">worker</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">働く人；労働者</div><div class="ex">The <b>workers</b> at this factory are very kind.</div><div class="xj">この工場で働く人たちはとても親切です。</div></button></li><li><button class="w" data-no="257"><div class="top"><span class="no">257</span><span class="en">customer</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">客；顧客</div><div class="ex">The shop was full of <b>customers</b> on Sunday.</div><div class="xj">日曜日、その店は客でいっぱいでした。</div></button></li><li><button class="w" data-no="258"><div class="top"><span class="no">258</span><span class="en">national</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">国の；国立の；全国の</div><div class="ex">We visited a <b>national</b> park in Hokkaido.</div><div class="xj">私たちは北海道の国立公園を訪れました。</div></button></li><li><button class="w" data-no="259"><div class="top"><span class="no">259</span><span class="en">writer</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">作家；書く人</div><div class="ex">Emi wants to be a <b>writer</b> in the future.</div><div class="xj">エミは将来作家になりたいと思っています。</div></button></li><li><button class="w" data-no="260"><div class="top"><span class="no">260</span><span class="en">answer</span><span class="ps">名</span></div><div class="ja">答え；返事</div><div class="ex">Do you know the <b>answer</b> to this question?</div><div class="xj">あなたはこの問題の答えを知っていますか。</div></button></li><li><button class="w" data-no="261"><div class="top"><span class="no">261</span><span class="en">list</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">一覧表；リスト</div><div class="ex">I made a shopping <b>list</b> for the party.</div><div class="xj">私はパーティーのための買い物リストを作りました。</div></button></li><li><button class="w" data-no="262"><div class="top"><span class="no">262</span><span class="en">recycle</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">リサイクルする；再利用する</div><div class="ex">We <b>recycle</b> cans and bottles at school.</div><div class="xj">私たちは学校で缶やびんをリサイクルしています。</div></button></li><li><button class="w" data-no="263"><div class="top"><span class="no">263</span><span class="en">sign</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">標識；看板；合図</div><div class="ex">Look at that <b>sign</b> by the road.</div><div class="xj">道のそばのあの標識を見て。</div></button></li><li><button class="w" data-no="264"><div class="top"><span class="no">264</span><span class="en">themselves</span><span class="ps">代</span></div><div class="ja">彼ら自身；それら自身</div><div class="ex">The children made the cake by <b>themselves</b>.</div><div class="xj">子どもたちは自分たちだけでケーキを作りました。</div></button></li><li><button class="w" data-no="265"><div class="top"><span class="no">265</span><span class="en">department store</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">デパート；百貨店</div><div class="ex">There are many shops in the <b>department store</b>.</div><div class="xj">そのデパートにはたくさんの店があります。</div></button></li><li><button class="w" data-no="266"><div class="top"><span class="no">266</span><span class="en">sound</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～に聞こえる；～のようだ</div><div class="ex">A: Let’s have a party.<br>B: That <b>sounds</b> like a good idea.</div><div class="xj">A：パーティーをしよう。B：それはいい考えのようだね。</div></button></li><li><button class="w" data-no="267"><div class="top"><span class="no">267</span><span class="en">pet</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ペット</div><div class="ex">Do you have any <b>pets</b> at home?</div><div class="xj">あなたは家でペットを飼っていますか。</div></button></li><li><button class="w" data-no="268"><div class="top"><span class="no">268</span><span class="en">project</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">計画；研究課題；プロジェクト</div><div class="ex">We are working on a class <b>project</b>.</div><div class="xj">私たちはクラスのプロジェクトに取り組んでいます。</div></button></li><li><button class="w" data-no="269"><div class="top"><span class="no">269</span><span class="en">village</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">村</div><div class="ex">My grandparents live in a small <b>village</b>.</div><div class="xj">祖父母は小さな村に住んでいます。</div></button></li><li><button class="w" data-no="270"><div class="top"><span class="no">270</span><span class="en">here’s</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">ここに～がある（here is の短縮形）</div><div class="ex"><b>Here’s</b> a picture of my family.</div><div class="xj">ここに私の家族の写真があります。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../08/">← 第8回</a><a href="../10/">第10回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"241": 4.31, "242": 17.34, "243": 30.43, "244": 44.07, "245": 58.44, "246": 72.34, "247": 85.14, "248": 98.45, "249": 111.67, "250": 125.58, "251": 140.17, "252": 153.34, "253": 166.86, "254": 179.59, "255": 193.26, "256": 206.91, "257": 221.57, "258": 235.5, "259": 249.66, "260": 263.52, "261": 276.91, "262": 290.79, "263": 305.91, "264": 319.44, "265": 333.98, "266": 348.38, "267": 365.84, "268": 378.4, "269": 392.69, "270": 406.23}, "TE": {"241": 6.37, "242": 19.4, "243": 32.49, "244": 46.13, "245": 60.51, "246": 74.41, "247": 87.21, "248": 100.51, "249": 113.73, "250": 127.72, "251": 142.24, "252": 155.41, "253": 168.92, "254": 181.66, "255": 195.33, "256": 208.98, "257": 223.63, "258": 237.57, "259": 251.72, "260": 265.59, "261": 278.97, "262": 292.85, "263": 307.98, "264": 321.5, "265": 336.14, "266": 350.44, "267": 367.91, "268": 380.46, "269": 394.75, "270": 408.29}, "Q": [[241, "彼自身", "himself"], [242, "葉", "leaf"], [243, "～をあきらめる（2語で）", "give up"], [244, "出迎える", "meet"], [245, "心", "mind"], [246, "泣く", "cry"], [247, "死ぬ", "die"], [248, "森", "forest"], [249, "農場", "farm"], [250, "経験する", "experience"], [251, "贈り物", "gift"], [252, "インド", "India"], [253, "すすめる", "recommend"], [254, "修学旅行（2語で）", "school trip"], [255, "大の", "big"], [256, "働く人", "worker"], [257, "客", "customer"], [258, "国の", "national"], [259, "作家", "writer"], [260, "答え", "answer"], [261, "一覧表", "list"], [262, "リサイクルする", "recycle"], [263, "標識", "sign"], [264, "彼ら自身", "themselves"], [265, "デパート（2語で）", "department store"], [266, "～に聞こえる", "sound"], [267, "ペット", "pet"], [268, "計画", "project"], [269, "村", "village"], [270, "ここに～がある（here is の短縮形）", "here’s"]], "KEY": "k2-9"};</script><script src="../../../app.js?v=2"></script></body></html>
