</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第25回</h1><div class="sub">No.721〜750</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../25.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="721"><div class="top"><span class="no">721</span><span class="en">introduce ～ to ...</span><span class="ps">熟</span></div><div class="ja">～を…に紹介する</div><div class="ex">I <b>introduced Emi to</b> my parents.</div><div class="xj">私はエミを両親に紹介しました。</div></button></li><li><button class="w" data-no="722"><div class="top"><span class="no">722</span><span class="en">astronaut</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">宇宙飛行士</div><div class="ex">My dream is to be an <b>astronaut</b>.</div><div class="xj">私の夢は宇宙飛行士になることです。</div></button></li><li><button class="w" data-no="723"><div class="top"><span class="no">723</span><span class="en">mix</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">混ぜる</div><div class="ex"><b>Mix</b> the eggs and sugar in a bowl.</div><div class="xj">ボウルの中で卵と砂糖を混ぜてください。</div></button></li><li><button class="w" data-no="724"><div class="top"><span class="no">724</span><span class="en">middle</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">真ん中</div><div class="ex">There is a big tree in the <b>middle</b> of the park.</div><div class="xj">公園の真ん中に大きな木があります。</div></button></li><li><button class="w" data-no="725"><div class="top"><span class="no">725</span><span class="en">stay with ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～の家に泊まる</div><div class="ex">I <b>stayed with</b> my uncle in Hokkaido last summer.</div><div class="xj">私は去年の夏、北海道のおじの家に泊まりました。</div></button></li><li><button class="w" data-no="726"><div class="top"><span class="no">726</span><span class="en">score</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">得点；点数</div><div class="ex">What was the <b>score</b> of the game?</div><div class="xj">試合の得点はどうでしたか。</div></button></li><li><button class="w" data-no="727"><div class="top"><span class="no">727</span><span class="en">decorate</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を飾る</div><div class="ex">We <b>decorated</b> the classroom with flowers.</div><div class="xj">私たちは花で教室を飾りました。</div></button></li><li><button class="w" data-no="728"><div class="top"><span class="no">728</span><span class="en">at the end of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～の終わりに</div><div class="ex">We clean the classroom <b>at the end of</b> the day.</div><div class="xj">私たちは一日の終わりに教室をそうじします。</div></button></li><li><button class="w" data-no="729"><div class="top"><span class="no">729</span><span class="en">drawn</span><span class="ps">動</span></div><div class="ja">描かれた（draw の過去分詞）</div><div class="ex">This picture was <b>drawn</b> by my sister.</div><div class="xj">この絵は姉によって描かれました。</div></button></li><li><button class="w" data-no="730"><div class="top"><span class="no">730</span><span class="en">act</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">行動する；演じる</div><div class="ex">We must <b>act</b> now.</div><div class="xj">私たちは今すぐ行動しなければなりません。</div></button></li><li><button class="w" data-no="731"><div class="top"><span class="no">731</span><span class="en">in this way</span><span class="ps">熟</span><span class="ek">準2+</span></div><div class="ja">このようにして</div><div class="ex">Please hold the racket <b>in this way</b>.</div><div class="xj">ラケットはこのようにして持ってください。</div></button></li><li><button class="w" data-no="732"><div class="top"><span class="no">732</span><span class="en">final</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">最後の；決勝の</div><div class="ex">December is the <b>final</b> month of the year.</div><div class="xj">12月は一年の最後の月です。</div></button></li><li><button class="w" data-no="733"><div class="top"><span class="no">733</span><span class="en">surprise</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">驚き；思いがけないこと</div><div class="ex">The news was a big <b>surprise</b> to us.</div><div class="xj">その知らせは私たちには大きな驚きでした。</div></button></li><li><button class="w" data-no="734"><div class="top"><span class="no">734</span><span class="en">make a speech</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">スピーチをする</div><div class="ex">Emi <b>made a speech</b> in English at the festival.</div><div class="xj">エミは祭りで英語のスピーチをしました。</div></button></li><li><button class="w" data-no="735"><div class="top"><span class="no">735</span><span class="en">focus</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">集中する</div><div class="ex">I can’t <b>focus</b> on my homework today.</div><div class="xj">私は今日、宿題に集中できません。</div></button></li><li><button class="w" data-no="736"><div class="top"><span class="no">736</span><span class="en">gold</span><span class="ps">名</span></div><div class="ja">金；金色</div><div class="ex">This ring is made of <b>gold</b>.</div><div class="xj">この指輪は金でできています。</div></button></li><li><button class="w" data-no="737"><div class="top"><span class="no">737</span><span class="en">hole</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">穴</div><div class="ex">There is a <b>hole</b> in my shirt.</div><div class="xj">私のシャツに穴があいています。</div></button></li><li><button class="w" data-no="738"><div class="top"><span class="no">738</span><span class="en">be afraid of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～をこわがる</div><div class="ex">My little sister <b>is afraid of</b> big dogs.</div><div class="xj">私の妹は大きな犬をこわがります。</div></button></li><li><button class="w" data-no="739"><div class="top"><span class="no">739</span><span class="en">blow</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（風が）吹く；～を吹く</div><div class="ex">A cold wind is <b>blowing</b> today.</div><div class="xj">今日は冷たい風が吹いています。</div></button></li><li><button class="w" data-no="740"><div class="top"><span class="no">740</span><span class="en">cross</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を渡る；～を横切る</div><div class="ex">We <b>crossed</b> the river by boat.</div><div class="xj">私たちはボートで川を渡りました。</div></button></li><li><button class="w" data-no="741"><div class="top"><span class="no">741</span><span class="en">far from ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～から遠い</div><div class="ex">Our school is not <b>far from</b> the sea.</div><div class="xj">私たちの学校は海から遠くありません。</div></button></li><li><button class="w" data-no="742"><div class="top"><span class="no">742</span><span class="en">electric</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">電気の；電動の</div><div class="ex">My father has an <b>electric</b> car.</div><div class="xj">私の父は電気自動車を持っています。</div></button></li><li><button class="w" data-no="743"><div class="top"><span class="no">743</span><span class="en">fiction</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">小説；作り話</div><div class="ex">I like reading <b>fiction</b> better than comics.</div><div class="xj">私は漫画より小説を読むほうが好きです。</div></button></li><li><button class="w" data-no="744"><div class="top"><span class="no">744</span><span class="en">get off ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">（乗り物から）降りる</div><div class="ex">We <b>got off</b> the train at Kobe.</div><div class="xj">私たちは神戸で電車を降りました。</div></button></li><li><button class="w" data-no="745"><div class="top"><span class="no">745</span><span class="en">wave</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（手など）を振る</div><div class="ex">Emi <b>waved</b> her hand at me.</div><div class="xj">エミは私に手を振りました。</div></button></li><li><button class="w" data-no="746"><div class="top"><span class="no">746</span><span class="en">correct</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">正しい</div><div class="ex">Your answer is <b>correct</b>.</div><div class="xj">あなたの答えは正しいです。</div></button></li><li><button class="w" data-no="747"><div class="top"><span class="no">747</span><span class="en">That’s too bad.</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">それは残念ですね</div><div class="ex">A: I can’t go to the party.<br>B: <b>That’s too bad.</b></div><div class="xj">A：私はパーティーに行けません。B：それは残念ですね。</div></button></li><li><button class="w" data-no="748"><div class="top"><span class="no">748</span><span class="en">count</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～を数える</div><div class="ex">Please <b>count</b> the students on the bus.</div><div class="xj">バスに乗っている生徒を数えてください。</div></button></li><li><button class="w" data-no="749"><div class="top"><span class="no">749</span><span class="en">direction</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">方向；（directions で）道順</div><div class="ex">Which <b>direction</b> is the station?</div><div class="xj">駅はどちらの方向ですか。</div></button></li><li><button class="w" data-no="750"><div class="top"><span class="no">750</span><span class="en">success</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">成功</div><div class="ex">The school festival was a big <b>success</b>.</div><div class="xj">文化祭は大成功でした。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../24/">← 第24回</a><a href="../26/">第26回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"721": 4.67, "722": 19.06, "723": 32.38, "724": 45.73, "725": 59.19, "726": 73.74, "727": 86.94, "728": 100.92, "729": 114.73, "730": 129.24, "731": 142.23, "732": 155.32, "733": 169.31, "734": 183.94, "735": 197.92, "736": 211.32, "737": 224.55, "738": 237.35, "739": 251.77, "740": 266.09, "741": 280.86, "742": 294.67, "743": 308.38, "744": 323.12, "745": 336.48, "746": 349.33, "747": 361.93, "748": 377.84, "749": 391.41, "750": 405.81}, "TE": {"721": 6.73, "722": 21.12, "723": 34.44, "724": 47.79, "725": 61.25, "726": 75.8, "727": 89.01, "728": 102.98, "729": 116.79, "730": 131.3, "731": 144.29, "732": 157.39, "733": 171.38, "734": 186.05, "735": 199.98, "736": 213.38, "737": 226.61, "738": 239.51, "739": 253.84, "740": 268.15, "741": 282.92, "742": 296.73, "743": 310.44, "744": 325.18, "745": 338.55, "746": 351.39, "747": 364.07, "748": 379.9, "749": 393.47, "750": 407.87}, "Q": [[721, "～を…に紹介する（3語で）", "introduce to ..."], [722, "宇宙飛行士", "astronaut"], [723, "混ぜる", "mix"], [724, "真ん中", "middle"], [725, "～の家に泊まる（2語で）", "stay with"], [726, "得点", "score"], [727, "～を飾る", "decorate"], [728, "～の終わりに（4語で）", "at the end of"], [729, "描かれた（draw の過去分詞）", "drawn"], [730, "行動する", "act"], [731, "このようにして（3語で）", "in this way"], [732, "最後の", "final"], [733, "驚き", "surprise"], [734, "スピーチをする（3語で）", "make a speech"], [735, "集中する", "focus"], [736, "金", "gold"], [737, "穴", "hole"], [738, "～をこわがる（3語で）", "be afraid of"], [739, "（風が）吹く", "blow"], [740, "～を渡る", "cross"], [741, "～から遠い（2語で）", "far from"], [742, "電気の", "electric"], [743, "小説", "fiction"], [744, "（乗り物から）降りる（2語で）", "get off"], [745, "（手など）を振る", "wave"], [746, "正しい", "correct"], [747, "それは残念
