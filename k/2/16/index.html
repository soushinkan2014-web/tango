</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第16回</h1><div class="sub">No.451〜480</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../16.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="451"><div class="top"><span class="no">451</span><span class="en">thin</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">薄い；やせた</div><div class="ex">This paper is very <b>thin</b>.</div><div class="xj">この紙はとても薄いです。</div></button></li><li><button class="w" data-no="452"><div class="top"><span class="no">452</span><span class="en">dead</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">死んだ；枯れた</div><div class="ex">We found a <b>dead</b> bee near the window.</div><div class="xj">私たちは窓の近くで死んだハチを見つけました。</div></button></li><li><button class="w" data-no="453"><div class="top"><span class="no">453</span><span class="en">empty</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">空の；からっぽの</div><div class="ex">The classroom was <b>empty</b> after school.</div><div class="xj">放課後、教室はからっぽでした。</div></button></li><li><button class="w" data-no="454"><div class="top"><span class="no">454</span><span class="en">gram</span><span class="ps">名</span></div><div class="ja">グラム</div><div class="ex">Use one hundred <b>grams</b> of butter.</div><div class="xj">バターを100グラム使ってください。</div></button></li><li><button class="w" data-no="455"><div class="top"><span class="no">455</span><span class="en">ink</span><span class="ps">名</span></div><div class="ja">インク</div><div class="ex">I need black <b>ink</b>.</div><div class="xj">私は黒いインクが必要です。</div></button></li><li><button class="w" data-no="456"><div class="top"><span class="no">456</span><span class="en">cut</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">切り傷；切れ目</div><div class="ex">I have a small <b>cut</b> on my finger.</div><div class="xj">私は指に小さな切り傷があります。</div></button></li><li><button class="w" data-no="457"><div class="top"><span class="no">457</span><span class="en">go hiking</span><span class="ps">熟</span></div><div class="ja">ハイキングに行く</div><div class="ex">Let’s <b>go hiking</b> this weekend.</div><div class="xj">今週末、ハイキングに行きましょう。</div></button></li><li><button class="w" data-no="458"><div class="top"><span class="no">458</span><span class="en">nearby</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">近くの</div><div class="ex">We had lunch at a <b>nearby</b> restaurant.</div><div class="xj">私たちは近くのレストランで昼食を食べました。</div></button></li><li><button class="w" data-no="459"><div class="top"><span class="no">459</span><span class="en">peach</span><span class="ps">名</span></div><div class="ja">モモ</div><div class="ex">This <b>peach</b> is very sweet.</div><div class="xj">このモモはとても甘いです。</div></button></li><li><button class="w" data-no="460"><div class="top"><span class="no">460</span><span class="en">souvenir</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">（旅の）おみやげ；記念品</div><div class="ex">I bought a <b>souvenir</b> for my sister in Kyoto.</div><div class="xj">私は京都で妹におみやげを買いました。</div></button></li><li><button class="w" data-no="461"><div class="top"><span class="no">461</span><span class="en">touch</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">連絡；接触</div><div class="ex">I am in <b>touch</b> with my friend in Canada.</div><div class="xj">私はカナダの友だちと連絡を取り合っています。</div></button></li><li><button class="w" data-no="462"><div class="top"><span class="no">462</span><span class="en">surf</span><span class="ps">動</span></div><div class="ja">サーフィンをする</div><div class="ex">Tom often <b>surfs</b> in the sea.</div><div class="xj">トムはよく海でサーフィンをします。</div></button></li><li><button class="w" data-no="463"><div class="top"><span class="no">463</span><span class="en">bee</span><span class="ps">名</span></div><div class="ja">ミツバチ；ハチ</div><div class="ex">Many <b>bees</b> are flying around the flowers.</div><div class="xj">たくさんのミツバチが花のまわりを飛んでいます。</div></button></li><li><button class="w" data-no="464"><div class="top"><span class="no">464</span><span class="en">kid</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">子ども</div><div class="ex">This game is for <b>kids</b>.</div><div class="xj">このゲームは子ども向けです。</div></button></li><li><button class="w" data-no="465"><div class="top"><span class="no">465</span><span class="en">secret</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">秘密</div><div class="ex">Can you keep a <b>secret</b>?</div><div class="xj">あなたは秘密を守れますか。</div></button></li><li><button class="w" data-no="466"><div class="top"><span class="no">466</span><span class="en">nursery school</span><span class="ps">熟</span></div><div class="ja">保育園</div><div class="ex">My little brother goes to <b>nursery school</b>.</div><div class="xj">弟は保育園に通っています。</div></button></li><li><button class="w" data-no="467"><div class="top"><span class="no">467</span><span class="en">top</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">いちばん上の；最高の</div><div class="ex">Put the book on the <b>top</b> shelf.</div><div class="xj">その本をいちばん上のたなに置いて。</div></button></li><li><button class="w" data-no="468"><div class="top"><span class="no">468</span><span class="en">square</span><span class="ps">形</span></div><div class="ja">四角い；正方形の</div><div class="ex">My lunch box is <b>square</b>.</div><div class="xj">私の弁当箱は四角いです。</div></button></li><li><button class="w" data-no="469"><div class="top"><span class="no">469</span><span class="en">wisdom</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">知恵</div><div class="ex">My grandfather has a lot of <b>wisdom</b>.</div><div class="xj">私の祖父はたくさんの知恵を持っています。</div></button></li><li><button class="w" data-no="470"><div class="top"><span class="no">470</span><span class="en">coin</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">硬貨；コイン</div><div class="ex">I found a <b>coin</b> under the desk.</div><div class="xj">私は机の下で硬貨を見つけました。</div></button></li><li><button class="w" data-no="471"><div class="top"><span class="no">471</span><span class="en">eighteenth</span><span class="ps">数</span></div><div class="ja">18番目（の）；（日付の）18日</div><div class="ex">My birthday is May <b>eighteenth</b>.</div><div class="xj">私の誕生日は5月18日です。</div></button></li><li><button class="w" data-no="472"><div class="top"><span class="no">472</span><span class="en">full</span><span class="ps">形</span><span class="ek">英4</span></div><div class="ja">いっぱいの；満員の</div><div class="ex">This bottle is <b>full</b> of water.</div><div class="xj">このびんは水でいっぱいです。</div></button></li><li><button class="w" data-no="473"><div class="top"><span class="no">473</span><span class="en">eleventh</span><span class="ps">数</span></div><div class="ja">11番目（の）；（日付の）11日</div><div class="ex">Our school festival was on October <b>eleventh</b>.</div><div class="xj">私たちの文化祭は10月11日でした。</div></button></li><li><button class="w" data-no="474"><div class="top"><span class="no">474</span><span class="en">fourteenth</span><span class="ps">数</span></div><div class="ja">14番目（の）；（日付の）14日</div><div class="ex">Valentine’s Day is February <b>fourteenth</b>.</div><div class="xj">バレンタインデーは2月14日です。</div></button></li><li><button class="w" data-no="475"><div class="top"><span class="no">475</span><span class="en">midnight</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">真夜中；午前0時</div><div class="ex">Don’t call me at <b>midnight</b>.</div><div class="xj">真夜中に電話しないで。</div></button></li><li><button class="w" data-no="476"><div class="top"><span class="no">476</span><span class="en">nineteen</span><span class="ps">数</span></div><div class="ja">19（の）</div><div class="ex"><b>Nineteen</b> students came to the party.</div><div class="xj">19人の生徒がパーティーに来ました。</div></button></li><li><button class="w" data-no="477"><div class="top"><span class="no">477</span><span class="en">cherry</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">桜（の木）</div><div class="ex">There are many <b>cherry</b> trees along the river.</div><div class="xj">川沿いにたくさんの桜の木があります。</div></button></li><li><button class="w" data-no="478"><div class="top"><span class="no">478</span><span class="en">after a while</span><span class="ps">熟</span></div><div class="ja">しばらくして</div><div class="ex"><b>After a while</b>, the rain stopped.</div><div class="xj">しばらくして、雨がやみました。</div></button></li><li><button class="w" data-no="479"><div class="top"><span class="no">479</span><span class="en">nineteenth</span><span class="ps">数</span></div><div class="ja">19番目（の）；（日付の）19日</div><div class="ex">The concert was on the <b>nineteenth</b>.</div><div class="xj">コンサートは19日でした。</div></button></li><li><button class="w" data-no="480"><div class="top"><span class="no">480</span><span class="en">noise</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">物音；騒音</div><div class="ex">There was a big <b>noise</b> outside.</div><div class="xj">外で大きな物音がしました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../15/">← 第15回</a><a href="../17/">第17回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"451": 4.57, "452": 17.66, "453": 31.06, "454": 44.96, "455": 58.08, "456": 7
