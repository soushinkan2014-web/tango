</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第18回</h1><div class="sub">No.511〜540</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../18.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="511"><div class="top"><span class="no">511</span><span class="en">decide</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">決める；決心する</div><div class="ex">I <b>decided</b> to join the art club.</div><div class="xj">私は美術部に入ることに決めました。</div></button></li><li><button class="w" data-no="512"><div class="top"><span class="no">512</span><span class="en">became</span><span class="ps">動</span></div><div class="ja">～になった（become の過去形）</div><div class="ex">Soon the sky <b>became</b> dark.</div><div class="xj">まもなく空が暗くなりました。</div></button></li><li><button class="w" data-no="513"><div class="top"><span class="no">513</span><span class="en">gave</span><span class="ps">動</span></div><div class="ja">与えた；くれた（give の過去形）</div><div class="ex">My aunt <b>gave</b> me a nice watch.</div><div class="xj">おばが私にすてきな腕時計をくれました。</div></button></li><li><button class="w" data-no="514"><div class="top"><span class="no">514</span><span class="en">send</span><span class="ps">動</span></div><div class="ja">送る</div><div class="ex">Please <b>send</b> me an e-mail.</div><div class="xj">私にメールを送ってください。</div></button></li><li><button class="w" data-no="515"><div class="top"><span class="no">515</span><span class="en">have to ～</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～する必要がある；～しなければならない</div><div class="ex">I <b>have to</b> clean my room today.</div><div class="xj">私は今日、部屋をそうじしなければなりません。</div></button></li><li><button class="w" data-no="516"><div class="top"><span class="no">516</span><span class="en">must</span><span class="ps">助</span><span class="ek">英4</span></div><div class="ja">～しなければならない；～にちがいない</div><div class="ex">We <b>must</b> be quiet in the library.</div><div class="xj">図書館では静かにしなければなりません。</div></button></li><li><button class="w" data-no="517"><div class="top"><span class="no">517</span><span class="en">taught</span><span class="ps">動</span></div><div class="ja">教えた（teach の過去形）</div><div class="ex">Mr. Sato <b>taught</b> us English last year.</div><div class="xj">佐藤先生は昨年、私たちに英語を教えてくれました。</div></button></li><li><button class="w" data-no="518"><div class="top"><span class="no">518</span><span class="en">reason</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">理由</div><div class="ex">Please tell me the <b>reason</b> for your answer.</div><div class="xj">あなたの答えの理由を教えてください。</div></button></li><li><button class="w" data-no="519"><div class="top"><span class="no">519</span><span class="en">able</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">（be able to ～で）～できる</div><div class="ex">I was <b>able</b> to finish my homework.</div><div class="xj">私は宿題を終えることができました。</div></button></li><li><button class="w" data-no="520"><div class="top"><span class="no">520</span><span class="en">shall</span><span class="ps">助</span></div><div class="ja">（Shall I ～? で）～しましょうか</div><div class="ex"><b>Shall</b> I open the window?</div><div class="xj">窓を開けましょうか。</div></button></li><li><button class="w" data-no="521"><div class="top"><span class="no">521</span><span class="en">don’t have to ～</span><span class="ps">熟</span></div><div class="ja">～しなくてもよい；～する必要はない</div><div class="ex">You <b>don’t have to</b> come tomorrow.</div><div class="xj">あなたは明日、来なくてもいいですよ。</div></button></li><li><button class="w" data-no="522"><div class="top"><span class="no">522</span><span class="en">feeling</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">気持ち；感情</div><div class="ex">I can understand your <b>feelings</b>.</div><div class="xj">私はあなたの気持ちがわかります。</div></button></li><li><button class="w" data-no="523"><div class="top"><span class="no">523</span><span class="en">nature</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">自然</div><div class="ex">Many people come here to enjoy <b>nature</b>.</div><div class="xj">多くの人が自然を楽しむためにここへ来ます。</div></button></li><li><button class="w" data-no="524"><div class="top"><span class="no">524</span><span class="en">myself</span><span class="ps">代</span></div><div class="ja">私自身</div><div class="ex">I wrote about <b>myself</b> in English.</div><div class="xj">私は英語で私自身のことを書きました。</div></button></li><li><button class="w" data-no="525"><div class="top"><span class="no">525</span><span class="en">pay</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">（お金）を払う</div><div class="ex">I <b>paid</b> five hundred yen for this book.</div><div class="xj">私はこの本に500円払いました。</div></button></li><li><button class="w" data-no="526"><div class="top"><span class="no">526</span><span class="en">be able to ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～することができる</div><div class="ex">My little sister <b>is able to</b> ride a bike.</div><div class="xj">妹は自転車に乗ることができます。</div></button></li><li><button class="w" data-no="527"><div class="top"><span class="no">527</span><span class="en">difference</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">違い</div><div class="ex">What is the <b>difference</b> between these two words?</div><div class="xj">この2つの単語の違いは何ですか。</div></button></li><li><button class="w" data-no="528"><div class="top"><span class="no">528</span><span class="en">hall</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ホール；会館</div><div class="ex">We listened to music in the concert <b>hall</b>.</div><div class="xj">私たちはコンサートホールで音楽を聞きました。</div></button></li><li><button class="w" data-no="529"><div class="top"><span class="no">529</span><span class="en">swimming</span><span class="ps">名</span></div><div class="ja">水泳</div><div class="ex"><b>Swimming</b> is good for your health.</div><div class="xj">水泳は健康によいです。</div></button></li><li><button class="w" data-no="530"><div class="top"><span class="no">530</span><span class="en">international</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">国際的な</div><div class="ex">Our town has an <b>international</b> festival every fall.</div><div class="xj">私たちの町では毎年秋に国際的な祭りがあります。</div></button></li><li><button class="w" data-no="531"><div class="top"><span class="no">531</span><span class="en">look forward to ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">～を楽しみに待つ</div><div class="ex">I’m <b>looking forward to</b> seeing you.</div><div class="xj">あなたに会えるのを楽しみにしています。</div></button></li><li><button class="w" data-no="532"><div class="top"><span class="no">532</span><span class="en">center</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">中心；センター</div><div class="ex">Our school is in the <b>center</b> of the town.</div><div class="xj">私たちの学校は町の中心にあります。</div></button></li><li><button class="w" data-no="533"><div class="top"><span class="no">533</span><span class="en">catch</span><span class="ps">動</span></div><div class="ja">捕まえる；捕る</div><div class="ex">I tried to <b>catch</b> the ball.</div><div class="xj">私はそのボールを捕ろうとしました。</div></button></li><li><button class="w" data-no="534"><div class="top"><span class="no">534</span><span class="en">article</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">記事</div><div class="ex">I read an <b>article</b> about pandas in the newspaper.</div><div class="xj">私は新聞でパンダについての記事を読みました。</div></button></li><li><button class="w" data-no="535"><div class="top"><span class="no">535</span><span class="en">visitor</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">訪問者；観光客</div><div class="ex">Our school had some <b>visitors</b> from Canada last week.</div><div class="xj">先週、私たちの学校にカナダから訪問者が来ました。</div></button></li><li><button class="w" data-no="536"><div class="top"><span class="no">536</span><span class="en">a member of ～</span><span class="ps">熟</span></div><div class="ja">～の一員</div><div class="ex">My brother is <b>a member of</b> the art club.</div><div class="xj">私の兄は美術部の一員です。</div></button></li><li><button class="w" data-no="537"><div class="top"><span class="no">537</span><span class="en">effort</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">努力</div><div class="ex">Emi made a big <b>effort</b> to win the contest.</div><div class="xj">エミはコンテストで優勝するために大いに努力しました。</div></button></li><li><button class="w" data-no="538"><div class="top"><span class="no">538</span><span class="en">sentence</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">文</div><div class="ex">Please write three <b>sentences</b> about your family.</div><div class="xj">あなたの家族について3つの文を書いてください。</div></button></li><li><button class="w" data-no="539"><div class="top"><span class="no">539</span><span class="en">field</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">野原；（運動）場</div><div class="ex">The children are running in the <b>field</b>.</div><div class="xj">子どもたちが野原を走っています。</div></button></li><li><button class="w" data-no="540"><div class="top"><span class="no">540</span><span class="en">try</span><span class="ps">動</span></div><div class="ja">（try to ～で）～しようとする；試す</div><div class="ex">Ken <b>tried</b> to answer the question.</div><div class="xj">ケンはその質問に答えようとしました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../17/">← 第17回</a><a href="../19/">第19回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"511": 4.52, "512": 18.06, "513": 32.21, "514": 46.46, "515": 58.7, "516": 74.13, "517": 89.46, "518": 103.47, "519": 116.28, "520": 130.8, "521": 145.82, "522": 160.84, "523": 174.11, "524": 187.18, "525": 200.12, "526": 213.48, "527": 227.4, "528": 240.62, "529": 254.08, "530": 266.58, "531": 280.85, "532": 294.67, "533": 308.28, "534": 320.97, "535": 334.45, "536": 349.3, "537": 362.81, "538": 376.13, "539": 389.8, "540": 403.12}, "TE": {"511": 6.4, "512": 19.93, "513": 34.08, "514": 48.34, "515": 60.57, "516": 76.0, "517": 91.33, "518": 105.34, "519": 118.16, "520": 132.67, "521": 147.72, "522": 162.71, "523": 175.98, "524": 189.06, "525": 201.99, "526": 215.35, "527": 229.29, "528": 242.49, "529": 255.95, "530": 268.64, "531": 282.89, "532": 296.54, "533": 310.15, "534": 322.84, "535": 336.32, "536": 351.27, "537": 364.68, "538": 378.17, "539": 391.68, "540": 404.99}, "Q": [[511, "決める", "decide"], [512, "～になった（become の過去形）", "became"], [513, "与えた", "gave"], [514, "送る", "send"], [515, "～する必要がある（2語で）", "have to"], [516, "～しなければならない", "must"], [517, "教えた（teach の過去形）", "taught"], [518, "理由", "reason"], [519, "～できる（3語で）", "be able to"], [520, "～しましょうか（3語で）", "Shall I ?"], [521, "～しなくてもよい（3語で）", "don’t have to"], [522, "気持ち", "feeling"], [523, "自然", "nature"], [524, "私自身", "myself"], [525, "（お金）を払う", "pay"], [526, "～することができる（3語で）", "be able to"], [527, "違い", "difference"], [528, "ホール", "hall"], [529, "水泳", "swimming"], [530, "国際的な", "international"], [531, "～を楽しみに待つ（3語で）", "look forward to"], [532, "中心", "center"], [533, "捕まえる", "catch"], [534, "記事", "article"], [535, "訪問者", "visitor"], [536, "～の一員（3語で）", "a member of"], [537, "努力", "effort"], [538, "文", "sentence"], [539, "野原", "field"], [540, "～しようとする（2語で）"
