</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第6回</h1><div class="sub">No.151〜180</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../06.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="151"><div class="top"><span class="no">151</span><span class="en">wrote</span><span class="ps">動</span></div><div class="ja">書いた（write の過去形）</div><div class="ex">I <b>wrote</b> a letter to my grandfather.</div><div class="xj">私は祖父に手紙を書きました。</div></button></li><li><button class="w" data-no="152"><div class="top"><span class="no">152</span><span class="en">which</span><span class="ps">代</span></div><div class="ja">どれ；どちら</div><div class="ex"><b>Which</b> of these books did you read?</div><div class="xj">これらの本のどれを読みましたか。</div></button></li><li><button class="w" data-no="153"><div class="top"><span class="no">153</span><span class="en">protect</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">守る；保護する</div><div class="ex">This hat <b>protects</b> your head from the sun.</div><div class="xj">このぼうしは日差しから頭を守ります。</div></button></li><li><button class="w" data-no="154"><div class="top"><span class="no">154</span><span class="en">won’t</span><span class="ps">助</span></div><div class="ja">～しないだろう（will not の短縮形）</div><div class="ex">Tom <b>won’t</b> come to school today.</div><div class="xj">トムは今日、学校に来ないでしょう。</div></button></li><li><button class="w" data-no="155"><div class="top"><span class="no">155</span><span class="en">alone</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">ひとりで</div><div class="ex">Ken traveled <b>alone</b> to Hokkaido last summer.</div><div class="xj">ケンは去年の夏、ひとりで北海道を旅行しました。</div></button></li><li><button class="w" data-no="156"><div class="top"><span class="no">156</span><span class="en">contest</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">コンテスト；競技会</div><div class="ex">I’m going to join the speech <b>contest</b>.</div><div class="xj">私はスピーチコンテストに参加するつもりです。</div></button></li><li><button class="w" data-no="157"><div class="top"><span class="no">157</span><span class="en">right</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">すぐに；ちょうど</div><div class="ex">I’ll be back <b>right</b> away.</div><div class="xj">すぐに戻ります。</div></button></li><li><button class="w" data-no="158"><div class="top"><span class="no">158</span><span class="en">lost</span><span class="ps">動</span></div><div class="ja">負けた；失った（lose の過去形）</div><div class="ex">Our team <b>lost</b> the game yesterday.</div><div class="xj">私たちのチームは昨日試合に負けました。</div></button></li><li><button class="w" data-no="159"><div class="top"><span class="no">159</span><span class="en">all over ～</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">～じゅうで；～のいたるところで</div><div class="ex">This song is popular <b>all over</b> the world.</div><div class="xj">この歌は世界じゅうで人気があります。</div></button></li><li><button class="w" data-no="160"><div class="top"><span class="no">160</span><span class="en">though</span><span class="ps">接</span><span class="ek">準2</span></div><div class="ja">～だけれども</div><div class="ex"><b>Though</b> it was raining, we played soccer.</div><div class="xj">雨が降っていたけれども、私たちはサッカーをしました。</div></button></li><li><button class="w" data-no="161"><div class="top"><span class="no">161</span><span class="en">university</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">大学</div><div class="ex">My brother studies at a <b>university</b> in Kyoto.</div><div class="xj">兄は京都の大学で勉強しています。</div></button></li><li><button class="w" data-no="162"><div class="top"><span class="no">162</span><span class="en">plant</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">植物；（動）植える</div><div class="ex">There are many <b>plants</b> in this room.</div><div class="xj">この部屋にはたくさんの植物があります。</div></button></li><li><button class="w" data-no="163"><div class="top"><span class="no">163</span><span class="en">before</span><span class="ps">接</span><span class="ek">英5</span></div><div class="ja">～する前に</div><div class="ex">Wash your hands <b>before</b> you eat lunch.</div><div class="xj">昼ごはんを食べる前に手を洗いなさい。</div></button></li><li><button class="w" data-no="164"><div class="top"><span class="no">164</span><span class="en">ticket</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">切符；チケット</div><div class="ex">I have two <b>tickets</b> for the concert.</div><div class="xj">私はコンサートのチケットを2枚持っています。</div></button></li><li><button class="w" data-no="165"><div class="top"><span class="no">165</span><span class="en">receive</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">受け取る</div><div class="ex">I <b>received</b> a letter from my aunt.</div><div class="xj">私はおばから手紙を受け取りました。</div></button></li><li><button class="w" data-no="166"><div class="top"><span class="no">166</span><span class="en">sent</span><span class="ps">動</span></div><div class="ja">送った（send の過去形・過去分詞）</div><div class="ex">I <b>sent</b> a birthday card to Lisa.</div><div class="xj">私はリサに誕生日カードを送りました。</div></button></li><li><button class="w" data-no="167"><div class="top"><span class="no">167</span><span class="en">research</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">研究；調査</div><div class="ex">Emi does <b>research</b> on robots.</div><div class="xj">エミはロボットについて研究しています。</div></button></li><li><button class="w" data-no="168"><div class="top"><span class="no">168</span><span class="en">start</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">始まり；スタート</div><div class="ex">April is the <b>start</b> of the school year.</div><div class="xj">4月は学校の1年の始まりです。</div></button></li><li><button class="w" data-no="169"><div class="top"><span class="no">169</span><span class="en">light</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">軽い；明るい</div><div class="ex">My new bag is very <b>light</b>.</div><div class="xj">私の新しいかばんはとても軽いです。</div></button></li><li><button class="w" data-no="170"><div class="top"><span class="no">170</span><span class="en">help ～ with ...</span><span class="ps">熟</span></div><div class="ja">～の…を手伝う</div><div class="ex">Can you <b>help me with</b> my homework?</div><div class="xj">私の宿題を手伝ってくれますか。</div></button></li><li><button class="w" data-no="171"><div class="top"><span class="no">171</span><span class="en">newspaper</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">新聞</div><div class="ex">My grandfather reads the <b>newspaper</b> every morning.</div><div class="xj">祖父は毎朝新聞を読みます。</div></button></li><li><button class="w" data-no="172"><div class="top"><span class="no">172</span><span class="en">it’ll</span><span class="ps">代</span></div><div class="ja">それは～だろう（it will の短縮形）</div><div class="ex"><b>It’ll</b> be hot tomorrow.</div><div class="xj">明日は暑くなるでしょう。</div></button></li><li><button class="w" data-no="173"><div class="top"><span class="no">173</span><span class="en">goal</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">目標；ゴール</div><div class="ex">What is your <b>goal</b> this year?</div><div class="xj">今年のあなたの目標は何ですか。</div></button></li><li><button class="w" data-no="174"><div class="top"><span class="no">174</span><span class="en">show</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">見せる；示す</div><div class="ex">Please <b>show</b> your ticket at the door.</div><div class="xj">入口でチケットを見せてください。</div></button></li><li><button class="w" data-no="175"><div class="top"><span class="no">175</span><span class="en">half</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">半分</div><div class="ex">I ate <b>half</b> of the pizza.</div><div class="xj">私はピザの半分を食べました。</div></button></li><li><button class="w" data-no="176"><div class="top"><span class="no">176</span><span class="en">helpful</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">役に立つ；助けになる</div><div class="ex">Your advice was very <b>helpful</b>.</div><div class="xj">あなたのアドバイスはとても役に立ちました。</div></button></li><li><button class="w" data-no="177"><div class="top"><span class="no">177</span><span class="en">tourist</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">観光客；旅行者</div><div class="ex">Many <b>tourists</b> visit Nara every year.</div><div class="xj">毎年たくさんの観光客が奈良を訪れます。</div></button></li><li><button class="w" data-no="178"><div class="top"><span class="no">178</span><span class="en">built</span><span class="ps">動</span></div><div class="ja">建てた（build の過去形・過去分詞）</div><div class="ex">My grandfather <b>built</b> this house.</div><div class="xj">祖父がこの家を建てました。</div></button></li><li><button class="w" data-no="179"><div class="top"><span class="no">179</span><span class="en">give</span><span class="ps">動</span></div><div class="ja">（スピーチなどを）する；（会などを）開く</div><div class="ex">Ms. Tanaka will <b>give</b> a speech at the festival.</div><div class="xj">田中さんは文化祭でスピーチをします。</div></button></li><li><button class="w" data-no="180"><div class="top"><span class="no">180</span><span class="en">by oneself</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">自分ひとりで</div><div class="ex">Emi made dinner <b>by herself</b>.</div><div class="xj">エミはひとりで夕食を作りました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../05/">← 第5回</a><a href="../07/">第7回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"151": 4.21, "152": 17.94, "153": 30.9, "154": 44.76, "155": 59.75, "156": 73.62, "157": 87.77, "158": 100.8, "159": 115.65, "160": 131.31, "161": 145.28, "162": 159.09, "163": 173.08, "164": 186.93, "165": 200.48, "166": 213.53, "167": 228.52, "168": 242.19, "169": 256.04, "170": 269.38, "171": 282.8, "172": 296.76, "173": 311.18, "174": 324.13, "175": 337.51, "176": 350.3, "177": 364.46, "178": 379.07, "179": 393.93, "180": 409.64}, "TE": {"151": 6.27, "152": 20.01, "153": 32.96, "154": 46.82, "155": 61.82, "156": 75.68, "157": 89.83, "158": 102.86, "159": 117.71, "160": 133.37, "161": 147.34, "162": 161.15, "163": 175.14, "164": 189.0, "165": 202.54, "166": 215.59, "167": 230.58, "168": 244.26, "169": 258.1, "170": 271.44, "171": 284.86, "172": 298.83, "173": 313.24, "174": 326.19, "175": 339.57, "176": 352.37, "177": 366.52, "178": 381.13, "179": 395.99, "180": 411.75}, "Q": [[151, "書いた（write の過去形）", "wrote"], [152, "どれ", "which"], [153, "守る", "protect"], [154, "～しないだろう（will not の短縮形）", "won’t"], [155, "ひとりで", "alone"], [156, "コンテスト", "contest"], [157, "すぐに", "right"], [158, "負けた", "lost"], [159, "～じゅうで（2語で）", "all over"], [160, "～だけれども", "though"], [161, "大学", "university"], [162, "植物", "plant"], [163, "～する前に", "before"], [164, "切符", "ticket"], [165, "受け取る", "receive"], [166, "送った（send の過去形・過去分詞）", "sent"], [167, "研究", "research"], [168, "始まり", "start"], [169, "軽い", "light"], [170, "～の…を手伝う（3語で）", "help with ..."], [171, "新聞", "newspaper"], [172, "それは～だろう（it will の短縮形）", "it’ll"], [173, "目標", "goal"], [174, "見せる", "show"], [175, "半分", "half"], [176, "役に立つ", "helpful"], [177, "観光客", "tourist"], [178, "建てた（build の過去形・過去分詞）", "built"], [179, "（スピーチなどを）する", "give"], [180, "自分ひとりで（2語で）", "by oneself"]], "KEY": "k2-6"};</script><script src="../../../app.js?v=2"
