</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第5回</h1><div class="sub">No.121〜150</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../05.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="121"><div class="top"><span class="no">121</span><span class="en">color</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">色</div><div class="ex">What <b>color</b> is your new bike?</div><div class="xj">あなたの新しい自転車は何色ですか。</div></button></li><li><button class="w" data-no="122"><div class="top"><span class="no">122</span><span class="en">local</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">地元の；その土地の</div><div class="ex">We often go to the <b>local</b> library.</div><div class="xj">私たちはよく地元の図書館に行きます。</div></button></li><li><button class="w" data-no="123"><div class="top"><span class="no">123</span><span class="en">lose</span><span class="ps">動</span></div><div class="ja">失う；なくす；負ける</div><div class="ex">Don’t <b>lose</b> the key to your house.</div><div class="xj">家のかぎをなくさないでね。</div></button></li><li><button class="w" data-no="124"><div class="top"><span class="no">124</span><span class="en">news</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">知らせ；ニュース</div><div class="ex">I have good <b>news</b> for you.</div><div class="xj">あなたによい知らせがあります。</div></button></li><li><button class="w" data-no="125"><div class="top"><span class="no">125</span><span class="en">then</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">そのとき；そのころ</div><div class="ex">A: Let’s meet at ten.<br>B: OK. See you <b>then</b>.</div><div class="xj">A：10時に会おう。B：わかった。じゃあそのときにね。</div></button></li><li><button class="w" data-no="126"><div class="top"><span class="no">126</span><span class="en">party</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">パーティー</div><div class="ex">Let’s have a <b>party</b> on Saturday.</div><div class="xj">土曜日にパーティーを開こう。</div></button></li><li><button class="w" data-no="127"><div class="top"><span class="no">127</span><span class="en">Why don’t you ～?</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">～したらどうですか</div><div class="ex"><b>Why don’t you</b> join our club?</div><div class="xj">私たちの部に入ったらどうですか。</div></button></li><li><button class="w" data-no="128"><div class="top"><span class="no">128</span><span class="en">forward</span><span class="ps">副</span></div><div class="ja">前へ</div><div class="ex">Please take one step <b>forward</b>.</div><div class="xj">1歩前へ出てください。</div></button></li><li><button class="w" data-no="129"><div class="top"><span class="no">129</span><span class="en">building</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">建物；ビル</div><div class="ex">That tall <b>building</b> is a hotel.</div><div class="xj">あの高い建物はホテルです。</div></button></li><li><button class="w" data-no="130"><div class="top"><span class="no">130</span><span class="en">other</span><span class="ps">代</span></div><div class="ja">ほかの人；ほかのもの</div><div class="ex">Be kind to <b>others</b>.</div><div class="xj">ほかの人に親切にしなさい。</div></button></li><li><button class="w" data-no="131"><div class="top"><span class="no">131</span><span class="en">sea</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">海</div><div class="ex">We swam in the <b>sea</b> last summer.</div><div class="xj">私たちは去年の夏、海で泳ぎました。</div></button></li><li><button class="w" data-no="132"><div class="top"><span class="no">132</span><span class="en">everything</span><span class="ps">代</span><span class="ek">英3</span></div><div class="ja">すべてのもの；何でも</div><div class="ex">Ken knows <b>everything</b> about trains.</div><div class="xj">ケンは電車のことなら何でも知っています。</div></button></li><li><button class="w" data-no="133"><div class="top"><span class="no">133</span><span class="en">maybe</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">たぶん；もしかすると</div><div class="ex"><b>Maybe</b> Ken is in the library.</div><div class="xj">たぶんケンは図書館にいます。</div></button></li><li><button class="w" data-no="134"><div class="top"><span class="no">134</span><span class="en">situation</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">状況；立場</div><div class="ex">The <b>situation</b> was very difficult.</div><div class="xj">状況はとても難しかったです。</div></button></li><li><button class="w" data-no="135"><div class="top"><span class="no">135</span><span class="en">program</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">番組；計画</div><div class="ex">I watched a TV <b>program</b> about animals.</div><div class="xj">私は動物についてのテレビ番組を見ました。</div></button></li><li><button class="w" data-no="136"><div class="top"><span class="no">136</span><span class="en">first</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">まず；最初に</div><div class="ex"><b>First</b>, wash your hands.</div><div class="xj">まず、手を洗いなさい。</div></button></li><li><button class="w" data-no="137"><div class="top"><span class="no">137</span><span class="en">away</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">離れて；去って</div><div class="ex">My grandmother lives far <b>away</b>.</div><div class="xj">祖母は遠く離れたところに住んでいます。</div></button></li><li><button class="w" data-no="138"><div class="top"><span class="no">138</span><span class="en">take care</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">気をつけて；元気でね</div><div class="ex">A: Goodbye, Lisa.<br>B: <b>Take care</b>, Ken.</div><div class="xj">A：さようなら、リサ。B：元気でね、ケン。</div></button></li><li><button class="w" data-no="139"><div class="top"><span class="no">139</span><span class="en">brown</span><span class="ps">形</span></div><div class="ja">茶色の</div><div class="ex">Lisa has long <b>brown</b> hair.</div><div class="xj">リサは長い茶色の髪をしています。</div></button></li><li><button class="w" data-no="140"><div class="top"><span class="no">140</span><span class="en">build</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">建てる；作る</div><div class="ex">My uncle <b>built</b> this house.</div><div class="xj">おじがこの家を建てました。</div></button></li><li><button class="w" data-no="141"><div class="top"><span class="no">141</span><span class="en">last</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">続く；長持ちする</div><div class="ex">The rain <b>lasted</b> for three days.</div><div class="xj">雨は3日間続きました。</div></button></li><li><button class="w" data-no="142"><div class="top"><span class="no">142</span><span class="en">paper</span><span class="ps">名</span></div><div class="ja">紙；新聞</div><div class="ex">I need some <b>paper</b> for art class.</div><div class="xj">美術の授業で紙が必要です。</div></button></li><li><button class="w" data-no="143"><div class="top"><span class="no">143</span><span class="en">save</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">救う；節約する；ためる</div><div class="ex">The doctor <b>saved</b> the boy’s life.</div><div class="xj">その医師は男の子の命を救いました。</div></button></li><li><button class="w" data-no="144"><div class="top"><span class="no">144</span><span class="en">worried</span><span class="ps">形</span></div><div class="ja">心配して</div><div class="ex">I’m <b>worried</b> about the test.</div><div class="xj">私はテストのことが心配です。</div></button></li><li><button class="w" data-no="145"><div class="top"><span class="no">145</span><span class="en">borrow</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">借りる</div><div class="ex">Can I <b>borrow</b> your pen?</div><div class="xj">あなたのペンを借りてもいいですか。</div></button></li><li><button class="w" data-no="146"><div class="top"><span class="no">146</span><span class="en">use</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">使い道；使用</div><div class="ex">Paper has many <b>uses</b>.</div><div class="xj">紙にはたくさんの使い道があります。</div></button></li><li><button class="w" data-no="147"><div class="top"><span class="no">147</span><span class="en">quickly</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">すばやく；急いで</div><div class="ex">Lisa finished her lunch <b>quickly</b>.</div><div class="xj">リサは昼食をすばやく食べ終えました。</div></button></li><li><button class="w" data-no="148"><div class="top"><span class="no">148</span><span class="en">by the way</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">ところで</div><div class="ex"><b>By the way</b>, where is Ken?</div><div class="xj">ところで、ケンはどこにいますか。</div></button></li><li><button class="w" data-no="149"><div class="top"><span class="no">149</span><span class="en">create</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">作り出す；創造する</div><div class="ex">Let’s <b>create</b> a new song for our club.</div><div class="xj">部のために新しい歌を作ろう。</div></button></li><li><button class="w" data-no="150"><div class="top"><span class="no">150</span><span class="en">short</span><span class="ps">形</span></div><div class="ja">短い；背が低い</div><div class="ex">My sister has <b>short</b> hair.</div><div class="xj">姉は髪が短いです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../04/">← 第4回</a><a href="../06/">第6回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"121": 4.12, "1
