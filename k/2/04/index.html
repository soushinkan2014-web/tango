</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第4回</h1><div class="sub">No.91〜120</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../04.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="91"><div class="top"><span class="no">91</span><span class="en">happen</span><span class="ps">動</span></div><div class="ja">起こる</div><div class="ex">What <b>happened</b> to your bike?</div><div class="xj">あなたの自転車に何が起こったのですか。</div></button></li><li><button class="w" data-no="92"><div class="top"><span class="no">92</span><span class="en">one</span><span class="ps">代</span></div><div class="ja">（同じ種類の）もの；1つ</div><div class="ex">I lost my pen, so I bought a new <b>one</b>.</div><div class="xj">ペンをなくしたので、新しいものを買いました。</div></button></li><li><button class="w" data-no="93"><div class="top"><span class="no">93</span><span class="en">person</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">人</div><div class="ex">Yuki is a very kind <b>person</b>.</div><div class="xj">ユキはとても親切な人です。</div></button></li><li><button class="w" data-no="94"><div class="top"><span class="no">94</span><span class="en">forget</span><span class="ps">動</span></div><div class="ja">忘れる</div><div class="ex">Don’t <b>forget</b> your umbrella.</div><div class="xj">かさを忘れないでね。</div></button></li><li><button class="w" data-no="95"><div class="top"><span class="no">95</span><span class="en">for the first time</span><span class="ps">熟</span><span class="ek">英4</span></div><div class="ja">初めて</div><div class="ex">I ate natto <b>for the first time</b> yesterday.</div><div class="xj">私は昨日初めて納豆を食べました。</div></button></li><li><button class="w" data-no="96"><div class="top"><span class="no">96</span><span class="en">already</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">すでに；もう</div><div class="ex">It is <b>already</b> dark at five in winter.</div><div class="xj">冬は5時でもう暗いです。</div></button></li><li><button class="w" data-no="97"><div class="top"><span class="no">97</span><span class="en">rain</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">雨が降る；雨</div><div class="ex">It <b>rained</b> a lot last night.</div><div class="xj">昨夜はたくさん雨が降りました。</div></button></li><li><button class="w" data-no="98"><div class="top"><span class="no">98</span><span class="en">look</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">見ること；ひと目</div><div class="ex">Can I have a <b>look</b> at your notebook?</div><div class="xj">あなたのノートを見てもいいですか。</div></button></li><li><button class="w" data-no="99"><div class="top"><span class="no">99</span><span class="en">check</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">確認する；調べる</div><div class="ex">Please <b>check</b> your answers again.</div><div class="xj">もう一度答えを確認してください。</div></button></li><li><button class="w" data-no="100"><div class="top"><span class="no">100</span><span class="en">wear</span><span class="ps">動</span></div><div class="ja">着ている；身につけている</div><div class="ex">Students <b>wear</b> uniforms at our school.</div><div class="xj">私たちの学校では生徒は制服を着ています。</div></button></li><li><button class="w" data-no="101"><div class="top"><span class="no">101</span><span class="en">message</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">伝言；メッセージ</div><div class="ex">Can I leave a <b>message</b>?</div><div class="xj">伝言をお願いできますか。</div></button></li><li><button class="w" data-no="102"><div class="top"><span class="no">102</span><span class="en">met</span><span class="ps">動</span></div><div class="ja">会った（meet の過去形・過去分詞）</div><div class="ex">I <b>met</b> Mr. Sato at the station yesterday.</div><div class="xj">私は昨日、駅で佐藤先生に会いました。</div></button></li><li><button class="w" data-no="103"><div class="top"><span class="no">103</span><span class="en">make</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">（音を）立てる；（～を）する</div><div class="ex">Don’t <b>make</b> noise in the library.</div><div class="xj">図書館で物音を立てないで。</div></button></li><li><button class="w" data-no="104"><div class="top"><span class="no">104</span><span class="en">store</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">店</div><div class="ex">Let’s buy some juice at that <b>store</b>.</div><div class="xj">あの店でジュースを買いましょう。</div></button></li><li><button class="w" data-no="105"><div class="top"><span class="no">105</span><span class="en">money</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">お金</div><div class="ex">I spent my <b>money</b> on comic books.</div><div class="xj">私はマンガ本にお金を使いました。</div></button></li><li><button class="w" data-no="106"><div class="top"><span class="no">106</span><span class="en">do one’s best</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">全力を尽くす；最善を尽くす</div><div class="ex">I’ll <b>do my best</b> in the tennis game.</div><div class="xj">私はテニスの試合で全力を尽くします。</div></button></li><li><button class="w" data-no="107"><div class="top"><span class="no">107</span><span class="en">while</span><span class="ps">接</span><span class="ek">英3</span></div><div class="ja">～する間に</div><div class="ex">I listened to music <b>while</b> I was running.</div><div class="xj">私は走っている間に音楽を聞きました。</div></button></li><li><button class="w" data-no="108"><div class="top"><span class="no">108</span><span class="en">present</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">プレゼント；贈り物</div><div class="ex">This is a <b>present</b> for you.</div><div class="xj">これはあなたへのプレゼントです。</div></button></li><li><button class="w" data-no="109"><div class="top"><span class="no">109</span><span class="en">day</span><span class="ps">名</span></div><div class="ja">昼間；日中</div><div class="ex">My father works at night and sleeps during the <b>day</b>.</div><div class="xj">父は夜に働いて、昼間に眠ります。</div></button></li><li><button class="w" data-no="110"><div class="top"><span class="no">110</span><span class="en">sell</span><span class="ps">動</span></div><div class="ja">売る</div><div class="ex">Ken <b>sold</b> his old bike to Tom.</div><div class="xj">ケンは古い自転車をトムに売りました。</div></button></li><li><button class="w" data-no="111"><div class="top"><span class="no">111</span><span class="en">we’ll</span><span class="ps">代</span></div><div class="ja">私たちは～するだろう（we will の短縮形）</div><div class="ex"><b>We’ll</b> go to the zoo next Sunday.</div><div class="xj">私たちは今度の日曜日に動物園に行きます。</div></button></li><li><button class="w" data-no="112"><div class="top"><span class="no">112</span><span class="en">continue</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">続ける；続く</div><div class="ex">Let’s <b>continue</b> our practice after lunch.</div><div class="xj">昼食のあとで練習を続けましょう。</div></button></li><li><button class="w" data-no="113"><div class="top"><span class="no">113</span><span class="en">travel</span><span class="ps">動</span><span class="ek">英4</span></div><div class="ja">旅行する</div><div class="ex">I want to <b>travel</b> around Japan someday.</div><div class="xj">いつか日本中を旅行したいです。</div></button></li><li><button class="w" data-no="114"><div class="top"><span class="no">114</span><span class="en">by</span><span class="ps">前</span></div><div class="ja">～までに</div><div class="ex">Please come back <b>by</b> five.</div><div class="xj">5時までに戻ってきてください。</div></button></li><li><button class="w" data-no="115"><div class="top"><span class="no">115</span><span class="en">mountain</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">山</div><div class="ex">There is a big <b>mountain</b> near our town.</div><div class="xj">私たちの町の近くに大きな山があります。</div></button></li><li><button class="w" data-no="116"><div class="top"><span class="no">116</span><span class="en">so ～ that ...</span><span class="ps">熟</span></div><div class="ja">とても～なので…</div><div class="ex">I was <b>so tired that</b> I went to bed early.</div><div class="xj">私はとても疲れていたので早く寝ました。</div></button></li><li><button class="w" data-no="117"><div class="top"><span class="no">117</span><span class="en">knew</span><span class="ps">動</span></div><div class="ja">知っていた（know の過去形）</div><div class="ex">I <b>knew</b> the answer.</div><div class="xj">私はその答えを知っていました。</div></button></li><li><button class="w" data-no="118"><div class="top"><span class="no">118</span><span class="en">care</span><span class="ps">名</span></div><div class="ja">世話；注意</div><div class="ex">Plants need water and <b>care</b>.</div><div class="xj">植物には水と世話が必要です。</div></button></li><li><button class="w" data-no="119"><div class="top"><span class="no">119</span><span class="en">get</span><span class="ps">動</span></div><div class="ja">着く；到着する</div><div class="ex">What time did you <b>get</b> home yesterday?</div><div class="xj">昨日は何時に家に着きましたか。</div></button></li><li><button class="w" data-no="120"><div class="top"><span class="no">120</span><span class="en">arrive</span><span class="ps">動</span></div><div class="ja">到着する；着く</div><div class="ex">Lisa <b>arrived</b> in Japan last week.</div><div class="xj">リサは先週日本に到着しました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../03/">← 第3回</a><a href="../05/">第5回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"91": 4.28, "92": 16.4, "93": 30.94, "94": 43.8, "95": 55.94, "96": 69
