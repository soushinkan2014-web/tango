</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第20回</h1><div class="sub">No.571〜600</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../20.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="571"><div class="top"><span class="no">571</span><span class="en">speaker</span><span class="ps">名</span></div><div class="ja">話す人；スピーカー</div><div class="ex">Tom’s father is a good <b>speaker</b> of Japanese.</div><div class="xj">トムのお父さんは日本語を上手に話す人です。</div></button></li><li><button class="w" data-no="572"><div class="top"><span class="no">572</span><span class="en">homestay</span><span class="ps">名</span><span class="ek">準2+</span></div><div class="ja">ホームステイ</div><div class="ex">My sister is going to do a <b>homestay</b> in Australia.</div><div class="xj">私の姉はオーストラリアでホームステイをする予定です。</div></button></li><li><button class="w" data-no="573"><div class="top"><span class="no">573</span><span class="en">total</span><span class="ps">名形</span><span class="ek">英3</span></div><div class="ja">合計；全体の</div><div class="ex">The <b>total</b> is eight hundred yen.</div><div class="xj">合計は800円です。</div></button></li><li><button class="w" data-no="574"><div class="top"><span class="no">574</span><span class="en">sightseeing</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">観光</div><div class="ex">We went <b>sightseeing</b> in Kyoto last spring.</div><div class="xj">私たちは去年の春、京都へ観光に行きました。</div></button></li><li><button class="w" data-no="575"><div class="top"><span class="no">575</span><span class="en">in the past</span><span class="ps">熟</span></div><div class="ja">過去に；昔は</div><div class="ex">There was a small school here <b>in the past</b>.</div><div class="xj">過去にここに小さな学校がありました。</div></button></li><li><button class="w" data-no="576"><div class="top"><span class="no">576</span><span class="en">beginning</span><span class="ps">名</span></div><div class="ja">初め；始まり</div><div class="ex">We had a lot of snow at the <b>beginning</b> of January.</div><div class="xj">1月の初めにたくさん雪が降りました。</div></button></li><li><button class="w" data-no="577"><div class="top"><span class="no">577</span><span class="en">global</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">地球規模の；世界的な</div><div class="ex">Plastic in the sea is a <b>global</b> problem.</div><div class="xj">海の中のプラスチックは地球規模の問題です。</div></button></li><li><button class="w" data-no="578"><div class="top"><span class="no">578</span><span class="en">AI</span><span class="ps">名</span></div><div class="ja">人工知能</div><div class="ex">Many students use <b>AI</b> to practice English.</div><div class="xj">多くの生徒が英語を練習するために人工知能を使います。</div></button></li><li><button class="w" data-no="579"><div class="top"><span class="no">579</span><span class="en">note</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">メモ；短い手紙</div><div class="ex">I left a <b>note</b> on the table for my mother.</div><div class="xj">私は母のためにテーブルの上にメモを残しました。</div></button></li><li><button class="w" data-no="580"><div class="top"><span class="no">580</span><span class="en">racket</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">ラケット</div><div class="ex">I saved money to buy a new <b>racket</b>.</div><div class="xj">私は新しいラケットを買うためにお金をためました。</div></button></li><li><button class="w" data-no="581"><div class="top"><span class="no">581</span><span class="en">a part of ～</span><span class="ps">熟</span></div><div class="ja">～の一部</div><div class="ex">Music is <b>a part of</b> my life.</div><div class="xj">音楽は私の生活の一部です。</div></button></li><li><button class="w" data-no="582"><div class="top"><span class="no">582</span><span class="en">seem</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">～のように見える；～らしい</div><div class="ex">Ken <b>seems</b> happy today.</div><div class="xj">ケンは今日、うれしそうに見えます。</div></button></li><li><button class="w" data-no="583"><div class="top"><span class="no">583</span><span class="en">herself</span><span class="ps">代</span></div><div class="ja">彼女自身</div><div class="ex">Lisa often talks about <b>herself</b>.</div><div class="xj">リサはよく彼女自身のことを話します。</div></button></li><li><button class="w" data-no="584"><div class="top"><span class="no">584</span><span class="en">service</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">サービス；（公共の）事業</div><div class="ex">This hotel has very good <b>service</b>.</div><div class="xj">このホテルはサービスがとてもよいです。</div></button></li><li><button class="w" data-no="585"><div class="top"><span class="no">585</span><span class="en">attract</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を引きつける</div><div class="ex">This summer festival <b>attracts</b> many people.</div><div class="xj">この夏祭りは多くの人を引きつけます。</div></button></li><li><button class="w" data-no="586"><div class="top"><span class="no">586</span><span class="en">make friends</span><span class="ps">熟</span></div><div class="ja">友だちになる</div><div class="ex">I want to <b>make friends</b> with Tom.</div><div class="xj">私はトムと友だちになりたいです。</div></button></li><li><button class="w" data-no="587"><div class="top"><span class="no">587</span><span class="en">island</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">島</div><div class="ex">Japan has many <b>islands</b>.</div><div class="xj">日本にはたくさんの島があります。</div></button></li><li><button class="w" data-no="588"><div class="top"><span class="no">588</span><span class="en">crowded</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">混雑した</div><div class="ex">The train was very <b>crowded</b> this morning.</div><div class="xj">今朝、電車はとても混雑していました。</div></button></li><li><button class="w" data-no="589"><div class="top"><span class="no">589</span><span class="en">compare</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">～を比べる</div><div class="ex">Let’s <b>compare</b> these two pictures.</div><div class="xj">この2枚の絵を比べましょう。</div></button></li><li><button class="w" data-no="590"><div class="top"><span class="no">590</span><span class="en">public</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">公共の；公立の</div><div class="ex">We can use this <b>public</b> park for free.</div><div class="xj">私たちはこの公共の公園を無料で使えます。</div></button></li><li><button class="w" data-no="591"><div class="top"><span class="no">591</span><span class="en">go abroad</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">外国へ行く</div><div class="ex">My sister wants to <b>go abroad</b> to study art.</div><div class="xj">私の姉は美術を勉強するために外国へ行きたいと思っています。</div></button></li><li><button class="w" data-no="592"><div class="top"><span class="no">592</span><span class="en">site</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">（ウェブ）サイト；場所</div><div class="ex">I found the train schedule on this <b>site</b>.</div><div class="xj">私はこのサイトで電車の時刻表を見つけました。</div></button></li><li><button class="w" data-no="593"><div class="top"><span class="no">593</span><span class="en">drama</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">ドラマ；劇</div><div class="ex">My mother watches a TV <b>drama</b> every night.</div><div class="xj">私の母は毎晩テレビドラマを見ます。</div></button></li><li><button class="w" data-no="594"><div class="top"><span class="no">594</span><span class="en">instrument</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">楽器；道具</div><div class="ex">My sister plays three <b>instruments</b>.</div><div class="xj">私の姉は3つの楽器を演奏します。</div></button></li><li><button class="w" data-no="595"><div class="top"><span class="no">595</span><span class="en">sense</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">感覚；意味</div><div class="ex">Dogs have a good <b>sense</b> of smell.</div><div class="xj">犬はにおいの感覚がすぐれています。</div></button></li><li><button class="w" data-no="596"><div class="top"><span class="no">596</span><span class="en">take action</span><span class="ps">熟</span><span class="ek">準2</span></div><div class="ja">行動を起こす</div><div class="ex">We need to <b>take action</b> to protect the sea.</div><div class="xj">私たちは海を守るために行動を起こす必要があります。</div></button></li><li><button class="w" data-no="597"><div class="top"><span class="no">597</span><span class="en">traffic</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">交通（量）</div><div class="ex">There is a lot of <b>traffic</b> on this road.</div><div class="xj">この道路は交通量が多いです。</div></button></li><li><button class="w" data-no="598"><div class="top"><span class="no">598</span><span class="en">depend</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">頼る；～しだいである</div><div class="ex">Small children <b>depend</b> on their parents.</div><div class="xj">小さな子どもたちは親に頼ります。</div></button></li><li><button class="w" data-no="599"><div class="top"><span class="no">599</span><span class="en">owner</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">持ち主；店主</div><div class="ex">Who is the <b>owner</b> of this bike?</div><div class="xj">この自転車の持ち主はだれですか。</div></button></li><li><button class="w" data-no="600"><div class="top"><span class="no">600</span><span class="en">enough</span><span class="ps">副</span><span class="ek">英3</span></div><div class="ja">（～するのに）十分に</div><div class="ex">The water was warm <b>enough</b> to swim in.</div><div class="xj">水は泳ぐのに十分温かかったです。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../19/">← 第19回</a><a href="../21/">第21回 →</a></nav></main><footer>創心館オリジナル 中学英単語帳</footer><script>window.DATA = {"T": {"571": 4.43, "572": 19.04, "573": 32.69, "574": 45.96, "575": 59.37, "576": 73.26, "577": 87.32, "578": 101.55, "579": 115.42, "580": 129.07, "581": 142.05, "582": 155.13, "583": 169.33, "584": 182.38, "585": 196.95, "586": 210.77, "587": 223.82, "588": 236.49, "589": 249.47, "590": 262.71, "591": 276.44, "592": 290.16, "593": 303.84, "594": 317.8, "595": 331.02, "596": 344.26, "597": 357.89, "598": 370.85, "599": 385.17, "600": 398.3}, "TE": {"571": 6.3, "572": 20.91, "573": 34.56, "574": 47.9, "575": 61.44, "576": 75.14, "577": 89.2, "578": 103.42, "579": 117.29, "580": 130.94, "581": 143.97, "582": 157.0, "583": 171.2, "584": 184.35, "585": 198.84, "586": 212.81, "587": 225.69, "588": 238.36, "589": 251.34, "590": 264.58, "591": 278.4, "592": 292.03, "593": 305.71, "594": 319.67, "595": 332.92, "596": 346.26, "597": 359.76, "598": 372.72, "599": 387.04, "600": 400.17}, "Q": [[571, "話す人", "speaker"], [572, "ホームステイ", "homestay"], [573, "合計", "total"], [574, "観光", "sightseeing"], [575, "過去に（3語で）", "in the past"], [576, "初め", "beginning"], [577, "地球規模の", "global"], [578, "人工知能", "AI"], [579, "メモ", "note"], [580, "ラケット", "racket"], [581, "～の一部（3語で）", "a part of"], [582, "～のように見える", "seem"], [583, "彼女自身", "herself"], [584, "サービス", "service"], [585, "～を引きつける", "attract"], [586, "友だちになる（2語で）", "make friends"], [587, "島", "island"], [588, "混雑した", "crowded"], [589, "～を比べる", "compare"], [590, "公共の", "public"], [591, "外国へ行く（2語で）", "go abroad"], [592, "（ウェブ）サイト", "site"], [593, "ドラマ", "drama"], [594, "楽器", "instrument"], [595, "感覚", "sense"], [596, "行動を起こす（2語で）", "take action"], [597, "交通（量）", "traffic"], [598, "頼る", "depend"], [599, "持ち主", "owner"], [6
