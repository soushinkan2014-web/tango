</style></head><body><header><div class="brand">創心館　英単語の音声</div><h1>レベル2　第13回</h1><div class="sub">No.361〜390</div></header><main><div class="tabs"><button class="btn on" id="tabL">音声で覚える</button><button class="btn" id="tabQ">ひとりテスト</button></div><p class="last" id="lastq"></p><div class="player"><audio id="a" controls preload="metadata" src="../13.mp3"></audio><div class="row2"><button class="btn sp" data-r="0.8">ゆっくり</button><button class="btn sp on" data-r="1">ふつう</button><button class="btn sp" data-r="1.2">はやい</button></div></div><div id="learn"><div class="row2"><button class="btn" id="hide">意味をかくす</button></div><p class="hint">単語をタップすると、その単語から音声が流れます。英語 → 意味 → 英語 → 例文 の順に読みます。</p><ol class="words"><li><button class="w" data-no="361"><div class="top"><span class="no">361</span><span class="en">Good job.</span><span class="ps">熟</span></div><div class="ja">よくやったね</div><div class="ex">A: I finished my homework.<br>B: <b>Good job.</b></div><div class="xj">A：宿題が終わったよ。B：よくやったね。</div></button></li><li><button class="w" data-no="362"><div class="top"><span class="no">362</span><span class="en">bored</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">退屈した；うんざりした</div><div class="ex">I was <b>bored</b> during the long movie.</div><div class="xj">長い映画の間、私は退屈しました。</div></button></li><li><button class="w" data-no="363"><div class="top"><span class="no">363</span><span class="en">cloth</span><span class="ps">名</span></div><div class="ja">布</div><div class="ex">Mom made a bag from this <b>cloth</b>.</div><div class="xj">母はこの布でかばんを作りました。</div></button></li><li><button class="w" data-no="364"><div class="top"><span class="no">364</span><span class="en">run</span><span class="ps">動</span><span class="ek">英5</span></div><div class="ja">流れる；走る</div><div class="ex">The river <b>runs</b> through our town.</div><div class="xj">その川は私たちの町を流れています。</div></button></li><li><button class="w" data-no="365"><div class="top"><span class="no">365</span><span class="en">fell</span><span class="ps">動</span></div><div class="ja">落ちた；倒れた（fall の過去形）</div><div class="ex">An apple <b>fell</b> from the tree.</div><div class="xj">木からりんごが落ちました。</div></button></li><li><button class="w" data-no="366"><div class="top"><span class="no">366</span><span class="en">lonely</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">さびしい；孤独な</div><div class="ex">My grandmother lives alone, but she isn’t <b>lonely</b>.</div><div class="xj">祖母は一人暮らしですが、さびしくはありません。</div></button></li><li><button class="w" data-no="367"><div class="top"><span class="no">367</span><span class="en">athlete</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">運動選手；アスリート</div><div class="ex">Ken wants to be a great <b>athlete</b>.</div><div class="xj">ケンはすばらしい運動選手になりたいと思っています。</div></button></li><li><button class="w" data-no="368"><div class="top"><span class="no">368</span><span class="en">dirty</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">汚い；汚れた</div><div class="ex">Wash your <b>dirty</b> hands before lunch.</div><div class="xj">昼食の前に汚れた手を洗いなさい。</div></button></li><li><button class="w" data-no="369"><div class="top"><span class="no">369</span><span class="en">outside</span><span class="ps">前</span><span class="ek">英4</span></div><div class="ja">～の外に；～の外で</div><div class="ex">There is a bike <b>outside</b> the house.</div><div class="xj">家の外に自転車があります。</div></button></li><li><button class="w" data-no="370"><div class="top"><span class="no">370</span><span class="en">ear</span><span class="ps">名</span></div><div class="ja">耳</div><div class="ex">Rabbits have long <b>ears</b>.</div><div class="xj">ウサギは耳が長いです。</div></button></li><li><button class="w" data-no="371"><div class="top"><span class="no">371</span><span class="en">a piece of ～</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">1枚の～；1切れの～</div><div class="ex">Can I have <b>a piece of</b> paper?</div><div class="xj">紙を1枚もらえますか。</div></button></li><li><button class="w" data-no="372"><div class="top"><span class="no">372</span><span class="en">eco-friendly</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">環境にやさしい</div><div class="ex">Let’s use <b>eco-friendly</b> bags.</div><div class="xj">環境にやさしい袋を使いましょう。</div></button></li><li><button class="w" data-no="373"><div class="top"><span class="no">373</span><span class="en">fold</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">折る；たたむ</div><div class="ex"><b>Fold</b> the paper in half.</div><div class="xj">その紙を半分に折りなさい。</div></button></li><li><button class="w" data-no="374"><div class="top"><span class="no">374</span><span class="en">cold</span><span class="ps">名</span><span class="ek">英5</span></div><div class="ja">かぜ</div><div class="ex">My brother has a bad <b>cold</b>.</div><div class="xj">弟はひどいかぜをひいています。</div></button></li><li><button class="w" data-no="375"><div class="top"><span class="no">375</span><span class="en">heat</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">暑さ；熱</div><div class="ex">I don’t like the summer <b>heat</b>.</div><div class="xj">私は夏の暑さが好きではありません。</div></button></li><li><button class="w" data-no="376"><div class="top"><span class="no">376</span><span class="en">scared</span><span class="ps">形</span><span class="ek">英3</span></div><div class="ja">こわがって；おびえた</div><div class="ex">My little sister is <b>scared</b> of thunder.</div><div class="xj">妹は雷をこわがっています。</div></button></li><li><button class="w" data-no="377"><div class="top"><span class="no">377</span><span class="en">stone</span><span class="ps">名</span></div><div class="ja">石</div><div class="ex">There is a big <b>stone</b> in the river.</div><div class="xj">川の中に大きな石があります。</div></button></li><li><button class="w" data-no="378"><div class="top"><span class="no">378</span><span class="en">surprising</span><span class="ps">形</span></div><div class="ja">驚くべき；意外な</div><div class="ex">The news was <b>surprising</b> to everyone.</div><div class="xj">そのニュースはみんなにとって驚くべきものでした。</div></button></li><li><button class="w" data-no="379"><div class="top"><span class="no">379</span><span class="en">survive</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">生き残る；生きのびる</div><div class="ex">Plants cannot <b>survive</b> without water.</div><div class="xj">植物は水がなければ生きのびることができません。</div></button></li><li><button class="w" data-no="380"><div class="top"><span class="no">380</span><span class="en">dish</span><span class="ps">名</span><span class="ek">英4</span></div><div class="ja">皿；（the dishes で）食器</div><div class="ex">Please put the <b>dishes</b> on the table.</div><div class="xj">テーブルにお皿を並べてください。</div></button></li><li><button class="w" data-no="381"><div class="top"><span class="no">381</span><span class="en">effect</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">影響；効果</div><div class="ex">Music has a big <b>effect</b> on our feelings.</div><div class="xj">音楽は私たちの気持ちに大きな影響を与えます。</div></button></li><li><button class="w" data-no="382"><div class="top"><span class="no">382</span><span class="en">for a while</span><span class="ps">熟</span><span class="ek">英3</span></div><div class="ja">しばらく（の間）</div><div class="ex">Let’s rest here <b>for a while</b>.</div><div class="xj">ここでしばらく休みましょう。</div></button></li><li><button class="w" data-no="383"><div class="top"><span class="no">383</span><span class="en">fried</span><span class="ps">形</span></div><div class="ja">揚げた；いためた</div><div class="ex">We had <b>fried</b> fish for lunch.</div><div class="xj">私たちは昼食に揚げた魚を食べました。</div></button></li><li><button class="w" data-no="384"><div class="top"><span class="no">384</span><span class="en">fry</span><span class="ps">動</span><span class="ek">準2</span></div><div class="ja">（油で）揚げる；いためる</div><div class="ex">Let’s <b>fry</b> some potatoes.</div><div class="xj">ジャガイモを揚げましょう。</div></button></li><li><button class="w" data-no="385"><div class="top"><span class="no">385</span><span class="en">once</span><span class="ps">副</span><span class="ek">英4</span></div><div class="ja">かつて；以前</div><div class="ex">My grandfather <b>once</b> lived in Hokkaido.</div><div class="xj">祖父はかつて北海道に住んでいました。</div></button></li><li><button class="w" data-no="386"><div class="top"><span class="no">386</span><span class="en">glass</span><span class="ps">名</span></div><div class="ja">コップ；グラス；ガラス</div><div class="ex">Can I have a <b>glass</b> of water?</div><div class="xj">水をコップ1杯もらえますか。</div></button></li><li><button class="w" data-no="387"><div class="top"><span class="no">387</span><span class="en">push</span><span class="ps">動</span><span class="ek">英3</span></div><div class="ja">押す</div><div class="ex"><b>Push</b> this button, please.</div><div class="xj">このボタンを押してください。</div></button></li><li><button class="w" data-no="388"><div class="top"><span class="no">388</span><span class="en">satisfied</span><span class="ps">形</span><span class="ek">準2</span></div><div class="ja">満足した</div><div class="ex">Are you <b>satisfied</b> with your score?</div><div class="xj">あなたは自分の点数に満足していますか。</div></button></li><li><button class="w" data-no="389"><div class="top"><span class="no">389</span><span class="en">brain</span><span class="ps">名</span><span class="ek">準2</span></div><div class="ja">脳</div><div class="ex">Sleep is important for your <b>brain</b>.</div><div class="xj">睡眠はあなたの脳にとって大切です。</div></button></li><li><button class="w" data-no="390"><div class="top"><span class="no">390</span><span class="en">captain</span><span class="ps">名</span><span class="ek">英3</span></div><div class="ja">船長；機長；キャプテン</div><div class="ex">The <b>captain</b> talked to the people on the ship.</div><div class="xj">船長は船の人たちに話しかけました。</div></button></li></ol></div><div id="quiz"><p class="hint">日本語を見て、英語を書こう（紙に書いても、頭の中で思いうかべてもOK）。「答えを見る」で答えと発音が出ます。自分で○か×をつけよう。</p><div id="qbox"></div></div><nav class="pn"><a href="../12/">← 第12回</
